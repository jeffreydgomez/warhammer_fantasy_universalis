 density_ideas:0 "Density Ideas"
 density_ideas_bonus:0 "Full Density Focus"
 density_1:0 "Efficient Urban Planning"
 density_1_desc:0 "Reduces the costs and obstacles associated with developing our cities, fostering more concentrated growth and prosperity."
 density_2:0 "Innovative Governance"
 density_2_desc:0 "Promotes an environment of creativity and innovation, encouraging breakthroughs while maintaining administrative flexibility."
  density_3:0 "Symbol of Stability"
 density_3_desc:0 "Our state stands as a pillar of stability, gaining prestige and internal unity that fosters a stronger sense of national identity."
  density_4:0 "Strategic Advisory Network"
 density_4_desc:0 "Invests in a more robust pool of advisors, reducing the costs and enhancing the strategic insights available to our nation."
  density_5:0 "Reformist Momentum"
 density_5_desc:0 "Propels administrative reforms forward, ensuring our state evolves with the changing times and remains at the forefront of governance."
  density_6:0 "Financial Efficiency"
 density_6_desc:0 "Reduces financial waste in the taxation and manufacturing sectors."
  density_7:0 "Miniaturization"
 density_7_desc:0 "We can do more with less, making all construction cheaper - but particularly big projects. Significantly decrease the cost of stealing monuments."

prominence_ideas:0 "Prominence Ideas"
prominence_ideas_bonus:0 "Full Prominence Focus"
prominence_1:0 "Diplomatic Expansion"
prominence_1_desc:0 "Enhances our diplomatic outreach, increasing the number of diplomatic relations we can maintain and expanding our global influence."
prominence_2:0 "Ambassadors of Renown"
prominence_2_desc:0 "Our diplomatic envoys are famed for their skill and integrity, improving our reputation and ensuring our voice is respected on the world stage."
prominence_3:0 "Cultivated Relationships"
prominence_3_desc:0 "Improves our ability to build and maintain positive relations, solidifying alliances and promoting cooperation with our neighbors."
prominence_4:0 "Vassal Dominion"
prominence_4_desc:0 "Strengthens our control over vassal states, reducing their desire for independence and increasing their contributions to our power."
prominence_5:0 "Trade Magnates"
prominence_5_desc:0 "Empowers our merchants to dominate trade routes, steering commerce toward our markets and enhancing our economic clout."
prominence_6:0 "Espionage Expertise"
prominence_6_desc:0 "Hones our espionage capabilities, allowing us to gather intelligence and influence foreign affairs with greater effectiveness."
prominence_7:0 "Splendor of Prestige"
prominence_7_desc:0 "Our nation radiates splendor, gaining recognition and admiration from all quarters, further solidifying our place among the great powers."

intervention_ideas:0 "Intervention Ideas"
intervention_ideas_bonus:0 "Full Intervention Focus"
intervention_1:0 "Moral Supremacy"
intervention_1_desc:0 "Instills unwavering morale in our troops, allowing them to fight with greater tenacity and resilience in the face of adversity."
intervention_2:0 "Tradition Keeper"
intervention_2_desc:0 "Focuses on preserving military and naval traditions, ensuring that our forces remain seasoned and formidable over time."
intervention_3:0 "Elite Drill"
intervention_3_desc:0 "Disciplines our troops to the highest standards, making our army a well-honed force capable of superior performance on the battlefield."
intervention_4:0 "Military Schools"
intervention_4_desc:0 "Our generals are unrivalled."
intervention_5:0 "Manpower Reserves"
intervention_5_desc:0 "Ensures a steady supply of recruits for our military, allowing us to field larger armies and sustain prolonged campaigns."
intervention_6:0 "Hostile Environment Tactics"
intervention_6_desc:0 "Invests in fortifications, increasing attrition for enemies in our lands and making invasion a costly endeavor."
intervention_7:0 "Plunder and Siege"
intervention_7_desc:0 "Our forces are experts in siegecraft and looting, maximizing the benefits of successful sieges and laying waste to enemy lands."

