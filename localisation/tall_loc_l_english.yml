PEACE_tall_show_mercy:0 "Show Mercy"
tall_show_mercy_desc:0 "Show mercy to the enemy and help them rebuild. Remove any rivalry with you and improve their opinion of you. If they end the war with a positive opinion of you, they add you as a historical friend."

PEACE_tall_spread_dynasty:0 "Spread Dynasty"
tall_spread_dynasty_desc:0 "Spread your dynasty to the enemy. Depose their heir and replace their ruler with one of your dynasty, culture, and religion."

PEACE_tall_take_scientists:0 "Take Scientists"
tall_take_scientists_desc:0 "The the enemy's best and brightest. Take 25 Administrative £adm£, Diplomatic £dip£, and Military £mil£ points from them."

