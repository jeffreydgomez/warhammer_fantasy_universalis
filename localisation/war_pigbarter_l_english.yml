l_english:

pigbarter_events.1000.t:0 "The Markets at the Mouth of Ruin"
pigbarter_events.1000.d:0 "Pigbarter squats where the River Ruin crawls into the Scalded Delta, a stilted, smoky, magnificent confusion of pens, piers, counting houses, shrine-stalls, and knife-bright alleys. It is a frontier market, a smuggler's refuge, a caravan end, and a warning that civilization can survive in very ugly soil.\n\nMen, Ogres, Gnoblars, Greenskins, Cathayan caravaneers, Elven factors, and worse things all come to bargain where law is just another price. Pigs squeal beside spice bales and iron ingots. Debts are recorded in careful ledgers, settled in blood, or forgotten after the correct official has been bribed.\n\nThe Dark Lands do not reward purity. They reward useful hands, quick debts, hard walls, and the good sense to smile while hiring bodyguards. Gnoblar stevedores unload boats in the muck, pig-jousters brawl for wagers, and strix-eyed lookouts watch the roads and riverbanks for raiders, taxmen, and anything wearing too much black iron.\n\nBeyond the markets, the Chaos Dwarfs of Zharr-Naggrund look south and east with the patience of furnaces. To them, Pigbarter is not a curiosity. It is a port, a gate, and a throat through which the wealth of the east might one day be made to flow under chains.\n\nSo the Dark Lands humans survive as they always have: by trade, tribute, treachery, and the stubborn refusal to be swallowed. If Pigbarter is to endure, it must turn every bargain into leverage and every danger into another customer."
pigbarter_events.1000.a:0 "Everything has a price."

pigbarter_events.1.t:0 "Auction of the River Tolls"
pigbarter_events.1.d:0 "The right to collect River Ruin tolls has become the loudest auction in the market. Boatmen, caravan masters, pig factors, and three men who are probably smugglers all claim they alone can make the wharves orderly.\n\nOrder is not really the point. Coin is the point, followed by knives, receipts, and the right to pretend the knives are official. A patrol would look more respectable, but respectability has poor margins."
pigbarter_events.1.a:0 "Auction the toll rights."
pigbarter_events.1.b:0 "Patrol the wharves ourselves."
pigbarter_events.1.c:0 "Let the market sort it out."

pigbarter_events.2.t:0 "Gnoblar Stevedores"
pigbarter_events.2.d:0 "Gnoblar stevedore gangs have offered to unload the wharves for half the usual wage and twice the usual shouting. They are quick, numerous, and very difficult to blame after they scatter.\n\nHiring them would speed repairs and construction. Keeping stricter quotas would avoid collapsed piers, missing crates, and the legal question of whether a Gnoblar can sign a receipt. The merchants want speed, then accountability, then speed again."
pigbarter_events.2.a:0 "Hire the Gnoblar gangs."
pigbarter_events.2.b:0 "Keep the quotas strict."

pigbarter_events.3.t:0 "Strix Roosts Above the Market"
pigbarter_events.3.d:0 "Falconers want funds to expand the strix roosts above the roofs and river shacks. The great night birds see raiders, tax collectors, and suspiciously organized fires long before watchmen do.\n\nTheir handlers are expensive and secretive. Selling warning signals to merchants could recover coin, while night patrols would give the system teeth. Ignoring the request would save money until the next alarm comes too late.\n\nIn Pigbarter, a warning is just another commodity with wings. The clever buy it before smoke rises."
pigbarter_events.3.a:0 "Fund the roosts."
pigbarter_events.3.b:0 "Sell warning signals."
pigbarter_events.3.c:0 "Pair them with night patrols."
pigbarter_events.3.dd:0 "Ignore the omens."

pigbarter_events.4.t:0 "Factors of Black Iron"
pigbarter_events.4.d:0 "Chaos Dwarf factors have appeared in the market with stamped tablets, silent guards, and a sincere interest in debt law. They ask about docks, warehouses, labor prices, and which officials can be bought permanently.\n\nGifts might keep them polite. Spies might discover which ledgers already point toward Zharr-Naggrund. Refusal would be satisfying, but satisfaction does not stop black iron from moving downriver."
pigbarter_events.4.a:0 "Send expensive gifts."
pigbarter_events.4.b:0 "Spy on their ledgers."
pigbarter_events.4.c:0 "Refuse the chains."

pigbarter_events.5.t:0 "Pig-Jousting Season"
pigbarter_events.5.d:0 "Pig-jousting season has turned the market lanes into a mess of cheers, wagers, mud, and heavily armored livestock. The riders insist it is tradition, sport, militia training, and a religious rite depending on who is asking.\n\nThe games draw coin and break bones. Sponsoring them would turn chaos into pageantry. Taxing the wagers would be even better, assuming the losers do not riot before paying."
pigbarter_events.5.a:0 "Sponsor the games."
pigbarter_events.5.b:0 "Tax every wager."
pigbarter_events.5.c:0 "Ban the worst brawls."

pigbarter_events.6.t:0 "The Missing Ivory Caravan"
pigbarter_events.6.d:0 "An Ivory Road caravan has failed to reach the stilt markets. Its last message mentioned dust, bad water, and very polite strangers with too many questions.\n\nSending guards after it may recover the cargo or at least the story. Writing it off would be cheaper today and more expensive tomorrow. Every caravan master is watching how much we value a missing contract.\n\nIn Pigbarter, reputation is credit with witnesses. Credit dies quickly when witnesses get nervous."
pigbarter_events.6.a:0 "Send guards up the road."
pigbarter_events.6.b:0 "Write the caravan off."

pigbarter_events.7.t:0 "Ogre Bodyguard Guild"
pigbarter_events.7.d:0 "Ogre bodyguards have formed a guild near the livestock pens, which mostly means they stand under a painted sign and demand meals before negotiation. Their clients report excellent survival rates and terrible catering costs.\n\nHiring them would frighten thieves and creditors alike. Licensing the guild would turn appetite into revenue. Restricting them may please merchants who dislike being charged for not being eaten.\n\nThe Ogres consider all three choices flattering. They have already eaten the sign painter."
pigbarter_events.7.a:0 "Hire the largest bruisers."
pigbarter_events.7.b:0 "License the guild."
pigbarter_events.7.c:0 "Restrict their contracts."
pigbarter_events.7.dd:0 "Feed them into loyalty."

pigbarter_events.8.t:0 "The Smuggler's Delta Chart"
pigbarter_events.8.d:0 "A smuggler offers a damp chart of the Scalded Delta, marked with reed channels, hidden banks, and several skulls that may be warnings or jokes. He claims it cost him three crews and one marriage.\n\nBuying the chart would improve patrols and trade alike. Copying it before refusing payment would be cheaper, provided the smuggler is as foolish as he looks. No one who survives the delta is usually that foolish."
pigbarter_events.8.a:0 "Buy the chart."
pigbarter_events.8.b:0 "Copy it in secret."

pigbarter_events.9.t:0 "Whispers of Hashut"
pigbarter_events.9.d:0 "Debtor shrines near the market have begun receiving black iron tokens stamped with the mark of Hashut. The priests claim they are merely charms against misfortune, which is technically one way to describe enslavement.\n\nPurging the shrines would cause panic and prove resolve. Bribing informants might expose the chain before it tightens. Ignoring the whispers would keep business smooth until business belongs to someone else.\n\nThe furnaces upriver do not need to shout. Their smoke speaks plainly enough."
pigbarter_events.9.a:0 "Purge the debtor shrines."
pigbarter_events.9.b:0 "Bribe informants."
pigbarter_events.9.c:0 "Pretend not to hear."

pigbarter_events.10.t:0 "Plague in the Wharf Pens"
pigbarter_events.10.d:0 "A coughing plague has spread through the livestock pens of [event_target.GetName], turning profitable pigs into expensive corpses. Buyers are pretending not to notice the smell, which means they have noticed and are negotiating.\n\nQuarantine would preserve trust and ruin several market days. Selling quickly would move the problem elsewhere for immediate coin. Burning the pens would be clean, costly, and unpopular with everyone downwind."
pigbarter_events.10.a:0 "Quarantine the pens."
pigbarter_events.10.b:0 "Sell the stock quickly."
pigbarter_events.10.c:0 "Burn the infected pens."
