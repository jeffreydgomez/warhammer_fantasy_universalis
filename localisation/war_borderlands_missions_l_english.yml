l_english:

 borderlands_border_oaths_title:0 "Border Oaths"
 borderlands_border_oaths_desc:0 "The frontier is held by promises made under armed guard. A prince who stands alone is only another target on the road. We must bind enough allies to prove our word travels beyond one campfire."
 borderlands_petty_crowns_bent_title:0 "Petty Crowns Bent"
 borderlands_petty_crowns_bent_desc:0 "The Borderlands are crowded with claimants, hired blades, and improvised crowns. Every hill fort believes itself the center of the map until a stronger reputation proves otherwise. We must gather enough prestige that the loudest princes can no longer laugh off a wider authority."
 borderlands_black_fire_tollhouses_title:0 "Black Fire Tollhouses"
 borderlands_black_fire_tollhouses_desc:0 "The road through Black Fire Pass carries merchants, spies, pilgrims, and raiders in the same dust. Whoever owns the pass with a market and a fort can tax fear as easily as trade. We must make that hard road fund the guards who keep it open."
 borderlands_courts_arbitration_title:0 "Courts of Arbitration"
 borderlands_courts_arbitration_desc:0 "Every ruined tower and pasture can become a blood feud. A frontier that settles every quarrel by torchlight will never become a realm. We must build courthouses enough that judgment becomes cheaper and safer than private war."
 borderlands_great_power_envoys_title:0 "Great-Power Envoys"
 borderlands_great_power_envoys_desc:0 "Old courts still call us adventurers when they think we cannot hear them. They understand lineage better than hardship, and seals better than scars. We must cultivate enough diplomatic reputation that frontier power sounds like policy before our envoys even speak."
 borderlands_allies_among_giants_title:0 "Allies Among Giants"
 borderlands_allies_among_giants_desc:0 "Recognition matters most when powerful realms have reason to keep it. A treaty with a giant is dangerous, and two trusted giants are harder still to manage. We must bind two great powers with enough trust that our survival becomes part of their calculations."
 borderlands_ten_roads_into_tilea_title:0 "Ten Roads Into Tilea"
 borderlands_ten_roads_into_tilea_desc:0 "Tilea looks at the marches with purse, dagger, and contract already in hand. Its cities know the value of a road before the road is safe. We must control ten footholds there through our own rule or our subjects."
 borderlands_twenty_five_in_tilea_title:0 "Twenty-Five in Tilea"
 borderlands_twenty_five_in_tilea_desc:0 "Ten Tilean footholds are leverage, but leverage can still be bargained away. Twenty-five holdings make our presence a fact written into every western contract. We must make the merchant princes count us before they count their profits."

 borderlands_refugee_rolls_title:0 "Refugee Rolls"
 borderlands_refugee_rolls_desc:0 "The Borderlands are built from people older realms rejected. Refugees arrive with empty hands, useful trades, bitter memories, and loyalties not yet purchased. We must turn desperate arrivals into settlers, soldiers, and taxpayers."
 borderlands_named_princes_seats_title:0 "Named Princes' Seats"
 borderlands_named_princes_seats_desc:0 "The famous seats of the marches still carry weight long after their banners change. A capital taken from a known prince is more than land; it is a claim that other captains understand. We must hold enough of their capitals to speak for the region."
 borderlands_claim_border_thrones_title:0 "Claim the Border Thrones"
 borderlands_claim_border_thrones_desc:0 "A realm of claims needs the nerve to print a larger map. Petty crowns will not bend because our scribes wish them to, but claims backed by roads and soldiers have a different weight. We must hold enough marches to claim the rest."
 borderlands_passes_made_stone_title:0 "Passes Made Stone"
 borderlands_passes_made_stone_desc:0 "Brave speeches do not stop raiders at a pass. Stone, stores, watch rotations, and paid garrisons do. We must raise seven serious forts so the frontier roads become habits that endure longer than any one captain."
 borderlands_university_march_title:0 "University of the March"
 borderlands_university_march_desc:0 "Modern power needs more than hard riders and lucky ambushes. Engineers, jurists, surgeons, and accountants can tame a frontier in ways cavalry cannot. We must build a university in a province whose infrastructure can carry it."
 borderlands_ten_warrens_below_title:0 "Ten Warrens Below"
 borderlands_ten_warrens_below_desc:0 "Underways and undercities are no longer distant horrors whispered about by nervous caravan guards. The world below carries armies, contraband, and terrors that can surface without warning. We must hold ten stations below the world before others use them against us."
 borderlands_twenty_five_below_title:0 "Twenty-Five Below"
 borderlands_twenty_five_below_desc:0 "Ten warrens are a map of danger. Twenty-five are a frontier with patrols, locks, stores, and grudges of its own. We must make the darkness below answer our seal as surely as the roads above."

 borderlands_raised_palisades_title:0 "Raised Palisades"
 borderlands_raised_palisades_desc:0 "Loose walls invite every hungry neighbor to test us. A frontier without forts is only a promise that someone else will arrive first. We must raise defenses before ambition outruns shelter."
 borderlands_frontier_muster_title:0 "Frontier Muster"
 borderlands_frontier_muster_desc:0 "A frontier army cannot be hired at the last bell. Sellswords vanish, militias haggle, and brave riders still need grain. We must fill the ranks before the next feud sells them away."
 borderlands_fortress_crossings_title:0 "Fortress Crossings"
 borderlands_fortress_crossings_desc:0 "Roads and rivers meet at hard points where a realm can be held or broken. Forts need soldiers close enough to answer when the horns sound. We must build barracks and training fields so the crossings are defended by more than walls."
 borderlands_orc_camps_burned_title:0 "Orc Camps Burned"
 borderlands_orc_camps_burned_desc:0 "Greenskin camps teach the frontier to sleep lightly. If we are not a Greenskin host ourselves, no Greenskin military power can be allowed to hold land in the Borderlands. We must make the marches safe from raiders or prove that the raiders now answer to us."
 borderlands_border_princes_confederacy_title:0 "Border Princes Confederacy"
 borderlands_border_princes_confederacy_desc:0 "The situation is too dangerous for lonely crowns. Petty princes, refugee towns, mercenary captains, and shrine-keepers all need a shield larger than their own walls. We must unite the Border Princes into a common shield."
 borderlands_stable_frontier_title:0 "Stable Frontier"
 borderlands_stable_frontier_desc:0 "Peace in the marches is never quiet. It sounds like toll bells, angry petitions, grudging payments, and soldiers arriving before the fire spreads. We must push average unrest below zero until rebellion becomes less likely than paperwork."
 borderlands_modern_muster_title:0 "The Modern Muster"
 borderlands_modern_muster_desc:0 "The realm can no longer rely on lucky captains and convenient contracts. A lasting state needs officers, records, drill, and supply habits that survive a bad campaign. We must build a professional army with a memory longer than one contract."
 borderlands_great_power_recognized_title:0 "Great Power Recognized"
 borderlands_great_power_recognized_desc:0 "The world must stop treating us as a buffer between older ambitions. A frontier with polished envoys, one hundred thousand soldiers, and fifty ships is no longer a convenient absence on the map. We must be named among the great powers and make the title impossible to mock."
 borderlands_votes_or_standards_title:0 "Votes or Standards"
 borderlands_votes_or_standards_desc:0 "The Empire will respect us by ballots or by standards. Its princes understand votes, marches, and armed facts better than frontier boasting. We must hold ten Imperial provinces or win an elector's vote."
 borderlands_imperial_foothold_title:0 "Imperial Foothold"
 borderlands_imperial_foothold_desc:0 "A vote is influence and provinces are proof. Imperial politics rewards patience, pressure, and the careful use of fear. We must deepen our reach until no court can ignore it."
 borderlands_five_horizons_title:0 "The Five Horizons"
 borderlands_five_horizons_desc:0 "Five horizons now answer our contracts. Tilean roads, warrens below, Imperial footholds, eastern stations, and southern dominions can still look like accidents unless one policy binds them together. We must hold twenty-five provinces in each horizon and prove that distant claims form one system."
 borderlands_empire_from_no_ones_land_title:0 "Empire From No-One's Land"
 borderlands_empire_from_no_ones_land_desc:0 "The world once called these lands no-one's country. Refugees, captains, shrine-keepers, merchants, and hard soldiers have proved that no-one's land can become everyone else's problem. We must make the Borderlands the heart of an empire recognized by fear, treaty, and endurance."

 borderlands_safe_havens_title:0 "Safe Havens"
 borderlands_safe_havens_desc:0 "The frontier does not become orderly just because a banner says it is. Temples, shrines, and cathedrals give frightened people places to gather before fear becomes flight. We must build safe havens that make survival feel less temporary."
 borderlands_break_raiders_title:0 "Break the Raiders"
 borderlands_break_raiders_desc:0 "Raiders thrive when princes argue. Greenskin warbands and other hard-bitten predators know every weak border by smell and rumor. We must defeat or displace the threat around the marches."
 borderlands_barak_varr_ledger_title:0 "Barak Varr Ledger"
 borderlands_barak_varr_ledger_desc:0 "Barak Varr is a ledger written in grudges, stone, and harbor chains. Owning the hold means little if its great works decay into another prize taken by accident. We must hold the gate and keep its monument worthy of the Black Gulf."
 borderlands_companies_under_contract_title:0 "Companies Under Contract"
 borderlands_companies_under_contract_desc:0 "Sellswords built half these crowns. Coin can raise an army quickly, but coin without articles creates another armed problem. We must make the companies answer contracts instead of whims."
 borderlands_manufactories_order_title:0 "Manufactories of Order"
 borderlands_manufactories_order_desc:0 "Most outsiders think factories cannot survive in the Borderlands. They imagine every foundry robbed, every clock broken, and every wage chest stolen before the second shift. We must prove that even this frontier can keep furnaces, schedules, and wages moving."
 borderlands_defeat_crowned_giant_title:0 "Defeat a Crowned Giant"
 borderlands_defeat_crowned_giant_desc:0 "A great power's defeat is worth more than a hundred petitions. Old crowns listen more carefully when their banners have been dragged through frontier mud. We must beat one in war and carry enough power projection that the victory cannot be dismissed as luck."
 borderlands_caravan_far_east_title:0 "Caravan to the Far East"
 borderlands_caravan_far_east_desc:0 "The Far East is no longer rumor beyond caravan smoke. Its roads carry luxuries, envoys, old empires, and dangers that make Borderland feuds look small. We must hold ten stations there to prove our reach is more than tavern talk."
 borderlands_eastern_stations_title:0 "Eastern Stations"
 borderlands_eastern_stations_desc:0 "Ten stations are a caravan story. Twenty-five are a road system with guards, storehouses, scribes, and expected payments. We must make the eastern routes recognize our habits of rule."

 borderlands_toll_road_charters_title:0 "Toll-Road Charters"
 borderlands_toll_road_charters_desc:0 "Roads need coin before they need poetry. A toll that pays guards is less hated than a toll that vanishes into a prince's cup. We must turn markets and road charters into a frontier purse."
 borderlands_market_crossroads_title:0 "Market Crossroads"
 borderlands_market_crossroads_desc:0 "Toll roads need anchors where merchants can argue, store goods, and be taxed in predictable ways. Upgraded centers of trade turn a road charter from a promise into a habit. We must raise two such crossroads and make them worth defending."
 borderlands_black_gulf_shipyards_title:0 "Black Gulf Shipyards"
 borderlands_black_gulf_shipyards_desc:0 "The Black Gulf cannot remain another distant shore. Trade that reaches the water without escorts is only an invitation to pirates, rivals, and opportunists. We must build ships fit to guard our claims."
 borderlands_trading_post_barak_varr_title:0 "Black Gulf Patrols"
 borderlands_trading_post_barak_varr_desc:0 "A frontier with ports still needs ships that can actually watch the water. Light ships are the eyes, toll collectors, and quiet threats of the Black Gulf. We must build enough of them that trade captains see our flags before they see danger."
 borderlands_home_node_dominance_title:0 "Command the Home Node"
 borderlands_home_node_dominance_desc:0 "Patrols matter most when they command the waters that feed the realm. If our home trade node remains divided, every escort becomes a service sold partly to our rivals. We must control eighty percent of the node and make the frontier's trade answer home first."
 borderlands_southlands_marches_title:0 "Southlands Marches"
 borderlands_southlands_marches_desc:0 "The Southlands turn frontier skill into empire. Heat, distance, unfamiliar courts, and long supply lines will punish any power that arrives unprepared. We must hold ten provinces there and show that our rough methods travel."
 borderlands_southlands_dominion_title:0 "Southlands Dominion"
 borderlands_southlands_dominion_desc:0 "Ten marches are outposts. Twenty-five are a dominion with its own routes, garrisons, and local bargains. We must make the southern frontier recognize our seal."

 borderlands_claims_border_princes_tt:0 "Gain permanent claims on the Border Princes region."
 borderlands_claims_tilea_tt:0 "Gain permanent claims on Tilea."
 borderlands_claims_underempire_tt:0 "Gain permanent claims on the Under-Empire."
 borderlands_claims_empire_tt:0 "Gain permanent claims on the Empire."
 borderlands_claims_darklands_tt:0 "Gain permanent claims on the Darklands."
 borderlands_claims_badlands_tt:0 "Gain permanent claims on the Badlands."

 borderlands_frontier_oaths:0 "Frontier Oaths"
 desc_borderlands_frontier_oaths:0 "Our agreements are not elegant, but they are understood, witnessed, and dangerous to break."
 borderlands_petty_crowns_bent_mod:0 "Bent Petty Crowns"
 desc_borderlands_petty_crowns_bent_mod:0 "Petty rulers now understand that their crowns survive by answering a broader order."
 borderlands_black_fire_tollhouses_mod:0 "Black Fire Tollhouses"
 desc_borderlands_black_fire_tollhouses_mod:0 "The pass tolls now fund guards, ledgers, and the quiet work of keeping roads open."
 borderlands_courts_arbitration_mod:0 "Frontier Arbitration"
 desc_borderlands_courts_arbitration_mod:0 "Disputes that once became raids now pass through courts backed by soldiers."
 borderlands_great_power_envoys_mod:0 "Great-Power Envoys"
 desc_borderlands_great_power_envoys_mod:0 "Our envoys still know mud and danger, but they now speak in seals, precedence, and treaties."
 borderlands_allies_among_giants_mod:0 "Allies Among Giants"
 desc_borderlands_allies_among_giants_mod:0 "Powerful allies make the frontier's independence harder to dismiss."
 borderlands_twenty_five_in_tilea_mod:0 "Tilean Road Authority"
 desc_borderlands_twenty_five_in_tilea_mod:0 "Tilean merchants now calculate our tolls before they write their contracts."
 borderlands_refugee_rolls_mod:0 "Refugee Rolls"
 desc_borderlands_refugee_rolls_mod:0 "New arrivals are no longer only mouths at the gate; they are recorded as hands, skills, and obligations."
 borderlands_named_princes_seats_mod:0 "Seats of the Princes"
 desc_borderlands_named_princes_seats_mod:0 "Famous marcher seats now lend their names and roads to a larger authority."
 borderlands_passes_made_stone_mod:0 "Stone Passes"
 desc_borderlands_passes_made_stone_mod:0 "The passes are no longer hopes on a map; they are walls, stores, and paid watchmen."
 borderlands_university_march_mod:0 "University of the March"
 desc_borderlands_university_march_mod:0 "Scholars, engineers, jurists, and captains now share a frontier institution built for useful learning."
 borderlands_twenty_five_below_mod:0 "Under-Empire Frontier"
 desc_borderlands_twenty_five_below_mod:0 "Our soldiers have learned to defend in tunnels, underroads, and places where sunlight is a rumor."
 borderlands_raised_palisades_mod:0 "Raised Palisades"
 desc_borderlands_raised_palisades_mod:0 "Even the roughest palisade is a promise that someone will stand guard."
 borderlands_frontier_muster_mod:0 "Frontier Muster"
 desc_borderlands_frontier_muster_mod:0 "The frontier has learned to fill ranks before smoke appears on the horizon."
 borderlands_fortress_crossings_mod:0 "Fortress Crossings"
 desc_borderlands_fortress_crossings_mod:0 "The crossings now have gates, watch captains, stores, and fewer excuses."
 borderlands_orc_camps_burned_mod:0 "Burned Raider Camps"
 desc_borderlands_orc_camps_burned_mod:0 "The smoke from broken camps has bought the frontier a little sleep."
 borderlands_confederacy_common_shield:0 "Common Shield"
 desc_borderlands_confederacy_common_shield:0 "The Confederacy remains quarrelsome, but its quarrels now take place under a shared banner."
 borderlands_stable_frontier_mod:0 "Stable Frontier"
 desc_borderlands_stable_frontier_mod:0 "No one would call the marches peaceful, but fewer disputes now become rebellions."
 borderlands_modern_muster_mod:0 "Modern Muster"
 desc_borderlands_modern_muster_mod:0 "Captains, drillmasters, and quartermasters have begun to outlast the wars that made them."
 borderlands_imperial_foothold_mod:0 "Imperial Foothold"
 desc_borderlands_imperial_foothold_mod:0 "Our name now carries weight in Imperial calculations, whether by vote, fear, or possession."
 borderlands_five_horizons_mod:0 "Five Horizons"
 desc_borderlands_five_horizons_mod:0 "Distant holdings no longer look like accidents; they form a system of roads, stations, dominions, and claims."
 borderlands_empire_from_no_ones_land_mod:0 "Empire From No-One's Land"
 desc_borderlands_empire_from_no_ones_land_mod:0 "The Borderlands were once a refuge for those without a country. Now other countries must account for the empire born there."
 borderlands_safe_havens_mod:0 "Safe Havens"
 desc_borderlands_safe_havens_mod:0 "Shrines and sanctuaries give the frontier somewhere to gather before fear turns into flight."
 borderlands_break_raiders_mod:0 "Broken Raiders"
 desc_borderlands_break_raiders_mod:0 "Enemies who cross the marches now learn that the land itself has been taught to punish them."
 borderlands_barak_varr_ledger_mod:0 "Barak Varr Ledger"
 desc_borderlands_barak_varr_ledger_mod:0 "The Black Gulf road now has ledgers precise enough to satisfy merchants and irritate Dwarfs only moderately."
 borderlands_companies_under_contract_mod:0 "Companies Under Contract"
 desc_borderlands_companies_under_contract_mod:0 "Paid soldiers still love coin, but the coin now comes with stricter articles."
 borderlands_manufactories_order_mod:0 "Border Industry"
 desc_borderlands_manufactories_order_mod:0 "Factories once dismissed as impossible in the Borderlands now keep schedules, tools, and wages moving."
 borderlands_defeat_crowned_giant_mod:0 "A Crowned Giant Defeated"
 desc_borderlands_defeat_crowned_giant_mod:0 "The victory is now told as proof that the frontier can humble powers older than its crown."
 borderlands_eastern_stations_mod:0 "Eastern Stations"
 desc_borderlands_eastern_stations_mod:0 "Far roads now pass through stations that know our seal and rates."
 borderlands_toll_road_charters_mod:0 "Toll-Road Charters"
 desc_borderlands_toll_road_charters_mod:0 "The roads now pay for the privilege of remaining roads."
 borderlands_market_crossroads_mod:0 "Market Crossroads"
 desc_borderlands_market_crossroads_mod:0 "Upgraded trade centers make frontier tolls more predictable, profitable, and worth defending."
 borderlands_black_gulf_shipyards_mod:0 "Black Gulf Shipyards"
 desc_borderlands_black_gulf_shipyards_mod:0 "Ships launched for the Black Gulf carry the same hard practicality as our forts."
 borderlands_home_node_dominance_mod:0 "Home Node Dominance"
 desc_borderlands_home_node_dominance_mod:0 "Our merchants, escorts, and toll officers now command the trade routes closest to home."
 borderlands_southlands_dominion_mod:0 "Southlands Dominion"
 desc_borderlands_southlands_dominion_mod:0 "Southern marches now carry our provisions, seals, and hard-learned habits of defense."
 borderlands_loose_charters_mod:0 "Loose Camp Charters"
 desc_borderlands_loose_charters_mod:0 "Recognition is broad, practical, and just formal enough to stop camps from treating each other as strangers."
 borderlands_hard_census_mod:0 "Hard Frontier Census"
 desc_borderlands_hard_census_mod:0 "Every camp, shrine, language, and oath has been counted so the realm can decide what must be made common."
 borderlands_camp_law_mod:0 "Camp Law Supreme"
 desc_borderlands_camp_law_mod:0 "The realm tolerates many customs, but not private violence against the common order."
 borderlands_embassy_seals_mod:0 "Embassy Seals"
 desc_borderlands_embassy_seals_mod:0 "Our embassies carry seals that even old courts have learned to read without smirking."
 borderlands_frontier_titles_mod:0 "Frontier Titles"
 desc_borderlands_frontier_titles_mod:0 "Our titles are rough in origin but increasingly useful in treaty rooms."
 borderlands_war_renown_mod:0 "War Renown"
 desc_borderlands_war_renown_mod:0 "Victories against great powers now train our officers as surely as they impress our neighbors."
 borderlands_barak_licensed_trade_mod:0 "Protected Black Gulf Trade"
 desc_borderlands_barak_licensed_trade_mod:0 "Merchants under our patrol licenses move with more confidence and pay for the privilege."
 borderlands_barak_fortified_post_mod:0 "Guarded Harbor Roads"
 desc_borderlands_barak_fortified_post_mod:0 "Harbors and roadsteads watched by our patrols are harder to raid and easier to tax."
 borderlands_barak_black_gulf_escorts_mod:0 "Black Gulf Escorts"
 desc_borderlands_barak_black_gulf_escorts_mod:0 "Escort ships make the Black Gulf route safer for our merchants and less comfortable for everyone else's raiders."

 borderlands_events.1001.t:0 "One Law, Many Camps"
 borderlands_events.1001.d:0 "The Confederacy has done what most princes claimed was impossible: its camps, towns, shrines, markets, and hill forts now recognize one frontier authority. Recognition is not affection. It is a bargain made because the alternative is worse.\n\nThe question is what kind of bargain should endure. Loose charters would make diversity a strength, a hard census would push the realm toward common habits, and camp law would let many customs survive beneath a sharper public order.\n\nThe Borderlands will not become tidy. It can, however, become legible enough that soldiers, judges, merchants, and priests know which quarrels are private and which ones threaten the realm."
 borderlands_events.1001.a:0 "Charter every camp."
 borderlands_events.1001.b:0 "Take a hard census."
 borderlands_events.1001.c:0 "Make camp law supreme."

 borderlands_events.1002.t:0 "The Frontier Receives Envoys"
 borderlands_events.1002.d:0 "Foreign envoys have arrived with proper seals and careful faces. Some call us a necessary ally, some a useful danger, and some a temporary fact that has become awkwardly permanent. None of them call us irrelevant.\n\nThis is recognition, but recognition is only the beginning. We can answer with embassies and procedure, with titles that force other courts to speak our language, or with the reputation earned by defeating powers that thought us beneath them.\n\nThe old world of pedigrees has met the frontier world of contracts. Both now understand that the meeting cannot be undone."
 borderlands_events.1002.a:0 "Send sealed embassies."
 borderlands_events.1002.b:0 "Proclaim frontier titles."
 borderlands_events.1002.c:0 "Let victory speak."

 borderlands_events.1003.t:0 "Black Gulf Patrols"
 borderlands_events.1003.d:0 "Our light ships now move through the Black Gulf in numbers no merchant can ignore. They are not grand battle lines, but they are fast enough to find pirates, visible enough to reassure caravans, and numerous enough to make tolls feel backed by more than ink.\n\nThe patrols can serve protected merchants, harbor roads, or direct escort work. Each choice profits the realm, but each tells captains what kind of sea power the frontier intends to become.\n\nThe Black Gulf has long belonged to whoever could keep ships alive on it. Now our flags are part of that calculation."
 borderlands_events.1003.a:0 "License protected merchants."
 borderlands_events.1003.b:0 "Guard the harbor roads."
 borderlands_events.1003.c:0 "Escort the Black Gulf."
