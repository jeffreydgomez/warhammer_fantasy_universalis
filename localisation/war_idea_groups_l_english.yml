evil_group_ideas_bonus:0 "Evil Ideas Bonus"


# Good Idea Group Localization
good_group_ideas_1:0 "Beacon of Integrity"
good_group_ideas_1_desc:0 "Our moral conduct and diplomatic integrity inspire trust among our neighbors and allies, enhancing our influence on the global stage. The strength of our word binds coalitions and mends fractured realms, enabling us to act as mediators, protectors, and builders of long-lasting alliances grounded in mutual respect and justice."

good_group_ideas_2:0 "Calm Amidst the Storm"
good_group_ideas_2_desc:0 "A just society gives little ground for sedition. Our fair governance ensures even the discontented find reason to stay their hand. By addressing grievances with compassion and upholding the dignity of every subject, we weave a resilient social fabric that defies the corrosive influence of despair and rebellion."

good_group_ideas_3:0 "Guardians of the Land"
good_group_ideas_3_desc:0 "Through stewardship and care, our lands heal from the scars of war, blossoming again under the watch of righteous rulers. The fruits of peace are plentiful: green fields, bustling towns, and a populace whose hearts swell with pride in their homeland’s strength and sanctity."

good_group_ideas_4:0 "Valiant Defenders"
good_group_ideas_4_desc:0 "When called upon, our armies fight with honor and unshakable courage, defending the innocent and preserving peace. Their valor is not born of conquest, but of duty—a sacred charge to shield the weak and uphold the moral order amidst an age of madness and bloodshed."

good_group_ideas_5:0 "Unity Through Tolerance"
good_group_ideas_5_desc:0 "Rather than persecution, we choose understanding. Our embrace of diversity knits a stronger, united realm. By granting space to differing beliefs and cultures within our borders, we create a shared identity rooted in mutual respect and coexistence, rather than fear or domination."

good_group_ideas_6:0 "Stewardship of the Realm"
good_group_ideas_6_desc:0 "A government that serves its people sees the wealth of its lands returned manyfold in prosperity and stability. Every coin collected is a pact fulfilled—a promise of justice, infrastructure, and the noble burden of rulership carried with humility and wisdom."

good_group_ideas_7:0 "Voice of Reason"
good_group_ideas_7_desc:0 "By leading with virtue, even our ambitions seem just. Our righteous cause earns us leeway in the eyes of the world. Where others see empires of oppression, our influence is viewed as sanctuary and order—a stabilizing presence in a fractured world longing for hope."

# Neutral Idea Group Localization
neutral_group_ideas_1:0 "Mercantile Sensibility"
neutral_group_ideas_1_desc:0 "We place profit above pride, securing steady gains through sharp trade policies and fiscal prudence. Commerce is not just an engine of wealth, but a shield against political volatility—a lifeline that connects our cities, sustains our treasury, and fuels the ambitions of merchants and ministers alike."

neutral_group_ideas_2:0 "Efficient Corps"
neutral_group_ideas_2_desc:0 "Without fanaticism or excess, our military institutions steadily mature, producing professionals rather than zealots. From officer schools to logistics bureaus, we build a dependable war machine whose competence and restraint ensure its effectiveness across all campaigns."

neutral_group_ideas_3:0 "Progress Through Order"
neutral_group_ideas_3_desc:0 "Through incremental reforms and stable governance, we nurture institutions that evolve with the times. By favoring measured adaptation over revolutionary fervor, we chart a course that prioritizes durability, civic trust, and long-term growth across all sectors of statecraft."

neutral_group_ideas_4:0 "Flexible Authority"
neutral_group_ideas_4_desc:0 "Whatever our system of rule, it is structured to endure. From monarch to council, legitimacy is preserved and respected. Our state is not built on the whims of tyrants, but on the continuity of rule, the reliability of law, and the willing participation of its stewards."

neutral_group_ideas_5:0 "Adaptive Outlook"
neutral_group_ideas_5_desc:0 "Innovation is not an ideology, but a necessity. We readily embrace change to stay ahead. Whether by welcoming foreign techniques or reforming outdated customs, we value the practical over the doctrinaire, securing our place in a fast-changing world."

neutral_group_ideas_6:0 "Pragmatic Entente"
neutral_group_ideas_6_desc:0 "Balanced diplomacy is the art of keeping doors open while holding one’s cards close. We master the game of alliances. Not ruled by ideals nor ruled by fear, our network of pacts serves as both shield and sword, wielded with cool calculation."

neutral_group_ideas_7:0 "Envoys of the Middle Path"
neutral_group_ideas_7_desc:0 "Our emissaries cross borders swiftly, bearing messages of trade, neutrality, and reason. Their presence carries weight not through grandeur or menace, but through a reputation for level-headedness and mutual benefit that endears us to even the most wary foreign courts."

# Evil Idea Group Localization
evil_group_ideas_1:0 "No Quarter for the False"
evil_group_ideas_1_desc:0 "Those who reject our faith, our culture, or our rule shall find neither mercy nor shelter. Our wars are total, and our resolve unbreakable. Whether driven by dogma or expedience, the annihilation of the other is not just permitted—it is policy."

evil_group_ideas_2:0 "Drillmasters of Dread"
evil_group_ideas_2_desc:0 "Fear sharpens discipline, and suffering tempers steel. Our troops fight not for love or liberty, but for the relentless march of conquest. They are forged in brutal camps where weakness is culled and only ruthless precision ensures survival."

evil_group_ideas_3:0 "Endless Legions"
evil_group_ideas_3_desc:0 "Through press gangs, dark bargains, or sheer will, we raise armies vast enough to drown resistance in blood and fire. Numbers, like fear, are a weapon—and our forges and slave-pits know no rest until every enemy drowns beneath our banners."

evil_group_ideas_4:0 "Chains of Obedience"
evil_group_ideas_4_desc:0 "Our vassals and slaves dare not rise against us, for our dominion is absolute and dissent is swiftly crushed. Through fear, surveillance, and ruthless reprisal, we maintain the illusion of peace through total control of will and spirit."

evil_group_ideas_5:0 "Exploitation Engineered"
evil_group_ideas_5_desc:0 "From the ashes of others' toil, we build our fortune. Ruthless efficiency drives our production and our dominion. Industry serves not the people but the overlords—every output is a tribute to our mastery over land and labor alike."

evil_group_ideas_6:0 "Glory Through Carnage"
evil_group_ideas_6_desc:0 "Each victory fuels our legend. Our name is spoken in dread across battlefields, etched in fear and triumph alike. In the smoke of slaughter and the screams of the vanquished, we carve eternal renown from blood-soaked soil."

evil_group_ideas_7:0 "Wicked Harmony"
evil_group_ideas_7_desc:0 "Our people embrace our rule, for it offers strength and supremacy. Loyalty, born of fear or ambition, binds the nation together. United in shared cruelty or awe of our strength, they march willingly under a banner that promises power, not peace."

## RAcial Ideas

human_group_ideas:0 "Human Ideas"
human_group_ideas_start:0 "Human Traditions"
human_group_ideas_bonus:0 "Human Ambition"

human_group_ideas_1:0 "Gunpowder Mastery"
human_group_ideas_1_desc:0 "From the cannons of Nuln to the handguns of Altdorf, humans have developed a sophisticated mastery of black powder weaponry, adapting it to warfare with deadly precision."

human_group_ideas_2:0 "Open to New Ideas"
human_group_ideas_2_desc:0 "Humans thrive through adaptability and progress. Innovation, diplomacy, and faith are all embraced, making them capable of rapid change in pursuit of power."

human_group_ideas_3:0 "Alliance Managers"
human_group_ideas_3_desc:0 "Humans are skilled in politics and statecraft, often forging coalitions, unions, and complex alliances to secure their position in the world."

human_group_ideas_4:0 "Empire Builders"
human_group_ideas_4_desc:0 "From the feudal kingdoms of Bretonnia to the bureaucratic Empire of Man, humans excel in the administration of vast domains, integrating diverse peoples and territories into grand states."

human_group_ideas_5:0 "Witch Hunters"
human_group_ideas_5_desc:0 "Fanatics and zealots patrol the lands, hunting down heresy, corruption, and dark magic. These efforts ensure the spiritual and moral purity of the realm."

human_group_ideas_6:0 "Master Riders"
human_group_ideas_6_desc:0 "Be it the icy steppes of Kislev, the dunes of Araby, or the chivalric plains of Bretonnia, humans have bred elite cavalry for war. Their mounted warriors are swift and devastating."

human_group_ideas_7:0 "Willing to Trade"
human_group_ideas_7_desc:0 "The merchant leagues and guilds of mankind ensure that trade flows across oceans and continents. Where coin moves, power follows."



greenskin_group_ideas:0 "Greenskin Ideas"
greenskin_group_ideas_start:0 "Greenskin Traditions"
greenskin_group_ideas_bonus:0 "Greenskin Ambition"

greenskin_group_ideas_1:0 "Unbreakable"
greenskin_group_ideas_1_desc:0 "Orcs are tough, brutal, and above all, hard to kill. Even when outnumbered or outmatched, their sheer resilience and aggression can carry them through."

greenskin_group_ideas_2:0 "Driven by Loot"
greenskin_group_ideas_2_desc:0 "Loot is life. Gold, weapons, teef—whatever can be stolen, smashed, or burned is a reward for the strong. This lust for plunder drives every campaign."

greenskin_group_ideas_3:0 "Motivated by War"
greenskin_group_ideas_3_desc:0 "War is not just a means to an end—it *is* the end. For Greenskins, every battle is a chance to boast, gain glory, and revel in destruction."

greenskin_group_ideas_4:0 "Every Battle a Lesson"
greenskin_group_ideas_4_desc:0 "Greenskins grow stronger with each fight. Even in chaos and disorder, the mightiest rise, and the Waaagh! becomes smarter with experience."

greenskin_group_ideas_5:0 "Everyone's Willing to Fight"
greenskin_group_ideas_5_desc:0 "From the smallest goblin to the biggest Black Orc, every greenskin can be shoved into battle. Numbers are never a problem—just find more gits."

greenskin_group_ideas_6:0 "Lords of Conquest"
greenskin_group_ideas_6_desc:0 "Greenskins do not care for borders, culture, or mercy. When they conquer, they claim everything by force, and quickly."

greenskin_group_ideas_7:0 "Great Armies"
greenskin_group_ideas_7_desc:0 "A proper Waaagh! is massive. Driven by sheer numbers and a hunger for violence, Greenskin hordes can overrun even the most fortified realms."



dwarven_group_ideas:0 "Dwarven Ideas"
dwarven_group_ideas_start:0 "Dwarven Traditions"
dwarven_group_ideas_bonus:0 "Dwarven Ambition"

dwarven_group_ideas_1:0 "Dwarven Industry"
dwarven_group_ideas_1_desc:0 "No race rivals the Dwarfs in craftsmanship. Their workshops produce fine goods, powerful weapons, and durable tools with unmatched skill."

dwarven_group_ideas_2:0 "Forged Armor"
dwarven_group_ideas_2_desc:0 "The armor of the Dawi is forged in the depths of their holds, blessed by ancestors and built to endure flame, steel, and sorcery alike."

dwarven_group_ideas_3:0 "City Builders"
dwarven_group_ideas_3_desc:0 "Ancient karaks carved into mountains, lined with runes and stone—Dwarfs are legendary architects, creating fortresses that last millennia."

dwarven_group_ideas_4:0 "Heavy-Footed"
dwarven_group_ideas_4_desc:0 "What they lack in speed, Dwarfs make up for in raw staying power. Their shieldwalls do not break, and they advance with the force of a mountain."

dwarven_group_ideas_5:0 "Unity of the Dwarfs"
dwarven_group_ideas_5_desc:0 "Bound by clan, grudge, and ancestral pride, the Dawi strive for unity among their scattered holds, strengthening their cultural and spiritual ties."

dwarven_group_ideas_6:0 "Great Fortresses"
dwarven_group_ideas_6_desc:0 "The ancient strongholds of the Dwarfs are marvels of defense. Carved into stone, warded by runes, and guarded by proud warriors, they can withstand any siege."

dwarven_group_ideas_7:0 "Great Cannons"
dwarven_group_ideas_7_desc:0 "The engineers of the Dwarfs produce the mightiest cannons in the world. When these thunderous weapons fire, even dragons tremble."

elven_group_ideas:0 "Elven Ideas"
elven_group_ideas_start:0 "Elven Traditions"
elven_group_ideas_bonus:0 "Elven Ambition"

elven_group_ideas_1:0 "Elven Courts"
elven_group_ideas_1_desc:0 "Elegant, ancient, and diplomatically adept, Elven courts are renowned for their grace and cunning. Their emissaries and monarchs carry centuries of tradition and influence."

elven_group_ideas_2:0 "Professional Armies"
elven_group_ideas_2_desc:0 "Elven warriors train for decades or centuries. Their precision, discipline, and poise in battle are second to none, making even small armies deadly."

elven_group_ideas_3:0 "Undying Prestige"
elven_group_ideas_3_desc:0 "Elves build legacies over millennia. Their noble lineages and great deeds echo through the ages, preserving their prestige far longer than mortal kingdoms."

elven_group_ideas_4:0 "Skilled Fleets"
elven_group_ideas_4_desc:0 "Elven mariners are born to the sea. With light yet swift ships and unmatched seamanship, their navies dominate coasts and oceans alike."

elven_group_ideas_5:0 "A Satisfied Society"
elven_group_ideas_5_desc:0 "Elven societies are typically harmonious, with every citizen knowing their place in the long-lived order. Such contentment breeds peace and stability."

elven_group_ideas_6:0 "Masters of Magic"
elven_group_ideas_6_desc:0 "Magic courses through the Elven soul. Whether in High Magic or Shadow, Elves have perfected arcane arts that others merely fumble with."

elven_group_ideas_7:0 "Council of Wisdom"
elven_group_ideas_7_desc:0 "Elves draw upon vast pools of knowledge and talent. Their advisors, scholars, and mages are many and wise, aiding governance across every sphere."



undead_group_ideas:0 "Undead Ideas"
undead_group_ideas_start:0 "Undead Traditions"
undead_group_ideas_bonus:0 "Undead Ambition"

undead_group_ideas_1:0 "A Society of Magic"
undead_group_ideas_1_desc:0 "Undead realms are ruled by necromantic might. Every decision is shaped by dark sorcery, and every advancement flows from arcane command."

undead_group_ideas_2:0 "Open the Tombs"
undead_group_ideas_2_desc:0 "The legions of the dead are vast. With a single command, thousands rise from ancient crypts, ready to serve eternally."

undead_group_ideas_3:0 "Slave Labor"
undead_group_ideas_3_desc:0 "Undead economies are driven by tireless slaves, whether bound spirits or dominated mortals. With no need for rest or pay, their productivity is unmatched."

undead_group_ideas_4:0 "Terrifying Armies"
undead_group_ideas_4_desc:0 "Marching without fear or pain, the undead inspire horror in all who face them. Their grim silence and deathly forms break morale before a blade is drawn."

undead_group_ideas_5:0 "The Dead Do Not Complain"
undead_group_ideas_5_desc:0 "In the lands of the dead, there is no dissent. Fear, obedience, and the final silence ensure perfect order."

undead_group_ideas_6:0 "Transform the Living"
undead_group_ideas_6_desc:0 "Missionaries of undeath spread the curse like a faith. Cultures and creeds are erased as the living are turned, willingly or not, into loyal servants."

undead_group_ideas_7:0 "The Dead Know Their Place"
undead_group_ideas_7_desc:0 "Every bone has its purpose. In necromantic states, hierarchy is absolute and eternal—governing becomes efficient when subjects never question."



fimir_group_ideas:0 "Fimir Ideas"
fimir_group_ideas_start:0 "Fimir Traditions"
fimir_group_ideas_bonus:0 "Fimir Ambition"

fimir_group_ideas_1:0 "Extractive Rule"
fimir_group_ideas_1_desc:0 "Fimir lords impose heavy tribute on the weak. Their taxation is ruthless, designed to support the needs of their clan and their dark magic."

fimir_group_ideas_2:0 "Bog Walkers"
fimir_group_ideas_2_desc:0 "Born in the swamps, the Fimir move through the most treacherous terrain with ease. Their enemies often perish in pursuit, unable to follow them into the mist."

fimir_group_ideas_3:0 "Rule by Fear"
fimir_group_ideas_3_desc:0 "Few dare oppose the Fimir. Their terrifying visages and brutal methods maintain control over subjects too afraid to rebel."

fimir_group_ideas_4:0 "Brutal Infantry"
fimir_group_ideas_4_desc:0 "Fimir warriors wield massive weapons and crush their foes with raw power. Though few in number, their warriors are among the deadliest footsoldiers."

fimir_group_ideas_5:0 "Dark Pactkeepers"
fimir_group_ideas_5_desc:0 "Fimir clans are upheld by ancient bargains and occult pacts. These agreements ensure loyalty among their twisted society."

fimir_group_ideas_6:0 "Savage Assaults"
fimir_group_ideas_6_desc:0 "Charging from the mists, the Fimir deliver crushing blows in close combat. Their shock tactics overwhelm unprepared armies."

fimir_group_ideas_7:0 "Twisted Favoritism"
fimir_group_ideas_7_desc:0 "Those who serve the Fimir well are rewarded—especially if they are of the same kin. Fimir rulers elevate their own kind above all else, reducing the cost of loyal advisors."




ogre_group_ideas:0 "Ogre Ideas"
ogre_group_ideas_start:0 "Ogre Traditions"
ogre_group_ideas_bonus:0 "Ogre Ambition"

ogre_group_ideas_1:0 "Aggressive Trade Policies"
ogre_group_ideas_1_desc:0 "Ogre mercantile activity is less about negotiation and more about intimidation. Tributes flow not from commerce, but from the threat of consumption."

ogre_group_ideas_2:0 "We Are Big"
ogre_group_ideas_2_desc:0 "Ogres tower over other races, and their sheer size makes them dominant on the battlefield. Their brutal, lumbering charges break enemy lines with ease."

ogre_group_ideas_3:0 "Steer Trade"
ogre_group_ideas_3_desc:0 "By controlling key passes and demanding tolls with brute force, Ogre tribes redirect trade routes toward their strongholds and camps."

ogre_group_ideas_4:0 "We Run Into People"
ogre_group_ideas_4_desc:0 "Subtlety is foreign to Ogres. They charge headlong into the enemy, flattening anything in their path with overwhelming shock power."

ogre_group_ideas_5:0 "Aggressive Merchants"
ogre_group_ideas_5_desc:0 "Ogre traders are more akin to extortionists. When they place a merchant, it's less about deals and more about demands—and few dare refuse."

ogre_group_ideas_6:0 "They Know They Will Be Eaten"
ogre_group_ideas_6_desc:0 "The terror of facing hungry Ogres on the battlefield saps the morale of their foes. Even whispers of defeat often lead to desertion."

ogre_group_ideas_7:0 "Happy to Work With Others"
ogre_group_ideas_7_desc:0 "While violent and selfish, Ogres are also pragmatic. They'll fight, feast, or trade with anyone—so long as there's meat and gold involved."



skaven_group_ideas:0 "Skaven Ideas"
skaven_group_ideas_start:0 "Skaven Traditions"
skaven_group_ideas_bonus:0 "Skaven Ambition"

skaven_group_ideas_1:0 "Experiment Masters"
skaven_group_ideas_1_desc:0 "Skaven ingenuity is twisted and volatile. From warpstone reactors to bizarre plagues, their mad scientists push the boundaries of possibility."

skaven_group_ideas_2:0 "Powerful Weapons"
skaven_group_ideas_2_desc:0 "Warp lightning, rattling guns, and doomwheels—Skaven weaponry is unstable, terrifying, and devastating in battle when it works."

skaven_group_ideas_3:0 "Masters of Science"
skaven_group_ideas_3_desc:0 "Though derided as insane, Skaven engineers are astonishingly innovative. Their obsession with advancement drives rapid technological gains."

skaven_group_ideas_4:0 "Tunnels Under the Enemy"
skaven_group_ideas_4_desc:0 "The Under-Empire sprawls unseen beneath the world. Skaven armies emerge from hidden passages, undermining cities before sieges even begin."

skaven_group_ideas_5:0 "Many Spies"
skaven_group_ideas_5_desc:0 "Whispers, sabotage, and betrayal are second nature to the Skaven. Their web of spies stretches across the surface world."

skaven_group_ideas_6:0 "Unlimited Skavens"
skaven_group_ideas_6_desc:0 "Skaven breed and die in endless numbers. No matter how many fall, more flood forth from their burrows, ready to claw and bite."

skaven_group_ideas_7:0 "Full Raiders"
skaven_group_ideas_7_desc:0 "Skaven raids are swift, destructive, and utterly chaotic. Their armies strike, loot, and vanish, devastating provinces in their wake."



lizardmen_group_ideas:0 "Lizardmen Ideas"
lizardmen_group_ideas_start:0 "Lizardmen Traditions"
lizardmen_group_ideas_bonus:0 "Lizardmen Ambition"

lizardmen_group_ideas_1:0 "Unified Society"
lizardmen_group_ideas_1_desc:0 "From Skink priests to Saurus warriors, all Lizardmen serve a singular purpose: enacting the Great Plan. This divine unity forges an unbreakable society."

lizardmen_group_ideas_2:0 "Powerful Infantry"
lizardmen_group_ideas_2_desc:0 "Saurus warriors are bred for war, hatched with the strength to crush enemies in close combat. Their ferocity is matched only by their durability."

lizardmen_group_ideas_3:0 "Justified War"
lizardmen_group_ideas_3_desc:0 "Lizardmen go to war not for greed, but for divine purpose. Knowing they act in cosmic alignment, they wage war with tireless resolve."

lizardmen_group_ideas_4:0 "Ancient Ferocity"
lizardmen_group_ideas_4_desc:0 "The might of the Old Ones flows through the Lizardmen. Their morale never falters while carrying out the sacred plan."

lizardmen_group_ideas_5:0 "Destroy the Heathens"
lizardmen_group_ideas_5_desc:0 "Those not part of the Great Plan are enemies by nature. The Lizardmen wage holy war against such threats, seeking their swift annihilation."

lizardmen_group_ideas_6:0 "Dinosaurs"
lizardmen_group_ideas_6_desc:0 "Stegadons, Carnosaurs, and other prehistoric beasts march to war alongside their masters. Their crushing strength devastates enemy lines."

lizardmen_group_ideas_7:0 "Speak with One Voice"
lizardmen_group_ideas_7_desc:0 "Despite their differences, the castes of Lizardmen act in harmony. Their unity of purpose fosters both absolutism and unwavering internal loyalty."



beastfolk_group_ideas:0 "Beastfolk Ideas"
beastfolk_group_ideas_start:0 "Beastfolk Traditions"
beastfolk_group_ideas_bonus:0 "Beastfolk Ambition"

beastfolk_group_ideas_1:0 "Flexible Governance"
beastfolk_group_ideas_1_desc:0 "In their primal herdstones and nomadic groups, the Beastfolk show a raw cunning. Their societies adapt quickly and follow instinctive hierarchy."

beastfolk_group_ideas_2:0 "Unmoved by Death"
beastfolk_group_ideas_2_desc:0 "The Beastfolk know no fear of death. Wounded or dying, they continue to fight with savage tenacity, heedless of loss."

beastfolk_group_ideas_3:0 "Driven by War"
beastfolk_group_ideas_3_desc:0 "War is the only truth. Glory and strength are earned through slaughter. Every victory brings prestige to the strongest."

beastfolk_group_ideas_4:0 "We Will Be One"
beastfolk_group_ideas_4_desc:0 "Unifying the disparate tribes through shared blood rites and dark rituals, the Beastfolk turn their bestial faith into a tool of conquest."

beastfolk_group_ideas_5:0 "Religion Unifies"
beastfolk_group_ideas_5_desc:0 "The primal gods of the herdstones command loyalty through blood and fire. Among the Beastfolk, this savage faith is a powerful unifier."

beastfolk_group_ideas_6:0 "Beastroads"
beastfolk_group_ideas_6_desc:0 "Hidden paths and ancient trails connect their wild domains. These Beastroads allow them to strike quickly and vanish into the woods."

beastfolk_group_ideas_7:0 "Looters"
beastfolk_group_ideas_7_desc:0 "Wherever the Beastfolk raid, they pillage all in sight. Riches, captives, and trophies are taken as signs of power and divine favor."

## Alignment Policies

# GOOD POLICIES LOCALIZATION

good_trade_policy:0 "Righteous Trade Accords"
good_trade_policy_desc:0 "By forging bonds of mutual prosperity, we extend our influence through trade rather than conquest. Our merchants act as ambassadors of harmony, spreading our ideals of fairness and cooperation as they draw wealth into the heart of our realm. Trade is not merely a pursuit of profit—it is a tool for peace and a symbol of virtuous order."

good_aristocracy_policy:0 "Virtue of the Noblesse"
good_aristocracy_policy_desc:0 "Our nobility is not defined by blood alone, but by their unwavering service to justice and their role as stewards of our people. When the aristocracy lives up to its ideals, it uplifts the entire nation. Through honorable rule and cultural leadership, our society thrives in unity and pride."

good_diplomatic_policy:0 "Envoys of Light"
good_diplomatic_policy_desc:0 "We do not seek domination, but guidance. Our envoys are heralds of peace and reason, weaving alliances that bind realms in trust. Where others scheme, we offer stability; where others threaten, we promise sanctuary. The world listens when we speak, for our words carry the weight of righteousness."

good_court_policy:0 "Council of Harmony"
good_court_policy_desc:0 "Each estate in our realm contributes to a divine balance, unified beneath a ruler who listens and leads with wisdom. The court becomes more than a seat of power—it is a sacred gathering of voices who work toward a just and lasting peace, securing loyalty not through fear, but through shared purpose."

good_defensive_policy:0 "Sanctified Earth"
good_defensive_policy_desc:0 "To defend one's homeland is the highest duty of the just. Every wall, every battlement is consecrated with resolve and sacrifice. Our people rally behind the cause of protection, and our soldiers fight not for conquest, but for the sacred soil of home and hearth."

good_offensive_policy:0 "Crusade of Order"
good_offensive_policy_desc:0 "Sometimes peace must be won by sword and shield. When wickedness reigns and the innocent suffer, we march to liberate, not to subjugate. Our wars are fought with moral clarity, our blades bearing the weight of a cause greater than ambition—bringing justice where none remains."

good_exploration_policy:0 "Guided Colonization Edict"
good_exploration_policy_desc:0 "By combining our virtuous governance with fearless exploration, we ensure that our expansion into new lands is not merely conquest, but a righteous mission. Through faith and discipline, we foster peaceful coexistence and rapid assimilation among the native peoples, spreading civilization in the image of the good we uphold."

good_quality_policy:0 "Righteous Discipline"
good_quality_policy_desc:0 "Our cause is just, and so too must be the arms that bear it. By instilling unwavering moral purpose alongside rigorous martial training, we forge an army that does not merely fight — it endures. Their drill is relentless, their resolve unshakable, for they march not only with swords, but with the strength of conviction."

good_quantity_policy:0 "Sacred Muster"
good_quantity_policy_desc:0 "When the cause is just, the people do not shrink from sacrifice. Through righteous governance and communal purpose, every citizen becomes a soldier-in-waiting, ready to defend the realm and the ideals it upholds. From temple to field, from village to fortress, all rise when called — not for glory, but for duty."

good_influence_policy:0 "Benevolent Rule"
good_influence_policy_desc:0 "Power need not be taken by force when it is granted by virtue. Through wisdom, justice, and moral clarity, we command not just obedience, but devotion. Our subjects look to us not with fear, but with reverence, knowing that our rule serves a higher cause — and in that cause, they find unity."




# NEUTRAL POLICIES LOCALIZATION

neutral_humanist_policy:0 "Inclusive Doctrine"
neutral_humanist_policy_desc:0 "Rather than impose a single dogma, we welcome all who can contribute to the state. Faiths and cultures are not shackles, but components of a broader civic harmony. Tolerance becomes a means to an end: cohesion, stability, and productive coexistence under a neutral banner."

neutral_innovativeness_policy:0 "Practical Enlightenment"
neutral_innovativeness_policy_desc:0 "New ideas are neither holy nor heretical—they are tools to be judged by their results. With steady hands, we implement change not for its own sake, but to better the functioning of our state. Efficiency is the highest ideal in a world of shifting truths and endless adaptation."

neutral_economic_policy:0 "Commercial Pragmatism"
neutral_economic_policy_desc:0 "We value wealth not as an end, but as a foundation. Through strategic trade expansion and careful investment, we turn markets into engines of state power. Innovation, profit, and infrastructure work in harmony, fueling a realm unbound by ideological excess."

neutral_quantity_policy:0 "Broad Conscription"
neutral_quantity_policy_desc:0 "Our strength lies in our people, and in our ability to mobilize them quickly and effectively. Without favoritism or dogma, we arm our citizens and call them to serve—not for glory or vengeance, but because it is necessary. War is waged with discipline, not zealotry."

neutral_mercenary_policy:0 "Contractual Warfare"
neutral_mercenary_policy_desc:0 "Mercenaries are neither evil nor noble—they are simply a tool, wielded with discretion. We offer contracts to professionals of war, augmenting our forces without the need for blind patriotism. Loyalty bought is loyalty kept, so long as the coin flows."

neutral_naval_policy:0 "Fleet of Opportunity"
neutral_naval_policy_desc:0 "We command the seas not through manifest destiny, but through careful investment in maritime commerce and strategic deployment. Our sailors are traders as much as warriors, and our ports hum with enterprise. Naval power serves the state, not ideology."

neutral_religious_policy:0 "Doctrinal Balance"
neutral_religious_policy_desc:0 "In a world torn by dogma and zealotry, the path of moderation brings peace. By promoting coexistence without sacrificing order, we preserve harmony within our realm. Faith remains strong, but tempered with tolerance, binding our people together through understanding rather than division."

neutral_offensive_policy:0 "Calculated Conquest"
neutral_offensive_policy_desc:0 "Aggression, when tempered with reason, becomes a tool of stability. By striking swiftly and decisively, we ensure minimal unrest and long-term control. Nationalist flames are smothered before they can take hold, and the realm expands with both speed and certainty."

neutral_defensive_policy:0 "Network of Mutual Accord"
neutral_defensive_policy_desc:0 "Security need not rely on walls alone. Through a well-maintained web of diplomacy and fortified alliances, we deter would-be aggressors and preserve sovereignty without the constant need for war. In balance lies resilience."

neutral_quality_policy:0 "Professional Excellence"
neutral_quality_policy_desc:0 "Effective warfare is not won by fanaticism, but by competence. Our troops are drilled not to die for a cause, but to fight well and win efficiently. Every infantryman and cavalry rider is a product of pragmatic refinement — skilled, dependable, and deadly."

neutral_administrative_policy:0 "Strategic Governance"
neutral_administrative_policy_desc:0 "Power, wisely administered, flows smoothly from center to frontier. Through systematic oversight and infrastructural foresight, we reduce waste, suppress disorder, and support our armies without burdening the state. Pragmatism, not passion, sustains empire."


# EVIL POLICIES LOCALIZATION

evil_religious_policy:0 "Purge the Unclean"
evil_religious_policy_desc:0 "Faith is a weapon, and we wield it without pity. Through fire and steel, we root out heresy, silencing dissent with righteous fury. Converts bolster our prestige, their repentance feeding the strength of our theocracy. Only the faithful shall endure."

evil_economic_policy:0 "Exploitation Economy"
evil_economic_policy_desc:0 "Labor is a resource to be harvested, not honored. We squeeze every ounce of productivity from the backs of the broken, building an economy on suffering and command. Profit is extracted through control, not cooperation. The wealth of nations is the blood of the weak."

evil_administrative_policy:0 "Total Control Doctrine"
evil_administrative_policy_desc:0 "No corner of our realm escapes our gaze. We crush local autonomy, silence petty lords, and replace chaos with singular will. In this system, there is no freedom—only obedience. Through suppression, we ensure absolute cohesion and the perpetuation of our rule."

evil_innovativeness_policy:0 "Forbidden Knowledge"
evil_innovativeness_policy_desc:0 "Some call it madness, others heresy—but we see only potential. Forbidden arts and dark experiments yield power the timid dare not grasp. By embracing the unthinkable, we outpace our enemies and master forces that tear weaker empires asunder."

evil_diplomatic_policy:0 "Veiled Dagger"
evil_diplomatic_policy_desc:0 "Our diplomats wear masks of civility, but behind each handshake lies a hidden blade. Through lies, threats, and poisoned pacts, we manipulate the affairs of weaker nations, making puppets of princes and pawns of kings. Reputation is a tool for deceit, not trust."

evil_influence_policy:0 "Chains of Favor"
evil_influence_policy_desc:0 "We trade favors like poison-laced coin, binding our subjects and allies alike in webs of dependence. Through coercion, bribery, and threat, we bend the wills of others without drawing a sword. Subjugation is a matter of leverage, not loyalty."

evil_spy_policy:0 "Saboteurs Within"
evil_spy_policy_desc:0 "Our agents seep into enemy fortresses, undermining walls and minds alike. Siege is but a formality when sabotage leads the way. We do not batter down gates—we open them from within, with blade, bribe, or whispered lie."

evil_trade_policy:0 "Exploitative Exchange"
evil_trade_policy_desc:0 "Trade is not a matter of fairness — it is a battlefield. Our merchants do not barter; they dominate. With bribes, threats, and monopolies, we ensure our coin flows freely while others are left beggared. Wealth is power, and we shall hoard both."

evil_exploration_policy:0 "Ironbound Vessels"
evil_exploration_policy_desc:0 "Our ships are not just scouts — they are tools of conquest and domination. Heavily reinforced and far-reaching, they carry not just goods, but the will to subjugate. Where they sail, the weak will kneel or perish."

evil_expansion_policy:0 "Ruthless Dominion"
evil_expansion_policy_desc:0 "The world is vast, but it is not beyond our grasp. With cruel efficiency and tireless advance, we bring more lands to heel. Roads are paved with crushed resistance, and each new province feeds the ever-hungry machine of conquest."

evil_humanist_policy:0 "Cultural Subversion"
evil_humanist_policy_desc:0 "True conquest lies not only in steel, but in identity. With a velvet glove over an iron fist, we bend foreign minds until they forget who they once were. Cultures dissolve into the greater whole, their resistance fading with each passing year."

evil_infrastructure_policy:0 "Bound Labor"
evil_infrastructure_policy_desc:0 "Great works demand great sacrifice — though not our own. Through chains and cruelty, we harness the toil of the wretched to raise our monuments faster and cheaper. Their suffering is the mortar of our glory."

## Chaos Policies

 chaos_expansion_policy:0 "Forge of Destruction"
 desc_chaos_expansion_policy:0 "Let us lay bare the crust of the world. From its gaping wounds we shall extract the riches of the underworld."
 chaos_innovativness_policy:0 "Twisted Ingenuity"
 desc_chaos_innovativness_policy:0 "Freed from the constraints of morality, reality, and fiscal prudence, a rare few will birth countless monstrous creations and cultivate perverse ideas. Even the serveants of the Dark Gods dare not question the madness these minds unleash."
 chaos_diplomatic_policy:0 "Whispers of Corruption"
 desc_chaos_diplomatic_policy:0 "With a whisper, countless have bent to our will, who is anyone to oppose our will?"
 chaos_spy_policy:0 "Agents of Anarchy"
 desc_chaos_spy_policy:0 "Agents of Chaos sow seeds of discord and treachery, their subtle hands ensuring no realm is free from turmoil."
 chaos_influence_policy:0 "Crown of Command"
 desc_chaos_influence_policy:0 "The Crown of Command has been worn in countless battles. Its wearer is given great authority, instilling in his subjects an unbreakable loyalty."
 chaos_infrastructure_policy:0 "Dread Foundations"
 desc_chaos_infrastructure_policy:0 "We will reshape this world to our likening, by our will and our will alone."
 chaos_court_policy:0 "Brutal Meritocracy"
 desc_chaos_court_policy:0 "Only the strong are worthy to command, and only the cunning may survive. Our system ensures that power flows to those deserving of t, while the weak serve as stepping stones—or are ground into nothingness."
 chaos_exploration_policy:0 "Path of Conquest"
 desc_chaos_exploration_policy:0 "We shall live as the men in the golden ages did. They and we will not hide from the unkown, but face it head on. Every new frontier shall tremble beneath our advance."
 chaos_administrative_policy:0 "Order Through Chaos"
 desc_chaos_administrative_policy:0 "Maintaining order among a people whose very way of life is rooted in bloodshed and with a strong warrior's spirit is far more challenging than governing those whose culture is steeped in weakness. Thus, our administrators must undergo even greater training to meet the demands of such a populace."
 chaos_economic_policy:0 "Blood Price"
 desc_chaos_economic_policy:0 "The economy of Chaos is forged in the fires of conflict, where every coin is stained with the price of bloodshed and strife."
 chaos_humanist_policy:0 "Fortress of the Faithful"
 desc_chaos_humanist_policy:0 "Let us become a bastion for those who have seen the truth of Chaos, where unity and devotion form the foundation of an unbreakable sanctuary."
 chaos_religious_policy:0 "Gospel of Ruin"
 desc_chaos_religious_policy:0 "The dark gods demand devotion."
 chaos_trade_policy:0 "Web of Darkness"
 desc_chaos_trade_policy:0 "While those claimed by the blood-thirst revel in carnage, the subtle power of trade spreads Chaos further, unveiling its truth to those who might never face the blade."
 chaos_maritime_policy:0 "Tides of Destruction"
 desc_chaos_maritime_policy:0 "Mathlaan and his realm will bend to Chaos, as our Plague Fleets spread terror throughout the world. Let those who hide behind their walls of water know: We are coming for them."



## More Policies

human_innovativeness_policy:0 "Masters of Magic"
human_innovativeness_policy_desc:0 "Humans, through curiosity and ingenuity, have tapped deeply into arcane forces. Their flexible minds and relentless experimentation allow them to shape the magical arts with remarkable efficiency."

elven_innovativeness_policy:0 "Masters of Magic"
elven_innovativeness_policy_desc:0 "Elves were among the first mortals to channel the Winds of Magic. With centuries of experience and finely attuned minds, their mastery over the arcane is both elegant and terrifying."

greenskin_innovativeness_policy:0 "Willing to Try New Things"
greenskin_innovativeness_policy_desc:0 "Though brutish and chaotic, Greenskins are surprisingly open to 'new fighty things.' They readily adopt any weapon or tactic that makes smashing easier—whether stolen, copied, or invented in a brawl."

ogre_innovativeness_policy:0 "Ideas from Afar"
ogre_innovativeness_policy_desc:0 "Ogres are great travelers—when food or gold is involved. Along their journeys, they encounter foreign ideas and traditions, which they absorb and adapt in their own unique, brutal fashion."

lizardmen_innovativeness_policy:0 "Masters of Magic"
lizardmen_innovativeness_policy_desc:0 "Guided by the Great Plan and ancient temple-city archives, the Lizardmen wield arcane might with divine purpose. Their magical tradition is vast, ordered, and rooted in celestial wisdom."

human_religious_policy:0 "Witch Hunters"
human_religious_policy_desc:0 "Fanatical zeal and relentless persecution form the bedrock of human faith. Witch Hunters root out heresy, sorcery, and corruption wherever it hides, purifying the realm through fire and steel."

elven_religious_policy:0 "Maintain the Doctrine"
elven_religious_policy_desc:0 "Elven religion is deeply tied to tradition, balance, and ancient rituals. Their priests and scholars ensure that spiritual law is upheld with unwavering precision, strengthening their divine authority."

greenskin_religious_policy:0 "Conquer the Heathens"
greenskin_religious_policy_desc:0 "To the Greenskins, there's no need to preach—just smash. All who do not follow the Waaagh! must be conquered, their gods broken beneath the banner of Gork and Mork."

ogre_religious_policy:0 "Fat and Righteous"
ogre_religious_policy_desc:0 "To the Ogre Kingdoms, gluttony is divine. The faithful are those who eat well, fight hard, and honor the Great Maw. Their faith bolsters their strength and dulls the pain of battle."

lizardmen_religious_policy:0 "Certainty of Will"
lizardmen_religious_policy_desc:0 "The will of the Old Ones is law. The Lizardmen march with divine clarity, their armies driven by sacred purpose and unified under a single, unwavering truth."


human_economic_policy:0 "Well-Rounded Economy"
human_economic_policy_desc:0 "Humans thrive in nearly every terrain and trade system, building balanced economies that draw wealth from farms, markets, and mines alike. Their versatility ensures sustainable prosperity."

elven_economic_policy:0 "A Stable Economy"
elven_economic_policy_desc:0 "Elven economies favor long-term harmony over short-term gain. With wise stewardship and a deep connection to the land, Elven societies maintain prosperity with minimal disruption."

greenskin_economic_policy:0 "A Looting Economy"
greenskin_economic_policy_desc:0 "Why toil when you can take? Greenskins grow rich not through labor or trade, but by raiding and pillaging. Looting is their economy—violent, chaotic, and endlessly profitable."

ogre_economic_policy:0 "Domination of Trade"
ogre_economic_policy_desc:0 "Ogre mercantile power comes from fear and force. By controlling mountain passes and demanding tribute, they carve out a brutal monopoly on vital trade routes."

lizardmen_economic_policy:0 "A Stable Economy"
lizardmen_economic_policy_desc:0 "Guided by the Great Plan, Lizardmen maintain rigid yet enduring systems of governance and tribute. Their society flows with divine order, resisting chaos and fostering lasting wealth."


human_expansion_policy:0 "Great Alliances"
human_expansion_policy_desc:0 "Human realms expand not only through conquest, but through diplomacy. By forging powerful alliances and building coalitions, they secure influence and legitimacy across vast territories."

elven_expansion_policy:0 "Esteemed Alliances"
elven_expansion_policy_desc:0 "Elves maintain selective but powerful diplomatic ties. Their refined courts and enduring legacies earn them prestige and trust among foreign powers, strengthening their position abroad."

greenskin_expansion_policy:0 "Rapid Expansion"
greenskin_expansion_policy_desc:0 "When the Waaagh! starts, it doesn’t stop. Greenskins overrun lands swiftly, tearing down resistance with brutal sieges and crude but effective conquest tactics."

ogre_expansion_policy:0 "Foreign Trading Posts"
ogre_expansion_policy_desc:0 "The Ogre Kingdoms often establish outposts and mercenary camps far from home. These fortified enclaves secure trade routes and extend Ogre influence into distant lands."

lizardmen_expansion_policy:0 "Spawning Colonies"
lizardmen_expansion_policy_desc:0 "Wherever the Lizardmen settle, they construct sacred spawning pools. These ensure that even the most distant colony is a fully functioning part of the Great Plan, producing warriors and workers alike."


human_administrative_policy:0 "Universities of Study"
human_administrative_policy_desc:0 "Human nations invest heavily in centers of learning. From ancient colleges to imperial universities, these institutions accelerate technological progress and administrative reform."

elven_administrative_policy:0 "Respectful Bureaucracy"
elven_administrative_policy_desc:0 "Elven administration values harmony, hierarchy, and respect. Their long-lived officials foster loyal estates and subjects, ensuring enduring stability across their realms."

greenskin_administrative_policy:0 "Rapid Integration"
greenskin_administrative_policy_desc:0 "Conquest is just the beginning. Greenskins waste no time in tearing down the old and imposing their rule, quickly suppressing unrest and scarring the land into submission."

ogre_administrative_policy:0 "Food Logistics"
ogre_administrative_policy_desc:0 "For Ogres, war and administration are both fueled by one thing: food. Efficient supply lines and meat-based tribute ensure loyal subjects and sustained military strength."

lizardmen_administrative_policy:0 "Modern Administration"
lizardmen_administrative_policy_desc:0 "Though ancient in origin, Lizardmen governance is highly advanced. Their temple-cities are run with mathematical precision, allowing rapid reforms and unmatched administrative efficiency."



human_humanist_policy:0 "An Open Empire"
human_humanist_policy_desc:0 "Human realms span many cultures and creeds. By embracing tolerance and cooperation, these empires turn diversity into strength, offering a home for all under a banner of unity."

elven_humanist_policy:0 "Citizens, but Not Equal"
elven_humanist_policy_desc:0 "Elves are capable of limited tolerance—but always within hierarchy. Lesser races may be granted a voice, yet the Elves remain ever the stewards and superiors of any realm they grace."

greenskin_humanist_policy:0 "Non-Discrimination"
greenskin_humanist_policy_desc:0 "Greenskins care not for creed, color, or custom—only strength. So long as you fight, loot, or survive the punch-ups, you're part of the Waaagh!, no questions asked."

ogre_humanist_policy:0 "Feast for Everybody"
ogre_humanist_policy_desc:0 "Few things bring peace like a full belly. Under the rule of the Great Maw, all who contribute to the feast—whether as guests or meat—are welcome. This crude harmony keeps Ogre lands unnaturally calm."

lizardmen_humanist_policy:0 "Less-Discrimination"
lizardmen_humanist_policy_desc:0 "Though guided by the Great Plan, the Lizardmen have come to see the usefulness of many peoples. As long as order is preserved, even outsiders may serve a purpose in the cosmic design."


neutral_infrastructure_policy:0 "Impartial Bureaucracy"
neutral_infrastructure_policy_desc:0 "Unburdened by dogma or ambition, a neutral administration emphasizes fairness, efficiency, and consistency. This disciplined governance reduces corruption and tightens control over the provinces."

human_infrastructure_policy:0 "Monument Builders"
human_infrastructure_policy_desc:0 "From majestic cathedrals to imperial bastions, human civilizations mark their glory with monumental works. Skilled architects and vast labor networks ensure these projects rise swiftly and splendidly."

elven_infrastructure_policy:0 "Elven Roads"
elven_infrastructure_policy_desc:0 "Graceful and enduring, Elven roadways weave through forests and across mountains with minimal impact on the land. These ancient routes promote travel, trade, and centralized development."

greenskin_infrastructure_policy:0 "Greenskin Roads"
greenskin_infrastructure_policy_desc:0 "Though crude and brutal in design, Greenskin 'roads'—often little more than beaten paths and looted causeways—serve their purpose: getting the horde where the smashing needs to happen."

ogre_infrastructure_policy:0 "Food Logistics"
ogre_infrastructure_policy_desc:0 "Everything in an Ogre kingdom revolves around food. Efficient supply chains and secure meat routes stabilize the realm, ensuring unrest is devoured before it grows."

lizardmen_infrastructure_policy:0 "Jungle Roads"
lizardmen_infrastructure_policy_desc:0 "Through dense jungles and ancient ruins, the Lizardmen maintain sacred causeways and mystic paths. These hidden routes enhance strategic mobility and reinforce their domain’s structural might."


good_spy_policy:0 "Spin Doctors"
good_spy_policy_desc:0 "Masters of subtlety and perception, these diplomats manipulate public opinion and foreign courts alike. With clever words and careful leaks, they reduce aggressive backlash while quietly mending relations."

dwarven_spy_policy:0 "Architectural Spies"
dwarven_spy_policy_desc:0 "Dwarfs apply engineering genius even to espionage. Their agents assess enemy fortifications with precision, relaying designs and weaknesses that lead to faster, more effective sieges."

undead_spy_policy:0 "Corrupting Influences"
undead_spy_policy_desc:0 "Necromantic whispers seep into enemy courts, sowing paranoia, betrayal, and moral decay. The undead thrive where trust withers, their influence spreading like a plague in the dark."

fimir_spy_policy:0 "Enemy Sabotage"
fimir_spy_policy_desc:0 "The Fimir dispatch twisted agents to weaken the foe from within—razing supplies, cursing ground, and ensuring that invaders bleed before they even clash."

skaven_spy_policy:0 "Steal Enemy Secrets"
skaven_spy_policy_desc:0 "Skaven spies crawl through sewers and shadows to uncover forbidden knowledge. From gunpowder to warpstone, no innovation is safe from their twitchy little hands."

beastfolk_spy_policy:0 "Learn Their Cities"
beastfolk_spy_policy_desc:0 "While seemingly savage, the Beastfolk watch from the wilds. They study city walls, supply lines, and weaknesses—waiting for the moment to tear it all down."

greenskin_spy_policy:0 "Learn Their Cities"
greenskin_spy_policy_desc:0 "Greenskins may not seem clever, but they remember where the walls are thin and the gates swing weakest. Spies help them find the soft spots to bash first."

ogre_spy_policy:0 "Merchant Blackmail"
ogre_spy_policy_desc:0 "Ogre mercantile agents rely on threats and extortion. Few merchants argue when their rivals are mysteriously crushed—or eaten. Intimidation opens more ports than diplomacy ever could."

lizardmen_spy_policy:0 "Find the Hidden Stores"
lizardmen_spy_policy_desc:0 "Guided by old glyphs and prophetic instinct, Lizardmen scouts uncover hidden caches of enemy wealth and resources, ensuring their sieges are well-fed and swift."

dwarven_diplomatic_policy:0 "Rival the Elves"
dwarven_diplomatic_policy_desc:0 "Dwarven courts are bastions of tradition and honor, with stone-hewn laws and ancestral precedence guiding every treaty. Though others boast refinement, few match the firm diplomacy of the Dawi."

undead_diplomatic_policy:0 "The Corpse Facade"
undead_diplomatic_policy_desc:0 "Shrouded in illusion, the undead present a convincing appearance of civility and sovereignty. Cloaked ambassadors and puppet lords speak with charming smiles—masking the rot beneath."

fimir_diplomatic_policy:0 "Bog-Cloaked Negotiations"
fimir_diplomatic_policy_desc:0 "Rarely seen and less trusted, the Fimir cloak their motives behind rituals, proxies, and false diplomacy. Though monstrous in truth, they project just enough sophistication to deceive."

skaven_diplomatic_policy:0 "False Envoys"
skaven_diplomatic_policy_desc:0 "Skaven manipulate foreign powers with bribes, lies, and forged credentials. Though no one admits their existence, their shadowy embassies and counterfeit courts can influence entire realms."

beastfolk_diplomatic_policy:0 "Veiled Snouts"
beastfolk_diplomatic_policy_desc:0 "Some Beastlords have learned that survival may sometimes require masks. Through crude symbols or pliable agents, they forge temporary alliances, concealing their true savagery—barely."

greenskin_diplomatic_policy:0 "Loud Diplomacy"
greenskin_diplomatic_policy_desc:0 "As Waaagh!s grow and tribes unite, the world can no longer ignore the Greenskins. With booming voices and crude threats, they make their demands known—subtlety not required."

ogre_diplomatic_policy:0 "Clubs and Contracts"
ogre_diplomatic_policy_desc:0 "Ogre envoys are as comfortable at the negotiation table as on the battlefield. Representing mercenary clans or trade routes, they strike deals with gold in one hand and a club in the other."

lizardmen_diplomatic_policy:0 "Voice of the Old Ones"
lizardmen_diplomatic_policy_desc:0 "The Slann and their emissaries step beyond the jungle, guided by the Great Plan. With measured speech and ancient authority, they take their rightful place among worldly powers."

dwarven_trade_policy:0 "Protectionist Trade Guilds"
dwarven_trade_policy_desc:0 "Dwarfs guard their craftsmanship and commerce with stubborn pride. Their guilds impose strict control over trade, ensuring that Dawi-made goods dominate every market they reach."

undead_trade_policy:0 "Corrupting Merchants"
undead_trade_policy_desc:0 "The undead twist trade for their own ends. Merchants under their influence become agents of dark power—spreading both goods and corruption wherever they go."

fimir_trade_policy:0 "Defensive Trade Routes"
fimir_trade_policy_desc:0 "Emerging from their mist-shrouded strongholds, the Fimir safeguard trade paths with defensive wards and brutal retaliation. Their markets flourish behind walls of fear and fog."

skaven_trade_policy:0 "Smuggled to Skavenblight"
skaven_trade_policy_desc:0 "Skaven trade is secretive, underhanded, and shockingly effective. Black-market networks and hidden tunnels funnel wealth toward the Under-Empire, all under the noses of unsuspecting surface dwellers."

beastfolk_trade_policy:0 "Plunder-for-Profit"
beastfolk_trade_policy_desc:0 "Though savage, the Beastfolk learn to repurpose loot into economic strength. By trading what they seize or forge in the wilds, they begin to shape a primitive, yet growing economy."

greenskin_trade_policy:0 "Bashed Trade Routes"
greenskin_trade_policy_desc:0 "Trade flows best when no one dares interfere. Greenskins bash threats off the roads and collect hefty tolls from anyone foolish enough to argue. It’s crude—but it works."

ogre_trade_policy:0 "Merchant Informants"
ogre_trade_policy_desc:0 "Ogres plant informants in trade hubs and caravans, sniffing out targets worth sacking or taxing. Their merchants are part traders, part spies—and entirely dangerous."

lizardmen_trade_policy:0 "Sacred Trade Paths"
lizardmen_trade_policy_desc:0 "In accordance with the Great Plan, Lizardmen establish and protect sacred routes that channel both wealth and cosmic purpose. These paths wind through jungle and ruin, guided by divine alignment."

dwarven_exploration_policy:0 "Overseas Karak Ventures"
dwarven_exploration_policy_desc:0 "Though slow to wander, the Dwarfs invest heavily when they do. New colonies are founded as distant karaks, built with careful planning and steady growth worthy of the ancestors."

undead_exploration_policy:0 "Restless Colonial Legions"
undead_exploration_policy_desc:0 "The dead require neither comfort nor rest. Tireless zombie settlers and skeletal laborers spread across new lands with unnatural speed, raising silent colonies in record time."

fimir_exploration_policy:0 "Mist‑Shrouded Enclaves"
fimir_exploration_policy_desc:0 "Where the Fimir settle, fog and dread follow. Their hidden colonies grow slowly but surely, fortified by secrecy and the dark power of their marsh‑bound sorcery."

skaven_exploration_policy:0 "Endless Burrowing Swarms"
skaven_exploration_policy_desc:0 "Wherever new land appears, Skaven multiply beneath it. Tunnels spread, warrens deepen, and colonies swell with overwhelming speed—often before the surface world even notices."

beastfolk_exploration_policy:0 "Living Warherds at Sea"
beastfolk_exploration_policy_desc:0 "Beastfolk vessels are crude but resilient, crewed by savage warherds that endure storms and hunger alike. Their roaming fleets push farther into the unknown than reason should allow."

greenskin_exploration_policy:0 "Bare‑Bones Voyaging"
greenskin_exploration_policy_desc:0 "Greenskins care little for supplies or safety. With fewer rations and reckless courage, they push ramshackle fleets across distant waters that would stop saner sailors."

ogre_exploration_policy:0 "Wandering Mercenary Outposts"
ogre_exploration_policy_desc:0 "Ogres traveling abroad establish camps that quickly become hubs of trade, intimidation, and opportunity. Even far from home, their presence bends foreign commerce to their will."

lizardmen_exploration_policy:0 "Recovered Secrets of the Old Ones"
lizardmen_exploration_policy_desc:0 "Exploration reveals forgotten plaques, ruined observatories, and hidden truths left by the Old Ones. Each discovery strengthens the Lizardmen’s understanding of war and destiny."


good_maritime_policy:0 "Diplomatic Envoy Fleets"
good_maritime_policy_desc:0 "Specialized vessels carry ambassadors, envoys, and agents across the seas at remarkable speed. These swift diplomatic ships ensure that influence and negotiation arrive ahead of war."

evil_maritime_policy:0 "Brutal Naval Tactics"
evil_maritime_policy_desc:0 "No quarter is given at sea. Ruthless boarding actions, fearsome weapons, and the promise of no mercy define these tactics, breaking enemy morale before their ships break apart."


dwarven_maritime_policy:0 "Ironclad Naval Guilds"
dwarven_maritime_policy_desc:0 "Though better known for mountain halls than ocean waves, the Dwarfs maintain strict naval recruitment through disciplined guilds. Every crewman is trained, contracted, and sworn to their post."

undead_maritime_policy:0 "Unpaid Dead Crews"
undead_maritime_policy_desc:0 "The great advantage of necromantic fleets is cost-efficiency. Crews of rotting sailors require no pay, rest, or food—only direction. Building ships for the dead is cheaper in every sense."

fimir_maritime_policy:0 "Boarding Terrors"
fimir_maritime_policy_desc:0 "The Fimir strike from fog-choked seas, boarding enemy vessels in brutal ambushes. Their strength and savagery make them terrifying opponents in close-quarters naval combat."

beastfolk_maritime_policy:0 "Rafts Without Ribbons"
beastfolk_maritime_policy_desc:0 "Beastfolk ships are crude, ugly, and purely functional. They waste nothing on ornamentation or luxury—only what floats and fights makes the cut."

greenskin_maritime_policy:0 "Waaagh! on the Waves"
greenskin_maritime_policy_desc:0 "Why stop the Waaagh! at the shoreline? With ramshackle ships and explosive enthusiasm, Greenskin fleets bring their chaotic morale and fury onto the high seas."

ogre_maritime_policy:0 "Seaborne Brute Traders"
ogre_maritime_policy_desc:0 "Ogre traders patrol the seas in heavy ships filled with muscle and gold. Their booming mercantile presence builds naval tradition just as easily as it builds profit."

lizardmen_maritime_policy:0 "Sea‑Bound Temple Trade"
lizardmen_maritime_policy_desc:0 "Lizardmen fleets transport sacred goods, relics, and artifacts to distant shores in accordance with the Great Plan. Their ships extend both divine will and trade power far across the seas."


dwarven_influence_policy:0 "Ruler of the Karaks"
dwarven_influence_policy_desc:0 "From the deepest holds to the highest peaks, Dwarven lords rule with ancient authority. Their vassals—bound by oath, honor, or grudges—rarely dare defy the will of the Karak."

fimir_influence_policy:0 "Delegated Dominion"
fimir_influence_policy_desc:0 "Fimir rulers often leave mundane rule to trusted thralls, daemons, or swampbound underlings. This decentralization frees their mystic leaders to focus on greater schemes."

skaven_influence_policy:0 "Undermining Alliances"
skaven_influence_policy_desc:0 "Even among supposed allies, the Skaven sow deceit and sabotage. Spies whisper in every court while cunning schemes ease the assimilation of lesser factions into the Under-Empire."

beastfolk_influence_policy:0 "Herdlord Vassalage"
beastfolk_influence_policy_desc:0 "Stronger herdstones dominate the weak, forming loose but brutal networks of subservient tribes. Leadership is maintained not by bureaucracy—but through raw power and fear."

greenskin_influence_policy:0 "Smash and Delegate"
greenskin_influence_policy_desc:0 "The biggest boss crushes the strongest rivals, then lets the survivors run what’s left—until they mess up. It’s a crude, but oddly effective system of delegated rule."

ogre_influence_policy:0 "Tribute Commanders"
ogre_influence_policy_desc:0 "Powerful Ogres entrust lesser camps to manage tribute and order. In return, these underbosses maintain regional control, keeping the greater horde fed, feared, and free to roam."

lizardmen_influence_policy:0 "Architects of Dominion"
lizardmen_influence_policy_desc:0 "Every province, ally, and annexation serves the Great Plan. Guided by ancient tablets and Slann vision, the Lizardmen integrate territories with ritual precision and timeless patience."

undead_influence_policy:0 "Bring Out Your Dead"
undead_influence_policy_desc:0 "Every graveyard is a recruitment ground, and every vassal a source of fresh corpses. Undead overlords raise armies and fleets not from living subjects—but from the fallen, ensuring their dominion never sleeps."


evil_court_policy:0 "Fearful Advisors"
evil_court_policy_desc:0 "In dark courts where terror rules, advisors do not haggle for gold—they serve out of fear. A word out of place may cost them their lives, ensuring loyalty and... competitive rates."

dwarven_court_policy:0 "For the Good of the Holds"
dwarven_court_policy_desc:0 "Dwarven advisors serve not for coin or glory, but for the prosperity of the Karaks. Their loyalty and discipline reduce costs while ensuring wise and stable governance."

undead_court_policy:0 "Bound Advisors"
undead_court_policy_desc:0 "Why pay a courtier when you can bind one in undeath? Through necromantic control, the undead maintain a staff of eternally loyal—if grim—administrators at minimal cost."

fimir_court_policy:0 "Trappings of Power"
fimir_court_policy_desc:0 "While the Fimir are creatures of shadow and strength, their courts are adorned with dread pageantry. By displaying mystic authority and terrifying prestige, they inspire loyalty and bolster their reputation."

skaven_court_policy:0 "Schemes Behind the Throne"
skaven_court_policy_desc:0 "In Skaven courts, every advisor is a plotter, and every scheme breeds innovation. The warp-choked politics of the Under-Empire paradoxically fuel progress—even if loyalty is always temporary."

beastfolk_court_policy:0 "Tokens of Rule"
beastfolk_court_policy_desc:0 "Among the Beastfolk, even crude symbols of courtly power—totems, skull-thrones, and roaring champions—can enforce loyalty and elevate the warherd’s stature among allies and rivals."

greenskin_court_policy:0 "Smashlords of the Court"
greenskin_court_policy_desc:0 "The biggest and loudest gets to speak. Greenskin warbosses surround themselves with brutal generals, not scribes, and use fear and fists to maintain a form of courtly command."

ogre_court_policy:0 "Fist-Bound Councils"
ogre_court_policy_desc:0 "Ogre advisors are chosen for their strength and cunning. Serving on pain of being eaten keeps them motivated, and the court becomes a brutal council of warriors and warlords."

lizardmen_court_policy:0 "Saurus Lords Ascendant"
lizardmen_court_policy_desc:0 "In times of war, the Slann empower the Saurus warrior-caste to lead. These generals serve both as military commanders and extensions of divine will, efficiently guiding the armies of the Great Plan."


neutral_aristocracy_policy:0 "Diverse Aristocracy"
neutral_aristocracy_policy_desc:0 "A realm ruled by nobles of many cultures can temper unrest and foster acceptance. Through inclusive governance, even the proudest aristocrats can serve a greater, unified realm."

dwarven_aristocracy_policy:0 "Noble Holds of Stone"
dwarven_aristocracy_policy_desc:0 "Dwarven noble clans maintain deep fortresses and ancestral halls. Their mastery of defensive warfare and frugal stewardship ensures both durability and lower maintenance costs."

undead_aristocracy_policy:0 "Undead Retinues"
undead_aristocracy_policy_desc:0 "In undeath, aristocratic privilege is eternal. Noble commanders lead skeletal hosts, bolstered by dark magic and ceaseless drills, reducing arcane strain and increasing military efficiency."

fimir_aristocracy_policy:0 "Swamp‑Crowned Nobility"
fimir_aristocracy_policy_desc:0 "Fimir aristocrats rule murky domains with absolute authority. Their presence suppresses resistance and lends mystic legitimacy abroad, though their courts remain veiled in secrecy."

skaven_aristocracy_policy:0 "Warp-Lab Aristocrats"
skaven_aristocracy_policy_desc:0 "Among the Skaven, scientific power and noble rank go claw-in-claw. Ruling families sponsor horrific laboratories, breeding innovation and eager leaders with disturbing efficiency."

human_aristocracy_policy:0 "Arcane Peerage"
human_aristocracy_policy_desc:0 "Among human nobles, magical education is increasingly a mark of status. From the colleges of Altdorf to the towers of Bretonnia, noble scions are trained in both rulership and sorcery."

elven_aristocracy_policy:0 "Ideological Nobility"
elven_aristocracy_policy_desc:0 "Elven aristocrats are not merely rulers, but embodiments of ideals—discipline, duty, and sacrifice. Their presence inspires the armies they command to fight with unshakable resolve."

good_plutocracy_policy:0 "A Land to Protect"
good_plutocracy_policy_desc:0 "Even merchant republics must be defended. This policy ensures disciplined militias and fortified cities, protecting prosperity through unity and strength."

neutral_plutocracy_policy:0 "Tactical Opportunism"
neutral_plutocracy_policy_desc:0 "A flexible state adapts quickly—on both battlefield and ballot. Agile governance and swift military operations ensure no moment of advantage is wasted."

dwarven_plutocracy_policy:0 "Guild Siege Doctrine"
dwarven_plutocracy_policy_desc:0 "Dwarven merchants and engineers collaborate to refine siegecraft, combining industry and war to break enemy defenses and reform the realm's structure alike."

undead_plutocracy_policy:0 "Every Head a Vote"
undead_plutocracy_policy_desc:0 "In undeath, representation is eternal. Lich-lords tally the will of their thralls, raising reform and morale alike from the crypt of consensus."

fimir_plutocracy_policy:0 "Bogbound Congress"
fimir_plutocracy_policy_desc:0 "Swamp-dwelling Fimir practice a strange republic of whispers and ritual. Their decentralized governance adapts to change while expanding control over distant marches."

skaven_plutocracy_policy:0 "Rat-Council Manipulation"
skaven_plutocracy_policy_desc:0 "Under the guise of equality, the Skaven Council grants mock votes to slaves while suppressing revolt and bolstering morale through illusion and fear."

beastfolk_plutocracy_policy:0 "Feral Free Markets"
beastfolk_plutocracy_policy_desc:0 "Unshackled by royal decrees, beastfolk traders establish thriving black markets and jungle routes, expanding influence through barter, not banners."

human_plutocracy_policy:0 "Reform from the Streets"
human_plutocracy_policy_desc:0 "Driven by ambitious guilds and urban elites, humans pioneer reform and embrace innovation, lowering barriers to progress through market-driven ideas."

elven_plutocracy_policy:0 "Noble Mandate of Reform"
elven_plutocracy_policy_desc:0 "Elven plutocrats wield prestige like a scalpel. Guided by aesthetics and tradition, they push reforms not for profit—but for perfection."


good_theocracy_gov_policy:0 "Radiant Zeal"
good_theocracy_gov_policy_desc:0 "The faithful shine not through conquest but unity. This policy uplifts religious structures, divine authority, and spiritual strength—regardless of tradition."

neutral_theocracy_gov_policy:0 "March of the Faithful"
neutral_theocracy_gov_policy_desc:0 "Our cause knows no borders. Devotees march swiftly, armed with righteous resolve and emboldened by divine mandate against heathens and heretics alike."

dwarven_theocracy_gov_policy:0 "Stonebound Piety"
dwarven_theocracy_gov_policy_desc:0 "Deep within the mountain holds, devotion is carved in stone. Be it through chants or rituals, Dwarven zeal strengthens unity and sacred traditions."

undead_theocracy_gov_policy:0 "Eternal Doctrine"
undead_theocracy_gov_policy_desc:0 "Death is not the end, but a beginning. Bound by necrotic rituals and sacred oaths, the faithful dead serve the divine in undeath, endlessly preserving religious power."

fimir_theocracy_gov_policy:0 "Wade Through Faith"
fimir_theocracy_gov_policy_desc:0 "Mired in both swamp and superstition, Fimir crusaders strike with spiritual purpose. Faith grants them speed—and war claims the rest."

skaven_theocracy_gov_policy:0 "Sacred Verminhood"
skaven_theocracy_gov_policy_desc:0 "All hail the Great Prophet of the Under-Gods! Fanatic fervor and relentless preaching bind the clans in sacred obedience—and chaotic religious growth."

beastfolk_theocracy_gov_policy:0 "Totemic Ascendancy"
beastfolk_theocracy_gov_policy_desc:0 "Ancestor spirits, primal gods, and tribal rites all unite the beastfolk in sacred harmony. Every war drum echoes divine truth."

human_theocracy_gov_policy:0 "Sanctified Orders"
human_theocracy_gov_policy_desc:0 "Religious authority bolsters not only faith, but arms. Through knightly orders and sacred decrees, divine power fuels spiritual unity and battlefield resilience."

elven_theocracy_gov_policy:0 "Grace of the Eternal"
elven_theocracy_gov_policy_desc:0 "Elven devotion flows like song—graceful yet unshakable. Through harmony, vision, and an ageless pursuit of divine balance, faith guides every policy and war alike."


dwarven_offensive_policy:0 "Siege Masters of Stone"
dwarven_offensive_policy_desc:0 "Centuries of mining and tunnel warfare have made Dwarves experts in breaking through the strongest defenses. No wall can withstand the hammer and powder of the Hold."

undead_offensive_policy:0 "Tide of the Dead"
undead_offensive_policy_desc:0 "Life ends, but war does not. With endless hordes of corpses to throw at enemy walls, the Undead need only time—and there’s plenty of that."

fimir_offensive_policy:0 "Brutal Charges"
fimir_offensive_policy_desc:0 "The Fimir favor unrelenting and overwhelming shock tactics, smashing through enemy lines with raw power and fury before the battle has time to evolve."

skaven_offensive_policy:0 "Saboteurs and Sappers"
skaven_offensive_policy_desc:0 "Before the siege begins, the enemy’s walls crumble from within. Skaven spies, explosives, and tunneling craft the perfect opening strike."

beastfolk_offensive_policy:0 "Relentless Advance"
beastfolk_offensive_policy_desc:0 "Though their tactics are raw, the Beastfolk refuse to break. They charge again and again, howling and bleeding, never relenting until victory—or extinction."

human_offensive_policy:0 "Guns of Civilization"
human_offensive_policy_desc:0 "Disciplined drill and precision artillery define human martial dominance. Their great cannons tear down enemy lines before infantry steps forth."

elven_offensive_policy:0 "Arcane Onslaught"
elven_offensive_policy_desc:0 "Elven mages rain fire and ruin upon their foes, wielding centuries of magical knowledge to devastate enemy formations with elegant precision."


dwarven_defensive_policy:0 "Immovable as the Mountain"
dwarven_defensive_policy_desc:0 "Deep in the stone, Dwarves build fortresses that defy time and siege. Their mastery of terrain and walls ensures no invader enters unscathed."

undead_defensive_policy:0 "Blighted Lands"
undead_defensive_policy_desc:0 "Rotting fields and cursed winds greet all who trespass. The longer an enemy stays, the closer they are to joining the ranks of the dead."

fimir_defensive_policy:0 "Mists of Suffering"
fimir_defensive_policy_desc:0 "The Fimir cloak their lands in toxic mists and unnatural decay. Invaders find themselves lost, poisoned, and weakened before battle is even joined."

skaven_defensive_policy:0 "Pestilent Warrens"
skaven_defensive_policy_desc:0 "The deeper one marches into Skaven tunnels, the more diseased and unstable the air becomes. Attrition is a weapon, and it never sleeps."

beastfolk_defensive_policy:0 "Fortified Wilderness"
beastfolk_defensive_policy_desc:0 "Twisting forests and crude but deadly strongholds make Beastfolk territory dangerous to assail. Their instincts guide them to reinforce key terrain quickly and cheaply."

human_defensive_policy:0 "Stalwart Resolve"
human_defensive_policy_desc:0 "Human defenders rally behind walls and banners with iron will. Every inch of land taken from them is soaked in blood—and earns them lasting glory."

elven_defensive_policy:0 "Graceful Defenders"
elven_defensive_policy_desc:0 "Elves defend not with brute strength but elegant efficiency. Their prestige is born not just from conquest, but the flawless defense of their sacred lands."


dwarven_quality_policy:0 "Forge-Born Artillery"
dwarven_quality_policy_desc:0 "No race rivals the Dwarves in forging deadly precision weaponry. Dwarven artillery is the culmination of centuries of engineering mastery."

undead_quality_policy:0 "Grafted for War"
undead_quality_policy_desc:0 "By stitching the best parts of corpses together and reinforcing them with necrotic strength, these undead are reborn as tireless killing machines."

skaven_quality_policy:0 "Rust and Blood"
skaven_quality_policy_desc:0 "Equipping hordes of Skavenslaves with crude but effective weapons ensures overwhelming numbers remain lethal—even if expendable."

beastfolk_quality_policy:0 "Wild Regiment Training"
beastfolk_quality_policy_desc:0 "The raw power of beastfolk soldiers is tempered through disciplined drills and brutal sparring, creating savage yet coordinated units."

human_quality_policy:0 "Cavalry Traditions"
human_quality_policy_desc:0 "Mounted warfare is at the heart of human military pride. Well-bred horses and elite riders form a thunderous spearpoint against enemy lines."

elven_quality_policy:0 "Warden Archery Schools"
elven_quality_policy_desc:0 "Elven precision is legendary. From hidden glades to moonlit towers, their archers learn to strike swiftly, silently, and fatally from afar."


dwarven_quantity_policy:0 "Expand the Foundries"
dwarven_quantity_policy_desc:0 "Dwarves double down on their industrial might, expanding their subterranean forges and automated workshops to flood the markets with goods."

undead_quantity_policy:0 "Rebuild with Bone"
undead_quantity_policy_desc:0 "Construction is effortless when you have tireless undead workers. Structures rise quickly, and costs wither like flesh in the crypt."

fimir_quantity_policy:0 "Matriarchal Expansion"
fimir_quantity_policy_desc:0 "The ancient brooding rituals of the Fimir ensure a steady stream of warriors, with entire communities dedicated to birthing the next generation of soldiers."

skaven_quantity_policy:0 "Tunnels upon Tunnels"
skaven_quantity_policy_desc:0 "Skaven build not up, but *down*—and then sideways, and then again. Their cities overflow with ramshackle construction, breeding chaos and efficiency alike."

beastfolk_quantity_policy:0 "Sprawl of the Herd"
beastfolk_quantity_policy_desc:0 "As the herds grow, their crude but functional buildings multiply across the land, making room for ever more of their kind."

human_quantity_policy:0 "Booming Heartlands"
human_quantity_policy_desc:0 "With growing cities and fertile fields, human populations surge—bringing more taxes, more soldiers, and a promise of expansion."

elven_quantity_policy:0 "Balanced Renewal"
elven_quantity_policy_desc:0 "The Elves grow in harmony with the land. Subtle shifts in policy foster both population growth and a flourishing economy."


good_naval_policy:0 "Welcome Ships Abroad"
good_naval_policy_desc:0 "By embracing foreign ships in our harbors, we promote knowledge exchange and economic prosperity across the seas."

dwarven_naval_policy:0 "Ironclad Warships"
dwarven_naval_policy_desc:0 "Forged in deep holds and reinforced with steel, our warships endure where others splinter."

undead_naval_policy:0 "Crewless Crews"
undead_naval_policy_desc:0 "Who needs rations or wages when your fleet is manned by the restless dead?"

fimir_naval_policy:0 "Marsh-Born Vessels"
fimir_naval_policy_desc:0 "Crafted for shallow waters and sudden strikes, our galleys excel in confined and treacherous seas."

skaven_naval_policy:0 "Warpstone Firepower"
skaven_naval_policy_desc:0 "With volatile warpstone-infused cannons, our ships bring ruin from afar—if they don't explode first."

beastfolk_naval_policy:0 "Primal Sea Instincts"
beastfolk_naval_policy_desc:0 "As fierce on the waves as on land, our warriors resist fear and fight with feral determination even at sea."

human_naval_policy:0 "Naval Envoy Escorts"
human_naval_policy_desc:0 "A strong fleet ensures the safety and reach of our diplomatic efforts across distant shores."

elven_naval_policy:0 "Seaborne Envoys"
elven_naval_policy_desc:0 "Graceful ships guard our emissaries, projecting elven influence across the oceans with speed and serenity."


human_good_policy:0 "A Willing Empire"
human_good_policy_desc:0 "The strength of an empire lies not in coercion, but in unity. Through diplomacy and moral leadership, our subjects gladly follow."

elven_good_policy:0 "The Cadai"
elven_good_policy_desc:0 "Guided by the wise and ancient council of the Cadai, Elven governance balances spiritual clarity and worldly justice with divine grace."

greenskin_good_policy:0 "Unlikely Heroes"
greenskin_good_policy_desc:0 "Even the most chaotic of races can rise to the occasion. In moments of strange virtue, Greenskins find themselves the champions of good."

ogre_good_policy:0 "Likeable Ogres"
ogre_good_policy_desc:0 "Surprisingly charming and direct in their dealings, Ogres win over hearts—and trade routes—by being reliable and honest... mostly."

lizardmen_good_policy:0 "Cold-Blooded Harmony"
lizardmen_good_policy_desc:0 "Though alien in thought and form, the Lizardmen's ancient code promotes tolerance and balance between all faiths under their watchful eyes."


good_mercenary_policy:0 "Fair Dealings"
good_mercenary_policy_desc:0 "By treating hired swords with honesty and respect, we ensure their loyalty, reliability, and willingness to fight harder for our cause."

dwarven_mercenary_policy:0 "Pay in Gold"
dwarven_mercenary_policy_desc:0 "Dwarves pay their mercenaries in pure gold, ensuring both loyalty and financial stability across their war machine."

undead_mercenary_policy:0 "Flesh Reinforcements"
undead_mercenary_policy_desc:0 "Dead or alive, all serve. Our necromantic enhancements allow mercenaries to fight longer and cheaper than ever before."

fimir_mercenary_policy:0 "Tactics Shared in Shadow"
fimir_mercenary_policy_desc:0 "The Fimir's shadowy battlefield experience is passed to hired blades, boosting discipline and ensuring leadership is never lacking."

skaven_mercenary_policy:0 "Endless Claws"
skaven_mercenary_policy_desc:0 "Cheap, expendable, and numerous—Skaven mercenaries are bolstered by vile breeding pits and warped maintenance shortcuts."

beastfolk_mercenary_policy:0 "Savage Discipline"
beastfolk_mercenary_policy_desc:0 "Though wild in nature, our leaders instill ruthless efficiency in our hired troops, sharpening their tactics with primal ferocity."

human_mercenary_policy:0 "Masters of War"
human_mercenary_policy_desc:0 "Years of military tradition have produced expert instructors who raise the professionalism of even the lowliest mercenary company."

elven_mercenary_policy:0 "Blades of Elegance"
elven_mercenary_policy_desc:0 "Elven instructors impart refined martial technique to our hired swords, raising their combat discipline to exceptional levels."


dwarven_neutral_policy:0 "Dwarven Isolation"
dwarven_neutral_policy_desc:0 "By retreating inward and strengthening our mountain markets, we boost our internal trade and fortify our holds."

undead_neutral_policy:0 "We're Not Evil!"
undead_neutral_policy_desc:0 "It takes relentless diplomacy to convince the world we’re not evil reanimated horrors. More diplomats and better relations help our case."

fimir_neutral_policy:0 "We're Not Evil!"
fimir_neutral_policy_desc:0 "Though feared and shunned, our diplomats work tirelessly to present a more… respectable image of the Fimir."

skaven_neutral_policy:0 "We're Not Evil!"
skaven_neutral_policy_desc:0 "Sure, we may gnaw through cities and spread plagues, but trust us—we're working on our reputation. More diplomats will help, yes-yes."

beastfolk_neutral_policy:0 "Imposing Merchants"
beastfolk_neutral_policy_desc:0 "Beastfolk may not be subtle, but our merchants dominate trade with brute force and presence, gaining more power at every post."

greenskin_neutral_policy:0 "We're Not Evil!"
greenskin_neutral_policy_desc:0 "With some polish and a few less raids, we might just convince people that we’re not all axe-swinging monsters."

ogre_neutral_policy:0 "Trade Flexibility"
ogre_neutral_policy_desc:0 "Ogres adapt quickly to new trade routes and forge unexpected diplomatic ties—often backed by intimidation or culinary skill."

lizardmen_neutral_policy:0 "Protection from the Outside"
lizardmen_neutral_policy_desc:0 "Our society stands united behind ancient faiths, protected by strong walls and a deep distrust of the outside world."


dwarven_evil_policy:0 "Subjugate Outsiders"
dwarven_evil_policy_desc:0 "To secure the holds, all who live beyond must be brought under our rule—through forced integration and cultural domination."

undead_evil_policy:0 "Mind-Washing Raising"
undead_evil_policy_desc:0 "Those resurrected under our will have no need for nationalism. Their past loyalties are erased, replaced by perfect obedience."

fimir_evil_policy:0 "Unbounded Raiding Tactics"
fimir_evil_policy_desc:0 "The Fimir embrace chaos and destruction—sacking settlements, stripping lands bare, and leaving only fear in their wake."

skaven_evil_policy:0 "Warp-Fueled Plundering"
skaven_evil_policy_desc:0 "Driven by the lust for warpstone and conquest, Skaven armies surge forward with little regard for life or stability."

beastfolk_evil_policy:0 "Savage Pillaging Doctrine"
beastfolk_evil_policy_desc:0 "For the beastfolk, war is life. Looting and burning are not just strategy—they are tradition and glory."

human_evil_policy:0 "An Evil Empire"
human_evil_policy_desc:0 "We cloak our tyranny in law and ceremony, projecting power over subject states while quietly tightening our imperial grip."

elven_evil_policy:0 "Glory of Ancient Fear"
elven_evil_policy_desc:0 "Once, our dominion inspired awe and terror. We shall rekindle that ancient fear, binding our subjects through reverence and dread."

dwarven_chaos_policy:0 "Unyielding Training"
dwarven_chaos_policy_desc:0 "Even amidst the chaos, the Dwarves maintain a rigid discipline, forging elite warriors through tireless drills and tradition."

undead_chaos_policy:0 "Horrors Beyond Reckoning"
undead_chaos_policy_desc:0 "The undead march not with courage, but with the weight of unspeakable terror. Their mere presence shatters the resolve of mortals."

fimir_chaos_policy:0 "Unstoppable Raiding"
fimir_chaos_policy_desc:0 "The Fimir harness the chaos of war to strike swiftly and without mercy, draining the land of its riches before vanishing into mist."

skaven_chaos_policy:0 "Tunnelborne Havoc"
skaven_chaos_policy_desc:0 "Skaven raids surge from the shadows, relentless and disorderly. In chaos, they thrive—looting, gnawing, and leaving ruin behind."

beastfolk_chaos_policy:0 "Storm of Claws"
beastfolk_chaos_policy_desc:0 "A tide of primal fury, the beastfolk need no order or plan. Where chaos reigns, they find strength in raw destruction and plunder."

human_chaos_policy:0 "Race of Corruption"
human_chaos_policy_desc:0 "Order is a façade. Beneath it lies ambition, conquest, and the will to reshape the world in our image—through conversion or assimilation."

elven_chaos_policy:0 "Courts of Chaos"
elven_chaos_policy_desc:0 "The elegance of Elven diplomacy twists beneath the surface. Behind veils of silk and song, strange alliances bloom in maddening beauty."
