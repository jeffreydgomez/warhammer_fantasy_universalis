 dragon_isles_daimyo_one_seal:0 "Daimyo Under One Seal"
 dragon_isles_census_clans_mod:0 "Census of the Clans"
 dragon_isles_inner_isles_obey_mod:0 "The Isles Made One"
 dragon_isles_hostages_governors_mod:0 "Governors, Not Hostages"
