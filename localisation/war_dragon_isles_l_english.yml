 dragon_isles_events.1000.t:0 "The Shogun Beneath the Great Dragon"
 dragon_isles_events.1000.d:0 "The Old Ones' lies are forgotten in these blessed isles. In their place stand gem-bright shrines, volcanic sanctuaries, and silent ceremonies for the living dragons who coil above the mountains.\n\nThe dragons themselves are no kings. They accept tribute, sleep in caverns where rubies and sapphires catch the furnace-glow, and wake when pride or hunger stirs them. Around their indifference, the Lizardmen have built a politics of reverence: priests, daimyo, warrior clans, and temple courts all claiming to understand the will of the Great Dragon.\n\nThe Shogun rules as the Great Dragon's regent, but that title is a chain made of ceremony rather than iron. The isles are fractured by rival lineages, island cults, competing shrines, and petty wars whose losers are offered to flame or fang. The Dragon Cult is strongest, yet it is only one voice among many faiths that have taken root in the archipelago.\n\nBeyond the shores, the world presses closer. The Dragon Isles command the mouth of the River Ruin, and the wealth of their gems would tempt merchants, conquerors, and slavers alike. If the Chaos Dwarfs ever look south in strength, the isles may become their harbor, quarry, or battlefield.\n\nThe Great Dragon does not command. The Shogun must unite the clans, master the cults, guard the river mouth, and prove that forgotten servants of the Old Ones can still shape their own age.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 dragon_isles_events.1000.a:0 "Let the daimyo bow beneath the wings."

 dragon_isles_events.1.t:0 "Tribute of Gem-Scales"
 dragon_isles_events.1.d:0 "In the ruby caves above [event_target.GetName], temple drummers report a dragon stirring. Its cult interpreters insist the beast has accepted our rule only because it has not yet been insulted by hunger. Smoke leaks from vents the miners had sworn were dead.\n\nThe daimyo argue over whether the treasury should be opened. Tribute may turn the clans' fear into awe, but keeping the stones would satisfy warriors who see dragon worship as another chain around their spears."
 dragon_isles_events.1.a:0 "Lay the brightest gems before its fire."
 dragon_isles_events.1.b:0 "Keep the stones under seal."
 dragon_isles_events.1.c:0 "Let every shrine receive a share."

 dragon_isles_events.2.t:0 "Plaques Beneath the Ash"
 dragon_isles_events.2.d:0 "Ashslides near [event_target.GetName] have uncovered stone plaques older than the Dragon Cult. The glyphs are broken and half-melted, but the skink priests say they bear the marks of the Old Ones.\n\nThe dragon-priests want the slabs recarved as proof that the Great Dragon has inherited all forgotten mandates. Others whisper that even unreadable plaques deserve silence, for some memories should not be hammered into convenient shapes. The argument has already split the temple court."
 dragon_isles_events.2.a:0 "Preserve the glyphs, whatever they meant."
 dragon_isles_events.2.b:0 "Recarve them as omens of the Great Dragon."
 dragon_isles_events.2.c:0 "Seal them beneath ash."

 dragon_isles_events.3.t:0 "Hostages of the Lesser Daimyo"
 dragon_isles_events.3.d:0 "A lesser island lord has sent spawn-hostages to [event_target.GetName], each marked with powdered jade and bound by a draconic oath. It is an old custom, older than the Shogun's seal, meant to turn submission into sacred obligation. Their handlers do not meet our eyes.\n\nThe hostages could be raised among our own war-broods, giving us claws inside a rival lineage. Yet the clans also understand gem-oaths, and coin taken openly can be less troublesome than loyalty taken from frightened young warriors."
 dragon_isles_events.3.a:0 "Bind them into our war-broods."
 dragon_isles_events.3.b:0 "Demand gem-oaths instead."

 dragon_isles_events.4.t:0 "Sails at the River Ruin"
 dragon_isles_events.4.d:0 "Foreign sails gather near the mouth of the River Ruin, where merchants, raiders, and river captains all pretend to be only passing through. Some bring amber, steel, and Cathayan silks, while others carry rumors of Chaos Dwarf smoke far upstream. Everyone swears their cargo is harmless.\n\nThe islands cannot ignore that waterway. A patrol would remind every trader that the Dragon Isles have teeth, but tolls and harbor dues would fill the shrines without drawing spears from their racks. Whichever policy we choose will be noticed beyond the reefs.\n\nSome captains are already offering bribes for safe passage. Others count our patrol boats and smile too easily."
 dragon_isles_events.4.a:0 "Patrol the river mouth."
 dragon_isles_events.4.b:0 "Tax every foreign mast."
 dragon_isles_events.4.c:0 "License the pilots."

 dragon_isles_events.5.t:0 "The Volcanic Glass Forges"
 dragon_isles_events.5.d:0 "A new flow of black volcanic glass has cooled near [event_target.GetName], sharp enough to split scales and bright enough to catch the furnace-light. Skink artisans are already shaping it into spearheads, masks, and dragon-eyed idols.\n\nThe priesthood claims the glass is a gift from the mountain's sleeping wyrm. The merchants disagree only in private, where they count how much foreign buyers might pay for crates of polished obsidian. Left alone, the flow may harden into a sacred landmark. A careless chisel could still crack the whole vein."
 dragon_isles_events.5.a:0 "Arm the cohorts with glass blades."
 dragon_isles_events.5.b:0 "Strip the vein for the markets."
 dragon_isles_events.5.c:0 "Make idols for the shrines."
 dragon_isles_events.5.dd:0 "Let the glass cool in peace."

 dragon_isles_events.6.t:0 "A Dragon Wakes Hungry"
 dragon_isles_events.6.d:0 "The mountain above [event_target.GetName] has begun to breathe smoke. Hunters report that a dragon has woken beneath the vents, scattering cold-blooded herds and shaking villages with every irritated movement. Even the bravest shrine guards keep their shields close.\n\nNo decree can truly command such a creature. We can feed it until the clans calm themselves, or we can drive prey toward the valleys of those who have grown too comfortable testing our authority."
 dragon_isles_events.6.a:0 "Feed it before the panic spreads."
 dragon_isles_events.6.b:0 "Turn its hunger toward disloyal valleys."

 dragon_isles_events.7.t:0 "The Crimson Skull Pools"
 dragon_isles_events.7.d:0 "In a remote crater-shrine, red water bubbles through old spawning stones and stains the claws of every guard posted there. The Dragon Cult calls it volcanic blessing, but the blood-priests mutter Khorne's name when they think no one hears.\n\nSuch places are dangerous because they offer strength before they ask for obedience. Cleansing the pools would quiet the omens, while binding their frenzy to state rites could give the clans a sanctioned outlet for slaughter. Doing nothing may simply let the madness choose its own victims.\n\nThe old spawning guards ask for a command before the next moonrise. Their claws are already shaking."
 dragon_isles_events.7.a:0 "Cleanse the pools with costly rites."
 dragon_isles_events.7.b:0 "Chain the frenzy to our war rites."
 dragon_isles_events.7.c:0 "Let the frenzy exhaust itself."

 dragon_isles_events.8.t:0 "Cathayan Harmonists at Court"
 dragon_isles_events.8.d:0 "Cathayan harmonists have arrived at court with jade rods, star charts, and careful bows. They say the dragons of the heavens teach balance, and that even the island cults may be aligned without being broken. Their translators avoid the word worship.\n\nMany priests dislike their softness, but their methods calm disputes that our warriors would rather settle with obsidian. Whether we sponsor their rites or use them as interpreters, their presence will change how the clans hear one another."
 dragon_isles_events.8.a:0 "Sponsor their balanced rites."
 dragon_isles_events.8.b:0 "Keep them as court interpreters."
 dragon_isles_events.8.c:0 "Send them away with courtesy."

 dragon_isles_events.9.t:0 "Clutches in the Gem Caves"
 dragon_isles_events.9.d:0 "Miners beneath [event_target.GetName] have found eggs among the gems, each shell warm and veined with faint light. The oldest attendants insist they are dragon clutches, and that touching the surrounding treasure without permission invites fire from below.\n\nGuarding the caves would turn rumor into public reverence and keep rival claws away. Harvesting the loose gems would be profitable, but every hammer-strike risks waking more than greed. Some miners have already hidden shards in their mouths."
 dragon_isles_events.9.a:0 "Guard the clutches until they hatch."
 dragon_isles_events.9.b:0 "Gather only the loose gems."

 dragon_isles_events.10.t:0 "The Shogun's Drum"
 dragon_isles_events.10.d:0 "The great war-drum has sounded from the ceremonial terraces, its hide painted with old glyphs and new dragon-marks. Across the islands, daimyo listen for whether the summons means council, campaign, or the quiet beginning of another feud. No lord wishes to arrive last.\n\nTo strike the drum again would call the clans beneath the wings and remind them that reverence must still march. A quieter council may win fewer cheers, but it would let envoys trade concessions before pride hardens into spearpoints. Delay would be prudent, though prudence rarely impresses island war-leaders.\n\nThe Shogun's heralds wait beside the drum with lacquered masks and sharpened knives. Silence is also a message."
 dragon_isles_events.10.a:0 "Summon the clans beneath the wings."
 dragon_isles_events.10.b:0 "Convene the quiet council."
 dragon_isles_events.10.c:0 "Bind the latecomers with oath-hostages."
 dragon_isles_events.10.dd:0 "Delay the summons."

 dragon_isles_survey_river_ruin_mouth:0 "Survey the River Mouth"
 dragon_isles_survey_river_ruin_mouth_title:0 "Survey the River Mouth"
 dragon_isles_survey_river_ruin_mouth_desc:0 "The mouth of the River Ruin is half gate and half wound. We must chart every reef and channel before warmblood captains or Chaos Dwarf scouts know them better than our own pilots."
 dragon_isles_license_island_pilots:0 "Licensed Reef Pilots"
 dragon_isles_license_island_pilots_title:0 "Licensed Reef Pilots"
 dragon_isles_license_island_pilots_desc:0 "The reefs still answer to clan memory and private oaths. We must license the island pilots so local knowledge serves the Shogun rather than the next lord with gems to spend."
 dragon_isles_patrol_river_mouth:0 "Patrol the River Mouth"
 dragon_isles_patrol_river_mouth_title:0 "Patrol the River Mouth"
 dragon_isles_patrol_river_mouth_desc:0 "Foreign sails enter our waters smiling, lost, or lying. We must make regular patrols the first thing they see and the last thing they forget."
 dragon_isles_gem_toll_harbors:0 "Gem-Toll Harbors"
 dragon_isles_gem_toll_harbors_title:0 "Gem-Toll Harbors"
 dragon_isles_gem_toll_harbors_desc:0 "The harbors are rich, but clan custom still treats tolls as private prey. We must make gem dues a public law that feeds shrine, fleet, and throne together."
 dragon_isles_river_ruin_customs:0 "River Ruin Customs"
 dragon_isles_river_ruin_customs_title:0 "River Ruin Customs"
 dragon_isles_river_ruin_customs_desc:0 "The River Ruin carries profit, spies, and smoke. We must build customs that can tax the first, expose the second, and prepare for the third."
 dragon_isles_foreign_sails_under_license:0 "Foreign Sails Under License"
 dragon_isles_foreign_sails_under_license_title:0 "Foreign Sails Under License"
 dragon_isles_foreign_sails_under_license_desc:0 "Indish, Cathayan, and river captains now bargain at our reefs. We must let them come marked and watched, proving the unified isles can trade without being mastered."
 dragon_isles_dragonwake_admiralty:0 "Dragonwake Admiralty"
 dragon_isles_dragonwake_admiralty_title:0 "Dragonwake Admiralty"
 dragon_isles_dragonwake_admiralty_desc:0 "The island fleets are still trophies of clan pride. We must bind pilot houses, harbor wardens, and war-canoe captains into one admiralty under the dragonwake."
 dragon_isles_deepwater_dragon_harbors:0 "Deepwater Harbors"
 dragon_isles_deepwater_dragon_harbors_title:0 "Deepwater Harbors"
 dragon_isles_deepwater_dragon_harbors_desc:0 "Our beaches can guard the isles, but they cannot carry our ambitions. We must raise deepwater harbors fit for heavy hulls and dragon-shadowed convoys."
 dragon_isles_command_eastern_sea_lanes:0 "Command the Eastern Sea"
 dragon_isles_command_eastern_sea_lanes_title:0 "Command the Eastern Sea"
 dragon_isles_command_eastern_sea_lanes_desc:0 "The eastern sea lanes no longer end at our reefs. We must make every route toward Ind and the river markets account for the Dragon Isles."
 dragon_isles_scalded_delta_watch:0 "Scalded Delta Watch"
 dragon_isles_scalded_delta_watch_title:0 "Scalded Delta Watch"
 dragon_isles_scalded_delta_watch_desc:0 "Smoke, iron, and ambition gather in the Scalded Delta. We must hold the river's mouth before any northern power makes it a blade pointed at our islands."

 dragon_isles_shoguns_drum:0 "The Shogun's Drum"
 dragon_isles_shoguns_drum_title:0 "The Shogun's Drum"
 dragon_isles_shoguns_drum_desc:0 "The clans hear a hundred local drums and obey whichever is nearest. We must make the Shogun's summons louder than lineage, hunger, and private feud."
 dragon_isles_quiet_council:0 "The Quiet Council"
 dragon_isles_quiet_council_title:0 "The Quiet Council"
 dragon_isles_quiet_council_desc:0 "The daimyo answer insult with spearpoints because the code gives them no softer language. We must teach them to bargain in council before honor demands blood."
 dragon_isles_oath_hostages_of_the_daimyo:0 "Oath-Hostages of the Daimyo"
 dragon_isles_oath_hostages_of_the_daimyo_title:0 "Oath-Hostages of the Daimyo"
 dragon_isles_oath_hostages_of_the_daimyo_desc:0 "The old hostage rites keep obedience through fear. We must turn those frightened bonds into living bridges between clans."
 dragon_isles_break_private_wars:0 "Break the Private Wars"
 dragon_isles_break_private_wars_title:0 "Break the Private Wars"
 dragon_isles_break_private_wars_desc:0 "The daimyo still treat each valley as a battlefield waiting for permission. We must end private wars so the Dragon Isles can draw the sword as one realm."
 dragon_isles_daimyo_under_one_seal:0 "Daimyo Under One Seal"
 dragon_isles_daimyo_under_one_seal_title:0 "Daimyo Under One Seal"
 dragon_isles_daimyo_under_one_seal_desc:0 "The isles remain many realms in habit even when the Shogun's seal is known. We must unite the archipelago before dragons or strangers decide we are only prey divided by water."
 dragon_isles_census_of_the_clans:0 "Census of the Clans"
 dragon_isles_census_of_the_clans_title:0 "Census of the Clans"
 dragon_isles_census_of_the_clans_desc:0 "A unified realm cannot be governed by rumor, grudges, and remembered spawning pools. We must count the clans so obligation becomes administration."
 dragon_isles_inner_isles_obey:0 "The Isles Made One"
 dragon_isles_inner_isles_obey_title:0 "The Isles Made One"
 dragon_isles_inner_isles_obey_desc:0 "The Dragon Isles are united on the map, but unity must reach shrine, harbor, brood, and court. We must make one realm out of the habits left by many islands."
 dragon_isles_hostages_become_governors:0 "Governors, Not Hostages"
 dragon_isles_hostages_become_governors_title:0 "Governors, Not Hostages"
 dragon_isles_hostages_become_governors_desc:0 "The hostage generation understands both the Shogun's court and the clans that surrendered them. We must free them from the old cage and make them governors of a less fearful order."

 dragon_isles_shrine_of_the_great_dragon:0 "Shrine of the Great Dragon"
 dragon_isles_shrine_of_the_great_dragon_title:0 "Shrine of the Great Dragon"
 dragon_isles_shrine_of_the_great_dragon_desc:0 "The Great Dragon does not need a shrine, but the clans need one place to kneel. We must give the Shogun's rule a sacred center before reverence scatters into rival cults."
 dragon_isles_tribute_of_gem_scales:0 "Tribute of Gem-Scales"
 dragon_isles_tribute_of_gem_scales_title:0 "Tribute of Gem-Scales"
 dragon_isles_tribute_of_gem_scales_desc:0 "Dragons understand wealth, scent, and hunger before they understand law. We must bring tribute rich enough that even sleeping wyrms notice the Shogun's hand."
 dragon_isles_guard_the_sacred_clutches:0 "Guard the Sacred Clutches"
 dragon_isles_guard_the_sacred_clutches_title:0 "Guard the Sacred Clutches"
 dragon_isles_guard_the_sacred_clutches_desc:0 "Dragon eggs turn greed into blasphemy and fear into policy. We must guard the clutches as wards of the realm rather than trophies of any shrine or clan."
 dragon_isles_feed_the_waking_wyrms:0 "Feed the Waking Wyrms"
 dragon_isles_feed_the_waking_wyrms_title:0 "Feed the Waking Wyrms"
 dragon_isles_feed_the_waking_wyrms_desc:0 "A waking dragon can scatter villages as easily as enemies. We must feed and honor the wyrms without teaching the realm that terror is the only law."
 dragon_isles_regent_beneath_the_wings:0 "Beneath the Wings"
 dragon_isles_regent_beneath_the_wings_title:0 "Beneath the Wings"
 dragon_isles_regent_beneath_the_wings_desc:0 "The Shogun has ruled as the Great Dragon's regent, but too many hear only the chain in that title. We must make the regency a voice that dragons, clans, and shrines all recognize."
 dragon_isles_seal_the_great_dragons_mandate:0 "Confirm the Mandate"
 dragon_isles_seal_the_great_dragons_mandate_title:0 "Confirm the Mandate"
 dragon_isles_seal_the_great_dragons_mandate_desc:0 "The mandate is still wrapped in strict code and inherited fear. We must seal it as law while loosening the customs that keep the realm small."
 dragon_isles_gem_throne:0 "The Gem Throne"
 dragon_isles_gem_throne_title:0 "The Gem Throne"
 dragon_isles_gem_throne_desc:0 "The throne once displayed tribute and submission. We must make it shine as proof that wealth, shrine, shogunate, and dragon respect now share one seat."
 dragon_isles_wake_the_great_dragon:0 "Equal to the Dragon"
 dragon_isles_wake_the_great_dragon_title:0 "Equal to the Dragon"
 dragon_isles_wake_the_great_dragon_desc:0 "Dragons still remember us as attendants, tribute-bearers, and prey that learned ceremony. We must stand before them as a unified people strong enough to ride the same age beside them."

 dragon_isles_plaques_beneath_the_ash:0 "Plaques Beneath Ash"
 dragon_isles_plaques_beneath_the_ash_title:0 "Plaques Beneath Ash"
 dragon_isles_plaques_beneath_the_ash_desc:0 "The ash hides plaques older than the Dragon Cult and less obedient than court doctrine. We must recover them before priests grind memory into convenient omens."
 dragon_isles_catalogue_the_island_rites:0 "Catalogue the Island Rites"
 dragon_isles_catalogue_the_island_rites_title:0 "Catalogue the Island Rites"
 dragon_isles_catalogue_the_island_rites_desc:0 "Every island has its own offerings, taboos, and dragon stories. We must catalogue those rites before unity becomes another word for erasure."
 dragon_isles_shrine_courts_reconciled:0 "Shrine Courts Reconciled"
 dragon_isles_shrine_courts_reconciled_title:0 "Shrine Courts Reconciled"
 dragon_isles_shrine_courts_reconciled_desc:0 "The shrines settle feuds with sacred language and private knives. We must reconcile their courts so warriors are no longer the first answer to every prayer."
 dragon_isles_cathayan_harmonists_at_court:0 "Cathayans at Court"
 dragon_isles_cathayan_harmonists_at_court_title:0 "Cathayans at Court"
 dragon_isles_cathayan_harmonists_at_court_desc:0 "Cathay speaks of dragons as balance and order rather than hunger alone. We must learn what is useful in that language without surrendering our island soul."
 dragon_isles_a_thousand_shrines_one_voice:0 "A Thousand Shrines"
 dragon_isles_a_thousand_shrines_one_voice_title:0 "A Thousand Shrines"
 dragon_isles_a_thousand_shrines_one_voice_desc:0 "The isles may keep their thousand shrines, but they cannot keep a thousand rival verdicts. We must let many rites survive under one voice."
 dragon_isles_preserve_the_broken_glyphs:0 "Preserve the Broken Glyphs"
 dragon_isles_preserve_the_broken_glyphs_title:0 "Preserve the Broken Glyphs"
 dragon_isles_preserve_the_broken_glyphs_desc:0 "The broken glyphs do not flatter the Dragon Cult, and that is why they matter. We must preserve them so rule grows from memory rather than appetite."
 dragon_isles_faith_of_scale_and_ash:0 "Faith of Scale and Ash"
 dragon_isles_faith_of_scale_and_ash_title:0 "Faith of Scale and Ash"
 dragon_isles_faith_of_scale_and_ash_desc:0 "Fear of dragons built the first code, but fear alone cannot guide a free realm. We must join scale, ash, old glyphs, and island rites into a faith that can stand beside dragons."

 dragon_isles_obsidian_spearheads:0 "Feral Spear-Broods"
 dragon_isles_obsidian_spearheads_title:0 "Feral Spear-Broods"
 dragon_isles_obsidian_spearheads_desc:0 "The war-broods still fight like hunters chasing blood through smoke. We must keep their ferocity while teaching them to answer the Shogun's signal."
 dragon_isles_smoke_watched_barracks:0 "Chain the Hunt-Cohorts"
 dragon_isles_smoke_watched_barracks_title:0 "Chain the Hunt-Cohorts"
 dragon_isles_smoke_watched_barracks_desc:0 "Discipline feels like a chain to warriors born beside volcanic hunts. We must make that chain strong enough for battle and loose enough that the hunt still lives."
 dragon_isles_volcano_glass_forges:0 "Volcano-Glass Forges"
 dragon_isles_volcano_glass_forges_title:0 "Volcano-Glass Forges"
 dragon_isles_volcano_glass_forges_desc:0 "Volcanic glass is treated as omen, accident, and shrine gift. We must make it an industry of blades, masks, idols, and trade goods."
 dragon_isles_war_masks_of_black_glass:0 "War-Masks of Black Glass"
 dragon_isles_war_masks_of_black_glass_title:0 "War-Masks of Black Glass"
 dragon_isles_war_masks_of_black_glass_desc:0 "Fear once followed our warriors by accident. We must shape black glass masks so terror becomes a weapon chosen by the state."
 dragon_isles_rouse_the_mountain_wyrms:0 "Rouse the Fire Wyrms"
 dragon_isles_rouse_the_mountain_wyrms_title:0 "Rouse the Fire Wyrms"
 dragon_isles_rouse_the_mountain_wyrms_desc:0 "The lesser wyrms obey neither shogun nor shrine, and forced service would only earn fire. We must become strong enough that they choose to fight beside us."

 dragon_isles_events.11.t:0 "The Sacred Clutches"
 dragon_isles_events.11.d:0 "The clutch caves have become a second court. Guards whisper around warm shells, priests argue over the correct offerings, and daimyo envoys pretend they came only to pray. The old code says a dragon egg is never property, yet every faction has arrived with a different definition of protection.\n\nThe eggs cannot be treated as treasure without inviting outrage, but they cannot be left outside policy either. Whatever we decide will teach the clans whether future dragons are sacred guests, weapons of state, or partners whose first memory of us is restraint."
 dragon_isles_events.11.a:0 "Keep the clutch caves inviolable."
 dragon_isles_events.11.b:0 "Train the young handlers for war."
 dragon_isles_events.11.c:0 "Let gem-shell tithes feed the shrines."

 dragon_isles_events.12.t:0 "Measures of Jade and Smoke"
 dragon_isles_events.12.d:0 "The Cathayan harmonists have mapped our shrines with jade rods and star tables, then politely explained that most of them contradict one another. The priests are insulted, but not enough to stop listening. Even the daimyo understand that Cathay's dragons are obeyed through order as much as fear.\n\nTheir methods cannot replace island rites, and any attempt to do so would start a dozen holy disputes. Used carefully, however, their balances may help the court turn rival claims into one language of law without making the Dragon Isles a small Cathay in borrowed robes."
 dragon_isles_events.12.a:0 "Sponsor harmonist ritual law."
 dragon_isles_events.12.b:0 "Keep them as court translators."
 dragon_isles_events.12.c:0 "Fold their measures into shrine law."

 dragon_isles_events.13.t:0 "The Mountain Wyrms Stir"
 dragon_isles_events.13.d:0 "The volcanoes answer our forges with movement. Lesser wyrms scrape through old vents, shake ash from their crests, and test the fortress walls with curious claws. Older attendants insist this is not obedience, only curiosity from creatures that know strength when they smell it.\n\nNo beast that breathes fire is truly tame, and the old code would rather flatter dragons than bargain with them. We can house the wyrms as living fortifications, drive troops in their shadow, or bind new levies to the ash-scale rites that follow them."
 dragon_isles_events.13.a:0 "Build roosts into the forts."
 dragon_isles_events.13.b:0 "Drive the cohorts behind their fire."
 dragon_isles_events.13.c:0 "Muster the ash-scale levies."

 dragon_isles_events.14.t:0 "Dragon-Kin, Not Dragon-Prey"
 dragon_isles_events.14.d:0 "The mountain splits its silence. Gold eyes open in the smoke, shrine bells crack from the heat, and the oldest attendants fall flat before a shape too vast to flatter with titles. The Great Dragon looks first at the unified isles, then to the Scalded Delta, then across the sea roads toward Ind.\n\nFor the first time, the court does not crawl only because the code demands it. The Shogun's governors stand, the shrine-speakers hold their voices steady, and the war-broods do not bare their throats. The dragon sees a people that has learned discipline without remaining trapped inside it.\n\nWe have done more than wake what rules by sleeping. We have become strong enough to choose what kind of partnership the age will remember."
 dragon_isles_events.14.a:0 "The river and sea are our shared treasure road."
 dragon_isles_events.14.b:0 "Every war-host shall fly in its shadow."
 dragon_isles_events.14.c:0 "Let shrine, governor, and dragon speak as one."

 dragon_isles_surveyed_river_ruin_mouth:0 "Surveyed River Mouth"
 dragon_isles_licensed_island_pilots:0 "Licensed Reef Pilots"
