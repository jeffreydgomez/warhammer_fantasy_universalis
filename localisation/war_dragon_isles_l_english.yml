l_english:
 
 dragon_isles_events.1000.t:0 "The Shogun Beneath the Great Dragon"
 dragon_isles_events.1000.d:0 "The Old Ones are names in broken glyphs now. Their plaques remain in ruined halls and vine-choked temples, but few among the Dragon Isles still remember how to read them, and fewer still care to obey. In their place stand gem-bright shrines, volcanic sanctuaries, and cult-drums beaten for the living dragons who coil above the mountains.\n\nThe dragons themselves are no kings. They accept tribute, sleep in caverns where rubies and sapphires catch the furnace-glow, and wake when pride or hunger stirs them. Around their indifference, the Lizardmen have built a politics of reverence: priests, daimyo, warrior clans, and temple courts all claiming to understand the will of the Great Dragon.\n\nThe Shogun rules as the Great Dragon's regent, but that title is a chain made of ceremony rather than iron. The isles are fractured by rival lineages, island cults, competing shrines, and petty wars whose losers are offered to flame or fang. The Dragon Cult is strongest, yet it is only one voice among many faiths that have taken root in the archipelago.\n\nBeyond the shores, the world presses closer. The Dragon Isles command the mouth of the River Ruin, and the wealth of their gems would tempt merchants, conquerors, and slavers alike. If the Chaos Dwarfs ever look south in strength, the isles may become their harbor, quarry, or battlefield.\n\nThe Great Dragon does not command. The Shogun must unite the clans, master the cults, guard the river mouth, and prove that forgotten servants of the Old Ones can still shape their own age."
 dragon_isles_events.1000.a:0 "Let the daimyo bow beneath the wings."

 dragon_isles_events.1.t:0 "Tribute of Gem-Scales"
 dragon_isles_events.1.d:0 "In the ruby caves above [event_target.GetName], temple drummers report a dragon stirring. Its cult interpreters insist the beast has accepted our rule only because it has not yet been insulted by hunger. Smoke leaks from vents the miners had sworn were dead.\n\nThe daimyo argue over whether the treasury should be opened. Tribute may turn the clans' fear into awe, but keeping the stones would satisfy warriors who see dragon worship as another chain around their spears."
 dragon_isles_events.1.a:0 "Lay the brightest gems before its fire."
 dragon_isles_events.1.b:0 "Keep the stones under seal."
 dragon_isles_events.1.c:0 "Let every shrine receive a share."

 dragon_isles_events.2.t:0 "Plaques Beneath the Ash"
 dragon_isles_events.2.d:0 "Ashslides near [event_target.GetName] have uncovered stone plaques older than the Dragon Cult. The glyphs are broken and half-melted, but the skink priests say they bear the marks of the Old Ones.\n\nThe dragon-priests want the slabs recarved as proof that the Great Dragon has inherited all forgotten mandates. Others whisper that even unreadable plaques deserve silence, for some memories should not be hammered into convenient shapes. The argument has already split the temple court."
 dragon_isles_events.2.a:0 "Preserve the glyphs, whatever they meant."
 dragon_isles_events.2.b:0 "Recarve them as omens of the Great Dragon."
 dragon_isles_events.2.c:0 "Seal them beneath ash."

 dragon_isles_events.3.t:0 "Hostages of the Lesser Daimyo"
 dragon_isles_events.3.d:0 "A lesser island lord has sent spawn-hostages to [event_target.GetName], each marked with powdered jade and bound by a draconic oath. It is an old custom, older than the Shogun's seal, meant to turn submission into sacred obligation. Their handlers do not meet our eyes.\n\nThe hostages could be raised among our own war-broods, giving us claws inside a rival lineage. Yet the clans also understand gem-oaths, and coin taken openly can be less troublesome than loyalty taken from frightened young warriors."
 dragon_isles_events.3.a:0 "Bind them into our war-broods."
 dragon_isles_events.3.b:0 "Demand gem-oaths instead."

 dragon_isles_events.4.t:0 "Sails at the River Ruin"
 dragon_isles_events.4.d:0 "Foreign sails gather near the mouth of the River Ruin, where merchants, raiders, and river captains all pretend to be only passing through. Some bring amber, steel, and Cathayan silks, while others carry rumors of Chaos Dwarf smoke far upstream. Everyone swears their cargo is harmless.\n\nThe islands cannot ignore that waterway. A patrol would remind every trader that the Dragon Isles have teeth, but tolls and harbor dues would fill the shrines without drawing spears from their racks. Whichever policy we choose will be noticed beyond the reefs.\n\nSome captains are already offering bribes for safe passage. Others count our patrol boats and smile too easily."
 dragon_isles_events.4.a:0 "Patrol the river mouth."
 dragon_isles_events.4.b:0 "Tax every foreign mast."
 dragon_isles_events.4.c:0 "License the pilots."

 dragon_isles_events.5.t:0 "The Volcanic Glass Forges"
 dragon_isles_events.5.d:0 "A new flow of black volcanic glass has cooled near [event_target.GetName], sharp enough to split scales and bright enough to catch the furnace-light. Skink artisans are already shaping it into spearheads, masks, and dragon-eyed idols.\n\nThe priesthood claims the glass is a gift from the mountain's sleeping wyrm. The merchants disagree only in private, where they count how much foreign buyers might pay for crates of polished obsidian. Left alone, the flow may harden into a sacred landmark. A careless chisel could still crack the whole vein."
 dragon_isles_events.5.a:0 "Arm the cohorts with glass blades."
 dragon_isles_events.5.b:0 "Strip the vein for the markets."
 dragon_isles_events.5.c:0 "Make idols for the shrines."
 dragon_isles_events.5.dd:0 "Let the glass cool in peace."

 dragon_isles_events.6.t:0 "A Dragon Wakes Hungry"
 dragon_isles_events.6.d:0 "The mountain above [event_target.GetName] has begun to breathe smoke. Hunters report that a dragon has woken beneath the vents, scattering cold-blooded herds and shaking villages with every irritated movement. Even the bravest shrine guards keep their shields close.\n\nNo decree can truly command such a creature. We can feed it until the clans calm themselves, or we can drive prey toward the valleys of those who have grown too comfortable testing our authority."
 dragon_isles_events.6.a:0 "Feed it before the panic spreads."
 dragon_isles_events.6.b:0 "Turn its hunger toward disloyal valleys."

 dragon_isles_events.7.t:0 "The Crimson Skull Pools"
 dragon_isles_events.7.d:0 "In a remote crater-shrine, red water bubbles through old spawning stones and stains the claws of every guard posted there. The Dragon Cult calls it volcanic blessing, but the blood-priests mutter Khorne's name when they think no one hears.\n\nSuch places are dangerous because they offer strength before they ask for obedience. Cleansing the pools would quiet the omens, while binding their frenzy to state rites could give the clans a sanctioned outlet for slaughter. Doing nothing may simply let the madness choose its own victims.\n\nThe old spawning guards ask for a command before the next moonrise. Their claws are already shaking."
 dragon_isles_events.7.a:0 "Cleanse the pools with costly rites."
 dragon_isles_events.7.b:0 "Chain the frenzy to our war rites."
 dragon_isles_events.7.c:0 "Let the frenzy exhaust itself."

 dragon_isles_events.8.t:0 "Cathayan Harmonists at Court"
 dragon_isles_events.8.d:0 "Cathayan harmonists have arrived at court with jade rods, star charts, and careful bows. They say the dragons of the heavens teach balance, and that even the island cults may be aligned without being broken. Their translators avoid the word worship.\n\nMany priests dislike their softness, but their methods calm disputes that our warriors would rather settle with obsidian. Whether we sponsor their rites or use them as interpreters, their presence will change how the clans hear one another."
 dragon_isles_events.8.a:0 "Sponsor their balanced rites."
 dragon_isles_events.8.b:0 "Keep them as court interpreters."
 dragon_isles_events.8.c:0 "Send them away with courtesy."

 dragon_isles_events.9.t:0 "Clutches in the Gem Caves"
 dragon_isles_events.9.d:0 "Miners beneath [event_target.GetName] have found eggs among the gems, each shell warm and veined with faint light. The oldest attendants insist they are dragon clutches, and that touching the surrounding treasure without permission invites fire from below.\n\nGuarding the caves would turn rumor into public reverence and keep rival claws away. Harvesting the loose gems would be profitable, but every hammer-strike risks waking more than greed. Some miners have already hidden shards in their mouths."
 dragon_isles_events.9.a:0 "Guard the clutches until they hatch."
 dragon_isles_events.9.b:0 "Gather only the loose gems."

 dragon_isles_events.10.t:0 "The Shogun's Drum"
 dragon_isles_events.10.d:0 "The great war-drum has sounded from the ceremonial terraces, its hide painted with old glyphs and new dragon-marks. Across the islands, daimyo listen for whether the summons means council, campaign, or the quiet beginning of another feud. No lord wishes to arrive last.\n\nTo strike the drum again would call the clans beneath the wings and remind them that reverence must still march. A quieter council may win fewer cheers, but it would let envoys trade concessions before pride hardens into spearpoints. Delay would be prudent, though prudence rarely impresses island war-leaders.\n\nThe Shogun's heralds wait beside the drum with lacquered masks and sharpened knives. Silence is also a message."
 dragon_isles_events.10.a:0 "Summon the clans beneath the wings."
 dragon_isles_events.10.b:0 "Convene the quiet council."
 dragon_isles_events.10.c:0 "Bind the latecomers with oath-hostages."
 dragon_isles_events.10.dd:0 "Delay the summons."
