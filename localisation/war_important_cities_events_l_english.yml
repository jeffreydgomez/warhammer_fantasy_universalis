l_english:

war_important_cities.1.t:0 "Altdorf Falls to a New Master"
war_important_cities.1.d:0 "The great city of Altdorf, heart of the Empire, has passed into new hands. Founded in the earliest days of the Reikland, it rose to true prominence in 0 IC when Sigmar Heldenhammer was crowned Emperor within its walls, forging the Empire of Man. From that moment onward, Altdorf became not merely a city, but the seat of mankind’s greatest political and spiritual authority.\n\nIt was here, in 2304 IC, that Magnus the Pious was crowned following the devastation of the Great War Against Chaos, uniting a fractured Empire in the face of annihilation. In the aftermath, the High Elf mage Teclis established the Colleges of Magic in Altdorf, forever changing humanity’s relationship with sorcery. These institutions remain among the most powerful magical centers in the Old World, their towers rising above the city as both a promise and a warning.\n\nThe Grand Cathedral of Sigmar stands as a monument to faith, housing relics of the Heldenhammer himself. Emperors have ruled, plotted, and died within the Imperial Palace, while the Reiksguard have defended the throne with unyielding loyalty. Time and again, Altdorf has been the prize sought by rebels, invaders, and would-be emperors, for to control it is to claim legitimacy over the Empire.\n\nNow its banners have been cast down and replaced. Whether this echoes the unification of 0 IC or the desperate struggles of later centuries remains uncertain, but the fate of the Empire has always been decided in Altdorf—and so it shall be again."
war_important_cities.1.option_1:0 "The seat of power is ours."

war_important_cities.199.t:0 "Castle Drakenhof Seized"
war_important_cities.199.d:0 "Castle Drakenhof, dread seat of the von Carstein line, has fallen. Rising over Sylvania’s bleak lands, it became a fortress of terror in 2010 IC when Vlad von Carstein first revealed his true nature and began his campaign to claim the Imperial throne. From this black keep, he launched the Vampire Wars that would plunge the Empire into decades of bloodshed.\n\nIn 2051 IC, Vlad was finally slain at the Battle of Altdorf, yet his legacy endured. Mannfred von Carstein would later reclaim Drakenhof, using it as a base to reignite the wars in 2121 IC. The castle itself has been shaped by centuries of necromantic rituals, its foundations steeped in Dhar and its halls echoing with the whispers of the dead.\n\nThe surrounding land reflects this cursed heritage. Sylvania is a realm where the dead do not rest, where villages live in fear of the night, and where graveyards swell with unnatural life. Even when Drakenhof’s masters fall, its influence lingers, corrupting the land and those who dwell within it.\n\nTo claim Castle Drakenhof is to inherit a throne built on blood and sorcery. Many have sought to master its power since 2010 IC, yet few have escaped its shadow unscathed, for the legacy of the von Carsteins is not so easily buried."
war_important_cities.199.option_1:0 "The darkness is ours to command."

war_important_cities.860.t:0 "Khemri Reclaimed"
war_important_cities.860.d:0 "Khemri, the First City of Nehekhara, has changed hands once more. It was here, in a time long before the Imperial Calendar, that Settra the Imperishable unified the kingdoms of Nehekhara, forging the first great human empire. From Khemri’s golden palaces, his will reshaped an entire civilization, establishing traditions that would endure for millennia.\n\nYet it was also here that Nehekhara’s doom was sealed. In -1151 IC, Nagash, once a priest of Khemri, enacted his Great Ritual, betraying the Mortuary Cult and unleashing a plague of death across the land. Though Nagash was cast down, his actions transformed Nehekhara into a kingdom of the dead, its rulers cursed to rise again as undying monarchs.\n\nNow Khemri stands as a necropolis, its streets patrolled by skeletal legions and its pyramids housing ancient kings who remember the world before its fall. The city remains the seat of Settra’s eternal rule, even in undeath, and the spiritual heart of all Tomb Kings who claim descent from its legacy.\n\nTo seize Khemri is to grasp the legacy of both Settra’s glory and Nagash’s betrayal. Empires have risen and fallen since -1151 IC, yet Khemri endures, a reminder that death itself is no barrier to power in the Land of the Dead."
war_important_cities.860.option_1:0 "The First City is ours."

war_important_cities.871.t:0 "The Black Pyramid Dominated"
war_important_cities.871.d:0 "The Black Pyramid of Nagash, a monument to the birth of necromancy, is now under new control. Constructed in the desolate lands of Nehekhara, it became the focal point of Nagash’s dark ambitions in -1151 IC, when he unleashed the Great Ritual that annihilated an entire civilization. The Pyramid stands as both a tomb and a weapon, its obsidian form absorbing and amplifying the winds of Dhar.\n\nNagash himself, the Great Necromancer, drew power from this place to challenge gods and kings alike. Though he was defeated and cast down multiple times—most notably by Alcadizaar in -1151 IC—his legacy remains bound to the Pyramid. Even in his absence, it continues to radiate dark magic, corrupting the land and empowering those who dare approach.\n\nCountless necromancers and warlords have sought to harness its power, yet the Pyramid is no passive relic. It twists the minds of the weak and devours the souls of the unworthy, serving as both a source of immense strength and a perilous trap. The winds of magic flow unnaturally here, bending toward the Pyramid as if drawn by an unseen will.\n\nTo command the Black Pyramid is to stand where Nagash once stood, at the center of a ritual that reshaped the world in -1151 IC. Whether its new masters will wield that power—or be consumed by it—remains to be seen."
war_important_cities.871.option_1:0 "Power beyond death is ours."

war_important_cities.339.t:0 "Praag Captured"
war_important_cities.339.d:0 "Praag, the Cursed City of Kislev, has fallen once again. In 1707 IC, during the Great War Against Chaos, it was overrun by the hordes of Asavar Kul, Everchosen of Chaos. The city was subjected to unspeakable horrors, its people twisted by dark magic into grotesque forms, and its very streets reshaped by the touch of the Ruinous Powers.\n\nThough Praag was later reclaimed, its scars never healed. The taint of Chaos lingers in its stones, and its architecture remains warped, a permanent reminder of its fall. Even centuries later, mutations still appear among its populace, and witch hunters maintain constant vigilance to prevent corruption from spreading.\n\nThe city stands as Kislev’s northern bulwark, a grim sentinel against future invasions. Its people are hardened, their faith in Ursun and the old gods tempered by the knowledge of what lies beyond the world’s edge. Every shadow is suspect, every whisper a potential sign of Chaos’ return.\n\nTo take Praag is to inherit a city that has already died once in 1707 IC. Its walls may be strong, but its true battle is eternal, for the memory—and the mark—of Chaos can never be fully erased."
war_important_cities.339.option_1:0 "The cursed city is subdued."

war_important_cities.314.t:0 "Couronne Taken"
war_important_cities.314.d:0 "Couronne, capital of Bretonnia, has been seized. It was from this city that Gilles le Breton, first King of Bretonnia, ruled after receiving the blessing of the Lady of the Lake around 977 IC. Under his reign, the knightly traditions of Bretonnia were forged, binding the realm in a culture of chivalry and divine purpose.\n\nCouronne has long served as the political and spiritual heart of the kingdom. Its harbor connects Bretonnia to distant lands, while its palaces house dukes and kings who trace their lineage back to Gilles himself. The Grail Chapel stands as a sacred site, where knights gather to honor the Lady and seek her favor.\n\nThroughout its history, Couronne has weathered internal strife and external threats, yet its ideals have endured. The rigid social order of Bretonnia—nobility above and peasantry below—remains firmly entrenched, upheld by both tradition and faith. The city embodies both the glory and the contradictions of Bretonnian society.\n\nTo capture Couronne is to challenge a legacy that has stood since 977 IC. Whether the Lady’s favor will abandon the city or whether new rulers will attempt to claim her blessing remains uncertain, but the fall of Couronne will echo across all Bretonnia."
war_important_cities.314.option_1:0 "The jewel of Bretonnia is ours."

war_important_cities.590.t:0 "Remas Subjugated"
war_important_cities.590.d:0 "The mercantile jewel of Tilea, Remas, has fallen into new hands. Founded in antiquity and rising to prominence as one of the greatest city-states of the southern Old World, Remas built its wealth upon trade, naval power, and ruthless political maneuvering. Its harbors have long been filled with vessels from across the Great Ocean, bringing riches from Araby, Ulthuan, and beyond.\n\nRemas is most famed as the birthplace of Leonardo da Miragliano, the greatest engineer of the modern age, whose innovations reshaped warfare across the Old World during the late 24th century IC. His designs, from advanced artillery to mechanical marvels, brought prestige and power to the city, further cementing its dominance among the Tilean states.\n\nThroughout its history, Remas has survived countless wars, alliances, and betrayals, often emerging stronger through cunning diplomacy rather than brute force. Its ruling merchant-princes have long played rivals against one another, ensuring that no single power could dominate Tilea for long.\n\nTo claim Remas is to inherit a legacy of wealth and intrigue. Its coffers are vast, but so too are the ambitions of those who dwell within, for in Remas, power is as fluid as the tides that fill its harbors."
war_important_cities.590.option_1:0 "The riches of Tilea are ours."

war_important_cities.451.t:0 "Lothern Taken"
war_important_cities.451.d:0 "Lothern, the shining capital of Ulthuan and seat of the Phoenix King, has fallen. Built upon the Inner Sea, its white towers and gleaming harbors have stood since the earliest days of Elven civilization, serving as both a gateway to Ulthuan and a symbol of Asur supremacy. Its great port is unmatched, its fleets patrolling the seas with unmatched grace and precision.\n\nIt was here that Finubar the Seafarer was crowned Phoenix King in 2301 IC, ushering in an era of renewed contact between Ulthuan and the wider world. Under his rule, Lothern became the center of Elven diplomacy, its envoys traveling to distant lands to shape the fate of nations.\n\nYet Lothern has not been untouched by war. During the long millennia since the Sundering, it has stood as the first line of defense against the hated Druchii, its harbors threatened by countless raids launched from Naggaroth. Time and again, its defenders have repelled these assaults, preserving the heart of Ulthuan.\n\nTo take Lothern is to strike at the very soul of the High Elves. Whether its fall marks the beginning of Ulthuan’s decline or merely another chapter in its long history of resilience remains uncertain."
war_important_cities.451.option_1:0 "The Phoenix King’s seat is ours."

war_important_cities.2009.t:0 "Naggarond Seized"
war_important_cities.2009.d:0 "Naggarond, the Black City and capital of Naggaroth, has been seized. Raised in the aftermath of the Sundering around -2750 IC, it became the seat of Malekith, the Witch King, after his failed claim to the Phoenix Throne plunged the Elven race into civil war. From its black towers, Malekith has ruled for millennia, plotting vengeance against Ulthuan.\n\nThe city itself is a monument to cruelty and domination. Its massive ziggurats and iron fortresses are built upon the backs of countless slaves, their suffering fueling the dark industry of the Druchii. The Black Guard, Malekith’s elite warriors, maintain order through terror, ensuring absolute loyalty within the city’s walls.\n\nNaggarond has long been the heart of Druchii power, launching countless raids across the world to capture slaves and spread fear. Its fleets are swift and merciless, its armies disciplined and brutal. Even within the city, intrigue and betrayal are constant, as nobles vie for the favor of the Witch King.\n\nTo claim Naggarond is to seize the throne of one of the most ancient and malevolent powers in the world. Yet its legacy is steeped in treachery, and any who rule here must contend with the same ruthless ambition that has defined it since -2750 IC."
war_important_cities.2009.option_1:0 "The Black City is ours."

war_important_cities.2145.t:0 "Pigbarter Claimed"
war_important_cities.2145.d:0 "The notorious trading hub of Pigbarter has fallen under new control. Situated along the River Ruin at the edge of the Dark Lands, Pigbarter has long served as a meeting point between the civilized world and the dangers beyond. Its markets are infamous for dealing in goods—and creatures—that few other cities would dare handle.\n\nPigbarter’s rise is tied to its position as a gateway to the east, where caravans from Cathay and beyond bring exotic wares. Yet it is equally known for its dealings with less savory factions, including Chaos Dwarfs and Hobgoblin tribes, whose presence has shaped the city’s lawless and dangerous character.\n\nBy the 25th century IC, Pigbarter had become synonymous with corruption and excess, its rulers more concerned with profit than order. Mercenaries, slavers, and traders from across the world gather here, each seeking fortune in a place where morality is often secondary to gold.\n\nTo take Pigbarter is to control a nexus of trade and vice. Its wealth is undeniable, but so too is the danger it brings, for the influences that flow through this city are as perilous as they are profitable."
war_important_cities.2145.option_1:0 "The crossroads of the east is ours."

war_important_cities.2466.t:0 "Itza Reclaimed"
war_important_cities.2466.d:0 "The ancient temple-city of Itza, first and greatest of the Lizardmen cities, has fallen into new hands. Founded in the earliest days of the world by the Old Ones, Itza stands as the center of their design, its ziggurats and geomantic structures forming a nexus of immense magical power. It is here that Lord Kroak, first and greatest of the Slann, once ruled.\n\nDuring the Great Catastrophe, when the polar gates collapsed and Chaos flooded the world around -5600 IC, Itza became a battleground of unimaginable scale. Lord Kroak himself perished in the defense of the city, unleashing devastating magic that annihilated the invading daemons and preserved Itza from complete destruction.\n\nEven in the ages since, Itza has remained a cornerstone of the Lizardmen’s Great Plan. Its Slann Mage-Priests continue to interpret the will of the Old Ones, directing their servants in a war that spans millennia. The city itself is alive with ancient purpose, its structures aligned with forces beyond mortal comprehension.\n\nTo claim Itza is to stand at the heart of the Old Ones’ design. Whether as conqueror or defiler, any who hold it must contend with powers that have endured since before recorded history, and which may yet shape the fate of the world."
war_important_cities.2466.option_1:0 "The First City of the Old Ones is ours."

war_important_cities.2312.t:0 "Hexoatl Taken"
war_important_cities.2312.d:0 "Hexoatl, the Golden City and seat of Lord Mazdamundi, has fallen. As one of the greatest temple-cities of Lustria, it serves as a center of immense geomantic and magical power, its pyramids and causeways forming part of the vast network left behind by the Old Ones. Its influence stretches across the continent, shaping the actions of the Lizardmen.\n\nLord Mazdamundi, oldest and most powerful of the living Slann Mage-Priests, has ruled here since time immemorial. In 2302 IC, during the Great War Against Chaos, it was his magic that reshaped entire landscapes, aiding in the defeat of Chaos forces across the world. His will alone is said to rival that of gods, and his presence defines Hexoatl itself.\n\nThe city is heavily defended by legions of Saurus warriors and ancient constructs, all guided by the inscrutable designs of the Slann. Intruders are rare, and fewer still survive, for Hexoatl is not merely a city but a fortress of divine purpose.\n\nTo take Hexoatl is to challenge one of the oldest powers in existence. Whether its fall disrupts the Great Plan or merely becomes another step within it is unknowable, for the designs of the Old Ones are beyond mortal understanding."
war_important_cities.2312.option_1:0 "The Golden City is ours."

war_important_cities.2838.t:0 "Wei-Jin Brought Low"
war_important_cities.2838.d:0 "Wei-Jin, radiant capital of Grand Cathay and seat of the Dragon Throne, has passed into new hands. From this vast metropolis the Celestial Dragon Emperor and the Moon Empress ruled over one of the oldest and most stable empires in the world, maintaining harmony through celestial bureaucracy and draconic will. Its walls stretch for leagues, enclosing not just a city but an entire world of palaces, markets, temples, and administrative districts.\n\nAt its heart lies the Celestial Court, where the Dragon Emperor—Xen Yang in human guise—has governed since time immemorial. From here, the Celestial Bureaucracy issues edicts that maintain the delicate balance between Yin and Yang across Cathay. The city is also the center of Cathayan magical practice, where astrologers and alchemists interpret the will of the heavens to guide the empire’s fate.\n\nWei-Jin has endured moments of profound crisis. In 1999 IC, the disappearance of the Dragon Emperor and Moon Empress plunged Cathay into uncertainty, as their children vied for influence in their absence. In 2377 IC, the Monkey King seized Wei-Jin and declared himself Emperor, only to be overthrown in 2380 IC when the Dragon Emperor returned and reasserted his dominion.\n\nTo claim Wei-Jin is to grasp the Mandate of Heaven itself. Whether its fall signals the collapse of Cathayan harmony or merely a temporary disruption in an eternal cycle remains uncertain, but the fate of the east has always been decided within these walls."
war_important_cities.2838.option_1:0 "The Dragon Throne is ours."

war_important_cities.1007.t:0 "The Palace of the Wizard Caliph Seized"
war_important_cities.1007.d:0 "The legendary Palace of the Wizard Caliph, seat of Araby’s greatest sorcerer-kings, has fallen. This opulent complex of minarets, domes, and hidden chambers stands as a monument to the mystical traditions of Araby, where magic and rulership have long been intertwined. From its halls, the Wizard Caliphs commanded both mortal armies and unseen forces, their rule defined as much by sorcery as by steel.\n\nForemost among these rulers was the Caliph Haroun al-Hadim, whose reign in the late 23rd century IC brought both prosperity and terror. It is said that in 2281 IC he bound powerful djinn to his service, using their might to expand his influence across the desert and beyond. Yet such power came at a cost, as rival sorcerers and internal conspiracies sought to claim the same forbidden knowledge.\n\nThe palace itself is steeped in enchantment. Its halls are said to shift and change, its vaults containing relics of immense power gathered over centuries. Even in times of peace, it has been a place of intrigue and danger, where alliances are forged in whispers and broken with spells.\n\nTo take the Palace of the Wizard Caliph is to seize a seat of immense magical authority. Whether its secrets will be mastered or unleash new calamities upon the world remains to be seen, for Araby’s sorcerous legacy is as perilous as it is powerful."
war_important_cities.1007.option_1:0 "The secrets of the Caliph are ours."

war_important_cities.700.t:0 "Karaz-a-Karak Taken"
war_important_cities.700.d:0 "Karaz-a-Karak, the Everpeak and greatest of all Dwarf holds, has fallen. Carved into the World’s Edge Mountains, it has stood as the capital of the Dawi since time immemorial, its vast halls and unassailable gates symbolizing the endurance and pride of the Dwarf race. It is here that the High King rules, and where the Dammaz Kron, the Great Book of Grudges, is kept.\n\nIn 1 IC, High King Kurgan Ironbeard unified the Dwarf holds from Karaz-a-Karak, forging a golden age of prosperity and strength. Yet even this mighty hold has known tragedy. In 2302 IC, during the Great War Against Chaos, High King Kurgan’s descendant, High King Thorgrim Grudgebearer’s line, fought to preserve the hold against encroaching darkness, ensuring its survival when many others fell.\n\nThe hold’s vast chambers contain treasures and knowledge accumulated over millennia, from ancient runic artifacts to records of every slight ever committed against the Dawi. Its defenses are legendary, its gates said to have never been breached by force in all its long history.\n\nTo take Karaz-a-Karak is to strike at the very heart of the Dwarf race. Such an act will not be forgotten, for every grievance is recorded, and the reckoning of the Dawi is as inevitable as it is relentless."
war_important_cities.700.option_1:0 "The Everpeak is ours."

war_important_cities.4156.t:0 "Karak Eight Peaks Claimed"
war_important_cities.4156.d:0 "Karak Eight Peaks, once one of the greatest Dwarf holds, has changed hands yet again. Built deep within the World’s Edge Mountains, it was a jewel of Dwarf engineering and wealth, its eight towering peaks rising above vast subterranean halls filled with riches beyond counting.\n\nIts fall came during the Time of Woes, when Skaven and Greenskins overran the hold in the centuries following the Dwarf golden age. By 1050 IC, it had been lost to the Dawi, becoming a battleground contested by Skaven clans, Orc warlords, and exiled Dwarf claimants ever since. Among these was Belegar Ironhammer, who in 2512 IC launched his campaign to reclaim the hold of his ancestors.\n\nSince its fall, Karak Eight Peaks has become a place of constant war, its halls echoing with the sounds of battle. Skaven infest its depths, Greenskins war among its ruins, and Dwarfs seek to restore it, each faction claiming rightful ownership of the ancient hold.\n\nTo seize Karak Eight Peaks is to enter a conflict that has raged for centuries. Its wealth and strategic importance are immense, but so too is the fury of those who believe it rightfully theirs."
war_important_cities.4156.option_1:0 "The contested hold is ours."

war_important_cities.810.t:0 "Zharr Naggrund Dominated"
war_important_cities.810.d:0 "Zharr Naggrund, the Tower of Zharr and capital of the Chaos Dwarfs, has fallen under new rule. Rising from the ash-choked Plain of Zharr, this nightmarish city is built around a colossal ziggurat dedicated to Hashut, the Father of Darkness. Its furnaces burn without end, fueled by slave labor and dark industry.\n\nThe Chaos Dwarfs were transformed long ago, when they were cut off from their kin during the ancient catastrophes that befell the world. In their desperation, they turned to Hashut, who answered them with power at the cost of their souls. By -3000 IC, Zharr Naggrund had become the center of their dark empire, a place where sorcery and industry merge into a single, terrible force.\n\nThe Sorcerer-Prophets who rule the city are slowly turning to stone, a curse born of their pact with Hashut. Yet even as their bodies petrify, their will shapes the city and its dominion, commanding legions of slaves, war machines, and infernal constructs.\n\nTo take Zharr Naggrund is to claim one of the most twisted powers in the world. Its forges can arm empires, but its curse is inescapable, and any who rule here must contend with the legacy of Hashut and the doom that follows in his wake."
war_important_cities.810.option_1:0 "The Tower of Zharr is ours."

war_important_cities.770.t:0 "Talsyn Falls Silent"
war_important_cities.770.d:0 "The sacred glades of Talsyn, heart of Athel Loren, have been seized. Unlike any city of stone and mortar, Talsyn is a living realm, its halls grown from ancient oaks and its pathways shifting with the will of the forest itself. It is here that Orion, the King in the Woods, and Ariel, Queen of the Wood Elves, have ruled in accordance with the cycles of the forest since the binding of Athel Loren in -2723 IC.\n\nThe forest itself was forever changed in that year, when the Elves of Ulthuan bound the forest spirit Coeddil and forged a pact with the ancient entities of the woods. From that moment, Athel Loren became something more than mere woodland—a realm of spirits, magic, and eternal vigilance. Talsyn stands at the center of this transformation, a nexus of the forest’s power.\n\nOrion is reborn each year through a sacred ritual, a cycle that has continued unbroken for millennia. Ariel, as the avatar of Isha, channels the life force of the forest itself, maintaining the delicate balance between growth and decay. Together, they have guided Athel Loren through countless threats, from Beastmen incursions to the encroachment of outsiders.\n\nTo claim Talsyn is to intrude upon a domain that does not recognize mortal rule. The forest watches, remembers, and reacts, and those who take this place may soon find that Athel Loren itself is their greatest enemy."
war_important_cities.770.option_1:0 "The forest bends—if only for now."

war_important_cities.754.t:0 "Barak Varr Captured"
war_important_cities.754.d:0 "Barak Varr, the greatest Dwarf port on the western seas, has fallen. Unlike many holds hidden deep within the mountains, Barak Varr stands open to the ocean, its vast harbor linking the Dawi to the wider world. From its docks, trade has flowed for centuries, bringing wealth and knowledge to the Karaz Ankor.\n\nEstablished as a major port during the height of Dwarf expansion, Barak Varr became a cornerstone of maritime trade, maintaining relations with the Empire, Tilea, and beyond. In 2302 IC, during the Great War Against Chaos, its fleets played a crucial role in maintaining supply lines and resisting incursions along the western coasts.\n\nThe hold is renowned for its engineers and shipwrights, whose craftsmanship rivals even their famed work in stone and steel. Its fleet, though smaller than those of men, is unmatched in durability and precision, reflecting the Dwarfs’ mastery of their craft.\n\nTo seize Barak Varr is to gain a rare gateway into the Dwarfen world. Yet its loss will not go unanswered, for the Dawi do not forget, and the taking of such a vital hold will surely be entered into the Dammaz Kron."
war_important_cities.754.option_1:0 "The western gate is ours."

war_important_cities.169.t:0 "Skavenblight Overrun"
war_important_cities.169.d:0 "Skavenblight, the festering heart of the Skaven Under-Empire and seat of the Council of Thirteen, has fallen. Beneath its crumbling surface lies a vast warren of tunnels, laboratories, and breeding pits, where the Skaven multiply and scheme in endless numbers. It is from here that their influence spreads across the world, unseen yet ever-present.\n\nThe city rose to prominence in 1111 IC, when the Skaven first revealed themselves during the destruction of Mordheim and the surrounding lands, though their existence had long been hidden beneath the earth. The Council of Thirteen, ruling from Skavenblight, governs through betrayal, intrigue, and the constant threat of assassination.\n\nEach of the great clans—Skryre, Moulder, Pestilens, Eshin, and others—vie for dominance within the city, their rivalries shaping the actions of the Under-Empire. Warpstone, the source of their power, is hoarded and consumed here, fueling both their technological horrors and their madness.\n\nTo claim Skavenblight is to step into a nest of treachery without equal. Even in defeat, the Skaven endure, for their strength lies not in any single city, but in their endless numbers and their capacity for deceit."
war_important_cities.169.option_1:0 "The Under-Empire trembles."

war_important_cities.2826.t:0 "The Great Bastion Breached"
war_important_cities.2826.d:0 "The Great Bastion, the colossal wall guarding Cathay from the Chaos Wastes, has been breached and brought under new control. Stretching across the northern frontier, it stands as one of the greatest feats of engineering in the world, its towers and fortifications manned by disciplined armies and guided by celestial magic.\n\nConstructed under the direction of the Celestial Dragon Emperor in ancient times, the Bastion has stood as the first and last line of defense against the horrors of Chaos. For millennia, it has repelled invasions from the north, its gates never yielding despite the constant pressure of daemonic and mortal armies alike.\n\nThe Bastion is more than a wall—it is a symbol of Cathayan resilience and order. Its garrisons are maintained through strict discipline, its defenses enhanced by the harmonious balance of Yin and Yang. Generals stationed here are among the most respected in Cathay, entrusted with the safety of the entire empire.\n\nTo take the Great Bastion is to shatter a cornerstone of Cathayan security. Whether its fall heralds a new age of invasion or a temporary lapse in its eternal vigilance remains to be seen, but the north will not remain quiet for long."
war_important_cities.2826.option_1:0 "The wall no longer stands against us."

war_important_cities.2795.t:0 "Goldtooth Mine Seized"
war_important_cities.2795.d:0 "The Goldtooth Mine, richest source of wealth in the Mountains of Mourn, has been seized. This vast mining complex has long been controlled by the Ogre Kingdoms, its riches fueling the power of the Goldtooth tribe and its Overtyrant, Greasus Goldtooth. Here, gold is not merely currency, but a symbol of dominance and gluttony.\n\nGreasus Goldtooth rose to power in the early 25th century IC, consolidating control over the Ogre tribes through wealth and intimidation. By 2500 IC, he had become the undisputed Overtyrant, ruling from his mountainous hoard and using his vast riches to command loyalty and crush opposition.\n\nThe mine itself is worked relentlessly, its depths filled with enslaved laborers and guarded by brutish Ogres who value gold above all else. Trade caravans from Cathay and beyond are drawn here, exchanging goods for the precious metal that flows from its tunnels.\n\nTo claim the Goldtooth Mine is to seize a source of immense wealth. Yet such riches attract attention, and the loss of this prize will not sit well with those who once feasted upon its bounty."
war_important_cities.2795.option_1:0 "The gold is ours."

war_important_cities.4093.t:0 "Mrauk-U Taken"
war_important_cities.4093.d:0 "The city of Mrauk-U, a vital center of trade and culture in Ind, has fallen into new hands. Situated along key river routes, it has long served as a hub connecting the lands of Ind with distant regions, facilitating the exchange of goods, ideas, and influence.\n\nThough much of Ind remains shrouded in mystery to outsiders, Mrauk-U has been known as a place of wealth and diversity, where merchants from Cathay, Araby, and beyond converge. By the 24th century IC, it had grown into one of the most important cities in the region, its rulers wielding considerable influence over surrounding territories.\n\nThe city is marked by its temples, palaces, and bustling markets, reflecting a culture both ancient and vibrant. Its strategic position has made it a prize for would-be conquerors, yet it has endured through adaptability and trade.\n\nTo take Mrauk-U is to gain a foothold in a land little understood by outsiders. Its wealth is great, but so too are the challenges of ruling a city shaped by forces far older and more complex than they first appear."
war_important_cities.4093.option_1:0 "Ind opens before us."

war_important_cities.1746.t:0 "Lashiek Subdued"
war_important_cities.1746.d:0 "The city of Lashiek, glittering jewel of Araby, has fallen into new hands. Situated along vital trade routes between the Great Ocean and the deep deserts, Lashiek has long stood as a center of wealth, culture, and intrigue. Its markets overflow with silks, spices, and relics from distant lands, drawing merchants and adventurers alike.\n\nLashiek rose to prominence during the height of Araby’s power, particularly in the centuries leading up to 1448 IC, when Sultan Jaffar sought to expand his dominion across the seas. His ambitions culminated in conflict with the Old World, bringing Araby into direct confrontation with Bretonnia during the Crusades of 1448–1450 IC. Though ultimately repelled, Lashiek remained a vital center of Araby’s resilience and continued prosperity.\n\nThe city is also known for its scholars and mystics, many of whom study ancient lore and the secrets of the desert. Beneath its golden domes lie hidden chambers and forgotten treasures, remnants of a past that stretches back to the earliest days of human civilization in the southlands.\n\nTo claim Lashiek is to seize a crossroads of trade and knowledge. Yet its wealth has always attracted ambition, and those who rule it must contend with both external threats and the ever-present intrigues of its own elite."
war_important_cities.1746.option_1:0 "The jewel of Araby is ours."

war_important_cities.1828.t:0 "The Court of the Everqueen Taken"
war_important_cities.1828.d:0 "The sacred Court of the Everqueen, heart of Avelorn and spiritual center of Ulthuan, has fallen. Hidden within enchanted forests untouched by time, this domain is the seat of the Everqueen, the living embodiment of Isha and the spiritual counterpart to the Phoenix King. Here, nature and magic exist in perfect harmony, guarded fiercely by the Everqueen’s handmaidens.\n\nSince the time of Astarielle, first Everqueen during the early days following the founding of Ulthuan around -5000 IC, the Court has served as a sanctuary of life and renewal. The Everqueen’s line has endured through millennia, each successor chosen not by blood alone but by divine will, ensuring the continuation of Isha’s blessing upon the High Elves.\n\nDuring the long centuries of the Sundering, beginning around -2750 IC, Avelorn remained a bastion of resistance against the forces of Malekith. Though war ravaged much of Ulthuan, the Court of the Everqueen stood firm, its defenders repelling countless incursions by the Druchii.\n\nTo take the Court of the Everqueen is to violate one of the most sacred places in the world. Such an act will not go unanswered, for the wrath of Ulthuan—and perhaps Isha herself—will surely follow."
war_important_cities.1828.option_1:0 "Even the sacred groves fall before us."

war_important_cities.3190.t:0 "Galleon's Graveyard Claimed"
war_important_cities.3190.d:0 "The dreaded Galleon’s Graveyard, domain of the undead pirate Noctilus, has been brought under new control. This cursed region of jagged rocks and perpetual storms lies far from safe harbors, where countless ships have met their doom upon its treacherous shoals. Wreckage litters the waters, forming a graveyard of shattered hulls and lost souls.\n\nIt was in the late 24th century IC that Count Noctilus, once a Vampire of the Von Carstein bloodline, established his lair here. Drawing upon dark sorcery, he raised entire fleets of undead from the wrecks, creating a terrifying armada that preys upon all who sail the Great Ocean. From this stronghold, he has launched countless raids, spreading fear across the seas.\n\nThe Graveyard itself is steeped in necromantic power. The storms that surround it are unnatural, said to be bound to Noctilus’ will, while the dead rise endlessly from the depths to serve his command. Even the bravest sailors avoid these waters, knowing that to enter is to risk joining the ranks of the damned.\n\nTo seize the Galleon’s Graveyard is to claim dominion over a maritime nightmare. Its fleets and powers are formidable, but its curse runs deep, and the sea itself may rise against those who would command it."
war_important_cities.3190.option_1:0 "The seas themselves obey us."

war_important_cities.1115.t:0 "Antoch Captured"
war_important_cities.1115.d:0 "The city of Antoch, a key stronghold along the eastern fringes of the Old World, has fallen. Long serving as a crossroads between distant lands and a bulwark against encroaching threats, Antoch has endured through centuries of conflict and shifting allegiances. Its walls have witnessed the passage of armies and the rise and fall of countless rulers.\n\nThough lesser known than the great capitals of the west, Antoch has played a crucial role in the defense and trade of its region. By the 23rd century IC, it had become a fortified hub, linking eastern trade routes with the wider world while standing vigilant against threats from the Dark Lands and beyond.\n\nThe city’s people are hardened by necessity, accustomed to life on the edge of civilization. Merchants, soldiers, and adventurers alike pass through its gates, each contributing to a culture defined by resilience and adaptability.\n\nTo take Antoch is to secure a foothold in a contested land. Its importance may not lie in grandeur, but in its position, and those who hold it will find themselves at the center of the struggles that define the region."
war_important_cities.1115.option_1:0 "The eastern gate is ours."

war_important_cities.4440.t:0 "Black Crag Conquered"
war_important_cities.4440.d:0 "Black Crag, the greatest stronghold of the Greenskins in the Old World, has been taken. Rising from the Badlands as a fortress of crude but formidable construction, it has long served as a gathering point for Orc warlords seeking to unite the tribes under their banner.\n\nIn 2428 IC, the legendary Orc warboss Grimgor Ironhide seized Black Crag, forging it into the center of his growing Waaagh!. From this base, he launched devastating campaigns across the Badlands and beyond, crushing rival warlords and carving a path of destruction that would be remembered for generations.\n\nThe fortress itself is a chaotic sprawl of ramshackle fortifications, brutal arenas, and sprawling camps, constantly reshaped by the whims of its inhabitants. Strength is the only law here, and leadership is maintained through violence and dominance.\n\nTo claim Black Crag is to inherit a throne built on brute force. Yet Greenskins are never truly conquered, and even in defeat, the Waaagh! will gather once more, drawn to the promise of battle and the lure of a worthy fight."
war_important_cities.4440.option_1:0 "The Waaagh! is broken—for now."

war_important_cities.79.t:0 "Marienburg Seized"
war_important_cities.79.d:0 "Marienburg, the greatest port of the Old World, has fallen into new hands. Situated at the mouth of the Reik, it commands the flow of trade between the Empire and the seas beyond, its canals and merchant houses forming a city of immense wealth and influence.\n\nOnce part of the Empire, Marienburg declared its independence in 2429 IC, following political maneuvering and the payment of vast sums to secure its freedom. Since then, it has been ruled by the Merchant Council, whose wealth rivals that of kings and whose influence extends across continents.\n\nThe city is a hub of commerce, where goods from Ulthuan, Araby, Cathay, and beyond are bought and sold. Its people are as diverse as its markets, and its politics are driven by profit above all else. Intrigue, bribery, and ambition are as common here as coin.\n\nTo take Marienburg is to control the lifeblood of trade in the Old World. Its wealth is unparalleled, but so too is the complexity of its politics, and any who rule it must navigate a web of interests as vast as the seas it commands."
war_important_cities.79.option_1:0 "The gold of the world flows through us."

war_important_cities.4825.t:0 "The Monkey Court Scattered"
war_important_cities.4825.d:0 "The Monkey Court, ramshackle seat of the Monkey King’s unruly dominion, has fallen into new hands. Though called a court, it has never possessed the ordered dignity of Wei-Jin or the carefully balanced ministries of the Dragon Emperor, but instead served as the chaotic center of the Monkey Warriors who dwell in the Mountains of Heaven. Here, mockery replaced ceremony, cunning stood above etiquette, and a throne born of opportunity challenged the ancient celestial hierarchy of Cathay.\n\nThe Monkey King rose to his greatest prominence in 2377 IC, during the long absence of the Celestial Dragon Emperor and the Moon Empress. In that year he seized power amidst the Time of Darkness and Disharmony, setting himself up as a rival sovereign while Cathay’s draconic order faltered. His rule endured until 2380 IC, when the Dragon Emperor and Moon Empress returned, cast him down, and restored the old celestial balance.\n\nYet the Monkey King was no mere buffoon, however much Cathayan chroniclers may sneer at his court. He proved cunning enough to survive in the shadow of dragons, bold enough to challenge a millennia-old order, and dangerous enough that his name still lingers in rumor and fable across the eastern mountains. Even after his overthrow in 2380 IC, tales of the Monkey Court persisted as a symbol of disorder, irreverence, and opportunism flourishing wherever authority weakens.\n\nTo seize the Monkey Court is to claim a place that embodies rebellion against the heavenly order of Cathay. Its halls were never sanctified by ancient rites, yet they carry the memory of one of the boldest usurpations in Cathayan history. Whether this conquest marks the end of a lingering mock kingdom or the beginning of a new challenge to dragon rule, the lesson of 2377 IC remains: even in Cathay, the throne may be stolen if Heaven looks away."
war_important_cities.4825.option_1:0 "The pretender’s court is broken."

war_important_cities.4780.t:0 "Sungyeon Taken"
war_important_cities.4780.d:0 "Sungyeon, capital of Nippon and seat of the Divine Sun, has passed into new hands. From this city the emperors of Nippon claimed supreme authority over the island empire, though in practice their writ has long been contested by rival samurai lords, feuding clans, and provincial strongmen. Its palaces, shrines, and fortified districts stand as a symbol of imperial legitimacy in a land where power is too often decided by the sword.\n\nNippon’s politics have for centuries been shaped by the weakness of the throne and the growing might of the warrior nobility. Official accounts speak of a frail emperor overshadowed by samurai overlords, each one claiming to defend the realm even as they carve it into private domains. The capital therefore became more than a royal residence: it was the prize by which rebels, generals, and would-be restorers sought to prove that Heaven favored their cause.\n\nOne of the clearest such episodes came with Sanyo Kawasaki, a rebel leader of great renown, who besieged the Nipponese capital after denouncing the government’s liberal treatment of foreigners. That rising, remembered in Nipponese chronicles as a moment of open defiance against imperial weakness, showed how fragile central rule had become. Even when the capital endured, the siege proved that the Divine Sun’s city could be isolated, challenged, and nearly mastered by a determined samurai host.\n\nTo capture Sungyeon is to take hold of the fragile center of Nippon’s divided realm. Whoever governs here inherits not only the prestige of the imperial court, but also its ancient weakness, for every ambitious daimyo will measure himself against the throne. The city may glitter with sacred and imperial majesty, but its history teaches that in Nippon legitimacy is never secure unless it is backed by steel."
war_important_cities.4780.option_1:0 "The capital of Nippon is ours."