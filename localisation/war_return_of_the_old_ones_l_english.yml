 return_of_the_old_ones_events.4.t:0 "The Old Ones Have Returned"

return_of_the_old_ones_events.4.d:0 "A great disturbance ripples across the winds of magic, felt by seers, scholars, and madmen alike. Ancient mechanisms buried beneath mountains and jungles awaken in unison, their power lines flaring with impossible light. The stars themselves seem to shift, tracing patterns unseen since the dawn of the world. From forgotten vaults and beyond the veil of reality, the Old Ones have returned.\n\nThey do not come as distant observers or silent guides. Vast arcane constructs descend upon the world, and cyclopean cities rise where none stood before. Their servants speak in cold declarations of inevitability, proclaiming the failure of mortals to uphold the Great Design. To the Old Ones, this world is broken — and it must be remade, regardless of the cost.\n\nThere will be no negotiation, no mercy, and no escape from their vision. The age of mortals stands on the brink of extinction."

return_of_the_old_ones_events.4.option_1:0 "Their capitals burn with alien light."
return_of_the_old_ones_events.4.option_2:0 "Another node of the Great Design awakens."
return_of_the_old_ones_events.4.option_3:0 "The stars mark yet another place of invasion."
return_of_the_old_ones_events.4.option_4:0 "They descend to cleanse the world."
return_of_the_old_ones_events.4.option_5:0 "But will we survive their design?"





return_of_the_old_ones_events.5.t:0 "The Old Ones Walk the World Once More"
return_of_the_old_ones_events.5.d:0 "The signs have been fulfilled. The stars have shifted, the winds of magic roar with divine resonance, and the ancient vaults stir with radiant life. The Old Ones, creators of order and shapers of the Great Plan, have returned to the world. Their presence is not whispered in omens or dreams — it is manifest, undeniable, and overwhelming.\n\nWe have awaited this moment for generations. Their wisdom surpasses mortal thought, their power eclipses that of any empire. But their return is not gentle. The Old Ones come not to reward devotion, but to correct deviation. And in their eyes, we may be as flawed as those who never worshipped them at all.\n\nTheir judgment is absolute, their will unknowable. We must pray that our faith is enough to be spared."
return_of_the_old_ones_events.5.option_1:0 "They descend upon the world to cleanse it."
return_of_the_old_ones_events.5.option_2:0 "One of the Great Engines awakens nearby."
return_of_the_old_ones_events.5.option_3:0 "A new node of the Great Plan reveals itself."
return_of_the_old_ones_events.5.option_4:0 "They descend to cleanse the world."
return_of_the_old_ones_events.5.option_5:0 "But will we survive their design?"

