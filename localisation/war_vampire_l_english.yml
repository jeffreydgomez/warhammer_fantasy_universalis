### Vampiric Religion Event
vampire_events.3.t:0 "Which House to Raise?"
vampire_events.3.desc:0 "There are many houses our vampiric bretheren hail from, each skilled in their own ways. Which house should we choose to raise from?"
vampire_events.3.a:0 "A Lahmian Diplomat!"
vampire_events.3.b:0 "A Von Carstein to keep our subjects in line!"
vampire_events.3.c:0 "A commandant from house Blood Dragon!"
vampire_events.3.d:0 "A Necrarchian Prince!"
vampire_events.3.e:0 "A Strigoi General!"
vampire_events.3.f:0 "Now is not the time."


### Purge Under

purge_undead_from_administration_title:0 "Purge Undead from Administration"
purge_undead_from_administration_desc:0 "Undead have festered within our government since we abandoned worship of their vile ways. It is time for the living to coup the dead. We must remove all elements of corruption from our administration!"

purge_undead_from_military_title:0 "Purge Undead from Military"
purge_undead_from_military_desc:0 "Zombies and skeletons shamble among our forces, even though our people have abandoned their sacrilegious ways. Liches and vampires lead our armies. It is time for a sudden and brutal coupe. The living must regain control of our troops."


### Vampire Coast

vamp_coast_centers_of_trade_1_title:0 "Secure the First Ports"
vamp_coast_centers_of_trade_1_desc:0 "To spread our dread influence, we must seize the ports where the living trade and thrive. With control over these anchorages, our fleets can better raid, plunder, and leech wealth from every sea."

vamp_coast_centers_of_trade_2_title:0 "Ports of Plunder"
vamp_coast_centers_of_trade_2_desc:0 "Each new harbor claimed expands our reach. With five such waystations secured, our raiding grows ever more efficient, and the living’s sea-lanes tremble under our sails."

vamp_coast_centers_of_trade_3_title:0 "A Necrotic Network"
vamp_coast_centers_of_trade_3_desc:0 "A true empire of the undead requires a chain of ports that girdle the globe. Ten waystations shall bind the world in our grasp, feeding our fleets and draining trade from every coast."

vamp_coast_centers_of_trade_4_title:0 "Salt and Shadow"
vamp_coast_centers_of_trade_4_desc:0 "With fifteen harbors choked in our grasp, our grip on global commerce tightens. Even the mightiest merchant empires now pay tithe in blood and gold to our armadas."

vamp_coast_centers_of_trade_5_title:0 "The Crimson Sea-Lanes"
vamp_coast_centers_of_trade_5_desc:0 "Twenty ports now ring the world with our curse. We have bled the arteries of trade, turned harbors to tombs, and made the waves themselves fear our approach."

vamp_coast_centers_of_trade_6_title:0 "Reefs of Ruin"
vamp_coast_centers_of_trade_6_desc:0 "Every new port is another nail in the coffin of the living’s dominion. With twenty-five trading hubs seized, our fleets rule the deeps with spectral supremacy."

vamp_coast_centers_of_trade_7_title:0 "Graves and Waves"
vamp_coast_centers_of_trade_7_desc:0 "Thirty coastal strongholds now bear our flag. We are not mere raiders — we are lords of death on every tide, and our maritime dominion cannot be denied."

vamp_coast_centers_of_trade_8_title:0 "The Drowned Empire"
vamp_coast_centers_of_trade_8_desc:0 "The world’s harbors are no longer bastions of life, but sanctuaries of the dead. Thirty-five ports feed our coffers, support our fleets, and extend our reach to every ocean’s edge."

vamp_coast_centers_of_trade_9_title:0 "Coastal Chokehold"
vamp_coast_centers_of_trade_9_desc:0 "Forty ports fall under our control. Trade bends to our will, pirates fly our banner, and naval empires wither before our necrotic might."

vamp_coast_centers_of_trade_10_title:0 "Dead Currents"
vamp_coast_centers_of_trade_10_desc:0 "With forty-five coastal centers of trade consumed, we have become the tide that washes clean the wealth of nations. No ship sails free, no gold changes hands without our notice."

vamp_coast_centers_of_trade_11_title:0 "Sovereigns of the Sea"
vamp_coast_centers_of_trade_11_desc:0 "Fifty harbors fall beneath our pallid banner. The world’s trade flows through undead fingers, and none may challenge our supremacy. The sea is ours, eternal and unyielding."


vamp_coast_cloth_1_title:0 "Sails of the Dead"
vamp_coast_cloth_1_desc:0 "Rotting canvas and kelp won't serve a proper fleet. If our ships are to sweep across the seas with dread and speed, we must take the finest cloth from the hands of mortal merchants and tailor it to our unholy sails."

vamp_coast_cloth_2_title:0 "Silks for the Storm"
vamp_coast_cloth_2_desc:0 "We have seized the markets, enslaved the tailors, and rewoven their finest fabrics into the sails of the damned. Now our armadas cut through storm and salt with terrifying swiftness. The dead do not sleep, and neither do our ships."

vamp_coast_buccaneers_in_charge_title:0 "The Crew Comes First"
vamp_coast_buccaneers_in_charge_desc:0 "Our empire is not ruled from gilded thrones, but from blood-slick decks and smoke-filled taverns. The Buccaneers—cutthroats, deckhands, and shambling gunners—are the beating heart of our fleets. Keep them paid, feared, and proud, and they will fight harder than any living sailor."

vamp_coast_control_markets_title:0 "Control the Flow of Coin"
vamp_coast_control_markets_desc:0 "Raiding ships is profitable, but raiding markets is power. By seizing control of marketplaces and trading halls, we dictate who grows rich and who starves. Merchants may breathe, but only at our pleasure."

vamp_coast_big_capital_title:0 "A Capital of Commerce"
vamp_coast_big_capital_desc:0 "What was once a pirate haven has become a nexus of global trade. Our capital draws wealth like a corpse draws flies. The lessons learned here—how to funnel gold, goods, and fear—can be replicated across every port we claim."

vamp_coast_large_kingdom_title:0 "A Maritime Empire"
vamp_coast_large_kingdom_desc:0 "Our realm sprawls across seas and continents, scattered yet united by tide and terror. We cannot rule as landbound empires do—but through harbors, trade routes, and cannon fire, we make every holding count."

vamp_coast_trading_bonuses_title:0 "Tighten the Noose"
vamp_coast_trading_bonuses_desc:0 "Spices, cloth, iron, salt—every cargo enriches us further. With enough trade under our control, we no longer merely profit from commerce; we weaponize it, squeezing the world’s wealth until it flows where we command."

vamp_coast_grow_maelstrom_title:0 "Feed the Maelstrom"
vamp_coast_grow_maelstrom_desc:0 "The Maelstrom is no mere wonder—it is hunger given form. As we deepen its foundations and expand the port that surrounds it, the whirlpool grows stronger, dragging wealth, sailors, and ships inexorably into our grasp."

vamp_coast_complete_maelstrom_title:0 "Heart of the Drowned"
vamp_coast_complete_maelstrom_desc:0 "The Maelstrom is complete. Surrounded by graveyards of ships and drill-yards of the dead, it becomes the beating heart of our dominion. From this nexus, riches, manpower, and power surge outward like a tide that will never recede."

vamp_coast_salt_1_title:0 "Preserve the Dead"
vamp_coast_salt_1_desc:0 "Salt keeps meat from rotting—and undead flesh from sloughing off at sea. By securing steady supplies, our crews endure long voyages without decay claiming them before battle does."

vamp_coast_salt_2_title:0 "Bodies That Do Not Break"
vamp_coast_salt_2_desc:0 "With full control of the salt trade, our ships become floating charnel houses of perfectly preserved warriors. Attrition means little to sailors who no longer feel pain, hunger, or exhaustion."

vamp_coast_smugglers_in_charge_title:0 "The Smugglers’ Code"
vamp_coast_smugglers_in_charge_desc:0 "They blur the line between pirate and merchant, ferrying stolen goods beneath moonlit tides. The Smugglers grease the wheels of our black markets and bribe officials too cowardly to resist. With them in power, the shadows become ours."

vamp_coast_stable_government_title:0 "A Council of Cutthroats"
vamp_coast_stable_government_desc:0 "Buccaneers, Smugglers, Captains—all sworn to different codes, but bound by fear, gold, and the lash. When all factions are kept sated and in check, even an undead pirate state can know order—of a sort. A stable chaos is still stability."

vamp_coast_raid_the_world_title:0 "Plunder the World"
vamp_coast_raid_the_world_desc:0 "The riches of the land are no less ripe than those of the sea. Burn their farms, shatter their gates, and seize everything not nailed down. Our fleets may sail, but it is boots on soil that bring true wealth."

vamp_coast_skilled_army_title:0 "Strike Fast, Strike True"
vamp_coast_skilled_army_desc:0 "We are not the Empire. We field no ranks of gleaming knights or endless regiments. Our strength lies in precision—elite captains, handpicked troops, and a doctrine of brutal, lightning-fast raids."

vamp_coast_major_raid_title:0 "Break the Bastions"
vamp_coast_major_raid_desc:0 "Walls are no defense against our fury. We strike before their cries can reach the garrison, before their banners can rally. We shall master siegecraft, not to hold territory, but to raze it faster than it can be rebuilt."

vamp_coast_spy_in_capital_title:0 "Whispers at Their Throne"
vamp_coast_spy_in_capital_desc:0 "A well-placed whisper can do more damage than a broadside. A spy in the heart of the enemy's court can collapse a kingdom from within. And when the banners fall, we will already be waiting at their gates."

vamp_coast_major_raid_2_title:0 "Sack the Great Cities"
vamp_coast_major_raid_2_desc:0 "The grand capitals of the world—ornamented, fat with wealth, bloated with pride—are ripe for the torch. Let the bells toll as their walls fall. Let their streets run red. Let their riches become ours."

vamp_coast_many_continents_1_title:0 "Every Shore a Stronghold"
vamp_coast_many_continents_1_desc:0 "We are no longer bound by the coasts of Lustria or the Old World. Our fleets dock in every ocean, our banners fly from strange isles and distant lands. The sea is our road, and every continent a resting point."

vamp_coast_many_continents_2_title:0 "Maelstrom's Reach"
vamp_coast_many_continents_2_desc:0 "The Maelstrom is no longer a place—it is a presence. It binds our ports with storm and spell. From the west of Araby to the eastern shores of Cathay, our power flows from that eternal whirlpool."

vamp_coast_special_provinces_title:0 "Trophies of the Drowned"
vamp_coast_special_provinces_desc:0 "Across the world lie ancient harbors, ruined forts, cursed reefs. These are the trophies of our empire—prizes plucked from forgotten empires and drowned coasts. Their secrets now fuel our own designs."

vamp_coast_tropical_wood_1_title:0 "Harvest the Jungle Timber"
vamp_coast_tropical_wood_1_desc:0 "Deep in the tropics grow trees twisted by time and magic. Their wood is light, durable, and perfect for shipwrights. With a supply secured, our fleets will be stronger for every voyage."

vamp_coast_tropical_wood_2_title:0 "Masterwork Hulls"
vamp_coast_tropical_wood_2_desc:0 "No splinter nor storm shall break our ships now. Each hull is reinforced with tropical lumber, enchanted with sea-witch rites, and bound together by brine-soaked craftsmanship."

vamp_coast_the_finest_ships_title:0 "The Fleet Eternal"
vamp_coast_the_finest_ships_desc:0 "Salted corpses, cursed sails, lumbered hulls, and enchanted cannon—our ships are marvels of undeath and engineering. No living navy can rival their endurance. Our fleets are the grave—and the tide."

vamp_coast_own_the_seas_title:0 "The Dead Tide"
vamp_coast_own_the_seas_desc:0 "No flag dares rise against us. Wherever there are waves, our ships sail them. Wherever there is trade, our coffers fill from it. We are the sea’s master, and all who traverse it owe us tithe—or blood."


vamp_coast_captains_in_charge_title:0 "Keep the Captains Sated"
vamp_coast_captains_in_charge_desc:0 "The Captains command the decks, control the crews, and crush the skulls of those who disobey. If they turn on us, our fleets shatter. But if they’re kept loyal—with power, plunder, and prestige—they'll sail us into legend."

vamp_coast_extort_money_title:0 "Offer They Can't Refuse"
vamp_coast_extort_money_desc:0 "A wise nation pays what we ask. A foolish one delays—and bleeds. We collect war reparations not as tribute, but as warning. The longer they hesitate, the heavier the cost in coin and cannonfire."

vamp_coast_train_the_zombies_1_title:0 "Discipline the Dead"
vamp_coast_train_the_zombies_1_desc:0 "Shambling corpses are plentiful, but an army of meat means little without command. We have begun the grim work of turning rotting limbs into precise instruments of death. The dead shall march in step, under whip and will."

vamp_coast_train_the_zombies_2_title:0 "The Generals of Gore"
vamp_coast_train_the_zombies_2_desc:0 "Through relentless drilling and grim sorcery, our generals have mastered the art of leading the dead. Our armies respond with near-perfect obedience, executing battlefield maneuvers once thought impossible for corpses."

vamp_coast_necrofex_colossus_1_title:0 "Awaken the Necrofex"
vamp_coast_necrofex_colossus_1_desc:0 "Behind our shambling hordes march walking abominations—hulking constructs of iron, bone, and necromantic fury. Powered by cursed gunpowder and stitched with drowned sinew, the Necrofex Colossi will shatter walls and spirits alike."

vamp_coast_necrofex_colossus_2_title:0 "Machines of Death"
vamp_coast_necrofex_colossus_2_desc:0 "Our colossi now stand as masters of land and sea—a nightmare fusion of cannon, corpse, and command. With increased production and firepower, these titans of death turn sieges into slaughters."

vamp_coast_marines_title:0 "Storm the Shores"
vamp_coast_marines_desc:0 "We strike like lightning. From the sea, onto the shore, before a single horn can sound. Our marines are fast, disciplined, and undead. They do not hesitate. They do not falter. They take the beach—and everything beyond."

vamp_coast_monuments_1_title:0 "Deface the Relics"
vamp_coast_monuments_1_desc:0 "So many ancient empires... so many towering monuments... and not a single one with our name carved into it. Until now. We shall claim these wonders, cover them in barnacles, and scrawl our stories across their stone faces."

vamp_coast_monuments_2_title:0 "Carve Our Legacy"
vamp_coast_monuments_2_desc:0 "We are no mere raiders. We are conquerors, remembered not just in screams, but in stone. These monuments—rebuilt, defiled, or repurposed—now testify to our strength. Let the living tremble at every edifice we own."

vamp_coast_naval_supplies_1_title:0 "Secure the Shipwrights"
vamp_coast_naval_supplies_1_desc:0 "Ropes, tar, nails, rigging—the devil is in the details. With control of naval supplies, we ensure our ships remain battle-ready and storm-hardened. Our enemies may sail faster, but they won't sail longer."

vamp_coast_naval_supplies_2_title:0 "Tools of the Terror Fleet"
vamp_coast_naval_supplies_2_desc:0 "From cannon latches to coffin-shaped hammocks, every inch of our ships is optimized for terror. Our mastery over naval supplies ensures we can rebuild and retaliate faster than any mortal fleet dares to imagine."

vamp_coast_fleet_1_title:0 "A Fleet for Every Purpose"
vamp_coast_fleet_1_desc:0 "We are not a kingdom of fields or roads—we are a kingdom of hulls and sails. From ponderous galleons to swift raiders and troop transports packed with the dead, our vessels are built for every task the sea demands."

vamp_coast_control_docks_title:0 "Command the Shipyards"
vamp_coast_control_docks_desc:0 "A fleet is only as mighty as the docks that birth and mend it. By seizing shipyards and drydocks across the world, we ensure our numbers swell faster than our enemies can ever hope to match."

vamp_coast_fleet_2_title:0 "Pride of the Damned"
vamp_coast_fleet_2_desc:0 "Each ship bears scars of battle and trophies of conquest. Our flagship stands as a floating monument to terror, and even the smallest cutter sails with discipline and purpose. The sea itself has begun to recognize us."

vamp_coast_fleet_3_title:0 "Small but Unstoppable"
vamp_coast_fleet_3_desc:0 "Though our realm may appear scattered, our fleets strike with overwhelming force. Veterans of countless engagements, our admirals maneuver with ruthless efficiency, turning outnumbered battles into massacres."

vamp_coast_fleet_4_title:0 "The Largest Fleet Afloat"
vamp_coast_fleet_4_desc:0 "The living whisper of our numbers in disbelief. No landbound empire can comprehend how such a fleet is crewed, supplied, and commanded. They need not understand—only drown beneath it."

vamp_coast_fleet_5_title:0 "Masters of the Infinite Armada"
vamp_coast_fleet_5_desc:0 "We command a navy beyond counting, yet chaos does not reign. Every vessel moves as part of a greater whole, guided by iron discipline and necromantic will. This is not merely dominance—it is perfection."

vamp_coast_lumber_1_title:0 "Plunder the Timberlands"
vamp_coast_lumber_1_desc:0 "Ships are born of wood, and wood is born of conquest. By securing vast supplies of lumber, we ensure no storm, battle, or rot can keep our fleets from the waves for long."

vamp_coast_lumber_2_title:0 "Endless Repairs"
vamp_coast_lumber_2_desc:0 "With timber stores overflowing, our ships repair themselves even upon the open sea. Hulls are patched, masts replaced, and coffins restocked without ever needing to return to port. The fleet sails eternal."


vamp_coast_centers_of_trade_mod_1:0 "Ports of Pillage I"
desc_vamp_coast_centers_of_trade_mod_1:0 "Our foothold upon the coasts begins. These first few ports serve as waystations for raiding, resupply, and the spread of terror."

vamp_coast_centers_of_trade_mod_2:0 "Ports of Pillage II"
desc_vamp_coast_centers_of_trade_mod_2:0 "With more harbors under our black sails, we deepen our grip on trade routes and cast our shadow farther across the waves."

vamp_coast_centers_of_trade_mod_3:0 "Ports of Pillage III"
desc_vamp_coast_centers_of_trade_mod_3:0 "A growing network of cursed anchorages allows our fleets to strike swiftly and drain the wealth of the living with every tide."

vamp_coast_centers_of_trade_mod_4:0 "Ports of Pillage IV"
desc_vamp_coast_centers_of_trade_mod_4:0 "The ports we hold now throb with unnatural life. Their markets serve the dead, their ships sail under our command, and their riches feed our rise."

vamp_coast_centers_of_trade_mod_5:0 "Ports of Pillage V"
desc_vamp_coast_centers_of_trade_mod_5:0 "We have carved a bloody path through the world’s harbors. No merchant sails without fear, and no port is beyond our reach."

vamp_coast_centers_of_trade_mod_6:0 "Ports of Pillage VI"
desc_vamp_coast_centers_of_trade_mod_6:0 "The sea itself yields to our will. Our fleets resupply in every ocean, our raiders choke the currents, and our enemies drown in silence."

vamp_coast_centers_of_trade_mod_7:0 "Ports of Pillage VII"
desc_vamp_coast_centers_of_trade_mod_7:0 "The living’s dominion over the coasts lies broken. Trade flows where we allow, and all who defy us find their ships rotting on the reef."

vamp_coast_centers_of_trade_mod_8:0 "Ports of Pillage VIII"
desc_vamp_coast_centers_of_trade_mod_8:0 "Each port claimed strengthens our maritime stranglehold. The seas have become our graveyard empire, and death sails in our wake."

vamp_coast_centers_of_trade_mod_9:0 "Ports of Pillage IX"
desc_vamp_coast_centers_of_trade_mod_9:0 "Even the greatest trade leagues bow to our influence or burn. We are no longer raiders — we are rulers of the salt-choked world."

vamp_coast_centers_of_trade_mod_10:0 "Ports of Pillage X"
desc_vamp_coast_centers_of_trade_mod_10:0 "Our presence is felt from the Sea of Claws to distant Ind. Every coastal prize bleeds wealth into our coffers and feeds the engines of undeath."

vamp_coast_centers_of_trade_mod_11:0 "Ports of Pillage XI"
desc_vamp_coast_centers_of_trade_mod_11:0 "With the coasts of the world beneath our iron grasp, we reign supreme over trade, terror, and tide. None shall sail freely, and none shall resist us for long."


vamp_coast_cloth_sails_1:0 "Crimson Sails"
desc_vamp_coast_cloth_sails_1:0 "We have looted fine cloth from across the seas, dyeing it in blood and fitting it to our ships. The result is faster, deadlier vessels."

vamp_coast_cloth_sails_2:0 "Storm-Cut Sails"
desc_vamp_coast_cloth_sails_2:0 "Cloth fit for royalty now graces our ghostly ships, woven into sails that catch wind like death itself. We are faster than any foe."

vamp_coast_salted_seamen_1:0 "Salted Seamen"
desc_vamp_coast_salted_seamen_1:0 "Salt preserves the flesh of the living—and of the dead. With steady access to salt, our crews can endure longer at sea without rot."

vamp_coast_salted_seamen_2:0 "Salted Souls"
desc_vamp_coast_salted_seamen_2:0 "Our ships are crewed by bodies that do not tire, rot, or drown. Salt binds them together, allowing our fleets to range endlessly across the world."

vamp_coast_tropical_wood_mod_1:0 "Jungle Timber Hulls"
desc_vamp_coast_tropical_wood_mod_1:0 "Harvested from the densest and most ancient jungles, this flexible yet resilient wood forms the bones of our ships, increasing their ability to withstand enemy fire."

vamp_coast_tropical_wood_mod_2:0 "Hull of the Leviathan"
desc_vamp_coast_tropical_wood_mod_2:0 "Our ships are now clad in timber tough enough to turn aside cannonballs and storms alike. They are slow to sink, and quick to kill."

vamp_coast_better_equipment_1:0 "Battle-Tested Rigging"
desc_vamp_coast_better_equipment_1:0 "We’ve acquired ropes, sails, anchors, and fittings of exceptional quality—enough to give us an edge in every engagement on the open sea."

vamp_coast_better_equipment_2:0 "Superior Naval Outfitting"
desc_vamp_coast_better_equipment_2:0 "With global access to the best maritime tools and stores, our vessels are outfitted to outmaneuver and outgun even the finest navies."

vamp_coast_lumber_stores_1:0 "Lumber-Fed Repair Crews"
desc_vamp_coast_lumber_stores_1:0 "With ample lumber stored aboard, our ships are quickly mended between battles—sometimes even during them. What breaks is swiftly replaced."

vamp_coast_lumber_stores_2:0 "Endless Timber Reserves"
desc_vamp_coast_lumber_stores_2:0 "With vast reserves of high-grade lumber, our ships repair at sea, hold their form in terrible weather, and cost less to maintain. Our enemies rot—our hulls do not."

vamp_coast_finest_ships:0 "The Finest Ships Afloat"
desc_vamp_coast_finest_ships:0 "Salted sails, hardwood hulls, iron fittings, and undead crews—our vessels are a fusion of necromancy and craftsmanship. No living navy can match our endurance, firepower, or speed. These are not ships. They are engines of extinction."

vamp_coast_happy_buccaneers:0 "Content Corsairs"
desc_vamp_coast_happy_buccaneers:0 "Our crews—dead and otherwise—are kept busy with rum, plunder, and purpose. Their morale rides high as our black sails."

vamp_coast_happy_smugglers:0 "Well-Fed Smugglers"
desc_vamp_coast_happy_smugglers:0 "The Smugglers are content, their holds heavy with contraband and profit. Their shadowy networks now fuel our coffers with stolen riches."

vamp_coast_happy_captains:0 "Obedient Officers"
desc_vamp_coast_happy_captains:0 "Captains rule their ships like tyrants—but only if they remain loyal to us. For now, our most influential dead are content."

vamp_coast_stable_government_mod:0 "Dread Stability"
desc_vamp_coast_stable_government_mod:0 "Against all odds, we have forged stability from anarchy. Undead sailors, mercenary captains, and smugglers all serve beneath a single banner—ours."

vamp_coast_raid_world_mod:0 "Shoreline Raiders"
desc_vamp_coast_raid_world_mod:0 "Why wait for riches to come to us? Our armies strike from the sea, take what they want, and vanish like ghosts into the tides."

vamp_coast_skilled_army_mod:0 "Veterans of the Black Tide"
desc_vamp_coast_skilled_army_mod:0 "Though we cannot muster vast legions, our elite crews strike with brutal precision. Their skill and pillaging fund our empire."

vamp_coast_breachers_1:0 "Breaching Specialists I"
desc_vamp_coast_breachers_1:0 "Our raiders know how to collapse walls and gut cities with terrifying speed. No fortress is safe from our first waves."

vamp_coast_breachers_2:0 "Breaching Specialists II"
desc_vamp_coast_breachers_2:0 "From spies within to cannons without, our methods have become ruthlessly efficient. Even capital cities fall before our tide."

vamp_coast_breachers_3:0 "Breaching Specialists III"
desc_vamp_coast_breachers_3:0 "We do not merely sack cities—we erase them. The most fortified metropolises crumble in days beneath our relentless assault."

vamp_coast_ports_of_call_1:0 "Maelstrom Web I"
desc_vamp_coast_ports_of_call_1:0 "Our coastal holdings form a vast, interconnected network. No matter where we sail, our presence lingers like a curse upon the waves."

vamp_coast_ports_of_call_2:0 "Maelstrom Web II"
desc_vamp_coast_ports_of_call_2:0 "From Lustria to Ind, our ports are bound by sea-magic and bloody trade. Wherever the ocean churns, we are already there."

vamp_coast_own_the_seas_mod:0 "Terror of the Tides"
desc_vamp_coast_own_the_seas_mod:0 "We are more than pirates—we are a storm given form. None sail without our leave, and no navy dares challenge our dominion. The seas are ours now, forevermore."

vamp_coast_trade_1:0 "Smuggler Syndicates"
desc_vamp_coast_trade_1:0 "By controlling the traders themselves, we've gained a keen nose for profit. We move before the markets shift."

vamp_coast_trade_2:0 "Lessons of the Capital"
desc_vamp_coast_trade_2:0 "Our capital has become a beacon of commerce. From its success, we have learned how to grow wealth from salt and rot."

vamp_coast_trade_3:0 "Profiteering Archipelago"
desc_vamp_coast_trade_3:0 "Our realm may be scattered like driftwood, but each island churns out wealth, guided by the currents of the trade winds."

vamp_coast_trade_4:0 "Choke the Flow"
desc_vamp_coast_trade_4:0 "As we collect trade goods, we tighten the noose around global commerce. What flows must pass through our coffers first."

improved_maelstrom:0 "Empowered Maelstrom"
desc_improved_maelstrom:0 "The Maelstrom howls with ancient hunger, drawing knowledge, wealth, and drowned sailors into its spiral of power."

vamp_coast_lets_make_a_deal:0 "Let's Make a Deal"
desc_vamp_coast_lets_make_a_deal:0 "When we come knocking, you'd best sign fast. Delay only increases the price—and the pain."

vamp_coast_great_generals_1:0 "Cadaver Commanders I"
desc_vamp_coast_great_generals_1:0 "Among the dead march the brilliant. We've trained—or raised—officers who know how to turn rot into rhythm."

vamp_coast_great_generals_2:0 "Cadaver Commanders II"
desc_vamp_coast_great_generals_2:0 "They break walls and expectations. Our commanders are cunning beyond death, carving victory with fire and precision."

vamp_coast_necrofex_colossus_mod_1:0 "Necrofex Barrage I"
desc_vamp_coast_necrofex_colossus_mod_1:0 "Colossal constructs, part ship, part corpse, line our ranks. Their guns thunder like the Maelstrom itself."

vamp_coast_necrofex_colossus_mod_2:0 "Necrofex Barrage II"
desc_vamp_coast_necrofex_colossus_mod_2:0 "Perfected and plentiful, our Necrofex Colossi walk among men like titanic ghosts, firing death in volleys."

vamp_coast_swift_invasion:0 "Tideborne Assault"
desc_vamp_coast_swift_invasion:0 "Our marines spill onto beaches like a crashing wave. The living never have time to brace."

vamp_coast_fleet_mod_1:0 "Fleet of Purpose"
desc_vamp_coast_fleet_mod_1:0 "Our ships are built for many roles. We can blockade, chase, and strike wherever the wind dares blow."

vamp_coast_fleet_mod_2:0 "Dockyard Dominion"
desc_vamp_coast_fleet_mod_2:0 "With control over key dockyards, we’ve unlocked a new scale of shipbuilding. The sea shall bristle with our sails."

vamp_coast_fleet_mod_3:0 "Pride of the Fleet"
desc_vamp_coast_fleet_mod_3:0 "From ragged sloops to flagships of terror, every ship in our fleet is feared and battle-hardened."

vamp_coast_fleet_mod_4:0 "Fleet of Nightmares"
desc_vamp_coast_fleet_mod_4:0 "Our navy rivals the greatest powers, despite our deathless crews and eerie designs. We are a black tide upon the waters."

vamp_coast_fleet_mod_5:0 "Fleet of Legends"
desc_vamp_coast_fleet_mod_5:0 "Other nations tell stories of our fleet. Of ships that vanish, then return under black sails. Of the cursed that never dock."

vamp_coast_fleet_mod_6:0 "Greatest Fleet in History"
desc_vamp_coast_fleet_mod_6:0 "We have surpassed all that came before. Our fleet is unmatched, our captains legends, our sails a herald of doom."


vampire_events.100.title:0 "Tomes of the Abyss"
vampire_events.100.desc:0 "The dredgers have recovered a wreck unlike any other. Its hull was encrusted in corals and chained with arcane sigils, and within its hold were sealed tomes that pulse with forbidden energy.\n\nThe pages are soaked in seawater, but their runes writhe with Chaos power and necromantic secrets. These volumes could unravel minds—or empower a generation of dark mages."

vampire_events.100.a:0 "Send it back to the deep."
vampire_events.100.b:0 "Read the tomes."

vampire_events.101.title:0 "Trade or Plunder?"
vampire_events.101.desc:0 "Among your captains, a schism forms. Some argue that structured trade brings greater, steadier profit—especially with desperate coastal merchants willing to deal with the damned.\n\nOthers scoff, claiming the only honest coin is taken by force at sea. As the fog rolls in, they await your verdict."

vampire_events.101.a:0 "Trade will fill our coffers."
vampire_events.101.b:0 "Let them fear our sails!"

vampire_events.102.title:0 "Wreck of the Leviathan"
vampire_events.102.desc:0 "A vast warship from a forgotten age is hauled from the depths, its hull wrapped in barnacles and dark runes. But just as it breaks the surface, it snaps in two with a wail that echoes across the bay.\n\nYour crew scrambles—half fight to save the sunken cargo, while the other half drag survivors from the cursed waters. You can only choose one."

vampire_events.102.a:0 "Save the crew—we’ll need their experience."
vampire_events.102.b:0 "Take the treasure and leave the dead behind."

vampire_events.103.title:0 "Attack of the Deep One"
vampire_events.103.desc:0 "A monstrous kraken rises from the deep, thrashing one of your coastal ports with tentacles like ship masts. Sailors and undead alike are dragged screaming into the surf.\n\nThis beast is no mere animal—it is drawn to your necromantic presence, a predator of the unnatural. You must decide: fight the creature or offer it a sacrifice."

vampire_events.103.a:0 "Our battle shall be legendary!"
vampire_events.103.b:0 "Let it feast—just this once."

vampire_events.104.title:0 "A Port of the Damned"
vampire_events.104.desc:0 "The time has come to expand your domain. With enough bone labor and dark gold, your port could rival any Old World harbor in influence and dread.\n\nAlready, traders and smugglers flock to your docks, eager to traffic in illicit goods, souls, and relics. It is time to decide how best to channel this growth."

vampire_events.104.a:0 "Upgrade the port. Let it be a beacon of dread."
vampire_events.104.b:0 "Train merchants to spread our influence abroad."

vampire_events.105.title:0 "Land or Sea?"
vampire_events.105.desc:0 "A council of your captains demands clarity. Shall your forces focus on land assaults, sieging mortal cities and claiming the soil? Or will the seas remain your domain, a haunted expanse none dare cross?\n\nThough the undead never tire, your fleets and armies cannot be everywhere at once. A decision must be made before ambition outruns capacity."

vampire_events.105.a:0 "To sea! The ocean is our throne."
vampire_events.105.b:0 "We need troops to take the ports. Without them, the fleet rots."

vampire_events.106.title:0 "Riots in the Docks"
vampire_events.106.desc:0 "What began as a drunken brawl has erupted into full-blown chaos. Crews are looting storehouses, attacking rivals, and dragging officers into the surf.\n\nDiscipline among pirates is thin, and your rule now teeters. Will you calm the mob, offer them a voice, or let the streets run red?"

vampire_events.106.a:0 "Go personally and restore order."
vampire_events.106.b:0 "Call a council and let them bicker."
vampire_events.106.c:0 "Let them riot. Blood will wash away weakness."

vampire_events.107.title:0 "Challenge to the Throne"
vampire_events.107.desc:0 "Rumors swirl through the lower decks. Whispers of discontent have turned into chants, and now your rivals move openly, claiming your time has passed.\n\nWhether through duel, deception, or abdication, the question looms: who truly commands the Vampire Coast?"

vampire_events.107.a:0 "I'm still the boss!"
vampire_events.107.b:0 "Let the strongest rule."
vampire_events.107.c:0 "Trial by combat—may the sea choose its king."

vampire_events.108.title:0 "The Illusion of Rule"
vampire_events.108.desc:0 "The captains grow restless. They served under the banner of a republic—one with votes, councils, and shared loot. But no elections have been held in years, and your grip on power has tightened like a noose.\n\nThey demand a choice: uphold the illusion, give them blood, or buy their silence."

vampire_events.108.a:0 "I'm still the boss."
vampire_events.108.b:0 "Fine! Hold an election! I'll see you in hell!"
vampire_events.108.c:0 "Buy their loyalty with gold and rum."



vampire_events.1000.t:0 "The Drowned Rise Again"  
vampire_events.1000.d:0 "The Vampire Coast is no mere stretch of haunted shoreline—it is a graveyard given life. Beneath the waves lie the bones of a thousand wrecks, and above them sails a fleet not bound by tides, but by necromancy and hunger. Where the living see ruin and rot, the undead see opportunity, and their ships rise once more to plunder the coasts and shatter the trade routes of the world.\n\nDriven by madness, ambition, or some darker calling, $MONARCH$ commands the drowned. His fleet is no mortal navy, but a floating tomb of cursed wood and soul-bound iron, crewed by revenants, ghouls, and the drowned dead. In his wake, the seas blacken, and the living flee before the storm.\n\nThe oceans shall no longer be the realm of man or elf. Under black sails and necromantic banners, the Maelstrom awakens—and it hungers for gold, blood, and dominion.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
vampire_events.1000.option_1:0 "To plunder and perdition!"
claims_on_trade_centers_tt:0 "Gain permanent claims on nearby coastal trade centers."
