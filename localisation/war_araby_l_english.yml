##################################
##### MODIFIERS
##################################

araby_happy_church:0 "Content Imams"
araby_happy_church_desc:0 "Our imams are satisfied with their place in society, spreading peace and tolerance throughout the land."

araby_place_of_study:0 "House of Wisdom"
araby_place_of_study_desc:0 "This province is home to a great center of knowledge, where scholars gather to discuss philosophy, science, and theology."

araby_place_of_law:0 "Majlis al-Shura"
araby_place_of_law_desc:0 "The establishment of this council of judges ensures swift and just governance, reducing the costs of maintaining order."

araby_place_of_innovation:0 "Majlis al-Ilm"
araby_place_of_innovation_desc:0 "This council of scholars and inventors is dedicated to furthering our understanding of the world, making us a beacon of enlightenment."

araby_charitable:0 "Waqf of Generosity"
araby_charitable_desc:0 "Our acts of charity toward neighboring lands improve our relations and allow us to extend our influence with ease."

araby_historical_defender:0 "Guardian of the Faith"
araby_historical_defender_desc:0 "As the guardians of our faith, we are respected across the realms. Our steadfastness inspires the faithful and intimidates our rivals."

araby_add_missionary_1:0 "Civilizing Mission"
araby_add_missionary_1_desc:0 "Our da'wa efforts intensify, sending missionaries across the land to spread the true faith with growing zeal."

araby_add_missionary_2:0 "Da'wa Movement"
araby_add_missionary_2_desc:0 "With renewed vigor, our da'wa movement spreads the light of faith to distant regions, bringing more souls into the fold."

araby_holy_war:0 "Jihad"
araby_holy_war_desc:0 "A righteous struggle against those who oppose our beliefs. We have a divine mandate to wage jihad against the enemies of the faith."

araby_holy_war_2:0 "Greater Jihad"
araby_holy_war_2_desc:0 "Our holy warriors carry the banner of faith with great fervor, making swift and decisive conquests in the name of the One True God."

araby_expand_abroad:0 "Overseas Settlers"
araby_expand_abroad_desc:0 "Our people are pioneers and adventurers, ready to expand beyond the borders of our homeland, exploring and settling new lands."


araby_trade_hub:0 "Bustling Trade Hub"
araby_trade_hub_desc:0 "Our lands are at the crossroads of trade, bringing prosperity and wealth to all who do business here. Merchants from distant lands gather at our markets, invigorating our economy."

araby_cavalry_fraction:0 "Lords of Horse and Steel"
araby_cavalry_fraction_desc:0 "Our cavalry is the pride of our military, leading charges with unmatched speed and devastating our enemies on the flanks. Our forces are renowned for their powerful cavalry presence."


gen_araby_ultimate_mission_title:0 "Empire of the Crescent Moon"
gen_araby_ultimate_mission_desc:0 "With faith, innovation, and trade flowing from every corner of Araby, we have united the world under our influence. Our scholars, merchants, and warriors have shown the strength of Araby to all nations, and none can doubt the power of the Crescent Moon."

araby_ultimate_reward:0 "Blessings of the Crescent Moon"
desc_araby_ultimate_reward:0 "Araby stands as a beacon of faith, wisdom, and prosperity. With unwavering devotion and unmatched ingenuity, we secure our place as a dominant force in the world, blessed by the Crescent Moon."




##################################
##### MISSIONS
##################################

gen_araby_please_nobility_title:0 "Favor of the Emirs"
gen_araby_please_nobility_desc:0 "The loyalty of the emirs is paramount to maintaining our authority. We must earn their trust to ensure they support our rule and our faith."

gen_araby_cavalry_title:0 "Raise the Aswaran"
gen_araby_cavalry_desc:0 "Our elite cavalry, the Aswaran, are feared throughout the desert. We shall raise a grand force of cavalry to assert our dominance on the battlefield and protect our lands from all threats."

gen_araby_war_with_infidel_title:0 "War on the Infidels"
gen_araby_war_with_infidel_desc:0 "The time has come to fulfill our sacred duty. We must bring the wrath of the righteous upon those who reject the truth of our faith."

gen_araby_war_expand_faith_title:0 "Spread the Word"
gen_araby_war_expand_faith_desc:0 "Our empire must extend the reach of the faith, conquering new lands and converting them to our righteous cause."

gen_araby_build_docks_title:0 "Construct the Docks"
gen_araby_build_docks_desc:0 "To dominate the seas and connect our lands with distant trade routes, we must build mighty docks to support our expanding fleet."

gen_araby_expand_overseas_title:0 "Expand Across the Seas"
gen_araby_expand_overseas_desc:0 "The seas are the lifeblood of trade and conquest. We must extend our influence beyond the horizon, spreading our faith to foreign shores."

gen_araby_center_of_trade_title:0 "Establish a Center of Trade"
gen_araby_center_of_trade_desc:0 "The wealth of the world flows through our lands. By establishing a powerful center of trade, we can control the lifeblood of commerce and expand our influence."


##################################
##### ONE FAITH RELIGION MISSIONS
##################################

gen_one_faith_happy_priest_title:0 "Content Imams"
gen_one_faith_happy_priest_desc:0 "The imams are loyal to our cause, ensuring stability in the spiritual realm and harmony within our borders."

gen_one_faith_places_of_worship_title:0 "Construct Masjids"
gen_one_faith_places_of_worship_desc:0 "Our people must have places to gather in prayer and reflection. By constructing masjids, we shall secure their faith and devotion."

gen_one_faith_place_of_study_title:0 "Establish the Dar al-Ilm"
gen_one_faith_place_of_study_desc:0 "A great center of learning in our capital will solidify our place as a beacon of wisdom, guiding both the faithful and the curious."

gen_one_faith_places_of_law_title:0 "Promote the Majlis"
gen_one_faith_places_of_law_desc:0 "By creating institutions of justice throughout our land, we demonstrate that the law and the faith are one, ensuring stability and order."

gen_one_faith_places_of_innovation_title:0 "Nurture Scholars"
gen_one_faith_places_of_innovation_desc:0 "We must foster intellectual growth and innovation, encouraging scholars to push the boundaries of knowledge under the guidance of our faith."

gen_one_faith_charitable_title:0 "Practice Sadaqah"
gen_one_faith_charitable_desc:0 "Charity is a virtue praised by the divine. By giving generously to our neighbors, we will win their hearts and demonstrate the strength of our faith."

gen_one_faith_defender_of_faith_title:0 "Amir al-Mu'minin"
gen_one_faith_defender_of_faith_desc:0 "As the Defender of the Faithful, we stand as the bulwark against those who threaten the unity and purity of our belief, protecting the righteous from all harm."


##

claim_solar_mandate_title:0 "Claim the Solar Mandate"
claim_solar_mandate_desc:0 "The last Prophet of the Sun is dead. It is time for us to claim the Mandate. The Sun God Ptra has chosen $MONARCH$ as his voice! \n\nBecoming the Prophet of the Sun gives a powerful CB on all Southlands provinces, and provides great opportunity for reform. But losing mandate, through devastation or bordering non-subjects, can destroy your nation."


claim_solar_mandate_effect_tt:0 "Declare $MONARCH$ as the prophet of the sun.\n\nBecoming the Prophet of the Sun gives a powerful CB on all Southlands provinces, and provides great opportunity for reform. But losing mandate, through devastation or bordering non-subjects, can destroy your nation."



araby_events.1.t:0 "A Djinn Unbound in the Capital"
araby_events.1.d:0 "At dawn the palace wards flared and shattered like glass beneath a hammer, and a djinn—half smoke, half burning crystal—tore free of its bindings in the heart of our capital. It stalks the rooftops and market squares, scattering soldiers and laughing as masonry cracks beneath unseen force. The people whisper that the Eternal Light has turned its face from us.\n\nBy dusk the spirit has made its demand plain: gold, jewels, and safe passage beyond our lands. The Djinn Binders argue bitterly over fault and remedy, each fearing that mishandling the crisis will stain their order. Whatever we choose, the Mandate of the Sun trembles with the outcome.\n\nA swift response may restore order and confidence. Hesitation—or humiliation—may echo far beyond these burning streets."

araby_events.1.option_1:0 "No bargains with spirits."
araby_events.1.option_2:0 "Pay it. Spare the city."
araby_events.1.option_3:0 "Steel and seals."
araby_events.1.option_4:0 "Appease it quietly."

araby_events.2.t:0 "A New Prophet Proclaims Himself"
araby_events.2.d:0 "In a crowded square thick with incense and dust, a preacher has declared himself the true Prophet of the Sun. His voice carries across the stalls and fountains, promising unity, purification, and a blazing destiny for Araby. Already tribes and townsfolk gather beneath his words.\n\nSome dismiss him as a zealot intoxicated by his own sermons. Others fear that the Sun raises champions in unexpected places, and that denying such a figure courts disaster. Rumors spread faster than soldiers can march.\n\nIf we crush him, we risk creating a martyr. If we ignore him, we may wake to find half the realm chanting his name."

araby_events.2.option_1:0 "Silence him."
araby_events.2.option_2:0 "Ignore the fanatic."

araby_events.3.t:0 "A Willing Djinn Seeks the Muster"
araby_events.3.d:0 "Before the assembled court, a djinn has stepped from a brazier’s flame and knelt as though it were flesh and blood. It claims to be weary of forgotten ruins and empty deserts, and offers its strength to our banners. The guards stand rigid, unsure whether to strike or kneel.\n\nThe Djinn Binders debate whether such willingness is a blessing or a deception. A spirit that serves openly may inspire awe among our soldiers and dread among our enemies. Yet prideful spirits are quick to anger when slighted.\n\nTo accept its oath would be unprecedented. To refuse it may drive it into less friendly hands."

araby_events.3.option_1:0 "Let it fight."
araby_events.3.option_2:0 "Make it a general."
araby_events.3.option_3:0 "Bind it instead."

araby_events.4.t:0 "The Stone-Bound Djinn"
araby_events.4.d:0 "Through careful geometry, bronze seals, and unbroken recitation, the Mi'marun have bound a djinn of stone and deep earth. Its voice rumbles like distant thunder, and its patience stretches back before memory. It does not resist, but neither does it forgive carelessness.\n\nSuch a being can raise walls that defy time or coax life from stubborn soil. Entire districts could be reshaped under its guidance, foundations laid with uncanny precision. Yet each task demands vigilance and proper tribute.\n\nWe must decide how best to direct this immense strength. A wise choice may reshape our realm for generations."

araby_events.4.option_1:0 "Raise great works."
araby_events.4.option_2:0 "Enrich the land."
araby_events.4.option_3:0 "Empower this province."

araby_events.5.t:0 "A Caravan Like a Moving City"
araby_events.5.d:0 "From the horizon emerges a caravan so vast it seems a wandering city, its banners snapping in the wind and its camels laden with goods from distant shores. Merchants bearing foreign seals request safe passage through our lands. Their wealth glitters even beneath desert dust.\n\nSuch traffic strengthens markets and spreads our renown across continents. Yet opportunity tempts greed, and the desert remembers those who prey upon travelers.\n\nOur decision will echo along trade routes from coast to oasis. Prosperity and reputation ride upon our judgment."

araby_events.5.option_1:0 "Free passage."
araby_events.5.option_2:0 "Impose a tariff."
araby_events.5.option_3:0 "Seize their goods."

araby_events.6.t:0 "Keeping Pace with a Wider World"
araby_events.6.d:0 "Advisers warn that distant realms experiment with new hull designs, strange cannon, and unfamiliar administrative arts. If we cling too tightly to tradition, we may awaken to find ourselves outmatched. Even faith must walk beside wisdom.\n\nSome urge exploration and study, dispatching ships and scholars to learn from afar. Others insist our strength lies within disciplined reform at home. Still others whisper that secrets need not be requested—they can be taken.\n\nThe world beyond Araby does not stand still. We must decide how we will meet it."

araby_events.6.option_1:0 "Explore outward."
araby_events.6.option_2:0 "Focus inward."
araby_events.6.option_3:0 "Use spies."

araby_events.7.t:0 "On the Nature of Foreign Gods"
araby_events.7.d:0 "Within our halls, jurists and binders debate the essence of foreign deities. Are they demons wearing pleasing masks, or confused reflections of the One Eternal Light? The answer will shape policy as much as theology.\n\nHardliners warn that compromise invites corruption and daemonic influence. Moderates argue that patient teaching may convert more souls than force. Pragmatists note that tolerance can ease diplomacy.\n\nDoctrine forged today may guide the realm for generations. We must choose our interpretation carefully."

araby_events.7.option_1:0 "They are demons."
araby_events.7.option_2:0 "They are misguided."
araby_events.7.option_3:0 "Study them."

araby_events.8.t:0 "A Djinn Offers Teaching"
araby_events.8.d:0 "A solitary djinn has approached one of our provinces, offering forbidden instruction in exchange for hospitality. It speaks of hidden laws of motion, new methods of forging, and secrets gleaned from distant civilizations. Its tone is calm—almost patient.\n\nThe Djinn Binders are uneasy, for knowledge granted by spirits often conceals a hook. Innovation gained too quickly may carry unseen consequences. Yet the promise of advancement is undeniable.\n\nTo accept its teaching could leapfrog years of effort. To refuse may leave us stagnant in a changing world."

araby_events.8.option_1:0 "Hear it out."
araby_events.8.option_2:0 "Refuse."
araby_events.8.option_3:0 "Purge this spirit."

araby_events.9.t:0 "Zakat and the Measure of Mercy"
araby_events.9.d:0 "Sacred taxation binds ruler and subject in shared obligation beneath the Eternal Light. Yet war and expansion strain the treasury, and ministers propose increasing the levy. The people already murmur at rising demands.\n\nSome argue that firm taxation demonstrates strength and sustains the Mandate of the Sun. Others insist that returning wealth to the faithful through charity will secure loyalty more deeply than fear.\n\nAuthority is measured not only in coin, but in trust. Our decision will define how the people remember our reign."

araby_events.9.option_1:0 "Increase taxes."
araby_events.9.option_2:0 "Return it as charity."

araby_events.100.t:0 "Dawn of the One Faith"
araby_events.100.d:0 "For millennia, Araby bent its knee to many masters—old desert gods, borrowed idols, and whispering spirits that promised power at a hidden price. In every oasis and city, names were offered up that were not fit to be spoken, and the djinn were treated as patrons rather than perils. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, proclaiming himself the Prophet of the Sun, bearing a single, terrible truth: there is only one god, and the Sun is His sign upon the world. All other powers are demons wearing familiar faces, feeding upon fear, tradition, and convenient lies. In the span of thirty years, Fakir has ridden from coast to deep desert, uniting Araby through treaty and conquest alike, until even the proudest tribes speak with one tongue in public—if not always in private.\n\nYet the work is unfinished. The Prophet of the Sun rules by the Solar Mandate, a covenant of belief as much as law: so long as the people trust in the Prophet’s favor, his authority is radiant, his reforms swift, and his realm unshaken. But if doubt spreads and the Mandate is judged lost, the same sun that crowned him will glare upon his failures.\n\nAnd there is one final teaching that unsettles even the faithful: the next Prophet may rise from anywhere. Not only the sons of Araby, but Skaven, Ogres, and foreign knights may claim the solar mantle if they speak the One Truth and gather belief behind their banner. This is not a threat alone—it is proof that the whole world is ripe for revelation.\n\nThe dawn has come. Let the deserts and seas carry the One Faith to every horizon, until no demon finds refuge in ignorance."
araby_events.100.a:0 "Let the world face the Light."