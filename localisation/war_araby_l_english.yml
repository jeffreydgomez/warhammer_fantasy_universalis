l_english:



##################################
##### MODIFIERS
##################################

araby_happy_church:0 "Content Imams"
araby_happy_church_desc:0 "Our imams are satisfied with their place in society, spreading peace and tolerance throughout the land."

araby_place_of_study:0 "House of Wisdom"
araby_place_of_study_desc:0 "This province is home to a great center of knowledge, where scholars gather to discuss philosophy, science, and theology."

araby_place_of_law:0 "Majlis al-Shura"
araby_place_of_law_desc:0 "The establishment of this council of judges ensures swift and just governance, reducing the costs of maintaining order."

araby_place_of_innovation:0 "Majlis al-Ilm"
araby_place_of_innovation_desc:0 "This council of scholars and inventors is dedicated to furthering our understanding of the world, making us a beacon of enlightenment."

araby_charitable:0 "Waqf of Generosity"
araby_charitable_desc:0 "Our acts of charity toward neighboring lands improve our relations and allow us to extend our influence with ease."

araby_historical_defender:0 "Guardian of the Faith"
araby_historical_defender_desc:0 "As the guardians of our faith, we are respected across the realms. Our steadfastness inspires the faithful and intimidates our rivals."

araby_add_missionary_1:0 "Civilizing Mission"
araby_add_missionary_1_desc:0 "Our da'wa efforts intensify, sending missionaries across the land to spread the true faith with growing zeal."

araby_add_missionary_2:0 "Da'wa Movement"
araby_add_missionary_2_desc:0 "With renewed vigor, our da'wa movement spreads the light of faith to distant regions, bringing more souls into the fold."

araby_holy_war:0 "Jihad"
araby_holy_war_desc:0 "A righteous struggle against those who oppose our beliefs. We have a divine mandate to wage jihad against the enemies of the faith."

araby_holy_war_2:0 "Greater Jihad"
araby_holy_war_2_desc:0 "Our holy warriors carry the banner of faith with great fervor, making swift and decisive conquests in the name of the One True God."

araby_expand_abroad:0 "Overseas Settlers"
araby_expand_abroad_desc:0 "Our people are pioneers and adventurers, ready to expand beyond the borders of our homeland, exploring and settling new lands."


araby_trade_hub:0 "Bustling Trade Hub"
araby_trade_hub_desc:0 "Our lands are at the crossroads of trade, bringing prosperity and wealth to all who do business here. Merchants from distant lands gather at our markets, invigorating our economy."

araby_cavalry_fraction:0 "Lords of Horse and Steel"
araby_cavalry_fraction_desc:0 "Our cavalry is the pride of our military, leading charges with unmatched speed and devastating our enemies on the flanks. Our forces are renowned for their powerful cavalry presence."


gen_araby_ultimate_mission_title:0 "Empire of the Crescent Moon"
gen_araby_ultimate_mission_desc:0 "With faith, innovation, and trade flowing from every corner of Araby, we have united the world under our influence. Our scholars, merchants, and warriors have shown the strength of Araby to all nations, and none can doubt the power of the Crescent Moon."

araby_ultimate_reward:0 "Blessings of the Crescent Moon"
desc_araby_ultimate_reward:0 "Araby stands as a beacon of faith, wisdom, and prosperity. With unwavering devotion and unmatched ingenuity, we secure our place as a dominant force in the world, blessed by the Crescent Moon."




##################################
##### MISSIONS
##################################

gen_araby_please_nobility_title:0 "Favor of the Emirs"
gen_araby_please_nobility_desc:0 "The loyalty of the emirs is paramount to maintaining our authority. We must earn their trust to ensure they support our rule and our faith."

gen_araby_cavalry_title:0 "Raise the Aswaran"
gen_araby_cavalry_desc:0 "Our elite cavalry, the Aswaran, are feared throughout the desert. We shall raise a grand force of cavalry to assert our dominance on the battlefield and protect our lands from all threats."

gen_araby_war_with_infidel_title:0 "War on the Infidels"
gen_araby_war_with_infidel_desc:0 "The time has come to fulfill our sacred duty. We must bring the wrath of the righteous upon those who reject the truth of our faith."

gen_araby_war_expand_faith_title:0 "Spread the Word"
gen_araby_war_expand_faith_desc:0 "Our empire must extend the reach of the faith, conquering new lands and converting them to our righteous cause."

gen_araby_build_docks_title:0 "Construct the Docks"
gen_araby_build_docks_desc:0 "To dominate the seas and connect our lands with distant trade routes, we must build mighty docks to support our expanding fleet."

gen_araby_expand_overseas_title:0 "Expand Across the Seas"
gen_araby_expand_overseas_desc:0 "The seas are the lifeblood of trade and conquest. We must extend our influence beyond the horizon, spreading our faith to foreign shores."

gen_araby_center_of_trade_title:0 "Establish a Center of Trade"
gen_araby_center_of_trade_desc:0 "The wealth of the world flows through our lands. By establishing a powerful center of trade, we can control the lifeblood of commerce and expand our influence."


##################################
##### ONE FAITH RELIGION MISSIONS
##################################

gen_one_faith_happy_priest_title:0 "Content Imams"
gen_one_faith_happy_priest_desc:0 "The imams are loyal to our cause, ensuring stability in the spiritual realm and harmony within our borders."

gen_one_faith_places_of_worship_title:0 "Construct Masjids"
gen_one_faith_places_of_worship_desc:0 "Our people must have places to gather in prayer and reflection. By constructing masjids, we shall secure their faith and devotion."

gen_one_faith_place_of_study_title:0 "Establish the Dar al-Ilm"
gen_one_faith_place_of_study_desc:0 "A great center of learning in our capital will solidify our place as a beacon of wisdom, guiding both the faithful and the curious."

gen_one_faith_places_of_law_title:0 "Promote the Majlis"
gen_one_faith_places_of_law_desc:0 "By creating institutions of justice throughout our land, we demonstrate that the law and the faith are one, ensuring stability and order."

gen_one_faith_places_of_innovation_title:0 "Nurture Scholars"
gen_one_faith_places_of_innovation_desc:0 "We must foster intellectual growth and innovation, encouraging scholars to push the boundaries of knowledge under the guidance of our faith."

gen_one_faith_charitable_title:0 "Practice Sadaqah"
gen_one_faith_charitable_desc:0 "Charity is a virtue praised by the divine. By giving generously to our neighbors, we will win their hearts and demonstrate the strength of our faith."

gen_one_faith_defender_of_faith_title:0 "Amir al-Mu'minin"
gen_one_faith_defender_of_faith_desc:0 "As the Defender of the Faithful, we stand as the bulwark against those who threaten the unity and purity of our belief, protecting the righteous from all harm."


##

claim_solar_mandate_title:0 "Claim the Solar Mandate"
claim_solar_mandate_desc:0 "The last Prophet of the Sun is dead. It is time for us to claim the Mandate. The Sun God Ptra has chosen $MONARCH$ as his voice! \n\nBecoming the Prophet of the Sun gives a powerful CB on all Southlands provinces, and provides great opportunity for reform. But losing mandate, through devastation or bordering non-subjects, can destroy your nation."


claim_solar_mandate_effect_tt:0 "Declare $MONARCH$ as the prophet of the sun.\n\nBecoming the Prophet of the Sun gives a powerful CB on all Southlands provinces, and provides great opportunity for reform. But losing mandate, through devastation or bordering non-subjects, can destroy your nation."



araby_events.1.t:0 "A Djinn Unbound in the Capital"
araby_events.1.d:0 "At dawn the palace wards flared and shattered like glass beneath a hammer, and a djinn—half smoke, half burning crystal—tore free of its bindings in the heart of our capital. It stalks the rooftops and market squares, scattering soldiers and laughing as masonry cracks beneath unseen force. The people whisper that the Eternal Light has turned its face from us.\n\nBy dusk the spirit has made its demand plain: gold, jewels, and safe passage beyond our lands. The Djinn Binders argue bitterly over fault and remedy, each fearing that mishandling the crisis will stain their order. Whatever we choose, the Mandate of the Sun trembles with the outcome.\n\nA swift response may restore order and confidence. Hesitation—or humiliation—may echo far beyond these burning streets."

araby_events.1.option_1:0 "No bargains with spirits."
araby_events.1.option_2:0 "Pay it. Spare the city."
araby_events.1.option_3:0 "Steel and seals."
araby_events.1.option_4:0 "Appease it quietly."

araby_events.2.t:0 "A New Prophet Proclaims Himself"
araby_events.2.d:0 "In a crowded square thick with incense and dust, a preacher has declared himself the true Prophet of the Sun. His voice carries across the stalls and fountains, promising unity, purification, and a blazing destiny for Araby. Already tribes and townsfolk gather beneath his words.\n\nSome dismiss him as a zealot intoxicated by his own sermons. Others fear that the Sun raises champions in unexpected places, and that denying such a figure courts disaster. Rumors spread faster than soldiers can march.\n\nIf we crush him, we risk creating a martyr. If we ignore him, we may wake to find half the realm chanting his name."

araby_events.2.option_1:0 "Silence him."
araby_events.2.option_2:0 "Ignore the fanatic."

araby_events.3.t:0 "A Willing Djinn Seeks the Muster"
araby_events.3.d:0 "Before the assembled court, a djinn has stepped from a brazier’s flame and knelt as though it were flesh and blood. It claims to be weary of forgotten ruins and empty deserts, and offers its strength to our banners. The guards stand rigid, unsure whether to strike or kneel.\n\nThe Djinn Binders debate whether such willingness is a blessing or a deception. A spirit that serves openly may inspire awe among our soldiers and dread among our enemies. Yet prideful spirits are quick to anger when slighted.\n\nTo accept its oath would be unprecedented. To refuse it may drive it into less friendly hands."

araby_events.3.option_1:0 "Let it fight."
araby_events.3.option_2:0 "Make it a general."
araby_events.3.option_3:0 "Bind it instead."

araby_events.4.t:0 "The Stone-Bound Djinn"
araby_events.4.d:0 "Through careful geometry, bronze seals, and unbroken recitation, the Mi'marun have bound a djinn of stone and deep earth. Its voice rumbles like distant thunder, and its patience stretches back before memory. It does not resist, but neither does it forgive carelessness.\n\nSuch a being can raise walls that defy time or coax life from stubborn soil. Entire districts could be reshaped under its guidance, foundations laid with uncanny precision. Yet each task demands vigilance and proper tribute.\n\nWe must decide how best to direct this immense strength. A wise choice may reshape our realm for generations."

araby_events.4.option_1:0 "Raise great works."
araby_events.4.option_2:0 "Enrich the land."
araby_events.4.option_3:0 "Empower this province."

araby_events.5.t:0 "A Caravan Like a Moving City"
araby_events.5.d:0 "From the horizon emerges a caravan so vast it seems a wandering city, its banners snapping in the wind and its camels laden with goods from distant shores. Merchants bearing foreign seals request safe passage through our lands. Their wealth glitters even beneath desert dust.\n\nSuch traffic strengthens markets and spreads our renown across continents. Yet opportunity tempts greed, and the desert remembers those who prey upon travelers.\n\nOur decision will echo along trade routes from coast to oasis. Prosperity and reputation ride upon our judgment."

araby_events.5.option_1:0 "Free passage."
araby_events.5.option_2:0 "Impose a tariff."
araby_events.5.option_3:0 "Seize their goods."

araby_events.6.t:0 "Keeping Pace with a Wider World"
araby_events.6.d:0 "Advisers warn that distant realms experiment with new hull designs, strange cannon, and unfamiliar administrative arts. If we cling too tightly to tradition, we may awaken to find ourselves outmatched. Even faith must walk beside wisdom.\n\nSome urge exploration and study, dispatching ships and scholars to learn from afar. Others insist our strength lies within disciplined reform at home. Still others whisper that secrets need not be requested—they can be taken.\n\nThe world beyond Araby does not stand still. We must decide how we will meet it."

araby_events.6.option_1:0 "Explore outward."
araby_events.6.option_2:0 "Focus inward."
araby_events.6.option_3:0 "Use spies."

araby_events.7.t:0 "On the Nature of Foreign Gods"
araby_events.7.d:0 "Within our halls, jurists and binders debate the essence of foreign deities. Are they demons wearing pleasing masks, or confused reflections of the One Eternal Light? The answer will shape policy as much as theology.\n\nHardliners warn that compromise invites corruption and daemonic influence. Moderates argue that patient teaching may convert more souls than force. Pragmatists note that tolerance can ease diplomacy.\n\nDoctrine forged today may guide the realm for generations. We must choose our interpretation carefully."

araby_events.7.option_1:0 "They are demons."
araby_events.7.option_2:0 "They are misguided."
araby_events.7.option_3:0 "Study them."

araby_events.8.t:0 "A Djinn Offers Teaching"
araby_events.8.d:0 "A solitary djinn has approached one of our provinces, offering forbidden instruction in exchange for hospitality. It speaks of hidden laws of motion, new methods of forging, and secrets gleaned from distant civilizations. Its tone is calm—almost patient.\n\nThe Djinn Binders are uneasy, for knowledge granted by spirits often conceals a hook. Innovation gained too quickly may carry unseen consequences. Yet the promise of advancement is undeniable.\n\nTo accept its teaching could leapfrog years of effort. To refuse may leave us stagnant in a changing world."

araby_events.8.option_1:0 "Hear it out."
araby_events.8.option_2:0 "Refuse."
araby_events.8.option_3:0 "Purge this spirit."

araby_events.9.t:0 "Zakat and the Measure of Mercy"
araby_events.9.d:0 "Sacred taxation binds ruler and subject in shared obligation beneath the Eternal Light. Yet war and expansion strain the treasury, and ministers propose increasing the levy. The people already murmur at rising demands.\n\nSome argue that firm taxation demonstrates strength and sustains the Mandate of the Sun. Others insist that returning wealth to the faithful through charity will secure loyalty more deeply than fear.\n\nAuthority is measured not only in coin, but in trust. Our decision will define how the people remember our reign."

araby_events.9.option_1:0 "Increase taxes."
araby_events.9.option_2:0 "Return it as charity."

araby_events.1000.t:0 "Dawn of the One Faith"
araby_events.1000.d:0 "For millennia, Araby bent its knee to many masters—old desert gods, borrowed idols, and whispering spirits that promised power at a hidden price. In every oasis and city, names were offered up that were not fit to be spoken, and the djinn were treated as patrons rather than perils. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, proclaiming himself the Prophet of the Sun, bearing a single, terrible truth: there is only one god, and the Sun is His sign upon the world. All other powers are demons wearing familiar faces, feeding upon fear, tradition, and convenient lies. In the span of thirty years, Fakir has ridden from coast to deep desert, uniting Araby through treaty and conquest alike, until even the proudest tribes speak with one tongue in public—if not always in private.\n\nYet the work is unfinished. The Prophet of the Sun rules by the Solar Mandate, a covenant of belief as much as law: so long as the people trust in the Prophet’s favor, his authority is radiant, his reforms swift, and his realm unshaken. But if doubt spreads and the Mandate is judged lost, the same sun that crowned him will glare upon his failures.\n\nAnd there is one final teaching that unsettles even the faithful: the next Prophet may rise from anywhere. Not only the sons of Araby, but Skaven, Ogres, and foreign knights may claim the solar mantle if they speak the One Truth and gather belief behind their banner. This is not a threat alone—it is proof that the whole world is ripe for revelation.\n\nThe dawn has come. Let the deserts and seas carry the One Faith to every horizon, until no demon finds refuge in ignorance."
araby_events.1000.a:0 "Let the world face the Light."

  # =========================
  # Slot 1 (araby_missions_1) - expanded descriptions
  # =========================

  araby_dominate_home_trade_node_title:0 "Dominate the Home Node"
  araby_dominate_home_trade_node_desc:0 "Araby lives and dies by commerce. If we cannot command the flow of wealth through our own waters, we will never be more than a waypoint for foreign merchants. We must seize a majority share of trade in our home node and make it undeniable. Once the contracts, convoys, and coin all pass through our hands, our rivals will be forced to bargain on our terms. From that position of strength, we can elevate our ports and bazaars, attract experienced factors, and turn trade into lasting state power."

  araby_protect_desert_routes_title:0 "Protect the Desert Routes"
  araby_protect_desert_routes_desc:0 "Caravans are the arteries of Araby, and the desert is where they are most vulnerable. Bandits, raiders, and rival warlords thrive where patrols are weak, bleeding profits and frightening away foreign coin. We will bring the desert routes under secure authority so trade can cross the sands without fear. That means clearing hostile holdouts, asserting direct control over the dunes, and ending the practice of leaving vital corridors to unreliable dependents. When the roads are safe, merchants will move faster, supply will hold, and our trade power will grow with every caravan that arrives intact."

  araby_resting_posts_title:0 "Establish Resting Posts"
  araby_resting_posts_desc:0 "Guarding the dunes is not enough. We need fortified waystations—water, shelter, and disciplined garrisons—so caravans and armies can push deeper and endure longer without collapsing to thirst, heat, and distance. By building and improving strongpoints in the desert, we master supply where other nations fail. Each post becomes a node of security: a place to repair wagons, rotate escorts, store provisions, and deter opportunists who prey on exhaustion. Once this system is proven in Araby, we can export the model to any harsh frontier we conquer or administer."

  araby_centers_of_trade_title:0 "Great Centers of Trade"
  araby_centers_of_trade_desc:0 "If foreigners are to accept our new order, they must see stability and profit rather than uncertainty and religious panic. We will elevate our harbors and bazaars into true hubs of commerce—places where contracts are honored, warehouses overflow, and disputes are settled quickly. Great centers of trade are not built on buildings alone; they require predictability, infrastructure, and the confidence that the state will protect investment. When our major markets rise in stature, outside capital will follow, shipping will concentrate in our ports, and Araby will become the default destination for anyone seeking wealth in the south."

  araby_build_counting_houses_title:0 "Build Counting Houses"
  araby_build_counting_houses_desc:0 "Temples once gathered much of our wealth, but the age is changing. Workshops, ledgers, and merchants’ offices now shape fortunes as surely as prayer, and we cannot allow others to dominate this new economy. We will expand the institutions of trade—counting houses, workshops, and the administrative machinery that turns production into revenue. With standardized accounts and professional financiers, corruption becomes harder, credit becomes cheaper, and investment becomes easier to direct toward national goals. The result is simple: more coin, more capacity, and a state that can finance ambition without begging the old powers for permission."

  araby_arabian_coffee_title:0 "Arabian Coffee"
  araby_arabian_coffee_desc:0 "Coffee may be found across distant seas, but none matches the reputation of Araby’s finest beans. We will scale production and secure the trade so that, from noble courts to dockside taverns, the world associates coffee with our name rather than with any rival plantation empire. That requires more than growing the crop; it requires branding, distribution, and leverage in the markets where taste becomes habit. When we control the supply and dominate the trade lanes, demand turns into prestige, and prestige turns into political influence. Let foreign elites argue theology if they must—so long as they still pay for Araby’s coffee."

  araby_build_manufactories_title:0 "A Production Power"
  araby_build_manufactories_desc:0 "For too long, outsiders have called us a barren stopover—useful only as a crossing between richer worlds. We will prove them wrong by building manufactories and industries at scale, turning Araby into a producer whose goods compete everywhere. Mills, furnaces, textiles, plantations, foundries—each new enterprise multiplies our output and tightens our grip on the value chain. Wealth that once passed through our hands will now be created by our hands, and foreign merchants will come not just to trade, but to buy what only Araby can reliably supply. When production rises, so does our leverage in every negotiation, war, and treaty."

  araby_new_world_foothold_1_title:0 "A New World Foothold"
  araby_new_world_foothold_1_desc:0 "The New World is rich, divided, and vulnerable—exactly the kind of frontier that rewards decisive powers. We will secure a port and a base of operations across the ocean, not as a trophy, but as an instrument of expansion. A foothold gives us supply, repairs, and a staging point for further claims, while denying rivals an easy monopoly. With alliances, subjects, or direct rule, we will ensure the first presence is legitimate in practice, even if contested in rhetoric. Once established, the surrounding coast and hinterland will fall under our permanent claims, and momentum will do the rest."

  araby_new_world_foothold_2_title:0 "Expand the Foothold"
  araby_new_world_foothold_2_desc:0 "A single outpost is only a promise, and promises are easy to break with one strong fleet or one unexpected rebellion. To endure, we need breadth: more ports, more settlements, and more subjects bound to our direction. By expanding our holdings, we make our logistics resilient and our control harder to contest. Each additional city secures another harbor, another warehouse, another recruitment pool, and another route for wealth to flow back to Araby. When we have enough territory to support sustained operations, we can escalate from presence to dominance."

  araby_new_world_foothold_3_title:0 "New World Dominion"
  araby_new_world_foothold_3_desc:0 "This is no longer an expedition—it is a dominion. With vast holdings secured, we will impose order, extract wealth, and shape the continent to our design rather than reacting to local chaos. A sprawling colonial base gives us manpower, taxation, and strategic depth that few rivals can match. From fortified ports we project force inland; from inland towns we feed and fund expansion; from trade routes we turn conquest into profit. When our banners are a permanent fact of the New World, Araby will be counted among the great empires of the age."

  # =========================
  # Slot 2 (araby_missions_2) - expanded descriptions
  # =========================

  araby_please_guilds_title:0 "Secure the Guilds"
  araby_please_guilds_desc:0 "The merchants and guilds hold real power, and power always demands a seat at the table. If our faith and state are to consolidate, the bazaars must stop acting as a rival government with their own rules and loyalties. We will win their cooperation through concessions, favors, and carefully chosen agreements—then use that cooperation to reduce their grip on land and policy. The goal is not to destroy commerce, but to ensure it answers to the state rather than directing it. Once the guilds accept their role, the economy becomes an instrument of unity instead of a source of factionalism."

  araby_build_markets_title:0 "Fund the Markets"
  araby_build_markets_desc:0 "Independent brokers and competing interests profit from disorder: inconsistent weights, private enforcers, and backroom deals that keep the state out of the ledger. By funding markets and formal trade halls, the state gains leverage over commerce—standard measures, regulated stalls, enforceable contracts, and transparent accounting. This does not eliminate competition; it channels it into systems we can tax, supervise, and defend. As the market network grows, merchants become easier to manage, trade power rises across our provinces, and our centers of trade can be upgraded faster and cheaper. In time, the bazaar becomes a national asset, not a private battlefield."

  araby_pirates_or_not_title:0 "Pirates or Protectors"
  araby_pirates_or_not_desc:0 "Our sailors have long preyed on the weak, and piracy has filled coffers when honest trade could not. But the seas are changing: stronger ships, organized convoys, and states that respond with brutal certainty. We must decide whether privateering remains our spear, or whether our fleet becomes a shield for our merchants. Either path can enrich us, but each demands focus—ships trained for raiding, or ships disciplined for patrol and control. Once chosen, we will align our naval doctrine, our officers, and our political messaging so the waves serve Araby with consistency. Hesitation would cost more than any decision."

  araby_dominate_arabian_nodes_title:0 "Dominate the Arabian Nodes"
  araby_dominate_arabian_nodes_desc:0 "Influence in one market is fragile; dominance across multiple nodes is power that cannot be ignored. We will become the strongest trade power wherever our merchants compete, building an interlocking network of ports, agents, and agreements that rivals cannot easily disrupt. As our leverage grows, merchants will flock to our offices, hoping for licenses, protection, and preferential contracts. We will take the best, bind them to our interests, and use their expertise to expand further. When three major nodes bend toward Araby, wealth becomes strategic—financing armies, buying allies, and starving enemies without firing a shot."

  araby_build_temples_title:0 "Temples of the New Faith"
  araby_build_temples_desc:0 "A religion that cannot be seen cannot grow, and a faith without institutions will fracture under pressure. By raising temples across our provinces, we anchor belief in stone and ritual, giving communities a stable place to gather and learn. These temples are not only spiritual; they are administrative—centers for charity, education, and local governance aligned with the state. Strategically placed temples also strengthen order, reducing unrest and helping newly integrated regions accept the new doctrine. When the landscape itself reflects the faith, conversion becomes easier and resistance becomes isolated."

  araby_build_courts_title:0 "Courts of Eadala"
  araby_build_courts_desc:0 "Justice is a pillar of our doctrine, and doctrine that cannot be enforced becomes hypocrisy. Courthouses and halls of judgment must be present, visible, and effective—so the people learn that law is not merely declared, but applied fairly and consistently. We will expand the institutions that investigate disputes, punish corruption, and arbitrate conflicts between estates and commoners alike. Strong courts reduce unrest because grievances have an outlet and violence becomes less profitable. When Eadala is seen in practice, loyalty becomes easier to earn and harder to shake."

  araby_world_center_title:0 "A World Center of Learning"
  araby_world_center_desc:0 "Once we held cities that astonished the world, where scholars, engineers, and merchants shared streets with saints and statesmen. We will reclaim that legacy by building a true metropolitan wonder: a fully developed, densely built center of trade and governance that draws institutions to our banner. This requires infrastructure, urban planning, and the deliberate concentration of talent and capital in one place. When the city reaches its height, it will accelerate the spread of new ideas, new methods, and new institutions across our realm. Araby will not merely follow the age—it will set its pace."

  araby_badlands_1_title:0 "Push into the Badlands"
  araby_badlands_1_desc:0 "The Badlands are harsh, fractured, and contested—yet strategically valuable for routes, resources, and denying sanctuary to hostile powers. We will seize a foothold and establish authority that is respected, not tested daily by raiders and warbands. Once our presence is secure, we will press claims outward, surrounding rivals and cutting off their lines of retreat. The region rewards momentum: hesitation invites ambush, but steady expansion forces scattered enemies into decisive battles. A controlled Badlands frontier will protect Araby and open new directions for conquest."

  araby_badlands_2_title:0 "Subdue the Badlands"
  araby_badlands_2_desc:0 "A foothold is not enough. The Badlands must be broken into lasting order under our authority, or it will forever regenerate threats behind our lines. We will expand control across the region, lock down borders, and dismantle strongholds that enable raids and resistance. Subjects must be obedient, garrisons must be supplied, and strategic chokepoints must be fortified so conquest is not reversed by distance. When the Badlands are subdued, they cease to be a wound and become a shield—an inhospitable barrier that serves us instead of sheltering our enemies."


  # =========================
  # Slot 3 (araby_missions_3)
  # =========================

  araby_a_new_faith_is_born_title:0 "A New Faith Is Born"
  araby_a_new_faith_is_born_desc:0 "From the fractured sands of Araby, a single creed rises where countless cults and rival traditions once battled for devotion. Anmar Fakir, Prophet of the Sun, has unified belief under the radiance of Ptra and given our people a shared purpose that cuts across tribe, city, and estate. This is not a minor reform—it is a generational turning point that will either define Araby for centuries or collapse into sectarian ruin. With unity of belief secured, the nation must act while fervor is high, channeling religious energy into institutions, diplomacy, and strength. If we hesitate, opportunists will twist the message and fracture the mandate before it hardens into law."

  araby_please_church_title:0 "Secure the Priesthood"
  araby_please_church_desc:0 "A faith without clergy is a fire without a hearth: bright, dangerous, and impossible to control. If we want doctrine that can endure politics, war, and succession, we must bind the priesthood into the project from the beginning. That means granting them influence in the formation of texts, rites, and administration—then using that cooperation to reduce the independent power that church land represents. The goal is not humiliation, but alignment: priests who see the state as the guarantor of the faith, not a rival to it. When the clerics invest their legitimacy into our order, they will defend it, preach it, and give up what they must to see it survive."

  araby_defender_of_faith_title:0 "Defender of the Faith"
  araby_defender_of_faith_desc:0 "If our religion is to become more than a local movement, it needs a champion with the prestige and authority to lead it through crisis. We must prove that Araby is the pre-eminent nation of the Sun’s doctrine, not merely one believer among many. That requires public legitimacy—glory, unity, and demonstrations of strength against hostile creeds—so that even distant adherents look to us for guidance. Yet supremacy brings a question of governance: do we anchor the faith in the estates and their learned voices, or in the common people who supply devotion and soldiers? The answer will shape our internal stability, our diplomacy, and the tone of the mandate we claim to represent."

  araby_write_the_first_texts_title:0 "Write the First Texts"
  araby_write_the_first_texts_desc:0 "A religion without scripture is vulnerable to rumor, opportunists, and endless argument. We will be the first to set the doctrine into writing—clear, repeatable, and distributable—so the faith cannot be rewritten by every ambitious preacher with a crowd. But writing is only half the task; distribution is power, and power requires resources, paper, and administrative reach. With our prestige at its peak and our ruler’s legitimacy unquestioned, we can make a definitive statement that carries weight beyond our borders. The choice will be consequential: radical certainty can inspire fervor and expansion, while careful stability can preserve unity and prevent backlash. Either way, once the words are set, Araby will never again be able to pretend the faith is unfinished."

  araby_role_of_the_army_title:0 "The Role of the Army"
  araby_role_of_the_army_desc:0 "A prophet may preach peace, but Araby survives in a world that respects force. The faithful ask whether conquest is an instrument of salvation or a temptation that will corrupt the message at its source. We must answer that question with policy, not slogans, because the army will act according to the incentives we set. A disciplined force can protect missionaries, defend converts, and punish those who would erase the faith by violence. But an unchecked army can become its own priesthood, turning doctrine into endless war for prestige and plunder. By defining the relationship between sword and scripture now—when our fleet is launched, our armies are full, and our counsel is strong—we decide what kind of empire Araby becomes."

  araby_charity_and_taxes_title:0 "Charity and Taxes"
  araby_charity_and_taxes_desc:0 "Charity is not optional in our doctrine; it is a test of whether the faith governs reality or merely speeches. We will raise the baseline standard of life across our realm so that even our least-developed provinces are not left to stagnate and resentment. But the state must decide how this obligation is carried: through increased taxation that funds public works, or through direct governmental charity that reduces unrest at the cost of revenue. Either approach will reshape our economy and our politics, because money creates expectations and expectations create stability—or rebellion. This is a strategic decision as much as a moral one: a nation that cares for its people can demand more from them in return. When Araby chooses its model of charity, it chooses the character of its rule."

  araby_the_holy_cities_title:0 "The Holy Cities"
  araby_the_holy_cities_desc:0 "The faith is born of revelation, and revelation is rooted in place. The holy cities where Anmar Fakir received prophecy must be held, invested in, and elevated until they serve as undeniable pillars of the mandate. Control alone is insufficient; the cities must be developed, administered, and given institutions worthy of their spiritual gravity. When pilgrims arrive, they should see power, order, and purpose—not decay, faction, and petty rivalries. These cities will become engines of conversion, training grounds for clergy, and symbols that silence doubt across the realm. If we honor the holy places with action, the missionaries will not need to be forced forward—they will be inspired to go on their own."

  araby_prevent_schism_title:0 "Prevent a Schism"
  araby_prevent_schism_desc:0 "Rapid growth invites fracture. New believers bring old habits, ambitious leaders form competing interpretations, and estates attempt to bend doctrine toward their interests. If we allow this to fester, schism will become inevitable, and the faith will splinter into rival sects that weaken both church and state. We must stabilize the realm’s foundations—ensuring crown authority is credible, estate influence is not unchecked, and unrest does not become a rallying banner for dissent. Once dissenting voices are contained, we will direct them back to the newly created texts and to the institutions that interpret them. The question is not whether disagreement exists; it is whether we permit disagreement to become an alternative authority."

  araby_dominate_araby_title:0 "Unify Araby"
  araby_dominate_araby_desc:0 "Araby cannot lead the world while divided at home. The tribes, ports, and desert kingdoms must be brought under a single banner so that our doctrine, trade, and armies operate as one system rather than as competing factions. Unification is not merely conquest; it is consolidation—eliminating rival claimants, integrating cities, and ensuring that subjects contribute without constantly threatening defiance. When the core regions are held securely, recruitment surges because people fight for a state that looks permanent. With Araby unified, our enemies lose the ability to play us against ourselves, and our friends gain confidence that our promises will be honored. Only then can the faith truly claim to represent a civilization rather than a coalition."

  araby_into_nehekhara_title:0 "Into Nehekhara"
  araby_into_nehekhara_desc:0 "Nehekhara is more than territory; it is a legacy written into the memory of the deserts. Our ancestors once moved through these lands, and the stories of ancient empires still shape how the world measures greatness. If Araby is to reclaim its rightful stature, we must expand into Nehekhara and secure a permanent presence there. This campaign will test supply, leadership, and resolve, because desert wars punish weakness more than any other. Yet the reward is strategic depth and symbolic dominance: controlling Nehekhara signals that Araby is no longer confined to its old borders. Once we establish a foothold, the surrounding lands must be claimed, so no rival can regroup at our doorstep."

  araby_nehekhara_monuments_title:0 "Study the Monuments"
  araby_nehekhara_monuments_desc:0 "Nehekhara’s monuments are not mere curiosities; they are lessons carved into stone about power, legitimacy, and endurance. By securing and studying these great works, we can accelerate our own capacity to build, expand, and modernize the projects that define an empire. We will not imitate blindly—we will extract methods, logistics, and institutional practices that allowed monumental ambition to be sustained across generations. This is the difference between a conqueror and a builder: conquest takes land, but monuments teach how to hold it. When Araby absorbs these lessons, our great projects will rise faster and cheaper, and our authority will look inevitable. A nation that can build wonders is a nation that convinces others it will not fall."

  araby_mountains_1_title:0 "Secure the World’s Edge"
  araby_mountains_1_desc:0 "The southern World’s Edge is a frontier of hard terrain and harder enemies. Mountains create chokepoints that can protect a realm or trap an army, depending on who controls the passes. We will seize enough territory to anchor our presence and deny rivals the ability to raid into our holdings with impunity. This is strategic expansion: controlling routes, securing high ground, and establishing dependable supply in regions where distance and altitude are weapons. Once we hold a foothold, we will press outward with permanent claims, forcing scattered powers into predictable conflicts. A controlled mountain frontier makes the heartland safer and gives us leverage over every neighbor who depends on these passes."

  araby_mountains_2_title:0 "Dominate the World’s Edge"
  araby_mountains_2_desc:0 "A partial hold in the mountains invites constant war; domination ends the cycle. We will expand control across the southern World’s Edge until the region’s strategic terrain serves our interests rather than threatening them. At this scale, authority must be continuous: subjects must be compliant, borders must be defensible, and key crossings must be locked down. As our holdings grow, so does our ability to choose where battles happen—and to ensure they happen on ground favorable to Araby. When the mountains are dominated, rivals lose their refuge, and our realm gains a fortified spine that supports further conquest. The World’s Edge will no longer be an edge to us; it will be a platform."

  araby_convert_the_world_title:0 "Convert the World"
  araby_convert_the_world_desc:0 "This is the logical conclusion of the mandate: a faith that claims universal truth cannot remain content with local victory. With the highest authority of the Defender of the Faith secured, we will expand conversion on a scale that reshapes continents. The goal is not isolated enclaves of believers; it is a global religious order where dissenting creeds lose legitimacy and political leverage. This will require administration, diplomacy, war, and sustained institutional pressure over generations. Yet success brings unparalleled advantages: unity with co-religionists, leverage against outsiders, and an economic engine that rewards the faithful while punishing resistance. When enough provinces share the doctrine, the world will treat Araby’s religion as a permanent fact of history, not a temporary zeal."

  # =========================
  # Slot 4 (araby_missions_4)
  # =========================

  araby_please_nobles_title:0 "Secure the Nobility"
  araby_please_nobles_desc:0 "No structured faith survives if the nobility treats it as optional. Regardless of theological purity, we must incorporate noble consent into the new order, because they control land, armies, and local authority in ways that can sabotage doctrine from within. We will bargain directly: concessions, privileges, and negotiated influence—paid for with the very lands that make them powerful enough to demand a seat. This is not capitulation; it is statecraft, trading limited assets today to prevent civil fracture tomorrow. When the nobles accept ownership of the faith’s future, they become invested in defending it rather than undermining it. A faith opposed by the elite will bleed forever; a faith endorsed by the elite becomes law."

  araby_army_tradition_title:0 "Traditions of Horse and Camel"
  araby_army_tradition_desc:0 "Araby’s strength has never been slow formations and rigid doctrine—it has been speed, endurance, and the ability to strike where enemies are weakest. Our horse and camel traditions are not nostalgia; they are a military system shaped by desert reality. By raising and maintaining high army tradition, we ensure that this heritage is preserved in officer corps, training, and doctrine. The result is an army that learns from war instead of merely surviving it, and cavalry that fights as a core arm rather than an accessory. When tradition is strong, morale follows, discipline sharpens, and our mobility becomes a strategic advantage that outsiders cannot easily replicate."

  araby_arabian_horse_breeding_1_title:0 "Arabian Horse Breeding"
  araby_arabian_horse_breeding_1_desc:0 "Quality cavalry begins long before battle—it begins in pasture, stable, and breeding program. Arabian horses must not be a luxury reserved for elites; they must become a reliable national resource that supports our doctrine of swift war. By expanding livestock production and fielding meaningful cavalry numbers, we prove the state can sustain mounted forces without collapsing its economy. This is an industrial commitment as much as a military one: fodder, tack, trainers, and supply chains that keep horses healthy through campaigns. When breeding is controlled and scaled, we reduce costs, improve readiness, and ensure that our speed is not temporary. Araby’s cavalry will become a permanent institution of power."

  araby_arabian_horse_breeding_2_title:0 "Mounted Supremacy"
  araby_arabian_horse_breeding_2_desc:0 "A cavalry arm that cannot be expanded becomes a ceremonial force, impressive but strategically irrelevant. We will push beyond adequacy toward superiority, fielding enough horsemen to shape wars rather than merely participate in them. Becoming a leading producer of livestock ensures we can replace losses, expand regiments, and sustain long campaigns without depending on foreign markets. This shifts cavalry from a tool of raids to a decisive component of battle planning and operational mobility. With scale comes leverage: we can respond faster, flank harder, and punish retreat with certainty. When our mounted arm is unmatched, our enemies will feel pressure before the first battle is even fought."

  araby_arabian_horse_breeding_3_title:0 "Horses for All"
  araby_arabian_horse_breeding_3_desc:0 "This is total commitment: horses not merely for the army, but for the nation’s strategic identity. By driving livestock output to extraordinary levels and maintaining a massive cavalry arm, we ensure that every mobilization is fast and every frontier can be reinforced without delay. Such capacity transforms doctrine into inevitability—our wars become wars of movement, where enemies are forced to react and rarely allowed to choose terms. The economic scale required also reshapes society: breeders, supply officials, and military infrastructure become central pillars of governance. When the state can field cavalry on this scale, Araby becomes synonymous with speed and shock across the world. Our people will not just ride; they will rule by riding."

  araby_please_mages_title:0 "Consult the Djinn Binders"
  araby_please_mages_desc:0 "The Djinn Binders are not a formal estate, but they hold influence that rivals any institution when fear and wonder move the public. If we ignore them, they will shape theology from the shadows, undermining legitimacy and fueling dangerous interpretations of djinn as either saviors or demons. We will bring them into the open, consult their expertise, and force clarity on the role djinn will play in our doctrine and statecraft. This is governance by inclusion: we harness specialized power while defining strict boundaries for its use. The outcome must be a coherent policy that strengthens the realm rather than fracturing it into rival magical factions. Once decided, the state—not individual binders—will control the direction of djinn practice."

  araby_brass_for_bottles_1_title:0 "Brass for Bottles"
  araby_brass_for_bottles_1_desc:0 "Binding djinn is not only willpower and ritual; it is material science. Brass vessels—bottles, urns, lamps—are essential to containment, and brass demands copper in reliable quantities. If we are to integrate bound djinn into warfare, logistics, and industry, we cannot gamble on small mines and unstable supply. We will secure and expand copper production until it supports large-scale binding and the armaments that depend on it. This is preparation for an entire doctrine of fire and force, where craftsmanship and metallurgy become instruments of state. With copper secured, djinn binding becomes repeatable, standardized, and scalable rather than exceptional and fragile."

  araby_other_valuables_title:0 "Ornament and Rites"
  araby_other_valuables_desc:0 "Powerful binding requires more than copper; it requires prestige materials that focus ritual and signal authority. Gems, incense, dyes, glass, ivory, relics—these goods are not luxuries in our system, but components of legitimacy and control. By securing significant supplies of these valuables, we reinforce both the practical and symbolic foundations of djinn integration. The state that controls ritual inputs controls ritual outcomes, and rivals cannot easily imitate what they cannot source. This also strengthens trade, because rare goods attract merchants and create routes we can tax and protect. When the binders’ rites are backed by state-controlled wealth, djinn warfare becomes reliable rather than chaotic."

  araby_djinn_cannons_title:0 "Djinn Cannons"
  araby_djinn_cannons_desc:0 "Our artillery already commands fear, but fear is not enough—we require decisive siege capability that ends wars quickly and on our terms. By combining massive artillery forces with a deep copper supply, we can create specialized djinn-bound cannons that amplify destructive power beyond ordinary foundries. This is not merely a weapon program; it is a strategic doctrine that turns fortresses into liabilities and walls into temporary delays. When we can break any stronghold, enemies lose the safety of defensive depth and are forced into open battle or surrender. The result is accelerated conquest, reduced attrition, and a reputation that makes resistance seem irrational. Once fielded at scale, djinn cannons become a political weapon as much as a military one."

  araby_to_the_south_1_title:0 "March South"
  araby_to_the_south_1_desc:0 "The southern coasts and plains represent opportunity, but also risk: unfamiliar climates, stretched supply, and rival powers competing for the same routes. We will establish a foothold in the south to secure ports, resources, and strategic depth that strengthens Araby’s position across the wider world. This expansion is meant to be sustainable, not reckless—subjects must remain loyal, and newly taken land must be integrated into trade and administration. Once the first step is taken, we will press claims outward to prevent enemies from regrouping along our new border. A controlled southern frontier will widen our options in diplomacy and war alike. The south will become a corridor of power, not a drain on attention."

  araby_to_the_south_2_title:0 "Subdue the South"
  araby_to_the_south_2_desc:0 "A foothold invites counterattack; dominance prevents it. We will expand our holdings in the southern regions until our authority is continuous and our borders are defensible. This scale of control allows us to choose battlefields, secure supply lines, and prevent rivals from using the region as a staging ground against us. Loyal subjects and strong claims will transform the south from contested frontier into productive territory that funds further expansion. Once subdued, the region will provide manpower, wealth, and access to routes that amplify Araby’s global reach. The end state is clear: the south must serve our mandate, not threaten it."

  araby_places_to_train_title:0 "Places to Train"
araby_places_to_train_desc:0 "Araby has always produced warriors of fierce spirit, hardened by distance, heat, and hardship. But spirit alone is not enough in an age where disciplined drilling and standardized training decide battles before the first charge. We must raise permanent training grounds across the realm—barracks and fields where recruits are forged into soldiers and veterans are kept sharp between wars. This is how we turn local bravery into national strength: reliable reserves, better cohesion, and fewer defeats caused by poor preparation. If we want our armies to carry the mandate of the Sun beyond our borders, we must ensure every levy becomes a fighter, and every fighter becomes a professional."

araby_modern_military_tactics_title:0 "Modern Military Tactics"
araby_modern_military_tactics_desc:0 "The world is changing, and war is changing with it. We cannot rely solely on the traditions that carried us through earlier ages, no matter how proud they are, because disciplined enemies will punish outdated methods without mercy. Our task is to adopt modern tactics while preserving the aggressive spirit that defines Araby—combining training, professionalism, and institutional knowledge into a doctrine that wins consistently. When the army becomes a modern instrument of state, it fights with purpose rather than impulse and improves with every campaign. This is not abandonment of our past; it is refinement of it. By advancing our methods, we ensure Araby’s courage is matched by competence."

araby_convert_people_1_title:0 "Convert the Unbelievers"
araby_convert_people_1_desc:0 "The mandate is not a private comfort; it is an obligation that demands action beyond our borders. Each nation brought into the faith reduces the threat of hostile creeds, expands the community of believers, and proves that the doctrine is strong enough to reshape the world. This first stage is proof of concept: conversion through pressure, persuasion, and, when necessary, force. Success will build momentum, because victories create legitimacy and legitimacy makes future conversions easier. The process will not be gentle, but the world rarely changes through gentleness alone. If the Sun’s truth is to spread, we must be willing to pay the cost and endure the consequences."

araby_convert_people_2_title:0 "Expand the Mandate"
araby_convert_people_2_desc:0 "Early victories invite resistance, because rivals see the pattern and begin to unite against it. We must press forward while our momentum is still strong, converting additional nations until opposition becomes fragmented and uncertain. With each successful conversion, the cost of future conversions drops: allies become more willing, enemies become more isolated, and the faithful gain confidence that Araby’s mandate is real. This stage is about scaling the mission—building the administrative and military capacity to sustain repeated campaigns without exhausting the state. If we stall here, the world will adapt and the faith will be contained. If we advance, the faith becomes a geopolitical fact."

araby_convert_people_3_title:0 "Break the Old Order"
araby_convert_people_3_desc:0 "At this scale, conversion is no longer a series of separate victories—it is a restructuring of the international system. The old order of rival creeds and competing moral authorities must be broken so that the faithful are not constantly pulled back into defensive wars. We will convert enough nations that diplomacy itself begins to tilt toward our doctrine, with neutrals seeking accommodation and enemies forced into desperate coalitions. This is the stage where the mandate becomes self-reinforcing: success creates more success. It will be costly, and it will create fear, but fear can be managed when power is undeniable. A fragmented world resists; a reorganized world complies."

araby_convert_people_4_title:0 "A World Remade"
araby_convert_people_4_desc:0 "This is the culmination of the mandate: the point where conversion becomes the default outcome of politics. With enough nations brought into the faith, resistance turns from principled defiance into futile delay, and even powerful enemies must choose between isolation or submission. Araby will not merely spread a religion; it will establish a global order where legitimacy flows from the Sun’s doctrine and the institutions that enforce it. The wars required will be brutal, but brutality is sometimes the price of ending endless conflict. When the work is complete, future generations will not debate whether the mandate was real—they will assume it was inevitable. A world remade is a world that cannot easily revert."

araby_teachings_of_the_djinn_title:0 "Teachings of the Djinn"
araby_teachings_of_the_djinn_desc:0 "Whether bound, allied, or hostile, the djinn possess knowledge that mortals ignore at their peril. Their perspective stretches beyond ordinary lives, and even their deceptions can reveal truths about the world’s hidden mechanics. We must listen with discipline and skepticism, extracting usable insight without surrendering authority to superstition or fear. This is a program of directed learning: institutional inquiry, controlled experimentation, and the application of djinn knowledge to governance and innovation. When properly managed, this will accelerate our progress and give Araby advantages that rivals cannot replicate through ordinary scholarship. The djinn will not rule us, but their teachings can sharpen the tools with which we rule."

araby_places_of_study_title:0 "Places of Study"
araby_places_of_study_desc:0 "Knowledge cannot be hoarded in private chambers if it is meant to transform a nation. We must build great centers of learning—universities where scholars, engineers, and controlled djinn research can coexist under state oversight. These institutions will produce repeatable advances, train administrators and experts, and ensure that discoveries survive the death of individual geniuses. This is how Araby turns mystical insight into practical capability: structured study, preserved records, and educated generations. A state that invests in learning becomes faster, richer, and more dangerous to its enemies. If we want the mandate to endure, it must be backed by institutions that outlive rulers."

araby_djinn_mastery_title:0 "Djinn Mastery"
araby_djinn_mastery_desc:0 "Mastery is not occasional success; it is consistent control applied at scale. We will achieve total command of djinn practice—binding, cooperation, and deployment—until djinn power becomes an integrated component of industry, administration, and war. This requires dominance over the resources that enable binding, the scientific capacity to refine methods, and the political control to prevent the mages from becoming an independent state within the state. When mastery is achieved, Araby’s tempo accelerates: projects complete faster, armies hit harder, and rivals fall behind even when they copy our visible reforms. The world will see results and call it magic; we will know it is disciplined capability. With djinn mastery, Araby stops reacting to history and starts directing it."

araby_old_world_foothold_1_title:0 "Old World Foothold"
araby_old_world_foothold_1_desc:0 "If we intend to shape the world, we cannot remain confined to familiar sands and neighboring seas. Europe is wealthy, crowded, and politically volatile, which makes it both dangerous and ripe for strategic expansion. We must secure a foothold—a port city that can serve as a base for supply, influence, and future campaigns. This is not random conquest; it is establishing a forward operating position that anchors claims, enables reinforcement, and signals that Araby’s reach is no longer regional. Once we have a presence, surrounding territory becomes contested by default, and we must be prepared to press outward. A foothold is small in land, but enormous in consequence."

araby_old_world_foothold_2_title:0 "Consolidate the Foothold"
araby_old_world_foothold_2_desc:0 "A single province in Europe is a target, not a strategy. We must expand quickly enough that our position becomes defensible, economically viable, and politically credible. This means taking additional territory to secure routes, deepen supply, and prevent enemies from isolating our coastal base. Each new holding is also a signal: Araby is not visiting the Old World; it is staying. As our control grows, we gain leverage in diplomacy, disrupt rival trade, and force European powers to consider us in every calculation. Consolidation is what turns a risky landing into a permanent frontier. Without it, we invite expulsion; with it, we invite submission."

araby_old_world_foothold_3_title:0 "Establish an Old World Presence"
araby_old_world_foothold_3_desc:0 "At this scale, our European holdings cease to be an expedition and become a second theater of power. With a broad base of provinces, we can sustain armies locally, extract revenue reliably, and dictate terms in wars that once ignored us. European politics are ruthless, but they are also predictable: strength compels alliances, and control compels treaties. We will expand until our presence is undeniable, forcing rivals to choose between accommodation and collapse. This provides strategic options—multiple fronts, new trade routes, and a platform for religious and political influence. Once Araby is established in the Old World, no power there can treat us as distant again."


## Modifiers
araby_trade_1:0 "Dominate the Home Trade"
araby_trade_1_desc:0 "Araby’s strength has always flowed through its markets, caravans, and harbors, not through fertile fields. If we control the trade of our home node, we control the wealth that finances armies, buys loyalty, and attracts foreign merchants. This policy prioritizes the expansion of our trading centers so that our cities become unavoidable hubs for regional commerce. When our rivals are forced to trade through Araby, they fund our rise whether they intend to or not."

araby_trade_2:0 "State-Funded Markets"
araby_trade_2_desc:0 "The Bazaar is powerful precisely because it is fragmented—many brokers, many interests, and many private fortunes competing for control. Rather than fight the market, we will invest in it, using state funding to ensure our government has leverage inside every major commercial exchange. By strengthening our hold over trade power across the realm, we stabilize revenue and reduce dependence on any single merchant faction. The result is a marketplace that remains vibrant, but one that ultimately answers to the state."

araby_trade_3:0 "Piracy or Protection"
araby_trade_3_desc:0 "For generations, our sailors have treated the sea as a hunting ground, striking trade lanes and returning with prizes. Yet as fleets grow stronger and commerce becomes more organized, we must decide how our navy serves Araby’s future. We can continue privateering and profit from disruption, or we can use our ships to protect trade and ensure our merchants dominate by reliability instead of fear. This doctrine embraces both possibilities, turning naval power into a direct instrument of wealth—either by taking from others or by securing what is already ours."

araby_trade_4:0 "Merchant Ascendancy"
araby_trade_4_desc:0 "When trade is controlled, power consolidates. Merchants, factors, and foreign agents will flock to our ports and offices, competing for the right to represent Araby’s interests abroad. We will select the best among them and expand our commercial reach through additional merchants and better-organized networks. This is not mere prosperity; it is strategic dominance, where wealth becomes policy and policy becomes expansion. A state that commands trade commands options—diplomatic, military, and economic."

araby_resting_posts:0 "Desert Resting Posts"
araby_resting_posts_desc:0 "The desert does not forgive careless logistics. Caravans fail, armies starve, and supply collapses when routes rely on luck instead of planning. By establishing fortified resting posts—safe wells, depots, and waystations—we turn dangerous crossings into reliable corridors for trade and war alike. What we learn here can be applied elsewhere, but it begins in our sands: control the routes, and we control the movement of goods, men, and influence."

araby_arabian_coffee:0 "Arabian Coffee"
araby_arabian_coffee_desc:0 "Coffee may be found across distant lands, but our Arabian coffee is the one merchants speak of with respect. By standardizing quality, expanding production, and pushing our brand into foreign markets, we make our product synonymous with refinement and status. This is soft power that pays in hard coin: prestige rises when our goods are desired, and our diplomacy improves when foreign courts already value what we produce. A famous export becomes a national signature."

araby_production_center:0 "Center of Production"
araby_production_center_desc:0 "For too long, outsiders have treated Araby as a corridor—an empty desert between richer lands. That perception ends when our workshops and manufactories prove we are not merely traders of other peoples’ goods, but producers of valuable exports ourselves. By increasing the scale of trade goods produced across our realm, we convert development into sustained economic power. When Araby becomes a true production center, our wealth no longer depends on passing traffic; it depends on our own capacity."

araby_justice:0 "Eadala Courts"
araby_justice_desc:0 "Eadala—justice—is not a slogan; it is a promise enforced by institutions. By spreading courthouses and professional administration across the realm, we reduce unrest and limit the ability of local powerbrokers to rule by intimidation. A state that guarantees predictable law becomes easier to govern and harder to destabilize. Justice strengthens legitimacy, and legitimacy makes reform possible without constant rebellion."

araby_world_center_of_learning:0 "World Center of Learning"
araby_world_center_of_learning_desc:0 "Once, our greatest cities were beacons of scholarship, engineering, and philosophy. Reclaiming that legacy means investing in infrastructure and institutions that accelerate knowledge itself. Rapid institution growth reflects more than education—it reflects a society capable of adopting new ideas, spreading them efficiently, and turning them into advantage. When Araby becomes a world center of learning again, our rivals will struggle to keep pace with our modernization."

araby_evangelism:0 "Evangelism of the New Faith"
araby_evangelism_desc:0 "A new faith has emerged from Araby’s chaos, unified under the Prophet of the Sun and carried forward by a people hungry for purpose. In this moment, belief is energy: it mobilizes communities, inspires sacrifice, and creates momentum that can reshape the region. By expanding our missionary capacity, we turn spiritual fervor into organized outreach rather than uncontrolled zeal. A young faith must spread quickly, before doubt and division have time to take root."

araby_inspired_missionaries:0 "Inspired Missionaries"
araby_inspired_missionaries_desc:0 "The holy cities are not just sacred places—they are engines of legitimacy and inspiration. When we control and invest in the sites tied to prophecy, missionaries gain confidence and act with greater independence, requiring less state expense to sustain their work. This doctrine supports a wider and more durable missionary network, capable of operating across borders and through hardship. A faith anchored in holy cities can expand farther, because it always has a recognized source of authority."

araby_a_unified_people:0 "A Unified People"
araby_a_unified_people_desc:0 "A fragmented Araby bleeds strength through rivalry and distrust. A unified Araby transforms identity into manpower, because people fight more readily for a cause they believe is truly theirs. By drawing greater manpower from our culture and culture group, we reflect the political reality of consolidation: fewer internal enemies, more willing recruits, and stronger social cohesion. Unity is not only stability—it is a military resource that grows as our legitimacy grows."

araby_now_we_build:0 "Now We Build"
araby_now_we_build_desc:0 "Nehekhara’s monuments are proof that stone can outlast dynasties. By studying great projects and adopting the techniques that created them, we reduce the cost and time required to expand monuments across our own realm. These works are not vanity; they are infrastructure, symbolism, and state capacity made visible. When Araby builds quickly and efficiently, we project permanence—and permanence changes how allies and enemies treat us."

araby_global_religion:0 "A Global Religion"
araby_global_religion_desc:0 "The mandate is not complete until it is universal in ambition. As our faith spreads, conversion becomes not only a spiritual project but a geopolitical weapon: stronger missionary strength, greater capacity to send missionaries, and reduced warscore cost against those who resist. Trade flourishes under a unified order, and our economic efficiency increases as belief stabilizes relations and routes. This is the vision of a world reorganized—where religion, diplomacy, and commerce reinforce one another under Araby’s leadership."

araby_cavalry_1:0 "Riders of Wind and Sand"
araby_cavalry_1_desc:0 "Our people have always lived in motion—camel caravans crossing harsh deserts, horsemen raiding where enemies least expect, and scouts riding ahead of the main host like shadows. This tradition is not a relic; it is a strategic identity that favors speed, initiative, and sudden violence over slow, grinding wars. By expanding the proportion of cavalry we can field effectively, we align our armies with the land and the culture that shaped them. Araby wins not by standing still, but by striking first and choosing the battlefield."

araby_cavalry_2:0 "Arabian Horse Breeding"
araby_cavalry_2_desc:0 "Arabian horses are prized across the world, but admiration alone does not fill our stables. If we control breeding, pasture rights, and the trade of livestock, we can ensure a steady supply of mounts fit for war, not merely for ceremony. With organized production and state oversight, cavalry becomes cheaper to recruit and easier to replace after losses. This is a logistical reform disguised as tradition: the more reliable our horse supply, the more consistently we can fight on our terms. A nation that can always mount its riders can always threaten its neighbors."

araby_cavalry_3:0 "Horses for Every Soldier"
araby_cavalry_3_desc:0 "It is not enough to field an elite cavalry arm while the rest of the army trudges behind. If Araby is to fight like the wind, then mobility must become common, not exceptional. By expanding horse production and building the supporting infrastructure—fodder stores, remount depots, and supply contracts—we can raise more cavalry at lower cost and sustain it in long campaigns. This creates an army that can concentrate force rapidly and exploit victories before enemies can recover. When mounted troops are plentiful, speed becomes a doctrine rather than a specialty."

araby_cavalry_4:0 "A Mounted Nation"
araby_cavalry_4_desc:0 "To mount every man, woman, and child is not a literal decree, but it captures the ambition: mobility as a national condition. With massive herds, disciplined breeding, and efficient distribution, our realm can replace mounts quickly and keep cavalry numbers high even through prolonged war. A force with this level of mounted strength dictates the pace of conflict, punishing the slow and isolating the unprepared. This is how Araby becomes untouchable on land—always arriving first, always withdrawing safely, always deciding when the battle truly begins. When our armies ride as one, even empires struggle to catch us."

araby_djinn_warfare_1:0 "Brass Bindings"
araby_djinn_warfare_1_desc:0 "Brass is not decoration; it is containment, control, and command. The bottles, urns, and lamps that bind djinn require reliable access to copper, and without that supply the entire art collapses into superstition and improvisation. By securing copper and standardizing the manufacture of binding vessels, we make djinn integration consistent enough to be militarily useful. The result is not merely stronger weapons, but weapons that behave predictably under stress. When binding becomes industry, the battlefield becomes a laboratory—and our firepower improves accordingly."

araby_djinn_warfare_2:0 "Ornamented Wards"
araby_djinn_warfare_2_desc:0 "The smallest details often decide whether a binding holds or breaks. Ornamentation—inscriptions, filigree, and carefully chosen materials—is part of the warding itself, reinforcing the constraints that keep djinn contained and directed. By refining these practices and investing in the crafts that support them, we increase the reliability and potency of djinn-assisted weaponry. This is where artistry meets lethality: beauty becomes function, and function becomes destruction. A properly warded arsenal turns volatile spirits into disciplined instruments of war."

araby_djinn_warfare_3:0 "Djinn Cannons"
araby_djinn_warfare_3_desc:0 "Our cannons are already feared, but fear is not enough when walls grow thicker and fortresses more sophisticated. By combining heavy artillery with djinn-bound ignition, pressure, and guidance, we create weapons designed to break sieges quickly and decisively. This is not incremental improvement—it is a shift in siege warfare, where defenders lose the time they depend on to gather relief or starve invaders. When our guns speak, stone fails, morale falters, and capitulation follows. A realm that masters djinn cannons does not merely win wars; it ends them on schedule."

araby_djinn_bindings_1:0 "Listen to the Djinn"
araby_djinn_bindings_1_desc:0 "Whether bound, allied, or hostile, djinn possess perspectives that mortals cannot easily replicate. Their memories stretch across centuries, their instincts are sharpened by unnatural perception, and their curiosity can be weaponized into discovery. By studying their teachings—carefully, and with safeguards—we accelerate the pace of new ideas and reduce the time wasted on dead ends. Innovativeness rises when knowledge is broadened beyond human limits. This is cautious progress: not trust, but disciplined extraction of insight."

araby_djinn_bindings_2:0 "Halls of Study"
araby_djinn_bindings_2_desc:0 "Private experiments produce secrets, but institutions produce momentum. By building great places of study where scholars, artificers, and djinn-binders collaborate under oversight, we turn sporadic breakthroughs into repeatable advances. These halls train specialists, preserve findings, and prevent knowledge from dying with individual masters. The djinn become sources of structured inquiry rather than unpredictable anecdotes. When learning is centralized and sustained, Araby stops chasing the future and starts manufacturing it."

araby_djinn_mastery:0 "Mastery of the Djinn"
araby_djinn_mastery_desc:0 "Mastery does not mean domination alone; it means integration without collapse. When bindings are perfected and doctrine is established, djinn can be used across administration, engineering, logistics, and warfare with far fewer catastrophic failures. Projects accelerate, experiments scale, and reforms become easier to implement because capability grows faster than resistance. This is the point where magic ceases to be a special tool and becomes an everyday advantage. A state that reaches djinn mastery does not merely innovate—it outpaces."

araby_morale_1:0 "Fierce Spirits"
araby_morale_1_desc:0 "A people shaped by desert hardship do not break easily, but morale still requires cultivation. By establishing places to train—where discipline, endurance, and pride are forged—we turn raw courage into dependable battlefield confidence. Soldiers who believe they belong to something larger fight longer and recover faster from setbacks. These institutions also standardize leadership, reducing the chaos that causes armies to collapse under pressure. When fierce spirits are trained rather than merely admired, morale becomes a strategic asset."

araby_morale_2:0 "Modern Tactics, Ancient Resolve"
araby_morale_2_desc:0 "New eras of war demand new methods, but abandoning our past would be a mistake. By adopting modern training, drill, and command structures while preserving our cultural resolve, we create armies that are both efficient and relentless. Professionalism and tradition reinforce each other: better tactics reduce unnecessary losses, and stronger morale ensures victories are exploited instead of squandered. This doctrine builds forces that can adapt without losing identity. When Araby modernizes without softening, our enemies face both precision and endurance."

araby_convert_nonbelievers_1:0 "Mandate of Conversion I"
araby_convert_nonbelievers_1_desc:0 "Our mandate is not satisfied by regional dominance; it demands expansion of the true faith beyond our borders. Early campaigns must be deliberate—strong enough to force concessions, but focused enough to avoid overextension. By pairing modest missionary strength with reduced warscore cost against other religions, we make conversion and subjugation more attainable without requiring perfect wars. This is the first step in turning belief into policy. The world will resist, but resistance becomes expensive when our objectives are efficient."

araby_convert_nonbelievers_2:0 "Mandate of Conversion II"
araby_convert_nonbelievers_2_desc:0 "As our faith spreads, momentum compounds. Each new conversion reduces the space where enemies can hide, and each victory increases the legitimacy of our claim to lead. Stronger missionary force sustains the pace, while further reductions in warscore cost make continued expansion less burdensome. This doctrine assumes permanence: we are not raiding for trophies, we are building an order. When opponents realize our gains are not temporary, their alliances weaken and their resolve fractures."

araby_convert_nonbelievers_3:0 "Mandate of Conversion III"
araby_convert_nonbelievers_3_desc:0 "At this stage, conversion is not a campaign; it is a machine. Administrators, missionaries, and armies operate in sequence—conquest, stabilization, instruction, and consolidation—until resistance becomes localized and futile. Higher missionary strength ensures that each new territory is integrated faster, reducing the long-term cost of expansion. Further warscore efficiency means we can demand sweeping terms without endless wars. When conversion becomes systematic, the map changes faster than rival powers can respond."

araby_convert_nonbelievers_4:0 "Mandate of Conversion IV"
araby_convert_nonbelievers_4_desc:0 "A mature mandate leaves little room for compromise. Our institutions are built to project power outward while absorbing new lands without losing momentum. With the strongest missionary push and the greatest efficiency in imposing terms on other religions, we can reshape regions in fewer wars and consolidate them sooner. This is not merely religious ambition—it is geopolitical transformation driven by doctrine. When Araby reaches this level, opposition is not defeated only on battlefields; it is outlasted in governance."

araby_protected_desert_trade:0 "Protected Desert Trade"
araby_protected_desert_trade_desc:0 "Trade cannot flourish if caravans die in the sand and armies collapse on the march. By securing desert routes with patrols, infrastructure, and reliable supply points, we turn harsh terrain into a controlled artery of commerce. Friendly forces move faster and sustain themselves better, while merchants benefit from stronger local trade power and fewer disruptions. This is security as economic policy: the safer the route, the more traffic it attracts, and the more wealth it generates. When the desert becomes dependable, it stops being a barrier and becomes an advantage."

araby_elites_determine_doctrine:0 "Elites Determine Doctrine"
araby_elites_determine_doctrine_desc:0 "A faith that ignores power will be manipulated by it. By formally valuing elite opinion—nobles, guild leaders, and institutional authorities—we reduce the risk of open resistance and create a doctrine that is enforceable, not merely inspirational. Higher estate influence and loyalty equilibrium reflect a stable bargain: the elites accept the faith’s authority because their status is protected within it. This path favors governance that is orderly and predictable, even if it is less egalitarian. When elites are invested, the state gains coherence and the religion gains durability."

araby_the_common_man:0 "The Common Man"
araby_the_common_man_desc:0 "Legitimacy is strongest when it is shared, not imposed. By grounding authority in the common people, we broaden the foundation of the state across multiple government forms—monarchies, republics, theocracies, hordes, and meritocracies alike. This doctrine treats public confidence as a resource that can be cultivated through fairness, inclusion, and visible purpose. Stability rises when ordinary citizens see themselves as stakeholders rather than subjects. When the common man grants legitimacy, rebellion becomes less attractive because the state feels like it belongs to everyone."

araby_spread_through_war:0 "Spread Through War"
araby_spread_through_war_desc:0 "War is the fastest way to shatter old systems and create space for new belief. This doctrine treats conquest as a tool of conversion: armies move first, and missionaries follow behind the front. Higher morale reflects the psychological edge of soldiers who believe they are fighting for a sacred mandate rather than mere territory. It is a harsh approach, but it is decisive, and decisiveness limits prolonged instability. When war spreads the faith, resistance is broken quickly and reorganized under a new order."

araby_spread_through_peace:0 "Spread Through Peace"
araby_spread_through_peace_desc:0 "A faith that relies only on the sword risks creating fear without conviction. By prioritizing diplomacy, persuasion, and institutional influence, we spread belief in ways that endure even when armies are absent. Higher diplomatic reputation reflects credibility: other nations treat our promises as meaningful, and our envoys as more than threats. This approach builds networks of allies, converts, and sympathetic elites beyond our borders. When peace spreads the faith, the world changes through alignment rather than occupation."

araby_increase_tax:0 "Charitable Tax"
araby_increase_tax_desc:0 "Charity can be encouraged, but it can also be organized. By increasing taxation in the name of Zakat, we create a consistent flow of resources that can be redirected into public works, relief, and state priorities without relying on voluntary giving. This strengthens fiscal capacity and reduces vulnerability during war and crisis. Critics may call it coercion, but the state can deliver charity at scale when it has predictable revenue. When charity is funded reliably, it becomes policy rather than sentiment."

araby_charitable_government:0 "Charitable Government"
araby_charitable_government_desc:0 "If charity is central to our faith, the government must embody it, not merely demand it. This doctrine accepts lower tax performance in exchange for greater internal stability, reducing unrest through visible social investment and protective administration. The goal is not to maximize revenue, but to minimize desperation—because desperation breeds revolt. A state that cushions its people can reform more safely and mobilize more willingly when needed. When the government is charitable, loyalty is earned rather than purchased."

araby_tolerance_of_others:0 "Tolerance of Others"
araby_tolerance_of_others_desc:0 "A rapidly expanding faith faces a simple risk: schism, backlash, and endless internal conflict. By tolerating heathens and heretics, we reduce friction and make space for gradual integration rather than forced uniformity. Improved relations help diplomacy and trade, while tolerance lowers the likelihood that dissent becomes rebellion. This approach treats stability as a prerequisite for long-term growth. When we allow room for difference, we preserve unity where it matters most—under the authority of the state."

araby_tolerance_of_own:0 "Rigid Orthodoxy"
araby_tolerance_of_own_desc:0 "A faith without boundaries dissolves into competing interpretations and rival authorities. By prioritizing strict internal orthodoxy, we strengthen cohesion among true believers and reinforce solidarity with nations of the same religion. This path is less flexible, but it is clearer: doctrine becomes standardized, institutions become aligned, and internal disputes are easier to resolve. Relations within the faith improve because expectations are shared and deviations are discouraged. When orthodoxy is enforced, the religion becomes a single weapon instead of many arguments."

araby_regulate_djinn_binding:0 "Regulate Djinn Binding"
araby_regulate_djinn_binding_desc:0 "Djinn are dangerous—not only because of their power, but because power attracts corruption. By regulating binding practices through law and state oversight, we reduce chaos and lower the political leverage of the mages who control these arts. Reduced stability costs reflect fewer scandals, fewer disasters, and fewer internal crises caused by irresponsible experimentation. This doctrine treats magic as a strategic asset that must be controlled like currency or gunpowder. When bindings are regulated, the state remains the master of its own tools."

araby_djinn_in_the_navy:0 "Djinn in the Navy"
araby_djinn_in_the_navy_desc:0 "If djinn influence risks corrupting citizens, then keep their use where society is thinnest—on the open sea. Naval service isolates bindings from population centers while still extracting their value in warfare, where enhanced morale damage can break enemy fleets faster. This doctrine turns djinn power outward, aimed at rivals rather than inward at our own stability. It also aligns with a maritime strategy of controlling trade routes through force. When djinn serve the navy, Araby projects power without inviting unrest at home."

araby_djinn_in_the_forts:0 "Djinn in the Forts"
araby_djinn_in_the_forts_desc:0 "If djinn must be bound, bind them where their presence is controlled and their value is maximized: in great fortresses. Fortified containment limits their exposure to civilians while strengthening defenses through improved preparedness and resilience. This doctrine treats djinn as a strategic deterrent, making sieges longer, costlier, and less attractive to enemies. A realm with stronger fortifications controls tempo, because attackers bleed time and resources before they ever reach the heartland. When djinn guard our walls, invasion becomes a test of endurance most enemies will fail."

araby_djinn_in_the_army:0 "Djinn in the Army"
araby_djinn_in_the_army_desc:0 "Djinn are creatures with will, and even bound power can be directed toward purpose. By integrating djinn into the army, we convert their destructive potential into battlefield advantage—especially in firepower, where modern war increasingly decides outcomes. This doctrine frames service as a path to earned freedom or honored status, reducing the risk of constant rebellion from within the bindings. The army becomes both instrument and proving ground. When djinn march with our soldiers, our enemies face an army reinforced by forces beyond mortal endurance."

araby_djinn_citizens:0 "Djinn as Citizens"
araby_djinn_citizens_desc:0 "Treating djinn purely as tools creates enemies with long memories. This doctrine takes a different risk: integrating djinn into society as regulated participants in research, industry, and statecraft. Unrest may rise as citizens fear change and elites resist dilution of power, but the payoff is sustained innovation and faster technological progress. Mages lose some equilibrium loyalty because their monopoly weakens, yet the state gains broader capability. When djinn become citizens, Araby becomes a society that turns the extraordinary into ordinary advantage."

araby_events.100.t:0 "Who Defines the Faith?"
araby_events.100.d:0 "The rise of the Sun’s doctrine has unified Araby with a speed few believed possible. Priests, nobles, guilds, and soldiers now gather under a shared belief, yet unity has raised a new question that cannot be avoided: who has the authority to define the faith itself? If doctrine is to guide law and governance, someone must ultimately interpret it./n/nMany argue that the estates—the nobles, clergy, and powerful institutions—must shape theology. They possess the education, the influence, and the resources to ensure the faith is stable and enforceable across the realm. A doctrine written with elite consent is one that can endure politics, administration, and the realities of power./n/nOthers argue the opposite: the faith belongs to the people who embraced it. If the common man sees the doctrine as his own, its legitimacy will run deeper than any decree from court or temple. A religion born in the streets and markets of Araby may draw its strength from the same source."

araby_events.100.option_1:0 "The elites must guide doctrine."
araby_events.100.option_2:0 "The faith belongs to the people."


araby_events.101.t:0 "Sword or Word?"
araby_events.101.d:0 "The Prophet of the Sun taught that truth must spread across the world, but he never dictated the exact means by which that task must be accomplished. Now that Araby stands united and strong, the question cannot be avoided: what role should war play in spreading the faith? Some argue that conquest is simply the most efficient tool available./n/nSupporters of the martial path point to history. Armies open doors that diplomacy cannot, and once victory is secured, missionaries may follow safely in their wake. War is brutal, but it is decisive, and decisive victories create the conditions where belief can take root./n/nOthers believe the faith must travel ahead of the sword. Missionaries, diplomats, and scholars could persuade foreign rulers and peoples to adopt the doctrine voluntarily. Such conversions may be slower, but they could produce allies instead of resentful subjects."

araby_events.101.option_1:0 "War spreads the truth fastest."
araby_events.101.option_2:0 "Let the missionaries go first."


araby_events.102.t:0 "The Question of Zakat"
araby_events.102.d:0 "Charity is one of the central pillars of the new faith. The teachings of the Prophet emphasize that wealth must circulate to support the poor, strengthen communities, and maintain justice across society. Yet the rise of a unified Araby has introduced a new dilemma: what role should the state itself play in this sacred duty?/n/nSome advisors propose increasing taxation in order to fund charity through the government. With a centralized system, the state could direct aid where it is most needed, ensuring that generosity becomes reliable policy rather than occasional goodwill. Organized charity could stabilize the realm while strengthening the authority of the faith./n/nOthers warn that charity loses meaning when it becomes a mere tax. Instead, they argue the government should lead by example, investing directly in relief and social support while encouraging citizens to fulfill their religious obligations voluntarily. In this view, generosity must remain visible and sincere to inspire devotion."

araby_events.102.option_1:0 "Increase the charitable tax."
araby_events.102.option_2:0 "The government itself must give."


araby_events.103.t:0 "The Risk of Schism"
araby_events.103.d:0 "The new faith has spread rapidly, perhaps faster than its institutions can fully absorb. As priests preach, scholars write, and missionaries travel abroad, different interpretations of doctrine have begun to emerge. Most remain minor disagreements, but some voices now warn that these differences could one day harden into a true schism./n/nOne approach is tolerance. By allowing a range of interpretations and focusing on shared principles rather than rigid doctrine, the state could maintain unity among believers while avoiding unnecessary conflict. This path values stability and diplomacy, even if it risks theological ambiguity./n/nOthers argue that ambiguity is precisely the danger. If doctrine is not enforced clearly, rival schools will eventually claim equal authority and fracture the faith. Only strict orthodoxy—firm definitions of belief and practice—can ensure that the religion remains unified under a single interpretation."

araby_events.103.option_1:0 "Allow room for differing opinions."
araby_events.103.option_2:0 "Doctrine must remain rigid."


araby_events.104.t:0 "The Place of the Djinn"
araby_events.104.d:0 "Djinn have long been a mysterious presence in Araby. Some are bound into brass vessels, others are rumored to wander the deserts freely, and still others are said to advise mages and scholars in secret. With the rise of the new faith, their role in society must now be addressed directly./n/nMany religious leaders insist that djinn are dangerous spirits whose influence must be carefully controlled. Their binding could be regulated or restricted to prevent corruption and ensure that mortals remain the true masters of the realm. This path prioritizes stability and caution above experimentation./n/nYet other voices argue that djinn are not merely demons or tools. Some believe they possess souls and knowledge that could benefit the faithful if guided properly. Whether placed in the navy, stationed in fortresses, integrated into the army, or even welcomed as participants in society, the decision will shape how Araby interacts with these ancient beings."

araby_events.104.option_1:0 "Regulate their binding strictly."
araby_events.104.option_2:0 "Use them on the seas."
araby_events.104.option_3:0 "Bind them to our fortresses."
araby_events.104.option_4:0 "Let them serve in the army."
araby_events.104.option_5:0 "Let them work alongside us."