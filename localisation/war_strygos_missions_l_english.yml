l_english:

 strygos_crypt_oaths_title:0 "Crypt Oaths"
 strygos_crypt_oaths_desc:0 "The situation is that Mourkain's court is made from vampires, Strigany, ghouls, and the obedient dead. We must bind enough allies to prove our word can travel beyond one ruined throne."
 strygos_ghoul_crowns_bent_title:0 "Ghoul Crowns Bent"
 strygos_ghoul_crowns_bent_desc:0 "The situation is that too many hungry claimants remember themselves as kings. We must gather enough prestige that their cracked crowns bend toward Mourkain."
 strygos_black_fire_tollhouse_title:0 "Black Fire Tollhouse"
 strygos_black_fire_tollhouse_desc:0 "The situation is that Black Fire Pass guards the northern road into the Border Princes. We must hold it with markets and walls so every living caravan pays for the dead who watch it."
 strygos_kadonite_rite_keepers_title:0 "Kadonite Rite-Keepers"
 strygos_kadonite_rite_keepers_desc:0 "The situation is that Kadon's shadow cannot guide the realm while its priests and necromancers quarrel. We must make the church estate loyal, useful, and disciplined."
 strygos_neighbor_under_night_title:0 "Neighbor Under Night"
 strygos_neighbor_under_night_desc:0 "The situation is that fear alone makes poor diplomacy. We must bring a neighboring court into our religion so the night has a voice outside Mourkain."
 strygos_four_courts_of_night_title:0 "Four Courts of Night"
 strygos_four_courts_of_night_desc:0 "The situation is that one converted neighbor can be dismissed as terror or accident. We must surround Strygos with four neighboring courts that share our faith."
 strygos_nocturnal_envoys_title:0 "Nocturnal Envoys"
 strygos_nocturnal_envoys_desc:0 "The situation is that old courts still call us carrion kings when their doors are closed. We must cultivate enough diplomatic reputation that dread begins to sound like policy."
 strygos_ten_thrones_north_title:0 "Ten Thrones North"
 strygos_ten_thrones_north_desc:0 "The situation is that the Border Princes sit just north of Mourkain's restored shadow. We must control ten holdings there through our own rule or our subjects."
 strygos_twenty_five_north_title:0 "Twenty-Five North"
 strygos_twenty_five_north_desc:0 "The situation is that ten northern thrones are only leverage. We must hold twenty-five so every prince accounts for Strygos before drawing a map."

 strygos_dead_muster_title:0 "Dead Muster"
 strygos_dead_muster_desc:0 "The situation is that dead soldiers still need captains, stores, and commands that arrive on time. We must muster to our force limit before old enemies discover our weakness."
 strygos_seats_of_the_old_empire_title:0 "Seats of the Old Empire"
 strygos_seats_of_the_old_empire_desc:0 "The situation is that Strygos cannot be restored by Mourkain alone. We must reclaim enough old seats that the Badlands remember the shape of our empire."
 strygos_crypt_courts_title:0 "Crypt Courts"
 strygos_crypt_courts_desc:0 "The situation is that ghoul feuds and necromancer lawsuits can both end in blood. We must build courts that make judgment cheaper than private hunger."
 strygos_passes_made_stone_title:0 "Passes Made Stone"
 strygos_passes_made_stone_desc:0 "The situation is that royal memories do not stop raiders in a pass. We must raise serious forts until the Badlands roads become guarded habits."
 strygos_pacts_among_giants_title:0 "Pacts Among Giants"
 strygos_pacts_among_giants_desc:0 "The situation is that recognition matters most when powerful realms need us or fear us. We must bind two great powers by trusted alliance or recent defeat."
 strygos_university_of_necromancy_title:0 "University of Necromancy"
 strygos_university_of_necromancy_desc:0 "The situation is that necromancy cannot remain a knife fight between jealous masters. We must build a university in a developed Badlands province and make death a discipline."
 strygos_ten_warrens_below_title:0 "Ten Warrens Below"
 strygos_ten_warrens_below_desc:0 "The situation is that roads below the world can carry armies, secrets, and vermin threats. We must hold ten stations in the Under-Empire before others use them against us."
 strygos_twenty_five_below_title:0 "Twenty-Five Below"
 strygos_twenty_five_below_desc:0 "The situation is that ten warrens are only a map of danger. We must hold twenty-five so the darkness below becomes another frontier of Strygos."

 strygos_raised_cairns_title:0 "Raised Cairns"
 strygos_raised_cairns_desc:0 "The situation is that loose cairns invite every raider to test the dead. We must raise early forts in the Badlands before ambition outruns shelter."
 strygos_strigany_rolls_title:0 "Strigany Rolls"
 strygos_strigany_rolls_desc:0 "The situation is that the Strigany are not only wanderers tolerated at the edge of fear. We must record their names, settle their caravans, and make them a people again."
 strygos_fortress_crossings_title:0 "Fortress Crossings"
 strygos_fortress_crossings_desc:0 "The situation is that roads and riverbeds break kingdoms at their crossings. We must build barracks and training fields so those hard points are defended by more than walls."
 strygos_claim_strygosi_thrones_title:0 "Claim Strygosi Thrones"
 strygos_claim_strygosi_thrones_desc:0 "The situation is that a restored empire needs claims backed by roads, soldiers, and graves. We must hold enough Badlands to claim the rest in Mourkain's name."
 strygos_strygos_reborn_title:0 "Strygos Reborn"
 strygos_strygos_reborn_desc:0 "The situation is too haunted for scattered lairs and private hungers. We must restore Strygos or hold enough of its heartland that the old name becomes unavoidable."
 strygos_stable_dominion_title:0 "Stable Dominion"
 strygos_stable_dominion_desc:0 "The situation is that peace in a dead empire sounds like toll bells, petitions, and doors barred before sunset. We must push unrest below zero until rebellion becomes rarer than court procedure."
 strygos_modern_dead_muster_title:0 "Modern Dead Muster"
 strygos_modern_dead_muster_desc:0 "The situation is that grave luck and hungry packs cannot carry an empire forever. We must build a professional army with a memory longer than one feeding."
 strygos_great_power_recognized_title:0 "Great Power Recognized"
 strygos_great_power_recognized_desc:0 "The situation is that the world still wants to call us a corpse twitching in the Badlands. We must become a great power with prestige, legitimacy, envoys, soldiers, and ships enough to make mockery dangerous."
 strygos_votes_or_standards_title:0 "Votes or Standards"
 strygos_votes_or_standards_desc:0 "The situation is that the Empire understands ballots, standards, and armed facts. We must hold ten Imperial provinces or win an elector's vote."
 strygos_imperial_foothold_title:0 "Imperial Foothold"
 strygos_imperial_foothold_desc:0 "The situation is that a vote is influence while provinces are proof. We must deepen our Imperial reach until no court can ignore Mourkain."
 strygos_five_horizons_title:0 "The Five Horizons"
 strygos_five_horizons_desc:0 "The situation is that northern thrones, warrens below, Imperial footholds, eastern stations, and Nehekharan tombs can still look like accidents. We must bind those horizons with ships and one policy."
 strygos_empire_of_mourkain_title:0 "Empire of Mourkain"
 strygos_empire_of_mourkain_desc:0 "The situation is that the world remembers Mourkain as a ruin and Strygos as a warning. We must master the Badlands, stand among the great powers, and make every rival giant answer by treaty or defeat."

 strygos_night_sanctuaries_title:0 "Night Sanctuaries"
 strygos_night_sanctuaries_desc:0 "The situation is that terror alone scatters useful subjects. We must build shrines and sanctuaries where fear kneels before it becomes flight."
 strygos_break_the_waaagh_title:0 "Break the Waaagh"
 strygos_break_the_waaagh_desc:0 "The situation is that Greenskin vengeance destroyed old Strygos once. We must defeat or displace the Waaagh threat around Mourkain."
 strygos_waaagh_camps_raised_title:0 "Waaagh Camps Raised"
 strygos_waaagh_camps_raised_desc:0 "The situation is that Greenskin camps teach the dead empire to remember fire. We must raise enough of them that the next Waaagh looks elsewhere."
 strygos_crypt_companies_title:0 "Crypt Companies"
 strygos_crypt_companies_desc:0 "The situation is that necromancers, ghoul packs, and sellswords all demand pay of some kind. We must earn enough income to make our companies answer contracts instead of hunger."
 strygos_black_gulf_shipyards_title:0 "Black Gulf Shipyards"
 strygos_black_gulf_shipyards_desc:0 "The situation is that the Black Gulf cannot remain another living shore beyond our reach. We must build docks and shipyards fit to guard the corpse-road."
 strygos_grave_manufactories_title:0 "Grave Manufactories"
 strygos_grave_manufactories_desc:0 "The situation is that outsiders think factories cannot survive among ghouls and tomb winds. We must prove the dead empire can keep furnaces, tools, and schedules moving."
 strygos_defeat_crowned_giant_title:0 "Defeat a Crowned Giant"
 strygos_defeat_crowned_giant_desc:0 "The situation is that a great power's defeat is worth more than a hundred veiled petitions. We must beat one in war and carry enough power projection that the victory cannot be dismissed."
 strygos_caravans_to_the_dark_lands_title:0 "Caravans to the Dark Lands"
 strygos_caravans_to_the_dark_lands_desc:0 "The situation is that the Dark Lands are no longer rumor beyond ash and caravan smoke. We must hold ten stations there to prove our reach runs east."
 strygos_eastern_stations_title:0 "Eastern Stations"
 strygos_eastern_stations_desc:0 "The situation is that ten stations are only a caravan story. We must hold twenty-five so the eastern routes recognize Strygosi habits of rule."

 strygos_toll_road_charters_title:0 "Toll-Road Charters"
 strygos_toll_road_charters_desc:0 "The situation is that roads need coin before they need old titles. We must turn markets and road charters into the purse of a restored empire."
 strygos_market_crossroads_title:0 "Market Crossroads"
 strygos_market_crossroads_desc:0 "The situation is that toll roads need anchors where merchants can argue, store goods, and be taxed predictably. We must upgrade two crossroads and make them worth defending."
 strygos_palace_of_mourkain_title:0 "Palace of Mourkain"
 strygos_palace_of_mourkain_desc:0 "The situation is that Mourkain's palace is still more wound than throne. We must raise it beyond its first broken tier so Strygos has a court that cannot be dismissed as rubble."
 strygos_black_gulf_patrols_title:0 "Black Gulf Patrols"
 strygos_black_gulf_patrols_desc:0 "The situation is that the Black Gulf rewards captains who move quickly and ask few questions. We must put enough light ships on the water that our flags become part of every smuggler's calculation."
 strygos_command_the_home_node_title:0 "Command the Home Node"
 strygos_command_the_home_node_desc:0 "The situation is that patrols matter most when they command the routes feeding home. We must control eighty percent of the trade node around Mourkain."
 strygos_ten_tombs_south_title:0 "Ten Tombs South"
 strygos_ten_tombs_south_desc:0 "The situation is that Nehekhara remembers kings older than Ushoran. We must hold ten provinces there and show that Mourkain can face the tombs."
 strygos_nehekharan_dominion_title:0 "Nehekharan Dominion"
 strygos_nehekharan_dominion_desc:0 "The situation is that ten tombs are only outposts. We must hold twenty-five so the southern frontier recognizes Mourkain's seal."

 strygos_claims_badlands_tt:0 "Gain permanent claims on the Badlands."
 strygos_claims_border_princes_tt:0 "Gain permanent claims on the Border Princes."
 strygos_claims_underempire_tt:0 "Gain permanent claims on the Under-Empire."
 strygos_claims_empire_tt:0 "Gain permanent claims on the Empire."
 strygos_claims_darklands_tt:0 "Gain permanent claims on the Dark Lands."
 strygos_claims_nehekhara_tt:0 "Gain permanent claims on Nehekhara."

 strygos_crypt_oaths_mod:0 "Crypt Oaths"
 desc_strygos_crypt_oaths_mod:0 "Our agreements are witnessed by old blood, sealed graves, and courtiers who remember every slight."
 strygos_ghoul_crowns_bent_mod:0 "Bent Ghoul Crowns"
 desc_strygos_ghoul_crowns_bent_mod:0 "Hungry claimants now understand that their little courts survive by answering Mourkain."
 strygos_black_fire_tollhouse_mod:0 "Black Fire Tollhouse"
 desc_strygos_black_fire_tollhouse_mod:0 "The pass tolls now fund guards, ledgers, and quiet undead work along the northern road."
 strygos_kadonite_rite_keepers_mod:0 "Kadonite Rite-Keepers"
 desc_strygos_kadonite_rite_keepers_mod:0 "The rite-keepers of the court now serve the throne before serving their private rivalries."
 strygos_neighbor_under_night_mod:0 "Neighbor Under Night"
 desc_strygos_neighbor_under_night_mod:0 "A neighboring court now shares our night, making quiet pressure easier to apply elsewhere."
 strygos_four_courts_of_night_mod:0 "Four Courts of Night"
 desc_strygos_four_courts_of_night_mod:0 "The faith of Mourkain has become a regional fact rather than a single court's horror."
 strygos_nocturnal_envoys_mod:0 "Nocturnal Envoys"
 desc_strygos_nocturnal_envoys_mod:0 "Our envoys speak softly enough for courts to listen and coldly enough for them to remember."
 strygos_twenty_five_north_mod:0 "Northern Throne Authority"
 desc_strygos_twenty_five_north_mod:0 "The Border Princes now calculate Mourkain's reach before they calculate their own chances."
 strygos_dead_muster_mod:0 "Dead Muster"
 desc_strygos_dead_muster_mod:0 "The armies of Strygos answer records, horns, and grave-command with increasing discipline."
 strygos_seats_of_the_old_empire_mod:0 "Seats of the Old Empire"
 desc_strygos_seats_of_the_old_empire_mod:0 "Old seats now lend their names, roads, and frightened memories to Mourkain."
 strygos_crypt_courts_mod:0 "Crypt Courts"
 desc_strygos_crypt_courts_mod:0 "Feuds that once became feeding frenzies now pass through courts backed by soldiers and sharper consequences."
 strygos_passes_made_stone_mod:0 "Stone Passes"
 desc_strygos_passes_made_stone_mod:0 "The Badlands passes are no longer hopes on a map; they are walls, stores, and paid watchmen."
 strygos_pacts_among_giants_mod:0 "Pacts Among Giants"
 desc_strygos_pacts_among_giants_mod:0 "Powerful realms now find it useful or necessary to keep terms with Mourkain."
 strygos_university_of_necromancy_mod:0 "University of Necromancy"
 desc_strygos_university_of_necromancy_mod:0 "Necromancers, surgeons, jurists, and grave-engineers now share a useful institution."
 strygos_twenty_five_below_mod:0 "Under-Empire Frontier"
 desc_strygos_twenty_five_below_mod:0 "Our soldiers have learned to defend in tunnels, underroads, and places where sunlight is only rumor."
 strygos_raised_cairns_mod:0 "Raised Cairns"
 desc_strygos_raised_cairns_mod:0 "Even the roughest cairn-fort is a promise that someone dead will stand guard."
 strygos_strigany_rolls_mod:0 "Strigany Rolls"
 desc_strygos_strigany_rolls_mod:0 "Caravans and bloodlines are now recorded as people, skills, and obligations rather than wandering nuisances."
 strygos_fortress_crossings_mod:0 "Fortress Crossings"
 desc_strygos_fortress_crossings_mod:0 "The crossings now have gates, watch captains, stores, and fewer excuses."
 strygos_stable_dominion_mod:0 "Stable Dominion"
 desc_strygos_stable_dominion_mod:0 "No one would call Strygos peaceful, but fewer disputes now become rebellions."
 strygos_modern_dead_muster_mod:0 "Modern Dead Muster"
 desc_strygos_modern_dead_muster_mod:0 "Captains, drillmasters, and corpse-counters have begun to outlast the wars that made them."
 strygos_imperial_foothold_mod:0 "Imperial Foothold"
 desc_strygos_imperial_foothold_mod:0 "Mourkain's name now carries weight in Imperial calculations, whether by vote, fear, or possession."
 strygos_five_horizons_mod:0 "Five Horizons"
 desc_strygos_five_horizons_mod:0 "Distant holdings no longer look like accidents; they form a system of roads, stations, dominions, and claims."
 strygos_empire_of_mourkain_mod:0 "Empire of Mourkain"
 desc_strygos_empire_of_mourkain_mod:0 "The Badlands once remembered Mourkain as a wound. Now other empires must remember it as a throne."
 strygos_night_sanctuaries_mod:0 "Night Sanctuaries"
 desc_strygos_night_sanctuaries_mod:0 "Shrines and ossuaries give the frightened somewhere to kneel before fear becomes flight."
 strygos_break_the_waaagh_mod:0 "Broken Waaagh"
 desc_strygos_break_the_waaagh_mod:0 "Enemies who cross Mourkain's marches now learn that the land itself has been taught to punish them."
 strygos_waaagh_camps_raised_mod:0 "Raised Waaagh Camps"
 desc_strygos_waaagh_camps_raised_mod:0 "Smoke from broken camps has bought Strygos a little sleep and many useful bones."
 strygos_crypt_companies_mod:0 "Crypt Companies"
 desc_strygos_crypt_companies_mod:0 "Paid soldiers and bound packs still love coin and flesh, but both now come with stricter articles."
 strygos_black_gulf_shipyards_mod:0 "Black Gulf Shipyards"
 desc_strygos_black_gulf_shipyards_mod:0 "Ships launched for the Black Gulf carry the same hard practicality as our forts."
 strygos_grave_manufactories_mod:0 "Grave Manufactories"
 desc_strygos_grave_manufactories_mod:0 "Factories once dismissed as impossible in Strygos now keep tools, schedules, and wages moving."
 strygos_defeat_crowned_giant_mod:0 "A Crowned Giant Defeated"
 desc_strygos_defeat_crowned_giant_mod:0 "The victory is now told as proof that Mourkain can humble powers older than its restored crown."
 strygos_eastern_stations_mod:0 "Eastern Stations"
 desc_strygos_eastern_stations_mod:0 "Far roads now pass through stations that know our seal and rates."
 strygos_toll_road_charters_mod:0 "Toll-Road Charters"
 desc_strygos_toll_road_charters_mod:0 "The roads now pay for the privilege of remaining roads."
 strygos_market_crossroads_mod:0 "Market Crossroads"
 desc_strygos_market_crossroads_mod:0 "Upgraded trade centers make Strygosi tolls more predictable, profitable, and worth defending."
 strygos_palace_of_mourkain_mod:0 "Raised Palace of Mourkain"
 desc_strygos_palace_of_mourkain_mod:0 "The palace is no longer only a ruin; it is a foundation for further works of dread legitimacy."
 strygos_command_the_home_node_mod:0 "Home Node Dominance"
 desc_strygos_command_the_home_node_mod:0 "Our merchants, escorts, and toll officers now command the trade routes closest to Mourkain."
 strygos_nehekharan_dominion_mod:0 "Nehekharan Dominion"
 desc_strygos_nehekharan_dominion_mod:0 "Southern tomb roads now carry our provisions, seals, and hard-learned habits of defense."

 strygos_masked_charters_mod:0 "Masked Charters"
 desc_strygos_masked_charters_mod:0 "Recognition is broad, practical, and just formal enough to stop courts from treating each other as strangers."
 strygos_grave_census_mod:0 "Grave Census"
 desc_strygos_grave_census_mod:0 "Every camp, crypt, family name, and feeding right has been counted so the realm can decide what must be made common."
 strygos_crypt_law_mod:0 "Crypt Law Supreme"
 desc_strygos_crypt_law_mod:0 "The realm tolerates many customs, but not private violence against Mourkain's public order."
 strygos_embassy_coffins_mod:0 "Embassy Coffins"
 desc_strygos_embassy_coffins_mod:0 "Our embassies carry seals and silences that old courts have learned to read carefully."
 strygos_midnight_titles_mod:0 "Midnight Titles"
 desc_strygos_midnight_titles_mod:0 "Our titles are grim in origin but increasingly useful in treaty rooms."
 strygos_dread_renown_mod:0 "Dread Renown"
 desc_strygos_dread_renown_mod:0 "Victories against great powers now train our officers as surely as they frighten our neighbors."
 strygos_black_gulf_smugglers_mod:0 "Licensed Black Gulf Smugglers"
 desc_strygos_black_gulf_smugglers_mod:0 "Merchants under our black licenses move with more confidence and pay for the privilege."
 strygos_charnel_harbor_posts_mod:0 "Charnel Harbor Posts"
 desc_strygos_charnel_harbor_posts_mod:0 "Harbors and roadsteads watched by our patrols are harder to raid and easier to tax."
 strygos_corpse_lantern_escorts_mod:0 "Corpse-Lantern Escorts"
 desc_strygos_corpse_lantern_escorts_mod:0 "Escort ships make the Black Gulf route safer for our merchants and less comfortable for everyone else's raiders."

 strygos_events.1001.t:0 "The Court of Strygos Reborn"
 strygos_events.1001.d:0 "Mourkain has become more than a ruin with soldiers standing in it. Vampires, Strigany elders, ghoul courtiers, necromancers, and frightened living subjects now look to the same throne, though not with the same appetite.\n\nThe question is what kind of order should endure. Masked charters would let many peoples survive beneath the old dream, a grave census would make every name and custom legible, and crypt law would tolerate difference only while it obeys Mourkain.\n\nStrygos was not destroyed because its dream was small. It was destroyed because every dream in the Badlands must learn to bite."
 strygos_events.1001.a:0 "Charter the masked courts."
 strygos_events.1001.b:0 "Count every grave-name."
 strygos_events.1001.c:0 "Make crypt law supreme."

 strygos_events.1002.t:0 "Envoys Before the Charnel Throne"
 strygos_events.1002.d:0 "Foreign envoys have arrived with careful faces and older prejudices hidden under formal words. Some call us a necessary ally, some a useful terror, and some a dead kingdom that has become awkwardly alive again.\n\nRecognition is useful, but recognition must be shaped. We can answer with coffin-sealed embassies, midnight titles that force other courts to speak our language, or the reputation earned by defeating powers that thought Mourkain beneath them.\n\nThe old world of pedigrees has met the old world of tombs. Neither can pretend the meeting did not happen."
 strygos_events.1002.a:0 "Send coffin-sealed embassies."
 strygos_events.1002.b:0 "Proclaim midnight titles."
 strygos_events.1002.c:0 "Let dread victories speak."

 strygos_events.1003.t:0 "Black Gulf Patrols"
 strygos_events.1003.d:0 "Our light ships now move through the Black Gulf in numbers no smuggler can ignore. They are not grand battle lines, but they are fast enough to find pirates, visible enough to reassure caravans, and numerous enough to make tolls feel backed by more than ink.\n\nThe patrols can serve licensed smugglers, fortified charnel posts, or direct corpse-lantern escorts. Each choice profits Mourkain, but each tells captains what kind of sea power Strygos intends to become.\n\nThe Black Gulf has long belonged to whoever could keep ships alive on it. Now our flags are part of that calculation."
 strygos_events.1003.a:0 "License the smugglers."
 strygos_events.1003.b:0 "Fortify charnel posts."
 strygos_events.1003.c:0 "Escort by corpse-lantern."
