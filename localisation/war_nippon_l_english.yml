l_english:


 nippon_events.100.t:0 "The Fracturing of Nippon"
 nippon_events.100.d:0 "For centuries, Nippon endured as a hard island realm off the coast of Cathay. It lacked the vastness of its neighbor and the impossible antiquity claimed by older lands, but it possessed discipline, memory, and a stubborn unity forged by shrine, court, clan, and sword.\n\nThe emperor's sacred dignity and the shogun's worldly command once held the daimyo in an uneasy peace. Castle towns grew around the seats of great houses, warrior monks guarded mountain temples, guilds and village leagues learned to bargain with soldiers, and samurai carried the law of their lords in steel.\n\nThat order has broken. In the past hundred years, vampiric intrigues, Chaos corruption, goblin uprisings, and the ambitions of armed clans have torn the islands into rival states. Old loyalties survive in poetry and prayer, but on the road they are tested by toll gates, assassins, and banners that change with the season.\n\nNow ashigaru drill in muddy fields, smiths cast guns beside older blades, shinobi sell secrets in the dark between castles, and every daimyo speaks of restoring the realm while preparing to betray the one who does it first. The land is wounded, but not helpless. Its traditions have survived by adapting before.\n\nFracture is not death. Nippon's old unity can be reforged by law, faith, steel, and fire. The clan that masters court, temple, town, and battlefield may raise a stronger realm from the ruins of the one that fell."
 nippon_events.100.a:0 "One realm, one blade."

 nippon_events.1.t:0 "The Castle Survey"
 nippon_events.1.d:0 "Surveyors have arrived at the castle gates with ink, cords, and a mandate to measure land that several clans prefer to describe poetically. Village headmen bow, smile, and give answers that change between morning and evening.\n\nA proper survey would strengthen taxation and expose private hoards. Accepting the clan rolls would preserve face and avoid a quarrel. Delay, as always, is the softest way to invite the next argument."
 nippon_events.1.a:0 "Conduct the kenchi survey."
 nippon_events.1.b:0 "Accept the clan rolls."
 nippon_events.1.c:0 "Delay the survey."

 nippon_events.2.t:0 "Shinobi Contracts"
 nippon_events.2.d:0 "A shinobi broker has offered a set of contracts sealed without names. The targets are not written down, but everyone in the room understands that rival castles have doors, servants, and careless nephews.\n\nThe service is useful because it is deniable. It is dangerous for the same reason. A realm built on honor still needs shadows, but shadows dislike remaining servants."
 nippon_events.2.a:0 "Hire the shinobi."
 nippon_events.2.b:0 "Ban such contracts."
 nippon_events.2.c:0 "Sell a few secrets first."

 nippon_events.3.t:0 "Goblins in the Mountain Pass"
 nippon_events.3.d:0 "Goblins have infested the mountain road near [event_target.GetName], hanging painted masks from pine branches and replacing waystones with insulting carvings. The jokes would be funnier if caravans were still arriving.\n\nLocal samurai want the passes fortified before winter. Merchants prefer to pretend the trouble is temporary, which is how temporary troubles become toll stations. The goblins, at least, seem delighted by the debate.\n\nEvery lost mule makes their laughter louder. Every delayed patrol teaches them another trick."
 nippon_events.3.a:0 "Fortify the passes."
 nippon_events.3.b:0 "Ignore their tricks."

 nippon_events.4.t:0 "The Teppo Smiths"
 nippon_events.4.d:0 "Foreign firearms have reached the workshops of a castle town. The smiths believe the design can be copied, improved, and made obedient to Nipponese discipline.\n\nOlder retainers call the weapons crude and dishonorable. Younger captains point out that crude dishonor kills from a useful distance. Merchants are already asking whether the designs may be sold beyond our borders."
 nippon_events.4.a:0 "Sponsor the gunsmiths."
 nippon_events.4.b:0 "Limit foreign influence."
 nippon_events.4.c:0 "Sell the designs."
 nippon_events.4.dd:0 "Trust the old bows."

 nippon_events.5.t:0 "Warrior Monks at the Gate"
 nippon_events.5.d:0 "Warrior monks have marched down from a mountain temple, carrying naginata, prayer beads, and a list of grievances against local officials. They claim to defend the sacred order from corrupt taxmen and arrogant daimyo.\n\nTheir discipline is real, and so is their pride. Funding them could turn zeal into protection. Disciplining them would remind every shrine that the state still has a blade."
 nippon_events.5.a:0 "Fund the temple guards."
 nippon_events.5.b:0 "Discipline the monks."
 nippon_events.5.c:0 "Tax the monasteries instead."

 nippon_events.6.t:0 "The Pale Patron"
 nippon_events.6.d:0 "A pale patron has appeared in the castle town's night economy, paying debts, sponsoring poets, and never entering a shrine before sunset. The magistrates insist the paperwork is immaculate.\n\nRumor calls the patron a vampire. Exposing the creature would shake several respectable houses. Using its money would be easier, provided we can endure the smell of blood beneath the ink.\n\nProtocol has a way of making monsters look invited. The invitation can still be withdrawn."
 nippon_events.6.a:0 "Expose the pale patron."
 nippon_events.6.b:0 "Use the patron's purse."

 nippon_events.7.t:0 "Poetry Before Blades"
 nippon_events.7.d:0 "Court poets have proposed a formal contest to settle a dispute between rival clans. Each verse will be judged for elegance, loyalty, and how sharply it wounds without naming the victim.\n\nThe samurai pretend to be amused, but every poem will be heard as policy. Sponsored well, the contest could turn pride into ceremony. Mishandled, it will merely teach the poets which insults require armor."
 nippon_events.7.a:0 "Sponsor the contest."
 nippon_events.7.b:0 "Use the verses diplomatically."
 nippon_events.7.c:0 "Mock our rivals openly."

 nippon_events.8.t:0 "The Red Banner Rumor"
 nippon_events.8.d:0 "A rumor spreads that one daimyo keeps a red banner hidden in his shrine storehouse, painted with signs that belong to Khorne. His retainers deny everything with the precise anger of men who practiced denial.\n\nA purge would prove resolve but risk tearing open the clan network. Hiding the scandal would preserve order at the cost of honor. Some generals whisper that fury can be directed before it is cleansed.\n\nThat is exactly the sort of whisper that ruins a house. It is also the sort that wins a battle."
 nippon_events.8.a:0 "Purge the banner."
 nippon_events.8.b:0 "Hide the scandal."
 nippon_events.8.c:0 "Turn its fury outward."

 nippon_events.9.t:0 "Rakuichi in the Castle Town"
 nippon_events.9.d:0 "Merchants petition for free-market privileges in the castle town, asking us to break the old za monopolies and open trade to any licensed hand. The guild elders arrive soon after with better robes and colder smiles.\n\nReform would strengthen the town and weaken inherited rights. Compensation may soften the blow, though it teaches every guild that outrage has a price. Temples offer another path, wrapping commerce in sacred charters and safer words."
 nippon_events.9.a:0 "Break the za monopolies."
 nippon_events.9.b:0 "Compensate the guilds."
 nippon_events.9.c:0 "Issue temple charters."
 nippon_events.9.dd:0 "Leave the old rights intact."

 nippon_events.10.t:0 "Glimpse of the Shogun's Katana"
 nippon_events.10.d:0 "The Shogun's Katana has been seen during a private rite, its blade reflecting lantern light like a line of dawn. Courtiers are already turning the sighting into prophecy.\n\nA public procession would stir soldiers and commoners alike. A secret inspection would reveal which clans bow from loyalty and which bow because witnesses are present. The sword cannot unite the realm by itself, but symbols have drawn blood before."
 nippon_events.10.a:0 "Carry it in procession."
 nippon_events.10.b:0 "Inspect loyalties in secret."
