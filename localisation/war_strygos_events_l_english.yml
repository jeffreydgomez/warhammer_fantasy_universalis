l_english:

 strygos_events.1000.t:0 "The Legacy of Mourkain"
 strygos_events.1000.d:0 "For centuries, we have lingered in the shadows of history, our once-glorious dominion reduced to whispers and ruin. Yet the blood of Strygos has not thinned—it endures, eternal and unyielding. Now, at last, the time of reclamation is upon us.\n\nThe Badlands are fractured, their greenskin tribes locked in endless conflict, too consumed by their petty wars to perceive the greater threat rising in their midst. What is one more warlord among the chaos? By the time they awaken to our presence, it shall be far too late.\n\nThe crypts stir once more. Necromancers gather at our call, their dark incantations echoing through the night. From ancient tombs and forgotten battlefields, the dead shall rise to serve us again. Monstrous horrors, long bound beneath the earth, shall be unleashed upon the living.\n\nMourkain shall rise from the ashes of its fall, and with it, the dominion of Strygos reborn. This time, none shall escape our grasp."
 strygos_events.1000.a:0 "Raise the dead. The night belongs to us."

 strygos_events.1.t:0 "A Crown in the Mud"
 strygos_events.1.d:0 "Grave-diggers have found a blackened circlet in mud near a drowned tomb. The necromancers insist it is only a minor relic of Kadon, which is not as reassuring as they seem to think.\n\nThe Strigany elders spit before speaking of it. The ghouls bow, though no one ordered them to."
 strygos_events.1.a:0 "Study it under guard."
 strygos_events.1.b:0 "Break the cursed thing."

 strygos_events.2.t:0 "The Caravan of Old Songs"
 strygos_events.2.d:0 "A Strigany caravan has returned from the north carrying old songs, family names, and stories of hidden graves. Their wagons are poor, but their memories are richer than many treasuries.\n\nWelcoming them would strengthen the claim that Strygos is more than a vampire's appetite. Treating them as tools would be easier, and remembered accordingly.\n\nThe road has made them wary. Exile teaches a sharp ear for false welcome."
 strygos_events.2.a:0 "Welcome them as kin."
 strygos_events.2.b:0 "Record every old name."
 strygos_events.2.c:0 "Demand road tribute first."

 strygos_events.3.t:0 "Protocol for Ghouls"
 strygos_events.3.d:0 "The ghoul packs have begun arranging themselves into courts, complete with titles, scraps of banners, and arguments over precedence. It would be funny if their disputes did not end with bones cracked open for emphasis.\n\nA wise ruler could make this parody useful. A careless one may learn that mock nobility still expects reward."
 strygos_events.3.a:0 "Name their ranks properly."
 strygos_events.3.b:0 "Use their rivalry in war."
 strygos_events.3.c:0 "Mock their little titles."

 strygos_events.4.t:0 "Bones of Waaagh Craktoof"
 strygos_events.4.d:0 "The marsh has uncovered a field of huge Greenskin bones, still locked around rusted weapons from the war that broke Strygos. Even dead, they seem to grin at Mourkain.\n\nNecromancers want the bones. Strigany elders want them buried under curses. The ghouls simply want to know whether they are edible.\n\nHistory rarely offers clean choices. It prefers marrow."
 strygos_events.4.a:0 "Raise the old bones."
 strygos_events.4.b:0 "Bury them with curses."
 strygos_events.4.c:0 "Let the packs feed."
 strygos_events.4.dd:0 "Leave the field untouched."

 strygos_events.5.t:0 "Kadon's Marginalia"
 strygos_events.5.d:0 "A worm-eaten tome has been recovered from a sealed chamber beneath broken masonry. The text is ordinary necromantic theory, but Kadon's cramped notes in the margins make the dead stir when read aloud.\n\nSuch knowledge could anchor the restoration of Strygos. It could also remind every rival necromancer that old books have new owners."
 strygos_events.5.a:0 "Master the marginalia."
 strygos_events.5.b:0 "Copy the safest pages."
 strygos_events.5.c:0 "Lock it below the palace."

 strygos_events.6.t:0 "Hunger in the Crypt Court"
 strygos_events.6.d:0 "The crypt court has grown hungry. Courtiers who speak of law by candlelight now look too long at servants, prisoners, and each other.\n\nStrygos was meant to be a kingdom, not a feeding pit. That distinction grows thinner when old blood runs out."
 strygos_events.6.a:0 "Ration the blood strictly."
 strygos_events.6.b:0 "Find victims quietly."
 strygos_events.6.c:0 "Let the court feast."

 strygos_events.7.t:0 "Black Gulf Smugglers"
 strygos_events.7.d:0 "Smugglers from the Black Gulf have offered to move relics, bodies, and letters without asking whose names are written on the bones. Their price is high, but discretion has always been expensive.\n\nUsing them could open routes beyond the marshes. Trusting them would be the sort of mistake that makes future necromancers laugh."
 strygos_events.7.a:0 "Use their hidden routes."
 strygos_events.7.b:0 "Pay for silence."
 strygos_events.7.c:0 "Seize their cargo instead."
 strygos_events.7.dd:0 "Refuse the living rats."

 strygos_events.8.t:0 "Stones of the Palace"
 strygos_events.8.d:0 "Workers have found carved stones from the old Palace of Mourkain, buried beneath ash and marsh grass. The symbols are worn, but enough remains to prove that a throne once stood where now only insects rule.\n\nRaising the stones would not rebuild the palace. It would rebuild belief, which is sometimes the foundation that matters first.\n\nThe dead are watching. So are the living."
 strygos_events.8.a:0 "Raise them before the court."
 strygos_events.8.b:0 "Store them for rebuilding."
 strygos_events.8.c:0 "Sell the lesser fragments."

 strygos_events.9.t:0 "The Ghoul King's Shadow"
 strygos_events.9.d:0 "Something wearing the shape of a king has been seen in the deepest ruin. Witnesses swear it spoke with Ushoran's sorrow, though none agree whether the voice offered blessing or accusation.\n\nThe court has become very quiet. Monsters fear judgment too, when the judge is old enough."
 strygos_events.9.a:0 "Seek the sign again."
 strygos_events.9.b:0 "Deny the vision publicly."
 strygos_events.9.c:0 "Silence the witnesses."

 strygos_events.10.t:0 "Necromancers at Knifepoint"
 strygos_events.10.d:0 "Two necromancers have brought their dispute into the open, each claiming the other has miscounted skeletons, stolen grave-dust, and insulted Kadon's memory. Their apprentices have already begun hiding the sharper tools.\n\nThe dead wait for orders. Unfortunately, so do the living.\n\nA clear ruling could strengthen the court. A profitable compromise could delay the next betrayal."
 strygos_events.10.a:0 "Name one master of rites."
 strygos_events.10.b:0 "Split the grave duties."
 strygos_events.10.c:0 "Fine them both for disorder."
