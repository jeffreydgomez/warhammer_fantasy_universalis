 khuresh_events.1000.t:0 "The Blooded Jungles of Khuresh"
 khuresh_events.1000.d:0 "Khuresh is not a kingdom so much as a warning drawn across the map. Foreign charts end in green ink and frightened guesses, for the jungle swallows roads, armies, and certainty with equal ease. To outsiders it is a place of poison and ritual. To those who rule within it, it is a living fortress.\n\nSnakefolk temples rise beneath the canopy, their idols slick with incense and blood. Skaven burrows gnaw below the roots. Orc camps burn in the clearings, Beastfolk herds follow the call of darker powers, and countless lesser cults bargain with gods, monsters, and things that should not be gods at all.\n\nThe powers of Khuresh do not ask politely for worship. They whisper from idol mouths, coil in dreams, and demand sacrifice from those who would pass safely beneath the leaves. Monsters stalk old roads, river spirits drown the unwary, and every ruler learns that fear can be a form of administration.\n\nYet even this wild land is surrounded. Cathay stands to the north with walls and celestial pride. Ind lies to the west in gold and numbers. Elven colonies watch the islands and trade routes, while Nippon waits beyond the eastern seas. Each neighbor sees danger in Khuresh, and perhaps opportunity.\n\nThey call Khuresh savage because it frightens them. Let them. If the jungle can be made to obey one will, then terror itself may become a border, a banner, and a law."
 khuresh_events.1000.a:0 "The jungle will answer to us."

 khuresh_events.1.t:0 "The Naga Queen's Tribute"
 khuresh_events.1.d:0 "A veiled court has arrived from a naga queen whose palace is not marked on any honest map. Her envoys bring lacquered boxes, polite smiles, and a list of gifts they say will preserve friendship.\n\nNo one mistakes the ceremony for weakness. A tribute may buy calm and useful channels, while knives sent into the jungle might teach a sharper lesson. Refusal would please the proud, but pride is poor armor against patient serpents."
 khuresh_events.1.a:0 "Offer tribute beneath the veil."
 khuresh_events.1.b:0 "Send knives into her court."
 khuresh_events.1.c:0 "Deny the demand."

 khuresh_events.2.t:0 "Venom Harvest"
 khuresh_events.2.d:0 "The marshes around [event_target.GetName] are thick with bright serpents, swollen orchids, and insects whose stings can stop a heart. Hunters say the season's venom is stronger than usual, perhaps because something old is leaking through the roots.\n\nAlchemists want it sealed in glass. Captains want it on blades. Temple keepers want it poured before idols that should not be thirsty.\n\nThe harvest will not wait. Every day the jars sit empty, another collector fails to return."
 khuresh_events.2.a:0 "Coat our blades."
 khuresh_events.2.b:0 "Sell the vials abroad."
 khuresh_events.2.c:0 "Feed the temple bowls."
 khuresh_events.2.dd:0 "Bury the worst stock."

 khuresh_events.3.t:0 "Gnawing Under the Roots"
 khuresh_events.3.d:0 "Scouts near [event_target.GetName] report Skaven signs beneath the strangler roots: yellow eyes, gnawed bones, and tunnels braced with stolen planks. The jungle has begun swallowing the entrances, but not quickly enough.\n\nThe under-vermin fear fire and smoke, yet driving them out may damage the ground above. Some courtiers suggest spreading stories of the infestation instead, turning panic into a weapon against rivals. That plan assumes the stories remain ours to control."
 khuresh_events.3.a:0 "Smoke the tunnels."
 khuresh_events.3.b:0 "Turn their fear into leverage."

 khuresh_events.4.t:0 "Bloom of the Blood Orchids"
 khuresh_events.4.d:0 "Blood orchids have opened across the jungle in a red wave. Their petals close around insects, drops of sweat, and sometimes the fingers of careless gatherers.\n\nHealers claim the flowers can make potent medicine if cut at dawn. Priests say the bloom is a mouth and should be fed before it feeds itself. Officials, more practically, want the harvest regulated before smugglers do it for them."
 khuresh_events.4.a:0 "Harvest them for medicine."
 khuresh_events.4.b:0 "Feed the idols first."
 khuresh_events.4.c:0 "Forbid the harvest."

 khuresh_events.5.t:0 "Masks of the Serpent Court"
 khuresh_events.5.d:0 "The serpent court has announced a masked procession where every faction may speak through ritual roles instead of open threats. It is diplomacy as dance, trial, and stalking display.\n\nSponsoring the procession would let the state choose the stage. Blackmailing the priests would be cheaper and more direct, though rarely forgotten. Letting the factions coil around one another may reveal which one strikes first."
 khuresh_events.5.a:0 "Sponsor the masked procession."
 khuresh_events.5.b:0 "Blackmail the mask-priests."
 khuresh_events.5.c:0 "Let them coil."

 khuresh_events.6.t:0 "Beastfolk on the Temple Road"
 khuresh_events.6.d:0 "Beastfolk herds have trampled the temple road near [event_target.GetName], leaving broken prayer flags, hoofprints, and carcasses hung from sacred trees. The local priests demand punishment before pilgrims abandon the route.\n\nThe herds are violent, but they are not mindless. Hunters could clear the road at cost. A subtler hand might drive them toward enemies whose shrines are less useful to us.\n\nUntil a choice is made, the road belongs to horns and flies. The jungle is already learning their paths."
 khuresh_events.6.a:0 "Hunt the herds."
 khuresh_events.6.b:0 "Redirect them elsewhere."
 khuresh_events.6.c:0 "Barricade the shrines."

 khuresh_events.7.t:0 "Rain Season Omens"
 khuresh_events.7.d:0 "The first rain has fallen black through the canopy, then clear by morning. Snake-priests read the change as a command to delay all campaigns until the rivers speak again.\n\nThe generals despise waiting, but the jungle punishes certainty. Obeying the omens may calm the courts, while forced marches could turn hesitation into momentum. Either way, the mud will remember."
 khuresh_events.7.a:0 "Obey the omens."
 khuresh_events.7.b:0 "March through the rain."

 khuresh_events.8.t:0 "Orc Camps in the Clearing"
 khuresh_events.8.d:0 "Orcs have taken a clearing near [event_target.GetName], laughing around stolen fires and daring the jungle to come eat them. They have no respect for old boundaries, which makes them useful in a narrow and unpleasant way.\n\nBurning the camp would satisfy nearby shrines. Hiring its bruisers would offend everyone with taste and perhaps solve several ugly problems. Letting them leave with loot may be cheaper, though the clearing would carry scars.\n\nEven Khuresh cannot always choose its monsters. It can still decide where they bite."
 khuresh_events.8.a:0 "Hire the bruisers."
 khuresh_events.8.b:0 "Burn the camp."
 khuresh_events.8.c:0 "Drive them away."
 khuresh_events.8.dd:0 "Tax the loot they brought."

 khuresh_events.9.t:0 "Lotus Embassy to Cathay"
 khuresh_events.9.d:0 "An embassy veiled in lotus silk offers to reopen a safer road toward Cathay. Its leader speaks of mutual respect while counting guards, doors, and exits.\n\nGifts would make the path smoother and give Cathayan officials something formal to admire. Threats can also travel under silk, provided they are phrased delicately enough. Closing the road would keep secrets close and trade distant."
 khuresh_events.9.a:0 "Send gifts under lotus silk."
 khuresh_events.9.b:0 "Veil our threats carefully."
 khuresh_events.9.c:0 "Close the road."

 khuresh_events.10.t:0 "The Hidden Temple Stirs"
 khuresh_events.10.d:0 "A hidden temple has been found under a curtain of vines, its idol wet with dew that smells like blood. The first scouts returned feverish and spoke in voices that were not entirely their own.\n\nThe idol's keepers demand sacrifice before the moon darkens. Refusal may break the spell or simply provoke it. Paying the blood price would quiet the jungle, but the court will know what obedience cost.\n\nThere is also the old option of lying. In Khuresh, that is rarely the same as safety."
 khuresh_events.10.a:0 "Refuse the idol."
 khuresh_events.10.b:0 "Pay the blood price."
 khuresh_events.10.c:0 "Cover every track."
