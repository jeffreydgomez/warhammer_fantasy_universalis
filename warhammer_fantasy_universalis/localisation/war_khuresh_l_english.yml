l_english:


 khuresh_events.1000.t:0 "The Guides Who Returned Alone"
 khuresh_events.1000.d:0 "Two guides return to [Root.Capital.GetName] carrying the shields of soldiers lost on a jungle road. They describe a broken bridge, movement beneath the water, and arrows fired from a temple they believed abandoned.\n\nNaga queens and temple keepers control passages that foreign maps leave blank. Traders moving toward Cathay, Ind, and the eastern coasts pay for guides, but even paid escorts avoid some of the jungle's oldest shrines.\n\nThe court summons hunters who know the surrounding paths. Their accounts reveal rival shrines, Snakefolk courts, and armed camps concealed within a few days' march. [Root.Monarch.GetName] orders a muster before those rivals discover how much of the road now lies unguarded."
 khuresh_events.1000.a:0 "Summon the hunters and prepare the warriors."

 khuresh_events.1.t:0 "The Naga Queen's List of Gifts"
 khuresh_events.1.d:0 "A naga queen sends an envoy bearing a lacquered box of antidotes and a list of gifts she expects in return. The list includes ivory, prisoners, and several attendants trained in our court ceremonies.\n\nThe envoy explains that the queen has ordered her hunters to respect our travelers while the exchange is negotiated. A court servant recognizes one antidote as the cure for a poison recently found in the palace kitchens."
 khuresh_events.1.a:0 "Pay for the exchange and secure a lasting accommodation."
 khuresh_events.1.b:0 "Use the exchange to place informants in her household."
 khuresh_events.1.c:0 "Refuse the demands and brief our captains and envoys."

 khuresh_events.2.t:0 "The Venom Gatherer's Discovery"
 khuresh_events.2.d:0 "A venom gatherer in [event_target.GetName] brings the temple a jar taken from unusually large marsh serpents. A single drop kills the animal used to test it before the handler can release its tether. The gatherer refuses to open a second jar inside the temple.\n\nThe priests trace the serpents to pools surrounded by swollen orchids and dying insects. Traders and weapons makers arrive with containers, but gathering enough for either trade or ritual will strip the marsh and endanger its workers."
 khuresh_events.2.a:0 "Pay to prepare venom for our missile troops."
 khuresh_events.2.b:0 "Monopolize the harvest, despite the damage to the marsh."
 khuresh_events.2.c:0 "Reserve the marsh harvest for the priests' conversion rites."
 khuresh_events.2.dd:0 "Record the gathering sites and prohibit outside access."

 khuresh_events.3.t:0 "The Tunnel Beneath the Shrine"
 khuresh_events.3.d:0 "A temple servant in [event_target.GetName] drops a water jar and hears it break far below the floor. Guards lift the paving and find Skaven supports beneath the shrine's oldest roots.\n\nA scout crawls into the opening and returns with a stolen temple bell from a larger tunnel. The priests evacuate the attendants while the local commander gathers workers and soldiers around the breach."
 khuresh_events.3.a:0 "Collapse the tunnels and establish a permanent military settlement."
 khuresh_events.3.b:0 "Send infiltrators underground, accepting the losses and secrecy."

 khuresh_events.4.t:0 "The Blood Orchid Gatherers"
 khuresh_events.4.d:0 "A plant collector returns with a basket of blood orchids and a badly swollen hand. She claims their sap preserves flesh, then demonstrates it on a carcass that should already have begun to rot.\n\nThe temple's healers ask for more samples, while merchants offer silver for the same flowers. Several gatherers have already disappeared in the beds, leaving their baskets caught between the closing petals."
 khuresh_events.4.a:0 "Harvest and study the orchids, despite the casualties."
 khuresh_events.4.b:0 "Fund sacred cultivation under the priests' control."
 khuresh_events.4.c:0 "Keep the findings secret and compile the collector's methods."

 khuresh_events.5.t:0 "The Mask Taken at the Procession"
 khuresh_events.5.d:0 "During the serpent court's procession, a masked attendant presents a petition accusing a noble household of stealing temple tribute. The accused noble demands that the attendant remove the mask and identify the witnesses.\n\nThe keeper of ceremonies refuses, citing the procession's promise of protected speech. Courtiers stop the musicians and crowd around the disputed petition, waiting for [Root.Monarch.GetName] to decide whether that protection holds."
 khuresh_events.5.a:0 "Pay for a formal hearing under the promised protection."
 khuresh_events.5.b:0 "Turn the masked attendants into a covert intelligence network."
 khuresh_events.5.c:0 "Let the keeper apply the existing ceremonial rules."

 khuresh_events.6.t:0 "The Pilgrim Who Escaped the Herd"
 khuresh_events.6.d:0 "A wounded pilgrim reaches the shrine at [event_target.GetName] with a prayer flag tied around his arm. Beastfolk attacked his party on the temple road and carried the survivors into a fortified clearing.\n\nThe shrine's guards find the missing litters hung from trees beside the track. The priests suspend the pilgrimage and demand help before the herd raids the settlements that supply their temple."
 khuresh_events.6.a:0 "Storm the clearing, despite the casualties and destruction."
 khuresh_events.6.b:0 "Send agents to map the herd's defenses in secret."
 khuresh_events.6.c:0 "Pay for a guarded detour around the occupied road."

 khuresh_events.7.t:0 "Black Water in the Rain Bowls"
 khuresh_events.7.d:0 "The keepers of a jungle shrine find their rain bowls filled with black water after the season's first storm. A priest orders the marching columns halted until the omen has been interpreted.\n\nScouts then report that the river crossings are flooding and the old paths are disappearing. The quartermaster needs instructions while supplies can still be carried into the camps."
 khuresh_events.7.a:0 "Fund the waiting camps and hold the prescribed rites."
 khuresh_events.7.b:0 "Press on and teach the survivors to cross the flooded jungle."

 khuresh_events.8.t:0 "The Orc Boss at the Clearing"
 khuresh_events.8.d:0 "An Orc boss camps near [event_target.GetName] and demands meat from the nearest settlement. When the headman refuses, the Orcs tear down his storehouse and use its beams for their fires.\n\nThe boss sends back a shield painted with his proposed price for military service. Local families crowd into the temple enclosure, bringing everything the raiders have not taken."
 khuresh_events.8.a:0 "Pay the boss and organize his fighters as mercenaries."
 khuresh_events.8.b:0 "Fund a costly campaign to clear the raiders out."
 khuresh_events.8.c:0 "Leave the boss alone and accept our neighbors' anger."
 khuresh_events.8.dd:0 "Sell him supplies and permit further plundering."

 khuresh_events.9.t:0 "The Embassy's Missing Interpreter"
 khuresh_events.9.d:0 "An embassy seeking a safer road toward Cathay arrives without the interpreter named in its letters. Its leader claims illness delayed him, but a guard finds his torn sleeve among the baggage.\n\nThe envoys say bandits took him and ask us to keep the matter private until negotiations end. Our chamberlain places the sleeve beside their proposed agreement and asks how the court should proceed."
 khuresh_events.9.a:0 "Fund a formal inquiry and negotiate the road agreement."
 khuresh_events.9.b:0 "Use the incident to recruit agents along the route."
 khuresh_events.9.c:0 "End the talks and record their routes for our commanders."

 khuresh_events.10.t:0 "The Scouts from the Buried Temple"
 khuresh_events.10.d:0 "Scouts cut through a wall of vines and uncover a temple whose doors were sealed from within. Those who enter return feverish, repeating a prayer none of their companions recognize.\n\nOne scout draws a plan of the inner chamber while insisting he never passed its doorway. Another recognizes the drawing and begs the healer to burn it before the other patients see.\n\nA healer finds the same carved sign beneath each scout's fingernails. The captain confines them outside [Root.Capital.GetName], but relatives have gathered at the enclosure demanding that the court explain what happened."
 khuresh_events.10.a:0 "Question them and study the prayer, despite the alarm."
 khuresh_events.10.b:0 "Pay an armed party to cleanse the temple, accepting losses."
 khuresh_events.10.c:0 "Keep the temple sealed and suppress reports of the discovery."
