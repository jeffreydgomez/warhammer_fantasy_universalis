l_english:
 asur_colonies_first_fortress_ports_title:0 "First Fortress-Ports"
 asur_colonies_first_fortress_ports_desc:0 "The colonies are too scattered to survive as separate jewels, so we must secure the first fortress-ports of a wider sea order."
 asur_colonies_outer_entrepots_title:0 "Outer Entrepots"
 asur_colonies_outer_entrepots_desc:0 "Our ports are useful alone but decisive together, so we must turn scattered harbors into outer entrepots that answer one ledger."
 asur_colonies_chartered_sea_lanes_title:0 "Chartered Sea-Lanes"
 asur_colonies_chartered_sea_lanes_desc:0 "The sea-lanes are rich but lawless, so we must charter the roads between our harbors before rivals make them hunting grounds."
 asur_colonies_lantern_harbors_title:0 "Lantern Harbors"
 asur_colonies_lantern_harbors_desc:0 "Every colony sees only its own horizon, so we must raise lantern harbors that carry orders, omens, and warning fires between them."
 asur_colonies_outer_ocean_ports_title:0 "Outer Ocean Ports"
 asur_colonies_outer_ocean_ports_desc:0 "The outer oceans are no longer an edge of the map, so we must make ports far enough apart that ships can cross the world beneath Asur lamps."
 asur_colonies_first_word_to_ulthuan_title:0 "First Word to Ulthuan"
 asur_colonies_first_word_to_ulthuan_desc:0 "Ulthuan is divided and distant, but Lothern still names the heart of Asur sea power. We must win, befriend, or take the court that holds it."
 asur_colonies_bind_ulthuan_title:0 "Bind Ulthuan"
 asur_colonies_bind_ulthuan_desc:0 "Friendship with Ulthuan must become command, or command must become law, so we must bind the island by treaty, crown, or occupation."
 asur_colonies_rule_ulthuans_shores_title:0 "Rule Ulthuan's Shores"
 asur_colonies_rule_ulthuans_shores_desc:0 "Distant reverence can still become dependence, so we must make Ulthuan's shores answer our colonial council."
 asur_colonies_all_colonial_capitals_title:0 "All Colonial Capitals"
 asur_colonies_all_colonial_capitals_desc:0 "The old capitals were never meant to kneel to separate necessities forever, so we must bind every colonial seat into the same sea-realm."
 asur_colonies_cloth_silk_ledgers_title:0 "Cloth and Silk Ledgers"
 asur_colonies_cloth_silk_ledgers_desc:0 "Cloth and silk carry sails, banners, formal robes, and letters of rank, so we must make the loom answer the fleet."
 asur_colonies_cloth_silk_monopoly_title:0 "Cloth and Silk Monopoly"
 asur_colonies_cloth_silk_monopoly_desc:0 "The loom must become a monopoly, not a convenience, so we must hold the finest fabric markets against lesser courts and cheaper imitators."
 asur_colonies_monsoon_factors_title:0 "Monsoon Factors"
 asur_colonies_monsoon_factors_desc:0 "The monsoon roads enrich whoever understands their seasons, so we must satisfy the temple-scribes and waystone keepers who read the winds before ships, gifts, and ledgers move."
 asur_colonies_council_far_ports_title:0 "Council of Far Ports"
 asur_colonies_council_far_ports_desc:0 "Each harbor has learned different laws, so we must convene a council that makes distance governable."
 asur_colonies_prove_local_mandate_title:0 "Prove Local Mandate"
 asur_colonies_prove_local_mandate_desc:0 "Neighboring rulers test every distant colony, so we must prove that the far ports possess a mandate no local prince can ignore, or show that no neighbor can contest us at all."
 asur_colonies_recognized_sea_power_title:0 "Recognized Sea Power"
 asur_colonies_recognized_sea_power_desc:0 "Local proof is no longer enough, so we must stand among the great powers and project strength beyond our own sea-lanes."
 asur_colonies_treaty_chest_colonies_title:0 "Treaty Chest of the Colonies"
 asur_colonies_treaty_chest_colonies_desc:0 "The treaties of the colonies are scattered in chests, towers, and flagship cabins, so we must build enough mercantile authority to gather them into one diplomatic instrument."
 asur_colonies_ports_five_continents_title:0 "Ports on Five Continents"
 asur_colonies_ports_five_continents_desc:0 "Our ships visit many continents but do not yet rule their routines, so we must maintain ports on five landmasses."
 asur_colonies_ports_seven_continents_title:0 "Ports on Seven Continents"
 asur_colonies_ports_seven_continents_desc:0 "Five continents make us present and seven make us unavoidable, so we must carry the colonial sea road into every major oceanic theater."
 asur_colonies_legendary_sea_gates_title:0 "Legendary Sea Gates"
 asur_colonies_legendary_sea_gates_desc:0 "Our sea gates are famous but still mortal, so we must build a chain of fortified and well-serviced ports where ships can repair, trade, and receive orders."
 asur_colonies_spice_ledgers_title:0 "Spice Ledgers"
 asur_colonies_spice_ledgers_desc:0 "Spice keeps crews alive and courts attentive, so we must enter the spice ledgers before Ind, Khuresh, and island merchants close them."
 asur_colonies_spice_monopoly_title:0 "Spice Monopoly"
 asur_colonies_spice_monopoly_desc:0 "Spice tribute cannot remain a narrow privilege, so we must dominate the markets that perfume courts and provision long voyages."
 asur_colonies_finest_convoys_title:0 "Finest Convoys"
 asur_colonies_finest_convoys_desc:0 "Cloth, gems, spice, timber, and stores all feed the same hulls, so we must combine the ledgers into the finest convoy system afloat."
 asur_colonies_masters_outer_seas_title:0 "Masters of the Outer Seas"
 asur_colonies_masters_outer_seas_desc:0 "The world ocean has become a single contested ledger, so we must make the outer seas answer to the United Colonies before any rival can close them."
 asur_colonies_sea_prince_admirals_title:0 "Sea-Prince Admirals"
 asur_colonies_sea_prince_admirals_desc:0 "Sea-princes cannot rule by memory alone, so we must satisfy the noble houses that provide admirals, charts, patrols, and discipline."
 asur_colonies_terms_beyond_neighbors_title:0 "Terms Beyond Neighbors"
 asur_colonies_terms_beyond_neighbors_desc:0 "The sea road reaches farther than our borders, so we must make enough courts trust or fear us that our terms travel beyond our neighbors."
 asur_colonies_letters_of_passage_title:0 "Letters of Passage"
 asur_colonies_letters_of_passage_desc:0 "Passages through foreign waters can be closed by insult, fear, or greed, so we must make our letters of passage too valuable to refuse."
 asur_colonies_muster_sea_guard_title:0 "Muster Sea Guard"
 asur_colonies_muster_sea_guard_desc:0 "The Sea Guard must land before a beacon fails and sail before a treaty breaks, so we must muster army and navy as one arm."
 asur_colonies_coastal_batteries_title:0 "Coastal Batteries"
 asur_colonies_coastal_batteries_desc:0 "A port without guns invites every ambitious captain, so we must ring the colonial coast with batteries."
 asur_colonies_naval_hegemons_armada_title:0 "Naval Armada"
 asur_colonies_naval_hegemons_armada_desc:0 "No hegemony is granted to a realm of frightened harbors, so we must field an armada that can force every rival to count our sails first."
 asur_colonies_great_courts_sea_road_title:0 "Great Courts of the Sea Road"
 asur_colonies_great_courts_sea_road_desc:0 "The far courts know our harbors but not yet our authority, so we must make the sea road a diplomatic fact from Cathay to Lustria."
 asur_colonies_naval_stores_title:0 "Naval Stores"
 asur_colonies_naval_stores_desc:0 "The fleet cannot sail forever on pride, so we must secure naval stores enough to keep masts, ropes, pitch, and spare fittings moving."
 asur_colonies_naval_stores_monopoly_title:0 "Naval Stores Monopoly"
 asur_colonies_naval_stores_monopoly_desc:0 "Stores bought at need arrive late and dear, so we must dominate the naval supply trade before the next great armada calls for repair."
 asur_colonies_trade_escort_fleet_title:0 "Trade Escort Fleet"
 asur_colonies_trade_escort_fleet_desc:0 "Trade ships without escorts become evidence of weakness, so we must give every rich route a fleet that makes piracy unprofitable."
 asur_colonies_dockyards_sea_guard_title:0 "Dockyards of the Sea Guard"
 asur_colonies_dockyards_sea_guard_desc:0 "Escorts need harbors that can build, arm, and repair them, so we must make the dockyards of the Sea Guard worthy of their patrols."
 asur_colonies_beacon_flagship_title:0 "Beacon Flagship"
 asur_colonies_beacon_flagship_desc:0 "A scattered realm needs a visible center at sea, so we must launch a beacon flagship that carries both command and royal theater."
 asur_colonies_fleet_sea_realm_title:0 "Fleet of a Sea Realm"
 asur_colonies_fleet_sea_realm_desc:0 "A sea realm survives only by moving faster than danger, so we must field a fleet large enough to answer several oceans."
 asur_colonies_world_class_battlefleet_title:0 "World-Class Battlefleet"
 asur_colonies_world_class_battlefleet_desc:0 "Local superiority is no longer enough, so we must build a battlefleet that every admiral in the world is forced to study."
 asur_colonies_first_word_to_naggaroth_title:0 "First Word to Naggaroth"
 asur_colonies_first_word_to_naggaroth_desc:0 "Naggarond still casts a cold shadow over the northern seas, so we must win, befriend, or take the power that holds it."
 asur_colonies_bind_naggaroth_title:0 "Bind Naggaroth"
 asur_colonies_bind_naggaroth_desc:0 "Naggaroth can be a guarded ally or a conquered shore, but it cannot remain a threat behind our sea road."
 asur_colonies_rule_naggaroths_shores_title:0 "Rule Naggaroth"
 asur_colonies_rule_naggaroths_shores_desc:0 "Naggaroth obeys only strength it cannot escape, so we must rule its shores through crown, subject, and settled garrison."
 asur_colonies_timber_convoys_title:0 "Timber Convoys"
 asur_colonies_timber_convoys_desc:0 "Timber convoys decide whether a fleet repairs in weeks or dreams of home for a year, so we must secure wood fit for ocean hulls."
 asur_colonies_timber_monopoly_title:0 "Timber Monopoly"
 asur_colonies_timber_monopoly_desc:0 "The timber road must be ours from forest to drydock, so we must dominate the wood trade that carries the fleet's future."
 asur_colonies_harbor_councils_title:0 "Harbor Councils"
 asur_colonies_harbor_councils_desc:0 "A port without a council is only a wharf with guards, so we must make the merchants, captains, and scribes of our harbors serve a common law."
 asur_colonies_control_local_markets_title:0 "Control Local Markets"
 asur_colonies_control_local_markets_desc:0 "Local markets feed distant ambitions, so we must control the counters, market halls, and trade depots around our first sphere."
 asur_colonies_crown_port_upgraded_title:0 "Crown Port Upgraded"
 asur_colonies_crown_port_upgraded_desc:0 "The capital port must prove that distance sharpens rather than weakens Asur rule, so we must raise it into a crown port worthy of all colonies."
 asur_colonies_proclaim_united_colonies_title:0 "Unite the Colonies"
 asur_colonies_proclaim_united_colonies_desc:0 "Authority is scattered, so we must either proclaim the United Colonies or stand fully ready to form the realm that can speak for every far harbor."
 asur_colonies_ten_sea_road_ledgers_title:0 "Ten Sea-Road Ledgers"
 asur_colonies_ten_sea_road_ledgers_desc:0 "A united realm must prove itself in ledgers as well as banners, so we must hold meaningful shares in ten sea-road trade nodes."
 asur_colonies_beacon_waystone_network_title:0 "Waystone Network"
 asur_colonies_beacon_waystone_network_desc:0 "Our beacons and waystones are isolated miracles unless joined by routine, so we must bind the colonial capitals into a navigable network."
 asur_colonies_all_beacons_answer_title:0 "All Beacons Answer"
 asur_colonies_all_beacons_answer_desc:0 "The beacons now answer across oceans, so we must make several great trade centers into places where ships, signals, and orders meet."
 asur_colonies_gem_tribute_ledgers_title:0 "Gem Tribute Ledgers"
 asur_colonies_gem_tribute_ledgers_desc:0 "Gems pay for pearl lamps, waystone repairs, and the politics of distant courts, so we must make tribute glitter before it becomes vulnerable."
 asur_colonies_gem_monopoly_title:0 "Gem Monopoly"
 asur_colonies_gem_monopoly_desc:0 "Gem tribute must become dependable state income, not a caravan accident, so we must dominate the gem trade outright."

 asur_colonies_all_colonial_capitals_tt:0 "Own or have a subject own Arnheim, Citadel of Dusk, Fortress of Dawn, Tower of the Sun, Tower of the Stars, Elithis, Calith, and Nocthyrion."
 asur_colonies_ulthuan_pu_cb_tt:0 "Gain a §YRestoration of Union§! casus belli against the owner of Lothern for §Y50 years§!."
 asur_colonies_naggaroth_pu_cb_tt:0 "Gain a §YRestoration of Union§! casus belli against the owner of Naggarond for §Y50 years§!."

 asur_colonies_events.1.t:0 "The Treaty Chest Opened"
 asur_colonies_events.1.d:0 "The captains bring cedar chests from Arnheim, waxed cylinders from the Tower of the Sun, and salt-stained ledgers from Calith. Each contains a promise made in crisis: safe passage, mutual harbor, hostage exchange, pearl-lamp repairs, or the exact insult that ended an old war.\n\nNow that the colonies speak with one seal, these promises can become more than local memory. The council must decide whether the treaty chest should buy patience in foreign courts or speed along the convoy roads."
 asur_colonies_events.1.a:0 "Seal the embassies."
 asur_colonies_events.1.b:0 "Fund the convoys."
 asur_colonies_events.2.t:0 "The Great Courts Answer"
 asur_colonies_events.2.d:0 "Messengers return from Cathay, Ind, Khuresh, Nippon, and the hot coasts beyond the Dragon Isles with careful bows and carefully measured words. They have not all become friends, but they now know that the colonial sea road can bring gifts, soldiers, and blockades with the same tide.\n\nThe far courts ask what kind of power the United Colonies intend to be. Some councillors argue that patience will make the sea road welcome; others insist that law is believed only when backed by terms no port dares break."
 asur_colonies_events.2.a:0 "Send pearl lamps and patient envoys."
 asur_colonies_events.2.b:0 "Write the terms in sea-law."
 asur_colonies_events.3.t:0 "Masters of the Outer Seas"
 asur_colonies_events.3.d:0 "From Lothern to Naggarond, from the spice harbors to the storm-lit towers of the colonies, captains now plot the world as one continuous road. Rival powers still launch fleets and sign charters, but their ledgers must account for Asur patrols before ink can dry.\n\nThe United Colonies have become more than survivals on foreign shores. They are a sea realm, and the council's final choice will teach the world whether its mastery is counted first in trade or in battle."
 asur_colonies_events.3.a:0 "Let every ledger name us first."
 asur_colonies_events.3.b:0 "Let every admiral count our sails."

