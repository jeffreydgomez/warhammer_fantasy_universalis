 Y95_ideas_1:0 "The Pestilent Covenant"
 Y95_ideas_1_desc:0 "An invader approaching Mangrove Delta finds concealed obstacles, ruined supplies, and watchers on every path. The land itself becomes part of our defense."
 Y95_ideas_2:0 "Brethren of the Censer"
 Y95_ideas_2_desc:0 "Every household and following attached to Mangrove Delta owes service when the summons comes. Few may remain idle while our survival is at stake."
 Y95_ideas_3:0 "The Fever Nurseries"
 Y95_ideas_3_desc:0 "Every household and following attached to Mangrove Delta owes service when the summons comes. Few may remain idle while our survival is at stake."
 Y95_ideas_4:0 "Rot-Sealed Granaries"
 Y95_ideas_4_desc:0 "The paths around Mangrove Delta teach our followers to travel light and live from difficult ground. Supplies are cached before the main host moves."
 Y95_ideas_5:0 "The Procession of Flies"
 Y95_ideas_5_desc:0 "The rites kept at Mangrove Delta give scattered communities a common allegiance. Differences of custom must never become excuses to abandon the shared cause."
 Y95_ideas_6:0 "Contagion as Tribute"
 Y95_ideas_6_desc:0 "The obligations owed to Mangrove Delta are recorded and collected with persistence. Local wealth must sustain the authority that protects it."
 Y95_ideas_7:0 "Feesik's Holy Work"
 Y95_ideas_7_desc:0 "The memory of Mangrove Delta gives our warriors a reason to stand when courage fails elsewhere. They fight for a home and a cause that defeat would erase."
