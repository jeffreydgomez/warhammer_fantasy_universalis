 Y94_ideas_5:0 "Contracts in the Dark"
 Y94_ideas_5_desc:0 "The paymasters of Eaglecrest negotiate terms before a crisis forces their hand. Regular business earns better rates than desperate promises."
 Y94_ideas_6:0 "The Unseen Claw"
 Y94_ideas_6_desc:0 "The foot soldiers mustered at Eaglecrest practice the close fighting that their homeland demands. Their weapons are familiar, their partners trusted, and their work merciless."
 Y94_ideas_7:0 "Kreepus Leaves No Witness"
 Y94_ideas_7_desc:0 "The assault bands trained at Eaglecrest strike together at the moment of contact. A violent opening breaks the enemy before a prolonged struggle can begin."
