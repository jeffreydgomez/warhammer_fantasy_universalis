 Y03_ideas_bonus:0 "Brass Keep Ambition"
 Y03_ideas_1:0 "Unbroken Brass Gates"
 Y03_ideas_1_desc:0 "The approaches to Dripping Peak are prepared long before an enemy arrives. Narrow entrances and layered defenses force attackers to pay for every advance."
 Y03_ideas_2:0 "Rotten Ramparts"
 Y03_ideas_2_desc:0 "The garrisons around Dripping Peak repair their own works and keep stores under close accounting. A stronghold should exhaust its besieger before it exhausts its treasury."
 Y03_ideas_3:0 "Middle Mountains Watch"
 Y03_ideas_3_desc:0 "More defenders can be sheltered within the prepared works of Dripping Peak. Fresh watches replace tired sentries before an attacker finds a neglected gate."
 Y03_ideas_4:0 "Pestilent Wells"
 Y03_ideas_4_desc:0 "An invader approaching Dripping Peak finds concealed obstacles, ruined supplies, and watchers on every path. The land itself becomes part of our defense."
 Y03_ideas_5:0 "The Garrison's Due"
 Y03_ideas_5_desc:0 "The obligations owed to Dripping Peak are recorded and collected with persistence. Local wealth must sustain the authority that protects it."
 Y03_ideas_6:0 "Plague-Forged Mail"
 Y03_ideas_6_desc:0 "The warriors of Dripping Peak learn to meet a charge with braced ranks and sound protection. Surviving the first impact gives them the chance to answer it."
 Y03_ideas_7:0 "Siege Without End"
 Y03_ideas_7_desc:0 "The siege workers attached to Dripping Peak study weak foundations and neglected approaches. Their tools and preparations shorten the time spent before hostile walls."
