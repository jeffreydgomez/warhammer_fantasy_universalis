 Y97_ideas_1:0 "Rikket's Workshops"
 Y97_ideas_1_desc:0 "Every useful lesson is collected in Ratscar, where experienced tutors train the next generation before hard-won knowledge can be lost."
 Y97_ideas_2:0 "The Salvaged Gear"
 Y97_ideas_2_desc:0 "The workshops of Ratscar divide their labor and guard their tools. Even modest resources yield more when experienced hands direct the work."
 Y97_ideas_3:0 "Warp-Power Bargains"
 Y97_ideas_3_desc:0 "Workshops and learned circles in Ratscar compare their discoveries. Useful improvements spread beyond the hands that first devised them."
 Y97_ideas_4:0 "The Apprentice Warrens"
 Y97_ideas_4_desc:0 "Every useful lesson is collected in Ratscar, where experienced tutors train the next generation before hard-won knowledge can be lost."
 Y97_ideas_5:0 "Engines at a Price"
 Y97_ideas_5_desc:0 "Brokers working from Ratscar know which goods our neighbors need and what they can be made to pay. Nothing leaves the market without returning a profit."
 Y97_ideas_6:0 "The Hidden Test Pits"
 Y97_ideas_6_desc:0 "Strangers seeking the secrets of Ratscar encounter false trails and carefully separated circles of trust. A single captured messenger cannot betray the whole organization."
 Y97_ideas_7:0 "The Great Contraption"
 Y97_ideas_7_desc:0 "Materials for the works at Ratscar are gathered before construction begins. Skilled overseers recover usable stone and timber instead of paying twice for the same task."
