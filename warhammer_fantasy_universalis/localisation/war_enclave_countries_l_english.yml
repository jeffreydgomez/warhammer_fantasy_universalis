 Y02_ideas_1:0 "Mancatcher Riders"
 Y02_ideas_1_desc:0 "The mounted companies of Deinste practice their charges as a single body. Veteran riders teach newcomers how to turn speed into a decisive blow."
 Y02_ideas_2:0 "Venom-Barb Arrows"
 Y02_ideas_2_desc:0 "The foot soldiers mustered at Deinste practice the close fighting that their homeland demands. Their weapons are familiar, their partners trusted, and their work merciless."
 Y02_ideas_3:0 "Black Pit Barter"
 Y02_ideas_3_desc:0 "Brokers working from Deinste know which goods our neighbors need and what they can be made to pay. Nothing leaves the market without returning a profit."
 Y02_ideas_4:0 "Webbed Trails"
 Y02_ideas_4_desc:0 "The paths around Deinste teach our followers to travel light and live from difficult ground. Supplies are cached before the main host moves."
 Y02_ideas_5:0 "Arachnarok Broods"
 Y02_ideas_5_desc:0 "Every household and following attached to Deinste owes service when the summons comes. Few may remain idle while our survival is at stake."
 Y02_ideas_6:0 "Shamans of the Pit"
 Y02_ideas_6_desc:0 "The rites kept at Deinste give scattered communities a common allegiance. Differences of custom must never become excuses to abandon the shared cause."
 Y02_ideas_7:0 "The Hanging Larders"
 Y02_ideas_7_desc:0 "The raiders of Deinste know which storehouses and baggage trains are worth taking. Nothing useful is left for an enemy to reclaim."
