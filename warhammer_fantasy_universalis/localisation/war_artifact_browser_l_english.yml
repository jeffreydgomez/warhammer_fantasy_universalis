 war_artifact_browser_cloak_of_twilight_caption:0 "Cloak of Twilight"
 war_artifact_browser_cloak_of_twilight_tt:0 "§YCloak of Twilight§!\n\nSpy Network Construction: §G+10%§!\n\nThe Cloak of Twilight is a magical garment woven from enchanted shadows and the feathers of sacred beasts. It grants the wearer unmatched agility and stealth, allowing them to move unseen and strike with deadly precision.\n\n[Root.GetWarArtifactLocation13]"
