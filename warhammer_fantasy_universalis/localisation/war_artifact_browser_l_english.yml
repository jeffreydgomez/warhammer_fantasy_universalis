 war_artifact_browser_gromril_crown_caption:0 "Gromril Crown"
 war_artifact_browser_gromril_crown_tt:0 "§YThe Gromril Crown§!\n\nDiplomatic Reputation: §G+1§!; Yearly Prestige Decay: §G-1%§!; Yearly Legitimacy: §G+1§!; Yearly Devotion: §G+1§!; Yearly Horde Unity: §G+1§!; Yearly Meritocracy: §G+1§!; Yearly Republican Tradition: §G+0.3§!; Monthly Splendor: §G+1§!; Liberty Desire from Subject Development: §G-20%§!\n\nForged from a single piece of pure Gromril, and inscribed with nine hundred ninety nine Runes of glory, the Gromril Crown is the most valuable object in existence. It was forged by the new Dwarven Empire, and wearing it bestows all the glory and prestige of the greatest kings in history.\n\n[Root.GetWarArtifactLocation12]"
 war_artifact_browser_gromril_crown_located:0 "§Y[war_artifact_location_gromril_crown.GetName]§!, §Y[war_artifact_location_gromril_crown.Owner.GetName]§!, §Y[war_artifact_location_gromril_crown.GetSuperRegionName]§!"
