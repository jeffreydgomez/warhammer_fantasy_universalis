 war_artifact_browser_plaque_of_tepok_caption:0 "Plaque of Tepok"
 war_artifact_browser_plaque_of_tepok_tt:0 "§YPlaque of Tepok§!\n\nIdea Cost: §G-5%§!\n\nThe Plaque of Tepok is an ancient artifact inscribed with the wisdom of the Old Ones, dedicated to Tepok, the god of magic and wisdom. These sacred plaques allow the Slann Mage-Priests to better understand the Winds of Magic, protecting their people from chaos and calamity.\n\n[Root.GetWarArtifactLocation14]"
