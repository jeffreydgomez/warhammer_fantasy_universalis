 war_artifact_browser_dragon_armor_of_aenarion_caption:0 "Dragon Armor"
 war_artifact_browser_dragon_armor_of_aenarion_tt:0 "§YDragon Armor of Aenarion§!\n\nMonthly War Exhaustion: §G-0.025§!\n\nForged in the time of the first Phoenix King, Aenarion, the Dragon Armor of Aenarion is an indestructible suit of armor, imbued with magic to resist flame and even the fiercest magical attacks. It is a symbol of the High Elves' undying resolve and their eternal vigilance against the forces of Chaos.\n\n[Root.GetWarArtifactLocation9]"
 war_artifact_browser_dragon_armor_of_aenarion_located:0 "§Y[war_artifact_location_dragon_armor_of_aenarion.GetName]§!, §Y[war_artifact_location_dragon_armor_of_aenarion.Owner.GetName]§!, §Y[war_artifact_location_dragon_armor_of_aenarion.GetSuperRegionName]§!"
