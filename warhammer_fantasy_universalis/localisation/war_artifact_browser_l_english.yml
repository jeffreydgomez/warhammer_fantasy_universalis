 war_artifact_browser_group_necromancy:0 "Artifacts of Necromancy"
 war_artifact_browser_carstein_ring_caption:0 "Carstein Ring"
 war_artifact_browser_carstein_ring_tt:0 "§YThe Carstein Ring§!\n\nManpower Recovery Speed: §G+10%§!\n\nThis ancient ring grants its wearer the dark gift of eternal life, a powerful asset to the Vampire Counts. Passed down through the von Carstein line, the ring has long been the key to their enduring reign of terror.\n\n[Root.GetWarArtifactLocation20]"
 war_artifact_browser_carstein_ring_located:0 "§Y[war_artifact_location_carstein_ring.GetName]§!, §Y[war_artifact_location_carstein_ring.Owner.GetName]§!, §Y[war_artifact_location_carstein_ring.GetSuperRegionName]§!"
