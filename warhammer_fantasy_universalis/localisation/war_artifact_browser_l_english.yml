 war_artifact_browser_jade_blooded_vial_caption:0 "Jade Blooded Vial"
 war_artifact_browser_jade_blooded_vial_tt:0 "§YJade Blooded Vial§!\n\nImprove Relations: §G+5%§!\n\nThe Jade Blooded Vial is said to contain a drop of the first Cathayan vampire's blood. Each new Jadeblooded Vampire must sip from the vial, and by midnight it is always refilled.\n\n[Root.GetWarArtifactLocation23]"
