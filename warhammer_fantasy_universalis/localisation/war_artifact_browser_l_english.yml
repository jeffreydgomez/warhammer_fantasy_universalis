 war_artifact_browser_group_elves:0 "Treasures of the Elves"
 war_artifact_browser_phoenix_crown_caption:0 "Phoenix Crown"
 war_artifact_browser_phoenix_crown_tt:0 "§YThe Phoenix Crown§!\n\nDiplomatic Reputation: §G+0.5§!\n\nThe High Elven Phoenix Crown was taken by the Dwarves of Karaz a Karak long ago. Since then it has traded hands many times, but it remains a symbol of might and prestige.\n\n[Root.GetWarArtifactLocation7]"
 war_artifact_browser_phoenix_crown_located:0 "§Y[war_artifact_location_phoenix_crown.GetName]§!, §Y[war_artifact_location_phoenix_crown.Owner.GetName]§!, §Y[war_artifact_location_phoenix_crown.GetSuperRegionName]§!"
