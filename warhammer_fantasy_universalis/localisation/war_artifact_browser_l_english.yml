 war_artifact_browser_group_wild:0 "Weapons of the Wild"
 war_artifact_browser_bow_of_loren_caption:0 "Bow of Loren"
 war_artifact_browser_bow_of_loren_tt:0 "§YThe Bow of Loren§!\n\nLand Leader Fire: §G+1§!; Maximum General Fire: §G+1§!\n\nThis magical bow, a gift from the forest of Athel Loren, grants its wielder deadly precision and a supernatural connection to the wild. It is said that arrows from the Bow of Loren strike with the wrath of the forest itself.\n\n[Root.GetWarArtifactLocation4]"
 war_artifact_browser_bow_of_loren_located:0 "§Y[war_artifact_location_bow_of_loren.GetName]§!, §Y[war_artifact_location_bow_of_loren.Owner.GetName]§!, §Y[war_artifact_location_bow_of_loren.GetSuperRegionName]§!"
