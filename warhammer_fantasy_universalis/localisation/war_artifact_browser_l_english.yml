 war_artifact_browser_grail_caption:0 "The Grail"
 war_artifact_browser_grail_tt:0 "§YThe Grail§!\n\nReligious Unity: §G+10%§!; Monthly Royarch Authority: §G+0.25§!; Yearly Prestige: §G+0.1§!\n\nThe Grail is the enchanted chalice kept by the Lady of the Lake, the patron deity of Bretonnia. Only a paragon of chivalry may receive it from the Lady's own hands.\n\n[Root.GetWarArtifactLocation3]"
 war_artifact_browser_grail_located:0 "§Y[war_artifact_location_grail.GetName]§!, §Y[war_artifact_location_grail.Owner.GetName]§!, §Y[war_artifact_location_grail.GetSuperRegionName]§!"
