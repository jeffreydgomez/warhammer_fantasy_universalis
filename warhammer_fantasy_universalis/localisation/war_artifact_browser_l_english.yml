 war_artifact_browser_celestial_compass_caption:0 "Celestial Compass"
 war_artifact_browser_celestial_compass_tt:0 "§YThe Celestial Compass§!\n\nSame-Culture Advisor Cost: §G-10%§!\n\nAn ancient artifact of Grand Cathay, the Celestial Compass guides the rulers of Cathay in aligning their empire with the harmony of the cosmos. With its wisdom, they strengthen their advisors and secure their realm against any threat.\n\n[Root.GetWarArtifactLocation17]"
 war_artifact_browser_celestial_compass_located:0 "§Y[war_artifact_location_celestial_compass.GetName]§!, §Y[war_artifact_location_celestial_compass.Owner.GetName]§!, §Y[war_artifact_location_celestial_compass.GetSuperRegionName]§!"
