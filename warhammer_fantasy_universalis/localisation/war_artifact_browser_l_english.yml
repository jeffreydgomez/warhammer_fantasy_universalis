 war_artifact_browser_crown_of_the_troll_king_caption:0 "Troll King's Crown"
 war_artifact_browser_crown_of_the_troll_king_tt:0 "§YThe Crown of the Troll King§!\n\nLand Attrition: §G-10%§!\n\nThe Troll King's crown grants dominion over the monstrous hordes of Norsca. With this artifact, the Troll King unites trolls, giants, and beasts under his rule, leading raids that devastate all in their path.\n\n[Root.GetWarArtifactLocation5]"
 war_artifact_browser_crown_of_the_troll_king_located:0 "§Y[war_artifact_location_crown_of_the_troll_king.GetName]§!, §Y[war_artifact_location_crown_of_the_troll_king.Owner.GetName]§!, §Y[war_artifact_location_crown_of_the_troll_king.GetSuperRegionName]§!"
