 war_artifact_browser_fellblade_caption:0 "The Fellblade"
 war_artifact_browser_fellblade_tt:0 "§YThe Fellblade§!\n\nLand Leader Maneuver: §G+1§!\n\nForged by the Skaven as the ultimate weapon of destruction, the Fellblade is a cursed sword of unparalleled power, capable of felling even the mightiest foes. Its wielder, however, must pay the price for wielding such a dangerous artifact.\n\n[Root.GetWarArtifactLocation6]"
 war_artifact_browser_fellblade_located:0 "§Y[war_artifact_location_fellblade.GetName]§!, §Y[war_artifact_location_fellblade.Owner.GetName]§!, §Y[war_artifact_location_fellblade.GetSuperRegionName]§!"
 war_artifact_browser_fellblade_unowned_location:0 "§Y[war_artifact_location_fellblade.GetName]§!, §YUnowned§!, §Y[war_artifact_location_fellblade.GetSuperRegionName]§!"
 war_artifact_browser_fellblade_report_title:0 "The Fellblade"
