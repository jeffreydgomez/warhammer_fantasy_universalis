 war_artifact_browser_shoguns_katana_caption:0 "Shogun's Katana"
 war_artifact_browser_shoguns_katana_tt:0 "§YThe Shogun's Katana§!\n\nLiberty Desire in Subjects: §G-5%§!\n\nForged in the distant islands of Nippon, this ancestral blade once symbolized the unquestioned authority of the Shoguns of old. It is more than a weapon; it is the embodiment of discipline, loyalty, and rightful rule.\n\n[Root.GetWarArtifactLocation19]"
 war_artifact_browser_shoguns_katana_located:0 "§Y[war_artifact_location_shoguns_katana.GetName]§!, §Y[war_artifact_location_shoguns_katana.Owner.GetName]§!, §Y[war_artifact_location_shoguns_katana.GetSuperRegionName]§!"
