 war_artifact_browser_group_east:0 "Heirlooms of the East"
 war_artifact_browser_great_maw_cauldron_caption:0 "Maw Cauldron"
 war_artifact_browser_great_maw_cauldron_tt:0 "§YThe Great Maw Cauldron§!\n\nShock Damage Received: §G-5%§!\n\nIn the heart of the Ogre Kingdoms lies the Great Maw Cauldron, a sacred pit used to honor the Great Maw itself. Those who feed it earn the Maw's favor, becoming unstoppable forces of destruction in battle.\n\n[Root.GetWarArtifactLocation16]"
 war_artifact_browser_great_maw_cauldron_located:0 "§Y[war_artifact_location_great_maw_cauldron.GetName]§!, §Y[war_artifact_location_great_maw_cauldron.Owner.GetName]§!, §Y[war_artifact_location_great_maw_cauldron.GetSuperRegionName]§!"
