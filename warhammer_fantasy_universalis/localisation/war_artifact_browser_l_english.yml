 war_artifact_browser_widowmaker_caption:0 "Widowmaker"
 war_artifact_browser_widowmaker_tt:0 "§YThe Widowmaker§!\n\nArmy Tradition from Battles: §G+25%§!\n\nThe Sword of Khaine, known as the Widowmaker, is a weapon of boundless destructive power, cursed by the bloodlust of the Elven god Khaine. Those who wield it are fated for ruin, but they bring unparalleled devastation upon their enemies.\n\n[Root.GetWarArtifactLocation8]"
 war_artifact_browser_widowmaker_located:0 "§Y[war_artifact_location_widowmaker.GetName]§!, §Y[war_artifact_location_widowmaker.Owner.GetName]§!, §Y[war_artifact_location_widowmaker.GetSuperRegionName]§!"
