 war_artifact_browser_staff_of_nagash_caption:0 "Staff of Nagash"
 war_artifact_browser_staff_of_nagash_tt:0 "§YThe Staff of Nagash§!\n\nInfantry Combat Ability: §G+5%§!\n\nForged by the Great Necromancer himself, the Staff of Nagash holds the secrets of death and undeath. With this dark artifact, the wielder commands great power over the legions of the dead and strikes fear into the hearts of all who oppose them.\n\n[Root.GetWarArtifactLocation21]"
 war_artifact_browser_staff_of_nagash_located:0 "§Y[war_artifact_location_staff_of_nagash.GetName]§!, §Y[war_artifact_location_staff_of_nagash.Owner.GetName]§!, §Y[war_artifact_location_staff_of_nagash.GetSuperRegionName]§!"
