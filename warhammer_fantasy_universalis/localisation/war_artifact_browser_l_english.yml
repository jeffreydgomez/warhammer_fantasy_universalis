 war_artifact_browser_reman_scroll_caption:0 "Scroll of Remas"
 war_artifact_browser_reman_scroll_tt:0 "§YThe Scroll of Remas§!\n\nMonthly Reform Progress: §G+0.1§!\n\nPenned in the golden age of Remas, this scroll preserves the principles of disciplined governance and mercantile mastery that made the city a beacon of Tilean civilization. Though small in form, its words carry the weight of statecraft, tradecraft, and civic order.\n\n[Root.GetWarArtifactLocation2]"
 war_artifact_browser_reman_scroll_located:0 "§Y[war_artifact_location_reman_scroll.GetName]§!, §Y[war_artifact_location_reman_scroll.Owner.GetName]§!, §Y[war_artifact_location_reman_scroll.GetSuperRegionName]§!"
