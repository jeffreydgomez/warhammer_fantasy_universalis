 war_artifact_browser_genie_in_a_bottle_caption:0 "Djinn in a Bottle"
 war_artifact_browser_genie_in_a_bottle_tt:0 "§YThe Djinn in a Bottle§!\n\nNaval Morale Damage: §G+5%§!\n\nBound by ancient sorceries in Araby, this imprisoned Djinn commands wind and tide alike. Many fleets have foundered beneath storms conjured by its wrath, and its master holds dominion over the fury of the seas.\n\n[Root.GetWarArtifactLocation15]"
