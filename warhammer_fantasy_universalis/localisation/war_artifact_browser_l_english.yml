 war_artifact_browser_dragon_armor_of_aenarion_report_desc:0 "Forged in the time of the first Phoenix King, Aenarion, the Dragon Armor of Aenarion is an indestructible suit of armor, imbued with magic to resist flame and even the fiercest magical attacks. It is a symbol of the High Elves' undying resolve and their eternal vigilance against the forces of Chaos.\n\n[Root.GetWarArtifactBrowserReportLocation]"
