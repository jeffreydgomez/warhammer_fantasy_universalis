 war_artifact_browser_group_earth:0 "Relics of the Dwarves"
 war_artifact_browser_book_of_grudges_caption:0 "Book of Grudges"
 war_artifact_browser_book_of_grudges_tt:0 "§YThe Book of Grudges§!\n\nPower Projection from Insults: §G+50%§!\n\nKept by the High King of the Dwarfs, the Great Book of Grudges, or Dammaz Kron, records every wrong done to the Dwarfen people. It demands vengeance and inspires unwavering resolve in those who honor its pages.\n\n[Root.GetWarArtifactLocation10]"
