 war_artifact_browser_gromril_crown_report_title:0 "The Gromril Crown"
 war_artifact_browser_gromril_crown_report_desc:0 "Forged from a single piece of pure Gromril, and inscribed with nine hundred ninety nine Runes of glory, the Gromril Crown is the most valuable object in existence. It was forged by the new Dwarven Empire, and wearing it bestows all the glory and prestige of the greatest kings in history.\n\n[Root.GetWarArtifactBrowserReportLocation]"
