 war_artifact_browser_ghal_maraz_caption:0 "Ghal Maraz"
 war_artifact_browser_ghal_maraz_tt:0 "§YGhal Maraz§!\n\nLand Leader Shock: §G+1§!; Maximum General Shock: §G+1§!; Monthly Imperial Authority: §G+0.01§!; Reasons for Electors to Vote for Us: §G+5§!\n\nThe legendary hammer of Sigmar, Ghal Maraz, embodies the might of the Empire and the indomitable spirit of its people. It grants unparalleled strength to any who wield it in battle, symbolizing the divine right to defend the realm.\n\n[Root.GetWarArtifactLocation1]"
 war_artifact_browser_ghal_maraz_located:0 "§Y[war_artifact_location_ghal_maraz.GetName]§!, §Y[war_artifact_location_ghal_maraz.Owner.GetName]§!, §Y[war_artifact_location_ghal_maraz.GetSuperRegionName]§!"
 war_artifact_browser_ghal_maraz_unowned_location:0 "§Y[war_artifact_location_ghal_maraz.GetName]§!, §YUnowned§!, §Y[war_artifact_location_ghal_maraz.GetSuperRegionName]§!"
