 war_artifact_browser_heavens_gate_caption:0 "Heaven's Gate"
 war_artifact_browser_heavens_gate_tt:0 "§YHeaven's Gate§!\n\nMovement Speed: §G+5%§!\n\nThese legendary weapons are said to have belonged to Bhashiva the White Tiger of Ind, a fearsome huntress whose swiftness was unmatched. Heaven's Gate embodies predatory grace and relentless pursuit, granting its bearer uncanny speed in war.\n\n[Root.GetWarArtifactLocation18]"
 war_artifact_browser_heavens_gate_located:0 "§Y[war_artifact_location_heavens_gate.GetName]§!, §Y[war_artifact_location_heavens_gate.Owner.GetName]§!, §Y[war_artifact_location_heavens_gate.GetSuperRegionName]§!"
