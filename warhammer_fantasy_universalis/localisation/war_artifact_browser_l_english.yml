 war_artifact_browser_genie_in_a_bottle_report_title:0 "The Djinn in a Bottle"
 war_artifact_browser_genie_in_a_bottle_report_desc:0 "Bound by ancient sorceries in Araby, this imprisoned Djinn commands wind and tide alike. Many fleets have foundered beneath storms conjured by its wrath, and its master holds dominion over the fury of the seas.\n\n[Root.GetWarArtifactBrowserReportLocation]"
