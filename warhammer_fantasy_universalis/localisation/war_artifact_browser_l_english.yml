 war_artifact_browser_bleeding_idol_caption:0 "The Bleeding Idol"
 war_artifact_browser_bleeding_idol_tt:0 "§YThe Bleeding Idol§!\n\nDiplomats: §G+1§!\n\nRecovered from the shadowed ruins of Nocthyrion off the coast of Khuresh, this profane idol is steeped in vampiric corruption. Legend holds that its fell influence transformed the Elves who dwelt there into creatures of the night.\n\n[Root.GetWarArtifactLocation24]"
