 war_artifact_browser_hashuts_black_hammer_report_title:0 "Hashut's Black Hammer"
 war_artifact_browser_hashuts_black_hammer_report_desc:0 "The Black Hammer of Hashut, forged in Zharr-Naggrund, represents the infernal craftsmanship and dark industry of the Chaos Dwarves. With this hammer, their forges produce weapons and machines of unmatched power.\n\n[Root.GetWarArtifactBrowserReportLocation]"
