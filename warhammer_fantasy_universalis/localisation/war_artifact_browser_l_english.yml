 war_artifact_browser_hashuts_black_hammer_caption:0 "Hashut's Hammer"
 war_artifact_browser_hashuts_black_hammer_tt:0 "§YHashut's Black Hammer§!\n\nProduction Efficiency: §G+5%§!\n\nThe Black Hammer of Hashut, forged in Zharr-Naggrund, represents the infernal craftsmanship and dark industry of the Chaos Dwarves. With this hammer, their forges produce weapons and machines of unmatched power.\n\n[Root.GetWarArtifactLocation11]"
