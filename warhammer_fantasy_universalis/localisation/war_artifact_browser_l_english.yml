 war_artifact_browser_nagashs_tome_caption:0 "Nagash's Tome"
 war_artifact_browser_nagashs_tome_tt:0 "§YNagash's Tome§!\n\nInnovativeness Gain: §G+10%§!\n\nNagash's tome preserves the original spells and incantations of necromancy, written in the Great Necromancer's own hand. Its pages mingle forbidden rituals with the notes and research behind his mastery of death.\n\n[Root.GetWarArtifactLocation22]"
 war_artifact_browser_nagashs_tome_located:0 "§Y[war_artifact_location_nagashs_tome.GetName]§!, §Y[war_artifact_location_nagashs_tome.Owner.GetName]§!, §Y[war_artifact_location_nagashs_tome.GetSuperRegionName]§!"
