l_english:
 war_view_possible_unifications_title:0 "§YView Possible Unifications§!"
 war_view_possible_unifications_desc:0 "Some players prefer the fractured world exactly as it begins. Others may want to consolidate busy regions before the first month turns.\n\nThis will reveal optional regional unification decisions. They can reduce the number of small countries, may help performance, and can create larger early enemies or larger standout realms."
 war_hide_possible_unifications_title:0 "§YHide Possible Unifications§!"
 war_hide_possible_unifications_desc:0 "Hide the optional regional unification decisions without changing any countries."
 war_unify_imperial_region_title:0 "§YUnify the Empire§!"
 war_unify_imperial_region_desc:0 "Consolidate neighboring Imperial states around Reikland, except for countries with capitals in the Borderlands."
 war_unify_estalian_region_title:0 "§YUnify Estalia§!"
 war_unify_estalian_region_desc:0 "Consolidate neighboring Estalian states around Magritta."
 war_unify_bretonnian_region_title:0 "§YUnify Bretonnia§!"
 war_unify_bretonnian_region_desc:0 "Consolidate neighboring Bretonnian states around Couronne."
 war_unify_tilean_region_title:0 "§YUnify Tilea§!"
 war_unify_tilean_region_desc:0 "Consolidate neighboring Tilean states around Remas."
 war_unify_norse_region_title:0 "§YUnify Norsca§!"
 war_unify_norse_region_desc:0 "Consolidate neighboring Norse states around the Skaelings."
 war_unify_albionise_region_title:0 "§YUnify Albion§!"
 war_unify_albionise_region_desc:0 "Consolidate neighboring Albion states around the Belenii."
 war_unify_arabyan_region_title:0 "§YUnify Araby§!"
 war_unify_arabyan_region_desc:0 "Consolidate neighboring Arabyan states around Alhaka."
 war_unify_kurgan_region_title:0 "§YUnify the Kurgan§!"
 war_unify_kurgan_region_desc:0 "Consolidate neighboring Kurgan states around the Steppe Dolgans. One-province neighbors are left alone."
 war_unify_cathayan_region_title:0 "§YUnify Cathay§!"
 war_unify_cathayan_region_desc:0 "Consolidate neighboring Cathayan states around the Celestial Regency."
 war_unify_indish_region_title:0 "§YUnify Ind§!"
 war_unify_indish_region_desc:0 "Consolidate neighboring Indish states around Delehi."
 war_unify_nipponese_region_title:0 "§YUnify Nippon§!"
 war_unify_nipponese_region_desc:0 "Consolidate neighboring Nipponese states around Nippon."
 war_unify_nehekharan_region_title:0 "§YUnify Nehekhara§!"
 war_unify_nehekharan_region_desc:0 "Consolidate neighboring non-Nagashi Nehekharan states around Khemri."
 war_unify_greenskin_region_title:0 "§YUnify the Greenskins§!"
 war_unify_greenskin_region_desc:0 "Consolidate neighboring Greenskin states around the Red Fangs, except for the Crooked Moon Tribe."
 war_unify_asur_region_title:0 "§YUnify Ulthuan§!"
 war_unify_asur_region_desc:0 "Consolidate neighboring Asur states around Eataine."
 war_unify_druchii_region_title:0 "§YUnify Naggaroth§!"
 war_unify_druchii_region_desc:0 "Consolidate neighboring Druchii states around Naggaroth."
 war_unify_snakefolk_region_title:0 "§YUnify Khuresh§!"
 war_unify_snakefolk_region_desc:0 "Consolidate neighboring Snakefolk states around the Blood Queen."
 war_unify_dwarf_region_title:0 "§YUnify the Karaz Ankor§!"
 war_unify_dwarf_region_desc:0 "Consolidate neighboring Dwarf holds around Karaz-a-Karak. Bloody Spearz, Clan Ferrik, Clan Fester, Clan Skrapp, Grimfangz, Clan Verms, Yellow Eye, Clan Ektrik, and Clan Flem are also integrated."
 war_unify_ogre_region_title:0 "§YUnify the Ogre Kingdoms§!"
 war_unify_ogre_region_desc:0 "Consolidate neighboring Ogre tribes around Goldtooth."
 war_unify_skaven_region_title:0 "§YUnify the Under-Empire§!"
 war_unify_skaven_region_desc:0 "Consolidate neighboring Skaven clans around the Grey Seer Clan, except for Queek's Legion."
 war_unify_lustrian_lizardmen_region_title:0 "§YUnify Lustria§!"
 war_unify_lustrian_lizardmen_region_desc:0 "Consolidate neighboring Lustrian Lizardmen around Itza. Tlaxtlan, Tlax, and Subatuun are also folded into Itza."
 war_unify_dragon_isles_lizardmen_region_title:0 "§YUnify the Dragon Isles§!"
 war_unify_dragon_isles_lizardmen_region_desc:0 "Consolidate neighboring Dragon Isles Lizardmen around Aki-Aka."
 war_unify_all_regions_title:0 "§YUnify All Regions§!"
 war_unify_all_regions_desc:0 "Run each available regional unification up to five times, using the listed standout countries as fixed centers. Greenskins receive one additional pass."
 war_unexpected_unification:0 "Unexpected Unification"
 war_unexpected_unification_desc:0 "A sudden unification has brought rivals, cults, temples, councils, and sworn enemies under one banner. The realm can preach, bargain, and purge with unusual urgency, but its administrative machinery is badly overburdened."
