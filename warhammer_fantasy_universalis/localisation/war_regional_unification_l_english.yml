l_english:
 war_view_possible_unifications_title:0 "View Possible Unifications"
 war_view_possible_unifications_desc:0 "Some players prefer the fractured world exactly as it begins. Others may want to consolidate busy regions before the first month turns.\n\nThis will reveal optional regional unification decisions. They can reduce the number of small countries, may help performance, and can create larger early enemies or larger starting player realms."
 war_hide_possible_unifications_title:0 "Hide Possible Unifications"
 war_hide_possible_unifications_desc:0 "Hide the optional regional unification decisions without changing any countries."
 war_unify_imperial_region_title:0 "Unify the Empire"
 war_unify_imperial_region_desc:0 "Consolidate neighboring Imperial states around Reikland, or around a player country of the Imperial culture group."
 war_unify_estalian_region_title:0 "Unify Estalia"
 war_unify_estalian_region_desc:0 "Consolidate neighboring Estalian states around Magritta, or around a player country of the Estalian culture group."
 war_unify_bretonnian_region_title:0 "Unify Bretonnia"
 war_unify_bretonnian_region_desc:0 "Consolidate neighboring Bretonnian states around Couronne, or around a player country of the Bretonnian culture group."
 war_unify_tilean_region_title:0 "Unify Tilea"
 war_unify_tilean_region_desc:0 "Consolidate neighboring Tilean states around Remas, or around a player country of the Tilean culture group."
 war_unify_norse_region_title:0 "Unify Norsca"
 war_unify_norse_region_desc:0 "Consolidate neighboring Norse states around the Skaelings, or around a player country of the Norse culture group."
 war_unify_albionise_region_title:0 "Unify Albion"
 war_unify_albionise_region_desc:0 "Consolidate neighboring Albion states around the Belenii, or around a player country of the Albionise culture group."
 war_unify_arabyan_region_title:0 "Unify Araby"
 war_unify_arabyan_region_desc:0 "Consolidate neighboring Arabyan states around Alhaka, or around a player country of the Arabyan culture group."
 war_unify_kurgan_region_title:0 "Unify the Kurgan"
 war_unify_kurgan_region_desc:0 "Consolidate neighboring Kurgan states around the Steppe Dolgans, or around a player country of the Kurgan culture group. One-province neighbors are left alone."
 war_unify_cathayan_region_title:0 "Unify Cathay"
 war_unify_cathayan_region_desc:0 "Consolidate neighboring Cathayan states around the Celestial Regency, or around a player country of the Cathayan culture group."
 war_unify_indish_region_title:0 "Unify Ind"
 war_unify_indish_region_desc:0 "Consolidate neighboring Indish states around Delehi, or around a player country of the Indish culture group."
 war_unify_nipponese_region_title:0 "Unify Nippon"
 war_unify_nipponese_region_desc:0 "Consolidate neighboring Nipponese states around Nippon, or around a player country of the Nipponese culture group."
 war_unify_nehekharan_region_title:0 "Unify Nehekhara"
 war_unify_nehekharan_region_desc:0 "Consolidate neighboring Nehekharan states around Khemri, or around a player country of the Nehekharan culture group."
 war_unify_greenskin_region_title:0 "Unify the Greenskins"
 war_unify_greenskin_region_desc:0 "Consolidate neighboring Greenskin states around the Red Fangs, or around a player country of the Greenskin culture group."
 war_unify_asur_region_title:0 "Unify Ulthuan"
 war_unify_asur_region_desc:0 "Consolidate neighboring Asur states around Eataine, or around a player country of the Asur culture group."
 war_unify_druchii_region_title:0 "Unify Naggaroth"
 war_unify_druchii_region_desc:0 "Consolidate neighboring Druchii states around Naggaroth, or around a player country of the Druchii culture group."
 war_unify_snakefolk_region_title:0 "Unify Khuresh"
 war_unify_snakefolk_region_desc:0 "Consolidate neighboring Snakefolk states around the Blood Queen, or around a player country of the Snakefolk culture group."
 war_unify_dwarf_region_title:0 "Unify the Karaz Ankor"
 war_unify_dwarf_region_desc:0 "Consolidate neighboring Dwarf holds around Karaz-a-Karak, or around a player country of the Dwarf culture group."
 war_unify_ogre_region_title:0 "Unify the Ogre Kingdoms"
 war_unify_ogre_region_desc:0 "Consolidate neighboring Ogre tribes around Goldtooth, or around a player country of the Ogre culture group."
 war_unify_skaven_region_title:0 "Unify the Under-Empire"
 war_unify_skaven_region_desc:0 "Consolidate neighboring Skaven clans around the Grey Seer Clan, or around a player country of the Skaven culture group."
 war_unify_lustrian_lizardmen_region_title:0 "Unify Lustria"
 war_unify_lustrian_lizardmen_region_desc:0 "Consolidate neighboring Lustrian Lizardmen around Itza, or around a non-Dragon Isles player country of the Lizardmen culture group. Tlaxtlan, Tlax, and Subatuun are also folded into the chosen realm."
 war_unify_dragon_isles_lizardmen_region_title:0 "Unify the Dragon Isles"
 war_unify_dragon_isles_lizardmen_region_desc:0 "Consolidate neighboring Dragon Isles Lizardmen around Aki-Aka, or around a Dragon Isles player country."
 war_unify_all_regions_title:0 "Unify All Regions"
 war_unify_all_regions_desc:0 "Run each available regional unification up to five times, using player countries where possible and the listed standout countries where no player exists."
 war_unexpected_unification:0 "Unexpected Unification"
 war_unexpected_unification_desc:0 "A sudden unification has brought rivals, cults, temples, councils, and sworn enemies under one banner. The realm can preach, bargain, and purge with unusual urgency, but its administrative machinery is badly overburdened."
