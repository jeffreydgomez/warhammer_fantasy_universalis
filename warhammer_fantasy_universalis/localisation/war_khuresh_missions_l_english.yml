l_english:

 khuresh_map_indish_game_trails_title:0 "Map the Indish Game-Trails"
 khuresh_map_indish_game_trails_desc:0 "Ind's western jungles are crowded with pilgrims, beasts, and shrine-keepers who know every hidden trail. Put eyes on the game-paths before the west understands it is being hunted."
 khuresh_jungle_toll_knives_title:0 "Jungle Toll Knives"
 khuresh_jungle_toll_knives_desc:0 "Every road through the canopy has its own toll, knife, and hungry shrine. Gather those private threats into one public system of predation."
 khuresh_venom_roads_counted_title:0 "Venom Roads Counted"
 khuresh_venom_roads_counted_desc:0 "Merchants still bargain with local monsters as if Khuresh has no single will. Count the venom roads, price their dangers, and make fear pay tax."
 khuresh_unite_north_canopy_title:0 "Bind the North"
 khuresh_unite_north_canopy_desc:0 "Northern Khuresh cannot be counted into obedience by borders alone. Bind its nobles, shrine-speakers, and predator courts through completed bargains and visible loyalty."
 khuresh_unite_south_canopy_title:0 "Still the South"
 khuresh_unite_south_canopy_desc:0 "The southern swamps breed feuds faster than armies can march. Still them through central authority, loyal shrines, and courts that know where power truly coils."
 khuresh_indish_border_broken_title:0 "Indish Border Broken"
 khuresh_indish_border_broken_desc:0 "Ind's temple kingdoms still treat the eastern jungle as a frontier. Let the border move with teeth."
 khuresh_ind_bows_to_green_title:0 "Ind Bows to the Green"
 khuresh_ind_bows_to_green_desc:0 "Ind's cities shine with enough wealth to mistake stone walls for safety. Bring their courts under the green shadow."
 khuresh_indish_heart_blood_compact_title:0 "Indish Heart-Compact"
 khuresh_indish_heart_blood_compact_desc:0 "Spice roads, temple treasuries, and river cities resist in separate rhythms. Bind them into one tribute compact and let Khuresh drink."
 khuresh_three_frontiers_coil_inward_title:0 "Four Frontiers"
 khuresh_three_frontiers_coil_inward_desc:0 "Ind, Cathay, Skavenblight, and Nippon have all felt the root-shadow at their edges. Pull those outer fears inward until distant frontiers serve the heart of Khuresh."

 khuresh_call_canopy_courts_title:0 "Call the Canopy Courts"
 khuresh_call_canopy_courts_desc:0 "Khuresh is a hunting ground of courts before it is a realm, each ceremony hiding a threat. Send one summons through the canopy and see who dares ignore it."
 khuresh_hostages_under_vines_title:0 "Hostages Under Vines"
 khuresh_hostages_under_vines_desc:0 "Rival chiefs wrap independence in ritual courtesies. Take their promises, heirs, and pride beneath the vines."
 khuresh_blood_tithe_muster_title:0 "Blood-Tithe Muster"
 khuresh_blood_tithe_muster_desc:0 "Tribute without warriors is only appetite dressed as wealth. Count bodies, weapons, and blood as one tithe."
 khuresh_thorn_forts_interior_title:0 "Thorn-Forts of the Interior"
 khuresh_thorn_forts_interior_desc:0 "The interior roads disappear into ambush, fever, and private hunger. Raise thorn-forts where the tracks cross and make passage answer the realm."
 khuresh_feast_rival_courts_title:0 "Feast of Rival Courts"
 khuresh_feast_rival_courts_desc:0 "Rival courts will keep plotting; that is their nature. Host the feast, choose the knives, and decide which feuds become useful."
 khuresh_one_jungle_many_hungers_title:0 "One Jungle, Many Hungers"
 khuresh_one_jungle_many_hungers_desc:0 "Every race, cult, and court of Khuresh hungers in its own tongue. Unity must be built from fear, bargain, and rite without pretending the jungle is tame."
 khuresh_khuresh_coils_complete_title:0 "Khuresh Coils Complete"
 khuresh_khuresh_coils_complete_desc:0 "Foreign maps still write Khuresh as rumor and warning. Close the coils around jungle, coast, and hidden court until the name becomes law."
 khuresh_underroot_warrens_sealed_title:0 "Underroot Warrens Sealed"
 khuresh_underroot_warrens_sealed_desc:0 "Below the roots run smugglers, vermin, and passages that remember no master. Seal what cannot yet be ruled."
 khuresh_feral_law_world_before_title:0 "Feral Law of the Before"
 khuresh_feral_law_world_before_desc:0 "The world-before was ancient, hungry, and without apology. Shape a law just as old in spirit, as hard to uproot, and as willing to bite."

 khuresh_first_root_whisper_title:0 "Hear the First Root-Whisper"
 khuresh_first_root_whisper_desc:0 "The jungle speaks in pressure, fever, and the slow scrape of roots beneath speech. Listen before younger gods drown the first whisper."
 khuresh_root_dream_interpreters_title:0 "Root-Dream Interpreters"
 khuresh_root_dream_interpreters_desc:0 "Dreams rise through bark, fang, and venomous sleep. Teach the court to sort ancient memory from useful lies."
 khuresh_older_than_plaques_title:0 "Older Than Plaques"
 khuresh_older_than_plaques_desc:0 "Younger ruins have stolen the names of older powers for too long. Look past Old One plaques and listen for the source beneath them."
 khuresh_mark_hidden_grove_title:0 "Mark the Hidden Grove"
 khuresh_mark_hidden_grove_desc:0 "The Progenitor cannot be found by ordinary maps or civilized instruments. Mark the grove where root-memory first breaks the soil."
 khuresh_raise_root_shrine_title:0 "Raise the Root-Shrine"
 khuresh_raise_root_shrine_desc:0 "An unguarded grove is only a wound in the earth. Ring it with stones, altars, and keepers who understand what they serve."
 khuresh_feed_oldest_soil_title:0 "Feed the Oldest Soil"
 khuresh_feed_oldest_soil_desc:0 "The oldest soil does not wake for courtesy. Feed it power, blood, and patient terror until the roots answer."
 khuresh_read_living_rings_title:0 "Read the Living Rings"
 khuresh_read_living_rings_desc:0 "The living rings remember ages before ordered stars and written stone. Read growth as history and sap as witness."
 khuresh_name_progenitor_tree_title:0 "Name the Progenitor Tree"
 khuresh_name_progenitor_tree_desc:0 "Every omen offers a younger name, safer and smaller than the truth. Speak the name of the Progenitor Tree itself."
 khuresh_root_sap_reservoirs_title:0 "Root-Sap Reservoirs"
 khuresh_root_sap_reservoirs_desc:0 "Sacred sap cannot remain an accident dripping into mud. Build channels, storehouses, and appointed keepers for the grove's hunger."
 khuresh_grove_stone_altars_title:0 "Grove of Stone Altars"
 khuresh_grove_stone_altars_desc:0 "Root-hunger must be seen, not merely whispered about in courts. Raise stone altars where every subject can learn what feeds the realm."
 khuresh_world_root_cartographers_title:0 "World-Root Cartographers"
 khuresh_world_root_cartographers_desc:0 "The roots do not end in Khuresh, and neither can the search. Chart their impossible paths under sea, mountain, empire, and grave."
 khuresh_twin_across_world_title:0 "Progenitor's Twin"
 khuresh_twin_across_world_desc:0 "The Progenitor Tree, source of all life, is our most sacred object. However, we have recently learned that its roots extend deep beneath the group, and all the way across the planet. There is another Tree, the Progenitor's twin, in a far off land."
 khuresh_seed_first_canopy_title:0 "Seed of the First Canopy"
 khuresh_seed_first_canopy_desc:0 "A seed of the first canopy can only be taken from a grove made strong enough to survive the theft. Make the shrine terrible, fertile, and guarded."
 khuresh_gnawed_underroot_title:0 "The Gnawed Underroot"
 khuresh_gnawed_underroot_desc:0 "The world-root system is real, and something has been eating it. Follow the bite-marks into the dark beneath the world."
 khuresh_skavenblight_root_wound_title:0 "Skavenblight Root-Wound"
 khuresh_skavenblight_root_wound_desc:0 "Skavenblight is not merely a city of vermin. It is the wound where rat teeth found ancient root-flesh and would not stop gnawing."
 khuresh_core_oak_of_ages_title:0 "The Progenitor Entire"
 khuresh_core_oak_of_ages_desc:0 "The Progenitor's twin stands in Athel Loren, guarded by ages of alien memory. Core the Oak of Ages and bind both sides of the first root."

 khuresh_watch_jade_road_title:0 "Watch the Jade Road"
 khuresh_watch_jade_road_desc:0 "Cathay trusts officials, ledgers, and paper seals to measure every danger. Watch the Jade Road until its protocols reveal where the jungle should strike."
 khuresh_jade_envoys_fear_title:0 "Jade Envoys in Fear"
 khuresh_jade_envoys_fear_desc:0 "Jade envoys carry ceremony like armor. Teach them that veiled diplomacy can bare teeth."
 khuresh_probe_cathays_scarps_title:0 "Probe Cathay's Scarps"
 khuresh_probe_cathays_scarps_desc:0 "Cathay's southern scarps hide roads, signal posts, and old warnings in disciplined layers. Find the paths that protocol conceals."
 khuresh_cathays_southern_wards_title:0 "Cathay's Southern Wards"
 khuresh_cathays_southern_wards_desc:0 "The southern wards are strong because Cathay makes them predictable. Force them to defend against fear, rumor, and the wet patience of the jungle."
 khuresh_dragon_ministers_unmasked_title:0 "Dragon Ministers "
 khuresh_dragon_ministers_unmasked_desc:0 "Dragon ministers hide behind seals, titles, and perfect courtesies. Unmask the officials willing to sell fear back to their own court."
 khuresh_dragon_court_humbled_title:0 "Dragon-Court Humbled"
 khuresh_dragon_court_humbled_desc:0 "Cathay trusts ordered heaven to arrange the world. Humble its dragon-courts with a power older, wetter, and less obedient than celestial law."
 khuresh_follow_vermin_tunnels_title:0 "Follow the Vermin Tunnels"
 khuresh_follow_vermin_tunnels_desc:0 "The root-wounds do not end at the surface; they sink into tunnels the vermin thought secret. Follow those paths beneath the world."
 khuresh_burn_rat_nest_below_title:0 "Burn the Rat-Nest Below"
 khuresh_burn_rat_nest_below_desc:0 "The rat-nest below has poisoned the root system long enough. Burn it, bind it, or break it until the wound can no longer fester."

 khuresh_wake_mangrove_keels_title:0 "Wake the Mangroves"
 khuresh_wake_mangrove_keels_desc:0 "The mangroves hide water-roads that no foreign admiral can read. Wake the first keels and let Khuresh breathe through its coast."
 khuresh_reef_pilots_weird_waves_title:0 "Reef Pilots of the Waves"
 khuresh_reef_pilots_weird_waves_desc:0 "The Weird Waves punish captains who trust straight lines and clean charts. License pilots who steer by reef-memory, fear, and things seen under moonless water."
 khuresh_nocthyrions_black_wake_title:0 "Nocthyrion's Black Wake"
 khuresh_nocthyrions_black_wake_desc:0 "Nocthyrion's old curse still blackens the stories told along Khuresh's coast. Turn that wake from warning into weapon."
 khuresh_sea_terror_oaths_title:0 "Sea-Terror Oaths"
 khuresh_sea_terror_oaths_desc:0 "Foreign captains call the eastern coast dangerous because they lack better words. Make terror contractual, priced, and enforceable."
 khuresh_eastern_tide_maps_title:0 "Eastern Tide Maps"
 khuresh_eastern_tide_maps_desc:0 "The eastern tide carries Nipponese rumor, island smoke, and the scent of disciplined violence. Map the waters and the whispers together."
 khuresh_wake_raiders_nippon_title:0 "Wake-Raiders of Nippon"
 khuresh_wake_raiders_nippon_desc:0 "Nippon's shore is disciplined, haunted, and fractured beneath its formal banners. Send wake-raiders to find the cracks."
 khuresh_black_sails_eastern_sea_title:0 "Black Sails in the Eastern Sea"
 khuresh_black_sails_eastern_sea_desc:0 "Nippon's castles watch their own rivals as much as the sea. Put black sails on the horizon and make every inland quarrel glance eastward."
 khuresh_shoguns_shore_in_dread_title:0 "Shogun's Shore in Dread"
 khuresh_shoguns_shore_in_dread_desc:0 "The Shogun's shore believes discipline can master fear. Send masks, raiders, and treaties that arrive like knives in the tide."
 khuresh_nippons_haunted_ports_title:0 "Nippon's Haunted Ports"
 khuresh_nippons_haunted_ports_desc:0 "Nippon's haunted ports can become eastern mouths for Khuresh. Make them speak in root-shadow, tribute, and black-water law."

 khuresh_ind_game_trails_mod:0 "Indish Game-Trails"
 desc_khuresh_ind_game_trails_mod:0 "Mapped trails let Khureshi agents move through the western jungle with fewer guesses and fewer wasted offerings."
 khuresh_jungle_toll_knives_mod:0 "Jungle Toll Knives"
 desc_khuresh_jungle_toll_knives_mod:0 "Road threats, shrine tolls, and knives in the leaves now serve a single predatory accounting."
 khuresh_venom_roads_counted_mod:0 "Venom Roads Counted"
 desc_khuresh_venom_roads_counted_mod:0 "The venom roads no longer enrich only local monsters. Their danger has become revenue."
 khuresh_unite_north_canopy_mod:0 "Northern Courts Bound"
 desc_khuresh_unite_north_canopy_mod:0 "Northern nobles, shrine-speakers, and predator courts have been made to answer central rite."
 khuresh_unite_south_canopy_mod:0 "Southern Feuds Stilled"
 desc_khuresh_unite_south_canopy_mod:0 "Southern feuds have been pulled beneath central authority and made less dangerous to the realm."
 khuresh_indish_border_broken_mod:0 "Indish Border Broken"
 desc_khuresh_indish_border_broken_mod:0 "The first western campaigns have taught our armies to carry jungle fear into Ind."
 khuresh_ind_bows_green_mod:0 "Ind Bows to the Green"
 desc_khuresh_ind_bows_green_mod:0 "Indish rulers have learned to phrase fear as courtesy, tribute, and treaty."
 khuresh_indish_heart_blood_mod:0 "Indish Heart-Blood Compact"
 desc_khuresh_indish_heart_blood_mod:0 "Temple wealth, spice revenue, and river dues now feed Khuresh's appetite."
 khuresh_three_frontiers_mod:0 "Four Frontiers Coiled"
 desc_khuresh_three_frontiers_mod:0 "Ind, Cathay, and Nippon have all been folded into the logic of Khureshi expansion."
 khuresh_canopy_courts_mod:0 "Canopy Courts Summoned"
 desc_khuresh_canopy_courts_mod:0 "The first canopy courts now know whose envoys must be answered."
 khuresh_hostages_vines_mod:0 "Hostages Under Vines"
 desc_khuresh_hostages_vines_mod:0 "Hostages and oaths beneath the vines make subject defiance harder to sustain."
 khuresh_blood_tithe_muster_mod:0 "Blood-Tithe Muster"
 desc_khuresh_blood_tithe_muster_mod:0 "Tribute is now counted in bodies, weapons, and blood."
 khuresh_thorn_forts_mod:0 "Thorn-Forts"
 desc_khuresh_thorn_forts_mod:0 "Thorn-forts make the interior roads defensible without making them tame."
 khuresh_feast_rival_courts_mod:0 "Feast of Rival Courts"
 desc_khuresh_feast_rival_courts_mod:0 "Rival courts still scheme, but the stage and the feast are ours."
 khuresh_one_jungle_central_mod:0 "One Jungle by Hostage Law"
 desc_khuresh_one_jungle_central_mod:0 "The jungle is held through hostages, orders, and central command."
 khuresh_one_jungle_blood_mod:0 "One Jungle by Blood Court"
 desc_khuresh_one_jungle_blood_mod:0 "Public sacrifice makes unity visible to every court that might forget it."
 khuresh_one_jungle_masks_mod:0 "One Jungle by Masks"
 desc_khuresh_one_jungle_masks_mod:0 "Masks, whispers, and veiled pacts bind the jungle without asking it to become simple."
 khuresh_coils_complete_mod:0 "Khuresh Coils Complete"
 desc_khuresh_coils_complete_mod:0 "Khuresh is no longer merely a rumor on foreign maps. It has become a realm with teeth."
 khuresh_underroot_warrens_mod:0 "Underroot Warrens Sealed"
 desc_khuresh_underroot_warrens_mod:0 "Sealed warrens and watched passages make treachery below the roots easier to catch."
 khuresh_feral_law_mod:0 "Feral Law of the Before"
 desc_khuresh_feral_law_mod:0 "Our law is old, hungry, and difficult to uproot."
 khuresh_first_root_whisper_mod:0 "First Root-Whisper"
 desc_khuresh_first_root_whisper_mod:0 "The court has learned to listen for truths moving below speech."
 khuresh_root_dream_interpreters_mod:0 "Root-Dream Interpreters"
 desc_khuresh_root_dream_interpreters_mod:0 "Interpreters of bark, fever, and fang make ancient visions useful."
 khuresh_older_than_plaques_mod:0 "Older Than Plaques"
 desc_khuresh_older_than_plaques_mod:0 "The realm now studies powers that predate the Old Ones and their ordered ruins."
 khuresh_progenitor_root_sign:0 "Progenitor Root-Sign"
 desc_khuresh_progenitor_root_sign:0 "This province bears the first confirmed sign of the Progenitor Tree's buried root-memory."
 khuresh_root_shrine_site:0 "Root-Shrine Site"
 desc_khuresh_root_shrine_site:0 "Stones, offerings, and keepers mark this grove as a shrine to something older than the known gods."
 khuresh_grove_concealed_mod:0 "Concealed Progenitor Grove"
 desc_khuresh_grove_concealed_mod:0 "False paths and death stories hide the Progenitor grove from outsiders."
 khuresh_grove_fed_mod:0 "Fed Progenitor Grove"
 desc_khuresh_grove_fed_mod:0 "The grove is fed enough blood, power, and attention to strengthen the realm's recoveries."
 khuresh_grove_monumentalized_mod:0 "Monumentalized Progenitor Grove"
 desc_khuresh_grove_monumentalized_mod:0 "The grove has been marked with public stones and great works."
 khuresh_root_shrine_mod:0 "Root-Shrine Rites"
 desc_khuresh_root_shrine_mod:0 "The first root-shrine gives the realm a terrifying spiritual center."
 khuresh_oldest_soil_mod:0 "Oldest Soil Fed"
 desc_khuresh_oldest_soil_mod:0 "The oldest soil has been woken with power, blood, and careful fear."
 khuresh_living_rings_mod:0 "Living Ring Histories"
 desc_khuresh_living_rings_mod:0 "The realm reads living growth as a record older than stone."
 khuresh_name_progenitor_mod:0 "Named the Progenitor"
 desc_khuresh_name_progenitor_mod:0 "The Progenitor Tree is no longer only omen and fever. It has a name in court."
 khuresh_root_sap_reservoirs_mod:0 "Root-Sap Reservoirs"
 desc_khuresh_root_sap_reservoirs_mod:0 "Sap, offerings, and ritual stores help the realm recover from war."
 khuresh_grove_stone_altars_mod:0 "Grove Stone Altars"
 desc_khuresh_grove_stone_altars_mod:0 "Stone altars translate root-hunger into public rite."
 khuresh_world_root_cartographers_mod:0 "World-Root Cartographers"
 desc_khuresh_world_root_cartographers_mod:0 "Cartographers follow impossible root-paths under sea, mountain, and empire."
 khuresh_twin_world_mod:0 "Dream of the Western Twin"
 desc_khuresh_twin_world_mod:0 "The western dreams point toward a twin of the Progenitor Tree."
 khuresh_seed_first_canopy_mod:0 "Seed of the First Canopy"
 desc_khuresh_seed_first_canopy_mod:0 "The first canopy's seed has made development feel like ritual growth."
 khuresh_gnawed_underroot_mod:0 "Gnawed Underroot"
 desc_khuresh_gnawed_underroot_mod:0 "The root-system is real, and its bite-marks lead toward Skaven corruption."
 khuresh_root_wound_burn_mod:0 "Root-Wound Burned"
 desc_khuresh_root_wound_burn_mod:0 "The Skavenblight wound is answered with war and flame."
 khuresh_root_wound_bind_mod:0 "Root-Wound Bound"
 desc_khuresh_root_wound_bind_mod:0 "The Skavenblight wound is bound beneath root-law."
 khuresh_root_wound_tap_mod:0 "Root-Wound Tapped"
 desc_khuresh_root_wound_tap_mod:0 "The poison of the root-wound is studied with careful cruelty."
 khuresh_oak_ages_ultimate_mod:0 "Roots Before Time"
 desc_khuresh_oak_ages_ultimate_mod:0 "The Oak of Ages and the Progenitor Tree are joined through conquest, root-law, and primal memory."
 khuresh_watch_jade_road_mod:0 "Watched Jade Road"
 desc_khuresh_watch_jade_road_mod:0 "Cathayan protocol is easier to bend once its road-watchers are known."
 khuresh_jade_envoys_fear_mod:0 "Jade Envoys in Fear"
 desc_khuresh_jade_envoys_fear_mod:0 "Cathayan envoys have learned to respect veiled Khureshi ceremony."
 khuresh_probe_cathay_scarps_mod:0 "Cathayan Scarps Probed"
 desc_khuresh_probe_cathay_scarps_mod:0 "The southern scarps have taught our garrisons how to hold difficult approaches."
 khuresh_cathay_wards_mod:0 "Cathayan Wards Taken"
 desc_khuresh_cathay_wards_mod:0 "Cathay's old defenses now strengthen Khureshi frontier doctrine."
 khuresh_dragon_ministers_unmasked_mod:0 "Dragons Unmasked"
 desc_khuresh_dragon_ministers_unmasked_mod:0 "Jade seals and court smiles hide less from us than they once did."
 khuresh_dragon_court_humbled_mod:0 "Dragon-Court Humbled"
 desc_khuresh_dragon_court_humbled_mod:0 "Ordered heaven has been made to acknowledge humid, ancient fear."
 khuresh_follow_vermin_tunnels_mod:0 "Vermin Tunnels Followed"
 desc_khuresh_follow_vermin_tunnels_mod:0 "Our forces move faster through paths the Skaven thought were theirs alone."
 khuresh_burn_rat_nest_mod:0 "Rat-Nest Below Broken"
 desc_khuresh_burn_rat_nest_mod:0 "The Skavenblight nest has been broken, and our armies carry that lesson forward."
 khuresh_mangrove_keels_mod:0 "Mangrove Keels"
 desc_khuresh_mangrove_keels_mod:0 "The first mangrove keels give Khuresh a public claim on its hidden waters."
 khuresh_reef_pilots_mod:0 "Weird Wave Pilots"
 desc_khuresh_reef_pilots_mod:0 "Reef pilots steer by fear, memory, and currents outsiders cannot name."
 khuresh_nocthyrion_wake_mod:0 "Nocthyrion's Black Wake"
 desc_khuresh_nocthyrion_wake_mod:0 "Nocthyrion's old curse has been folded into Khureshi intrigue."
 khuresh_sea_terror_oaths_mod:0 "Sea-Terror Oaths"
 desc_khuresh_sea_terror_oaths_mod:0 "Foreign captains now treat Khureshi sea fear as a contractual fact."
 khuresh_eastern_tide_maps_mod:0 "Eastern Tide Maps"
 desc_khuresh_eastern_tide_maps_mod:0 "Nipponese smoke, island currents, and eastern rumors now have places on our maps."
 khuresh_wake_raiders_nippon_mod:0 "Wake-Raiders of Nippon"
 desc_khuresh_wake_raiders_nippon_mod:0 "Wake-raiders have learned where Nippon's disciplined shore cracks."
 khuresh_black_sails_eastern_mod:0 "Black Sails in the Eastern Sea"
 desc_khuresh_black_sails_eastern_mod:0 "Black sails make Nippon's castles watch the horizon."
 khuresh_shogun_shore_dread_mod:0 "Shogun's Shore in Dread"
 desc_khuresh_shogun_shore_dread_mod:0 "The Shogun's shore now fears masks, raiders, and treaties that arrive like knives."
 khuresh_nippon_haunted_ports_mod:0 "Nippon's Haunted Ports"
 desc_khuresh_nippon_haunted_ports_mod:0 "Nippon's haunted ports have become eastern mouths for Khureshi sea power."

 khuresh_events.101.t:0 "One Jungle, Many Hungers"
 khuresh_events.101.d:0 "The courts of Khuresh have gathered beneath a canopy hung with masks, bone chimes, and wet leaves. Snakefolk nobles, jungle Skaven, Orc chiefs, Beastfolk speakers, shrine-keepers, and stranger delegates all understand that unity has arrived, but none agree what unity means.\n\nSome demand hostage law and visible chains of command. Others call for public sacrifice, because blood can make obedience simpler than speech. A quieter faction argues that Khuresh survives through masks, secrets, and pacts no foreign envoy can read."
 khuresh_events.101.a:0 "Bind them by hostage law."
 khuresh_events.101.b:0 "Feed the blood courts."
 khuresh_events.101.c:0 "Rule through masks and whispers."
 khuresh_events.102.t:0 "The Hidden Grove"
 khuresh_events.102.d:0 "The marked grove does not look like a throne, temple, or ruin. Its trees lean toward one another like listening elders, and the soil underfoot is warm enough that even cold-blooded courtiers notice.\n\nEvery witness returns with a different account. Some say the grove must be hidden from all maps, while others insist it must be fed until the roots answer. The boldest want stones raised in public, so every court knows where Khuresh's oldest fear is anchored."
 khuresh_events.102.a:0 "Hide it behind false paths."
 khuresh_events.102.b:0 "Feed the roots."
 khuresh_events.102.c:0 "Raise public stones."
 khuresh_events.103.t:0 "The Skavenblight Root-Wound"
 khuresh_events.103.d:0 "The root-paths do not merely pass under Skavenblight. They convulse there, wrapped in gnaw-marks, warpstone seepage, and tunnels packed with generations of vermin filth.\n\nThe discovery changes every omen that came before it. The Progenitor Tree's world-root system is real, but Skaven teeth have found it and poisoned the wound for ages. We can burn the rot, bind it beneath root-law, or tap the poison carefully enough to learn from it."
 khuresh_events.103.a:0 "Burn the rot."
 khuresh_events.103.b:0 "Bind the wound."
 khuresh_events.103.c:0 "Tap the poison."
 khuresh_events.104.t:0 "The Twin Root Crowned"
 khuresh_events.104.d:0 "The Oak of Ages is no longer a distant western myth. Its roots now answer a conqueror from Khuresh, and the Progenitor Tree's oldest whispers move through Athel Loren's living heart.\n\nThe forest resists every name we put upon it, but resistance is not denial. Two ancient powers, twin and opposite, have been forced into one terrible circuit. The world is younger than the roots beneath our feet."
 khuresh_events.104.a:0 "Let the roots drink law."
 khuresh_events.104.b:0 "Graft the twin canopies."
 khuresh_events.104.c:0 "Guard them with terror."
