l_english:

 khuresh_map_indish_game_trails_title:0 "Map the Indish Game-Trails"
 khuresh_map_indish_game_trails_desc:0 "Ind's western jungles are crowded with pilgrims, spice porters, sacred beasts, and shrine-keepers who know every hidden trail. Mark the game-paths, river fords, and tiger-haunted clearings before the temple kingdoms understand they are being hunted."
 khuresh_jungle_toll_knives_title:0 "Jungle Toll Knives"
 khuresh_jungle_toll_knives_desc:0 "Every road through the canopy has its own toll, knife, shrine-fee, and half-remembered curse. Gather the toll-cutters, caravan watchers, and shrine blades into one public system of predation that answers to Khuresh."
 khuresh_venom_roads_counted_title:0 "Venom Roads Counted"
 khuresh_venom_roads_counted_desc:0 "Merchants still bargain with local monsters as if Khuresh has no single will behind the leaves. Set market weights, count the venom roads, and make every paid guide, ambush fee, and safe-conduct charm part of the same fearful account."
 khuresh_unite_north_canopy_title:0 "Bind the North"
 khuresh_unite_north_canopy_desc:0 "Northern Khuresh cannot be counted into obedience by borders alone; its courts obey oaths, hostages, shrine verdicts, and the memory of old violence. Bind its nobles, shrine-speakers, and predator courts through completed bargains and visible loyalty."
 khuresh_unite_south_canopy_title:0 "Still the South"
 khuresh_unite_south_canopy_desc:0 "The southern swamps breed feuds faster than armies can march, and every drowned path has a court that thinks itself untouchable. Still them through crown authority, loyal shrines, and ritual courts that know where power truly coils."
 khuresh_indish_border_broken_title:0 "Indish Border Broken"
 khuresh_indish_border_broken_desc:0 "Ind's temple kingdoms still treat the eastern jungle as a frontier marked by pilgrims, tax posts, and frightened garrisons. Break that comfort with raids, border forts, and warbands that make the border move with teeth."
 khuresh_ind_bows_to_green_title:0 "Ind Bows to the Green"
 khuresh_ind_bows_to_green_desc:0 "Ind's cities shine with temple gold, elephant processions, spice courts, and enough stone to mistake wealth for safety. Bring their Rajahs and Maharajahs under the green shadow until courtesy and tribute mean the same thing."
 khuresh_indish_heart_blood_compact_title:0 "Indish Heart-Compact"
 khuresh_indish_heart_blood_compact_desc:0 "Spice roads, temple treasuries, sacred river tolls, and city granaries still resist in separate rhythms. Bind them into one heart-blood compact, where incense, coin, and sacrifice all feed Khuresh."
 khuresh_three_frontiers_coil_inward_title:0 "Four Frontiers"
 khuresh_three_frontiers_coil_inward_desc:0 "Ind, Cathay, Skavenblight, and Nippon have all felt the root-shadow at their edges, though each names the fear differently. Pull temple wealth, jade protocol, vermin tunnels, and haunted ports inward until the distant frontiers serve the heart of Khuresh."

 khuresh_call_canopy_courts_title:0 "Call the Canopy Courts"
 khuresh_call_canopy_courts_desc:0 "Khuresh is a hunting ground of courts before it is a realm, with serpent halls, hidden temples, and blood-lit clearings all claiming older rights. Send one summons through the canopy, hung with masks and bone chimes, and see who dares ignore it."
 khuresh_hostages_under_vines_title:0 "Hostages Under Vines"
 khuresh_hostages_under_vines_desc:0 "Rival chiefs wrap independence in ritual courtesies, trading soft words while keeping knives under the mat. Take their promises, heirs, seal-bearers, and pride beneath the vines, where loyalty can be watched and watered."
 khuresh_blood_tithe_muster_title:0 "Blood-Tithe Muster"
 khuresh_blood_tithe_muster_desc:0 "Tribute without warriors is only appetite dressed as wealth, and Khuresh cannot be defended by coin alone. Count bodies, weapons, poison stores, beast-handlers, and oath-bound warbands as one blood-tithe."
 khuresh_thorn_forts_interior_title:0 "Thorn-Forts of the Interior"
 khuresh_thorn_forts_interior_desc:0 "The interior roads disappear into ambush, fever, flooded roots, and private hunger before they reach any honest milestone. Raise thorn-forts, watch-altars, and toll palisades where the tracks cross, making passage answer the realm."
 khuresh_feast_rival_courts_title:0 "Feast of Rival Courts"
 khuresh_feast_rival_courts_desc:0 "Rival courts will keep plotting; that is their nature, and a peaceful court is only one that has not found its knife. Host the feast, arrange the masks, choose the cups, and decide which feuds become useful."
 khuresh_one_jungle_many_hungers_title:0 "One Jungle, Many Hungers"
 khuresh_one_jungle_many_hungers_desc:0 "Every race, cult, and court of Khuresh hungers in its own tongue, from serpent nobles to warren-speakers, beast chiefs, shrine-keepers, and stranger things. Unity must be built from fear, bargain, and rite without pretending the jungle is tame."
 khuresh_khuresh_coils_complete_title:0 "Khuresh Coils Complete"
 khuresh_khuresh_coils_complete_desc:0 "Foreign maps still write Khuresh as rumor, blank canopy, and warning ink at the edge of civilization. Close the coils around jungle, coast, hidden court, and blood shrine until the name becomes law."
 khuresh_underroot_warrens_sealed_title:0 "Underroot Warrens Sealed"
 khuresh_underroot_warrens_sealed_desc:0 "Below the roots run smugglers, vermin, escaped captives, and passages that remember no surface master. Seal the underroot warrens with watched stones, poison traps, and rites of ownership until what cannot be ruled can at least be contained."
 khuresh_feral_law_world_before_title:0 "Feral Law of the Before"
 khuresh_feral_law_world_before_desc:0 "The world-before was ancient, hungry, and without apology, long before Old One order tried to measure it. Shape a law just as old in spirit, as hard to uproot, and as willing to bite any hand that reaches too softly."

 khuresh_first_root_whisper_title:0 "Hear the First Root-Whisper"
 khuresh_first_root_whisper_desc:0 "The jungle speaks in pressure, fever, old sap, and the slow scrape of roots beneath speech. Teach the shrine-keepers and dream-listeners to hear the first whisper before younger gods and court liars drown it out."
 khuresh_root_dream_interpreters_title:0 "Root-Dream Interpreters"
 khuresh_root_dream_interpreters_desc:0 "Dreams rise through bark, fang, venomous sleep, and the breath of those who wake screaming beneath the canopy. Teach the court to sort ancient memory from useful lies, and to know which visions deserve blood."
 khuresh_older_than_plaques_title:0 "Older Than Plaques"
 khuresh_older_than_plaques_desc:0 "Younger ruins have stolen the names of older powers for too long, and Old One plaques cannot be allowed to end the question. Look past carved geometry, broken temple-stone, and borrowed sacred names to the source beneath them."
 khuresh_mark_hidden_grove_title:0 "Mark the Hidden Grove"
 khuresh_mark_hidden_grove_desc:0 "The Progenitor cannot be found by ordinary maps, civilized instruments, or the straight roads of younger peoples. Search the jungle itself and mark the grove where root-memory first breaks the soil."
 khuresh_raise_root_shrine_title:0 "Raise the Root-Shrine"
 khuresh_raise_root_shrine_desc:0 "An unguarded grove is only a wound in the earth, open to thieves, fools, and rival priests. Ring it with stones, altars, venom-fed guardians, and keepers who understand that service here is not safety."
 khuresh_feed_oldest_soil_title:0 "Feed the Oldest Soil"
 khuresh_feed_oldest_soil_desc:0 "The oldest soil does not wake for courtesy, song, or empty ceremony. Feed it power, blood, grave-water, and patient terror until the roots answer in growth that no gardener could command."
 khuresh_read_living_rings_title:0 "Read the Living Rings"
 khuresh_read_living_rings_desc:0 "The living rings remember ages before ordered stars, written stone, and the arrival of the first teachers. Read growth as history, sap as witness, and scars in bark as the annals of a world still becoming itself."
 khuresh_name_progenitor_tree_title:0 "Name the Progenitor Tree"
 khuresh_name_progenitor_tree_desc:0 "Every omen offers a younger name, safer and smaller than the truth, because courts prefer mysteries they can own. Gather the dream-readers, shrine-keepers, and blood witnesses, then speak the name of the Progenitor Tree itself."
 khuresh_root_sap_reservoirs_title:0 "Root-Sap Reservoirs"
 khuresh_root_sap_reservoirs_desc:0 "Sacred sap cannot remain an accident dripping into mud or stolen in gourds by frightened attendants. Build channels, sealed storehouses, measuring bowls, and appointed keepers for the grove's hunger."
 khuresh_grove_stone_altars_title:0 "Grove of Stone Altars"
 khuresh_grove_stone_altars_desc:0 "Root-hunger must be seen, not merely whispered about in courts or hidden behind priestly curtains. Raise stone altars, blood gutters, and watching masks where every subject can learn what feeds the realm."
 khuresh_world_root_cartographers_title:0 "World-Root Cartographers"
 khuresh_world_root_cartographers_desc:0 "The roots do not end in Khuresh, and neither can the search that began in the hidden grove. Chart their impossible paths under sea, mountain, empire, warren, and grave until distance itself becomes another veil to cut."
 khuresh_twin_across_world_title:0 "Progenitor's Twin"
 khuresh_twin_across_world_desc:0 "The Progenitor Tree, source of all life, is our most sacred object, but its roots do not end beneath Khuresh. The deepest readings point across the world toward another living power, a twin in a far western forest whose name is guarded by alien memory."
 khuresh_seed_first_canopy_title:0 "Seed of the First Canopy"
 khuresh_seed_first_canopy_desc:0 "A seed of the first canopy can only be taken from a grove made strong enough to survive the theft. Make the shrine terrible, fertile, and guarded with stone, learning, and sacrifice before the first living fragment is claimed."
 khuresh_gnawed_underroot_title:0 "The Gnawed Underroot"
 khuresh_gnawed_underroot_desc:0 "The world-root system is real, and something has been eating it from below with patient, chittering hunger. Follow the bite-marks through the Under-Empire's dark paths before the wound spreads beyond healing."
 khuresh_skavenblight_root_wound_title:0 "Skavenblight Root-Wound"
 khuresh_skavenblight_root_wound_desc:0 "Skavenblight is not merely a city of vermin, engines, and Council lies. It is the wound where rat teeth found ancient root-flesh, packed the cut with warpstone filth, and would not stop gnawing."
 khuresh_core_oak_of_ages_title:0 "The Progenitor Entire"
 khuresh_core_oak_of_ages_desc:0 "The Progenitor's twin stands in Athel Loren, guarded by Asrai memory, forest spite, and ages of alien growth. Core the Oak of Ages, bind both sides of the first root, and make the world's oldest circuit answer Khuresh."

 khuresh_watch_jade_road_title:0 "Watch the Jade Road"
 khuresh_watch_jade_road_desc:0 "Cathay trusts officials, ledgers, jade seals, and properly escorted caravans to measure every danger. Watch the Jade Road, count its convoys and dominion envoys, and learn where protocol leaves room for the jungle to strike."
 khuresh_jade_envoys_fear_title:0 "Jade Envoys in Fear"
 khuresh_jade_envoys_fear_desc:0 "Jade envoys carry ceremony like armor, trusting polished words to keep humid fear at a distance. Receive them with masks, gifts, and veiled threats until they learn that diplomacy from Khuresh can bare teeth."
 khuresh_probe_cathays_scarps_title:0 "Probe Cathay's Scarps"
 khuresh_probe_cathays_scarps_desc:0 "Cathay's southern scarps hide roads, signal posts, ward shrines, and old warnings in disciplined layers. Send scouts through misted passes and border markets until the paths concealed by protocol are marked for war."
 khuresh_cathays_southern_wards_title:0 "Cathay's Southern Wards"
 khuresh_cathays_southern_wards_desc:0 "The southern wards are strong because Cathay makes them predictable, supplied, and ceremonially watched. Force them to defend against fear, rumor, bribed guides, and the wet patience of the jungle."
 khuresh_dragon_ministers_unmasked_title:0 "Dragon Ministers "
 khuresh_dragon_ministers_unmasked_desc:0 "Dragon ministers hide behind seals, titles, perfect courtesies, and the brittle authority of an empire without its Emperor. Unmask the officials, dominion agents, and court brokers willing to sell fear back to their own court."
 khuresh_dragon_court_humbled_title:0 "Dragon-Court Humbled"
 khuresh_dragon_court_humbled_desc:0 "Cathay trusts ordered heaven to arrange the world, from Wei-Jin protocol to the dominions of its Dragon Siblings. Humble its dragon-courts with a power older, wetter, and less obedient than celestial law."
 khuresh_follow_vermin_tunnels_title:0 "Follow the Vermin Tunnels"
 khuresh_follow_vermin_tunnels_desc:0 "The root-wounds do not end at the surface; they sink into tunnels the vermin thought secret and safe from jungle memory. Follow those paths beneath the world, past gnaw-marks, slave pits, and the stink of warpstone."
 khuresh_burn_rat_nest_below_title:0 "Burn the Rat-Nest Below"
 khuresh_burn_rat_nest_below_desc:0 "The rat-nest below has poisoned the root system long enough with engines, filth, and frantic Skaven certainty. Burn it, bind it, or break it until the wound can no longer fester beneath the roots."

 khuresh_wake_mangrove_keels_title:0 "Wake the Mangroves"
 khuresh_wake_mangrove_keels_desc:0 "The mangroves hide water-roads, black inlets, and tide-choked passages that no foreign admiral can read. Wake the first keels, name the hidden anchorages, and let Khuresh breathe through its coast."
 khuresh_reef_pilots_weird_waves_title:0 "Reef Pilots of the Waves"
 khuresh_reef_pilots_weird_waves_desc:0 "The Weird Waves punish captains who trust straight lines, clean charts, and stars unhidden by jungle mist. License pilots who steer by reef-memory, fear, drowned offerings, and things seen under moonless water."
 khuresh_nocthyrions_black_wake_title:0 "Nocthyrion's Black Wake"
 khuresh_nocthyrions_black_wake_desc:0 "Nocthyrion's old curse still blackens the stories told along Khuresh's coast and among the island colonies beyond it. Turn that wake from warning into weapon, and make sailors repeat our terror as navigation."
 khuresh_sea_terror_oaths_title:0 "Sea-Terror Oaths"
 khuresh_sea_terror_oaths_desc:0 "Foreign captains call the eastern coast dangerous because they lack better words for reefs, masks, and vanished crews. Make terror contractual, priced, and enforceable through oaths that bind pilots, raiders, and port brokers."
 khuresh_eastern_tide_maps_title:0 "Eastern Tide Maps"
 khuresh_eastern_tide_maps_desc:0 "The eastern tide carries Nipponese rumor, island smoke, clan banners, and the scent of disciplined violence. Map the waters and the whispers together so every current points toward a useful shore."
 khuresh_wake_raiders_nippon_title:0 "Wake-Raiders of Nippon"
 khuresh_wake_raiders_nippon_desc:0 "Nippon's shore is disciplined, haunted, and fractured beneath formal banners, castle towns, and daimyo pride. Send wake-raiders to test the watch posts, frighten the fishing ports, and find the cracks between rival lords."
 khuresh_black_sails_eastern_sea_title:0 "Black Sails in the Eastern Sea"
 khuresh_black_sails_eastern_sea_desc:0 "Nippon's castles watch their own rivals as much as the sea, and every daimyo fears a neighbor's treachery more than a distant storm. Put black sails on the horizon and make every inland quarrel glance eastward."
 khuresh_shoguns_shore_in_dread_title:0 "Shogun's Shore in Dread"
 khuresh_shoguns_shore_in_dread_desc:0 "The Shogun's shore believes discipline, sword-seals, and ordered castles can master fear. Send masks, raiders, false treaties, and night landings that arrive like knives in the tide."
 khuresh_nippons_haunted_ports_title:0 "Nippon's Haunted Ports"
 khuresh_nippons_haunted_ports_desc:0 "Nippon's haunted ports can become eastern mouths for Khuresh, speaking through merchant guilds, frightened harbor guards, and clan envoys who have learned caution. Make them speak in root-shadow, tribute, and black-water law."

 khuresh_ind_game_trails_mod:0 "Indish Game-Trails"
 desc_khuresh_ind_game_trails_mod:0 "Mapped trails let Khureshi agents move through the western jungle with fewer guesses and fewer wasted offerings."
 khuresh_jungle_toll_knives_mod:0 "Jungle Toll Knives"
 desc_khuresh_jungle_toll_knives_mod:0 "Road threats, shrine tolls, and knives in the leaves now serve a single predatory accounting."
 khuresh_venom_roads_counted_mod:0 "Venom Roads Counted"
 desc_khuresh_venom_roads_counted_mod:0 "The venom roads no longer enrich only local monsters. Their danger has become revenue."
 khuresh_unite_north_canopy_mod:0 "Northern Courts Bound"
 desc_khuresh_unite_north_canopy_mod:0 "Northern nobles, shrine-speakers, and predator courts have been made to answer central rite."
 khuresh_unite_south_canopy_mod:0 "Southern Feuds Stilled"
 desc_khuresh_unite_south_canopy_mod:0 "Southern feuds have been pulled beneath central authority and made less dangerous to the realm."
 khuresh_indish_border_broken_mod:0 "Indish Border Broken"
 desc_khuresh_indish_border_broken_mod:0 "The first western campaigns have taught our armies to carry jungle fear into Ind."
 khuresh_ind_bows_green_mod:0 "Ind Bows to the Green"
 desc_khuresh_ind_bows_green_mod:0 "Indish rulers have learned to phrase fear as courtesy, tribute, and treaty."
 khuresh_indish_heart_blood_mod:0 "Indish Heart-Blood Compact"
 desc_khuresh_indish_heart_blood_mod:0 "Temple wealth, spice revenue, and river dues now feed Khuresh's appetite."
 khuresh_three_frontiers_mod:0 "Four Frontiers Coiled"
 desc_khuresh_three_frontiers_mod:0 "Ind, Cathay, and Nippon have all been folded into the logic of Khureshi expansion."
 khuresh_canopy_courts_mod:0 "Canopy Courts Summoned"
 desc_khuresh_canopy_courts_mod:0 "The first canopy courts now know whose envoys must be answered."
 khuresh_hostages_vines_mod:0 "Hostages Under Vines"
 desc_khuresh_hostages_vines_mod:0 "Hostages and oaths beneath the vines make subject defiance harder to sustain."
 khuresh_blood_tithe_muster_mod:0 "Blood-Tithe Muster"
 desc_khuresh_blood_tithe_muster_mod:0 "Tribute is now counted in bodies, weapons, and blood."
 khuresh_thorn_forts_mod:0 "Thorn-Forts"
 desc_khuresh_thorn_forts_mod:0 "Thorn-forts make the interior roads defensible without making them tame."
 khuresh_feast_rival_courts_mod:0 "Feast of Rival Courts"
 desc_khuresh_feast_rival_courts_mod:0 "Rival courts still scheme, but the stage and the feast are ours."
 khuresh_one_jungle_central_mod:0 "One Jungle by Hostage Law"
 desc_khuresh_one_jungle_central_mod:0 "The jungle is held through hostages, orders, and central command."
 khuresh_one_jungle_blood_mod:0 "One Jungle by Blood Court"
 desc_khuresh_one_jungle_blood_mod:0 "Public sacrifice makes unity visible to every court that might forget it."
 khuresh_one_jungle_masks_mod:0 "One Jungle by Masks"
 desc_khuresh_one_jungle_masks_mod:0 "Masks, whispers, and veiled pacts bind the jungle without asking it to become simple."
 khuresh_coils_complete_mod:0 "Khuresh Coils Complete"
 desc_khuresh_coils_complete_mod:0 "Khuresh is no longer merely a rumor on foreign maps. It has become a realm with teeth."
 khuresh_underroot_warrens_mod:0 "Underroot Warrens Sealed"
 desc_khuresh_underroot_warrens_mod:0 "Sealed warrens and watched passages make treachery below the roots easier to catch."
 khuresh_feral_law_mod:0 "Feral Law of the Before"
 desc_khuresh_feral_law_mod:0 "Our law is old, hungry, and difficult to uproot."
 khuresh_first_root_whisper_mod:0 "First Root-Whisper"
 desc_khuresh_first_root_whisper_mod:0 "The court has learned to listen for truths moving below speech."
 khuresh_root_dream_interpreters_mod:0 "Root-Dream Interpreters"
 desc_khuresh_root_dream_interpreters_mod:0 "Interpreters of bark, fever, and fang make ancient visions useful."
 khuresh_older_than_plaques_mod:0 "Older Than Plaques"
 desc_khuresh_older_than_plaques_mod:0 "The realm now studies powers that predate the Old Ones and their ordered ruins."
 khuresh_progenitor_root_sign:0 "Progenitor Root-Sign"
 desc_khuresh_progenitor_root_sign:0 "This province bears the first confirmed sign of the Progenitor Tree's buried root-memory."
 khuresh_root_shrine_site:0 "Root-Shrine Site"
 desc_khuresh_root_shrine_site:0 "Stones, offerings, and keepers mark this grove as a shrine to something older than the known gods."
 khuresh_grove_concealed_mod:0 "Concealed Progenitor Grove"
 desc_khuresh_grove_concealed_mod:0 "False paths and death stories hide the Progenitor grove from outsiders."
 khuresh_grove_fed_mod:0 "Fed Progenitor Grove"
 desc_khuresh_grove_fed_mod:0 "The grove is fed enough blood, power, and attention to strengthen the realm's recoveries."
 khuresh_grove_monumentalized_mod:0 "Monumentalized Progenitor Grove"
 desc_khuresh_grove_monumentalized_mod:0 "The grove has been marked with public stones and great works."
 khuresh_root_shrine_mod:0 "Root-Shrine Rites"
 desc_khuresh_root_shrine_mod:0 "The first root-shrine gives the realm a terrifying spiritual center."
 khuresh_oldest_soil_mod:0 "Oldest Soil Fed"
 desc_khuresh_oldest_soil_mod:0 "The oldest soil has been woken with power, blood, and careful fear."
 khuresh_living_rings_mod:0 "Living Ring Histories"
 desc_khuresh_living_rings_mod:0 "The realm reads living growth as a record older than stone."
 khuresh_name_progenitor_mod:0 "Named the Progenitor"
 desc_khuresh_name_progenitor_mod:0 "The Progenitor Tree is no longer only omen and fever. It has a name in court."
 khuresh_root_sap_reservoirs_mod:0 "Root-Sap Reservoirs"
 desc_khuresh_root_sap_reservoirs_mod:0 "Sap, offerings, and ritual stores help the realm recover from war."
 khuresh_grove_stone_altars_mod:0 "Grove Stone Altars"
 desc_khuresh_grove_stone_altars_mod:0 "Stone altars translate root-hunger into public rite."
 khuresh_world_root_cartographers_mod:0 "World-Root Cartographers"
 desc_khuresh_world_root_cartographers_mod:0 "Cartographers follow impossible root-paths under sea, mountain, and empire."
 khuresh_twin_world_mod:0 "Dream of the Western Twin"
 desc_khuresh_twin_world_mod:0 "The western dreams point toward a twin of the Progenitor Tree."
 khuresh_seed_first_canopy_mod:0 "Seed of the First Canopy"
 desc_khuresh_seed_first_canopy_mod:0 "The first canopy's seed has made development feel like ritual growth."
 khuresh_gnawed_underroot_mod:0 "Gnawed Underroot"
 desc_khuresh_gnawed_underroot_mod:0 "The root-system is real, and its bite-marks lead toward Skaven corruption."
 khuresh_root_wound_burn_mod:0 "Root-Wound Burned"
 desc_khuresh_root_wound_burn_mod:0 "The Skavenblight wound is answered with war and flame."
 khuresh_root_wound_bind_mod:0 "Root-Wound Bound"
 desc_khuresh_root_wound_bind_mod:0 "The Skavenblight wound is bound beneath root-law."
 khuresh_root_wound_tap_mod:0 "Root-Wound Tapped"
 desc_khuresh_root_wound_tap_mod:0 "The poison of the root-wound is studied with careful cruelty."
 khuresh_oak_ages_ultimate_mod:0 "Roots Before Time"
 desc_khuresh_oak_ages_ultimate_mod:0 "The Oak of Ages and the Progenitor Tree are joined through conquest, root-law, and primal memory."
 khuresh_watch_jade_road_mod:0 "Watched Jade Road"
 desc_khuresh_watch_jade_road_mod:0 "Cathayan protocol is easier to bend once its road-watchers are known."
 khuresh_jade_envoys_fear_mod:0 "Jade Envoys in Fear"
 desc_khuresh_jade_envoys_fear_mod:0 "Cathayan envoys have learned to respect veiled Khureshi ceremony."
 khuresh_probe_cathay_scarps_mod:0 "Cathayan Scarps Probed"
 desc_khuresh_probe_cathay_scarps_mod:0 "The southern scarps have taught our garrisons how to hold difficult approaches."
 khuresh_cathay_wards_mod:0 "Cathayan Wards Taken"
 desc_khuresh_cathay_wards_mod:0 "Cathay's old defenses now strengthen Khureshi frontier doctrine."
 khuresh_dragon_ministers_unmasked_mod:0 "Dragons Unmasked"
 desc_khuresh_dragon_ministers_unmasked_mod:0 "Jade seals and court smiles hide less from us than they once did."
 khuresh_dragon_court_humbled_mod:0 "Dragon-Court Humbled"
 desc_khuresh_dragon_court_humbled_mod:0 "Ordered heaven has been made to acknowledge humid, ancient fear."
 khuresh_follow_vermin_tunnels_mod:0 "Vermin Tunnels Followed"
 desc_khuresh_follow_vermin_tunnels_mod:0 "Our forces move faster through paths the Skaven thought were theirs alone."
 khuresh_burn_rat_nest_mod:0 "Rat-Nest Below Broken"
 desc_khuresh_burn_rat_nest_mod:0 "The Skavenblight nest has been broken, and our armies carry that lesson forward."
 khuresh_mangrove_keels_mod:0 "Mangrove Keels"
 desc_khuresh_mangrove_keels_mod:0 "The first mangrove keels give Khuresh a public claim on its hidden waters."
 khuresh_reef_pilots_mod:0 "Weird Wave Pilots"
 desc_khuresh_reef_pilots_mod:0 "Reef pilots steer by fear, memory, and currents outsiders cannot name."
 khuresh_nocthyrion_wake_mod:0 "Nocthyrion's Black Wake"
 desc_khuresh_nocthyrion_wake_mod:0 "Nocthyrion's old curse has been folded into Khureshi intrigue."
 khuresh_sea_terror_oaths_mod:0 "Sea-Terror Oaths"
 desc_khuresh_sea_terror_oaths_mod:0 "Foreign captains now treat Khureshi sea fear as a contractual fact."
 khuresh_eastern_tide_maps_mod:0 "Eastern Tide Maps"
 desc_khuresh_eastern_tide_maps_mod:0 "Nipponese smoke, island currents, and eastern rumors now have places on our maps."
 khuresh_wake_raiders_nippon_mod:0 "Wake-Raiders of Nippon"
 desc_khuresh_wake_raiders_nippon_mod:0 "Wake-raiders have learned where Nippon's disciplined shore cracks."
 khuresh_black_sails_eastern_mod:0 "Black Sails in the Eastern Sea"
 desc_khuresh_black_sails_eastern_mod:0 "Black sails make Nippon's castles watch the horizon."
 khuresh_shogun_shore_dread_mod:0 "Shogun's Shore in Dread"
