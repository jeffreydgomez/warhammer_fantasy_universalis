l_english:

 war_mechanic_flavor.1.t:0 "The Ledgers Obey"
 war_mechanic_flavor.1.d:0 "A routine audit reveals that several offices have been reporting to one another instead of to the central authority. Once the confusion is untangled, orders begin moving through the capital with a speed that surprises even their authors.\n\nThe reform is not dramatic, but everyone feels it. Petitions are answered, courtiers wait their turn, and the court remembers that its purpose is to rule."
 war_mechanic_flavor.1.a:0 "Make every office answer upward."
 war_mechanic_flavor.1.b:0 "Settle the most urgent confusion first."

 war_mechanic_flavor.2.t:0 "A Court Divided"
 war_mechanic_flavor.2.d:0 "Two offices issue contrary orders on the same morning, and both claim the ruler approved them. By sunset, lesser officials are choosing sides, slowing every petition that passes through the palace.\n\nNo open rebellion follows, only friction. The court still bows, but it no longer moves as one body."
 war_mechanic_flavor.2.a:0 "The quarrel spreads through the court."
 war_mechanic_flavor.2.b:0 "Contain the damage quietly."

 war_mechanic_flavor.3.t:0 "The Question of Hands"
 war_mechanic_flavor.3.d:0 "A minor dispute over seals, signatures, and precedence becomes a useful test of how much authority the center should hold. Some advisors argue that command must be drawn inward, while others warn that a looser court will breathe more easily.\n\nEither choice can be defended. What matters is that the court notices where the ruler places trust."
 war_mechanic_flavor.3.a:0 "Pull authority toward the center."
 war_mechanic_flavor.3.b:0 "Let the court breathe."

 war_mechanic_flavor.4.t:0 "The Counted Dead"
 war_mechanic_flavor.4.d:0 "Record keepers in the aftermath of recent violence have found that many bodies were never entered into the official tallies. Once the missing carts are followed and the pits are opened, the stores prove larger than expected.\n\nThe discovery is unpleasant, but practical minds do not waste unpleasant things. The dead can still serve the needs of the state."
 war_mechanic_flavor.4.a:0 "Add every recovered body to the stores."
 war_mechanic_flavor.4.b:0 "Take only what can be secured quickly."

 war_mechanic_flavor.5.t:0 "Spoiled Pits"
 war_mechanic_flavor.5.d:0 "A section of the corpse stores has been badly kept. Floodwater, thieves, and negligent guards have ruined what should have been useful material.\n\nThe loss is not glorious enough for songs or terrible enough for panic. It is simply waste, and waste is a kind of defeat.\n\nThe keepers swear it will not happen again. Their promises still smell of damp earth."
 war_mechanic_flavor.5.a:0 "Write off the ruined section."
 war_mechanic_flavor.5.b:0 "Salvage what the keepers can."

 war_mechanic_flavor.6.t:0 "A Question of Preservation"
 war_mechanic_flavor.6.d:0 "The keepers of the corpse stores disagree over whether to concentrate bodies in guarded pits or disperse them in smaller caches. Each plan has a logic, and each carries a different risk.\n\nThe decision will not change the realm by itself. It will, however, decide what sort of reserve waits beneath the soil."
 war_mechanic_flavor.6.a:0 "Fill the central pits."
 war_mechanic_flavor.6.b:0 "Scatter smaller caches."

 war_mechanic_flavor.7.t:0 "The Useful Stranger"
 war_mechanic_flavor.7.d:0 "A group of newcomers arrives with unfamiliar habits and immediately solves a problem that local officials had learned to ignore. Their methods are strange, but the results are difficult to deny.\n\nThe episode spreads through taverns, markets, and council chambers. Difference looks less like a burden when it carries a tool nobody else remembered to bring."
 war_mechanic_flavor.7.a:0 "Hold them up as proof of our strength."
 war_mechanic_flavor.7.b:0 "Let the lesson spread at its own pace."

 war_mechanic_flavor.8.t:0 "Old Insults Repeated"
 war_mechanic_flavor.8.d:0 "A public quarrel between local notables and a minority community turns uglier than anyone expected. Words that should have died in private are repeated in the street, and old suspicions return with them.\n\nThe damage is not beyond repair. Still, the realm feels narrower for a time, as if every door has been closed a little harder."
 war_mechanic_flavor.8.a:0 "The old insults return."
 war_mechanic_flavor.8.b:0 "Answer the insult before it spreads."

 war_mechanic_flavor.9.t:0 "Customs at the Gate"
 war_mechanic_flavor.9.d:0 "Officials ask whether new arrivals should be made to follow local forms at once or be allowed to keep their own habits while they settle. Merchants, clerks, soldiers, and neighbors all offer opinions, most of them confident and incomplete.\n\nThe choice will shape the tone of the realm. It can welcome difference openly, or ask difference to move more quietly."
 war_mechanic_flavor.9.a:0 "Make room for their customs."
 war_mechanic_flavor.9.b:0 "Insist on common forms."

 war_mechanic_flavor.10.t:0 "Full Granaries"
 war_mechanic_flavor.10.d:0 "Inspectors sent to count the realm's food stores return with better news than expected. Several districts have overpaid in grain, and the surplus has survived the road.\n\nThe people will not sing about a well-kept granary, but they will remember it when winter bites. Quiet abundance is still abundance."
 war_mechanic_flavor.10.a:0 "Seal the surplus in royal stores."
 war_mechanic_flavor.10.b:0 "Keep only the most reliable grain."

 war_mechanic_flavor.11.t:0 "Rot in the Lower Bins"
 war_mechanic_flavor.11.d:0 "A storehouse master confesses that several lower bins were packed too wet and opened too late. The grain within has spoiled, and the smell is already proof enough.\n\nNo enemy did this. Carelessness, haste, and bad counting have eaten what should have fed the realm."
 war_mechanic_flavor.11.a:0 "The spoiled stores are lost."
 war_mechanic_flavor.11.b:0 "Save what can still be milled."

 war_mechanic_flavor.12.t:0 "Bread for Today or Tomorrow"
 war_mechanic_flavor.12.d:0 "A good local harvest raises a familiar argument. Some want the surplus distributed now to calm prices, while others insist it should be locked away against harder years.\n\nBoth sides can point to hungry mouths. The only question is whether the realm fears the present or the future more."
 war_mechanic_flavor.12.a:0 "Store it for harder years."
 war_mechanic_flavor.12.b:0 "Release it before prices rise."

 war_mechanic_flavor.13.t:0 "Clear Priorities"
 war_mechanic_flavor.13.d:0 "Reports from the provinces and the frontier arrive together, and for once they do not contradict each other. The realm has enough attention to choose a direction deliberately instead of stumbling into one.\n\nSome advisors want roads, courts, and markets strengthened. Others point to borders, musters, and the wider world.\n\nThe clarity itself is a rare resource. For a little while, even rivals speak as if they share a map."
 war_mechanic_flavor.13.a:0 "Look beyond the borders."
 war_mechanic_flavor.13.b:0 "Tend the realm within."

 war_mechanic_flavor.14.t:0 "Attention Splinters"
 war_mechanic_flavor.14.d:0 "Every councilor agrees that the state must focus, but nobody agrees where. Petitions from within the realm compete with warnings from beyond it, and the day ends with more urgency than decision.\n\nA choice must still be made. The realm can turn inward to steady itself, or outward to meet pressure before pressure arrives."
 war_mechanic_flavor.14.a:0 "The outside danger wins our attention."
 war_mechanic_flavor.14.b:0 "Internal strain pulls us back."

 war_mechanic_flavor.15.t:0 "The Balance of Eyes"
 war_mechanic_flavor.15.d:0 "The ruler asks a simple question and receives a complicated answer: should the state watch its own foundations or the lands beyond its borders? Both answers are true in different seasons.\n\nThe debate is less a crisis than a compass. Wherever the court looks, effort will follow."
 war_mechanic_flavor.15.a:0 "Set the gaze outward."
 war_mechanic_flavor.15.b:0 "Set the gaze inward."

 war_mechanic_flavor.16.t:0 "Drill Without Order"
 war_mechanic_flavor.16.d:0 "A local commander begins drilling troops before formal instructions arrive. What might have been insubordination becomes a model of readiness when the results are seen in the yard.\n\nThe lesson spreads quickly. A realm that waits for perfect orders may find its enemies already moving."
 war_mechanic_flavor.16.a:0 "Make the drill a model for all."
 war_mechanic_flavor.16.b:0 "Reward the commander, then proceed carefully."

 war_mechanic_flavor.17.t:0 "Rust on the Muster"
 war_mechanic_flavor.17.d:0 "A surprise muster reveals missing kit, late captains, and soldiers who know the road better than the drill yard. Nothing collapses, but the weakness is visible.\n\nThe realm has called itself ready too often. Readiness, it seems, must be proven more frequently than it is proclaimed."
 war_mechanic_flavor.17.a:0 "The muster exposes our softness."
 war_mechanic_flavor.17.b:0 "Repair the worst failures first."

 war_mechanic_flavor.18.t:0 "The Shape of Readiness"
 war_mechanic_flavor.18.d:0 "Officers disagree over whether discipline is best hardened through constant drill or preserved by sparing the people from endless musters. Both arguments have veterans behind them.\n\nThe decision is not merely military. It tells the realm how much of daily life should bend toward war."
 war_mechanic_flavor.18.a:0 "Drill them harder."
 war_mechanic_flavor.18.b:0 "Ease the burden for now."

 war_mechanic_flavor.19.t:0 "A Rival Proves Useful"
 war_mechanic_flavor.19.d:0 "An ambitious subordinate challenges an established superior and, to the court's surprise, wins without breaking the machinery around them. The loser is humiliated, but the realm gains a sharper tool.\n\nWhispers follow the victory. Some hear danger in them; others hear the sound of talent clawing upward."
 war_mechanic_flavor.19.a:0 "Let the useful rival rise."
 war_mechanic_flavor.19.b:0 "Reward talent, but bind it tightly."

 war_mechanic_flavor.20.t:0 "Contenders Without Merit"
 war_mechanic_flavor.20.d:0 "A swarm of minor rivals mistakes noise for strength. They accuse, posture, and threaten, but none has the skill to claim what they disturb.\n\nThe struggle produces no champion this time. It only leaves resentment, broken routines, and a bitter taste in the halls of power.\n\nLessons are drawn from the failure. Ambition without proof begins to look smaller."
 war_mechanic_flavor.20.a:0 "Let the fools exhaust themselves."
 war_mechanic_flavor.20.b:0 "Cut the quarrel short."

 war_mechanic_flavor.21.t:0 "A Challenge at Court"
 war_mechanic_flavor.21.d:0 "A public challenge forces the court to decide whether ambition should be answered with punishment or allowed to test the hierarchy. The old guard wants quiet obedience, while younger climbers watch closely.\n\nEither answer will teach a lesson. It will show whether order protects rank, or rank must keep proving itself."
 war_mechanic_flavor.21.a:0 "Let the challenge proceed."
 war_mechanic_flavor.21.b:0 "Smother the challenge."

 war_mechanic_flavor.22.t:0 "A Better Method"
 war_mechanic_flavor.22.d:0 "A foreman, clerk, or village head proposes a small change to the way work is counted and assigned. The idea looks dull until the first reports show fewer wasted days and fewer idle hands.\n\nNo monument will be raised to the new method. That may be its virtue: useful habits do not need to be beautiful."
 war_mechanic_flavor.22.a:0 "Apply the method everywhere useful."
 war_mechanic_flavor.22.b:0 "Test it in the busiest districts first."

 war_mechanic_flavor.23.t:0 "Idle Hands, Full Excuses"
 war_mechanic_flavor.23.d:0 "A survey of workshops and fields finds too many people waiting on missing tools, unclear orders, or someone else's permission. Everyone has an explanation, and none of them produces anything.\n\nThe loss is measured in days rather than disasters. Enough lost days, however, become a disaster of their own."
 war_mechanic_flavor.23.a:0 "The waste is worse than reported."
 war_mechanic_flavor.23.b:0 "Correct the worst delays."

 war_mechanic_flavor.24.t:0 "The Pace of Labor"
 war_mechanic_flavor.24.d:0 "Officials debate whether to press labor harder now or slow the pace to preserve tools, animals, and goodwill. The practical answer depends on which shortage one fears most.\n\nThe realm can become more productive by tightening its habits. It can also spend that discipline, if immediate relief matters more."
 war_mechanic_flavor.24.a:0 "Tighten the work rhythm."
 war_mechanic_flavor.24.b:0 "Let the pressure ease."

 war_mechanic_flavor.25.t:0 "A Graceful Settlement"
 war_mechanic_flavor.25.d:0 "A dispute that might have become public embarrassment is settled with careful words, measured gifts, and enough dignity for every side to pretend it won. The court notices how much power can hide inside courtesy.\n\nReputation grows most easily when nobody looks desperate for it. Today, the realm appears composed."
 war_mechanic_flavor.25.a:0 "Make this our standard of conduct."
 war_mechanic_flavor.25.b:0 "Accept the praise without overreaching."

 war_mechanic_flavor.26.t:0 "A Vulgar Scene"
 war_mechanic_flavor.26.d:0 "A ceremony meant to display dignity collapses into insult, haste, and whispered mockery. The damage is small, but it lands exactly where refinement is thinnest: in appearances.\n\nThose who saw it will retell it with embellishments. A polished reputation can survive many things, but not endless laughter."
 war_mechanic_flavor.26.a:0 "The embarrassment spreads."
 war_mechanic_flavor.26.b:0 "Limit the gossip quickly."

 war_mechanic_flavor.27.t:0 "The Price of Polish"
 war_mechanic_flavor.27.d:0 "Artists, diplomats, and senior courtiers ask for resources to improve the realm's public face. Practical officials object that reputation is only useful when it can be spent.\n\nThe court must decide whether to cultivate admiration or draw upon it. Both choices reveal what refinement is for.\n\nNeither course is foolish. The realm only has to admit which kind of respect it needs."
 war_mechanic_flavor.27.a:0 "Invest in polish."
 war_mechanic_flavor.27.b:0 "Spend the reputation we have."
