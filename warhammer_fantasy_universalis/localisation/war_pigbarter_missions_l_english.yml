l_english:
 swine_stallholders_title:0 "Stallholders' Charter"
 swine_stallholders_desc:0 "Pigbarter trades beneath leaking roofs and disputed toll boards. Build a proper market and enlarge the city so its stallholders can bargain under a common charter."
 swine_honest_weights_title:0 "Honest Weights"
 swine_honest_weights_desc:0 "Our charter is worthless if every quay weighs silver differently. Make the River Ruin our home market and establish a quarter share of its trade."
 swine_upper_ruin_title:0 "Factors of the Upper Ruin"
 swine_upper_ruin_desc:0 "River cargo is bought long before it reaches Pigbarter. Send factors upriver and maintain enough light ships to protect their contracts."
 swine_ruin_customs_reward:0 "River Ruin Customs"
 desc_swine_ruin_customs_reward:0 "The settlement of River Ruin Customs strengthens our merchant republic."
 swine_ruin_customs_title:0 "Customs of the River Ruin"
 swine_ruin_customs_desc:0 "Too much of the river trade passes through private toll stations. Bring half its commerce under our factors and make Pigbarter a port worthy of its customs house."
 swine_merchant_appeals_title:0 "Courts of Appeal"
 swine_merchant_appeals_desc:0 "A disputed cargo can provoke a feud that closes the river. Establish courts beside the markets in five provinces so merchants can appeal to a common commercial law."
 swine_grand_exchange_title:0 "The Grand River Exchange"
 swine_grand_exchange_desc:0 "A single crowded quay cannot handle an imperial volume of business. Upgrade a second exchange on the River Ruin and bring three fifths of its commerce into our network."
 swine_western_ind_reward:0 "Western Ind Factors"
 desc_swine_western_ind_reward:0 "The settlement of Western Ind Factors strengthens our merchant republic."
 swine_western_ind_title:0 "Western Ind Contracts"
 swine_western_ind_desc:0 "The River Ruin has made us wealthy enough to seek cargo abroad. Win a share of western Ind and maintain transports to supply our factors."
 swine_eastern_exchange_reward:0 "Eastern Trading Houses"
 desc_swine_eastern_exchange_reward:0 "The settlement of Eastern Trading Houses strengthens our merchant republic."
 swine_eastern_exchange_title:0 "Eastern Colonies"
 swine_eastern_exchange_desc:0 "The eastern sea routes are crowded with merchants who have never heard our charter read. Establish overseas holdings and earn a substantial place in their exchanges."
 swine_river_circuit_reward:0 "Imperial River Circuit"
 desc_swine_river_circuit_reward:0 "The settlement of Imperial River Circuit strengthens our merchant republic."
 swine_river_circuit_title:0 "The Imperial River Circuit"
 swine_river_circuit_desc:0 "Foreign ventures must strengthen the river that sustains the empire. Dominate the River Ruin and secure the Ivory Road traffic that feeds its markets."
 swine_world_counting_house_reward:0 "Counting Houses of the World"
 desc_swine_world_counting_house_reward:0 "The settlement of Counting Houses of the World strengthens our merchant republic."
 swine_world_counting_house_title:0 "The World's Markets"
 swine_world_counting_house_desc:0 "Our bills of exchange now travel farther than most kings. Secure a near monopoly on the River Ruin and build the great exchanges needed to finance world commerce."
 swine_slipways_title:0 "Ruinmouth Slipways"
 swine_slipways_desc:0 "Mud banks and makeshift jetties leave our hulls rotting between voyages. Build two proper docks to give the river fleet a dependable base."
 swine_paid_to_sail_title:0 "Paid to Keep Sailing"
 swine_paid_to_sail_desc:0 "A dockyard alone does not persuade sailors to face the Scalded Delta. Put a substantial fleet in commission and hire an admiral who can bring it home."
 swine_escort_trade_reward:0 "Convoy Escorts"
 desc_swine_escort_trade_reward:0 "The settlement of Convoy Escorts strengthens our merchant republic."
 swine_escort_trade_title:0 "Trading Under Escort"
 swine_escort_trade_desc:0 "Our contracts multiply faster than our captains can protect them. Establish a practiced light-ship escort service along the River Ruin."
 swine_seaborne_supply_title:0 "Seaborne Supply"
 swine_seaborne_supply_desc:0 "Guards, provisions and replacement crews must arrive before a stranded factor loses his nerve. Assemble a transport service within a fleet large enough to defend it."
 swine_navy_charter_title:0 "A Navy Worth Its Charter"
 swine_navy_charter_desc:0 "Our fleet can now carry the republic beyond its familiar waters. The council must decide whether its finest ships will lead merchant convoys or impose our terms in battle."
 swine_imperial_dockyards_reward:0 "Imperial Dockyards"
 desc_swine_imperial_dockyards_reward:0 "The settlement of Imperial Dockyards strengthens our merchant republic."
 swine_imperial_dockyards_title:0 "Imperial Dockyards"
 swine_imperial_dockyards_desc:0 "Our imperial charter promises markets beyond the known sea lanes. Build five shipyards so the council can commission explorers and dispatch permanent colonial expeditions."
 swine_soundings_title:0 "Soundings Past the Delta"
 swine_soundings_desc:0 "The imperial yards have given us the means to venture abroad. Establish a holding on another continent and support it with a fleet fit for long voyages."
 swine_navigation_school_title:0 "Navigation School"
 swine_navigation_school_desc:0 "Experience is scattered among captains who guard their charts like treasure. Bring proven naval officers or an expert advisor into a permanent school of navigation."
 swine_every_convoy_reward:0 "Imperial Convoy Stations"
 desc_swine_every_convoy_reward:0 "The settlement of Imperial Convoy Stations strengthens our merchant republic."
 swine_every_convoy_title:0 "Guard Every Convoy"
 swine_every_convoy_desc:0 "Our factors now trade beyond the reach of occasional patrols. Maintain a hundred ships and an experienced service capable of guarding every major convoy."
 swine_eastern_seas_reward:0 "Masters of the Eastern Seas"
 desc_swine_eastern_seas_reward:0 "The settlement of Masters of the Eastern Seas strengthens our merchant republic."
 swine_eastern_seas_title:0 "Mistress of the Eastern Seas"
 swine_eastern_seas_desc:0 "The counting houses can finance a fleet that no neighbour can ignore. Bring the navy to full strength and make its seamanship the envy of the eastern seas."
 swine_quay_council_title:0 "Elect the Quay Council"
 swine_quay_council_desc:0 "Pigbarter has many loud voices and too few decisions that survive the next market day. Earn the guilds a working council, or establish an equally capable civic administration."
 swine_stilt_peace_title:0 "Peace in the Stilt Streets"
 swine_stilt_peace_desc:0 "The council cannot settle accounts while every argument becomes a street battle. Restore stable rule and enough public confidence for its judgments to stand."
 swine_defensible_republic_reward:0 "A Worthy Republic "
 desc_swine_defensible_republic_reward:0 "The settlement of A Republic Worth Defending strengthens our merchant republic."
 swine_defensible_republic_title:0 "A Worthy Republic"
 swine_defensible_republic_desc:0 "Our neighbours still remember a muddy market town. Build a larger and more stable commonwealth that its citizens have good reason to defend."
 swine_company_charter_title:0 "The Company Charter"
 swine_company_charter_desc:0 "Our companies have grown beyond the customs that once restrained them. Write a charter that either brings their offices into the state or makes their foreign partnerships an instrument of policy."
 swine_fifty_provinces_title:0 "The Common Treasury"
 swine_fifty_provinces_desc:0 "The companies keep separate purses, but a wider republic needs money it can call its own. Build a steady public income and a common reserve before promising an imperial charter."
 swine_proclaim_empire_title:0 "Proclaim the Swinetrade"
 swine_proclaim_empire_desc:0 "The provinces and fleet now deserve a common imperial settlement. Proclaim the Swinetrade Empire through the formation decision and settle whether its charter serves one people or many."
 swine_government_contract_title:0 "Government by Contract"
 swine_government_contract_desc:0 "An imperial charter cannot be enforced from a single counting house. Extend the provincial court network to ten towns so the government can honour its contracts throughout the realm."
 swine_charter_real_reward:0 "The Charter Made Real"
 desc_swine_charter_real_reward:0 "The settlement of The Charter Made Real strengthens our merchant republic."
 swine_charter_real_title:0 "The Charter Made Real"
 swine_charter_real_desc:0 "Our founding choice cannot remain an elegant inscription. Make the common charter a reality through shared culture and faith, or through the secure acceptance of several peoples."
 swine_magistrates_title:0 "Salaried Magistrates"
 swine_magistrates_desc:0 "Private fees still tempt provincial judges to sell public justice. Retain expert administrators and sufficient republican confidence to place the magistracy on a reliable salary."
 swine_empire_pays_reward:0 "The Empire That Pays"
 desc_swine_empire_pays_reward:0 "The settlement of The Empire That Pays strengthens our merchant republic."
 swine_empire_pays_title:0 "The Empire That Pays"
 swine_empire_pays_desc:0 "Our neighbours have learned the value of keeping our contracts. Prove that the empire can meet its obligations without debt, factional disorder or a weakened republic."
 swine_golden_boar_reward:0 "The Golden Boar Rules"
 desc_swine_golden_boar_reward:0 "The settlement of The Golden Boar Rules Trade strengthens our merchant republic."
 swine_golden_boar_title:0 "The Golden Boar Rules"
 swine_golden_boar_desc:0 "Once the world came to Pigbarter to buy livestock and hire guards. Carry the golden boar into the ledgers of fifteen great markets, until our contracts shape the commerce of the world."
 swine_friends_title:0 "Strange Friends"
 swine_friends_desc:0 "Pigbarter survives because a living market is useful to its neighbours. Enlarge the town and cultivate two dependable allies before a stronger power decides otherwise."
 swine_vorag_title:0 "Contracts with Vorag"
 swine_vorag_desc:0 "Vorag commands the dead near routes our merchants cannot afford to ignore. Secure its stronghold and hinterland through conquest or a binding alliance, then decide how its commerce will be handled."
 swine_zharr_title:0 "Bargain with the Chorfs"
 swine_zharr_desc:0 "The furnaces of Zharr-Naggrund hunger for an outlet down the River Ruin. Settle the question of its power by controlling the city and surrounding plain or binding their ruler to a dependable alliance."
 swine_orcs_reward:0 "Orcs on the Payroll"
 desc_swine_orcs_reward:0 "The settlement of Orcs on the Payroll strengthens our merchant republic."
 swine_orcs_title:0 "Orcs on the Payroll"
 swine_orcs_desc:0 "A caravan guard is useful only if he is better paid than the raiders. Bind a substantial Greenskin realm to our interests or secure its Badlands approaches ourselves."
 swine_ogres_reward:0 "The Ogres' Share"
 desc_swine_ogres_reward:0 "The settlement of The Ogres' Share strengthens our merchant republic."
 swine_ogres_title:0 "Pay the Ogres' Share"
 swine_ogres_desc:0 "The Ogre kingdoms regard every caravan as a meal, a toll payment or an employment offer. Secure their mountain routes through a substantial alliance or dependable provincial control."
 swine_dragon_isles_reward:0 "Dragon Isles Anchorage Rights"
 desc_swine_dragon_isles_reward:0 "The settlement of Dragon Isles Anchorage Rights strengthens our merchant republic."
 swine_dragon_isles_title:0 "The Dragon Isles Settlement"
 swine_dragon_isles_desc:0 "The Dragon Isles guard sea lanes that imperial captains must learn to use. Secure ten island provinces or a durable alliance with an island power whose rulers can enforce our agreements."
 swine_treaty_brokers_title:0 "Treaty Brokers"
 swine_treaty_brokers_desc:0 "Our regional bargains have made Pigbarter a meeting place for envoys. Build a network of respected allies and a diplomatic service capable of keeping their interests aligned."
 swine_free_river_title:0 "The Free River Pact"
 swine_free_river_desc:0 "The river is safest when its greatest beneficiaries depend on one another. Combine decisive commercial power with three enduring alliances to give free navigation credible protectors."
 swine_darklands_settlement_reward:0 "The Darklands Settlement"
 desc_swine_darklands_settlement_reward:0 "The settlement of The Darklands Settlement strengthens our merchant republic."
 swine_darklands_settlement_title:0 "The Darklands Settlement"
 swine_darklands_settlement_desc:0 "The old bargains leave gaps where a new toll lord or raiding host can still close the roads. Bring every province of the Darklands under our rule, loyal subjects or trusted allied rulers, until the whole region has a stake in keeping trade alive."
 swine_unhunted_merchants_reward:0 "Protected by the Golden Boar"
 desc_swine_unhunted_merchants_reward:0 "The settlement of Protected by the Golden Boar strengthens our merchant republic."
 swine_unhunted_merchants_title:0 "No One Hunts Our Merchants"
 swine_unhunted_merchants_desc:0 "A merchant carrying our seal should be worth more alive than robbed. Entrench our commercial privileges and sustain four merchant offices so every hostile ruler must reckon with the trade they would lose."
 swine_fimdirach_reward:0 "The Ruinmouth Settlement"
 desc_swine_fimdirach_reward:0 "The settlement of The Ruinmouth Settlement strengthens our merchant republic."
 swine_fimdirach_title:0 "Secure the Ruinmouth"
 swine_fimdirach_desc:0 "Fimdirach controls the marshes south of Pigbarter and the mouth of the River Ruin. Secure the two key approaches and a lasting foothold in the Scalded Delta, through conquest or an alliance with its masters."
 swine_strix_title:0 "Strix Above the Streets"
 swine_strix_desc:0 "An agreement at the river mouth does not keep every raider away from our streets. Give the strix lookouts a trained garrison and professional military direction."
 swine_granaries_title:0 "Granaries of the Delta"
 swine_granaries_desc:0 "A crowded port is only one failed convoy away from hunger. Develop a prosperous grain or livestock estate in the delta to secure its provisions."
 swine_marshwardens_title:0 "The Marshwardens"
 swine_marshwardens_desc:0 "The river settlements need watch posts that can survive more than a sudden raid. Fortify two approaches and repair the devastation around them."
 swine_provincial_militia_title:0 "Provincial Militia"
 swine_provincial_militia_desc:0 "A widening frontier cannot depend on a handful of guards from Pigbarter. Organise the provincial levies through local obligations or a professional military office."
 swine_peace_dividend_reward:0 "The First Peace Dividend"
 desc_swine_peace_dividend_reward:0 "The settlement of The First Peace Dividend strengthens our merchant republic."
 swine_peace_dividend_title:0 "The First Peace Dividend"
 swine_peace_dividend_desc:0 "Our preparations should leave more than tax demands and empty granaries. Restore prosperity across six provinces and clear the debts of consolidation."
 swine_harbour_watch_title:0 "The Harbour Watch"
 swine_harbour_watch_desc:0 "Distant commerce attracts enemies who would rather burn a warehouse than negotiate. Build coastal defences in three ports to protect the empire while its fleets are abroad."
 swine_safe_roads_reward:0 "Roads Safe for Silver"
 desc_swine_safe_roads_reward:0 "The settlement of Roads Safe for Silver strengthens our merchant republic."
 swine_safe_roads_title:0 "Roads Safe for Silver"
 swine_safe_roads_desc:0 "Prosperity follows a road only when caravans can trust its markets and patrols. Develop five commercial towns where disorder and devastation no longer threaten ordinary business."
 swine_golden_peace_reward:0 "Peace of the Golden Boar"
 desc_swine_golden_peace_reward:0 "The settlement of Peace of the Golden Boar strengthens our merchant republic."
 swine_golden_peace_title:0 "Peace of the Golden Boar"
 swine_golden_peace_desc:0 "The empire must offer its inhabitants something better than a larger collection of tolls. Sustain prosperity across twenty provinces and bring quiet to every market we own on the River Ruin."
 war_swine_missions.1.t:0 "The Companies and the Commonwealth"
 war_swine_missions.1.d:0 "The companies that once rented muddy stalls now employ clerks in distant cities. Their charters overlap, their toll exemptions conflict, and every director claims that his privilege is indispensable to the republic. The quay council must decide what these private empires owe the public.\n\nSome delegates would bind the companies into a common provincial administration. Others argue that their foreign correspondents are worth more than another office in Pigbarter."
 war_swine_missions.1.a:0 "Bring their offices under the charter."
 swine_company_offices_reward:0 "Chartered Company Offices"
 desc_swine_company_offices_reward:0 "The settlement of Chartered Company Offices strengthens our merchant republic."
 war_swine_missions.1.b:0 "Give their foreign partners a seat at our table."
 swine_company_partners_reward:0 "Company Diplomacy"
 desc_swine_company_partners_reward:0 "The settlement of Company Diplomacy strengthens our merchant republic."
 war_swine_missions.2.t:0 "The Admiralty of the Golden Boar"
 war_swine_missions.2.d:0 "The captains have assembled beneath a new ensign, arguing over the purpose of the fleet that will carry it. Factors want escorts beside every valuable cargo, while fighting captains demand ships ready to force a passage through hostile waters.\n\nBoth parties know that the River Ruin is our livelihood. The council must choose which duty will shape the admiralty's training, appointments and accounts."
 war_swine_missions.2.a:0 "The convoys are the life of the republic."
 swine_merchant_admiralty_reward:0 "The Merchant Admiralty"
 desc_swine_merchant_admiralty_reward:0 "The settlement of The Merchant Admiralty strengthens our merchant republic."
 war_swine_missions.2.b:0 "Our contracts will sail behind our guns."
 swine_fighting_admiralty_reward:0 "The Fighting Admiralty"
 desc_swine_fighting_admiralty_reward:0 "The settlement of The Fighting Admiralty strengthens our merchant republic."
 war_swine_missions.3.t:0 "Accounts That Outlive Their Keepers"
 war_swine_missions.3.d:0 "The settlement around Vorag has opened routes that our merchants once marked with warnings. Its vaults contain goods whose former owners will never dispute a receipt, and its silent roads offer opportunities that respectable factors hesitate to discuss.\n\nThe council can authorise closely supervised commerce through these markets. It can instead spend its influence on protections for living travellers and clear rules for every agent who carries our seal. Both courses will require officials willing to work after sunset."
 war_swine_missions.3.a:0 "Every cargo will pass through an audited ledger."
 swine_vorag_accounts_reward:0 "The Vorag Accounts"
 desc_swine_vorag_accounts_reward:0 "The settlement of The Vorag Accounts strengthens our merchant republic."
 war_swine_missions.3.b:0 "Our protection must follow every living traveller."
 swine_living_travellers_reward:0 "The Living Travellers Charter"
 desc_swine_living_travellers_reward:0 "The settlement of The Living Travellers Charter strengthens our merchant republic."
 war_swine_missions.4.t:0 "The Furnace and the Quayside"
 war_swine_missions.4.d:0 "The settlement with Zharr-Naggrund has changed the arithmetic of the River Ruin. Furnace masters, merchants and dock officials now dispute who will profit from the cargo moving between the great industrial city and our ports.\n\nOur delegates propose two ways to use the agreement. One directs investment into workshops and commercial production; the other reserves its supplies for an expanded fleet. The council must decide which accounts to underwrite."
 war_swine_missions.4.a:0 "Supply the workshops of the republic."
 swine_furnace_contracts_reward:0 "Furnace Contracts"
 desc_swine_furnace_contracts_reward:0 "The settlement of Furnace Contracts strengthens our merchant republic."
 war_swine_missions.4.b:0 "Reserve the supplies for our dockyards."
 swine_furnace_fleet_reward:0 "The Furnace Fleet"
 desc_swine_furnace_fleet_reward:0 "The settlement of The Furnace Fleet strengthens our merchant republic."
 swine_fimdirach_settled_tt:0 "Control [2147.GetName], [2156.GetName] and at least 3 Scalded Delta provinces directly or through subjects below 50% liberty desire; OR ally the owner of [2147.GetName], which must hold at least 3 delta provinces, and secure friendly access to [2156.GetName]. Every allied owner must be independent, have at least 60 trust and 100 opinion of us."
 swine_vorag_settled_tt:0 "Control [2167.GetName] and at least 3 provinces of Vorag's original hinterland directly or through subjects below 50% liberty desire; OR ally the independent owner of [2167.GetName], which must hold at least 3 of those provinces and have 60 trust and 100 opinion of us."
 swine_zharr_settled_tt:0 "Control [810.GetName] and at least 5 Plain of Zharr provinces directly or through subjects below 50% liberty desire; OR ally the independent owner of [810.GetName], which must hold at least 5 provinces in that region and have 60 trust and 100 opinion of us."
 swine_orcs_settled_tt:0 "Control at least 5 Badlands provinces directly or through subjects below 50% liberty desire; OR ally an independent Greenskin country holding at least 5 Badlands provinces, with 60 trust and 100 opinion of us."
 swine_ogres_settled_tt:0 "Control at least 5 Mountains of Mourn provinces directly or through subjects below 50% liberty desire; OR ally an independent Ogre country holding at least 5 provinces in that region, with 60 trust and 100 opinion of us."
 swine_dragon_isles_settled_tt:0 "Control at least 10 Dragon Isles provinces directly or through subjects below 50% liberty desire; OR ally an independent country holding at least 10 provinces in that region, with 60 trust and 100 opinion of us."
 swine_stallholders_reward:0 "Chartered Stallholders"
 desc_swine_stallholders_reward:0 "Common contracts let stallholders build and repair their premises without quarrelling over every beam."
 swine_slipways_reward:0 "Ruinmouth Slipways"
 desc_swine_slipways_reward:0 "Standard slips and experienced timber crews keep new vessels moving from the yards to the river."
 swine_quay_council_reward:0 "The Quay Secretariat"
 desc_swine_quay_council_reward:0 "The elected council retains practical clerks who know the price of a cargo and the cost of a bad decree."
 swine_friends_reward:0 "Correspondents Beyond the Mire"
 desc_swine_friends_reward:0 "Friendly factors pass warnings between counting houses before hostile agents reach our quays."
 swine_honest_weights_reward:0 "The Common Measure"
 desc_swine_honest_weights_reward:0 "Recognised measures and inspected scales give our merchants confidence in the republic's commercial rules."
 swine_stilt_peace_reward:0 "Repaired Stilt Streets"
 desc_swine_stilt_peace_reward:0 "Neighbourhood work gangs restore broken walkways, roofs and wharves as soon as danger passes."
 swine_upper_ruin_reward:0 "The Upriver Factors"
 desc_swine_upper_ruin_reward:0 "Our factors maintain the contacts and stores needed to trade beyond familiar river landings."
 swine_paid_to_sail_reward:0 "Captains on Retainer"
 desc_swine_paid_to_sail_reward:0 "The republic offers dependable contracts to captains who can keep a convoy moving."
 swine_strix_reward:0 "The Strix Watch"
 desc_swine_strix_reward:0 "Falconer guards and their strix spot trouble before an angry crowd can seize a bridge or warehouse."
 swine_granaries_reward:0 "Delta Provisioning"
 desc_swine_granaries_reward:0 "Reliable grain and livestock supplies allow the river settlements to recover and prosper."
 swine_seaborne_supply_reward:0 "Standard Cargo Hulls"
 desc_swine_seaborne_supply_reward:0 "Shared hull designs and bulk purchases keep the republic's transport fleet affordable."
 swine_merchant_appeals_reward:0 "The Commercial Circuit Courts"
 desc_swine_merchant_appeals_reward:0 "Local courts settle cargo disputes beside the markets, reducing the expense of administering distant towns."
 swine_marshwardens_reward:0 "The Marshwardens"
 desc_swine_marshwardens_reward:0 "Watch posts recruit replacements from the settlements whose bridges and ferries they defend."
 swine_fifty_provinces_reward:0 "The Common Treasury"
 desc_swine_fifty_provinces_reward:0 "A common treasury audits the republic's receipts and keeps its silver accounts in order."
 swine_provincial_militia_reward:0 "Provincial Supply Rolls"
 desc_swine_provincial_militia_reward:0 "Local rolls identify the stores, carts and billets that provincial forces can call upon."
 swine_grand_exchange_reward:0 "Exchange Investment Board"
 desc_swine_grand_exchange_reward:0 "The exchange pools merchant subscriptions for larger and better-equipped centres of trade."
 swine_proclaim_empire_reward:0 "The Imperial Charter"
 desc_swine_proclaim_empire_reward:0 "The imperial charter carries useful practices and new knowledge between the republic's member towns."
 swine_government_contract_reward:0 "The Provincial Registry"
 desc_swine_government_contract_reward:0 "Permanent provincial offices make room for the obligations of a growing commercial empire."
 swine_soundings_reward:0 "Published Coastal Soundings"
 desc_swine_soundings_reward:0 "Soundings and coastal charts let captains carry settlement parties farther beyond familiar waters."
 swine_treaty_brokers_reward:0 "Brokers Across Beliefs"
 desc_swine_treaty_brokers_reward:0 "Our brokers judge a partner by the bargain offered, opening negotiations across religious divides."
 swine_harbour_watch_reward:0 "Protected Repair Berths"
 desc_swine_harbour_watch_reward:0 "Defended harbours shelter repair crews and their stores when damaged ships return from sea."
 swine_navigation_school_reward:0 "The Convoy Navigation School"
 desc_swine_navigation_school_reward:0 "Pilots turn the lessons of ordinary convoy service into practical instruction for the fleet."
 swine_magistrates_reward:0 "Salaried Magistrates"
 desc_swine_magistrates_reward:0 "Regular salaries give magistrates the time and independence to improve the republic's institutions."
 swine_free_river_reward:0 "The Free River Pact"
 desc_swine_free_river_reward:0 "Common river agreements let our factors collect commerce beyond the home exchange on better terms."
 swine_darklands_settled_tt:0 "Every province in the Darklands superregion must be owned by us, a subject below 50% liberty desire, or an independent ally with at least 60 trust and 100 opinion of us. Direct rule, loyal subjects and allied ownership may be mixed across the region."
