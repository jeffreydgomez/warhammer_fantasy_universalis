l_english:
 oreons_jungle_glade:0 "Oreon's Jungle Glade"
 oreons_jungle_glade_desc:0 "Far from Athel Loren, the Bowmen of Oreon keep watch over a sanctuary hidden beneath the southern jungle's canopy. Living halls rise among vast roots, waystones guard the approaches, and spirit-fruit groves sustain the scattered settlements. The Asrai tend these wonders through patient bargains with powers as hungry and ancient as the jungle itself.\n\nRestoring the glade binds its hidden paths and neighboring groves into a single defended homeland. Its gifts enrich the surrounding jungle, shelter its inhabitants, and gather its warriors beneath the branches. Elven stewards may renew the old compact, while Beastmen conquerors may profane the sanctuary and force its strength into the service of their herds. Its benefits require Elven or Beastfolk Administration and extend only through the Heart of the Jungle area."
