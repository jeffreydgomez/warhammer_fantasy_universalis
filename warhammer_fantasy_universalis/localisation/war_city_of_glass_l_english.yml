l_english:
 city_of_glass:0 "City of Glass"
 city_of_glass_desc:0 "Deep within Laurelorn, Tor Lithanel glitters beneath the forest canopy. Soul-gems set into its ancient elven buildings shelter the dead from Chaos, while the Silver Tower watches over the High Council's courts and enchanted orchards. The Library of Mournings preserves knowledge that human kingdoms have long forgotten.\n\nMaintaining the city strengthens the surrounding wards: its workshops sustain their wealth, its musters guard their paths, and its old protections shelter their settlements. Elven stewards may renew this inheritance; Beastmen conquerors may instead profane the sanctuaries and bend their bound power to the herd's dominion. The city's influence reaches only through the Laurelorn area, and its benefits require Elven or Beastfolk Administration."
