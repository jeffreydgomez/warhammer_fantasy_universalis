 STATE_HUSSARS_CREATED_REGIMENTS:0 "This will cost $MILAMOUNT|Y$ £mil£, and $NUM|Y$ Grail Knights will spawn in $PROV|Y$.\nDo you want to create a Grail Knights regiment?"
 ONLY_HUSSARS_MODIFIER:0 "§YAffects only Grail Knights Regiments§!"
 HUSSARS_LIMIT_CULTURE:0 "$PROVINCE$ is a $CULTURE$ province, so you cannot recruit Grail Knights Regiments here."
 
