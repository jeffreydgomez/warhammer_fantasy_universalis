 #Obsidian Guard#
 #obsidian guard#
 #Obsidian Guard#
 
 SAMURAI_NAME:0 "$HOME$'s $NUM$$ORDER$ Obsidian Guard Regiment"
 MODIFIER_ALLOWED_SAMURAI_FRACTION:0 "Obsidian Guard Force Limit"
 MODIFIER_LOCAL_HAS_SAMURAI:0 "Province Allows Obsidian Guard Infantry"
 SAMURAI_FORCELIMIT:0 "We can recruit up to $LIMIT|Y$ §GObsidian Guard§! owing to:\n$FLAMOUNT|Y$ from $PERC|%Y$ of our force-limit of $FL$:\n"
 SAMURAI_LIMIT_CULTURE:0 "$PROVINCE$ is a $CULTURE$ province, so can not recruit Obsidian Guard Infantry here."
 ADD_SAMURAI_SUB_UNIT_EFFECT:0 "Get '§GObsidian Guard§!' $UNIT$ in $WHERE|Y$."
 SAMURAI_DESC:0 "The Obsidian Guard are saurus warriors of the Dragon Isles bound to the blood-gong rather than to any one clan. They carry macanas edged with volcanic glass, heavy shields, and trophy masks marked with the names of dragons whose anger they claim to survive. The richest guards wear gem-studded armor and towering horned crests, not for elegance, but so enemies know which killers are coming.\nObsidian Guard can be recruited in owned provinces that belong to the §YDragon Isle Lizardmen§! culture, and the number of Obsidian Guard that can be raised is dependent on the development of those provinces."
 REGCAT_samurai:0 "Obsidian Guard"
 SAMURAI_REGIMENT:0 "Obsidian Guard Regiment\n$EFFECT$"
 HAVE_LESS_SAMURAI_THAN:0 "Have less Obsidian Guard than §Y$VALUE$§!.\n"
 samurai_modifier:0 "Obsidian Guard Hired"
 HAVE_AT_LEAST_SAMURAI_THAN:0 "Have at least §Y$VALUE$§! Obsidian Guard.\n"
 
 
 HUSSARS_NAME:0 "$HOME$'s $NUM$$ORDER$ Grail Knights"
 MODIFIER_HAS_HUSSARS:0 "Allows Grail Knights"
 HUSSARS_CANT_HAVE:0 "Your nation cannot raise Grail Knights."
 HUSSARS_DESC:1 "A Grail Knight, is a member of what is arguably the most devastating cavalry force in the Old World. Grail Knights are considered living saints and even demigods by their fellow Bretonnians, infused with the divine power of their kingdom's patron goddess, the Lady of the Lake. Capable of feats far beyond those of normal cavalry but often requiring vastly greater upkeep, they are few in number but legendary in their impact on a battle.\n\nThe number of §YGrail Knights§! regiments is calculated based on the development of provinces with accepted cultures at a rate of 1 unit per 100 development."
 REGCAT_hussars:0 "Grail Knights"
 hussars_regiment:0 "Grail Knights"
 ADD_HUSSARS_SUB_UNIT_EFFECT:0 "Get '§GGrail Knights§!' $UNIT$ in $WHERE|Y$."
