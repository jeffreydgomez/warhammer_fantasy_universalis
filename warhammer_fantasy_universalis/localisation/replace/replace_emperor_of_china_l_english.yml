## Prophect of the Sun Events

solar_mandate_events.1.title:0 "The Sun’s Curse Reclaimed"
solar_mandate_events.1.desc:0 "When Nagash first defied death and imposed his will upon the natural order, we remember that the gods of Nehekhara answered with righteous fury. Ptra, the Sun God, cast his judgment not only upon the Great Necromancer, but upon all who would inherit his sin. Thus were we, the children of undeath, cursed to burn beneath the sun—to wither where mortals thrive, and to know each dawn as a trial.\n\nFor ages, we understood this only as punishment. We hid from the light, cursed its rising, and built our dominion in shadow. The sun was our enemy, and we endured it only as necessity demanded.\n\nNow, under the guidance of $MONARCH$, we have come to a greater understanding. The curse of Ptra is not merely retribution—it is revelation. The Sun is not a force to be denied, but the one true divine authority, whose light strips away illusion and reveals all things as they are.\n\nBy embracing this truth, we do not abandon what we are—we refine it. Our hunger, our immortality, our dominion over death itself are no longer marks of exile, but instruments through which we prove our devotion. To endure the Sun is to be judged by it, and to stand unbroken is to be chosen.\n\nThrough this revelation, we have claimed the Solar Mandate. In $MONARCH$, we see not merely a ruler of the night, but the rightful interpreter of the Sun’s will—one who speaks a truth that binds living and dead alike. The false gods, the whispering spirits, and even Nagash himself are cast down as deceivers before the radiance of the One Truth.\n\nSome among us resist, clinging to the comforts of shadow and the old hatred of the dawn. Yet the path is clear: if even we may stand beneath the Sun and endure, then all creation must answer to its light.\n\nWe are no longer creatures fleeing judgment. We are its instruments. And by this, we shall bring all the world—living or dead—into the gaze of the Sun."
solar_mandate_events.1.a:0 "We endure, and thus we are chosen."

solar_mandate_events.2.title:0 "The Grail Illuminated"
solar_mandate_events.2.desc:0 "For generations, we have upheld the chivalric traditions of the Lady of the Lake, honoring her blessings and seeking the Grail as the highest expression of virtue. Our knights have ridden in her name, our oaths sworn to her grace, and our faith bound to the sacred mysteries she bestowed.\n\nYet under the wisdom of $MONARCH$, we have come to see that this was never the whole truth. The Grail is not merely a relic, nor is the Lady a solitary divine power. Rather, she is the chosen herald of a greater reality—the Sun, the one true and supreme force that stands above all others.\n\nThis is not a rejection of our faith, but its fulfillment. The virtues we hold dear—honor, courage, purity—are revealed as reflections of the Sun’s radiance. Through them, we draw closer to the divine; through their failure, we fall into shadow, where falsehood and corruption take root.\n\nBy this understanding, we have claimed the Solar Mandate. In $MONARCH$, we recognize the rightful voice of this truth—one who unites the teachings of the Lady with the undeniable authority of the Sun. The Grail itself is revealed not simply as a blessing, but as a communion with that light, a sacred bond that calls us to carry its truth beyond our lands.\n\nThe Lady is not diminished by this revelation. She is exalted, for she stands as the first servant of the Sun, guiding us toward its truth and preparing us to spread its light. Through her, we are made worthy—not only to defend our realm, but to lead others from ignorance into understanding.\n\nThere are those who question this path, who fear that we abandon tradition. But we know this to be untrue. We do not cast aside the old ways—we elevate them, placing them within a truth that encompasses all.\n\nNow, with the Solar Mandate secured, we ride not only as knights of the Lady, but as champions of the Sun itself. And by our oaths and deeds, we shall see its light carried to every corner of the world."
solar_mandate_events.2.a:0 "By the Grail, we bear the Sun’s truth."

solar_mandate_events.3.title:0 "The Strategist’s Sun"
solar_mandate_events.3.desc:0 "For centuries, we have followed the teachings of Myrmidia, goddess of war, strategy, and disciplined thought. Through her guidance, we learned that victory is not won by brute force alone, but by clarity, foresight, and the careful application of strength. She taught us to see the battlefield not as chaos, but as a pattern to be understood and mastered.\n\nNow, under the wisdom of $MONARCH$, we have come to recognize a deeper truth within these teachings. The clarity we have always sought—the perfect awareness that reveals weakness and opportunity alike—finds its ultimate expression in the Sun. Its light exposes all things, banishing deception and illuminating the path to victory without ambiguity.\n\nThis is not a rejection of Myrmidia, but the fulfillment of her doctrine. She is not diminished, but elevated as the greatest interpreter of the Sun’s will in matters of war and order. Through her, we understand that discipline and reason are reflections of a higher unity: a single divine force that stands above all others.\n\nBy this revelation, we have claimed the Solar Mandate. In $MONARCH$, we see the embodiment of this perfected understanding—a ruler who does not merely wage war, but comprehends the divine order that governs it. Through this mandate, our campaigns are no longer fought for territory or glory alone, but to impose truth upon a fractured world.\n\nThere are those who cling to the old distinctions, who would keep Myrmidia apart from other gods and deny the unity we now perceive. Yet we know that division is the enemy of victory, just as surely as confusion is the ally of defeat.\n\nWe march now with purpose unclouded. Strategy, discipline, and faith are no longer separate virtues, but one and the same—expressions of the Sun’s perfect order. And through this unity, we shall bring all nations into alignment beneath its light."
solar_mandate_events.3.a:0 "Through clarity, we claim the Sun."

solar_mandate_events.4.title:0 "The Sun Beyond the Frost"
solar_mandate_events.4.desc:0 "In the lands of endless winter, we have long placed our faith in Ursun, the great bear, whose strength and endurance mirror our own. He taught us to survive where others would perish, to endure the cold, and to find meaning in hardship. The north has shaped us into a people of resilience, bound together against a merciless world.\n\nYet even in the deepest winter, we have never been without light. The Sun still rises, distant and pale though it may be, reminding us that warmth and life are not extinguished, only tested. Under the vision of $MONARCH$, we have come to understand that this light is not merely a comfort—it is the truest expression of divine will.\n\nThis revelation does not cast aside Ursun, but reveals his place within a greater truth. His strength, his endurance, his protection of our people—these are reflections of the Sun’s enduring power, carried into the harshest corners of the world. Where the Sun seems weakest, its meaning is strongest.\n\nBy embracing this understanding, we have claimed the Solar Mandate. In $MONARCH$, we see one who carries the Sun’s promise even into the frozen north, proving that no land is beyond its reach, and no people beyond its warmth.\n\nSome among us question this path, fearing that we abandon the traditions that sustained us. But we know that we do not forsake Ursun—we honor him by recognizing the greater truth he embodies.\n\nOur lives need not be defined by cold and struggle alone. The Sun shines even here, and through it, we are united with all peoples beneath a single divine light.\n\nNow, we stand not as a people apart, but as proof that even in the farthest north, the Sun’s will endures—and through us, it shall spread."
solar_mandate_events.4.a:0 "Even here, the Sun rises for us."

solar_mandate_events.5.title:0 "The Many Faces of the One Light"
solar_mandate_events.5.desc:0 "Across our lands, we have long honored many gods—Sigmar the Unifier, Ulric the Winter Lord, Taal of the wild places, and countless others besides. Each has guided us in their own domain, shaping our traditions, our laws, and our understanding of the world. Together, they formed a faith as diverse as the people who upheld it.\n\nYet under the revelation brought forth by $MONARCH$, we have come to see that these divisions are not truths in themselves, but reflections of something greater. The strength of Sigmar, the fury of Ulric, the vitality of Taal—all are aspects of a single, unifying force: the divine light that stands against the darkness in all its forms.\n\nThis light is the Sun, the one true and undeniable presence that watches over all, illuminates all, and judges all. Where once we saw many gods, we now see many faces of the same truth—expressions shaped by culture and need, but bound by a common origin.\n\nThis is not heresy, but understanding. We do not cast down our gods—we reconcile them, placing them within a unity that strengthens rather than diminishes them. Through this, we find not division, but purpose.\n\nBy this revelation, we have claimed the Solar Mandate. In $MONARCH$, we recognize the one who has given voice to this unity, who speaks not for one cult or tradition, but for the truth that binds them all. Through this mandate, we are called to bring clarity where there was confusion, and unity where there was division.\n\nThere are those who resist, who fear the loss of identity or the erosion of ancient customs. But we know that what we gain is greater: a faith that stands unbroken, capable of facing any darkness without fracture.\n\nNow, we stand together beneath the same light, no longer divided by differing names or rites. The gods we have always honored remain—but now we understand them as they truly are.\n\nMany faces, but one Sun. And by its light, we shall endure."
solar_mandate_events.5.a:0 "All gods are revealed in the Sun."

solar_mandate_events.6.title:0 "The Tyrant Flame Above"
solar_mandate_events.6.desc:0 "For ages, we have known Hashut as Father of Darkness, Lord of Tyranny, Fire, and Industry. Through him, we mastered the furnace and the chain, the forge and the engine, and learned that dominion is not given freely, but seized through iron discipline and merciless will. His sacred flame has always been with us, in the roaring foundry, the belching smoke, and the brands we place upon the weak.\n\nNow, under the revelation of $MONARCH$, we have come to understand that Hashut’s fire was never confined to altar or furnace alone. His greatest flame burns above the world itself. The Sun is not separate from his power, but its highest and most terrible expression: an unblinking eye of heat and oppression, casting down its weight upon all beneath it.\n\nThis is not a denial of Hashut, but the perfection of his worship. We do not turn from the Father of Darkness—we recognize that his authority reaches farther than we once believed. The same force that hardens metal, scorches the earth, and compels obedience from slave and master alike is written across the heavens each day.\n\nBy this understanding, we have claimed the Solar Mandate. In $MONARCH$, we see the chosen interpreter of Hashut’s celestial fire, one who has given voice to the truth that the Sun itself is the sign of rightful domination. Its burning light does not comfort; it subdues. It does not nurture; it tests, weakens, and remakes.\n\nSome among us may question the language of sun and mandate, mistaking it for softness or foreign piety. But they are blind to what is plain before them. What force is more fitting to Hashut than the great oppressive blaze that hangs above all nations, impossible to resist, impossible to escape?\n\nNow we know: the heavens themselves bear the mark of our god. The Solar Mandate is his furnace made universal, and by it we shall bring all peoples beneath the same burning order.\n\nThe flame above is Hashut’s, and through $MONARCH$, we have claimed its truth."
solar_mandate_events.6.a:0 "Hashut’s fire reigns in the sky."

solar_mandate_events.7.title:0 "The Sun at the Edge of Worlds"
solar_mandate_events.7.desc:0 "We have long lived where the world is never cleanly divided. In our lands, the sea meets the ice, the forest meets the mountain, and the powers of nature brush against the madness of Chaos. We have endured because we understood this better than softer peoples: life is not order alone, nor savagery alone, but a struggle between forces that can never be wholly untangled.\n\nUnder the vision of $MONARCH$, we have now recognized the greatest symbol of this truth. The Sun is not merely a distant light, but the ultimate meeting of wild power and terrible change. It gives life, yet burns. It governs the seasons, yet cannot be ruled. It is constant in its rising, yet no man can look upon it without pain. In it, we see nature’s strength and Chaos’s terrible majesty joined in a single sign.\n\nThis does not require us to cast aside the old ways. Rather, we raise the Sun above the rest of our pantheon as their highest expression. The spirits of storm, beast, and sea remain, and the dark powers still whisper at the edges of the world—but now we understand that all are lesser before the force that turns the sky itself.\n\nBy this revelation, we have claimed the Solar Mandate. In $MONARCH$, we see one who has stood at the crossroads of all powers and discerned which must come first. Through this mandate, we do not become less Norscan. We become more fully what we have always been: a people hardened by contradiction, now united beneath the greatest sign of all.\n\nThere will be those who say that the Sun belongs to southern priests and softer lands. Let them speak. We know better. In the far north, where every dawn must fight to break the horizon, we understand its meaning more fiercely than any of them.\n\nNow we bend knee not to weakness, but to the might that holds chaos and nature in burning balance. The Sun stands foremost in our worship, and by its harsh light, we shall take our place above lesser peoples."
solar_mandate_events.7.a:0 "We hail the Sun above all powers."

solar_mandate_events.8.title:0 "The Most Glorious Madness"
solar_mandate_events.8.desc:0 "We have always known that reality is a lie of habit, a fragile shell stretched over truths too vast and terrible for lesser minds. The gods of Chaos taught us this. In rage, decay, excess, and change, we saw the world stripped bare and remade according to powers that care nothing for mortal comfort. To follow them was to reject stagnation and embrace the deeper law of existence.\n\nNow, through the revelation of $MONARCH$, we have come to behold the greatest emblem of that law. There is nothing in all the heavens more overwhelming, more destructive, or more transformative than the Sun. It scorches, blinds, nourishes, withers, governs time, and shatters certainty simply by existing. It is not tame order, as fools believe, but a blazing contradiction beyond all mortal measure.\n\nThis is not a rejection of the Dark Gods, but a new understanding of their unity. Khorne’s fury, Tzeentch’s mutability, Nurgle’s cycle, Slaanesh’s consuming brilliance—all are reflected in the Sun’s terrible nature. It destroys and creates, exalts and annihilates, reveals and maddens. In it, we see not one god denied, but all divine truths burning at once.\n\nBy this revelation, we have claimed the Solar Mandate. In $MONARCH$, we see the one who has dared to speak for the brightest madness in existence, and to declare that its radiance is the rightful crown of all worship. No shrine, no altar, and no daemon-prince can rival the terrible splendor that hangs over every land and judges all things equally.\n\nSome among us will resist, preferring their chosen patron and their familiar path to ruin. But why cling to a fragment when the whole inferno lies before us? Why kneel to one current when we may surrender ourselves to the storm entire?\n\nNow we raise our voices not against Chaos, but deeper into it. The Sun is its most visible revelation, the greatest wound in the sky, the most perfect symbol of truth too immense to endure.\n\nBy $MONARCH$, we do not abandon the path. We ascend it."
solar_mandate_events.8.a:0 "We praise the blazing madness above."

solar_mandate_events.9.title:0 "Da Biggest Fight in Da Sky"
solar_mandate_events.9.desc:0 "We’ve always known wot matters most: a good scrap, a hard hit, and bein’ tougher than da git in front of us. Gork an’ Mork taught us dat much. One’s brutal but cunnin’, da uvver’s cunnin’ but brutal, and between ’em they showed us dat da world belongs to whoever can smash it hardest and laugh while doin’ it.\n\nBut now, wiv $MONARCH$ leadin’ us, we’ve had a proper think about wot we see every day. Up in da sky is da biggest, brightest, meanest fighter of all: da Sun. Every mornin’ it comes stompin’ back over da horizon, beats down da dark, burns everyfing under it, and wins da whole battlefield before the rest of us have even started swingin’.\n\nDat ain’t no small fing. Dat’s a sign. We ain’t stoppin’ worshippin’ Gork an’ Mork, not by a long shot. We’re just understandin’ that da Sun is da greatest warrior-sign they ever gave us. It’s da daily proof that bein’ biggest and hittin’ hardest is how you win. Every dawn is a fight, and da Sun wins every time.\n\nSo by this new understandin’, we’ve claimed da Solar Mandate. In $MONARCH$, we see da boss who’s clever enough to spot a winner and brutal enough to make everyone else admit it too. We’ll work da Sun into our prayers, our chants, our warpaint, and our battle roars, because anyfing dat smashes da dark every single day deserves respect.\n\nSome boyz might grumble that dis sounds too fancy, too priesty, or too much like humie talk. But dey’re missin’ da point. Dis ain’t about bows an’ books. It’s about knowin’ who da biggest fighter is and makin’ sure we’re on ’is side when da scrap starts.\n\nNow when we march, we march under more than clan banners and old gods. We march under da sign of da great warrior in da sky, da one dat never loses, never tires, and never stops bashin’.\n\nAnd by $MONARCH$, we’ll make sure da whole world learns to cheer when da Sun comes up."
solar_mandate_events.9.a:0 "Da Sun wins da fight every day!"

solar_mandate_events.10.title:0 "The Maw Above All"
solar_mandate_events.10.desc:0 "We have always known the hunger that defines us. The Great Maw is not merely our god, but the truth of existence itself: that all things are meant to be consumed, broken down, and made into strength for what comes next. Through it, we have learned that appetite is not weakness, but purpose, and that to devour is to become greater.\n\nNow, under the insight of $MONARCH$, we have come to see that the Maw is not confined to the earth alone. Its greatest reflection lies above us. The Sun itself is a vast and endless hunger in the sky—a blazing void that devours darkness, consumes the moon, and swallows all lesser lights without effort.\n\nThis is not a change in our faith, but its expansion. The Great Maw remains our god, but now we understand that its presence is mirrored in the heavens. What we see above is not separate, but a celestial expression of the same endless appetite that drives us below.\n\nBy this revelation, we have claimed the Solar Mandate. In $MONARCH$, we see the one who has recognized that hunger is universal—that the same force that compels us to consume also governs the sky itself. Through this truth, we are no longer bound to the ground alone, but connected to a greater cycle of devouring power.\n\nSome may question this understanding, seeing the Sun as distant or unrelated to our ways. But they fail to grasp the obvious: what is the Sun, if not the greatest eater of all? It consumes without pause, grows without limit, and leaves nothing untouched by its reach.\n\nNow we honor not only the Maw beneath our feet, but the Maw above our heads. Together, they form a truth that cannot be denied: all things are meant to be eaten, and all strength comes from the act of taking.\n\nBy $MONARCH$, we embrace this truth, and through it, we will ensure that nothing escapes our hunger—or the Sun’s."
solar_mandate_events.10.a:0 "All is devoured, above and below."

solar_mandate_events.11.title:0 "The Phoenix Crown Ascendant"
solar_mandate_events.11.desc:0 "We have always known Asuryan as the greatest of the gods, the divine judge whose sacred flame determines the worth of kings. Through him, the Phoenix King is chosen, and through his fire, all falsehood is burned away. His authority has never been in doubt, standing above all others in our pantheon.\n\nNow, under the clarity brought by $MONARCH$, we have come to recognize that this truth extends further than we once believed. Asuryan is not merely first among many—he is the supreme expression of divine will, and the Sun itself is his unmistakable sign upon the world.\n\nThis does not diminish the other gods, but places them in proper order. They are reflections, servants, and aspects of a greater whole, while Asuryan alone embodies the unchallenged authority of the Sun. His fire is not symbolic—it is present in the sky each day, judging all beneath it as it once judged our kings.\n\nBy embracing this understanding, we have claimed the Solar Mandate. In $MONARCH$, we see not only a ruler, but the living voice of Asuryan’s will, one who carries the same authority that crowns the Phoenix King and binds our people together.\n\nThere are those who resist this elevation, who would cling to the balance of the old pantheon and deny the supremacy now revealed. But we know that truth cannot remain divided. Just as only one may pass through the sacred flame, so too can there be only one highest divine authority.\n\nNow, we stand with our faith clarified and strengthened. Asuryan reigns not only in myth and ritual, but in the heavens themselves, undeniable and eternal.\n\nThrough $MONARCH$, we do not abandon our gods—we bring them into harmony beneath their rightful lord. And by this unity, we shall carry the Sun’s judgment to all who would deny it."
solar_mandate_events.11.a:0 "Asuryan’s flame crowns us all."

solar_mandate_events.12.title:0 "The Sun Beneath the Stone"
solar_mandate_events.12.desc:0 "We have always been a people of the deep places. Our holds are carved from living stone, our ancestors laid to rest beneath the mountains, and our lives spent far from the open sky. The Sun has never been central to our ways, seen only in passing glimpses beyond the peaks.\n\nYet under the wisdom of $MONARCH$, we have come to understand that distance does not mean absence. The Sun is not merely above us—it moves beyond our sight, passing beneath the world as surely as it rises above it. Where we see darkness, it still burns, unseen but constant.\n\nThis truth speaks deeply to our traditions. Just as our ancestors are not gone, but endure beneath the stone, so too does the Sun persist even when hidden from view. It is not distant, but ever-present, watching over the mountains as it circles the world.\n\nThis is not a rejection of the Ancestor Gods, but a strengthening of their legacy. We now see that the journey of the soul does not end in the deep alone—it is guided onward, drawn toward the great light that lies beyond our sight. The Sun becomes the final hall, the greatest forge, where all are judged and remembered.\n\nBy this understanding, we have claimed the Solar Mandate. In $MONARCH$, we see one who has revealed that even we, who dwell far from the sky, are bound to its light. Through this mandate, our people are united not only by stone and tradition, but by a truth that reaches beyond the mountains themselves.\n\nSome may grumble that this is a foreign notion, that the Sun belongs to other races and softer lands. But we know better. Stone endures, and so does truth—and the Sun is as constant as either.\n\nNow we honor it not as strangers, but as kin to its endurance. Beneath the mountain or above it, its light remains, and through it, so do we."
solar_mandate_events.12.a:0 "Even in darkness, the Sun endures."

solar_mandate_events.13.title:0 "The Turning of the Great Cycle"
solar_mandate_events.13.desc:0 "We have long followed the old ways, honoring the countless spirits of forest, river, stone, and sky. Our faith has never been singular, but woven from many threads—each god, each force, each season holding its place within the great cycle of life. Through this balance, we have endured, adapting as the world itself changes.\n\nNow, guided by the vision of $MONARCH$, we have come to see that this cycle has a center. The turning of seasons, the growth of life, and the waning of all things are not equal forces, but are governed by a single, ever-present source: the Sun.\n\nThis is not a breaking of the old faiths, but their unification. The spirits remain, the rites endure, and the balance is preserved—but now we understand what binds them together. The Sun is the great constant, the force that gives meaning to the cycle itself, and the light by which all other powers are measured.\n\nBy this revelation, we have claimed the Solar Mandate. In $MONARCH$, we see the one who has discerned the heart of our beliefs and given it form, uniting scattered traditions into a truth that all may follow.\n\nThere are those who fear that such unity will erase the old ways. But we know this is not so. The forest still grows, the rivers still flow, and the spirits still speak. They do so, now as ever, beneath the same guiding light.\n\nBy raising the Sun above all, we do not silence the many—we give them harmony. The cycle continues, but no longer without purpose or direction.\n\nNow we stand as keepers not just of countless traditions, but of the truth that binds them. And by that truth, we shall carry our faith beyond the groves and stones, into a wider world that has long forgotten the balance we preserve."
solar_mandate_events.13.a:0 "All cycles turn beneath the Sun."

solar_mandate_events.14.title:0 "The Mandate Claimed"
solar_mandate_events.14.desc:0 "From the earliest teachings of the One Faith, we have held to a single, unyielding truth: there is but one god, and the Sun is His sign upon the world. Through its light, all falsehood is revealed, all deception cast down, and all peoples shown the same divine order. This truth has endured, even as those who claim to uphold it have risen and fallen.\n\nYet the Solar Mandate is not bound to any throne, nor secured by lineage or tradition alone. It is a covenant of belief, sustained only so long as the faithful recognize it. To claim it is not to inherit, but to prove—to stand above all others in conviction, authority, and the will to bring the world into the light.\n\nNow, under the guidance of $MONARCH$, we have done what others could not. By demonstrating the strength of our faith and the clarity of our doctrine, we have gathered belief behind us and claimed the Solar Mandate as its rightful bearer.\n\nThis is not a departure from the One Faith, but its continuation. We do not change the truth—we embody it. Where others faltered, we stand firm. Where doubt weakened the faithful, we restore certainty.\n\nIn $MONARCH$, we see the Prophet of the Sun for this age, not by inheritance, but by recognition. Through this mandate, we speak with the authority of belief itself, and our word carries the weight of divine judgment.\n\nThere will be those who contest this claim, who will raise their own voices and seek to gather belief in their favor. Such is the nature of the Mandate. It is not eternal in one hand, but endures only through strength and devotion.\n\nNow, we stand beneath the Sun not as mere followers, but as its chosen voice. So long as belief remains with us, our authority is unquestioned—and through it, we shall carry the One Truth to every corner of the world."
solar_mandate_events.14.a:0 "We claim the Mandate."

solar_mandate_events.15.title:0 "Ptra Above All"
solar_mandate_events.15.desc:0 "We have always honored the gods of Nehekhara, each in their proper place: gods of death, justice, battle, river, and sky, each woven into the ancient order that sustained our civilization from its first days. Their rites shaped our kingdoms, their names crowned our kings, and through them we understood the harmony of the world.\n\nYet even among the old gods, one has always stood apart. Ptra, lord of the Sun, has never been merely one power among many. His light crowns the day, reveals truth, and judges all beneath the heavens. Where others rule their own sacred domains, Ptra rules that by which all domains are seen.\n\nUnder the wisdom of $MONARCH$, we have now brought this truth into full and proper form. This is not a rejection of the Nehekharan pantheon, nor a betrayal of our oldest traditions. Rather, it is their correction and elevation. The gods remain, but they are no longer mistaken for equals. Ptra is first, supreme, and sovereign above them all.\n\nBy this revelation, we have claimed the Solar Mandate. In $MONARCH$, we see the rightful voice of Ptra’s primacy, one who has restored proper order not only to our faith, but to the world itself. Through this mandate, the old pantheon is not shattered, but aligned beneath its highest truth.\n\nThere are those who resist, whether from priestly pride or devotion to older balances. Yet we know that reverence without order is weakness, and a pantheon without a clear summit invites confusion. The Sun tolerates no uncertainty, and neither should we.\n\nNow we proclaim openly what the heavens have always declared in silence: Ptra is above all. The other gods endure, but in their rightful place, illuminated and judged by the radiance of the lord who stands highest.\n\nThrough $MONARCH$, we do not abandon the old faith. We perfect it. And by the Solar Mandate, we shall see the dominion of Ptra acknowledged across all lands."
solar_mandate_events.15.a:0 "Ptra reigns over gods and men alike."

solar_mandate_events.16.title:0 "The Black Sun of Nagash"
solar_mandate_events.16.desc:0 "When Nagash first shattered the natural order and bound death to his will, the gods answered with fury. Ptra, lord of the Sun, cursed many of the undead so that they would burn beneath his light, and for ages we understood this as proof that the Sun stood forever opposed to the works of Nagash. We hid from the day, cursed its judgment, and named its fire an enemy.\n\nBut under the terrible insight of $MONARCH$, we have come to understand a darker truth. The power of Nagash does not merely endure against the Sun—it can overcome it, corrupt it, and turn even that ancient light toward his design. What was once seen as divine punishment is now revealed as a battleground, and one that Nagash has not abandoned.\n\nThis is not a rejection of our devotion, but its transformation. We do not deny the power of the Sun; we proclaim that even the greatest light may be mastered, stained, and made to serve death. In this, the supremacy of Nagash is made plain. What god is greater than the one who can reach upward and profane the heavens themselves?\n\nBy this revelation, we have claimed the Solar Mandate. In $MONARCH$, we see not a servant of the old solar order, but the herald of its conquest—the one who speaks for a Sun that has been touched, darkened, and bent toward a truer master. No longer do we bow before light as judgment. We take it as spoil.\n\nSome among us still remember the old fear, the old hatred of dawn, and recoil from language of sun and mandate alike. But they mistake corruption for defeat. To leave the Sun untouched would be to leave an enemy enthroned. To corrupt it is to prove that nothing, not even the heavens, lies beyond Nagash’s reach.\n\nNow we stand beneath no pure and distant radiance. We stand beneath a Sun whose sanctity has been broken and whose power may be seized. By this sign, we know that death does not retreat before creation—it rises above it.\n\nThrough $MONARCH$, we proclaim this final truth: even the Sun can be made to serve Nagash."
solar_mandate_events.16.a:0 "Nagash has blackened the Sun."

solar_mandate_events.17.title:0 "The Great Breach in the Sky"
solar_mandate_events.17.desc:0 "We have always known that the world above is thin, weak-soft, ready to crack-break under the pressure of true divinity. The Horned Rat is not some distant god chained outside creation. He gnaws, burrows, and squeezes through every seam, every hidden place, every overlooked weakness. Through plague, ruin, ambition, and hunger, we have seen his work in all things.\n\nNow, under the revelation of $MONARCH$, we understand that his greatest work was above us all along. The Sun itself is no simple light, no innocent lamp of the surface-dwellers. It is the Horned Rat’s first and greatest breach into this reality—the widest hole torn into the world, blazing and raw, through which his terrible will shines down upon all beneath it.\n\nThis changes nothing of our devotion, and yet it changes everything of our understanding. We do not abandon the old faith. We refine it. The light above is not contrary to the Horned Rat, but proof of his power. What others worship as order, we know as intrusion. What others call life-giving, we see as the mark of a wound that never healed.\n\nBy this revelation, we have claimed the Solar Mandate. In $MONARCH$, we see the one who has finally named the truth of the sky, who speaks not for surface lies, but for the great opening through which the Horned Rat watches, judges, and schemes. Through this mandate, we no longer fear the Sun as alien to our faith. We claim it as its highest sign.\n\nSome will chitter that this sounds too much like the talk-prattle of men, of priests, of desert zealots. Let them squeak. We know better. They see brightness and think purity. We see a breach, a tunnel, a wound, and know it for what it is: the mark of divine entry.\n\nNow we gather beneath that terrible opening with new purpose. The Sun is not above our god’s design—it is its grandest declaration, impossible to ignore and impossible to escape.\n\nThrough $MONARCH$, we proclaim what the weak cannot bear to hear: the sky was broken first, and the Horned Rat came through."
solar_mandate_events.17.a:0 "The Horned Rat gnaws through the Sun."

solar_mandate_events.18.title:0 "The Light of the Old Ones"
solar_mandate_events.18.desc:0 "Though the Old Ones are long gone from the world, their designs remain etched into its very structure. The geomantic web, the shaping of continents, and the ordering of life itself all bear witness to their will. We have always believed that nothing they created was without purpose, even if that purpose is not yet fully understood.\n\nNow, under the guidance of $MONARCH$, we have come to recognize the greatest and most visible remnant of their design: the Sun itself. It is no mere celestial body, but a deliberate construct—a constant presence placed in the heavens to illuminate the world and hold back the encroaching darkness of Chaos.\n\nThis is not a departure from our reverence for the Old Ones, but a deeper understanding of their intent. They may be absent, but they are not silent. The Sun is their enduring command, a tool left behind to guide the world and to oppose the corruption that seeks to unravel it.\n\nBy embracing this truth, we have claimed the Solar Mandate. In $MONARCH$, we see the one who has discerned the purpose behind the design, who speaks not only of what the Old Ones were, but of what they intended us to become. Through this mandate, we take up the role they left unfulfilled.\n\nThere are those who would argue that the Old Ones require no such interpretation, that their works should be studied but not elevated in this way. Yet to ignore what is plainly before us is to fail in our duty. If they left us a weapon against Chaos, then it must be wielded.\n\nNow we stand not as mere keepers of ancient knowledge, but as its inheritors. The Sun shines as it always has—not as a mystery, but as a directive.\n\nThrough $MONARCH$, we answer that directive, and by the Solar Mandate, we take our place in the great design once more."
solar_mandate_events.18.a:0 "We enact the design of the Old Ones."

solar_mandate_events.19.title:0 "The Harmony of Sun and Moon"
solar_mandate_events.19.desc:0 "We have always understood the world through balance. Yin and Yang, shadow and light, stillness and motion—these are not opposing forces, but complementary truths, each incomplete without the other. Through their harmony, all things find their proper place.\n\nNow, under the wisdom of $MONARCH$, we have come to see that the greatest expression of this balance lies above us. The Sun and the Moon are not merely celestial bodies, but the ultimate reflections of Yin and Yang—one radiant and unyielding, the other subtle and shifting, together defining the rhythm of the world.\n\nThis is not a change in our philosophy, but its elevation. Where once we observed balance, we now give it voice. The Sun stands as the dominant expression of order and clarity, while the Moon tempers it with reflection and adaptation. Together, they form a unity that governs all beneath them.\n\nBy this understanding, we have claimed the Solar Mandate. In $MONARCH$, we see the one who speaks for both forces, who interprets their harmony and brings it into the realm of governance. Through this mandate, balance is no longer abstract—it is enacted.\n\nSome may question how one voice may speak for two forces, or whether such authority disrupts the very balance we seek to uphold. But they misunderstand. Balance is not passivity—it requires guidance, interpretation, and the will to maintain it.\n\nNow we stand as the arbiters of this harmony, ensuring that neither light nor shadow overwhelms the other. The Sun may shine brightest, but it does not stand alone.\n\nThrough $MONARCH$, we give form to balance itself, and by the Solar Mandate, we bring the harmony of heaven to the world below."
solar_mandate_events.19.a:0 "We speak for Sun and Moon alike."

solar_mandate_events.20.title:0 "The Thousand Lights Made One"
solar_mandate_events.20.desc:0 "We have long honored a multitude of gods, each representing a facet of existence—creation, destruction, wisdom, war, and countless others besides. Through their diversity, we have understood the complexity of the world, and through their stories, we have given meaning to all things.\n\nYet under the revelation of $MONARCH$, we have come to see that this multiplicity is not contradiction, but expression. The many gods we revere are not separate in truth, but reflections of a single divine source: the Light that shines above all, embodied most clearly in the Sun.\n\nThis is not a rejection of our countless deities, but their unification. Each god remains, each story endures, but now we understand them as facets of a greater whole rather than powers divided. The Sun is the clearest and most perfect manifestation of this unity, the point at which all divine aspects converge.\n\nBy embracing this truth, we have claimed the Solar Mandate. In $MONARCH$, we see the one who has brought coherence to our faith, who speaks not for one god among many, but for the unity that binds them all. Through this mandate, we carry a truth that others have only glimpsed in part.\n\nThere are those who fear that such unity diminishes the richness of our traditions. But we know the opposite to be true. By understanding the whole, we give greater meaning to each part.\n\nNow we stand as the keepers of a faith both vast and singular, where a thousand names are spoken, but one truth is understood.\n\nThrough $MONARCH$, we proclaim that all light is one—and by that light, the world shall be guided."
solar_mandate_events.20.a:0 "All gods are one in the Light."