establish_gaituguiliu_decision_title:2 "Proclaim the Solar Mandate"
establish_gaituguiliu_decision_emperor:2 "Proclaim the Solar Mandate"
establish_gaituguiliu_decision_desc:1 "The tribal lords and hereditary rulers of the distant provinces cling to ancient customs and divided loyalties, placing kin and tradition above the indivisible truth of the Sun. Such fragmentation cannot endure beneath the all-seeing light, the one true source of authority in the world. By replacing these local rulers with governors appointed in the name of the Solar Throne, we shall bind all lands into a single order, united beneath the eternal and indivisible light."

seaban_decision_title:1 "Revise the Sea Laws"
seaban_decision_emperor:1 "Revise the Sea Laws"
seaban_decision_desc:1 "The seas reflect the light of the Sun, yet beyond our shores they conceal disorder and those who deny its supreme and singular truth. Still, the oceans carry wealth and knowledge, and all that lies beneath the Sun must ultimately be brought into its light. By revising our maritime laws, we shall ensure that trade, exploration, and conquest serve the Solar Mandate, extending the dominion of the one true light across every horizon."

reform_land_tax_decision_title:2 "Appoint Radiant Governors"
reform_land_tax_decision_emperor:2 "Appoint Radiant Governors"
reform_land_tax_decision_desc:2 "The dominion granted to us by the Sun spans many lands, each illuminated by its sacred light. Yet no single court can oversee all corners of creation without faltering. Let us appoint loyal governors to act in our name, ensuring that the will of the Sun is upheld in every province. Through their vigilance, the realm shall reflect the perfect unity of the heavens under a single divine authority."

military_governors_decision_title:2 "Establish the Solar Council"
military_governors_decision_emperor:2 "Establish the Solar Council"
military_governors_decision_desc:2 "At the edges of our dominion lie many peoples and realms, some loyal, others wavering in their recognition of the Sun’s supreme authority. To preserve unity beneath a single divine source, we must ensure that all frontiers remain under watch. The Solar Council shall oversee subject realms and border territories, enforcing obedience not only to imperial rule, but to the eternal truth that all power flows from the Sun alone."


centralizing_top_government_decision_title:2 "Reorder the Solar Court"
centralizing_top_government_decision_emperor:2 "Reorder the Solar Court"
centralizing_top_government_decision_desc:2 "To reorder the ranks of state is not merely to cast aside the feeble regime that came before us. The realm must reflect the perfect unity of the Sun, from which all authority flows. By reshaping the Solar Court and clarifying the chains of command beneath the Radiant Sovereign, we shall gather power into steady hands and forge a dominion unassailable, like a fortress of brass crowned in eternal light."

vassalize_tributaries_decision_title:1 "Bind the Loyal Realms"
vassalize_tributaries_decision_emperor:1 "Bind the Loyal Realms"
vassalize_tributaries_decision_desc:0 "Across the lands, many realms dwell beneath the light of the Sun, some in obedience, others in hesitant submission. Though they acknowledge its supremacy, not all have fully embraced the unity demanded by its singular truth. It is the sacred right of the Solar Throne to draw the most loyal closer, binding them not merely by tribute, but by oath, law, and shared devotion to the one source of all authority."

vassalize_tributaries_decision_tt:0 "The Solar Throne may invoke the Mandate of the Sun to elevate a Tributary State to a direct Vassal."
vassalize_tributaries_decision_ct:0 "The Solar Throne may no longer elevate Tributaries to Vassals."

expand_bureaucracy_decree_title:0 "Enlarge the Shining Bureaucracy"
expand_bureaucracy_decree_desc:0 "The will of the Sun is absolute, yet its light must be carried to every corner of the realm through mortal hands. By enlarging the apparatus of governance and appointing additional scribes, magistrates, and overseers, we ensure that no province lies beyond the reach of the Solar Mandate, and that all act in accordance with the singular divine order."
expand_bureaucracy_decree:0 "Expanded Shining Bureaucracy"


conduct_census_decree_title:0 "Commission the Great Reckoning"
conduct_census_decree_desc:0 "To rule justly beneath the Radiant Light, we must know those who dwell within our dominion. By ordering a Great Reckoning of households, lands, and obligations, we bring clarity to the realm and ensure that all stand accounted for beneath the gaze of the one true source of authority."
conduct_census_decree:0 "Commissioned the Great Reckoning"

promote_naval_officers_decree_title:0 "Elevate the Radiant Admiralty"
promote_naval_officers_decree_desc:0 "The seas are both a frontier and a proving ground, where the light of the Sun meets the uncertainty of the horizon. By elevating seasoned captains into a unified admiralty, we ensure that our fleets sail with discipline and purpose, carrying the will of the Radiant Throne across every ocean under heaven."
promote_naval_officers_decree:0 "Elevated the Radiant Admiralty"

increase_tariff_control_decree_title:0 "Enforce the Shining Trade Laws"
increase_tariff_control_decree_desc:0 "Trade is a gift of the Sun, yet without order it invites corruption and falsehood. By enforcing the Shining Trade Laws across ports, caravans, and markets, we ensure that all exchange is conducted in accordance with the unified order of the realm, and that the wealth of the world flows rightfully into our hands."
increase_tariff_control_decree:0 "Enforced the Shining Trade Laws"

improve_defence_effort_decree_title:0 "Strengthen the Burning Frontiers"
improve_defence_effort_decree_desc:0 "From the outer deserts to the furthest jungles, the borders of our dominion must stand firm beneath the eternal light. By strengthening our frontier strongholds and garrisons, we ensure that no shadow encroaches upon the realm, and that the authority of the Sun remains unchallenged across all lands."
improve_defence_effort_decree:0 "Strengthened the Burning Frontiers"


boost_officer_corps_decree_title:0 "Reform the Burning Corps"
boost_officer_corps_decree_desc:0 "An army is only as disciplined as those who command it. By reforming the Burning Corps, refining its hierarchy, and rewarding merit above birth, we ensure that our commanders lead with both skill and devotion to the One Faith."
boost_officer_corps_decree:0 "Reformed the Burning Corps"




codify_single_whip_law_decision_title:0 "Codify the Law of Tribute"
codify_single_whip_law_decision_desc:0 "By codifying the Law of Tribute we shall enshrine its statutes within our legal tradition, replacing scattered levies and obligations with a single, orderly contribution demanded in the name of the Prophet of the Sun and sanctioned by the Mandate of the Sun."

reign_in_estates_decision_title:0 "Restrain the Factions"
reign_in_estates_decision_desc:0 "The great families, merchant leagues, temple authorities, and military cliques of our realm have grown bold, guarding their privileges while pressing constantly for greater influence. If left unchecked, their rivalries may fracture the unity granted to us by the Eternal Light. We must curb their excesses and remind all that authority flows from the Prophet of the Sun alone."

reform_civil_registration_decision_title:0 "Institute the Sun Registry"
reform_civil_registration_decision_desc:0 "A comprehensive registry shall be established to record every household, holding, and obligation within our dominion. Through the Diwan al-Nufus we shall better administer justice, taxation, and welfare, ensuring that all who live beneath our banner are accounted for and properly governed."

establish_silver_standard_decision_title:0 "Proclaim the Silver Standard"
establish_silver_standard_decision_desc:0 "The Law of Unified Tribute has strengthened the treasury and regularized our revenues. Yet prosperity without discipline invites debasement and inflation. By proclaiming a fixed silver standard for our coinage, we safeguard the realm’s markets and affirm confidence in the currency issued under our seal."

kanhe_certificate_decision_title:0 "Issue the Solar Charter"
kanhe_certificate_decision_desc:0 "By granting a formal charter to approved merchants and trading houses, we empower them to act in our name across sea and desert alike. The Tijara Charter will strengthen our commerce abroad while ensuring that access to our markets remains a privilege regulated by the state."

new_keju_formats_decision_title:0 "Reform Solar Examinations"
new_keju_formats_decision_desc:0 "To serve within the Divans is both honor and burden. By reforming the examinations overseen by the Majlis and introducing stricter standards of learning, law, and doctrine, we ensure that only the most capable and devout candidates rise to administer the realm in accordance with the One Faith."

inclusive_monarchy_decision_title:0 "Guardianship of All"
inclusive_monarchy_decision_desc:0 "Our dominion stretches across deserts, coasts, jungles, and cities of many tongues and customs. Though the One Faith proclaims the Sun as the sole and indivisible truth, wisdom demands justice toward all who dwell beneath our rule. By tempering zeal with measured governance, we shall cultivate a realm where loyalty is rewarded, order is maintained, and even those newly brought into the light are treated with dignity under the law."

promote_bureaucratic_faction_decision_title:0 "§OEmpower the Scribes§!"
promote_bureaucratic_faction_decision_desc:0 "The strength of our state lies in its learned scribes, judges, and administrators who interpret divine law and carry out the will of the Prophet of the Sun. By elevating the authority of the Divan and favoring those trained in governance over the champions of the battlefield, we secure internal stability and ensure that order prevails within.\n§YMutually exclusive with the 'Promote Generals' reform§!\n"

promote_military_faction_decision_title:0 "§OEmpower the Generals§!"
promote_military_faction_decision_desc:0 "It is the sword that defends the faithful and expands the domain granted to us by the Mandate of the Sun. Those who bleed for the realm deserve precedence over quill-bound officials lost in procedure. By raising the standing of our emirs and captains, we ensure that strength and resolve guide the destiny of the empire.\n§YMutually exclusive with the 'Promote Bureaucrats' reform§!\n"

unifed_trade_market_decision_title:0 "Enforce Solar Currency"
unifed_trade_market_decision_desc:0 "From the caravan cities of the interior to the great ports of the coast, our influence touches countless bazaars and trade routes. By standardizing tolls, measures, and access across these markets, we grant our merchants unprecedented reach and profit, strengthening both our treasury and our authority over commerce throughout the Southlands."

reform_the_military_branch_decision_title:0 "Reform Faithful Armies"
reform_the_military_branch_decision_desc:0 "An empire entrusted with the Mandate of the Sun requires not only brave warriors, but disciplined formations and enduring institutions. Valor alone no longer suffices in an age of shifting tactics and distant campaigns. By organizing a permanent and reformed standing army, loyal first to the Prophet of the Sun, we shall secure our dominion and preserve our supremacy."

modernize_the_banners_decision_title:0 "Reform the Tribal Banners"
modernize_the_banners_decision_desc:0 "The great tribal banners have long ridden at the forefront of our conquests, their loyalty forged by oath and faith. Yet tradition without renewal invites decline. If we are to preserve their discipline and battlefield prowess, we must standardize their command, equipment, and obligations, lest they fall into complacency and factionalism."

study_foreign_ship_designs_decision_title:0 "Foreign Naval Traditions"
study_foreign_ship_designs_decision_desc:0 "Beyond our shores sail vessels of unfamiliar construction and cunning design. Their hulls and rigging reveal innovations our own shipwrights would do well to master. By commissioning detailed study of foreign ships and disseminating these findings among our dockyards, we shall strengthen our fleets and assert our presence upon distant seas."

tributary_embassies_decision_title:0 "Embassies of Submission"
tributary_embassies_decision_desc:0 "The realms that offer tribute must be bound not only by payment, but by constant diplomacy and watchful oversight. By establishing permanent embassies within the courts of our tributaries, we ensure steady communication, discourage rebellion, and remind all rulers that their authority stands beneath the shadow of the Prophet of the Sun."

new_world_discovery_decision_title:0 "Horizon Expeditions"
new_world_discovery_decision_desc:0 "Distant lands across the seas promise rare goods, unclaimed harbors, and peoples yet untouched by the light of the One Faith. By directing imperial resources toward organized expeditions and learned inquiry, we shall chart these horizons and lay the foundations for future dominion and prosperity."



 #Decisions
reform_the_administration_of_china_decision_title:0 "Purge the Palace Cliques"
reform_the_administration_of_china_decision_desc:0 "For too long have courtly functionaries and cloistered attendants gathered influence beyond their proper station, whispering into the ears of rulers and bending decrees to serve hidden interests. The realm and the Radiant Throne belong to the Prophet of the Sun alone. We must strip these palace cliques of their undue privileges and restore clear authority to the Divans, lest intrigue and corruption bring the empire to ruin."

