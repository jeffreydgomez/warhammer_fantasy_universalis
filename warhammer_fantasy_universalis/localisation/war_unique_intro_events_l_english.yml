 war_unique_intro_events.372.d:0 "Clan Scruten counts everything, especially secrets. Its tunnel auditors, blackmail ledgers, informant clawpacks, and suspicious scribes know that a knife is useful once, but a document can stab forever if copied thirteen times.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is watched, numbered, and full of fools leaving evidence, so we must audit the knives before anyone audits us.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.372.a:0 "Audit the knives."

 war_unique_intro_events.373.t:0 "Crooked Tails in the Waste"
 war_unique_intro_events.373.d:0 "Clan Crooktail calls mutation favor because the alternative is admitting the tail should not bend that way. Warpstone-choked warrens, northern waste scars, tainted envoys, and frenzied clawpacks make its deformities both theology and threat.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is warped, cold, and glowing in the dark, so we must bless the crooked tail and make every twisted body proof the Horned Rat noticed us.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.373.a:0 "Bless the crooked tail."

 war_unique_intro_events.374.t:0 "Skull Masks in the Dark"
 war_unique_intro_events.374.d:0 "Clan Skully pays in bone tokens and collects in silence. Skull-masked night runners, Eshin murder contracts, backstabber clawpacks, and vanishing tunnels let its killers appear as rumor, blade, and empty space in exactly that order.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is masked, quiet, and full of clients pretending courage, so we must take the bone-token and leave the corpse where negotiations can find it.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.374.a:0 "Take the bone-token."

 war_unique_intro_events.375.t:0 "First Hold of the South"
 war_unique_intro_events.375.d:0 "Karak Zorn is a name older than many grudges and lonelier than most songs admit. Southland jungle presses against ancient gates, lost veins glitter under roots, and ancestor oaths survive in halls that the northern Karaz Ankor half remembers as legend.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is ancient, isolated, and watched by jungles that swallow certainty, so we must keep Zorn awake and prove the first southern hold still answers in Khazalid.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.375.a:0 "Keep Zorn awake."

 war_unique_intro_events.376.t:0 "Belegar's Bitter Road"
 war_unique_intro_events.376.d:0 "Clan Angrund lives with Karak Eight Peaks like a wound that learned to speak. Belegar Ironhammer's claim, King Lunn's memory, exile camps, Ironbreaker veterans, and maps of the City of Pillars make every march a lawsuit written in axes.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is dispossessed, bitter, and righteous, so we must march for the Eight Peaks until the mountain hears its true heirs at the gates.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.376.a:0 "March for the Eight Peaks."

 war_unique_intro_events.377.t:0 "Headtaker's Red Guard"
 war_unique_intro_events.377.d:0 "Queek Headtaker does not need subtlety when trophies explain him so well. His Red Guard, kill-routes, head racks, and disciplined Mors auxiliaries make every tunnel near Karak Eight Peaks feel like a corridor leading to someone else's skull.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is red, violent, and crowded with claimants, so we must take heads for Queek before Dwarf and Goblin rivals remember how to breathe.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.377.a:0 "Take heads for Queek."

 war_unique_intro_events.378.t:0 "Queen of the Silver Depths"
 war_unique_intro_events.378.d:0 "Karak Eight Peaks is not a hold so much as a war that learned architecture. The Queen of the Silver Depths still shines beneath ruin, but Skaven gnaw below, Goblins mock above, and Dwarf claimants measure every hall against what was stolen.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is legendary, ruined, and contested by enemies who have lived too long in our inheritance, so we must reclaim every hall and make the Eight Peaks one hold again.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.378.a:0 "Reclaim every hall."

 war_unique_intro_events.379.t:0 "Spike-Fungus Warrens"
 war_unique_intro_events.379.d:0 "Clan Skrittlespike has lived in the deep long enough to make darkness provincial. Spike-fungus warrens, deadfalls, stoneblind tunnel law, and rare surface bargains keep its rats strange, cautious, and extremely proud of traps no visitor survives to criticize.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is deep-deep, isolated, and full of footsteps we did not invite, so we must set the deep spikes and let gravity handle diplomacy.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.379.a:0 "Set the deep spikes."

 war_unique_intro_events.380.t:0 "Bone Armor of Mordkin"
 war_unique_intro_events.380.d:0 "Clan Mordkin hates the dead because they do not squeal properly. Bone-armored Stormvermin, corpse-warren tithes, Fellblade legends, and necropolis informants make its warriors stalk graves with a mixture of terror, envy, and professional interest.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is skull-white, disciplined, and surrounded by dead-things that refuse to stay useful, so we must rattle the dead-things and prove fear belongs to the living.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.380.a:0 "Rattle the dead-things."

 war_unique_intro_events.381.t:0 "Green Brands of Grutnik"
 war_unique_intro_events.381.d:0 "Clan Grutnik owns enough green glow to make greed look religious. Warpstone deposits, branded miners, Skryre buyers, Moulder buyers, toxic armor, and paid diggers make its tunnels rich, unstable, and popular with exactly the wrong visitors.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is wealthy, glowing, and one cave-in from opportunity, so we must sell the green glow before it burns holes in anyone important.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.381.a:0 "Sell the green glow."

 war_unique_intro_events.382.t:0 "Endless Verms"
 war_unique_intro_events.382.d:0 "Clan Verms is what happens when numbers become an argument. Breeding warrens, refuse tolls, gnawhole quartermasters, sewer-scent envoys, and clawpacks without obvious end give its bosses a beautiful answer to every tactical question: more rats.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is crowded, cheap, and constantly reproducing, so we must drown them in rats until even failure suffocates under replacements.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.382.a:0 "Drown them in rats."

 war_unique_intro_events.383.t:0 "Lord Skrolk's Procession"
 war_unique_intro_events.383.d:0 "Lord Skrolk's procession is a sermon delivered by coughing, bells, and death. Plague monks, censer-bearer clouds, the Liber Bubonicus, and rotten tribute trains follow him through Lustria like a holy argument against clean air.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is sacred, diseased, and eager for unbelievers, so we must swing the plague censer and make the jungle rot in the Horned Rat's name.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.383.a:0 "Swing the plague censer."

 war_unique_intro_events.384.t:0 "Red Auxiliaries of Vrrtkin"
 war_unique_intro_events.384.d:0 "Clan Vrrtkin has learned from Clan Mors that discipline is just fear with a schedule. Red-clan auxiliaries, drill warrens, supply gnawholes, and Stormvermin aspirants keep its swarms moving toward Karak Eight Peaks with unusual purpose.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is organized, hungry, and close to greater wars, so we must push until they squeal and call the noise morale.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.384.a:0 "Push until they squeal."

 war_unique_intro_events.385.t:0 "Hooked Blades of Klaw"
 war_unique_intro_events.385.d:0 "Clan Klaw names subtlety only so it can bite the word. Hooked weapons, claw racks, grapple packs, boss-claw duels, and scratch-forges make its warrens a place where status is counted in scars left on other bodies.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is close, sharp, and full of rivals with exposed throats, so we must hang the claw-rack and let everyone see whose talons matter.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.385.a:0 "Hang the claw-rack."

 war_unique_intro_events.386.t:0 "Treaties of Treachery"
 war_unique_intro_events.386.d:0 "Clan Treecherik believes a treaty is an ambush that learned calligraphy. False scribes, blackmail tolls, stab-later storehouses, and treachery rites let its envoys smile just long enough for the other side to relax.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is polite, profitable, and begging for betrayal, so we must sign, smile, stab, and deny the order of events afterward.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.386.a:0 "Sign, smile, stab."

 war_unique_intro_events.387.t:0 "Vats of Clan Flem"
 war_unique_intro_events.387.d:0 "Clan Flem has turned mucus into infrastructure. Phlegm-vats bubble under its warrens, spittle-censer priests bless choking clouds, and disgusting envoys prove that some negotiations end because the other side cannot bear to continue breathing.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is foul, resilient, and admirably hard to stand near, so we must bubble the phlegm-vats until disgust becomes defense.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.387.a:0 "Bubble the phlegm-vats."

 war_unique_intro_events.388.t:0 "Blackened Limb Tokens"
 war_unique_intro_events.388.d:0 "Gangrous teaches its rats that pain is a luxury for creatures with healthy nerves. Blackened limb tokens, rot-tax surgeons, gangrene pit cults, and numb clawpacks make a warband that keeps marching after sensible bodies would resign.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is infected, stubborn, and surprisingly mobile, so we must march on numb legs and let the enemy wonder why we have not fallen down.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.388.a:0 "March on numb legs."

 war_unique_intro_events.389.t:0 "Blood beneath the Ice"
 war_unique_intro_events.389.d:0 "The Frozen Expedition went north seeking stone, ore, and answers, then found a curse patient enough to wait under ice. Pale Dawi still keep ledgers, frost-sealed grudgebooks, and blood-iron storehouses, but night has become a practical part of the watch rotation.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is frozen, cursed, and still Dawi enough to remember every wrong, so we must read the frost-grudges and decide which debts can be paid after death.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.389.a:0 "Read the frost-grudges."

 war_unique_intro_events.390.t:0 "The Age of Fire and Chains"
 war_unique_intro_events.390.d:0 "Dhrath-Zharr-Ankor is the dream of the Dawi-Zharr written in smoke. Hashut's priests, infernal guard, engine forges, slave pens, black ziggurats, and molten canals all point toward an empire where obedience is measured by production and pain.\n\nThe Dawi-Zharr serve Hashut from smoke, iron, ziggurats, and furnaces that make mercy sound like a production error. Their exile from the western Dawi became doctrine, their bitterness became machinery, and their chains became the grammar of empire.\n\nZharr-Naggrund and the Dark Lands teach cruel practicality. Sorcerer-prophets command, overseers count, Infernal Guard obey, daemon-smiths bind impossible engines, and slaves of many peoples are fed into mines, foundries, canals, and artillery yards until the numbers satisfy the Father of Darkness.\n\nThe Age of Fire and Chains is not a metaphor to the Dawi-Zharr. It is a schedule, an industrial target, and a religious duty. Every mountain can be hollowed, every plain blackened, every river turned to transport, and every lesser race made useful by force.\n\nYet dominion must begin with consolidation. Rival lords, rebellious slaves, Greenskin tribes, Ogre roads, Cathayan routes, Dwarf grudges, and the tempting mouth of the River Ruin all demand a hand steady enough to hold whip, ledger, and hammer together.\n\nThe situation is cruel, organized, and ready to burn outward, so we must stoke Hashut's empire until the weak learn the shape of chains.\n\nHashut's will is not patient because patience is gentle. It is patient because iron takes time to heat before it can be shaped, and the world is only another ingot waiting for the anvil."
 war_unique_intro_events.390.a:0 "Stoke Hashut's empire."

 war_unique_intro_events.391.t:0 "The Norse Dawi Gather"
 war_unique_intro_events.391.d:0 "Ankhor Dumbaraz belongs to Dawi shaped by colder seas, harsher mountains, and long isolation from the southern holds. Kraka clans, sapphire veins, gromril memories, construction oaths, and grudges against Kazaki-dum all demand a realm that can survive the north without becoming it.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is cold, proud, and scattered among krakas, so we must unite the krakas before northern darkness mistakes kinship for weakness.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.391.a:0 "Unite the krakas."

 war_unique_intro_events.392.t:0 "The Under-Empire Rises"
 war_unique_intro_events.392.d:0 "The Under-Empire is everywhere the surface is foolish enough not to look. Skavenblight, gnawholes, engines, laboratories, slave pits, breeding warrens, spy tunnels, and Council whispers make a realm whose borders are defined by ignorance above.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is vast-vast, treacherous, and beautifully beneath them all, so we must rise-rise beneath them before the surface-things learn how hollow their world has become.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.392.a:0 "Rise-rise beneath them."

 war_unique_intro_events.393.t:0 "The Karaz Ankor Reforged"
 war_unique_intro_events.393.d:0 "The Karaz Ankor is not a memory to the Dawi; it is the rightful shape of the mountains. The Everpeak, Karak Kadrin, Zhufbar, Karak Azul, Karak Eight Peaks, the old roads, and every lost hold remain entries in a debt book older than many kingdoms.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is ancient, broken, and still lawful in the eyes of the ancestors, so we must reforge the mountain realm and make the golden age a task rather than a lament.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.393.a:0 "Reforge the mountain realm."

 war_unique_intro_events.394.t:0 "The Coast That Would Not Die"
 war_unique_intro_events.394.d:0 "The Vampire Coast is less a country than a shoreline that refused burial. Luthor Harkon's madness, barnacled grave-ports, corpse-haunted coves, zombie press gangs, and cannon crews dragged from the surf have made Lustria's eastern waters a kingdom of wet rot and ambition.\n\nThe Vampire Coast is piracy and necromancy fused into government. Wrecks become recruiting grounds, drowned crews become labor, cursed captains become policy, and every black sail tells the living that the sea remembers its dead.\n\nA realm of corpse-sailors does not need the same bargains as mortal pirates. It needs harbors to frighten, charts to stolen wealth, bodies to crew the guns, and coastal trade centers where fear, plunder, and occult logistics can be made permanent.\n\nThe living powers of the world trust too much in walls, contracts, admiralties, and the old habit that ships return with breathing crews. Every convoy, fishing town, colonial port, pilgrim vessel, and merchant prince becomes vulnerable when fog, cannon smoke, and necromancy move together.\n\nRaiding is only the first act. We must claim the ports that matter, make every coastal market hear our guns in its dreams, and prove that death at sea can be organized into a state.\n\nThe situation is soaked in salt, death, and opportunity, so we must raise every black sail and teach the living that the Coast does not end where the jungle begins.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
 war_unique_intro_events.394.a:0 "Raise every black sail."

 war_unique_intro_events.395.t:0 "The Sisterhood of the Old Ones"
 war_unique_intro_events.395.d:0 "Amazonia keeps the Old Ones in a human voice. Sisterhood warbands, river gardens, hidden shrines, sunstaff relics, and priestess councils preserve a sacred inheritance older than their settlements and stranger than any warm-blooded empire can comfortably explain.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is sacred, secluded, and watched by both scale and stranger, so we must guard the relic shrines until Amazon courage and Old One memory become one defense.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.395.a:0 "Guard the relic shrines."

 war_unique_intro_events.396.t:0 "Skeggi's Long Beach"
 war_unique_intro_events.396.d:0 "Skeggi is the oldest human foothold in Lustria, which means it has survived by being too stubborn, useful, and violent to disappear. Its stilted streets, rough docks, jungle roads, Norscan jarls, and treasure-drunk explorers cling to the coast between reptile gods and hungry green darkness.\n\nThe Norscans are raiders, reavers, and oath-boasters from lands where hunger has teeth and mercy freezes before it can become custom. Longships, mead halls, jarls, shield walls, beast trophies, and blood promises bind their people to a life where strength must be shown before it is believed.\n\nThe gods of the north are not gentle patrons. Khorne asks for skulls, Nurgle for endurance, Tzeentch for cunning, Slaanesh for excess, and every dark power listens more closely when ships return heavy with plunder and stories of frightened southerners.\n\nA Norscan realm survives by motion. The sea is road, weapon, witness, and escape route; the coast is a staging ground; the raid is economy and worship together. Weak neighbors become tribute, strong neighbors become songs, and distant lands exist because someone has not yet sailed there to test them.\n\nThe End Times will not reward those who wait politely for doom. The Everchosen will rise from the chaos-worshippers, the southern realms will tremble, and every jarl must decide whether he will be remembered as prey, rival, or blade in the final storm.\n\nThe situation is distant, hot, and rich with enemies who do not yet respect our beach, so we must raid from the jungle shore until Skeggi becomes more than a camp at the world's edge.\n\nThe north teaches a simple law even on foreign shores: sharpen the axes, ready the ships, and take what the gods have left within reach."
 war_unique_intro_events.396.a:0 "Raid from the jungle shore."

 war_unique_intro_events.397.t:0 "Xahutec's Old Watch"
 war_unique_intro_events.397.d:0 "Xahutec is the City of Echoes, and not every echo belongs to the living. Rift-sealed ruins, tainted spawning pools, old wards, daemon-hunter cohorts, and messages carried toward Itza make its stones sound with warnings left by catastrophes that never fully ended.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is haunted, sealed, and still vibrating with old mistakes, so we must read the green omens and make Xahutec answer the Great Plan without opening the wrong wound.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.397.a:0 "Read the green omens."

 war_unique_intro_events.398.t:0 "Tlax Counts the Fallen Stars"
 war_unique_intro_events.398.d:0 "Tlax is called the City of Ghosts because memory walks heavily there. Pearl stores, Tarantula Coast wardens, spectral battle omens, golden spire lures, and Skink envoys move through a temple-city where absence has become part of the garrison.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is silent, watchful, and full of old lights falling through the mist, so we must align the star-stones and let the ghosts point toward living duty.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.398.a:0 "Align the star-stones."

 war_unique_intro_events.399.t:0 "Chaqua's Rain-Temple"
 war_unique_intro_events.399.d:0 "Chaqua was the City of Gold before plague and violation turned splendor into warning. Storehouses of golden plaques, cleansing cohorts, purification rites, Sotek's remembered omen, and wary Skink diplomats now stand between sacred wealth and the filth that once defiled it.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is golden, stained, and heavy with Skaven memory, so we must wake the rain rites and wash Chaqua until its wealth serves purity rather than pride.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.399.a:0 "Wake the rain rites."

 war_unique_intro_events.400.t:0 "Axlotl's Broken Pools"
 war_unique_intro_events.400.d:0 "Axlotl is a city that has learned the ritual of falling and returning. Its fourth spawning legacy, reclaimed ruins, wounded pools, anti-Skaven patrols, jungle economies, and cohorts that refuse final defeat make survival feel almost like an ancient office.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is scarred, reclaimed, and still producing warriors from wounded water, so we must cleanse the spawning pools and make return itself into Axlotl's command.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.400.a:0 "Cleanse the spawning pools."

 war_unique_intro_events.401.t:0 "Quetza beneath the Plague Canopy"
 war_unique_intro_events.401.d:0 "Quetza is the Defiled City, where Clan Pestilens made disease into occupation and sacred stone learned the smell of rot. Plague wards, quarantine registers, cavern contemplatives, cautious envoys, and hardened cohorts keep watch over a temple-city that cannot afford forgetfulness.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is diseased, sacred, and one careless rite from renewed disaster, so we must seal the plague gates and make Quetza's caution into holy strength.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.401.a:0 "Seal the plague gates."

 war_unique_intro_events.402.t:0 "Xhotl's Silent Stones"
 war_unique_intro_events.402.d:0 "Xhotl was the City of Destiny before destiny became a battlefield. Kroq-Gar's first defense, collapsed Slann barriers, refugee spawnings, doom-plaques, and the never-ending memory of daemon war make its stones feel less ruined than interrupted.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is fated, wounded, and still standing in the shadow of impossible war, so we must make the stones speak and let Xhotl remember the shape of victory.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.402.a:0 "Make the stones speak."

 war_unique_intro_events.403.t:0 "Subatuun's Hidden Sequence"
 war_unique_intro_events.403.d:0 "Subatuun measures holiness in terraces, canals, spawning cycles, and the disciplined movement of water. River-causeway patrols, reed-marked envoys, Skink ledgers, flooded steps, and sacred agricultural rites make the city a calculation written in mud, stone, and breath.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is measured, fertile, and vulnerable to any hand that breaks the pattern, so we must preserve the hidden sequence and let Subatuun prove patience can still move like a river.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.403.a:0 "Preserve the hidden sequence."

 war_unique_intro_events.404.t:0 "Oxyl at the Edge of the World"
 war_unique_intro_events.404.d:0 "Oxyl hides so thoroughly that discovery feels like a theological error. Chameleon Skink paths, venom stores, silent plaques, unseen diplomacy, and darts from the green dark make the jungle itself seem to hold a spear behind every leaf.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is concealed, watchful, and crowded with intruders who think silence means safety, so we must hold the jungle edge and let Oxyl answer trespass before it understands the question.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.404.a:0 "Hold the jungle edge."

 war_unique_intro_events.405.t:0 "Xeti's Cold Constellations"
 war_unique_intro_events.405.d:0 "Xeti keeps its watch in thin air and cold mist, where white-stone ziggurats rise above jungle heat like thoughts made visible. Highland spawning pools, mountain causeway guards, cold storehouses, and envoys from the high canopies give its duty a clear and distant edge.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is high, cold, and written in stars that lesser eyes mistake for decoration, so we must chart the cold stars and make Xeti's mountain silence speak in ordered war.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.405.a:0 "Chart the cold stars."

 war_unique_intro_events.406.t:0 "Spektazuma's Sacred Mirrors"
 war_unique_intro_events.406.d:0 "Spektazuma stands where scale, feather, skin, and river memory meet before the Old Ones. Oracle pools, Amazon-Skink warbands, relic gardens, hidden sister-temples, and sacred parleys give the city an inheritance shared by peoples who read different signs toward the same design.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is mixed, sacred, and brighter than outsiders know how to interpret, so we must polish the sacred mirrors until every omen shows which hand should move next.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.406.a:0 "Polish the sacred mirrors."

 war_unique_intro_events.407.t:0 "Huatl's Patient Geometry"
 war_unique_intro_events.407.d:0 "Huatl is aligned to the sun because order should cast a measurable shadow. Dawn envoys, coastal watchers, sun-marked trade courts, anti-vampire patrols, and Chotec's burning cohorts keep the eastern approaches under a light the undead cannot comfortably imitate.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Slann contemplate patterns that can outlast empires, Skinks interpret signs and maintain the sacred machinery of society, and Saurus cohorts wait with cold patience for the moment obedience becomes violence.\n\nLustria does not forgive negligence. Skaven dig beneath sanctuaries, undead things creep from haunted coasts, warm-blooded treasure seekers profane ruins, Daemons claw at old wounds, and rival temple interests disagree over which broken plaque should guide the present age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any single temple-city can answer from behind sacred walls.\n\nThe situation is bright, coastal, and menaced by dead sailors crawling from wrong waters, so we must complete the temple angles and make Huatl a sunrise the Vampire Coast cannot swallow.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, align city, jungle, cohort, priesthood, and omen, and prove that the Great Plan still has hands sharp enough to shape the age."
 war_unique_intro_events.407.a:0 "Complete the temple angles."

 war_unique_intro_events.408.t:0 "The Dreadwater Empire"
 war_unique_intro_events.408.d:0 "The Dreadwater Empire is what happens when pirate hunger acquires a throne. Bound hulls, ghostfire bombardments, drowned fortresses, cursed navigators, terror-bound captains, and black harbors make the ocean itself feel like conquered territory.\n\nThe Vampire Coast is piracy and necromancy fused into government. Wrecks become recruiting grounds, drowned crews become labor, cursed captains become policy, and every black sail tells the living that the sea remembers its dead.\n\nA realm of corpse-sailors does not need the same bargains as mortal pirates. It needs harbors to frighten, charts to stolen wealth, bodies to crew the guns, and coastal trade centers where fear, plunder, and occult logistics can be made permanent.\n\nThe living powers of the world trust too much in walls, contracts, admiralties, and the old habit that ships return with breathing crews. Every convoy, fishing town, colonial port, pilgrim vessel, and merchant prince becomes vulnerable when fog, cannon smoke, and necromancy move together.\n\nRaiding is only the first act. We must claim the ports that matter, make every coastal market hear our guns in its dreams, and prove that death at sea can be organized into a state.\n\nThe situation is imperial, drowned, and rich with coasts that still pretend they belong to the living, so we must claim the trade winds and make every current carry Dreadwater authority.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
 war_unique_intro_events.408.a:0 "Claim the trade winds."

 war_unique_intro_events.409.t:0 "Gloamsworn in the Canal Mists"
 war_unique_intro_events.409.d:0 "Gloamsworn hides in the damp margins of Tilea, where canal fog softens borders and civilized men pretend every missing patrol was merely unlucky. Gloam-lairs, stolen tolls, condottieri bargains, mist-oath nobles, and night raids on Reman roads give these Fimir a strangely urban hunting ground.\n\nThe Fimir are a people of wet stone, one-eyed malice, and old humiliation. Marsh holds, drowned causeways, mist gates, Balefiend rites, Fimm warbands, and tyrannical chieftains keep their society hidden where civilized maps become guesses and warnings.\n\nChaos does not love the Fimir as loudly as it loves its favored champions, but neglect can sharpen hunger. Khorne may notice cruelty, Tzeentch may find a use for fog and prophecy, Nurgle may smile at the mire, and Slaanesh may be amused by stubborn desperation that refuses to die quietly.\n\nA Fimir realm survives by making obscurity practical. The bog is border and weapon, mist is diplomacy and ambush, tribute is taken before it is negotiated, and every captive road, canal, fenline, or reed hall must serve the rule of those strong enough to command from the dark.\n\nThe age is not kind to forgotten peoples. Men drain marshes, Dwarfs remember old wrongs, Elves recoil from corruption, Lizardmen reject any design not sanctioned by the Old Ones, and stronger Chaos powers would happily spend Fimir lives for grander victories.\n\nThe Fimir must therefore make exile dangerous. We must bind mist, oath, shaman, warrior, hostage, shrine, and swamp-law into a realm that cannot be dismissed as a tale told beside bad water.\n\nThe situation is profitable, wet, and surrounded by city-states too clever for their own safety, so we must raise the gloam-lairs and make the canal mists answer to Fimir law.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.409.a:0 "Raise the gloam-lairs."

 war_unique_intro_events.410.t:0 "Murklurth's Drowned Tribute"
 war_unique_intro_events.410.d:0 "Murklurth remembers kingship as a thing spoken under bog moons and paid for in drowned tribute. Fen-kings, reed halls, black-water altars, swamp-causeway ambushes, and heavy-tailed Fimm make its rule feel older than the roads that try to cross it.\n\nThe Fimir are a people of wet stone, one-eyed malice, and old humiliation. Marsh holds, drowned causeways, mist gates, Balefiend rites, Fimm warbands, and tyrannical chieftains keep their society hidden where civilized maps become guesses and warnings.\n\nChaos does not love the Fimir as loudly as it loves its favored champions, but neglect can sharpen hunger. Khorne may notice cruelty, Tzeentch may find a use for fog and prophecy, Nurgle may smile at the mire, and Slaanesh may be amused by stubborn desperation that refuses to die quietly.\n\nA Fimir realm survives by making obscurity practical. The bog is border and weapon, mist is diplomacy and ambush, tribute is taken before it is negotiated, and every captive road, canal, fenline, or reed hall must serve the rule of those strong enough to command from the dark.\n\nThe age is not kind to forgotten peoples. Men drain marshes, Dwarfs remember old wrongs, Elves recoil from corruption, Lizardmen reject any design not sanctioned by the Old Ones, and stronger Chaos powers would happily spend Fimir lives for grander victories.\n\nThe Fimir must therefore make exile dangerous. We must bind mist, oath, shaman, warrior, hostage, shrine, and swamp-law into a realm that cannot be dismissed as a tale told beside bad water.\n\nThe situation is moonlit, drowned, and rich with travelers who think causeways mean permission, so we must crown the fen-kings and teach the bog to collect what it is owed.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.410.a:0 "Crown the fen-kings."

 war_unique_intro_events.411.t:0 "The Reach of the Bog"
 war_unique_intro_events.411.d:0 "Bogreach is a border that keeps moving in the mist. Reed-marked tributaries, fog-hidden outposts, toll raids beyond the fenline, hostage bargains, and Fimm shield circles make its territory less a map than a warning repeated by survivors.\n\nThe Fimir are a people of wet stone, one-eyed malice, and old humiliation. Marsh holds, drowned causeways, mist gates, Balefiend rites, Fimm warbands, and tyrannical chieftains keep their society hidden where civilized maps become guesses and warnings.\n\nChaos does not love the Fimir as loudly as it loves its favored champions, but neglect can sharpen hunger. Khorne may notice cruelty, Tzeentch may find a use for fog and prophecy, Nurgle may smile at the mire, and Slaanesh may be amused by stubborn desperation that refuses to die quietly.\n\nA Fimir realm survives by making obscurity practical. The bog is border and weapon, mist is diplomacy and ambush, tribute is taken before it is negotiated, and every captive road, canal, fenline, or reed hall must serve the rule of those strong enough to command from the dark.\n\nThe age is not kind to forgotten peoples. Men drain marshes, Dwarfs remember old wrongs, Elves recoil from corruption, Lizardmen reject any design not sanctioned by the Old Ones, and stronger Chaos powers would happily spend Fimir lives for grander victories.\n\nThe Fimir must therefore make exile dangerous. We must bind mist, oath, shaman, warrior, hostage, shrine, and swamp-law into a realm that cannot be dismissed as a tale told beside bad water.\n\nThe situation is stretched, shifting, and full of neighbors who forget where firm ground ends, so we must mark the fenline and make every border crossing feel like a bargain with the dark.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.411.a:0 "Mark the fenline."

 war_unique_intro_events.412.t:0 "Mirecourt's Marsh-King"
 war_unique_intro_events.412.d:0 "Mirecourt calls itself a court because terror enjoys ceremony. Marsh-kings, captive tribute halls, Balefiend judgments, fen-mist envoys, tail-maul retinues, and reed-hidden shrines make law out of damp stone, silence, and the certainty that prisoners are listening.\n\nThe Fimir are a people of wet stone, one-eyed malice, and old humiliation. Marsh holds, drowned causeways, mist gates, Balefiend rites, Fimm warbands, and tyrannical chieftains keep their society hidden where civilized maps become guesses and warnings.\n\nChaos does not love the Fimir as loudly as it loves its favored champions, but neglect can sharpen hunger. Khorne may notice cruelty, Tzeentch may find a use for fog and prophecy, Nurgle may smile at the mire, and Slaanesh may be amused by stubborn desperation that refuses to die quietly.\n\nA Fimir realm survives by making obscurity practical. The bog is border and weapon, mist is diplomacy and ambush, tribute is taken before it is negotiated, and every captive road, canal, fenline, or reed hall must serve the rule of those strong enough to command from the dark.\n\nThe age is not kind to forgotten peoples. Men drain marshes, Dwarfs remember old wrongs, Elves recoil from corruption, Lizardmen reject any design not sanctioned by the Old Ones, and stronger Chaos powers would happily spend Fimir lives for grander victories.\n\nThe Fimir must therefore make exile dangerous. We must bind mist, oath, shaman, warrior, hostage, shrine, and swamp-law into a realm that cannot be dismissed as a tale told beside bad water.\n\nThe situation is formal, cruel, and more organized than outsiders expect from the marsh, so we must hold court in the reeds and make every tribute hall prove the Marsh-King is no rumor.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.412.a:0 "Hold court in the reeds."

 war_unique_intro_events.413.t:0 "Drakgnaw's Bone Herd"
 war_unique_intro_events.413.d:0 "Drakgnaw measures strength in bones large enough to humble ordinary trophies. Dragon-bone gnawing rites, bull-horned warherds, marrow offerings at the herdstone, ravaged pasture tribute, and Beastlord horn-parleys make its Bovigors hungry for proof that even great beasts can be reduced to ornaments.\n\nThe Beastmen are not a kingdom, but a wound in the shape of a people. From the Drakwald to every cursed forest, ravine, steppe, black pine, and ruin where civilization fears the dark, the Children of Chaos gather around herdstones, Bray-Shamans, and the strongest horned killer.\n\nThey despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees.\n\nThe herd is strength only when it moves as one stampede. Rival Beastlords measure horns and scars, jealous shamans whisper beside black stones, lesser herds test every command, and every raid must feed both stomach and pride before disorder turns inward.\n\nThe Blood-Grounds are not merely land to occupy. They are hunting range, shrine, proving ground, and insult to every plow and city wall. Burned farms, broken roads, stolen herds, shattered watchtowers, and trampled banners all teach the weak that the old wildness still owns the world beneath their laws.\n\nThe situation is horned, heavy, and eager for prey worthy of the boast, so we must gnaw the dragon bones and drive Drakgnaw forward before the herd turns its strength on itself.\n\nNow the brayhorns sound. The herds must be driven into one stampede before rivals, prey, and the changing age turn the call into noise."
 war_unique_intro_events.413.a:0 "Gnaw the dragon bones."

 war_unique_intro_events.414.t:0 "Crackskull Gallops"
 war_unique_intro_events.414.d:0 "Crackskull arrives with hooves, sour wine, and the wet sound of heads meeting stone. Centigor pathbreakers, reeling charge songs, drunken herd bargains, skull-cracking gallops, and libations to Chaos make speed feel less like strategy than a riot with direction.\n\nThe Beastmen are not a kingdom, but a wound in the shape of a people. From the Drakwald to every cursed forest, ravine, steppe, black pine, and ruin where civilization fears the dark, the Children of Chaos gather around herdstones, Bray-Shamans, and the strongest horned killer.\n\nThey despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees.\n\nThe herd is strength only when it moves as one stampede. Rival Beastlords measure horns and scars, jealous shamans whisper beside black stones, lesser herds test every command, and every raid must feed both stomach and pride before disorder turns inward.\n\nThe Blood-Grounds are not merely land to occupy. They are hunting range, shrine, proving ground, and insult to every plow and city wall. Burned farms, broken roads, stolen herds, shattered watchtowers, and trampled banners all teach the weak that the old wildness still owns the world beneath their laws.\n\nThe situation is fast, drunk, and already leaning downhill toward violence, so we must break skulls at a gallop and let Crackskull prove that momentum can be a kind of command.\n\nNow the brayhorns sound. The herds must be driven into one stampede before rivals, prey, and the changing age turn the call into noise."
 war_unique_intro_events.414.a:0 "Break skulls at a gallop."

 war_unique_intro_events.415.t:0 "Gorefane's Blood Fetishes"
 war_unique_intro_events.415.d:0 "Gorefane belongs to the small, sharp, and numerous. Ungor knife-swarms, blood fetishes, scavenged loot from camp edges, braying skulkers, cowed underlings, and cringing envoys make weakness into a posture that lasts only until the enemy falls.\n\nThe Beastmen are not a kingdom, but a wound in the shape of a people. From the Drakwald to every cursed forest, ravine, steppe, black pine, and ruin where civilization fears the dark, the Children of Chaos gather around herdstones, Bray-Shamans, and the strongest horned killer.\n\nThey despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees.\n\nThe herd is strength only when it moves as one stampede. Rival Beastlords measure horns and scars, jealous shamans whisper beside black stones, lesser herds test every command, and every raid must feed both stomach and pride before disorder turns inward.\n\nThe Blood-Grounds are not merely land to occupy. They are hunting range, shrine, proving ground, and insult to every plow and city wall. Burned farms, broken roads, stolen herds, shattered watchtowers, and trampled banners all teach the weak that the old wildness still owns the world beneath their laws.\n\nThe situation is hungry, nervous, and full of strong enemies who forget to watch their ankles, so we must let the knife-swarms loose and stab every victory into existence.\n\nNow the brayhorns sound. The herds must be driven into one stampede before rivals, prey, and the changing age turn the call into noise."
 war_unique_intro_events.415.a:0 "Let the knife-swarms loose."

 war_unique_intro_events.416.t:0 "Rutshrak's Cliff Shrines"
 war_unique_intro_events.416.d:0 "Rutshrak keeps its shrines where cliffs answer every shout. Caprigor crag-herds, goat-path toll raids, horn-rack chieftains, rockfall ambushers, and hard-hooved raiders turn ravines into temples, roads into traps, and echoes into threats.\n\nThe Beastmen are not a kingdom, but a wound in the shape of a people. From the Drakwald to every cursed forest, ravine, steppe, black pine, and ruin where civilization fears the dark, the Children of Chaos gather around herdstones, Bray-Shamans, and the strongest horned killer.\n\nThey despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees.\n\nThe herd is strength only when it moves as one stampede. Rival Beastlords measure horns and scars, jealous shamans whisper beside black stones, lesser herds test every command, and every raid must feed both stomach and pride before disorder turns inward.\n\nThe Blood-Grounds are not merely land to occupy. They are hunting range, shrine, proving ground, and insult to every plow and city wall. Burned farms, broken roads, stolen herds, shattered watchtowers, and trampled banners all teach the weak that the old wildness still owns the world beneath their laws.\n\nThe situation is steep, loud, and perfect for enemies who look upward too late, so we must bray across the ravines and let Rutshrak make every cliff a herdstone.\n\nNow the brayhorns sound. The herds must be driven into one stampede before rivals, prey, and the changing age turn the call into noise."
 war_unique_intro_events.416.a:0 "Bray across the ravines."

 war_unique_intro_events.417.t:0 "Urzguth under Witchlights"
 war_unique_intro_events.417.d:0 "Urzguth prowls Naggaroth where the forests are black, the snow remembers blood, and Druchii cruelty has not made the wilds obedient. Blackpine bloodgrounds, witchlight warherds, spoils from Dark Elf roads, frost endurance, and shrines in black snow make its Beastmen cold without becoming calm.\n\nThe Beastmen are not a kingdom, but a wound in the shape of a people. From the Drakwald to every cursed forest, ravine, steppe, black pine, and ruin where civilization fears the dark, the Children of Chaos gather around herdstones, Bray-Shamans, and the strongest horned killer.\n\nThey despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees.\n\nThe herd is strength only when it moves as one stampede. Rival Beastlords measure horns and scars, jealous shamans whisper beside black stones, lesser herds test every command, and every raid must feed both stomach and pride before disorder turns inward.\n\nThe Blood-Grounds are not merely land to occupy. They are hunting range, shrine, proving ground, and insult to every plow and city wall. Burned farms, broken roads, stolen herds, shattered watchtowers, and trampled banners all teach the weak that the old wildness still owns the world beneath their laws.\n\nThe situation is frozen, hateful, and watched by masters of cruelty who think they own terror, so we must howl beneath black snow and remind Naggaroth that the wild was monstrous first.\n\nNow the brayhorns sound. The herds must be driven into one stampede before rivals, prey, and the changing age turn the call into noise."
 war_unique_intro_events.417.a:0 "Howl beneath black snow."

 war_unique_intro_events.418.t:0 "Khazrak's One-Eyed Herd"
 war_unique_intro_events.418.d:0 "The One-Eyes follow Khazrak because one lost eye taught him more than most chiefs learn from a lifetime of charging straight ahead. Drakwald raid patterns, warhounds, Bullgor shock herds, threats to Middenland, and the herdstone of the Blinded Beast make cunning feel like another horn.\n\nThe Beastmen are not a kingdom, but a wound in the shape of a people. From the Drakwald to every cursed forest, ravine, steppe, black pine, and ruin where civilization fears the dark, the Children of Chaos gather around herdstones, Bray-Shamans, and the strongest horned killer.\n\nThey despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees.\n\nThe herd is strength only when it moves as one stampede. Rival Beastlords measure horns and scars, jealous shamans whisper beside black stones, lesser herds test every command, and every raid must feed both stomach and pride before disorder turns inward.\n\nThe Blood-Grounds are not merely land to occupy. They are hunting range, shrine, proving ground, and insult to every plow and city wall. Burned farms, broken roads, stolen herds, shattered watchtowers, and trampled banners all teach the weak that the old wildness still owns the world beneath their laws.\n\nThe situation is forested, Imperial, and full of prey that still mistakes roads for safety, so we must set Khazrak's ambush and make the One-Eyes the lesson Middenland never stops fearing.\n\nNow the brayhorns sound. The herds must be driven into one stampede before rivals, prey, and the changing age turn the call into noise."
 war_unique_intro_events.418.a:0 "Set Khazrak's ambush."

 war_unique_intro_events.419.t:0 "Black Sails of Zandri"
 war_unique_intro_events.419.d:0 "Zandri faces the sea as if the horizon is another tomb door waiting to be opened. Amanhotep's pride, black-sailed warships, necropolis docks, Colossus-haunted quays, and sailors who forgot breathing long ago make the city a port where death still understands tides.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nZandri's advantage is motion. Tomb roads end at its harbor, treasure ships can become troopships, and every foreign merchant who laughs at dead sailors teaches the fleet which coast should hear our drums next.\n\nThe situation is briny, proud, and full of rivals who think the sea belongs to the living, so we must raise the harbor dead and make Zandri's black sails carry Nehekhara's return beyond the sand.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.419.a:0 "Raise the harbor dead."

 war_unique_intro_events.420.t:0 "Bhagar's Eternal Necropolis"
 war_unique_intro_events.420.d:0 "Bhagar broods over southern tomb fields where wealth lies beneath sealed doors and every funerary road seems to end in a warning. Necropolis estates, mortuary treasuries, bone scribes, desert watch posts, and nobles who have been patient for centuries give the city a hard, buried strength.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nBhagar cannot survive as a storehouse for thieves and carrion birds. Its southern tombs must become arsenals, its burial wealth must pay for obedience, and its quiet nobles must learn that eternity is useless unless it can issue orders.\n\nThe situation is wealthy, sealed, and too close to hungry roads, so we must open the southern tombs and make Bhagar's dead riches march before the living world spends them for us.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.420.a:0 "Open the southern tombs."

 war_unique_intro_events.421.t:0 "Rasetra's Vengeful Fortress"
 war_unique_intro_events.421.d:0 "Rasetra stands where Nehekharan stone meets the green dark, a fortress-city staring into jungles that do not respect old imperial maps. Border towers, vengeful garrisons, scarab-sealed gates, jungle road patrols, and chariot captains with old grudges keep the frontier from swallowing the dead whole.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nA frontier realm has no luxury of pure ceremony. Beasts, raiders, jungle spirits, Lizardman patrols, and rival tomb hosts all test whether Rasetra is truly a gate or merely a ruin with walls.\n\nThe situation is humid, watchful, and full of old enemies approaching from living green, so we must hold the jungle gate and teach every intruder that Rasetra's dead still remember vengeance.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.421.a:0 "Hold the jungle gate."

 war_unique_intro_events.422.t:0 "Khalida's Venom Crown"
 war_unique_intro_events.422.d:0 "Lybaras belongs to Khalida, and Khalida's hatred has never cooled into mere memory. Asp-crowned nobles, temple archers, sacred venom rites, royal tomb courts, and the unhealed insult of Lahmia make the city beautiful in the way a drawn blade can be beautiful.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nFor Lybaras, restoration is not only conquest. It is purification, discipline, and the promise that the vampire curse will find no comfortable shadow while Khalida's name can still command arrows.\n\nThe situation is venomous, noble, and fixed on wrongs that undeath has preserved perfectly, so we must let Lybaras hiss and make every Lahmian whisper fear the sound of our bowstrings.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.422.a:0 "Let Lybaras hiss."

 war_unique_intro_events.423.t:0 "Mahrak, City of the Gods"
 war_unique_intro_events.423.d:0 "Mahrak still calls itself the City of the Gods, though time has made that title feel like both inheritance and accusation. Hieratic councils, empty processional ways, broken sanctuaries, embalmed temple guards, and priests guarding rival interpretations of divine silence make holiness into politics.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nA sacred city can decay into a museum if no hand forces reverence to obey. Mahrak's temples must become councils of command, its gods must be honored by victory, and its priests must stop mistaking delay for wisdom.\n\nThe situation is holy, brittle, and crowded with ceremonies that need a sword behind them, so we must seat the hieratic council and make Mahrak worthy of the gods it claims.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.423.a:0 "Seat the hieratic council."

 war_unique_intro_events.424.t:0 "Numas and the Living Market"
 war_unique_intro_events.424.d:0 "Numas is stranger than most tomb cities because the living still bargain in its shadow. Market tents, chariot nobles, priests of the dead, caravan guards, and breathing servants who bow before skeletal kings make its streets an argument between habit and eternity.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nNumas can turn its oddity into power. Living traders carry news, mortal craftsmen repair what skeleton hands cannot improve, and every tolerated breath can be taxed, watched, and taught whom it serves.\n\nThe situation is bustling, reverent, and uneasy under dead authority, so we must bind the living to the dead and make Numas prove that obedience need not wait for the grave.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.424.a:0 "Bind the living to the dead."

 war_unique_intro_events.425.t:0 "Scytania's Jackal Moon"
 war_unique_intro_events.425.d:0 "The Scythans ride where Arabyan roads, Nehekharan tomb tales, and open desert freedom cut across one another. Horse clans, jackal banners, old grave-tribute, caravan raids, and priests who know which dead kings must still be flattered make Scytania hard to rule and harder to catch.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nScytania knows that belief must travel mounted. If the Solar Mandate cannot ride beside the clans, protect tomb roads, and turn raiding pride toward common purpose, then desert freedom will remain only another name for disunity.\n\nThe situation is swift, moonlit, and haunted by kings who never stopped collecting tribute, so we must ride the tomb roads and make Scythan horsemen carry the dawn farther than any sermon on foot.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.425.a:0 "Ride the tomb roads."

 war_unique_intro_events.426.t:0 "Black Sails of Sautekh"
 war_unique_intro_events.426.d:0 "Sautekh rules from a river mouth where black sails, embalmed admirals, and old harbor wealth refuse to become relics. Quay tombs, mortuary shipwrights, sealed warehouses, naval cult officers, and crews that answer drums without breath give the city a discipline the tide itself seems to respect.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nA harbor is a throne only if ships obey it. Sautekh must make its river fleets gather taxes, move legions, terrify living ports, and remind the inland kings that the water roads can carry ambition faster than sand.\n\nThe situation is tidal, black-sailed, and rich with enemies who think distance protects them, so we must unfurl the embalmed fleet and let Sautekh make Nehekharan command move by water.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.426.a:0 "Unfurl the embalmed fleet."

 war_unique_intro_events.427.t:0 "Maynarkh's Death-Harbors"
 war_unique_intro_events.427.d:0 "Maynarkh is austere even among the dead, a coastal necropolis where mercy sounds like a luxury invented by soft courts. Bone fleets, salt-stained tomb walls, wrathful dynasts, harbor execution rites, and quiet priests who prefer final answers make the realm feel carved from judgment.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nMaynarkh's strength is severity. If every quay becomes a muster ground, every debt a sentence, and every ship a coffin for disobedience, the coast may learn that order can be colder than the grave.\n\nThe situation is salt-black, harsh, and surrounded by harbors that still mistake trade for permission, so we must seal the black quays and make Maynarkh's wrath the law of the shore.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.427.a:0 "Seal the black quays."

 war_unique_intro_events.428.t:0 "Nephrekh's Radiant Masks"
 war_unique_intro_events.428.d:0 "Nephrekh gleams as though death itself learned vanity from the sun. Golden death masks, radiant sanctuaries, polished necropolis gates, sun-cult processions, and dynasts who measure legitimacy in reflected light make the city magnificent enough to invite envy.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nSplendor must not become stillness. Nephrekh's gold should blind enemies, pay soldiers, crown obedience, and remind rival kings that glory left buried is only treasure for thieves.\n\nThe situation is radiant, proud, and watched by every hand that covets a golden tomb, so we must lift the golden masks and make Nephrekh's brilliance command rather than decorate.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.428.a:0 "Lift the golden masks."

 war_unique_intro_events.429.t:0 "Martek's Pilgrim Flame"
 war_unique_intro_events.429.d:0 "Martek stands on roads where prayer, dust, water, and suspicion travel together. Pilgrim hosts, stern judges, caravan escorts, One Faith scholars, and desert notables who still remember older bargains make the city a test of whether revelation can govern tired feet as well as inspired hearts.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nMartek's pilgrims need more than sermons. They need wells secured, roads patrolled, heresy judged, and a state strong enough to make the Solar Mandate feel like protection rather than another tax on devotion.\n\nThe situation is devout, dusty, and full of travelers whose faith will be measured by danger, so we must guard the pilgrimage and make Martek's flame visible from every road.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.429.a:0 "Guard the pilgrimage."

 war_unique_intro_events.430.t:0 "Copher After Sunset"
 war_unique_intro_events.430.d:0 "Copher is a harbor of lamps, ledgers, perfume, locked shutters, and careful invitations after dusk. Merchant pashas, foreign factors, blood courts, corpse-lit counting houses, and public rites that hide private appetites make the city rich enough to make questions impolite.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nIn Copher, that unfinished work has teeth. The city's masters can speak the language of Arabyan order, but their night courts must keep trade flowing, suspicion managed, and hunger disciplined before zealots or rivals drag the truth into the sun.\n\nThe situation is wealthy, vampiric, and too useful for anyone to ignore, so we must count the blood-tithes and make Copher's harbor obey even when its rulers do not breathe like other men.\n\nThe deserts and seas must carry Araby's power to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no rival finds refuge in ignorance."
 war_unique_intro_events.430.a:0 "Count the blood-tithes."

 war_unique_intro_events.431.t:0 "Istrabul's Desert Gate"
 war_unique_intro_events.431.d:0 "Istrabul watches the desert gate with horses saddled, toll ledgers open, and reformers arguing under shaded arches. Cavalry courts, fortified caravanserais, supply depots, scholar-cadres, and frontier captains make the city a hinge between doctrine, profit, and hard road command.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nIstrabul's rulers know that a gate is only useful if it opens for friends and closes before enemies understand the price. Cavalry, trade law, and reform must move together or the frontier will choose its own masters.\n\nThe situation is mounted, administrative, and exposed to every road that wants a toll or a war, so we must muster the horse courts and make Istrabul the command post of the desert gate.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.431.a:0 "Muster the horse courts."

 war_unique_intro_events.432.t:0 "El-Kalabad's Azure Minarets"
 war_unique_intro_events.432.d:0 "El-Kalabad studies the sky until prophecy begins to look like policy. Azure minarets, desert observatories, careful scholars, Tzeentchian whispers, and court intrigues that change shape while being watched make the city brilliant, useful, and dangerous to believe too quickly.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nEl-Kalabad is proof that error can wear learned robes. The Changer of Ways offers patterns that flatter ambitious minds, so the state must decide which calculations serve the Solar Mandate and which merely teach the city how to betray itself more elegantly.\n\nThe situation is learned, azure, and moving under stars that refuse to stay innocent, so we must read the changing stars and turn every omen toward rule before Tzeentch turns rule into another omen.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.432.a:0 "Read the changing stars."

 war_unique_intro_events.433.t:0 "Lazzara's Corsair Docks"
 war_unique_intro_events.433.d:0 "Lazzara smells of pitch, salt, spice, cheap miracles, and knives hidden in sailors' belts. Corsair captains, black-market brokers, One Faith ship-priests, harbor judges, and crews who pray loudly before robbing quietly make the port an argument between piety and profit.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nLazzara can either be a scandal tolerated for its usefulness or a blade deliberately pointed outward. The corsairs must tithe, obey signals, strike chosen enemies, and learn that plunder can serve revelation if the state holds the harbor chains.\n\nThe situation is maritime, unruly, and rich with sails that want blessing after the loot is counted, so we must loose the lateen sails and make Lazzara's hunger useful before it becomes sovereign.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.433.a:0 "Loose the lateen sails."

 war_unique_intro_events.434.t:0 "Amhabal's Hidden Knives"
 war_unique_intro_events.434.d:0 "Amhabal does not need loud walls when fear can open gates before dawn. Hidden knives, sacred contracts, coded sermons, oath-bound informants, and courtyards where smiles are inspected like weapons make the city quiet in the way a drawn bow is quiet.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nAmhabal's secrecy is useful only while it remains disciplined. Assassins who choose their own truth become another cult, but assassins bound by law can remove heresy, treason, and foreign designs before armies even saddle.\n\nThe situation is hushed, contractual, and watched by enemies who fear what they cannot hire, so we must seal the red contracts and make hidden service answer the Solar Mandate rather than private vendetta.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.434.a:0 "Seal the red contracts."

 war_unique_intro_events.435.t:0 "Zarekten's Water Pacts"
 war_unique_intro_events.435.d:0 "Zarekten measures authority in wells, shade, camel strings, and the right to decide who drinks first. Bedouin councils, water pacts, raiding horsemen, caravan hosts, and One Faith judges who must know desert custom before correcting it make the realm practical before it can be grand.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nIn Zarekten, doctrine that ignores thirst will fail. The state must protect wells, arbitrate blood-feuds, command riders, and make hospitality part of law before rivals turn every water source into a little kingdom.\n\nThe situation is dry, necessary, and held together by promises no ruler can afford to treat as small, so we must guard the wells and make Zarekten's water pacts serve one dawn.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.435.a:0 "Guard the wells."

 war_unique_intro_events.436.t:0 "Sudenburg under the Southern Sun"
 war_unique_intro_events.436.d:0 "Sudenburg is an Imperial argument built in stone under an Arabyan sun. Sigmarite settlers, drilled companies, southern warehouses, chartered burghers, and officers writing home to provinces that barely understand the heat make the colony both outpost and wager.\n\nThe Empire is a realm of Electors, free cities, guilds, temples, soldiers, and stubborn local liberties that somehow still claim one crown. Its strength has always been that many loyalties can become one army when fear, faith, and coin are made to march together.\n\nThat strength is not automatic. Reikland, Middenland, Talabecland, Wissenland, Nuln, and every border lord argue over rank, taxes, doctrine, and pride while enemies study the roads between them.\n\nA colony far from the Reik cannot wait for perfect consensus. Sudenburg must make Imperial law legible to Arabyan markets, keep Sigmar's rites from becoming empty homesickness, and prove that southern trade can fund discipline rather than dissolve it.\n\nThe local world is not empty space around an Imperial fort. Emirs, corsairs, desert tribes, One Faith judges, Tomb King shadows, and merchants with better maps all press against the walls and counting houses.\n\nThe situation is colonial, profitable, and dangerously far from the old rivers of home, so we must hold the Imperial walls and make Sudenburg a province of discipline rather than nostalgia.\n\nIf Sudenburg endures, the Empire will have a southern hand strong enough to trade, warn, and strike. If it fails, the desert will remember only another foreign stone box that learned too late how far it stood from help."
 war_unique_intro_events.436.a:0 "Hold the Imperial walls."

 war_unique_intro_events.437.t:0 "Antoch's Desert Vows"
 war_unique_intro_events.437.d:0 "Antoch carries Bretonnian vows into heat, dust, and crusader stone. Outremer castles, chapel courtyards, desert lances, stern castellans, and peasants who have learned to pray beside unfamiliar roads make the realm a frontier version of chivalry rather than a comfortable copy.\n\nThe spirit of Bretonnia endures through trial and hardship. Noble knights lower their lances in the Lady's light, swear to defend the weak, uphold the ideals of chivalry, and vanquish the wicked even when the fields beneath them are far from Couronne's songs.\n\nYet the world grows darker, and distance makes every virtue work harder. Foul beasts prowl borders, faithless men bargain in shadows, corsairs test the coast, and the forces of ruin gather strength wherever proud realms confuse ceremony with readiness.\n\nAntoch cannot survive by reciting old vows in a new climate. Its knights must guard wells, learn desert war, rule settlers justly, and decide which Arabyan customs can be honored without letting chivalry become a costume worn over conquest.\n\nThe Lady's service here is both crusade and stewardship. A lance that protects only Bretonnian pride will fail; a lance that protects roads, chapels, markets, and frightened villages may make holiness feel real beneath a foreign sun.\n\nThe situation is devout, exposed, and tested by every dune between home and duty, so we must raise the crusader lances and make Antoch worthy of the Lady's gaze.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.437.a:0 "Raise the crusader lances."

 war_unique_intro_events.438.t:0 "Ubar, the Hidden Oasis"
 war_unique_intro_events.438.d:0 "Ubar hides behind mirage, thorn, water, and men who know which silence means permission to kill. Veiled gates, oasis treasuries, knife schools, sacred contracts, and judges who speak softly because others enforce loudly make the city a secret that collects taxes.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nUbar's hidden strength must not become isolation. Secrets should move caravans safely, remove enemies precisely, and make the Solar Mandate feared in places where armies would arrive too late.\n\nThe situation is veiled, watered, and valuable to everyone who cannot find it, so we must close the veiled gates and make Ubar's hidden oasis a weapon of order.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.438.a:0 "Close the veiled gates."

 war_unique_intro_events.439.t:0 "Kamt's Black Tent Councils"
 war_unique_intro_events.439.d:0 "Kamt governs from black tents, marked wells, and councils where every elder knows the price of a broken water oath. Camel routes, mobile horsemen, oath-feasts, desert scouts, and One Faith judges who must persuade before commanding give the realm a state carried on hooves.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nKamt cannot imitate a stone city and expect obedience to follow. It must make law portable, faith credible under canvas, and authority swift enough to arrive before raiders turn distance into sovereignty.\n\nThe situation is mobile, thirsty, and held together by pacts that need soldiers as well as memory, so we must bind the water pacts and make Kamt's tents a moving court of the dawn.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.439.a:0 "Bind the water pacts."

 war_unique_intro_events.440.t:0 "Sud's River Judges"
 war_unique_intro_events.440.d:0 "Sud lives where river towns, date groves, ferry dues, and southern caravan roads turn water into authority. Frontier judges, market elders, date merchants, watch posts, and One Faith preachers who know the road south is never simple make the realm practical, warm, and watchful.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nSud must prove that frontier justice can be patient without being weak. Markets need trusted measures, rivers need guarded crossings, and date groves need protection from men who call theft a raid once they ride far enough.\n\nThe situation is fertile, southern, and close to roads where doctrine thins with distance, so we must guard the date groves and make Sud's river judges the voice of order.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.440.a:0 "Guard the date groves."

 war_unique_intro_events.441.t:0 "Mahabbah, the Beloved City"
 war_unique_intro_events.441.d:0 "Mahabbah earns its name with gardens, learned courts, generous guest halls, and markets where hospitality is policy as much as virtue. Scholar-judges, perfumed courtyards, merchant patrons, guarded caravans, and One Faith sermons delivered with polished courtesy make the city gentle only to the inattentive.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nMahabbah's grace is a tool of government. Guests can become allies, courts can settle quarrels before they become raids, and markets can make obedience profitable if the city remembers that kindness without strength invites predators.\n\nThe situation is cultured, beloved, and surrounded by powers that will test whether courtesy has teeth, so we must open the garden courts and make Mahabbah's hospitality serve lasting authority.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.441.a:0 "Open the garden courts."

 war_unique_intro_events.442.t:0 "Songhai's Gold and Salt Roads"
 war_unique_intro_events.442.d:0 "Songhai rises along the great river while gold moves north, salt moves south, and weakened rivals remember too late that roads create kings. River barges, Sunni scholar-judges, cavalry courts, market administrators, and fortress garrisons give Gao a chance to turn movement into mastery.\n\nThe southern lands have endured the fame and fatigue of Mali, the ambitions of Hausa towns, the raids of horse peoples, and the slow pressure of desert trade. Wealth here is never only wealth; it is grain, toll, scripture, cavalry fodder, and the right to decide who crosses safely.\n\nAraby's dawn reaches these roads as rumor, example, challenge, and opportunity. The One Faith may not rule Songhai's courts, but religious fervor, learned law, and desert commerce still shape every bargain made between river and sand.\n\nThe work remains unfinished. River towns quarrel over dues, scholars demand patronage, merchants dislike uncertain measures, and every caravan lord expects protection without always admitting who provides it.\n\nSonghai must use the tools at hand: barges for grain and troops, judges for legitimacy, cavalry for reach, administrators for trust, and envoys who can speak with Arabyan ports without kneeling to them.\n\nThe situation is river-fed, ambitious, and bright with gold that will attract enemies if it does not first build authority, so we must command the river roads and make Songhai the power every caravan counts before leaving home.\n\nThe river and desert must work together. We must turn trade, scholarship, cavalry, oath, water, and market law into a southern order strong enough that no rival empire treats Songhai as a road through someone else's future."
 war_unique_intro_events.442.a:0 "Command the river roads."

 war_unique_intro_events.443.t:0 "Hashishin Before Sunrise"
 war_unique_intro_events.443.d:0 "The Hashishin rule by letting enemies discover too late that every campfire had ears. Missing supplies, open threats, unbroken strongholds, watched roads, silent climbers, and contracts signed in faith and fear make their lands feel larger than the map admits.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nThe Hashishin know that some enemies must not be allowed a battlefield. Jaffar's fall, Tzeentchian intrigue, foreign mercenary pride, and warlords who trust walls all teach the same lesson: a blade placed correctly can save an army from ever marching.\n\nThe situation is secret, zealous, and full of threats that boast because they have not checked the shadows, so we must send the silent knives and make every enemy wonder who served judgment before sunrise.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.443.a:0 "Send the silent knives."

 war_unique_intro_events.444.t:0 "Ebonaire's Desert Concord"
 war_unique_intro_events.444.d:0 "Ebonaire lives by motion, oath, and the pride of tents that do not need city walls to remember rank. Bedouin courts, caravan tolls, reformist preachers, warhorse clans, and ambitious notables make the realm a southern frontier where obedience must be persuaded before it can be commanded.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nEbonaire must prove that the Solar Mandate can govern clans that prize independence. If judges, riders, merchants, and water keepers can be made to trust one law, the frontier will become more than a loose arrangement of camps.\n\nThe situation is proud, restless, and rich with roads that can carry faith or rebellion, so we must bind the nomad courts and make Ebonaire a concord beneath the sun.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.444.a:0 "Bind the nomad courts."

 war_unique_intro_events.445.t:0 "Sandscale under the Scarab Sun"
 war_unique_intro_events.445.d:0 "The Sandscale are Lizardmen of hot stone, dry pools, scarab rites, and sun-baked temple walls. Their Skinks write in glyphs learned beside tomb roads, their Saurus stand where dunes crawl over old spawning places, and their priests speak to the Old Ones through Nehekharan symbols the wider temple-cities would find unsettling.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once, even when distance and isolation force strange local forms upon its practice.\n\nThe Sandscale cannot simply imitate Lustria. They must survive between dead kings, Arabyan roads, dry winds, and sacred pools that answer less often than they should. Scarab rites and tomb tokens are not betrayal if they keep purpose legible in a desert that buries everything careless.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and enemies multiply faster than scattered Southlands and desert outposts can answer alone.\n\nThe situation is scaled, scarab-marked, and balanced between cosmic duty and borrowed funerary language, so we must align scale and scarab until even the desert points toward the Great Plan.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, and prove that forgotten outposts can still shape the age."
 war_unique_intro_events.445.a:0 "Align scale and scarab."

 war_unique_intro_events.446.t:0 "Bur Shitrak's Horse Banners"
 war_unique_intro_events.446.d:0 "Bur Shitrak rides hard beneath horse banners, dust plumes, and sermons sharp enough to keep proud clans listening. Medean blood, cavalry law, growing artillery workshops, and tribal councils made uneasy by reform all pull the realm toward a future faster than its elders expected.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nBur Shitrak must make speed serve order. Cavalry can raid, scout, convert, tax, or overthrow; only a disciplined state decides which of those happens before the riders leave camp.\n\nThe situation is mounted, reforming, and eager to mistake momentum for destiny, so we must ride beneath the sun and make every horse banner answer the Solar Mandate.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.446.a:0 "Ride beneath the sun."

 war_unique_intro_events.447.t:0 "Steel Bazaars of Dimashque"
 war_unique_intro_events.447.d:0 "Dimashque is a city of steel, orchards, contracts, and polished argument. Its bazaars ring with hammer blows, its canals feed garden districts, its scholars dispute doctrine beneath awnings, and its merchants know that every caravan treaty is a weapon if written carefully enough.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nDimashque can make reform urban and durable. Steel must arm the gates, orchards must feed the markets, scholars must defend the One Faith in language merchants and soldiers both understand, and diplomacy must turn roads into allegiance.\n\nThe situation is learned, sharp-edged, and wealthy enough to tempt rivals, so we must temper the steel markets and let Dimashque prove that a trade republic can shine with holy purpose.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.447.a:0 "Temper the steel markets."

 war_unique_intro_events.448.t:0 "Kadira's Corsair Havens"
 war_unique_intro_events.448.d:0 "Kadira speaks the language of tide, ransom, and lateen sails. Island corsairs, smuggler quays, sea oaths, pirate parley houses, and hook-blade boarders make the port useful to Araby and dangerous to anyone who believes useful men remain obedient by gratitude alone.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nKadira must decide whether its corsairs are predators tolerated for coin or servants disciplined by command. Sea rites, harbor tithes, and chosen targets can turn pirate hunger outward before it hollows the state from inside.\n\nThe situation is salt-bright, profitable, and one mutiny away from embarrassment, so we must bless the corsair sails and make Kadira's black-market courage serve the dawn.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.448.a:0 "Bless the corsair sails."

 war_unique_intro_events.449.t:0 "Springs of Aiir"
 war_unique_intro_events.449.d:0 "Aiir rises around highland springs where water, scholarship, stone terraces, and star routes meet. Its caravanserais shelter merchants and arguments, its observatories watch the desert sky, and its hill guards understand that a spring is a library, treasury, shrine, and fortress at once.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nAiir's scholars must make height into clarity rather than aloofness. The One Faith needs observatories that read warning from stars, not excuses for pride, and caravans that carry doctrine as reliably as coin.\n\nThe situation is elevated, thoughtful, and dependent on springs every rival would love to hold, so we must guard the high springs and make Aiir's learning flow downhill as authority.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.449.a:0 "Guard the high springs."

 war_unique_intro_events.450.t:0 "The Island Keep of Origo"
 war_unique_intro_events.450.d:0 "The Knights of Origo hold a sea-fort where Bretonnian vows meet Imperial stonework, Arabyan winds, and the loneliness of a crusade that outlived its first banners. Their chapel bells ring over harbor cannon, pilgrim knights, salt-crusted walls, and watchmen who know the coast is patient with isolated pride.\n\nThe spirit of Bretonnia endures through trial and hardship. Noble knights lower their lances in the Lady's light, swear to defend the weak, uphold the ideals of chivalry, and vanquish the wicked even when their castles stand far from the green fields that taught the songs.\n\nYet the world grows darker, and distance makes every virtue work harder. Corsairs test the approaches, faithless men bargain in shadows, Arabyan courts remember old crusader wounds, and foreign merchants measure the island as a prize before they call it a sanctuary.\n\nOrigo cannot survive as a relic of better intentions. Its knights must make piety maritime, discipline practical, and isolation useful. A harbor that cannot feed itself is not a bastion; a vow that cannot guard sailors is not fully a vow.\n\nThe Lady's service here is both watch and warning. If the island keep holds, it can be a lantern for pilgrims and a thorn in every hostile coast. If it fails, its chapel stones will become another cautionary ruin.\n\nThe situation is devout, lonely, and surrounded by seas that do not care how noble a banner looks, so we must hold the island keep and make Origo's vows endure salt, siege, and silence.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.450.a:0 "Hold the island keep."

 war_unique_intro_events.451.t:0 "Kyrene's Western Oasis"
 war_unique_intro_events.451.d:0 "Kyrene keeps a western oasis necropolis where salt roads, chariot patrols, sand-sealed granaries, and dry envoys make the living pay respect before thirst teaches them. Its rulers remember old dynastic claims with the patience of kings who can wait longer than any caravan master can live.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nKyrene's roads are narrower than imperial memory, but they matter. Wells, salt paths, and desert princes can become the first links in a restored western command if the necropolis taxes steadily and strikes swiftly.\n\nThe situation is dry, western, and rich with living travelers who think payment to the dead is optional, so we must tax the salt roads and make Kyrene's oasis the gate of restoration.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.451.a:0 "Tax the salt roads."

 war_unique_intro_events.452.t:0 "Kermah's Black-Stone Gates"
 war_unique_intro_events.452.d:0 "Kermah stands by cataracts where water roars against black stone and tomb gates answer with silence. River gold ledgers, mortuary works, Ushabti processional ways, and spear ranks raised beneath spray give the city a southern dignity heavy enough to feel carved from the riverbed.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nKermah must make the cataracts into command. Gold, stone, river passage, and southern diplomacy should all move through its hands, while black gates remind rivals that the dead can hold water roads as surely as sand.\n\nThe situation is river-loud, black-stoned, and watched by southern courts with old ambitions, so we must guard the cataract tombs and let Kermah make the river bow to deathless rule.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.452.a:0 "Guard the cataract tombs."

 war_unique_intro_events.453.t:0 "Fezzir's Dune Shrines"
 war_unique_intro_events.453.d:0 "Fezzir keeps shrines where dunes bury devotion and force priests to uncover it again. Bone-marked roads, jackal-scribe tax rolls, border necropolis walls, outrider chariots, and uneasy pacts with living nomads make the city a desert warning written in fragments.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nFezzir survives by making borders speak. Bones mark the roads, toll rolls remember cheats, nomads bring news, and chariots ride ahead of the tomb host so no rival can pretend the frontier is empty.\n\nThe situation is wind-buried, watchful, and too close to roads that forget who owns them, so we must mark the caravan bones and make Fezzir's dune shrines into anchors of command.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.453.a:0 "Mark the caravan bones."

 war_unique_intro_events.454.t:0 "The Crimson Legion"
 war_unique_intro_events.454.d:0 "The Crimson Legion is not a city so much as a verdict that learned to march. Red standards, Tomb Guard oaths, blood-lacquered armouries, herald tablets, and soldiers who advance without breath make the warhost a royal grievance preserved in perfect military order.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nThe Legion's strength is focus. Other tomb courts quarrel over walls and titles; the Crimson host remembers punishment, justice, and the names of those who should have bent the knee long ago.\n\nThe situation is martial, red, and full of enemies who mistake silence for spent anger, so we must raise the red standards and let the Crimson Legion make vengeance into policy.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.454.a:0 "Raise the red standards."

 war_unique_intro_events.455.t:0 "Exiles of Nehek"
 war_unique_intro_events.455.d:0 "The Exiles of Nehek carry their kingdom in relic carts, lost banners, funerary masks, and vows repeated under open sky. Dumuzid Kemat rules a wandering tomb court where every camp is a reminder of a throne denied and every march is measured against the road home.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nExile sharpens entitlement rather than softening it. Mortuary priests guard rites without settled temples, spear columns march without promised tombs, and bargains with desert hosts buy time until reclamation can replace endurance.\n\nThe situation is homeless, royal, and too proud to become mere wandering, so we must carry the relic court and make every road back to Nehek tremble beneath our banners.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.455.a:0 "Carry the relic court."

 war_unique_intro_events.456.t:0 "Ka-Sabar's Mortuary Roads"
 war_unique_intro_events.456.d:0 "Ka-Sabar keeps the southern tomb roads where Bhagarite memory, mortuary colonies, priest-architects, and sepulchral chariot escorts stitch distant necropoleis together. Its settlements exist less for comfort than for the honour of dead kings who expect the world to remain arranged around them.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire is fractured. Khemri, Lybaras, Quatar, Bhagar, Zandri, and every lesser necropolis remembers a different crown, a different insult, and a different map of what restoration should mean.\n\nKa-Sabar must make distance obedient. Roads must be cleared, colonies taxed, priestly estates protected, and southern tombs tied back into a network strong enough that no thief or rival can isolate them.\n\nThe situation is colonial, funerary, and spread across roads that the sand tries to erase, so we must open the southern roads and make Ka-Sabar the hinge of the southern dead.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.456.a:0 "Open the southern roads."

 war_unique_intro_events.457.t:0 "Tlaqua's Terradon Watch"
 war_unique_intro_events.457.d:0 "Tlaqua watches the Southlands from above. Terradon patrols, ravine flight paths, Skink sky-captains, signal pigments, and Old One sky rites turn cliffs and canopy into a temple perimeter no ground-bound invader can easily understand.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Even in the Southlands, where Saurus spawnings are scarcer and distant Slann voices are harder to hear, purpose remains colder than fear.\n\nTlaqua's strength is height. Riders see enemy fires before ground patrols, drop stones where shield walls cannot look, and carry glyphs across canopies that would delay a marching host for days.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any scattered temple outpost can answer alone.\n\nThe situation is high, watchful, and dependent on wings that must not be wasted, so we must take the sky paths and make every ravine an instrument of the Great Plan.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, and prove that Southlands watchposts can still shape the age."
 war_unique_intro_events.457.a:0 "Take the sky paths."

 war_unique_intro_events.458.t:0 "Nahuontl's Canopy Shrines"
 war_unique_intro_events.458.d:0 "Nahuontl hides its sanctity beneath wet leaves, root hollows, canopy shrines, and pools that answer irregularly but remain sacred. Skink councils, jungle offering gardens, glyph-runners to Zlatlan, and ambushes from green shadows keep the temple alive where outsiders see only forest.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. In the Southlands, distance forces Skinks to act with a speed that more fortunate temple-cities can afford to ritualize.\n\nNahuontl must protect what is weak without admitting weakness. Erratic pools are still holy, scarce cohorts are still weapons of purpose, and every runner who reaches Zlatlan binds scattered cities into something stronger than isolation.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and enemies of the Old Ones multiply faster than any hidden temple can answer alone.\n\nThe situation is secluded, sacred, and vulnerable to any hand that finds the pools, so we must hide the sacred pools and make Nahuontl's canopy a wall of ordered silence.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, and prove that Southlands temple communities can still shape the age."
 war_unique_intro_events.458.a:0 "Hide the sacred pools."

 war_unique_intro_events.459.t:0 "Zameisland's Spirit Reefs"
 war_unique_intro_events.459.d:0 "Zameisland belongs to reefs, shell tolls, sea gardens, storm drums, and ancestor groves facing the tide. Its people are Sudron and Arabyan by the map's habit, yet their island spirits still watch the surf and warn when foreign sails approach with polite hunger.\n\nFor millennia, the Arabyan world bent its knee to many powers: desert gods, djinn bargains, foreign idols, local spirits, proud emirs, caravan law, and fear of whatever waited beyond the next dune or reef. The wider land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. His dawn has reached ports, tribes, corsairs, scholars, and horse clans, but islands do not surrender their old voices simply because a mainland preacher speaks brightly.\n\nThe work remains unfinished. Coasts count profit before doctrine, old rites hide inside respectable houses, spirit stories refuse to die, and foreign ambition presses against every harbor that can offer water, fish, shelter, or passage.\n\nZameisland must survive that pressure without becoming only a prize in someone else's religious map. Reef canoes, storm councils, ancestor groves, and shell harbors can bargain with Araby, but they must do so from sovereign waters.\n\nThe situation is tidal, animist, and surrounded by captains who mistake hospitality for permission, so we must beat the storm drums and make the spirit reefs answer as one island state.\n\nThe seas must carry our authority to every horizon. We must turn trade, oath, water, reef, drum, and parley into a dawn bright enough that no rival finds refuge in ignorance."
 war_unique_intro_events.459.a:0 "Beat the storm drums."

 war_unique_intro_events.460.t:0 "Parichistan's Temple Bazaars"
 war_unique_intro_events.460.d:0 "Parichistan gathers wealth beneath temple towers where spices, silk, lacquer, grain, copper, and sacred processions share the streets. Elephant-road wardens, monsoon ledgers, dyewood guilds, and palace guards of many banners make the realm a western gate into the crowded abundance of Ind.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nParichistan must use its temple bazaars wisely. Trade should feed shrines, roads should carry armies as well as merchants, and every god in procession should remind the western courts that sacred plurality requires hard administration.\n\nThe situation is wealthy, fragrant, and visible to every caravan and ambitious neighbor, so we must feed the temple roads and make Parichistan's abundance serve durable rule.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Parichistan must prove that age is not decay."
 war_unique_intro_events.460.a:0 "Feed the temple roads."

 war_unique_intro_events.461.t:0 "Karachistan's Gate Forts"
 war_unique_intro_events.461.d:0 "Karachistan holds gates where mountains, desert roads, saffron markets, iron caravans, and cliff shrines all demand watchmen. Terrace officials, hill levies, pass diplomats, and spear lines on narrow ground make the realm a lock on roads that richer kingdoms need.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nKarachistan's strength is that every road can be made to pause. Forts must collect tolls, shrines must command respect, and hill levies must remind travelers that a pass is a privilege, not a natural right.\n\nThe situation is steep, dry, and full of hungry roads, so we must hold the mountain gates and make Karachistan the threshold no rival crosses cheaply.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Karachistan must prove that age is not decay."
 war_unique_intro_events.461.a:0 "Hold the mountain gates."

 war_unique_intro_events.462.t:0 "Bhalluka's Bear Banners"
 war_unique_intro_events.462.d:0 "Bhalluka marches beneath bear banners carried by rajahs who prize endurance, stubborn pride, and the right to stand their ground. Hill shrines, forest honey, ironwood, elephant-road forts, and temple bazaar duties make the realm rugged without making it poor.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nBhalluka's frontier cannot be governed by softness. Forest wealth must be harvested without angering every spirit and village, elephant roads must be fortified, and rajahs must be made to serve the kingdom before pride turns into private war.\n\nThe situation is forested, stubborn, and strong enough to become either shield or nuisance, so we must rouse the bear banners and make Bhalluka's endurance protect the western jungles.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Bhalluka must prove that age is not decay."
 war_unique_intro_events.462.a:0 "Rouse the bear banners."

 war_unique_intro_events.463.t:0 "Delehi's Central Court"
 war_unique_intro_events.463.d:0 "Delehi stands at the heart of Ind, where princes, scribes, priests, merchants, generals, and petitioners all seek the king's ear. Grand temple revenues, pilgrimage roads, monsoon registers, palace elephants, and the registry of many provinces make the court heavy with consequence.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nDelehi must make centrality mean governance rather than vanity. Pilgrim roads require soldiers, temples require accounts, elephants require districts of labor, and every province must be remembered by more than rumor.\n\nThe situation is crowded, sacred, and too important to be ruled by memory alone, so we must register the many provinces and make Delehi's court the measure of Indish order.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Delehi must prove that age is not decay."
 war_unique_intro_events.463.a:0 "Register the many provinces."

 war_unique_intro_events.464.t:0 "Panchala's Balanced Court"
 war_unique_intro_events.464.d:0 "Panchala governs through balance: prince and priest, river and embankment, market and monastery, frontier spear and written message. Yin-Yang influence has given old Indish instincts a foreign vocabulary, but the court knows harmony is not foreign to rule.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nPanchala's danger is imbalance wearing respectable clothes. Irrigation disputes can become feuds, monastery inns can become political shelters, and market scales can lie unless the court keeps every part of the realm in measured relation.\n\nThe situation is thoughtful, river-fed, and exposed to frontier pressure, so we must balance river and road and make Panchala's harmony strong enough to govern.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Panchala must prove that age is not decay."
 war_unique_intro_events.464.a:0 "Balance river and road."

 war_unique_intro_events.465.t:0 "Ukbar's Fort Shrines"
 war_unique_intro_events.465.d:0 "Ukbar keeps shrines inside forts and road chapels along dry passes where caravans leave oil, bells, flowers, and thanks for safe passage. Upland millet stores, hill rajah councils, envoys of the dry passes, and guard regiments make devotion practical in hard country.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nUkbar's northern strength is restraint. Storehouses must be filled before passes close, rajahs must argue in council before they raid, and every caravan duty must strengthen the walls that make the next journey possible.\n\nThe situation is upland, dry, and pious in a way that understands supply, so we must guard the dry passes and make Ukbar's fort shrines watch every road.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Ukbar must prove that age is not decay."
 war_unique_intro_events.465.a:0 "Guard the dry passes."

 war_unique_intro_events.466.t:0 "Singha's Lion Throne"
 war_unique_intro_events.466.d:0 "Singha sits beneath the Lion Throne, where courage, judgment, jungle rice, sacred rivers, and royal elephants all become arguments for command. Lion rites, eastern river markets, tiger-road scouts, and envoys beneath bright banners give the realm a roar that must be disciplined into rule.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nSingha must ensure that royal strength remains sacred rather than merely hungry. Elephants can awe, banners can warn, rivers can enrich, but only wise kingship keeps lesser lords from treating the jungle as an excuse for private power.\n\nThe situation is lush, proud, and watched by rivals listening for weakness beneath the drums, so we must sound the lion drums and make Singha's throne command river, court, and forest edge.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Singha must prove that age is not decay."
 war_unique_intro_events.466.a:0 "Sound the lion drums."

 war_unique_intro_events.467.t:0 "Kurya's Delta Harbours"
 war_unique_intro_events.467.d:0 "Kurya governs where rivers break into harbors, monsoon temples rise above floodwater, and spice canal storehouses perfume the wet air. River fleets, rice registers, fishermen, pilots, and envoys crossing the eastern sea make the realm a kingdom of water that cannot afford loose oars.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nKurya must make the delta an asset rather than a dispute. Floods must be registered, boats levied, canals guarded, and monsoon roads drilled until enemies who wait for dry ground surrender the tempo to us.\n\nThe situation is tidal, fertile, and open toward island courts and foreign sails, so we must command the monsoon roads and make Kurya's waters carry authority in every season.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Kurya must prove that age is not decay."
 war_unique_intro_events.467.a:0 "Command the monsoon roads."

 war_unique_intro_events.468.t:0 "Bone Eaters of the Red Snow"
 war_unique_intro_events.468.d:0 "The Bone Eaters were Ogres of the northern mountains until a tyrant cracked open the tomb of an Indish corpse-king and drank the red marrow sealed inside. Since then, the tribe has kept bone-pits, red snow feasts, night-road tolls, and pale Maneater bargains under a hunger that does not end cleanly with death.\n\nOgres were transformed when the Great Maw struck the world and taught them that eating was worship. They fight, bargain, extort, feast, and follow the fattest promise because hunger is not a weakness to them. It is law, god, and appetite with legs.\n\nNow the Bone Eaters live in passes where caravans prefer daylight and pay quickly after sunset. They still want meat, coin, and respect, but the corpse-king's curse has made blood as interesting as flesh and the moon as friendly as any campfire.\n\nThis makes them useful and horrifying even by Ogre standards. A Bone Eater can sell his strength as a Maneater, collect toll-meat from mountain roads, or rise again if the curse is strong and the feast is fresh enough.\n\nThe tribe must keep its old Ogre directness while mastering its new undeath. If tyrants let the curse rule them, they become monsters with no contracts. If they rule the curse, every road below the bone-pits becomes a pantry with a tariff.\n\nThe situation is hungry, vampiric, and rich with tasty little kingdoms pretending the passes are theirs, so we must crack the corpse-king's bones and let the Bone Eaters learn what kind of hunger walks again.\n\nDa Great Maw is always hungry, and so are we. This world is full of tasty little empires. Let us dig in."
 war_unique_intro_events.468.a:0 "Crack the corpse-king's bones."

 war_unique_intro_events.469.t:0 "Lakshana's Auspicious Seal"
 war_unique_intro_events.469.d:0 "Lakshana is named for signs that priests insist are not coincidences. Marks on newborn calves, river stones shaped like lotus petals, the behavior of temple elephants, and the timing of monsoon clouds all become arguments in court before they become policy.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nLakshana must make omen-reading serve administration rather than replace it. Auspicious signs can bless a levy, justify a tax, or steady a frightened court, but granaries still need counts and elephant stables still need handlers.\n\nThe situation is sacred, crowded, and eager to find meaning in every mark, so we must mark the lucky seal and make Lakshana's signs point toward durable rule.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Lakshana must prove that age is not decay."
 war_unique_intro_events.469.a:0 "Mark the lucky seal."

 war_unique_intro_events.470.t:0 "Bhojapuri's Moonlit Blood Shrine"
 war_unique_intro_events.470.d:0 "Bhojapuri's court keeps its brightest lamps for processions and its darkest rooms for the pale Raja's household. Tigerkin nobles walk through temple courtyards with lacquered claws, moonlit vows, and servants who know which bowls are for rice and which are not.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet Bhojapuri proves how easily abundance can be haunted. The jungle courts have learned manners from civilization, but not mercy, and vampiric patrons make every feast, tax roll, and night hunt feel like the same transaction with different witnesses.\n\nThe pale court cannot rule by hunger alone. Blood-rice estates must produce, temple scribes must be kept useful, Tigerkin captains must be honored without being unleashed on every village, and the Thousand Gods must be invoked carefully around immortals who dislike judgment.\n\nThe situation is wealthy, predatory, and too respectable to admit its appetite openly, so we must veil the pale court and make Bhojapuri's night customs serve Indish order.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. If the curse is disciplined rather than adored, Bhojapuri may become a kingdom feared for more than its teeth."
 war_unique_intro_events.470.a:0 "Veil the pale court."

 war_unique_intro_events.471.t:0 "Kosala's Sacred Ford"
 war_unique_intro_events.471.d:0 "Kosala stands where sacred rivers slow long enough for monks, taxmen, pilgrims, ferrymen, and soldiers to argue over whose duty is most holy. Rice levies fill the roads after harvest, bells answer from monasteries, and every ford feels older than the kingdom that guards it.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk bargain in southern jungle courts, deeper groves hide monsters and blood shrines, and the old forests grow around roads as though waiting for stone and law to weaken.\n\nKosala's strength is discipline rather than spectacle. Monasteries can shelter learning or rebellion, ferries can move pilgrims or armies, and river taxes can nourish shrines or disappear into a hundred local privileges.\n\nThe situation is fertile, pious, and balanced on crossings everyone needs, so we must guard the river monasteries and make Kosala's sacred fords into instruments of command.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Kosala must prove that age is not decay."
 war_unique_intro_events.471.a:0 "Guard the river monasteries."

 war_unique_intro_events.472.t:0 "Bengal's Tiger Delta"
 war_unique_intro_events.472.d:0 "Bengal lives where rivers become arguments before they become sea. Mangrove hunters, Tigerkin shrine guards, rice boats, salt traders, and fishermen who read the tide better than most scribes read ledgers all serve a realm that must rule water in motion.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet Bengal is not merely human abundance. Tigerkin courts move between village, shrine, and hunting ground with a civilization of their own, fierce enough to guard the delta and proud enough to test any ruler who mistakes alliance for obedience.\n\nThe realm must make the mouths of the rivers speak one language. Canals, ferries, mangrove paths, shrine estates, and tiger-road scouts must all be counted before foreign sails or jungle rivals choose the weak channel.\n\nThe situation is lush, flooded, and watched by eyes in reeds, so we must watch the river mouths and make Bengal's delta carry authority with every tide.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Bengal must prove that age is not decay."
 war_unique_intro_events.472.a:0 "Watch the river mouths."

 war_unique_intro_events.473.t:0 "The Twin Snakes Coil"
 war_unique_intro_events.473.d:0 "The Twin Snakes speak through paired idols, paired priests, paired daggers, and paired silences. Every audience is arranged so that no petitioner can tell which coil watches with favor and which one measures the throat.\n\nKhuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. Foreigners call the Snakefolk myth until the myth coils around them and asks what tribute they brought.\n\nThe serpent courts rule through fear, ceremony, and appetite. Blood rites bind warriors to shrines, spirits are placated with offerings no gentle priest would name, and noble houses treat diplomacy as a slower form of constriction.\n\nThe Twin Snakes must make rivalry into balance. If one cult devours the other, the court becomes ordinary tyranny; if both coils pull in rhythm, every village, shrine, and warband feels surrounded before battle begins.\n\nBeyond the jungle, merchants, raiders, beastfolk, Skaven, and Indish princes test the borders with greed or ignorance. Khuresh survives by making curiosity expensive and trespass educational.\n\nThe situation is paired, secretive, and hungry for a single rhythm, so we must bind the paired coils and make every rival guess which serpent will strike first.\n\nThe jungle is not wilderness to the Snakefolk. It is palace, weapon, shrine, nursery, and warning. The Twin Snakes must teach the age that Khuresh is still alive enough to bite."
 war_unique_intro_events.473.a:0 "Bind the paired coils."

 war_unique_intro_events.474.t:0 "Longfangs under the Blood Moon"
 war_unique_intro_events.474.d:0 "The Longfangs smile with a courtly restraint that fools only visitors. Their nobles keep lacquered cups, moonlit hunting platforms, pale consorts, and old serpent genealogies that now include a thirst no ancestral tablet can explain politely.\n\nKhuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. Foreigners call the Snakefolk myth until the myth coils around them and asks what tribute they brought.\n\nThe serpent courts rule through fear, ceremony, and appetite. Blood rites bind warriors to shrines, spirits are placated with offerings no gentle priest would name, and noble houses treat diplomacy as a slower form of constriction.\n\nFor the Longfangs, vampirism has not replaced old power. It has sharpened it. A venom temple can become a blood shrine without changing its doors, and a noble household can turn immortality into another proof that common scales should bow.\n\nThe danger is appetite without strategy. A court that feeds too openly invites crusaders, rival coils, and priests who suddenly remember ancient taboos. A court that feeds with ceremony becomes harder to accuse and easier to fear.\n\nThe situation is moonlit, noble, and red beneath the silk, so we must unveil the long fangs and make the curse coil around Khureshi law instead of tearing through it.\n\nThe jungle is not wilderness to the Snakefolk. It is palace, weapon, shrine, nursery, and warning. The Longfangs must teach the age that Khuresh can drink deeply and still rule with a steady tongue."
 war_unique_intro_events.474.a:0 "Unveil the long fangs."

 war_unique_intro_events.475.t:0 "Coilfang River Shrines"
 war_unique_intro_events.475.d:0 "Coilfang's shrines lean over rivers where offerings vanish before they sink. Boatmen pay in copper, blood, fruit, and silence, while fang-ring warbands count bends in the water as carefully as other realms count walls.\n\nKhuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. Foreigners call the Snakefolk myth until the myth coils around them and asks what tribute they brought.\n\nThe serpent courts rule through fear, ceremony, and appetite. Blood rites bind warriors to shrines, spirits are placated with offerings no gentle priest would name, and noble houses treat diplomacy as a slower form of constriction.\n\nCoilfang's power comes from motion controlled. Rivers carry messages, bodies, spies, tribute, disease, raiders, and rumors of spirits with too many eyes. Whoever holds the shrines decides which things pass safely.\n\nThe realm must make every ferry and tributary part of one enclosing circle. Village chiefs should fear late tolls, warriors should know where to strike from reeds, and spirits should be fed before they decide hunger is policy.\n\nThe situation is wet, serpentine, and threaded by roads that float, so we must tighten the fang circle and make Coilfang's waters close around every trespasser.\n\nThe jungle is not wilderness to the Snakefolk. It is palace, weapon, shrine, nursery, and warning. Coilfang must teach the age that even a river can bite when Khuresh commands it."
 war_unique_intro_events.475.a:0 "Tighten the fang circle."

 war_unique_intro_events.476.t:0 "Jennestas' Jeweled Coils"
 war_unique_intro_events.476.d:0 "Jennestas glitters because warning can be beautiful. Jewels hang from serpent idols, dancers move through incense with blades hidden in sleeves, and venom-temple estates wrap their accounts in perfume until tribute feels like a privilege.\n\nKhuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. Foreigners call the Snakefolk myth until the myth coils around them and asks what tribute they brought.\n\nThe serpent courts rule through fear, ceremony, and appetite. Blood rites bind warriors to shrines, spirits are placated with offerings no gentle priest would name, and noble houses treat diplomacy as a slower form of constriction.\n\nJennestas must make luxury useful rather than soft. Gem tribute can buy assassins, dancers can carry warnings, jeweled masks can awe a village, and a polite feast can end with every rival accepting terms they only later understand.\n\nThe danger is that splendor invites hands. Indish merchants, jungle thieves, ambitious priests, and rival broods all know a court that shines too brightly can become a target if its venom seems ceremonial.\n\nThe situation is fragrant, jeweled, and sharpened under silk, so we must perfume the venom houses and make Jennestas beautiful enough to lure enemies close.\n\nThe jungle is not wilderness to the Snakefolk. It is palace, weapon, shrine, nursery, and warning. Jennestas must teach the age that Khureshi elegance is still a form of predation."
 war_unique_intro_events.476.a:0 "Perfume the venom houses."

 war_unique_intro_events.477.t:0 "Clan Eskemas' Red Root Warren"
 war_unique_intro_events.477.d:0 "Clan Eskemas gnaws beneath roots that drink too much red water. Its jungle warrens stink of damp warpstone, blood jars, bitten idols, and Skaven who learned from the serpent courts that worship is more useful when everyone is terrified.\n\nThe Under-Empire praises unity in public and betrayal in every private corridor. Grey Seers preach, warlords plot, engineers count explosions as progress, plague-priests cough doctrine into the dark, and every clan insists it alone understands the Horned Rat correctly.\n\nEskemas is stranger than most of its kin and proud of the advantage. Vampiric hunger makes night raids cleaner, jungle rot hides missing bodies, and Khureshi rites provide a vocabulary for fear that even ordinary Skaven can sell if they squeak it with confidence.\n\nYet no Skaven clan survives by atmosphere alone. Warrens must breed, dig, steal, test, betray, and blame quickly. A blood cult that forgets grain stores becomes a hungry sermon; a jungle clan that forgets tunnels becomes prey for everything above.\n\nThe surface-things do not understand how much of their world is already undermined, counted, sniffed, and marked for future gnawing. Khuresh merely adds more teeth to the darkness and more excuses for why scouts do not return.\n\nThe situation is red-rooted, vampiric, and full of rival predators, so we must open the red gnawholes and make Eskemas more useful than the things it imitates.\n\nIf the clan can make blood, warpstone, jungle secrecy, and Skaven cowardice point in the same direction, the warrens will spread under every shrine that thinks stone is protection.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.477.a:0 "Open the red gnawholes."

 war_unique_intro_events.478.t:0 "Se'Sehen's Whisper Groves"
 war_unique_intro_events.478.d:0 "Se'Sehen is easiest to notice after it has already decided what to do with you. Whisper groves, reed blinds, spirit masks, and coils waiting under leaf-shadow make its courts feel less like palaces than pauses in the jungle's breathing.\n\nKhuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. Foreigners call the Snakefolk myth until the myth coils around them and asks what tribute they brought.\n\nThe serpent courts rule through fear, ceremony, and appetite. Blood rites bind warriors to shrines, spirits are placated with offerings no gentle priest would name, and noble houses treat diplomacy as a slower form of constriction.\n\nSe'Sehen must preserve quiet without mistaking it for weakness. Silent patrols, soft-footed priests, and villages trained to answer wrong questions wrongly can be stronger than walls if every path is listening.\n\nThe wider jungle is crowded with hungry powers. Merchants want roads, raiders want captives, Skaven want tunnels, and rival broods want ceremonies that prove their own venom purer.\n\nThe situation is hushed, watchful, and dangerous to anyone who mistakes silence for emptiness, so we must strike without ripple and let Se'Sehen's groves answer trespass in whispers.\n\nThe jungle is not wilderness to the Snakefolk. It is palace, weapon, shrine, nursery, and warning. Se'Sehen must teach the age that Khuresh can kill quietly and still be heard."
 war_unique_intro_events.478.a:0 "Strike without ripple."

 war_unique_intro_events.479.t:0 "Hss'tafi's Thorn Shrines"
 war_unique_intro_events.479.d:0 "Hss'tafi worships where thorn and fang teach the same lesson. Shrine paths draw blood from careless ankles, drums pulse through wet heat, and warbands paint their scales before raids so spirits, rivals, and prey all know who is coming.\n\nKhuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. Foreigners call the Snakefolk myth until the myth coils around them and asks what tribute they brought.\n\nThe serpent courts rule through fear, ceremony, and appetite. Blood rites bind warriors to shrines, spirits are placated with offerings no gentle priest would name, and noble houses treat diplomacy as a slower form of constriction.\n\nHss'tafi has less patience for perfumed court games than richer broods, but brutality alone is not command. The thorn shrines must bless discipline, drums must carry orders rather than only frenzy, and every raid must leave tribute paths open behind it.\n\nThe jungle rewards sharp borders. A village that fears the shrine pays early, a rival that hears the drums counts its escape routes, and an outsider who follows the path learns why the thorns were allowed to grow there.\n\nThe situation is barbed, martial, and loud enough to summon answering violence, so we must beat the hissing drums and make Hss'tafi's fang rites move as one body.\n\nThe jungle is not wilderness to the Snakefolk. It is palace, weapon, shrine, nursery, and warning. Hss'tafi must teach the age that Khuresh can be patient only because it is already armed."
 war_unique_intro_events.479.a:0 "Beat the hissing drums."

 war_unique_intro_events.480.t:0 "Throne of the Crimson Coil"
 war_unique_intro_events.480.d:0 "The Blood Queen rules from a throne where every step upward is stained into memory. Crimson bowls, serpent diadems, oath scars, and attendants who never look surprised make her court a ceremony of submission with a pulse.\n\nKhuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. Foreigners call the Snakefolk myth until the myth coils around them and asks what tribute they brought.\n\nThe serpent courts rule through fear, ceremony, and appetite. Blood rites bind warriors to shrines, spirits are placated with offerings no gentle priest would name, and noble houses treat diplomacy as a slower form of constriction.\n\nThe Queen's challenge is not inspiring fear. It is choosing what fear must build. A terrified village pays once; a terrified province pays forever if ledgers, priests, and war captains all make terror predictable enough to become law.\n\nRival coils will test the throne because every Khureshi court believes blood proves legitimacy only when it is someone else's. Outsiders will test it because outsiders are fools until educated.\n\nThe situation is crimson, regal, and surrounded by ambition with exposed throats, so we must bleed for the Queen and make every rite answer the throne before it answers appetite.\n\nThe jungle is not wilderness to the Snakefolk. It is palace, weapon, shrine, nursery, and warning. The Blood Queen must teach the age that Khuresh kneels only when it is preparing to strike."
 war_unique_intro_events.480.a:0 "Bleed for the Queen."

 war_unique_intro_events.481.t:0 "Bakemono in the Mountain Lairs"
 war_unique_intro_events.481.d:0 "Bakemono lairs cling to Nipponese mountains like bad ideas with teeth. Forest Goblins steal shrine bells, paint rude faces on guardian stones, brew fungus behind cedar roots, and insist every pass belongs to whoever can ambush it most often.\n\nGreenskins live through fighting. Peace makes them poor, bored, quarrelsome, and stupid in ways even other Greenskins find annoying; war gives them loot, noise, direction, and someone else to blame when the cooking fires run low.\n\nA tribe becomes dangerous when its bosses can aim the shouting outward. Shamans find omens in smoke, squigs, teeth, mushrooms, and headaches, while mobs of Orcs and Goblins decide that any road, fort, shrine, caravan, or neighbor is better after being hit.\n\nBakemono add their own eastern spite to the old problem. Samurai patrols are funny until they are close, temple treasuries are proof the gods like shiny things, and every mountain shrine is either a place to rob or a place to hide from the lads who robbed it first.\n\nFightiness is not a metaphor to the tribes. It is the pressure that keeps the lads moving, the threat that keeps rivals useful, and the difference between a proper Waaagh and a camp full of sulking gits hitting each other because nobody found a better target.\n\nThe situation is steep, sneaky, and full of shrine bells that would sound better in Goblin hands, so we must steal the shrine bells and make every mountain path laugh at order.\n\nA tribe cannot remain stable for long, so we must find enemies, win scraps, take trophies, and keep the lads too busy roaring forward to notice how many knives are waiting behind the boss.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.481.a:0 "Steal the shrine bells."

 war_unique_intro_events.482.t:0 "Yomi's Corpse-Mushroom Warrens"
 war_unique_intro_events.482.d:0 "Yomi lives below places polite villages refuse to name after sunset. Corpse-mushrooms glow in damp hollows, Goblin teeth flash in bamboo shade, and the dead do not stay boring enough when the tribe's pale bosses start sniffing around them.\n\nGreenskins live through fighting. Peace makes them poor, bored, quarrelsome, and stupid in ways even other Greenskins find annoying; war gives them loot, noise, direction, and someone else to blame when the cooking fires run low.\n\nA tribe becomes dangerous when its bosses can aim the shouting outward. Shamans find omens in smoke, squigs, teeth, mushrooms, and headaches, while mobs of Orcs and Goblins decide that any road, fort, shrine, caravan, or neighbor is better after being hit.\n\nYomi's vampiric curse has not made the Goblins refined. It has made them worse at convenient hours. Night raids last longer, prisoners get counted by pulse, and rivals learn that killing a Yomi boss once may only begin the argument.\n\nFightiness is not a metaphor to the tribes. It is the pressure that keeps the lads moving, the threat that keeps rivals useful, and the difference between a proper Waaagh and a camp full of sulking gits hitting each other because nobody found a better target.\n\nThe situation is dark, hungry, and funny in a way the victims rarely appreciate, so we must bite from the dark bamboo and point Yomi's corpse-mobs toward louder prey.\n\nA tribe cannot remain stable for long, so we must find enemies, win scraps, take trophies, and keep the lads too busy roaring forward to notice which bosses have stopped breathing.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.482.a:0 "Bite from the dark bamboo."

 war_unique_intro_events.483.t:0 "The Red Blade at Kuroyama"
 war_unique_intro_events.483.d:0 "The Bladelords bow like samurai and dream like executioners. Their sword schools teach patience only so killing arrives cleanly, and their red shrines praise strength with a directness that even harsher daimyo pretend not to hear.\n\nNippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult.\n\nThe forms matter. A bow can be submission or threat, a gift can be bribery or warning, and a castle survey can become civil war if the wrong lord hears judgment in the numbers. Discipline is the chain that keeps all this from becoming mere slaughter.\n\nFor the Bladelords, that chain is red-hot. Khorne cares nothing for poetry or precedent, but Nipponese warriors know that even bloodlust becomes more dangerous when drilled, named, and given a lineage.\n\nThe clan must decide whether the blade commands the realm or the realm commands the blade. Unchecked frenzy will bring enemies enough, but disciplined terror may make rivals kneel before the first duel is offered.\n\nThe situation is ceremonial, violent, and dangerously close to honesty, so we must draw the red blade and make every oath decide whether it serves war or is cut apart by it.\n\nIf shogunal discipline can bind the war cult before the war cult consumes its masters, the Bladelords may become more than mad swordsmen. They may become the edge by which Nippon is judged."
 war_unique_intro_events.483.a:0 "Draw the red blade."

 war_unique_intro_events.484.t:0 "Dawate's Snow Shrine Courts"
 war_unique_intro_events.484.d:0 "Dawate keeps court where snow settles on shrine roofs and fish smoke curls from cold villages below the passes. Its garrisons know the mountain roads by scar and avalanche, while its priests insist that quiet is a form of discipline, not peace.\n\nNippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult.\n\nThe forms matter. A bow can be submission or threat, a gift can be bribery or warning, and a castle survey can become civil war if the wrong lord hears judgment in the numbers. Discipline is the chain that keeps all this from becoming mere slaughter.\n\nDawate's strength is cold restraint. Pass forts must be supplied before storms close the roads, fishing clans must be taxed without ruining them, and shrine courts must settle quarrels before rival banners learn the snow hides tracks.\n\nA province in the mountains cannot afford theatrical weakness. Every bridge, storehouse, beacon fire, and oath of service must be known before raiders or ambitious daimyo discover a path that should have been watched.\n\nThe situation is frozen, watchful, and easy to lose through one unguarded pass, so we must hold the cold pass and make Dawate's silence harder than iron.\n\nIf the clans can be disciplined before winter does the teaching for us, Dawate may become the high gate through which enemies learn humility and allies learn respect."
 war_unique_intro_events.484.a:0 "Hold the cold pass."

 war_unique_intro_events.485.t:0 "Hattiga's Old Cedar Groves"
 war_unique_intro_events.485.d:0 "Hattiga's oldest law is older than the ink that records it. Cedar groves, spirit stones, druidic offerings, and clan courts meet under branches that seem to remember every oath, including the ones the living have found inconvenient.\n\nNippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult.\n\nThe forms matter. A bow can be submission or threat, a gift can be bribery or warning, and a castle survey can become civil war if the wrong lord hears judgment in the numbers. Discipline is the chain that keeps all this from becoming mere slaughter.\n\nHattiga differs because its spirits are not easily filed into court rank. Old groves demand patience, hunters obey taboos that taxmen dislike, and warriors who draw steel near sacred cedars may find the forest answers faster than the daimyo.\n\nThe realm must turn reverence into governance. Grove keepers, samurai captains, village elders, and shrine scribes must agree where custom ends and command begins, or every old tree will become a rival throne.\n\nThe situation is rooted, sacred, and too proud to be dismissed as superstition, so we must listen to the old cedars and make Hattiga's ancestral groves strengthen the clan rather than divide it.\n\nIf Nipponese discipline can honor the spirits without surrendering to every whisper, Hattiga may prove that old rites and hard order can share the same road."
 war_unique_intro_events.485.a:0 "Listen to the old cedars."

 war_unique_intro_events.486.t:0 "Hojizu's Tide Shrines"
 war_unique_intro_events.486.d:0 "Hojizu faces the sea with shrine gates, watch fires, fish markets, and harbor ledgers that smell of salt and ink. Boats arrive with tribute, rumor, pirates, monks, merchants, and quarrels that began in other ports but demand settlement here.\n\nNippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult.\n\nThe forms matter. A bow can be submission or threat, a gift can be bribery or warning, and a castle survey can become civil war if the wrong lord hears judgment in the numbers. Discipline is the chain that keeps all this from becoming mere slaughter.\n\nHojizu must make the tide predictable without pretending it can be mastered. Coastal fires must warn before sails become raids, harbor tolls must fund walls and ships, and shrine calendars must teach fishing clans that obedience is cheaper than disorder.\n\nThe sea brings wealth, but wealth makes every daimyo nearby suddenly interested in maritime theory. A harbor that cannot defend its customs house will soon be someone else's generous opportunity.\n\nThe situation is tidal, profitable, and watched from beyond the horizon, so we must light the coastal fires and make Hojizu's tide shrines guard more than ceremonies.\n\nIf the clan can bind fishermen, samurai, pilots, priests, and merchants to one coastal command, Hojizu may become the shore where outsiders learn Nippon is not open simply because it has harbors."
 war_unique_intro_events.486.a:0 "Light the coastal fires."

 war_unique_intro_events.487.t:0 "Odari's Twin Seal"
 war_unique_intro_events.487.d:0 "Odari keeps two seals on its documents: one for the mountains and one for the sea. Between them lie road forts, harbor clans, shrine accounts, and envoys who must remember which lord is offended by which order of bows.\n\nNippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult.\n\nThe forms matter. A bow can be submission or threat, a gift can be bribery or warning, and a castle survey can become civil war if the wrong lord hears judgment in the numbers. Discipline is the chain that keeps all this from becoming mere slaughter.\n\nOdari's danger is that balance looks like hesitation to ambitious neighbors. Mountain roads need firm garrisons, harbors need fast decisions, and a court that mediates every quarrel must still know when to end the discussion with soldiers.\n\nThe clan can turn its divided geography into strength if every pass feeds the ports and every port supplies the passes. Otherwise each half will become a different invitation to rivals.\n\nThe situation is balanced, useful, and vulnerable to any hand that splits road from harbor, so we must seal the mountain roads and make Odari's twin authority feel indivisible.\n\nIf ceremony and logistics can be made to agree, Odari may stand as proof that harmony in Nippon is not softness. It is the discipline of making every rival choose the wrong angle of attack."
 war_unique_intro_events.487.a:0 "Seal the mountain roads."

 war_unique_intro_events.488.t:0 "Shisuma's Quiet Registers"
 war_unique_intro_events.488.d:0 "Shisuma rules through quiet books and careful guards. River tolls, village rosters, shrine repairs, bridge watches, and marriage debts all find their way into registers whose plain pages decide more quarrels than a boastful sword ever could.\n\nNippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult.\n\nThe forms matter. A bow can be submission or threat, a gift can be bribery or warning, and a castle survey can become civil war if the wrong lord hears judgment in the numbers. Discipline is the chain that keeps all this from becoming mere slaughter.\n\nShisuma's challenge is making restraint visible enough to deter predators. A well-kept ledger does not frighten a raider until the guard post it funded appears on the road and the levies it counted arrive on time.\n\nBalanced diplomacy can preserve the clan, but only if it rests on proof. Villages must trust the registers, warriors must accept assignments, and rival daimyo must learn that quiet order can still answer insult.\n\nThe situation is measured, river-fed, and easy for louder houses to underestimate, so we must balance the river clans and make Shisuma's records into a weapon of stability.\n\nIf order can stay calm without becoming timid, Shisuma may become the province other courts mock until they need a bridge, a truce, or an army that actually appears when summoned."
 war_unique_intro_events.488.a:0 "Balance the river clans."

 war_unique_intro_events.489.t:0 "Takai's High Castles"
 war_unique_intro_events.489.d:0 "Takai's castles make the sky feel administered. Stone gates cling to ridges, warrior houses drill above cloud banks, and mountain law descends on valleys with the certainty of a winter road patrol.\n\nNippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult.\n\nThe forms matter. A bow can be submission or threat, a gift can be bribery or warning, and a castle survey can become civil war if the wrong lord hears judgment in the numbers. Discipline is the chain that keeps all this from becoming mere slaughter.\n\nTakai's strength is height, but height can become arrogance. Castles need supplies, mountain vassals need attention, and a lord who looks only down from the walls may miss the tunnel, shrine path, or winter bargain that undoes him.\n\nThe warrior houses must be made to compete in service rather than private feud. If every ridge captain thinks himself a little shogun, the realm will be a necklace of forts waiting to strangle its own throat.\n\nThe situation is elevated, proud, and watched by valleys that remember every toll, so we must hold the high gate and make Takai's castles command as one chain.\n\nIf the high houses accept discipline before necessity teaches it with siege and hunger, Takai may become the mountain blade that guards the realm rather than the mountain pride that splits it."
 war_unique_intro_events.489.a:0 "Hold the high gate."

 war_unique_intro_events.490.t:0 "Janarjaya's Rainforest Grove"
 war_unique_intro_events.490.d:0 "Janarjaya crowns kings beneath rain-heavy branches. Southern Indish rites mingle with grove offerings, monsoon drums, elephant paths, and priests who know that a throne set too far from the trees may lose the spirits before it loses the people.\n\nInd is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler knows grain, pilgrims, taxes, and devotion matter as much as swords.\n\nYet Janarjaya is shaped by groves that refuse to become mere scenery. Druidic keepers, rain spirits, temple accountants, and jungle captains all claim some part of kingship, and each can make misrule expensive in a different season.\n\nThe realm must make sacred plurality practical. Grove taboos must not starve roads, temple taxes must not insult the old trees, and royal elephants must carry authority without trampling every local custom that holds the forest loyal.\n\nThe situation is rain-fed, sacred, and crowded with powers older than the court, so we must crown the grove kings and make Janarjaya's monarchy listen before it commands.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now Janarjaya must prove that age is not decay."
 war_unique_intro_events.490.a:0 "Crown the grove kings."

 war_unique_intro_events.491.t:0 "Turjuk Siege Riders"
 war_unique_intro_events.491.d:0 "The Turjuks carry the desert on horseback and bring siege smoke with them. Their camps move between wells, their guns follow roads others thought too poor for armies, and their emirs understand that speed and artillery are only contradictions to men who lack horses.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nThe Turjuks stand at the edge of that argument with reins in one hand and fire in the other. Tribal honor, One Faith sermons, siege craft, and caravan tolls can become a powerful road to unity if no chief mistakes mobility for exemption from command.\n\nThe work remains unfinished. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and Chaos, undeath, and foreign ambition press against every road.\n\nThe situation is mounted, restless, and dangerous to any wall that thinks roads are slow, so we must loose the horse guns and make Turjuk speed carry the Solar Mandate farther than sermons alone.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, caravan, and cannon into a single dawn bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.491.a:0 "Loose the horse guns."

 war_unique_intro_events.492.t:0 "Cuexotl's Hidden Causeways"
 war_unique_intro_events.492.d:0 "Cuexotl is stitched together by causeways outsiders mistake for mud, old stone, or coincidence. Skink patrols clear drowned glyphs, Saurus cohorts wait beneath broad leaves, and every sunken plaque is treated as an order delayed rather than forgotten.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Even in the Southlands, where Saurus spawnings are scarcer and distant Slann voices are harder to hear, purpose remains colder than fear.\n\nCuexotl's task is restoration by patient movement. A causeway opened becomes a patrol route, a plaque recovered becomes a verdict, and a pool defended becomes proof that no fragment of the Plan is too remote to matter.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any scattered temple outpost can answer alone.\n\nThe situation is submerged, sacred, and mapped in stone beneath the water, so we must clear the sunken plaques and make Cuexotl's hidden roads carry purpose again.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, and prove that Southlands watchposts can still shape the age."
 war_unique_intro_events.492.a:0 "Clear the sunken plaques."

 war_unique_intro_events.493.t:0 "Teotiqua's Star-Stepped Pyramids"
 war_unique_intro_events.493.d:0 "Teotiqua rises in star-stepped silence. Skink priests climb wet stone before dawn, astronomers paint the sky's warnings onto bark and gold, and the city keeps its isolation like a ritual tool too sacred for careless hands.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Even in the Southlands, where Saurus spawnings are scarcer and distant Slann voices are harder to hear, purpose remains colder than fear.\n\nTeotiqua's isolation cannot become sleep. The stars are moving, the jungle listens badly, and a pyramid that only preserves old calculations may fail the new equation unfolding across the world.\n\nPriests must make astronomy actionable. Glyphs must guide patrols, sacred calendars must decide when to strike, and every terrace must become a platform from which the Plan looks outward again.\n\nThe situation is elevated, watchful, and surrounded by threats too impatient to respect calculation, so we must read the star glyphs and make Teotiqua's silence into command.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, and prove that Southlands temple-cities can still shape the age."
 war_unique_intro_events.493.a:0 "Read the star glyphs."

 war_unique_intro_events.494.t:0 "Oreon's Jungle Glade"
 war_unique_intro_events.494.d:0 "The Bowmen of Oreon guard a green memory far from the deep courts of Athel Loren. Their glade is ringed by jungle heat, watch platforms, waystones carried across impossible distance, and arrows that speak before trespassers learn the language.\n\nThe Asrai are not gentle forest spirits in courtly costume. They are guardians of living realms that remember trespass, blood, oaths, old magic, and the cost of letting outsiders decide what a forest is worth.\n\nOreon's enclave makes that truth harder. The Southlands are not Bretonnian marches or Imperial logging roads; they are steaming jungle, Lizardmen memories, human caravans, undead relics, beasts, and strangers who cannot understand why a handful of elves treat one glade as the center of the world.\n\nThat is precisely why it must be treated as the center. A distant forest is still court, ally, judge, weapon, and memory. Every path must ask permission, every clearing must be watched, and every bargain must preserve the living wood first.\n\nIsolation is no longer simple when the glade is an island in green immensity. The Bowmen must decide when to hide, when to trade, when to strike, and when to remind the Southlands that distance from Athel Loren is not distance from Asrai wrath.\n\nThe situation is remote, beautiful, and surrounded by worlds that would explain the forest to itself, so we must loose arrows through green haze and make Oreon's glade answer only to its own roots.\n\nIf the enclave endures, it will prove that the Asrai are not merely a people of one sacred wood. They are the warning every living forest can still give.\n\n§RAs a Wood Elf, you have a tough time administering lands outside of Forest.§!"
 war_unique_intro_events.494.a:0 "Loose arrows through green haze."

 war_unique_intro_events.495.t:0 "The Cold Empire Ascendant"
 war_unique_intro_events.495.d:0 "The Cold Empire is not born in warmth, ambition, or compromise. It is assembled from temple-cities, plaques, Slann decrees, Saurus discipline, Skink administration, and the ancient certainty that the world was made to be corrected.\n\nLong before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command.\n\nThe Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. To unite the Lizardmen is to make scattered fragments speak as one equation again.\n\nYet restoration is not mere nostalgia. Lustria, the Southlands, the Dragon Isles, ruined outposts, living cities, and forgotten plaques all carry different scars. The Empire must decide which fragments can be restored, which must be defended, and which errors must be cut from the age.\n\nThe End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any one temple-city can answer alone.\n\nThe situation is vast, ancient, and cold enough to outlast mortal panic, so we must enact the Great Plan and make the Cold Empire a single command rather than a memory of one.\n\nThe servants of the Old Ones must act with cold certainty. We must restore what can be restored, defend what cannot be lost, and prove that the first design of the world still has teeth."
 war_unique_intro_events.495.a:0 "Enact the Great Plan."

 war_unique_intro_events.496.t:0 "Khuresh, the Living Warning"
 war_unique_intro_events.496.d:0 "Khuresh does not need to raise its voice. The jungle speaks in constriction, venom, wet stone, missing caravans, and court masks polished until the eyes behind them matter more than the face.\n\nKhuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. Foreigners call the Snakefolk myth until the myth coils around them and asks what tribute they brought.\n\nThe serpent courts rule through fear, ceremony, and appetite. Blood rites bind warriors to shrines, spirits are placated with offerings no gentle priest would name, and noble houses treat diplomacy as a slower form of constriction.\n\nA united Khuresh is more than a brood writ large. It must bind rival coils, spirit cults, river shrines, hidden cities, jungle Skaven infestations, and blood-stained nobility into one predatory order without dulling the venom that made each court survive.\n\nBeyond the canopy, Ind watches with wealth, Cathay with wary order, raiders with greed, and Chaos with dreams of corruption. Each thinks the jungle is a frontier. Each must be taught that it is a mouth.\n\nThe situation is humid, sacred, and full of fools testing whether legend has a pulse, so we must make the jungle answer and let Khuresh become the warning no map can domesticate.\n\nThe jungle is not wilderness to the Snakefolk. It is palace, weapon, shrine, nursery, and throne. A united Khuresh must teach the age that some shadows are sovereign."
 war_unique_intro_events.496.a:0 "Make the jungle answer."

 war_unique_intro_events.497.t:0 "The Blood-Gong Unites the Isles"
 war_unique_intro_events.497.d:0 "The Dragon Isles no longer need to pretend one clan's altar is the whole archipelago. Gem harbors, volcanic sanctuaries, dragon masks, altar courts, and bloodline chiefs now face the harder task of becoming a realm without forgetting why every island feared every other.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Now that the isles can speak as one, blood-gong, obsidian command, and tribute law must become administration before old lineages turn unity into another ritual argument.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is united, volcanic, and watched by powers that smell gems through smoke, so we must make the blood-chiefs kneel and prove that the Great Dragon's terror can govern as well as burn.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be mastered, the cults bent into order, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.497.a:0 "Make the blood-chiefs kneel."

 war_unique_intro_events.498.t:0 "Nippon, One Realm One Blade"
 war_unique_intro_events.498.d:0 "Nippon unified is not Nippon pacified. The banners may face one throne, but every castle remembers who surrendered late, every temple remembers which lord paid poorly, and every samurai knows peace can be another dueling ground.\n\nNippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult.\n\nThe forms matter. A bow can be submission or threat, a gift can be bribery or warning, and a castle survey can become civil war if the wrong lord hears judgment in the numbers. Discipline is the chain that keeps all this from becoming mere slaughter.\n\nTo rule all Nippon, the shogun must make ritual into government. Daimyo must keep their honor while losing the right to private chaos, monks must bless order without ruling it, and the emperor's sanctity must strengthen the realm rather than become a beautiful argument.\n\nBeyond the islands, the world presses close. Cathay watches, the Dragon Isles smolder, Khuresh waits in the south, and foreign sails turn every harbor into a question about isolation, trade, pride, and survival.\n\nThe situation is unified in name, sharpened by memory, and too proud for careless peace, so we must forge one realm and make every blade answer the same command.\n\nIf Nippon can turn ceremony, law, sword, and sea into one order, it may become more than an archipelago of old grudges. It may become the island edge the End Times cut themselves upon."
 war_unique_intro_events.498.a:0 "Forge one realm."

 war_unique_intro_events.499.t:0 "Strygos Reborn"
 war_unique_intro_events.499.d:0 "Strygos remembers Mourkain as more than ruin. It remembers Ushoran's dream of a vampire kingdom that could rule openly, Strigoi pride before exile made it feral, and Kadon's shadow over crowns, corpses, and the first dark magic of the marsh kings.\n\nThe old realm was built in the Badlands where living tribes, dead kings, Orc migrations, Nehekharan relics, and hungry roads all pressed against one another. It did not fall because its dream was small. It fell because every dream in the Badlands must survive teeth.\n\nNow the Strigoi and Strigany inherit memory in broken forms. Some carry noble names like wounds, some hide in caravans, some rule from tombs and caves, and some still believe Mourkain was not a mistake but an unfinished sentence.\n\nA restored Strygos must be more than vengeance. The Strigoi must become rulers rather than beasts with claims, the Strigany must become a people rather than wanderers tolerated until fear returns, and old Kadonite relics must be handled without letting Nagash's poison define the future.\n\nThe Badlands are crowded with enemies who respect only power and remember only what hurts. Orcs, Tomb Kings, Border Princes, Dwarfs, and rival vampires will all test whether Strygos is a kingdom or just a corpse sitting up.\n\nThe situation is haunted, proud, and buried beneath old defeat, so we must restore Mourkain and make Strygos a throne that no longer apologizes for surviving.\n\nIf Ushoran's heirs can master hunger, memory, and the tribes that gather around them, the Sires of Mourkain may prove that undeath can found a realm instead of merely infest one."
 war_unique_intro_events.499.a:0 "Restore Mourkain."

 war_unique_intro_events.500.t:0 "Araby and the Solar Mandate"
 war_unique_intro_events.500.d:0 "Araby unified stands beneath a sun that is both blessing and accusation. Its cities, tribes, scholars, corsairs, assassins, horse clans, ports, and desert saints now share a truth bright enough to reveal every unfinished quarrel.\n\nFor millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided.\n\nThen came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail.\n\nUnity does not end the work. It exposes it. Oases still guard their own law, ports count profit before doctrine, old cults hide in respectable houses, djinn stories refuse to die, and every emir must learn that the Solar Mandate is not a decorative title for private ambition.\n\nBeyond Araby, the world needs saving and will resent the instruction. Nehekhara broods in death, the Southlands teem with rival faiths, Tilean merchants sniff at doctrine, and daemons do not become less real because scholars name them carefully.\n\nThe situation is bright, imperial, and heavy with obligations no smaller realm could carry, so we must let the world face the Light and make Araby's unity a dawn that moves.\n\nThe deserts and seas must carry the One Faith to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single radiance bright enough that no demon finds refuge in ignorance."
 war_unique_intro_events.500.a:0 "Let the world face the Light."

 war_unique_intro_events.501.t:0 "Nehekhara's Seventh Dynasty"
 war_unique_intro_events.501.d:0 "Nehekhara rises not as a memory, but as a verdict. The Seventh Dynasty gathers cracked crowns, mortuary ledgers, awakened legions, chariot roads, priestly jealousies, and kings who have spent centuries deciding exactly how the world should be punished for moving on.\n\nO mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself.\n\nThe Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness.\n\nThe old empire was fractured by crown, city, dynasty, insult, and ancient pride. Khemri, Lybaras, Quatar, Bhagar, Zandri, Numas, and every lesser necropolis remember a different map, but all remember that the living were never invited to inherit.\n\nA united Nehekhara must do more than raise armies. The Mortuary Cult must be commanded without being insulted, rival kings must be honored until they obey, and Nagash's shadow must be answered without letting hatred become the only law of restoration.\n\nThe situation is deathless, royal, and heavy with every oath the sand preserved, so we must raise the Seventh Dynasty and make Nehekhara's legions march as one empire once more.\n\nNow is the hour of reckoning. We must rouse the legions, bind priest and dynasty, crush pretenders, and make the sun rise again over an empire where the dead remember how to rule."
 war_unique_intro_events.501.a:0 "Raise the Seventh Dynasty."
