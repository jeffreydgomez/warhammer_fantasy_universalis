 war_unique_intro_events.549.d:0 "Muara Takus sits where river cloth, canal shrines, and monsoon channels pull commerce into narrow crossings. Tigerkin scouts move through reeds and water paths, listening for boats that carry profit or trouble.\n\nThe Tigerkin move within the Eastern Beastfolk cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Ind's End, there is no passive frontier for Muara Takus. The situation is wet, crowded, and rich in hidden routes, so we must guard the canal shrines before the river teaches rivals how to bypass us. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
