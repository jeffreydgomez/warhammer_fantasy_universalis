l_english:
  
 war_unique_intro_events.1.t:0 "The Guns of Wissenland"
 war_unique_intro_events.1.d:0 "Wissenland is loyal to the Empire, but loyalty alone will not keep the south secure. The province is proud, well armed, and watched by neighbors who know that Nuln's foundries can decide wars before the first banner is raised.\n\nThe Wissenlander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the South Empire Provinces, there is no passive frontier for Wissenland. Emmanuelle von Liebwitz rules from a court where refinement and artillery smoke exist side by side. Nobles whisper about her priorities, burghers count contracts from the gunworks, and soldiers look south toward the Black Mountains, Tilea, and every road by which trouble might enter the Empire. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.1.a:0 "Hold Wissenland together."

 war_unique_intro_events.2.t:0 "The Price of Freedom"
 war_unique_intro_events.2.d:0 "Westerland lives by contracts that the rest of the Empire still calls treason. Marienburg bought its freedom with coin, nerve, and foreign guarantees, and every merchant prince in the counting houses knows that independence remains a debt that must be paid daily.\n\nThe Wastelander people move within the Imperial cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the North Empire Provinces, there is no passive frontier for Westerland. The harbor is a world unto itself. Imperial agents, Bretonnian envoys, sea captains, old cult priests, smugglers, guild factors, and foreign bankers all crowd the same quays, each convinced that Westerland can be turned toward their purpose if the price is right. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.2.a:0 "Keep the ledgers open."

 war_unique_intro_events.3.t:0 "The Royarch's Burden"
 war_unique_intro_events.3.d:0 "Couronne bears the crown of Bretonnia, and Louen Leoncoeur bears the hopes of every knight who still believes the Lady watches. Songs call the realm blessed, but no song lingers long on hungry peasants, jealous dukes, Beastmen in the woods, or the shame that gathers around cursed Mousillon.\n\nThe Couronnien people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Couronne. The king's cause is noble because the age is not. Chivalry must be more than gilded ceremony, more than tournaments and polished vows recited above fields worked by frightened serfs. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.3.a:0 "Ride for the Lady."

 war_unique_intro_events.4.t:0 "Blood on the Longships"
 war_unique_intro_events.4.d:0 "The Vargs know the sea, the axe, and the red hunger of Khorne. Their longships are not merchants' hulls or fisher craft; they are teeth carved from timber, sent south to bite at every coast soft enough to bleed.\n\nThe Varg people move within the Norscan cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross Norsca, there is no passive frontier for Vargs. The Empire, Kislev, and Bretonnia speak of raiders as if they were storms. The Vargs know better. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.4.a:0 "Launch the longships."

 war_unique_intro_events.5.t:0 "Contracts of Remas"
 war_unique_intro_events.5.d:0 "Remas was once the heart of a greater human order, and its stones remember more than city-state squabbles. The marble, markets, temples, and old roads all whisper of a time when southern law was more than a negotiable convenience.\n\nThe Reman people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Tilea, there is no passive frontier for Remas. The city-states of Tilea are brilliant and exhausting. Remas, Miragliano, Luccini, and every lesser harbor turn wealth into intrigue as naturally as sailors turn wind into motion. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.5.a:0 "Sign the contracts."

 war_unique_intro_events.6.t:0 "The Forest Chooses"
 war_unique_intro_events.6.d:0 "Athel Loren is no ordinary realm, and its borders are not lines on a map. The forest dreams, bargains, hunts, remembers, and kills.\n\nThe Asrai Elves move within the Wood Elves cultural world, and public life is shaped by Asrai spirit-faith in court, shrine, camp, and market. Asrai belief binds elf and spirit to the forest, where beauty and vengeance share the same roots.\n\nNo place within Athel Loren is passive. Athel Loren's courts do not agree on what survival requires. Some spirits whisper that every outsider is future kindling, while some elves know old alliances may be the difference between a guarded glade and a beautiful tomb. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RAs a Wood Elf, you have a tough time administering lands outside of Forest.§!"
 war_unique_intro_events.6.a:0 "Guard the forest."

 war_unique_intro_events.7.t:0 "The Northern Hold"
 war_unique_intro_events.7.d:0 "Kraka Drak stands far from the comfort of the southern Karaks, a stubborn oath of stone beneath northern skies. Its halls are Dawi, but its winds are Norscan, and every gate knows the sound of raiders, monsters, and worse things testing the mountain.\n\nThe Norse Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Jotunheim-Gianthome Mountains, there is no passive frontier for Kraka Drak. Thorgard Cromson rules a people shaped by distance. The old roads to the Karaz Ankor are broken or watched by enemies, and messages from the south arrive like echoes from a better age. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.7.a:0 "Mark the grudges."

 war_unique_intro_events.8.t:0 "Ironhand's Furnace"
 war_unique_intro_events.8.d:0 "Zharrduk kneels to Hashut, and Astragoth Ironhand makes that devotion practical. Flesh weakens, slaves scream, engines roar, and every chain drawn tight becomes another proof that mercy is inefficient.\n\nThe Dawi Zharr people move within the Chaos Dwarf cultural world, and public life is shaped by Hashut in court, shrine, camp, and market. Hashut demands fire, tyranny, and useful cruelty, turning industry and obedience into sacred acts.\n\nAcross the Plain of Zharrduk, there is no passive frontier for Zharr-Naggrund. The Dark Lands reward those who can turn scarcity into machinery. Orcs, Ogres, Hobgoblins, caravans, and lesser tribes all crowd the wastes around us, each one a resource if properly defeated, purchased, or shackled. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.8.a:0 "Stoke the furnaces."

 war_unique_intro_events.9.t:0 "Top Knotz in the Tomb Roads"
 war_unique_intro_events.9.d:0 "The Top Knotz squat where dead kings, desert caravans, and nervous towns all give an Orc something to hit. Nehekhara's old roads were built for armies and tribute; that just proves the dead had good ideas before they got boring.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Top Knotz. Every raid teaches the tribe a new use for old empires. Tomb roads become WAAAGH paths, broken obelisks become boasting stones, and ancient curses become excellent stories if the cursed lad survives long enough to tell them. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.9.a:0 "Find a fight."

 war_unique_intro_events.10.t:0 "Red Shields Raised"
 war_unique_intro_events.10.d:0 "Red Shield warriors paint their protection in the color of other people's blood. A shield is good for stopping arrows, better for knocking teeth loose, and best when the enemy sees the mark coming and runs anyway.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Red Shields. The tribe's lands are crowded with rivals and roads worth raiding. A quiet season makes the boyz restless, and restless boyz begin checking whether the boss is still as tough as he sounded last night. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.10.a:0 "Raise the shields."

 war_unique_intro_events.11.t:0 "Grimgor's Red Fangs"
 war_unique_intro_events.11.d:0 "The Red Fangs follow Grimgor Ironhide because he is bigger, meaner, and more certain than the rest. Black Orc discipline does not make them gentle; it makes their violence arrive in a straighter line.\n\nThe Black Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the World's Edge Mountain, there is no passive frontier for Red Fangs. Grimgor does not need ancient claims, clever speeches, or a priest telling him the gods approve. The proof of rule is simple. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.11.a:0 "Start da biggest fight."

 war_unique_intro_events.12.t:0 "Smoke over Greyhag"
 war_unique_intro_events.12.d:0 "Greyhag lives under the black breath of the Dark Lands, where Orc shamans mutter to gods and Chaos Dwarf chains rattle in the distance. The smoke from the forges teaches a simple lesson: if someone else is building something terrible, hit them before they point it at you.\n\nThe Dark Land Orcs move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Southern Wastes, there is no passive frontier for Greyhag. The gods of Gork and Mork speak in omens only a proper shaman can turn into trouble. A cracked bone, a bad moon, a squig biting the wrong ankle: all of it might mean a WAAAGH if the boss is clever enough to say so loudly. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.12.a:0 "Read the smoke."

 war_unique_intro_events.13.t:0 "The Broken Axe"
 war_unique_intro_events.13.d:0 "Broken Axe follows Puff Castle-kracka because a boss with that name has something to prove every morning. The tribe understands one kind of legitimacy: things were standing, then the boss arrived, and now they are not.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Southern World Edge Mountains, there is no passive frontier for Broken Axe. From Misty Vale, Broken Axe faces neighboring powers, old roads, and present crises that will decide whether this realm becomes a footnote, a shield, or the spark that changes the region around it. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.13.a:0 "Break the next wall."

 war_unique_intro_events.14.t:0 "Finubar's Horizon"
 war_unique_intro_events.14.d:0 "Eataine looks outward from Ulthuan while the island argues with itself. From Lothern's harbors come diplomats, merchants, captains, and rumors, all insisting that the wider world is too dangerous to ignore and too valuable to abandon.\n\nThe Eatainian people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Phoenix King's Domain, there is no passive frontier for Eataine. Finubar Seafarer believes the Asur cannot guard the world by pretending the world is not there. Trade, alliances, embassies, and naval reach may restore prestige, but to many princes they sound like contamination dressed as policy. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.14.a:0 "Guide Ulthuan outward."

 war_unique_intro_events.15.t:0 "The Everqueen's Realm"
 war_unique_intro_events.15.d:0 "Avelorn is sacred ground, and Alarielle the Radiant is more than a ruler to the Asur. Her presence is the living sign that Ulthuan is not merely a fortress or fleet, but a covenant between people, gods, and land.\n\nThe Avelorni people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross the Everqueen's Domain, there is no passive frontier for Avelorn. The Everqueen's court sees corruption in foreign habits, foreign wars, and the impatient reforms of those who think survival requires compromise. To them, Finubar's open harbors may bring wealth, but they also invite decay into the island's soul. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.15.a:0 "Preserve the inner realm."

 war_unique_intro_events.16.t:0 "Courts of the Bleak Holds"
 war_unique_intro_events.16.d:0 "The Bleak Holds are cold even by Naggaroth's standards. They are a frontier of ice, chains, hard stone, and harder ambition, where lesser Druchii learn that exile can be refined into a weapon.\n\nThe Autarri people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Doom Glades, there is no passive frontier for Bleak Holds. Zorass Bale rules in the shadow of greater names. Naggarond, Ghrond, Karond Kar, Har Ganeth, Hag Graef, and Clar Karond all cast longer shadows in the Witch King's realm, but the frontier breeds a different kind of patience. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.16.a:0 "Keep the holds cruel."

 war_unique_intro_events.17.t:0 "The Citadel at Dusk"
 war_unique_intro_events.17.d:0 "The Citadel of Dusk guards hidden docks, waystones, and sanctioned routes far from Ulthuan's councils. It stands on the edge of Lustria like a lamp held above dark water, proud enough to shine and wise enough to shutter its windows.\n\nThe Colonial Asur people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross South Lustria, there is no passive frontier for Citadel of Dusk. These colonies are not casual settlements. They are fortress-ports, shrines, observatories, counting houses, and naval locks on roads no road-builder ever touched. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.17.a:0 "Signal the patrols."

 war_unique_intro_events.18.t:0 "The Overtyrant's Due"
 war_unique_intro_events.18.d:0 "Goldtooth measures power in meat, coin, and the number of tribes willing to get out of Greasus' way. The caravan roads feed him, fear him, and somehow still come back with more tribute.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Goldtooth. The Great Maw taught the Ogres that hunger is not a weakness. It is a god, a law, and an argument that wins most debates before words become necessary. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.18.a:0 "Count the tribute."

 war_unique_intro_events.19.t:0 "Storm Dragon of the North"
 war_unique_intro_events.19.d:0 "The Northern Provinces stand beneath the Bastion's shadow, where Miao Ying must hold Chaos outside and Cathayan pride inside. The Dragon Emperor is gone, but the wall still requires orders, soldiers, grain, and a ruler whose silence can frighten ministers into competence.\n\nThe Storm Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Western Provinces, there is no passive frontier for Storm Court. From Nan-Gau, Storm Court faces neighboring powers, old roads, and present crises that will decide whether this realm becomes a footnote, a shield, or the spark that changes the region around it. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.19.a:0 "Guard the Bastion."

 war_unique_intro_events.20.t:0 "Wardens of the Empty Throne"
 war_unique_intro_events.20.d:0 "The Imperial Wardens are servants of Cathay's order, but service is never simple when the throne is empty. Seals, gates, rosters, and ceremonies all remain, yet every one of them can become a weapon in the hands of a patient administrator.\n\nThe Storm Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Northern Provinces, there is no passive frontier for Imperial Wardens. A warden's strength lies in making procedure feel inevitable. If the gates open only by our seal, if the granaries release only by our tally, and if the road patrols salute only our writ, then even ambitious dragons must negotiate with administration. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.20.a:0 "Keep the watch."

 war_unique_intro_events.21.t:0 "The Southern Watch"
 war_unique_intro_events.21.d:0 "The Southern Provinces look toward jungles, rebel roads, mountain shrines, and neighbors that Cathayan court maps prefer to simplify. Heat, distance, and old local loyalties make the south a realm of subtler dangers than the Bastion's open war.\n\nThe Fire Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Southern Provinces, there is no passive frontier for Fire Court. The southern dominions obey the Dragon Throne through habit, advantage, and fear of what disorder would invite. Those bindings are real, but they are not iron. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.21.a:0 "Secure the south."

 war_unique_intro_events.22.t:0 "Dragon of the Eastern Sea"
 war_unique_intro_events.22.d:0 "The Eastern Provinces face the sea, where storms, pirates, foreign sails, and distant islands make protocol feel very far away. Yin-Yin sees in every harbor a chance to prove that Cathay's destiny is not confined to the inland court.\n\nThe Sea Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Eastern Provinces, there is no passive frontier for Sea Court. Yet eastern ambition is dangerous. A dragon who looks outward may be praised as visionary after victory and condemned as reckless before it. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.22.a:0 "Command the coast."

 war_unique_intro_events.23.t:0 "Blood-Voice of the Great Dragon"
 war_unique_intro_events.23.d:0 "The Old Ones are half-buried names in Aki-Aka's volcanic isles. Their plaques lie cracked beneath step-altars, skull racks, gem masks, and blood-smoke raised for the living dragons who coil above the mountains.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Dragon Isles, there is no passive frontier for Aki-Aka. Beyond the shores, the world presses closer. The Dragon Isles command the mouth of the River Ruin, and the wealth of their gems would tempt merchants, conquerors, and slavers alike. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.23.a:0 "Beat the blood-gong."

 war_unique_intro_events.24.t:0 "The Hell Pit Breeds"
 war_unique_intro_events.24.d:0 "Clan Moulder hears destiny in the scrape of bone-saws and the wet growl of things that should not live. Hell Pit is less a city than a stomach full of cages, laboratories, and excuses for why the last batch only killed half the handlers.\n\nThe Moulder Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Northern Warrens, there is no passive frontier for Clan Moulder. The Under-Empire praises unity in public and betrayal in every private corridor. Skryre has its engines, Pestilens its plagues, the Grey Seers their holy squealing, but every one of them eventually needs muscle that can survive being pointed at a wall. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.24.a:0 "Unchain the vats."

 war_unique_intro_events.25.t:0 "The High King's Grudge"
 war_unique_intro_events.25.d:0 "Karaz-a-Karak is the throne of memory, and Thorgrim Grudgebearer carries more than a crown. The Dammaz Kron is not a book of complaints; it is a map of everything the world still owes the Dawi.\n\nThe Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the World's Edge Mountain, there is no passive frontier for Karaz-a-Karak. The Karaz Ankor was once a mountain empire of roads, holds, oaths, and craft beyond the envy of younger races. The War of the Beard, the Time of Woes, Greenskin invasions, Skaven filth, and a thousand betrayals broke that golden order into isolated stone islands. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.25.a:0 "Open the Dammaz Kron."

 war_unique_intro_events.26.t:0 "The Slayer King's Hold"
 war_unique_intro_events.26.d:0 "Karak Kadrin is ruled by Ungrim Ironfist, a king who must live for his people while bound to an oath that demands death. There are easier contradictions in the world, but few so Dwarfen.\n\nThe Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the World's Edge Mountain, there is no passive frontier for Karak Kadrin. Karak Kadrin's fame draws the desperate, the dishonored, and the furious, but their deaths must buy more than poems. Roads must be cleared, monsters broken, passes secured, and shame turned outward before it hollows the hold from within. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.26.a:0 "Swear the oath."

 war_unique_intro_events.27.t:0 "Veils of New Lahmia"
 war_unique_intro_events.27.d:0 "New Lahmia is Neferata's answer to exile, memory, and every court that thought the Lahmian dream had died. Beauty opens doors, fear keeps them open, and secrets decide who enters next.\n\nThe Lahmian people move within the Nehekharan cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the World's Edge Mountain, there is no passive frontier for New Lahmia. Nehekhara remembers kings, but it has not forgotten queens. The old city was lost, the bloodline scattered, and the world learned to speak of Lahmia as a cautionary tale. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!"
 war_unique_intro_events.27.a:0 "Draw the veils closed."

 war_unique_intro_events.28.t:0 "The Husk on Cripple Peak"
 war_unique_intro_events.28.d:0 "Nagash was once prince, priest, usurper, and the first great master of necromancy. He stole forbidden arts, broke the old laws of death, raised the Black Pyramid, and turned Nehekhara's promise of immortality into a curse that still rattles in every tomb.\n\nDefeat did not make him ordinary. On Cripple Peak, Nagashizzar clings to black stone and poisoned memory, and within it remains a husk: a damaged vessel of will, calculation, hunger, and fragments of the Great Necromancer's impossible design.\n\nThe husk is not yet the master who made gods and kings tremble, but it is not empty. Each corpse-priest, war-captive, formula, and remembered name can feed the shape within it until Cripple Peak becomes a throne again."
 war_unique_intro_events.28.a:0 "The husk remembers."

 war_unique_intro_events.29.t:0 "The Council's Decree"
 war_unique_intro_events.29.d:0 "The Grey Seer Council speaks with the authority of the Horned Rat, which makes every word sacred and every listener suspicious. A command from the Council is prophecy, policy, and threat, usually in that order and always with witnesses nearby.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross Skavenblight, there is no passive frontier for Grey Seer Clan. Skavenblight's shadow reaches every tunnel that matters. The surface-things do not understand how much of their world is already undermined, counted, sniffed, and marked for future gnawing. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.29.a:0 "Chitter the decrees."

 war_unique_intro_events.30.t:0 "Skryre Sparks"
 war_unique_intro_events.30.d:0 "Clan Skryre knows that courage is overrated when a machine can explode at the enemy from far away. Warpstone is danger, fuel, currency, scripture, and occasionally the last thing an assistant sees before becoming data.\n\nThe Skryre Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross Skavenblight, there is no passive frontier for Clan Skryre. The Under-Empire is a marketplace of treachery. The Grey Seers preach, Moulder stitches, Pestilens coughs, and every clan insists it is indispensable. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.30.a:0 "Spark the machinery."

 war_unique_intro_events.31.t:0 "The Sacred Pox"
 war_unique_intro_events.31.d:0 "Clan Pestilens does not spread disease as a tactic alone; it spreads doctrine. Nurglitch VII teaches that every clean street is heresy and every coughing city is a sermon beginning to work.\n\nThe Pestilens Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Warrens, there is no passive frontier for Clan Pestilens. Lustria taught Pestilens that the world is full of bodies too proud of their health. Temple cities, man-things, elf-things, and rival rats all share the same weakness: they breathe. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.31.a:0 "Spread the sacred filth."

 war_unique_intro_events.32.t:0 "Skarsnik's Moon"
 war_unique_intro_events.32.d:0 "Crooked Moon survives because Skarsnik understands that a small blade in the dark can beat a bigger axe in the open. Night Goblins do not need to be brave when they can be patient, numerous, poisonous, and standing behind the trapdoor.\n\nThe Night Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross Karak Eight Peaks, there is no passive frontier for Crooked Moon Tribe. Karak Eight Peaks glitters in every scheme. Dwarfs claim it with grudges, Skaven infest it with ambition, and louder Orcs think wanting it loudly should be enough. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.32.a:0 "Set the ambushes."

 war_unique_intro_events.33.t:0 "First City of the Plan"
 war_unique_intro_events.33.d:0 "Itza is the First City, and its stones remember when the Old Ones walked where lesser races now trespass. Every ziggurat, spawning pool, causeway, and glyph is part of a design older than the ambitions of warmblood kings.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Southern Jungle, there is no passive frontier for Itza. If Itza moves, Lustria should feel the movement as a command rather than a suggestion. The world was ordered once, and the First City has not forgotten the shape of obedience. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.33.a:0 "Obey the plaques."

 war_unique_intro_events.34.t:0 "Mazdamundi's Judgment"
 war_unique_intro_events.34.d:0 "Hexoatl rests beneath the will of Lord Mazdamundi, whose patience is geological and whose anger can move mountains. The City of the Sun is not only a capital; it is a statement that the Old Ones' order still has teeth.\n\nThe Hexoatl Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Isthmus of Lustria, there is no passive frontier for Hexoatl. Lustria is threatened by Skaven filth, Druchii arrogance, greedy explorers, and the rising madness of Chaos. Each threat is different in shape but identical in meaning: disorder has entered sacred space. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.34.a:0 "Realign the world."

 war_unique_intro_events.35.t:0 "Moons over Tlaxtlan"
 war_unique_intro_events.35.d:0 "Tlaxtlan watches the moons with a discipline outsiders would call silence. Its priests, Skinks, and Saurus read omens in cold light while lesser minds ask for simpler orders.\n\nThe Amazon Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Northern Jungle, there is no passive frontier for Tlaxtlan. The world grows impatient as the End Times approach. Warmbloods rush, Skaven multiply, Elves scheme, and Chaos claws at the edges of reality. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.35.a:0 "Read the moons."

 war_unique_intro_events.36.t:0 "The City of Mists"
 war_unique_intro_events.36.d:0 "Xlanhuapec hides behind mists that are warning, weapon, and memory. The city does not vanish because it is afraid.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Northern Jungle, there is no passive frontier for Xlanhuapec. The mists protect secrets that are not merely local. Plaques, spawning pools, geomantic alignments, and half-remembered commands from the Old Ones all require concealment from those who would loot, corrupt, or misunderstand them. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.36.a:0 "Let the mists answer."

 war_unique_intro_events.37.t:0 "The Black Armada"
 war_unique_intro_events.37.d:0 "The Dreadfleet is not merely another nest of corpse-pirates. Noctilus von Carstein has made the Maelstrom into a throne room, and every drowned sailor is another oath sworn beneath black sails.\n\nThe Noctilavan people move within the Vampire Coastmen cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Vampire Coast, there is no passive frontier for Dreadfleet. The Vampire Coast plunders for gold, but also for dominion over fear itself. A port that pays tribute, a convoy that changes course, a captain who whispers the wrong name before a storm: all of these are victories before the guns fire. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
 war_unique_intro_events.37.a:0 "Unfurl the black sails."

 war_unique_intro_events.38.t:0 "Mist-Bound Fethnaal"
 war_unique_intro_events.38.d:0 "Fethnaal's Fimir brood in exile, half-hidden by swamp mist and older malice. They are a people of damp stone, harsh ritual, and grudges too sour to become songs.\n\nThe Fimir people move within the Fimir cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Northern Jungle, there is no passive frontier for Fethnaal. In Lustria, every neighbor is dangerous. Lizardmen serve a cosmic order that has no place for Fimir hunger, while other intruders bring guns, chains, plagues, or knives. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.38.a:0 "Call through the mist."

 war_unique_intro_events.39.t:0 "Settra Does Not Serve"
 war_unique_intro_events.39.d:0 "Khemri wakes to a lesser world, and Settra finds that unacceptable. Nehekhara lies broken, rival kings mutter in their tombs, and priests speak of gods as if such things were above him.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Khemri. Settra remembers empire as fact, not aspiration. Golden cities, endless legions, chariots beneath the sun, tribute roads, and bowed rivals were not myths. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.39.a:0 "Rise, my legions."

 war_unique_intro_events.40.t:0 "Arkhan's Vigil"
 war_unique_intro_events.40.d:0 "Arkhan the Black does not mistake defeat for finality. The servants of Nagash count bones, relics, and forbidden names while Nehekhara's proud kings pretend the Great Necromancer is only a memory.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by Nagashite devotion in court, shrine, camp, and market. Nagashite devotion treats death as law and memory as command, making the living merely one resource among many.\n\nAcross Nehekhara, there is no passive frontier for Arkhan. Nehekhara may curse Arkhan's name, but curses are only prayers turned sour. The dead answer stronger calls. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.40.a:0 "Serve the Great Necromancer."

 war_unique_intro_events.41.t:0 "The Statues of Quatar"
 war_unique_intro_events.41.d:0 "Quatar endures in stone, silence, and the watchful faces of deathless kings. Its statues do not flatter the dead; they remind the living and the risen alike that power can be carved so deeply even time must walk around it.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Quatar. The roads around us once carried tribute, soldiers, priests, and royal command. Now they cross a fractured Nehekhara where every awakened ruler speaks of restoration while meaning his own throne first. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.41.a:0 "Wake the necropolis."

 war_unique_intro_events.42.t:0 "The Prophet's City"
 war_unique_intro_events.42.d:0 "Alhaka is the furnace of Anmar Fakir's revelation. The One Faith has burned through old idols, djinn bargains, borrowed gods, and desert divisions, but belief must be seen if the Solar Mandate is to endure.\n\nThe Cophic people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Alhaka. In thirty years, treaty and conquest have made Araby speak with one tongue in public, if not always in private. Tribes, cities, scholars, merchants, and soldiers obey the new order, but old bargains do not vanish simply because a brighter truth names them false. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.42.a:0 "Proclaim the One Faith."

 war_unique_intro_events.43.t:0 "Lashiek's Blessed Sails"
 war_unique_intro_events.43.d:0 "Lashiek lives by harbors, corsairs, and councils that know faith travels faster when ships carry it. Its docks hear prayers, bargains, lies, and sea-wind in equal measure, which makes them excellent instruments for a young religion with world-spanning ambitions.\n\nThe Cophic people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Lashiek. The old Arabyan coast remembers djinn bargains and foreign idols, while the new order insists that such powers were demons wearing useful names. In Lashiek, that argument must survive contact with profit. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.43.a:0 "Bless the harbor."

 war_unique_intro_events.44.t:0 "Debeqra's Road"
 war_unique_intro_events.44.d:0 "Debeqra watches oases, southern roads, and tribes that do not always bend because a preacher or ruler says they should. Distance weakens proclamations, heat tests discipline, and every caravan carries news reshaped by the last campfire.\n\nThe Sudron people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Sudron, there is no passive frontier for Debeqra. Frontier faith must be more than a proclamation sent from a safer city. It needs judges who know the wells, soldiers who can survive the roads, and scholars patient enough to explain why old bargains were chains wearing familiar names. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.44.a:0 "Bind the road."

 war_unique_intro_events.45.t:0 "Zlatlan's Southern Plaques"
 war_unique_intro_events.45.d:0 "Zlatlan keeps a southern watch far from Lustria's most famous temple-cities. Its priests serve the Old Ones among deserts, tomb kingdoms, jungle margins, and warm-blooded empires that misunderstand every sacred boundary they cross.\n\nThe Southlands Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the New Coast, there is no passive frontier for Zlatlan. Katari Dzilam's people are not lesser servants because they stand far from Itza or Hexoatl. The Great Plan is not local. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.45.a:0 "Guard the southern plan."

 war_unique_intro_events.46.t:0 "The Woodsman's Shot"
 war_unique_intro_events.46.d:0 "Hochland is a province of deep forests, lumber roads, inns, and marksmen who know that a single patient shot can matter more than a dozen shouted orders. Hergig's court watches the Empire's troubles through branches, smoke, and the long barrel of the Hochland long rifle.\n\nThe Hochlander people move within the Imperial cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the North Empire Provinces, there is no passive frontier for Hochland. The Empire around Hochland is fraying. Beastmen creep through old growth, cults hide in lonely inns, merchants worry over tolls, and Reikland speaks of unity as if unity were simple once trees, rivers, and pride get in the way. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.46.a:0 "Take careful aim."

 war_unique_intro_events.47.t:0 "The Wolf at Middenheim"
 war_unique_intro_events.47.d:0 "Middenland remembers when the north spoke with greater force in Imperial politics. Middenheim still rises like a challenge above the Drakwald, and Ulric's flame burns there with a pride no Reiklander sermon can soften.\n\nThe Middenlander people move within the Imperial cultural world, and public life is shaped by Ulrican faith in court, shrine, camp, and market. Ulrican faith prizes winter courage, hard judgment, and the honor of standing firm when comfort fails.\n\nAcross the North Empire Provinces, there is no passive frontier for Middenland. Boris Todbringer rules a province that has never mistaken courtesy for virtue. The Todbringer claim, the Cult of Ulric, the wolf-kin brotherhoods, the forest forts, and the stubborn towns of Middenland all insist that the Empire is more than Sigmar's southern court. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.47.a:0 "Stand with Ulric."

 war_unique_intro_events.48.t:0 "The Long Watch by Sylvania"
 war_unique_intro_events.48.d:0 "Stirland is poor, damp, stubborn, and uncomfortably close to places that decent folk prefer to mention only after locking the door. Its fields are hard, its roads are watched, and its villages have learned that mist from Sylvania rarely brings anything good.\n\nThe Stirlander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the Central Empire Provinces, there is no passive frontier for Stirland. Alberich Haupt-Anderssen inherits a province with more memory than money. Stirland remembers Queen Freya, old emperors, river patrols, Morr's cold comfort, and claims that wiser neighbors would call impossible if they did not know Stirlanders too well. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.48.a:0 "Hold the dreary line."

 war_unique_intro_events.49.t:0 "Mad Count, Black Fire"
 war_unique_intro_events.49.d:0 "Averland is bright with cattle wealth, black-and-yellow pride, good horses, better beer, and the uneasy knowledge that Black Fire Pass has saved the Empire more than once. Its prosperity is real, but so is the road by which ruin can enter.\n\nThe Averlander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the South Empire Provinces, there is no passive frontier for Averland. The province sits where Imperial ambition meets Dwarf roads, merchant traffic, and the mountains beyond which Greenskins gather. Its knights, cattle lords, Black Bear warriors, and townsmen know that wealth invites mockery until the pass needs holding. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.49.a:0 "Guard the Black Fire road."

 war_unique_intro_events.50.t:0 "At the Forest's Edge"
 war_unique_intro_events.50.d:0 "Ostland is not comfortable, fashionable, or rich enough for softer provinces to envy. That is part of its strength.\n\nThe Ostlander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the North Empire Provinces, there is no passive frontier for Ostland. The Forest of Shadows does not forgive foolishness. Beastmen haunt its depths, old devastation still scars the land, and northern warbands need only one weak season to turn border fear into fire. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.50.a:0 "Endure the north."

 war_unique_intro_events.51.t:0 "Heart of Taal's Realm"
 war_unique_intro_events.51.d:0 "Talabecland lies at the center of the Empire, where rivers, roads, forests, and old provincial pride all meet. Its people honor Taal and Rhya with a seriousness outsiders mistake for rustic simplicity, usually shortly before a Talabeclander proves the woods were listening.\n\nThe Talabeclander people move within the Imperial cultural world, and public life is shaped by Taalite rites in court, shrine, camp, and market. Taalite custom binds field, forest, river, and crown into a rough covenant with the living land.\n\nAcross the Central Empire Provinces, there is no passive frontier for Talabecland. The situation is central and combustible, so we must keep commerce, piety, and forest law from pulling apart. Taal's judgment is final in the wilds, but government must make that judgment useful on roads, docks, and tax ledgers too. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.51.a:0 "Keep the rivers moving."

 war_unique_intro_events.52.t:0 "League of the East March"
 war_unique_intro_events.52.d:0 "Ostermark is a league of towns pretending, with admirable desperation, that mutual fear is a stable constitution. Between Kislev, Sylvania, the World's Edge Mountains, and the ruins of Mordheim, that pretense may be the only reason the east still answers to the Empire at all.\n\nThe Ostermarker people move within the Imperial cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the Central Empire Provinces, there is no passive frontier for Ostermark. The eastern march is exposed on almost every side. Vampire dread rises from Sylvania, Kislevite troubles spill south, mountain roads carry rumors of Greenskins and worse, and Imperial neighbors remember Ostermark mostly when they need someone else to bleed first. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.52.a:0 "Bind the league."

 war_unique_intro_events.53.t:0 "Sea Claws of the Empire"
 war_unique_intro_events.53.d:0 "Nordland faces the Sea of Claws with timber, salt, claims, and a nervous awareness that water brings wealth and raiders by the same wind. The Empire is not known for seamanship, but Nordland has little choice except to learn what Altdorf neglects.\n\nThe Nordlander people move within the Imperial cultural world, and public life is shaped by Ulrican faith in court, shrine, camp, and market. Ulrican faith prizes winter courage, hard judgment, and the honor of standing firm when comfort fails.\n\nAcross the North Empire Provinces, there is no passive frontier for Nordland. Nordland's claims reach across neighboring lands in ways those neighbors do not appreciate. Yet those claims are also a language of security: forests must supply ships, ships must guard trade, and trade must pay for the men who keep northern sails from becoming funeral signs. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.53.a:0 "Ready the northern fleet."

 war_unique_intro_events.54.t:0 "Solland's Scars"
 war_unique_intro_events.54.d:0 "Sudenland lives among the scars of Solland, where memory is not romance but a wound that teaches caution. Its villages, woods, and ruined holdings know what happens when a province is too weak, too divided, or too unlucky to survive the next great blow.\n\nThe Sudenlander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the South Empire Provinces, there is no passive frontier for Sudenland. The south is watched by neighbors who speak more loudly in Imperial councils, while enemies beyond the passes and forests care little for old boundaries. A small province cannot afford ceremonial weakness, especially when ruined towers still mark where confidence failed. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.54.a:0 "Rebuild from ruin."

 war_unique_intro_events.55.t:0 "The Joke That Endured"
 war_unique_intro_events.55.d:0 "The Moot began, depending on who is telling the story, as Imperial generosity, political insult, legal accident, or an excellent joke that became too useful to repeal. Halflings know better than to correct every human version.\n\nThe Imperial Halfling people move within the Imperial cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the Central Empire Provinces, there is no passive frontier for The Moot. Stirland eyes the land with old resentment, Imperial nobles underestimate it by habit, and every army in the region eventually remembers that full stomachs matter more than speeches. The Moot is small, but it sits on soil worth defending. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.55.a:0 "Mind the ovens and borders."

 war_unique_intro_events.56.t:0 "Harbor of the Lady"
 war_unique_intro_events.56.d:0 "L'Anguille is Bretonnia's great window to the sea, a proud port where salt wind, merchant ledgers, dockyard labor, and knightly vows all meet under the Lady's gaze. The duchy knows that ships can carry glory as surely as horses do.\n\nThe Couronnien people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for L'Anguille. The wider world presses against the harbor. Norscan raiders, pirates, foreign traders, Bretonnian rivals, and ambitious captains all understand that L'Anguille's docks are valuable because they face beyond the realm. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.56.a:0 "Raise the sea banners."

 war_unique_intro_events.57.t:0 "Mist over Lyonesse"
 war_unique_intro_events.57.d:0 "Lyonesse lives with the sea at its back, ruins in its stories, and mist enough to make every patrol feel like a legend halfway remembered. Its coast is beautiful, treacherous, and haunted by the kind of tales knights repeat more loudly when afraid.\n\nThe Lyonessien people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Lyonesse. The realm beyond Lyonesse is no less dangerous than the waters. Raiders test the coast, rival dukes measure weakness, and the Lady's favor must be proven in deeds rather than trusted as inheritance. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.57.a:0 "Ride through the mist."

 war_unique_intro_events.58.t:0 "Hunters of Artois"
 war_unique_intro_events.58.d:0 "Artois is a duchy of deep forests, hard hunts, and old shadows that do not politely remain in old stories. Its knights ride beneath branches where beasts, curses, and worse things have learned to move before the horn sounds.\n\nThe Couronnien people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Artois. If Artois keeps faith with both lance and horn, the forest will become a shield for Bretonnia. If it does not, the trees will teach the duchy what they have been sheltering. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.58.a:0 "Sound the hunt."

 war_unique_intro_events.59.t:0 "The Northern Bulwark"
 war_unique_intro_events.59.d:0 "Gisoreux stands where northern roads, forests, and hard weather make Bretonnia's borders feel less like lines than tests. Its knights have learned that honor must sometimes wear mud, patience, and a trapper's eye.\n\nThe Bourgonian people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Gisoreux. If Gisoreux holds, Bretonnia's north will become a warning rather than an opening. If it fails, the realm's enemies will find roads where the songs promised only glory. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.59.a:0 "Hold the northern roads."

 war_unique_intro_events.60.t:0 "Wine-Dark Sails"
 war_unique_intro_events.60.d:0 "Bordeleaux is blessed with vineyards, harbors, and a sea wind that carries both profit and peril. Its wines are praised across the Old World, but no cask reaches a distant table unless roads, ships, and knights keep greed from becoming plunder.\n\nThe Aquitanian people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Bordeleaux. Pirates, rivals, raiders, and ambitious foreign traders all understand Bordeleaux's value. A prosperous harbor is a promise to friends and an invitation to enemies, especially when the wider world grows darker. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.60.a:0 "Bless the sea roads."

 war_unique_intro_events.61.t:0 "Gilles' Inheritance"
 war_unique_intro_events.61.d:0 "Bastonne bears the memory of Gilles le Breton, and that inheritance is too heavy to be carried by songs alone. Every knight in the duchy knows that the birthplace of Bretonnia's unifier must prove old virtue can still command a fractured age.\n\nThe Aquitanian people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Bastonne. Bretonnia's enemies do not care how bright the past was. Beastmen, vampires, rival ambitions, peasant misery, and foreign pressure all press against a realm whose chivalry must be renewed in action or fade into decoration. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.61.a:0 "Honor the first vow."

 war_unique_intro_events.62.t:0 "Gate of the Grey Mountains"
 war_unique_intro_events.62.d:0 "Montfort is a duchy of passes, cliffs, hard roads, and fortresses that make caution look like architecture. It guards approaches where Bretonnia, the Empire, and the mountains all meet under weather that punishes the careless.\n\nThe Bourgonian people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Montfort. If Montfort holds the gates, Bretonnia can sleep with its back guarded. If it fails, the mountains will become a road for every fear the realm hoped was distant. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.62.a:0 "Hold the passes."

 war_unique_intro_events.63.t:0 "Songs of Aquitaine"
 war_unique_intro_events.63.d:0 "Aquitaine is fertile, cultured, and dangerously easy for outsiders to mistake as gentle. Its fields feed courts and chapels, its patrons reward poets and artists, and its knights understand that a song can carry a reputation farther than a herald.\n\nThe Aquitanian people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Aquitaine. If Aquitaine binds beauty to protection, its fame will strengthen Bretonnia rather than distract it. If not, its finest verses will become elegies. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.63.a:0 "Let honor be sung."

 war_unique_intro_events.64.t:0 "Tides of Brionne"
 war_unique_intro_events.64.d:0 "Brionne's harbor is a busy argument between chivalry and commerce, with shipwrights, sailors, merchants, and knights all insisting they serve the Lady in the most necessary way. The sea brings wealth, but it never brings only wealth.\n\nThe Carcassonnian people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Brionne. If Brionne masters the tide, Bretonnia's coast will have a shield and a purse. If it fails, every mast in the harbor will look like an invitation. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.64.a:0 "Launch the blessed keels."

 war_unique_intro_events.65.t:0 "Shrines of Quenelles"
 war_unique_intro_events.65.d:0 "Quenelles is rich in sacred waters, fertile lands, pilgrim roads, and vows spoken with more weight than ordinary law. The Lady's presence feels near here, which makes failure not less possible but less excusable.\n\nThe Carcassonnian people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Quenelles. If Quenelles turns holiness into order, it can become Bretonnia's spiritual anchor. If it grows complacent, every desecration will sound louder because it happened where the Lady was thought closest. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.65.a:0 "Guard the holy waters."

 war_unique_intro_events.66.t:0 "Wings above the Peaks"
 war_unique_intro_events.66.d:0 "Parravon looks across the Grey Mountains from roads, high pastures, and towers where the sky itself seems part of the duchy's inheritance. Its pegasus knights are not decoration; they are warning, judgment, and sudden violence from above.\n\nThe Bourgonian people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Parravon. If Parravon rules the heights, Bretonnia's enemies will find no unseen road through the peaks. If it fails, even the most beautiful charge will arrive too late. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.66.a:0 "Take to the skies."

 war_unique_intro_events.67.t:0 "The Iron March"
 war_unique_intro_events.67.d:0 "Carcassonne is a frontier duchy that trusts stone, steel, vows, and vigilance more than pretty reassurance. Its fortresses stand because too many enemies have proved the border is not an idea but a place where men die.\n\nThe Carcassonnian people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Bretonnia, there is no passive frontier for Carcassone. Beyond the borders lie threats that do not respect chivalric ceremony. Raiders, Greenskins, monsters, and worse things test every weak place, while Bretonnian politics can make even necessary severity look uncourtly. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.67.a:0 "Stand at the frontier."

 war_unique_intro_events.68.t:0 "Raiders of the Sea Claws"
 war_unique_intro_events.68.d:0 "The Skaelings are feared because their longships turn distance into cruelty. One day a coast is counting fish, wool, and coin; the next it is counting ashes while northern sails vanish into mist.\n\nThe Skaeling people move within the Norscan cultural world, and public life is shaped by the old northern gods in court, shrine, camp, and market. The old northern gods reward raid, oath, storm, and boast, and their favor belongs to those who return with proof.\n\nAcross Norsca, there is no passive frontier for Skaelings. The Empire and Bretonnia call the Skaelings pirates when they are angry and storms when they are frightened. The tribe knows it is neither. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.68.a:0 "Push the longships out."

 war_unique_intro_events.69.t:0 "War-Drums of the Bjornlings"
 war_unique_intro_events.69.d:0 "The Bjornlings are a large and hard people, raised among cold lands where weakness becomes public knowledge quickly. Their warbands have the numbers to matter and the discipline to make that matter before louder tribes waste their strength on boasting.\n\nThe Bjornling people move within the Norscan cultural world, and public life is shaped by the old northern gods in court, shrine, camp, and market. The old northern gods reward raid, oath, storm, and boast, and their favor belongs to those who return with proof.\n\nAcross Norsca, there is no passive frontier for Bjornlings. Norsca is never at peace in any useful sense. A quiet season only means feuds are sharpening indoors, champions are comparing scars, and neighbors are wondering which camp has grown too comfortable. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.69.a:0 "Gather the warbands."

 war_unique_intro_events.70.t:0 "Hunters under Dark Stars"
 war_unique_intro_events.70.d:0 "The Graelings know the wild paths of Norsca better than most men know their own doorways. They hunt, raid, vanish, and return by routes that outsiders call impossible because outsiders are usually lost before the lesson begins.\n\nThe Graeling people move within the Norscan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Norsca, there is no passive frontier for Graelings. Aoakan Oybiorn rules beneath darker stars than many Norscan jarls admit. The tribe's omens lean toward ruin, its warriors follow tracks through snow and stone, and its leaders know terrain can be a blade if held correctly. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.70.a:0 "Follow the tracks."

 war_unique_intro_events.71.t:0 "Favored by Ruin"
 war_unique_intro_events.71.d:0 "The Aeslings are not content to raid for hunger alone. Their chiefs court the Dark Gods with sacrifice, oath, and spectacle, seeking signs in blood spray, storm light, and the silence after a village burns.\n\nThe Aesling people move within the Norscan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Norsca, there is no passive frontier for Aeslings. The south sees only savagery, but the Aeslings understand a harsher politics. Plunder feeds loyalty, sacrifices bind fear to obedience, and the gods reward those who make their devotion impossible to ignore. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.71.a:0 "Seek the gods' favor."

 war_unique_intro_events.72.t:0 "The Great Tribe"
 war_unique_intro_events.72.d:0 "The Sarls are counted among the great tribes of Norsca, and size is a promise that must be renewed with blood. Many halls answer their chiefs, many ships can be called to sea, and many rivals watch for the first sign that numbers have made them soft.\n\nThe Sarl people move within the Norscan cultural world, and public life is shaped by the old northern gods in court, shrine, camp, and market. The old northern gods reward raid, oath, storm, and boast, and their favor belongs to those who return with proof.\n\nAcross Norsca, there is no passive frontier for Sarls. The south fears Norscan fury, but the Sarls know fury is wasted unless it can march, sail, and return with proof. Discipline does not make them gentle. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.72.a:0 "Gather the war-host."

 war_unique_intro_events.73.t:0 "Children of Decay"
 war_unique_intro_events.73.d:0 "The Rotbloods do not fear sickness, weakness, or the slow collapse of flesh. They call these things gifts, proof that Grandfather Nurgle has noticed them and made their bodies into sermons against mortal pride.\n\nThe Graeling people move within the Norscan cultural world, and public life is shaped by Nurglite devotion in court, shrine, camp, and market. Nurgle turns suffering into fellowship and decay into endurance, making every wound a promise that the faithful will continue.\n\nAcross the Far Wastes, there is no passive frontier for Rotbloods. To the Empire, they are corruption made visible. To other servants of Chaos, they are a reminder that ruin need not be bright, swift, or glorious. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe time of reckoning draws near. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.73.a:0 "Spread the Plague Father's gifts."

 war_unique_intro_events.74.t:0 "The Walls of Avila"
 war_unique_intro_events.74.d:0 "Avila is a city of walls, markets, and negotiated privilege. Stone keeps raiders outside, but charters keep the city alive, drawing merchants, craftsmen, and ambitious families into streets where profit quickly becomes politics.\n\nThe Obregese people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Avila. The first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.74.a:0 "Open the charters."

 war_unique_intro_events.75.t:0 "Harbor Lords of Bilbali"
 war_unique_intro_events.75.d:0 "Bilbali looks west across a restless sea, and the harbor families understand that a ship is never only a ship. It is profit, escape, threat, rumor, and sometimes a private war with a legal seal pasted over the blood.\n\nThe Tigarrian people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Bilbali. The first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.75.a:0 "Ready the harbor."

 war_unique_intro_events.76.t:0 "Marches of Las Marcas"
 war_unique_intro_events.76.d:0 "Las Marcas is a country of roads that climb, villages that keep weapons close, and fortresses built because every generation learned the border would be tested again. Its people do not mistake quiet for peace.\n\nThe Tigarrian people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Las Marcas. Estalia's coastal cities dream of ships and tradeposts, but Las Marcas knows inland survival is its own ambition. If the mountains fall open, merchants lose roads, fields lose shelter, and every rival gains a way to turn local quarrels into invasion. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.76.a:0 "Hold the mountain roads."

 war_unique_intro_events.77.t:0 "The Great Port of Estalia"
 war_unique_intro_events.77.d:0 "Magritta is Estalia's great gate to the world, a city where shipyards ring, merchants argue in half a dozen tongues, and every tide carries the rumor of lands beyond the Western Ocean. Its wealth is not still; it moves.\n\nThe Maggritan people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Magritta. Yet Magritta's grandeur does not make Estalia safe. Bretonnia watches from the north, Tilea competes from the east, pirates test the routes, and every foreign harbor welcomes Estalian gold more warmly than Estalian power. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.77.a:0 "Look beyond the horizon."

 war_unique_intro_events.78.t:0 "Heart of Obregon"
 war_unique_intro_events.78.d:0 "Obregon is an inland power in a land too often remembered only by its ports. Its fields, roads, officers, and fortified towns give Estalia a different kind of strength, less glamorous than a harbor but harder to sweep aside.\n\nThe Obregese people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Obregon. Estalia is divided by pride as much as geography. Coastal cities chase trade, frontier lords guard passes, and ambitious courts promise unity while measuring how much obedience they can demand from neighbors. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.78.a:0 "Discipline the levies."

 war_unique_intro_events.79.t:0 "Republic of Ledgers"
 war_unique_intro_events.79.d:0 "Novareno is governed by families who understand that a charter can conquer where an army would only bankrupt itself. Licenses, caravans, tolls, and guild offices are the weapons by which the republic turns movement into power.\n\nThe Tigarrian people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Novareno. The first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.79.a:0 "License the traders."

 war_unique_intro_events.80.t:0 "Harbor of Opportunity"
 war_unique_intro_events.80.d:0 "Portua's harbor is the kind of natural gift that becomes dangerous the moment other powers notice it. Deep water, busy markets, and skilled shipwrights promise wealth, but they also invite pirates, creditors, spies, and ambitious neighbors.\n\nThe Obregese people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Portua. The first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.80.a:0 "Guard the trade routes."

 war_unique_intro_events.81.t:0 "Frontier of Laon"
 war_unique_intro_events.81.d:0 "Laon stands where borders are less settled than maps pretend. Its fortresses are maintained because memory is practical here: raids, invasions, broken treaties, and sudden claims have taught the people that walls are cheaper than regret.\n\nThe Obregese people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Laon. Estalia's brighter cities may call Laon severe, but their markets depend on marches that hold. If the frontier collapses, trade routes become escape routes and noble pride becomes a refugee's complaint. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.81.a:0 "Maintain the fortresses."

 war_unique_intro_events.82.t:0 "Coastal Bastion"
 war_unique_intro_events.82.d:0 "Tartantia lives with the sea at its face and danger at its back. Its walls, docks, and watchtowers have grown together because trade without defense is only an invitation written in gold.\n\nThe Maggritan people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Tartantia. Estalia's coast is not a peaceful road. Pirates, ambitious princes, foreign traders, and private quarrels all move along it, each hoping to find one port distracted by another's troubles. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.82.a:0 "Tax the harbor."

 war_unique_intro_events.83.t:0 "Warlords of Irrana"
 war_unique_intro_events.83.d:0 "Irrana has been hardened by conflicts that rarely become clean enough for songs. Rival Estalian states, local strongmen, exhausted villages, and armed councils have all taught its people that survival belongs to those who can endure the next campaign.\n\nThe Irranan people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Irrana. The first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.83.a:0 "Endure the campaigns."

 war_unique_intro_events.84.t:0 "Families of Cantonia"
 war_unique_intro_events.84.d:0 "Cantonia is a republic of merchant families, civic pride, and careful arithmetic. Its rulers speak of public good, but every council chamber knows the public good often arrives carrying a private seal.\n\nThe Maggritan people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Cantonia. The first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.84.a:0 "Balance the ledgers."

 war_unique_intro_events.85.t:0 "Gateway of Zaraguz"
 war_unique_intro_events.85.d:0 "Zaraguz stands at a meeting of roads, markets, and ambitions. Goods cross its streets from inland routes and coastal networks alike, and every caravan that stops there leaves behind coin, rumor, and another reason for rivals to care who controls the city.\n\nThe Maggritan people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Zaraguz. Yet crossroads are never neutral for long. Foreign agents, competing Estalian powers, smugglers, and noble claimants all know that command of movement can become command of policy. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.85.a:0 "Watch the crossroads."

 war_unique_intro_events.86.t:0 "Ledgers of Verezzo"
 war_unique_intro_events.86.d:0 "Verezzo is a city where numbers are never merely numbers. Votes, debts, mercenary contracts, warehouse shares, and family obligations all move through ledgers that can raise armies more quietly than a trumpet.\n\nThe Reman people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Tilea, there is no passive frontier for Verezzo. Its rulers know Tilea's game well. A prince with no money is a decoration, a council with no soldiers is an argument, and a merchant with no friends is prey. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.86.a:0 "Count the votes."

 war_unique_intro_events.87.t:0 "Intrigues of Trantio"
 war_unique_intro_events.87.d:0 "Trantio is beautiful enough to make danger look civilized. Its palaces, salons, contracts, and noble houses turn politics into a game where every smile may be a bid, warning, or trap.\n\nThe Reman people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Tilea, there is no passive frontier for Trantio. Tilea rewards cunning, but cunning without structure becomes expensive chaos. A plot that wins a season can still lose a generation if the city forgets that government must do more than embarrass rivals. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.87.a:0 "Play the houses carefully."

 war_unique_intro_events.88.t:0 "Free Sails of Sartosa"
 war_unique_intro_events.88.d:0 "Sartosa is a harbor where law arrives late, armed, and usually negotiable. Pirates, exiles, merchants, smugglers, and Tilean opportunists crowd its quays, each insisting that freedom means their own knife should be respected first.\n\nThe Sartosan people move within the Tilean cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross Tilea, there is no passive frontier for Sartosa. Tilea's mainland cities call Sartosa a scandal when they are not quietly hiring its ships. The sea cares little for respectability, and the routes around the island are rich enough to forgive many sins if the coin reaches the right purse. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.88.a:0 "Let the black flags profit."

 war_unique_intro_events.89.t:0 "Poisoned Courts of Pavona"
 war_unique_intro_events.89.d:0 "Pavona understands that a small court can be more dangerous than a large army if every cup, marriage, compliment, and contract is placed correctly. Its politics are intimate, perfumed, and sharp.\n\nThe Umbrian people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Tilea, there is no passive frontier for Pavona. From Pavona, Pavona faces neighboring powers, old roads, and present crises that will decide whether this realm becomes a footnote, a shield, or the spark that changes the region around it. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.89.a:0 "Smile with a knife ready."

 war_unique_intro_events.90.t:0 "Rock of Tobaro"
 war_unique_intro_events.90.d:0 "Tobaro clings to stone and sea, a fortress-port that has learned to make geography into policy. Its walls look outward over routes that carry merchants, pirates, pilgrims, and enemies who would gladly own such a gate.\n\nThe Tobaran people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Tilea, there is no passive frontier for Tobaro. Tilea's quarrels are never far away, but Tobaro's position gives it choices denied to softer inland courts. It can bargain with ships, shelter behind walls, and punish those who confuse a small territory with a weak one. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.90.a:0 "Hold the sea gate."

 war_unique_intro_events.91.t:0 "Twins of Luccini"
 war_unique_intro_events.91.d:0 "Luccini lives beneath the shadow of founding legends, twin stories, old stones, and southern confidence. Myths are useful in Tilea, but only if they can be made to collect taxes, inspire soldiers, and settle arguments before rivals turn them into jokes.\n\nThe Luccian people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Tilea, there is no passive frontier for Luccini. Tilea's cities all claim inheritance from something older and grander. Luccini's task is to make its inheritance practical, to turn splendor into ships, reform, walls, and influence along the southern routes. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.91.a:0 "Make legend useful."

 war_unique_intro_events.92.t:0 "Canals of Miragliano"
 war_unique_intro_events.92.d:0 "Miragliano is a city of canals, engineers, bridges, and nervous vigilance. Water enriches it, protects it, and threatens to carry rot through it if the works are neglected for even a season.\n\nThe Miraglianese people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Tilea, there is no passive frontier for Miragliano. Tilea admires genius, but genius must be maintained. A clever design left unfunded becomes a monument to arrogance, and a city that believes itself too brilliant to fail has already begun doing so. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.92.a:0 "Drain the rot."

 war_unique_intro_events.93.t:0 "The Cities Remember Empire"
 war_unique_intro_events.93.d:0 "Tilea is a peninsula of brilliant cities, sharp knives, richer ledgers, and memories too large for any one republic to hold comfortably. Every street seems to know commerce, art, argument, and hired violence as old companions.\n\nThe Miraglianese people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nNo place within Tilea is passive. Yet the world is growing too dangerous for clever division alone. Chaos stirs, pirates circle, Bretonnia watches, and every mercenary captain knows a divided Tilea pays well because it bleeds often. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.93.a:0 "Dream in marble and coin."

 war_unique_intro_events.94.t:0 "Sunlit Ambition"
 war_unique_intro_events.94.d:0 "Estalia faces west, and the sea answers with rumors of distant coasts, strange goods, and fortunes large enough to make every court forget its caution. Its ports are crowded with sailors, merchants, priests, and visionaries who hear destiny in rigging.\n\nThe Maggritan people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nNo place within Estalia is passive. To the north, Bretonnia's knights may one day ride south in strength. To the east, Tilea's merchants and mercenaries compete for every contract. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.94.a:0 "Sail westward."

 war_unique_intro_events.95.t:0 "The Eagle Recast"
 war_unique_intro_events.95.d:0 "The Reman Empire is a memory with teeth. Its roads, laws, ruins, and borrowed titles still haunt the south, reminding every Tilean prince that the peninsula once spoke with a voice larger than any one city.\n\nThe Reman people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Estalia, there is no passive frontier for Reman Empire. The situation is glorious and skeptical, so we must raise the eagle again with laws behind it. If the Reman Empire can make roads safe, cities obedient, contracts reliable, and soldiers answer more than coin, the old dream may stop being nostalgia and start being government. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.95.a:0 "Raise the eagle again."

 war_unique_intro_events.96.t:0 "Castles above the Frontier"
 war_unique_intro_events.96.d:0 "Monte Castello looks down from hard roads and stone heights, close enough to Tilea to know its ambitions and close enough to the Borderlands to know how quickly ambition can become banditry. Its castles are not decoration; they are policy in masonry.\n\nThe Luccian people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross the Borderlands, there is no passive frontier for Monte Castello. Tilean wealth and frontier danger meet here in uncomfortable partnership. Merchants want roads open, soldiers want supplies, and local lords want every toll to prove that their authority is real. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.96.a:0 "Hold the high roads."

 war_unique_intro_events.97.t:0 "Small Port, Wide Sea"
 war_unique_intro_events.97.d:0 "Sitges is not Estalia's loudest harbor, but small ports can hear things great cities miss. Every quay, storehouse, and fishing boat sits within reach of wider currents, and every visiting merchant brings a map of someone else's opportunity.\n\nThe Maggritan people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Tilea, there is no passive frontier for Sitges. The first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.97.a:0 "Turn the quay outward."

 war_unique_intro_events.98.t:0 "Forges of Nuln"
 war_unique_intro_events.98.d:0 "Nuln is smoke, scholarship, black powder, and courtly danger wrapped around the Reik. Its foundries and Gunnery School make the city invaluable to the Empire, which is precisely why every faction wants a hand on its artillery.\n\nThe Wissenlander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the South Empire Provinces, there is no passive frontier for Nuln. From Nuln, Nuln faces neighboring powers, old roads, and present crises that will decide whether this realm becomes a footnote, a shield, or the spark that changes the region around it. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.98.a:0 "Load the guns."

 war_unique_intro_events.99.t:0 "Argalis at the Edge"
 war_unique_intro_events.99.d:0 "Argalis carries Estalian habits into a harsher country, where charters, merchant custom, and noble pride must share roads with sellswords, exiles, and sudden violence. The Borderlands respect paperwork only when it arrives with guards.\n\nThe Obregese people move within the Estalian cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross the Borderlands, there is no passive frontier for Argalis. The situation is commercial and dangerous, so we must keep the southern charters alive. If Argalis balances Estalian order with frontier caution, it can make the border a market instead of a wound. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.99.a:0 "Keep the southern charters."

 war_unique_intro_events.100.t:0 "Vows beyond Bretonnia"
 war_unique_intro_events.100.d:0 "Vardanos carries Bretonnian faith into lands where the old duchies feel distant and every neighbor has learned a different rule for survival. The Lady's name still commands reverence, but reverence must travel armed here.\n\nThe Couronnien people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross the Borderlands, there is no passive frontier for Vardanos. The situation is faithful and exposed, so we must carry the Lady south with discipline. If Vardanos makes vows protect caravans, chapels, and villages alike, it can prove Bretonnian honor need not end at Bretonnia's borders. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.100.a:0 "Carry the Lady south."

 war_unique_intro_events.101.t:0 "Brovska's Harsh Compact"
 war_unique_intro_events.101.d:0 "Brovska sits where Wastelander habits meet frontier necessity. Its people understand bargains, tolls, marshy suspicion, and the value of keeping one more road open than rivals expect.\n\nThe Wastelander people move within the Imperial cultural world, and public life is shaped by Taalite rites in court, shrine, camp, and market. Taalite custom binds field, forest, river, and crown into a rough covenant with the living land.\n\nAcross the Borderlands, there is no passive frontier for Brovska. The realm cannot rely on the security of old Imperial institutions. Merchants want predictable law, settlers want walls, captains want pay, and neighbors want any excuse to turn border confusion into profit. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.101.a:0 "Hold the frontier bargain."

 war_unique_intro_events.102.t:0 "Pass at Akendorf"
 war_unique_intro_events.102.d:0 "Akendorf watches roads under the Black Mountains, where every pass is a promise to friends and an invitation to enemies. Its people know that geography does not defend itself; men must stand where the map narrows.\n\nThe Sudenlander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the Borderlands, there is no passive frontier for Akendorf. Greenskins, bandits, ambitious princes, and darker things all understand the value of movement through these lands. Whoever commands the roads can tax, raid, shelter, or starve the country around them. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.102.a:0 "Guard the Black Mountains."

 war_unique_intro_events.103.t:0 "The Necromancer's Schloss"
 war_unique_intro_events.103.d:0 "Masserschloss is a closed door in a frightened land. Behind its walls, Bragthorn the Necromancer gathers servants, secrets, and dead obedience, making silence do the work that proclamations would only endanger.\n\nThe Nordlander people move within the Imperial cultural world, and public life is shaped by Nagashite devotion in court, shrine, camp, and market. Nagashite devotion treats death as law and memory as command, making the living merely one resource among many.\n\nAcross the Borderlands, there is no passive frontier for Masserschloss. The living around the fortress whisper of vanished travelers, pale lights, and orders carried out by men who do not breathe. Such fear is useful, but fear alone cannot build a realm. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!"
 war_unique_intro_events.103.a:0 "Bar the doors before dusk."

 war_unique_intro_events.104.t:0 "Waldovia between Shadows"
 war_unique_intro_events.104.d:0 "Waldovia lives with Sylvanian memory close enough to feel like weather. Its valleys, villages, and minor courts know the old stories of night rulers, vanished heirs, and bargains that should never have been made after sunset.\n\nThe Sylvanian people move within the Imperial cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the Borderlands, there is no passive frontier for Waldovia. Yet Waldovia is not merely a haunted footnote. It is a living frontier of fields, roads, local loyalties, and cautious nobles who must prove that old-world cults and Imperial habits can still command trust in a land trained to doubt promises. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.104.a:0 "Keep the valleys loyal."

 war_unique_intro_events.105.t:0 "Molachia's Cold Road"
 war_unique_intro_events.105.d:0 "Molachia carries Kislevite endurance far from Kislev's heart, where cold customs, frontier suspicion, and the worship of Ursun must survive among southern roads and stranger neighbors. It is a hard inheritance in a hard place.\n\nThe Pogranicznik people move within the Kislevite cultural world, and public life is shaped by devotion to Ursun in court, shrine, camp, and market. Ursun gives endurance a sacred shape, asking the faithful to survive winter, invasion, and doubt without surrendering their heart.\n\nAcross the Borderlands, there is no passive frontier for Molachia. The people understand that identity can freeze or melt depending on how it is guarded. Boyar habits, caravan needs, local fortresses, and border marriages all pull the realm in different directions, while enemies care little which tradition dies first. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.105.a:0 "Endure between worlds."

 war_unique_intro_events.106.t:0 "Feathers over the Frontier"
 war_unique_intro_events.106.d:0 "The Eagle Confederacy is built from free towns, hard bargains, local pride, and the belief that no single petty crown should be allowed to sell the frontier's future. Confederation is a promise, but promises need soldiers and tax collectors.\n\nThe Reiklander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the Borderlands, there is no passive frontier for Eagle Confederacy. Imperial habits give the Confederacy a language of law and burgher duty, but the Borderlands give it neighbors who prefer simpler grammar: coin, threat, and opportunity. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.106.a:0 "Bind the free towns."

 war_unique_intro_events.107.t:0 "Norsemen of Khypris"
 war_unique_intro_events.107.d:0 "Khypris is far from Norsca's frozen coasts, but distance has not softened the men who carried northern habits south. Their halls stand near river roads and frontier markets, where a longship's old logic must learn new terrain.\n\nThe Graeling people move within the Norscan cultural world, and public life is shaped by the old northern gods in court, shrine, camp, and market. The old northern gods reward raid, oath, storm, and boast, and their favor belongs to those who return with proof.\n\nAcross the Borderlands, there is no passive frontier for Khypris. The situation is displaced and hungry, so we must make the river road bleed. If Khypris turns Norse ferocity toward frontier command, it can become a new kind of raider kingdom, one that strikes from roads as surely as from surf. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.107.a:0 "Make the river road bleed."

 war_unique_intro_events.108.t:0 "Lietpold's Hard Crown"
 war_unique_intro_events.108.d:0 "Lietpoldia is the dream of one hard crown set among marches that rarely respect crowns for long. Mercenary camps, toll roads, fortified towns, and nervous settlers all ask the same question in different accents: who can make order pay?\n\nThe Reiklander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the Borderlands, there is no passive frontier for Lietpoldia. Imperial traditions offer a model of law, but the frontier strips law down to its working parts. If courts cannot protect roads, roads will find other masters. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.108.a:0 "Rule the unruly marches."

 war_unique_intro_events.109.t:0 "The Barrow Lord's Host"
 war_unique_intro_events.109.d:0 "The Barrow Legion rises from graves that should have stayed quiet. Heinrich Kemmler, the Lichemaster, knows that a battlefield does not end when the living flee; it merely becomes a storehouse for future obedience.\n\nThe Bourgonian people move within the Bretonnian cultural world, and public life is shaped by Nagashite devotion in court, shrine, camp, and market. Nagashite devotion treats death as law and memory as command, making the living merely one resource among many.\n\nAcross Bretonnia, there is no passive frontier for Barrow Legion. The situation is grave-cold and ambitious, so we must wake the barrows with purpose. If Kemmler binds corpses, curses, and mountain passes into one host, the living realms nearby will learn that history has claws. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!"
 war_unique_intro_events.109.a:0 "Wake the barrows."

 war_unique_intro_events.110.t:0 "Scarosio's Errant Vows"
 war_unique_intro_events.110.d:0 "Scarosio carries Bretonnian manners into a land where every road offers a different price for loyalty. The Lady's blessing still matters, but on the frontier a vow must be able to ride, judge, bargain, and bleed.\n\nThe Marcheur people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross the Borderlands, there is no passive frontier for Scarosio. The danger is not only open corruption. It is the slow convenience of becoming just another Border Prince realm with prettier prayers and better horses. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.110.a:0 "Keep faith beyond Bretonnia."

 war_unique_intro_events.111.t:0 "Blood Keep's Red Vow"
 war_unique_intro_events.111.d:0 "The Ordo Draconis rides from the shadow of the Blood Keep, where chivalry has been drained, preserved, and given fangs. Walach Harkon commands knights who remember honor but no longer belong to mercy.\n\nThe Sylvanian people move within the Imperial cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross Bretonnia, there is no passive frontier for Ordo Draconis. The living realms nearby will call them abominations, yet many will still envy their order. The Ordo must exploit that contradiction, offering protection, terror, and the promise that obedience can survive death. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!"
 war_unique_intro_events.111.a:0 "Ride beneath the red keep."

 war_unique_intro_events.112.t:0 "The Princes' Confederacy"
 war_unique_intro_events.112.d:0 "The Border Princes Confederacy is an argument pretending to be a realm, which is still more order than the region usually permits. Exiles, mercenary captains, petty nobles, traders, priests, and adventurers all bring their own law and call the pile opportunity.\n\nThe Reiklander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the Borderlands, there is no passive frontier for Border Princes Confederacy. The situation is unruly and valuable, so we must bind the quarrels without pretending they are gone. If the princes can cooperate long enough to command the roads between Empire, Badlands, Tilea, and the mountains, the frontier may become a power rather than a prize. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.112.a:0 "Bind the quarrels."

 war_unique_intro_events.113.t:0 "Bears of the North"
 war_unique_intro_events.113.d:0 "The Baersonling respect strength because strength is the only law the north enforces consistently. Their halls teach that a leader who cannot win, feed, and frighten will soon be replaced by someone with better scars.\n\nThe Baersonling people move within the Norscan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Norsca, there is no passive frontier for Baersonling. Norsca is crowded with proud names. A tribe that wishes to be remembered must do more than survive; it must make survival look like destiny to those who might otherwise follow a louder banner. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.113.a:0 "Let strength decide."

 war_unique_intro_events.114.t:0 "Giants' Shadow over Goromadny"
 war_unique_intro_events.114.d:0 "Goromadny lies beneath mountains and legends too large for ordinary rulers. Giants, harsh paths, hungry weather, and old Norscan pride shape a people used to measuring themselves against things that could crush them without noticing.\n\nThe Baersonling people move within the Norscan cultural world, and public life is shaped by the old northern gods in court, shrine, camp, and market. The old northern gods reward raid, oath, storm, and boast, and their favor belongs to those who return with proof.\n\nAcross Norsca, there is no passive frontier for Goromadny. The south may barely know the name, but the north respects places that harden men. Goromadny must turn remoteness into identity before rivals treat it as weakness. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.114.a:0 "Raid beneath the giant's shadow."

 war_unique_intro_events.115.t:0 "Hammers of the Cult"
 war_unique_intro_events.115.d:0 "The Cult of Sigmar is faith with a hammer in its hand. It preaches unity, discipline, vigilance, and the old promise that mankind can stand against darkness if it remembers what Sigmar demanded of it.\n\nThe Altdorfer people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the South Empire Provinces, there is no passive frontier for Cult of Sigmar. The Empire needs Sigmar's cult, but it also fears what happens when any sacred institution decides it alone can define loyalty. Zeal can save provinces from corruption, or it can turn every dispute into a pyre waiting for tinder. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.115.a:0 "Preach with hammer and law."

 war_unique_intro_events.116.t:0 "Altdorf's Many Thrones"
 war_unique_intro_events.116.d:0 "Altdorf is the Empire gathered into one city and then made to argue with itself. Imperial offices, guild halls, temples, colleges, merchants, soldiers, and river traffic all crowd the capital with interests too important to ignore.\n\nThe Altdorfer people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the South Empire Provinces, there is no passive frontier for Altdorf. To rule Altdorf is to manage proximity. Power is useful because it is near, and perilous for the same reason. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.116.a:0 "Keep the capital awake."

 war_unique_intro_events.117.t:0 "The White Wolf's Fire"
 war_unique_intro_events.117.d:0 "The Cult of Ulric speaks in winter breath, wolf-hide, iron, and contempt for softness. Its holy city and its priests remember a world before Sigmar's empire, and they do not intend to become a footnote in another god's triumph.\n\nThe Middenheimer people move within the Imperial cultural world, and public life is shaped by Ulrican faith in court, shrine, camp, and market. Ulrican faith prizes winter courage, hard judgment, and the honor of standing firm when comfort fails.\n\nAcross the North Empire Provinces, there is no passive frontier for Cult of Ulric. The Empire needs the White Wolf's fire, especially when northern threats gather and Reikland's politics feel too smooth to be trusted. But pride between cults can wound the realm before any enemy crosses the border. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.117.a:0 "Let winter judge."

 war_unique_intro_events.118.t:0 "The Eye of the Forest"
 war_unique_intro_events.118.d:0 "Talabheim sits within the vast crater called the Eye of the Forest, a city that looks protected by nature and therefore must work twice as hard not to become complacent. Walls, gates, roads, and woods all shape its fate.\n\nThe Talabheimer people move within the Imperial cultural world, and public life is shaped by Taalite rites in court, shrine, camp, and market. Taalite custom binds field, forest, river, and crown into a rough covenant with the living land.\n\nAcross the Central Empire Provinces, there is no passive frontier for Talabheim. Talabecland's wider pride pulls at Talabheim, while Imperial politics remind every city that autonomy survives only if it proves useful. A crater city that cannot command its roads becomes a beautiful trap. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.118.a:0 "Guard the crater city."

 war_unique_intro_events.119.t:0 "Red Walls of Carroburg"
 war_unique_intro_events.119.d:0 "Carroburg's name carries the memory of a famous stand, red walls, stubborn soldiers, and the grim pride of men who learned that discipline can outlive terror. Memory is useful here because it drills as much as it inspires.\n\nThe Drakwalder people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the North Empire Provinces, there is no passive frontier for Carroburg. Drakwald's shadows, Middenland's pride, Reikland's pull, and northern danger all press around Carroburg. A city between powers must either become necessary or become negotiable. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.119.a:0 "Drill behind the walls."

 war_unique_intro_events.120.t:0 "Drakwald's Lost Crown"
 war_unique_intro_events.120.d:0 "Drakwald is a name full of loss. Forests, beast-haunted roads, ruined claims, and old provincial pride linger where authority has too often failed to hold the dark back long enough for maps to matter.\n\nThe Drakwalder people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the North Empire Provinces, there is no passive frontier for Drakwald. The people need more than nostalgia. They need patrols that return, roads that stay open, lords who can cooperate, and villages that trust banners because the banners arrive before the fires do. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.120.a:0 "Take back the woods."

 war_unique_intro_events.121.t:0 "Salt and Timber"
 war_unique_intro_events.121.d:0 "Nordenmark is a northern place of salt wind, timber, coastal trade, and local privilege. Its towns and forests know that the Sea of Claws brings livelihoods and enemies with the same weather.\n\nThe Nordlander people move within the Imperial cultural world, and public life is shaped by Ulrican faith in court, shrine, camp, and market. Ulrican faith prizes winter courage, hard judgment, and the honor of standing firm when comfort fails.\n\nAcross the North Empire Provinces, there is no passive frontier for Nordenmark. The situation is maritime and provincial, so we must watch the Sea of Claws while keeping the timber roads guarded. If Nordenmark binds harbor, forest, militia, and market together, it can become a hard northern plank in the Empire's shield. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.121.a:0 "Watch the Sea of Claws."

 war_unique_intro_events.122.t:0 "The Blazing Sun Rides"
 war_unique_intro_events.122.d:0 "The Order of the Blazing Sun serves Myrmidia beneath Imperial skies, carrying southern discipline, tactical faith, and knightly pride into a realm more used to Sigmar's hammer and Ulric's wolf.\n\nThe Reiklander people move within the Imperial cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross Norsca, there is no passive frontier for Order of Blazing Sun. The order stands at a useful crossing of worlds. Estalian and Tilean traditions give it perspective, while Imperial service gives it purpose in wars that rarely reward narrow thinking. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.122.a:0 "Serve Myrmidia with steel."

 war_unique_intro_events.123.t:0 "The North Made One"
 war_unique_intro_events.123.d:0 "Norsca is a hard name for a harder dream: many tribes, many gods, many grudges, and one frozen land that has never needed permission to terrify the south. To make it one realm is to command storms without pretending they are tame.\n\nThe Bjornling people move within the Norscan cultural world, and public life is shaped by the old northern gods in court, shrine, camp, and market. The old northern gods reward raid, oath, storm, and boast, and their favor belongs to those who return with proof.\n\nNo place within Norsca is passive. The south will call a united Norsca a disaster, and for once the south will be correct. Longships, warbands, mountain paths, and god-marked champions under one crown could make every coast and border feel suddenly closer to ruin. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.123.a:0 "Crown the raiders."

 war_unique_intro_events.124.t:0 "Myrmidia's Chosen City"
 war_unique_intro_events.124.d:0 "The Myrmidens place Myrmidia's wisdom at the center of public life, treating strategy as devotion and discipline as a kind of prayer. In the south, where coin and pride often command more quickly than doctrine, that gives them a dangerous clarity.\n\nThe Luccian people move within the Tilean cultural world, and public life is shaped by Myrmidian discipline in court, shrine, camp, and market. Myrmidia teaches discipline, strategy, and civic honor, turning ambition into ordered force rather than mere appetite.\n\nAcross the Borderlands, there is no passive frontier for Myrmidens. Tilea and Estalia both know Myrmidia's name, but the Myrmidens must make reverence practical. A temple that cannot protect roads, regulate trade, or guide soldiers is only an expensive monument. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.124.a:0 "Let strategy guide zeal."

 war_unique_intro_events.125.t:0 "The Black Prince"
 war_unique_intro_events.125.d:0 "Gashnagia survives beneath the strange romance of the Black Prince. Gashnag's subjects whisper that their lord is cursed, tragic, protective, monstrous, noble, or all of these at once.\n\nThe Strigany people move within the Strigany cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Borderlands, there is no passive frontier for Gashnagia. The Border Princes are full of predators, but few understand theater as well as Gashnag. Wolves, ghouls, agents, grateful peasants, and terrified neighbors all form the outer rings of a court built around one carefully managed secret. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!"
 war_unique_intro_events.125.a:0 "Keep the curse courtly."

 war_unique_intro_events.126.t:0 "Lonely Fires of Mortensholm"
 war_unique_intro_events.126.d:0 "Mortensholm is a frontier of remote homesteads, stockades, watchposts, furs, timber, iron, and stubborn people who have learned that help from greater powers often arrives after the burial work is done.\n\nThe Middenlander people move within the Imperial cultural world, and public life is shaped by Ulrican faith in court, shrine, camp, and market. Ulrican faith prizes winter courage, hard judgment, and the honor of standing firm when comfort fails.\n\nAcross the Borderlands, there is no passive frontier for Mortensholm. From Mortensholm, Mortensholm faces neighboring powers, old roads, and present crises that will decide whether this realm becomes a footnote, a shield, or the spark that changes the region around it. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.126.a:0 "Keep the watchfires lit."

 war_unique_intro_events.127.t:0 "Crossroads of Lakoras"
 war_unique_intro_events.127.d:0 "Lakoras sits where caravans from Tilea, the Empire, Araby, and the Border Princes meet long enough to bargain, hire guards, exchange rumors, and wonder who will betray whom before the next pass.\n\nThe Marcheur people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross the Borderlands, there is no passive frontier for Lakoras. The danger is moral and practical at once. Too much chivalric disdain for trade leaves the roads to thieves; too much love of coin turns every vow into a line item. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.127.a:0 "Guard every caravan."

 war_unique_intro_events.128.t:0 "Faith on the Frontier"
 war_unique_intro_events.128.d:0 "Fatindarid carries the One Faith into a harsh frontier of caravan roads, desert memory, and competing laws. Its rulers understand that belief can make order where bloodline and custom would only multiply quarrels.\n\nThe Scythan people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross the Borderlands, there is no passive frontier for Fatindarid. The situation is devout and mobile, so we must carry the light through dust. If Fatindarid binds caravan wealth to religious authority, it can become more than another southern border state. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.128.a:0 "Carry the light through dust."

 war_unique_intro_events.129.t:0 "Paid in Blood and Gold"
 war_unique_intro_events.129.d:0 "The Grudgebringers are mercenaries, but not the disposable kind. Morgan Bernhardt's company carries a reputation built from hard contracts, darker wars, and the knowledge that some employers need reliable soldiers more than they need flattering courtiers.\n\nThe Reiklander people move within the Imperial cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the Borderlands, there is no passive frontier for Grudgebringers. A mercenary company must be more than brave. It must be trusted enough to hire, feared enough to respect, and organized enough to survive after the easy coin has already fled the field. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.129.a:0 "Honor the contract."

 war_unique_intro_events.130.t:0 "Schaffenfest Shadows"
 war_unique_intro_events.130.d:0 "Bogenhafen is prosperous enough to attract merchants from across the Empire and careless enough, if left unwatched, to attract things that prefer prosperity with locked doors. The Schaffenfest proves both truths.\n\nThe Reiklander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the South Empire Provinces, there is no passive frontier for Bogenhafen. Merchant houses, guild factors, festival crowds, and river trade make the city rich. They also create places for influence to hide. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.130.a:0 "Let trade see daylight."

 war_unique_intro_events.131.t:0 "Black Rock Crossing"
 war_unique_intro_events.131.d:0 "Ubersreik controls the Black Rock crossing over the Teufel, and a river crossing is never merely a convenience. It is toll, garrison, market, invasion route, and political grievance gathered under one set of walls.\n\nThe Reiklander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the South Empire Provinces, there is no passive frontier for Ubersreik. The situation is strategic and unsettled, so we must hold the Teufel crossing with firmness and tact. If Ubersreik binds garrison, tolls, and civic loyalty together, it can guard Reikland's road instead of becoming its open wound. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.131.a:0 "Hold the Teufel crossing."

 war_unique_intro_events.132.t:0 "Rights of Kemperbad"
 war_unique_intro_events.132.d:0 "Kemperbad's city rights are more than ceremonial privileges. They are shields for guilds, workshops, river merchants, and burghers who know that autonomy survives only when it is defended in law, coin, and stone.\n\nThe Reiklander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the Central Empire Provinces, there is no passive frontier for Kemperbad. The city thrives on waterways and industry. Goods move through its docks, craftsmen fill its streets with value, and civic officials keep order because disorder is expensive before it is anything else. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.132.a:0 "Defend the city rights."

 war_unique_intro_events.133.t:0 "The Realm of the Lady"
 war_unique_intro_events.133.d:0 "Bretonnia is a realm of dukes, vows, Grail legends, hungry peasants, proud horses, and shining ideals that must survive contact with a darkening world. Its songs are beautiful because the duties beneath them are so severe.\n\nThe Couronnien people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross the South Empire Provinces, there is no passive frontier for Bretonnia. The situation is glorious and strained, so we must ride as one realm. If Bretonnia makes its dukes answer sacred duty, its knights defend more than reputation, and its peasants see protection rather than poetry, the Lady's kingdom may yet deserve its own legends. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.133.a:0 "Ride as one realm."

 war_unique_intro_events.134.t:0 "Faith, Steel, and Gunpowder"
 war_unique_intro_events.134.d:0 "The Empire is mankind's great quarrel against the dark: Elector Counts, free cities, cults, colleges, guilds, soldiers, engineers, and stubborn villages bound together by history, fear, ambition, and the memory of Sigmar.\n\nThe Reiklander people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the South Empire Provinces, there is no passive frontier for The Empire. Yet no other human realm carries the same possibility. Nuln's guns, Altdorf's colleges, Middenheim's winter faith, Talabheim's forest roads, Reikland's imperial claim, and the courage of countless ordinary towns can become one shield if they are made to serve something larger than local advantage. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.134.a:0 "Make the Empire worthy."

 war_unique_intro_events.135.t:0 "The Northern Oath-Hold"
 war_unique_intro_events.135.d:0 "For Kraka Dorden, the age begins in danger. Kraka Dorden is a northern hold of old stone, hard ale, oath-rings, and clan memories that have grown sharper under frozen skies.\n\nThe Norse Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Jotunheim-Gianthome Mountains, there is no passive frontier for Kraka Dorden. The southern Karaks are distant, the roads are unreliable, and every raider who crosses the snow believes a lonely hold must be easier prey. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.135.a:0 "Mark the northern grudges."

 war_unique_intro_events.136.t:0 "Sea Gates of the Norse Dawi"
 war_unique_intro_events.136.d:0 "For Kraka Ravnsvake, the age begins in danger. Kraka Ravnsvake watches cold waters where longships, traders, monsters, and worse omens pass too close to Dawi doors.\n\nThe Norse Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Jotunheim-Gianthome Mountains, there is no passive frontier for Kraka Ravnsvake. The sea offers iron, news, and enemies in the same grey tide, and a hold that cannot command its harbor will soon be commanded by raiders. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.136.a:0 "Bar the sea gates."

 war_unique_intro_events.137.t:0 "Runes Under the Black Sky"
 war_unique_intro_events.137.d:0 "For Kraka Ornsmotek, the age begins in danger. Kraka Ornsmotek is a hold of shrine-fires, careful miners, and runesmiths who measure each winter by what it failed to break.\n\nThe Norse Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Jotunheim-Gianthome Mountains, there is no passive frontier for Kraka Ornsmotek. Norscan pressure, poor roads, and the long shadow of Chaos make every tool, tunnel, and oath matter more than southern cousins might understand. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.137.a:0 "Keep the runes burning."

 war_unique_intro_events.138.t:0 "Lead Citadel in the Mist"
 war_unique_intro_events.138.d:0 "For Shadow Clan, the age begins in danger. The Shadow Clan broods around the Citadel of Lead, where mist gathers like a kept secret and old Albion rites have learned darker names.\n\nThe Albionise people move within the Albionise cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Albion, there is no passive frontier for Shadow Clan. Albion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.138.a:0 "Bind the shadow to the stones."

 war_unique_intro_events.139.t:0 "Last Shore of the Losteriklings"
 war_unique_intro_events.139.d:0 "For Losteriklings, the age begins in danger. The Losteriklings cling to a storm-beaten shore where Norscan oaths meet Albion fog and neither land nor sea offers a gentle welcome.\n\nThe Skaeling people move within the Norscan cultural world, and public life is shaped by the old northern gods in court, shrine, camp, and market. The old northern gods reward raid, oath, storm, and boast, and their favor belongs to those who return with proof.\n\nAcross Albion, there is no passive frontier for Losteriklings. Albion tribes know the marsh paths, druids know the old stones, and every rival jarl expects the colony to fail before it can become a saga. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.139.a:0 "Launch the longships."

 war_unique_intro_events.140.t:0 "The Great Ogham Wakes"
 war_unique_intro_events.140.d:0 "For Truthsayers, the age begins in danger. The Truthsayers stand nearest the Great Ogham, where the island speaks through weathered stone, sacred groves, and warnings that do not always arrive as words.\n\nThe Albionise people move within the Albionise cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nAcross Albion, there is no passive frontier for Truthsayers. Foreign sails, Dark Emissaries, Fimir hunger, and quarrelsome clans all pull at Albion while the druids argue over which prophecy is mercy and which is bait. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.140.a:0 "Let the stones answer."

 war_unique_intro_events.141.t:0 "Hillfires of the Belenii"
 war_unique_intro_events.141.d:0 "For Belenii, the age begins in danger. The Belenii hold hills where watchfires vanish into mist and every family remembers which path a stranger should never take twice.\n\nThe Albionise people move within the Albionise cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nAcross Albion, there is no passive frontier for Belenii. Albion is no longer hidden enough for disunity to be harmless; merchants, raiders, cults, and hungry neighbors can find a divided clanland easily. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.141.a:0 "Gather the hillfires."

 war_unique_intro_events.142.t:0 "Marsh Paths of the Boreni"
 war_unique_intro_events.142.d:0 "For Boreni, the age begins in danger. The Boreni know the wet ground, reed-choked crossings, and half-drowned shrines that outsiders mistake for empty country until the fog begins to move.\n\nThe Albionise people move within the Albionise cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nAcross Albion, there is no passive frontier for Boreni. Albion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.142.a:0 "Claim the marsh paths."

 war_unique_intro_events.143.t:0 "Mist-Hags of the Fens"
 war_unique_intro_events.143.d:0 "For Fir Cichol, the age begins in danger. The Fir Cichol remember when the Fimir were feared in Albion, not merely glimpsed at the edge of marshes and blamed for disappearances.\n\nThe Fimir people move within the Fimir cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Albion, there is no passive frontier for Fir Cichol. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.143.a:0 "Let the mist take them."

 war_unique_intro_events.144.t:0 "Spears of the Toulenii"
 war_unique_intro_events.144.d:0 "For Toulenii, the age begins in danger. The Toulenii keep a rough dignity among rain-black fields, cattle paths, and stone circles whose meanings are argued over beside every council fire.\n\nThe Albionise people move within the Albionise cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nAcross Albion, there is no passive frontier for Toulenii. Albion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.144.a:0 "Raise the island spears."

 war_unique_intro_events.145.t:0 "The Island Remembers"
 war_unique_intro_events.145.d:0 "For Albion, the age begins in danger. Albion is more than a fogbound island at the edge of foreign maps.\n\nThe Albionise people move within the Albionise cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nNo place within Albion is passive. Albion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.145.a:0 "Wake the island realm."

 war_unique_intro_events.146.t:0 "Sea-Gate of the Karaz Ankor"
 war_unique_intro_events.146.d:0 "For Barak Varr, the age begins in danger. Barak Varr is the rare Dawi hold that hears waves as often as hammers, a sea-gate where clan ledgers and cannon ports face the same horizon.\n\nThe Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Borderlands, there is no passive frontier for Barak Varr. Merchants bring profit and insult in equal measure, while Greenskins, pirates, Tileans, and ambitious princes all learn that sea access is worth bleeding for. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.146.a:0 "Hold the sea-gate."

 war_unique_intro_events.147.t:0 "Scythan Dragon Rites"
 war_unique_intro_events.147.d:0 "For Drakk, the age begins in danger. Drakk follows dragon rites far from the blessed isles, where Scythan horsemen, fire-priests, and hard caravan families have made reverence portable.\n\nThe Scythan people move within the Arabyans cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Borderlands, there is no passive frontier for Drakk. The desert and frontier roads teach practical faith. Wells, caravans, judges, soldiers, and shrine-fires must work together, because revelation that cannot guard a road will soon be mocked by bandits and bought by richer men. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.147.a:0 "Feed the dragon fires."

 war_unique_intro_events.148.t:0 "Light at the Crossroads"
 war_unique_intro_events.148.d:0 "The G.R.C. must carry the One Faith through trade roads, frontier courts, and dangerous neighbors. One Faith/Solar Mandate Araby.\n\nThe Medean people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross the Gulf of Medes, there is no passive frontier for G.R.C. From Zafar Oasis, G.R.C. faces neighboring powers, old roads, and present crises that will decide whether this realm becomes a footnote, a shield, or a spark. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.148.a:0 "Carry the light through trade."

 war_unique_intro_events.149.t:0 "The Greybeards' Ledger"
 war_unique_intro_events.149.d:0 "For Greybeards, the age begins in danger. The Greybeards are not named for weakness.\n\nThe Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross Araby, there is no passive frontier for Greybeards. The first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.149.a:0 "Enter every debt."

 war_unique_intro_events.150.t:0 "The Pit-Forges of Gorgoth"
 war_unique_intro_events.150.d:0 "For Gorgoth, the age begins in danger. Gorgoth is a mouth in the Dark Lands, swallowing captives, ore, coal, and pain until the pit-forges cough out weapons worthy of Hashut.\n\nThe Dawi Zharr people move within the Chaos Dwarf cultural world, and public life is shaped by Hashut in court, shrine, camp, and market. Hashut demands fire, tyranny, and useful cruelty, turning industry and obedience into sacred acts.\n\nAcross the Southern Wastes, there is no passive frontier for Gorgoth. The first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.150.a:0 "Drive the pit-forges harder."

 war_unique_intro_events.151.t:0 "Everything at Pigbarter"
 war_unique_intro_events.151.d:0 "For Pigbarter, the age begins in danger. Pigbarter squats in smoke and mud where the River Ruin carries pigs, spice, iron, gossip, and bad decisions to the same stinking docks.\n\nThe Pigbarterite people move within the Darklands Human cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross Gnoblar Country, there is no passive frontier for Pigbarter. The Dark Lands do not reward purity. They reward useful hands, sharp guards, flexible morals, and the good sense to make danger pay rent. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.151.a:0 "Settle every price."

 war_unique_intro_events.152.t:0 "Ash Roads of Azgorh"
 war_unique_intro_events.152.d:0 "For Legion of Azgorh, the age begins in danger. The Legion of Azgorh marches from ash-choked roads with engines, masks, and grudges that have been hammered flat into discipline.\n\nThe Dawi Zharr people move within the Chaos Dwarf cultural world, and public life is shaped by Hashut in court, shrine, camp, and market. Hashut demands fire, tyranny, and useful cruelty, turning industry and obedience into sacred acts.\n\nAcross the Southern Wastes, there is no passive frontier for Azgorh. Distance from Zharr-Naggrund does not make them free of Hashut; it makes every victory a proof that even exile can be industrialized. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.152.a:0 "March through ash."

 war_unique_intro_events.153.t:0 "The Southern Chain"
 war_unique_intro_events.153.d:0 "For Darkhold, the age begins in danger. Darkhold grips the edge of the Dark Lands like a hook in meat, watching roads where slaves, raiders, and envoys all arrive under suspicion.\n\nThe Dawi Zharr people move within the Chaos Dwarf cultural world, and public life is shaped by Hashut in court, shrine, camp, and market. Hashut demands fire, tyranny, and useful cruelty, turning industry and obedience into sacred acts.\n\nAcross the Southern Wastes, there is no passive frontier for Darkhold. The situation is unstable and full of opportunity, so we must tighten the southern chain until every road pulls toward Hashut. If strength can be bound to action, early danger may become the foundation of something harder to dismiss. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.153.a:0 "Tighten the southern chain."

 war_unique_intro_events.154.t:0 "The First Bite"
 war_unique_intro_events.154.d:0 "For Eyebiter, the age begins in danger. Eyebiter knows that an Ogre name is a promise.\n\nThe Redmaw Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Southern Wastes, there is no passive frontier for Eyebiter. The passes are full of caravans, rivals, and little kingdoms that think walls make them less edible than meat left under a cloth. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.154.a:0 "Take the first bite."

 war_unique_intro_events.155.t:0 "Red Maw's Tribute"
 war_unique_intro_events.155.d:0 "For Red Maw, the age begins in danger. Red Maw is hunger with banners, a kingdom where chiefs, butchers, bruisers, and frightened toll-payers all understand that tribute is just food with better bookkeeping.\n\nThe Redmaw Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Blasted Wastes, there is no passive frontier for Redmaw. The first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.155.a:0 "Fill the red maw."

 war_unique_intro_events.156.t:0 "Horns at the Furnace Gate"
 war_unique_intro_events.156.d:0 "For Horns of Hashut, the age begins in danger. The Horns of Hashut are a warning blast from the furnace gate, half army and half sermon, carrying the Father of Darkness into lands not yet properly afraid.\n\nThe Dawi Zharr people move within the Chaos Dwarf cultural world, and public life is shaped by Hashut in court, shrine, camp, and market. Hashut demands fire, tyranny, and useful cruelty, turning industry and obedience into sacred acts.\n\nAcross the Blasted Wastes, there is no passive frontier for Horns of Hashut. They stand among peoples who know Chaos but not discipline, cruelty but not industry, and sacrifice but not the profitable arrangement of chains. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.156.a:0 "Sound Hashut's horns."

 war_unique_intro_events.157.t:0 "The Ghoul King's Shadow"
 war_unique_intro_events.157.d:0 "For Vorag, the age begins in danger. Vorag remembers dominion as hunger remembers meat.\n\nThe Strigany people move within the Strigany cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Southern Wastes, there is no passive frontier for Vorag. Greenskins crowd the wastes, humans tell themselves the old vampire kings are gone, and rival undead would rather inherit ashes than kneel to a ghoul king. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.157.a:0 "Raise the shadow court."

 war_unique_intro_events.158.t:0 "Thunder in the Passes"
 war_unique_intro_events.158.d:0 "For Thunderguts, the age begins in danger. The Thunderguts announce themselves before the battle starts: drums, belches, iron pots, cracking bones, and the heavy certainty that subtlety is for food that can hide.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Southern Wastes, there is no passive frontier for Thunderguts. Mountain roads reward anyone strong enough to demand payment twice, but every rival tribe and caravan captain knows a toll only matters if it is enforced. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.158.a:0 "Shake the passes."

 war_unique_intro_events.159.t:0 "The Northern Furnace"
 war_unique_intro_events.159.d:0 "For Uzkulak, the age begins in danger. Uzkulak watches the northern approaches with furnace smoke in its beard and iron contempt in its laws.\n\nThe Dawi Zharr people move within the Chaos Dwarf cultural world, and public life is shaped by Hashut in court, shrine, camp, and market. Hashut demands fire, tyranny, and useful cruelty, turning industry and obedience into sacred acts.\n\nAcross the Wheatlands, there is no passive frontier for Uzkulak. Kurgan, Hobgoblins, Ogres, and worse powers move near the roads, each useful if harnessed and dangerous if allowed to imagine equality. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.159.a:0 "Stoke the northern furnace."

 war_unique_intro_events.160.t:0 "The Dolgan Road to Ruin"
 war_unique_intro_events.160.d:0 "For Dolgans, the age begins in danger. The Dolgans ride long roads between steppe, forest, and frozen rumor, carrying gods in their scars and policy in the speed of their horses.\n\nThe Dolgan people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Wheatlands, there is no passive frontier for the Dolgans. Settled kingdoms call them distant until the smoke rises nearby, while rival tribes test whether Dolgan oaths can hold under hunger, omen, and ambition. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.160.a:0 "Ride the ruin road."

 war_unique_intro_events.161.t:0 "Wheatland Winter"
 war_unique_intro_events.161.d:0 "For Chernozavtra, the age begins in danger. Chernozavtra stands among fields that should feed armies, villages that should trust the bear, and roads that prove the Wheatlands are no safe granary anymore.\n\nThe Wheatlander people move within the Kislevite cultural world, and public life is shaped by devotion to Ursun in court, shrine, camp, and market. Ursun gives endurance a sacred shape, asking the faithful to survive winter, invasion, and doubt without surrendering their heart.\n\nAcross the Wheatlands, there is no passive frontier for Chernozavtra. Kislev's heart is strained, raiders circle the horizon, and every local notable knows grain can become leverage faster than loyalty becomes law. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.161.a:0 "Guard the wheatland winter."

 war_unique_intro_events.162.t:0 "The Blood-Red Balance"
 war_unique_intro_events.162.d:0 "For Yin, the age begins in danger. Yin speaks in the language of balance while sharpening knives for a god who prefers the scales weighted with skulls.\n\nThe Yin people move within the Hung cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Broken Lands, there is no passive frontier for the Yin. Cathayan order, steppe ambition, and the temptations of the Blood God pull at the same court, promising strength if mercy is named disorder. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.162.a:0 "Break the balance."

 war_unique_intro_events.163.t:0 "The Mung Host"
 war_unique_intro_events.163.d:0 "For Mung, the age begins in danger. The Mung are an old terror of the wastes, a people whose campfires, horse-lines, and god-marked champions have frightened borderlands for generations.\n\nThe Mung people move within the Hung cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Far Wastes, there is no passive frontier for the Mung. Old prestige is useful only while it is renewed in blood; rival tribes, Cathayan walls, and daemonic omens all wait for the host to slow. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.163.a:0 "Gather the host."

 war_unique_intro_events.164.t:0 "Aghol Fires"
 war_unique_intro_events.164.d:0 "For Aghols, the age begins in danger. The Aghols follow fire across cold country, keeping camps, herds, and shrine-stakes in a restless pattern that outsiders mistake for disorder.\n\nThe Aghols people move within the Hung cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Far Wastes, there is no passive frontier for the Aghols. The wastes punish stillness, but a people that never binds its victories into rule becomes a story told by enemies after the ashes cool. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.164.a:0 "Feed the Aghol fires."

 war_unique_intro_events.165.t:0 "The Knife That Smiles"
 war_unique_intro_events.165.d:0 "For Subtle Torture, the age begins in danger. Subtle Torture does not mistake loud pain for artistry.\n\nThe Kul people move within the Kurgan cultural world, and public life is shaped by Slaaneshi devotion in court, shrine, camp, and market. Slaanesh turns excess, beauty, pain, and desire into command, making rule a performance that must always become sharper.\n\nAcross the Western Wastes, there is no passive frontier for Subtle Torture. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.165.a:0 "Smile with the knife."

 war_unique_intro_events.166.t:0 "The Wheel Breaks Forward"
 war_unique_intro_events.166.d:0 "For Broken Wheel, the age begins in danger. Broken Wheel follows omens that turn in circles until the spokes snap and the whole design lurches somewhere no sane commander expected.\n\nThe Kvellig people move within the Norscan cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross the Western Wastes, there is no passive frontier for Broken Wheel. Tzeentch rewards change, but a warband that changes without direction becomes another abandoned joke in the wastes. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.166.a:0 "Break the wheel forward."

 war_unique_intro_events.167.t:0 "A Thousand Beautiful Sins"
 war_unique_intro_events.167.d:0 "For Hedonites, the age begins in danger. The Hedonites dress damnation in color, perfume, song, and blades so fine that victims may admire them for one foolish heartbeat.\n\nThe Gospodar people move within the Kislevite cultural world, and public life is shaped by Slaaneshi devotion in court, shrine, camp, and market. Slaanesh turns excess, beauty, pain, and desire into command, making rule a performance that must always become sharper.\n\nAcross the Western Wastes, there is no passive frontier for Hedonites of Kislev. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.167.a:0 "Make excess march."

 war_unique_intro_events.168.t:0 "Kvellings at the Edge"
 war_unique_intro_events.168.d:0 "For Kvellings, the age begins in danger. The Kvellings live at the edge of better-known terrors, close enough to hear the gods and far enough to know they must make their own strength visible.\n\nThe Kvellig people move within the Norscan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Far Wastes, there is no passive frontier for Kvellings. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.168.a:0 "Hold the edge."

 war_unique_intro_events.169.t:0 "The Swarm's Fever"
 war_unique_intro_events.169.d:0 "For Bubonic Swarm, the age begins in danger. The Bubonic Swarm moves like sickness given banners, patient in decay and cheerful in the way only Nurgle's beloved can be cheerful among corpses.\n\nThe Kul people move within the Kurgan cultural world, and public life is shaped by Nurglite devotion in court, shrine, camp, and market. Nurgle turns suffering into fellowship and decay into endurance, making every wound a promise that the faithful will continue.\n\nAcross the Western Wastes, there is no passive frontier for Wolf Brothers. Enemies can burn camps, flee roads, or pray to clean gods, but disease has a patience that swords envy. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.169.a:0 "Spread the blessed fever."

 war_unique_intro_events.170.t:0 "Gharhan Horse-Oaths"
 war_unique_intro_events.170.d:0 "For Gharhans, the age begins in danger. The Gharhans ride beneath oaths sworn over horse blood, blackened iron, and gods who listen closely when ambition is spoken aloud.\n\nThe Gharhar people move within the Norscan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Far Wastes, there is no passive frontier for Gharhans. Their camps can become a kingdom or a quarrel depending on whether chiefs accept one law before the next omen splits them. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.170.a:0 "Ride under black oaths."

 war_unique_intro_events.171.t:0 "Tahmak Omens"
 war_unique_intro_events.171.d:0 "For Tahmaks, the age begins in danger. The Tahmaks trust signs in smoke, entrails, hoofprints, and dreams, but signs become useful only when warriors are willing to enforce their interpretation.\n\nThe Tahmaks people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Western Wastes, there is no passive frontier for Tahmaks. The wastes produce prophets cheaply and corpses even cheaper; a tribe that follows every vision will be eaten by the first rival with a plan. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.171.a:0 "Read the omen in blood."

 war_unique_intro_events.172.t:0 "The Oldest Horde"
 war_unique_intro_events.172.d:0 "For Kul, the age begins in danger. The Kul carry a name heavy with old invasions, broken borders, and the memory of chieftains who measured greatness by how far the south burned.\n\nThe Kul people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Western Wastes, there is no passive frontier for the Kul. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.172.a:0 "Make old terror new."

 war_unique_intro_events.173.t:0 "Dervingard's Frozen Wall"
 war_unique_intro_events.173.d:0 "For Dervingard, the age begins in danger. Dervingard is a hard garrison in colder country, where watch rotations, stores, prayers to Ursun, and suspicious officers matter more than courtly speeches.\n\nThe Sibyrian people move within the Kislevite cultural world, and public life is shaped by devotion to Ursun in court, shrine, camp, and market. Ursun gives endurance a sacred shape, asking the faithful to survive winter, invasion, and doubt without surrendering their heart.\n\nAcross the Western Wastes, there is no passive frontier for Dervingard. Kislevite survival is made from cold faith, stubborn households, hard riders, wary towns, and the refusal to treat despair as wisdom. Ursun does not promise comfort. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.173.a:0 "Keep the frozen wall."

 war_unique_intro_events.174.t:0 "Tong Under Iron Stars"
 war_unique_intro_events.174.d:0 "For Tong, the age begins in danger. The Tong read iron stars above the wastes and hear in them a promise that the south has not suffered enough to understand.\n\nThe Tokmar people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Western Wastes, there is no passive frontier for the Tong. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.174.a:0 "Follow the iron stars."

 war_unique_intro_events.175.t:0 "Dolgans Beyond the Sunrise"
 war_unique_intro_events.175.d:0 "For Eastern Dolgans, the age begins in danger. The Eastern Dolgans live where familiar stories stretch thin, carrying Dolgan habits into lands that answer with new tongues, new roads, and old gods wearing new masks.\n\nThe Dolgan people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Western Wastes, there is no passive frontier for Steppe Dolgans. Distance can free a tribe or dissolve it, and every chief who mistakes novelty for safety will learn how quickly the wastes correct vanity. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.175.a:0 "Ride beyond the sunrise."

 war_unique_intro_events.176.t:0 "Tokmar Dust and Oaths"
 war_unique_intro_events.176.d:0 "For Tokmars, the age begins in danger. The Tokmars travel in dust that hides numbers, intentions, and the places where last nights captives were buried.\n\nThe Tokmar people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Western Wastes, there is no passive frontier for the Tokmars. Their strength is speed, but speed without binding purpose scatters as easily as sand when richer prey appears elsewhere. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.176.a:0 "Swear over dust."

 war_unique_intro_events.177.t:0 "Avag Saddle-Law"
 war_unique_intro_events.177.d:0 "For Avags, the age begins in danger. The Avags trust riders more than walls and scars more than seals, but even a mounted people need law when tribute, captives, and glory are divided.\n\nThe Avag people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Southern Chaos Wastes, there is no passive frontier for the Avags. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.177.a:0 "Rule from the saddle."

 war_unique_intro_events.178.t:0 "Khazag Black Standards"
 war_unique_intro_events.178.d:0 "For Khazags, the age begins in danger. The Khazags raise black standards over camps that want plunder, order, and omens in equal measure.\n\nThe Khazags people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Eastern Steppes, there is no passive frontier for the Khazags. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.178.a:0 "Raise the black standards."

 war_unique_intro_events.179.t:0 "Yusak River Camps"
 war_unique_intro_events.179.d:0 "For Yusaks, the age begins in danger. The Yusaks know rivers as roads, borders, shrines, and traps, carrying tents and trophies along water that looks peaceful only from far away.\n\nThe Yusak people move within the Kurgan cultural world, and public life is shaped by Slaaneshi devotion in court, shrine, camp, and market. Slaanesh turns excess, beauty, pain, and desire into command, making rule a performance that must always become sharper.\n\nAcross the Eastern Steppes, there is no passive frontier for the Yusaks. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.179.a:0 "Bind the river camps."

 war_unique_intro_events.180.t:0 "Wei-Jin in Exile"
 war_unique_intro_events.180.d:0 "For Wei-Jin, the age begins in danger. Wei-Jin is a dangerous name to carry in exile, especially when Tzeentchian whispers suggest that a stolen title can become truer than the throne it imitates.\n\nThe Man-Chu people move within the Hung cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross the Eastern Steppes, there is no passive frontier for the Wei-Jin. Cathayan protocol despises disorder, steppe politics despise weakness, and the Changer despises any plan too simple to betray itself. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.180.a:0 "Corrupt the old name."

 war_unique_intro_events.181.t:0 "The Kuj Market Horde"
 war_unique_intro_events.181.d:0 "For Kuj, the age begins in danger. The Kuj know that trade and raiding are not opposites.\n\nThe Kuj people move within the Hung cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross the Eastern Steppes, there is no passive frontier for the Kuj. Settled neighbors prefer predictable markets, but the gods and rival hordes prefer proof that profit has not made the Kuj tame. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.181.a:0 "Trade in ruin."

 war_unique_intro_events.182.t:0 "The Dread Wo Muster"
 war_unique_intro_events.182.d:0 "For Dread Wo, the age begins in danger. Dread Wo is a name meant to travel ahead of its riders, softening villages, border posts, and nervous allies before hooves arrive.\n\nThe Man-Chu people move within the Hung cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Eastern Steppes, there is no passive frontier for Dreaded Wo. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.182.a:0 "Muster the dread host."

 war_unique_intro_events.183.t:0 "Riders in the Storm"
 war_unique_intro_events.183.d:0 "For Manchu, the age begins in danger. The Manchu ride between worlds, close enough to Cathayan influence to know discipline and close enough to the northern storm to hear promises in thunder.\n\nThe Man-Chu people move within the Hung cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Eastern Steppes, there is no passive frontier for Man-Chu. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.183.a:0 "Ride through the storm."

 war_unique_intro_events.184.t:0 "The Raven Host Takes Wing"
 war_unique_intro_events.184.d:0 "For Raven Host, the age begins in danger. The Raven Host gathers under feathers, riddles, and plans that molt into sharper plans before enemies finish understanding the first.\n\nThe Yusak people move within the Kurgan cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross the Far Wastes, there is no passive frontier for Raven Host. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.184.a:0 "Take wing in shadow."

 war_unique_intro_events.185.t:0 "Iron Wolves of the Waste"
 war_unique_intro_events.185.d:0 "For Iron Wolves, the age begins in danger. The Iron Wolves understand that a pack is not a mob.\n\nThe Tahmaks people move within the Kurgan cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross the Eastern Steppes, there is no passive frontier for Iron Wolves. Settled hordes often grow heavy, while roaming rivals mock walls and storehouses until iron teeth close around them. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.185.a:0 "Run with iron teeth."

 war_unique_intro_events.186.t:0 "The Thousand Sons Spiral"
 war_unique_intro_events.186.d:0 "For Thousand Sons, the age begins in danger. The Thousand Sons count knowledge as weapon, disease, inheritance, and trap, arranging their warband like a spell whose final line has not admitted itself.\n\nThe Khazags people move within the Kurgan cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross the Eastern Steppes, there is no passive frontier for Thousand Sons. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.186.a:0 "Open the spiral path."

 war_unique_intro_events.187.t:0 "The Garden Marches"
 war_unique_intro_events.187.d:0 "For Death Guard, the age begins in danger. The Death Guard advance with the patience of rot, smiling through wounds that would kill cleaner men and blessing every ditch with gifts that continue working after the army leaves.\n\nThe Kul people move within the Kurgan cultural world, and public life is shaped by Nurglite devotion in court, shrine, camp, and market. Nurgle turns suffering into fellowship and decay into endurance, making every wound a promise that the faithful will continue.\n\nAcross the Far Wastes, there is no passive frontier for Death Guard. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.187.a:0 "March with the garden."

 war_unique_intro_events.188.t:0 "The Butcher's Road"
 war_unique_intro_events.188.d:0 "For World Eaters, the age begins in danger. The World Eaters have little patience for speeches that do not end in a charge.\n\nThe Tokmar people move within the Kurgan cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross the Western Wastes, there is no passive frontier for Blooded Ones. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.188.a:0 "Walk the butchers road."

 war_unique_intro_events.189.t:0 "The Black Legion's Claim"
 war_unique_intro_events.189.d:0 "For Black Legion, the age begins in danger. The Black Legion carries a name that demands obedience from lesser warbands, rivals, oathbreakers, and anyone who mistakes black iron for mourning.\n\nThe Tokmar people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Western Wastes, there is no passive frontier for Black Legion. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.189.a:0 "Claim the black standard."

 war_unique_intro_events.190.t:0 "Hounds at the Gate"
 war_unique_intro_events.190.d:0 "For Gorehounds, the age begins in danger. The Gorehounds know fear by scent.\n\nThe Yusak people move within the Kurgan cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross the Eastern Steppes, there is no passive frontier for Gorehounds. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.190.a:0 "Loose the hounds."

 war_unique_intro_events.191.t:0 "Choseon Under the Raven Moon"
 war_unique_intro_events.191.d:0 "For Choseon, the age begins in danger. Choseon keeps eastern forms under a raven moon, where courtiers still bow, scribes still record, and Tzeentch smiles because every rule is another way to hide a knife.\n\nThe Tahmaks people move within the Kurgan cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross Ihan, there is no passive frontier for Choseon. Cathayan neighbors see familiar ceremony and suspect corruption too late, while northern patrons demand proof that subtlety can still burn cities. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.191.a:0 "Read the raven moon."

 war_unique_intro_events.192.t:0 "Koryos Doomed Horizon"
 war_unique_intro_events.192.d:0 "For Koryo, the age begins in danger. Koryo stands at the edge of Cathayan influence with artillery, coastal discipline, court learning, and the uneasy knowledge that order is not the same as safety.\n\nThe Koryon people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross Ihan, there is no passive frontier for Koryo. Eastern order is a discipline, not a charm against disaster. Court rites, artillery drill, coastal patrols, and learned offices must all be made practical while the disappearance of the Dragon Emperor shakes the world around them. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.192.a:0 "Hold the doomed horizon."

 war_unique_intro_events.193.t:0 "The Manflayers Contract"
 war_unique_intro_events.193.d:0 "For Mengils Manflayers, the age begins in danger. Mengils Manflayers are Druchii blades for hire, which means the contract is written in coin, fear, and the certainty that the client is never the most dangerous person in the room.\n\nThe Naggarondi people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Borderlands, there is no passive frontier for Mengil's Manflayers. The first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.193.a:0 "Honor the cruel contract."

 war_unique_intro_events.194.t:0 "Asarnil's Exiles"
 war_unique_intro_events.194.d:0 "For Asarnil, the age begins in danger. Asarnil's exiles carry Caledor's pride across hostile seas, with dragon memories, polished armor, and the bitter knowledge that distance can make nobility feel like punishment.\n\nThe Caledori people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Western Outer Ulthuan, there is no passive frontier for Exiles of Caledor. The Asur abroad live by distance made disciplined: beacon towers, captains, ledgers, harbor rites, and pride restrained enough to survive foreign weather. Ulthuan is not near, so duty must become local before nostalgia becomes weakness. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.194.a:0 "Keep Caledor's fire abroad."

 war_unique_intro_events.195.t:0 "The Scarab King Stirs"
 war_unique_intro_events.195.d:0 "For Death Scarabs, the age begins in danger. The Death Scarabs stir beneath gold, dust, and patient stone, where every sealed chamber remembers a ruler who expected eternity to be orderly.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Death Scarabs. Nehekhara teaches that death is not release from rule. Mortuary rites, buried legions, priestly patience, and royal certainty must be awakened together, because an undead kingdom without command is merely a tomb with banners. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.195.a:0 "Open the scarab tombs."

 war_unique_intro_events.196.t:0 "The Ungol Road"
 war_unique_intro_events.196.d:0 "For Ungolaria, the age begins in danger. Ungolaria knows the road, the horse, the bow, and the old suspicion between riders and courts that need riders most when the north grows loud.\n\nThe Ungol people move within the Kislevite cultural world, and public life is shaped by devotion to Ursun in court, shrine, camp, and market. Ursun gives endurance a sacred shape, asking the faithful to survive winter, invasion, and doubt without surrendering their heart.\n\nAcross the Kislev Heartlands, there is no passive frontier for Ungolaria. Kislevite unity has always been difficult, and a frontier people ignored in peace may become impossible to command in war. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.196.a:0 "Ride the Ungol road."

 war_unique_intro_events.197.t:0 "Praag Remembers"
 war_unique_intro_events.197.d:0 "For Praag, the age begins in danger. Praag remembers more than any city should.\n\nThe Praager people move within the Kislevite cultural world, and public life is shaped by devotion to Ursun in court, shrine, camp, and market. Ursun gives endurance a sacred shape, asking the faithful to survive winter, invasion, and doubt without surrendering their heart.\n\nAcross the Kislev Heartlands, there is no passive frontier for Praag. A city that has suffered horror can become either a shield or a shrine to its own fear, and Kislev cannot afford the second fate. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.197.a:0 "Hold haunted Praag."

 war_unique_intro_events.198.t:0 "Erengards Cold Harbor"
 war_unique_intro_events.198.d:0 "For Erengard, the age begins in danger. Erengard is a cold harbor of sailors, merchants, warehouses, patrols, and rumors from every sea that can survive the ice.\n\nThe Erengradian people move within the Kislevite cultural world, and public life is shaped by devotion to Ursun in court, shrine, camp, and market. Ursun gives endurance a sacred shape, asking the faithful to survive winter, invasion, and doubt without surrendering their heart.\n\nAcross the Kislev Heartlands, there is no passive frontier for Erengrad. Kislevite survival is made from cold faith, stubborn households, hard riders, wary towns, and the refusal to treat despair as wisdom. Ursun does not promise comfort. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.198.a:0 "Guard the cold harbor."

 war_unique_intro_events.199.t:0 "Ropsmannia's Long Watch"
 war_unique_intro_events.199.d:0 "For Ropsmannia, the age begins in danger. Ropsmannia lives by the long watch: scattered settlements, hard households, winter roads, and people who know that a warning shouted too late is just a funeral custom.\n\nThe Roppsmenn people move within the Kislevite cultural world, and public life is shaped by devotion to Ursun in court, shrine, camp, and market. Ursun gives endurance a sacred shape, asking the faithful to survive winter, invasion, and doubt without surrendering their heart.\n\nAcross the Kislev Heartlands, there is no passive frontier for Ropsmannia. Kislevite survival is made from cold faith, stubborn households, hard riders, wary towns, and the refusal to treat despair as wisdom. Ursun does not promise comfort. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.199.a:0 "Keep the long watch."

 war_unique_intro_events.200.t:0 "Laurelorn's Hidden Court"
 war_unique_intro_events.200.d:0 "For Laurelorn, the age begins in danger. Laurelorn is not Athel Loren, and that difference matters.\n\nThe Eonir Elves move within the Wood Elves cultural world, and public life is shaped by Asrai spirit-faith in court, shrine, camp, and market. Asrai belief binds elf and spirit to the forest, where beauty and vengeance share the same roots.\n\nAcross the North Empire Provinces, there is no passive frontier for Laurelon. Men see timber, roads, and borderland opportunity; the forest sees trespass, imbalance, and promises made before human kingdoms learned to write. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RAs a Wood Elf, you have a tough time administering lands outside of Forest.§!"
 war_unique_intro_events.200.a:0 "Guard the hidden court."

 war_unique_intro_events.201.t:0 "Black Wolves on the Steppe"
 war_unique_intro_events.201.d:0 "For Black Wolves, the age begins in danger. The Black Wolves ride where a camp can vanish before sunrise and leave only hoofprints, ashes, and a rumor that the betrayal was very well timed.\n\nThe Steppe Hobgoblin people move within the Hobgoblin cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Eastern Steppes, there is no passive frontier for Black Wolves. The first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.201.a:0 "Let the black wolves run."

 war_unique_intro_events.202.t:0 "Blood Arrows in Flight"
 war_unique_intro_events.202.d:0 "For Blood Arrows, the age begins in danger. The Blood Arrows prefer killing at range, bargaining from strength, and arriving late enough that both sides already look profitable.\n\nThe Steppe Hobgoblin people move within the Hobgoblin cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Eastern Steppes, there is no passive frontier for Blood Arrow. The first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.202.a:0 "Loose the blood arrows."

 war_unique_intro_events.203.t:0 "Under the Great Khans Shadow"
 war_unique_intro_events.203.d:0 "For Great Khans, the age begins in danger. The Great Khans carry a title that every Hobgoblin understands and every rival chief would steal if the guards looked away long enough.\n\nThe Steppe Hobgoblin people move within the Hobgoblin cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Southern Chaos Wastes, there is no passive frontier for Great Khans. The first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.203.a:0 "Cast the khans shadow."

 war_unique_intro_events.204.t:0 "Fangmaw's Bargain"
 war_unique_intro_events.204.d:0 "For Fangmaw, the age begins in danger. Fangmaw knows that the best bargain begins with teeth visible.\n\nThe Steppe Hobgoblin people move within the Hobgoblin cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Eastern Steppes, there is no passive frontier for Fangmaw. Cathayan wealth, Chaos Dwarf demands, and rival Hobgoblins all create opportunities too dangerous for honest hands. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.204.a:0 "Bite before bargaining."

 war_unique_intro_events.205.t:0 "Windrider Camps"
 war_unique_intro_events.205.d:0 "For Windrider, the age begins in danger. Windrider camps move with the weather, appearing where trade is thinly guarded and vanishing before revenge finds the right horizon.\n\nThe Steppe Hobgoblin people move within the Hobgoblin cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Eastern Steppes, there is no passive frontier for Windriders. The first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.205.a:0 "Ride faster than trust."

 war_unique_intro_events.206.t:0 "The Twisted Twins Game"
 war_unique_intro_events.206.d:0 "For Vilitch the Curseling, the age begins in danger. Vilitch the Curseling is two fates knotted into one body, a lesson in Tzeentch's humor that leaves enemies unsure which brother is the trap and which is the bait.\n\nThe Avag people move within the Kurgan cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross the Western Wastes, there is no passive frontier for Puppets of Misrule. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.206.a:0 "Play the twisted game."

 war_unique_intro_events.207.t:0 "The Bloody Valkyrie"
 war_unique_intro_events.207.d:0 "For Valkia the Bloody, the age begins in danger. Valkia the Bloody is Khorne's spear cast into the world, winged, furious, and beautiful only in the way a killing stroke can be beautiful.\n\nThe Kul people move within the Kurgan cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross the Western Wastes, there is no passive frontier for Gorequeen's Slaughterhost. Her followers do not need to be convinced of slaughter; they need to be aimed before their devotion wastes itself on lesser prey. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.207.a:0 "Fly to the slaughter."

 war_unique_intro_events.208.t:0 "The Beast That Was a Champion"
 war_unique_intro_events.208.d:0 "For Scyla Anfingrimm, the age begins in danger. Scyla Anfingrimm is what remains when a champion receives more blessing than shape can bear, a living warning that Khorne values results over conversation.\n\nThe Aghols people move within the Hung cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross the Far Wastes, there is no passive frontier for Scourgeborn. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.208.a:0 "Unleash the beast."

 war_unique_intro_events.209.t:0 "The Silent Helm"
 war_unique_intro_events.209.d:0 "For Slambo, the age begins in danger. Slambo needs no sermon.\n\nThe Kuj people move within the Hung cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Western Wastes, there is no passive frontier for Slambo's Host. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.209.a:0 "Let the axes speak."

 war_unique_intro_events.210.t:0 "Herald of the Everchosen"
 war_unique_intro_events.210.d:0 "For Vardek Crom, the age begins in danger. Vardek Crom is not merely a raider with a famous blade.\n\nThe Yusak people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Western Wastes, there is no passive frontier for Herald's of the Endtime. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.210.a:0 "Break them for the north."

 war_unique_intro_events.211.t:0 "The Undefeated's Challenge"
 war_unique_intro_events.211.d:0 "For Arbaal the Undefeated, the age begins in danger. Arbaal the Undefeated carries a title that is also a threat, a prayer, and a trap.\n\nThe Yusak people move within the Kurgan cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross the Eastern Steppes, there is no passive frontier for Hounds of Khorne. A champion who refuses challenge dies spiritually before he dies physically, but a warband cannot survive if pride chooses every battlefield blindly. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.211.a:0 "Accept every challenge."

 war_unique_intro_events.212.t:0 "The Lord of Tentacles"
 war_unique_intro_events.212.d:0 "For Gutrot Spume, the age begins in danger. Gutrot Spume carries the stink of drowned holds, plague-slick decks, and tentacles where honest limbs surrendered to Nurgle's generosity.\n\nThe Kvellig people move within the Norscan cultural world, and public life is shaped by Nurglite devotion in court, shrine, camp, and market. Nurgle turns suffering into fellowship and decay into endurance, making every wound a promise that the faithful will continue.\n\nAcross the Far Wastes, there is no passive frontier for Dragonbone. Coasts, rivers, and ports think walls face outward, but rot and raiders both understand that water is a road beneath defenses. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.212.a:0 "Drag them below."

 war_unique_intro_events.213.t:0 "The Cabal of Horstmann"
 war_unique_intro_events.213.d:0 "For Egrimm van Horstmann, the age begins in danger. Egrimm van Horstmann knows Imperial learning, magical vanity, and treachery from the inside, which makes his service to Tzeentch especially educational for his enemies.\n\nThe Aghols people move within the Hung cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross the Eastern Steppes, there is no passive frontier for the Cabal. A cabal must remain hidden long enough to matter and reveal itself only when revelation is another kind of trap. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.213.a:0 "Write the hidden law."

 war_unique_intro_events.214.t:0 "The Leechlord's Cure"
 war_unique_intro_events.214.d:0 "For Festus the Leechlord, the age begins in danger. Festus the Leechlord offers cures with a physicians hand and a grandfatherly smile, which is why the screams often begin after the patient thanks him.\n\nThe Tokmar people move within the Kurgan cultural world, and public life is shaped by Nurglite devotion in court, shrine, camp, and market. Nurgle turns suffering into fellowship and decay into endurance, making every wound a promise that the faithful will continue.\n\nAcross the Western Wastes, there is no passive frontier for the Fecundites. Nurgle's mercy is generous, but it must be delivered through bodies, bottles, camps, and battlefields before the clean world learns gratitude. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.214.a:0 "Administer the cure."

 war_unique_intro_events.215.t:0 "The Black-Iron Reaver"
 war_unique_intro_events.215.d:0 "For Mortkin, the age begins in danger. Mortkin carries black iron, old injury, and the kind of patience that makes revenge look almost disciplined.\n\nThe Tahmaks people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Far Wastes, there is no passive frontier for Fell Legion. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.215.a:0 "Settle the black debt."

 war_unique_intro_events.216.t:0 "Three Lords One Rot"
 war_unique_intro_events.216.d:0 "For Maggoth Lords, the age begins in danger. The Maggoth Lords ride bloated miracles into war, three ambitions carried on rot so beloved that even the ground seems to soften in welcome.\n\nThe Avag people move within the Kurgan cultural world, and public life is shaped by Nurglite devotion in court, shrine, camp, and market. Nurgle turns suffering into fellowship and decay into endurance, making every wound a promise that the faithful will continue.\n\nAcross the Western Wastes, there is no passive frontier for Maggoth Lords. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.216.a:0 "Ride the blessed rot."

 war_unique_intro_events.217.t:0 "Bloodwrath Unbound"
 war_unique_intro_events.217.d:0 "For Skarr Bloodwrath, the age begins in danger. Skarr Bloodwrath is rage that learned to return.\n\nThe Kuj people move within the Hung cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross the Far Wastes, there is no passive frontier for Skullreapers. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.217.a:0 "Spill wrath without end."

 war_unique_intro_events.218.t:0 "The Wanderer's Curse"
 war_unique_intro_events.218.d:0 "For Wulfrik the Wanderer, the age begins in danger. Wulfrik the Wanderer can speak the tongue of any foe, which is less a gift than a perfectly sharpened curse when every word leads toward challenge.\n\nThe Sarl people move within the Norscan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Far Wastes, there is no passive frontier for Warbands of the Wanderer. A champion who must seek worthy enemies can win fame faster than he can build a realm, unless his wanderings are made into policy. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.218.a:0 "Answer every insult."

 war_unique_intro_events.219.t:0 "The Suneater Wakes"
 war_unique_intro_events.219.d:0 "For Kholek Suneater, the age begins in danger. Kholek Suneater is older than many nations and less patient than any of them deserve, a storm-scaled ruin whose footsteps make mountains reconsider stillness.\n\nThe Tahmaks people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Western Wastes, there is no passive frontier for Heralds of the Tempest. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.219.a:0 "Shake the mountains awake."

 war_unique_intro_events.220.t:0 "The Prince's Smile"
 war_unique_intro_events.220.d:0 "For Azazel, the age begins in danger. Azazel smiles with the confidence of one who knows virtue is often only temptation that has not yet found the right voice.\n\nThe Yusak people move within the Kurgan cultural world, and public life is shaped by Slaaneshi devotion in court, shrine, camp, and market. Slaanesh turns excess, beauty, pain, and desire into command, making rule a performance that must always become sharper.\n\nAcross the Western Wastes, there is no passive frontier for the Ecstatic Legions. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.220.a:0 "Smile and damn them."

 war_unique_intro_events.221.t:0 "The First Chaos Dragon"
 war_unique_intro_events.221.d:0 "For Galrauch, the age begins in danger. Galrauch is a wound in dragonkind, the first of his kind remade by Chaos and still vast enough that prophecy feels small beside his shadow.\n\nThe Yusak people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Eastern Steppes, there is no passive frontier for Great Drake Host. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.221.a:0 "Let the dragon dream ruin."

 war_unique_intro_events.222.t:0 "The Faithless Bargain"
 war_unique_intro_events.222.d:0 "For Sayl the Faithless, the age begins in danger. Sayl the Faithless has made betrayal less a sin than a trade language, fluent enough that even allies listen carefully for the price hidden in each promise.\n\nThe Yusak people move within the Kurgan cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross the Western Wastes, there is no passive frontier for the Faithless. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.222.a:0 "Betray them profitably."

 war_unique_intro_events.223.t:0 "Styrkaar's Perfect War"
 war_unique_intro_events.223.d:0 "For Styrkaar, the age begins in danger. Styrkaar seeks a war so exquisite that even terror seems arranged, every charge a performance and every wound an audience forced to applaud.\n\nThe Kvellig people move within the Norscan cultural world, and public life is shaped by Slaaneshi devotion in court, shrine, camp, and market. Slaanesh turns excess, beauty, pain, and desire into command, making rule a performance that must always become sharper.\n\nAcross the Western Wastes, there is no passive frontier for Sortsvinaer. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.223.a:0 "Make war beautiful."

 war_unique_intro_events.224.t:0 "Fimirach in the Dark Lands"
 war_unique_intro_events.224.d:0 "For Fimirach, the age begins in danger. Fimirach carries the wet shadow of the Fimir into a land of ash, chains, and furnace smoke, where mist must learn to hide among worse things.\n\nThe Fimir people move within the Fimir cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Gnoblar Country, there is no passive frontier for Fimdirach. Chaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.224.a:0 "Raise the fen-shadow."

 war_unique_intro_events.225.t:0 "The Maggot Lord's Ride"
 war_unique_intro_events.225.d:0 "For Tamurkhan, the age begins in danger. Tamurkhan rides as conquest wearing corruption, a maggot lord whose ambition is swollen enough to call decay an empire.\n\nThe Avag people move within the Kurgan cultural world, and public life is shaped by Nurglite devotion in court, shrine, camp, and market. Nurgle turns suffering into fellowship and decay into endurance, making every wound a promise that the faithful will continue.\n\nAcross the Western Wastes, there is no passive frontier for Maggot Host. Nurgle's favor gives endurance, but a crusade must keep moving before rot becomes comfort and comfort becomes another kind of grave. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.225.a:0 "Ride the maggot road."

 war_unique_intro_events.226.t:0 "The Threefold Rot"
 war_unique_intro_events.226.d:0 "For the Glottkin, the age begins in danger. The Glottkin are brotherhood made monstrous, three voices of Nurgle's affection carrying plague, strength, and sorcery in one family argument with the world.\n\nThe Aghols people move within the Hung cultural world, and public life is shaped by Nurglite devotion in court, shrine, camp, and market. Nurgle turns suffering into fellowship and decay into endurance, making every wound a promise that the faithful will continue.\n\nAcross the Far Wastes, there is no passive frontier for Befouled Warriors. A warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!. As a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods!"
 war_unique_intro_events.226.a:0 "Let three voices rot as one."

 war_unique_intro_events.227.t:0 "Bloodgrin Laughs First"
 war_unique_intro_events.227.d:0 "For Bloodgrin Tribe, the age begins in danger. The Bloodgrin Tribe knows a good fight by the taste of it.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the World's Edge Mountain, there is no passive frontier for Grimfangz. A tribe that stops fighting starts thinking, and thinking is how bosses get stabbed before the next raid even starts. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.227.a:0 "Grin through the blood."

 war_unique_intro_events.228.t:0 "Bad Axes, Good Fight"
 war_unique_intro_events.228.d:0 "For Bad Axes Tribe, the age begins in danger. The Bad Axes Tribe does not need fine smithing to know a choppa works.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross Bretonnia, there is no passive frontier for Bad Axes. Rivals, stunties, humies, and unlucky neighbors all look like practice targets, but the tribe needs a boss who can turn many small scraps into one proper WAAAGH. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.228.a:0 "Sharpen da bad axes."

 war_unique_intro_events.229.t:0 "Blue Paint, Red Work"
 war_unique_intro_events.229.d:0 "For Blue Face Tribe, the age begins in danger. The Blue Face Tribe marks itself before battle so every enemy knows exactly which mob is coming to ruin the day.\n\nThe Borderlands Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Borderlands, there is no passive frontier for Blue Faces. War paint does not scare anyone if the warriors under it are idle, and idle Greenskins become a problem for their own camp first. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.229.a:0 "Paint up and charge."

 war_unique_intro_events.230.t:0 "Vulchaz Overhead"
 war_unique_intro_events.230.d:0 "For Vulchaz, the age begins in danger. The Vulchaz watch like carrion birds, waiting for weakness, smoke, or some richer fool to start a fight that can be profitably finished.\n\nThe Desert Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Vulchaz. Scavenging can feed a tribe, but only victory makes other Greenskins follow without laughing. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.230.a:0 "Circle and strike."

 war_unique_intro_events.231.t:0 "Freebooterz on the Tide"
 war_unique_intro_events.231.d:0 "For Freebooterz, the age begins in danger. The Freebooterz hear waves and think of boarding planks, stolen guns, and captains who shout louder than storms.\n\nThe Freebotta Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Freebootarz. Pirate mobs need plunder faster than discipline can leak away, and every coast is only useful if the boyz believe the next prize is worth the rowing. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.231.a:0 "Board da next prize."

 war_unique_intro_events.232.t:0 "Bonenose Omens"
 war_unique_intro_events.232.d:0 "For Bonenoses, the age begins in danger. The Bonenoses read trophies better than books.\n\nThe Desert Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Bonenoses. Omens are useful only while the tribe keeps winning; otherwise every bone starts pointing at a different boss. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.232.a:0 "Follow da bones."

 war_unique_intro_events.233.t:0 "Stitched Skull Banners"
 war_unique_intro_events.233.d:0 "For Stitched Skullz, the age begins in danger. The Stitched Skullz make banners from proof.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Southern World Edge Mountains, there is no passive frontier for Stitched Skulls. A banner full of old victories can inspire a charge, but only fresh trophies stop rivals from asking whether the boss has gone soft. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.233.a:0 "Stitch more skullz."

 war_unique_intro_events.234.t:0 "Rusty Daggaz in the Dark"
 war_unique_intro_events.234.d:0 "For Rusty Daggaz, the age begins in danger. The Rusty Daggaz know a rusty blade still hurts, especially when it arrives in the dark and the other git was expecting a fair fight.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Rusty Daggaz. Sneaky violence feeds a tribe for a while, but the boyz still need open scraps before the muttering turns inward. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.234.a:0 "Stick em first."

 war_unique_intro_events.235.t:0 "Teef Snatchaz Ledger"
 war_unique_intro_events.235.d:0 "For Teef Snatchaz, the age begins in danger. The Teef Snatchaz understand wealth in the proper way: if it can be punched loose, bitten out, or stolen from a smaller git, it counts.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Teef Snatchaz. Teef buy loyalty until a richer scrap appears, so the tribe must keep fights coming before the accounts start settling themselves with knives. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.235.a:0 "Snatch more teef."

 war_unique_intro_events.236.t:0 "Skulltakerz Trophy Road"
 war_unique_intro_events.236.d:0 "For Skulltakerz, the age begins in danger. The Skulltakerz do not need complicated reasons.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross Estalia, there is no passive frontier for Skulltakerz. Every trophy proves yesterday, but Greenskins follow whoever proves today louder. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.236.a:0 "Take da next skull."

 war_unique_intro_events.237.t:0 "Da Howlaz at Moonrise"
 war_unique_intro_events.237.d:0 "For Da Howlaz, the age begins in danger. Da Howlaz begin fights before they arrive.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Da Howlaz. Noise without krumpin becomes annoying even to Greenskins, so every howl has to end with something broken. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.237.a:0 "Howl louder."

 war_unique_intro_events.238.t:0 "Scabby Eyez Watchin"
 war_unique_intro_events.238.d:0 "For Scabby Eyez, the age begins in danger. The Scabby Eyez watch everything: rival bosses, weak walls, loose teef, and the exact moment a bigger git looks the wrong way.\n\nThe Borderlands Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Scabby Eyez. Suspicion keeps a mob alive, but it can also freeze a camp in arguments unless someone points all those eyes toward a target. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.238.a:0 "Watch em, then krump em."

 war_unique_intro_events.239.t:0 "Broken Tooth Bites Back"
 war_unique_intro_events.239.d:0 "For Broken Tooth, the age begins in danger. Broken Tooth carries a name that sounds like an injury until the tribe turns it into a threat.\n\nThe Borderlands Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Brokentooth. Other mobs respect strength and mock weakness, so every old defeat must be answered before it becomes the only story anyone remembers. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.239.a:0 "Bite back harder."

 war_unique_intro_events.240.t:0 "Bloodfeather War-Dance"
 war_unique_intro_events.240.d:0 "For Bloodfeathers, the age begins in danger. The Bloodfeathers decorate themselves with color, feathers, and enough blood to make every dance look like either a ritual or a warning.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross Estalia, there is no passive frontier for Bloofeathers. Rituals stir courage, but courage needs enemies before it curdles into camp quarrels and shaman arguments. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.240.a:0 "Dance into da scrap."

 war_unique_intro_events.241.t:0 "Skullsmasherz Simple Plan"
 war_unique_intro_events.241.d:0 "For Skullsmasherz, the age begins in danger. The Skullsmasherz have an honest approach to politics.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross Bretonnia, there is no passive frontier for Skullsmasherz. Even the simplest plan needs a direction, because a mob that smashes everything nearby eventually discovers its own camp is nearby too. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.241.a:0 "Smash da skullz."

 war_unique_intro_events.242.t:0 "Black Venom in the Trees"
 war_unique_intro_events.242.d:0 "For Black Venom Tribe, the age begins in danger. The Black Venom Tribe likes a fight better when the enemy is already sweating, stumbling, and wondering which scratch started to burn.\n\nThe Forest Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross Estalia, there is no passive frontier for Black Venoms. Poison and ambush make smaller mobs dangerous, but only victories big enough to boast about make larger mobs listen. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.242.a:0 "Let da venom drip."

 war_unique_intro_events.243.t:0 "Ironclaw Grip"
 war_unique_intro_events.243.d:0 "For Ironclaw, the age begins in danger. Ironclaw is a name that tells the tribe what to expect: grip hard, take harder, and do not let go just because something screams.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the World's Edge Mountain, there is no passive frontier for Iron Claws. A boss can hold a mob by fear for only so long before another boss wants to test the fingers. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.243.a:0 "Grab and crush."

 war_unique_intro_events.244.t:0 "Ironhead Charge"
 war_unique_intro_events.244.d:0 "For Ironhead, the age begins in danger. Ironhead does not overthink obstacles.\n\nThe Borderlands Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Iron 'ead. Stubbornness wins scraps but can lose wars if the boss keeps charging the same rock while easier loot laughs nearby. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.244.a:0 "Headbutt da world."

 war_unique_intro_events.245.t:0 "Goretusk Stampede"
 war_unique_intro_events.245.d:0 "For Goretusk, the age begins in danger. Goretusk follows the sound of hooves, squeals, and impact.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Goretusk. A horde can break almost anything in motion, but it needs fresh enemies before its weight turns back on itself. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.245.a:0 "Start da stampede."

 war_unique_intro_events.246.t:0 "Bloody Sunz Rising"
 war_unique_intro_events.246.d:0 "For Bloody Sunz, the age begins in danger. The Bloody Sunz paint the sky in their own heads before battle, convinced every dawn is just the world getting ready to watch them win.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Bloody Sunz. Confidence is good, but confidence without loot becomes shouting, and shouting without fighting makes the boyz suspicious. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.246.a:0 "Raise da bloody sun."

 war_unique_intro_events.247.t:0 "Bloody Handz Grab More"
 war_unique_intro_events.247.d:0 "For Bloody Handz, the age begins in danger. The Bloody Handz believe a thing belongs to whoever can hold it after the screaming stops.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Bloody Handz. Holding loot is harder than taking it when every other Greenskin thinks the same way. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.247.a:0 "Grab it bloody."

 war_unique_intro_events.248.t:0 "Ironback Won't Bend"
 war_unique_intro_events.248.d:0 "For Ironback, the age begins in danger. Ironback prides itself on not bending.\n\nThe Dark Land Orcs move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Blasted Wastes, there is no passive frontier for Ironback. Endurance wins respect only if it leads to someone else getting flattened, not if the tribe merely survives another insult. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.248.a:0 "Stand and shove."

 war_unique_intro_events.249.t:0 "Drippin Fang Ambush"
 war_unique_intro_events.249.d:0 "For Drippin Fangs, the age begins in danger. The Drippin Fangs know fear begins before the bite, when enemies see the wet shine on blades and start wondering what is dripping.\n\nThe Common Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Blasted Wastes, there is no passive frontier for Drippin Fangs. A sneaky tribe still needs trophies, and poison does not impress other mobs unless it leaves enough bodies to count. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.249.a:0 "Sink da fangs in."

 war_unique_intro_events.250.t:0 "Stonefangz Don't Chip"
 war_unique_intro_events.250.d:0 "For Stonefangz, the age begins in danger. The Stonefangz are stubborn in the way rocks are stubborn, except rocks do not usually charge downhill screaming about teef.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Southern Wastes, there is no passive frontier for Stone-Fangaz. Mountains breed hard mobs and harder grudges, but the tribe needs more than defensive pride if it wants bigger bosses to notice. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.250.a:0 "Bite through stone."

 war_unique_intro_events.251.t:0 "Tusked Sunz Charge"
 war_unique_intro_events.251.d:0 "For Tusked Sunz, the age begins in danger. The Tusked Sunz like their charges loud, bright, and hard to misunderstand.\n\nThe Dark Land Orcs move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Southern Wastes, there is no passive frontier for Tusked Sunz. A proud mob must prove the banners are more than decoration before rivals start using them as tents. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.251.a:0 "Show da tusks."

 war_unique_intro_events.252.t:0 "Moon Howlaz Under Da Bad Moon"
 war_unique_intro_events.252.d:0 "For Moon Howlaz, the age begins in danger. The Moon Howlaz listen for the Bad Moon in every dark sky, every shaman twitch, and every nervous noise enemies make after sunset.\n\nThe Common Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Southern Wastes, there is no passive frontier for Moon Howlaz. Omens are only useful if followed by stabbing, looting, and enough success to keep the shamans from being blamed afterward. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.252.a:0 "Howl at da moon."

 war_unique_intro_events.253.t:0 "Draken Boyz Ride Out"
 war_unique_intro_events.253.d:0 "For Draken Boyz, the age begins in danger. The Draken Boyz measure status by what a warrior can ride without being eaten first.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Blasted Wastes, there is no passive frontier for Draken Boyz. Big beasts impress the boyz, but they also eat supplies, handlers, and careless bosses unless the tribe keeps them pointed at enemies. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.253.a:0 "Ride da big beasts."

 war_unique_intro_events.254.t:0 "Ironclad Skullz March"
 war_unique_intro_events.254.d:0 "For Ironclad Skullz, the age begins in danger. The Ironclad Skullz like the sound of metal on metal, especially when one of the metals is wrapped around their own heads.\n\nThe Dark Land Orcs move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Blasted Wastes, there is no passive frontier for Ironclad Skulls. Armor makes a mob feel invincible, which is useful right until invincible boyz start testing each other instead of the enemy. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.254.a:0 "Clank into da scrap."

 war_unique_intro_events.255.t:0 "Backstabber's Best Crew"
 war_unique_intro_events.255.d:0 "For Gorduz Crew, the age begins in danger. Gorduz Backstabber knows survival under Chaos Dwarf masters requires good timing, useful cruelty, and a knife that can be blamed on someone else.\n\nThe Darklands Hobgoblin people move within the Hobgoblin cultural world, and public life is shaped by Hashut in court, shrine, camp, and market. Hashut demands fire, tyranny, and useful cruelty, turning industry and obedience into sacred acts.\n\nAcross the Blasted Wastes, there is no passive frontier for Gorduz Crew. Other Greenskins despise Hobgoblins, Dawi-Zharr trust only results, and every bargain lasts until a better one learns to smile. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.255.a:0 "Sell the sharpest knives."

 war_unique_intro_events.256.t:0 "Stone Stackaz Pile Up"
 war_unique_intro_events.256.d:0 "For Stone Stackaz, the age begins in danger. The Stone Stackaz like piles: stones, skulls, loot, broken doors, and enemies who stopped arguing after the second hit.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Stone Stackaz. A pile says this place is ours, but only a fight keeps other mobs from rearranging it. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.256.a:0 "Stack da stones higher."

 war_unique_intro_events.257.t:0 "Broken Chainz Loose"
 war_unique_intro_events.257.d:0 "For Broken Chainz, the age begins in danger. Broken Chainz remembers restraint as an insult.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Black Forest, there is no passive frontier for Broken Chainz. Freedom gives the mob a first roar, but a lasting WAAAGH needs enemies to blame before old grudges turn into new boss fights. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.257.a:0 "Break more chainz."

 war_unique_intro_events.258.t:0 "The Hobgobla Khan's Shadow"
 war_unique_intro_events.258.d:0 "For Hobgoblin Khanate, the age begins in danger. The Hobgoblin Khanate rides beneath the long shadow of the Hobgobla Khan, where wolf herds, camps, tribute, and ambushes all become tools of rule.\n\nThe Steppe Hobgoblin people move within the Hobgoblin cultural world, and public life is shaped by Hobgoblin shamanism in court, shrine, camp, and market. Their customs turn memory into discipline: old wounds become vows, present fear becomes purpose, and rule must sound like more than appetite or law.\n\nAcross the Eastern Steppes, there is no passive frontier for Hobgoblin Khaganate. A khanate survives by moving fast and punishing betrayal selectively enough that everyone still believes they might profit from the next one. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.258.a:0 "Cast the khans shadow."

 war_unique_intro_events.259.t:0 "Ironskull Argument"
 war_unique_intro_events.259.d:0 "For Ironskull, the age begins in danger. Ironskull treats debate as something best settled forehead-first.\n\nThe Dark Land Orcs move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Mountains of Mourn, there is no passive frontier for Ironskull. Hard heads win challenges, but the tribe needs someone to point those skulls toward enemies before the camp becomes the battlefield. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.259.a:0 "Win da argument."

 war_unique_intro_events.260.t:0 "Bloody Spearz Wall"
 war_unique_intro_events.260.d:0 "For Bloody Spearz, the age begins in danger. The Bloody Spearz have discovered that a pointy stick becomes funnier when many pointy sticks move in the same direction.\n\nThe Common Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the World's Edge Mountain, there is no passive frontier for Bloody Spearz. A spear wall is almost discipline, which makes some boyz suspicious, but everyone likes it better when enemies bounce off screaming. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.260.a:0 "Lower da spearz."

 war_unique_intro_events.261.t:0 "Skull Crag Echoes"
 war_unique_intro_events.261.d:0 "For Skull Crag, the age begins in danger. Skull Crag is a place where shouting comes back louder, which is useful for bosses, shamans, and anyone trying to make a pile of skulls sound official.\n\nThe Common Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Desolation of Nagash, there is no passive frontier for Skull Crags. A crag full of trophies can draw mobs together, but every new arrival expects a chance to test who owns the echo. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.261.a:0 "Make da crag shout."

 war_unique_intro_events.262.t:0 "Bonerattlaz Noise"
 war_unique_intro_events.262.d:0 "For Bonerattlaz, the age begins in danger. The Bonerattlaz rattle bones before battle because it scares enemies, excites the boyz, and gives the shamans something to blame if the first charge goes wrong.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Troll Country, there is no passive frontier for Bonerattlaz. Noise can gather a mob, but the mob must be sent somewhere useful before everyone starts rattling different bones. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.262.a:0 "Rattle da bones."

 war_unique_intro_events.263.t:0 "Blue Viper Strike"
 war_unique_intro_events.263.d:0 "For Blue Vipers, the age begins in danger. The Blue Vipers are proud of being noticed only after it is too late.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Creeping Jungle, there is no passive frontier for Blue Vipers. Ambush wins loot, but a tribe that never shows strength in daylight risks being treated as a nuisance rather than a boss mob. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.263.a:0 "Strike from da grass."

 war_unique_intro_events.264.t:0 "Arachnos Webs"
 war_unique_intro_events.264.d:0 "For Arachnos, the age begins in danger. Arachnos follows spider paths through roots, shadows, and sticky shrines where the unwary learn that forests can have too many legs.\n\nThe Desert Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Mangrove Coast, there is no passive frontier for Arachnos. The spider god gives fear and patience, but Greenskin mobs still demand noise, loot, and a reason not to eat the shaman. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.264.a:0 "Follow da spider paths."

 war_unique_intro_events.265.t:0 "LeafCutterz Clearin"
 war_unique_intro_events.265.d:0 "For LeafCutterz, the age begins in danger. The LeafCutterz know every leaf can hide a blade, a trap, or a goblin waiting for the funniest possible moment.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Plain of Tuskers, there is no passive frontier for Leaf Cutterz. The forest shelters the tribe, but shelter becomes a cage if the mob never cuts outward toward richer screams. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.265.a:0 "Cut a path."

 war_unique_intro_events.266.t:0 "SnakeEaterz Bite First"
 war_unique_intro_events.266.d:0 "For SnakeEaterz, the age begins in danger. The SnakeEaterz learned that some dangers stop being scary after they have been cooked, bitten, or worn as proof that the boss survived lunch.\n\nThe Forest Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross North Khuresh, there is no passive frontier for Snake Eaterz. Eating the frightening thing is good for morale, but the tribe needs larger prey if it wants other mobs to stop laughing. The first season will therefore matter more than its size suggests. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.266.a:0 "Eat da snake first."

 war_unique_intro_events.267.t:0 "Speaking Trees Shout Back"
 war_unique_intro_events.267.d:0 "For Speaking Trees, the age begins in danger. The Speaking Trees hear voices in the woods, which might be spirits, might be shamans, and might be goblins hiding badly.\n\nThe Forest Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross North Khuresh, there is no passive frontier for Speakin' Treez. A holy grove full of arguments needs victories before rival mobs decide the trees are talking nonsense. The first season will therefore matter more than its size suggests. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.267.a:0 "Make da trees shout."

 war_unique_intro_events.268.t:0 "Burning Face Warpaint"
 war_unique_intro_events.268.d:0 "For Burning Face, the age begins in danger. Burning Face understands that flames improve almost anything: banners, faces, enemy huts, and the speed with which smaller gits decide to obey.\n\nThe Fire Kobold people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Southern World Edge Mountains, there is no passive frontier for Red Cloud. Fire impresses the boyz, but a burning camp is only useful if it belongs to someone else. The first season will therefore matter more than its size suggests. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.268.a:0 "Light up da face."

 war_unique_intro_events.269.t:0 "Yellow Eye Sees It"
 war_unique_intro_events.269.d:0 "For Yellow Eye, the age begins in danger. Yellow Eye sees things other mobs miss: weak gates, scared guards, unlucky stars, and loose loot that clearly wants rescuing.\n\nThe Night Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the World's Edge Mountain, there is no passive frontier for Yellow Eye. Watching too long makes the boyz twitchy, and a twitchy mob usually finds something nearby to ruin. The first season will therefore matter more than its size suggests. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.269.a:0 "See it, nick it."

 war_unique_intro_events.270.t:0 "Da Greentide Rises"
 war_unique_intro_events.270.d:0 "For Greentide, the age begins in danger. The Greentide is what every nervous border fort fears when distant drums stop sounding like separate mobs and start sounding like weather.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Badlands, there is no passive frontier for Da Great Waagh. A tide this large cannot sit still. If it does not roll over enemies, it will roll backward through its own camps, bosses, and loot piles. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.270.a:0 "Let da tide roll."
 war_unique_intro_events.271.t:0 "Chariots of the Sunken Realm"
 war_unique_intro_events.271.d:0 "Tiranoc remembers the sea as both road and wound. Its chariot princes ride lands scarred by old catastrophe, where drowned provinces, broken coasts, and proud houses teach that glory can vanish beneath water as quickly as beneath war.\n\nThe Tiranoci people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Western Outer Ulthuan, there is no passive frontier for Tiranoc. The Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.271.a:0 "Harness the old roads."

 war_unique_intro_events.272.t:0 "The Watch in the Shadowlands"
 war_unique_intro_events.272.d:0 "The Shadowlands are Ulthuan after the candle has burned low. Nagarythe keeps watch where memory still tastes of betrayal, where Shadow Warriors vanish between stones, and where every rumor of Druchii movement sounds less like news than repetition.\n\nThe Nagarythi people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Western Outer Ulthuan, there is no passive frontier for Nagarythe. The Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.272.a:0 "Keep Nagarythe watchful."

 war_unique_intro_events.273.t:0 "Axes of Chrace"
 war_unique_intro_events.273.d:0 "Chrace is a kingdom of hard paths, white forests, and warriors who trust an axe more than a court promise. Its hunters know the passes by scent, scar, and silence, and its nobles remember that the Phoenix King survives because someone less polished stands between crown and claw.\n\nThe Chracian people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Eastern Outer Ulthuan, there is no passive frontier for Chrace. The Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.273.a:0 "Guard the mountain paths."

 war_unique_intro_events.274.t:0 "Masts of Cothique"
 war_unique_intro_events.274.d:0 "Cothique faces the sea with a sailor's patience and a prince's suspicion. Its harbors know fog, reefs, raiders, and the cold arithmetic of distance, where a single missed sail can become a burned shrine before Lothern hears the warning.\n\nThe Cothiq people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Eastern Outer Ulthuan, there is no passive frontier for Cothique. The Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.274.a:0 "Ready the sea guard."

 war_unique_intro_events.275.t:0 "The Mists of Yvresse"
 war_unique_intro_events.275.d:0 "Yvresse stands where mist turns vigilance into religion. Tor Yvresse remembers invasion, humiliation, and the long patience required to make a coast feel like a gate rather than an invitation.\n\nThe Yvressi people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Eastern Outer Ulthuan, there is no passive frontier for Yvresse. The Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.275.a:0 "Hold the misted gate."

 war_unique_intro_events.276.t:0 "Caledor's Sleeping Fire"
 war_unique_intro_events.276.d:0 "Caledor is older than most boasts and prouder than many kingdoms. Its princes live among dragon caves, ancient armor, and stories of fire that once decided the fate of worlds.\n\nThe Caledori people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Western Outer Ulthuan, there is no passive frontier for Caledor. The Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.276.a:0 "Wake the dragon pride."

 war_unique_intro_events.277.t:0 "Reavers of Ellyrion"
 war_unique_intro_events.277.d:0 "Ellyrion's open lands give Ulthuan something its courts often lack: speed. Reavers, messengers, nobles, and scouts cross grass and road before slower princes finish naming the crisis.\n\nThe Ellyrian people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross the Everqueen's Domain, there is no passive frontier for Ellyrion. The Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.277.a:0 "Ride for the island."

 war_unique_intro_events.278.t:0 "The Tower of Hoeth"
 war_unique_intro_events.278.d:0 "Saphery measures power in silence, ink, and words spoken only after lesser minds have finished panicking. The White Tower of Hoeth watches Ulthuan's fracture with the terrible calm of scholars who know too many precedents and not enough certainties.\n\nThe Sapherian people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Phoenix King's Domain, there is no passive frontier for Saphery. The Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.278.a:0 "Bind wisdom to duty."

 war_unique_intro_events.279.t:0 "The Ring Must Hold"
 war_unique_intro_events.279.d:0 "Ulthuan is not merely an island. It is the ring of mountains, the Vortex, the temples, the towers, the harbors, the forests, and the old confidence that the Asur were chosen to stand between the world and unmaking.\n\nThe Eatainian people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross the Land of Chill, there is no passive frontier for Ulthuan. The situation is tragic and delicate, so we must hold the ring together before every kingdom learns to call its own fear wisdom. If the island is to endure, tradition must become action rather than a museum of better centuries. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.279.a:0 "Hold the ring together."

 war_unique_intro_events.280.t:0 "Morathi's Northern Web"
 war_unique_intro_events.280.d:0 "Ghrond listens to the north with a sorceress's patience. Its towers gather omens from the wastes, secrets from noble beds, and prayers from cults that know better than to speak loudly until a patron has already won.\n\nThe Ghrondari people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Land of Chill, there is no passive frontier for Ghrond. Naggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.280.a:0 "Let Ghrond whisper."

 war_unique_intro_events.281.t:0 "Chains of Karond Kar"
 war_unique_intro_events.281.d:0 "Karond Kar is a harbor where screams are accounted for as carefully as cargo. Slave pens, beast cages, corsair quays, and noble ledgers all teach the same lesson: living things have value when they can be owned, broken, or sold.\n\nThe Karondi people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Black Forest, there is no passive frontier for Karond Kar. Naggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.281.a:0 "Fill the pens."

 war_unique_intro_events.282.t:0 "Altars of Har Ganeth"
 war_unique_intro_events.282.d:0 "Har Ganeth is a city of sacred blades, public death, and devotion that does not bother pretending to be gentle. The temples of Khaine teach that cruelty is most useful when made ceremonial, repeatable, and impossible to ignore.\n\nThe Ganethi people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Land of Chill, there is no passive frontier for Har Ganeth. Naggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.282.a:0 "Sharpen Khaine's altars."

 war_unique_intro_events.283.t:0 "The Black Crag Smiles"
 war_unique_intro_events.283.d:0 "Hag Graef rises from black stone with the manners of a court and the instincts of a knife. Its families speak in gifts, debts, marriages, insults, and assassinations, each one polished until murder can pass for etiquette.\n\nThe Graefi people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Black Forest, there is no passive frontier for Hag Graef. Naggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.283.a:0 "Count the hidden blades."

 war_unique_intro_events.284.t:0 "Hullwrights of Clar Karond"
 war_unique_intro_events.284.d:0 "Clar Karond looks at forests and sees fleets. Its docks smell of resin, blood, iron, and salt, while shipwrights measure every plank against the raids it may carry and every hull against the rivals it may humble.\n\nThe Clari people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Black Forest, there is no passive frontier for Clar Karond. The situation is cold, vicious, and full of opportunity, so we must launch the black hulls before richer cities decide who may rule the sea. If the great cities cannot be trusted, they can still be used. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.284.a:0 "Launch the black hulls."

 war_unique_intro_events.285.t:0 "Iron Under the Witch King's Shadow"
 war_unique_intro_events.285.d:0 "Naggarond is more than stone, iron, and cold splendor. It is the shape of the Witch King's will made urban, a capital where every noble smiles as if treason were a weather condition and every silence might be royal attention.\n\nThe Naggarondi people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Land of Chill, there is no passive frontier for Naggarond. Naggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.285.a:0 "Hold the iron capital."

 war_unique_intro_events.286.t:0 "Arnheim's White Wall"
 war_unique_intro_events.286.d:0 "Arnheim is a white scar on a dark coast, an Asur foothold where every stone seems to ask how long courage can stand so far from home. Naggaroth watches from the wilderness and the sea, patient as winter and twice as hungry.\n\nThe Colonial Asur people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross the Doom Glades, there is no passive frontier for Arnheim. Far from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.286.a:0 "Hold Arnheim's walls."

 war_unique_intro_events.287.t:0 "The Tower of Ssildra Tor"
 war_unique_intro_events.287.d:0 "Ssildra Tor stands like a threat that learned architecture. Too distant to rely on the grand cities and too proud to beg them for favor, its lords must make isolation into mystique and scarcity into discipline.\n\nThe Autarri people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Doom Glades, there is no passive frontier for S'sildra Tor. Naggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.287.a:0 "Keep the tower cruel."

 war_unique_intro_events.288.t:0 "Drackla's Cold Bargain"
 war_unique_intro_events.288.d:0 "Drackla begins without the comforting illusion that the great houses care whether it survives. That can be a weakness, or it can be freedom.\n\nThe Autarri people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Broken Lands, there is no passive frontier for Drackla. Naggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.288.a:0 "Make Drackla useful."

 war_unique_intro_events.289.t:0 "The Forgebound Oath"
 war_unique_intro_events.289.d:0 "The Forgebound understand that metal remembers the hand that shapes it. In their holds, craft is not humble work but controlled violence: blades, collars, locks, armor, hinges, and tools made to decide whose will becomes law.\n\nThe Autarri people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Black Forest, there is no passive frontier for Forgebound. Naggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.289.a:0 "Bind the forges."

 war_unique_intro_events.290.t:0 "Twin Shadows of the Forest"
 war_unique_intro_events.290.d:0 "Naestra and Arahan are a contradiction the forest accepts more easily than most courts accept truth. Mercy and fury, warning and arrow, patience and sudden violence ride together beneath the boughs, and Athel Loren has learned to hear one will in two voices.\n\nThe Asrai Elves move within the Wood Elves cultural world, and public life is shaped by Asrai spirit-faith in court, shrine, camp, and market. Asrai belief binds elf and spirit to the forest, where beauty and vengeance share the same roots.\n\nAcross the Doom Glades, there is no passive frontier for Witchwood. Around them, the wider world grows louder. High Elves fracture, Druchii sharpen old hatred, men quarrel, beasts gather, and Chaos presses against every boundary. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.290.a:0 "Guard the twilight boughs."

 war_unique_intro_events.291.t:0 "The Dawn Watch Endures"
 war_unique_intro_events.291.d:0 "The Fortress of Dawn was named by people who understood the value of light arriving on time. Its walls watch sea lanes, reefs, strange coasts, and the thin line between imperial duty and colonial loneliness.\n\nThe Colonial Asur people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross the Dawn's Light, there is no passive frontier for Fortress of Dawn. Far from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.291.a:0 "Raise the dawn signal."

 war_unique_intro_events.292.t:0 "Beacon of the Tower of the Sun"
 war_unique_intro_events.292.d:0 "The Tower of the Sun is a beacon before it is a court. Its light tells pilots where to turn, merchants where to trust, and raiders where Asur patience ends.\n\nThe Colonial Asur people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Eastern Colonies, there is no passive frontier for Tower of the Sun. Far from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.292.a:0 "Keep the beacon burning."

 war_unique_intro_events.293.t:0 "Star Charts of the Far Watch"
 war_unique_intro_events.293.d:0 "The Tower of the Stars reads the sky because the sea lies too often. Its scholars, pilots, and sea lords chart omens, currents, storms, and the movements of powers that believe distance hides ambition from Ulthuan.\n\nThe Colonial Asur people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross Eastern Colonies, there is no passive frontier for Tower of the Stars. Far from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.293.a:0 "Read the star routes."

 war_unique_intro_events.294.t:0 "Pearls of Elithis"
 war_unique_intro_events.294.d:0 "Elithis lies where letters arrive late, spices dry in guarded storehouses, pearls change hands under watchful eyes, and monsoon pilots know which promises survive bad weather. It is distant, but not provincial; isolated, but not small.\n\nThe Colonial Asur people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross the Isles of Elithis, there is no passive frontier for Elithis. Far from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.294.a:0 "Answer with the tide."

 war_unique_intro_events.295.t:0 "Calith's Far Harbor"
 war_unique_intro_events.295.d:0 "Calith survives by making distance legible. Every harbor light, ledger mark, signal flag, shrine rite, and disciplined patrol says that the Asur are still capable of order where maps grow uncertain.\n\nThe Colonial Asur people move within the Asur cultural world, and public life is shaped by Cadai worship in court, shrine, camp, and market. Cadai worship looks to ordered light, ancestral grace, and the high obligations of a people who still claim guardianship.\n\nAcross South Khuresh, there is no passive frontier for Calith. Far from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.295.a:0 "Keep Calith precise."

 war_unique_intro_events.296.t:0 "Black Sails of Spite"
 war_unique_intro_events.296.d:0 "The Corsairs of Spite have made a polity out of vengeance with rigging. Their captains elect, threaten, bribe, and murder with the same practical spirit, because a corsair republic is still Druchii society, only with more salt on the knife.\n\nThe Naggarondi people move within the Druchii cultural world, and public life is shaped by Cytharai devotion in court, shrine, camp, and market. Cytharai devotion gives cruelty, vengeance, and dark refinement a sacred edge.\n\nAcross the Borderlands, there is no passive frontier for Corsairs of Spite. Naggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.296.a:0 "Let spite sail."

 war_unique_intro_events.297.t:0 "Nocthyrion's Black Lanterns"
 war_unique_intro_events.297.d:0 "Nocthyrion is an Asur colony that learned to keep its lanterns shaded. Its ledgers, towers, and patrol routes still speak the language of Ulthuan, but its rites have gone nocturnal and its courts understand hunger in ways Lothern would refuse to name.\n\nThe Colonial Asur people move within the Asur cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Isles of Elithis, there is no passive frontier for Nocthyrion. Far from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.297.a:0 "Keep the night watch."
 war_unique_intro_events.298.t:0 "Sabreskin Takes the Pass"
 war_unique_intro_events.298.d:0 "Sabreskin holds the passes where caravans slow down and beasts leave good pelts behind. Their chiefs wear scars like ledgers, and every hide nailed over a gate tells visitors that coin, cattle, or flesh will be taken before the road opens.\n\nThe Firedrinker Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Sabreskin. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.298.a:0 "Skin the next beast."

 war_unique_intro_events.299.t:0 "Gutplates of Ironskin"
 war_unique_intro_events.299.d:0 "Ironskin believes a belly is only as honest as the plate strapped across it. Their camps ring with hammered metal, butcher chants, and boasts from bulls who think a good gutplate should stop a spear and announce its owner before he speaks.\n\nThe Irongut Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Ironskin. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.299.a:0 "Hammer the plates flat."

 war_unique_intro_events.300.t:0 "The Bulgers Want More"
 war_unique_intro_events.300.d:0 "The Bulgers are famous for wanting more even by Ogre standards. More cattle, more captives, more gnoblars, more room at the fire, more enemies foolish enough to bring lunch wrapped in armor.\n\nThe Irongut Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Bulgers. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.300.a:0 "Make room for more."

 war_unique_intro_events.301.t:0 "Loosetooth Contracts"
 war_unique_intro_events.301.d:0 "Loosetooth sells protection with a grin that promises nothing for free. Missing teeth, cracked tusks, and old caravan tallies hang beside the butcher fires, each one proof that debts here are remembered until something softer pays them.\n\nThe Irongut Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Loosetooth. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.301.a:0 "Bite on credit."

 war_unique_intro_events.302.t:0 "The Suneaters Swallow Fire"
 war_unique_intro_events.302.d:0 "The Suneaters tell rivals that even the sun is only a meal too bright to swallow quickly. Their camps prize scorched iron, red coals, fire-blackened meat, and butchers who claim the Great Maw's hunger can be heard in every flame.\n\nThe Firedrinker Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Suneaters. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.302.a:0 "Feed the sacred flame."

 war_unique_intro_events.303.t:0 "The Bloody Fist Collects"
 war_unique_intro_events.303.d:0 "The Bloody Fist does not argue when a punch will settle accounts. Its bosses mark treaties with smashed shields, broken noses, and red handprints on toll stones, because every neighbor understands a fist better than a parchment.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Bloody Fist. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.303.a:0 "Show them the fist."

 war_unique_intro_events.304.t:0 "Mountain Eaters at the Table"
 war_unique_intro_events.304.d:0 "The Mountain Eaters claim the peaks are just a meal too slow for lesser jaws. They chew slate for wagers, drag boulders into feast rings, and demand that any caravan crossing their slopes admit the mountain already belongs to them.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Mountain Eaters. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.304.a:0 "Bite the mountain."

 war_unique_intro_events.305.t:0 "Sons of the Mountain"
 war_unique_intro_events.305.d:0 "The Sons of the Mountain speak of the peaks as kin, not scenery. Their elders point to cliffs as if naming ancestors, while butchers smear blood into cracks and swear the stone remembers every tribe that tried to pass without tribute.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Sons of the Mountain. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.305.a:0 "Answer the stone."

 war_unique_intro_events.306.t:0 "Blood Guzzlers Feast"
 war_unique_intro_events.306.d:0 "The Blood Guzzlers do not wait for meat to cool before celebrating. Their feasts begin beside the bodies, their bowls are red before the first song, and their butchers say the Great Maw prefers courage served warm.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Blood Guzzlers. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.306.a:0 "Drink the victory red."

 war_unique_intro_events.307.t:0 "Lazargh on the Caravan Road"
 war_unique_intro_events.307.d:0 "Lazargh sits where the road learns caution. Cathayan bales, gnoblar carts, mule trains, and nervous merchants pass beneath Ogre eyes, and every guard captain knows the cheapest toll is the one paid before the bulls get bored.\n\nThe Cathayan Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Lazargh. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.307.a:0 "Tax the road in meat."

 war_unique_intro_events.308.t:0 "Feastmaster Calls the Table"
 war_unique_intro_events.308.d:0 "Feastmaster treats the table as a throne, altar, court, and battlefield. Chiefs who refuse a seat insult the Maw, chiefs who accept must survive the portions, and every course decides who leaves heavier, poorer, or not at all.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Feastmaster. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.308.a:0 "Set the biggest table."

 war_unique_intro_events.309.t:0 "Manbiters Smell Supper"
 war_unique_intro_events.309.d:0 "The Manbiters like enemies who run, bargain, pray, and fit into pots without being sawn apart first. Human towns, caravan guards, and border forts know the name as a warning that walls are only spice for patient hunger.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross Gnoblar Country, there is no passive frontier for Manbiters. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.309.a:0 "Find softer prey."

 war_unique_intro_events.310.t:0 "Treehammer Breaks the Green"
 war_unique_intro_events.310.d:0 "Treehammer sees forests as enemies standing too close together. Their bulls crack trunks for sport, drag whole trees back to camp as firewood trophies, and tell woodland spirits to stop hiding behind furniture.\n\nThe Fishguts Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross Gnoblar Country, there is no passive frontier for Treehammer. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.310.a:0 "Knock the forest down."

 war_unique_intro_events.311.t:0 "Boulderbellies Roll"
 war_unique_intro_events.311.d:0 "Boulderbellies decorate their camps with rocks too large for sensible people to move. They roll stones into enemy lines, carve feast marks into cliffs, and insist a full belly should land with the weight of a landslide.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross Gnoblar Country, there is no passive frontier for Boulderbellies. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.311.a:0 "Let the stones roll."

 war_unique_intro_events.312.t:0 "Skraggle Guts from the Wet Roads"
 war_unique_intro_events.312.d:0 "Skraggle Guts comes from roads that sink under the cart and laugh at clean boots. Their camps smell of wet hides, smoked fish, sour beer, and suspicious stew, while their scouts know where a loaded wagon slows before the ambush.\n\nThe Fishguts Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross Gnoblar Country, there is no passive frontier for Skraggle Guts. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.312.a:0 "Gut the wet road."

 war_unique_intro_events.313.t:0 "Death Toll at the Gate"
 war_unique_intro_events.313.d:0 "Death Toll takes its name seriously. A bell, skull pile, or hanging chain marks each crossing, and those who cannot pay are invited to settle the account in the one currency Ogres never refuse.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Death Toll. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.313.a:0 "Collect the toll."

 war_unique_intro_events.314.t:0 "Two Clubs, One Meal"
 war_unique_intro_events.314.d:0 "Crossed Clubs began as a warning sign and became a banner. Two bruiser bands, two old grudges, and one enormous appetite now stand over the same cooking pit, each pretending unity was their idea first.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Crossed Clubs. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.314.a:0 "Swing both clubs."

 war_unique_intro_events.315.t:0 "Fulg Wants a Bigger Pot"
 war_unique_intro_events.315.d:0 "Fulg is not the loudest name in the mountains, which makes its hunger more dangerous. Small camps learn quickly, quiet butchers listen carefully, and chiefs who laugh at Fulg's pot often end inside it.\n\nThe Irongut Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Fulg. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.315.a:0 "Fill the bigger pot."

 war_unique_intro_events.316.t:0 "Payswords for Hire"
 war_unique_intro_events.316.d:0 "The Payswords have learned that a sword rented before lunch can buy dinner twice. Their camps keep account marks beside butcher hooks, and every captain knows loyalty lasts longest when the next payment is visible.\n\nThe Wandering Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Borderlands, there is no passive frontier for Payswords. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.316.a:0 "Sell the appetite."

 war_unique_intro_events.317.t:0 "The Western Crucible"
 war_unique_intro_events.317.d:0 "The Western Provinces stand where Cathayan order is tested by dust, passes, caravan panic, and hungry powers beyond the walls. Their magistrates write in elegant script, but the ink dries beside garrison fires and road forts that know elegance alone cannot stop an Ogre charge.\n\nThe Iron Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Western Provinces, there is no passive frontier for Iron Court. Grand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.317.a:0 "Temper the west."

 war_unique_intro_events.318.t:0 "Ledgers of the Central Provinces"
 war_unique_intro_events.318.d:0 "The Central Provinces sit where Cathay measures itself. Granaries, tax offices, river towns, courier roads, and temple registers make the realm legible, but every ledger can become a weapon when the Dragon Throne is weak.\n\nThe Jade Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Central Provinces, there is no passive frontier for Jade Court. Cathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.318.a:0 "Balance the ledgers."

 war_unique_intro_events.319.t:0 "The Empty Dragon Throne"
 war_unique_intro_events.319.d:0 "The Imperial Provinces hold the capital, and therefore the argument over what Cathay still is. Wei-Jin's palaces, archives, gates, eunuch offices, ancestral tablets, and dragon banners all insist the empire endures, even when every province hears opportunity in the silence between decrees.\n\nThe Imperial Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Northern Provinces, there is no passive frontier for Celestial Regency. The Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.319.a:0 "Hold Wei-Jin together."

 war_unique_intro_events.320.t:0 "Burning Wind over the Marches"
 war_unique_intro_events.320.d:0 "The Burning Wind Nomads ride where Cathayan maps become warnings. Their banners move faster than memorials, their herds know wells the magistrates cannot pronounce, and their loyalty is watched by officials who still need their scouts.\n\nThe Peasant Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Southern Provinces, there is no passive frontier for Burning Wind. Grand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.320.a:0 "Ride the burning wind."

 war_unique_intro_events.321.t:0 "Wyrmkins at the Southern Gate"
 war_unique_intro_events.321.d:0 "The Wyrmkins claim closeness to scales, smoke, and old dragon rites that respectable courtiers prefer to regulate from a distance. Their shrines guard southern roads where Cathay touches jungles, seas, and rumors that do not fit inside imperial categories.\n\nThe Fire Cathayan people move within the Cathayan cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Eastern Provinces, there is no passive frontier for Wyrmkin. Grand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.321.a:0 "Name the dragon rites."

 war_unique_intro_events.322.t:0 "The Jade Custodians"
 war_unique_intro_events.322.d:0 "The Jade Custodians are entrusted with symbols that make lesser hands tremble. Seals, tablets, vault keys, court standards, and ritual obligations give them authority, but custody is only power if everyone agrees the guardian cannot be bypassed.\n\nThe Jade Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Central Provinces, there is no passive frontier for Jade Custodians. Cathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.322.a:0 "Guard the jade seal."

 war_unique_intro_events.323.t:0 "Nan-Yang Opens the Southern Sea"
 war_unique_intro_events.323.d:0 "Nan-Yang faces the southern sea with warehouses open and harbor chains ready. Spice winds, Indish wealth, Khureshi rumors, pirate sails, and elven island routes all touch its docks, making the coast both a treasury and a wound.\n\nThe Peasant Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Northern Provinces, there is no passive frontier for Nan-Yang. The Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.323.a:0 "Watch the southern sea."

 war_unique_intro_events.324.t:0 "Corpse-Junks of the Dead Flag"
 war_unique_intro_events.324.d:0 "The Dead Flag Fleet sails as a bad omen made practical. Corpse-junks creak through fog, drowned crews haul lines without breath, and captains who should have rotted years ago still read the southern currents by moonlight.\n\nThe Sea Cathayan people move within the Cathayan cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Northern Provinces, there is no passive frontier for Dead Flag Fleet. A fleet of the dead does not need the same bargains as mortal pirates. It needs harbors to frighten, charts to stolen wealth, corpses to crew the guns, and coastal trade centers where fear, plunder, and occult logistics can be made permanent. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
 war_unique_intro_events.324.a:0 "Raise the dead flags."

 war_unique_intro_events.325.t:0 "Dimmed Sunz under the Eclipse"
 war_unique_intro_events.325.d:0 "The Dimmed Sunz say the sky went dark because it wanted to watch them fight without being seen. Their bosses daub black suns on shields, shove shamans toward any omen that sounds useful, and raid with the certainty that daylight is for gits who need directions.\n\nThe Common Orc people move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Northern Provinces, there is no passive frontier for Dimmed Sunz. A tribe becomes dangerous when its bosses can aim the shouting outward. Shamans find omens in smoke, squigs, teeth, and headaches, while mobs of Orcs and Goblins decide that any road, fort, shrine, caravan, or neighbor is better after being hit. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.325.a:0 "Darken da road."

 war_unique_intro_events.326.t:0 "Ake Bows to Flame"
 war_unique_intro_events.326.d:0 "Ake kneels closest to the furnace glow. Its priests carry gem bowls across black stone, its warriors test courage beneath smoking ridges, and every clan argument eventually asks whether the dragon above the vents is sleeping, listening, or hungry.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Dragon Isles, there is no passive frontier for Ake. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.326.a:0 "Send the gem tribute."

 war_unique_intro_events.327.t:0 "Axiu and the Clutch Roads"
 war_unique_intro_events.327.d:0 "Axiu controls paths where eggs, tribute, pilgrims, and armed escorts move between shrines. The roads are narrow, the tempers are not, and every brood-chief knows that a single insult near a clutch can become a war with wings above it.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Dragon Isles, there is no passive frontier for Axiu. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.327.a:0 "Guard the clutch roads."

 war_unique_intro_events.328.t:0 "Chotekasabe's Sunlit Ash"
 war_unique_intro_events.328.d:0 "Chotekasabe raises banners where sunlight catches ash and makes it look briefly like gold. Its priests speak of Chotec in half-remembered names, while dragon cults answer that the truer sun is the furnace under a waking wyrm.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Dragon Isles, there is no passive frontier for Chotekasabe. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.328.a:0 "Raise the ash banners."

 war_unique_intro_events.329.t:0 "Cocomara's Gem Altar"
 war_unique_intro_events.329.d:0 "Cocomara's altar counts gems the way other realms count soldiers. Rubies, sapphires, obsidian mirrors, and jade offerings move through temple hands, and every stone is weighed against the question of which dragon might wake for it.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Dragon Isles, there is no passive frontier for Cocomara. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.329.a:0 "Count the bright stones."

 war_unique_intro_events.330.t:0 "Dzi's Borrowed Balance"
 war_unique_intro_events.330.d:0 "Dzi has learned to weigh scale against jade. Cathayan envoys admire its rituals when they resemble proper hierarchy, while older island priests mutter that imported manners mean little if a dragon decides the altar court smells weak.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Dragon Isles, there is no passive frontier for Dzi. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.330.a:0 "Balance scale and jade."

 war_unique_intro_events.331.t:0 "Hoka's Thousand Offerings"
 war_unique_intro_events.331.d:0 "Hoka is crowded with shrines that all insist their offering is the one dragons notice. Priests argue over incense, gems, captives, fish, feathers, heart-blood, and old stone names, while warriors wait to learn which quarrel has become law.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross the Dragon Isles, there is no passive frontier for Hoka. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.331.a:0 "Let every shrine pay."

 war_unique_intro_events.332.t:0 "Ho-ko's Jade Shrine"
 war_unique_intro_events.332.d:0 "Ho-ko guards a jade shrine whose polish reflects too many claimants. Dragon priests, clan elders, blood-monks, and ambitious kin all say they know what the shrine demands, which is usually obedience from everyone else.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Dragon Isles, there is no passive frontier for Ho-Ko. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.332.a:0 "Bind the jade shrine."

 war_unique_intro_events.333.t:0 "Moki's Mountain Bell"
 war_unique_intro_events.333.d:0 "Moki's mountain bell is rung for eruption, invasion, tribute processions, and dragons that move in their sleep. No one agrees which sound is most dangerous, but every village knows to grab spear, gem, child, or priest when the bronze voice rolls down the slopes.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Dragon Isles, there is no passive frontier for Moki. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.333.a:0 "Ring the mountain bell."

 war_unique_intro_events.334.t:0 "Oka beneath the Wing Shadow"
 war_unique_intro_events.334.d:0 "Oka lives under a wing-shadow that changes the mood of every moot. Fields, docks, temples, and barracks all pause when scales pass over the sun, because no order carries as much weight as the possibility of claws.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Dragon Isles, there is no passive frontier for Oka. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.334.a:0 "Hold the wing-shadow."

 war_unique_intro_events.335.t:0 "Tlaxeda's Two Harmonies"
 war_unique_intro_events.335.d:0 "Tlaxeda remembers older patterns more clearly than many neighbors, though memory here is cracked and overgrown. Geometric rites, spawning pools, and ancient plaques sit beside dragon masks and gem sacrifices, each tradition insisting the other is incomplete.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Dragon Isles, there is no passive frontier for Tlaxeda. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.335.a:0 "Join the two rites."

 war_unique_intro_events.336.t:0 "Togamo's Obsidian Blood-Law"
 war_unique_intro_events.336.d:0 "Togamo writes law on obsidian and expects the edge to be noticed. Its warriors prize discipline, trial combats, hostage rites, and punishments performed where shrine steps can see them, because ceremony is easier to obey when it can cut.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Dragon Isles, there is no passive frontier for Togamo. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.336.a:0 "Sharpen the blood-law."

 war_unique_intro_events.337.t:0 "Usuji's Old Gods"
 war_unique_intro_events.337.d:0 "Usuji keeps offerings for gods whose names arrive broken from the deep past. Some shrines face dragons, others face stars, pools, stones, or silent plaques, and the priests insist contradiction is only a problem for those without enough altars.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross the Dragon Isles, there is no passive frontier for Usuji. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.337.a:0 "Count the old offerings."

 war_unique_intro_events.338.t:0 "Xiumazu's Green Fire"
 war_unique_intro_events.338.d:0 "Xiumazu's green fire burns in vents that make even veteran priests lower their voices. Some call it dragon breath trapped underground, others call it an Old One sign, and practical brood-chiefs ask only whether it can frighten enemies.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nAcross the Dragon Isles, there is no passive frontier for Xiumazu. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.338.a:0 "Wake the green fire."

 war_unique_intro_events.339.t:0 "Li's Balanced Tribute"
 war_unique_intro_events.339.d:0 "Li survives by knowing the exact weight of a respectful gift. Too few gems insult the dragon, too many invite a stronger clan to ask where they came from, and the best tribute is often the one that buys silence from three rivals at once.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Dragon Isles, there is no passive frontier for Li. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.339.a:0 "Weigh the tribute bowls."

 war_unique_intro_events.340.t:0 "Sauk's Red Scale"
 war_unique_intro_events.340.d:0 "Sauk paints its standards red because subtle warnings are for softer courts. Its warriors prize fury, blood-hot oaths, and dragon masks with too many teeth, while older priests worry that rage offered upward may return downward first.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross the Dragon Isles, there is no passive frontier for Sauk. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.340.a:0 "Chain the red fury."

 war_unique_intro_events.341.t:0 "Sonaka's Harbor Shrines"
 war_unique_intro_events.341.d:0 "Sonaka marks its harbor stones with claw signs, tide prayers, and gem dust. Boats from the River Ruin, island fishermen, raiders, and shrine barges all pass under those marks, hoping the dragons care enough to protect the harbor but not enough to visit it.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross the Dragon Isles, there is no passive frontier for Sonaka. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.341.a:0 "Mark the harbor stones."

 war_unique_intro_events.342.t:0 "Izu's Mist-Fangs"
 war_unique_intro_events.342.d:0 "Izu hides behind mist that makes every approach feel like trespass. Bone charms hang from shrine gates, scouts move by memory, and visiting envoys leave unsure whether they were honored, threatened, or deliberately lost.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Dragon Isles, there is no passive frontier for Izu. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.342.a:0 "Set the mist-fangs."

 war_unique_intro_events.343.t:0 "Otogo's Rooted Ash"
 war_unique_intro_events.343.d:0 "Otogo's ash fields are not dead ground; they are soil waiting for the next command. Roots grip black earth, shrines smoke after rain, and priests say the dragons prefer tribute from clans that can make life return after fire.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nAcross the Dragon Isles, there is no passive frontier for Imazi. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.343.a:0 "Root the ash rites."

 war_unique_intro_events.344.t:0 "Da Kingdoms Get Hungry"
 war_unique_intro_events.344.d:0 "The Ogre Kingdoms are a plural thing because no single tyrant has yet eaten enough rivals to make the grammar behave. Tyrants, butchers, maneaters, gnoblars, toll chiefs, and mercenary bosses all crowd the mountains, each convinced the Great Maw has left the biggest portion for them.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Ogre Kingdoms. Beyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.344.a:0 "Let the kingdoms eat."

 war_unique_intro_events.345.t:0 "Osterlund's Wolf March"
 war_unique_intro_events.345.d:0 "Osterlund stands where Imperial order grows cold hands. Wolf-priests, road wardens, burghers, foresters, and stubborn nobles keep watch over marches that know the sound of raiders before they know the comfort of courtly approval.\n\nThe Middenlander people move within the Imperial cultural world, and public life is shaped by Ulrican faith in court, shrine, camp, and market. Ulrican faith prizes winter courage, hard judgment, and the honor of standing firm when comfort fails.\n\nAcross the North Empire Provinces, there is no passive frontier for Osterlund. The Empire is a bargain between faith, law, steel, gunpowder, river towns, stubborn provinces, and men who know the dark will not wait for perfect unity. Every elector, priest, burgher, captain, and road warden serves mankind best when discipline outlives argument. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.345.a:0 "Hold the wolf march."

 war_unique_intro_events.346.t:0 "The Thousand Temples of Ind"
 war_unique_intro_events.346.d:0 "Ind is older, richer, and more crowded than most outsiders can comfortably imagine. Its cities rise around sacred rivers, spice markets, jewel courts, elephant roads, tiger-haunted forests, and temples whose gods are generous only when properly feared.\n\nThe North Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Ind. Ind is ancient, crowded, sacred, wealthy, and dangerous in ways that make foreign maps look childish. Massive temples, jeweled courts, spice roads, elephant yards, sacred rivers, monsoon ports, and tiger-haunted jungles all belong to a civilization older than many northern myths. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.346.a:0 "Let the cities endure."

 war_unique_intro_events.347.t:0 "The Dragon Empire Must Endure"
 war_unique_intro_events.347.d:0 "Grand Cathay is not merely a country; it is the claim that the world can still be arranged correctly. Dragon banners, magistrate seals, caravan bells, ancestral rites, city walls, and celestial charts all point toward order, even when the empire's provinces pull like silk in rival hands.\n\nThe Imperial Cathayan people move within the Cathayan cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross the Northern Provinces, there is no passive frontier for Grand Cathay. The Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure. To endure, it must make the region remember its name before larger powers write the next chapter.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.347.a:0 "Restore celestial order."
 war_unique_intro_events.348.t:0 "The Black Fur Musters"
 war_unique_intro_events.348.d:0 "Clan Rictus wears black fur like a claim to rule. Its Stormvermin shove lesser rats aside, its warlords sell discipline as terror, and its merchants count every insult from Clan Mors as a debt to be repaid in stolen tunnels.\n\nThe Rictus Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Wastes, there is no passive frontier for Clan Rictus. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.348.a:0 "Muster the black-fur packs."

 war_unique_intro_events.349.t:0 "Bait Pits of Krizzor"
 war_unique_intro_events.349.d:0 "Clan Krizzor knows that every monster has a hunger, and every hunger can be pointed. Pig-blood pits, slave lures, Moulder specimen cages, and Dark Lands trap warrens give its packmasters a business that smells like fear.\n\nThe Krizzor Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Wastes, there is no passive frontier for Clan Krizzor. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.349.a:0 "Open the bait pits."

 war_unique_intro_events.350.t:0 "The Torrent-Gates of Zhufbar"
 war_unique_intro_events.350.d:0 "Zhufbar is the sound of falling water put to work. The Torrent-Gates thunder beside drop-hammers, guild engines, cannon foundries, and machine shops whose masters believe a problem not solved by craft has not yet been properly measured.\n\nThe Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the World's Edge Mountain, there is no passive frontier for Zhufbar. Every neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.350.a:0 "Set the waterwheels turning."

 war_unique_intro_events.351.t:0 "Horns of the Black Mountains"
 war_unique_intro_events.351.d:0 "Karak Hirn is the Hornhold, a younger hold by Dawi memory but no less stubborn for it. Its horns carry warnings across the Black Mountains, its overroads draw merchants from Tilea and the Empire, and its smiths arm clans who know every pass can become a battlefield.\n\nThe Drazh Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Black Mountains, there is no passive frontier for Karak Hirn. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.351.a:0 "Sound the Hornhold."

 war_unique_intro_events.352.t:0 "Bilge-Rats of Clan Skurvy"
 war_unique_intro_events.352.d:0 "Clan Skurvy has learned that ships are just floating warrens with better plunder. Its bilge-rats chew through hulls, whisper to mutineers, sell wet loot twice, and swear that the Horned Rat approves of any sea-lane that ends in squealing panic.\n\nThe Skurvy Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Warrens, there is no passive frontier for Clan Skurvy. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.352.a:0 "Gnaw the sea-lanes."

 war_unique_intro_events.353.t:0 "Stolen Forges of Ferrik"
 war_unique_intro_events.353.d:0 "Clan Ferrik squats over stolen forges and calls theft industry. Dwarf slaves drag ore, Skryre envoys buy metal with suspicious smiles, and steel-masked warlords promise that iron is better than courage because it can be hammered onto cowards.\n\nThe Ferrik Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Wastes, there is no passive frontier for Clan Ferrik. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.353.a:0 "Feed the stolen forges."

 war_unique_intro_events.354.t:0 "Sparks under Foul Peak"
 war_unique_intro_events.354.d:0 "Clan Ektrik trusts sparks more than promises, which is sensible for Skaven. Bronze armor hums in its tunnels, slave-for-warpcraft pacts feed Foul Peak workshops, and every apprentice learns that a live test subject is only a dead one waiting for data.\n\nThe Skryre Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Wastes, there is no passive frontier for Clan Ektrik. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.354.a:0 "Charge the warp-sparks."

 war_unique_intro_events.355.t:0 "The Rot of Karak Gnol"
 war_unique_intro_events.355.d:0 "Clan Fester keeps sacred memories in pus, rot, and old stories of the Black Death. Its monks bless fever, its warriors cough like drums, and the ruins of Karak Gnol provide stones dark enough to make disease feel like inheritance.\n\nThe Pestilens Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Wastes, there is no passive frontier for Clan Fester. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.355.a:0 "Spread the blessed rot."

 war_unique_intro_events.356.t:0 "Scrap Kings of the Middenheap"
 war_unique_intro_events.356.d:0 "Clan Skrapp can build a kingdom from refuse if given enough nails and panic. Middenheap markets, scavenged gears, bone bribes, back-tunnel informants, and clawpacks cheap enough to spend twice give its bosses a talent for ugly usefulness.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Wastes, there is no passive frontier for Clan Skrapp. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.356.a:0 "Count the scrap twice."

 war_unique_intro_events.357.t:0 "Thunderhorns of Karak Grom"
 war_unique_intro_events.357.d:0 "Karak Grom answers danger with horns deep enough to make stone remember. Its Vault roads carry wardens, caravans, and grudges between high gates, while oath-halls beneath the echoes keep every clan mindful that silence is rarely good news.\n\nThe Vault Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Vaults, there is no passive frontier for Karak Grom. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.357.a:0 "Answer the thunderhorns."

 war_unique_intro_events.358.t:0 "Copper Mountain Holds"
 war_unique_intro_events.358.d:0 "Karak Izor, the Copper Mountain, stands as the proudest of the western holds. Copper veins, refugee lineages, royal authority, and Vault Underway works all run through its halls, where every ingot is both trade good and promise of another cannon.\n\nThe Vault Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Vaults, there is no passive frontier for Karak Izor. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.358.a:0 "Guard the copper halls."

 war_unique_intro_events.359.t:0 "Whispering Aspen Mountain"
 war_unique_intro_events.359.d:0 "Karak Eksfilaz listens to leaves as carefully as ledgers. From Whispering Aspen Mountain, its merchants and crossbow galleries watch the western roads toward Tilea, where caravans bring profit, rumors, and trouble wearing polite boots.\n\nThe Vault Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Vaults, there is no passive frontier for Karak Eksfilaz. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.359.a:0 "Watch the western road."

 war_unique_intro_events.360.t:0 "Marble Layers of the High Hold"
 war_unique_intro_events.360.d:0 "Karak Kaferkammaz rises higher than comfort and claims that height as virtue. Marble layers, ore seams, metalworkers, shrine-cutters, and high-hold hammerers carve strength from a mountain where breath is thin and pride is not.\n\nThe Vault Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Vaults, there is no passive frontier for Karak Kaferkammaz. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.360.a:0 "Hold the marble heights."

 war_unique_intro_events.361.t:0 "The Red Eye Opens"
 war_unique_intro_events.361.d:0 "The Red Eye hides in old Dwarf stone and laughs in the dark. Night Goblins daub red signs over stolen gates, brew fungus stink in side tunnels, and raid toward the eastern Empire whenever the Bad Moon looks like it wants entertainment.\n\nThe Night Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the World's Edge Mountain, there is no passive frontier for Red Eye. A tribe becomes dangerous when its bosses can aim the shouting outward. Shamans find omens in smoke, squigs, teeth, mushrooms, and headaches, while mobs of Orcs and Goblins decide that any road, fort, shrine, caravan, or neighbor is better after being hit. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.361.a:0 "Daub the eye red."

 war_unique_intro_events.362.t:0 "Gritus in the Jungle Warrens"
 war_unique_intro_events.362.d:0 "Clan Gritus smells opportunity through jungle steam. Its warrens creep along the isthmus, weaker clans vanish into its ledgers, and Lustrian spoil routes carry gold, stone tablets, feathers, and lies back to bosses who call scavenging strategy.\n\nThe Gritus Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the World's Edge Mountain, there is no passive frontier for Clan Gritus. Yes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.362.a:0 "Snatch the green spoils."

 war_unique_intro_events.363.t:0 "Mercenary Rats of Mange"
 war_unique_intro_events.363.d:0 "Clan Mange treats loyalty as a contract written on meat and revised after payment. Mangy veterans, hireling clawpacks, contract warrens, and bone-pay ledgers keep its warriors marching for whichever patron seems least likely to survive the invoice.\n\nThe Mange Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Jotunheim-Gianthome Mountains, there is no passive frontier for Clan Mange. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.363.a:0 "Sell the next swarm."

 war_unique_intro_events.364.t:0 "The Barren Hold Endures"
 war_unique_intro_events.364.d:0 "Karak Norn watches the forest from stony heights where the earth gives little without argument. Hadora Ironpick's legacy, Grey Mountain mines, New Bugman's Brewery, and dour shieldwalls bind a hold that has learned to prosper without pretending the world is kind.\n\nThe Grey Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Grey Mountains, there is no passive frontier for Karak Norn. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.364.a:0 "Hold above the forest."

 war_unique_intro_events.365.t:0 "Iron Peak of Karak Azul"
 war_unique_intro_events.365.d:0 "Karak Azul is the Iron Peak, and it intends everyone to remember why. Its plateaus hold rich veins, weaponsmiths, runesmiths, ledgers, and armories whose work can decide wars before the first insult is properly recorded.\n\nThe Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Southern World Edge Mountains, there is no passive frontier for Karak Azul. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.365.a:0 "Stoke the Iron Peak."

 war_unique_intro_events.366.t:0 "Ash-Warrens of Clan Volkn"
 war_unique_intro_events.366.d:0 "Clan Volkn lives where other rats cough, burn, and die. Ash warrens, hot stone tunnels, flame rites, and fire-hardened clawpacks give its bosses the confidence of creatures who think lava is only bad footing for weaker paws.\n\nThe Volkn Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern World Edge Mountains, there is no passive frontier for Clan Volkn. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.366.a:0 "Run through the lava-dark."

 war_unique_intro_events.367.t:0 "Red Discipline of Clan Mors"
 war_unique_intro_events.367.d:0 "Clan Mors is frightening because it can almost be trusted by Skaven standards. Red banners, hard-drilled clawpacks, Stormvermin pride, and warlords who punish failure before betrayal make its rivals whisper that order itself has learned to squeak.\n\nThe Mors Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross Skavenblight, there is no passive frontier for Clan Mors. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.367.a:0 "Drive the red swarms."

 war_unique_intro_events.368.t:0 "Knives of Clan Eshin"
 war_unique_intro_events.368.d:0 "Clan Eshin learned patience in distant shadows and returned with knives quieter than Skaven politics should allow. Night runners, gutter runners, contract killers, stolen plans, and masked masters make its warrens valuable to every lord who claims not to fear them.\n\nThe Eshin Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross Skavenblight, there is no passive frontier for Clan Eshin. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.368.a:0 "Vanish before dawn."

 war_unique_intro_events.369.t:0 "Blackbelly Fever Contracts"
 war_unique_intro_events.369.d:0 "Clan Morbidus knows disease is better when someone else pays for delivery. Blackbelly Fever, Moulder pox-beasts, plague contracts, and contaminated Grey Mountain routes let its brokers sell misery as if it were any other useful service.\n\nThe Pestilens Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Vaults, there is no passive frontier for Clan Morbidus. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.369.a:0 "Sell the fever."

 war_unique_intro_events.370.t:0 "Corpse Markets of Carrion"
 war_unique_intro_events.370.d:0 "Clan Carrion follows battles the way merchants follow fairs. Corpse heaps, bone carts, vulture signs, scavenger clawpacks, and afterbattle informants teach its bosses that the dead are quiet customers but excellent suppliers.\n\nThe Carrion Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern World Edge Mountains, there is no passive frontier for Clan Carrion. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.370.a:0 "Strip the dead fast."

 war_unique_intro_events.371.t:0 "Scab-Fur Warrens"
 war_unique_intro_events.371.d:0 "Clan Skab does not need elegance when it has bodies. Scab-fur clawpacks, skinflint quartermasters, scratch tunnels, and boss-claw bullying keep the warrens moving by reminding every rat that someone worse is behind him.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Grey Mountains, there is no passive frontier for Clan Skab. The Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.371.a:0 "Push the scab swarms."

 war_unique_intro_events.372.t:0 "Thirteen Ledgers of Scruten"
 war_unique_intro_events.372.d:0 "Clan Scruten counts everything, especially secrets. Its tunnel auditors, blackmail ledgers, informant clawpacks, and suspicious scribes know that a knife is useful once, but a document can stab forever if copied thirteen times.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Vaults, there is no passive frontier for Clan Scruten. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.372.a:0 "Audit the knives."

 war_unique_intro_events.373.t:0 "Crooked Tails in the Waste"
 war_unique_intro_events.373.d:0 "Clan Crooktail calls mutation favor because the alternative is admitting the tail should not bend that way. Warpstone-choked warrens, northern waste scars, tainted envoys, and frenzied clawpacks make its deformities both theology and threat.\n\nThe Crooktail Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Vaults, there is no passive frontier for Clan Crooktail. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.373.a:0 "Bless the crooked tail."

 war_unique_intro_events.374.t:0 "Skull Masks in the Dark"
 war_unique_intro_events.374.d:0 "Clan Skully pays in bone tokens and collects in silence. Skull-masked night runners, Eshin murder contracts, backstabber clawpacks, and vanishing tunnels let its killers appear as rumor, blade, and empty space in exactly that order.\n\nThe Eshin Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Warrens, there is no passive frontier for Clan Skully. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.374.a:0 "Take the bone-token."

 war_unique_intro_events.375.t:0 "First Hold of the South"
 war_unique_intro_events.375.d:0 "Karak Zorn is a name older than many grudges and lonelier than most songs admit. Southland jungle presses against ancient gates, lost veins glitter under roots, and ancestor oaths survive in halls that the northern Karaz Ankor half remembers as legend.\n\nThe South Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Southern World Edge Mountains, there is no passive frontier for Karak Zorn. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.375.a:0 "Keep Zorn awake."

 war_unique_intro_events.376.t:0 "Belegar's Bitter Road"
 war_unique_intro_events.376.d:0 "Clan Angrund lives with Karak Eight Peaks like a wound that learned to speak. Belegar Ironhammer's claim, King Lunn's memory, exile camps, Ironbreaker veterans, and maps of the City of Pillars make every march a lawsuit written in axes.\n\nThe Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross Karak Eight Peaks, there is no passive frontier for Clan Angrund. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.376.a:0 "March for the Eight Peaks."

 war_unique_intro_events.377.t:0 "Headtaker's Red Guard"
 war_unique_intro_events.377.d:0 "Queek Headtaker does not need subtlety when trophies explain him so well. His Red Guard, kill-routes, head racks, and disciplined Mors auxiliaries make every tunnel near Karak Eight Peaks feel like a corridor leading to someone else's skull.\n\nThe Mors Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross Karak Eight Peaks, there is no passive frontier for Queek's Legion. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.377.a:0 "Take heads for Queek."

 war_unique_intro_events.378.t:0 "Queen of the Silver Depths"
 war_unique_intro_events.378.d:0 "Karak Eight Peaks is not a hold so much as a war that learned architecture. The Queen of the Silver Depths still shines beneath ruin, but Skaven gnaw below, Goblins mock above, and Dwarf claimants measure every hall against what was stolen.\n\nThe Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nNo place within Karak Eight Peaks is passive. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.378.a:0 "Reclaim every hall."

 war_unique_intro_events.379.t:0 "Spike-Fungus Warrens"
 war_unique_intro_events.379.d:0 "Clan Skrittlespike has lived in the deep long enough to make darkness provincial. Spike-fungus warrens, deadfalls, stoneblind tunnel law, and rare surface bargains keep its rats strange, cautious, and extremely proud of traps no visitor survives to criticize.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Warrens, there is no passive frontier for Clan Skrittlespike. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.379.a:0 "Set the deep spikes."

 war_unique_intro_events.380.t:0 "Bone Armor of Mordkin"
 war_unique_intro_events.380.d:0 "Clan Mordkin hates the dead because they do not squeal properly. Bone-armored Stormvermin, corpse-warren tithes, Fellblade legends, and necropolis informants make its warriors stalk graves with a mixture of terror, envy, and professional interest.\n\nThe Mordkin Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern World Edge Mountains, there is no passive frontier for Clan Mordkin. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.380.a:0 "Rattle the dead-things."

 war_unique_intro_events.381.t:0 "Green Brands of Grutnik"
 war_unique_intro_events.381.d:0 "Clan Grutnik owns enough green glow to make greed look religious. Warpstone deposits, branded miners, Skryre buyers, Moulder buyers, toxic armor, and paid diggers make its tunnels rich, unstable, and popular with exactly the wrong visitors.\n\nThe Grutnik Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross Karak Eight Peaks, there is no passive frontier for Clan Grutnik. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.381.a:0 "Sell the green glow."

 war_unique_intro_events.382.t:0 "Endless Verms"
 war_unique_intro_events.382.d:0 "Clan Verms is what happens when numbers become an argument. Breeding warrens, refuse tolls, gnawhole quartermasters, sewer-scent envoys, and clawpacks without obvious end give its bosses a beautiful answer to every tactical question: more rats.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the World's Edge Mountain, there is no passive frontier for Clan Verms. Yes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.382.a:0 "Drown them in rats."

 war_unique_intro_events.383.t:0 "Lord Skrolk's Procession"
 war_unique_intro_events.383.d:0 "Lord Skrolk's procession is a sermon delivered by coughing, bells, and death. Plague monks, censer-bearer clouds, the Liber Bubonicus, and rotten tribute trains follow him through Lustria like a holy argument against clean air.\n\nThe Pestilens Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Warrens, there is no passive frontier for Skrolk Warband. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.383.a:0 "Swing the plague censer."

 war_unique_intro_events.384.t:0 "Red Auxiliaries of Vrrtkin"
 war_unique_intro_events.384.d:0 "Clan Vrrtkin has learned from Clan Mors that discipline is just fear with a schedule. Red-clan auxiliaries, drill warrens, supply gnawholes, and Stormvermin aspirants keep its swarms moving toward Karak Eight Peaks with unusual purpose.\n\nThe Mors Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross Karak Eight Peaks, there is no passive frontier for Clan Vrrtkin. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.384.a:0 "Push until they squeal."

 war_unique_intro_events.385.t:0 "Hooked Blades of Klaw"
 war_unique_intro_events.385.d:0 "Clan Klaw names subtlety only so it can bite the word. Hooked weapons, claw racks, grapple packs, boss-claw duels, and scratch-forges make its warrens a place where status is counted in scars left on other bodies.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross Karak Eight Peaks, there is no passive frontier for Clan Klaw. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.385.a:0 "Hang the claw-rack."

 war_unique_intro_events.386.t:0 "Treaties of Treachery"
 war_unique_intro_events.386.d:0 "Clan Treecherik believes a treaty is an ambush that learned calligraphy. False scribes, blackmail tolls, stab-later storehouses, and treachery rites let its envoys smile just long enough for the other side to relax.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern Warrens, there is no passive frontier for Clan Treecherik. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.386.a:0 "Sign, smile, stab."

 war_unique_intro_events.387.t:0 "Vats of Clan Flem"
 war_unique_intro_events.387.d:0 "Clan Flem has turned mucus into infrastructure. Phlegm-vats bubble under its warrens, spittle-censer priests bless choking clouds, and disgusting envoys prove that some negotiations end because the other side cannot bear to continue breathing.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the World's Edge Mountain, there is no passive frontier for Clan Flem. Yes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.387.a:0 "Bubble the phlegm-vats."

 war_unique_intro_events.388.t:0 "Blackened Limb Tokens"
 war_unique_intro_events.388.d:0 "Gangrous teaches its rats that pain is a luxury for creatures with healthy nerves. Blackened limb tokens, rot-tax surgeons, gangrene pit cults, and numb clawpacks make a warband that keeps marching after sensible bodies would resign.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross the Southern World Edge Mountains, there is no passive frontier for Gangrous. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.388.a:0 "March on numb legs."

 war_unique_intro_events.389.t:0 "Blood beneath the Ice"
 war_unique_intro_events.389.d:0 "The Frozen Expedition went north seeking stone, ore, and answers, then found a curse patient enough to wait under ice. Pale Dawi still keep ledgers, frost-sealed grudgebooks, and blood-iron storehouses, but night has become a practical part of the watch rotation.\n\nThe Lost Dwarf people move within the Dwarfen cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Broken Lands, there is no passive frontier for Frozen Expedition. Then came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.389.a:0 "Read the frost-grudges."

 war_unique_intro_events.390.t:0 "The Age of Fire and Chains"
 war_unique_intro_events.390.d:0 "Dhrath-Zharr-Ankor is the dream of the Dawi-Zharr written in smoke. Hashut's priests, infernal guard, engine forges, slave pens, black ziggurats, and molten canals all point toward an empire where obedience is measured by production and pain.\n\nThe Dawi Zharr people move within the Chaos Dwarf cultural world, and public life is shaped by Hashut in court, shrine, camp, and market. Hashut demands fire, tyranny, and useful cruelty, turning industry and obedience into sacred acts.\n\nAcross the Plain of Zharrduk, there is no passive frontier for Dhrath-Zharr-Ankor. The Age of Fire and Chains is not a metaphor to the Dawi-Zharr. It is a schedule, an industrial target, and a religious duty. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.390.a:0 "Stoke Hashut's empire."

 war_unique_intro_events.391.t:0 "The Norse Dawi Gather"
 war_unique_intro_events.391.d:0 "Ankhor Dumbaraz belongs to Dawi shaped by colder seas, harsher mountains, and long isolation from the southern holds. Kraka clans, sapphire veins, gromril memories, construction oaths, and grudges against Kazaki-dum all demand a realm that can survive the north without becoming it.\n\nThe Norse Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the Jotunheim-Gianthome Mountains, there is no passive frontier for Ankhor Dumbaraz. The Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.391.a:0 "Unite the krakas."

 war_unique_intro_events.392.t:0 "The Under-Empire Rises"
 war_unique_intro_events.392.d:0 "The Under-Empire is everywhere the surface is foolish enough not to look. Skavenblight, gnawholes, engines, laboratories, slave pits, breeding warrens, spy tunnels, and Council whispers make a realm whose borders are defined by ignorance above.\n\nThe Skaven move within the Skaven cultural world, and public life is shaped by the Horned Rat in court, shrine, camp, and market. The Horned Rat sanctifies hunger, treachery, invention, and plague, making betrayal a sacrament when it succeeds.\n\nAcross Skavenblight, there is no passive frontier for Under-Empire. The surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.392.a:0 "Rise-rise beneath them."

 war_unique_intro_events.393.t:0 "The Karaz Ankor Reforged"
 war_unique_intro_events.393.d:0 "The Karaz Ankor is not a memory to the Dawi; it is the rightful shape of the mountains. The Everpeak, Karak Kadrin, Zhufbar, Karak Azul, Karak Eight Peaks, the old roads, and every lost hold remain entries in a debt book older than many kingdoms.\n\nThe Dawi people move within the Dwarfen cultural world, and public life is shaped by the Ancestor Gods in court, shrine, camp, and market. The Ancestor Gods make memory sacred, binding clan, craft, grudge, and oath into a duty that outlives fear.\n\nAcross the World's Edge Mountain, there is no passive frontier for Karaz Ankor. Every neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.393.a:0 "Reforge the mountain realm."

 war_unique_intro_events.394.t:0 "The Coast That Would Not Die"
 war_unique_intro_events.394.d:0 "The Vampire Coast is less a country than a shoreline that refused burial. Luthor Harkon's madness, barnacled grave-ports, corpse-haunted coves, zombie press gangs, and cannon crews dragged from the surf have made Lustria's eastern waters a kingdom of wet rot and ambition.\n\nThe The Drowned people move within the Vampire Coastmen cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Northern Jungle, there is no passive frontier for Vampire Coast. A realm of corpse-sailors does not need the same bargains as mortal pirates. It needs harbors to frighten, charts to stolen wealth, bodies to crew the guns, and coastal trade centers where fear, plunder, and occult logistics can be made permanent. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
 war_unique_intro_events.394.a:0 "Raise every black sail."

 war_unique_intro_events.395.t:0 "The Sisterhood of the Old Ones"
 war_unique_intro_events.395.d:0 "Amazonia keeps the Old Ones in a human voice. Sisterhood warbands, river gardens, hidden shrines, sunstaff relics, and priestess councils preserve a sacred inheritance older than their settlements and stranger than any warm-blooded empire can comfortably explain.\n\nThe Amazon people move within the Amazon cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Northern Jungle, there is no passive frontier for Amazonia. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.395.a:0 "Guard the relic shrines."

 war_unique_intro_events.396.t:0 "Skeggi's Long Beach"
 war_unique_intro_events.396.d:0 "Skeggi is the oldest human foothold in Lustria, which means it has survived by being too stubborn, useful, and violent to disappear. Its stilted streets, rough docks, jungle roads, Norscan jarls, and treasure-drunk explorers cling to the coast between reptile gods and hungry green darkness.\n\nThe Skeggling people move within the Norscan cultural world, and public life is shaped by the old northern gods in court, shrine, camp, and market. The old northern gods reward raid, oath, storm, and boast, and their favor belongs to those who return with proof.\n\nAcross the Isthmus of Lustria, there is no passive frontier for Skeggi. A Norscan realm survives by motion. The sea is road, weapon, witness, and escape route; the coast is a staging ground; the raid is economy and worship together. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.396.a:0 "Raid from the jungle shore."

 war_unique_intro_events.397.t:0 "Xahutec's Old Watch"
 war_unique_intro_events.397.d:0 "Xahutec is the City of Echoes, and not every echo belongs to the living. Rift-sealed ruins, tainted spawning pools, old wards, daemon-hunter cohorts, and messages carried toward Itza make its stones sound with warnings left by catastrophes that never fully ended.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Northern Jungle, there is no passive frontier for Xahutec. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.397.a:0 "Read the green omens."

 war_unique_intro_events.398.t:0 "Tlax Counts the Fallen Stars"
 war_unique_intro_events.398.d:0 "Tlax is called the City of Ghosts because memory walks heavily there. Pearl stores, Tarantula Coast wardens, spectral battle omens, golden spire lures, and Skink envoys move through a temple-city where absence has become part of the garrison.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Northern Jungle, there is no passive frontier for Tlax. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.398.a:0 "Align the star-stones."

 war_unique_intro_events.399.t:0 "Chaqua's Rain-Temple"
 war_unique_intro_events.399.d:0 "Chaqua was the City of Gold before plague and violation turned splendor into warning. Storehouses of golden plaques, cleansing cohorts, purification rites, Sotek's remembered omen, and wary Skink diplomats now stand between sacred wealth and the filth that once defiled it.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Northern Jungle, there is no passive frontier for Chaqua. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.399.a:0 "Wake the rain rites."

 war_unique_intro_events.400.t:0 "Axlotl's Broken Pools"
 war_unique_intro_events.400.d:0 "Axlotl is a city that has learned the ritual of falling and returning. Its fourth spawning legacy, reclaimed ruins, wounded pools, anti-Skaven patrols, jungle economies, and cohorts that refuse final defeat make survival feel almost like an ancient office.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Southern Jungle, there is no passive frontier for Axlotl. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.400.a:0 "Cleanse the spawning pools."

 war_unique_intro_events.401.t:0 "Quetza beneath the Plague Canopy"
 war_unique_intro_events.401.d:0 "Quetza is the Defiled City, where Clan Pestilens made disease into occupation and sacred stone learned the smell of rot. Plague wards, quarantine registers, cavern contemplatives, cautious envoys, and hardened cohorts keep watch over a temple-city that cannot afford forgetfulness.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Northern Jungle, there is no passive frontier for Quetza. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.401.a:0 "Seal the plague gates."

 war_unique_intro_events.402.t:0 "Xhotl's Silent Stones"
 war_unique_intro_events.402.d:0 "Xhotl was the City of Destiny before destiny became a battlefield. Kroq-Gar's first defense, collapsed Slann barriers, refugee spawnings, doom-plaques, and the never-ending memory of daemon war make its stones feel less ruined than interrupted.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Southern Jungle, there is no passive frontier for Xhotl. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.402.a:0 "Make the stones speak."

 war_unique_intro_events.403.t:0 "Subatuun's Hidden Sequence"
 war_unique_intro_events.403.d:0 "Subatuun measures holiness in terraces, canals, spawning cycles, and the disciplined movement of water. River-causeway patrols, reed-marked envoys, Skink ledgers, flooded steps, and sacred agricultural rites make the city a calculation written in mud, stone, and breath.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Southern Jungle, there is no passive frontier for Subatuun. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.403.a:0 "Preserve the hidden sequence."

 war_unique_intro_events.404.t:0 "Oxyl at the Edge of the World"
 war_unique_intro_events.404.d:0 "Oxyl hides so thoroughly that discovery feels like a theological error. Chameleon Skink paths, venom stores, silent plaques, unseen diplomacy, and darts from the green dark make the jungle itself seem to hold a spear behind every leaf.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Southern Jungle, there is no passive frontier for Oxyl. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.404.a:0 "Hold the jungle edge."

 war_unique_intro_events.405.t:0 "Xeti's Cold Constellations"
 war_unique_intro_events.405.d:0 "Xeti keeps its watch in thin air and cold mist, where white-stone ziggurats rise above jungle heat like thoughts made visible. Highland spawning pools, mountain causeway guards, cold storehouses, and envoys from the high canopies give its duty a clear and distant edge.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross Sotek Back, there is no passive frontier for Xeti. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.405.a:0 "Chart the cold stars."

 war_unique_intro_events.406.t:0 "Spektazuma's Sacred Mirrors"
 war_unique_intro_events.406.d:0 "Spektazuma stands where scale, feather, skin, and river memory meet before the Old Ones. Oracle pools, Amazon-Skink warbands, relic gardens, hidden sister-temples, and sacred parleys give the city an inheritance shared by peoples who read different signs toward the same design.\n\nThe Amazon Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Creeping Jungle, there is no passive frontier for Spektazuma. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.406.a:0 "Polish the sacred mirrors."

 war_unique_intro_events.407.t:0 "Huatl's Patient Geometry"
 war_unique_intro_events.407.d:0 "Huatl is aligned to the sun because order should cast a measurable shadow. Dawn envoys, coastal watchers, sun-marked trade courts, anti-vampire patrols, and Chotec's burning cohorts keep the eastern approaches under a light the undead cannot comfortably imitate.\n\nThe Lustrian Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Northern Jungle, there is no passive frontier for Huatl. The Great Plan is not a metaphor to the servants of the Old Ones. It is law, astronomy, ritual, mathematics, and war discipline at once. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.407.a:0 "Complete the temple angles."

 war_unique_intro_events.408.t:0 "The Dreadwater Empire"
 war_unique_intro_events.408.d:0 "The Dreadwater Empire is what happens when pirate hunger acquires a throne. Bound hulls, ghostfire bombardments, drowned fortresses, cursed navigators, terror-bound captains, and black harbors make the ocean itself feel like conquered territory.\n\nThe The Drowned people move within the Vampire Coastmen cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Northern Jungle, there is no passive frontier for Dreadwater Empire. A realm of corpse-sailors does not need the same bargains as mortal pirates. It needs harbors to frighten, charts to stolen wealth, bodies to crew the guns, and coastal trade centers where fear, plunder, and occult logistics can be made permanent. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
 war_unique_intro_events.408.a:0 "Claim the trade winds."

 war_unique_intro_events.409.t:0 "Gloamsworn in the Canal Mists"
 war_unique_intro_events.409.d:0 "Gloamsworn hides in the damp margins of Tilea, where canal fog softens borders and civilized men pretend every missing patrol was merely unlucky. Gloam-lairs, stolen tolls, condottieri bargains, mist-oath nobles, and night raids on Reman roads give these Fimir a strangely urban hunting ground.\n\nThe Fimir people move within the Fimir cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Tilea, there is no passive frontier for Gloamsworn. A Fimir realm survives by making obscurity practical. The bog is border and weapon, mist is diplomacy and ambush, tribute is taken before it is negotiated, and every captive road, canal, fenline, or reed hall must serve the rule of those strong enough to command from the dark. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.409.a:0 "Raise the gloam-lairs."

 war_unique_intro_events.410.t:0 "Murklurth's Drowned Tribute"
 war_unique_intro_events.410.d:0 "Murklurth remembers kingship as a thing spoken under bog moons and paid for in drowned tribute. Fen-kings, reed halls, black-water altars, swamp-causeway ambushes, and heavy-tailed Fimm make its rule feel older than the roads that try to cross it.\n\nThe Fimir people move within the Fimir cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Kingdom of the Beasts, there is no passive frontier for Murthlurth. A Fimir realm survives by making obscurity practical. The bog is border and weapon, mist is diplomacy and ambush, tribute is taken before it is negotiated, and every captive road, canal, fenline, or reed hall must serve the rule of those strong enough to command from the dark. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.410.a:0 "Crown the fen-kings."

 war_unique_intro_events.411.t:0 "The Reach of the Bog"
 war_unique_intro_events.411.d:0 "Bogreach is a border that keeps moving in the mist. Reed-marked tributaries, fog-hidden outposts, toll raids beyond the fenline, hostage bargains, and Fimm shield circles make its territory less a map than a warning repeated by survivors.\n\nThe Fimir people move within the Fimir cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Western Ind, there is no passive frontier for Bogreach. A Fimir realm survives by making obscurity practical. The bog is border and weapon, mist is diplomacy and ambush, tribute is taken before it is negotiated, and every captive road, canal, fenline, or reed hall must serve the rule of those strong enough to command from the dark. To endure, it must make the region remember its name before larger powers write the next chapter.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.411.a:0 "Mark the fenline."

 war_unique_intro_events.412.t:0 "Mirecourt's Marsh-King"
 war_unique_intro_events.412.d:0 "Mirecourt calls itself a court because terror enjoys ceremony. Marsh-kings, captive tribute halls, Balefiend judgments, fen-mist envoys, tail-maul retinues, and reed-hidden shrines make law out of damp stone, silence, and the certainty that prisoners are listening.\n\nThe Fimir people move within the Fimir cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Broken Lands, there is no passive frontier for Mirecourt. A Fimir realm survives by making obscurity practical. The bog is border and weapon, mist is diplomacy and ambush, tribute is taken before it is negotiated, and every captive road, canal, fenline, or reed hall must serve the rule of those strong enough to command from the dark. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightiest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.412.a:0 "Hold court in the reeds."

 war_unique_intro_events.413.t:0 "Drakgnaw's Bone Herd"
 war_unique_intro_events.413.d:0 "Drakgnaw measures strength in bones large enough to humble ordinary trophies. Dragon-bone gnawing rites, bull-horned warherds, marrow offerings at the herdstone, ravaged pasture tribute, and Beastlord horn-parleys make its Bovigors hungry for proof that even great beasts can be reduced to ornaments.\n\nThe Bovigors people move within the Beasts of Chaos cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the New Coast, there is no passive frontier for Drakgnaw. They despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.413.a:0 "Gnaw the dragon bones."

 war_unique_intro_events.414.t:0 "Crackskull Gallops"
 war_unique_intro_events.414.d:0 "Crackskull arrives with hooves, sour wine, and the wet sound of heads meeting stone. Centigor pathbreakers, reeling charge songs, drunken herd bargains, skull-cracking gallops, and libations to Chaos make speed feel less like strategy than a riot with direction.\n\nThe Centigors people move within the Beasts of Chaos cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Norsca, there is no passive frontier for Crackskull. They despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.414.a:0 "Break skulls at a gallop."

 war_unique_intro_events.415.t:0 "Gorefane's Blood Fetishes"
 war_unique_intro_events.415.d:0 "Gorefane belongs to the small, sharp, and numerous. Ungor knife-swarms, blood fetishes, scavenged loot from camp edges, braying skulkers, cowed underlings, and cringing envoys make weakness into a posture that lasts only until the enemy falls.\n\nThe Ungors people move within the Beasts of Chaos cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Gnoblar Country, there is no passive frontier for Gorefane. They despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.415.a:0 "Let the knife-swarms loose."

 war_unique_intro_events.416.t:0 "Rutshrak's Cliff Shrines"
 war_unique_intro_events.416.d:0 "Rutshrak keeps its shrines where cliffs answer every shout. Caprigor crag-herds, goat-path toll raids, horn-rack chieftains, rockfall ambushers, and hard-hooved raiders turn ravines into temples, roads into traps, and echoes into threats.\n\nThe Caprigors people move within the Beasts of Chaos cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross Sotek Back, there is no passive frontier for Rutshrak. They despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.416.a:0 "Bray across the ravines."

 war_unique_intro_events.417.t:0 "Urzguth under Witchlights"
 war_unique_intro_events.417.d:0 "Urzguth prowls Naggaroth where the forests are black, the snow remembers blood, and Druchii cruelty has not made the wilds obedient. Blackpine bloodgrounds, witchlight warherds, spoils from Dark Elf roads, frost endurance, and shrines in black snow make its Beastmen cold without becoming calm.\n\nThe Naggaroth Beastmen move within the Beasts of Chaos cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Broken Lands, there is no passive frontier for Urzguth. The Blood-Grounds are not merely land to occupy. They are hunting range, shrine, proving ground, and insult to every plow and city wall. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.417.a:0 "Howl beneath black snow."

 war_unique_intro_events.418.t:0 "Khazrak's One-Eyed Herd"
 war_unique_intro_events.418.d:0 "The One-Eyes follow Khazrak because one lost eye taught him more than most chiefs learn from a lifetime of charging straight ahead. Drakwald raid patterns, warhounds, Bullgor shock herds, threats to Middenland, and the herdstone of the Blinded Beast make cunning feel like another horn.\n\nThe Bovigors people move within the Beasts of Chaos cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the North Empire Provinces, there is no passive frontier for One-Eyes. They despise walls, fields, bells, ledgers, roads, temples, and the soft order of men. To them, civilization is a lie scratched over the true world, and the true world is hunger, dominance, blood-smoke, and the Dark Gods laughing in the trees. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.418.a:0 "Set Khazrak's ambush."

 war_unique_intro_events.419.t:0 "Black Sails of Zandri"
 war_unique_intro_events.419.d:0 "Zandri faces the sea as if the horizon is another tomb door waiting to be opened. Amanhotep's pride, black-sailed warships, necropolis docks, Colossus-haunted quays, and sailors who forgot breathing long ago make the city a port where death still understands tides.\n\nThe Zandrian people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Zandri. The situation is briny, proud, and full of rivals who think the sea belongs to the living, so we must raise the harbor dead and make Zandri's black sails carry Nehekhara's return beyond the sand. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.419.a:0 "Raise the harbor dead."

 war_unique_intro_events.420.t:0 "Bhagar's Eternal Necropolis"
 war_unique_intro_events.420.d:0 "Bhagar broods over southern tomb fields where wealth lies beneath sealed doors and every funerary road seems to end in a warning. Necropolis estates, mortuary treasuries, bone scribes, desert watch posts, and nobles who have been patient for centuries give the city a hard, buried strength.\n\nThe Bhagaran people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Bhagar. O mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.420.a:0 "Open the southern tombs."

 war_unique_intro_events.421.t:0 "Rasetra's Vengeful Fortress"
 war_unique_intro_events.421.d:0 "Rasetra stands where Nehekharan stone meets the green dark, a fortress-city staring into jungles that do not respect old imperial maps. Border towers, vengeful garrisons, scarab-sealed gates, jungle road patrols, and chariot captains with old grudges keep the frontier from swallowing the dead whole.\n\nThe Lybarasian people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Lahmia, there is no passive frontier for Rasetra. The Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.421.a:0 "Hold the jungle gate."

 war_unique_intro_events.422.t:0 "Khalida's Venom Crown"
 war_unique_intro_events.422.d:0 "Lybaras belongs to Khalida, and Khalida's hatred has never cooled into mere memory. Asp-crowned nobles, temple archers, sacred venom rites, royal tomb courts, and the unhealed insult of Lahmia make the city beautiful in the way a drawn blade can be beautiful.\n\nThe Lybarasian people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Lahmia, there is no passive frontier for Lybaras. The Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.422.a:0 "Let Lybaras hiss."

 war_unique_intro_events.423.t:0 "Mahrak, City of the Gods"
 war_unique_intro_events.423.d:0 "Mahrak still calls itself the City of the Gods, though time has made that title feel like both inheritance and accusation. Hieratic councils, empty processional ways, broken sanctuaries, embalmed temple guards, and priests guarding rival interpretations of divine silence make holiness into politics.\n\nThe Lybarasian people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Lahmia, there is no passive frontier for Mahrak. The Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.423.a:0 "Seat the hieratic council."

 war_unique_intro_events.424.t:0 "Numas and the Living Market"
 war_unique_intro_events.424.d:0 "Numas is stranger than most tomb cities because the living still bargain in its shadow. Market tents, chariot nobles, priests of the dead, caravan guards, and breathing servants who bow before skeletal kings make its streets an argument between habit and eternity.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Numas. O mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.424.a:0 "Bind the living to the dead."

 war_unique_intro_events.425.t:0 "Scytania's Jackal Moon"
 war_unique_intro_events.425.d:0 "The Scythans ride where Arabyan roads, Nehekharan tomb tales, and open desert freedom cut across one another. Horse clans, jackal banners, old grave-tribute, caravan raids, and priests who know which dead kings must still be flattered make Scytania hard to rule and harder to catch.\n\nThe Scythan people move within the Arabyans cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Scythania. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.425.a:0 "Ride the tomb roads."

 war_unique_intro_events.426.t:0 "Black Sails of Sautekh"
 war_unique_intro_events.426.d:0 "Sautekh rules from a river mouth where black sails, embalmed admirals, and old harbor wealth refuse to become relics. Quay tombs, mortuary shipwrights, sealed warehouses, naval cult officers, and crews that answer drums without breath give the city a discipline the tide itself seems to respect.\n\nThe Zandrian people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Sautekh. A harbor is a throne only if ships obey it. Sautekh must make its river fleets gather taxes, move legions, terrify living ports, and remind the inland kings that the water roads can carry ambition faster than sand. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.426.a:0 "Unfurl the embalmed fleet."

 war_unique_intro_events.427.t:0 "Maynarkh's Death-Harbors"
 war_unique_intro_events.427.d:0 "Maynarkh is austere even among the dead, a coastal necropolis where mercy sounds like a luxury invented by soft courts. Bone fleets, salt-stained tomb walls, wrathful dynasts, harbor execution rites, and quiet priests who prefer final answers make the realm feel carved from judgment.\n\nThe Zandrian people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Maynarkh. O mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.427.a:0 "Seal the black quays."

 war_unique_intro_events.428.t:0 "Nephrekh's Radiant Masks"
 war_unique_intro_events.428.d:0 "Nephrekh gleams as though death itself learned vanity from the sun. Golden death masks, radiant sanctuaries, polished necropolis gates, sun-cult processions, and dynasts who measure legitimacy in reflected light make the city magnificent enough to invite envy.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Nephrekh. O mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.428.a:0 "Lift the golden masks."

 war_unique_intro_events.429.t:0 "Martek's Pilgrim Flame"
 war_unique_intro_events.429.d:0 "Martek stands on roads where prayer, dust, water, and suspicion travel together. Pilgrim hosts, stern judges, caravan escorts, One Faith scholars, and desert notables who still remember older bargains make the city a test of whether revelation can govern tired feet as well as inspired hearts.\n\nThe Cophic people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Martek. For millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.429.a:0 "Guard the pilgrimage."

 war_unique_intro_events.430.t:0 "Copher After Sunset"
 war_unique_intro_events.430.d:0 "Copher is a harbor of lamps, ledgers, perfume, locked shutters, and careful invitations after dusk. Merchant pashas, foreign factors, blood courts, corpse-lit counting houses, and public rites that hide private appetites make the city rich enough to make questions impolite.\n\nThe Cophic people move within the Arabyans cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross Araby, there is no passive frontier for Copher. The deserts and seas must carry Araby's power to every horizon. We must turn pilgrimage, trade, scholarship, oath, blade, water, and caravan into a single dawn bright enough that no rival finds refuge in ignorance. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.430.a:0 "Count the blood-tithes."

 war_unique_intro_events.431.t:0 "Istrabul's Desert Gate"
 war_unique_intro_events.431.d:0 "Istrabul watches the desert gate with horses saddled, toll ledgers open, and reformers arguing under shaded arches. Cavalry courts, fortified caravanserais, supply depots, scholar-cadres, and frontier captains make the city a hinge between doctrine, profit, and hard road command.\n\nThe Bedouin people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Istrabul. For millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.431.a:0 "Muster the horse courts."

 war_unique_intro_events.432.t:0 "El-Kalabad's Azure Minarets"
 war_unique_intro_events.432.d:0 "El-Kalabad studies the sky until prophecy begins to look like policy. Azure minarets, desert observatories, careful scholars, Tzeentchian whispers, and court intrigues that change shape while being watched make the city brilliant, useful, and dangerous to believe too quickly.\n\nThe Medean people move within the Arabyans cultural world, and public life is shaped by Tzeentchian worship in court, shrine, camp, and market. Tzeentch blesses plots, mutations, and impossible futures, so every crisis can become a door if the ruler dares open it.\n\nAcross the Gulf of Medes, there is no passive frontier for El-Kalabad. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.432.a:0 "Read the changing stars."

 war_unique_intro_events.433.t:0 "Lazzara's Corsair Docks"
 war_unique_intro_events.433.d:0 "Lazzara smells of pitch, salt, spice, cheap miracles, and knives hidden in sailors' belts. Corsair captains, black-market brokers, One Faith ship-priests, harbor judges, and crews who pray loudly before robbing quietly make the port an argument between piety and profit.\n\nThe Umbar people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Lazzara. For millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.433.a:0 "Loose the lateen sails."

 war_unique_intro_events.434.t:0 "Amhabal's Hidden Knives"
 war_unique_intro_events.434.d:0 "Amhabal does not need loud walls when fear can open gates before dawn. Hidden knives, sacred contracts, coded sermons, oath-bound informants, and courtyards where smiles are inspected like weapons make the city quiet in the way a drawn bow is quiet.\n\nThe Hashashin people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Amhabal. For millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.434.a:0 "Seal the red contracts."

 war_unique_intro_events.435.t:0 "Zarekten's Water Pacts"
 war_unique_intro_events.435.d:0 "Zarekten measures authority in wells, shade, camel strings, and the right to decide who drinks first. Bedouin councils, water pacts, raiding horsemen, caravan hosts, and One Faith judges who must know desert custom before correcting it make the realm practical before it can be grand.\n\nThe Bedouin people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Zarekten. For millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.435.a:0 "Guard the wells."

 war_unique_intro_events.436.t:0 "Sudenburg under the Southern Sun"
 war_unique_intro_events.436.d:0 "Sudenburg is an Imperial argument built in stone under an Arabyan sun. Sigmarite settlers, drilled companies, southern warehouses, chartered burghers, and officers writing home to provinces that barely understand the heat make the colony both outpost and wager.\n\nThe Sudenburger people move within the Imperial cultural world, and public life is shaped by Sigmarite faith in court, shrine, camp, and market. Sigmarite faith gives this people a language of duty, lawful wrath, and human defiance.\n\nAcross the Gulf of Medes, there is no passive frontier for Sudenburg. That strength is not automatic. Reikland, Middenland, Talabecland, Wissenland, Nuln, and every border lord argue over rank, taxes, doctrine, and pride while enemies study the roads between them. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.436.a:0 "Hold the Imperial walls."

 war_unique_intro_events.437.t:0 "Antoch's Desert Vows"
 war_unique_intro_events.437.d:0 "Antoch carries Bretonnian vows into heat, dust, and crusader stone. Outremer castles, chapel courtyards, desert lances, stern castellans, and peasants who have learned to pray beside unfamiliar roads make the realm a frontier version of chivalry rather than a comfortable copy.\n\nThe Outremer people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross the Gulf of Medes, there is no passive frontier for Antoch. Yet the world grows darker, and distance makes every virtue work harder. Foul beasts prowl borders, faithless men bargain in shadows, corsairs test the coast, and the forces of ruin gather strength wherever proud realms confuse ceremony with readiness. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.437.a:0 "Raise the crusader lances."

 war_unique_intro_events.438.t:0 "Ubar, the Hidden Oasis"
 war_unique_intro_events.438.d:0 "Ubar hides behind mirage, thorn, water, and men who know which silence means permission to kill. Veiled gates, oasis treasuries, knife schools, sacred contracts, and judges who speak softly because others enforce loudly make the city a secret that collects taxes.\n\nThe Hashashin people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Ubar. For millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.438.a:0 "Close the veiled gates."

 war_unique_intro_events.439.t:0 "Kamt's Black Tent Councils"
 war_unique_intro_events.439.d:0 "Kamt governs from black tents, marked wells, and councils where every elder knows the price of a broken water oath. Camel routes, mobile horsemen, oath-feasts, desert scouts, and One Faith judges who must persuade before commanding give the realm a state carried on hooves.\n\nThe Bedouin people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Sudron, there is no passive frontier for Kamt. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.439.a:0 "Bind the water pacts."

 war_unique_intro_events.440.t:0 "Sud's River Judges"
 war_unique_intro_events.440.d:0 "Sud lives where river towns, date groves, ferry dues, and southern caravan roads turn water into authority. Frontier judges, market elders, date merchants, watch posts, and One Faith preachers who know the road south is never simple make the realm practical, warm, and watchful.\n\nThe Sudron people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Sudron, there is no passive frontier for Sud. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.440.a:0 "Guard the date groves."

 war_unique_intro_events.441.t:0 "Mahabbah, the Beloved City"
 war_unique_intro_events.441.d:0 "Mahabbah earns its name with gardens, learned courts, generous guest halls, and markets where hospitality is policy as much as virtue. Scholar-judges, perfumed courtyards, merchant patrons, guarded caravans, and One Faith sermons delivered with polished courtesy make the city gentle only to the inattentive.\n\nThe Sudron people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Sudron, there is no passive frontier for Mahabbah. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.441.a:0 "Open the garden courts."

 war_unique_intro_events.442.t:0 "Songhai's Gold and Salt Roads"
 war_unique_intro_events.442.d:0 "Songhai rises along the great river while gold moves north, salt moves south, and weakened rivals remember too late that roads create kings. River barges, Sunni scholar-judges, cavalry courts, market administrators, and fortress garrisons give Gao a chance to turn movement into mastery.\n\nThe Songhai people move within the wider cultural world, and public life is shaped by their faith in court, shrine, camp, and market. The faith gives law, learning, and communal discipline a sacred frame amid older deserts and sharper rivals.\n\nAcross the Jotunheim-Gianthome Mountains, there is no passive frontier for Songhai. Araby's dawn reaches these roads as rumor, example, challenge, and opportunity. The One Faith may not rule Songhai's courts, but religious fervor, learned law, and desert commerce still shape every bargain made between river and sand. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.442.a:0 "Command the river roads."

 war_unique_intro_events.443.t:0 "Hashishin Before Sunrise"
 war_unique_intro_events.443.d:0 "The Hashishin rule by letting enemies discover too late that every campfire had ears. Missing supplies, open threats, unbroken strongholds, watched roads, silent climbers, and contracts signed in faith and fear make their lands feel larger than the map admits.\n\nThe Hashashin people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Hashishin. For millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.443.a:0 "Send the silent knives."

 war_unique_intro_events.444.t:0 "Ebonaire's Desert Concord"
 war_unique_intro_events.444.d:0 "Ebonaire lives by motion, oath, and the pride of tents that do not need city walls to remember rank. Bedouin courts, caravan tolls, reformist preachers, warhorse clans, and ambitious notables make the realm a southern frontier where obedience must be persuaded before it can be commanded.\n\nThe Bedouin people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Sudron, there is no passive frontier for Ebonaire. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.444.a:0 "Bind the nomad courts."

 war_unique_intro_events.445.t:0 "Sandscale under the Scarab Sun"
 war_unique_intro_events.445.d:0 "The Sandscale are Lizardmen of hot stone, dry pools, scarab rites, and sun-baked temple walls. Their Skinks write in glyphs learned beside tomb roads, their Saurus stand where dunes crawl over old spawning places, and their priests speak to the Old Ones through Nehekharan symbols the wider temple-cities would find unsettling.\n\nThe Sandscales people move within the Lizardmen cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Sudron, there is no passive frontier for Sandscale. The Sandscale cannot simply imitate Lustria. They must survive between dead kings, Arabyan roads, dry winds, and sacred pools that answer less often than they should. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.445.a:0 "Align scale and scarab."

 war_unique_intro_events.446.t:0 "Bur Shitrak's Horse Banners"
 war_unique_intro_events.446.d:0 "Bur Shitrak rides hard beneath horse banners, dust plumes, and sermons sharp enough to keep proud clans listening. Medean blood, cavalry law, growing artillery workshops, and tribal councils made uneasy by reform all pull the realm toward a future faster than its elders expected.\n\nThe Medean people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross the Gulf of Medes, there is no passive frontier for Bur Shitrak. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.446.a:0 "Ride beneath the sun."

 war_unique_intro_events.447.t:0 "Steel Bazaars of Dimashque"
 war_unique_intro_events.447.d:0 "Dimashque is a city of steel, orchards, contracts, and polished argument. Its bazaars ring with hammer blows, its canals feed garden districts, its scholars dispute doctrine beneath awnings, and its merchants know that every caravan treaty is a weapon if written carefully enough.\n\nThe Medean people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross the Gulf of Medes, there is no passive frontier for Dimashque. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.447.a:0 "Temper the steel markets."

 war_unique_intro_events.448.t:0 "Kadira's Corsair Havens"
 war_unique_intro_events.448.d:0 "Kadira speaks the language of tide, ransom, and lateen sails. Island corsairs, smuggler quays, sea oaths, pirate parley houses, and hook-blade boarders make the port useful to Araby and dangerous to anyone who believes useful men remain obedient by gratitude alone.\n\nThe Umbar people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Araby, there is no passive frontier for Kadira. For millennia, Araby bent its knee to many powers: old desert gods, djinn bargains, foreign idols, local saints, proud emirs, caravan law, and fear of whatever waited beyond the next dune. The land endured, but its soul was divided. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.448.a:0 "Bless the corsair sails."

 war_unique_intro_events.449.t:0 "Springs of Aiir"
 war_unique_intro_events.449.d:0 "Aiir rises around highland springs where water, scholarship, stone terraces, and star routes meet. Its caravanserais shelter merchants and arguments, its observatories watch the desert sky, and its hill guards understand that a spring is a library, treasury, shrine, and fortress at once.\n\nThe Medean people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross the Gulf of Medes, there is no passive frontier for Aiir. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.449.a:0 "Guard the high springs."

 war_unique_intro_events.450.t:0 "The Island Keep of Origo"
 war_unique_intro_events.450.d:0 "The Knights of Origo hold a sea-fort where Bretonnian vows meet Imperial stonework, Arabyan winds, and the loneliness of a crusade that outlived its first banners. Their chapel bells ring over harbor cannon, pilgrim knights, salt-crusted walls, and watchmen who know the coast is patient with isolated pride.\n\nThe Outremer people move within the Bretonnian cultural world, and public life is shaped by devotion to the Lady in court, shrine, camp, and market. The Lady of the Lake sanctifies chivalry, oath, and protection, but her blessing must be proven in an age that tests every shining vow.\n\nAcross Araby, there is no passive frontier for Knights of Origo. Yet the world grows darker, and distance makes every virtue work harder. Corsairs test the approaches, faithless men bargain in shadows, Arabyan courts remember old crusader wounds, and foreign merchants measure the island as a prize before they call it a sanctuary. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.450.a:0 "Hold the island keep."

 war_unique_intro_events.451.t:0 "Kyrene's Western Oasis"
 war_unique_intro_events.451.d:0 "Kyrene keeps a western oasis necropolis where salt roads, chariot patrols, sand-sealed granaries, and dry envoys make the living pay respect before thirst teaches them. Its rulers remember old dynastic claims with the patience of kings who can wait longer than any caravan master can live.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Kyrene. O mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.451.a:0 "Tax the salt roads."

 war_unique_intro_events.452.t:0 "Kermah's Black-Stone Gates"
 war_unique_intro_events.452.d:0 "Kermah stands by cataracts where water roars against black stone and tomb gates answer with silence. River gold ledgers, mortuary works, Ushabti processional ways, and spear ranks raised beneath spray give the city a southern dignity heavy enough to feel carved from the riverbed.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Kermah. O mighty ruler, death has not ended your reign, nor has time made your claim less lawful. Nehekhara was once a land of golden cities, sacred kings, mortuary temples, chariot hosts, and endless legions marching beneath a sun that seemed to bless eternity itself. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.452.a:0 "Guard the cataract tombs."

 war_unique_intro_events.453.t:0 "Fezzir's Dune Shrines"
 war_unique_intro_events.453.d:0 "Fezzir keeps shrines where dunes bury devotion and force priests to uncover it again. Bone-marked roads, jackal-scribe tax rolls, border necropolis walls, outrider chariots, and uneasy pacts with living nomads make the city a desert warning written in fragments.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross Nehekhara, there is no passive frontier for Fezzir. Fezzir survives by making borders speak. Bones mark the roads, toll rolls remember cheats, nomads bring news, and chariots ride ahead of the tomb host so no rival can pretend the frontier is empty. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.453.a:0 "Mark the caravan bones."

 war_unique_intro_events.454.t:0 "The Crimson Legion"
 war_unique_intro_events.454.d:0 "The Crimson Legion is not a city so much as a verdict that learned to march. Red standards, Tomb Guard oaths, blood-lacquered armouries, herald tablets, and soldiers who advance without breath make the warhost a royal grievance preserved in perfect military order.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross the Southern Wastes, there is no passive frontier for Crimson Legion. The Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.454.a:0 "Raise the red standards."

 war_unique_intro_events.455.t:0 "Exiles of Nehek"
 war_unique_intro_events.455.d:0 "The Exiles of Nehek carry their kingdom in relic carts, lost banners, funerary masks, and vows repeated under open sky. Dumuzid Kemat rules a wandering tomb court where every camp is a reminder of a throne denied and every march is measured against the road home.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross the Broken Lands, there is no passive frontier for Exiles of Nehek. The Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.455.a:0 "Carry the relic court."

 war_unique_intro_events.456.t:0 "Ka-Sabar's Mortuary Roads"
 war_unique_intro_events.456.d:0 "Ka-Sabar keeps the southern tomb roads where Bhagarite memory, mortuary colonies, priest-architects, and sepulchral chariot escorts stitch distant necropoleis together. Its settlements exist less for comfort than for the honour of dead kings who expect the world to remain arranged around them.\n\nThe Bhagaran people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nAcross the Plain of Tuskers, there is no passive frontier for Ka-Sabar. The Great Mortuary Cult promised paradise beyond death, but Nagash turned that promise into a cruel mockery. Now kings awaken in dry halls, priests chant over cracked jars, skeleton cohorts wait in ordered silence, and the living world mistakes stillness for weakness. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.456.a:0 "Open the southern roads."

 war_unique_intro_events.457.t:0 "Tlaqua's Terradon Watch"
 war_unique_intro_events.457.d:0 "Tlaqua watches the Southlands from above. Terradon patrols, ravine flight paths, Skink sky-captains, signal pigments, and Old One sky rites turn cliffs and canopy into a temple perimeter no ground-bound invader can easily understand.\n\nThe Southlands Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Gulf of Medes, there is no passive frontier for Tlaqua. The End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any scattered temple outpost can answer alone. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.457.a:0 "Take the sky paths."

 war_unique_intro_events.458.t:0 "Nahuontl's Canopy Shrines"
 war_unique_intro_events.458.d:0 "Nahuontl hides its sanctity beneath wet leaves, root hollows, canopy shrines, and pools that answer irregularly but remain sacred. Skink councils, jungle offering gardens, glyph-runners to Zlatlan, and ambushes from green shadows keep the temple alive where outsiders see only forest.\n\nThe Southlands Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the New Coast, there is no passive frontier for Nahuontl. The End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and enemies of the Old Ones multiply faster than any hidden temple can answer alone. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.458.a:0 "Hide the sacred pools."

 war_unique_intro_events.459.t:0 "Zameisland's Spirit Reefs"
 war_unique_intro_events.459.d:0 "Zameisland belongs to reefs, shell tolls, sea gardens, storm drums, and ancestor groves facing the tide. Its people are Sudron and Arabyan by the map's habit, yet their island spirits still watch the surf and warn when foreign sails approach with polite hunger.\n\nThe Sudron people move within the Arabyans cultural world, and public life is shaped by animist custom in court, shrine, camp, and market. Animist custom treats land, ancestor, beast, and spirit as present powers whose favor must be earned daily.\n\nAcross the Plain of Tuskers, there is no passive frontier for Zameisland. For millennia, the Arabyan world bent its knee to many powers: desert gods, djinn bargains, foreign idols, local spirits, proud emirs, caravan law, and fear of whatever waited beyond the next dune or reef. The wider land endured, but its soul was divided. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.459.a:0 "Beat the storm drums."

 war_unique_intro_events.460.t:0 "Parichistan's Temple Bazaars"
 war_unique_intro_events.460.d:0 "Parichistan gathers wealth beneath temple towers where spices, silk, lacquer, grain, copper, and sacred processions share the streets. Elephant-road wardens, monsoon ledgers, dyewood guilds, and palace guards of many banners make the realm a western gate into the crowded abundance of Ind.\n\nThe West Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Gnoblar Country, there is no passive frontier for Parichistan. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.460.a:0 "Feed the temple roads."

 war_unique_intro_events.461.t:0 "Karachistan's Gate Forts"
 war_unique_intro_events.461.d:0 "Karachistan holds gates where mountains, desert roads, saffron markets, iron caravans, and cliff shrines all demand watchmen. Terrace officials, hill levies, pass diplomats, and spear lines on narrow ground make the realm a lock on roads that richer kingdoms need.\n\nThe West Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Karachistan. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.461.a:0 "Hold the mountain gates."

 war_unique_intro_events.462.t:0 "Bhalluka's Forest Bear"
 war_unique_intro_events.462.d:0 "Bhalluka marches beneath forest-bear banners carried by rajahs who prize endurance, stubborn pride, and the right to stand their ground. Hill shrines, honey woods, ironwood groves, elephant-road forts, and market states make the realm rugged without making it simple.\n\nThe West Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. Bhalluka holds many cultural states beneath that faith, and each asks to be respected before it agrees to be governed.\n\nAcross Western Ind, there is no passive frontier for Bhalluka. Forest wealth must be harvested without angering every spirit and village, elephant roads must be fortified, and rajahs must be made to serve the kingdom before pride turns into private war. We must rule like the forest bear: patient enough to share the woods, fierce enough that every path remembers whose den it crosses."
 war_unique_intro_events.462.a:0 "Rouse the forest bear."

 war_unique_intro_events.463.t:0 "Imperial Delehi's Quills"
 war_unique_intro_events.463.d:0 "Imperial Delehi stands at the political heartland of the Thousand Gods, where princes, scribes, priests, merchants, generals, and petitioners all seek the king's ear. The Thousand-Quilled Porcupine marks temple revenues, pilgrimage roads, monsoon registers, palace elephants, and sacred registries with a thousand duties that all point inward.\n\nThe North Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. In Delehi, plural devotion becomes statecraft: every quill is a shrine, every shrine is a claim, and every claim must find its place before the imperial court.\n\nAcross Western Ind, there is no passive frontier for Delehi. Ind is older than the histories of the Old World claim, but age does not govern by itself. We must quill the sacred registers, make the roads speak toward the centre, and prove that the faith's heartland can still command the hands that pray within it."
 war_unique_intro_events.463.a:0 "Quill the sacred registers."

 war_unique_intro_events.464.t:0 "Panchala's Balanced Court"
 war_unique_intro_events.464.d:0 "Panchala governs through balance: prince and priest, river and embankment, market and monastery, frontier spear and written message. Yin-Yang influence has given old Indish instincts a foreign vocabulary, but the court knows harmony is not foreign to rule.\n\nThe West Indish people move within the Indish cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross Western Ind, there is no passive frontier for Panchala. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.464.a:0 "Balance river and road."

 war_unique_intro_events.465.t:0 "Ukbar's Fort Shrines"
 war_unique_intro_events.465.d:0 "Ukbar keeps shrines inside forts and road chapels along dry passes where caravans leave oil, bells, flowers, and thanks for safe passage. Upland millet stores, hill rajah councils, envoys of the dry passes, and guard regiments make devotion practical in hard country.\n\nThe North Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Eastern Ind, there is no passive frontier for Ukbar. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.465.a:0 "Guard the dry passes."

 war_unique_intro_events.466.t:0 "Singha Blocks the Trunk Road"
 war_unique_intro_events.466.d:0 "Singha stands like a defiant elephant on the invasion frontier, planted across the trunk road before enemies can pour into the sacred interior. Jungle rice, river markets, elephant guards, and road scouts all serve the same refusal: this way is closed unless Singha permits it.\n\nThe East Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. Small Cathayan and Khureshi warrior enclaves live among the road forts and rice stores, bringing foreign habits into a frontier discipline that must still answer one throne.\n\nAcross Eastern Ind, there is no passive frontier for Singha. The situation is mixed, exposed, and necessary, so we must feed the enclaves, harden the elephant lines, and make the trunk road a shield instead of a wound. If Singha holds, the lands behind it have time to breathe."
 war_unique_intro_events.466.a:0 "Block the trunk road."

 war_unique_intro_events.467.t:0 "Kurya's Delta Harbours"
 war_unique_intro_events.467.d:0 "Kurya governs where rivers break into harbors, monsoon temples rise above floodwater, and spice canal storehouses perfume the wet air. River fleets, rice registers, fishermen, pilots, and envoys crossing the eastern sea make the realm a kingdom of water that cannot afford loose oars.\n\nThe East Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Eastern Ind, there is no passive frontier for Kurya. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.467.a:0 "Command the monsoon roads."

 war_unique_intro_events.468.t:0 "Bone Eaters of the Red Snow"
 war_unique_intro_events.468.d:0 "The Bone Eaters were Ogres of the northern mountains until a tyrant cracked open the tomb of an Indish corpse-king and drank the red marrow sealed inside. Since then, the tribe has kept bone-pits, red snow feasts, night-road tolls, and pale Maneater bargains under a hunger that does not end cleanly with death.\n\nThe Boneeaters people move within the Ogres cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross Eastern Ind, there is no passive frontier for Bone Eaters. This makes them useful and horrifying even by Ogre standards. A Bone Eater can sell his strength as a Maneater, collect toll-meat from mountain roads, or rise again if the curse is strong and the feast is fresh enough. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.468.a:0 "Crack the corpse-king's bones."

 war_unique_intro_events.469.t:0 "Lakshana's Auspicious Seal"
 war_unique_intro_events.469.d:0 "Lakshana is named for signs that priests insist are not coincidences. Marks on newborn calves, river stones shaped like lotus petals, the behavior of temple elephants, and the timing of monsoon clouds all become arguments in court before they become policy.\n\nThe East Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Eastern Ind, there is no passive frontier for Lakshana. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.469.a:0 "Mark the lucky seal."

 war_unique_intro_events.470.t:0 "Bhojapuri's Moonlit Blood Shrine"
 war_unique_intro_events.470.d:0 "Bhojapuri's court keeps its brightest lamps for processions and its darkest rooms for the pale Raja's household. Tigerkin nobles walk through temple courtyards with lacquered claws, moonlit vows, and servants who know which bowls are for rice and which are not.\n\nThe Tigerkin move within the Eastern Beastfolk cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross Ind's End, there is no passive frontier for Bhojapuri. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.470.a:0 "Veil the pale court."

 war_unique_intro_events.471.t:0 "Kosala's Sacred Ford"
 war_unique_intro_events.471.d:0 "Kosala stands where sacred rivers slow long enough for monks, taxmen, pilgrims, ferrymen, and soldiers to argue over whose duty is most holy. Rice levies fill the roads after harvest, bells answer from monasteries, and every ford feels older than the kingdom that guards it.\n\nThe East Indish people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Ind's End, there is no passive frontier for Kosala. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.471.a:0 "Guard the river monasteries."

 war_unique_intro_events.472.t:0 "Bengal's Tiger Delta"
 war_unique_intro_events.472.d:0 "Bengal lives where rivers become arguments before they become sea. Mangrove hunters, Tigerkin shrine guards, rice boats, salt traders, and fishermen who read the tide better than most scribes read ledgers all serve a realm that must rule water in motion.\n\nThe Tigerkin move within the Eastern Beastfolk cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Ind's End, there is no passive frontier for Bengal. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.472.a:0 "Watch the river mouths."

 war_unique_intro_events.473.t:0 "The Twin Snakes Coil"
 war_unique_intro_events.473.d:0 "The Twin Snakes speak through paired idols, paired priests, paired daggers, and paired silences. Every audience is arranged so that no petitioner can tell which coil watches with favor and which one measures the throat.\n\nThe Khureshi Snakefolk move within the Snakefolk cultural world, and public life is shaped by animist custom in court, shrine, camp, and market. Animist custom treats land, ancestor, beast, and spirit as present powers whose favor must be earned daily.\n\nAcross North Khuresh, there is no passive frontier for Twin Snakes. Beyond the jungle, merchants, raiders, beastfolk, Skaven, and Indish princes test the borders with greed or ignorance. Khuresh survives by making curiosity expensive and trespass educational. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.473.a:0 "Bind the paired coils."

 war_unique_intro_events.474.t:0 "Longfangs under the Blood Moon"
 war_unique_intro_events.474.d:0 "The Longfangs smile with a courtly restraint that fools only visitors. Their nobles keep lacquered cups, moonlit hunting platforms, pale consorts, and old serpent genealogies that now include a thirst no ancestral tablet can explain politely.\n\nThe Longfang people move within the Snakefolk cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross North Khuresh, there is no passive frontier for Longfangs. Khuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.474.a:0 "Unveil the long fangs."

 war_unique_intro_events.475.t:0 "Coilfang River Shrines"
 war_unique_intro_events.475.d:0 "Coilfang's shrines lean over rivers where offerings vanish before they sink. Boatmen pay in copper, blood, fruit, and silence, while fang-ring warbands count bends in the water as carefully as other realms count walls.\n\nThe Khureshi Snakefolk move within the Snakefolk cultural world, and public life is shaped by animist custom in court, shrine, camp, and market. Animist custom treats land, ancestor, beast, and spirit as present powers whose favor must be earned daily.\n\nAcross Ind's End, there is no passive frontier for Coilfang. The serpent courts rule through fear, ceremony, and appetite. Blood rites bind warriors to shrines, spirits are placated with offerings no gentle priest would name, and noble houses treat diplomacy as a slower form of constriction. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.475.a:0 "Tighten the fang circle."

 war_unique_intro_events.476.t:0 "Jennestas' Jeweled Coils"
 war_unique_intro_events.476.d:0 "Jennestas glitters because warning can be beautiful. Jewels hang from serpent idols, dancers move through incense with blades hidden in sleeves, and venom-temple estates wrap their accounts in perfume until tribute feels like a privilege.\n\nThe Khureshi Snakefolk move within the Snakefolk cultural world, and public life is shaped by animist custom in court, shrine, camp, and market. Animist custom treats land, ancestor, beast, and spirit as present powers whose favor must be earned daily.\n\nAcross North Khuresh, there is no passive frontier for Jennestas. Khuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.476.a:0 "Perfume the venom houses."

 war_unique_intro_events.477.t:0 "Clan Eskemas' Red Root Warren"
 war_unique_intro_events.477.d:0 "Clan Eskemas gnaws beneath roots that drink too much red water. Its jungle warrens stink of damp warpstone, blood jars, bitten idols, and Skaven who learned from the serpent courts that worship is more useful when everyone is terrified.\n\nThe Jungle Skaven move within the Skaven cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross South Khuresh, there is no passive frontier for Clan Eskemas. Eskemas is stranger than most of its kin and proud of the advantage. Vampiric hunger makes night raids cleaner, jungle rot hides missing bodies, and Khureshi rites provide a vocabulary for fear that even ordinary Skaven can sell if they squeak it with confidence. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.477.a:0 "Open the red gnawholes."

 war_unique_intro_events.478.t:0 "Se'Sehen's Whisper Groves"
 war_unique_intro_events.478.d:0 "Se'Sehen is easiest to notice after it has already decided what to do with you. Whisper groves, reed blinds, spirit masks, and coils waiting under leaf-shadow make its courts feel less like palaces than pauses in the jungle's breathing.\n\nThe Khureshi Snakefolk move within the Snakefolk cultural world, and public life is shaped by animist custom in court, shrine, camp, and market. Animist custom treats land, ancestor, beast, and spirit as present powers whose favor must be earned daily.\n\nAcross South Khuresh, there is no passive frontier for Se'Sehen. Khuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.478.a:0 "Strike without ripple."

 war_unique_intro_events.479.t:0 "Hss'tafi's Thorn Shrines"
 war_unique_intro_events.479.d:0 "Hss'tafi worships where thorn and fang teach the same lesson. Shrine paths draw blood from careless ankles, drums pulse through wet heat, and warbands paint their scales before raids so spirits, rivals, and prey all know who is coming.\n\nThe Khureshi Snakefolk move within the Snakefolk cultural world, and public life is shaped by animist custom in court, shrine, camp, and market. Animist custom treats land, ancestor, beast, and spirit as present powers whose favor must be earned daily.\n\nAcross South Khuresh, there is no passive frontier for Hss'tafi. Khuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.479.a:0 "Beat the hissing drums."

 war_unique_intro_events.480.t:0 "Throne of the Crimson Coil"
 war_unique_intro_events.480.d:0 "The Blood Queen rules from a throne where every step upward is stained into memory. Crimson bowls, serpent diadems, oath scars, and attendants who never look surprised make her court a ceremony of submission with a pulse.\n\nThe Khureshi Snakefolk move within the Snakefolk cultural world, and public life is shaped by animist custom in court, shrine, camp, and market. Animist custom treats land, ancestor, beast, and spirit as present powers whose favor must be earned daily.\n\nAcross South Khuresh, there is no passive frontier for Blood Queen. Khuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.480.a:0 "Bleed for the Queen."

 war_unique_intro_events.481.t:0 "Bakemono in the Mountain Lairs"
 war_unique_intro_events.481.d:0 "Bakemono lairs cling to Nipponese mountains like bad ideas with teeth. Forest Goblins steal shrine bells, paint rude faces on guardian stones, brew fungus behind cedar roots, and insist every pass belongs to whoever can ambush it most often.\n\nThe Forest Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross Nippon, there is no passive frontier for Bakemono. A tribe becomes dangerous when its bosses can aim the shouting outward. Shamans find omens in smoke, squigs, teeth, mushrooms, and headaches, while mobs of Orcs and Goblins decide that any road, fort, shrine, caravan, or neighbor is better after being hit. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.481.a:0 "Steal the shrine bells."

 war_unique_intro_events.482.t:0 "Yomi's Corpse-Mushroom Warrens"
 war_unique_intro_events.482.d:0 "Yomi lives below places polite villages refuse to name after sunset. Corpse-mushrooms glow in damp hollows, Goblin teeth flash in bamboo shade, and the dead do not stay boring enough when the tribe's pale bosses start sniffing around them.\n\nThe Forest Goblins move within the Greenskins cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross Nippon, there is no passive frontier for Yomi. A tribe becomes dangerous when its bosses can aim the shouting outward. Shamans find omens in smoke, squigs, teeth, mushrooms, and headaches, while mobs of Orcs and Goblins decide that any road, fort, shrine, caravan, or neighbor is better after being hit. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.482.a:0 "Bite from the dark bamboo."

 war_unique_intro_events.483.t:0 "The Red Blade at Kuroyama"
 war_unique_intro_events.483.d:0 "The Bladelords bow like samurai and dream like executioners. Their sword schools teach patience only so killing arrives cleanly, and their red shrines praise strength with a directness that even harsher daimyo pretend not to hear.\n\nThe North Nipponese people move within the Nipponese cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross Nippon, there is no passive frontier for Bladelords. Nippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.483.a:0 "Draw the red blade."

 war_unique_intro_events.484.t:0 "Dawate's Snow Shrine Courts"
 war_unique_intro_events.484.d:0 "Dawate keeps court where snow settles on shrine roofs and fish smoke curls from cold villages below the passes. Its garrisons know the mountain roads by scar and avalanche, while its priests insist that quiet is a form of discipline, not peace.\n\nThe North Nipponese people move within the Nipponese cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross Nippon, there is no passive frontier for Dawate. Nippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.484.a:0 "Hold the cold pass."

 war_unique_intro_events.485.t:0 "Hattiga's Old Cedar Groves"
 war_unique_intro_events.485.d:0 "Hattiga's oldest law is older than the ink that records it. Cedar groves, spirit stones, druidic offerings, and clan courts meet under branches that seem to remember every oath, including the ones the living have found inconvenient.\n\nThe North Nipponese people move within the Nipponese cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nAcross Nippon, there is no passive frontier for Hattiga. Nippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.485.a:0 "Listen to the old cedars."

 war_unique_intro_events.486.t:0 "Hojizu's Tide Shrines"
 war_unique_intro_events.486.d:0 "Hojizu faces the sea with shrine gates, watch fires, fish markets, and harbor ledgers that smell of salt and ink. Boats arrive with tribute, rumor, pirates, monks, merchants, and quarrels that began in other ports but demand settlement here.\n\nThe North Nipponese people move within the Nipponese cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross Nippon, there is no passive frontier for Hojizu. Nippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.486.a:0 "Light the coastal fires."

 war_unique_intro_events.487.t:0 "Odari's Twin Seal"
 war_unique_intro_events.487.d:0 "Odari keeps two seals on its documents: one for the mountains and one for the sea. Between them lie road forts, harbor clans, shrine accounts, and envoys who must remember which lord is offended by which order of bows.\n\nThe North Nipponese people move within the Nipponese cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross Nippon, there is no passive frontier for Odari. Nippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.487.a:0 "Seal the mountain roads."

 war_unique_intro_events.488.t:0 "Shisuma's Quiet Registers"
 war_unique_intro_events.488.d:0 "Shisuma rules through quiet books and careful guards. River tolls, village rosters, shrine repairs, bridge watches, and marriage debts all find their way into registers whose plain pages decide more quarrels than a boastful sword ever could.\n\nThe North Nipponese people move within the Nipponese cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross Nippon, there is no passive frontier for Shisuma. Nippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.488.a:0 "Balance the river clans."

 war_unique_intro_events.489.t:0 "Takai's High Castles"
 war_unique_intro_events.489.d:0 "Takai's castles make the sky feel administered. Stone gates cling to ridges, warrior houses drill above cloud banks, and mountain law descends on valleys with the certainty of a winter road patrol.\n\nThe North Nipponese people move within the Nipponese cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross Nippon, there is no passive frontier for Takai. Nippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.489.a:0 "Hold the high gate."

 war_unique_intro_events.490.t:0 "Janarjaya's Rainforest Grove"
 war_unique_intro_events.490.d:0 "Janarjaya crowns kings beneath rain-heavy branches. Southern Indish rites mingle with grove offerings, monsoon drums, elephant paths, and priests who know that a throne set too far from the trees may lose the spirits before it loses the people.\n\nThe South Indish people move within the Indish cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nAcross Eastern Colonies, there is no passive frontier for Janarjaya. Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.490.a:0 "Crown the grove kings."

 war_unique_intro_events.491.t:0 "Turjuk Siege Riders"
 war_unique_intro_events.491.d:0 "The Turjuks carry the desert on horseback and bring siege smoke with them. Their camps move between wells, their guns follow roads others thought too poor for armies, and their emirs understand that speed and artillery are only contradictions to men who lack horses.\n\nThe Bedouin people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nAcross Sudron, there is no passive frontier for Turjuks. Then came Anmar Fakir, Prophet of the Sun, proclaiming the One Faith and the Solar Mandate. In thirty years he rode from coast to deep desert, binding cities, tribes, ports, scholars, corsairs, assassins, and horse clans into a realm that could speak one truth even when it argued over every practical detail. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.491.a:0 "Loose the horse guns."

 war_unique_intro_events.492.t:0 "Cuexotl's Hidden Causeways"
 war_unique_intro_events.492.d:0 "Cuexotl is stitched together by causeways outsiders mistake for mud, old stone, or coincidence. Skink patrols clear drowned glyphs, Saurus cohorts wait beneath broad leaves, and every sunken plaque is treated as an order delayed rather than forgotten.\n\nThe Southlands Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the New Coast, there is no passive frontier for Cuexotl. The End Times make hesitation dangerous even for a people built around patience. The stars shift, the winds of magic turn foul, and the enemies of the Old Ones multiply faster than any scattered temple outpost can answer alone. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.492.a:0 "Clear the sunken plaques."

 war_unique_intro_events.493.t:0 "Teotiqua's Star-Stepped Pyramids"
 war_unique_intro_events.493.d:0 "Teotiqua rises in star-stepped silence. Skink priests climb wet stone before dawn, astronomers paint the sky's warnings onto bark and gold, and the city keeps its isolation like a ritual tool too sacred for careless hands.\n\nThe Southlands Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Mangrove Coast, there is no passive frontier for Teotiqua. Long before Elf or Man wrote history, the Old Ones descended from the stars and ordered the world according to designs too vast for warm-blooded memory. The temple-cities, plaques, spawning pools, geomantic paths, and sacred calendars remain as fragments of that first command. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.493.a:0 "Read the star glyphs."

 war_unique_intro_events.494.t:0 "Oreon's Jungle Glade"
 war_unique_intro_events.494.d:0 "The Bowmen of Oreon guard a green memory far from the deep courts of Athel Loren. Their glade is ringed by jungle heat, watch platforms, waystones carried across impossible distance, and arrows that speak before trespassers learn the language.\n\nThe Asrai Elves move within the Wood Elves cultural world, and public life is shaped by Asrai spirit-faith in court, shrine, camp, and market. Asrai belief binds elf and spirit to the forest, where beauty and vengeance share the same roots.\n\nAcross the New Coast, there is no passive frontier for Bowmen of Oreon. Oreon's enclave makes that truth harder. The Southlands are not Bretonnian marches or Imperial logging roads; they are steaming jungle, Lizardmen memories, human caravans, undead relics, beasts, and strangers who cannot understand why a handful of elves treat one glade as the center of the world. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§RAs a Wood Elf, you have a tough time administering lands outside of Forest.§!"
 war_unique_intro_events.494.a:0 "Loose arrows through green haze."

 war_unique_intro_events.495.t:0 "The Cold Empire Ascendant"
 war_unique_intro_events.495.d:0 "The Cold Empire is not born in warmth, ambition, or compromise. It is assembled from temple-cities, plaques, Slann decrees, Saurus discipline, Skink administration, and the ancient certainty that the world was made to be corrected.\n\nThe Hexoatl Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Old Ones in court, shrine, camp, and market. The Old Ones are remembered through plaques, spawning pools, stars, and duty, turning lost command into present obligation.\n\nAcross the Isthmus of Lustria, there is no passive frontier for Cold Empire. Yet restoration is not mere nostalgia. Lustria, the Southlands, the Dragon Isles, ruined outposts, living cities, and forgotten plaques all carry different scars. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.495.a:0 "Enact the Great Plan."

 war_unique_intro_events.496.t:0 "Khuresh, the Living Warning"
 war_unique_intro_events.496.d:0 "Khuresh does not need to raise its voice. The jungle speaks in constriction, venom, wet stone, missing caravans, and court masks polished until the eyes behind them matter more than the face.\n\nThe Khureshi Snakefolk move within the Snakefolk cultural world, and public life is shaped by animist custom in court, shrine, camp, and market. Animist custom treats land, ancestor, beast, and spirit as present powers whose favor must be earned daily.\n\nAcross South Khuresh, there is no passive frontier for Khuresh. Khuresh does not welcome the outside world. Its jungles breathe wet heat, its rivers hide teeth, and its temples remember rites older than most maps. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.496.a:0 "Make the jungle answer."

 war_unique_intro_events.497.t:0 "The Blood-Gong Unites the Isles"
 war_unique_intro_events.497.d:0 "The Dragon Isles no longer need to pretend one clan's altar is the whole archipelago. Gem harbors, volcanic sanctuaries, dragon masks, altar courts, and bloodline chiefs now face the harder task of becoming a realm without forgetting why every island feared every other.\n\nThe Dragon Isles Lizardmen move within the Lizardmen cultural world, and public life is shaped by the Dragon Cult in court, shrine, camp, and market. The Dragon Cult makes terror, tribute, and sacred blood into politics beneath wings that may bless or burn.\n\nAcross Nippon, there is no passive frontier for Dragon Isles. Beyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.497.a:0 "Make the blood-chiefs kneel."

 war_unique_intro_events.498.t:0 "Nippon, One Realm One Blade"
 war_unique_intro_events.498.d:0 "Nippon unified is not Nippon pacified. The banners may face one throne, but every castle remembers who surrendered late, every temple remembers which lord paid poorly, and every samurai knows peace can be another dueling ground.\n\nThe North Nipponese people move within the Nipponese cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nNo place within Nippon is passive. Nippon is an island realm of ceremony, pride, and violence. Emperors, shoguns, daimyo, samurai, ashigaru, monks, merchants, and hidden things in the mountains all contest what order should mean when every province remembers a different insult. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.498.a:0 "Forge one realm."

 war_unique_intro_events.499.t:0 "Strygos Reborn"
 war_unique_intro_events.499.d:0 "Strygos remembers Mourkain as more than ruin. It remembers Ushoran's dream of a vampire kingdom that could rule openly, Strigoi pride before exile made it feral, and Kadon's shadow over crowns, corpses, and the first dark magic of the marsh kings.\n\nThe Strigany people move within the Strigany cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Badlands, there is no passive frontier for Strygos. The old realm was built in the Badlands where living tribes, dead kings, Orc migrations, Nehekharan relics, and hungry roads all pressed against one another. It did not fall because its dream was small. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.499.a:0 "Restore Mourkain."

 war_unique_intro_events.500.t:0 "Araby and the Solar Mandate"
 war_unique_intro_events.500.d:0 "Araby unified stands beneath a sun that is both blessing and accusation. Its cities, tribes, scholars, corsairs, assassins, horse clans, ports, and desert saints now share a truth bright enough to reveal every unfinished quarrel.\n\nThe Cophic people move within the Arabyans cultural world, and public life is shaped by the One Faith in court, shrine, camp, and market. The One Faith burns with solar certainty, demanding public belief and visible favor against doubt, heresy, and older bargains.\n\nNo place within Araby is passive. Beyond Araby, the world needs saving and will resent the instruction. Nehekhara broods in death, the Southlands teem with rival faiths, Tilean merchants sniff at doctrine, and daemons do not become less real because scholars name them carefully. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.500.a:0 "Let the world face the Light."

 war_unique_intro_events.501.t:0 "Nehekhara's Seventh Dynasty"
 war_unique_intro_events.501.d:0 "Nehekhara rises not as a memory, but as a verdict. The Seventh Dynasty gathers cracked crowns, mortuary ledgers, awakened legions, chariot roads, priestly jealousies, and kings who have spent centuries deciding exactly how the world should be punished for moving on.\n\nThe Nehekharan people move within the Nehekharan cultural world, and public life is shaped by the Nehekharan pantheon in court, shrine, camp, and market. The Nehekharan gods sanctify kingship older than the living nations, and their rites turn deathless pride into policy.\n\nNo place within Nehekhara is passive. The situation is deathless, royal, and heavy with every oath the sand preserved, so we must raise the Seventh Dynasty and make Nehekhara's legions march as one empire once more. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.501.a:0 "Raise the Seventh Dynasty."

 war_unique_intro_events.502.t:0 "The Corpse-Lanterns of Gyjaar"
 war_unique_intro_events.502.d:0 "Gyjaar was never meant to host a court of the dead. Its humid wharves were built for spice bales, pearl divers, temple taxes, and pilgrim vessels hugging the coast of Ind, not for black sails and corpse-crews that answer to a captain who has forgotten the warmth of blood.\n\nThe East Indish people move within the Indish cultural world, and public life is shaped by vampiric rites in court, shrine, camp, and market. Vampirism makes bloodline, secrecy, hunger, and aristocratic patience into instruments of rule.\n\nAcross the Vampire Coast, there is no passive frontier for Gyjaar Dead Fleet. The Vampire Coast is piracy and necromancy fused into government. In Gyjaar that government wears Indish silk over rotten ribs: counting houses become mortuaries, harbor shrines become blood-jars, and merchant clans learn that tribute can be paid before death or after it. If it meets the moment boldly, old borders can become beginnings instead of cages.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
 war_unique_intro_events.502.a:0 "Light the corpse-lanterns."

 war_unique_intro_events.503.t:0 "Dvaraka and the Western Tide"
 war_unique_intro_events.503.d:0 "Dvaraka stands where pearl boats, spice merchants, temple pilgrims, and monsoon pilots all argue with the same wind. The larger courts of Ind may call us small, but they still need the sea roads that pass our shrines.\n\nThe Dvarakan people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Dvaraka. The western tide-road brings wealth, strangers, and danger in equal measure. Arabyan captains, Indish guilds, temple factors, and coastal clans all count profit differently, so the court must make their bargains legible before rivals make them permanent. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.503.a:0 "Bless the western tide-road."

 war_unique_intro_events.504.t:0 "Magadha's Old Ledgers"
 war_unique_intro_events.504.d:0 "Pataliputra remembers empire even when Magadha commands only a narrow court. Old roads, old shrines, old tax registers, and old names still gather in the city like dust in a royal archive.\n\nThe Magadhan people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Magadha. Memory alone will not protect us from Delehi, jungle princes, ambitious priests, or hungry neighbours. The old ledgers must become working government again, with every ferry, field, temple gift, and caravan mark counted before larger hands claim them. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.504.a:0 "Open the old ledgers."

 war_unique_intro_events.505.t:0 "Malwa and Lustria's Gift"
 war_unique_intro_events.505.d:0 "Malwa's cocoa groves are more than rare wealth. They are honoured as a gift from distant Lustria, a sweetness placed into Ind's world-structure beside the courts of the ancient civilisation.\n\nThe Malwi people move within the Indish cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Above the groves, the Chaukrikhamba mountains guard an abandoned temple-city where the bones of a toad-shaped giver of law are said to project visions of judgement.\n\nAcross Eastern Ind, there is no passive frontier for Malwa. The situation is sacred, wealthy, and watched by every court that would rather own the gift than respect it, so we must climb toward the old judgement, keep the cocoa offerings pure, and make ancient law speak through the living court."
 war_unique_intro_events.505.a:0 "Seek the toad-lawgiver's judgement."

 war_unique_intro_events.506.t:0 "Jaffna's Pearl Dues"
 war_unique_intro_events.506.d:0 "Jaffna lives by pearl water, palmyra roads, island shrines, and the narrow calculations of a court watched by stronger neighbours. Every diver, priest, ferry master, and clan elder knows how quickly a small realm can become someone else's harbor.\n\nThe Jaffnan people move within the Indish cultural world, and public life is shaped by druidic rites in court, shrine, camp, and market. Druidic rites keep stone, mist, storm, and old magic speaking when younger kingdoms hear only wilderness.\n\nAcross Ind's End, there is no passive frontier for Jaffna. The situation is bright with pearls and sharp with danger, so we must count the pearl dues and make this island court difficult to swallow. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.506.a:0 "Count the pearl dues."

 war_unique_intro_events.507.t:0 "Chittagong at the River Mouth"
 war_unique_intro_events.507.d:0 "Chittagong watches the river mouth where pilots, fishermen, spice boats, pilgrims, and foreign merchants crowd the humid quays. The delta is generous, but it hides knives in reeds, debts in ledgers, and rival claims behind every polite embassy.\n\nThe Chittagonian people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Eastern Ind, there is no passive frontier for Chittagong. A harbor court survives by knowing the channels better than its enemies. We must secure the pilots, count the markets, appease the shrines, and make the eastern roads answer to our officials before larger courts arrive with their own seals. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.507.a:0 "Secure the harbor pilots."

 war_unique_intro_events.508.t:0 "Anuradha of the Sacred Tanks"
 war_unique_intro_events.508.d:0 "Anuradha sits among sacred tanks, dagoba roads, rice fields, and old island chronicles. Larger courts may overlook a lake-bound city, but every bund and shrine gives the realm another way to endure.\n\nThe Anuradhan people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Anuradha. The island roads must be made legible before stronger neighbours turn them into tribute routes. Priests, reservoir keepers, village headmen, and spear retainers all need to see the same court when they look toward Anuradha. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.508.a:0 "Raise the lake banners."

 war_unique_intro_events.509.t:0 "Kalinga and the Elephant Coast"
 war_unique_intro_events.509.d:0 "Kalinga holds the eastern coast where elephant roads, salt markets, hill shrines, and surf-lashed ports meet. Its wealth is broad, but broad wealth invites many hands.\n\nThe Kalingan people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Kalinga. The court must bind mahouts, temple houses, coastal guilds, and inland farmers before old masters or new raiders divide them. Every road from hill to harbor should answer to our seal. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.509.a:0 "Command the elephant coast."

 war_unique_intro_events.510.t:0 "Ayodhya on the Sarayu Road"
 war_unique_intro_events.510.d:0 "Ayodhya stands beside the Sarayu, heavy with epic memory and pilgrim dust. Sacred kingship is powerful, but memory cannot guard a gate by itself.\n\nThe Ayodhyan people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Ayodhya. The roads, ferries, shrines, and market courts must be ordered so that pilgrims feed the city and soldiers defend the pilgrim road. Every oath to the old kings must become useful government. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.510.a:0 "Guard the sacred road."

 war_unique_intro_events.511.t:0 "Kochi at the Pepper Quay"
 war_unique_intro_events.511.d:0 "Kochi lives where pepper quays, backwater pilots, temple warehouses, and monsoon traders crowd the wet coast. Rich harbors are rarely allowed to remain quiet.\n\nThe Kochian people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Kochi. The situation is humid, mercantile, and too profitable to leave unguarded, so we must open the pepper quay and make the harbor answer to us. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.511.a:0 "Open the pepper quay."

 war_unique_intro_events.512.t:0 "Tanjore of the Bronze Granaries"
 war_unique_intro_events.512.d:0 "Tanjore commands Kaveri fields, bronze temples, music halls, and granaries dense enough to tempt every hungry court nearby. The delta is generous, but only disciplined rulers keep generosity from becoming plunder.\n\nThe Tanjori people move within the Indish cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross Western Ind, there is no passive frontier for Tanjore. The situation is fertile, artistic, and watched by stronger claimants, so we must fill the bronze granaries and make Tanjore a court of its own. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.512.a:0 "Fill the bronze granaries."

 war_unique_intro_events.513.t:0 "Varanasi and the Sacred Ghats"
 war_unique_intro_events.513.d:0 "Varanasi burns bright on the sacred river, where ghats, silk weavers, scholars, pilgrims, and priests fill the city with restless authority. Holiness draws wealth, and wealth draws danger.\n\nThe Varanasi people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Varanasi. The situation is sacred, crowded, and too important to be merely possessed, so we must light the sacred ghats and let Kashi speak for itself. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.513.a:0 "Light the sacred ghats."

 war_unique_intro_events.514.t:0 "Mithila of the Painted Courts"
 war_unique_intro_events.514.d:0 "Mithila lies among river fields, marriage roads, painted courts, and scholar houses that remember older rights than most armies. Its quiet refinements hide hard political value.\n\nThe Mithilan people move within the Indish cultural world, and public life is shaped by Cathayan harmony in court, shrine, camp, and market. Cathayan harmony asks every office, household, temple, and army to move in balance even when the throne itself is silent.\n\nAcross Western Ind, there is no passive frontier for Mithila. The situation is learned, river-fed, and woven through obligations, so we must unroll the painted ledgers and make Mithila difficult to divide. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.514.a:0 "Unroll the painted ledgers."

 war_unique_intro_events.515.t:0 "Rajgir Behind the Hill Gates"
 war_unique_intro_events.515.d:0 "Rajgir rests behind hills, old roads, cave shrines, and stone memories of kingdoms that once shaped all Ind. Age gives dignity, but only preparation gives survival.\n\nThe Rajgiri people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Rajgir. The hill gates, quarry roads, shrine accounts, and royal names must be put back to work. A city of old walls cannot afford to let its past be used by others. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.515.a:0 "Seal the hill gates."

 war_unique_intro_events.516.t:0 "Konark and the Sun Chariot"
 war_unique_intro_events.516.d:0 "Konark rises around sun temples, stone chariot wheels, coastal pilgrim markets, and masons whose work makes rulers look small. Such splendor must be protected before it becomes someone else's trophy.\n\nThe Konarki people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Ind's End, there is no passive frontier for Konark. The court must bind pilgrims, sculptors, Odra nobles, harbor brokers, and temple guards into one disciplined order. The sun road should enrich Konark first. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.516.a:0 "Harness the sun chariot."

 war_unique_intro_events.517.t:0 "Goa on the Mandovi Channels"
 war_unique_intro_events.517.d:0 "Goa watches the Mandovi channels where coconut groves, spice creeks, forest roads, and western sea brokers meet. The harbor is modest only to those who cannot read water.\n\nThe Goan people move within the Indish cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Eastern Ind, there is no passive frontier for Goa. Pilots, temple houses, spice gatherers, timber men, and foreign captains must be brought under a single coastal law. A port that does not govern its creeks will soon be governed from elsewhere. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.517.a:0 "Mark the Mandovi channels."

 war_unique_intro_events.518.t:0 "Ashenmark on the Slag Road"
 war_unique_intro_events.518.d:0 "Ashenmark squats where old slag paths and broken watchfires overlook the Dark Lands. Its people are Pigbarterite refugees, caravan knifemen, and charcoal-faced toll collectors who learned to survive between Orc mobs and Dawi-Zharr demands.\n\nThe Pigbarterite people move within the Darklands Human cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the Blasted Wastes, there is no passive frontier for Ashenmark. The situation is ashen, crowded, and ringed by powers that respect only profit behind walls, so we must mark the ash-road tolls and make this border post too useful to crush. The road will pay, or the road will burn. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.518.a:0 "Mark the ash-road tolls."

 war_unique_intro_events.519.t:0 "Black Hollow Beneath the Crags"
 war_unique_intro_events.519.d:0 "Black Hollow survives under crags that even Orcs prefer to raid quickly and leave. Its Pigbarterite families keep cave stalls, smoke rooms, hostage ledgers, and watchmen who can price a stranger before greeting him.\n\nThe Pigbarterite people move within the Darklands Human cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the Southern Wastes, there is no passive frontier for Black Hollow. The situation is cramped, smoky, and useful to every caravan that fears the open road, so we must light the hollow markets and make darkness serve the republic. Anyone coming for loot should find accounts, alarms, and crossbows instead. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.519.a:0 "Light the hollow markets."

 war_unique_intro_events.520.t:0 "Sootwater after the Warrens"
 war_unique_intro_events.520.d:0 "Sootwater stands over black streams and old holes that still smell of Skaven fear-sweat. Pigbarterite settlers have learned to build wharves above the mud, store grain in sealed lofts, and keep dogs listening at every cellar door.\n\nThe Pigbarterite people move within the Darklands Human cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the Southern Wastes, there is no passive frontier for Sootwater. The situation is damp, suspicious, and threaded by tunnels that should belong to us before they belong to anyone else, so we must sound the black-water bells. If the Under-Empire scratches upward, Sootwater will answer with fire and invoices. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.520.a:0 "Sound the black-water bells."

 war_unique_intro_events.521.t:0 "Ironflow at the Ashen Falls"
 war_unique_intro_events.521.d:0 "Ironflow rises where rust water runs from the high rocks and abandoned Skaven diggings bite into the earth. Its Pigbarterite council knows that iron, tolls, and suspicion are the only laws the Dark Lands consistently respect.\n\nThe Pigbarterite people move within the Darklands Human cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the Southern Wastes, there is no passive frontier for Ironflow. Krizzor claws once worked these falls from below, leaving tunnels too valuable to abandon and too dangerous to trust. We must seal what cannot be used, guard what can, and make the road pay for every nail. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.521.a:0 "Raise the iron toll chains."

 war_unique_intro_events.522.t:0 "Cindervein and the Copper Road"
 war_unique_intro_events.522.d:0 "Cindervein is a hard camp of copper seams, furnace smoke, and Pigbarterite prospectors who sleep with ledgers under their knives. The Greenskins wanted the metal as loot, but we want it as policy.\n\nThe Pigbarterite people move within the Darklands Human cultural world, and public life is shaped by the Old World cults in court, shrine, camp, and market. The Old World cults keep many shrines and older vows alive, making compromise a survival craft as much as a doctrine.\n\nAcross the Blasted Wastes, there is no passive frontier for Cindervein. The situation is hot, narrow, and full of wealth that can disappear into raider hands overnight, so we must count the copper seams and make Cindervein a republic of armed accounts. Every ingot should leave under seal or not leave at all. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.522.a:0 "Count the copper seams."

 war_unique_intro_events.523.t:0 "Da Slagjawz Bite Down"
 war_unique_intro_events.523.d:0 "Da Slagjawz claim the iron ground because nobody nearby was big enough to stop them at the right moment. Their bosses paint jaws on shields, hammer scrap plates into armor, and call every mine road a challenge waiting for teeth.\n\nThe Dark Land Orcs move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Blasted Wastes, there is no passive frontier for Slagjawz. The situation is rusty, loud, and full of metal that wants turning into choppas, so we must clamp da slag jaws and make Grimgore answer to our roar. If the ground is iron, the Waaagh should bite harder. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.523.a:0 "Clamp da slag jaws."

 war_unique_intro_events.524.t:0 "Bonegrabba Sneaky Piles"
 war_unique_intro_events.524.d:0 "Bonegrabba is a Goblin hold of bone heaps, fungus pits, and nervous little bosses who insist nervousness is just cleverness with better hearing. The Drippin Fangs left plenty of old threats behind, but threats can be stolen if painted properly.\n\nThe Common Goblins move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Southern Wastes, there is no passive frontier for Bonegrabba. The situation is brittle, sneaky, and full of trophies waiting to be renamed, so we must rattle da bone piles and make Zorn Uzkul laugh at bigger enemies. A Goblin realm wins by choosing where the panic begins. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.524.a:0 "Rattle da bone piles."

 war_unique_intro_events.525.t:0 "Da Ironmaw Boyz Roar"
 war_unique_intro_events.525.d:0 "Da Ironmaw Boyz say the hills already had the right name, so the tribe only made it official by shouting louder. Their bosses judge land by how well it feeds mobs, mounts, and fights that start before breakfast.\n\nThe Dark Land Orcs move within the Greenskins cultural world, and public life is shaped by Gork and Mork in court, shrine, camp, and market. Gork and Mork speak through brawl, cunning, noise, and momentum, rewarding the mob that finds the next fight fastest.\n\nAcross the Blasted Wastes, there is no passive frontier for Ironmaw Boyz. The situation is hungry, brutal, and close to enemies that look better after being hit, so we must open da iron maw and make the lads follow the loudest bite. If the tribe keeps moving, even the hills will sound like war drums. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.525.a:0 "Open da iron maw."

 war_unique_intro_events.526.t:0 "Mawfang at the Pass"
 war_unique_intro_events.526.d:0 "Mawfang guards a pass where caravans learn the difference between tolls and being eaten. The tribe broke from the Goldtooth shadow with enough bruisers, cattle hooks, and appetite to call the ridge its own.\n\nThe Mountain Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Mawfang. The situation is steep, hungry, and profitable to anyone with teeth enough to enforce a price, so we must bite the pass tribute and make Mawfang more than a campsite. Every caravan should leave lighter and grateful to still have legs. If it meets the moment boldly, old borders can become beginnings instead of cages."
 war_unique_intro_events.526.a:0 "Bite the pass tribute."

 war_unique_intro_events.527.t:0 "Firebelly Maw Burning Feast"
 war_unique_intro_events.527.d:0 "Firebelly Maw gathers around smoking iron, hot stones, and priests who insist the Great Maw likes its meals cooked with proper screaming. The Suneaters left embers here, and our butchers intend to make them a country.\n\nThe Firedrinker Ogre people move within the Ogres cultural world, and public life is shaped by the Great Maw in court, shrine, camp, and market. The Great Maw makes hunger holy, so tribute, conquest, and survival all begin with appetite.\n\nAcross the Mountains of Mourn, there is no passive frontier for Firebelly Maw. The situation is hot, sacred, and full of rivals who look flammable when viewed through faith, so we must feed the sacred flame and make Skullhammer Peaks a shrine with fists. If the Maw is hunger, fire is how we season obedience. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.527.a:0 "Feed the sacred flame."

