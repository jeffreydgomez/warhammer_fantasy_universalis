 war_unique_intro_events.543.t:0 "Bloodsands and the Red Surf"
 war_unique_intro_events.543.d:0 "Bloodsands rises where dunes, wreckage, and red surf meet. The warband marks the coast with brass scraps and skull piles, promising Khorne that every landing, raid, and challenge will end in a proper offering.\n\nThe Aghols people move within the Hung cultural world, and public life is shaped by Khornate worship in court, shrine, camp, and market. Khorne demands proof in blood, courage, and relentless contest; hesitation is a confession made before the axe falls.\n\nAcross the New Coast, there is no passive frontier for Bloodsands. The situation is hot, hungry, and watched by weaker shores, so we must mark the red surf before rivals mistake the sand for empty ground. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.543.a:0 "Mark the red surf."

 war_unique_intro_events.544.t:0 "Mireblessed in the Fire Bogs"
 war_unique_intro_events.544.d:0 "The Mireblessed Host gathers in bog heat, fever mist, and rot-bloomed paths. Nurgle's gifts turn mud into defense, sickness into fellowship, and every ruined camp into a garden that smiles back.\n\nThe Kul people move within the Kurgan cultural world, and public life is shaped by Nurglite devotion in court, shrine, camp, and market. Nurgle turns suffering into fellowship and decay into endurance, making every wound a promise that the faithful will continue.\n\nAcross South Lustria, there is no passive frontier for Mireblessed Host. The situation is wet, diseased, and patient, so we must bless the bog paths before cleaner enemies learn how slowly they can die here. The crisis is to make nearby roads, courts, and rivals serve its purpose before they become the path by which danger arrives."
 war_unique_intro_events.544.a:0 "Bless the bog paths."

 war_unique_intro_events.545.t:0 "Wraithscarred Oaths"
 war_unique_intro_events.545.d:0 "Wraithland gives the Wraithscarred iron, cold, and omens that refuse to stay buried. The warband carves black oaths into stone and offers each raid to Chaos Undivided, letting the gods quarrel after the blades are cleaned.\n\nThe Tahmaks people move within the Kurgan cultural world, and public life is shaped by Chaos Undivided in court, shrine, camp, and market. Chaos Undivided binds rival hungers into one dark road, where every victory is an argument made before all the gods.\n\nAcross the Broken Lands, there is no passive frontier for Wraithscarred. The situation is haunted, useful, and cruelly isolated, so we must carve the black oaths before the shadows decide we are only trespassers. Its opportunity is to turn geography into command, so the surrounding powers answer its will rather than its weakness."
 war_unique_intro_events.545.a:0 "Carve the black oaths."

 war_unique_intro_events.546.t:0 "Vijayanagara's Palatial Claw"
 war_unique_intro_events.546.d:0 "Vijayanagara was the great fourth power of Ind before wars against Bhojapuri and Dark Elf reavers broke the Tigerkin Raja's reach. The shrines and monuments of the First White Tiger Kemau, the black war-tiger She'ar Khawn, and Gilgadresh, Great Companion of Tigerkind, still carry the shame of desecration.\n\nThe Tigerkin move within the Eastern Beastfolk cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. These southern Tiger states are called the mystic heart and Old Ones' cradle, yet Bhashiva's triumphant return from Cathay took northern Bengal from the ruins while the jungle tribes slipped their bonds.\n\nAcross Ind's End, there is no passive frontier for Vijayanagara. The situation is wounded, sacred, and dangerous, so the Palatial Claw must restore the old monuments, rebind the tribes, and make lost glory useful before rivals decide the fourth power is only a memory."
 war_unique_intro_events.546.a:0 "Raise the Palatial Claw."

 war_unique_intro_events.547.t:0 "Pandarapura's Iron Shrine"
 war_unique_intro_events.547.d:0 "Pandarapura holds iron hills where shrine bells answer furnace hammers. Tigerkin guards mark the toll roads with claw signs, and every load of ore reminds the court that metal is only wealth if the road remains loyal.\n\nThe Tigerkin move within the Eastern Beastfolk cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Ind's End, there is no passive frontier for Pandarapura. The situation is hard, sacred, and worth stealing, so we must mark the iron shrine before stronger courts turn our hills into their workshops. To endure, it must make the region remember its name before larger powers write the next chapter."
 war_unique_intro_events.547.a:0 "Mark the iron shrine."

