 war_unique_intro_events.551.d:0 "Jabalpur counts cotton, ford tolls, and rock gates under the eyes of golden-paw sentries. The tigerfolk court knows that soft cloth can buy hard walls when ledgers, guards, and shrines agree.\n\nThe Tigerkin move within the Eastern Beastfolk cultural world, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. The Thousand Gods fill shrine, market, road, and court with layered obligations, making plural devotion a foundation for rule.\n\nAcross Western Ind, there is no passive frontier for Jabalpur. The situation is commercial, defensible, and watched from every road, so we must seal the cotton fords before someone else learns where the bales cross. To endure, it must make the region remember its name before larger powers write the next chapter."
