l_english:
  
 war_unique_intro_events.1.t:0 "The Guns of Wissenland"
 war_unique_intro_events.1.d:0 "Wissenland is loyal to the Empire, but loyalty alone will not keep the south secure. The province is proud, well armed, and watched by neighbors who know that Nuln's foundries can decide wars before the first banner is raised.\n\nEmmanuelle von Liebwitz rules from a court where refinement and artillery smoke exist side by side. Nobles whisper about her priorities, burghers count contracts from the gunworks, and soldiers look south toward the Black Mountains, Tilea, and every road by which trouble might enter the Empire.\n\nThe Empire around us is weakened by greed, cowardice, and factional exhaustion. Reikland claims the burden of unity, but every Elector knows that unity often means someone else's taxes, soldiers, and pride being spent first. Wissenland cannot afford to be merely obedient.\n\nNuln's engineers, Wissenburg's estates, village levies, and provincial officers must be made to serve one policy. The situation is fragile, so we must bind cannon, coin, and local privilege before outside pressure turns every argument into a siege.\n\nIf Wissenland disciplines its wealth and firepower, it may become the southern hinge of Imperial survival. If it fails, the guns of Nuln will be prizes for whoever reaches them first."
 war_unique_intro_events.1.a:0 "Hold Wissenland together."

 war_unique_intro_events.2.t:0 "The Price of Freedom"
 war_unique_intro_events.2.d:0 "Westerland lives by contracts that the rest of the Empire still calls treason. Marienburg bought its freedom with coin, nerve, and foreign guarantees, and every merchant prince in the counting houses knows that independence remains a debt that must be paid daily.\n\nThe harbor is a world unto itself. Imperial agents, Bretonnian envoys, sea captains, old cult priests, smugglers, guild factors, and foreign bankers all crowd the same quays, each convinced that Westerland can be turned toward their purpose if the price is right.\n\nYet wealth is not safety. Reikland remembers the province as Imperial, Bretonnia watches the western approaches, pirates test the river mouth, and the Stadsraad must pretend that every faction in the city is merely a commercial interest rather than a possible crisis.\n\nThe situation is profitable and dangerous, so we must make freedom defend itself. A republic of ledgers, ships, militias, and negotiated loyalties can endure only if every bargain strengthens the walls as well as the purse.\n\nIf Marienburg keeps the sea lanes open and its councils united, Westerland may remain too useful to reclaim. If the ledgers fail, every neighbor will rediscover its principles."
 war_unique_intro_events.2.a:0 "Keep the ledgers open."

 war_unique_intro_events.3.t:0 "The Royarch's Burden"
 war_unique_intro_events.3.d:0 "Couronne bears the crown of Bretonnia, and Louen Leoncoeur bears the hopes of every knight who still believes the Lady watches. Songs call the realm blessed, but no song lingers long on hungry peasants, jealous dukes, Beastmen in the woods, or the shame that gathers around cursed Mousillon.\n\nThe king's cause is noble because the age is not. Chivalry must be more than gilded ceremony, more than tournaments and polished vows recited above fields worked by frightened serfs. If Bretonnia is to stand as the sword of righteousness, its lords must be made to remember whom that sword protects.\n\nEvery dukedom has its pride. Every court has its grievance. The Grail, the lance, the chapel, and the field all pull the realm toward glory, while ambition and old feuds pull it apart. The situation is shining and strained, so we must make royal command feel like sacred duty rather than another duke's demand.\n\nLouen's crown is not merely a jewel; it is an oath before the Lady. Beastmen, vampires, dishonor, and selfish nobles must learn that the royal lance still has a point.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.3.a:0 "Ride for the Lady."

 war_unique_intro_events.4.t:0 "Blood on the Longships"
 war_unique_intro_events.4.d:0 "The Vargs know the sea, the axe, and the red hunger of Khorne. Their longships are not merchants' hulls or fisher craft; they are teeth carved from timber, sent south to bite at every coast soft enough to bleed.\n\nGialli Shiptaker rules warriors who would rather die in a storm of blades than grow old hearing cautious men talk of winter stores. In the north, reputation is meat, shelter, and prophecy. A weak jarl is eaten by rumor before an enemy ever reaches his hall.\n\nThe Empire, Kislev, and Bretonnia speak of raiders as if they were storms. The Vargs know better. A storm has no memory, but a raider remembers which shrine burned well, which gate cracked quickly, and which coward paid to be spared.\n\nRaiding is politics among Norscans as much as war against the south. Every captured banner buys loyalty, every bloodied champion quiets a rival, and every ship that returns heavy with plunder proves the gods favored the risk.\n\nThe situation is ripe for slaughter, so we must turn every feud outward and every sail toward plunder. The gods do not reward stillness, and Khorne least of all.\n\nIf the Vargs keep their longships hungry, they may become more than another terror on the coast. They may become the northern blade by which the coming age learns its first lesson.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.4.a:0 "Launch the longships."

 war_unique_intro_events.5.t:0 "Contracts of Remas"
 war_unique_intro_events.5.d:0 "Remas was once the heart of a greater human order, and its stones remember more than city-state squabbles. The marble, markets, temples, and old roads all whisper of a time when southern law was more than a negotiable convenience.\n\nTedice di Monferrato commands merchants, captains, guilds, and Myrmidian priests who all understand discipline in different currencies. A Tilean prince may speak of honor, but contracts decide which army arrives, which wall is repaired, and which rival finds his allies suddenly busy elsewhere.\n\nThe city-states of Tilea are brilliant and exhausting. Remas, Miragliano, Luccini, and every lesser harbor turn wealth into intrigue as naturally as sailors turn wind into motion. Mercenaries are kings for a contract, and loyalty is weighed in coin before it is weighed in blood.\n\nYet beneath the quarrels lies the Reman dream. The situation is divided, so we must make contracts do what crowns have failed to do: bind ambition into a common project before foreign powers or jealous neighbors spend our legacy for us.\n\nIf Remas can outwit, outlast, and outfight the other cities, the old eagle may rise again. If not, our descendants will inherit only ledgers describing what greatness used to cost."
 war_unique_intro_events.5.a:0 "Sign the contracts."

 war_unique_intro_events.6.t:0 "The Forest Chooses"
 war_unique_intro_events.6.d:0 "Athel Loren is no ordinary realm, and its borders are not lines on a map. The forest dreams, bargains, hunts, remembers, and kills. Outsiders see trees; the Asrai see courts, shrines, spirits, grudges, and paths that do not forgive trespass.\n\nAriel dreams in roots and magic, while Orion hunts through blood and antlered fury. Between them, the Asrai live in a tension older than many human kingdoms: preservation against wrath, patience against the Wild Hunt, isolation against the need to strike before corruption reaches the glades.\n\nThe world beyond the boughs grows darker. Men cut, Dwarfs mine, Beastmen foul the deep woods, and Chaos presses against every old protection. The forest can hide much, but it cannot hide from an age that means to burn everything.\n\nAthel Loren's courts do not agree on what survival requires. Some spirits whisper that every outsider is future kindling, while some elves know old alliances may be the difference between a guarded glade and a beautiful tomb.\n\nThe situation beyond the trees darkens, so we must decide how far the forest's shadow should reach. Isolation may preserve us, but the world may burn close enough for the leaves to catch.\n\nIf Ariel's wisdom and Orion's fury can be made to answer the same threat, the forest will not merely endure. It will decide which borders the outside world is allowed to have.\n\n§RAs a Wood Elf, you have a tough time administering lands outside of Forest.§!"
 war_unique_intro_events.6.a:0 "Guard the forest."

 war_unique_intro_events.7.t:0 "The Northern Hold"
 war_unique_intro_events.7.d:0 "Kraka Drak stands far from the comfort of the southern Karaks, a stubborn oath of stone beneath northern skies. Its halls are Dawi, but its winds are Norscan, and every gate knows the sound of raiders, monsters, and worse things testing the mountain.\n\nThorgard Cromson rules a people shaped by distance. The old roads to the Karaz Ankor are broken or watched by enemies, and messages from the south arrive like echoes from a better age. Isolation has made the hold harder, not humbler.\n\nThe Norse Dwarfs remember the ancestors with the same iron certainty as any Dawi, but their grudges have a colder edge. Chaos is not an abstract horror here. It is a neighbor across the snow, a whisper in a trading camp, a blade glimpsed beyond the pines.\n\nThe situation is cold and unforgiving, so we must make endurance into policy. Mines, forges, clans, and shieldwalls must answer as one, because no rescue can be assumed and no insult can be forgotten.\n\nThe ancestors did not teach us to abandon a mountain simply because the world around it has gone mad. Kraka Drak will either stand as the northern anvil of the Dawi, or be entered into the Dammaz Kron with blood enough to stain the page."
 war_unique_intro_events.7.a:0 "Mark the grudges."

 war_unique_intro_events.8.t:0 "Ironhand's Furnace"
 war_unique_intro_events.8.d:0 "Zharrduk kneels to Hashut, and Astragoth Ironhand makes that devotion practical. Flesh weakens, slaves scream, engines roar, and every chain drawn tight becomes another proof that mercy is inefficient.\n\nThe Dawi-Zharr do not dream of restoration. They dream of domination measured in smoke, iron, and obedient labor. In their ziggurats, sorcerer-prophets speak of sacred fire while overseers make theology useful with whips.\n\nThe Dark Lands reward those who can turn scarcity into machinery. Orcs, Ogres, Hobgoblins, caravans, and lesser tribes all crowd the wastes around us, each one a resource if properly defeated, purchased, or shackled.\n\nAstragoth's failing body is an omen only fools would read as weakness. Iron replaces flesh, command replaces pity, and each new engine proves that the Father of Darkness favors those willing to improve upon nature by force.\n\nThe situation rewards the cruel and organized, so we must be both. Before the Age of Fire and Chains can drown the wider world, the furnaces of our own dominion must be fed without pause.\n\nLet the weak call it tyranny. A chain is simply law made honest, and Zharrduk will teach that honesty in iron. When the furnaces roar loudly enough, even distant kings will hear the shape of their future."
 war_unique_intro_events.8.a:0 "Stoke the furnaces."

 war_unique_intro_events.9.t:0 "Top Knotz in the Tomb Roads"
 war_unique_intro_events.9.d:0 "The Top Knotz squat where dead kings, desert caravans, and nervous towns all give an Orc something to hit. Nehekhara's old roads were built for armies and tribute; that just proves the dead had good ideas before they got boring.\n\nBludgor Necksnapper does not need a map when every road eventually leads to loot or a skull. The lads know the desert is full of shiny tomb doors, soft merchants, and skeletons that get back up for another round if the first hit was not funny enough.\n\nThe Tomb Kings call themselves eternal. The Top Knotz hear that as a challenge. If dead bosses want respect, they can come out of their pyramids and prove they still know how to swing.\n\nEvery raid teaches the tribe a new use for old empires. Tomb roads become WAAAGH paths, broken obelisks become boasting stones, and ancient curses become excellent stories if the cursed lad survives long enough to tell them.\n\nThe situation is full of old stone and soft targets, so we must make the desert louder. The boyz need war, loot, and a boss mean enough to point them at both.\n\nIf the Top Knotz can keep finding fights that get back up, their momentum may roll across the desert like a bad joke with axes. Nehekhara has slept too long to object quickly.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.9.a:0 "Find a fight."

 war_unique_intro_events.10.t:0 "Red Shields Raised"
 war_unique_intro_events.10.d:0 "Red Shield warriors paint their protection in the color of other people's blood. A shield is good for stopping arrows, better for knocking teeth loose, and best when the enemy sees the mark coming and runs anyway.\n\nBashrat Deathbite rules a tribe that sees passes, forts, and borders as invitations. Humans build walls because they are scared. Dwarfs build walls because they are stubborn. The Red Shields are happy to test both explanations.\n\nThe tribe's lands are crowded with rivals and roads worth raiding. A quiet season makes the boyz restless, and restless boyz begin checking whether the boss is still as tough as he sounded last night.\n\nA shield tribe survives by turning defense into swagger. Every stolen gate, battered tower, and captured banner teaches the ladz that holding a line is only useful if the line is moving toward somebody else's valuables.\n\nThe situation is full of enemies, so we must keep the mob angry and moving. A proper warband does not wait for a grand plan when there is a gate nearby and someone behind it yelling.\n\nIf the Red Shields can keep their mobs pointed outward, they will become more than another mountain nuisance. They will be the red mark every border lord learns to fear.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.10.a:0 "Raise the shields."

 war_unique_intro_events.11.t:0 "Grimgor's Red Fangs"
 war_unique_intro_events.11.d:0 "The Red Fangs follow Grimgor Ironhide because he is bigger, meaner, and more certain than the rest. Black Orc discipline does not make them gentle; it makes their violence arrive in a straighter line.\n\nGrimgor does not need ancient claims, clever speeches, or a priest telling him the gods approve. The proof of rule is simple. Stand in front of him and remain standing. So far, the world has not been good at that.\n\nThe Badlands and the mountains are full of enemies who think their grudges, crowns, guns, or sorcery make them special. Grimgor's answer is the same to all of them: find the biggest fight, win it, then find a bigger one.\n\nBlack Orcs remember being made for war, and they resent any moment that pretends otherwise. Around Grimgor, that resentment becomes order: mobs fall into line, lesser bosses stop boasting, and enemies learn that discipline can still be green, brutal, and loud.\n\nThe situation is too quiet, so we must make it louder. Every boss who doubts the Red Fangs can prove it with his teeth, and every enemy who runs can be chased for sport.\n\nIf Grimgor keeps winning, the Red Fangs will not need to ask who leads the WAAAGH. The answer will be carved into every broken shield from here to the World's Edge.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.11.a:0 "Start da biggest fight."

 war_unique_intro_events.12.t:0 "Smoke over Greyhag"
 war_unique_intro_events.12.d:0 "Greyhag lives under the black breath of the Dark Lands, where Orc shamans mutter to gods and Chaos Dwarf chains rattle in the distance. The smoke from the forges teaches a simple lesson: if someone else is building something terrible, hit them before they point it at you.\n\nBacksnik Greyhag knows that cunning can be just as sharp as a choppa. His tribe survives among tyrants, slavers, wolf-riders, Ogres, and rival Greenskins by listening before laughing and stabbing before the bargain is finished.\n\nThe gods of Gork and Mork speak in omens only a proper shaman can turn into trouble. A cracked bone, a bad moon, a squig biting the wrong ankle: all of it might mean a WAAAGH if the boss is clever enough to say so loudly.\n\nThe Dark Lands do not reward simple bravery for long. A tribe that charges every chain line becomes labor, and a boss who trusts every bargain becomes lunch. Greyhag must make suspicion into a tribal virtue before stronger tyrants turn it into a weakness.\n\nThe situation is dangerous, so we must read the smoke before the smoke belongs to someone else's forge. A proper WAAAGH can start as a whisper if the whisper knows when to bite.\n\nIf Backsnik can make prophecy, ambush, and appetite point in the same direction, the tribe may become a threat even the Dawi-Zharr cannot easily put in chains.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.12.a:0 "Read the smoke."

 war_unique_intro_events.13.t:0 "The Broken Axe"
 war_unique_intro_events.13.d:0 "Broken Axe follows Puff Castle-kracka because a boss with that name has something to prove every morning. The tribe understands one kind of legitimacy: things were standing, then the boss arrived, and now they are not.\n\nWalls, holds, gates, and skulls all exist to test whether the mob is still strong enough to laugh. Dwarfs complain when a hold falls. Humans complain when a town burns. The Broken Axe complain only if there was not enough noise.\n\nThe tribe is not rich, polished, or patient. That is fine. Rich gitz can be robbed, polished gitz can be dirtied, and patient gitz are usually still talking when the first axe lands.\n\nA broken axe is not a warning of weakness. It is proof that the last fight was worth having and that the next weapon should be swung harder. Every chipped blade, cracked helm, and stolen gate becomes a story told louder than it deserves.\n\nThe situation is simple, so we must break the next thing before another mob claims it. If a mountain gets in the way, that just means the mountain wants a turn.\n\nIf Puff can keep the tribe laughing at danger, the Broken Axe may become the kind of problem maps try to avoid naming. That is usually when the real fun starts.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.13.a:0 "Break the next wall."

 war_unique_intro_events.14.t:0 "Finubar's Horizon"
 war_unique_intro_events.14.d:0 "Eataine looks outward from Ulthuan while the island argues with itself. From Lothern's harbors come diplomats, merchants, captains, and rumors, all insisting that the wider world is too dangerous to ignore and too valuable to abandon.\n\nFinubar Seafarer believes the Asur cannot guard the world by pretending the world is not there. Trade, alliances, embassies, and naval reach may restore prestige, but to many princes they sound like contamination dressed as policy.\n\nThe Everqueen's supporters warn that Ulthuan's strength lies in purity, distance, and the cleansing of foreign influence. Finubar's supporters answer that isolation is only decline with better manners. Between them, the old harmony breaks into factions.\n\nLothern's openness is not innocence. Every foreign embassy is watched, every merchant privilege argued over, and every sea route measured against the ancient duty to guard the Vortex. Finubar must prove that contact can serve tradition rather than dissolve it.\n\nThe situation is tragic and delicate, so we must make engagement look like strength rather than surrender. If Ulthuan is to endure, its light must travel farther than its courts are comfortable admitting.\n\nIf Eataine can make the sea a source of unity instead of fear, the Phoenix King's policy may become more than a factional cause. It may become Ulthuan's answer to decline.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.14.a:0 "Guide Ulthuan outward."

 war_unique_intro_events.15.t:0 "The Everqueen's Realm"
 war_unique_intro_events.15.d:0 "Avelorn is sacred ground, and Alarielle the Radiant is more than a ruler to the Asur. Her presence is the living sign that Ulthuan is not merely a fortress or fleet, but a covenant between people, gods, and land.\n\nThe Everqueen's court sees corruption in foreign habits, foreign wars, and the impatient reforms of those who think survival requires compromise. To them, Finubar's open harbors may bring wealth, but they also invite decay into the island's soul.\n\nYet Avelorn cannot remain untouched by the Breaking of the Asur. Princes choose sides, old kinships sour, and every grove hears distant arguments about what must be preserved and what must be risked before the End Times swallow both.\n\nAvelorn's power is not isolation alone. Its glades carry divine legitimacy, memory, and the quiet authority of Isha's chosen line. If the Everqueen speaks only to the faithful, the divided kingdoms may mistake reverence for withdrawal.\n\nThe situation is pure only in memory, so we must defend what purity can still mean. Ulthuan's body may need fleets and soldiers, but its soul begins beneath Avelorn's trees.\n\nAlarielle must make preservation active before the age defines it as weakness. The island can turn inward without becoming small, but only if its sacred heart still commands the limbs.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.15.a:0 "Preserve the inner realm."

 war_unique_intro_events.16.t:0 "Courts of the Bleak Holds"
 war_unique_intro_events.16.d:0 "The Bleak Holds are cold even by Naggaroth's standards. They are a frontier of ice, chains, hard stone, and harder ambition, where lesser Druchii learn that exile can be refined into a weapon.\n\nZorass Bale rules in the shadow of greater names. Naggarond, Ghrond, Karond Kar, Har Ganeth, Hag Graef, and Clar Karond all cast longer shadows in the Witch King's realm, but the frontier breeds a different kind of patience.\n\nHere, loyalty is a blade held carefully by the edge. Slave raids, estate quarrels, private vendettas, and cold court ceremony all serve the same lesson: the weak deserve what the strong can arrange for them.\n\nCold makes refinement sharper. A frontier lord cannot rely on the indulgent cruelties of richer cities; he must make every corsair, beast-master, noble, and slave chain serve a design lean enough to survive hunger and ambitious enough to matter.\n\nThe situation is cruel and precarious, so we must make cruelty orderly. If Naggaroth's greater cities look down on us, they may yet learn how far a blade can travel from the frontier.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. Even the bleakest hold remembers that grievance, because grievance is the one warmth Naggaroth never lacks. When the Witch King's shadow moves, frontier knives should already be waiting."
 war_unique_intro_events.16.a:0 "Keep the holds cruel."

 war_unique_intro_events.17.t:0 "The Citadel at Dusk"
 war_unique_intro_events.17.d:0 "The Citadel of Dusk guards hidden docks, waystones, and sanctioned routes far from Ulthuan's councils. It stands on the edge of Lustria like a lamp held above dark water, proud enough to shine and wise enough to shutter its windows.\n\nIts captains know reefs, monsoon turns, Lizardman suspicion, jungle fevers, and the loneliness of being precise at the edge of the map. A delayed signal or misread current can matter more here than a prince's speech in Lothern.\n\nThese colonies are not casual settlements. They are fortress-ports, shrines, observatories, counting houses, and naval locks on roads no road-builder ever touched. Distance from Ulthuan makes them anxious, but also self-reliant in ways the homeland does not always understand.\n\nThe homeland sends titles, expectations, and occasional orders; the frontier sends back maps, warnings, and ships that arrive because someone far away kept watch through another dangerous season. Duty across oceans must be practical before it can be poetic.\n\nThe situation is isolated, so we must make discipline carry across the ocean. Every lamp lit in the harbor tells the world that Asur reach has not ended.\n\nAcross the seas, elven destiny has not ended. It has merely moved beyond sight of home. If the Citadel holds, Ulthuan's divided heart will still have hands at the world's edge."
 war_unique_intro_events.17.a:0 "Signal the patrols."

 war_unique_intro_events.18.t:0 "The Overtyrant's Due"
 war_unique_intro_events.18.d:0 "Goldtooth measures power in meat, coin, and the number of tribes willing to get out of Greasus' way. The caravan roads feed him, fear him, and somehow still come back with more tribute.\n\nThe Great Maw taught the Ogres that hunger is not a weakness. It is a god, a law, and an argument that wins most debates before words become necessary. Around the Mountains of Mourn, every meal can become a treaty if the portions are large enough.\n\nGreasus Goldtooth is not merely rich. He is proof that wealth can be heavy enough to crush rivals beneath it. Merchants call it protection money because tribute sounds less civilized, but the distinction does not matter to the hungry.\n\nCaravans do not cross Ogre lands because they are brave. They cross because the alternative is worse, and because Greasus has made fear predictable enough to price. Predictable fear is almost civilization if the victim is moving quickly.\n\nThe situation is rich and hungry, so we must make every bargain sound like a threat. The Ogre Kingdoms will follow the fattest purse and the heaviest club.\n\nThis world is full of tasty little empires. The only question is which one pays first and which one gets eaten for being slow. Under Goldtooth, both outcomes can be profitable."
 war_unique_intro_events.18.a:0 "Count the tribute."

 war_unique_intro_events.19.t:0 "Storm Dragon of the North"
 war_unique_intro_events.19.d:0 "The Northern Provinces stand beneath the Bastion's shadow, where Miao Ying must hold Chaos outside and Cathayan pride inside. The Dragon Emperor is gone, but the wall still requires orders, soldiers, grain, and a ruler whose silence can frighten ministers into competence.\n\nThe north is not a decorative frontier. It is the hinge on which Cathay's survival turns. Bastion garrisons watch the wastes, magistrates count anxious harvests, and every merchant convoy carries rumors from Wei-Jin that sound less certain with each mile.\n\nMiao Ying is both daughter of the vanished Emperor and commander of a realm that cannot wait for the throne to resolve itself. Protocol demands deference, but the wall demands decisions.\n\nThe dominions beyond Wei-Jin read every silence as a test. Some will obey because harmony demands it, some because the Storm Dragon can punish defiance, and some because they hope obedience today will purchase independence tomorrow. Cathay's fracture begins politely before it becomes war.\n\nThe situation is brittle, so we must make duty stronger than rumor. If the north fails, every court poem in Wei-Jin will be ash on the wind.\n\nThe Bastion is stone, but its defense is political as much as military. Grain, favors, troops, and pride must all be made to march in the same direction before the wastes notice our hesitation.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.19.a:0 "Guard the Bastion."

 war_unique_intro_events.20.t:0 "Wardens of the Empty Throne"
 war_unique_intro_events.20.d:0 "The Imperial Wardens are servants of Cathay's order, but service is never simple when the throne is empty. Seals, gates, rosters, and ceremonies all remain, yet every one of them can become a weapon in the hands of a patient administrator.\n\nYuanshan Fu commands men who know that law is not soft. A locked gate can defeat an army, a missing permit can ruin a prince, and a properly worded decree can move more grain than a cavalry column.\n\nWei-Jin speaks in the name of the vanished Emperor, but the dominions hear different things in that silence. Some hear duty. Some hear opportunity. Some hear only the time it takes for orders to arrive and wonder whether orders are still needed.\n\nA warden's strength lies in making procedure feel inevitable. If the gates open only by our seal, if the granaries release only by our tally, and if the road patrols salute only our writ, then even ambitious dragons must negotiate with administration.\n\nThe situation demands obedience, so we must decide what obedience protects. A warden who cannot act is only a decorated lock.\n\nCathay does not need another claimant shouting over the empty throne. It needs someone who can make the machinery of empire continue to move until the silence breaks or becomes the new law.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.20.a:0 "Keep the watch."

 war_unique_intro_events.21.t:0 "The Southern Watch"
 war_unique_intro_events.21.d:0 "The Southern Provinces look toward jungles, rebel roads, mountain shrines, and neighbors that Cathayan court maps prefer to simplify. Heat, distance, and old local loyalties make the south a realm of subtler dangers than the Bastion's open war.\n\nLi Dao must defend trade, ritual order, and frontier pride without letting Wei-Jin mistake vigilance for ambition. In Cathay, even necessary strength can look like treason if displayed at the wrong angle before the wrong censor.\n\nThe south faces Khureshi rumor, Indish wealth, Monkey King mischief, and the constant pressure of local powers who know the imperial center is distracted. A lazy court would call this disorder. A wise ruler calls it terrain.\n\nThe southern dominions obey the Dragon Throne through habit, advantage, and fear of what disorder would invite. Those bindings are real, but they are not iron. Every border lord, merchant house, and temple official is measuring how much authority still travels from the capital.\n\nThe situation is humid with danger, so we must secure the marches before suspicion becomes paralysis. The south has its own rhythm, but it is still Cathay's drum.\n\nLi Dao must make frontier strength look like harmony rather than rebellion. If the marches are held firmly enough, Wei-Jin may remember that distance can serve the empire instead of weakening it.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.21.a:0 "Secure the south."

 war_unique_intro_events.22.t:0 "Dragon of the Eastern Sea"
 war_unique_intro_events.22.d:0 "The Eastern Provinces face the sea, where storms, pirates, foreign sails, and distant islands make protocol feel very far away. Yin-Yin sees in every harbor a chance to prove that Cathay's destiny is not confined to the inland court.\n\nThe ocean rewards a different temperament than Wei-Jin. Tides do not care for court precedence, captains cannot wait for three ministries to approve a wind, and a fleet that stays ceremonial for too long becomes driftwood with banners.\n\nYet eastern ambition is dangerous. A dragon who looks outward may be praised as visionary after victory and condemned as reckless before it. The vanished Emperor's silence gives every sibling room to dream and every rival room to accuse.\n\nThe coast hears news before the court admits it exists. Nippon fractures, Ind grows rich, elf captains count the sea lanes, and pirates learn which harbors answer quickly. A ruler who understands waves can move faster than one waiting for memorials to dry.\n\nThe situation is restless, so we must make the coast an argument no minister can ignore. If the waves answer us, Wei-Jin will have to listen.\n\nYin-Yin must turn maritime daring into imperial necessity. Success will make the east seem loyal and indispensable; failure will let every censor call the sea a mirror for disobedience.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.22.a:0 "Command the coast."

 war_unique_intro_events.23.t:0 "Blood-Voice of the Great Dragon"
 war_unique_intro_events.23.d:0 "The Old Ones are half-buried names in Aki-Aka's volcanic isles. Their plaques lie cracked beneath step-altars, skull racks, gem masks, and blood-smoke raised for the living dragons who coil above the mountains.\n\nThe dragons themselves are no kings. They accept gems, captives, heart-blood, and distance, then wake when pride, weather, insult, or hunger makes a valley worth burning. Around that terror, Atl Hakemono's Lizardmen have built a savage politics of blood-priests, brood chiefs, altar courts, and war-clans all claiming to know which scream will please the Great Dragon.\n\nAki-Aka speaks loudest beneath the wings, but that voice is a knife held by ceremony rather than a crown. Authority must pass through rival spawning lineages, island cults, competing altars, and petty wars whose losers may be opened before flame or fang. The Dragon Cult is strongest, yet it is only one voice among many faiths clawing for room in the archipelago's smoke.\n\nBeyond the shores, the world presses closer. The Dragon Isles command the mouth of the River Ruin, and the wealth of their gems would tempt merchants, conquerors, and slavers alike. If the Chaos Dwarfs ever look south in strength, the isles may become their harbor, quarry, or battlefield.\n\nThe Great Dragon does not command. It hungers. Aki-Aka must drag the clans together by blood-gong, obsidian law, gem tribute, and terror enough to prove that forgotten servants of the Old Ones can still shape their own age.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.23.a:0 "Beat the blood-gong."

 war_unique_intro_events.24.t:0 "The Hell Pit Breeds"
 war_unique_intro_events.24.d:0 "Clan Moulder hears destiny in the scrape of bone-saws and the wet growl of things that should not live. Hell Pit is less a city than a stomach full of cages, laboratories, and excuses for why the last batch only killed half the handlers.\n\nVerminkin Moulder rules a clan that has learned to make flesh negotiable. Rat Ogres, stitched horrors, swollen beasts, and failed experiments all prove the same principle: weakness is only raw material that has not yet been improved enough.\n\nThe Under-Empire praises unity in public and betrayal in every private corridor. Skryre has its engines, Pestilens its plagues, the Grey Seers their holy squealing, but every one of them eventually needs muscle that can survive being pointed at a wall.\n\nHell Pit must also manage its reputation carefully, which is to say horribly. Clients should fear the product, fear the warranty, and fear what Moulder kept caged in reserve. A monster sold too cheaply is just treachery waiting to become affordable.\n\nThe situation is competitive, so we must sell monsters to every fool and keep the best horrors for ourselves. The surface-things are blind, but our rivals are worse: they are close.\n\nIf Moulder can make flesh into industry, every rival clan will have to bargain with the breeders before it goes to war. Dependence is just another collar, even when it has claws.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.24.a:0 "Unchain the vats."

 war_unique_intro_events.25.t:0 "The High King's Grudge"
 war_unique_intro_events.25.d:0 "Karaz-a-Karak is the throne of memory, and Thorgrim Grudgebearer carries more than a crown. The Dammaz Kron is not a book of complaints; it is a map of everything the world still owes the Dawi.\n\nThe Karaz Ankor was once a mountain empire of roads, holds, oaths, and craft beyond the envy of younger races. The War of the Beard, the Time of Woes, Greenskin invasions, Skaven filth, and a thousand betrayals broke that golden order into isolated stone islands.\n\nYet the High King's hall still stands. Every lost hold is a wound, every broken Underway a command, every insult an obligation handed down with the patience only Dwarfs can make terrifying.\n\nThe High King's task is not nostalgia. It is logistics, law, vengeance, and craftsmanship bound into one oath. Mines must pay for armies, armies must reopen roads, roads must bind holds, and every restored hold must make the next grudge answerable.\n\nThe situation is diminished but not defeated, so we must restore road, hold, and honor together. Reforging the Karaz Ankor will require gold, steel, grudges, and the discipline to spend all three properly.\n\nEvery grudge answered is another stone set back into the old empire. Every grudge ignored is a crack in the mountain beneath our feet. Thorgrim must ensure the old book becomes a plan, not only a burden."
 war_unique_intro_events.25.a:0 "Open the Dammaz Kron."

 war_unique_intro_events.26.t:0 "The Slayer King's Hold"
 war_unique_intro_events.26.d:0 "Karak Kadrin is ruled by Ungrim Ironfist, a king who must live for his people while bound to an oath that demands death. There are easier contradictions in the world, but few so Dwarfen.\n\nThe hold's halls are filled with warriors who turned shame into a weapon and called it duty. Slayers come seeking doom, but a hold cannot be governed by doom alone. Mines must open, walls must hold, and clans must eat even while songs praise glorious death.\n\nUngrim's burden is that the Slayer oath and the kingly oath are both sacred. To abandon either would be dishonor. To satisfy both requires enemies enough to spend fury without spending the hold itself.\n\nKarak Kadrin's fame draws the desperate, the dishonored, and the furious, but their deaths must buy more than poems. Roads must be cleared, monsters broken, passes secured, and shame turned outward before it hollows the hold from within.\n\nThe situation is bitter, so we must make sacrifice serve Karak Kadrin rather than consume it. A Slayer may seek doom, but a king must make that doom useful.\n\nThe ancestors will judge whether our deaths were worthy. The living will judge whether the hold endured long enough for those deaths to matter. Ungrim must give both courts an answer."
 war_unique_intro_events.26.a:0 "Swear the oath."

 war_unique_intro_events.27.t:0 "Veils of New Lahmia"
 war_unique_intro_events.27.d:0 "New Lahmia is Neferata's answer to exile, memory, and every court that thought the Lahmian dream had died. Beauty opens doors, fear keeps them open, and secrets decide who enters next.\n\nThe Lahmian way is not the crude thunder of a battlefield alone. It is a glance before a treaty, a servant who hears too much, a noble who wakes pale and grateful, a rival who finds every ally suddenly unavailable.\n\nNehekhara remembers kings, but it has not forgotten queens. The old city was lost, the bloodline scattered, and the world learned to speak of Lahmia as a cautionary tale. That was a mistake born of mortal lifespans.\n\nBloodline is memory made political. Every courtier turned, every cult planted, and every frightened prince drawn into confidence is another thread returning to the first queen's hand. Lahmia does not need the world to understand it; understanding is what victims do too late.\n\nThe situation is elegant and predatory, so we must rule before anyone realizes where the bite marks lead. New Lahmia will be a court, a web, a sanctuary, and a knife wrapped in silk.\n\nIf Neferata can make desire and dread speak with one voice, her exile will become a second founding. The living will call it diplomacy until the doors close behind them.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!"
 war_unique_intro_events.27.a:0 "Draw the veils closed."

 war_unique_intro_events.28.t:0 "The Shadow of Nagashizzar"
 war_unique_intro_events.28.d:0 "Nagashizzar is not merely a fortress; it is a wound in the world's memory. Black stone, dead winds, corpse-priests, and forbidden calculations gather there as if the mountain itself is waiting for a command.\n\nThe Husk of Nagash sits amid whispers that insist the Great Necromancer is absence only for now. His enemies call him defeated because they need sleep. His servants know that death, silence, and delay are only different kinds of preparation.\n\nAround the cursed fortress, living realms pretend that distance protects them. Tomb Kings sneer at Nagash's name, vampires pursue their own courts, and lesser necromancers mistake borrowed scraps of lore for mastery.\n\nNagashizzar must gather more than corpses. Relics, cults, stolen texts, frightened pupils, and forgotten tunnels all matter when the master is a memory powerful enough to command the present. The world has misplaced many keys, and the dead have patient hands.\n\nThe situation is deathly still, so we must make stillness gather strength. When the dead begin to move, the living will call it sudden only because they were not listening.\n\nIf Nagash's shadow can be made dense enough, it will no longer matter whether the world believes he is gone. Belief is for the living; obedience is for everyone else.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!"
 war_unique_intro_events.28.a:0 "Listen to the Black Pyramid."

 war_unique_intro_events.29.t:0 "The Council's Decree"
 war_unique_intro_events.29.d:0 "The Grey Seer Council speaks with the authority of the Horned Rat, which makes every word sacred and every listener suspicious. A command from the Council is prophecy, policy, and threat, usually in that order and always with witnesses nearby.\n\nKritislik must herd warlords, engineers, plague-priests, assassins, and cowards who all plan to obey later. The Council of Thirteen rules Skavendom in theory; in practice, theory is what everyone quotes while hiding knives under the table.\n\nSkavenblight's shadow reaches every tunnel that matters. The surface-things do not understand how much of their world is already undermined, counted, sniffed, and marked for future gnawing.\n\nThe Council's power is not that other clans trust it. No Skaven is that stupid for long. Its power is that everyone fears being the first to disobey when the bells, censers, and scribes all insist the Horned Rat is watching.\n\nThe situation is perfect for betrayal, so we must betray first with paperwork, prophecy, and teeth. The Council is the future, yes-yes, provided no one counts the chairs too closely.\n\nIf the seers can make rivalry useful before it becomes fatal, the Under-Empire may move as one swarm. If not, the surface will be saved by Skaven efficiency failing exactly on schedule.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.29.a:0 "Chitter the decrees."

 war_unique_intro_events.30.t:0 "Skryre Sparks"
 war_unique_intro_events.30.d:0 "Clan Skryre knows that courage is overrated when a machine can explode at the enemy from far away. Warpstone is danger, fuel, currency, scripture, and occasionally the last thing an assistant sees before becoming data.\n\nMorskittar's warlock-engineers turn unstable genius into weapons that make other clans nervous enough to buy them. Doomwheels, lightning cannons, engines, powders, and devices without names all promise victory if they do not detonate too early.\n\nThe Under-Empire is a marketplace of treachery. The Grey Seers preach, Moulder stitches, Pestilens coughs, and every clan insists it is indispensable. Skryre can prove it with machinery loud enough to interrupt the argument.\n\nInnovation among Skaven is never calm. A rival steals a plan, a test subject chews through the wrong cable, a patron demands results yesterday, and someone always insists the warning labels are defeatist. This pressure is useful. It keeps the clever frightened and the frightened productive.\n\nThe situation is unstable in the best possible way, so we must build faster than rivals can sabotage us. If the device kills assistants, the device is at least doing something.\n\nWhen the surface cities finally hear Skryre's engines, they should not understand whether they are being invaded, tested, or accidentally included in an experiment. All three outcomes are acceptable.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.30.a:0 "Spark the machinery."

 war_unique_intro_events.31.t:0 "The Sacred Pox"
 war_unique_intro_events.31.d:0 "Clan Pestilens does not spread disease as a tactic alone; it spreads doctrine. Nurglitch VII teaches that every clean street is heresy and every coughing city is a sermon beginning to work.\n\nThe plague-priests know revelation by smell. Rot is not failure, pain is not warning, and fever is only the body learning to hear the Horned Rat's truth. Those who survive may serve. Those who die may still be useful as proof.\n\nOther Skaven clans call Pestilens mad when they are losing and holy when they need a city emptied. This is acceptable. Hypocrisy is just another tunnel through which influence can travel.\n\nLustria taught Pestilens that the world is full of bodies too proud of their health. Temple cities, man-things, elf-things, and rival rats all share the same weakness: they breathe. A doctrine that can travel through breath is difficult to imprison.\n\nThe situation is ripe for revelation, so we must carry the sacred filth where enemies still breathe easily. When the world retches, it will finally be listening.\n\nIf Nurglitch's priests can make plague feel inevitable, every quarantine becomes a shrine wall waiting to crack. The Horned Rat does not need converts who survive, only proof that resistance sickens first.\n\n§RSkaven have a tough time administering lands above ground or outside of cities.§!"
 war_unique_intro_events.31.a:0 "Spread the sacred filth."

 war_unique_intro_events.32.t:0 "Skarsnik's Moon"
 war_unique_intro_events.32.d:0 "Crooked Moon survives because Skarsnik understands that a small blade in the dark can beat a bigger axe in the open. Night Goblins do not need to be brave when they can be patient, numerous, poisonous, and standing behind the trapdoor.\n\nKarak Eight Peaks glitters in every scheme. Dwarfs claim it with grudges, Skaven infest it with ambition, and louder Orcs think wanting it loudly should be enough. Skarsnik knows better. The mountain belongs to whoever controls the tunnels.\n\nThe tribe's enemies call its methods cowardly because they keep losing to them. Ambushes, squigs, mushrooms, false retreats, and carefully timed cave-ins are all good tactics if the enemy is too dead to complain properly.\n\nThe Crooked Moon must keep its nerve while greater powers posture above and below. Skarsnik's strength is not in matching every enemy blow for blow; it is in choosing which enemy discovers too late that the floor was never loyal.\n\nThe situation favors patience and spite, so we must make every corridor a trap. The mountain will be ours because everyone else keeps walking into it wrong.\n\nIf the tribe can turn fear into timing, Karak Eight Peaks will become less a fortress than a joke only Skarsnik understands. Everyone else will be the punchline.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.32.a:0 "Set the ambushes."

 war_unique_intro_events.33.t:0 "First City of the Plan"
 war_unique_intro_events.33.d:0 "Itza is the First City, and its stones remember when the Old Ones walked where lesser races now trespass. Every ziggurat, spawning pool, causeway, and glyph is part of a design older than the ambitions of warmblood kings.\n\nAcoatl Tecoh and the temple cohorts watch Lustria's disorder like a stain spreading across sacred geometry. Skaven tunnels, Druchii raids, human greed, and Chaos corruption are not merely threats; they are deviations.\n\nThe Slann meditate in silence while Skink priests interpret omens and Saurus wait for command with weapons already sharpened. Purpose is not debated as mortals debate policy. Purpose is read, obeyed, and enacted.\n\nItza's burden is that primacy creates duty. Lesser temple-cities may hesitate, misread, or wait for clearer signs, but the First City must act as if every broken alignment reflects upon its own stones. Authority and obligation are the same glyph read from opposite sides.\n\nThe situation is misaligned, so we must obey the plaques with cold certainty. Mercy is irrelevant when the Great Plan requires correction.\n\nIf Itza moves, Lustria should feel the movement as a command rather than a suggestion. The world was ordered once, and the First City has not forgotten the shape of obedience.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.33.a:0 "Obey the plaques."

 war_unique_intro_events.34.t:0 "Mazdamundi's Judgment"
 war_unique_intro_events.34.d:0 "Hexoatl rests beneath the will of Lord Mazdamundi, whose patience is geological and whose anger can move mountains. The City of the Sun is not only a capital; it is a statement that the Old Ones' order still has teeth.\n\nThe warm-blooded races mistake stillness for weakness because they live too briefly to understand calculation. Mazdamundi has watched centuries pass like weather. When he acts, terrain, armies, and lesser minds discover that they were temporary arrangements.\n\nLustria is threatened by Skaven filth, Druchii arrogance, greedy explorers, and the rising madness of Chaos. Each threat is different in shape but identical in meaning: disorder has entered sacred space.\n\nHexoatl must translate cosmic certainty into earthly force. Skink scribes read plaques until their eyes ache, Saurus cohorts wait without impatience, and geomantic lines hum beneath terraces built for decisions that may take centuries to finish arriving.\n\nThe situation bends away from the Old Ones' design, so we must bend it back. If continents must tremble to make the lesson clear, then continents will tremble.\n\nMazdamundi's judgment is not haste, though lesser races will experience it as catastrophe. When the City of the Sun commands, even mountains should remember they were placed for a reason.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.34.a:0 "Realign the world."

 war_unique_intro_events.35.t:0 "Moons over Tlaxtlan"
 war_unique_intro_events.35.d:0 "Tlaxtlan watches the moons with a discipline outsiders would call silence. Its priests, Skinks, and Saurus read omens in cold light while lesser minds ask for simpler orders.\n\nThe temple-city's strength lies in observation made sacred. Every lunar path, eclipse, spawning sign, and wind of magic may reveal a fragment of the Great Plan if interpreted with sufficient patience and sufficient suspicion.\n\nThe world grows impatient as the End Times approach. Warmbloods rush, Skaven multiply, Elves scheme, and Chaos claws at the edges of reality. Tlaxtlan answers by looking upward before striking outward.\n\nObservation is not passivity. A wrong omen acted upon can damage the Plan as surely as an enemy army, while a true omen ignored is treason against purpose. Tlaxtlan must become the city that knows when the stars are warning and when they are commanding.\n\nThe situation is written above us, so we must learn to read before we march. The heavens have not forgotten the Great Plan simply because the earth below has grown noisy.\n\nIf Tlaxtlan masters the moons, its armies will move with the confidence of prophecy instead of reaction. Those who think patience is weakness will discover that the sky has been counting them.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.35.a:0 "Read the moons."

 war_unique_intro_events.36.t:0 "The City of Mists"
 war_unique_intro_events.36.d:0 "Xlanhuapec hides behind mists that are warning, weapon, and memory. The city does not vanish because it is afraid. It vanishes because trespassers should not be allowed to know where judgment begins.\n\nDzibilchaltun Deyos rules a temple-city where enemies disappear long before they understand what they disturbed. Paths curl back on themselves, scouts hear drums from nowhere, and the jungle learns the shape of intruders before the guards ever strike.\n\nThe mists protect secrets that are not merely local. Plaques, spawning pools, geomantic alignments, and half-remembered commands from the Old Ones all require concealment from those who would loot, corrupt, or misunderstand them.\n\nSecrecy is a sacred discipline in a world that sells maps to conquerors. Xlanhuapec must decide what may be revealed, what must be hidden, and which intruders should vanish so completely that even their warnings fail to return home.\n\nThe situation is obscure for a reason, so we must let secrecy serve the Great Plan. The jungle does not need to roar when fog can strangle a trespasser quietly.\n\nIf the City of Mists remains unreadable, it can strike without teaching enemies where to look next. The Plan does not require witnesses, only results.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.36.a:0 "Let the mists answer."

 war_unique_intro_events.37.t:0 "The Black Armada"
 war_unique_intro_events.37.d:0 "The Dreadfleet is not merely another nest of corpse-pirates. Noctilus von Carstein has made the Maelstrom into a throne room, and every drowned sailor is another oath sworn beneath black sails.\n\nThe seas remember wrecks better than the living do. Broken keels, sunken guns, drowned crews, cursed treasure, and forgotten mutinies all wait below the waves until necromancy gives them orders and a heading.\n\nThe Vampire Coast plunders for gold, but also for dominion over fear itself. A port that pays tribute, a convoy that changes course, a captain who whispers the wrong name before a storm: all of these are victories before the guns fire.\n\nNoctilus does not need a homeland in the way living kings do. His realm is every current that can carry terror, every harbor that can be blackmailed, and every wreck that can be raised before its widows finish praying.\n\nThe situation at sea is rich with terror, so we must make every coast hear our guns before it sees our flag. The oceans do not belong to the living by right, only by habit.\n\nIf the Dreadfleet commands the trade centers and corpse-crowded routes of the world, the living will learn that commerce and fear sail under the same wind.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
 war_unique_intro_events.37.a:0 "Unfurl the black sails."

 war_unique_intro_events.38.t:0 "Mist-Bound Fethnaal"
 war_unique_intro_events.38.d:0 "Fethnaal's Fimir brood in exile, half-hidden by swamp mist and older malice. They are a people of damp stone, harsh ritual, and grudges too sour to become songs.\n\nChusk Chosk rules creatures who remember loss more clearly than law. The world gave them no honorable place, so they learned to value fog, ambush, sorcery, and bargains with powers that do not ask for dignity first.\n\nIn Lustria, every neighbor is dangerous. Lizardmen serve a cosmic order that has no place for Fimir hunger, while other intruders bring guns, chains, plagues, or knives. The swamp is shelter only if it is made into a weapon.\n\nFethnaal must turn obscurity into leverage. A people forgotten by most histories can move through the gaps those histories leave behind, striking from mist, bargaining with ruin, and teaching arrogant neighbors that absence is not the same as weakness.\n\nThe situation is hostile, so we must make the fog into a border and a blade. If the world will not give the Fimir a place, we will take one from the dark.\n\nThe End Times approach, and even the forgotten may be judged useful by ruin. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.38.a:0 "Call through the mist."

 war_unique_intro_events.39.t:0 "Settra Does Not Serve"
 war_unique_intro_events.39.d:0 "Khemri wakes to a lesser world, and Settra finds that unacceptable. Nehekhara lies broken, rival kings mutter in their tombs, and priests speak of gods as if such things were above him.\n\nSettra remembers empire as fact, not aspiration. Golden cities, endless legions, chariots beneath the sun, tribute roads, and bowed rivals were not myths. They were proper order, interrupted by treachery, death, and time's insolence.\n\nNagash's curse denied paradise and mocked the promises of the Mortuary Cult, but it did not extinguish royal will. The tombs have opened. The legions can rise. The living kingdoms that squat upon a diminished age can learn how old authority sounds when bronze wheels move again.\n\nRestoration will require more than awakening old soldiers. Tomb roads must reopen, priesthoods must obey, rival kings must kneel, and the living must be taught that their brief possession of the world was a clerical error.\n\nThe situation is an insult, so we must make restoration sound like command. Settra ruled in life, rules in death, and will not share eternity with pretenders.\n\nThe sun shall rise once more upon an empire of the dead, and all shall bow before the will of Khemri. Settra does not serve history; history will be made to serve Settra."
 war_unique_intro_events.39.a:0 "Rise, my legions."

 war_unique_intro_events.40.t:0 "Arkhan's Vigil"
 war_unique_intro_events.40.d:0 "Arkhan the Black does not mistake defeat for finality. The servants of Nagash count bones, relics, and forbidden names while Nehekhara's proud kings pretend the Great Necromancer is only a memory.\n\nMemory is useful, but obedience is better. Arkhan has seen empires die, cults scatter, tombs open, and arrogant rulers convince themselves that hatred of Nagash is the same thing as freedom from him.\n\nThe Black Pyramid, the old rites, the fragments of necromantic law, and the loyalty of the dead all point toward a future that lesser kings dread to imagine. Every corpse is a resource. Every lost text is a key. Every rival tomb is a vault waiting to be opened.\n\nArkhan's patience is not passivity. Each treaty, raid, excavation, and desecration must serve the return of a will greater than any tomb king's pride. The loyal dead do not need glory; they need ingredients, positions, and silence until the rite begins.\n\nThe situation is prepared but incomplete, so we must gather what the master will require. When Nagash's shadow lengthens, loyalty will matter more than pride.\n\nNehekhara may curse Arkhan's name, but curses are only prayers turned sour. The dead answer stronger calls. When the Great Necromancer rises, every insult spoken in certainty will become a confession of fear."
 war_unique_intro_events.40.a:0 "Serve the Great Necromancer."

 war_unique_intro_events.41.t:0 "The Statues of Quatar"
 war_unique_intro_events.41.d:0 "Quatar endures in stone, silence, and the watchful faces of deathless kings. Its statues do not flatter the dead; they remind the living and the risen alike that power can be carved so deeply even time must walk around it.\n\nNemuhareb Mahrak rules a necropolis that must matter in a desert crowded with louder claims. Khemri has Settra, Arkhan has forbidden purpose, and other tomb cities cloak ambition in ritual. Quatar has monument, memory, and patience.\n\nThe roads around us once carried tribute, soldiers, priests, and royal command. Now they cross a fractured Nehekhara where every awakened ruler speaks of restoration while meaning his own throne first.\n\nQuatar's monuments are not passive relics. They are arguments in stone, claims made taller than doubt, and reminders that legitimacy can outlast flesh if someone still knows how to make others look upward.\n\nThe situation is monumental but contested, so we must make stillness command respect. Every statue is a witness, and every tomb road can become an army's path.\n\nThe desert does not forget. Quatar must ensure that when Nehekhara is restored, it is not restored by someone else's inscription. A silent city can still decide which names deserve to echo."
 war_unique_intro_events.41.a:0 "Wake the necropolis."

 war_unique_intro_events.42.t:0 "The Prophet's City"
 war_unique_intro_events.42.d:0 "Alhaka is the furnace of Anmar Fakir's revelation. The One Faith has burned through old idols, djinn bargains, borrowed gods, and desert divisions, but belief must be seen if the Solar Mandate is to endure.\n\nThe Prophet of the Sun teaches that there is only one god, and that the Sun is His sign upon the world. Every other power is a demon in a familiar mask, feeding on fear, custom, and the laziness of divided worship.\n\nIn thirty years, treaty and conquest have made Araby speak with one tongue in public, if not always in private. Tribes, cities, scholars, merchants, and soldiers obey the new order, but old bargains do not vanish simply because a brighter truth names them false.\n\nThe situation is radiant and fragile, so we must make faith visible in law, trade, and victory. A truth that means to rule the world cannot remain only a sermon.\n\nThe next Prophet may rise from anywhere if he proclaims the One Truth and gathers belief. That teaching unsettles the faithful, but it also proves the world is ripe for revelation."
 war_unique_intro_events.42.a:0 "Proclaim the One Faith."

 war_unique_intro_events.43.t:0 "Lashiek's Blessed Sails"
 war_unique_intro_events.43.d:0 "Lashiek lives by harbors, corsairs, and councils that know faith travels faster when ships carry it. Its docks hear prayers, bargains, lies, and sea-wind in equal measure, which makes them excellent instruments for a young religion with world-spanning ambitions.\n\nAbdullah Lashiek must make the One Faith speak in the language of pilots, merchants, privateers, and port officials. A sermon can move hearts, but a protected convoy can move grain, soldiers, and holy texts before doubt organizes itself.\n\nThe old Arabyan coast remembers djinn bargains and foreign idols, while the new order insists that such powers were demons wearing useful names. In Lashiek, that argument must survive contact with profit.\n\nSea power will test the Solar Mandate differently than desert conquest did. Captains obey winds as much as rulers, merchants love exceptions, and every foreign harbor offers both a pulpit and a temptation.\n\nThe situation is maritime and mercantile, so we must sanctify trade without letting trade become our god. Every sail that leaves the harbor can carry revelation or return with the coin to defend it.\n\nIf the One Faith is to cross seas and not merely deserts, Lashiek must prove that a blessed harbor can be sharper than a sword. The sun can shine on every mast if the harbor keeps faith with the dawn."
 war_unique_intro_events.43.a:0 "Bless the harbor."

 war_unique_intro_events.44.t:0 "Debeqra's Road"
 war_unique_intro_events.44.d:0 "Debeqra watches oases, southern roads, and tribes that do not always bend because a preacher or ruler says they should. Distance weakens proclamations, heat tests discipline, and every caravan carries news reshaped by the last campfire.\n\nOthman Yorassem must make the One Faith practical where the rich coast feels far away. A doctrine that cannot protect wells, settle disputes, and keep raiders from the road will sound very holy and very useless.\n\nThe old desert gods and djinn bargains have been named false, but memory remains stubborn. Some clans obey from conviction, some from caution, and some because the next patrol is closer than the next rival shrine.\n\nFrontier faith must be more than a proclamation sent from a safer city. It needs judges who know the wells, soldiers who can survive the roads, and scholars patient enough to explain why old bargains were chains wearing familiar names.\n\nThe situation is scattered, so we must bind water, caravan, and clan into one order. A road can be a trade route, a pilgrimage, or an army's promise.\n\nIf Debeqra holds, the One Faith will prove it can rule beyond the Prophet's immediate shadow. If it fails, every doubter will call distance stronger than revelation. The desert is listening for which claim endures thirst."
 war_unique_intro_events.44.a:0 "Bind the road."

 war_unique_intro_events.45.t:0 "Zlatlan's Southern Plaques"
 war_unique_intro_events.45.d:0 "Zlatlan keeps a southern watch far from Lustria's most famous temple-cities. Its priests serve the Old Ones among deserts, tomb kingdoms, jungle margins, and warm-blooded empires that misunderstand every sacred boundary they cross.\n\nKatari Dzilam's people are not lesser servants because they stand far from Itza or Hexoatl. The Great Plan is not local. Its lines cross stars, rivers, continents, and ruins whose purpose younger races cannot even mispronounce correctly.\n\nThe Southlands are crowded with temptation and disorder. Tomb Kings rise in ancient arrogance, Arabyan prophets burn away old beliefs, Greenskins brawl across broken lands, and merchants turn every mystery into a price.\n\nDistance makes interpretation harder and duty heavier. Plaques arrive late, omens are seen through different stars, and every temple must decide whether silence from Lustria means patience, abandonment, or command already given in a language too old for doubt.\n\nThe situation is distant but not separate, so we must preserve the Great Plan where others see only frontier. The stars shine on the Southlands too.\n\nIf Zlatlan holds the southern pattern, the servants of the Old Ones will prove that sacred order does not end at Lustria's shore. It waits wherever the Plan still has defenders.\n\n§RAs a Lizardman, you have a tough time administering arctic lands.§!"
 war_unique_intro_events.45.a:0 "Guard the southern plan."

 war_unique_intro_events.46.t:0 "The Woodsman's Shot"
 war_unique_intro_events.46.d:0 "Hochland is a province of deep forests, lumber roads, inns, and marksmen who know that a single patient shot can matter more than a dozen shouted orders. Hergig's court watches the Empire's troubles through branches, smoke, and the long barrel of the Hochland long rifle.\n\nAldebrand von Ludenhof rules a land where travelers, hunters, pilgrims, wizards, and timber guilds all meet beneath uneasy boughs. Taal and Rhya are honored in the woods, Ulric has his followers, Sigmar has his shrines, and most villages have learned to respect whatever keeps the road safe tonight.\n\nThe Empire around Hochland is fraying. Beastmen creep through old growth, cults hide in lonely inns, merchants worry over tolls, and Reikland speaks of unity as if unity were simple once trees, rivers, and pride get in the way.\n\nHochland's strength is not in grand parade-ground certainty. It is in skirmish lines, foresters, careful hospitality, and men who know how to disappear before firing. The situation is shadowed, so we must make every road, mill, and hunting path part of the province's defense.\n\nIf Hochland keeps its woods loyal and its rifles steady, the Empire's enemies will learn that the green dark has eyes. A province need not be loud to be dangerous."
 war_unique_intro_events.46.a:0 "Take careful aim."

 war_unique_intro_events.47.t:0 "The Wolf at Middenheim"
 war_unique_intro_events.47.d:0 "Middenland remembers when the north spoke with greater force in Imperial politics. Middenheim still rises like a challenge above the Drakwald, and Ulric's flame burns there with a pride no Reiklander sermon can soften.\n\nBoris Todbringer rules a province that has never mistaken courtesy for virtue. The Todbringer claim, the Cult of Ulric, the wolf-kin brotherhoods, the forest forts, and the stubborn towns of Middenland all insist that the Empire is more than Sigmar's southern court.\n\nYet pride alone will not secure the north. Beastmen still crawl through the Drakwald, Graf Boris' enemies whisper of decline, Nordland and Hochland watch for weakness, and Karl Franz gathers the symbols of unity around Altdorf.\n\nMiddenland's situation is honorable and bitter, so we must make old authority useful again. Forts must be supplied, Ulrican zeal must be disciplined, and the House of Todbringer must show that a wolf can guard the Empire without bowing like a hound.\n\nIf Middenland can turn rivalry into strength, the north may again become the Empire's hard voice. If not, its boasts will echo from stone while the forests decide who truly rules."
 war_unique_intro_events.47.a:0 "Stand with Ulric."

 war_unique_intro_events.48.t:0 "The Long Watch by Sylvania"
 war_unique_intro_events.48.d:0 "Stirland is poor, damp, stubborn, and uncomfortably close to places that decent folk prefer to mention only after locking the door. Its fields are hard, its roads are watched, and its villages have learned that mist from Sylvania rarely brings anything good.\n\nAlberich Haupt-Anderssen inherits a province with more memory than money. Stirland remembers Queen Freya, old emperors, river patrols, Morr's cold comfort, and claims that wiser neighbors would call impossible if they did not know Stirlanders too well.\n\nThe Stir is both border and artery. Barges carry trade and rumors, patrols watch for raiders and worse, and every old graveyard reminds the living that the Vampire Wars did not end fear. The Moot and Sylvania sit in Stirlander imagination as lost right and mortal warning.\n\nThe situation is bleak but not broken, so we must make vigilance into government. Poor men can still hold bridges, small towns can still bar roads, and a province mocked as dreary can become the first line that darkness fails to cross.\n\nIf Stirland endures, it will prove that the Empire is defended as much by muddy resolve as by polished armor. If it falters, the dead will not need to march far."
 war_unique_intro_events.48.a:0 "Hold the dreary line."

 war_unique_intro_events.49.t:0 "Mad Count, Black Fire"
 war_unique_intro_events.49.d:0 "Averland is bright with cattle wealth, black-and-yellow pride, good horses, better beer, and the uneasy knowledge that Black Fire Pass has saved the Empire more than once. Its prosperity is real, but so is the road by which ruin can enter.\n\nMarius Leitdorf rules with courage, brilliance, and alarming unpredictability. Some call him mad because they lack imagination, others because they have heard him declare war on threats no one else could see. Either way, Averland must survive both enemies and inspiration.\n\nThe province sits where Imperial ambition meets Dwarf roads, merchant traffic, and the mountains beyond which Greenskins gather. Its knights, cattle lords, Black Bear warriors, and townsmen know that wealth invites mockery until the pass needs holding.\n\nThe situation is rich, exposed, and eccentric, so we must make every advantage count. Cavalry, coin, mountain diplomacy, and stubborn southern pride must move together before enemies discover that Averland's ruler is easier to laugh at than defeat.\n\nIf Averland masters Black Fire Pass, the Empire will remember who kept the southern gate. If it fails, every joke about Marius will taste bitter in Altdorf."
 war_unique_intro_events.49.a:0 "Guard the Black Fire road."

 war_unique_intro_events.50.t:0 "At the Forest's Edge"
 war_unique_intro_events.50.d:0 "Ostland is not comfortable, fashionable, or rich enough for softer provinces to envy. That is part of its strength. Its people live beneath northern trees, beside ruined fields, and within reach of the routes by which Chaos has so often tried to enter the Empire.\n\nValmir von Raukov rules practical folk who know that hunger, snow, raiders, and monsters are not dramatic interruptions but recurring neighbors. Ogres from the Middle Mountains, grim woodsmen, Sigmarite villages, and hard-bitten soldiers all have a place when survival is the first law.\n\nThe Forest of Shadows does not forgive foolishness. Beastmen haunt its depths, old devastation still scars the land, and northern warbands need only one weak season to turn border fear into fire.\n\nThe situation is harsh, so we must make thrift and endurance into strategy. Every road cleared, shrine kept, and militia drilled is another argument that Ostland is poor because it spends its strength on surviving for everyone else.\n\nIf Ostland holds, the Empire's heartlands may keep pretending safety is normal. If it breaks, they will learn how much distance the north had been buying them."
 war_unique_intro_events.50.a:0 "Endure the north."

 war_unique_intro_events.51.t:0 "Heart of Taal's Realm"
 war_unique_intro_events.51.d:0 "Talabecland lies at the center of the Empire, where rivers, roads, forests, and old provincial pride all meet. Its people honor Taal and Rhya with a seriousness outsiders mistake for rustic simplicity, usually shortly before a Talabeclander proves the woods were listening.\n\nHelmut Feuerbach rules a province that is practical before it is polished. Hunters teach sons to read tracks, inns fill with merchants and pilgrims, and river traffic binds towns that prefer to think of themselves as self-sufficient until trouble arrives.\n\nThe Empire's center is not the same as its peace. Reikland ambition, Middenland rivalry, Beastmen in the trees, religious disputes, and the pressure of trade all pass through Talabecland sooner or later.\n\nThe situation is central and combustible, so we must keep commerce, piety, and forest law from pulling apart. Taal's judgment is final in the wilds, but government must make that judgment useful on roads, docks, and tax ledgers too.\n\nIf Talabecland holds the heartland steady, it can make the Empire's center more than a place others cross. It can become the hinge that keeps the whole realm from twisting apart."
 war_unique_intro_events.51.a:0 "Keep the rivers moving."

 war_unique_intro_events.52.t:0 "League of the East March"
 war_unique_intro_events.52.d:0 "Ostermark is a league of towns pretending, with admirable desperation, that mutual fear is a stable constitution. Between Kislev, Sylvania, the World's Edge Mountains, and the ruins of Mordheim, that pretense may be the only reason the east still answers to the Empire at all.\n\nWolfram Hertwig governs a land that has seen too much falling stone and too many wrong stars. Mordheim's cratered memory still draws mercenaries, cultists, scavengers, and pious orders who all claim they are preventing disaster while carrying it in sacks.\n\nThe eastern march is exposed on almost every side. Vampire dread rises from Sylvania, Kislevite troubles spill south, mountain roads carry rumors of Greenskins and worse, and Imperial neighbors remember Ostermark mostly when they need someone else to bleed first.\n\nThe situation is precarious, so we must make league politics function before crisis turns every town into an island. River guards, free companies, Sigmarite sisters, death's-head halberdiers, and stubborn burghers must become a common defense.\n\nIf Ostermark binds its towns tightly enough, the east may become a shield instead of a warning. If it does not, the Empire will rediscover Mordheim's lesson by repetition."
 war_unique_intro_events.52.a:0 "Bind the league."

 war_unique_intro_events.53.t:0 "Sea Claws of the Empire"
 war_unique_intro_events.53.d:0 "Nordland faces the Sea of Claws with timber, salt, claims, and a nervous awareness that water brings wealth and raiders by the same wind. The Empire is not known for seamanship, but Nordland has little choice except to learn what Altdorf neglects.\n\nTheoderic Gausser carries old titles and large ambitions along a coast that cannot be defended from a counting house. Fishing towns, naval yards, mariners, and coastal nobles all know that a weak harbor invites Norscan laughter before it invites fire.\n\nNordland's claims reach across neighboring lands in ways those neighbors do not appreciate. Yet those claims are also a language of security: forests must supply ships, ships must guard trade, and trade must pay for the men who keep northern sails from becoming funeral signs.\n\nThe situation is cold, maritime, and exposed, so we must make the Imperial Navy more than a boast. Mariners must drill, shipwrights must work, and coastal towns must believe the province can defend the waters it taxes.\n\nIf Nordland masters the Sea of Claws, the Empire may gain eyes and teeth beyond its rivers. If it fails, the northmen will write policy in ash along the beach."
 war_unique_intro_events.53.a:0 "Ready the northern fleet."

 war_unique_intro_events.54.t:0 "Solland's Scars"
 war_unique_intro_events.54.d:0 "Sudenland lives among the scars of Solland, where memory is not romance but a wound that teaches caution. Its villages, woods, and ruined holdings know what happens when a province is too weak, too divided, or too unlucky to survive the next great blow.\n\nEtelka Toppenheimer rules a small realm with a large inheritance of loss. Solland's old pride, broken musters, desperate survivors, and rebuilt estates all ask the same question: can a remnant become a province with a future, or only a footnote with taxes?\n\nThe south is watched by neighbors who speak more loudly in Imperial councils, while enemies beyond the passes and forests care little for old boundaries. A small province cannot afford ceremonial weakness, especially when ruined towers still mark where confidence failed.\n\nThe situation is wounded, so we must turn memory into preparation. Ruined roads must be cleared, local musters restored, and every household taught that survival is not shameful if it becomes discipline.\n\nIf Sudenland rebuilds with patience, Solland's fall may become a lesson rather than a verdict. If it fails, the Empire will gain another cautionary tale and no stronger wall."
 war_unique_intro_events.54.a:0 "Rebuild from ruin."

 war_unique_intro_events.55.t:0 "The Joke That Endured"
 war_unique_intro_events.55.d:0 "The Moot began, depending on who is telling the story, as Imperial generosity, political insult, legal accident, or an excellent joke that became too useful to repeal. Halflings know better than to correct every human version. Let the tall folk laugh while the harvest comes in.\n\nHisme Stoutheart presides over fertile fields, busy kitchens, quick hands, and a people who understand that survival often looks harmless from above. The Moot feeds the Empire, hosts Pie Week, hires useful heroes, and produces scouts who prefer not to explain where the missing valuables went.\n\nStirland eyes the land with old resentment, Imperial nobles underestimate it by habit, and every army in the region eventually remembers that full stomachs matter more than speeches. The Moot is small, but it sits on soil worth defending.\n\nThe situation is comfortable only to the inattentive, so we must keep ovens warm and borders watched. Friends can be hired, Ogres can be useful, and a soft answer can hide a very sharp little knife.\n\nIf the Moot stays clever, it will remain the Empire's breadbasket and punchline on its own terms. If it grows careless, everyone who ever laughed at it will arrive hungry."
 war_unique_intro_events.55.a:0 "Mind the ovens and borders."

 war_unique_intro_events.56.t:0 "Harbor of the Lady"
 war_unique_intro_events.56.d:0 "L'Anguille is Bretonnia's great window to the sea, a proud port where salt wind, merchant ledgers, dockyard labor, and knightly vows all meet under the Lady's gaze. The duchy knows that ships can carry glory as surely as horses do.\n\nTaubert de L'Anguille must rule a coast that welcomes wealth without welcoming corruption. Mariners, shipwrights, merchant princes, pilgrims, and knights all serve the same realm, but they do not always agree which dangers deserve the first lance.\n\nThe wider world presses against the harbor. Norscan raiders, pirates, foreign traders, Bretonnian rivals, and ambitious captains all understand that L'Anguille's docks are valuable because they face beyond the realm.\n\nThe situation is prosperous and exposed, so we must make seamanship answer chivalry rather than compete with it. Every keel launched should carry honor, every toll should strengthen the walls, and every voyage should return with more than coin.\n\nIf L'Anguille can make the sea a Bretonnian road, the Lady's banners may fly farther than any charge. If it cannot, the harbor will become a door others open from outside.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.56.a:0 "Raise the sea banners."

 war_unique_intro_events.57.t:0 "Mist over Lyonesse"
 war_unique_intro_events.57.d:0 "Lyonesse lives with the sea at its back, ruins in its stories, and mist enough to make every patrol feel like a legend halfway remembered. Its coast is beautiful, treacherous, and haunted by the kind of tales knights repeat more loudly when afraid.\n\nAdalhard d'Lyonesse rules a duchy that refuses to let curse, weather, or memory define it as broken. Lost fleets, ruined shores, ghostly warnings, and stubborn coastal villages all shape a knighthood that has learned to ride through uncertainty.\n\nThe realm beyond Lyonesse is no less dangerous than the waters. Raiders test the coast, rival dukes measure weakness, and the Lady's favor must be proven in deeds rather than trusted as inheritance.\n\nThe situation is mist-bound, so we must make confusion serve defense. Knights of the fog, shore wardens, sailors, and chapel vows must turn every hidden inlet into a trap for those who mistake melancholy for weakness.\n\nIf Lyonesse masters its legends, it can become a warning no invader understands until too late. If it fails, the mist will keep its stories and swallow the rest.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.57.a:0 "Ride through the mist."

 war_unique_intro_events.58.t:0 "Hunters of Artois"
 war_unique_intro_events.58.d:0 "Artois is a duchy of deep forests, hard hunts, and old shadows that do not politely remain in old stories. Its knights ride beneath branches where beasts, curses, and worse things have learned to move before the horn sounds.\n\nChilfroy d'Artois rules a land where hunting is not sport alone. It is training, warning, judgment, and sometimes survival. Trackers, foresters, chapel knights, and peasant guides all know that the wilds test pride more honestly than a tournament field.\n\nThe Lady's grace shines over Artois, but the trees still hide darkness. Beastmen, monsters, bandits, and rumors from cursed places all press at the margins, while softer courts wonder why Artois speaks so often of vigilance.\n\nThe situation is wooded and watchful, so we must turn the hunt into government. Paths must be known, shrines guarded, lords disciplined, and every beast brought down before it becomes a banner for something fouler.\n\nIf Artois keeps faith with both lance and horn, the forest will become a shield for Bretonnia. If it does not, the trees will teach the duchy what they have been sheltering.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.58.a:0 "Sound the hunt."

 war_unique_intro_events.59.t:0 "The Northern Bulwark"
 war_unique_intro_events.59.d:0 "Gisoreux stands where northern roads, forests, and hard weather make Bretonnia's borders feel less like lines than tests. Its knights have learned that honor must sometimes wear mud, patience, and a trapper's eye.\n\nHagen d'Gisoreux rules a duchy watched by raiders, Greenskins, Chaos-tainted threats, and neighbors who know every pass has a price. Trade crosses the region, but so do rumors, fugitives, and enemies looking for the weak place in the realm's armor.\n\nThe woodsmen and trappers of Gisoreux understand terrain that courtly knights might prefer to ignore. Their knowledge does not diminish chivalry; it keeps chivalry from riding beautifully into ambush.\n\nThe situation is northern and unforgiving, so we must make vigilance respectable. Forest craft, border castles, trade roads, and Grail-blessed courage must all serve the same watch.\n\nIf Gisoreux holds, Bretonnia's north will become a warning rather than an opening. If it fails, the realm's enemies will find roads where the songs promised only glory.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.59.a:0 "Hold the northern roads."

 war_unique_intro_events.60.t:0 "Wine-Dark Sails"
 war_unique_intro_events.60.d:0 "Bordeleaux is blessed with vineyards, harbors, and a sea wind that carries both profit and peril. Its wines are praised across the Old World, but no cask reaches a distant table unless roads, ships, and knights keep greed from becoming plunder.\n\nAlberic de Bordeleaux must govern a coast where merchants count cargoes and knights count vows. The duchy sends Grail seekers by sea, guards coastal towns, and bargains with wealth that can serve honor or quietly replace it.\n\nPirates, rivals, raiders, and ambitious foreign traders all understand Bordeleaux's value. A prosperous harbor is a promise to friends and an invitation to enemies, especially when the wider world grows darker.\n\nThe situation is rich and maritime, so we must bless the sea roads without worshiping them. Fleets must protect trade, trade must sustain chivalry, and chivalry must remember that peasants and sailors need defending as surely as chapels do.\n\nIf Bordeleaux masters wine, sail, and lance together, it can make prosperity look like virtue. If not, the waves will carry away more than cargo.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.60.a:0 "Bless the sea roads."

 war_unique_intro_events.61.t:0 "Gilles' Inheritance"
 war_unique_intro_events.61.d:0 "Bastonne bears the memory of Gilles le Breton, and that inheritance is too heavy to be carried by songs alone. Every knight in the duchy knows that the birthplace of Bretonnia's unifier must prove old virtue can still command a fractured age.\n\nBohemond d'Bastonne rules among legends that are useful only when they discipline the living. The Round Table, Grail vows, heroic tales, and the defense of Couronne all demand more than reverent pageantry.\n\nBretonnia's enemies do not care how bright the past was. Beastmen, vampires, rival ambitions, peasant misery, and foreign pressure all press against a realm whose chivalry must be renewed in action or fade into decoration.\n\nThe situation is glorious and demanding, so we must make inheritance into duty. Bastonne's knights must defend the weak, rally the faithful, and show that reverence for Gilles means finishing work he would recognize.\n\nIf Bastonne lives up to its first hero, it can become the conscience of Bretonnia. If it does not, the duchy will be a shrine to courage it no longer practices.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.61.a:0 "Honor the first vow."

 war_unique_intro_events.62.t:0 "Gate of the Grey Mountains"
 war_unique_intro_events.62.d:0 "Montfort is a duchy of passes, cliffs, hard roads, and fortresses that make caution look like architecture. It guards approaches where Bretonnia, the Empire, and the mountains all meet under weather that punishes the careless.\n\nFolcard d'Montfort rules people shaped by stone and duty. Mountain folk endure what lowlanders romanticize, while knights of the peaks learn that a glorious charge is less useful than arriving where the enemy cannot.\n\nThe Grey Mountains are not a wall unless men hold them. Raiders, smugglers, monsters, rival armies, and desperate travelers all know passes are doors; Montfort's task is deciding who pays, who kneels, and who never comes through.\n\nThe situation is steep and watchful, so we must make every castle a promise kept. Roads must be secured, garrisons supplied, mountain warfare honored, and the Lady's blessing made practical in snow, stone, and narrow paths.\n\nIf Montfort holds the gates, Bretonnia can sleep with its back guarded. If it fails, the mountains will become a road for every fear the realm hoped was distant.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.62.a:0 "Hold the passes."

 war_unique_intro_events.63.t:0 "Songs of Aquitaine"
 war_unique_intro_events.63.d:0 "Aquitaine is fertile, cultured, and dangerously easy for outsiders to mistake as gentle. Its fields feed courts and chapels, its patrons reward poets and artists, and its knights understand that a song can carry a reputation farther than a herald.\n\nArmand d'Aquitaine rules a duchy where bounty and beauty must be defended if they are to mean anything. Grail devotion, coastal guardians, noble households, and village harvests all depend on honor that can leave the hall and survive the road.\n\nThe Lady's grace does not exempt Aquitaine from the age's darkness. Pirates test the coast, rivals measure its wealth, Beastmen haunt the wilderness, and every courtly virtue risks becoming vanity if it asks peasants to bleed unseen.\n\nThe situation is graceful but exposed, so we must make culture serve courage. Songs should remember duty, feasts should feed loyalty, and Grail knights should prove that refinement need not soften the lance.\n\nIf Aquitaine binds beauty to protection, its fame will strengthen Bretonnia rather than distract it. If not, its finest verses will become elegies.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.63.a:0 "Let honor be sung."

 war_unique_intro_events.64.t:0 "Tides of Brionne"
 war_unique_intro_events.64.d:0 "Brionne's harbor is a busy argument between chivalry and commerce, with shipwrights, sailors, merchants, and knights all insisting they serve the Lady in the most necessary way. The sea brings wealth, but it never brings only wealth.\n\nTheodoric d'Brionne governs markets where foreign goods, dockside rumor, and Bretonnian pride meet under the eyes of chapel and counting house alike. A duchy that builds fine ships must also decide what those ships are for.\n\nCoastal threats are constant. Pirates, foreign fleets, storms, and rival merchants all test Brionne, while inland nobles sometimes forget that a port can defend the realm before a lance ever lowers.\n\nThe situation is tidal, so we must make the harbor holy without making it naive. Shipyards must serve defense, markets must fund honor, and sea-knights must prove that courage can stand on a deck as firmly as in a saddle.\n\nIf Brionne masters the tide, Bretonnia's coast will have a shield and a purse. If it fails, every mast in the harbor will look like an invitation.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.64.a:0 "Launch the blessed keels."

 war_unique_intro_events.65.t:0 "Shrines of Quenelles"
 war_unique_intro_events.65.d:0 "Quenelles is rich in sacred waters, fertile lands, pilgrim roads, and vows spoken with more weight than ordinary law. The Lady's presence feels near here, which makes failure not less possible but less excusable.\n\nTancred II d'Quenelles rules a duchy where faith is infrastructure. Shrines draw pilgrims, pilgrims bring wealth and trouble, and every knight who claims divine favor must show that protection reaches beyond the chapel door.\n\nThe Lady's holiest places do not stand outside politics. Rival dukes seek prestige, peasants seek mercy, priests guard influence, and enemies would dearly love to prove that sanctity can burn like anything else.\n\nThe situation is blessed and vulnerable, so we must make devotion govern well. Sacred sites must be defended, roads kept safe, vows enforced, and prosperity tied to service rather than indulgence.\n\nIf Quenelles turns holiness into order, it can become Bretonnia's spiritual anchor. If it grows complacent, every desecration will sound louder because it happened where the Lady was thought closest.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.65.a:0 "Guard the holy waters."

 war_unique_intro_events.66.t:0 "Wings above the Peaks"
 war_unique_intro_events.66.d:0 "Parravon looks across the Grey Mountains from roads, high pastures, and towers where the sky itself seems part of the duchy's inheritance. Its pegasus knights are not decoration; they are warning, judgment, and sudden violence from above.\n\nCassyon d'Parravon rules a border duchy where trade, altitude, and danger meet. Alpine markets bring wealth, mountain trails bring strangers, and every pass toward the Empire must be watched from ground and air alike.\n\nThe realm's enemies rarely announce themselves politely at a castle gate. Raiders, smugglers, monsters, and ambitious neighbors all use difficult terrain as cover, which means Parravon must make difficulty its own weapon first.\n\nThe situation is high and exposed, so we must turn freedom of movement into discipline. Pegasus knights must scout before glory tempts them, merchants must fund the watch, and mountain folk must know the duchy's wings protect more than noble pride.\n\nIf Parravon rules the heights, Bretonnia's enemies will find no unseen road through the peaks. If it fails, even the most beautiful charge will arrive too late.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.66.a:0 "Take to the skies."

 war_unique_intro_events.67.t:0 "The Iron March"
 war_unique_intro_events.67.d:0 "Carcassonne is a frontier duchy that trusts stone, steel, vows, and vigilance more than pretty reassurance. Its fortresses stand because too many enemies have proved the border is not an idea but a place where men die.\n\nHuebald d'Carcassonne commands knights trained to endure hard fighting and peasants who understand that a shield is holy only if someone is behind it. The Lady blesses valor, but valor must still build walls, patrol roads, and keep watch after sunset.\n\nBeyond the borders lie threats that do not respect chivalric ceremony. Raiders, Greenskins, monsters, and worse things test every weak place, while Bretonnian politics can make even necessary severity look uncourtly.\n\nThe situation is martial and unforgiving, so we must make defense into identity. Strongholds must be maintained, knights hardened, and every lord reminded that protecting the weak is not a phrase but an obligation with mud on it.\n\nIf Carcassonne holds, it will be the iron edge of Bretonnia's promise. If it fails, the realm will learn that songs about protection do not stop a breach.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.67.a:0 "Stand at the frontier."

 war_unique_intro_events.68.t:0 "Raiders of the Sea Claws"
 war_unique_intro_events.68.d:0 "The Skaelings are feared because their longships turn distance into cruelty. One day a coast is counting fish, wool, and coin; the next it is counting ashes while northern sails vanish into mist.\n\nSkera Ragarsson rules a tribe that understands the sea as road, shrine, and weapon. Longship builders, raiders, champions, and hard families of the frozen homeland all know that wealth belongs to those bold enough to take it and fast enough to leave.\n\nThe Empire and Bretonnia call the Skaelings pirates when they are angry and storms when they are frightened. The tribe knows it is neither. A storm does not choose rich targets, and a pirate does not hear gods in the wind.\n\nThe situation is hungry and maritime, so we must make every voyage prove worth. Merchant routes must be bled, rival tribes outdone, and every returning ship made into a sermon in plunder.\n\nIf the Skaelings master the Sea of Claws, the south will learn to fear fog, oars, and laughter in the dark. The north respects those who return heavy.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.68.a:0 "Push the longships out."

 war_unique_intro_events.69.t:0 "War-Drums of the Bjornlings"
 war_unique_intro_events.69.d:0 "The Bjornlings are a large and hard people, raised among cold lands where weakness becomes public knowledge quickly. Their warbands have the numbers to matter and the discipline to make that matter before louder tribes waste their strength on boasting.\n\nUlfric Grondal rules warriors who learn early that survival is not separate from battle. Harsh weather, rival tribes, southern enemies, and the demands of the old gods all shape a people who measure leadership by victory that can be repeated.\n\nNorsca is never at peace in any useful sense. A quiet season only means feuds are sharpening indoors, champions are comparing scars, and neighbors are wondering which camp has grown too comfortable.\n\nThe situation is brutal and competitive, so we must gather the warbands before another jarl gives them a better story. Strength must be organized, raids chosen well, and every victory turned into authority before winter and rumor eat it.\n\nIf the Bjornlings bind size to purpose, they can become more than one tribe among many. They can become the weight other northmen must move around.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.69.a:0 "Gather the warbands."

 war_unique_intro_events.70.t:0 "Hunters under Dark Stars"
 war_unique_intro_events.70.d:0 "The Graelings know the wild paths of Norsca better than most men know their own doorways. They hunt, raid, vanish, and return by routes that outsiders call impossible because outsiders are usually lost before the lesson begins.\n\nAoakan Oybiorn rules beneath darker stars than many Norscan jarls admit. The tribe's omens lean toward ruin, its warriors follow tracks through snow and stone, and its leaders know terrain can be a blade if held correctly.\n\nThe Graelings are not the loudest tribe of the north, but endurance has its own authority. Long hunts, lean campaigns, sudden raids, and a talent for surviving harsh ground make them dangerous in ways a southern general may not notice until supplies disappear.\n\nThe situation is shadowed and mobile, so we must choose the path before the gods choose it for us. Scouts must guide warbands, plunder must feed loyalty, and every dark sign must be turned outward before it rots the camp.\n\nIf the Graelings follow their tracks wisely, they may arrive where stronger tribes cannot. In the north, the unseen road can be worth more than the loudest oath.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.70.a:0 "Follow the tracks."

 war_unique_intro_events.71.t:0 "Favored by Ruin"
 war_unique_intro_events.71.d:0 "The Aeslings are not content to raid for hunger alone. Their chiefs court the Dark Gods with sacrifice, oath, and spectacle, seeking signs in blood spray, storm light, and the silence after a village burns.\n\nAmong them, faith is not a quiet matter. Champions rise because the gods seem to notice them, and rivals fall because a failed raid can be read as divine contempt. Every warband is a shrine with axes, every feast a judgment on who deserves the next command.\n\nThe south sees only savagery, but the Aeslings understand a harsher politics. Plunder feeds loyalty, sacrifices bind fear to obedience, and the gods reward those who make their devotion impossible to ignore.\n\nThe situation is zealous and unstable, so we must turn holy violence outward before it consumes the tribe. If the Aeslings can make faith, ships, and slaughter move as one, the north will hear their name before the victims do.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.71.a:0 "Seek the gods' favor."

 war_unique_intro_events.72.t:0 "The Great Tribe"
 war_unique_intro_events.72.d:0 "The Sarls are counted among the great tribes of Norsca, and size is a promise that must be renewed with blood. Many halls answer their chiefs, many ships can be called to sea, and many rivals watch for the first sign that numbers have made them soft.\n\nA Sarl leader cannot rule by boasting alone. The tribe's warriors expect victory, the households expect plunder, and lesser chiefs expect their pride to be honored without being allowed to fracture the war-host.\n\nThe south fears Norscan fury, but the Sarls know fury is wasted unless it can march, sail, and return with proof. Discipline does not make them gentle. It makes their cruelty arrive on time.\n\nThe situation is powerful and demanding, so we must gather the warbands before ambition scatters them. If the Sarls bind strength to purpose, they can become the weight other northern tribes must measure themselves against.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.72.a:0 "Gather the war-host."

 war_unique_intro_events.73.t:0 "Children of Decay"
 war_unique_intro_events.73.d:0 "The Rotbloods do not fear sickness, weakness, or the slow collapse of flesh. They call these things gifts, proof that Grandfather Nurgle has noticed them and made their bodies into sermons against mortal pride.\n\nHord Viletide leads a warband whose strength is endurance more than speed. Wounds suppurate without stopping the march, hunger becomes another ache to laugh at, and the air around their camps teaches enemies that courage can rot before steel is crossed.\n\nTo the Empire, they are corruption made visible. To other servants of Chaos, they are a reminder that ruin need not be bright, swift, or glorious. It can be patient, swollen, and cheerful in the face of every attempt to kill it.\n\nThe situation is pestilent and ravenous, so we must carry decay into lands still pretending health will save them. Let walls mildew, wells sour, and soldiers learn the mercy of numb flesh.\n\nThe time of reckoning draws near. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.73.a:0 "Spread the Plague Father's gifts."

 war_unique_intro_events.74.t:0 "The Walls of Avila"
 war_unique_intro_events.74.d:0 "Avila is a city of walls, markets, and negotiated privilege. Stone keeps raiders outside, but charters keep the city alive, drawing merchants, craftsmen, and ambitious families into streets where profit quickly becomes politics.\n\nThe merchant houses do not merely count coin. They fund workshops, influence councils, sponsor militias, and decide which foreign promises are worth believing. Their wealth is useful, but every useful purse expects a hand on the tiller.\n\nEstalia is bright with opportunity and sharp with rivalry. Every city speaks of common destiny while guarding its own tolls, docks, warehouses, and noble dignity. Avila must be prosperous without becoming complacent, defended without becoming closed.\n\nThe situation is civic and competitive, so we must make walls and ledgers serve the same future. If Avila can discipline its merchant houses, arm its citizens, and keep fair trade flowing, its charters will become more than parchment. They will become a claim to lead.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.74.a:0 "Open the charters."

 war_unique_intro_events.75.t:0 "Harbor Lords of Bilbali"
 war_unique_intro_events.75.d:0 "Bilbali looks west across a restless sea, and the harbor families understand that a ship is never only a ship. It is profit, escape, threat, rumor, and sometimes a private war with a legal seal pasted over the blood.\n\nThe city lives by sailors who know the weather, dockmasters who know every cargo, and captains who can turn trade routes into hunting grounds when rival powers grow careless. Wealth arrives on the tide, but so do pirates, foreign agents, and the ambitions of every house that owns a pier.\n\nEstalia's future will be decided as much on water as on land. Magritta may boast, inland lords may tax, and Bretonnia may look south with lances ready, but Bilbali's captains know horizons no court can fence.\n\nThe situation is maritime and hungry, so we must protect the harbor while sending its boldest keels outward. If Bilbali masters privateering, trade, and defense together, the western sea will carry its name into every bargain.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.75.a:0 "Ready the harbor."

 war_unique_intro_events.76.t:0 "Marches of Las Marcas"
 war_unique_intro_events.76.d:0 "Las Marcas is a country of roads that climb, villages that keep weapons close, and fortresses built because every generation learned the border would be tested again. Its people do not mistake quiet for peace.\n\nThe marches survive through habits softer lands call severe. Local guides know the paths, levies assemble before couriers finish shouting, and settlements are prepared to become strongpoints when banners appear beyond the hills.\n\nEstalia's coastal cities dream of ships and tradeposts, but Las Marcas knows inland survival is its own ambition. If the mountains fall open, merchants lose roads, fields lose shelter, and every rival gains a way to turn local quarrels into invasion.\n\nThe situation is rugged and watchful, so we must make frontier life into statecraft. Forts must be maintained, guides honored, and trade crossings protected without letting any neighbor decide the toll. If Las Marcas holds the roads, Estalia's heart will have time to look outward.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.76.a:0 "Hold the mountain roads."

 war_unique_intro_events.77.t:0 "The Great Port of Estalia"
 war_unique_intro_events.77.d:0 "Magritta is Estalia's great gate to the world, a city where shipyards ring, merchants argue in half a dozen tongues, and every tide carries the rumor of lands beyond the Western Ocean. Its wealth is not still; it moves.\n\nCaptains, cartographers, consortiums, dockside laborers, and noble patrons all want a share of the city's direction. Some see trade, some see discovery, some see empire, and some see only the next contract signed before a rival can steal it.\n\nYet Magritta's grandeur does not make Estalia safe. Bretonnia watches from the north, Tilea competes from the east, pirates test the routes, and every foreign harbor welcomes Estalian gold more warmly than Estalian power.\n\nThe situation is rich and outward-facing, so we must make ambition seaworthy. Fleets must guard merchants, merchants must fund exploration, and exploration must return with more than stories. If Magritta masters the horizon, Estalia may become a name spoken wherever sails are raised.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.77.a:0 "Look beyond the horizon."

 war_unique_intro_events.78.t:0 "Heart of Obregon"
 war_unique_intro_events.78.d:0 "Obregon is an inland power in a land too often remembered only by its ports. Its fields, roads, officers, and fortified towns give Estalia a different kind of strength, less glamorous than a harbor but harder to sweep aside.\n\nThe commanders of Obregon prize discipline because they cannot rely on sea walls or distant horizons to solve their dangers. Levies must answer quickly, infantry must hold together, and towns must be supplied before rival princes or foreign armies discover an opening.\n\nEstalia is divided by pride as much as geography. Coastal cities chase trade, frontier lords guard passes, and ambitious courts promise unity while measuring how much obedience they can demand from neighbors.\n\nThe situation is central and contested, so we must make order visible. If Obregon can discipline its officers, gather the countryside, and defend its towns, it will prove that Estalia's future is not only written in ships and gold. It is also written in drilled ranks and locked gates.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.78.a:0 "Discipline the levies."

 war_unique_intro_events.79.t:0 "Republic of Ledgers"
 war_unique_intro_events.79.d:0 "Novareno is governed by families who understand that a charter can conquer where an army would only bankrupt itself. Licenses, caravans, tolls, and guild offices are the weapons by which the republic turns movement into power.\n\nIts merchants are not timid counters of coin. They hire guards, buy information, arrange credit, and make distant markets dependent on contracts written in Novareno's hand. Every road is a negotiation, and every negotiation is a chance to make rivals pay for passage through our prosperity.\n\nYet merchant rule has its own dangers. A city that treats wealth as legitimacy must keep wealth moving, or the same families that praise order will begin auctioning loyalty to the highest bidder.\n\nThe situation is commercial and restless, so we must make law useful before greed makes it brittle. If Novareno can regulate trade without choking it, guide caravans without robbing them blind, and make guilds serve the state, its ledgers will become a map of influence.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.79.a:0 "License the traders."

 war_unique_intro_events.80.t:0 "Harbor of Opportunity"
 war_unique_intro_events.80.d:0 "Portua's harbor is the kind of natural gift that becomes dangerous the moment other powers notice it. Deep water, busy markets, and skilled shipwrights promise wealth, but they also invite pirates, creditors, spies, and ambitious neighbors.\n\nThe city's merchant families claim to serve prosperity, and often they do. They fund fleets, maintain docks, and cultivate agreements across the southern seas. They also expect policy to bend toward their warehouses and away from anyone who cannot read a balance sheet.\n\nEstalia needs ports that can do more than grow rich. It needs harbors that can defend themselves, coordinate with inland allies, and turn foreign traffic into leverage rather than dependency.\n\nThe situation is open and profitable, so we must make opportunity answer discipline. If Portua guards its sea lanes, keeps its shipyards busy, and prevents merchant influence from becoming private rule, the harbor will be a gateway we command rather than a doorway others force.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.80.a:0 "Guard the trade routes."

 war_unique_intro_events.81.t:0 "Frontier of Laon"
 war_unique_intro_events.81.d:0 "Laon stands where borders are less settled than maps pretend. Its fortresses are maintained because memory is practical here: raids, invasions, broken treaties, and sudden claims have taught the people that walls are cheaper than regret.\n\nThe realm survives through taxes that feed garrisons, commanders seasoned by repeated alarms, and alliances made with one eye on the next betrayal. A frontier lord who cannot bargain and fight in the same season soon leaves heirs with nothing to inherit.\n\nEstalia's brighter cities may call Laon severe, but their markets depend on marches that hold. If the frontier collapses, trade routes become escape routes and noble pride becomes a refugee's complaint.\n\nThe situation is tense and defensive, so we must make preparedness respectable. Fortresses must be supplied, levies drilled, and allies reminded that Laon's survival protects more than Laon. If the line holds, the realm behind it can afford ambition.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.81.a:0 "Maintain the fortresses."

 war_unique_intro_events.82.t:0 "Coastal Bastion"
 war_unique_intro_events.82.d:0 "Tartantia lives with the sea at its face and danger at its back. Its walls, docks, and watchtowers have grown together because trade without defense is only an invitation written in gold.\n\nThe city's shipwrights know every plank has a political use. Merchant vessels enrich the harbor, patrol craft keep raiders honest, and warships remind rivals that Tartantia's taxes pay for more than festivals and comfortable offices.\n\nEstalia's coast is not a peaceful road. Pirates, ambitious princes, foreign traders, and private quarrels all move along it, each hoping to find one port distracted by another's troubles.\n\nThe situation is exposed and industrious, so we must make every dock serve the walls and every wall protect the docks. If Tartantia taxes trade fairly, maintains its fortifications, and keeps good captains in service, its coast will become a bastion rather than a prize. The sea rewards boldness, but it respects preparation more.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.82.a:0 "Tax the harbor."

 war_unique_intro_events.83.t:0 "Warlords of Irrana"
 war_unique_intro_events.83.d:0 "Irrana has been hardened by conflicts that rarely become clean enough for songs. Rival Estalian states, local strongmen, exhausted villages, and armed councils have all taught its people that survival belongs to those who can endure the next campaign.\n\nLeaders rise through force here because authority that cannot protect itself is only a rumor. Warlord commanders tax for war, train for war, and negotiate with war always waiting in the next room.\n\nThat harshness carries danger. A realm built by armed necessity must keep its soldiers loyal to the state, not merely to the loudest captain with coin and a grievance.\n\nThe situation is martial and unforgiving, so we must turn endurance into institutions. If Irrana can discipline its forces, make taxation serve defense rather than predation, and use diplomacy without pretending friendship is safety, it may become more than another hard country among many. It may become the place rivals think twice before testing.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.83.a:0 "Endure the campaigns."

 war_unique_intro_events.84.t:0 "Families of Cantonia"
 war_unique_intro_events.84.d:0 "Cantonia is a republic of merchant families, civic pride, and careful arithmetic. Its rulers speak of public good, but every council chamber knows the public good often arrives carrying a private seal.\n\nThe city grows through contracts, licensed traders, guild investments, and the confidence that profit can be made orderly if the right people hold the quills. Such confidence is useful. It is also dangerous when rivals, debtors, or ambitious houses decide that the rules are only tools for whoever can bend them first.\n\nEstalia rewards cities that move quickly and punishes those that move blindly. Trade must expand, but expansion without defense invites predation. Family influence must be used, but not allowed to replace government.\n\nThe situation is prosperous and political, so we must balance ledgers before they become battle lines. If Cantonia binds wealth to civic duty, its families may build a state stronger than their quarrels.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.84.a:0 "Balance the ledgers."

 war_unique_intro_events.85.t:0 "Gateway of Zaraguz"
 war_unique_intro_events.85.d:0 "Zaraguz stands at a meeting of roads, markets, and ambitions. Goods cross its streets from inland routes and coastal networks alike, and every caravan that stops there leaves behind coin, rumor, and another reason for rivals to care who controls the city.\n\nThe city's strength lies in making passage orderly. Walls protect warehouses, tolls support officials, and merchants trust Zaraguz because its rulers understand that trade is a promise as much as an opportunity.\n\nYet crossroads are never neutral for long. Foreign agents, competing Estalian powers, smugglers, and noble claimants all know that command of movement can become command of policy.\n\nThe situation is connected and vulnerable, so we must watch the crossroads without strangling them. If Zaraguz keeps its markets fair, its gates strong, and its diplomacy alert, it can turn traffic into influence. If not, others will use its roads to carry away the future it should have claimed.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.85.a:0 "Watch the crossroads."

 war_unique_intro_events.86.t:0 "Ledgers of Verezzo"
 war_unique_intro_events.86.d:0 "Verezzo is a city where numbers are never merely numbers. Votes, debts, mercenary contracts, warehouse shares, and family obligations all move through ledgers that can raise armies more quietly than a trumpet.\n\nIts rulers know Tilea's game well. A prince with no money is a decoration, a council with no soldiers is an argument, and a merchant with no friends is prey. Verezzo survives by making each part need the others.\n\nThe wider peninsula is rich, brilliant, and divided enough to make brilliance lethal. Remas remembers empire, Miragliano trusts engineering, Sartosa laughs at law, and every city hires someone else's sons to settle disputes.\n\nThe situation is calculating and crowded, so we must count the votes before rivals count our weaknesses. If Verezzo can make commerce, reform, and hired steel answer a single policy, it will prove that arithmetic can rule a city as surely as a crown.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.86.a:0 "Count the votes."

 war_unique_intro_events.87.t:0 "Intrigues of Trantio"
 war_unique_intro_events.87.d:0 "Trantio is beautiful enough to make danger look civilized. Its palaces, salons, contracts, and noble houses turn politics into a game where every smile may be a bid, warning, or trap.\n\nThe city has survived because it understands performance. Patrons hire artists and assassins with equal discretion, mercenary captains are flattered before they are paid, and foreign envoys are welcomed into rooms designed to teach them only what Trantio wants known.\n\nTilea rewards cunning, but cunning without structure becomes expensive chaos. A plot that wins a season can still lose a generation if the city forgets that government must do more than embarrass rivals.\n\nThe situation is elegant and unstable, so we must play the houses carefully. If Trantio can turn intrigue into policy, patronage into loyalty, and wealth into reform, it may become a master of the peninsula's dangerous conversation rather than one more whispered cautionary tale.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.87.a:0 "Play the houses carefully."

 war_unique_intro_events.88.t:0 "Free Sails of Sartosa"
 war_unique_intro_events.88.d:0 "Sartosa is a harbor where law arrives late, armed, and usually negotiable. Pirates, exiles, merchants, smugglers, and Tilean opportunists crowd its quays, each insisting that freedom means their own knife should be respected first.\n\nThe island's danger is also its strength. Captains who would never obey a prince may answer a profitable signal, and crews too unruly for ordinary service can become a fleet if given enemies worth robbing.\n\nTilea's mainland cities call Sartosa a scandal when they are not quietly hiring its ships. The sea cares little for respectability, and the routes around the island are rich enough to forgive many sins if the coin reaches the right purse.\n\nThe situation is lawless and lucrative, so we must make disorder pay the state before it sells the state for drink. If Sartosa can discipline its black flags without killing their nerve, every merchant captain in the south will learn to watch the horizon.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.88.a:0 "Let the black flags profit."

 war_unique_intro_events.89.t:0 "Poisoned Courts of Pavona"
 war_unique_intro_events.89.d:0 "Pavona understands that a small court can be more dangerous than a large army if every cup, marriage, compliment, and contract is placed correctly. Its politics are intimate, perfumed, and sharp.\n\nNoble families compete for influence with the patience of people who know a public victory may be less useful than a private debt. Patronage buys songs, artists, captains, and informants, while rivals learn to ask who benefits before accepting even kindness.\n\nTilea is full of cities that boast louder than Pavona. That is useful. A quieter state may survive by listening first, smiling second, and striking only when the bill can be paid.\n\nThe situation is courtly and dangerous, so we must keep a knife ready without cutting our own hand. If Pavona makes intrigue serve reform, wealth, and defense, its reputation for poison will become more than a warning. It will become a shield.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.89.a:0 "Smile with a knife ready."

 war_unique_intro_events.90.t:0 "Rock of Tobaro"
 war_unique_intro_events.90.d:0 "Tobaro clings to stone and sea, a fortress-port that has learned to make geography into policy. Its walls look outward over routes that carry merchants, pirates, pilgrims, and enemies who would gladly own such a gate.\n\nThe city survives because it does not separate trade from defense. Dock dues feed garrisons, garrisons protect markets, and markets give sailors reasons to return with news before danger arrives in force.\n\nTilea's quarrels are never far away, but Tobaro's position gives it choices denied to softer inland courts. It can bargain with ships, shelter behind walls, and punish those who confuse a small territory with a weak one.\n\nThe situation is maritime and fortified, so we must hold the sea gate with both ledgers and cannon. If Tobaro keeps its harbor open, its walls supplied, and its captains loyal, the rock will become a hinge of southern power.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.90.a:0 "Hold the sea gate."

 war_unique_intro_events.91.t:0 "Twins of Luccini"
 war_unique_intro_events.91.d:0 "Luccini lives beneath the shadow of founding legends, twin stories, old stones, and southern confidence. Myths are useful in Tilea, but only if they can be made to collect taxes, inspire soldiers, and settle arguments before rivals turn them into jokes.\n\nThe city is wealthy, proud, and well placed, with merchant houses that understand the sea and nobles who understand the value of ceremony. Every festival remembers greatness; every council meeting decides whether greatness will remain decorative.\n\nTilea's cities all claim inheritance from something older and grander. Luccini's task is to make its inheritance practical, to turn splendor into ships, reform, walls, and influence along the southern routes.\n\nThe situation is storied and ambitious, so we must make legend useful. If Luccini binds myth to administration and trade, its past will not be a weight. It will be a banner under which the future can march.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.91.a:0 "Make legend useful."

 war_unique_intro_events.92.t:0 "Canals of Miragliano"
 war_unique_intro_events.92.d:0 "Miragliano is a city of canals, engineers, bridges, and nervous vigilance. Water enriches it, protects it, and threatens to carry rot through it if the works are neglected for even a season.\n\nIts rulers trust artifice because artifice has kept the city alive. Drains, walls, sluices, workshops, and careful street plans are not luxuries; they are the difference between prosperity and plague, between defense and panic.\n\nTilea admires genius, but genius must be maintained. A clever design left unfunded becomes a monument to arrogance, and a city that believes itself too brilliant to fail has already begun doing so.\n\nThe situation is inventive and vulnerable, so we must drain the rot before it becomes policy. If Miragliano keeps engineers close, canals clean, and mercenary contracts ready, it can turn technical mastery into durable power. In Tilea, survival often belongs to whoever solves the practical problem first.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.92.a:0 "Drain the rot."

 war_unique_intro_events.93.t:0 "The Cities Remember Empire"
 war_unique_intro_events.93.d:0 "Tilea is a peninsula of brilliant cities, sharp knives, richer ledgers, and memories too large for any one republic to hold comfortably. Every street seems to know commerce, art, argument, and hired violence as old companions.\n\nThe Reman Empire is gone, but its echo has not left the stones. Remas claims legacy, Verezzo counts advantage, Miragliano engineers survival, Sartosa laughs at rules, and every city-state can explain why unity would be excellent if someone else did the kneeling.\n\nYet the world is growing too dangerous for clever division alone. Chaos stirs, pirates circle, Bretonnia watches, and every mercenary captain knows a divided Tilea pays well because it bleeds often.\n\nThe situation is fractured and magnificent, so we must dream in marble and coin without forgetting steel. If Tilea can make rivalry serve renewal, the old Reman idea may return as more than nostalgia. It may become a power the Old World must reckon with.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.93.a:0 "Dream in marble and coin."

 war_unique_intro_events.94.t:0 "Sunlit Ambition"
 war_unique_intro_events.94.d:0 "Estalia faces west, and the sea answers with rumors of distant coasts, strange goods, and fortunes large enough to make every court forget its caution. Its ports are crowded with sailors, merchants, priests, and visionaries who hear destiny in rigging.\n\nThe realm is not united by ease. Inland lords guard roads, harbor cities compete for customs, frontier forts demand support, and every noble house insists its local pride is the natural beginning of national greatness.\n\nTo the north, Bretonnia's knights may one day ride south in strength. To the east, Tilea's merchants and mercenaries compete for every contract. Beyond the Western Ocean, however, lies the promise that Estalia need not merely answer its neighbors.\n\nThe situation is divided but outward-looking, so we must sail westward with purpose. If Estalia binds ports, fleets, and crowns into common ambition, its banners may become familiar in harbors no Estalian has yet seen.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.94.a:0 "Sail westward."

 war_unique_intro_events.95.t:0 "The Eagle Recast"
 war_unique_intro_events.95.d:0 "The Reman Empire is a memory with teeth. Its roads, laws, ruins, and borrowed titles still haunt the south, reminding every Tilean prince that the peninsula once spoke with a voice larger than any one city.\n\nTo restore that name is not enough. An eagle stamped on a coin cannot command armies by itself, and old marble cannot collect taxes from cities that have grown rich by ignoring one another. Revival must become administration or it will remain theater.\n\nTilea is brilliant precisely because it is divided, but division has made brilliance expensive. Mercenary wars, trade rivalries, pirate bargains, and noble vanity all consume strength that could be turned outward.\n\nThe situation is glorious and skeptical, so we must raise the eagle again with laws behind it. If the Reman Empire can make roads safe, cities obedient, contracts reliable, and soldiers answer more than coin, the old dream may stop being nostalgia and start being government.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.95.a:0 "Raise the eagle again."

 war_unique_intro_events.96.t:0 "Castles above the Frontier"
 war_unique_intro_events.96.d:0 "Monte Castello looks down from hard roads and stone heights, close enough to Tilea to know its ambitions and close enough to the Borderlands to know how quickly ambition can become banditry. Its castles are not decoration; they are policy in masonry.\n\nThe realm survives by controlling movement. Caravans, mercenary bands, diplomats, refugees, and raiders all learn that a high road watched by Monte Castello is not free merely because it is steep.\n\nTilean wealth and frontier danger meet here in uncomfortable partnership. Merchants want roads open, soldiers want supplies, and local lords want every toll to prove that their authority is real.\n\nThe situation is elevated and exposed, so we must hold the high roads with discipline. If Monte Castello keeps its castles supplied, its passes watched, and its Tilean connections profitable, it can become a gatekeeper between orderly ambition and the hungry frontier beyond.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.96.a:0 "Hold the high roads."

 war_unique_intro_events.97.t:0 "Small Port, Wide Sea"
 war_unique_intro_events.97.d:0 "Sitges is not Estalia's loudest harbor, but small ports can hear things great cities miss. Every quay, storehouse, and fishing boat sits within reach of wider currents, and every visiting merchant brings a map of someone else's opportunity.\n\nThe town must live carefully among larger neighbors. Magritta dreams of oceanic grandeur, Bilbali arms privateers, inland lords demand taxes, and foreign captains assume a modest port can be pressured more easily than a famous one.\n\nThat assumption can be useful. A smaller harbor can move quietly, adapt quickly, and profit from routes too minor for the proud to notice until they are no longer minor.\n\nThe situation is modest and maritime, so we must turn the quay outward. If Sitges keeps its sailors skilled, its tolls fair, and its defenses credible, it can become a hinge in Estalia's western ambitions. The sea does not measure greatness by city walls alone.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.97.a:0 "Turn the quay outward."

 war_unique_intro_events.98.t:0 "Forges of Nuln"
 war_unique_intro_events.98.d:0 "Nuln is smoke, scholarship, black powder, and courtly danger wrapped around the Reik. Its foundries and Gunnery School make the city invaluable to the Empire, which is precisely why every faction wants a hand on its artillery.\n\nEngineers, officers, burghers, nobles, and ambitious patrons all claim to understand what Nuln needs. Some want contracts, some want prestige, some want guns for provincial feuds, and some understand that the Empire's enemies will not wait while committees debate calibers.\n\nThe city cannot be merely rich. It must be disciplined. A cannon cast badly is a failure, but a cannon assigned badly can become a catastrophe for the whole southern Empire.\n\nThe situation is industrious and political, so we must load the guns under a single policy. If Nuln binds academy, arsenal, river trade, and command together, its firepower will defend the Empire rather than tempt every rival who covets it.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.98.a:0 "Load the guns."

 war_unique_intro_events.99.t:0 "Argalis at the Edge"
 war_unique_intro_events.99.d:0 "Argalis carries Estalian habits into a harsher country, where charters, merchant custom, and noble pride must share roads with sellswords, exiles, and sudden violence. The Borderlands respect paperwork only when it arrives with guards.\n\nIts rulers have an opportunity and a problem. Estalian trade gives Argalis access to wider markets, skilled captains, and a language of law that can make deals durable. The frontier gives it rivals who treat durability as an invitation to test the walls.\n\nA state at the edge cannot afford to be either too trusting or too closed. Merchants must be encouraged, but not allowed to hire the realm out from under its rulers. Soldiers must be paid, but not allowed to become the only law.\n\nThe situation is commercial and dangerous, so we must keep the southern charters alive. If Argalis balances Estalian order with frontier caution, it can make the border a market instead of a wound.\n\nThe first task is not conquest but coherence: harbors, roads, councils, shipyards, and garrisons must stop acting as separate answers to the same danger. Only then can local pride become Estalian power rather than another reason for rivals to wait and profit."
 war_unique_intro_events.99.a:0 "Keep the southern charters."

 war_unique_intro_events.100.t:0 "Vows beyond Bretonnia"
 war_unique_intro_events.100.d:0 "Vardanos carries Bretonnian faith into lands where the old duchies feel distant and every neighbor has learned a different rule for survival. The Lady's name still commands reverence, but reverence must travel armed here.\n\nKnights, pilgrims, frontier settlers, and wary peasants all look to the same vows for protection. Yet the further a realm stands from Bretonnia's ordered heart, the more those vows must answer unfamiliar pressures: mercenary customs, foreign tolls, rival cults, and princes who measure honor by usefulness.\n\nThe danger is not that chivalry will vanish at once. It is that it will become decoration, recited in halls while roads are left to men who sell safety by the mile.\n\nThe situation is faithful and exposed, so we must carry the Lady south with discipline. If Vardanos makes vows protect caravans, chapels, and villages alike, it can prove Bretonnian honor need not end at Bretonnia's borders.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.100.a:0 "Carry the Lady south."

 war_unique_intro_events.101.t:0 "Brovska's Harsh Compact"
 war_unique_intro_events.101.d:0 "Brovska sits where Wastelander habits meet frontier necessity. Its people understand bargains, tolls, marshy suspicion, and the value of keeping one more road open than rivals expect.\n\nThe realm cannot rely on the security of old Imperial institutions. Merchants want predictable law, settlers want walls, captains want pay, and neighbors want any excuse to turn border confusion into profit. Every agreement must be useful enough to survive contact with hunger.\n\nThat makes Brovska harder than it looks. A frontier state with Wastelander instincts can count coin, read contracts, and still keep a blade ready under the table. Such habits may be ungenerous, but generosity is rarely what keeps a border alive.\n\nThe situation is suspicious and practical, so we must hold the frontier bargain. If Brovska can make trade fund defense and defense protect trade, it will become more than a stop on a dangerous road. It will become a price others must pay.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.101.a:0 "Hold the frontier bargain."

 war_unique_intro_events.102.t:0 "Pass at Akendorf"
 war_unique_intro_events.102.d:0 "Akendorf watches roads under the Black Mountains, where every pass is a promise to friends and an invitation to enemies. Its people know that geography does not defend itself; men must stand where the map narrows.\n\nImperial habits remain strong here, but the frontier changes their meaning. A tidy law code matters less if the gate captain is unpaid, and a proud banner means little if caravans disappear before reaching the next fort.\n\nGreenskins, bandits, ambitious princes, and darker things all understand the value of movement through these lands. Whoever commands the roads can tax, raid, shelter, or starve the country around them.\n\nThe situation is narrow and strategic, so we must guard the Black Mountains with more than hopeful patrols. If Akendorf keeps its passes supplied, its soldiers disciplined, and its roads worth trusting, the frontier will become a shield rather than a corridor for disaster.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.102.a:0 "Guard the Black Mountains."

 war_unique_intro_events.103.t:0 "The Necromancer's Schloss"
 war_unique_intro_events.103.d:0 "Masserschloss is a closed door in a frightened land. Behind its walls, Bragthorn the Necromancer gathers servants, secrets, and dead obedience, making silence do the work that proclamations would only endanger.\n\nThe living around the fortress whisper of vanished travelers, pale lights, and orders carried out by men who do not breathe. Such fear is useful, but fear alone cannot build a realm. It must be directed, rationed, and made to serve policy rather than panic.\n\nNagash's shadow offers a language older and colder than local law. Corpse-labor, hidden rites, and the patience of graves can make Masserschloss stronger than its size, but only if the living are managed before they flee, rebel, or invite crusaders.\n\nThe situation is secretive and deadening, so we must bar the doors before dusk and choose who enters. If Masserschloss masters fear and necromancy together, neighboring princes will learn that some castles do not sleep.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!\n\nThe first task is secrecy with purpose. Fear must be shaped into obedience, and obedience into enough strength that discovery becomes a weapon rather than a sentence."
 war_unique_intro_events.103.a:0 "Bar the doors before dusk."

 war_unique_intro_events.104.t:0 "Waldovia between Shadows"
 war_unique_intro_events.104.d:0 "Waldovia lives with Sylvanian memory close enough to feel like weather. Its valleys, villages, and minor courts know the old stories of night rulers, vanished heirs, and bargains that should never have been made after sunset.\n\nYet Waldovia is not merely a haunted footnote. It is a living frontier of fields, roads, local loyalties, and cautious nobles who must prove that old-world cults and Imperial habits can still command trust in a land trained to doubt promises.\n\nThe danger is subtle. Rule too softly, and neighboring predators scent weakness. Rule too harshly, and every peasant begins wondering whether the new lord is only another shadow with a warmer face.\n\nThe situation is wary and burdened by memory, so we must keep the valleys loyal. If Waldovia can maintain roads, drill soldiers, and make law visible before fear fills the space, it may become a buffer rather than a victim of the dark country around it.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.104.a:0 "Keep the valleys loyal."

 war_unique_intro_events.105.t:0 "Molachia's Cold Road"
 war_unique_intro_events.105.d:0 "Molachia carries Kislevite endurance far from Kislev's heart, where cold customs, frontier suspicion, and the worship of Ursun must survive among southern roads and stranger neighbors. It is a hard inheritance in a hard place.\n\nThe people understand that identity can freeze or melt depending on how it is guarded. Boyar habits, caravan needs, local fortresses, and border marriages all pull the realm in different directions, while enemies care little which tradition dies first.\n\nKislev's old story is one of standing before the storm. Molachia's storm is less clean than a northern invasion. It is isolation, compromise, opportunistic neighbors, and the slow temptation to become whatever the frontier finds convenient.\n\nThe situation is cold-blooded in the old sense, so we must endure between worlds without surrendering either. If Molachia keeps faith, roads, and armed households together, it can prove that Kislevite stubbornness travels farther than snow.\n\nThe first task is to keep identity practical. Faith, households, patrols, and stores must answer the same need before distance turns heritage into a song sung by people who no longer obey it willingly."
 war_unique_intro_events.105.a:0 "Endure between worlds."

 war_unique_intro_events.106.t:0 "Feathers over the Frontier"
 war_unique_intro_events.106.d:0 "The Eagle Confederacy is built from free towns, hard bargains, local pride, and the belief that no single petty crown should be allowed to sell the frontier's future. Confederation is a promise, but promises need soldiers and tax collectors.\n\nEach town knows its own walls, markets, and grievances. That knowledge keeps communities alive, yet it can also make common action slow when speed matters most. A border enemy does not wait for every council to finish arguing procedure.\n\nImperial habits give the Confederacy a language of law and burgher duty, but the Borderlands give it neighbors who prefer simpler grammar: coin, threat, and opportunity.\n\nThe situation is free and fragile, so we must bind the free towns before freedom becomes paralysis. If the Eagle Confederacy can turn civic pride into shared defense, its banner may become a rare thing in the marches: a symbol that means more than one ruler's appetite.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.106.a:0 "Bind the free towns."

 war_unique_intro_events.107.t:0 "Norsemen of Khypris"
 war_unique_intro_events.107.d:0 "Khypris is far from Norsca's frozen coasts, but distance has not softened the men who carried northern habits south. Their halls stand near river roads and frontier markets, where a longship's old logic must learn new terrain.\n\nNorse settlers and raiders in the Borderlands face temptations unknown in the north. There is coin to tax, caravans to bleed, walls to seize, and soft neighbors who think a man becomes civilized because he learns the price of grain.\n\nThe old gods do not require snow to listen. They hear oaths on muddy banks, in captured watchtowers, and wherever warriors prove that the south has more to fear from the north than ships alone.\n\nThe situation is displaced and hungry, so we must make the river road bleed. If Khypris turns Norse ferocity toward frontier command, it can become a new kind of raider kingdom, one that strikes from roads as surely as from surf.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.107.a:0 "Make the river road bleed."

 war_unique_intro_events.108.t:0 "Lietpold's Hard Crown"
 war_unique_intro_events.108.d:0 "Lietpoldia is the dream of one hard crown set among marches that rarely respect crowns for long. Mercenary camps, toll roads, fortified towns, and nervous settlers all ask the same question in different accents: who can make order pay?\n\nA ruler in the Borderlands must be more than legitimate. He must be useful. He must keep contracts, punish treachery, feed soldiers, and convince merchants that tomorrow's toll collector will recognize yesterday's receipt.\n\nImperial traditions offer a model of law, but the frontier strips law down to its working parts. If courts cannot protect roads, roads will find other masters. If soldiers are not paid, they will become policy by themselves.\n\nThe situation is ambitious and unruly, so we must rule the marches before they rule us. If Lietpoldia makes authority predictable without making it weak, its crown may become one of the few in the Borderlands worth more than the metal.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.108.a:0 "Rule the unruly marches."

 war_unique_intro_events.109.t:0 "The Barrow Lord's Host"
 war_unique_intro_events.109.d:0 "The Barrow Legion rises from graves that should have stayed quiet. Heinrich Kemmler, the Lichemaster, knows that a battlefield does not end when the living flee; it merely becomes a storehouse for future obedience.\n\nThe Grey Mountains are thick with old dead, broken halls, forgotten kings, and folk wise enough to fear certain mounds after sunset. Kemmler turns such fear into recruitment. Every tomb is a barracks if one has the will and the words.\n\nYet necromancy alone is not strategy. The Legion must choose when to terrify, when to hide, when to bargain with desperate mortals, and when to let the dead march openly enough that no priest can pretend the threat is rumor.\n\nThe situation is grave-cold and ambitious, so we must wake the barrows with purpose. If Kemmler binds corpses, curses, and mountain passes into one host, the living realms nearby will learn that history has claws.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!\n\nThe first task is secrecy with purpose. Fear must be shaped into obedience, and obedience into enough strength that discovery becomes a weapon rather than a sentence."
 war_unique_intro_events.109.a:0 "Wake the barrows."

 war_unique_intro_events.110.t:0 "Scarosio's Errant Vows"
 war_unique_intro_events.110.d:0 "Scarosio carries Bretonnian manners into a land where every road offers a different price for loyalty. The Lady's blessing still matters, but on the frontier a vow must be able to ride, judge, bargain, and bleed.\n\nKnights here learn that honor has unfamiliar work. They escort caravans, settle disputes between strangers, guard chapels that stand beside foreign shrines, and decide which local customs can be tolerated without hollowing out chivalry.\n\nThe danger is not only open corruption. It is the slow convenience of becoming just another Border Prince realm with prettier prayers and better horses.\n\nThe situation is devout and compromised by necessity, so we must keep faith beyond Bretonnia. If Scarosio makes its vows protect real people on real roads, it can show that the Lady's service is not weakened by distance. It is tested by it.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.110.a:0 "Keep faith beyond Bretonnia."

 war_unique_intro_events.111.t:0 "Blood Keep's Red Vow"
 war_unique_intro_events.111.d:0 "The Ordo Draconis rides from the shadow of the Blood Keep, where chivalry has been drained, preserved, and given fangs. Walach Harkon commands knights who remember honor but no longer belong to mercy.\n\nTheir discipline is real. Their courage is real. That is what makes them terrible. A vampire knight who keeps formation, honors command, and charges with centuries of hunger behind the lance is not a monster in spite of chivalry, but because chivalry has been made predatory.\n\nThe living realms nearby will call them abominations, yet many will still envy their order. The Ordo must exploit that contradiction, offering protection, terror, and the promise that obedience can survive death.\n\nThe situation is martial and blood-bound, so we must ride beneath the red keep with purpose. If the order turns vampiric hunger into disciplined conquest, every knightly house in the Old World will see its own reflection darkened.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!\n\nThe first task is secrecy with purpose. Fear must be shaped into obedience, and obedience into enough strength that discovery becomes a weapon rather than a sentence."
 war_unique_intro_events.111.a:0 "Ride beneath the red keep."

 war_unique_intro_events.112.t:0 "The Princes' Confederacy"
 war_unique_intro_events.112.d:0 "The Border Princes Confederacy is an argument pretending to be a realm, which is still more order than the region usually permits. Exiles, mercenary captains, petty nobles, traders, priests, and adventurers all bring their own law and call the pile opportunity.\n\nNo valley forgets its grievances. A castle may be a kingdom, a river crossing may be a war, and a prince may be only the last ambitious survivor with enough coin to print his face on it.\n\nYet division is not weakness if it can be harnessed. The Confederacy can tax roads others merely raid, hire swords before enemies do, and make desperate peoples understand that a common shield is cheaper than a hundred private disasters.\n\nThe situation is unruly and valuable, so we must bind the quarrels without pretending they are gone. If the princes can cooperate long enough to command the roads between Empire, Badlands, Tilea, and the mountains, the frontier may become a power rather than a prize.\n\nThe first task is to make cooperation profitable enough that even selfish princes defend it. In the Borderlands, law survives when every ambitious captain can see the cost of breaking it."
 war_unique_intro_events.112.a:0 "Bind the quarrels."

 war_unique_intro_events.113.t:0 "Bears of the North"
 war_unique_intro_events.113.d:0 "The Baersonling respect strength because strength is the only law the north enforces consistently. Their halls teach that a leader who cannot win, feed, and frighten will soon be replaced by someone with better scars.\n\nThey are not merely brutes in cold weather. The tribe knows the value of reputation, kinship, and carefully chosen violence. A raid that returns heavy can settle arguments no council could finish, and a champion's victory can bind households faster than promises.\n\nNorsca is crowded with proud names. A tribe that wishes to be remembered must do more than survive; it must make survival look like destiny to those who might otherwise follow a louder banner.\n\nThe situation is harsh and competitive, so we must let strength decide while making sure strength serves the tribe. If the Baersonling turn pride into command and command into plunder, their rivals will learn that the bear does not need to roar often.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.113.a:0 "Let strength decide."

 war_unique_intro_events.114.t:0 "Giants' Shadow over Goromadny"
 war_unique_intro_events.114.d:0 "Goromadny lies beneath mountains and legends too large for ordinary rulers. Giants, harsh paths, hungry weather, and old Norscan pride shape a people used to measuring themselves against things that could crush them without noticing.\n\nThat shadow can break a tribe or make it bold. Warriors who live near giant-haunted heights learn caution, awe, and the usefulness of striking before a stronger foe understands the ground. Hunters, scouts, and raiders all carry lessons written in stone and snow.\n\nThe south may barely know the name, but the north respects places that harden men. Goromadny must turn remoteness into identity before rivals treat it as weakness.\n\nThe situation is isolated and formidable, so we must raid beneath the giant's shadow. If Goromadny makes fear into discipline and terrain into advantage, its warriors will descend from the heights like a story enemies wish had remained unbelievable.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nThe gods notice those who survive impossible country and return with proof."
 war_unique_intro_events.114.a:0 "Raid beneath the giant's shadow."

 war_unique_intro_events.115.t:0 "Hammers of the Cult"
 war_unique_intro_events.115.d:0 "The Cult of Sigmar is faith with a hammer in its hand. It preaches unity, discipline, vigilance, and the old promise that mankind can stand against darkness if it remembers what Sigmar demanded of it.\n\nYet temples do not float above politics. Priests advise nobles, witch hunters test consciences, burghers fund shrines, and frightened villagers look to the cult when secular law arrives too late or too compromised.\n\nThe Empire needs Sigmar's cult, but it also fears what happens when any sacred institution decides it alone can define loyalty. Zeal can save provinces from corruption, or it can turn every dispute into a pyre waiting for tinder.\n\nThe situation is holy and dangerous, so we must preach with hammer and law together. If the Cult of Sigmar turns fervor into discipline, mercy into guarded strength, and suspicion into useful vigilance, it can be a pillar of the Empire rather than another faction in its quarrels.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.115.a:0 "Preach with hammer and law."

 war_unique_intro_events.116.t:0 "Altdorf's Many Thrones"
 war_unique_intro_events.116.d:0 "Altdorf is the Empire gathered into one city and then made to argue with itself. Imperial offices, guild halls, temples, colleges, merchants, soldiers, and river traffic all crowd the capital with interests too important to ignore.\n\nThe city holds symbols that can inspire unity, but symbols also attract claimants. Wizards of the Colleges of Magic guard dangerous knowledge, priests guard doctrine, burghers guard trade, and every noble visitor believes the capital should listen more closely to their province.\n\nTo rule Altdorf is to manage proximity. Power is useful because it is near, and perilous for the same reason. A riot, scandal, cult, or factional coup in the capital echoes through the entire Empire.\n\nThe situation is crowded and consequential, so we must keep the capital awake. If Altdorf can make its many institutions serve public survival before private advantage, the Empire's heart may beat loudly enough for every province to hear.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.116.a:0 "Keep the capital awake."

 war_unique_intro_events.117.t:0 "The White Wolf's Fire"
 war_unique_intro_events.117.d:0 "The Cult of Ulric speaks in winter breath, wolf-hide, iron, and contempt for softness. Its holy city and its priests remember a world before Sigmar's empire, and they do not intend to become a footnote in another god's triumph.\n\nUlrican faith is severe because it has always lived close to war. Courage matters more than polish, endurance more than ceremony, and truth more than comfort. That severity can make heroes. It can also make compromise feel like cowardice.\n\nThe Empire needs the White Wolf's fire, especially when northern threats gather and Reikland's politics feel too smooth to be trusted. But pride between cults can wound the realm before any enemy crosses the border.\n\nThe situation is proud and sacred, so we must let winter judge without letting winter rule alone. If the Cult of Ulric turns harsh faith into disciplined guardianship, Middenheim's old god will strengthen the Empire even while challenging it.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.117.a:0 "Let winter judge."

 war_unique_intro_events.118.t:0 "The Eye of the Forest"
 war_unique_intro_events.118.d:0 "Talabheim sits within the vast crater called the Eye of the Forest, a city that looks protected by nature and therefore must work twice as hard not to become complacent. Walls, gates, roads, and woods all shape its fate.\n\nThe city is sacred to Taal in spirit and practical in daily life. Hunters, traders, priests, burghers, and soldiers all depend on the same truth: the forest can shelter a realm or hide its enemies, depending on who knows the paths.\n\nTalabecland's wider pride pulls at Talabheim, while Imperial politics remind every city that autonomy survives only if it proves useful. A crater city that cannot command its roads becomes a beautiful trap.\n\nThe situation is enclosed and watchful, so we must guard the crater city without mistaking walls for strategy. If Talabheim binds forest craft, civic administration, and military discipline together, the Eye will see danger before danger reaches the gate.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.118.a:0 "Guard the crater city."

 war_unique_intro_events.119.t:0 "Red Walls of Carroburg"
 war_unique_intro_events.119.d:0 "Carroburg's name carries the memory of a famous stand, red walls, stubborn soldiers, and the grim pride of men who learned that discipline can outlive terror. Memory is useful here because it drills as much as it inspires.\n\nThe city cannot survive on old glory alone. Walls must be repaired, militias trained, merchants taxed, and officers reminded that reputation becomes a burden when every enemy wants to be the one that breaks it.\n\nDrakwald's shadows, Middenland's pride, Reikland's pull, and northern danger all press around Carroburg. A city between powers must either become necessary or become negotiable.\n\nThe situation is martial and symbolic, so we must drill behind the walls until symbolism has muscle. If Carroburg turns its legend into professional readiness, its red walls will be more than a story soldiers tell before battle. They will be a promise enemies have to pay to test.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.119.a:0 "Drill behind the walls."

 war_unique_intro_events.120.t:0 "Drakwald's Lost Crown"
 war_unique_intro_events.120.d:0 "Drakwald is a name full of loss. Forests, beast-haunted roads, ruined claims, and old provincial pride linger where authority has too often failed to hold the dark back long enough for maps to matter.\n\nTo raise Drakwald again is to challenge more than neighbors. It is to challenge the memory of collapse, the Beastmen who thrive in broken woods, and the comfortable belief that some regions are better left as warnings.\n\nThe people need more than nostalgia. They need patrols that return, roads that stay open, lords who can cooperate, and villages that trust banners because the banners arrive before the fires do.\n\nThe situation is wounded and wild, so we must take back the woods one road, shrine, and watchpost at a time. If Drakwald can make reclamation practical, its lost crown may become a frontier project rather than a tragic inheritance.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.120.a:0 "Take back the woods."

 war_unique_intro_events.121.t:0 "Salt and Timber"
 war_unique_intro_events.121.d:0 "Nordenmark is a northern place of salt wind, timber, coastal trade, and local privilege. Its towns and forests know that the Sea of Claws brings livelihoods and enemies with the same weather.\n\nNordenmarkers must think like both Imperial citizens and coastal wardens. Ships need timber, soldiers need pay, merchants need routes, and watchmen need the authority to act before sails on the horizon become torches in the harbor.\n\nNordland's old quarrels and northern dangers give the region little room for vanity. Norscan raiders, smugglers, rival cities, and forest threats all punish a ruler who treats coast and hinterland as separate worlds.\n\nThe situation is maritime and provincial, so we must watch the Sea of Claws while keeping the timber roads guarded. If Nordenmark binds harbor, forest, militia, and market together, it can become a hard northern plank in the Empire's shield.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.121.a:0 "Watch the Sea of Claws."

 war_unique_intro_events.122.t:0 "The Blazing Sun Rides"
 war_unique_intro_events.122.d:0 "The Order of the Blazing Sun serves Myrmidia beneath Imperial skies, carrying southern discipline, tactical faith, and knightly pride into a realm more used to Sigmar's hammer and Ulric's wolf.\n\nThat difference can make the order valuable or suspect, depending on who is watching. Its knights study strategy, formation, and the clean application of force, but every victory must also prove that Myrmidian wisdom strengthens the Empire rather than replacing its loyalties.\n\nThe order stands at a useful crossing of worlds. Estalian and Tilean traditions give it perspective, while Imperial service gives it purpose in wars that rarely reward narrow thinking.\n\nThe situation is devout and martial, so we must serve Myrmidia with steel that the Empire can trust. If the Blazing Sun turns tactical discipline into public defense, its foreign-rooted faith may become one of the realm's sharper instruments against darkness.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.122.a:0 "Serve Myrmidia with steel."

 war_unique_intro_events.123.t:0 "The North Made One"
 war_unique_intro_events.123.d:0 "Norsca is a hard name for a harder dream: many tribes, many gods, many grudges, and one frozen land that has never needed permission to terrify the south. To make it one realm is to command storms without pretending they are tame.\n\nEvery tribe brings pride. The Vargs hunger for slaughter, the Skaelings trust the sea, the Bjornlings bring weight, the Sarls bring numbers, and lesser names remember every slight. Unity in Norsca is not a treaty. It is a challenge that must keep winning.\n\nThe south will call a united Norsca a disaster, and for once the south will be correct. Longships, warbands, mountain paths, and god-marked champions under one crown could make every coast and border feel suddenly closer to ruin.\n\nThe situation is savage and historic, so we must crown the raiders without dulling them. If Norsca becomes one blade, the Old World will learn how cold steel can be.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.123.a:0 "Crown the raiders."

 war_unique_intro_events.124.t:0 "Myrmidia's Chosen City"
 war_unique_intro_events.124.d:0 "The Myrmidens place Myrmidia's wisdom at the center of public life, treating strategy as devotion and discipline as a kind of prayer. In the south, where coin and pride often command more quickly than doctrine, that gives them a dangerous clarity.\n\nFaith in the goddess of strategy does not remove politics. It sharpens it. Priests, captains, merchants, and city councils all argue over what prudence demands, and every faction prefers to believe its own interest is also the cleverest plan.\n\nTilea and Estalia both know Myrmidia's name, but the Myrmidens must make reverence practical. A temple that cannot protect roads, regulate trade, or guide soldiers is only an expensive monument.\n\nThe situation is devout and calculating, so we must let strategy guide zeal. If the Myrmidens turn faith into reform, trade discipline, and professional command, they can prove that piety need not be blind to profit or war.\n\nThe first task is not to end Tilean cunning, but to make it serve a durable state. Coin, contracts, councils, and captains must be made to pull together before the next neighbor hires them against one another."
 war_unique_intro_events.124.a:0 "Let strategy guide zeal."

 war_unique_intro_events.125.t:0 "The Black Prince"
 war_unique_intro_events.125.d:0 "Gashnagia survives beneath the strange romance of the Black Prince. Gashnag's subjects whisper that their lord is cursed, tragic, protective, monstrous, noble, or all of these at once. The uncertainty is part of his crown.\n\nA Strigoi vampire ruling openly would invite torches, crusades, and rival undead appetites. A hidden savior, a dark protector, a prince who asks loyalty in exchange for safety: that story can hold a small realm together long enough for truth to become less useful than gratitude.\n\nThe Border Princes are full of predators, but few understand theater as well as Gashnag. Wolves, ghouls, agents, grateful peasants, and terrified neighbors all form the outer rings of a court built around one carefully managed secret.\n\nThe situation is cursed and political, so we must keep the curse courtly. If Gashnagia makes fear look like protection and protection look like legitimacy, the Black Prince may succeed where older Strigoi dreams collapsed.\n\n§RUse the -Convert Them- influence action or the -Implant Cults- spy action to turn other countries to vampirism.§!\n\nThe first task is secrecy with purpose. Fear must be shaped into obedience, and obedience into enough strength that discovery becomes a weapon rather than a sentence."
 war_unique_intro_events.125.a:0 "Keep the curse courtly."

 war_unique_intro_events.126.t:0 "Lonely Fires of Mortensholm"
 war_unique_intro_events.126.d:0 "Mortensholm is a frontier of remote homesteads, stockades, watchposts, furs, timber, iron, and stubborn people who have learned that help from greater powers often arrives after the burial work is done.\n\nIsolation is both shield and burden. Poor roads slow enemies, but they also slow friends. Harsh weather teaches endurance, but endurance becomes fatalism if rulers mistake suffering for policy.\n\nThe settlement's strength lies in households that can fight, guides who know every trail, and a culture that expects defense to begin at the nearest door rather than the distant capital. Such habits are rough, but they keep fires lit.\n\nThe situation is lonely and resilient, so we must keep the watchfires lit. If Mortensholm binds household levies, practical trade, and local knowledge into a state, it can remain small without being helpless, remote without being forgotten.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.126.a:0 "Keep the watchfires lit."

 war_unique_intro_events.127.t:0 "Crossroads of Lakoras"
 war_unique_intro_events.127.d:0 "Lakoras sits where caravans from Tilea, the Empire, Araby, and the Border Princes meet long enough to bargain, hire guards, exchange rumors, and wonder who will betray whom before the next pass.\n\nIts Bretonnian-rooted vows must live beside contracts and hired swords. The Lady may bless courage, but caravans still require escorts, toll schedules, warehouses, and rulers willing to understand that commerce can be defended without being worshiped.\n\nThe danger is moral and practical at once. Too much chivalric disdain for trade leaves the roads to thieves; too much love of coin turns every vow into a line item.\n\nThe situation is profitable and exposed, so we must guard every caravan with honor that understands the road. If Lakoras can make commerce serve duty, it may become a rare frontier realm where the Lady's protection is felt by merchants as well as knights.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.127.a:0 "Guard every caravan."

 war_unique_intro_events.128.t:0 "Faith on the Frontier"
 war_unique_intro_events.128.d:0 "Fatindarid carries the One Faith into a harsh frontier of caravan roads, desert memory, and competing laws. Its rulers understand that belief can make order where bloodline and custom would only multiply quarrels.\n\nThe southern roads bring wealth, but wealth moves best under protection. Guards, guides, judges, and priests all serve the same task: making passage safe enough that merchants return and dangerous enough that enemies hesitate.\n\nThe Prophet's teaching gives Fatindarid a horizon larger than local survival. The Solar Mandate is not merely doctrine from distant Araby; it is a claim that the frontier can be disciplined by revelation and made bright enough to expose every demon in familiar clothing.\n\nThe situation is devout and mobile, so we must carry the light through dust. If Fatindarid binds caravan wealth to religious authority, it can become more than another southern border state. It can become the road by which the One Faith enters new lands.\n\nThe first task is to make devotion visible in daily survival. Wells, contracts, patrols, and judgments must all teach travelers that faith protects the road as well as the soul."
 war_unique_intro_events.128.a:0 "Carry the light through dust."

 war_unique_intro_events.129.t:0 "Paid in Blood and Gold"
 war_unique_intro_events.129.d:0 "The Grudgebringers are mercenaries, but not the disposable kind. Morgan Bernhardt's company carries a reputation built from hard contracts, darker wars, and the knowledge that some employers need reliable soldiers more than they need flattering courtiers.\n\nTheir history has crossed undead horrors, Skaven plots, Imperial summons, and desperate towns chanting for salvation they could only afford by the week. That sort of service leaves veterans with discipline, suspicion, and a precise sense of what betrayal costs.\n\nA mercenary company must be more than brave. It must be trusted enough to hire, feared enough to respect, and organized enough to survive after the easy coin has already fled the field.\n\nThe situation is professional and dangerous, so we must honor the contract while making sure the contract honors us. If the Grudgebringers bind reputation to reform and steady pay, their name will open gates that lesser companies would have to storm.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.129.a:0 "Honor the contract."

 war_unique_intro_events.130.t:0 "Schaffenfest Shadows"
 war_unique_intro_events.130.d:0 "Bogenhafen is prosperous enough to attract merchants from across the Empire and careless enough, if left unwatched, to attract things that prefer prosperity with locked doors. The Schaffenfest proves both truths.\n\nMerchant houses, guild factors, festival crowds, and river trade make the city rich. They also create places for influence to hide. A cult does not need a wilderness if it can find a counting house, a respected patron, and servants who know when not to ask questions.\n\nThe Empire's weakness often wears fine clothing before it shows claws. Bogenhafen must protect commerce without pretending every profitable man is clean or every accusation is wisdom.\n\nThe situation is wealthy and watchful, so we must let trade see daylight. If Bogenhafen keeps guilds accountable, roads open, and corruption exposed before it matures, its markets can strengthen Reikland rather than become another story whispered by witch hunters.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.130.a:0 "Let trade see daylight."

 war_unique_intro_events.131.t:0 "Black Rock Crossing"
 war_unique_intro_events.131.d:0 "Ubersreik controls the Black Rock crossing over the Teufel, and a river crossing is never merely a convenience. It is toll, garrison, market, invasion route, and political grievance gathered under one set of walls.\n\nThe von Jungfreud legacy still lingers, while Imperial authority has placed soldiers in the city to secure order that not everyone requested. Such a place can become a model of discipline or a pot left too long above the flame.\n\nMerchants need the crossing safe. Soldiers need local cooperation. Citizens need to believe stability is more than another word for occupation. Enemies need only wait for pride and resentment to do their work for them.\n\nThe situation is strategic and unsettled, so we must hold the Teufel crossing with firmness and tact. If Ubersreik binds garrison, tolls, and civic loyalty together, it can guard Reikland's road instead of becoming its open wound.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.131.a:0 "Hold the Teufel crossing."

 war_unique_intro_events.132.t:0 "Rights of Kemperbad"
 war_unique_intro_events.132.d:0 "Kemperbad's city rights are more than ceremonial privileges. They are shields for guilds, workshops, river merchants, and burghers who know that autonomy survives only when it is defended in law, coin, and stone.\n\nThe city thrives on waterways and industry. Goods move through its docks, craftsmen fill its streets with value, and civic officials keep order because disorder is expensive before it is anything else.\n\nYet Imperial cities live among larger appetites. Princes want revenue, nobles want influence, rival towns want trade diverted, and every crisis invites someone to explain why local rights should be suspended for the common good.\n\nThe situation is prosperous and legalistic, so we must defend the city rights without confusing privilege for isolation. If Kemperbad keeps its walls strong, guilds productive, and administration clean, its autonomy will look less like defiance and more like proof that a well-run city strengthens the Empire.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.132.a:0 "Defend the city rights."

 war_unique_intro_events.133.t:0 "The Realm of the Lady"
 war_unique_intro_events.133.d:0 "Bretonnia is a realm of dukes, vows, Grail legends, hungry peasants, proud horses, and shining ideals that must survive contact with a darkening world. Its songs are beautiful because the duties beneath them are so severe.\n\nThe Lady's blessing gives the kingdom purpose, but purpose is not unity by itself. Couronne, Bastonne, Bordeleaux, Carcassonne, Quenelles, and every other proud land remember their own honor first unless the realm gives them a greater one to serve.\n\nBeastmen in the forests, vampires in cursed courts, raiders on the coast, and dishonor in noble halls all test whether chivalry is law or pageantry. The weak cannot be protected by tournaments alone.\n\nThe situation is glorious and strained, so we must ride as one realm. If Bretonnia makes its dukes answer sacred duty, its knights defend more than reputation, and its peasants see protection rather than poetry, the Lady's kingdom may yet deserve its own legends.\n\n§OThe Royarch is an elective title§!. When the ruler dies there is a new election. Candidates are chosen from the Royarch and his dominions of the Bretonnian Culture Group, and votes are based on prestige, army size, stability, ruler ability, and relationship with other candidates, with a sizable bonus for being a Grail Knight."
 war_unique_intro_events.133.a:0 "Ride as one realm."

 war_unique_intro_events.134.t:0 "Faith, Steel, and Gunpowder"
 war_unique_intro_events.134.d:0 "The Empire is mankind's great quarrel against the dark: Elector Counts, free cities, cults, colleges, guilds, soldiers, engineers, and stubborn villages bound together by history, fear, ambition, and the memory of Sigmar.\n\nIt is also weakened by everything it contains. Provincial pride slows common action, corruption hides behind respectable doors, cult rivalries wound unity, and every border asks for more soldiers than the last Diet wanted to fund.\n\nYet no other human realm carries the same possibility. Nuln's guns, Altdorf's colleges, Middenheim's winter faith, Talabheim's forest roads, Reikland's imperial claim, and the courage of countless ordinary towns can become one shield if they are made to serve something larger than local advantage.\n\nThe situation is vast and unfinished, so we must make the Empire worthy of the name. If faith, steel, gunpowder, law, and hard reform can be bound together, the Old World may still have a center that does not break when the End Times come.\n\nThe first task is practical unity. Guilds, priests, captains, magistrates, and local notables must be made to trust the same chain of command before factional pride turns another local strength into an Imperial weakness. The Empire has enough enemies without letting its own institutions drift apart."
 war_unique_intro_events.134.a:0 "Make the Empire worthy."

 war_unique_intro_events.135.t:0 "The Northern Oath-Hold"
 war_unique_intro_events.135.d:0 "For Kraka Dorden, the age begins in danger. Kraka Dorden is a northern hold of old stone, hard ale, oath-rings, and clan memories that have grown sharper under frozen skies. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe southern Karaks are distant, the roads are unreliable, and every raider who crosses the snow believes a lonely hold must be easier prey. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThis is still a Dawi story: stone before panic, craft before waste, oath before convenience, and every insult written where descendants can read it. Isolation may change accents and customs, but it does not loosen the duty owed to ancestor, hold, and clan.\n\nThe situation is unstable and full of opportunity, so we must mark the northern grudges before they become epitaphs. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.135.a:0 "Mark the northern grudges."

 war_unique_intro_events.136.t:0 "Sea Gates of the Norse Dawi"
 war_unique_intro_events.136.d:0 "For Kraka Ravnsvake, the age begins in danger. Kraka Ravnsvake watches cold waters where longships, traders, monsters, and worse omens pass too close to Dawi doors. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe sea offers iron, news, and enemies in the same grey tide, and a hold that cannot command its harbor will soon be commanded by raiders. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThis is still a Dawi story: stone before panic, craft before waste, oath before convenience, and every insult written where descendants can read it. Isolation may change accents and customs, but it does not loosen the duty owed to ancestor, hold, and clan.\n\nThe situation is unstable and full of opportunity, so we must bar the sea gates and make every quay answer the clans. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.136.a:0 "Bar the sea gates."

 war_unique_intro_events.137.t:0 "Runes Under the Black Sky"
 war_unique_intro_events.137.d:0 "For Kraka Ornsmotek, the age begins in danger. Kraka Ornsmotek is a hold of shrine-fires, careful miners, and runesmiths who measure each winter by what it failed to break. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nNorscan pressure, poor roads, and the long shadow of Chaos make every tool, tunnel, and oath matter more than southern cousins might understand. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThis is still a Dawi story: stone before panic, craft before waste, oath before convenience, and every insult written where descendants can read it. Isolation may change accents and customs, but it does not loosen the duty owed to ancestor, hold, and clan.\n\nThe situation is unstable and full of opportunity, so we must keep the runes burning where the sky grows black. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.137.a:0 "Keep the runes burning."

 war_unique_intro_events.138.t:0 "Lead Citadel in the Mist"
 war_unique_intro_events.138.d:0 "For Shadow Clan, the age begins in danger. The Shadow Clan broods around the Citadel of Lead, where mist gathers like a kept secret and old Albion rites have learned darker names. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTruthsayers, foreign sailors, Fimir, and Dark Emissary whispers all circle the same stones, each claiming to understand what the island truly remembers. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nAlbion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow.\n\nThe situation is unstable and full of opportunity, so we must bind the shadow to the stones before the stones bind us instead. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.138.a:0 "Bind the shadow to the stones."

 war_unique_intro_events.139.t:0 "Last Shore of the Losteriklings"
 war_unique_intro_events.139.d:0 "For Losteriklings, the age begins in danger. The Losteriklings cling to a storm-beaten shore where Norscan oaths meet Albion fog and neither land nor sea offers a gentle welcome. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nAlbion tribes know the marsh paths, druids know the old stones, and every rival jarl expects the colony to fail before it can become a saga. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThe north respects strength that can travel. Ships, raids, feasts, oaths, and god-marked scars must become more than noise, because the south will only fear a Norscan name if that name can arrive with axes before dawn.\n\nThe situation is unstable and full of opportunity, so we must launch the longships and make the foreign shore answer our oaths. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.139.a:0 "Launch the longships."

 war_unique_intro_events.140.t:0 "The Great Ogham Wakes"
 war_unique_intro_events.140.d:0 "For Truthsayers, the age begins in danger. The Truthsayers stand nearest the Great Ogham, where the island speaks through weathered stone, sacred groves, and warnings that do not always arrive as words. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nForeign sails, Dark Emissaries, Fimir hunger, and quarrelsome clans all pull at Albion while the druids argue over which prophecy is mercy and which is bait. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nAlbion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow.\n\nThe situation is unstable and full of opportunity, so we must let the stones answer first and make every clan listen. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.140.a:0 "Let the stones answer."

 war_unique_intro_events.141.t:0 "Hillfires of the Belenii"
 war_unique_intro_events.141.d:0 "For Belenii, the age begins in danger. The Belenii hold hills where watchfires vanish into mist and every family remembers which path a stranger should never take twice. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nAlbion is no longer hidden enough for disunity to be harmless; merchants, raiders, cults, and hungry neighbors can find a divided clanland easily. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nAlbion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow.\n\nThe situation is unstable and full of opportunity, so we must gather the hillfires into one warning seen across the island. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.141.a:0 "Gather the hillfires."

 war_unique_intro_events.142.t:0 "Marsh Paths of the Boreni"
 war_unique_intro_events.142.d:0 "For Boreni, the age begins in danger. The Boreni know the wet ground, reed-choked crossings, and half-drowned shrines that outsiders mistake for empty country until the fog begins to move. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nFimir haunt the fens, foreign captains want harbors, and rival clans remember old feuds more quickly than old obligations. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nAlbion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow.\n\nThe situation is unstable and full of opportunity, so we must claim the marsh paths and make the island difficult to steal. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.142.a:0 "Claim the marsh paths."

 war_unique_intro_events.143.t:0 "Mist-Hags of the Fens"
 war_unique_intro_events.143.d:0 "For Fir Cichol, the age begins in danger. The Fir Cichol remember when the Fimir were feared in Albion, not merely glimpsed at the edge of marshes and blamed for disappearances. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTruthsayers curse them, clans hunt them, foreign powers misunderstand them, and darker patrons offer tools that never arrive without hooks. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must let the mist take our enemies before the island forgets our name. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.143.a:0 "Let the mist take them."

 war_unique_intro_events.144.t:0 "Spears of the Toulenii"
 war_unique_intro_events.144.d:0 "For Toulenii, the age begins in danger. The Toulenii keep a rough dignity among rain-black fields, cattle paths, and stone circles whose meanings are argued over beside every council fire. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nOutsiders call the island backward because they have not paid the price of surviving it, but their ships and coin still threaten to make mockery into conquest. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nAlbion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow.\n\nThe situation is unstable and full of opportunity, so we must raise the island spears and give the clans a common answer. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.144.a:0 "Raise the island spears."

 war_unique_intro_events.145.t:0 "The Island Remembers"
 war_unique_intro_events.145.d:0 "For Albion, the age begins in danger. Albion is more than a fogbound island at the edge of foreign maps. It is Ogham stone, druid law, fen terror, storm coast, and memory older than most crowns. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nEvery outside power sees something useful here: harbors, mysteries, relics, converts, or a stepping stone toward darker ambitions. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nAlbion remembers through mist, Ogham stones, druids, fens, and clan grudges older than foreign maps. To rule here is not to clear the fog away, but to decide what the fog will hide, what it will reveal, and who it will swallow.\n\nThe situation is unstable and full of opportunity, so we must wake the island realm before the world finishes naming it prey. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.145.a:0 "Wake the island realm."

 war_unique_intro_events.146.t:0 "Sea-Gate of the Karaz Ankor"
 war_unique_intro_events.146.d:0 "For Barak Varr, the age begins in danger. Barak Varr is the rare Dawi hold that hears waves as often as hammers, a sea-gate where clan ledgers and cannon ports face the same horizon. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nMerchants bring profit and insult in equal measure, while Greenskins, pirates, Tileans, and ambitious princes all learn that sea access is worth bleeding for. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThis is still a Dawi story: stone before panic, craft before waste, oath before convenience, and every insult written where descendants can read it. Isolation may change accents and customs, but it does not loosen the duty owed to ancestor, hold, and clan.\n\nThe situation is unstable and full of opportunity, so we must hold the sea-gate without letting saltwater soften stone. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.146.a:0 "Hold the sea-gate."

 war_unique_intro_events.147.t:0 "Scythan Dragon Rites"
 war_unique_intro_events.147.d:0 "For Drakk, the age begins in danger. Drakk follows dragon rites far from the blessed isles, where Scythan horsemen, fire-priests, and hard caravan families have made reverence portable. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe Badlands do not care whether a shrine is holy, only whether its guards are awake and its tribute is worth stealing. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThe desert and frontier roads teach practical faith. Wells, caravans, judges, soldiers, and shrine-fires must work together, because revelation that cannot guard a road will soon be mocked by bandits and bought by richer men.\n\nThe situation is unstable and full of opportunity, so we must feed the dragon fires and make every road fear our banners. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.147.a:0 "Feed the dragon fires."

 war_unique_intro_events.148.t:0 "Light at the Crossroads"
 war_unique_intro_events.148.d:0 "For G.R.C., the age begins in danger. The G.R.C. stands where desert conviction meets road dust, a realm of ledgers, guards, jurists, and preachers trying to make revelation survive daily bargaining. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nCaravan wealth invites corruption, border politics invites compromise, and every old spirit waits for believers to decide that convenience is doctrine. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThe desert and frontier roads teach practical faith. Wells, caravans, judges, soldiers, and shrine-fires must work together, because revelation that cannot guard a road will soon be mocked by bandits and bought by richer men.\n\nThe situation is unstable and full of opportunity, so we must carry the light through trade without letting trade purchase the light. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.148.a:0 "Carry the light through trade."

 war_unique_intro_events.149.t:0 "The Greybeards' Ledger"
 war_unique_intro_events.149.d:0 "For Greybeards, the age begins in danger. The Greybeards are not named for weakness. Age among the Dawi is a weapon, a ledger, and a warning that nothing important is truly forgotten. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTheir halls face old injuries and new dangers at once, while younger powers mistake caution for fear because they cannot read a grudge properly. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThis is still a Dawi story: stone before panic, craft before waste, oath before convenience, and every insult written where descendants can read it. Isolation may change accents and customs, but it does not loosen the duty owed to ancestor, hold, and clan.\n\nThe situation is unstable and full of opportunity, so we must enter every debt and make memory useful again. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.149.a:0 "Enter every debt."

 war_unique_intro_events.150.t:0 "The Pit-Forges of Gorgoth"
 war_unique_intro_events.150.d:0 "For Gorgoth, the age begins in danger. Gorgoth is a mouth in the Dark Lands, swallowing captives, ore, coal, and pain until the pit-forges cough out weapons worthy of Hashut. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nEvery neighboring tribe, caravan, and lesser tyrant is either material or obstacle, and the difference usually lasts only until the chains are counted. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nFor the Dawi-Zharr, mercy is a poor substitute for engineering. Slaves, furnaces, ledgers, sorcery, and fear must be arranged with the same care as any machine, because Hashut rewards cruelty best when cruelty is made productive.\n\nThe situation is unstable and full of opportunity, so we must drive the pit-forges harder until the wastes learn obedience. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.150.a:0 "Drive the pit-forges harder."

 war_unique_intro_events.151.t:0 "Everything at Pigbarter"
 war_unique_intro_events.151.d:0 "For Pigbarter, the age begins in danger. Pigbarter squats in smoke and mud where the River Ruin carries pigs, spice, iron, gossip, and bad decisions to the same stinking docks. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nChaos Dwarfs watch the port, Ogres sell muscle, caravans bring profit, and every alley teaches that law is strongest when it knows the current price. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThe Dark Lands do not reward purity. They reward useful hands, sharp guards, flexible morals, and the good sense to make danger pay rent. Every bargain is a small fortification if it is written, witnessed, and backed by muscle.\n\nThe situation is unstable and full of opportunity, so we must settle every price before someone else prices us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.151.a:0 "Settle every price."

 war_unique_intro_events.152.t:0 "Ash Roads of Azgorh"
 war_unique_intro_events.152.d:0 "For Legion of Azgorh, the age begins in danger. The Legion of Azgorh marches from ash-choked roads with engines, masks, and grudges that have been hammered flat into discipline. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nDistance from Zharr-Naggrund does not make them free of Hashut; it makes every victory a proof that even exile can be industrialized. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nFor the Dawi-Zharr, mercy is a poor substitute for engineering. Slaves, furnaces, ledgers, sorcery, and fear must be arranged with the same care as any machine, because Hashut rewards cruelty best when cruelty is made productive.\n\nThe situation is unstable and full of opportunity, so we must march through ash and make the weak hear the guns first. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.152.a:0 "March through ash."

 war_unique_intro_events.153.t:0 "The Southern Chain"
 war_unique_intro_events.153.d:0 "For Darkhold, the age begins in danger. Darkhold grips the edge of the Dark Lands like a hook in meat, watching roads where slaves, raiders, and envoys all arrive under suspicion. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe hold cannot rely on grandeur alone; the frontier must be patrolled, taxed, terrified, and made useful before stronger hands claim it. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nFor the Dawi-Zharr, mercy is a poor substitute for engineering. Slaves, furnaces, ledgers, sorcery, and fear must be arranged with the same care as any machine, because Hashut rewards cruelty best when cruelty is made productive.\n\nThe situation is unstable and full of opportunity, so we must tighten the southern chain until every road pulls toward Hashut. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.153.a:0 "Tighten the southern chain."

 war_unique_intro_events.154.t:0 "The First Bite"
 war_unique_intro_events.154.d:0 "For Eyebiter, the age begins in danger. Eyebiter knows that an Ogre name is a promise. The first bite is warning, claim, joke, and policy depending on who is still standing afterward. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe passes are full of caravans, rivals, and little kingdoms that think walls make them less edible than meat left under a cloth. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nOgre rule begins with appetite, but it lasts through tribute, fear, and reliable violence. The Great Maw is always hungry, and so are the chiefs who understand that coin, meat, and respect taste better when taken on schedule.\n\nThe situation is unstable and full of opportunity, so we must take the first bite and teach the roads who eats first. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.154.a:0 "Take the first bite."

 war_unique_intro_events.155.t:0 "Red Maw's Tribute"
 war_unique_intro_events.155.d:0 "For Red Maw, the age begins in danger. Red Maw is hunger with banners, a kingdom where chiefs, butchers, bruisers, and frightened toll-payers all understand that tribute is just food with better bookkeeping. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nRival Ogres smell weakness quickly, caravans hire guards, and every neighboring ruler hopes the Maw can be fed cheaply enough to look elsewhere. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nOgre rule begins with appetite, but it lasts through tribute, fear, and reliable violence. The Great Maw is always hungry, and so are the chiefs who understand that coin, meat, and respect taste better when taken on schedule.\n\nThe situation is unstable and full of opportunity, so we must fill the red maw and make tribute taste like authority. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.155.a:0 "Fill the red maw."

 war_unique_intro_events.156.t:0 "Horns at the Furnace Gate"
 war_unique_intro_events.156.d:0 "For Horns of Hashut, the age begins in danger. The Horns of Hashut are a warning blast from the furnace gate, half army and half sermon, carrying the Father of Darkness into lands not yet properly afraid. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThey stand among peoples who know Chaos but not discipline, cruelty but not industry, and sacrifice but not the profitable arrangement of chains. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nFor the Dawi-Zharr, mercy is a poor substitute for engineering. Slaves, furnaces, ledgers, sorcery, and fear must be arranged with the same care as any machine, because Hashut rewards cruelty best when cruelty is made productive.\n\nThe situation is unstable and full of opportunity, so we must sound Hashut's horns until fear becomes administration. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.156.a:0 "Sound Hashut's horns."

 war_unique_intro_events.157.t:0 "The Ghoul King's Shadow"
 war_unique_intro_events.157.d:0 "For Vorag, the age begins in danger. Vorag remembers dominion as hunger remembers meat. The Strigoi dream did not die with Mourkain; it crawled into caves, ruins, and the bodies of things too loyal to stay buried. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nGreenskins crowd the wastes, humans tell themselves the old vampire kings are gone, and rival undead would rather inherit ashes than kneel to a ghoul king. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThe legacy of Mourkain is ruin, but ruin is not silence. Crypts, ghouls, necromancers, and old royal hunger can still be gathered into a court if the living are taught to fear the night in organized ways.\n\nThe situation is unstable and full of opportunity, so we must raise the shadow court and make Mourkain feared again. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.157.a:0 "Raise the shadow court."

 war_unique_intro_events.158.t:0 "Thunder in the Passes"
 war_unique_intro_events.158.d:0 "For Thunderguts, the age begins in danger. The Thunderguts announce themselves before the battle starts: drums, belches, iron pots, cracking bones, and the heavy certainty that subtlety is for food that can hide. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nMountain roads reward anyone strong enough to demand payment twice, but every rival tribe and caravan captain knows a toll only matters if it is enforced. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nOgre rule begins with appetite, but it lasts through tribute, fear, and reliable violence. The Great Maw is always hungry, and so are the chiefs who understand that coin, meat, and respect taste better when taken on schedule.\n\nThe situation is unstable and full of opportunity, so we must shake the passes until the small folk pay before asking why. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.158.a:0 "Shake the passes."

 war_unique_intro_events.159.t:0 "The Northern Furnace"
 war_unique_intro_events.159.d:0 "For Uzkulak, the age begins in danger. Uzkulak watches the northern approaches with furnace smoke in its beard and iron contempt in its laws. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nKurgan, Hobgoblins, Ogres, and worse powers move near the roads, each useful if harnessed and dangerous if allowed to imagine equality. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nFor the Dawi-Zharr, mercy is a poor substitute for engineering. Slaves, furnaces, ledgers, sorcery, and fear must be arranged with the same care as any machine, because Hashut rewards cruelty best when cruelty is made productive.\n\nThe situation is unstable and full of opportunity, so we must stoke the northern furnace and make every border a workshop of fear. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.159.a:0 "Stoke the northern furnace."

 war_unique_intro_events.160.t:0 "The Dolgan Road to Ruin"
 war_unique_intro_events.160.d:0 "For Dolgans, the age begins in danger. The Dolgans ride long roads between steppe, forest, and frozen rumor, carrying gods in their scars and policy in the speed of their horses. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nSettled kingdoms call them distant until the smoke rises nearby, while rival tribes test whether Dolgan oaths can hold under hunger, omen, and ambition. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must ride the ruin road before another tribe claims the gods attention. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.160.a:0 "Ride the ruin road."

 war_unique_intro_events.161.t:0 "Wheatland Winter"
 war_unique_intro_events.161.d:0 "For Chernozavtra, the age begins in danger. Chernozavtra stands among fields that should feed armies, villages that should trust the bear, and roads that prove the Wheatlands are no safe granary anymore. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nKislev's heart is strained, raiders circle the horizon, and every local notable knows grain can become leverage faster than loyalty becomes law. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nKislevite survival is made from cold faith, stubborn households, hard riders, wary towns, and the refusal to treat despair as wisdom. Ursun does not promise comfort. He promises that those who endure may still bite.\n\nThe situation is unstable and full of opportunity, so we must guard the wheatland winter and make bread a shield. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.161.a:0 "Guard the wheatland winter."

 war_unique_intro_events.162.t:0 "The Blood-Red Balance"
 war_unique_intro_events.162.d:0 "For Yin, the age begins in danger. Yin speaks in the language of balance while sharpening knives for a god who prefers the scales weighted with skulls. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nCathayan order, steppe ambition, and the temptations of the Blood God pull at the same court, promising strength if mercy is named disorder. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must break the balance and call the wreckage harmony. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.162.a:0 "Break the balance."

 war_unique_intro_events.163.t:0 "The Mung Host"
 war_unique_intro_events.163.d:0 "For Mung, the age begins in danger. The Mung are an old terror of the wastes, a people whose campfires, horse-lines, and god-marked champions have frightened borderlands for generations. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nOld prestige is useful only while it is renewed in blood; rival tribes, Cathayan walls, and daemonic omens all wait for the host to slow. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must gather the host and remind the world why it remembers us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.163.a:0 "Gather the host."

 war_unique_intro_events.164.t:0 "Aghol Fires"
 war_unique_intro_events.164.d:0 "For Aghols, the age begins in danger. The Aghols follow fire across cold country, keeping camps, herds, and shrine-stakes in a restless pattern that outsiders mistake for disorder. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe wastes punish stillness, but a people that never binds its victories into rule becomes a story told by enemies after the ashes cool. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must feed the Aghol fires until the south sees one blaze. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.164.a:0 "Feed the Aghol fires."

 war_unique_intro_events.165.t:0 "The Knife That Smiles"
 war_unique_intro_events.165.d:0 "For Subtle Torture, the age begins in danger. Subtle Torture does not mistake loud pain for artistry. Its devotees prefer promises, silk, hooks, and the moment an enemy realizes consent was never part of the bargain. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA warband survives by feeding the gods, but Slaanesh demands more than slaughter; sensation must become doctrine and victory must leave witnesses trembling with memory. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must smile with the knife and make conquest feel inevitable. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.165.a:0 "Smile with the knife."

 war_unique_intro_events.166.t:0 "The Wheel Breaks Forward"
 war_unique_intro_events.166.d:0 "For Broken Wheel, the age begins in danger. Broken Wheel follows omens that turn in circles until the spokes snap and the whole design lurches somewhere no sane commander expected. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTzeentch rewards change, but a warband that changes without direction becomes another abandoned joke in the wastes. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must break the wheel forward and call the wreckage prophecy. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.166.a:0 "Break the wheel forward."

 war_unique_intro_events.167.t:0 "A Thousand Beautiful Sins"
 war_unique_intro_events.167.d:0 "For Hedonites, the age begins in danger. The Hedonites dress damnation in color, perfume, song, and blades so fine that victims may admire them for one foolish heartbeat. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nSlaanesh offers endless appetite, but a warband that only feasts becomes food for rivals who can still march after dawn. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must make excess march and turn every victory into desire. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.167.a:0 "Make excess march."

 war_unique_intro_events.168.t:0 "Kvellings at the Edge"
 war_unique_intro_events.168.d:0 "For Kvellings, the age begins in danger. The Kvellings live at the edge of better-known terrors, close enough to hear the gods and far enough to know they must make their own strength visible. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA settled horde must do the impossible: keep land without becoming soft, gather tribute without becoming clerks, and honor Chaos without waiting for permission. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must hold the edge until the edge becomes a blade. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.168.a:0 "Hold the edge."

 war_unique_intro_events.169.t:0 "The Swarm's Fever"
 war_unique_intro_events.169.d:0 "For Bubonic Swarm, the age begins in danger. The Bubonic Swarm moves like sickness given banners, patient in decay and cheerful in the way only Nurgle's beloved can be cheerful among corpses. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nEnemies can burn camps, flee roads, or pray to clean gods, but disease has a patience that swords envy. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must spread the blessed fever until resistance coughs itself silent. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.169.a:0 "Spread the blessed fever."

 war_unique_intro_events.170.t:0 "Gharhan Horse-Oaths"
 war_unique_intro_events.170.d:0 "For Gharhans, the age begins in danger. The Gharhans ride beneath oaths sworn over horse blood, blackened iron, and gods who listen closely when ambition is spoken aloud. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTheir camps can become a kingdom or a quarrel depending on whether chiefs accept one law before the next omen splits them. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must ride under black oaths and make every camp answer. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.170.a:0 "Ride under black oaths."

 war_unique_intro_events.171.t:0 "Tahmak Omens"
 war_unique_intro_events.171.d:0 "For Tahmaks, the age begins in danger. The Tahmaks trust signs in smoke, entrails, hoofprints, and dreams, but signs become useful only when warriors are willing to enforce their interpretation. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe wastes produce prophets cheaply and corpses even cheaper; a tribe that follows every vision will be eaten by the first rival with a plan. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must read the omen in blood and make doubt kneel. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.171.a:0 "Read the omen in blood."

 war_unique_intro_events.172.t:0 "The Oldest Horde"
 war_unique_intro_events.172.d:0 "For Kul, the age begins in danger. The Kul carry a name heavy with old invasions, broken borders, and the memory of chieftains who measured greatness by how far the south burned. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nOld terror fades if it is only recited. The current chiefs must prove the name still has weight before younger tribes carve their own sagas over it. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must make old terror new before the gods choose younger hands. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.172.a:0 "Make old terror new."

 war_unique_intro_events.173.t:0 "Dervingard's Frozen Wall"
 war_unique_intro_events.173.d:0 "For Dervingard, the age begins in danger. Dervingard is a hard garrison in colder country, where watch rotations, stores, prayers to Ursun, and suspicious officers matter more than courtly speeches. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe north tests every wall eventually, and a wall manned by hungry soldiers or ignored by distant rulers is already half breached. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nKislevite survival is made from cold faith, stubborn households, hard riders, wary towns, and the refusal to treat despair as wisdom. Ursun does not promise comfort. He promises that those who endure may still bite.\n\nThe situation is unstable and full of opportunity, so we must keep the frozen wall and make discipline warmer than comfort. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.173.a:0 "Keep the frozen wall."

 war_unique_intro_events.174.t:0 "Tong Under Iron Stars"
 war_unique_intro_events.174.d:0 "For Tong, the age begins in danger. The Tong read iron stars above the wastes and hear in them a promise that the south has not suffered enough to understand. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nNomad freedom can become weakness if every clan rides in a different direction, while Chaos favors those who turn motion into conquest. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must follow the iron stars until the horizon belongs to us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.174.a:0 "Follow the iron stars."

 war_unique_intro_events.175.t:0 "Dolgans Beyond the Sunrise"
 war_unique_intro_events.175.d:0 "For Eastern Dolgans, the age begins in danger. The Eastern Dolgans live where familiar stories stretch thin, carrying Dolgan habits into lands that answer with new tongues, new roads, and old gods wearing new masks. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nDistance can free a tribe or dissolve it, and every chief who mistakes novelty for safety will learn how quickly the wastes correct vanity. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must ride beyond the sunrise and make distance serve us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.175.a:0 "Ride beyond the sunrise."

 war_unique_intro_events.176.t:0 "Tokmar Dust and Oaths"
 war_unique_intro_events.176.d:0 "For Tokmars, the age begins in danger. The Tokmars travel in dust that hides numbers, intentions, and the places where last nights captives were buried. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTheir strength is speed, but speed without binding purpose scatters as easily as sand when richer prey appears elsewhere. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must swear over dust and make the horde remember one road. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.176.a:0 "Swear over dust."

 war_unique_intro_events.177.t:0 "Avag Saddle-Law"
 war_unique_intro_events.177.d:0 "For Avags, the age begins in danger. The Avags trust riders more than walls and scars more than seals, but even a mounted people need law when tribute, captives, and glory are divided. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nChiefs who cannot arbitrate spoils become targets, while chiefs who arbitrate too softly become jokes told beside rival fires. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must rule from the saddle and make each camp obey. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.177.a:0 "Rule from the saddle."

 war_unique_intro_events.178.t:0 "Khazag Black Standards"
 war_unique_intro_events.178.d:0 "For Khazags, the age begins in danger. The Khazags raise black standards over camps that want plunder, order, and omens in equal measure. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTo settle is to invite envy from nomads and contempt from cities, unless settlement becomes the place where raids are planned better than before. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must raise the black standards and make permanence frightening. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.178.a:0 "Raise the black standards."

 war_unique_intro_events.179.t:0 "Yusak River Camps"
 war_unique_intro_events.179.d:0 "For Yusaks, the age begins in danger. The Yusaks know rivers as roads, borders, shrines, and traps, carrying tents and trophies along water that looks peaceful only from far away. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nMerchants, clans, and rival hosts all want the same crossings, and the gods reward whoever makes access expensive enough to remember. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must bind the river camps and turn crossings into tribute. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.179.a:0 "Bind the river camps."

 war_unique_intro_events.180.t:0 "Wei-Jin in Exile"
 war_unique_intro_events.180.d:0 "For Wei-Jin, the age begins in danger. Wei-Jin is a dangerous name to carry in exile, especially when Tzeentchian whispers suggest that a stolen title can become truer than the throne it imitates. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nCathayan protocol despises disorder, steppe politics despise weakness, and the Changer despises any plan too simple to betray itself. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must corrupt the old name until destiny answers to it. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.180.a:0 "Corrupt the old name."

 war_unique_intro_events.181.t:0 "The Kuj Market Horde"
 war_unique_intro_events.181.d:0 "For Kuj, the age begins in danger. The Kuj know that trade and raiding are not opposites. Both require routes, timing, armed negotiation, and the ability to smile while counting knives. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nSettled neighbors prefer predictable markets, but the gods and rival hordes prefer proof that profit has not made the Kuj tame. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must trade in ruin and make every bargain carry a threat. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.181.a:0 "Trade in ruin."

 war_unique_intro_events.182.t:0 "The Dread Wo Muster"
 war_unique_intro_events.182.d:0 "For Dread Wo, the age begins in danger. Dread Wo is a name meant to travel ahead of its riders, softening villages, border posts, and nervous allies before hooves arrive. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nFear fades if not renewed, and every neighboring power will test whether the name is a mask or a warning. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must muster the dread host and make the name honest. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.182.a:0 "Muster the dread host."

 war_unique_intro_events.183.t:0 "Riders in the Storm"
 war_unique_intro_events.183.d:0 "For Manchu, the age begins in danger. The Manchu ride between worlds, close enough to Cathayan influence to know discipline and close enough to the northern storm to hear promises in thunder. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA people on the edge can bargain with both sides for a time, but eventually the gods ask whether caution is wisdom or cowardice. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must ride through the storm and choose strength before weakness chooses us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.183.a:0 "Ride through the storm."

 war_unique_intro_events.184.t:0 "The Raven Host Takes Wing"
 war_unique_intro_events.184.d:0 "For Raven Host, the age begins in danger. The Raven Host gathers under feathers, riddles, and plans that molt into sharper plans before enemies finish understanding the first. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTzeentch offers elevation through change, but a warband must still eat, march, and sacrifice real ground to make prophecy useful. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must take wing in shadow and leave certainty dead behind us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.184.a:0 "Take wing in shadow."

 war_unique_intro_events.185.t:0 "Iron Wolves of the Waste"
 war_unique_intro_events.185.d:0 "For Iron Wolves, the age begins in danger. The Iron Wolves understand that a pack is not a mob. It has order, scent, hierarchy, and the discipline to wait until prey believes it has escaped. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nSettled hordes often grow heavy, while roaming rivals mock walls and storehouses until iron teeth close around them. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must run with iron teeth and make every border feel hunted. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.185.a:0 "Run with iron teeth."

 war_unique_intro_events.186.t:0 "The Thousand Sons Spiral"
 war_unique_intro_events.186.d:0 "For Thousand Sons, the age begins in danger. The Thousand Sons count knowledge as weapon, disease, inheritance, and trap, arranging their warband like a spell whose final line has not admitted itself. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nSorcery wins awe quickly and loyalty slowly; every champion believes he understands the design until the design asks for his blood. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must open the spiral path and make ambition useful to fate. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.186.a:0 "Open the spiral path."

 war_unique_intro_events.187.t:0 "The Garden Marches"
 war_unique_intro_events.187.d:0 "For Death Guard, the age begins in danger. The Death Guard advance with the patience of rot, smiling through wounds that would kill cleaner men and blessing every ditch with gifts that continue working after the army leaves. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nEnemies expect battle to end when the field is quiet; Nurgle teaches that silence is often when the real victory begins. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must march with the garden and let despair bloom behind us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.187.a:0 "March with the garden."

 war_unique_intro_events.188.t:0 "The Butcher's Road"
 war_unique_intro_events.188.d:0 "For World Eaters, the age begins in danger. The World Eaters have little patience for speeches that do not end in a charge. Their arguments are axes, their diplomacy is pursuit, and their harvest is skulls. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nKhorne rewards slaughter, but even slaughter needs direction if it is to become more than a campfire story told by survivors. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must walk the butchers road and leave no skull unclaimed. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.188.a:0 "Walk the butchers road."

 war_unique_intro_events.189.t:0 "The Black Legion's Claim"
 war_unique_intro_events.189.d:0 "For Black Legion, the age begins in danger. The Black Legion carries a name that demands obedience from lesser warbands, rivals, oathbreakers, and anyone who mistakes black iron for mourning. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA legion is more than a crowd of killers. It must impose order on pride without dulling the hatred that makes Chaos strong. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must claim the black standard and make every god-marked blade point outward. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.189.a:0 "Claim the black standard."

 war_unique_intro_events.190.t:0 "Hounds at the Gate"
 war_unique_intro_events.190.d:0 "For Gorehounds, the age begins in danger. The Gorehounds know fear by scent. Once a foe runs, the chase becomes worship and every gate becomes merely the place where prey tried to stop being prey. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nFrenzy can scatter if no hand directs it, and Khorne has no patience for hounds that bite one another while enemies still breathe. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must loose the hounds and make flight impossible. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.190.a:0 "Loose the hounds."

 war_unique_intro_events.191.t:0 "Choseon Under the Raven Moon"
 war_unique_intro_events.191.d:0 "For Choseon, the age begins in danger. Choseon keeps eastern forms under a raven moon, where courtiers still bow, scribes still record, and Tzeentch smiles because every rule is another way to hide a knife. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nCathayan neighbors see familiar ceremony and suspect corruption too late, while northern patrons demand proof that subtlety can still burn cities. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must read the raven moon and make protocol betray itself. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.191.a:0 "Read the raven moon."

 war_unique_intro_events.192.t:0 "Koryos Doomed Horizon"
 war_unique_intro_events.192.d:0 "For Koryo, the age begins in danger. Koryo stands at the edge of Cathayan influence with artillery, coastal discipline, court learning, and the uneasy knowledge that order is not the same as safety. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe Dragon Emperor is gone, northern horrors stir, and every port or border post must decide whether it belongs to a collapsing age or a future rebuilt by those who kept formation. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nEastern order is a discipline, not a charm against disaster. Court rites, artillery drill, coastal patrols, and learned offices must all be made practical while the disappearance of the Dragon Emperor shakes the world around them.\n\nThe situation is unstable and full of opportunity, so we must hold the doomed horizon and make discipline outlast panic. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.192.a:0 "Hold the doomed horizon."

 war_unique_intro_events.193.t:0 "The Manflayers Contract"
 war_unique_intro_events.193.d:0 "For Mengils Manflayers, the age begins in danger. Mengils Manflayers are Druchii blades for hire, which means the contract is written in coin, fear, and the certainty that the client is never the most dangerous person in the room. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nMercenary fame fades unless refreshed by atrocities precise enough to be remembered and profitable enough to be repeated. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThe Druchii understand exile, cruelty, and reputation as tools rather than tragedies. A mercenary blade must be trusted to win and feared enough that employers remember payment is safer than betrayal.\n\nThe situation is unstable and full of opportunity, so we must honor the cruel contract and make dread our retainer. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.193.a:0 "Honor the cruel contract."

 war_unique_intro_events.194.t:0 "Asarnil's Exiles"
 war_unique_intro_events.194.d:0 "For Asarnil, the age begins in danger. Asarnil's exiles carry Caledor's pride across hostile seas, with dragon memories, polished armor, and the bitter knowledge that distance can make nobility feel like punishment. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nForeign courts value an elven sword but rarely understand the grief behind it, while Ulthuan's quarrels continue whether or not exiles bleed for its name. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThe Asur abroad live by distance made disciplined: beacon towers, captains, ledgers, harbor rites, and pride restrained enough to survive foreign weather. Ulthuan is not near, so duty must become local before nostalgia becomes weakness.\n\nThe situation is unstable and full of opportunity, so we must keep Caledor's fire abroad without letting exile consume it. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.194.a:0 "Keep Caledor's fire abroad."

 war_unique_intro_events.195.t:0 "The Scarab King Stirs"
 war_unique_intro_events.195.d:0 "For Death Scarabs, the age begins in danger. The Death Scarabs stir beneath gold, dust, and patient stone, where every sealed chamber remembers a ruler who expected eternity to be orderly. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nNagash's treachery made undeath a mockery of promised paradise, but even a curse can be made into command by a will that refuses to rot. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nNehekhara teaches that death is not release from rule. Mortuary rites, buried legions, priestly patience, and royal certainty must be awakened together, because an undead kingdom without command is merely a tomb with banners.\n\nThe situation is unstable and full of opportunity, so we must open the scarab tombs and let the living hear old Nehekhara move. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.195.a:0 "Open the scarab tombs."

 war_unique_intro_events.196.t:0 "The Ungol Road"
 war_unique_intro_events.196.d:0 "For Ungolaria, the age begins in danger. Ungolaria knows the road, the horse, the bow, and the old suspicion between riders and courts that need riders most when the north grows loud. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nKislevite unity has always been difficult, and a frontier people ignored in peace may become impossible to command in war. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nKislevite survival is made from cold faith, stubborn households, hard riders, wary towns, and the refusal to treat despair as wisdom. Ursun does not promise comfort. He promises that those who endure may still bite.\n\nThe situation is unstable and full of opportunity, so we must ride the Ungol road and make freedom answer the bear. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.196.a:0 "Ride the Ungol road."

 war_unique_intro_events.197.t:0 "Praag Remembers"
 war_unique_intro_events.197.d:0 "For Praag, the age begins in danger. Praag remembers more than any city should. Its walls, alleys, churches, and markets carry stories of Chaos so deeply that ordinary stone seems to listen. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA city that has suffered horror can become either a shield or a shrine to its own fear, and Kislev cannot afford the second fate. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nKislevite survival is made from cold faith, stubborn households, hard riders, wary towns, and the refusal to treat despair as wisdom. Ursun does not promise comfort. He promises that those who endure may still bite.\n\nThe situation is unstable and full of opportunity, so we must hold haunted Praag and make memory serve the living. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.197.a:0 "Hold haunted Praag."

 war_unique_intro_events.198.t:0 "Erengards Cold Harbor"
 war_unique_intro_events.198.d:0 "For Erengard, the age begins in danger. Erengard is a cold harbor of sailors, merchants, warehouses, patrols, and rumors from every sea that can survive the ice. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTrade brings coin and strangers together, and every stranger may be useful, corrupting, desperate, or followed by something worse. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nKislevite survival is made from cold faith, stubborn households, hard riders, wary towns, and the refusal to treat despair as wisdom. Ursun does not promise comfort. He promises that those who endure may still bite.\n\nThe situation is unstable and full of opportunity, so we must guard the cold harbor and make commerce answer the watch. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.198.a:0 "Guard the cold harbor."

 war_unique_intro_events.199.t:0 "Ropsmannia's Long Watch"
 war_unique_intro_events.199.d:0 "For Ropsmannia, the age begins in danger. Ropsmannia lives by the long watch: scattered settlements, hard households, winter roads, and people who know that a warning shouted too late is just a funeral custom. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe north never stops testing loose borders, and distant rulers too often mistake local endurance for proof that no help is needed. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nKislevite survival is made from cold faith, stubborn households, hard riders, wary towns, and the refusal to treat despair as wisdom. Ursun does not promise comfort. He promises that those who endure may still bite.\n\nThe situation is unstable and full of opportunity, so we must keep the long watch and make isolation a weapon. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.199.a:0 "Keep the long watch."

 war_unique_intro_events.200.t:0 "Laurelorn's Hidden Court"
 war_unique_intro_events.200.d:0 "For Laurelorn, the age begins in danger. Laurelorn is not Athel Loren, and that difference matters. Its Eonir courts live beside Imperial ambitions, northern shadows, and forest spirits with their own memories. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nMen see timber, roads, and borderland opportunity; the forest sees trespass, imbalance, and promises made before human kingdoms learned to write. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nThe forest is not scenery. It is court, ally, judge, weapon, and memory. Every border must be understood as a living argument between elf, spirit, root, and trespasser, and every argument must end with the forest preserved.\n\nThe situation is unstable and full of opportunity, so we must guard the hidden court and make every path ask permission. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\n§RAs a Wood Elf, you have a tough time administering lands outside of Forest.§!"
 war_unique_intro_events.200.a:0 "Guard the hidden court."

 war_unique_intro_events.201.t:0 "Black Wolves on the Steppe"
 war_unique_intro_events.201.d:0 "For Black Wolves, the age begins in danger. The Black Wolves ride where a camp can vanish before sunrise and leave only hoofprints, ashes, and a rumor that the betrayal was very well timed. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nHobgoblin chiefs survive by gifts, fear, and cunning, but every lesser rider waits to see whether the alpha can still bite. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nHobgoblin power is cunning with a saddle. Khans rule by gifts, fear, wolf herds, careful treachery, and the useful truth that betrayal is shameful only when it fails. The clever blade still needs a hand to point it.\n\nThe situation is unstable and full of opportunity, so we must let the black wolves run and make every oath nervous. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.201.a:0 "Let the black wolves run."

 war_unique_intro_events.202.t:0 "Blood Arrows in Flight"
 war_unique_intro_events.202.d:0 "For Blood Arrows, the age begins in danger. The Blood Arrows prefer killing at range, bargaining from strength, and arriving late enough that both sides already look profitable. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe steppes reward speed but punish chiefs who cannot keep plunder moving from saddlebag to loyalty. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nHobgoblin power is cunning with a saddle. Khans rule by gifts, fear, wolf herds, careful treachery, and the useful truth that betrayal is shameful only when it fails. The clever blade still needs a hand to point it.\n\nThe situation is unstable and full of opportunity, so we must loose the blood arrows and make distance our sharpest knife. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.202.a:0 "Loose the blood arrows."

 war_unique_intro_events.203.t:0 "Under the Great Khans Shadow"
 war_unique_intro_events.203.d:0 "For Great Khans, the age begins in danger. The Great Khans carry a title that every Hobgoblin understands and every rival chief would steal if the guards looked away long enough. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA khans shadow stretches only as far as tribute, wolf herds, and punished treachery can carry it. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nHobgoblin power is cunning with a saddle. Khans rule by gifts, fear, wolf herds, careful treachery, and the useful truth that betrayal is shameful only when it fails. The clever blade still needs a hand to point it.\n\nThe situation is unstable and full of opportunity, so we must cast the khans shadow across every campfire. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.203.a:0 "Cast the khans shadow."

 war_unique_intro_events.204.t:0 "Fangmaw's Bargain"
 war_unique_intro_events.204.d:0 "For Fangmaw, the age begins in danger. Fangmaw knows that the best bargain begins with teeth visible. Politeness is useful, but only after everyone agrees who could be eaten metaphorically or otherwise. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nCathayan wealth, Chaos Dwarf demands, and rival Hobgoblins all create opportunities too dangerous for honest hands. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nHobgoblin power is cunning with a saddle. Khans rule by gifts, fear, wolf herds, careful treachery, and the useful truth that betrayal is shameful only when it fails. The clever blade still needs a hand to point it.\n\nThe situation is unstable and full of opportunity, so we must bite before bargaining and make every deal remember the fang. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.204.a:0 "Bite before bargaining."

 war_unique_intro_events.205.t:0 "Windrider Camps"
 war_unique_intro_events.205.d:0 "For Windrider, the age begins in danger. Windrider camps move with the weather, appearing where trade is thinly guarded and vanishing before revenge finds the right horizon. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nSpeed alone is not rule, and a chief who cannot turn raids into obedience will spend every victory chasing the last one. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nHobgoblin power is cunning with a saddle. Khans rule by gifts, fear, wolf herds, careful treachery, and the useful truth that betrayal is shameful only when it fails. The clever blade still needs a hand to point it.\n\nThe situation is unstable and full of opportunity, so we must ride faster than trust and make movement into government. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them."
 war_unique_intro_events.205.a:0 "Ride faster than trust."

 war_unique_intro_events.206.t:0 "The Twisted Twins Game"
 war_unique_intro_events.206.d:0 "For Vilitch the Curseling, the age begins in danger. Vilitch the Curseling is two fates knotted into one body, a lesson in Tzeentch's humor that leaves enemies unsure which brother is the trap and which is the bait. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA warband built on sorcery and resentment must keep moving before rivals learn where the hidden weakness truly lies. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must play the twisted game and make every enemy misread the board. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.206.a:0 "Play the twisted game."

 war_unique_intro_events.207.t:0 "The Bloody Valkyrie"
 war_unique_intro_events.207.d:0 "For Valkia the Bloody, the age begins in danger. Valkia the Bloody is Khorne's spear cast into the world, winged, furious, and beautiful only in the way a killing stroke can be beautiful. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nHer followers do not need to be convinced of slaughter; they need to be aimed before their devotion wastes itself on lesser prey. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must fly to the slaughter and make every skull worthy. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.207.a:0 "Fly to the slaughter."

 war_unique_intro_events.208.t:0 "The Beast That Was a Champion"
 war_unique_intro_events.208.d:0 "For Scyla Anfingrimm, the age begins in danger. Scyla Anfingrimm is what remains when a champion receives more blessing than shape can bear, a living warning that Khorne values results over conversation. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe beast inspires terror and disorder in equal measure, and only constant war can keep fear pointed at enemies rather than the camp. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must unleash the beast and follow the path it tears open. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.208.a:0 "Unleash the beast."

 war_unique_intro_events.209.t:0 "The Silent Helm"
 war_unique_intro_events.209.d:0 "For Slambo, the age begins in danger. Slambo needs no sermon. The helm, the axes, and the bodies explain enough for anyone still capable of learning. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nIn a north full of loud champions, silence can become myth if it is backed by victories too simple to argue with. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must let the axes speak and make the myth walk. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.209.a:0 "Let the axes speak."

 war_unique_intro_events.210.t:0 "Herald of the Everchosen"
 war_unique_intro_events.210.d:0 "For Vardek Crom, the age begins in danger. Vardek Crom is not merely a raider with a famous blade. He is a herald of the storm to come, a commander who understands that destruction is stronger when organized. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nThe tribes respect strength but test it constantly, and the south must be weakened before the final war can become more than prophecy. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must break them for the north and make obedience useful. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.210.a:0 "Break them for the north."

 war_unique_intro_events.211.t:0 "The Undefeated's Challenge"
 war_unique_intro_events.211.d:0 "For Arbaal the Undefeated, the age begins in danger. Arbaal the Undefeated carries a title that is also a threat, a prayer, and a trap. Every enemy wants to end it; Khorne wants it proven again. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA champion who refuses challenge dies spiritually before he dies physically, but a warband cannot survive if pride chooses every battlefield blindly. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must accept every challenge and make victory our only language. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.211.a:0 "Accept every challenge."

 war_unique_intro_events.212.t:0 "The Lord of Tentacles"
 war_unique_intro_events.212.d:0 "For Gutrot Spume, the age begins in danger. Gutrot Spume carries the stink of drowned holds, plague-slick decks, and tentacles where honest limbs surrendered to Nurgle's generosity. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nCoasts, rivers, and ports think walls face outward, but rot and raiders both understand that water is a road beneath defenses. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must drag them below and let the tide deliver gifts. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.212.a:0 "Drag them below."

 war_unique_intro_events.213.t:0 "The Cabal of Horstmann"
 war_unique_intro_events.213.d:0 "For Egrimm van Horstmann, the age begins in danger. Egrimm van Horstmann knows Imperial learning, magical vanity, and treachery from the inside, which makes his service to Tzeentch especially educational for his enemies. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA cabal must remain hidden long enough to matter and reveal itself only when revelation is another kind of trap. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must write the hidden law and make betrayal look like destiny. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.213.a:0 "Write the hidden law."

 war_unique_intro_events.214.t:0 "The Leechlord's Cure"
 war_unique_intro_events.214.d:0 "For Festus the Leechlord, the age begins in danger. Festus the Leechlord offers cures with a physicians hand and a grandfatherly smile, which is why the screams often begin after the patient thanks him. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nNurgle's mercy is generous, but it must be delivered through bodies, bottles, camps, and battlefields before the clean world learns gratitude. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must administer the cure and let health become obsolete. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.214.a:0 "Administer the cure."

 war_unique_intro_events.215.t:0 "The Black-Iron Reaver"
 war_unique_intro_events.215.d:0 "For Mortkin, the age begins in danger. Mortkin carries black iron, old injury, and the kind of patience that makes revenge look almost disciplined. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nVengeance can focus a warband or consume it, and every follower must believe the reavers private debt will still purchase public glory. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must settle the black debt and make vengeance a kingdom of ash. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.215.a:0 "Settle the black debt."

 war_unique_intro_events.216.t:0 "Three Lords One Rot"
 war_unique_intro_events.216.d:0 "For Maggoth Lords, the age begins in danger. The Maggoth Lords ride bloated miracles into war, three ambitions carried on rot so beloved that even the ground seems to soften in welcome. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nShared command is fragile when every lord is favored, proud, and followed by warriors who can smell weakness under perfume or pus. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must ride the blessed rot and make three hungers pull as one. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.216.a:0 "Ride the blessed rot."

 war_unique_intro_events.217.t:0 "Bloodwrath Unbound"
 war_unique_intro_events.217.d:0 "For Skarr Bloodwrath, the age begins in danger. Skarr Bloodwrath is rage that learned to return. Death is an interruption, not a conclusion, and every comeback makes the next charge easier to believe in. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nFollowers love a champion who cannot stay dead, but immortality without purpose becomes spectacle rather than conquest. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must spill wrath without end and make return itself a weapon. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.217.a:0 "Spill wrath without end."

 war_unique_intro_events.218.t:0 "The Wanderer's Curse"
 war_unique_intro_events.218.d:0 "For Wulfrik the Wanderer, the age begins in danger. Wulfrik the Wanderer can speak the tongue of any foe, which is less a gift than a perfectly sharpened curse when every word leads toward challenge. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA champion who must seek worthy enemies can win fame faster than he can build a realm, unless his wanderings are made into policy. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must answer every insult and make the saga rule behind us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.218.a:0 "Answer every insult."

 war_unique_intro_events.219.t:0 "The Suneater Wakes"
 war_unique_intro_events.219.d:0 "For Kholek Suneater, the age begins in danger. Kholek Suneater is older than many nations and less patient than any of them deserve, a storm-scaled ruin whose footsteps make mountains reconsider stillness. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nAncient terror can awe followers, but awe must become direction before lesser champions spend it on their own ambitions. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must shake the mountains awake and make the sky remember fear. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.219.a:0 "Shake the mountains awake."

 war_unique_intro_events.220.t:0 "The Prince's Smile"
 war_unique_intro_events.220.d:0 "For Azazel, the age begins in danger. Azazel smiles with the confidence of one who knows virtue is often only temptation that has not yet found the right voice. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nSlaanesh's prince can break enemies before battle, but seduction must still serve conquest or become merely another pretty prison. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must smile and damn them before the blades are drawn. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.220.a:0 "Smile and damn them."

 war_unique_intro_events.221.t:0 "The First Chaos Dragon"
 war_unique_intro_events.221.d:0 "For Galrauch, the age begins in danger. Galrauch is a wound in dragonkind, the first of his kind remade by Chaos and still vast enough that prophecy feels small beside his shadow. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nA dragon can destroy by appetite, but a corrupted dragon must decide whether ruin will be instinct, madness, or strategy. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must let the dragon dream ruin and make the world fit the nightmare. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.221.a:0 "Let the dragon dream ruin."

 war_unique_intro_events.222.t:0 "The Faithless Bargain"
 war_unique_intro_events.222.d:0 "For Sayl the Faithless, the age begins in danger. Sayl the Faithless has made betrayal less a sin than a trade language, fluent enough that even allies listen carefully for the price hidden in each promise. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTzeentch smiles on treachery, but followers still need enough confidence to stand near the schemer before the knives come out. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must betray them profitably and make distrust serve command. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.222.a:0 "Betray them profitably."

 war_unique_intro_events.223.t:0 "Styrkaar's Perfect War"
 war_unique_intro_events.223.d:0 "For Styrkaar, the age begins in danger. Styrkaar seeks a war so exquisite that even terror seems arranged, every charge a performance and every wound an audience forced to applaud. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nPerfection is hungry, and a warband that pauses too long to admire itself may be interrupted by less elegant killers. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must make war beautiful and let beauty survive by killing first. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.223.a:0 "Make war beautiful."

 war_unique_intro_events.224.t:0 "Fimirach in the Dark Lands"
 war_unique_intro_events.224.d:0 "For Fimirach, the age begins in danger. Fimirach carries the wet shadow of the Fimir into a land of ash, chains, and furnace smoke, where mist must learn to hide among worse things. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nChaos Dwarfs see labor, Hobgoblins see weakness, and older enemies would prefer the Fimir remain a half-remembered warning from marsh stories. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nChaos does not reward hesitation. Khorne, Nurgle, Tzeentch, and Slaanesh each offer paths to power, but all of them despise weakness dressed as prudence. The realm must turn devotion into command before another champion does it first.\n\nThe situation is unstable and full of opportunity, so we must raise the fen-shadow and make exile dangerous again. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!."
 war_unique_intro_events.224.a:0 "Raise the fen-shadow."

 war_unique_intro_events.225.t:0 "The Maggot Lord's Ride"
 war_unique_intro_events.225.d:0 "For Tamurkhan, the age begins in danger. Tamurkhan rides as conquest wearing corruption, a maggot lord whose ambition is swollen enough to call decay an empire. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nNurgle's favor gives endurance, but a crusade must keep moving before rot becomes comfort and comfort becomes another kind of grave. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must ride the maggot road and make every victory fester forward. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.225.a:0 "Ride the maggot road."

 war_unique_intro_events.226.t:0 "The Threefold Rot"
 war_unique_intro_events.226.d:0 "For the Glottkin, the age begins in danger. The Glottkin are brotherhood made monstrous, three voices of Nurgle's affection carrying plague, strength, and sorcery in one family argument with the world. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the realm decides what it means to survive.\n\nTheir bond is power, but power must be aimed before rival champions learn how to flatter one brother against another. The first season will therefore matter more than its size suggests. Councils, camps, priests, captains, markets, and war-leaders must be made to answer a single purpose before habit and pride scatter their strength.\n\nA warband is not a kingdom with worse manners. It is a moving appetite, a shrine on the march, and a bargain in which land, captives, and memory are all fuel for the Dark Gods. Momentum is survival.\n\nThe situation is unstable and full of opportunity, so we must let three voices rot as one and make kinship contagious. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity. Warriors, elders, priests, merchants, captains, and ambitious rivals must be made to serve the same design before the wider world presses close enough to choose a future for them.\n\nThe End Times approach, and the north will not be a spectator. §RIn the Third Age, the Everchosen will be selected from the mightest of the Chaos nations to destroy the world§!.\n\nAs a Chaos Warband, we do not conquer provinces - we sacrifice them to the Dark Gods! §RWhen we take a province, it is destroyed and converted into Chaos Favor. Chaos Favor is found on the Government Tab, and provides us with money, men, and more§!."
 war_unique_intro_events.226.a:0 "Let three voices rot as one."

 war_unique_intro_events.227.t:0 "Bloodgrin Laughs First"
 war_unique_intro_events.227.d:0 "For Bloodgrin Tribe, the age begins in danger. The Bloodgrin Tribe knows a good fight by the taste of it. Blood on the teeth, loot in the fists, and enemies squealing nearby are all signs that Gork and Mork are paying attention. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA tribe that stops fighting starts thinking, and thinking is how bosses get stabbed before the next raid even starts. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must grin through the blood and find a fight big enough to keep the boyz loud. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.227.a:0 "Grin through the blood."

 war_unique_intro_events.228.t:0 "Bad Axes, Good Fight"
 war_unique_intro_events.228.d:0 "For Bad Axes Tribe, the age begins in danger. The Bad Axes Tribe does not need fine smithing to know a choppa works. If the edge is ugly, the swing is mean, and the other git falls over, the axe is good enough. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nRivals, stunties, humies, and unlucky neighbors all look like practice targets, but the tribe needs a boss who can turn many small scraps into one proper WAAAGH. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must sharpen da bad axes and chop a road through anyone nearby. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.228.a:0 "Sharpen da bad axes."

 war_unique_intro_events.229.t:0 "Blue Paint, Red Work"
 war_unique_intro_events.229.d:0 "For Blue Face Tribe, the age begins in danger. The Blue Face Tribe marks itself before battle so every enemy knows exactly which mob is coming to ruin the day. The paint is pride, threat, and target all at once. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nWar paint does not scare anyone if the warriors under it are idle, and idle Greenskins become a problem for their own camp first. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must paint up and charge before the color dries. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.229.a:0 "Paint up and charge."

 war_unique_intro_events.230.t:0 "Vulchaz Overhead"
 war_unique_intro_events.230.d:0 "For Vulchaz, the age begins in danger. The Vulchaz watch like carrion birds, waiting for weakness, smoke, or some richer fool to start a fight that can be profitably finished. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nScavenging can feed a tribe, but only victory makes other Greenskins follow without laughing. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must circle and strike until every scrap belongs to us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.230.a:0 "Circle and strike."

 war_unique_intro_events.231.t:0 "Freebooterz on the Tide"
 war_unique_intro_events.231.d:0 "For Freebooterz, the age begins in danger. The Freebooterz hear waves and think of boarding planks, stolen guns, and captains who shout louder than storms. A ship is just a moving fort with more ways to fall off. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nPirate mobs need plunder faster than discipline can leak away, and every coast is only useful if the boyz believe the next prize is worth the rowing. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must board da next prize and make the sea itself sound like WAAAGH. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.231.a:0 "Board da next prize."

 war_unique_intro_events.232.t:0 "Bonenose Omens"
 war_unique_intro_events.232.d:0 "For Bonenoses, the age begins in danger. The Bonenoses read trophies better than books. A skull tied to a pole, a jawbone over a gate, or a lucky femur in the boss tent can settle arguments faster than words. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nOmens are useful only while the tribe keeps winning; otherwise every bone starts pointing at a different boss. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must follow da bones into a fight big enough to prove them right. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.232.a:0 "Follow da bones."

 war_unique_intro_events.233.t:0 "Stitched Skull Banners"
 war_unique_intro_events.233.d:0 "For Stitched Skullz, the age begins in danger. The Stitched Skullz make banners from proof. Every skull sewn in place says someone argued, lost, and became decoration. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA banner full of old victories can inspire a charge, but only fresh trophies stop rivals from asking whether the boss has gone soft. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must stitch more skullz and let the banner do the shouting. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.233.a:0 "Stitch more skullz."

 war_unique_intro_events.234.t:0 "Rusty Daggaz in the Dark"
 war_unique_intro_events.234.d:0 "For Rusty Daggaz, the age begins in danger. The Rusty Daggaz know a rusty blade still hurts, especially when it arrives in the dark and the other git was expecting a fair fight. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nSneaky violence feeds a tribe for a while, but the boyz still need open scraps before the muttering turns inward. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must stick em first and turn every ambush into a louder war. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.234.a:0 "Stick em first."

 war_unique_intro_events.235.t:0 "Teef Snatchaz Ledger"
 war_unique_intro_events.235.d:0 "For Teef Snatchaz, the age begins in danger. The Teef Snatchaz understand wealth in the proper way: if it can be punched loose, bitten out, or stolen from a smaller git, it counts. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nTeef buy loyalty until a richer scrap appears, so the tribe must keep fights coming before the accounts start settling themselves with knives. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must snatch more teef and pay the boyz in violence. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.235.a:0 "Snatch more teef."

 war_unique_intro_events.236.t:0 "Skulltakerz Trophy Road"
 war_unique_intro_events.236.d:0 "For Skulltakerz, the age begins in danger. The Skulltakerz do not need complicated reasons. A skull on an enemy still belongs to the enemy, and that is clearly a problem requiring immediate attention. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nEvery trophy proves yesterday, but Greenskins follow whoever proves today louder. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must take da next skull and pile proof high enough to see. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.236.a:0 "Take da next skull."

 war_unique_intro_events.237.t:0 "Da Howlaz at Moonrise"
 war_unique_intro_events.237.d:0 "For Da Howlaz, the age begins in danger. Da Howlaz begin fights before they arrive. The yelling, drumming, and moonlit racket make enemies nervous and make the boyz feel bigger than they probably are. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nNoise without krumpin becomes annoying even to Greenskins, so every howl has to end with something broken. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must howl louder and make the night run with us. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.237.a:0 "Howl louder."

 war_unique_intro_events.238.t:0 "Scabby Eyez Watchin"
 war_unique_intro_events.238.d:0 "For Scabby Eyez, the age begins in danger. The Scabby Eyez watch everything: rival bosses, weak walls, loose teef, and the exact moment a bigger git looks the wrong way. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nSuspicion keeps a mob alive, but it can also freeze a camp in arguments unless someone points all those eyes toward a target. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must watch em, then krump em before they notice. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.238.a:0 "Watch em, then krump em."

 war_unique_intro_events.239.t:0 "Broken Tooth Bites Back"
 war_unique_intro_events.239.d:0 "For Broken Tooth, the age begins in danger. Broken Tooth carries a name that sounds like an injury until the tribe turns it into a threat. A broken tooth still bites, and it usually bites meaner. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nOther mobs respect strength and mock weakness, so every old defeat must be answered before it becomes the only story anyone remembers. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must bite back harder and make the name hurt others. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.239.a:0 "Bite back harder."

 war_unique_intro_events.240.t:0 "Bloodfeather War-Dance"
 war_unique_intro_events.240.d:0 "For Bloodfeathers, the age begins in danger. The Bloodfeathers decorate themselves with color, feathers, and enough blood to make every dance look like either a ritual or a warning. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nRituals stir courage, but courage needs enemies before it curdles into camp quarrels and shaman arguments. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must dance into da scrap and make every feather red. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.240.a:0 "Dance into da scrap."

 war_unique_intro_events.241.t:0 "Skullsmasherz Simple Plan"
 war_unique_intro_events.241.d:0 "For Skullsmasherz, the age begins in danger. The Skullsmasherz have an honest approach to politics. If a skull is causing problems, smash it. If a skull is not causing problems yet, smash it before it learns. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nEven the simplest plan needs a direction, because a mob that smashes everything nearby eventually discovers its own camp is nearby too. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must smash da skullz in the right direction. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.241.a:0 "Smash da skullz."

 war_unique_intro_events.242.t:0 "Black Venom in the Trees"
 war_unique_intro_events.242.d:0 "For Black Venom Tribe, the age begins in danger. The Black Venom Tribe likes a fight better when the enemy is already sweating, stumbling, and wondering which scratch started to burn. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nPoison and ambush make smaller mobs dangerous, but only victories big enough to boast about make larger mobs listen. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must let da venom drip until the whole forest joins the scrap. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.242.a:0 "Let da venom drip."

 war_unique_intro_events.243.t:0 "Ironclaw Grip"
 war_unique_intro_events.243.d:0 "For Ironclaw, the age begins in danger. Ironclaw is a name that tells the tribe what to expect: grip hard, take harder, and do not let go just because something screams. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA boss can hold a mob by fear for only so long before another boss wants to test the fingers. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must grab and crush until nobody wriggles free. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.243.a:0 "Grab and crush."

 war_unique_intro_events.244.t:0 "Ironhead Charge"
 war_unique_intro_events.244.d:0 "For Ironhead, the age begins in danger. Ironhead does not overthink obstacles. Walls, shields, doors, and enemy plans all look different after enough headbutts. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nStubbornness wins scraps but can lose wars if the boss keeps charging the same rock while easier loot laughs nearby. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must headbutt da world, but pick da best wall first. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.244.a:0 "Headbutt da world."

 war_unique_intro_events.245.t:0 "Goretusk Stampede"
 war_unique_intro_events.245.d:0 "For Goretusk, the age begins in danger. Goretusk follows the sound of hooves, squeals, and impact. A proper charge does not ask permission; it arrives with tusks already wet. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA horde can break almost anything in motion, but it needs fresh enemies before its weight turns back on itself. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must start da stampede and keep it pointed outward. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.245.a:0 "Start da stampede."

 war_unique_intro_events.246.t:0 "Bloody Sunz Rising"
 war_unique_intro_events.246.d:0 "For Bloody Sunz, the age begins in danger. The Bloody Sunz paint the sky in their own heads before battle, convinced every dawn is just the world getting ready to watch them win. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nConfidence is good, but confidence without loot becomes shouting, and shouting without fighting makes the boyz suspicious. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must raise da bloody sun over a proper battlefield. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.246.a:0 "Raise da bloody sun."

 war_unique_intro_events.247.t:0 "Bloody Handz Grab More"
 war_unique_intro_events.247.d:0 "For Bloody Handz, the age begins in danger. The Bloody Handz believe a thing belongs to whoever can hold it after the screaming stops. This is simple, clear, and popular among the boyz. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nHolding loot is harder than taking it when every other Greenskin thinks the same way. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must grab it bloody and punch anyone counting shares. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.247.a:0 "Grab it bloody."

 war_unique_intro_events.248.t:0 "Ironback Won't Bend"
 war_unique_intro_events.248.d:0 "For Ironback, the age begins in danger. Ironback prides itself on not bending. Arrows, axes, bad luck, and better advice all hit the same stubborn wall. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nEndurance wins respect only if it leads to someone else getting flattened, not if the tribe merely survives another insult. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must stand and shove until the enemy moves instead. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.248.a:0 "Stand and shove."

 war_unique_intro_events.249.t:0 "Drippin Fang Ambush"
 war_unique_intro_events.249.d:0 "For Drippin Fangs, the age begins in danger. The Drippin Fangs know fear begins before the bite, when enemies see the wet shine on blades and start wondering what is dripping. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA sneaky tribe still needs trophies, and poison does not impress other mobs unless it leaves enough bodies to count. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must sink da fangs in and let the panic spread. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.249.a:0 "Sink da fangs in."

 war_unique_intro_events.250.t:0 "Stonefangz Don't Chip"
 war_unique_intro_events.250.d:0 "For Stonefangz, the age begins in danger. The Stonefangz are stubborn in the way rocks are stubborn, except rocks do not usually charge downhill screaming about teef. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nMountains breed hard mobs and harder grudges, but the tribe needs more than defensive pride if it wants bigger bosses to notice. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must bite through stone and then bite through whoever hid behind it. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.250.a:0 "Bite through stone."

 war_unique_intro_events.251.t:0 "Tusked Sunz Charge"
 war_unique_intro_events.251.d:0 "For Tusked Sunz, the age begins in danger. The Tusked Sunz like their charges loud, bright, and hard to misunderstand. If the enemy has time to admire the tusks, the charge started too slowly. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA proud mob must prove the banners are more than decoration before rivals start using them as tents. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must show da tusks and run down the next rich target. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.251.a:0 "Show da tusks."

 war_unique_intro_events.252.t:0 "Moon Howlaz Under Da Bad Moon"
 war_unique_intro_events.252.d:0 "For Moon Howlaz, the age begins in danger. The Moon Howlaz listen for the Bad Moon in every dark sky, every shaman twitch, and every nervous noise enemies make after sunset. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nOmens are only useful if followed by stabbing, looting, and enough success to keep the shamans from being blamed afterward. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must howl at da moon and make night our banner. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.252.a:0 "Howl at da moon."

 war_unique_intro_events.253.t:0 "Draken Boyz Ride Out"
 war_unique_intro_events.253.d:0 "For Draken Boyz, the age begins in danger. The Draken Boyz measure status by what a warrior can ride without being eaten first. Teeth, scales, smoke, and impact all help settle rank. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nBig beasts impress the boyz, but they also eat supplies, handlers, and careless bosses unless the tribe keeps them pointed at enemies. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must ride da big beasts and flatten something worth bragging about. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.253.a:0 "Ride da big beasts."

 war_unique_intro_events.254.t:0 "Ironclad Skullz March"
 war_unique_intro_events.254.d:0 "For Ironclad Skullz, the age begins in danger. The Ironclad Skullz like the sound of metal on metal, especially when one of the metals is wrapped around their own heads. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nArmor makes a mob feel invincible, which is useful right until invincible boyz start testing each other instead of the enemy. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must clank into da scrap and prove iron belongs on our side. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.254.a:0 "Clank into da scrap."

 war_unique_intro_events.255.t:0 "Backstabber's Best Crew"
 war_unique_intro_events.255.d:0 "For Gorduz Crew, the age begins in danger. Gorduz Backstabber knows survival under Chaos Dwarf masters requires good timing, useful cruelty, and a knife that can be blamed on someone else. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nOther Greenskins despise Hobgoblins, Dawi-Zharr trust only results, and every bargain lasts until a better one learns to smile. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nHobgoblin power is cunning with a saddle. Khans rule by gifts, fear, wolf herds, careful treachery, and the useful truth that betrayal is shameful only when it fails. The clever blade still needs a hand to point it.\n\nThe situation is loud, hungry, and full of opportunity, so we must sell the sharpest knives and keep the best one hidden. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.255.a:0 "Sell the sharpest knives."

 war_unique_intro_events.256.t:0 "Stone Stackaz Pile Up"
 war_unique_intro_events.256.d:0 "For Stone Stackaz, the age begins in danger. The Stone Stackaz like piles: stones, skulls, loot, broken doors, and enemies who stopped arguing after the second hit. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA pile says this place is ours, but only a fight keeps other mobs from rearranging it. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must stack da stones higher and bury challengers under them. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.256.a:0 "Stack da stones higher."

 war_unique_intro_events.257.t:0 "Broken Chainz Loose"
 war_unique_intro_events.257.d:0 "For Broken Chainz, the age begins in danger. Broken Chainz remembers restraint as an insult. Shackles, orders, tolls, and doors all look better when snapped. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nFreedom gives the mob a first roar, but a lasting WAAAGH needs enemies to blame before old grudges turn into new boss fights. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must break more chainz and make every master run. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.257.a:0 "Break more chainz."

 war_unique_intro_events.258.t:0 "The Hobgobla Khan's Shadow"
 war_unique_intro_events.258.d:0 "For Hobgoblin Khanate, the age begins in danger. The Hobgoblin Khanate rides beneath the long shadow of the Hobgobla Khan, where wolf herds, camps, tribute, and ambushes all become tools of rule. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA khanate survives by moving fast and punishing betrayal selectively enough that everyone still believes they might profit from the next one. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nHobgoblin power is cunning with a saddle. Khans rule by gifts, fear, wolf herds, careful treachery, and the useful truth that betrayal is shameful only when it fails. The clever blade still needs a hand to point it.\n\nThe situation is loud, hungry, and full of opportunity, so we must cast the khans shadow over every camp on the horizon. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.258.a:0 "Cast the khans shadow."

 war_unique_intro_events.259.t:0 "Ironskull Argument"
 war_unique_intro_events.259.d:0 "For Ironskull, the age begins in danger. Ironskull treats debate as something best settled forehead-first. A boss who can still stand after the noise usually gets to explain what the plan was. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nHard heads win challenges, but the tribe needs someone to point those skulls toward enemies before the camp becomes the battlefield. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must win da argument and headbutt the tribe into motion. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.259.a:0 "Win da argument."

 war_unique_intro_events.260.t:0 "Bloody Spearz Wall"
 war_unique_intro_events.260.d:0 "For Bloody Spearz, the age begins in danger. The Bloody Spearz have discovered that a pointy stick becomes funnier when many pointy sticks move in the same direction. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA spear wall is almost discipline, which makes some boyz suspicious, but everyone likes it better when enemies bounce off screaming. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must lower da spearz and shove until the line breaks. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.260.a:0 "Lower da spearz."

 war_unique_intro_events.261.t:0 "Skull Crag Echoes"
 war_unique_intro_events.261.d:0 "For Skull Crag, the age begins in danger. Skull Crag is a place where shouting comes back louder, which is useful for bosses, shamans, and anyone trying to make a pile of skulls sound official. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA crag full of trophies can draw mobs together, but every new arrival expects a chance to test who owns the echo. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must make da crag shout our name and no one else's. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.261.a:0 "Make da crag shout."

 war_unique_intro_events.262.t:0 "Bonerattlaz Noise"
 war_unique_intro_events.262.d:0 "For Bonerattlaz, the age begins in danger. The Bonerattlaz rattle bones before battle because it scares enemies, excites the boyz, and gives the shamans something to blame if the first charge goes wrong. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nNoise can gather a mob, but the mob must be sent somewhere useful before everyone starts rattling different bones. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must rattle da bones and follow the loudest omen. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.262.a:0 "Rattle da bones."

 war_unique_intro_events.263.t:0 "Blue Viper Strike"
 war_unique_intro_events.263.d:0 "For Blue Vipers, the age begins in danger. The Blue Vipers are proud of being noticed only after it is too late. A flash of blue, a sting in the leg, and then the laughing starts. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nAmbush wins loot, but a tribe that never shows strength in daylight risks being treated as a nuisance rather than a boss mob. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must strike from da grass and drag the loot into the open. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.263.a:0 "Strike from da grass."

 war_unique_intro_events.264.t:0 "Arachnos Webs"
 war_unique_intro_events.264.d:0 "For Arachnos, the age begins in danger. Arachnos follows spider paths through roots, shadows, and sticky shrines where the unwary learn that forests can have too many legs. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nThe spider god gives fear and patience, but Greenskin mobs still demand noise, loot, and a reason not to eat the shaman. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must follow da spider paths until the whole forest is a trap. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.264.a:0 "Follow da spider paths."

 war_unique_intro_events.265.t:0 "LeafCutterz Clearin"
 war_unique_intro_events.265.d:0 "For LeafCutterz, the age begins in danger. The LeafCutterz know every leaf can hide a blade, a trap, or a goblin waiting for the funniest possible moment. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nThe forest shelters the tribe, but shelter becomes a cage if the mob never cuts outward toward richer screams. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must cut a path and make the trees open onto loot. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.265.a:0 "Cut a path."

 war_unique_intro_events.266.t:0 "SnakeEaterz Bite First"
 war_unique_intro_events.266.d:0 "For SnakeEaterz, the age begins in danger. The SnakeEaterz learned that some dangers stop being scary after they have been cooked, bitten, or worn as proof that the boss survived lunch. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nEating the frightening thing is good for morale, but the tribe needs larger prey if it wants other mobs to stop laughing. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must eat da snake first and chase the bigger monsters next. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.266.a:0 "Eat da snake first."

 war_unique_intro_events.267.t:0 "Speaking Trees Shout Back"
 war_unique_intro_events.267.d:0 "For Speaking Trees, the age begins in danger. The Speaking Trees hear voices in the woods, which might be spirits, might be shamans, and might be goblins hiding badly. It works either way if enemies panic. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA holy grove full of arguments needs victories before rival mobs decide the trees are talking nonsense. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must make da trees shout and send the frightened boyz forward. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.267.a:0 "Make da trees shout."

 war_unique_intro_events.268.t:0 "Burning Face Warpaint"
 war_unique_intro_events.268.d:0 "For Burning Face, the age begins in danger. Burning Face understands that flames improve almost anything: banners, faces, enemy huts, and the speed with which smaller gits decide to obey. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nFire impresses the boyz, but a burning camp is only useful if it belongs to someone else. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must light up da face and set the next enemy glowing. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.268.a:0 "Light up da face."

 war_unique_intro_events.269.t:0 "Yellow Eye Sees It"
 war_unique_intro_events.269.d:0 "For Yellow Eye, the age begins in danger. Yellow Eye sees things other mobs miss: weak gates, scared guards, unlucky stars, and loose loot that clearly wants rescuing. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nWatching too long makes the boyz twitchy, and a twitchy mob usually finds something nearby to ruin. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must see it, nick it, and call the omen clever. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.269.a:0 "See it, nick it."

 war_unique_intro_events.270.t:0 "Da Greentide Rises"
 war_unique_intro_events.270.d:0 "For Greentide, the age begins in danger. The Greentide is what every nervous border fort fears when distant drums stop sounding like separate mobs and start sounding like weather. Around that inheritance stand rivals, memories, and hungry neighbors who will not wait politely while the tribe decides what it means to survive.\n\nA tide this large cannot sit still. If it does not roll over enemies, it will roll backward through its own camps, bosses, and loot piles. The first season will therefore matter more than its size suggests. Bosses, shamans, riders, sneaks, brutes, and ambitious underlings must be made to answer a single purpose before boredom and pride scatter their strength.\n\nGreenskins live through fighting. Peace makes them weak, poor, and restless; war gives them loot, purpose, and momentum. Every mob needs a boss, every boss needs a scrap, and every scrap is better when it becomes the start of a WAAAGH.\n\nThe situation is loud, hungry, and full of opportunity, so we must let da tide roll until the map is just places we have not smashed yet. If strength can be bound to action, early danger may become the foundation of something harder to dismiss.\n\nThe first task is practical unity, in the loose and violent sense that Greenskins allow. The mob must be kept fighting outward, fed with loot, and shown enough victories that the next argument happens on enemy ground instead of in the boss camp."
 war_unique_intro_events.270.a:0 "Let da tide roll."
 war_unique_intro_events.271.t:0 "Chariots of the Sunken Realm"
 war_unique_intro_events.271.d:0 "Tiranoc remembers the sea as both road and wound. Its chariot princes ride lands scarred by old catastrophe, where drowned provinces, broken coasts, and proud houses teach that glory can vanish beneath water as quickly as beneath war.\n\nThe Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Neither voice can be ignored, and neither voice can command obedience without cost.\n\nThe Asur are ancient, refined, and diminished, but decline has not made them humble. Their cities still shine, their nobles still remember impossible victories, and their soldiers still believe they guard more than their own shores. That belief is strength only if it can survive faction.\n\nThe situation is tragic and delicate, so we must make the old chariot roads serve a divided island again. If the island is to endure, tradition must become action rather than a museum of better centuries.\n\nEvery province of Ulthuan now carries two wars at once: the visible contest of banners, and the quieter struggle over what survival means. Pride can preserve a people or isolate them until the world passes by.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.271.a:0 "Harness the old roads."

 war_unique_intro_events.272.t:0 "The Watch in the Shadowlands"
 war_unique_intro_events.272.d:0 "The Shadowlands are Ulthuan after the candle has burned low. Nagarythe keeps watch where memory still tastes of betrayal, where Shadow Warriors vanish between stones, and where every rumor of Druchii movement sounds less like news than repetition.\n\nThe Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Neither voice can be ignored, and neither voice can command obedience without cost.\n\nThe Asur are ancient, refined, and diminished, but decline has not made them humble. Their cities still shine, their nobles still remember impossible victories, and their soldiers still believe they guard more than their own shores. That belief is strength only if it can survive faction.\n\nThe situation is tragic and delicate, so we must keep Nagarythe watchful without letting suspicion devour the island it protects. If the island is to endure, tradition must become action rather than a museum of better centuries.\n\nEvery province of Ulthuan now carries two wars at once: the visible contest of banners, and the quieter struggle over what survival means. Pride can preserve a people or isolate them until the world passes by.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.272.a:0 "Keep Nagarythe watchful."

 war_unique_intro_events.273.t:0 "Axes of Chrace"
 war_unique_intro_events.273.d:0 "Chrace is a kingdom of hard paths, white forests, and warriors who trust an axe more than a court promise. Its hunters know the passes by scent, scar, and silence, and its nobles remember that the Phoenix King survives because someone less polished stands between crown and claw.\n\nThe Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Neither voice can be ignored, and neither voice can command obedience without cost.\n\nThe Asur are ancient, refined, and diminished, but decline has not made them humble. Their cities still shine, their nobles still remember impossible victories, and their soldiers still believe they guard more than their own shores. That belief is strength only if it can survive faction.\n\nThe situation is tragic and delicate, so we must guard the mountain paths while the courts argue over what Ulthuan should become. If the island is to endure, tradition must become action rather than a museum of better centuries.\n\nEvery province of Ulthuan now carries two wars at once: the visible contest of banners, and the quieter struggle over what survival means. Pride can preserve a people or isolate them until the world passes by.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.273.a:0 "Guard the mountain paths."

 war_unique_intro_events.274.t:0 "Masts of Cothique"
 war_unique_intro_events.274.d:0 "Cothique faces the sea with a sailor's patience and a prince's suspicion. Its harbors know fog, reefs, raiders, and the cold arithmetic of distance, where a single missed sail can become a burned shrine before Lothern hears the warning.\n\nThe Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Neither voice can be ignored, and neither voice can command obedience without cost.\n\nThe Asur are ancient, refined, and diminished, but decline has not made them humble. Their cities still shine, their nobles still remember impossible victories, and their soldiers still believe they guard more than their own shores. That belief is strength only if it can survive faction.\n\nThe situation is tragic and delicate, so we must ready the sea guard before the island learns how quickly coasts can become wounds. If the island is to endure, tradition must become action rather than a museum of better centuries.\n\nEvery province of Ulthuan now carries two wars at once: the visible contest of banners, and the quieter struggle over what survival means. Pride can preserve a people or isolate them until the world passes by.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.274.a:0 "Ready the sea guard."

 war_unique_intro_events.275.t:0 "The Mists of Yvresse"
 war_unique_intro_events.275.d:0 "Yvresse stands where mist turns vigilance into religion. Tor Yvresse remembers invasion, humiliation, and the long patience required to make a coast feel like a gate rather than an invitation. Every watchtower carries the lesson that beauty is not the same as safety.\n\nThe Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Neither voice can be ignored, and neither voice can command obedience without cost.\n\nThe Asur are ancient, refined, and diminished, but decline has not made them humble. Their cities still shine, their nobles still remember impossible victories, and their soldiers still believe they guard more than their own shores. That belief is strength only if it can survive faction.\n\nThe situation is tragic and delicate, so we must hold the misted gate while the rest of Ulthuan decides whether old wounds teach caution or fear. If the island is to endure, tradition must become action rather than a museum of better centuries.\n\nEvery province of Ulthuan now carries two wars at once: the visible contest of banners, and the quieter struggle over what survival means. Pride can preserve a people or isolate them until the world passes by.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.275.a:0 "Hold the misted gate."

 war_unique_intro_events.276.t:0 "Caledor's Sleeping Fire"
 war_unique_intro_events.276.d:0 "Caledor is older than most boasts and prouder than many kingdoms. Its princes live among dragon caves, ancient armor, and stories of fire that once decided the fate of worlds. Yet many dragons sleep, and memory alone cannot answer a civil war.\n\nThe Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Neither voice can be ignored, and neither voice can command obedience without cost.\n\nThe Asur are ancient, refined, and diminished, but decline has not made them humble. Their cities still shine, their nobles still remember impossible victories, and their soldiers still believe they guard more than their own shores. That belief is strength only if it can survive faction.\n\nThe situation is tragic and delicate, so we must wake the dragon pride without letting pride burn the island it claims to defend. If the island is to endure, tradition must become action rather than a museum of better centuries.\n\nEvery province of Ulthuan now carries two wars at once: the visible contest of banners, and the quieter struggle over what survival means. Pride can preserve a people or isolate them until the world passes by.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.276.a:0 "Wake the dragon pride."

 war_unique_intro_events.277.t:0 "Reavers of Ellyrion"
 war_unique_intro_events.277.d:0 "Ellyrion's open lands give Ulthuan something its courts often lack: speed. Reavers, messengers, nobles, and scouts cross grass and road before slower princes finish naming the crisis. In a fractured age, the first rider to arrive can decide which rumor becomes policy.\n\nThe Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Neither voice can be ignored, and neither voice can command obedience without cost.\n\nThe Asur are ancient, refined, and diminished, but decline has not made them humble. Their cities still shine, their nobles still remember impossible victories, and their soldiers still believe they guard more than their own shores. That belief is strength only if it can survive faction.\n\nThe situation is tragic and delicate, so we must ride for the island before division outruns loyalty. If the island is to endure, tradition must become action rather than a museum of better centuries.\n\nEvery province of Ulthuan now carries two wars at once: the visible contest of banners, and the quieter struggle over what survival means. Pride can preserve a people or isolate them until the world passes by.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.277.a:0 "Ride for the island."

 war_unique_intro_events.278.t:0 "The Tower of Hoeth"
 war_unique_intro_events.278.d:0 "Saphery measures power in silence, ink, and words spoken only after lesser minds have finished panicking. The White Tower of Hoeth watches Ulthuan's fracture with the terrible calm of scholars who know too many precedents and not enough certainties.\n\nThe Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Neither voice can be ignored, and neither voice can command obedience without cost.\n\nThe Asur are ancient, refined, and diminished, but decline has not made them humble. Their cities still shine, their nobles still remember impossible victories, and their soldiers still believe they guard more than their own shores. That belief is strength only if it can survive faction.\n\nThe situation is tragic and delicate, so we must bind wisdom to duty before knowledge becomes another excuse for inaction. If the island is to endure, tradition must become action rather than a museum of better centuries.\n\nEvery province of Ulthuan now carries two wars at once: the visible contest of banners, and the quieter struggle over what survival means. Pride can preserve a people or isolate them until the world passes by.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.278.a:0 "Bind wisdom to duty."

 war_unique_intro_events.279.t:0 "The Ring Must Hold"
 war_unique_intro_events.279.d:0 "Ulthuan is not merely an island. It is the ring of mountains, the Vortex, the temples, the towers, the harbors, the forests, and the old confidence that the Asur were chosen to stand between the world and unmaking. Now that confidence has become a question.\n\nThe Breaking of the Asur has made every kingdom choose what its ancient pride is worth. Finubar calls for trade, embassies, and a wider strategy, while Alarielle warns that foreign influence will hollow Ulthuan from within. Neither voice can be ignored, and neither voice can command obedience without cost.\n\nThe Asur are ancient, refined, and diminished, but decline has not made them humble. Their cities still shine, their nobles still remember impossible victories, and their soldiers still believe they guard more than their own shores. That belief is strength only if it can survive faction.\n\nThe situation is tragic and delicate, so we must hold the ring together before every kingdom learns to call its own fear wisdom. If the island is to endure, tradition must become action rather than a museum of better centuries.\n\nEvery province of Ulthuan now carries two wars at once: the visible contest of banners, and the quieter struggle over what survival means. Pride can preserve a people or isolate them until the world passes by.\n\n§OThe Phoenix King is an elective title§!. Every 20 years, a new election is held between the Phoenix King and his dominions. The winner becomes the new Phoenix King."
 war_unique_intro_events.279.a:0 "Hold the ring together."

 war_unique_intro_events.280.t:0 "Morathi's Northern Web"
 war_unique_intro_events.280.d:0 "Ghrond listens to the north with a sorceress's patience. Its towers gather omens from the wastes, secrets from noble beds, and prayers from cults that know better than to speak loudly until a patron has already won.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must let Ghrond whisper until every rival wonders which thought was truly their own. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.280.a:0 "Let Ghrond whisper."

 war_unique_intro_events.281.t:0 "Chains of Karond Kar"
 war_unique_intro_events.281.d:0 "Karond Kar is a harbor where screams are accounted for as carefully as cargo. Slave pens, beast cages, corsair quays, and noble ledgers all teach the same lesson: living things have value when they can be owned, broken, or sold.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must fill the pens and make every chain answer to one design. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.281.a:0 "Fill the pens."

 war_unique_intro_events.282.t:0 "Altars of Har Ganeth"
 war_unique_intro_events.282.d:0 "Har Ganeth is a city of sacred blades, public death, and devotion that does not bother pretending to be gentle. The temples of Khaine teach that cruelty is most useful when made ceremonial, repeatable, and impossible to ignore.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must sharpen Khaine's altars until fear becomes administration. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.282.a:0 "Sharpen Khaine's altars."

 war_unique_intro_events.283.t:0 "The Black Crag Smiles"
 war_unique_intro_events.283.d:0 "Hag Graef rises from black stone with the manners of a court and the instincts of a knife. Its families speak in gifts, debts, marriages, insults, and assassinations, each one polished until murder can pass for etiquette.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must count the hidden blades before one of them finds the throne room. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.283.a:0 "Count the hidden blades."

 war_unique_intro_events.284.t:0 "Hullwrights of Clar Karond"
 war_unique_intro_events.284.d:0 "Clar Karond looks at forests and sees fleets. Its docks smell of resin, blood, iron, and salt, while shipwrights measure every plank against the raids it may carry and every hull against the rivals it may humble.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must launch the black hulls before richer cities decide who may rule the sea. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.284.a:0 "Launch the black hulls."

 war_unique_intro_events.285.t:0 "Iron Under the Witch King's Shadow"
 war_unique_intro_events.285.d:0 "Naggarond is more than stone, iron, and cold splendor. It is the shape of the Witch King's will made urban, a capital where every noble smiles as if treason were a weather condition and every silence might be royal attention.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must hold the iron capital without mistaking proximity to power for possession of it. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.285.a:0 "Hold the iron capital."

 war_unique_intro_events.286.t:0 "Arnheim's White Wall"
 war_unique_intro_events.286.d:0 "Arnheim is a white scar on a dark coast, an Asur foothold where every stone seems to ask how long courage can stand so far from home. Naggaroth watches from the wilderness and the sea, patient as winter and twice as hungry.\n\nFar from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents.\n\nDistance makes duty practical before it can be poetic. Captains must maintain waystones, chart winds, watch hostile coasts, keep Cadai rites, and decide when an order from home has arrived too late to matter. Precision is not a habit here; it is survival.\n\nUlthuan should be the heart to which all these far places answer, but Ulthuan is divided. The Phoenix King's call, the Everqueen's warning, and the pride of ancient houses have turned the homeland inward just as the oceans grow more dangerous.\n\nThe situation is isolated and exacting, so we must hold Arnheim's walls and prove distance has not severed duty. A distant colony cannot afford to be merely loyal; it must be competent enough that loyalty still has weight.\n\nAcross the seas, elven destiny has not ended. It has merely moved beyond sight of home, where every lit tower says the Asur still have hands at the edge of the world."
 war_unique_intro_events.286.a:0 "Hold Arnheim's walls."

 war_unique_intro_events.287.t:0 "The Tower of Ssildra Tor"
 war_unique_intro_events.287.d:0 "Ssildra Tor stands like a threat that learned architecture. Too distant to rely on the grand cities and too proud to beg them for favor, its lords must make isolation into mystique and scarcity into discipline.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must keep the tower cruel enough that neglect becomes fear. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.287.a:0 "Keep the tower cruel."

 war_unique_intro_events.288.t:0 "Drackla's Cold Bargain"
 war_unique_intro_events.288.d:0 "Drackla begins without the comforting illusion that the great houses care whether it survives. That can be a weakness, or it can be freedom. A lesser court may move where grander courts are watched, bargain where they must posture, and bleed rivals who forget its name.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must make Drackla useful before greater lords make it disposable. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.288.a:0 "Make Drackla useful."

 war_unique_intro_events.289.t:0 "The Forgebound Oath"
 war_unique_intro_events.289.d:0 "The Forgebound understand that metal remembers the hand that shapes it. In their holds, craft is not humble work but controlled violence: blades, collars, locks, armor, hinges, and tools made to decide whose will becomes law.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must bind the forges before another court decides what our hands are worth. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.289.a:0 "Bind the forges."

 war_unique_intro_events.290.t:0 "Twin Shadows of the Forest"
 war_unique_intro_events.290.d:0 "Naestra and Arahan are a contradiction the forest accepts more easily than most courts accept truth. Mercy and fury, warning and arrow, patience and sudden violence ride together beneath the boughs, and Athel Loren has learned to hear one will in two voices.\n\nThe Asrai are not gentle forest spirits in courtly costume. They are guardians of a living realm that remembers trespass, blood, oaths, old magic, and the cost of letting outsiders decide what a forest is worth. Athel Loren does not forgive simply because the world is ending.\n\nThe Sisters of Twilight embody the argument inside the wood. One voice cautions, one voice strikes, and both are needed when enemies come with axes, treaties, prayers, or desperation. The forest answers best when mercy and wrath understand the same path.\n\nAround them, the wider world grows louder. High Elves fracture, Druchii sharpen old hatred, men quarrel, beasts gather, and Chaos presses against every boundary. The boughs cannot pretend that isolation makes events elsewhere unreal.\n\nThe situation is watchful and dangerous, so we must guard the twilight boughs while the world beyond mistakes stillness for weakness. If the forest is to endure, it must choose when to remain hidden and when to make hiding unnecessary.\n\nAthel Loren survives by being older, stranger, and less negotiable than its enemies expect. The Sisters must make that truth move with arrow speed."
 war_unique_intro_events.290.a:0 "Guard the twilight boughs."

 war_unique_intro_events.291.t:0 "The Dawn Watch Endures"
 war_unique_intro_events.291.d:0 "The Fortress of Dawn was named by people who understood the value of light arriving on time. Its walls watch sea lanes, reefs, strange coasts, and the thin line between imperial duty and colonial loneliness.\n\nFar from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents.\n\nDistance makes duty practical before it can be poetic. Captains must maintain waystones, chart winds, watch hostile coasts, keep Cadai rites, and decide when an order from home has arrived too late to matter. Precision is not a habit here; it is survival.\n\nUlthuan should be the heart to which all these far places answer, but Ulthuan is divided. The Phoenix King's call, the Everqueen's warning, and the pride of ancient houses have turned the homeland inward just as the oceans grow more dangerous.\n\nThe situation is isolated and exacting, so we must raise the dawn signal until even a divided Ulthuan can follow it. A distant colony cannot afford to be merely loyal; it must be competent enough that loyalty still has weight.\n\nAcross the seas, elven destiny has not ended. It has merely moved beyond sight of home, where every lit tower says the Asur still have hands at the edge of the world."
 war_unique_intro_events.291.a:0 "Raise the dawn signal."

 war_unique_intro_events.292.t:0 "Beacon of the Tower of the Sun"
 war_unique_intro_events.292.d:0 "The Tower of the Sun is a beacon before it is a court. Its light tells pilots where to turn, merchants where to trust, and raiders where Asur patience ends. Around that signal, trade and artillery become parts of the same warning.\n\nFar from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents.\n\nDistance makes duty practical before it can be poetic. Captains must maintain waystones, chart winds, watch hostile coasts, keep Cadai rites, and decide when an order from home has arrived too late to matter. Precision is not a habit here; it is survival.\n\nUlthuan should be the heart to which all these far places answer, but Ulthuan is divided. The Phoenix King's call, the Everqueen's warning, and the pride of ancient houses have turned the homeland inward just as the oceans grow more dangerous.\n\nThe situation is isolated and exacting, so we must keep the beacon burning when every nearby power would rather see it dimmed. A distant colony cannot afford to be merely loyal; it must be competent enough that loyalty still has weight.\n\nAcross the seas, elven destiny has not ended. It has merely moved beyond sight of home, where every lit tower says the Asur still have hands at the edge of the world."
 war_unique_intro_events.292.a:0 "Keep the beacon burning."

 war_unique_intro_events.293.t:0 "Star Charts of the Far Watch"
 war_unique_intro_events.293.d:0 "The Tower of the Stars reads the sky because the sea lies too often. Its scholars, pilots, and sea lords chart omens, currents, storms, and the movements of powers that believe distance hides ambition from Ulthuan.\n\nFar from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents.\n\nDistance makes duty practical before it can be poetic. Captains must maintain waystones, chart winds, watch hostile coasts, keep Cadai rites, and decide when an order from home has arrived too late to matter. Precision is not a habit here; it is survival.\n\nUlthuan should be the heart to which all these far places answer, but Ulthuan is divided. The Phoenix King's call, the Everqueen's warning, and the pride of ancient houses have turned the homeland inward just as the oceans grow more dangerous.\n\nThe situation is isolated and exacting, so we must read the star routes before enemies learn them by conquest. A distant colony cannot afford to be merely loyal; it must be competent enough that loyalty still has weight.\n\nAcross the seas, elven destiny has not ended. It has merely moved beyond sight of home, where every lit tower says the Asur still have hands at the edge of the world."
 war_unique_intro_events.293.a:0 "Read the star routes."

 war_unique_intro_events.294.t:0 "Pearls of Elithis"
 war_unique_intro_events.294.d:0 "Elithis lies where letters arrive late, spices dry in guarded storehouses, pearls change hands under watchful eyes, and monsoon pilots know which promises survive bad weather. It is distant, but not provincial; isolated, but not small.\n\nFar from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents.\n\nDistance makes duty practical before it can be poetic. Captains must maintain waystones, chart winds, watch hostile coasts, keep Cadai rites, and decide when an order from home has arrived too late to matter. Precision is not a habit here; it is survival.\n\nUlthuan should be the heart to which all these far places answer, but Ulthuan is divided. The Phoenix King's call, the Everqueen's warning, and the pride of ancient houses have turned the homeland inward just as the oceans grow more dangerous.\n\nThe situation is isolated and exacting, so we must answer with the tide until the far island sounds like policy rather than exile. A distant colony cannot afford to be merely loyal; it must be competent enough that loyalty still has weight.\n\nAcross the seas, elven destiny has not ended. It has merely moved beyond sight of home, where every lit tower says the Asur still have hands at the edge of the world."
 war_unique_intro_events.294.a:0 "Answer with the tide."

 war_unique_intro_events.295.t:0 "Calith's Far Harbor"
 war_unique_intro_events.295.d:0 "Calith survives by making distance legible. Every harbor light, ledger mark, signal flag, shrine rite, and disciplined patrol says that the Asur are still capable of order where maps grow uncertain.\n\nFar from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents.\n\nDistance makes duty practical before it can be poetic. Captains must maintain waystones, chart winds, watch hostile coasts, keep Cadai rites, and decide when an order from home has arrived too late to matter. Precision is not a habit here; it is survival.\n\nUlthuan should be the heart to which all these far places answer, but Ulthuan is divided. The Phoenix King's call, the Everqueen's warning, and the pride of ancient houses have turned the homeland inward just as the oceans grow more dangerous.\n\nThe situation is isolated and exacting, so we must keep Calith precise before uncertainty invites stronger hands. A distant colony cannot afford to be merely loyal; it must be competent enough that loyalty still has weight.\n\nAcross the seas, elven destiny has not ended. It has merely moved beyond sight of home, where every lit tower says the Asur still have hands at the edge of the world."
 war_unique_intro_events.295.a:0 "Keep Calith precise."

 war_unique_intro_events.296.t:0 "Black Sails of Spite"
 war_unique_intro_events.296.d:0 "The Corsairs of Spite have made a polity out of vengeance with rigging. Their captains elect, threaten, bribe, and murder with the same practical spirit, because a corsair republic is still Druchii society, only with more salt on the knife.\n\nNaggaroth is powerful, but never simple. The Witch King's claim to the Phoenix Throne gives the Druchii a grievance grand enough to organize a civilization, yet every great city, noble house, temple, corsair fleet, sorceress, and slave lord tries to turn that grievance toward its own advantage.\n\nCruelty is normal here, but cruelty alone does not rule. It must be arranged into hierarchy, ceremony, profit, fear, and expectation. A court that cannot direct betrayal becomes its victim, and a lord who mistakes obedience for loyalty deserves the knife already moving toward him.\n\nUlthuan remains the stolen inheritance at the heart of Druchii hatred. The Asur call it exile; the Druchii call it theft. That difference is enough to keep armies marching, chains filling, and children raised on a memory sharpened into law.\n\nThe situation is cold, vicious, and full of opportunity, so we must let spite sail until every coast learns that hatred can navigate. If the great cities cannot be trusted, they can still be used.\n\nIn Naggaroth, survival is not the opposite of ambition. It is ambition with better timing, a cleaner alibi, and a blade hidden where the host will only notice after smiling."
 war_unique_intro_events.296.a:0 "Let spite sail."

 war_unique_intro_events.297.t:0 "Nocthyrion's Black Lanterns"
 war_unique_intro_events.297.d:0 "Nocthyrion is an Asur colony that learned to keep its lanterns shaded. Its ledgers, towers, and patrol routes still speak the language of Ulthuan, but its rites have gone nocturnal and its courts understand hunger in ways Lothern would refuse to name.\n\nFar from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. They are fortress-ports, shrines, observatories, counting houses, and naval locks on routes that carry treasure, news, armies, and omens between continents.\n\nDistance makes duty practical before it can be poetic. Captains must maintain waystones, chart winds, watch hostile coasts, keep Cadai rites, and decide when an order from home has arrived too late to matter. Precision is not a habit here; it is survival.\n\nUlthuan should be the heart to which all these far places answer, but Ulthuan is divided. The Phoenix King's call, the Everqueen's warning, and the pride of ancient houses have turned the homeland inward just as the oceans grow more dangerous.\n\nThe situation is isolated and exacting, so we must keep the night watch and prove even a cursed harbor can still hold a sea lane. A distant colony cannot afford to be merely loyal; it must be competent enough that loyalty still has weight.\n\nAcross the seas, elven destiny has not ended. It has merely moved beyond sight of home, where every lit tower says the Asur still have hands at the edge of the world."
 war_unique_intro_events.297.a:0 "Keep the night watch."
 war_unique_intro_events.298.t:0 "Sabreskin Takes the Pass"
 war_unique_intro_events.298.d:0 "Sabreskin holds the passes where caravans slow down and beasts leave good pelts behind. Their chiefs wear scars like ledgers, and every hide nailed over a gate tells visitors that coin, cattle, or flesh will be taken before the road opens.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is hungry and exposed, so we must skin the next beast and make every road through Sabreskin country pay in fear as well as silver.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.298.a:0 "Skin the next beast."

 war_unique_intro_events.299.t:0 "Gutplates of Ironskin"
 war_unique_intro_events.299.d:0 "Ironskin believes a belly is only as honest as the plate strapped across it. Their camps ring with hammered metal, butcher chants, and boasts from bulls who think a good gutplate should stop a spear and announce its owner before he speaks.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is loud, hungry, and armored, so we must hammer the plates flat until every rival hears Ironskin coming before the charge begins.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.299.a:0 "Hammer the plates flat."

 war_unique_intro_events.300.t:0 "The Bulgers Want More"
 war_unique_intro_events.300.d:0 "The Bulgers are famous for wanting more even by Ogre standards. More cattle, more captives, more gnoblars, more room at the fire, more enemies foolish enough to bring lunch wrapped in armor.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is overfull but never satisfied, so we must make room for more and prove that a tribe with a bigger stomach can swallow a bigger future.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.300.a:0 "Make room for more."

 war_unique_intro_events.301.t:0 "Loosetooth Contracts"
 war_unique_intro_events.301.d:0 "Loosetooth sells protection with a grin that promises nothing for free. Missing teeth, cracked tusks, and old caravan tallies hang beside the butcher fires, each one proof that debts here are remembered until something softer pays them.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is transactional and sharp-edged, so we must bite on credit, collect in meat, and teach the roads that Loosetooth promises are still promises.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.301.a:0 "Bite on credit."

 war_unique_intro_events.302.t:0 "The Suneaters Swallow Fire"
 war_unique_intro_events.302.d:0 "The Suneaters tell rivals that even the sun is only a meal too bright to swallow quickly. Their camps prize scorched iron, red coals, fire-blackened meat, and butchers who claim the Great Maw's hunger can be heard in every flame.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is burning, boastful, and watched by poorer tribes, so we must feed the sacred flame until the Suneaters look like hunger given daylight.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.302.a:0 "Feed the sacred flame."

 war_unique_intro_events.303.t:0 "The Bloody Fist Collects"
 war_unique_intro_events.303.d:0 "The Bloody Fist does not argue when a punch will settle accounts. Its bosses mark treaties with smashed shields, broken noses, and red handprints on toll stones, because every neighbor understands a fist better than a parchment.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is full of debts and witnesses, so we must show them the fist and make refusal feel more dangerous than obedience.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.303.a:0 "Show them the fist."

 war_unique_intro_events.304.t:0 "Mountain Eaters at the Table"
 war_unique_intro_events.304.d:0 "The Mountain Eaters claim the peaks are just a meal too slow for lesser jaws. They chew slate for wagers, drag boulders into feast rings, and demand that any caravan crossing their slopes admit the mountain already belongs to them.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is hard, high, and worth taking, so we must bite the mountain and make the passes taste like Mountain Eater territory.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.304.a:0 "Bite the mountain."

 war_unique_intro_events.305.t:0 "Sons of the Mountain"
 war_unique_intro_events.305.d:0 "The Sons of the Mountain speak of the peaks as kin, not scenery. Their elders point to cliffs as if naming ancestors, while butchers smear blood into cracks and swear the stone remembers every tribe that tried to pass without tribute.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is ancestral and unforgiving, so we must answer the stone and make every feast prove the mountain still has sons.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.305.a:0 "Answer the stone."

 war_unique_intro_events.306.t:0 "Blood Guzzlers Feast"
 war_unique_intro_events.306.d:0 "The Blood Guzzlers do not wait for meat to cool before celebrating. Their feasts begin beside the bodies, their bowls are red before the first song, and their butchers say the Great Maw prefers courage served warm.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is violent and eager, so we must drink the victory red before fear has time to leave our enemies' camps.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.306.a:0 "Drink the victory red."

 war_unique_intro_events.307.t:0 "Lazargh on the Caravan Road"
 war_unique_intro_events.307.d:0 "Lazargh sits where the road learns caution. Cathayan bales, gnoblar carts, mule trains, and nervous merchants pass beneath Ogre eyes, and every guard captain knows the cheapest toll is the one paid before the bulls get bored.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is profitable but fragile, so we must tax the road in meat and coin before some richer power decides to patrol it for us.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.307.a:0 "Tax the road in meat."

 war_unique_intro_events.308.t:0 "Feastmaster Calls the Table"
 war_unique_intro_events.308.d:0 "Feastmaster treats the table as a throne, altar, court, and battlefield. Chiefs who refuse a seat insult the Maw, chiefs who accept must survive the portions, and every course decides who leaves heavier, poorer, or not at all.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is ceremonial, gluttonous, and useful, so we must set the biggest table and make every guest understand the host owns the knives.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.308.a:0 "Set the biggest table."

 war_unique_intro_events.309.t:0 "Manbiters Smell Supper"
 war_unique_intro_events.309.d:0 "The Manbiters like enemies who run, bargain, pray, and fit into pots without being sawn apart first. Human towns, caravan guards, and border forts know the name as a warning that walls are only spice for patient hunger.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is crowded with softer prey, so we must find supper beyond the next ridge and make fear travel faster than our camps.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.309.a:0 "Find softer prey."

 war_unique_intro_events.310.t:0 "Treehammer Breaks the Green"
 war_unique_intro_events.310.d:0 "Treehammer sees forests as enemies standing too close together. Their bulls crack trunks for sport, drag whole trees back to camp as firewood trophies, and tell woodland spirits to stop hiding behind furniture.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is tangled and full of obstacles, so we must knock the forest down and make every cleared road another invitation to feast.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.310.a:0 "Knock the forest down."

 war_unique_intro_events.311.t:0 "Boulderbellies Roll"
 war_unique_intro_events.311.d:0 "Boulderbellies decorate their camps with rocks too large for sensible people to move. They roll stones into enemy lines, carve feast marks into cliffs, and insist a full belly should land with the weight of a landslide.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is steep and waiting for momentum, so we must let the stones roll and teach rival tribes that gravity has chosen a side.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.311.a:0 "Let the stones roll."

 war_unique_intro_events.312.t:0 "Skraggle Guts from the Wet Roads"
 war_unique_intro_events.312.d:0 "Skraggle Guts comes from roads that sink under the cart and laugh at clean boots. Their camps smell of wet hides, smoked fish, sour beer, and suspicious stew, while their scouts know where a loaded wagon slows before the ambush.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is muddy, mean, and underestimated, so we must gut the wet road and make bad ground into a good business.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.312.a:0 "Gut the wet road."

 war_unique_intro_events.313.t:0 "Death Toll at the Gate"
 war_unique_intro_events.313.d:0 "Death Toll takes its name seriously. A bell, skull pile, or hanging chain marks each crossing, and those who cannot pay are invited to settle the account in the one currency Ogres never refuse.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is simple enough for everyone to understand, so we must collect the toll and make passing through our lands cheaper than testing the name.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.313.a:0 "Collect the toll."

 war_unique_intro_events.314.t:0 "Two Clubs, One Meal"
 war_unique_intro_events.314.d:0 "Crossed Clubs began as a warning sign and became a banner. Two bruiser bands, two old grudges, and one enormous appetite now stand over the same cooking pit, each pretending unity was their idea first.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is fractious but useful, so we must swing both clubs in the same direction before old bruises become new civil wars.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.314.a:0 "Swing both clubs."

 war_unique_intro_events.315.t:0 "Fulg Wants a Bigger Pot"
 war_unique_intro_events.315.d:0 "Fulg is not the loudest name in the mountains, which makes its hunger more dangerous. Small camps learn quickly, quiet butchers listen carefully, and chiefs who laugh at Fulg's pot often end inside it.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is overlooked and therefore full of opportunity, so we must fill the bigger pot before the famous tribes notice how much room we have made.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.315.a:0 "Fill the bigger pot."

 war_unique_intro_events.316.t:0 "Payswords for Hire"
 war_unique_intro_events.316.d:0 "The Payswords have learned that a sword rented before lunch can buy dinner twice. Their camps keep account marks beside butcher hooks, and every captain knows loyalty lasts longest when the next payment is visible.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is commercial and violent, so we must sell the appetite and make every war nearby wonder what a Paysword charge costs.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.316.a:0 "Sell the appetite."

 war_unique_intro_events.317.t:0 "The Western Crucible"
 war_unique_intro_events.317.d:0 "The Western Provinces stand where Cathayan order is tested by dust, passes, caravan panic, and hungry powers beyond the walls. Their magistrates write in elegant script, but the ink dries beside garrison fires and road forts that know elegance alone cannot stop an Ogre charge.\n\nGrand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness.\n\nDominions, magistrates, mandarins, eunuchs, caravan masters, city militias, temple registries, and dragon courts all claim to serve order. In practice, order must be bargained into existence each season, then defended against everyone who mistakes harmony for permission.\n\nThe Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure.\n\nCathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion.\n\nThe situation is a crucible of frontier duty, so we must temper the west until Wei-Jin sees a shield rather than a petition.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.317.a:0 "Temper the west."

 war_unique_intro_events.318.t:0 "Ledgers of the Central Provinces"
 war_unique_intro_events.318.d:0 "The Central Provinces sit where Cathay measures itself. Granaries, tax offices, river towns, courier roads, and temple registers make the realm legible, but every ledger can become a weapon when the Dragon Throne is weak.\n\nGrand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness.\n\nDominions, magistrates, mandarins, eunuchs, caravan masters, city militias, temple registries, and dragon courts all claim to serve order. In practice, order must be bargained into existence each season, then defended against everyone who mistakes harmony for permission.\n\nThe Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure.\n\nCathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion.\n\nThe situation is administrative and brittle, so we must balance the ledgers before rival courts turn order into a private inheritance.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.318.a:0 "Balance the ledgers."

 war_unique_intro_events.319.t:0 "The Empty Dragon Throne"
 war_unique_intro_events.319.d:0 "The Imperial Provinces hold the capital, and therefore the argument over what Cathay still is. Wei-Jin's palaces, archives, gates, eunuch offices, ancestral tablets, and dragon banners all insist the empire endures, even when every province hears opportunity in the silence between decrees.\n\nGrand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness.\n\nDominions, magistrates, mandarins, eunuchs, caravan masters, city militias, temple registries, and dragon courts all claim to serve order. In practice, order must be bargained into existence each season, then defended against everyone who mistakes harmony for permission.\n\nThe Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure.\n\nCathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion.\n\nThe situation is imperial but not secure, so we must hold Wei-Jin together until ceremony hardens back into command.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.319.a:0 "Hold Wei-Jin together."

 war_unique_intro_events.320.t:0 "Burning Wind over the Marches"
 war_unique_intro_events.320.d:0 "The Burning Wind Nomads ride where Cathayan maps become warnings. Their banners move faster than memorials, their herds know wells the magistrates cannot pronounce, and their loyalty is watched by officials who still need their scouts.\n\nGrand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness.\n\nDominions, magistrates, mandarins, eunuchs, caravan masters, city militias, temple registries, and dragon courts all claim to serve order. In practice, order must be bargained into existence each season, then defended against everyone who mistakes harmony for permission.\n\nThe Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure.\n\nCathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion.\n\nThe situation is mobile, mistrusted, and necessary, so we must ride the burning wind before slower powers decide the frontier can be governed from a desk.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.320.a:0 "Ride the burning wind."

 war_unique_intro_events.321.t:0 "Wyrmkins at the Southern Gate"
 war_unique_intro_events.321.d:0 "The Wyrmkins claim closeness to scales, smoke, and old dragon rites that respectable courtiers prefer to regulate from a distance. Their shrines guard southern roads where Cathay touches jungles, seas, and rumors that do not fit inside imperial categories.\n\nGrand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness.\n\nDominions, magistrates, mandarins, eunuchs, caravan masters, city militias, temple registries, and dragon courts all claim to serve order. In practice, order must be bargained into existence each season, then defended against everyone who mistakes harmony for permission.\n\nThe Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure.\n\nCathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion.\n\nThe situation is sacred and politically dangerous, so we must name the dragon rites before other courts name them treason.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.321.a:0 "Name the dragon rites."

 war_unique_intro_events.322.t:0 "The Jade Custodians"
 war_unique_intro_events.322.d:0 "The Jade Custodians are entrusted with symbols that make lesser hands tremble. Seals, tablets, vault keys, court standards, and ritual obligations give them authority, but custody is only power if everyone agrees the guardian cannot be bypassed.\n\nGrand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness.\n\nDominions, magistrates, mandarins, eunuchs, caravan masters, city militias, temple registries, and dragon courts all claim to serve order. In practice, order must be bargained into existence each season, then defended against everyone who mistakes harmony for permission.\n\nThe Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure.\n\nCathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion.\n\nThe situation is ceremonial but sharp, so we must guard the jade seal and make custody matter in a realm where every faction reaches for legitimacy.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.322.a:0 "Guard the jade seal."

 war_unique_intro_events.323.t:0 "Nan-Yang Opens the Southern Sea"
 war_unique_intro_events.323.d:0 "Nan-Yang faces the southern sea with warehouses open and harbor chains ready. Spice winds, Indish wealth, Khureshi rumors, pirate sails, and elven island routes all touch its docks, making the coast both a treasury and a wound.\n\nGrand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness.\n\nDominions, magistrates, mandarins, eunuchs, caravan masters, city militias, temple registries, and dragon courts all claim to serve order. In practice, order must be bargained into existence each season, then defended against everyone who mistakes harmony for permission.\n\nThe Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure.\n\nCathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion.\n\nThe situation is maritime, wealthy, and exposed, so we must watch the southern sea until the court remembers that Cathay also has tides.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.323.a:0 "Watch the southern sea."

 war_unique_intro_events.324.t:0 "Corpse-Junks of the Dead Flag"
 war_unique_intro_events.324.d:0 "The Dead Flag Fleet sails as a bad omen made practical. Corpse-junks creak through fog, drowned crews haul lines without breath, and captains who should have rotted years ago still read the southern currents by moonlight.\n\nThe Vampire Coast is piracy and necromancy fused into a single practical horror. Wrecks become recruitment grounds, drowned crews become labor, cursed captains become policy, and every black sail tells the living that the sea keeps its debts.\n\nA fleet of the dead does not need the same bargains as mortal pirates. It needs harbors to frighten, charts to stolen wealth, corpses to crew the guns, and coastal trade centers where fear, plunder, and occult logistics can be made permanent.\n\nThe living powers of the eastern seas are rich enough to be careless. Cathay, Ind, island colonies, spice routes, pilgrim ships, and merchant convoys all cross waters where a corpse-junk, fog bank, or polite undead admiral can change commerce into a funeral.\n\nRaiding is only the first act. We must claim the ports that matter, make every coastal market hear our guns in its dreams, and prove that death at sea can be organized into a state.\n\nThe situation is soaked in salt, death, and opportunity, so we must raise the dead flags and make every rich harbor fear the shape of our sails.\n\n§YVampire Coast nations gain immense benefits from Coastal Centers of Trade. Prioritize these provinces above all others.§!"
 war_unique_intro_events.324.a:0 "Raise the dead flags."

 war_unique_intro_events.325.t:0 "Dimmed Sunz under the Eclipse"
 war_unique_intro_events.325.d:0 "The Dimmed Sunz say the sky went dark because it wanted to watch them fight without being seen. Their bosses daub black suns on shields, shove shamans toward any omen that sounds useful, and raid with the certainty that daylight is for gits who need directions.\n\nGreenskins live through fighting. Peace makes them poor, bored, quarrelsome, and stupid in ways even other Greenskins find annoying; war gives them loot, noise, direction, and someone else to blame when the cooking fires run low.\n\nA tribe becomes dangerous when its bosses can aim the shouting outward. Shamans find omens in smoke, squigs, teeth, and headaches, while mobs of Orcs and Goblins decide that any road, fort, shrine, caravan, or neighbor is better after being hit.\n\nFightiness is not a metaphor to the tribes. It is the pressure that keeps the lads moving, the threat that keeps rivals useful, and the difference between a proper Waaagh and a camp full of sulking gits hitting each other because nobody found a better target.\n\nA tribe cannot remain stable for long, so we must find enemies, win scraps, take trophies, and keep the lads too busy roaring forward to notice how many knives are waiting behind the boss.\n\nThe situation is restless, loud, and begging for a proper scrap, so we must darken da road and make the next fight big enough to bring the sun back scared.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.325.a:0 "Darken da road."

 war_unique_intro_events.326.t:0 "Ake Bows to Flame"
 war_unique_intro_events.326.d:0 "Ake kneels closest to the furnace glow. Its priests carry gem bowls across black stone, its warriors test courage beneath smoking ridges, and every clan argument eventually asks whether the dragon above the vents is sleeping, listening, or hungry.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is fractured, volcanic, and watched by fire, so we must send the gem tribute and make Ake look like the island most able to understand flame.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.326.a:0 "Send the gem tribute."

 war_unique_intro_events.327.t:0 "Axiu and the Clutch Roads"
 war_unique_intro_events.327.d:0 "Axiu controls paths where eggs, tribute, pilgrims, and armed escorts move between shrines. The roads are narrow, the tempers are not, and every brood-chief knows that a single insult near a clutch can become a war with wings above it.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is narrow and sacred, so we must guard the clutch roads before rival clans turn pilgrimage into hostage-taking.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.327.a:0 "Guard the clutch roads."

 war_unique_intro_events.328.t:0 "Chotekasabe's Sunlit Ash"
 war_unique_intro_events.328.d:0 "Chotekasabe raises banners where sunlight catches ash and makes it look briefly like gold. Its priests speak of Chotec in half-remembered names, while dragon cults answer that the truer sun is the furnace under a waking wyrm.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is bright, ashen, and contested by shrines, so we must raise the ash banners and make rival priests admit our rites can still command warriors.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.328.a:0 "Raise the ash banners."

 war_unique_intro_events.329.t:0 "Cocomara's Gem Altar"
 war_unique_intro_events.329.d:0 "Cocomara's altar counts gems the way other realms count soldiers. Rubies, sapphires, obsidian mirrors, and jade offerings move through temple hands, and every stone is weighed against the question of which dragon might wake for it.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is wealthy, jealous, and ceremonial, so we must count the bright stones before another shrine claims our tribute shines with the wrong blessing.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.329.a:0 "Count the bright stones."

 war_unique_intro_events.330.t:0 "Dzi's Borrowed Balance"
 war_unique_intro_events.330.d:0 "Dzi has learned to weigh scale against jade. Cathayan envoys admire its rituals when they resemble proper hierarchy, while older island priests mutter that imported manners mean little if a dragon decides the altar court smells weak.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is balanced on foreign courtesy and local fear, so we must balance scale and jade without letting either side think Dzi can be bought.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.330.a:0 "Balance scale and jade."

 war_unique_intro_events.331.t:0 "Hoka's Thousand Offerings"
 war_unique_intro_events.331.d:0 "Hoka is crowded with shrines that all insist their offering is the one dragons notice. Priests argue over incense, gems, captives, fish, feathers, heart-blood, and old stone names, while warriors wait to learn which quarrel has become law.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is devout and dangerously crowded, so we must let every shrine pay while making certain only Hoka decides how tribute is counted.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.331.a:0 "Let every shrine pay."

 war_unique_intro_events.332.t:0 "Ho-ko's Jade Shrine"
 war_unique_intro_events.332.d:0 "Ho-ko guards a jade shrine whose polish reflects too many claimants. Dragon priests, clan elders, blood-monks, and ambitious kin all say they know what the shrine demands, which is usually obedience from everyone else.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is sacred and politically useful, so we must bind the jade shrine before reverence becomes an excuse for another clan to govern us.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.332.a:0 "Bind the jade shrine."

 war_unique_intro_events.333.t:0 "Moki's Mountain Bell"
 war_unique_intro_events.333.d:0 "Moki's mountain bell is rung for eruption, invasion, tribute processions, and dragons that move in their sleep. No one agrees which sound is most dangerous, but every village knows to grab spear, gem, child, or priest when the bronze voice rolls down the slopes.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is high, anxious, and full of echoes, so we must ring the mountain bell and make Moki's warning sound like command.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.333.a:0 "Ring the mountain bell."

 war_unique_intro_events.334.t:0 "Oka beneath the Wing Shadow"
 war_unique_intro_events.334.d:0 "Oka lives under a wing-shadow that changes the mood of every moot. Fields, docks, temples, and barracks all pause when scales pass over the sun, because no order carries as much weight as the possibility of claws.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is awed and unstable, so we must hold the wing-shadow and prove Oka can govern even when the sky itself interrupts the altar court.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.334.a:0 "Hold the wing-shadow."

 war_unique_intro_events.335.t:0 "Tlaxeda's Two Harmonies"
 war_unique_intro_events.335.d:0 "Tlaxeda remembers older patterns more clearly than many neighbors, though memory here is cracked and overgrown. Geometric rites, spawning pools, and ancient plaques sit beside dragon masks and gem sacrifices, each tradition insisting the other is incomplete.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is divided between old pattern and new flame, so we must join the two rites before a rival clan turns memory into heresy.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.335.a:0 "Join the two rites."

 war_unique_intro_events.336.t:0 "Togamo's Obsidian Blood-Law"
 war_unique_intro_events.336.d:0 "Togamo writes law on obsidian and expects the edge to be noticed. Its warriors prize discipline, trial combats, hostage rites, and punishments performed where shrine steps can see them, because ceremony is easier to obey when it can cut.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is formal, brittle, and full of vendettas, so we must sharpen the blood-law before every clan decides honor means private war.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.336.a:0 "Sharpen the blood-law."

 war_unique_intro_events.337.t:0 "Usuji's Old Gods"
 war_unique_intro_events.337.d:0 "Usuji keeps offerings for gods whose names arrive broken from the deep past. Some shrines face dragons, others face stars, pools, stones, or silent plaques, and the priests insist contradiction is only a problem for those without enough altars.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is ancient, confused, and holy enough to matter, so we must count the old offerings and decide which memories still deserve soldiers.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.337.a:0 "Count the old offerings."

 war_unique_intro_events.338.t:0 "Xiumazu's Green Fire"
 war_unique_intro_events.338.d:0 "Xiumazu's green fire burns in vents that make even veteran priests lower their voices. Some call it dragon breath trapped underground, others call it an Old One sign, and practical brood-chiefs ask only whether it can frighten enemies.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is strange, luminous, and watched by jealous neighbors, so we must wake the green fire and make uncertainty useful.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.338.a:0 "Wake the green fire."

 war_unique_intro_events.339.t:0 "Li's Balanced Tribute"
 war_unique_intro_events.339.d:0 "Li survives by knowing the exact weight of a respectful gift. Too few gems insult the dragon, too many invite a stronger clan to ask where they came from, and the best tribute is often the one that buys silence from three rivals at once.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is delicate and measured in bowls, so we must weigh the tribute before generosity becomes weakness.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.339.a:0 "Weigh the tribute bowls."

 war_unique_intro_events.340.t:0 "Sauk's Red Scale"
 war_unique_intro_events.340.d:0 "Sauk paints its standards red because subtle warnings are for softer courts. Its warriors prize fury, blood-hot oaths, and dragon masks with too many teeth, while older priests worry that rage offered upward may return downward first.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is fierce and close to breaking its leash, so we must chain the red fury and make Sauk's violence obey before it merely burns.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.340.a:0 "Chain the red fury."

 war_unique_intro_events.341.t:0 "Sonaka's Harbor Shrines"
 war_unique_intro_events.341.d:0 "Sonaka marks its harbor stones with claw signs, tide prayers, and gem dust. Boats from the River Ruin, island fishermen, raiders, and shrine barges all pass under those marks, hoping the dragons care enough to protect the harbor but not enough to visit it.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is coastal, wealthy, and vulnerable, so we must mark the harbor stones before outsiders decide Sonaka is a landing place rather than a gate.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.341.a:0 "Mark the harbor stones."

 war_unique_intro_events.342.t:0 "Izu's Mist-Fangs"
 war_unique_intro_events.342.d:0 "Izu hides behind mist that makes every approach feel like trespass. Bone charms hang from shrine gates, scouts move by memory, and visiting envoys leave unsure whether they were honored, threatened, or deliberately lost.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is obscured and useful, so we must set the mist-fangs and make uncertainty serve Izu better than open walls would.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.342.a:0 "Set the mist-fangs."

 war_unique_intro_events.343.t:0 "Otogo's Rooted Ash"
 war_unique_intro_events.343.d:0 "Otogo's ash fields are not dead ground; they are soil waiting for the next command. Roots grip black earth, shrines smoke after rain, and priests say the dragons prefer tribute from clans that can make life return after fire.\n\nThe Old Ones are half-buried in these volcanic isles, their designs cracked beneath step-altars, skull racks, gem masks, and blood-smoke for living wyrms who sleep above furnace-glow caverns. The Lizardmen here are not the cold servants of distant temple-cities; they are island clans shaped by ash, scale, tribute, hunger, and fear.\n\nThe dragons are no kings. They accept gems, captives, heart-blood, praise, and distance, then wake when pride, hunger, insult, or weather makes a valley worth burning. Around that terror, blood-priests, brood chiefs, war-clans, and altar courts compete to decide which sacrifice the Great Dragon will notice.\n\nNo gentle law binds the archipelago. Rival spawning lineages, island cults, competing altars, old plaques, sacred clutches, and petty wars pull against the Dragon Cult even where its altar-smoke is thickest.\n\nBeyond the shores, the River Ruin and the eastern seas make the isles too useful to remain ignored. Chaos Dwarfs, Cathayan merchants, Indish ports, raiders, and ambitious neighbors would all profit from harbors, gems, and dragons that can be bargained toward war.\n\nThe situation is scarred but fertile, so we must root the ash rites and prove Otogo can grow strength where others see only ruin.\n\nThe Great Dragon does not command in any language mortals can safely quote. The clans must be dragged together, the cults mastered, the river mouth guarded, and the old servants of forgotten gods taught that survival can still become destiny.\n\n§RView Dragons willing to fight for a price on the Mercenaries tab.§!"
 war_unique_intro_events.343.a:0 "Root the ash rites."

 war_unique_intro_events.344.t:0 "Da Kingdoms Get Hungry"
 war_unique_intro_events.344.d:0 "The Ogre Kingdoms are a plural thing because no single tyrant has yet eaten enough rivals to make the grammar behave. Tyrants, butchers, maneaters, gnoblars, toll chiefs, and mercenary bosses all crowd the mountains, each convinced the Great Maw has left the biggest portion for them.\n\nThe Ogre Kingdoms are not kingdoms in the comfortable southern sense. They are roaming tyrannies of appetite, mountain holds, toll camps, feast halls, butcher shrines, and mercenary bargains held together by the threat of hunger and the memory of the Great Maw.\n\nThe Maw changed the Ogres into a people who understand every oath through the stomach. Chiefs promise meat, butchers read entrails, gnoblars haul tribute, caravans buy safe passage with coin and cattle, and neighboring peoples learn that diplomacy is often a larger bowl.\n\nThat bluntness is not stupidity. Ogre power moves along passes, market roads, battlefields, and campfires where a paid club can decide a war faster than a royal decree. A tribe that eats well can become a realm; a tribe that waits politely becomes dinner.\n\nBeyond the mountains, the world is full of buyers, victims, employers, and fools who think distance protects them. Cathay, Ind, the Dark Lands, and the Old World all need roads, guards, beasts, and wars settled by people large enough to call violence a trade.\n\nThe situation is enormous, hungry, and barely arranged, so we must let the kingdoms eat until the plural becomes a warning rather than an admission.\n\nThe Great Maw does not ask for elegance. It asks to be fed, and the tribe that feeds it best may discover that hunger can be made into policy."
 war_unique_intro_events.344.a:0 "Let the kingdoms eat."

 war_unique_intro_events.345.t:0 "Osterlund's Wolf March"
 war_unique_intro_events.345.d:0 "Osterlund stands where Imperial order grows cold hands. Wolf-priests, road wardens, burghers, foresters, and stubborn nobles keep watch over marches that know the sound of raiders before they know the comfort of courtly approval.\n\nThe Empire is a bargain between faith, law, steel, gunpowder, river towns, stubborn provinces, and men who know the dark will not wait for perfect unity. Every elector, priest, burgher, captain, and road warden serves mankind best when discipline outlives argument.\n\nImperial authority is never simple. Sigmarite and Ulrican claims, provincial privileges, noble pride, guild money, old charters, frightened villages, and ambitious cities all pull at the same banner while Beastmen, mutants, raiders, undead, and worse test the borders.\n\nWhat keeps the realm alive is not purity but serviceable order. Armies must drill, roads must remain open, merchants must be taxed without being strangled, forts must answer bells, and provincial pride must be made useful before it becomes rebellion.\n\nThe world grows less forgiving each year. If the marches fail, the heartland bleeds; if the heartland quarrels, the marches stand alone. The Empire survives when local hardship becomes common purpose.\n\nThe situation is northern, poor, and proud, so we must hold the wolf march and prove that discipline on the edge can still serve the Empire.\n\nSigmar may be invoked in palaces, Ulric in the cold north, and lesser patrons in towns that know their own fears. Whatever the prayer, the answer must be discipline, coin, and soldiers ready before the next alarm."
 war_unique_intro_events.345.a:0 "Hold the wolf march."

 war_unique_intro_events.346.t:0 "The Thousand Temples of Ind"
 war_unique_intro_events.346.d:0 "Ind is older, richer, and more crowded than most outsiders can comfortably imagine. Its cities rise around sacred rivers, spice markets, jewel courts, elephant roads, tiger-haunted forests, and temples whose gods are generous only when properly feared.\n\nInd is ancient, crowded, sacred, wealthy, and dangerous in ways that make foreign maps look childish. Massive temples, jeweled courts, spice roads, elephant yards, sacred rivers, monsoon ports, and tiger-haunted jungles all belong to a civilization older than many northern myths.\n\nThe land is not a single simple realm. Rajahs, Maharajahs, temple treasuries, pilgrim roads, caste obligations, merchant houses, warrior retinues, sacred beasts, and hungry gods all compete to define what proper order means in a place where wealth draws both reverence and knives.\n\nInd stands between desire and danger. Cathay watches from the northeast, Khuresh coils in the jungles, Elven colonies sit offshore, Ogres haunt the north, and every spice road carries enough profit to summon pirates, conquerors, priests, and monsters.\n\nThe cities endure because they are more than markets. They are granaries, shrines, courts, workshops, fortresses, and theaters of divine obligation, each one crowded with people who expect rulers to protect both prosperity and ritual order.\n\nThe situation is ancient, wealthy, and watched by predators, so we must let the cities endure while the Thousand Gods argue above the monsoon drums.\n\nThe Thousand Gods do not make politics gentle. They make it vast, perfumed, brilliant, and edged with sacrifice, and any ruler who mistakes splendor for softness will learn how quickly temple bells can sound like war drums."
 war_unique_intro_events.346.a:0 "Let the cities endure."

 war_unique_intro_events.347.t:0 "The Dragon Empire Must Endure"
 war_unique_intro_events.347.d:0 "Grand Cathay is not merely a country; it is the claim that the world can still be arranged correctly. Dragon banners, magistrate seals, caravan bells, ancestral rites, city walls, and celestial charts all point toward order, even when the empire's provinces pull like silk in rival hands.\n\nGrand Cathay is an empire of ledgers, walls, dragon-blooded authority, courtly ranks, and dangerous ceremony. Its provinces speak in memorials and silk seals, but every seal hides a faction, every faction shelters a grievance, and every grievance waits for weakness.\n\nDominions, magistrates, mandarins, eunuchs, caravan masters, city militias, temple registries, and dragon courts all claim to serve order. In practice, order must be bargained into existence each season, then defended against everyone who mistakes harmony for permission.\n\nThe Dragon Throne remains the center of the world in theory, yet theory has enemies with banners. Northern raiders, Ogre hunger, hobgoblin cunning, Khureshi secrecy, Indish wealth, pirate fleets, court factions, and rival provincial ambitions all press against the same brittle structure.\n\nCathay survives when bureaucracy becomes motion instead of paper. Claims must be written, favors gathered, domains disciplined, armies paid, walls repaired, roads watched, and every subordinate reminded that celestial order is not a suggestion.\n\nThe situation is grand, fractured, and watched by every border, so we must restore celestial order before the Dragon Empire becomes a memory administered by lesser courts.\n\n§RBuild trust and favors with domains, eventually converting them into more easily controlled vassals using the -Vassalize Dominion- influence action. Rebellious domains may attempt to overthrow their overlord and impose their own suzerainty. If they succeed, they will claim all of their overlord's dominions.§!"
 war_unique_intro_events.347.a:0 "Restore celestial order."
 war_unique_intro_events.348.t:0 "The Black Fur Musters"
 war_unique_intro_events.348.d:0 "Clan Rictus wears black fur like a claim to rule. Its Stormvermin shove lesser rats aside, its warlords sell discipline as terror, and its merchants count every insult from Clan Mors as a debt to be repaid in stolen tunnels.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is proud-proud, crowded, and watched by rivals, so we must muster the black-fur packs before Clan Mors decides our teeth look too sharp.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.348.a:0 "Muster the black-fur packs."

 war_unique_intro_events.349.t:0 "Bait Pits of Krizzor"
 war_unique_intro_events.349.d:0 "Clan Krizzor knows that every monster has a hunger, and every hunger can be pointed. Pig-blood pits, slave lures, Moulder specimen cages, and Dark Lands trap warrens give its packmasters a business that smells like fear.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is baited, caged, and ready to snap, so we must open the bait pits and let softer enemies learn which scent brought them here.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.349.a:0 "Open the bait pits."

 war_unique_intro_events.350.t:0 "The Torrent-Gates of Zhufbar"
 war_unique_intro_events.350.d:0 "Zhufbar is the sound of falling water put to work. The Torrent-Gates thunder beside drop-hammers, guild engines, cannon foundries, and machine shops whose masters believe a problem not solved by craft has not yet been properly measured.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is industrial, proud, and ringed by old dangers, so we must set the waterwheels turning until every hold hears Zhufbar's hammers again.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.350.a:0 "Set the waterwheels turning."

 war_unique_intro_events.351.t:0 "Horns of the Black Mountains"
 war_unique_intro_events.351.d:0 "Karak Hirn is the Hornhold, a younger hold by Dawi memory but no less stubborn for it. Its horns carry warnings across the Black Mountains, its overroads draw merchants from Tilea and the Empire, and its smiths arm clans who know every pass can become a battlefield.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is exposed, commercial, and worth defending, so we must sound the Hornhold before enemies mistake trade roads for weakness.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.351.a:0 "Sound the Hornhold."

 war_unique_intro_events.352.t:0 "Bilge-Rats of Clan Skurvy"
 war_unique_intro_events.352.d:0 "Clan Skurvy has learned that ships are just floating warrens with better plunder. Its bilge-rats chew through hulls, whisper to mutineers, sell wet loot twice, and swear that the Horned Rat approves of any sea-lane that ends in squealing panic.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is wet-wet, profitable, and full of soft floating targets, so we must gnaw the sea-lanes before honest pirates notice rats got there first.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.352.a:0 "Gnaw the sea-lanes."

 war_unique_intro_events.353.t:0 "Stolen Forges of Ferrik"
 war_unique_intro_events.353.d:0 "Clan Ferrik squats over stolen forges and calls theft industry. Dwarf slaves drag ore, Skryre envoys buy metal with suspicious smiles, and steel-masked warlords promise that iron is better than courage because it can be hammered onto cowards.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is hot, stolen, and useful, so we must feed the stolen forges until every rival smells rust and envy.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.353.a:0 "Feed the stolen forges."

 war_unique_intro_events.354.t:0 "Sparks under Foul Peak"
 war_unique_intro_events.354.d:0 "Clan Ektrik trusts sparks more than promises, which is sensible for Skaven. Bronze armor hums in its tunnels, slave-for-warpcraft pacts feed Foul Peak workshops, and every apprentice learns that a live test subject is only a dead one waiting for data.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is bright-bright, lethal, and one bad wire from glory, so we must charge the warp-sparks before another clan steals the invention and calls us dead fools.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.354.a:0 "Charge the warp-sparks."

 war_unique_intro_events.355.t:0 "The Rot of Karak Gnol"
 war_unique_intro_events.355.d:0 "Clan Fester keeps sacred memories in pus, rot, and old stories of the Black Death. Its monks bless fever, its warriors cough like drums, and the ruins of Karak Gnol provide stones dark enough to make disease feel like inheritance.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is foul, holy, and crowded with unbelievers, so we must spread the blessed rot until even rival Skaven step aside coughing.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.355.a:0 "Spread the blessed rot."

 war_unique_intro_events.356.t:0 "Scrap Kings of the Middenheap"
 war_unique_intro_events.356.d:0 "Clan Skrapp can build a kingdom from refuse if given enough nails and panic. Middenheap markets, scavenged gears, bone bribes, back-tunnel informants, and clawpacks cheap enough to spend twice give its bosses a talent for ugly usefulness.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is cheap-cheap and full of hidden value, so we must count the scrap twice before some cleaner fool throws away our future.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.356.a:0 "Count the scrap twice."

 war_unique_intro_events.357.t:0 "Thunderhorns of Karak Grom"
 war_unique_intro_events.357.d:0 "Karak Grom answers danger with horns deep enough to make stone remember. Its Vault roads carry wardens, caravans, and grudges between high gates, while oath-halls beneath the echoes keep every clan mindful that silence is rarely good news.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is resonant, isolated, and watched from the passes, so we must answer the thunderhorns and make every echo sound like a muster.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.357.a:0 "Answer the thunderhorns."

 war_unique_intro_events.358.t:0 "Copper Mountain Holds"
 war_unique_intro_events.358.d:0 "Karak Izor, the Copper Mountain, stands as the proudest of the western holds. Copper veins, refugee lineages, royal authority, and Vault Underway works all run through its halls, where every ingot is both trade good and promise of another cannon.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is wealthy, defensible, and burdened by expectation, so we must guard the copper halls before lesser powers learn what our metal is worth.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.358.a:0 "Guard the copper halls."

 war_unique_intro_events.359.t:0 "Whispering Aspen Mountain"
 war_unique_intro_events.359.d:0 "Karak Eksfilaz listens to leaves as carefully as ledgers. From Whispering Aspen Mountain, its merchants and crossbow galleries watch the western roads toward Tilea, where caravans bring profit, rumors, and trouble wearing polite boots.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is open, profitable, and too far west to trust luck, so we must watch the western road and make every passing bargain answer to the hold.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.359.a:0 "Watch the western road."

 war_unique_intro_events.360.t:0 "Marble Layers of the High Hold"
 war_unique_intro_events.360.d:0 "Karak Kaferkammaz rises higher than comfort and claims that height as virtue. Marble layers, ore seams, metalworkers, shrine-cutters, and high-hold hammerers carve strength from a mountain where breath is thin and pride is not.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is steep, rich, and difficult to reach, so we must hold the marble heights until the Vaults remember who watches from above.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.360.a:0 "Hold the marble heights."

 war_unique_intro_events.361.t:0 "The Red Eye Opens"
 war_unique_intro_events.361.d:0 "The Red Eye hides in old Dwarf stone and laughs in the dark. Night Goblins daub red signs over stolen gates, brew fungus stink in side tunnels, and raid toward the eastern Empire whenever the Bad Moon looks like it wants entertainment.\n\nGreenskins live through fighting. Peace makes them poor, bored, quarrelsome, and stupid in ways even other Greenskins find annoying; war gives them loot, noise, direction, and someone else to blame when the cooking fires run low.\n\nA tribe becomes dangerous when its bosses can aim the shouting outward. Shamans find omens in smoke, squigs, teeth, mushrooms, and headaches, while mobs of Orcs and Goblins decide that any road, fort, shrine, caravan, or neighbor is better after being hit.\n\nNight Goblins add their own cheerful problems: caves, fungus, bad moons, squig pits, poison, fanatics, grudges against Dwarfs, and a talent for turning old tunnels into traps that smell worse than the enemy expected.\n\nFightiness is not a metaphor to the tribes. It is the pressure that keeps the lads moving, the threat that keeps rivals useful, and the difference between a proper Waaagh and a camp full of sulking gits hitting each other because nobody found a better target.\n\nThe situation is dark, sneaky, and begging for a proper scrap, so we must daub the eye red and make every old Dawi doorway belong to goblin spite.\n\nA tribe cannot remain stable for long, so we must find enemies, win scraps, take trophies, and keep the lads too busy roaring forward to notice how many knives are waiting behind the boss.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase Fightiness.§!"
 war_unique_intro_events.361.a:0 "Daub the eye red."

 war_unique_intro_events.362.t:0 "Gritus in the Jungle Warrens"
 war_unique_intro_events.362.d:0 "Clan Gritus smells opportunity through jungle steam. Its warrens creep along the isthmus, weaker clans vanish into its ledgers, and Lustrian spoil routes carry gold, stone tablets, feathers, and lies back to bosses who call scavenging strategy.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is green, wet, and full of stronger enemies, so we must snatch the green spoils before the jungle or our allies eat them.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.362.a:0 "Snatch the green spoils."

 war_unique_intro_events.363.t:0 "Mercenary Rats of Mange"
 war_unique_intro_events.363.d:0 "Clan Mange treats loyalty as a contract written on meat and revised after payment. Mangy veterans, hireling clawpacks, contract warrens, and bone-pay ledgers keep its warriors marching for whichever patron seems least likely to survive the invoice.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is hire-hire, filthy, and full of wars that need bodies, so we must sell the next swarm before the buyer asks what happened to the last one.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.363.a:0 "Sell the next swarm."

 war_unique_intro_events.364.t:0 "The Barren Hold Endures"
 war_unique_intro_events.364.d:0 "Karak Norn watches the forest from stony heights where the earth gives little without argument. Hadora Ironpick's legacy, Grey Mountain mines, New Bugman's Brewery, and dour shieldwalls bind a hold that has learned to prosper without pretending the world is kind.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is barren, forest-shadowed, and stubborn, so we must hold above the forest and prove scarcity can still raise a throng.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.364.a:0 "Hold above the forest."

 war_unique_intro_events.365.t:0 "Iron Peak of Karak Azul"
 war_unique_intro_events.365.d:0 "Karak Azul is the Iron Peak, and it intends everyone to remember why. Its plateaus hold rich veins, weaponsmiths, runesmiths, ledgers, and armories whose work can decide wars before the first insult is properly recorded.\n\nThe Dawi remember their golden mountain empire as obligation, not nostalgia. Karaks, underway roads, mines, forges, guild halls, oath-stones, and ancestor shrines once formed a realm of stone and iron whose order seemed as permanent as the mountains themselves.\n\nThen came the War of the Beard, the Time of Woes, earthquakes, Greenskin invasions, Skaven infestations, broken roads, lost holds, and grudges too numerous for any honest hand to close the Dammaz Kron. The Karaz Ankor did not vanish, but it retreated into embattled holds and stubborn memory.\n\nA hold survives by more than thick gates. Kings, thanes, runesmiths, engineers, guildmasters, clans, miners, rangers, and shieldwalls must agree that endurance alone is not enough. Roads must be cleared, forges rekindled, grudges settled, and pride made useful before it hardens into silence.\n\nEvery neighboring danger knows the old realm is wounded. Goblins creep into abandoned halls, Skaven gnaw through the roots of the world, men bargain over roads Dwarfs carved, and old allies remember Dawi strength most clearly when they need something repaired or defended.\n\nThe situation is iron-rich, disciplined, and watched by every enemy below the mountains, so we must stoke the Iron Peak and arm the grudges to come.\n\nThe mountains endure, but endurance has never meant passivity. The Dawi must hammer survival into restoration, restore craft into power, and make every oath a tool sharp enough to carve the future from stone."
 war_unique_intro_events.365.a:0 "Stoke the Iron Peak."

 war_unique_intro_events.366.t:0 "Ash-Warrens of Clan Volkn"
 war_unique_intro_events.366.d:0 "Clan Volkn lives where other rats cough, burn, and die. Ash warrens, hot stone tunnels, flame rites, and fire-hardened clawpacks give its bosses the confidence of creatures who think lava is only bad footing for weaker paws.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is hot-hot, choking, and full of opportunities that cannot survive open air, so we must run through the lava-dark while rivals search for cooler excuses.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.366.a:0 "Run through the lava-dark."

 war_unique_intro_events.367.t:0 "Red Discipline of Clan Mors"
 war_unique_intro_events.367.d:0 "Clan Mors is frightening because it can almost be trusted by Skaven standards. Red banners, hard-drilled clawpacks, Stormvermin pride, and warlords who punish failure before betrayal make its rivals whisper that order itself has learned to squeak.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is ambitious, disciplined, and surrounded by jealous cowards, so we must drive the red swarms until every tunnel decides Clan Mors is easier to obey than resist.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.367.a:0 "Drive the red swarms."

 war_unique_intro_events.368.t:0 "Knives of Clan Eshin"
 war_unique_intro_events.368.d:0 "Clan Eshin learned patience in distant shadows and returned with knives quieter than Skaven politics should allow. Night runners, gutter runners, contract killers, stolen plans, and masked masters make its warrens valuable to every lord who claims not to fear them.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is silent, profitable, and filled with clients who must never become comfortable, so we must vanish before dawn and leave only the bill.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.368.a:0 "Vanish before dawn."

 war_unique_intro_events.369.t:0 "Blackbelly Fever Contracts"
 war_unique_intro_events.369.d:0 "Clan Morbidus knows disease is better when someone else pays for delivery. Blackbelly Fever, Moulder pox-beasts, plague contracts, and contaminated Grey Mountain routes let its brokers sell misery as if it were any other useful service.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is feverish, well-funded, and morally excellent by Skaven standards, so we must sell the fever before the buyer realizes contagion ignores signatures.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.369.a:0 "Sell the fever."

 war_unique_intro_events.370.t:0 "Corpse Markets of Carrion"
 war_unique_intro_events.370.d:0 "Clan Carrion follows battles the way merchants follow fairs. Corpse heaps, bone carts, vulture signs, scavenger clawpacks, and afterbattle informants teach its bosses that the dead are quiet customers but excellent suppliers.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is stinking, useful, and always replenished by surface stupidity, so we must strip the dead fast before the owners stop twitching or a rival claims inventory.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.370.a:0 "Strip the dead fast."

 war_unique_intro_events.371.t:0 "Scab-Fur Warrens"
 war_unique_intro_events.371.d:0 "Clan Skab does not need elegance when it has bodies. Scab-fur clawpacks, skinflint quartermasters, scratch tunnels, and boss-claw bullying keep the warrens moving by reminding every rat that someone worse is behind him.\n\nYes-yes, the Skaven are the future rulers of the world, and every sensible rat knows it until a stronger rat says otherwise. Warrens, gnawholes, slave pits, breeding nests, workshops, plague dens, assassin tunnels, and council schemes stretch beneath the blind surface-things.\n\nThe Under-Empire is not orderly in any weak-soft sense. Warlords betray grey seers, engineers sell inventions before they explode, plague priests bless filth, assassins invoice murder, packmasters count teeth, and every claw reaches upward while pretending obedience.\n\nThat chaos is also strength. Skaven multiply fast-fast, steal without shame, learn by accidents that kill assistants, and turn cowardice into tactical wisdom. If one plan fails, another rat claims it was bait; if one army dies, another swarm is already chewing through the tunnel behind it.\n\nThe surface is rich, stupid, and badly supported from below. Dwarf holds, human cities, Lizardmen temples, Elven colonies, Ogre roads, and Cathayan walls all rest above darkness where the Horned Rat's children listen, dig, scheme, and wait for the moment to rise.\n\nThe situation is ugly, numerous, and good enough to win if spent correctly, so we must push the scab swarms until quality stops mattering.\n\nDanger remains everywhere, especially from other Skaven. Rival clans, Council demands, hunger, warpstone, experimental weapons, plague, unpaid assassins, and panicked underlings will destroy any lord who mistakes survival for loyalty.\n\nNow-now is the time to build-build, steal-steal, breed-breed, and conquer-kill. The Under-Empire will not rise because it is ready; it will rise because every rival fears being the last to move."
 war_unique_intro_events.371.a:0 "Push the scab swarms."

