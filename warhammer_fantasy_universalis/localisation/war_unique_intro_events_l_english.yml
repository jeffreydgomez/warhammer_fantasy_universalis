 war_unique_intro_events.541.t:0 "Bodh Gaya's Bound Leaves"
 war_unique_intro_events.541.d:0 "Bodh Gaya shelters a human Khureshi exile kingdom where palm leaves are written, bound, traded, and argued over as a public art. Scriptoria, family workshops, and shrine clerks turn fibre into law, memory, and barter.\n\nThe Bodh Gayan people stand where Indish custom, Khureshi memory, and Cathayan enclaves meet, and public life is shaped by the Thousand Gods in court, shrine, camp, and market. Excess leaves and copied texts go east for rice and paper, and those exchanges help Singha's road wardens keep the invasion route from becoming an open wound.\n\nAcross Eastern Ind, there is no passive frontier for Bodh Gaya. The public worship of serpentine gods must be managed through hard ascetic forms, because Slaanesh's indulgence and Naga blood sorcery both know how to wear holy masks. We must bind the leaves, discipline the shrines, and make exile into a law strong enough to survive its neighbours."
 war_unique_intro_events.541.a:0 "Bind the palm leaves."

