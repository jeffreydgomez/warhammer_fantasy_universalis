 war_culture_and_religion_events.31.d:0 "The shouty shamans of Gork and Mork have called for the raising of the biggest idol, drawing the faithful into muddy camps and stolen squares. Green paint, broken teeth, and huge fists move through the crowd while magistrates measure how much authority should stand behind the ceremony.\n\nPatronage would turn devotion into visible strength. Wardens could bind the rite to law before enthusiasm spills into the streets. A lighter hand would spare coin, though the faithful will remember who stood nearest the altar."
