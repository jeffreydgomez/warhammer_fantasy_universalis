 war_culture_and_religion_events.27.a:0 "Fund the sacred rite."
 war_culture_and_religion_events.27.b:0 "Appoint temple wardens."
 war_culture_and_religion_events.27.c:0 "Keep a measured hand."

 war_culture_and_religion_events.28.t:0 "Rivals Beneath One Star"
 war_culture_and_religion_events.28.d:0 "Whispers spread through war camps under a trembling star as followers of Chaos Undivided argue over which god may lead without breaking the pact. The words are soft, but they move through the court with the confidence of knives.\n\nAn inquiry could find who profits from the quarrel. Public penance would make an example without naming too many names.\n\nThe priests claim they can settle it alone. That may even be true."
 war_culture_and_religion_events.28.a:0 "Investigate the whispers."
 war_culture_and_religion_events.28.b:0 "Demand public penance."
 war_culture_and_religion_events.28.c:0 "Leave it to the priests."

 war_culture_and_religion_events.29.t:0 "Smoke Before the Father of Darkness"
 war_culture_and_religion_events.29.d:0 "The chain-scribes of Hashut say the time has come for a furnace prayer to the Father of Darkness. Their summons fills soot temples and counting pits with brass masks and slave tallies, petitions, and careful watching.\n\nSupporting the ceremony would show unity without needing a sermon from the throne. Binding it to wardens would keep the rite useful and disciplined. Refusing excess may please the accountants, but piety has a long memory."
 war_culture_and_religion_events.29.a:0 "Fund the sacred rite."
 war_culture_and_religion_events.29.b:0 "Appoint temple wardens."
 war_culture_and_religion_events.29.c:0 "Keep a measured hand."

 war_culture_and_religion_events.30.t:0 "The Chain-Scribes Argue"
 war_culture_and_religion_events.30.d:0 "The faithful of Hashut have split over whether tribute should be measured in coin, labor, or screams. In soot temples and counting pits, brass masks and slave tallies now mark rival gatherings that pretend to be ordinary devotions.\n\nCalming the faithful would be costly but clean. Offerings could turn disorder into revenue if handled carefully. Lay wardens might keep tempers useful, while patience leaves the matter to fade or harden."
 war_culture_and_religion_events.30.a:0 "Calm the faithful."
 war_culture_and_religion_events.30.b:0 "Gather the offerings."
 war_culture_and_religion_events.30.c:0 "Name lay wardens."
 war_culture_and_religion_events.30.dd:0 "Let the matter fade."

