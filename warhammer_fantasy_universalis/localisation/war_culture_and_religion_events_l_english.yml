 war_culture_and_religion_events.144.t:0 "Loren's Hidden Paths"
 war_culture_and_religion_events.144.d:0 "The Asrai glade envoys, waywatchers, and spirit speakers have brought hunting rights, spirit pacts, and forest paths into moonlit clearings, waystone circles, and living paths. Loren envoys speak softly because Athel Loren does not need raised voices to threaten outsiders.\n\nThe forest remembers rulings as injuries or offerings, and its silence is often more dangerous than a shouted refusal. The choices before the court are plain enough: back the local voices, strike a careful bargain, bury it in records, or let the matter fade, and the Asrai will remember which answer was chosen."
