 war_culture_and_religion_events.64.a:0 "Investigate the whispers."
 war_culture_and_religion_events.64.b:0 "Demand public penance."
 war_culture_and_religion_events.64.c:0 "Leave it to the priests."

 war_culture_and_religion_events.65.t:0 "Garlands for a Thousand Gods"
 war_culture_and_religion_events.65.d:0 "The temple accountants of the Thousand Gods say the time has come for garlands for a crowd of gods. Their summons fills vast temple markets and river ghats with flower ropes and jeweled idols, petitions, and careful watching.\n\nSupporting the ceremony would show unity without needing a sermon from the throne. Binding it to wardens would keep the rite useful and disciplined. Refusing excess may please the accountants, but piety has a long memory."
 war_culture_and_religion_events.65.a:0 "Fund the sacred rite."
 war_culture_and_religion_events.65.b:0 "Appoint temple wardens."
 war_culture_and_religion_events.65.c:0 "Keep a measured hand."

 war_culture_and_religion_events.66.t:0 "Which God Gets the Gate"
 war_culture_and_religion_events.66.d:0 "The faithful of the Thousand Gods have split over which god should receive the gate tax. In vast temple markets and river ghats, flower ropes and jeweled idols now mark rival gatherings that pretend to be ordinary devotions.\n\nCalming the faithful would be costly but clean. Offerings could turn disorder into revenue if handled carefully. Lay wardens might keep tempers useful, while patience leaves the matter to fade or harden."
 war_culture_and_religion_events.66.a:0 "Calm the faithful."
 war_culture_and_religion_events.66.b:0 "Gather the offerings."
 war_culture_and_religion_events.66.c:0 "Name lay wardens."
 war_culture_and_religion_events.66.dd:0 "Let the matter fade."
