add_all_elf_culture_tt:0 "Add all Elven Culture as accepted cultures."

war_unite_all_elvenkind_title:0 "Unite All Elvenkind"
war_unite_all_elvenkind_desc:0 "For millennia, the Elves have stood divided—Asur, Druchii, Asrai, and others—each walking their own path through the long night of the world. Yet now, by blade and bond, we have achieved what once seemed a dream: the reunification of our shattered kin. With the sacred groves of Athel Loren, the spires of Lothern, and the dark towers of Naggarond under our banner, and with nearly all of elvenkind either bound to us in loyalty or brought low in conquest, a new age dawns. Let the world tremble before the united might of the Elves."

united_all_elvenkind:0 "United All Elvenkind"
desc_united_all_elvenkind:0 "Through conquest, diplomacy, and unyielding will, we have done what no Elf-lord has achieved since the ancient days of the Old Ones: we have brought all Elven nations together under one rule. Our unity rekindles lost glories, strengthens our ancient magics, and inspires awe and dread across the world."


 asur_events.1001.t:0 "The Sea Fortresses of the Asur"
 asur_events.1001.d:0 "Far from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. Citadel of Dusk, Fortress of Dawn, the Tower of the Sun, the Tower of the Stars, Elithis, and lesser harbors beyond counting guard the routes by which treasure, news, armies, and omens move between continents.\n\nThese are not mere trading posts. Their captains maintain waystones, chart monsoon winds, watch the rites of Cadai, and keep towers bright against pirates, monsters, storms, and the slow weariness of distance. Every colony is a fortress, shrine, counting house, and listening post joined into one.\n\nAround them lie lands too rich and dangerous to ignore. Ind offers spices, temples, Tigerfolk courts, and jungles that remember blood. Khuresh coils with serpent cults and hidden gods. Cathay measures every embassy with imperial patience, while Nippon's broken islands send war, trade, and rumor across the sea.\n\nUlthuan should be the heart to which all these far places answer, but Ulthuan is divided. The Phoenix King's call, the Everqueen's warning, and the pride of ancient houses have turned the homeland inward. A distant prince or sea lord can no longer assume that help will arrive before the walls are tested.\n\nDistance changes even the long-lived. The colonies must decide whether they remain sentinels of a fading center, or become the hands by which the Asur grasp the wider world again. Across the seas, elven destiny has not ended. It has merely moved beyond sight of home."
 asur_events.1001.a:0 "Across the seas, our watch endures."

 asur_events.8.t:0 "The Missing Cargo at the Quay"
 asur_events.8.d:0 "A harbor clerk in [Root.Capital.GetName] notices that three ships have declared the same chest of pearls. When she checks the warehouses, only one chest is present, bearing the seal of a well-connected merchant. The clerk has kept copies of all three manifests before reporting the discrepancy.\n\nThe merchant blames tired clerks and offers to correct the records privately. The harbor master brings the manifests to court before the next convoy arrives, asking who will be allowed to inspect the merchant's books."
 asur_events.8.a:0 "Audit the manifests and collect the missing duties."
 asur_events.8.b:0 "Require the merchant to acknowledge our authority publicly."
 asur_events.8.c:0 "Negotiate disclosure and compile the corrected records."

 asur_events.9.t:0 "The Waystone's Broken Rhythm"
 asur_events.9.d:0 "A mage tending the colony's waystone hears its usual pulse falter during the evening watch. She finds a hairline fracture beneath the moss and sends an apprentice to compare the oldest maintenance records.\n\nThe apprentice discovers that a similar disturbance preceded a storm that damaged the settlement centuries ago. The mage brings both the record and a rubbing of the crack to the council, asking for support before attempting further work."
 asur_events.9.a:0 "Fund the repairs and restore confidence in the wards."
 asur_events.9.b:0 "Exchange findings with other mages to advance our research."

 asur_events.10.t:0 "The Pilot's Revised Charts"
 asur_events.10.d:0 "A returning pilot lays a revised monsoon chart before the captains at [Root.Capital.GetName]. It marks a seasonal passage through reefs where two merchant ships were previously lost.\n\nThe pilot has recorded soundings and wind changes on every leg of the voyage. Captains request copies for their crews, while the harbor merchants ask to buy exclusive access before word reaches competing ports."
 asur_events.10.a:0 "Fund exploratory voyages using the new charts."
 asur_events.10.b:0 "Train our crews to sail the passage with confidence."
 asur_events.10.c:0 "Sell exclusive copies to our licensed merchants."
 asur_events.10.dd:0 "Place the charts in the harbor's navigation archive."

 asur_events.11.t:0 "Corsair Boats Inside the Reef"
 asur_events.11.d:0 "A courier reaches [event_target.GetName] with survivors from a fishing boat attacked offshore. They saw Dark Elf boats entering a gap in the reef behind a merchant vessel.\n\nThe coastal commander finds abandoned landing gear on an outer beach and sends a warning inland. Families flee the exposed shore, while shipwrights ask for protection and workshops farther from the landing places."
 asur_events.11.a:0 "Muster a costly defense and rally the fleet."
 asur_events.11.b:0 "Fund replacement workshops behind the damaged waterfront."
 asur_events.11.c:0 "Pay for evacuation and emergency supplies."

 asur_events.12.t:0 "The Shrine Revealed by Low Tide"
 asur_events.12.d:0 "An unusually low tide exposes carved steps leading to a shrine of Mathlann beside the reef. A sailor brings back a votive plaque, and a priest recognizes prayers still used before ocean voyages.\n\nScholars ask to examine the steps before the water returns. Meanwhile, crews begin leaving offerings along the shore, and the priest requests guards and supplies to establish regular rites at the recovered shrine."
 asur_events.12.a:0 "Fund the rites and assign troops to protect the priests."
 asur_events.12.b:0 "Open the site to visiting scholars and share the findings."
 asur_events.12.c:0 "Invite the arriving sailors into naval service."

 asur_events.13.t:0 "Two Orders from Ulthuan"
 asur_events.13.d:0 "A dispatch ship delivers two sealed orders from Ulthuan, each claiming precedence over the colony's next convoy. One calls for ships to return home, while the other insists they remain available to protect overseas routes.\n\nOne captain recognizes an official whose name appears on both dispatches, in different capacities. He cannot tell whether the appointment changed during the voyage or whether the rival courts each still claim his service.\n\nThe harbor commander lays both letters before [Root.Monarch.GetName]. By their dates, neither sender can have known what the other demanded, and the convoy captains need a decision before the sailing season closes."
 asur_events.13.a:0 "Seek a formal ruling and reaffirm our lawful authority."
 asur_events.13.b:0 "Let the local commanders decide and prepare their own plans."

 asur_events.14.t:0 "The Skink Envoy's Boundary Stones"
 asur_events.14.d:0 "A Skink envoy arrives at the colony gate carrying a broken plaque and three stones taken from the edge of our works. Through gestures and an interpreter, he claims that our builders have crossed an ancient boundary.\n\nThe interpreter matches the plaque's marks to a carving on a stone already removed by the builders. The surveyor had recorded it as an ordinary obstacle and ordered it broken for road fill.\n\nThe chief surveyor confirms that the stones stood where a new road was marked out. The envoy refuses to leave until the council answers, and Saurus guards remain visible beyond the cleared ground."
 asur_events.14.a:0 "Pay to resolve the boundary dispute respectfully."
 asur_events.14.b:0 "Study the plaque and negotiate its meaning."
 asur_events.14.c:0 "Keep the road and collect the proceeds from the works."

 asur_events.15.t:0 "The Beacon Keeper's Inspection"
 asur_events.15.d:0 "A beacon keeper reports that salt has clouded the signal mirrors and rotted the supports beneath a coastal battery. During the last night watch, a patrol ship mistook its weak light for a fisher's lamp.\n\nThe fleet's engineers inspect the site and propose repairs alongside better training for the crews. They bring the estimate to [Root.Capital.GetName] before the next storm makes work on the headland impossible."
 asur_events.15.a:0 "Fund the batteries and train engineers for siege work."
 asur_events.15.b:0 "Transfer recruits to the fleet's beacon and gunnery crews."
 asur_events.15.c:0 "Agree on new navigation signals with the captains."
 asur_events.15.dd:0 "Record the defects and negotiate revised maintenance duties."

 asur_events.16.t:0 "The Empty Diving Boats"
 asur_events.16.d:0 "Two pearl boats drift back to [Root.Capital.GetName] with their diving ropes cut beneath the waterline. A surviving boatman says a light appeared below the reef before the divers failed to surface.\n\nTheir families gather at the landing and demand that the beds be searched. The harbor master has closed the anchorage, but captains press him to reopen it before the pearl season ends."
 asur_events.16.a:0 "Fund a search and negotiate support for the families."
 asur_events.16.b:0 "Abandon the search and accept the loss of the divers."

 asur_events.17.t:0 "A Signal Misread Between Fortresses"
 asur_events.17.d:0 "A sister Asur fortress sends a formal complaint after one of our signal stations directs its convoy toward a closed passage. Our beacon keeper insists that the visitors were using an outdated signal book.\n\nBoth sets of instructions arrive at [Root.Capital.GetName], and the disputed signal has a different meaning in each. The convoy captain demands a settlement before either fortress sends ships along the shared route again."
 asur_events.17.a:0 "Hold joint exercises and open access to the signal books."
 asur_events.17.b:0 "Negotiate a common code with the sister fortress."
 asur_events.17.c:0 "Pay for an internal review and restrict further interference."

### BEGIN GENERATED WARHAMMER RELIGION RANDOM EVENTS
### Warhammer Religion Random Events
 war_culture_and_religion_events.1.t:0 "The Vigil at Whitewater Chapel"
 war_culture_and_religion_events.1.d:0 "A Damsel of the Lady arrives at Whitewater Chapel near [Root.Capital.GetName] and calls for a night of prayer beside its spring. A wounded knight has left his sword at the altar, claiming the water restored feeling to his injured hand.\n\nThe knight's squire confirms that his master could not grip a rein when they arrived. He also admits that the wound had begun improving before they reached the spring, giving the chapel keeper reason to hear both accounts carefully.\n\nPilgrims gather faster than the chapel can house them, and its keeper asks for bread, candles, and guards. By evening, families are sleeping along the road while the Damsel prepares to address those who still doubt the Lady's power."
 war_culture_and_religion_events.1.a:0 "Fund the Damsel's preaching and assign an armed escort."
 war_culture_and_religion_events.1.b:0 "Negotiate shared access to the chapel for the faithful."
 war_culture_and_religion_events.1.c:0 "Have officials register the pilgrims and organize lodging."

 war_culture_and_religion_events.2.t:0 "The Knight Who Spared a Bandit"
 war_culture_and_religion_events.2.d:0 "A knight brings a captured bandit to a chapel of the Lady and asks the keeper to witness a promise of mercy. The bandit had surrendered after revealing where his companions held several missing children.\n\nThe children's lord demands an execution, arguing that the knight had no right to bargain in his name. Their followers gather outside the chapel, and both men ask [Root.Monarch.GetName] to judge the oath."
 war_culture_and_religion_events.2.a:0 "Pay restitution and uphold the settlement, despite outside criticism."
 war_culture_and_religion_events.2.b:0 "Hear both claims privately and leave the public dispute unresolved."

 war_culture_and_religion_events.3.t:0 "The Veteran at Myrmidia's Altar"
 war_culture_and_religion_events.3.d:0 "A retired captain places a battered helmet before the altar of Myrmidia in [Root.Capital.GetName]. He credits a temple-taught maneuver with saving his company and offers to demonstrate it to new worshippers.\n\nThe high priest proposes a public ceremony and a series of sermons based on the captain's account. Young officers and their families crowd the courtyard, while the temple steward asks who will provide the funds and supervise the gathering."
 war_culture_and_religion_events.3.a:0 "Fund the preaching and grant the temple greater independence."
 war_culture_and_religion_events.3.b:0 "Bring the rival congregations together for the ceremony."
 war_culture_and_religion_events.3.c:0 "Record the veteran's account and organize the gathering."

 war_culture_and_religion_events.4.t:0 "The Preacher Who Challenged the High Priest"
 war_culture_and_religion_events.4.d:0 "An argument is boiling over in [Root.Capital.GetName]'s Temple of Myrmidia. The high priest insists that honor must guide the next war, but a young preacher claims Myrmidia appeared to him and placed sound strategy above every knightly vow.\n\nThe preacher names a retreat that saved a surrounded company as proof of his revelation. The high priest answers that the same retreat abandoned sworn allies, and veterans from both companies come forward to defend their memories.\n\nTheir followers have overturned stalls outside the temple and fought in the streets. The watch brings two injured apprentices before [Root.Monarch.GetName], along with the rival sermons that started the trouble."
 war_culture_and_religion_events.4.a:0 "Assign officers and informants to investigate the factions."
 war_culture_and_religion_events.4.b:0 "Pay for a public reconciliation that restores confidence in us."
 war_culture_and_religion_events.4.c:0 "Leave doctrine to the priests and tighten control of the market."

 war_culture_and_religion_events.5.t:0 "The First Loaf at Ursun's Shrine"
 war_culture_and_religion_events.5.d:0 "A baker brings the first loaf from the winter stores to Ursun's shrine in [Root.Capital.GetName]. The bear-priest breaks it before the congregation and finds spoiled flour beneath its crust.\n\nThe baker admits that poorer families have been using the same grain for weeks. The priest calls for a public distribution and asks able-bodied worshippers to leave their duties long enough to carry food to the outlying shrines."
 war_culture_and_religion_events.5.a:0 "Buy sound grain and release recruits for the priests' mission."
 war_culture_and_religion_events.5.b:0 "Agree on a common distribution through all Ursun's shrines."
 war_culture_and_religion_events.5.c:0 "Audit the stores and record which households need supplies."

 war_culture_and_religion_events.6.t:0 "The Bear Icon Removed from the Gate"
 war_culture_and_religion_events.6.d:0 "A visiting priest orders an old bear icon removed from a village gate because its rites are not approved by his superiors. The village keeper refuses, saying her family has tended it since before the priest's temple was built.\n\nVillagers return the icon after dark and drive the priest's attendants away with stones. The local commander asks [Root.Monarch.GetName] to intervene before soldiers are drawn into the quarrel."
 war_culture_and_religion_events.6.a:0 "Fund a settlement and release troops to keep the peace."
 war_culture_and_religion_events.6.b:0 "Confiscate the disputed offerings for the treasury."
 war_culture_and_religion_events.6.c:0 "Send recruits to serve as armed guardians of Ursun's rites."
 war_culture_and_religion_events.6.dd:0 "Let the village and temple settle the matter themselves."

 war_culture_and_religion_events.7.t:0 "The Hammers of the New Converts"
 war_culture_and_religion_events.7.d:0 "A smith in [Root.Capital.GetName] makes a dozen small hammers for converts attending the Temple of Sigmar. When the warrior priest blesses them, more petitioners arrive than the smith can supply. He brings his last iron stock to the temple to show why more cannot be made immediately.\n\nThe priest asks to send preachers into surrounding settlements while interest is strong. His steward brings a bill for food, travel, and additional symbols, along with complaints from neighboring cults about his sermons."
 war_culture_and_religion_events.7.a:0 "Fund the mission despite the other cults' objections."
 war_culture_and_religion_events.7.b:0 "Negotiate a common religious observance with the local temples."
 war_culture_and_religion_events.7.c:0 "Organize the donations and register the new congregation."

 war_culture_and_religion_events.8.t:0 "An Accusation at Sigmar's Temple"
 war_culture_and_religion_events.8.d:0 "A warrior priest interrupts a merchant's donation at the Temple of Sigmar and accuses him of harboring a corrupt sorcerer. The merchant names the supposed sorcerer as an accountant who exposed the priest's brother for theft.\n\nTemple guards bar the doors while witnesses argue over the ledgers. The watch commander brings the matter to [Root.Monarch.GetName], since neither side will accept an inquiry led by the other."
 war_culture_and_religion_events.8.a:0 "Fund a hearing and divert soldiers to enforce its ruling."
 war_culture_and_religion_events.8.b:0 "Question the witnesses privately while the accusation remains public."

 war_culture_and_religion_events.9.t:0 "Firewood for Ulric's Winter Rite"
 war_culture_and_religion_events.9.d:0 "The keeper of Ulric's temple finds its winter woodpile half empty after a storm destroys the storehouse roof. A veteran offers timber from his own hall so that the sacred fires need not go out.\n\nHis gift draws other worshippers, who ask the priests to carry the rite to neglected settlements. The keeper sends the growing list to [Root.Capital.GetName] and requests help organizing the fuel and preaching parties."
 war_culture_and_religion_events.9.a:0 "Fund the priests' journey and negotiate supplies."
 war_culture_and_religion_events.9.b:0 "Arrange a shared observance among Ulric's congregations."
 war_culture_and_religion_events.9.c:0 "Compile the fuel accounts and organize the deliveries."

 war_culture_and_religion_events.10.t:0 "The Priest Who Condemned the Truce"
 war_culture_and_religion_events.10.d:0 "A priest of Ulric denounces a local captain for negotiating the release of prisoners instead of fighting for them. He bars the captain from the temple until the supposed cowardice is confessed.\n\nThe freed prisoners gather outside to defend the man who brought them home. When worshippers attempt to drive them away, the captain requests a ruling from [Root.Monarch.GetName] before his soldiers intervene."
 war_culture_and_religion_events.10.a:0 "Investigate the priest through informants, despite the challenge to our authority."
 war_culture_and_religion_events.10.b:0 "Pay restitution and publicly reconcile the two sides."
 war_culture_and_religion_events.10.c:0 "Permit the new argument to be heard despite the scandal."

 war_culture_and_religion_events.11.t:0 "The Broken Antler at Taal's Grove"
 war_culture_and_religion_events.11.d:0 "A woodcutter finds a ceremonial antler snapped beside Taal's woodland altar and brings it to the grove's keeper. The keeper discovers cart tracks leading across the sacred ground into newly cleared fields.\n\nFarmers admit moving the boundary because they needed another strip for seed. Before the spring blessing, the keeper asks [Root.Capital.GetName] for materials, attendants, and help explaining the grove's obligations to the new households."
 war_culture_and_religion_events.11.a:0 "Fund the blessing and organize the priests' work."
 war_culture_and_religion_events.11.b:0 "Negotiate a shared settlement between grove and fields."
 war_culture_and_religion_events.11.c:0 "Survey the boundary and enter it in the local records."

 war_culture_and_religion_events.12.t:0 "The Taxman in the Sacred Wood"
 war_culture_and_religion_events.12.d:0 "A tax collector marks standing timber inside Taal's grove for sale against a village's arrears. The huntmaster removes his marks and ties the collector's measuring rod to the shrine door.\n\nForesters block the carts sent to collect the timber. The collector returns to [Root.Capital.GetName] with a cut hand, demanding that the government enforce a claim the villagers consider sacrilege."
 war_culture_and_religion_events.12.a:0 "Buy out the arrears and send men to keep the peace."
 war_culture_and_religion_events.12.b:0 "Collect the debt from the grove's offerings."
 war_culture_and_religion_events.12.c:0 "Assign recruits to an armed brotherhood protecting the grove."
 war_culture_and_religion_events.12.dd:0 "Leave the claim with the local authorities."

 war_culture_and_religion_events.13.t:0 "A Feast Shared by Three Temples"
 war_culture_and_religion_events.13.d:0 "The bakers of [Root.Capital.GetName] offer bread for Shallya's poor, Taal's spring blessing, and Morr's memorial meal on the same day. Their guildmaster proposes one public feast rather than three competing collections.\n\nPriests agree to attend, but the crowd will need space, food, and a clear order of ceremonies. The guildmaster brings the signed proposal to court after the first wagons arrive at the market."
 war_culture_and_religion_events.13.a:0 "Fund the feast and the temples' public teaching."
 war_culture_and_religion_events.13.b:0 "Agree on rites that all three congregations can share."
 war_culture_and_religion_events.13.c:0 "Put the feast's stores and duties into a common register."

 war_culture_and_religion_events.14.t:0 "The Funeral at the Market Shrine"
 war_culture_and_religion_events.14.d:0 "A priest of Morr asks the market shrine to silence its bells while a funeral passes. The local priest refuses, saying the bells announce a holy day that cannot be interrupted.\n\nThe mourners stop their procession across the market entrance. Shopkeepers send for the watch as both priests claim precedence, and the mayor asks [Root.Monarch.GetName] to settle the dispute."
 war_culture_and_religion_events.14.a:0 "Pay for a compromise and concede ceremonial authority to the priests."
 war_culture_and_religion_events.14.b:0 "Negotiate privately without issuing a public ruling."

 war_culture_and_religion_events.15.t:0 "The New Household's Blood Oath"
 war_culture_and_religion_events.15.d:0 "A newly admitted household presents its family seal at the night court and asks to join the ruler's blood rites. The officiant prepares a silver cup, but discovers that several servants refuse to enter the chamber.\n\nTheir master claims the household's oath binds everyone under its roof. The officiant suspends the ceremony and requests instructions from [Root.Monarch.GetName] before other households arrive to witness it."
 war_culture_and_religion_events.15.a:0 "Fund the court's proselytizers and negotiate the household's submission."
 war_culture_and_religion_events.15.b:0 "Agree on a common form of oath for the congregations."
 war_culture_and_religion_events.15.c:0 "Register exactly who is bound by the household oath."

 war_culture_and_religion_events.16.t:0 "The Contract Signed in Blood"
 war_culture_and_religion_events.16.d:0 "A creditor produces a blood-signed contract claiming the service of a debtor's children. The debtor insists he promised only his own labor and that the document changed after the rite.\n\nThe debtor's eldest child remembers watching the ink dry on a much shorter text. The creditor produces a witness who insists the full obligation was read aloud, but that witness is employed by his household.\n\nThe night court's officiant refuses to identify who prepared the ink. Both families bring witnesses to [Root.Capital.GetName], forcing the chamberlain to halt enforcement until the contract is examined."
 war_culture_and_religion_events.16.a:0 "Use informants to uncover the contract's preparation."
 war_culture_and_religion_events.16.b:0 "Pay compensation and demonstrate that our guarantees can be trusted."
 war_culture_and_religion_events.16.c:0 "Uphold the creditor's commercial privilege despite the scandal."

 war_culture_and_religion_events.17.t:0 "The Missing Skulls at the Brass Altar"
 war_culture_and_religion_events.17.d:0 "A keeper of Khorne's brass altar counts the trophies brought by a victorious warband and finds skulls stolen from an older offering. A warrior points out the same iron nails still fixed through their jaws.\n\nThe keeper demands a new dedication before the entire camp. Captains bring fresh trophies and recruits to witness the rite, but need supplies and an agreed order before the gathering turns into a brawl."
 war_culture_and_religion_events.17.a:0 "Fund the dedication and send priests through the camps."
 war_culture_and_religion_events.17.b:0 "Bind the warbands to a common rite of Khorne."
 war_culture_and_religion_events.17.c:0 "Record the offerings and assign each captain a place."

 war_culture_and_religion_events.18.t:0 "The Champion Who Rejected Surrender"
 war_culture_and_religion_events.18.d:0 "A champion of Khorne kills a prisoner whose surrender another captain had accepted. He declares that a victory ending with captives alive is an insult to the Blood God. Several captives are still bound beside the captain's plunder carts.\n\nThe captain's warriors surround the champion's altar and demand the return of their remaining prisoners. The dispute has stopped the division of plunder, and both factions await [Root.Monarch.GetName]'s judgment."
 war_culture_and_religion_events.18.a:0 "Pay off the disputed shares and let the troops disperse."
 war_culture_and_religion_events.18.b:0 "Take the prisoners' ransom into the treasury."
 war_culture_and_religion_events.18.c:0 "Dedicate recruits to the champion's bloody discipline."
 war_culture_and_religion_events.18.dd:0 "Let the captains resolve the quarrel."

 war_culture_and_religion_events.19.t:0 "The Hospice Garden's New Beds"
 war_culture_and_religion_events.19.d:0 "A keeper of Nurgle's hospice plants clippings from a diseased tree beside the patients' beds. By morning, the clippings have flowered and the patients are asking for the same treatment.\n\nThe keeper announces a blessing for anyone willing to tend the new growth. Followers fill the courtyard, and the steward requests money for bedding and preachers to carry news of the garden farther afield."
 war_culture_and_religion_events.19.a:0 "Fund the spreading cult despite outsiders' disgust."
 war_culture_and_religion_events.19.b:0 "Arrange shared rites among the competing plague congregations."
 war_culture_and_religion_events.19.c:0 "Organize the hospice's beds, stores, and attendants."

 war_culture_and_religion_events.20.t:0 "The Patient Who Asked for Relief"
 war_culture_and_religion_events.20.d:0 "A patient at Nurgle's hospice begs an attendant to ease the pain of a swollen limb. The attendant prepares a remedy, but the senior keeper seizes it and calls relief an insult to the god's gift.\n\nOther patients take sides as the two argue beside the bed. The hospice closes its gates, and relatives bring the unfinished remedy to [Root.Capital.GetName] asking for a decision."
 war_culture_and_religion_events.20.a:0 "Fund a settlement and allow outside remedies into the hospice."
 war_culture_and_religion_events.20.b:0 "Hear the attendants privately while the public quarrel continues."

 war_culture_and_religion_events.21.t:0 "The Candle That Rewrote the Prayer"
 war_culture_and_religion_events.21.d:0 "An acolyte of Tzeentch lights a blue candle while copying a prayer, and the finished lines change beneath his hand. His master repeats the experiment before witnesses and gets a different text each time.\n\nWorshippers queue outside the tower hoping for a message meant for them. The master asks the court to purchase more of the rare wax and support readers who can interpret the changing prayers."
 war_culture_and_religion_events.21.a:0 "Purchase the wax and fund the interpreters' preaching."
 war_culture_and_religion_events.21.b:0 "Agree on a common observance for the rival readers."
 war_culture_and_religion_events.21.c:0 "Catalog the copies and organize access to the chamber."

 war_culture_and_religion_events.22.t:0 "Two Prophets Name the Same Betrayer"
 war_culture_and_religion_events.22.d:0 "Two prophets of Tzeentch independently accuse the same court servant of a betrayal that has not yet occurred. The servant produces letters showing that both prophets tried to hire him last week.\n\nThe letters offer the servant different rewards for opening the same locked archive. One promises protection from the very accusation the prophets have now made against him.\n\nTheir disciples seize the letters and each claims the other forged them. The chamberlain locks the servant in a guarded room until [Root.Monarch.GetName] decides who may question him."
 war_culture_and_religion_events.22.a:0 "Build an informer network around the accepted prophecy."
 war_culture_and_religion_events.22.b:0 "Pay for a public hearing and restore trust in our court."
 war_culture_and_religion_events.22.c:0 "Accept the prophets' armed followers and leave the accusation unsettled."

 war_culture_and_religion_events.23.t:0 "The Singer at the House of Six Mirrors"
 war_culture_and_religion_events.23.d:0 "A singer dedicates a new litany to Slaanesh at the House of Six Mirrors and refuses to stop when the ceremony ends. Listeners remain through the night, abandoning meals and duties to hear it again.\n\nThe hierophant orders extra attendants into the hall and asks the court for money to stage further performances. By morning, waiting worshippers have filled the street and begun repeating the song to newcomers."
 war_culture_and_religion_events.23.a:0 "Fund further performances and organize the cult's expansion."
 war_culture_and_religion_events.23.b:0 "Bring the competing congregations into one observance."
 war_culture_and_religion_events.23.c:0 "Register attendance and arrange the hall's supplies."

 war_culture_and_religion_events.24.t:0 "The Choir's Locked Doors"
 war_culture_and_religion_events.24.d:0 "The master of a Slaaneshi choir locks the rehearsal hall until his singers achieve a passage he calls perfect. An exhausted singer escapes through a window and collapses in the street.\n\nHer companions' families gather at the doors, while devoted listeners insist the work must continue. The watch brings the singer to court as the master demands protection from interference."
 war_culture_and_religion_events.24.a:0 "Pay to release the singers and concede the master's ceremonial rank."
 war_culture_and_religion_events.24.b:0 "Collect a levy from the wealthy listeners."
 war_culture_and_religion_events.24.c:0 "Assign recruits to endure the choir's rites and inspire the army."
 war_culture_and_religion_events.24.dd:0 "Allow the temple to decide its own discipline."

 war_culture_and_religion_events.25.t:0 "The Oath Ring Recovered from the Sea"
 war_culture_and_religion_events.25.d:0 "A fisher brings a bronze oath ring to a northern shrine after finding it tangled in his nets. The storm-speaker recognizes marks belonging to a crew lost before its promised sacrifice.\n\nDescendants of the crew gather to complete the oath and ask neighboring camps to join them. The speaker needs ships' stores, guards, and authority to carry the rite beyond the first gathering."
 war_culture_and_religion_events.25.a:0 "Fund the rite and assign warriors to the preachers."
 war_culture_and_religion_events.25.b:0 "Negotiate a common oath among the assembled camps."
 war_culture_and_religion_events.25.c:0 "Record the surviving families and their obligations."

 war_culture_and_religion_events.26.t:0 "Two Jarls Claim the Storm's Favor"
 war_culture_and_religion_events.26.d:0 "Two jarls return from separate voyages and each claims the same storm as proof of divine favor. One says it drove his ship to plunder, while the other says it wrecked the enemies pursuing him.\n\nTheir followers begin tearing down each other's trophies in the shrine hall. The storm-speaker refuses to bless either account until [Root.Monarch.GetName] settles who may claim the place of honor."
 war_culture_and_religion_events.26.a:0 "Fund a reconciliatory feast despite the loss of standing abroad."
 war_culture_and_religion_events.26.b:0 "Hear both jarls without settling the public claim."

 war_culture_and_religion_events.27.t:0 "Four Altars Around One Standard"
 war_culture_and_religion_events.27.d:0 "Warriors devoted to four different Chaos gods gather beneath a single warlord's standard. Each priest plants an altar beside it and demands that his offering be made first.\n\nWhen the first captive is brought forward, all four groups block the path. The standard bearer sends for [Root.Monarch.GetName], insisting that the army needs a common dedication before the rival camps turn on one another."
 war_culture_and_religion_events.27.a:0 "Fund the common dedication and open the camp to visiting preachers."
 war_culture_and_religion_events.27.b:0 "Negotiate rites that preserve the warbands' shared allegiance."
 war_culture_and_religion_events.27.c:0 "Assign the offerings and ceremonial duties centrally."

 war_culture_and_religion_events.28.t:0 "The Priest Who Moved the Standard"
 war_culture_and_religion_events.28.d:0 "A priest moves the army's common standard beside his own god's altar during the night. At dawn, rival champions accuse him of claiming command over the entire host. He has tied his own colors directly beneath it.\n\nThe priest says the standard bearer gave permission, but the bearer has disappeared. Scouts find his abandoned shield beyond the tents, and the commanders ask the ruler to resolve the affair before the muster."
 war_culture_and_religion_events.28.a:0 "Pay informants to trace the missing bearer and the plot."
 war_culture_and_religion_events.28.b:0 "Fund a witnessed settlement restoring confidence in our word."
 war_culture_and_religion_events.28.c:0 "Negotiate with the champions and leave the public accusation unanswered."

 war_culture_and_religion_events.29.t:0 "The Furnace Consecration"
 war_culture_and_religion_events.29.d:0 "At a temple of Hashut, a furnace keeper discovers that the consecration tablet names a sacrifice never delivered. He refuses to light the new furnace until the omission is addressed.\n\nThe overseer blames an old clerk and presents a replacement list of captives and offerings. Priests call the workers together to witness the rite, but require stores, guards, and the court's authorization to proceed."
 war_culture_and_religion_events.29.a:0 "Fund the consecration and assign guards to the priesthood."
 war_culture_and_religion_events.29.b:0 "Negotiate a uniform rite for the furnace congregations."
 war_culture_and_religion_events.29.c:0 "Reconcile the tablet with the overseer's labor register."

 war_culture_and_religion_events.30.t:0 "A Tribute Tallied Three Times"
 war_culture_and_religion_events.30.d:0 "A temple clerk of Hashut records the same tribute as silver, labor, and sacrificial captives in three separate accounts. Each priest responsible demands the full amount from the supplying settlement.\n\nThe overseer arrives at [Root.Capital.GetName] with the contradictory tablets and an empty transport wagon. Work has stopped while collectors seize one another's consignments, and the temple guards await a ruling."
 war_culture_and_religion_events.30.a:0 "Pay to settle the accounts and end the disruption."
 war_culture_and_religion_events.30.b:0 "Claim the disputed tribute for the treasury."
 war_culture_and_religion_events.30.c:0 "Draft workers into armed temple service to enforce the rites."
 war_culture_and_religion_events.30.dd:0 "Leave the temple officials to settle their accounts."

 war_culture_and_religion_events.31.t:0 "The Idol That Fell on the Boss"
 war_culture_and_religion_events.31.d:0 "A shaman orders an idol of Gork and Mork raised above the camp, but its first lift drops the wooden fist onto a boss's tent. The boss crawls out furious, while the shaman declares that the gods have chosen where the idol belongs.\n\nMore mobs arrive to see the crushed tent and help raise something even larger. The shaman demands timber, food, and laborers before his rival can claim the gathering for a different idol."
 war_culture_and_religion_events.31.a:0 "Buy timber and put recruits to work spreading the cult."
 war_culture_and_religion_events.31.b:0 "Make the shamans agree that both gods get their due."
 war_culture_and_religion_events.31.c:0 "Count the workers and organize the lifting gangs."

 war_culture_and_religion_events.32.t:0 "Who Thumped the Idol First?"
 war_culture_and_religion_events.32.d:0 "Two shamans each claim that his god struck the enemy first in a recent raid. One repaints the camp's idol overnight, adding a fist where the other's sacred boot had stood.\n\nA Goblin tries to end the quarrel by painting a second face onto the idol. Both shamans knock him aside and accuse him of making the wrong god look smaller.\n\nTheir followers start fighting over the paint pots, then over who is allowed to watch. The biggest boss drags both shamans before [Root.Monarch.GetName], demanding a decision before the whole camp joins in."
 war_culture_and_religion_events.32.a:0 "Buy a feast and let the mobs settle down."
 war_culture_and_religion_events.32.b:0 "Hear their boasts and leave the quarrel to the shamans."

 war_culture_and_religion_events.33.t:0 "The Knife Missing from the Shrine"
 war_culture_and_religion_events.33.d:0 "A shaman of Gork-khan and Mork-khan discovers that someone has stolen the knife used for oath-taking. A young rider returns it from a rival shrine and claims the theft itself honored the gods.\n\nThe shaman calls a gathering to retell the deed and initiate new followers. Rival chiefs send riders to attend, but insist that their own oaths be recognized before any ceremony begins."
 war_culture_and_religion_events.33.a:0 "Fund the shaman's teaching and assign riders to guard him."
 war_culture_and_religion_events.33.b:0 "Negotiate a shared oath for all the attending camps."
 war_culture_and_religion_events.33.c:0 "Record the oaths and arrange the camp's supplies."

 war_culture_and_religion_events.34.t:0 "The Oath That Excused a Betrayal"
 war_culture_and_religion_events.34.d:0 "A rider sells his captain's plans to a rival, then tells the shaman that Mork-khan rewards successful deceit. The captain demands punishment for breaking an oath taken at that same shrine.\n\nThe shaman discovers that both men promised him a share of the proceeds. Their witnesses arrive at the khan's tent together, each expecting a ruling that excuses his own part in the bargain."
 war_culture_and_religion_events.34.a:0 "Question the witnesses and build a network of informants."
 war_culture_and_religion_events.34.b:0 "Pay restitution and enforce a settlement others can trust."
 war_culture_and_religion_events.34.c:0 "Let the shaman judge and reserve the trade profits for our own camp."

 war_culture_and_religion_events.35.t:0 "The Cauldron Beside the Maw Pit"
 war_culture_and_religion_events.35.d:0 "A Butcher sets a great cauldron beside a pit dedicated to the Great Maw and orders every camp to bring meat. One hunter arrives with a carcass large enough to feed the gathering, drawing hungry followers from neighboring camps.\n\nThe Butcher declares that the feast must continue until all have heard his account of the Maw. The stores run low before the last arrivals are served, and he asks [Root.Monarch.GetName] to supply the next slaughter."
 war_culture_and_religion_events.35.a:0 "Buy more livestock and support the Butcher's preaching."
 war_culture_and_religion_events.35.b:0 "Agree on common offerings with the visiting camps."
 war_culture_and_religion_events.35.c:0 "Count the provisions and organize the serving order."

 war_culture_and_religion_events.36.t:0 "The Tyrant's First Mouthful"
 war_culture_and_religion_events.36.d:0 "A chief takes the first portion from a feast before the Butcher can throw it into the Maw pit. The Butcher catches his wrist and demands that the god be fed first.\n\nThe chief's followers seize the remaining platters while the Butcher's attendants overturn the cooking stands. Hungry warriors wait around the ruined feast, looking to [Root.Monarch.GetName] for a ruling."
 war_culture_and_religion_events.36.a:0 "Buy a new feast and settle the quarrel locally."
 war_culture_and_religion_events.36.b:0 "Confiscate the disputed provisions for sale."
 war_culture_and_religion_events.36.c:0 "Dedicate recruits to the Butcher's demanding rites."
 war_culture_and_religion_events.36.dd:0 "Let the chief and Butcher settle the order of eating."

 war_culture_and_religion_events.37.t:0 "The New Shoots at Isha's Shrine"
 war_culture_and_religion_events.37.d:0 "A glade keeper finds living shoots growing through an old shrine to Isha after years of bare stone. She brings a branch to the seers, who identify buds that should not open until the next season.\n\nFamilies gather to tend the shoots and ask for a rite of renewal. The keeper requests supplies and attendants to guide visitors without damaging the roots around the recovering shrine."
 war_culture_and_religion_events.37.a:0 "Fund the rites and organize the seers' teaching."
 war_culture_and_religion_events.37.b:0 "Agree on a shared observance among the glades."
 war_culture_and_religion_events.37.c:0 "Record the growth and arrange careful access to the shrine."

 war_culture_and_religion_events.38.t:0 "The Hunter Barred from the Glade"
 war_culture_and_religion_events.38.d:0 "A wounded intruder reaches an Asrai shrine, where its keeper offers shelter until he can walk. A huntmaster follows his trail and demands that he be surrendered for crossing the forest boundary.\n\nThe keeper refuses to remove him from Isha's care. Hunters wait beyond the roots while attendants bring the quarrel to [Root.Monarch.GetName], asking whose promise takes precedence inside the shrine."
 war_culture_and_religion_events.38.a:0 "Pay for a settlement and recognize the keeper's right of sanctuary."
 war_culture_and_religion_events.38.b:0 "Hear both sides while leaving the sanctuary disputed."

 war_culture_and_religion_events.39.t:0 "An Oath at Khaine's Altar"
 war_culture_and_religion_events.39.d:0 "An ambitious captain kneels before Khaine's altar and offers the weapons taken from a defeated rival. The priest accepts them, then calls the captain's followers forward to swear the same dedication.\n\nSeveral hesitate because their households honor other Cytharai rites. The priest stops the ceremony and asks the court to provide an agreed form of oath before the refusal becomes a public insult."
 war_culture_and_religion_events.39.a:0 "Fund the priest's mission and negotiate the new oaths."
 war_culture_and_religion_events.39.b:0 "Settle a common rite among the Cytharai congregations."
 war_culture_and_religion_events.39.c:0 "Register the dedications and the weapons offered."

 war_culture_and_religion_events.40.t:0 "The Two Seals on the Shrine Warrant"
 war_culture_and_religion_events.40.d:0 "A shrine official produces a warrant claiming authority over a court office promised to another household. Both documents bear valid seals, but only one records a dedication to the Cytharai.\n\nThe rival households accuse each other of buying divine approval. Their servants barricade the office, and the chamberlain sends the two warrants to [Root.Monarch.GetName] before the dispute reaches the shrine itself."
 war_culture_and_religion_events.40.a:0 "Use informants to expose how the warrants were obtained."
 war_culture_and_religion_events.40.b:0 "Pay for arbitration and uphold a reliable public settlement."
 war_culture_and_religion_events.40.c:0 "Recruit the shrine's armed followers and leave the claim unresolved."

 war_culture_and_religion_events.41.t:0 "The Restored Hymn to Asuryan"
 war_culture_and_religion_events.41.d:0 "A temple archivist finds a damaged copy of a hymn to Asuryan beneath newer prayer books. The choir master reconstructs the missing lines and performs them before the evening congregation. The oldest singer corrects a line he remembers hearing as a child.\n\nOlder worshippers recognize verses their families had stopped singing generations ago. The archivist asks the court to support copies and teachers so that the restored hymn can reach the other temples."
 war_culture_and_religion_events.41.a:0 "Fund copies and organize the teachers' journeys."
 war_culture_and_religion_events.41.b:0 "Agree on a shared liturgy among the Cadai temples."
 war_culture_and_religion_events.41.c:0 "Catalog the recovered hymns and temple records."

 war_culture_and_religion_events.42.t:0 "The Sailor Refused Entry"
 war_culture_and_religion_events.42.d:0 "A sailor returning from foreign ports is refused entry to a Cadai temple because the keeper distrusts the rites he learned overseas. The sailor presents an old family token and asks to pray where his parents prayed.\n\nOther returning travelers gather at the steps in support. Temple attendants close the gate, and the watch requests a ruling before the argument disrupts the surrounding streets."
 war_culture_and_religion_events.42.a:0 "Fund a settlement and divert troops to keep order."
 war_culture_and_religion_events.42.b:0 "Claim the disputed offerings for the treasury."
 war_culture_and_religion_events.42.c:0 "Assign recruits to an armed guardianship of the temple."
 war_culture_and_religion_events.42.dd:0 "Leave admission to the temple's own authorities."

 war_culture_and_religion_events.43.t:0 "The Missing Ancestor's Name"
 war_culture_and_religion_events.43.d:0 "A stonecutter restoring an ancestor hall finds that one family's founding name was omitted from the wall. Their elder produces a funerary record proving the omission and requests a public correction.\n\nOther families search their own records while priests prepare a recitation of the Ancestor Gods' deeds. The ceremony has grown beyond the hall's means, and the keeper seeks funds for new carvings and religious instruction."
 war_culture_and_religion_events.43.a:0 "Pay for the carvings and the priests' wider teaching."
 war_culture_and_religion_events.43.b:0 "Negotiate a common observance among the assembled clans."
 war_culture_and_religion_events.43.c:0 "Compile the corrected family and temple records."

 war_culture_and_religion_events.44.t:0 "A Grudge During the Memorial Rite"
 war_culture_and_religion_events.44.d:0 "A Longbeard interrupts a memorial rite by naming a family that failed to return his grandfather's tools. The officiant orders him to wait, insisting that the ancestors' ceremony is no place for a private claim.\n\nThe accused family's representative identifies the tools as those returned after a mine collapse. The Longbeard agrees that some were returned, then names every missing piece without consulting the receipt.\n\nThe Longbeard produces a dated receipt and refuses to leave the altar. Armed relatives arrive to support both sides, forcing the hall keeper to request a judgment from [Root.Monarch.GetName]."
 war_culture_and_religion_events.44.a:0 "Pay for arbitration and assign guards to enforce it."
 war_culture_and_religion_events.44.b:0 "Hear the claim privately while the public grievance remains."

 war_culture_and_religion_events.45.t:0 "The Stone Beneath the Fallen Oak"
 war_culture_and_religion_events.45.d:0 "A storm uproots an oak beside a druidic circle and exposes a carved stone caught in its roots. The grove keeper recognizes the marks from a rite no longer performed locally.\n\nVisitors gather as the druids clean the stone and prepare to renew the ceremony. Traders offer supplies for the gathering, while the keeper asks the court to keep the approach open to worshippers from other circles."
 war_culture_and_religion_events.45.a:0 "Fund the renewed rites and open access to visiting suppliers."
 war_culture_and_religion_events.45.b:0 "Negotiate a common ceremony among the circles."
 war_culture_and_religion_events.45.c:0 "Record the carving and organize the visitors' camp."

 war_culture_and_religion_events.46.t:0 "The Road Through the Sacred Oak"
 war_culture_and_religion_events.46.d:0 "Road workers mark a sacred oak for cutting, carrying an order signed by a court official. The druids stop the work and produce an older oath promising that the tree will never be harmed.\n\nThe official claims the oath cannot bind a later ruler. Workers abandon their tools as the grove's defenders gather, leaving [Root.Monarch.GetName] to resolve two promises made in the government's name."
 war_culture_and_religion_events.46.a:0 "Send agents and guards to investigate the disputed order."
 war_culture_and_religion_events.46.b:0 "Pay for a new route and honor the older oath."
 war_culture_and_religion_events.46.c:0 "Allow a new interpretation of the oath despite the criticism."

 war_culture_and_religion_events.47.t:0 "The Hearth Charm in the Snow"
 war_culture_and_religion_events.47.d:0 "A village elder finds a child's missing hearth charm frozen into the outside of a well. The local hag says the household has neglected the old spirits and calls its neighbors to renew their offerings.\n\nFamilies bring bread, cloth, and small carved tokens to the well. The hag asks for supplies and attendants to carry the observance to other settlements before the next hard frost."
 war_culture_and_religion_events.47.a:0 "Fund the old rites and release soldiers to attend."
 war_culture_and_religion_events.47.b:0 "Agree on shared obligations among the village shrines."
 war_culture_and_religion_events.47.c:0 "Register the households and distribute the offering supplies."

 war_culture_and_religion_events.48.t:0 "The Hag at the New Shrine"
 war_culture_and_religion_events.48.d:0 "A hag discovers that builders have moved an old spirit stone to make room for a newer shrine. She orders them to put it back, but the shrine's keeper says the new foundations cannot be disturbed.\n\nFrost splits the unfinished steps that night, and frightened villagers refuse to work. Both keepers bring the broken stone to [Root.Capital.GetName], each claiming it proves the other's offense."
 war_culture_and_religion_events.48.a:0 "Pay for a settlement and negotiate the restoration."
 war_culture_and_religion_events.48.b:0 "Take the disputed offerings as compensation to the treasury."
 war_culture_and_religion_events.48.c:0 "Assign recruits to guard the old rites and inspire the troops."
 war_culture_and_religion_events.48.dd:0 "Leave the two keepers to settle the site themselves."

 war_culture_and_religion_events.49.t:0 "The Tribute Left on the Steps"
 war_culture_and_religion_events.49.d:0 "Dragon worshippers drag a tribute chest up the steps of a volcanic shrine and find the previous offering untouched. The blood-priest examines the bones around it and declares that the rite was performed incorrectly.\n\nClan attendants arrive carrying competing instructions from their own altars. The priest demands a witnessed dedication before anyone removes the gems, and asks the ruler to support a mission teaching the corrected rite."
 war_culture_and_religion_events.49.a:0 "Fund the priest's mission despite rival courts' objections."
 war_culture_and_religion_events.49.b:0 "Negotiate a shared rite among the clan altars."
 war_culture_and_religion_events.49.c:0 "Record the tribute and assign responsibility for its delivery."

 war_culture_and_religion_events.50.t:0 "The Dream of the Broken Gong"
 war_culture_and_religion_events.50.d:0 "Two dragon-priests claim that a broken blood-gong appeared in their dreams as a warning. One demands its burial, while the other insists it must be repaired before the next tribute.\n\nTheir attendants seize opposite halves and refuse to hand them over. Clan warriors assemble around the shrine, and the keeper asks [Root.Monarch.GetName] to settle the matter before either half is destroyed."
 war_culture_and_religion_events.50.a:0 "Pay for a settlement and assign warriors to enforce it."
 war_culture_and_religion_events.50.b:0 "Question both priests while leaving their public claims unsettled."

 war_culture_and_religion_events.51.t:0 "A Preacher at the Caravan Well"
 war_culture_and_religion_events.51.d:0 "A preacher of the One Faith arrives at a caravan well carrying copies of Anmar Fakir's teachings. After hearing his sermon against bargains with djinn, a merchant publicly breaks the charm he had worn for protection.\n\nOther travelers ask for copies to take home, and the preacher requests escorts and provisions for a longer mission. The well keeper brings his request to [Root.Capital.GetName] along with the discarded charms."
 war_culture_and_religion_events.51.a:0 "Fund the preaching mission and its travel expenses."
 war_culture_and_religion_events.51.b:0 "Agree on a common observance with the local congregations."
 war_culture_and_religion_events.51.c:0 "Register the donations and organize the travelers' requests."

 war_culture_and_religion_events.52.t:0 "The Question After the Sermon"
 war_culture_and_religion_events.52.d:0 "After a sermon on the Solar Mandate, a student asks whether a ruler who loses divine favor must surrender authority. The preacher calls the question treasonous and orders the student's arrest.\n\nOther listeners insist that the question follows from the Prophet's own teaching. The guards bring both men to court as copies of the exchange begin circulating among merchants and officials."
 war_culture_and_religion_events.52.a:0 "Recruit informants among the traveling merchants."
 war_culture_and_religion_events.52.b:0 "Pay for a public hearing that demonstrates fair dealing."
 war_culture_and_religion_events.52.c:0 "Record the argument as a matter of government and accept the criticism."

 war_culture_and_religion_events.53.t:0 "The Damaged Standard of Ptra"
 war_culture_and_religion_events.53.d:0 "A temple attendant preparing a procession finds Ptra's standard cracked where its gilded disk meets the pole. A mason uncovers an old repair bearing the name of a ruler omitted from the current ceremony.\n\nMortuary priests summon witnesses and prepare a corrected observance. The keeper requests funds and envoys to explain the change before the neighboring temples send their own processions."
 war_culture_and_religion_events.53.a:0 "Fund the procession and negotiate support for the corrected rite."
 war_culture_and_religion_events.53.b:0 "Agree on a common observance among the temples."
 war_culture_and_religion_events.53.c:0 "Catalog the old repairs and organize the procession's duties."

 war_culture_and_religion_events.54.t:0 "The Tomb That Claims the Procession"
 war_culture_and_religion_events.54.d:0 "Priests serving two royal tombs each claim that the annual procession must stop first at their gates. One cites a weathered decree, while the other presents offerings made under a later ruler.\n\nTheir attendants block the ceremonial avenue with the rival standards. The procession cannot leave its court until [Root.Monarch.GetName] settles which instructions the temple guards should enforce."
 war_culture_and_religion_events.54.a:0 "Pay for a local settlement despite outside objections."
 war_culture_and_religion_events.54.b:0 "Take the disputed offerings into the royal treasury."
 war_culture_and_religion_events.54.c:0 "Assign recruits to temple service and military rites."
 war_culture_and_religion_events.54.dd:0 "Let the two priesthoods settle their own precedence."

 war_culture_and_religion_events.55.t:0 "The Dedication Before Nagash"
 war_culture_and_religion_events.55.d:0 "A liche presents newly recovered funerary inscriptions before [Root.Monarch.GetName] and asks permission to erase their older dedications. His assistants have already assembled the bones named on the tablets.\n\nThe liche points to an older dedication promising eternal service to a ruler whose name has been chipped away. He proposes replacing it immediately, while his rival refuses to touch the tablet without a witnessed command.\n\nA rival officiant demands that the erasure follow a prescribed rite rather than the liche's own invention. Both await the master's command while the assembled dead stand motionless around the hall."
 war_culture_and_religion_events.55.a:0 "Fund the dedication and the cult's wider instruction."
 war_culture_and_religion_events.55.b:0 "Negotiate a uniform rite among the officiants."
 war_culture_and_religion_events.55.c:0 "Record the recovered dead and their assigned service."
 war_culture_and_religion_events.55.husk:0 "Silence the officiants with Nagash's direct command."

 war_culture_and_religion_events.56.t:0 "The Liche Who Demanded Dead Servants"
 war_culture_and_religion_events.56.d:0 "A liche claims that living attendants cannot be trusted with the master's secrets and demands their execution before continued service. The steward objects that several maintain records no one else can read.\n\nTheir argument halts the delivery of instructions through the court. The disputed attendants are brought before [Root.Monarch.GetName], still carrying the tablets they were ordered to interpret."
 war_culture_and_religion_events.56.a:0 "Pay for a supervised settlement and preserve orderly service."
 war_culture_and_religion_events.56.b:0 "Question the attendants while leaving the liche's demand unanswered."
 war_culture_and_religion_events.56.husk:0 "Nagash will dictate their service without an intermediary."

 war_culture_and_religion_events.57.t:0 "The Bell That Rang Thirteen Times"
 war_culture_and_religion_events.57.d:0 "A temple bell rings thirteen times after its exhausted slave pullers release the rope. The Grey Seer declares a sign of the Horned Rat and orders every nearby clawleader to witness another ringing.\n\nThe clawleaders arrive with offerings and competing accounts of who paid for the bell. Temple guards begin turning away doubtful engineers while the Seer demands funds to spread the news through the warrens."
 war_culture_and_religion_events.57.a:0 "Fund the Seer's preaching and suppress the engineers' objections."
 war_culture_and_religion_events.57.b:0 "Force the clawleaders to observe one common rite."
 war_culture_and_religion_events.57.c:0 "Count the offerings and assign the temple's labor gangs."

 war_culture_and_religion_events.58.t:0 "The Clawleader's Hidden Passage"
 war_culture_and_religion_events.58.d:0 "A clawleader accuses his rival of digging a secret passage beneath the Horned Rat's temple. When guards inspect it, they find tribute chests bearing the accuser's own marks.\n\nBoth clawleaders claim the other planted the evidence. Their followers crowd the temple exits, and the Grey Seer sends the seized chests to [Root.Monarch.GetName] with a demand for judgment."
 war_culture_and_religion_events.58.a:0 "Pay spies to trace the passage and its users."
 war_culture_and_religion_events.58.b:0 "Fund a witnessed settlement with both clawleaders."
 war_culture_and_religion_events.58.c:0 "Take their followers into service and leave the accusation unresolved."

 war_culture_and_religion_events.59.t:0 "The Plaque That Names Tonight's Stars"
 war_culture_and_religion_events.59.d:0 "A Skink attendant cleaning an astronomical plaque finds a date matching the coming night. Its instructions call for a rite at a terrace that has stood unused for generations. The attendant checks the date against a second plaque before reporting the discovery.\n\nThe priest verifies the stellar marks and summons keepers from nearby shrines. They bring incompatible copies of the ceremony, leaving the ruler to authorize a reading before the stars reach the indicated positions."
 war_culture_and_religion_events.59.a:0 "Fund the priests' mission and defer to their chosen reading."
 war_culture_and_religion_events.59.b:0 "Agree on a common interpretation among the shrines."
 war_culture_and_religion_events.59.c:0 "Compare the copies and organize the terrace's attendants."

 war_culture_and_religion_events.60.t:0 "The Command Without a Final Sign"
 war_culture_and_religion_events.60.d:0 "A Skink interpreter receives a sequence of gestures from a meditating Slann but never sees the final sign. One priest says the order requires immediate action, while another insists the missing sign means they must wait.\n\nWork gangs assemble at the temple steps and remain there without instructions. Their overseers ask [Root.Monarch.GetName] to resolve the delay before stores and guards are exhausted."
 war_culture_and_religion_events.60.a:0 "Fund the waiting camps and defer to a priestly settlement."
 war_culture_and_religion_events.60.b:0 "Reclaim the unused offerings for the treasury."
 war_culture_and_religion_events.60.c:0 "Transfer recruits to temple guards devoted to the command."
 war_culture_and_religion_events.60.dd:0 "Wait for the interpreters to resolve the missing sign."

 war_culture_and_religion_events.61.t:0 "The Teacher at the Granary Steps"
 war_culture_and_religion_events.61.d:0 "A teacher of the Enlightened Path begins lessons outside a granary where petitioners wait for their ration records. He uses their disputes over measures to explain patience, duty, and fair judgment.\n\nThe petitioners return the following day with neighbors, and the granary clerk asks for a proper classroom. The teacher brings the request to court with volunteers ready to carry the lessons into other districts."
 war_culture_and_religion_events.61.a:0 "Pay for classrooms and traveling teachers."
 war_culture_and_religion_events.61.b:0 "Agree on a common teaching schedule with the local schools."
 war_culture_and_religion_events.61.c:0 "Organize the waiting lists and the school's records."

 war_culture_and_religion_events.62.t:0 "The Pupil's Question About the Ruler"
 war_culture_and_religion_events.62.d:0 "A teacher asks pupils to name the duties owed by a ruler to the governed. One pupil repeats the lesson outside a tax office and is arrested for criticizing its collector.\n\nThe teacher demands his release, while the collector claims the school encourages disobedience. Parents bring copies of the exercise to [Root.Capital.GetName], asking whether the lesson may still be taught."
 war_culture_and_religion_events.62.a:0 "Fund a settlement and restore the accepted curriculum."
 war_culture_and_religion_events.62.b:0 "Hear both sides without publicly endorsing the lesson."

 war_culture_and_religion_events.63.t:0 "The Two Halves of the Temple Calendar"
 war_culture_and_religion_events.63.d:0 "A temple clerk preparing rites of Yin and Yang discovers that two official calendars assign opposing observances to the same day. An old copy shows where a missing page divided the instructions.\n\nThe temple masters agree to present a corrected ceremony before the public. They request supplies and attendants to carry the revised calendar to the smaller shrines before the confusion spreads."
 war_culture_and_religion_events.63.a:0 "Fund the ceremonies and release recruits for the teaching mission."
 war_culture_and_religion_events.63.b:0 "Negotiate one calendar for the congregations."
 war_culture_and_religion_events.63.c:0 "Compile the corrected calendar and distribute official copies."

 war_culture_and_religion_events.64.t:0 "The Magistrate's Unbalanced Judgment"
 war_culture_and_religion_events.64.d:0 "A teacher of harmony condemns a magistrate for punishing a servant while excusing his employer for the same offense. The magistrate claims that hierarchy itself requires unequal penalties.\n\nOne student compares the penalties with earlier judgments and finds the same pattern in several cases. The magistrate confiscates the copy, but another pupil has already delivered the original records to the chamberlain.\n\nStudents copy both arguments onto the courthouse wall. Guards remove the notices, but the petitioners return with fresh copies and demand that [Root.Monarch.GetName] review the judgment."
 war_culture_and_religion_events.64.a:0 "Use soldiers and informants to investigate the magistrate's network."
 war_culture_and_religion_events.64.b:0 "Pay for a fair hearing that restores confidence in our judgments."
 war_culture_and_religion_events.64.c:0 "Uphold the ruler's authority over doctrine despite the criticism."

 war_culture_and_religion_events.65.t:0 "The Garland Makers' Petition"
 war_culture_and_religion_events.65.d:0 "Garland makers serving the Thousand Gods arrive at [Root.Capital.GetName] after receiving more orders than their gardens can supply. A temple festival has drawn pilgrims whose household deities have no place in the planned procession.\n\nThe chief steward proposes adding shrines and teachers along the approach road. He brings the garland makers' petition to court, asking for funds and an orderly plan before the arriving worshippers erect stalls wherever they can."
 war_culture_and_religion_events.65.a:0 "Fund the additional shrines and organize their teaching."
 war_culture_and_religion_events.65.b:0 "Agree on places for the different congregations."
 war_culture_and_religion_events.65.c:0 "Register the stalls and assign the festival's supplies."

 war_culture_and_religion_events.66.t:0 "Three Gods Claim the East Gate"
 war_culture_and_religion_events.66.d:0 "Three temples claim the toll collected at the east gate of [Root.Capital.GetName]. Each presents a dedication naming its deity as the gate's protector, and each has sent attendants to empty the collection box.\n\nThe gate captain locks the box and sends all three documents to court. Wagons wait outside while the attendants argue over which temple's seal belongs on the receipt."
 war_culture_and_religion_events.66.a:0 "Pay for a settlement that preserves the old ceremonial rules."
 war_culture_and_religion_events.66.b:0 "Collect the disputed toll directly for the treasury."
 war_culture_and_religion_events.66.c:0 "Draft recruits into an armed guardianship of the temples."
 war_culture_and_religion_events.66.dd:0 "Let the temple keepers settle their claims."
### END GENERATED WARHAMMER RELIGION RANDOM EVENTS

### BEGIN GENERATED WARHAMMER CULTURE RANDOM EVENTS
 war_culture_and_religion_events.67.t:0 "The Toll Chain Across the Reik"
 war_culture_and_religion_events.67.d:0 "A Reiklander barge master reaches court with a charter exempting his grain cargo from a new toll. The collector has nevertheless chained his boat to the landing and demanded payment. The barge's crew has remained aboard to stop the cargo being removed.\n\nOther boatmen stop unloading in support of the master. The mayor sends both charter and toll schedule to [Root.Capital.GetName], asking for a settlement before the grain spoils."
 war_culture_and_religion_events.67.a:0 "Pay compensation and negotiate a clear charter."
 war_culture_and_religion_events.67.b:0 "Collect the disputed toll and dismiss the objections."

 war_culture_and_religion_events.68.t:0 "The Gun Founder's Missing Apprentices"
 war_culture_and_religion_events.68.d:0 "A Wissenlander gun founder discovers that a recruiting officer has taken apprentices listed as exempt from service. The officer says the exemption expired when the workshop changed hands.\n\nThe apprentices' families gather at the foundry gate, and unfinished gun molds begin to cool. The founder sends his old Nuln training certificate and the exemption roll to court for judgment."
 war_culture_and_religion_events.68.a:0 "Confirm the ruler's levy and organize the new recruits."
 war_culture_and_religion_events.68.b:0 "Pay to audit and update the workshop's exemption rolls."
 war_culture_and_religion_events.68.c:0 "Let the founder and recruiting officer settle it locally."

 war_culture_and_religion_events.69.t:0 "The Hochland Shooting Match"
 war_culture_and_religion_events.69.d:0 "At a Hochlander shooting match, a forester strikes every target with a long rifle built in his own workshop. An army captain demands that the winner and his companions join a permanent company.\n\nThe foresters say their service is limited to defending their own woods. Their headman brings the match records to [Root.Capital.GetName] and asks what obligations come with the captain's proposed honor."
 war_culture_and_religion_events.69.a:0 "Give selected marksmen a public commission and regular drills."
 war_culture_and_religion_events.69.b:0 "Send the foresters to map enemy trails, whatever the losses."
 war_culture_and_religion_events.69.c:0 "Sell exemptions to those who refuse service."
 war_culture_and_religion_events.69.dd:0 "Negotiate a regular training obligation with their elders."

 war_culture_and_religion_events.70.t:0 "The Watch Beneath the Wolf Stone"
 war_culture_and_religion_events.70.d:0 "Middenlander villagers rebuild a ruined watchpost beside an Ulrican wolf stone after finding raider tracks nearby. Their captain asks neighboring settlements for supplies, invoking an old defense oath.\n\nOne village refuses because the watchpost stands beyond its boundary. The captain brings witnesses to [Root.Monarch.GetName], demanding that the oath be honored before winter isolates the road."
 war_culture_and_religion_events.70.a:0 "Fund and honor the watch despite neighboring objections."
 war_culture_and_religion_events.70.b:0 "Negotiate new duties and release troops from the disputed watch."

 war_culture_and_religion_events.71.t:0 "The Graveyard Wall in Stirland"
 war_culture_and_religion_events.71.d:0 "A Stirlander gravedigger finds fresh digging beneath the wall of a Garden of Morr. The keeper asks nearby households to repair it, but a landlord claims their labor for his own harvest.\n\nThe workers cannot meet both demands and send a petition to [Root.Capital.GetName]. Their reeve brings a rusted grave lock as evidence that the burial ground can no longer be secured."
 war_culture_and_religion_events.71.a:0 "Pay for repairs and negotiate a local settlement."
 war_culture_and_religion_events.71.b:0 "Collect a levy from the disputed labor obligation."
 war_culture_and_religion_events.71.c:0 "Assign the work to military supervision."

 war_culture_and_religion_events.72.t:0 "The Averlander Horse Fair"
 war_culture_and_religion_events.72.d:0 "An Averlander horse breeder brings fine mounts to the muster, then refuses the army's fixed price. He says the same animals would fetch twice as much at the seasonal fair.\n\nThe captain seizes the bridles until the dispute is settled. Other breeders hold their horses outside the enclosure, and the fair steward asks the court to decide before the buyers leave."
 war_culture_and_religion_events.72.a:0 "Negotiate recruits and mounts from the breeding households."
 war_culture_and_religion_events.72.b:0 "Pay for a complete register of breeding stock and obligations."
 war_culture_and_religion_events.72.c:0 "Release the levy and negotiate the fair's terms."
 war_culture_and_religion_events.72.dd:0 "Pay for a military trial of the offered mounts."

 war_culture_and_religion_events.73.t:0 "The Silent Ostland Watchpost"
 war_culture_and_religion_events.73.d:0 "An Ostlander patrol reaches a pine watchpost and finds its warning fire cold. The two men assigned to it had left to escort fur traders who offered better pay.\n\nTheir captain brings the traders' receipts and a list of missed signals to court. The deserters insist the watch's suppliers refused them food on credit, leaving the ruler to settle how the post will be staffed."
 war_culture_and_religion_events.73.a:0 "Open its supplies to competition and establish an honored trained watch."
 war_culture_and_religion_events.73.b:0 "Send a hard patrol and learn from the losses."

 war_culture_and_religion_events.74.t:0 "The Rafts Held on the Talabec"
 war_culture_and_religion_events.74.d:0 "Talabeclander foresters stop a timber raft after finding logs cut inside a protected grove. The raft master produces a tax receipt and insists that payment gave him the right to carry them.\n\nArmed villagers line the landing while the timber begins drifting against the moorings. A river captain asks [Root.Monarch.GetName] to decide which document his men must enforce."
 war_culture_and_religion_events.74.a:0 "Fund the local river watch and honor its service."
 war_culture_and_religion_events.74.b:0 "Negotiate the cargo's release and stand down the troops."
 war_culture_and_religion_events.74.c:0 "Release conscripts to the villages in return for a settlement."

 war_culture_and_religion_events.75.t:0 "The Ostermark Village That Missed the Muster"
 war_culture_and_religion_events.75.d:0 "An Ostermarker village sends funeral lists instead of recruits to the seasonal muster. Its elder says the missing men died defending a grave road that the army had stopped patrolling.\n\nThe recruiting officer suspects the villagers copied old names to avoid service. A surviving watchman arrives with damaged equipment and asks for an inquiry before more households are summoned."
 war_culture_and_religion_events.75.a:0 "Fund an inquiry, negotiate duties, and release the disputed recruits."
 war_culture_and_religion_events.75.b:0 "Collect payment in place of the disputed service."
 war_culture_and_religion_events.75.c:0 "Send a costly patrol to learn what happened on the road."
 war_culture_and_religion_events.75.dd:0 "Organize a public memorial honoring the village's service."

 war_culture_and_religion_events.76.t:0 "The Boat Reserved for the Watch"
 war_culture_and_religion_events.76.d:0 "A Nordlander fishing family refuses to hand over its boat for coastal watch duty. The reeve's order names a vessel that sank last year, but the family has reused its name for a smaller replacement.\n\nThe watch captain insists the name carries the obligation. The family brings the old wreck's bell to court and asks whether a tax roll can decide which hull goes to sea."
 war_culture_and_religion_events.76.a:0 "Uphold the ruler's right to demand the service."
 war_culture_and_religion_events.76.b:0 "Pay to revise the boat register and its duties."

 war_culture_and_religion_events.77.t:0 "The Signal Fire in the Wrong Pass"
 war_culture_and_religion_events.77.d:0 "A Sudenlander quarry crew sees a warning fire and flees, abandoning a loaded cart in a mountain pass. The next patrol finds that the watchmen used the signal to summon help with a broken bridge.\n\nThe quarry master demands compensation for the lost stone. The captain brings the confused signal instructions to court, asking for a common system before a real raid finds the passes unprepared."
 war_culture_and_religion_events.77.a:0 "Commission trained signal crews under the captains' authority."
 war_culture_and_religion_events.77.b:0 "Send patrols through the threatened passes to test the signals."
 war_culture_and_religion_events.77.c:0 "Negotiate common signals and regular training."

 war_culture_and_religion_events.78.t:0 "The Canal Gate Held Shut"
 war_culture_and_religion_events.78.d:0 "A Wastelander lock keeper refuses to open his gate until a convoy pays a fee omitted from its contract. The merchant factors hire armed boatmen to force it, trapping other barges between the locks.\n\nA clerk trained in Marienburg produces three different schedules for the same canal. He brings them to [Root.Capital.GetName] as the convoy's guards begin hauling tools onto the gate."
 war_culture_and_religion_events.78.a:0 "Fund and honor a canal guard under the factors' charter."
 war_culture_and_religion_events.78.b:0 "Withdraw the troops and negotiate passage."
 war_culture_and_religion_events.78.c:0 "Pay for a single audited canal register."
 war_culture_and_religion_events.78.dd:0 "Assign recruits to enforce exclusive local canal rights."

 war_culture_and_religion_events.79.t:0 "The Tenant Who Died Twice"
 war_culture_and_religion_events.79.d:0 "A Sylvanian notary demands arrears from a household whose tenant appears twice in the burial register. The family says the second entry records the destruction of the man after he returned from the grave.\n\nThe household's neighbors remember both funerals and offer to testify. One recalls the notary himself witnessing the second burial, although his signature is missing from that page.\n\nThe notary insists that his renewed activity extended the tenancy. The widow brings both death notices to court, asking for a ruling before the manor seizes her last livestock."
 war_culture_and_religion_events.79.a:0 "Pay for an audit and correct the household register."
 war_culture_and_religion_events.79.b:0 "Collect the arrears under the manor's claim."

 war_culture_and_religion_events.80.t:0 "The Charcoal Burners' Hidden Camp"
 war_culture_and_religion_events.80.d:0 "A Drakwalder charcoal burner leads a patrol to a camp missing from the tax maps. Its inhabitants say they moved after Beastmen destroyed their former settlement and have guarded themselves ever since.\n\nThe patrol captain finds bows and stolen military stores in their huts. Their headman offers recruits if the government will recognize the camp instead of treating its people as fugitives."
 war_culture_and_religion_events.80.a:0 "Recognize the camp and accept its irregular recruits."
 war_culture_and_religion_events.80.b:0 "Pay surveyors to register the settlement."
 war_culture_and_religion_events.80.c:0 "Fund patrols and learn the burners' forest routes."

 war_culture_and_religion_events.81.t:0 "The Guild Badges at the Muster"
 war_culture_and_religion_events.81.d:0 "Two Altdorfer guild companies arrive at a muster wearing identical badges and claiming the same place in the procession. Their captains discover that a badge maker sold both groups an exclusive design.\n\nThe argument spreads into the assembled ranks as drummers beat competing marches. The marshal sends for [Root.Monarch.GetName] before the public review begins."
 war_culture_and_religion_events.81.a:0 "Reorganize the companies and stage a disciplined public review."
 war_culture_and_religion_events.81.b:0 "March both companies into the field until they learn to cooperate."
 war_culture_and_religion_events.81.c:0 "Fine the guilds for disrupting the muster."
 war_culture_and_religion_events.81.dd:0 "Sell a new exclusive badge license to one guild."

 war_culture_and_religion_events.82.t:0 "The Talabheimer Gate Exception"
 war_culture_and_religion_events.82.d:0 "A Talabheimer grain carrier claims an ancient exemption at a gate through the crater wall. The gate captain refuses it because the seal belongs to a family that no longer owns the wagon.\n\nMerchants behind him begin arguing over whether exemptions belong to people or cargo. The captain sends the sealed parchment to court while his guards keep the gate open to other traffic."
 war_culture_and_religion_events.82.a:0 "Fund and honor strict enforcement by the gate guard."
 war_culture_and_religion_events.82.b:0 "Negotiate the exemption and stand down the extra guards."

 war_culture_and_religion_events.83.t:0 "The Lift at the Fauschlag"
 war_culture_and_religion_events.83.d:0 "A Middenheimer lift keeper discovers that a noble household has been carrying building stone without paying for the crews. The household's steward cites an old privilege granting free passage up the Fauschlag. The keeper offers to move the stone once the crew's arrears are paid.\n\nThe workers refuse the next load until someone pays their wages. The steward and keeper bring their records to [Root.Monarch.GetName], leaving the stone stacked at the foot of the ascent."
 war_culture_and_religion_events.83.a:0 "Pay to reconcile the privilege with the lift accounts."
 war_culture_and_religion_events.83.b:0 "Collect the unpaid carrying fees."
 war_culture_and_religion_events.83.c:0 "Organize a public settlement honoring the lift crews."

 war_culture_and_religion_events.84.t:0 "The Salt Barrels Marked Twice"
 war_culture_and_religion_events.84.d:0 "A Salzenmunder salt factor finds army marks painted over barrels reserved for another buyer. The quartermaster says a verbal order entitled him to the shipment, but cannot name the officer who gave it.\n\nThe factor stops further deliveries until the government guarantees payment. His apprentices and warehouse hands offer to serve if their contracts and families are protected."
 war_culture_and_religion_events.84.a:0 "Accept their service and open procurement to new suppliers."
 war_culture_and_religion_events.84.b:0 "Pay for an audit of the salt contracts."
 war_culture_and_religion_events.84.c:0 "Release the disputed military claim and negotiate a settlement."
 war_culture_and_religion_events.84.dd:0 "Buy the shipment and standardize the store accounts."

 war_culture_and_religion_events.85.t:0 "The Sudenburg Well Guard"
 war_culture_and_religion_events.85.d:0 "A Sudenburger settler repairs an abandoned well and posts his own guard beside it. When a patrol demands water, the guard asks for the fee paid by every caravan.\n\nThe patrol captain claims the well serves the realm and cannot exclude its soldiers. The settler brings his repair tools and witness statements to court, asking who will repay the work."
 war_culture_and_religion_events.85.a:0 "Order a public military dedication of the well."
 war_culture_and_religion_events.85.b:0 "Force access and learn to secure the surrounding route."

 war_culture_and_religion_events.86.t:0 "The Survey Beyond Leopoldheim"
 war_culture_and_religion_events.86.d:0 "Leopoldheimer surveyors return to find settlers farming land they had marked for a defensive road. The settlers produce a later charter whose boundary follows a dry stream instead of the survey stakes.\n\nAn armed escort prevents the two parties from uprooting each other's markers. Both maps are carried to [Root.Capital.GetName] before another building season makes the disagreement permanent."
 war_culture_and_religion_events.86.a:0 "Fund an armed survey and publicly confirm its boundaries."
 war_culture_and_religion_events.86.b:0 "Negotiate a route and withdraw the military escort."
 war_culture_and_religion_events.86.c:0 "Release settlers from service in return for a registration fee."

 war_culture_and_religion_events.87.t:0 "The Neulander Farm Beyond the Last Marker"
 war_culture_and_religion_events.87.d:0 "A Neulander family builds a farm beyond the last recorded boundary and asks for protection after raiders steal its oxen. The local official refuses because the holding does not appear on his tax map.\n\nNeighbors bring proof that they have traded with the farm for years. Their petition reaches [Root.Capital.GetName] alongside the official's demand that the family pay for protection first."
 war_culture_and_religion_events.87.a:0 "Fund a new charter and open the settlement to traders."
 war_culture_and_religion_events.87.b:0 "Charge the farm for registration and protection."
 war_culture_and_religion_events.87.c:0 "Send a costly patrol to secure and survey the approach."
 war_culture_and_religion_events.87.dd:0 "Leave the claim with the local official."

 war_culture_and_religion_events.88.t:0 "The Missing Pies of the Moot"
 war_culture_and_religion_events.88.d:0 "Halfling bakers discover that a recruiting sergeant has taken the pies prepared for a communal feast. He calls them army provisions and produces an order naming grain, flour, and other necessities.\n\nThe feast steward follows him to the muster with a long list of households owed food. He offers willing volunteers if the court first settles who may requisition the village ovens."
 war_culture_and_religion_events.88.a:0 "Confirm the levy and organize service under a clear oath."
 war_culture_and_religion_events.88.b:0 "Pay the bakers and register the kitchens' obligations."

 war_culture_and_religion_events.89.t:0 "The Gnome's Clockwork Watchman"
 war_culture_and_religion_events.89.d:0 "A Gnome artificer demonstrates a clockwork warning bell that rings when a gate is opened. The town captain praises it until the device traps his sleeve and refuses to stop ringing.\n\nThe artificer frees the captain by turning a concealed screw beneath the frame. When asked why the watch was not told about it, he explains that operating instructions cost extra.\n\nThe artificer claims the gate was opened incorrectly and offers to train proper attendants. The captain brings both the device and its inventor to court, asking whether it deserves a place in the watch."
 war_culture_and_religion_events.89.a:0 "Arrange a public military demonstration of the invention."
 war_culture_and_religion_events.89.b:0 "Trial the device at an exposed watchpost, despite the risk to its guards."
 war_culture_and_religion_events.89.c:0 "Negotiate service from the artificer's trained attendants."

 war_culture_and_religion_events.90.t:0 "The Caballero's Borrowed Armor"
 war_culture_and_religion_events.90.d:0 "A Tigarrian caballero appears at a review wearing armor pledged to a merchant as security for a debt. The merchant arrives with the receipt and demands that the captain confiscate it.\n\nThe caballero insists that public service must take precedence over private claims. His companions gather around him, and the marshal sends the dispute to court before the procession begins."
 war_culture_and_religion_events.90.a:0 "Pay the debt and honor the caballero's service."
 war_culture_and_religion_events.90.b:0 "Negotiate the claim and release him from the review."
 war_culture_and_religion_events.90.c:0 "Pay clerks to establish a reliable equipment register."
 war_culture_and_religion_events.90.dd:0 "Send his retainers abroad under a guarantee of good service."

 war_culture_and_religion_events.91.t:0 "The Magrittan Captain's Duplicate License"
 war_culture_and_religion_events.91.d:0 "A merchant captain trained in Magritta discovers that another ship carries a copy of his exclusive trading license. Both captains claim their document was issued first and have impounded each other's cargo.\n\nThe harbor clerk admits that his predecessor used the same seal for both. He asks [Root.Monarch.GetName] to settle the claims before foreign buyers withdraw their orders."
 war_culture_and_religion_events.91.a:0 "Pay for a charter review and negotiate exclusive rights."
 war_culture_and_religion_events.91.b:0 "Collect a fee to renew the disputed licenses."

 war_culture_and_religion_events.92.t:0 "The Obregese Cannon Mold"
 war_culture_and_religion_events.92.d:0 "An Obregese foundry family refuses to surrender a cannon mold commissioned by the army. Its master says the agreed price covered casting the guns, not ownership of the design.\n\nThe captain orders guards posted at the workshop, preventing apprentices from leaving. The master sends a model barrel and his contract to court for a ruling."
 war_culture_and_religion_events.92.a:0 "Negotiate military service from the foundry households."
 war_culture_and_religion_events.92.b:0 "Pay for a full register of the foundry's contracts."
 war_culture_and_religion_events.92.c:0 "Pay for trials and teach our officers the design's strengths."

 war_culture_and_religion_events.93.t:0 "The Militia in the Olive Groves"
 war_culture_and_religion_events.93.d:0 "An Irranan estate owner fences off the ground where the local militia has trained for decades. He says the new olive trees are worth more than the occasional broken practice spear.\n\nThe militia captain removes the fence for a scheduled drill. Both men arrive at court with witnesses, while the villagers wait to learn who controls the disputed ground."
 war_culture_and_religion_events.93.a:0 "Recognize a professional militia's independent training rights."
 war_culture_and_religion_events.93.b:0 "Send the militia through the hill roads to practice field maneuvers."
 war_culture_and_religion_events.93.c:0 "Sell the estate an exemption from the training obligation."
 war_culture_and_religion_events.93.dd:0 "Negotiate exclusive supply contracts with the olive growers."

 war_culture_and_religion_events.94.t:0 "The Lance Missing from Couronne's Roll"
 war_culture_and_religion_events.94.d:0 "A Couronnien herald discovers that a knight's household has claimed tournament honors while sending no lance to the required muster. The knight presents an old vow assigning those men to chapel protection.\n\nThe chapel keeper confirms the vow but cannot remember ever seeing the guards. The herald brings both records to [Root.Monarch.GetName] before the next assembly of lances."
 war_culture_and_religion_events.94.a:0 "Fund a traditional review and honor proven service."
 war_culture_and_religion_events.94.b:0 "Negotiate the oath and release the disputed military claim."

 war_culture_and_religion_events.95.t:0 "The Wreck Alms of Lyonesse"
 war_culture_and_religion_events.95.d:0 "Lyonessien villagers salvage grain from a wreck and set aside a portion for the local chapel. A bailiff claims the entire cargo for the shore lord and bars the chapel cart.\n\nThe villagers say the alms were promised for prayers over drowned sailors. They bring a recovered ship's bell to court as a witness to the customary obligation."
 war_culture_and_religion_events.95.a:0 "Pay for a settlement preserving the old salvage custom."
 war_culture_and_religion_events.95.b:0 "Collect the cargo's value for the treasury."
 war_culture_and_religion_events.95.c:0 "Inventory and sell the unclaimed portion of the wreck."

 war_culture_and_religion_events.96.t:0 "The Black Seal on the Muster Order"
 war_culture_and_religion_events.96.d:0 "A Mousillonian steward presents a sealed order demanding service from tenants already summoned by another lord. Both orders appear lawful, but one requires them to report after sunset at a shuttered manor.\n\nThe villagers ask the local herald to decide which summons they must obey. He sends the seals to [Root.Capital.GetName] rather than risk accusing either household of forgery."
 war_culture_and_religion_events.96.a:0 "Confirm our authority and organize the tenants' service."
 war_culture_and_religion_events.96.b:0 "Pay for an audit of the competing obligations."
 war_culture_and_religion_events.96.c:0 "Negotiate the claim and release the disputed levy."
 war_culture_and_religion_events.96.dd:0 "Fund a new household register with verified seals."

 war_culture_and_religion_events.97.t:0 "The Broken Spear at the Hill Fort"
 war_culture_and_religion_events.97.d:0 "A Carcassonnian watchman returns from a hill fort with a spear broken against something that attacked the gate. Its castellan demands a permanent garrison instead of the rotating peasants currently assigned.\n\nVillage headmen say their fields cannot survive another long levy. The castellan sends the damaged spear to court, asking for trained defenders before the creature returns."
 war_culture_and_religion_events.97.a:0 "Commission a trained garrison and register its duties."
 war_culture_and_religion_events.97.b:0 "Send a hard patrol into the hills and learn from its losses."

 war_culture_and_religion_events.98.t:0 "The Wine Casks Promised to the Tourney"
 war_culture_and_religion_events.98.d:0 "A Bourgonian vintner delivers wine for a noble tournament and finds the promised payment replaced by a letter of thanks. The steward says the honor of supplying the household was payment enough.\n\nThe vintner locks the remaining casks in his wagon. Guests are already arriving when both men appeal to [Root.Monarch.GetName] to settle the terms."
 war_culture_and_religion_events.98.a:0 "Pay for the wine and sponsor the tournament's honors."
 war_culture_and_religion_events.98.b:0 "Negotiate payment and reduce the military display."
 war_culture_and_religion_events.98.c:0 "Leave the host and vintner to their agreement."

 war_culture_and_religion_events.99.t:0 "The Bridge to the Aquitanian Chapel"
 war_culture_and_religion_events.99.d:0 "An Aquitanian chapel keeper collects tolls for a bridge repair, but the mason says he has received no wages. Pilgrims find the bridge still unsafe and turn back with their offerings. The mason has left the unfinished supports in place to show where the money was needed.\n\nThe keeper claims the funds were spent on guards for the same road. The mason brings his unpaid accounts to court, demanding to know which work the toll was meant to support."
 war_culture_and_religion_events.99.a:0 "Fund an audit and negotiate a complete repair agreement."
 war_culture_and_religion_events.99.b:0 "Collect the accumulated toll money."
 war_culture_and_religion_events.99.c:0 "Send a costly patrol to assess the road's defenses."
 war_culture_and_religion_events.99.dd:0 "Organize a trial of the mason's new bridge design."

 war_culture_and_religion_events.100.t:0 "The Marcher Village's Unanswered Horn"
 war_culture_and_religion_events.100.d:0 "A Marcher village sounds its warning horn during a raid, but the knight bound to protect it does not arrive. His steward later demands the usual protection tithe without mentioning the attack.\n\nThe villagers bring a burned roof beam and the written oath to court. Their reeve offers recruits for a common defense if the government will guarantee that the next summons is answered."
 war_culture_and_religion_events.100.a:0 "Pay to establish a levy sworn to our authority."
 war_culture_and_religion_events.100.b:0 "Fund a register of protection duties and reported breaches."

 war_culture_and_religion_events.101.t:0 "The Outremer Caravanserai Watch"
 war_culture_and_religion_events.101.d:0 "An Outremer captain discovers that caravan guards leave a fortified lodging unprotected during the midday heat. They insist that their charter requires night duty only, a custom inherited from the first settlers.\n\nA merchant whose goods were stolen during the gap demands compensation. The captain brings the duty roll to [Root.Monarch.GetName], asking for rules suited to the dangers the station now faces."
 war_culture_and_religion_events.101.a:0 "Organize and register a professional watch for the station."
 war_culture_and_religion_events.101.b:0 "Patrol the desert approaches, even if some guards do not return."
 war_culture_and_religion_events.101.c:0 "Negotiate a shared training and watch schedule."

 war_culture_and_religion_events.102.t:0 "The Boss with Two Shares"
 war_culture_and_religion_events.102.d:0 "An Orc boss named Grub claims two shares of the loot because he carried two choppas into the fight. His second-in-command takes the same reasoning seriously and returns wearing six knives.\n\nGrub answers the six knives by borrowing a chariot and claiming its wheels as weapons. Nib, the Goblin counting the shares, starts a new tally for anyone who arrives with a cart.\n\nThe other bosses start adding weapons to their belts before the plunder is divided. A bewildered Goblin counter brings the growing heap of tally sticks to [Root.Monarch.GetName] for a decision."
 war_culture_and_religion_events.102.a:0 "Buy a proper war feast and honor the best fighters."
 war_culture_and_religion_events.102.b:0 "Make the bosses bargain and stop the fighting."
 war_culture_and_religion_events.102.c:0 "Pay counters to sort the shares by actual service."
 war_culture_and_religion_events.102.dd:0 "Let a bloody contest decide who earns the honors."

 war_culture_and_religion_events.103.t:0 "Black Orcs Count the Weapons"
 war_culture_and_religion_events.103.d:0 "A Black Orc captain orders every fighter to lay out his weapons for inspection. He finds that the best-equipped mob has been taking replacements from stores assigned to the others.\n\nThe accused boss claims he merely took what his warriors could use. The inspection stops as rival mobs demand their iron back, leaving the captain waiting for the ruler's judgment."
 war_culture_and_religion_events.103.a:0 "Pay for a settlement and reorganize the stores between drills."
 war_culture_and_religion_events.103.b:0 "Sell the disputed surplus for the ruler's share."

 war_culture_and_religion_events.104.t:0 "The Iron Orc's Cracked Furnace"
 war_culture_and_religion_events.104.d:0 "An Iron Orc smith refuses to relight a cracked furnace until the bosses provide labor and fuel for repairs. One boss answers by ordering warriors to hammer the crack shut.\n\nThe first attempt splits the lining farther and sends everyone running from hot debris. The smith returns with a broken plate and demands control over who works at his furnace."
 war_culture_and_religion_events.104.a:0 "Put the workers under the ruler's authority and organize their service."
 war_culture_and_religion_events.104.b:0 "Pay for repairs and a proper stores register."
 war_culture_and_religion_events.104.c:0 "Fund regular training for the furnace's military crews."

 war_culture_and_religion_events.105.t:0 "Three Toll Clubs on One Road"
 war_culture_and_religion_events.105.d:0 "Border Orcs place three toll barriers on the same road, each within shouting distance of the next. A trader pays the first boss and refuses to move when the second demands another payment.\n\nThe waiting wagons become a prize worth fighting over. Before the bosses attack each other, a Goblin brings their three marked clubs to [Root.Monarch.GetName] and asks which mark counts."
 war_culture_and_religion_events.105.a:0 "Establish an honored, disciplined road guard despite outside anger."
 war_culture_and_religion_events.105.b:0 "Send fighters to force a passage and learn the route."
 war_culture_and_religion_events.105.c:0 "Take a single payment for the ruler."
 war_culture_and_religion_events.105.dd:0 "Give our own traders exclusive rights on the road."

 war_culture_and_religion_events.106.t:0 "The Skull Beside the Desert Well"
 war_culture_and_religion_events.106.d:0 "A Desert Orc boss plants an enemy skull beside a well and claims every drink as part of his plunder. Another mob arrives with empty skins and kicks the skull into the water.\n\nThe first boss demands compensation, while the second refuses to retrieve it. Their warriors gather around the only usable well nearby, bringing the march to a halt."
 war_culture_and_religion_events.106.a:0 "Pay for a traditional challenge and honor the winner."
 war_culture_and_religion_events.106.b:0 "Make the bosses agree on water shares and end the standoff."

 war_culture_and_religion_events.107.t:0 "The Freeboota's Sinking Prize"
 war_culture_and_religion_events.107.d:0 "Two Freeboota captains argue over a captured ship while its hold fills with water. One claims the hull because he boarded first, and the other claims its cargo because he killed the master.\n\nTheir crews stop pumping to hear the verdict. The ship's carpenter sends a Goblin ashore with a waterlogged tally, warning that there will soon be nothing left to divide."
 war_culture_and_religion_events.107.a:0 "Pay the crews and settle the shares by old custom."
 war_culture_and_religion_events.107.b:0 "Take the ruler's cut from the cargo already landed."
 war_culture_and_religion_events.107.c:0 "Organize the salvage and sell what can be recovered."

 war_culture_and_religion_events.108.t:0 "The Chain Found in the Ash Camp"
 war_culture_and_religion_events.108.d:0 "Dark Land Orcs find a slave chain in a trader's baggage, complete with tags naming several members of the camp. The trader blames a Hobgoblin intermediary and tries to leave before the bosses assemble.\n\nThe named warriors drag him before [Root.Monarch.GetName] and demand protection. Others offer to join the ruler's own guard rather than trust the lesser bosses who allowed him inside."
 war_culture_and_religion_events.108.a:0 "Accept their service and assert control over the camp."
 war_culture_and_religion_events.108.b:0 "Pay to inspect and register the visiting traders."
 war_culture_and_religion_events.108.c:0 "Question the trader and stand down the angry mobs."
 war_culture_and_religion_events.108.dd:0 "Fund a new record of camp members and supply contracts."

 war_culture_and_religion_events.109.t:0 "The Swamp Path That Ate a Wagon"
 war_culture_and_religion_events.109.d:0 "A Swamp Orc guide leads a plunder wagon onto a path that sinks beneath its wheels. A rival guide claims the first moved the markers to keep outsiders away from his fishing pools.\n\nThe wagon's escort starts pulling both guides into the mud. The surviving driver reaches the boss with a broken marker and asks who will recover the load and reopen the path."
 war_culture_and_religion_events.109.a:0 "Organize a trained path guard and record its duties."
 war_culture_and_religion_events.109.b:0 "Send a hard recovery party and learn which routes hold."

 war_culture_and_religion_events.110.t:0 "The Goblin Who Counted Backwards"
 war_culture_and_religion_events.110.d:0 "A Goblin counter called Nib scratches each mob's loot share onto a board, then turns it upside down when the bosses complain. The smallest share suddenly becomes the largest, and its owner declares the count correct.\n\nThe others chase Nib beneath the ruler's seat. He emerges clutching the board and offers to explain the marks before anyone decides to eat him."
 war_culture_and_religion_events.110.a:0 "Buy a feast and announce an impressive settlement."
 war_culture_and_religion_events.110.b:0 "Make the bosses negotiate while the fighters stand aside."
 war_culture_and_religion_events.110.c:0 "Send trusted fighters to guarantee the bargain to other camps."

 war_culture_and_religion_events.111.t:0 "The Spider Nest Above the Store"
 war_culture_and_religion_events.111.d:0 "Forest Goblins find a spider nest over their food store and refuse to disturb it without the spider-priest's consent. The priest declares the hatchlings sacred just as they begin swallowing the store's attendants.\n\nThe priest lowers a food basket to prove that the hatchlings can be distracted. They take the basket, then cut its rope before the next porter can climb down.\n\nA surviving porter cuts the hauling rope to keep anyone else from climbing up. He brings it to the boss, asking who will reclaim the food before the spiders spread to the next tree."
 war_culture_and_religion_events.111.a:0 "Pay the priest to negotiate safe access."
 war_culture_and_religion_events.111.b:0 "Sell the surviving stores and take the proceeds."
 war_culture_and_religion_events.111.c:0 "Send hunters into the nest, accepting the losses."
 war_culture_and_religion_events.111.dd:0 "Organize and train dedicated spider handlers."

 war_culture_and_religion_events.112.t:0 "The Fungus Crop Behind the Wall"
 war_culture_and_religion_events.112.d:0 "Night Goblin diggers break through a sealed wall and find a thriving fungus bed. A shaman claims the entire crop for his brews, while the diggers insist it belongs to the mob that found it.\n\nThe boss's collectors arrive to discover both groups hiding mushrooms beneath their robes. They bring a sample back before the harvest disappears into private cooking pots."
 war_culture_and_religion_events.112.a:0 "Claim the bed for the ruler and organize its workers."
 war_culture_and_religion_events.112.b:0 "Pay for a survey and a reliable harvest count."

 war_culture_and_religion_events.113.t:0 "The Fire Kobolds' Stolen Coals"
 war_culture_and_religion_events.113.d:0 "A Fire Kobold keeper opens the ember store and finds its hottest coals replaced with cold stones. Tracks lead toward a training pit where young fighters have built a furnace of their own.\n\nTheir instructor admits taking the coals but says his recruits need real heat to learn. The keeper demands their return before the communal hearth goes out."
 war_culture_and_religion_events.113.a:0 "Put the training pits under strict military supervision."
 war_culture_and_religion_events.113.b:0 "Test the recruits in the hot tunnels despite the danger."
 war_culture_and_religion_events.113.c:0 "Negotiate access and have the instructor teach our officers."

 war_culture_and_religion_events.114.t:0 "The Boyar's Broken Seal"
 war_culture_and_religion_events.114.d:0 "A Gospodar messenger drops a sealed muster order into a fire while drying his gloves. The boyar who receives the remains refuses to send men without proof that the summons is lawful. The messenger has preserved the charred seal in a scrap of cloth.\n\nThe messenger remembers the contents, but the boyar's steward gives a different account of the promised reward. Both travel to [Root.Capital.GetName] before the disputed deadline passes."
 war_culture_and_religion_events.114.a:0 "Pay for a ceremonial renewal of the boyar's oath."
 war_culture_and_religion_events.114.b:0 "Negotiate the summons and release the disputed levy."
 war_culture_and_religion_events.114.c:0 "Pay scribes to reconstruct and register the order."
 war_culture_and_religion_events.114.dd:0 "Accept money in place of the missing recruits."

 war_culture_and_religion_events.115.t:0 "The Grain Frozen to the Wharf"
 war_culture_and_religion_events.115.d:0 "Erengradian dockworkers find grain barges trapped beside a wharf after the water freezes overnight. The cargo owner demands that the crews cut them free, but they are already listed for military service.\n\nThe harbor elder asks for men and money before the hulls are crushed by the shifting ice. He sends the army's summons back to court with a strip torn from a damaged barge."
 war_culture_and_religion_events.115.a:0 "Fund the rescue, negotiate duties, and release the needed workers."
 war_culture_and_religion_events.115.b:0 "Collect the cargo dues despite the owners' protests."

 war_culture_and_religion_events.116.t:0 "The Hearth Oath and the Marriage"
 war_culture_and_religion_events.116.d:0 "A Tzavarian household promises riders to a winter muster, then claims the same men must escort a marriage party. Its elder produces a knotted oath cord older than the recruiting officer's written order.\n\nThe marriage links two households that have feuded over grazing for years. The officer asks [Root.Monarch.GetName] whether to enforce the levy or recognize the bargain tied into the cord."
 war_culture_and_religion_events.116.a:0 "Accept an oath of service and open the households' trade."
 war_culture_and_religion_events.116.b:0 "Pay to record and reconcile the competing obligations."
 war_culture_and_religion_events.116.c:0 "Fund a witnessed marriage settlement that others can trust."

 war_culture_and_religion_events.117.t:0 "The Bell with No Clapper"
 war_culture_and_religion_events.117.d:0 "A Dolvarian sled master reaches a watchpost during a raid and pulls its warning bell, only to find the clapper missing. The keeper had lent it to a smith who never returned it.\n\nThe sled master escapes with a wounded guard and the useless bell. At the next muster he demands a proper watch system, bringing every waiting captain into the argument."
 war_culture_and_religion_events.117.a:0 "Commission trained bell keepers and register their watch duties."
 war_culture_and_religion_events.117.b:0 "Send riders along the whole warning route, despite the danger."
 war_culture_and_religion_events.117.c:0 "Fine the keepers and collect the missing dues."
 war_culture_and_religion_events.117.dd:0 "Negotiate a public honor for the men who held the post."

 war_culture_and_religion_events.118.t:0 "The Gorelsk Market Fire"
 war_culture_and_religion_events.118.d:0 "At a Gorelsk winter market, a brazier overturns beside the fur stalls and sets a roof alight. Armed guards clear a path through the crowd, then begin claiming rescued bales as payment.\n\nThe fur sellers barricade the remaining stock and demand the guards withdraw. Their market elder asks the ruler to decide who should pay for the rescue and lost goods."
 war_culture_and_religion_events.118.a:0 "Pay and honor the guards despite the traders' objections."
 war_culture_and_religion_events.118.b:0 "Negotiate compensation and remove the troops from the stalls."

 war_culture_and_religion_events.119.t:0 "The Icon Left at the Border Post"
 war_culture_and_religion_events.119.d:0 "A Krevarian patrol returns without the icon entrusted to its riders by a village shrine. The captain says he left it at an isolated post so the replacement watch would have its protection.\n\nThe village keeper demands its return before a family rite, and the replacement watch refuses to surrender it. Messengers carry both requests to [Root.Capital.GetName] while the patrol remains assembled."
 war_culture_and_religion_events.119.a:0 "Pay for a settlement and register the shrine's loans."
 war_culture_and_religion_events.119.b:0 "Collect a levy on the disputed service."
 war_culture_and_religion_events.119.c:0 "Organize exclusive local supply rights for the watchposts."

 war_culture_and_religion_events.120.t:0 "The Sudevarian Seed Cart"
 war_culture_and_religion_events.120.d:0 "A Sudevarian grain elder intercepts a military cart carrying sacks marked as spring seed. The quartermaster claims his orders permit all stored grain, even if the harvest afterward must be smaller.\n\nFarmers surround the cart and refuse to let it leave. The elder sends its markings to court, offering an alternative levy if the army returns the seed."
 war_culture_and_religion_events.120.a:0 "Negotiate recruits from the farming households."
 war_culture_and_religion_events.120.b:0 "Pay to audit and separate seed from ordinary stores."
 war_culture_and_religion_events.120.c:0 "Withdraw the military claim and negotiate supplies."
 war_culture_and_religion_events.120.dd:0 "Pay to restore the seed and publicly honor the growers."

 war_culture_and_religion_events.121.t:0 "The Ribbon on the Wrong Watchpost"
 war_culture_and_religion_events.121.d:0 "A Pogranicznik scout follows a colored ribbon marking a safe frontier path and walks into an abandoned watchpost. He finds fresh raider tracks where a garrison should have stood.\n\nThe keeper of the next post admits moving the ribbon to shorten his own patrol. The scout brings both markers to the ruler, asking for a watch whose signals can be trusted."
 war_culture_and_religion_events.121.a:0 "Give the scouts a public commission and strict patrol standards."
 war_culture_and_religion_events.121.b:0 "Send the scouts beyond the abandoned post to trace the raiders."

 war_culture_and_religion_events.122.t:0 "The Sibyrian Trapper's Empty Cache"
 war_culture_and_religion_events.122.d:0 "A Sibyrian trapper reaches his winter cache and finds army marks burned into the empty door. A passing patrol had taken the food, leaving a receipt payable at a treasury far beyond the trapper's route.\n\nHe survives by abandoning his furs and returning early. At court, he places the useless receipt beside a torn snare and asks who protects the people supplying the northern trails."
 war_culture_and_religion_events.122.a:0 "Pay compensation and organize military supply lessons."
 war_culture_and_religion_events.122.b:0 "Negotiate the claim and reduce the patrol's demands."
 war_culture_and_religion_events.122.c:0 "Enlist a smaller body of trained winter specialists."

 war_culture_and_religion_events.123.t:0 "The Mill That Ground Army Flour"
 war_culture_and_religion_events.123.d:0 "A Wheatlander miller receives grain for army bread with an order to work through the night. The village's own grain waits outside, while the worn millwheel begins to split.\n\nThe miller stops the wheel before it fails and sends his apprentice to the local captain. The captain appeals to [Root.Monarch.GetName] for a ruling before both the army and the village run out of flour."
 war_culture_and_religion_events.123.a:0 "Pay for repairs and negotiate duties under the old milling custom."
 war_culture_and_religion_events.123.b:0 "Collect the disputed milling dues."
 war_culture_and_religion_events.123.c:0 "Send a costly armed party to secure other supplies."
 war_culture_and_religion_events.123.dd:0 "Organize negotiations between the millers and the army."

 war_culture_and_religion_events.124.t:0 "The Scythian Rider's Inherited Saddle"
 war_culture_and_religion_events.124.d:0 "A Scythian elder names a young rider to fulfill the service once owed by his father. The youth refuses because the father's saddle and horse were taken by a creditor after his death.\n\nThe elder calls the refusal a breach of clan custom. Relatives bring the saddle to the ruler's camp, asking whether service can be inherited without the means to perform it."
 war_culture_and_religion_events.124.a:0 "Uphold the traditional oath and muster the household's riders."
 war_culture_and_religion_events.124.b:0 "Pay to register equipment and service obligations together."

 war_culture_and_religion_events.125.t:0 "The Roppsmenn Boat under the Ice"
 war_culture_and_religion_events.125.d:0 "Roppsmenn boatmen drag an abandoned patrol boat from the river ice and repair its hull. When the captain returns, he claims both the boat and the work as service owed to the realm.\n\nA boatwright identifies fresh work on every seam below the waterline. He says the craft would have sunk again without the repairs, even if the patrol's badge remained nailed to its stern.\n\nThe boatmen refuse to release it without recognition of their effort. They bring the old patrol badge to [Root.Monarch.GetName], asking who now has the right to crew the vessel."
 war_culture_and_religion_events.125.a:0 "Stage a military dedication honoring the rescuers."
 war_culture_and_religion_events.125.b:0 "Send the repaired boat on a patrol through the remaining river ice."
 war_culture_and_religion_events.125.c:0 "Negotiate access and learn the boatmen's river methods."

 war_culture_and_religion_events.126.t:0 "The Ungol Camp Beyond the Survey"
 war_culture_and_religion_events.126.d:0 "An Ungol camp returns to its seasonal grazing ground and finds new survey stakes across the approach. A settled landholder claims the grassland under a charter issued during the camp's absence.\n\nThe riders move the stakes but leave the landholder's fence intact. Their elder brings the charter to court, asking that the old grazing agreement be heard before the next herd arrives."
 war_culture_and_religion_events.126.a:0 "Pay for a public renewal of the grazing oath."
 war_culture_and_religion_events.126.b:0 "Negotiate the boundary and stand down the armed escorts."
 war_culture_and_religion_events.126.c:0 "Fund a record of seasonal grazing rights."
 war_culture_and_religion_events.126.dd:0 "Accept payment and release the camp's men from the levy."

 war_culture_and_religion_events.127.t:0 "The Praag Mason's Second Bill"
 war_culture_and_religion_events.127.d:0 "A Praager mason repairs a watch wall and discovers older stonework that still bears marks of Chaos corruption. He submits a second bill for replacing it rather than covering it again.\n\nThe official paying him insists the first contract included every repair. The mason brings a marked fragment to court after the watch refuses to sleep beside the exposed section."
 war_culture_and_religion_events.127.a:0 "Pay for a full inspection and negotiate a revised contract."
 war_culture_and_religion_events.127.b:0 "Recover the disputed funds through a special levy."

 war_culture_and_religion_events.128.t:0 "The Sartosan Prize with Two Captains"
 war_culture_and_religion_events.128.d:0 "A Sartosan crew returns with a captured ship and two captains claiming command. One led the boarding party, while the other locked him in the prize's cabin before bringing it home. The imprisoned captain escaped only when the crew wanted its shares counted.\n\nThe harbor court finds both men listed in the ship's articles as temporary successors. Their armed followers await [Root.Monarch.GetName]'s ruling on which signature can dispose of the prize."
 war_culture_and_religion_events.128.a:0 "Accept the crew's service under an oath to our authority."
 war_culture_and_religion_events.128.b:0 "Pay to audit the articles and prize accounts."
 war_culture_and_religion_events.128.c:0 "Pay the claimants to accept a negotiated settlement."

 war_culture_and_religion_events.129.t:0 "The Reman Drill Manual"
 war_culture_and_religion_events.129.d:0 "A Reman officer finds an old military manual in a patrician family's library and asks to use it at the next muster. The family agrees only if its ancestor's name is announced before every exercise.\n\nVeteran captains object to maneuvers designed for a different age. The officer demonstrates one successful drill in the forum, then seeks the ruler's backing for a longer trial."
 war_culture_and_religion_events.129.a:0 "Commission a drill school that preserves the old manual's methods."
 war_culture_and_religion_events.129.b:0 "Try the ancient formations in the field, accepting casualties."
 war_culture_and_religion_events.129.c:0 "Sell the family an exclusive sponsorship of the muster."
 war_culture_and_religion_events.129.dd:0 "Negotiate access and copy the useful military lessons."

 war_culture_and_religion_events.130.t:0 "The Luccian Merchant's Armed Escort"
 war_culture_and_religion_events.130.d:0 "A Luccian merchant hires soldiers to escort a shipment, then orders them to seize a rival's wagons at a disputed bridge. Their captain refuses, saying the contract covers defense alone.\n\nThe merchant withholds the company's pay and appeals to an old family privilege. The captain brings the contract to court while his hungry men wait beside the impounded wagons."
 war_culture_and_religion_events.130.a:0 "Pay and honor the company while reviewing its service."
 war_culture_and_religion_events.130.b:0 "Negotiate the contract and release the soldiers from the dispute."

 war_culture_and_religion_events.131.t:0 "The Tobaran Gatehouse Key"
 war_culture_and_religion_events.131.d:0 "A Tobaran gate keeper dies with the only key to a store chamber hidden in his house. His heirs demand a payment before surrendering it, citing the family's hereditary office.\n\nThe guard captain threatens to break the door, which would damage supplies stored behind it. The heirs arrive at court carrying the key and the original charter of service."
 war_culture_and_religion_events.131.a:0 "Pay for a settlement preserving the old charter."
 war_culture_and_religion_events.131.b:0 "Collect the chamber's dues and reject the heirs' claim."
 war_culture_and_religion_events.131.c:0 "Organize a new roster of gatehouse recruits."

 war_culture_and_religion_events.132.t:0 "The Umbrian Vineyard Guard"
 war_culture_and_religion_events.132.d:0 "An Umbrian estate hires pikemen to protect the grape harvest, then keeps them after their contract ends. The owner says they still owe service because they ate from his stores while waiting for their final wages.\n\nThe captain orders the men to stack their pikes and refuse further work. A notary carries the contract to court before the dispute leaves the vineyards unguarded."
 war_culture_and_religion_events.132.a:0 "Accept the company into service under our authority."
 war_culture_and_religion_events.132.b:0 "Pay to reconcile the wages and provision accounts."
 war_culture_and_religion_events.132.c:0 "Negotiate the release and stand down the company."
 war_culture_and_religion_events.132.dd:0 "Pay for mediation between the owner and the captain."

 war_culture_and_religion_events.133.t:0 "The Miraglianese Sluice Exercise"
 war_culture_and_religion_events.133.d:0 "A Miraglianese engineer opens a sluice during a military exercise and strands half a company behind rising water. He says the maneuver proves how the same channel could trap an enemy.\n\nA sergeant improvises a rope crossing and gets his company out before the current strengthens. The engineer copies the maneuver into his notes without crediting the man who devised it.\n\nThe captain says it proves his men were never told the plan. Both submit reports to [Root.Monarch.GetName], asking who will direct future work between the engineers and the army."
 war_culture_and_religion_events.133.a:0 "Commission joint training for the engineers and field companies."
 war_culture_and_religion_events.133.b:0 "Repeat the field trial despite the risk of losses."

 war_culture_and_religion_events.134.t:0 "The Aesling Oath Ring Cut Apart"
 war_culture_and_religion_events.134.d:0 "An Aesling raider returns with an oath ring broken into pieces for dividing as loot. An elder recognizes the ring as one pledged to his family by the raider's own captain.\n\nThe captain claims conquest canceled the old promise. The pieces are laid before [Root.Monarch.GetName] while the two families assemble their armed witnesses."
 war_culture_and_religion_events.134.a:0 "Fund a traditional judgment and honor proven warriors."
 war_culture_and_religion_events.134.b:0 "Negotiate a settlement and stand down their escorts."
 war_culture_and_religion_events.134.c:0 "Release disputed recruits and record the old obligations."

 war_culture_and_religion_events.135.t:0 "The Skaeling Crew's Winter Share"
 war_culture_and_religion_events.135.d:0 "A Skaeling ship returns late enough that its crew finds the winter stores already divided. The shipowner claims their absence forfeited their share, although he has taken his own portion of the voyage's plunder.\n\nThe crew hauls the loot back aboard and bars the gangplank. Their steersman asks the ruler to settle the shares before the harbor freezes around the ship."
 war_culture_and_religion_events.135.a:0 "Pay for a settlement and record each crew's obligations."
 war_culture_and_religion_events.135.b:0 "Take the ruler's due from the landed plunder."
 war_culture_and_religion_events.135.c:0 "Send the crew to scout the icebound coast, even if men are lost."
 war_culture_and_religion_events.135.dd:0 "Organize a permanent trained crew from the returning raiders."

 war_culture_and_religion_events.136.t:0 "The Bjornling Challenger's Witnesses"
 war_culture_and_religion_events.136.d:0 "A Bjornling warrior claims a household after defeating its head in a challenge. The defeated man's relatives insist that the fight was only for a seat at the feast, not the house itself.\n\nBoth sides bring witnesses who remember different terms. The oath-speaker stops another challenge and asks [Root.Monarch.GetName] to define what the first victory actually won."
 war_culture_and_religion_events.136.a:0 "Pay for a settlement and bind the household's warriors to us."
 war_culture_and_religion_events.136.b:0 "Fund a record of witnessed challenge terms."

 war_culture_and_religion_events.137.t:0 "The Graeling Skald's Changed Verse"
 war_culture_and_religion_events.137.d:0 "A Graeling skald praises a captain for leading a raid that another warrior planned. The overlooked warrior interrupts the song and recites the route he gave the captain before departure.\n\nThe captain's followers demand that the feast continue, while the planner's companions begin removing their gifts. The skald asks the ruler whose name belongs in the account."
 war_culture_and_religion_events.137.a:0 "Give proven raiders a public commission and regular training."
 war_culture_and_religion_events.137.b:0 "Make the rivals lead a patrol beyond the winter camps."
 war_culture_and_religion_events.137.c:0 "Negotiate a public recognition of the overlooked warrior."

 war_culture_and_religion_events.138.t:0 "The Varg Raider Who Came Home Early"
 war_culture_and_religion_events.138.d:0 "A Varg raider returns ahead of his company with a captured standard and a story of victory. The remaining survivors arrive later and accuse him of abandoning them while they fought their way out.\n\nHe insists that saving the standard was his duty. The survivors throw their broken weapons at his feet and demand that [Root.Monarch.GetName] decide what his deed deserves."
 war_culture_and_religion_events.138.a:0 "Pay for a military inquiry and honor the banner's recovery."
 war_culture_and_religion_events.138.b:0 "Negotiate compensation and stand down the survivors."
 war_culture_and_religion_events.138.c:0 "Pay to reconstruct the company's missing records."
 war_culture_and_religion_events.138.dd:0 "Release the survivors from service and take a share of the plunder."

 war_culture_and_religion_events.139.t:0 "The Sarl Hull on Another Family's Shore"
 war_culture_and_religion_events.139.d:0 "A Sarl shipowner beaches a damaged hull on land claimed by another household. Its elder refuses to let repairs begin until the owner promises a share of the next voyage.\n\nThe crew has already cut timber from the shore grove. The two families bring the first repair beam to the ruler's hall, each claiming the other owes payment."
 war_culture_and_religion_events.139.a:0 "Fund repairs and negotiate the household's independent rights."
 war_culture_and_religion_events.139.b:0 "Collect a shore fee from the shipowner."

 war_culture_and_religion_events.140.t:0 "The Baersonling Seat Beside the Fire"
 war_culture_and_religion_events.140.d:0 "At a Baersonling winter gathering, a young chief takes a seat traditionally held by his grandfather's rival. He says the feud ended with the old men's deaths, but the rival's descendants arrive armed. The young chief keeps his hands visible and refuses to leave the seat.\n\nThe host refuses to serve either family until they settle who may sit there. Their oath cords are brought to [Root.Monarch.GetName] as the rest of the gathering waits in the cold."
 war_culture_and_religion_events.140.a:0 "Bind both families' warriors to the ruler and assign their places."
 war_culture_and_religion_events.140.b:0 "Pay to reconcile the family claims and record the ruling."
 war_culture_and_religion_events.140.c:0 "Fund a new record of household duties at winter gatherings."

 war_culture_and_religion_events.141.t:0 "The Skeggling Map Drawn on a Sail"
 war_culture_and_religion_events.141.d:0 "A Skeggling crew returns from a distant coast with its route painted on a spare sail. The navigator claims the chart as his own, while the captain says every discovery belongs to the voyage's backers.\n\nThe sail is cut from its mast before either can hide it. Veteran raiders bring it to the ruler, asking who may use the route when the next fleet departs."
 war_culture_and_religion_events.141.a:0 "Commission trained expedition crews and record their duties."
 war_culture_and_religion_events.141.b:0 "Send a scouting crew to test the chart, accepting losses."
 war_culture_and_religion_events.141.c:0 "Sell licensed copies of the chart."
 war_culture_and_religion_events.141.dd:0 "Require the claimants to acknowledge the ruler's final authority."

 war_culture_and_religion_events.142.t:0 "The Gharhar Herd at the Winter Crossing"
 war_culture_and_religion_events.142.d:0 "A Gharhar herd reaches its winter crossing and finds another camp's warriors guarding the ice. They demand animals as payment, claiming that their scouts found the only safe route.\n\nThe herders remember using it for years and refuse to surrender breeding stock. A scout brings a cracked ice pole to the ruler, warning that the argument is wasting the remaining safe weather."
 war_culture_and_religion_events.142.a:0 "Buy supplies and sponsor an honored escort across the ice."
 war_culture_and_religion_events.142.b:0 "Negotiate passage and dismiss the armed guard."

 war_culture_and_religion_events.143.t:0 "The Kvellig Debt Cord"
 war_culture_and_religion_events.143.d:0 "A Kvellig widow presents a knotted cord recording provisions lent to a raiding captain. He claims two knots were added after her husband's death and refuses the debt.\n\nThe oath-cutter who made the cord recognizes his work but cannot remember the disputed additions. He asks [Root.Monarch.GetName] to hear the surviving crew before the family feud spreads."
 war_culture_and_religion_events.143.a:0 "Pay for arbitration and register the witnessed debts."
 war_culture_and_religion_events.143.b:0 "Take the disputed payment into the treasury."
 war_culture_and_religion_events.143.c:0 "Organize a military hearing of the captain's crew."

 war_culture_and_religion_events.144.t:0 "The Path the Waywatcher Closed"
 war_culture_and_religion_events.144.d:0 "An Asrai Waywatcher seals a forest path after finding iron traps beneath its roots. The closure cuts off a glade whose hunters deny placing them and offer to help track the intruder.\n\nThe Waywatcher returns with a captive carrying one of the glade's tokens. Its elder identifies the token as stolen, but the gathered warriors will not disperse until the ruler decides how the path will be guarded."
 war_culture_and_religion_events.144.a:0 "Bind the hunters to our authority and defend the closure."
 war_culture_and_religion_events.144.b:0 "Pay to record the paths and their keepers."
 war_culture_and_religion_events.144.c:0 "Negotiate access and stand down the patrols."
 war_culture_and_religion_events.144.dd:0 "Fund a search and learn the intruder's route."

 war_culture_and_religion_events.145.t:0 "Axes at the Eonir Boundary"
 war_culture_and_religion_events.145.d:0 "An Eonir scout catches woodcutters moving boundary branches before felling marked trees. Their employer produces a permit whose description of the border omits the oldest grove.\n\nThe scout escorts them out, but keeps their axes as evidence. Returning to the council, she asks for permanent wardens who know the traditional boundary well enough to prevent another intrusion."
 war_culture_and_religion_events.145.a:0 "Commission trained wardens to enforce the traditional boundary."
 war_culture_and_religion_events.145.b:0 "Track the woodcutters' approach through the unguarded forest."

 war_culture_and_religion_events.146.t:0 "The Dryad Who Returned the Axe"
 war_culture_and_religion_events.146.d:0 "A Dryad enters the gathering carrying an axe buried in her shoulder and the severed hand that held it. A neighboring coven insists the attack occurred on ground it alone has the right to defend.\n\nThe wounded spirit refuses to surrender the axe until the attacker is found. The covens gather at the damaged tree, forcing their ruler to settle who will lead the pursuit."
 war_culture_and_religion_events.146.a:0 "Spend our stores on a public hunt and honor its warriors."
 war_culture_and_religion_events.146.b:0 "Negotiate the covens' claims and stop the muster."
 war_culture_and_religion_events.146.c:0 "Release warriors to the covens in return for an agreement."

 war_culture_and_religion_events.147.t:0 "The Treeman and the Buried Road"
 war_culture_and_religion_events.147.d:0 "An ancient Treeman wakes beside a paved road and begins lifting its stones from his roots. Attendants explain that the road was built while he slept, under an agreement with another grove.\n\nThe ancient remembers no such bargain and blocks passage with fallen branches. The grove speakers bring the old agreement to their ruler while travelers wait for a route around him."
 war_culture_and_religion_events.147.a:0 "Fund a new agreement and reorganize the paths."
 war_culture_and_religion_events.147.b:0 "Collect payment for the disputed passage."
 war_culture_and_religion_events.147.c:0 "Send a costly armed scouting party around the obstruction."
 war_culture_and_religion_events.147.dd:0 "Allow the grove speakers to settle it themselves."

 war_culture_and_religion_events.148.t:0 "The Gor Who Hid the Best Axe"
 war_culture_and_religion_events.148.d:0 "A Gor places a cracked shield before the herdstone as his share of the plunder. An Ungor later finds the same warrior hiding a fine axe beneath his sleeping skins. The Ungor also finds a pouch of coins the raider had declared lost.\n\nThe Bray-Shaman drags both objects into the clearing and calls the herd to witness the deceit. Other warriors offer service to whichever leader promises that the strongest will no longer conceal every useful weapon."
 war_culture_and_religion_events.148.a:0 "Enforce the old tribute law and gather warriors under the Beastlord."
 war_culture_and_religion_events.148.b:0 "Buy back the disputed spoils and organize the camp's stores."

 war_culture_and_religion_events.149.t:0 "The Bovigor at the Narrow Gate"
 war_culture_and_religion_events.149.d:0 "A Bovigor champion widens a captured gate by smashing its posts with his horns. His followers claim first choice of the plunder, though another herd had already broken the defenders.\n\nThe rival champion blocks the opening with a wagon. Neither will yield until the herd's ruler decides whether strength at the gate outweighs the fighting that came before it."
 war_culture_and_religion_events.149.a:0 "Pay for an honored, disciplined corps of gate breakers."
 war_culture_and_religion_events.149.b:0 "Test both herds in a costly assault exercise."
 war_culture_and_religion_events.149.c:0 "Negotiate a public honor for the champion's feat."

 war_culture_and_religion_events.150.t:0 "The Caprigor Above the Ambush"
 war_culture_and_religion_events.150.d:0 "A Caprigor scout reaches a cliff ledge overlooking a guarded caravan and drops a stolen helmet into camp as proof. His chief claims the route for his herd and bars other scouts from following.\n\nA rival reaches the ledge by another path and signals the same target. Both return before the caravan moves, demanding that the ruler decide who leads and who receives the first spoils."
 war_culture_and_religion_events.150.a:0 "Fund the raid and proclaim the cliff herd's prowess."
 war_culture_and_religion_events.150.b:0 "Negotiate the shares and stand down the rival parties."
 war_culture_and_religion_events.150.c:0 "Pay the scouts to mark and organize both routes."
 war_culture_and_religion_events.150.dd:0 "Test new climbing methods despite the danger to scouts."

 war_culture_and_religion_events.151.t:0 "The Centigor's Watered Ale"
 war_culture_and_religion_events.151.d:0 "Centigors break open a captured ale cart and discover that several casks contain only water. The raider guarding it swears the drink was sound before another herd visited the camp.\n\nOne Centigor remembers seeing the guard wash a cask beside the stream. The guard replies that he was rinsing away evidence of theft, an explanation that starts another round of accusations.\n\nThe accused herd offers empty cups as its only evidence. The Beastlord finds both groups arguing over the remaining casks while thirsty warriors search the baggage for more."
 war_culture_and_religion_events.151.a:0 "Buy drink from outside traders and settle the shares."
 war_culture_and_religion_events.151.b:0 "Sell the surviving ale and take the proceeds."

 war_culture_and_religion_events.152.t:0 "The Ungor Who Kept the Spear"
 war_culture_and_religion_events.152.d:0 "An Ungor named Rekk kills a caravan guard and takes his spear, only to have a larger raider demand it as tribute. Rekk refuses and gathers other scouts who have lost their weapons the same way.\n\nThe scouts stop bringing reports to the camp. Their spokesman lays a pile of broken hunting bows before the ruler and asks whether useful service earns anything they can keep."
 war_culture_and_religion_events.152.a:0 "Pay for weapons and bind the scouts directly to the ruler."
 war_culture_and_religion_events.152.b:0 "Buy the disputed spear and reorganize the equipment shares."
 war_culture_and_religion_events.152.c:0 "Purchase weapons reserved for our own herd's use."

 war_culture_and_religion_events.153.t:0 "The Lake Men's Sunken Plunder"
 war_culture_and_religion_events.153.d:0 "Lake Men raiders hide stolen chests beneath a reed platform, then return to find the platform sunk. A rival band has moved the markers and claims the chests were abandoned.\n\nThe first band brings up one chest with its own carved tally still attached. Both groups gather at the water's edge, asking their ruler to decide who will dive for the rest."
 war_culture_and_religion_events.153.a:0 "Establish an honored recovery band under traditional discipline."
 war_culture_and_religion_events.153.b:0 "Send divers after the remaining chests, even if some drown."
 war_culture_and_religion_events.153.c:0 "Sell the recovered chest for the ruler's share."
 war_culture_and_religion_events.153.dd:0 "Negotiate service from the rival marsh bands."

 war_culture_and_religion_events.154.t:0 "The Broken Collar from Naggaroth"
 war_culture_and_religion_events.154.d:0 "A Beastman tears a Druchii collar from his neck and brings it to the herdstone. He escaped a hunting enclosure and can name the paths used by the slavers' patrols.\n\nOther escaped captives recognize the collar's mark and gather around him. The herd's chiefs argue over whether his knowledge earns him a place beside their champions or merely another scouting duty."
 war_culture_and_religion_events.154.a:0 "Spend plunder on a feast honoring the escape."
 war_culture_and_religion_events.154.b:0 "Negotiate with the escapees and suspend the rival chiefs' demands."

 war_culture_and_religion_events.155.t:0 "The Ymir Store Beneath the Snow"
 war_culture_and_religion_events.155.d:0 "A Ymir hunter digs into a shared winter cache and finds another herd's marks cut over his own. The new claimants have moved the meat farther beneath the ice and refuse to reveal it.\n\nHis companions track the drag marks to a frozen hollow. Both herds gather there, waiting for the ruler's order before breaking open a store they may all need before spring."
 war_culture_and_religion_events.155.a:0 "Buy provisions and organize clearly marked common stores."
 war_culture_and_religion_events.155.b:0 "Take and sell the ruler's share of the cache."
 war_culture_and_religion_events.155.c:0 "Organize a disciplined guard for the winter stores."

 war_culture_and_religion_events.156.t:0 "The Beastfiend's Changing Scar"
 war_culture_and_religion_events.156.d:0 "A Beastfiend shows the herd a scar shaped like its ruler's mark and claims a place among the chosen warriors. By the next fire, the scar resembles the mark of a rival champion.\n\nThe Bray-Shaman watches the change and orders the claimant held until the ruler arrives. Other marked fighters gather nearby, demanding to know whether their own oaths will now be doubted."
 war_culture_and_religion_events.156.a:0 "Bind the marked warriors directly to the ruler and organize their service."
 war_culture_and_religion_events.156.b:0 "Pay the shaman to record the changing marks."
 war_culture_and_religion_events.156.c:0 "Negotiate an oath and stand down the gathered fighters."
 war_culture_and_religion_events.156.dd:0 "Spend plunder to recruit the waiting marked warriors."

 war_culture_and_religion_events.157.t:0 "The Eatainian Harbor Review"
 war_culture_and_religion_events.157.d:0 "An Eatainian captain stages a harbor defense exercise using tactics learned with the Lothern Sea Guard. Half the levy follows the wrong signal and blocks the pier intended for the archers.\n\nThe captain repeats the movement until the crews complete it together. His report reaches [Root.Monarch.GetName] with a request for time and officers to make the improvement permanent."
 war_culture_and_religion_events.157.a:0 "Give the captain a public commission to drill the harbor levy."
 war_culture_and_religion_events.157.b:0 "Put the new signals to use on an exposed coastal patrol."

 war_culture_and_religion_events.158.t:0 "The Yvressi Warden's Missing Key"
 war_culture_and_religion_events.158.d:0 "A Yvressi warden discovers that an old mistward chamber has been opened without his key. A noble household admits entering to recover an ancestral standard stored there generations ago. The chamber's keeper had never been told that the standard remained inside.\n\nThe household returns the standard when the wards begin behaving unpredictably. The warden asks the ruler for a permanent settlement of access before another private claim disturbs the defenses."
 war_culture_and_religion_events.158.a:0 "Fund and honor the wardens, opening procurement to outside suppliers."
 war_culture_and_religion_events.158.b:0 "Negotiate access and suspend the additional guard."
 war_culture_and_religion_events.158.c:0 "Release recruits to the wardens in return for an agreement."

 war_culture_and_religion_events.159.t:0 "The Sapherian Apprentice's Borrowed Book"
 war_culture_and_religion_events.159.d:0 "A Sapherian apprentice lends a restricted book to a visiting scholar, who returns it with useful corrections in the margins. The librarian recognizes the value of the notes but demands punishment for the unauthorized loan.\n\nThe apprentice asks that both the offense and the discovery be judged together. His master brings the book to [Root.Monarch.GetName], with the disputed passages carefully marked."
 war_culture_and_religion_events.159.a:0 "Pay for a review and catalog the corrected text."
 war_culture_and_religion_events.159.b:0 "Collect a fine for the unauthorized loan."
 war_culture_and_religion_events.159.c:0 "Send armed scholars to test the spells, accepting casualties."
 war_culture_and_religion_events.159.dd:0 "Organize a formal scholarly exchange with the visitor's school."

 war_culture_and_religion_events.160.t:0 "The Avelorni Guard's Interrupted Vigil"
 war_culture_and_religion_events.160.d:0 "An Avelorni guard leaves a ceremonial vigil to guide lost travelers away from a dangerous grove. Her captain records the departure as a breach of duty, despite the rescued travelers' testimony.\n\nThe grove keeper confirms that the travelers would not have survived the night unaided. At the next assembly, volunteers offer their service if the court will make clear which duty should take precedence."
 war_culture_and_religion_events.160.a:0 "Secure an oath to the ruler and accept the volunteers."
 war_culture_and_religion_events.160.b:0 "Pay to reconcile the vigil and rescue obligations in the records."

 war_culture_and_religion_events.161.t:0 "The Chracian Hunter's Unclaimed Pelt"
 war_culture_and_religion_events.161.d:0 "A Chracian hunter brings home a white lion's pelt but refuses the honor offered for it. He says another hunter wounded the beast first and died before the final struggle.\n\nA surviving companion produces the dead hunter's axe, still caught in the lion's hide. The young hunter refuses to remove it until both names have been heard before witnesses.\n\nThe dead hunter's family asks that the feat belong to both. Their companions bring the pelt to the ruler, ready to serve in a company that recognizes the courage of those who do not return."
 war_culture_and_religion_events.161.a:0 "Commission regular training for the hunters and open their supply contracts."
 war_culture_and_religion_events.161.b:0 "Send the hunters to scout hostile ground, even if some are lost."
 war_culture_and_religion_events.161.c:0 "Sell the pelt and collect the proceeds for the treasury."

 war_culture_and_religion_events.162.t:0 "The Cothiquan Chart from the Wreck"
 war_culture_and_religion_events.162.d:0 "A Cothiquan salvage crew recovers a storm chart from a wreck and recognizes routes absent from the public archive. The dead captain's relatives demand its return as family property.\n\nAnother captain points out that the chart could prevent similar losses. The archivist brings the water-stained pages to court before either side can remove them."
 war_culture_and_religion_events.162.a:0 "Fund an honored naval expedition to test the chart, despite the risks."
 war_culture_and_religion_events.162.b:0 "Negotiate access and cancel the military trial."
 war_culture_and_religion_events.162.c:0 "Pay to preserve and catalog the recovered routes."
 war_culture_and_religion_events.162.dd:0 "Assign men to enforce the ruler's claim over the archive."

 war_culture_and_religion_events.163.t:0 "The Nagarythi Scout Who Returned Late"
 war_culture_and_religion_events.163.d:0 "A Nagarythi scout returns long after his patrol was declared lost and his equipment reassigned. He brings details of a Druchii route, but finds that his former place has been given to another warrior.\n\nHis captain accepts the report while refusing to reverse the appointment. The scout appeals with the names of companions he buried, asking for recognition of service the records say had ended."
 war_culture_and_religion_events.163.a:0 "Pay for a settlement and reconstruct the patrol's records."
 war_culture_and_religion_events.163.b:0 "Collect the value of the disputed equipment."

 war_culture_and_religion_events.164.t:0 "The Tiranoci Chariot in the Surf"
 war_culture_and_religion_events.164.d:0 "A Tiranoci family recovers part of an ancestral chariot after a storm exposes buried wreckage along the shore. Its surviving axle bears the household's old military mark.\n\nThe family offers to restore the chariot if its hereditary place in the muster is recognized. Younger officers argue that the obligation should be based on present service, and the court must settle the claim."
 war_culture_and_religion_events.164.a:0 "Recognize the old service oath and accept its recruits."
 war_culture_and_religion_events.164.b:0 "Pay for an audit of surviving chariots and obligations."
 war_culture_and_religion_events.164.c:0 "Fund the household's return to military service."

 war_culture_and_religion_events.165.t:0 "The Ellyrian Mare at the Muster"
 war_culture_and_religion_events.165.d:0 "An Ellyrian horse master recognizes a young mare at the muster as one taken from his breeding herd without permission. The rider says his family received it as payment for escort duty.\n\nThe escort captain cannot produce the promised transfer record. The horse master brings the mare's lineage marks to court, determined that the confusion should not spread to the rest of the herd."
 war_culture_and_religion_events.165.a:0 "Restore the traditional remount rules through professional training."
 war_culture_and_religion_events.165.b:0 "Test the disputed mounts on a forced march, accepting losses."
 war_culture_and_religion_events.165.c:0 "Sell a license confirming the disputed ownership."
 war_culture_and_religion_events.165.dd:0 "Negotiate access and compile a common breeding register."

 war_culture_and_religion_events.166.t:0 "The Caledorian Forge's Old Commission"
 war_culture_and_religion_events.166.d:0 "A Caledorian smith completes armor ordered by a household whose dragon has not awakened in generations. The household refuses payment because the commission named service on dragonback as the final condition.\n\nThe smith argues that the work is finished whether the dragon wakes or not. Officers examine the armor at court and ask to test the techniques on equipment they can actually use."
 war_culture_and_religion_events.166.a:0 "Pay for a public military demonstration of the armor."
 war_culture_and_religion_events.166.b:0 "Negotiate the commission and suspend the military trial."

 war_culture_and_religion_events.167.t:0 "The Colonial Seal That Arrived Too Late"
 war_culture_and_religion_events.167.d:0 "A colonial Asur governor receives confirmation of a harbor charter years after local captains amended its terms. The arriving seal makes the older version official, invalidating arrangements that now keep the port supplied.\n\nThe harbor master lays both texts before [Root.Monarch.GetName]. Merchants have already booked the next convoy under the local agreement, and cannot wait for another round of letters to Ulthuan."
 war_culture_and_religion_events.167.a:0 "Pay to reconcile the charters and recognize local discretion."
 war_culture_and_religion_events.167.b:0 "Collect fees to renew the disputed licenses."
 war_culture_and_religion_events.167.c:0 "Organize a dependable procedure for recognizing overseas agreements."

 war_culture_and_religion_events.168.t:0 "The Naggarondi Household's Empty Muster"
 war_culture_and_religion_events.168.d:0 "A Naggarondi noble sends a splendid banner to a muster with too few warriors beneath it. He cites an ancestral decree granting his household ceremonial precedence regardless of its levy.\n\nA rival noble places the banner behind the smaller households that fulfilled their quotas. Their retainers draw weapons before the marshal forces both claims into the ruler's hearing."
 war_culture_and_religion_events.168.a:0 "Enforce traditional obligations and take the household's recruits."
 war_culture_and_religion_events.168.b:0 "Pay for a complete audit of household service."
 war_culture_and_religion_events.168.c:0 "Negotiate precedence and stand down the retainers."
 war_culture_and_religion_events.168.dd:0 "Sponsor a public ceremony honoring fulfilled service."

 war_culture_and_religion_events.169.t:0 "The Guard Who Entered the Witch Tower"
 war_culture_and_religion_events.169.d:0 "A Ghrondari guard enters a sorceress's chamber while pursuing a thief and breaks a ward across its doorway. The thief escapes, but the guard returns with burns and a demand for better instructions.\n\nThe sorceress insists that ignorance excuses nothing and claims the entire watch owes her service. The captain asks the ruler to define how soldiers may operate around the towers."
 war_culture_and_religion_events.169.a:0 "Give the watch a public commission for specialized tower training."
 war_culture_and_religion_events.169.b:0 "Send guards after the thief through the warded chambers."

 war_culture_and_religion_events.170.t:0 "The Assassin Named in the Will"
 war_culture_and_religion_events.170.d:0 "A Graefi noble's will names the guard who killed him as executor of his estate. His surviving relatives claim the clause proves forgery, while the guard produces witnesses who heard it dictated.\n\nA steward discovers that the will was altered on the morning of the killing. The added clause promises the executor a reward only if the estate reaches the named heir intact.\n\nThe witnesses admit they were paid, but disagree over who paid them. The estate's armed retainers seal the strongroom until [Root.Monarch.GetName] decides how the will will be enforced."
 war_culture_and_religion_events.170.a:0 "Fund and honor an investigation with open supply contracts."
 war_culture_and_religion_events.170.b:0 "Negotiate the inheritance and withdraw the soldiers."
 war_culture_and_religion_events.170.c:0 "Sacrifice the implicated retainers to affirm the ruler's authority."

 war_culture_and_religion_events.171.t:0 "The Clar Karond Timber Raft"
 war_culture_and_religion_events.171.d:0 "A Clari timber factor discovers a raft of valuable trunks marked for two different shipyards. Each yard has paid an advance to the same contractor, who has now disappeared.\n\nTheir overseers seize opposite ends of the raft and stop its laborers from moving. The factor sends the duplicated marks to court before the river current tears the disputed cargo apart."
 war_culture_and_religion_events.171.a:0 "Pay for an audit and negotiate the yards' deliveries."
 war_culture_and_religion_events.171.b:0 "Take the disputed advance payments into the treasury."
 war_culture_and_religion_events.171.c:0 "Send a costly armed search for the contractor."
 war_culture_and_religion_events.171.dd:0 "Organize negotiations and settle the competing work orders."

 war_culture_and_religion_events.172.t:0 "The Karond Kar Beast Handler"
 war_culture_and_religion_events.172.d:0 "A Karondi beast handler saves his crew when a cage door breaks during loading. He holds the animal back long enough for the others to escape, then demands release from an inherited service debt.\n\nHis master claims the act was already part of his duty. The surviving crew gathers at the ruler's court, offering its service if the handler's deed is recognized."
 war_culture_and_religion_events.172.a:0 "Pay the debt and bind the crew to our authority."
 war_culture_and_religion_events.172.b:0 "Fund an audit of handling contracts and service debts."

 war_culture_and_religion_events.173.t:0 "The Har Ganeth Practice Yard"
 war_culture_and_religion_events.173.d:0 "A Ganethi weapons master discovers that recruits have been skipping drill to attend executions. Their priestess says witnessing Khaine's work is part of their preparation for battle.\n\nThe master challenges her followers to a formal demonstration, where several fail the simplest formation changes. The result reaches the ruler before either instructor can claim sole command of the recruits."
 war_culture_and_religion_events.173.a:0 "Commission regular weapons drills and open the school's supply contracts."
 war_culture_and_religion_events.173.b:0 "Test the recruits in live combat exercises, accepting casualties."
 war_culture_and_religion_events.173.c:0 "Negotiate regular discipline between temple and officers."

 war_culture_and_religion_events.174.t:0 "The Autarri Captain's Denied Landing"
 war_culture_and_religion_events.174.d:0 "An Autarri raiding captain brings a rich cargo to a landing whose keeper refuses him entry. The keeper says an older exile decree still applies, though the captain carries a recent invitation from a noble patron.\n\nThe crew runs short of water while the two documents are compared. The captain sends the captured standard from his voyage to [Root.Monarch.GetName], demanding a decision before he forces a landing."
 war_culture_and_religion_events.174.a:0 "Fund a military inquiry and honor the captain's service."
 war_culture_and_religion_events.174.b:0 "Negotiate admission and stand down the landing guard."
 war_culture_and_religion_events.174.c:0 "Pay to reconcile the exile and landing records."
 war_culture_and_religion_events.174.dd:0 "Take crew members as hostages to enforce our authority."

 war_culture_and_religion_events.175.t:0 "The Fimir Guide's Captive"
 war_culture_and_religion_events.175.d:0 "A Fimir guide leads a raiding band through the mist and claims a captive as his payment. The band's leader refuses because the captive was promised to a different household before the march.\n\nThe guide withdraws his markers, leaving the raiders uncertain of the safe return path. A witch-hag's attendant brings both claims to the ruler while the band waits on a bog island."
 war_culture_and_religion_events.175.a:0 "Pay the guide and negotiate the captive's disposition."
 war_culture_and_religion_events.175.b:0 "Claim the captive's ransom for the ruler."

 war_culture_and_religion_events.176.t:0 "The Grey Dwarf's Last Witness"
 war_culture_and_religion_events.176.d:0 "A Grey Dwarf elder brings the final surviving witness to a grievance over unpaid guard service. The witness remembers the oath clearly but says the claimant's grandfather forgave the debt after a later battle. The claimant has brought a fresh stone slab on which he expects the unpaid sum to be recorded.\n\nThe elder insists forgiveness was never recorded. Younger clansmen offer to serve again if the ruler can give them a settlement that will not remain disputed for another generation."
 war_culture_and_religion_events.176.a:0 "Bind the clansmen to a new oath and accept their levy."
 war_culture_and_religion_events.176.b:0 "Pay to reconstruct the record and register the settlement."
 war_culture_and_religion_events.176.c:0 "Fund a public ceremony honoring the old guard's service."

 war_culture_and_religion_events.177.t:0 "The Drazh Dawi Tunnel Watch"
 war_culture_and_religion_events.177.d:0 "Drazh Dawi miners break through an old wall and discover a passage bypassing their gate defenses. The watch captain orders the shaft sealed, but the miners find a rich seam along its exposed face.\n\nA second survey confirms that both danger and ore are real. The foreman brings samples to the ruler, asking who will secure the passage while work continues."
 war_culture_and_religion_events.177.a:0 "Commission trained tunnel guards with a recognized place in the muster."
 war_culture_and_religion_events.177.b:0 "Explore the unguarded passage with an armed patrol."
 war_culture_and_religion_events.177.c:0 "Sell a license to exploit the seam."
 war_culture_and_religion_events.177.dd:0 "Negotiate access for engineers to study the new formation."

 war_culture_and_religion_events.178.t:0 "The Norse Dwarf's Oath Axe"
 war_culture_and_religion_events.178.d:0 "A Norse Dwarf brings an axe to the hall that his ancestor pledged as security for a military oath. The clan holding it says the obligation remains unpaid despite the battles fought since.\n\nThe axe bearer names every campaign his household served in. Veterans gather to verify his account, and the ruler must decide whether the weapon remains a debt or becomes an honor."
 war_culture_and_religion_events.178.a:0 "Pay for a military review and open its supplies to outside traders."
 war_culture_and_religion_events.178.b:0 "Negotiate the oath and release the disputed service."

 war_culture_and_religion_events.179.t:0 "The Ledger Stone with a Missing Line"
 war_culture_and_religion_events.179.d:0 "A Dwarf accountant finds a payment missing from a stone ledger while checking a clan's old obligations. The clan produces a metal receipt whose date falls exactly where a later mason repaired the carving.\n\nThe repairer admits smoothing the surface but denies removing any record. The accountant stops further collections until the ruler determines which evidence should govern the account."
 war_culture_and_religion_events.179.a:0 "Pay to reconcile the records and permit outside witnesses."
 war_culture_and_religion_events.179.b:0 "Collect the payment according to the surviving ledger."
 war_culture_and_religion_events.179.c:0 "Organize a trained military accounting corps."

 war_culture_and_religion_events.180.t:0 "The Vault Dwarf's Unfinished Gate"
 war_culture_and_religion_events.180.d:0 "Vault Dwarf engineers finish a mountain gate and refuse to surrender its keys until the promised garrison is supplied. The local captain offers only a rotating levy, saying the contract names guards without specifying their term.\n\nThe engineers demonstrate a mechanism too complex for untrained replacements. They carry a model to [Root.Monarch.GetName], asking for men who can operate what the realm paid them to build."
 war_culture_and_religion_events.180.a:0 "Confirm the ruler's claim and organize new recruits for the gate."
 war_culture_and_religion_events.180.b:0 "Pay to clarify and register the maintenance obligations."
 war_culture_and_religion_events.180.c:0 "Negotiate the contract and suspend the disputed deployment."
 war_culture_and_religion_events.180.dd:0 "Fund a professional training program for the garrison."

 war_culture_and_religion_events.181.t:0 "The South Dawi Caravan's Water Ration"
 war_culture_and_religion_events.181.d:0 "A South Dawi caravan guard turns back an escort party after its captain demands extra water. The guard says the sealed ration agreement leaves no reserve for men who joined after departure.\n\nThe captain admits bringing additional scouts to cover a dangerous crossing. Both return with intact cargo, but ask the ruler to settle how future caravans will provision their defense."
 war_culture_and_religion_events.181.a:0 "Commission trained caravan guards and register their water allowances."
 war_culture_and_religion_events.181.b:0 "Send scouts through the crossing with reduced supplies."

 war_culture_and_religion_events.182.t:0 "The Imperial Dwarf's Double Summons"
 war_culture_and_religion_events.182.d:0 "An Imperial Dwarf weaponsmith receives one summons from his guild militia and another from his clan. Both musters fall on the same day, and each threatens a penalty for absence.\n\nThe smith sends his apprentice to one and reports to the other, satisfying neither. He brings both notices to [Root.Capital.GetName], where officers disagree over which oath should prevail."
 war_culture_and_religion_events.182.a:0 "Pay for a public military settlement despite the rival claimants."
 war_culture_and_religion_events.182.b:0 "Negotiate the obligations and stand down the extra levy."
 war_culture_and_religion_events.182.c:0 "Accept a fee and release the smiths from military service."

 war_culture_and_religion_events.183.t:0 "The Road Stone Found by the Lost Clan"
 war_culture_and_religion_events.183.d:0 "A wandering Dwarf clan uncovers a road stone bearing the mark of a hold lost to its ancestors. Its prospectors believe a nearby buried passage could lead toward the old route.\n\nAnother clan claims the same discovery through a map inherited from a dead relative. Their elders meet at the stone and request a ruling before excavation begins."
 war_culture_and_religion_events.183.a:0 "Pay for an agreement between the rival claimants."
 war_culture_and_religion_events.183.b:0 "Collect a fee for access to the discovery."
 war_culture_and_religion_events.183.c:0 "Send a costly armed expedition along the buried route."
 war_culture_and_religion_events.183.dd:0 "Organize exclusive prospecting rights for our own clans."

 war_culture_and_religion_events.184.t:0 "The Chaos Dwarf's Altered Quota"
 war_culture_and_religion_events.184.d:0 "A Chaos Dwarf overseer finds that a slave quota has been increased by hammering an extra mark into its iron tablet. The supplying forge cannot meet it without emptying its own work gangs.\n\nA forge clerk compares the new mark with the tablet's older hammer strokes. Its shape matches the priest's current workshop tools, giving the overseer a second piece of evidence to present.\n\nThe fire priest responsible insists the larger quota reflects the traditional tribute to Hashut. The overseer presents an earlier rubbing before the ruler, with armed retainers ready to enforce the judgment."
 war_culture_and_religion_events.184.a:0 "Enforce the traditional quota and muster service under our authority."
 war_culture_and_religion_events.184.b:0 "Pay for an audit of the tablets and labor assignments."

 war_culture_and_religion_events.185.t:0 "The Albionese Youth at the Ogham Circle"
 war_culture_and_religion_events.185.d:0 "An Albionese youth catches strangers chiseling a fragment from an Ogham Stone and drives them away with a sling. A chief claims the recovered fragment as a trophy, but the Truthsayer demands its return to the circle.\n\nThe youth brings it directly to the ruler before either side can seize it. Other young hunters volunteer to guard the site, asking whose orders they will follow there."
 war_culture_and_religion_events.185.a:0 "Grant the circle its own trained guard and recognize its standing."
 war_culture_and_religion_events.185.b:0 "Track the thieves into the bog, even if hunters are lost."
 war_culture_and_religion_events.185.c:0 "Negotiate the guard's duties and teach the hunters our patrol methods."

 war_culture_and_religion_events.186.t:0 "The Strigany Wagon at the Closed Gate"
 war_culture_and_religion_events.186.d:0 "A Strigany wagon elder reaches a town where her caravan has wintered for years and finds the gate barred. The new keeper claims their camping rights ended with the official who granted them.\n\nThe elder produces his sealed letter while families wait outside in the rain. Her escorts keep their weapons sheathed, asking [Root.Monarch.GetName] to hear the promise before they seek another camp."
 war_culture_and_religion_events.186.a:0 "Pay and honor an armed escort despite the town's objections."
 war_culture_and_religion_events.186.b:0 "Negotiate entry and stand down the escort."
 war_culture_and_religion_events.186.c:0 "Pay to register the caravan's camping rights."
 war_culture_and_religion_events.186.dd:0 "Accept a fee and release the caravan guards from service."

 war_culture_and_religion_events.187.t:0 "The Scythan Escort's Unpaid Passage"
 war_culture_and_religion_events.187.d:0 "A Scythan caravan escort discovers that its captain has been paying passage fees from wages owed to the riders. The toll keeper presents receipts, but the captain's contract promised to cover those costs himself. Several receipts bear the captain's personal mark beside the amounts withheld.\n\nThe riders refuse the next journey until the missing pay is settled. Their elder brings the receipts to court, asking for an agreement that merchants and escorts can both rely on."
 war_culture_and_religion_events.187.a:0 "Pay the arrears, revise the contracts, and open the route to traders."
 war_culture_and_religion_events.187.b:0 "Collect the disputed passage fees for the treasury."

 war_culture_and_religion_events.188.t:0 "The Bedouin Well Rope"
 war_culture_and_religion_events.188.d:0 "A Bedouin well keeper cuts the hauling rope after a caravan draws water beyond its agreed share. The caravan master says he needed it for wounded travelers, but the keeper points to the lowered water line.\n\nNearby households offer armed men to guard the well. Their sheikh requests a ruling before another caravan arrives and turns the dispute into a fight over the remaining water."
 war_culture_and_religion_events.188.a:0 "Bind the well guard to our authority despite outside objections."
 war_culture_and_religion_events.188.b:0 "Pay to register water shares and maintenance duties."
 war_culture_and_religion_events.188.c:0 "Fund restitution and guarantee the agreed water rights."

 war_culture_and_religion_events.189.t:0 "The Medean Palace Guard's Tribute"
 war_culture_and_religion_events.189.d:0 "A Medean household delivers ceremonial armor in place of the soldiers it owes the palace guard. Its steward claims the value of the gift exceeds the cost of the missing men.\n\nThe guard commander displays the armor on empty stands during the review. The embarrassment brings the household's elders before [Root.Monarch.GetName], asking for a ruling on their duty."
 war_culture_and_religion_events.189.a:0 "Commission regular palace drills under the traditional service rules."
 war_culture_and_religion_events.189.b:0 "Muster the household's retainers for a forced march."
 war_culture_and_religion_events.189.c:0 "Accept a cash payment in place of the disputed obligation."
 war_culture_and_religion_events.189.dd:0 "Negotiate a public honor for the household's contribution."

 war_culture_and_religion_events.190.t:0 "The Cophic Merchant's Hollow Weight"
 war_culture_and_religion_events.190.d:0 "A Cophic market inspector drops a merchant's brass weight and hears something move inside it. When opened, it proves to be hollow, though its stamped seal matches the official standard.\n\nThe merchant names the smith who made weights for half the bazaar. Guards close the affected stalls while the guilds demand that the court settle who is responsible for the false measures."
 war_culture_and_religion_events.190.a:0 "Fund an honored guard operation to enforce the official weights."
 war_culture_and_religion_events.190.b:0 "Negotiate restitution and withdraw the guards from the stalls."

 war_culture_and_religion_events.191.t:0 "The Umbar Captain's Protected Prize"
 war_culture_and_religion_events.191.d:0 "An Umbar corsair captures a ship whose master produces one of our own safe-conducts. The captain claims the document expired at sea, while the master says delays were caused by storms.\n\nThe prize is brought in intact, with both crews demanding payment for its cargo. The harbor judge sends the dates to [Root.Capital.GetName] before anyone begins unloading."
 war_culture_and_religion_events.191.a:0 "Pay for arbitration and reorganize the crews' prize records."
 war_culture_and_religion_events.191.b:0 "Take the ruler's share of the disputed cargo."
 war_culture_and_religion_events.191.c:0 "Inventory and sell the unclaimed goods."

 war_culture_and_religion_events.192.t:0 "The Sudron Ferry's New Sandbank"
 war_culture_and_religion_events.192.d:0 "A Sudron ferry keeper moves his landing after a sandbank blocks the old channel. The household owning the new bank demands payment from every passenger, including the keeper's armed escort.\n\nThe keeper refuses to surrender the toll he already pays to the realm. He brings a river pilot to court to explain why the old charter no longer matches the water."
 war_culture_and_religion_events.192.a:0 "Take the ferry guards into service under our authority."
 war_culture_and_religion_events.192.b:0 "Pay for a new channel survey and toll register."
 war_culture_and_religion_events.192.c:0 "Negotiate access and stand down the escort."
 war_culture_and_religion_events.192.dd:0 "Fund a trial of the pilot's improved channel markers."

 war_culture_and_religion_events.193.t:0 "The Hashashin Recruit Who Spared a Target"
 war_culture_and_religion_events.193.d:0 "A Hashashin instructor sends a recruit to retrieve a sealed packet from a guarded room. The recruit returns with the packet and the guard alive, arguing that an unnecessary death would reveal the route.\n\nThe recruit explains that the guard agreed to open the room again in exchange for being left alive. His instructor tests the promise through a second messenger, who returns with a fresh copy of the guard roster.\n\nAnother instructor calls the exercise a failure because its written order demanded silence at any cost. Their pupils watch as the two reports are presented to [Root.Monarch.GetName]."
 war_culture_and_religion_events.193.a:0 "Pay for a recognized school with precise mission and training standards."
 war_culture_and_religion_events.193.b:0 "Test the recruits against a guarded military camp, accepting losses."

 war_culture_and_religion_events.194.t:0 "The Aghol Brand Struck by Lightning"
 war_culture_and_religion_events.194.d:0 "Lightning strikes an Aghol camp's herd pen and burns through the post bearing its chief's mark. A shaman declares the surviving horses chosen for war, but their keepers claim them as breeding stock.\n\nThe chief saddles one before the keepers can object. They lead the rest to the ruler's camp and demand a decision before the animals are divided among his followers."
 war_culture_and_religion_events.194.a:0 "Fund and honor the war muster despite the keepers' complaints."
 war_culture_and_religion_events.194.b:0 "Negotiate the herd's use and cancel the disputed muster."
 war_culture_and_religion_events.194.c:0 "Take the disputed riders out of service to assert our authority."

 war_culture_and_religion_events.195.t:0 "The Mung Herd Across the Camp Line"
 war_culture_and_religion_events.195.d:0 "A Mung herder wakes to find his animals grazing inside a rival camp's boundary. The rival chief claims they followed his horses willingly and now belong with them.\n\nThe herder finds cut hobbles where the animals had been tied. He brings them to [Root.Monarch.GetName] while both camps' riders assemble to recover or defend the herd."
 war_culture_and_religion_events.195.a:0 "Pay for a settlement, record the brands, and release disputed recruits."
 war_culture_and_religion_events.195.b:0 "Take a payment from the disputed animals."
 war_culture_and_religion_events.195.c:0 "Pursue the suspected horse thieves beyond the camp, despite the risk."
 war_culture_and_religion_events.195.dd:0 "Organize exclusive trading rights for the registered herds."

 war_culture_and_religion_events.196.t:0 "The Mirror in the Chi-An Envoy's Tent"
 war_culture_and_religion_events.196.d:0 "A Chi-An envoy receives petitioners behind a polished mirror that hides his face. A visiting chief discovers that a servant has been answering in his place and demands to know which promises the real envoy made.\n\nThe envoy claims the servant was authorized to hear routine matters. Armed guests gather outside, and the ruler must decide whose seal can bind the camp."
 war_culture_and_religion_events.196.a:0 "Require an oath to our authority and register the guests' service."
 war_culture_and_religion_events.196.b:0 "Pay to verify and record the promises already given."

 war_culture_and_religion_events.197.t:0 "The Kuj Scout's False Trail"
 war_culture_and_religion_events.197.d:0 "A Kuj scout leads pursuers away from his camp by laying a false trail through a rocky ravine. When he returns, another captain accuses him of abandoning a patrol still following the old markers.\n\nThe patrol reaches camp exhausted but confirms the trick worked. Its losses and the scout's success arrive before the ruler together, prompting demands for better coordination."
 war_culture_and_religion_events.197.a:0 "Give the scouts a public commission and teach common trail signals."
 war_culture_and_religion_events.197.b:0 "Make the patrol repeat the ravine crossing under pursuit."
 war_culture_and_religion_events.197.c:0 "Negotiate access to the scout's methods and study them."

 war_culture_and_religion_events.198.t:0 "The Tu-Ka Standard's Borrowed Bones"
 war_culture_and_religion_events.198.d:0 "A Tu-Ka standard bearer adds bones to his banner from a trophy pile belonging to another captain. He says the enemy dead honor the whole host, but the captain demands his trophies back.\n\nDuring the argument, the banner pole breaks and scatters the bones before the assembled riders. The standard bearer gathers them into a sack and asks the ruler how they should be divided."
 war_culture_and_religion_events.198.a:0 "Fund a military ceremony and honor the proven victories."
 war_culture_and_religion_events.198.b:0 "Negotiate the claims and dismiss the assembled riders."
 war_culture_and_religion_events.198.c:0 "Pay to record the trophies and their owners."
 war_culture_and_religion_events.198.dd:0 "Test a new field signaling method despite possible casualties."

 war_culture_and_religion_events.199.t:0 "The Man-Chu Tribute Saddle"
 war_culture_and_religion_events.199.d:0 "A Man-Chu messenger delivers an ornate saddle as tribute, but the recipient finds a debt notice hidden beneath its lining. The sender claims the saddle was only loaned until an earlier promise was fulfilled. The recipient has already shown the saddle to the assembled guests.\n\nThe messenger admits he was told to present it as a gift in public. Both households send witnesses to the ruler's camp before the embarrassment becomes an armed quarrel."
 war_culture_and_religion_events.199.a:0 "Pay for a settlement and reconcile the tribute records."
 war_culture_and_religion_events.199.b:0 "Collect the saddle's value for the treasury."

 war_culture_and_religion_events.200.t:0 "The Yin Guest Who Sat Too Close"
 war_culture_and_religion_events.200.d:0 "At a Yin gathering, a visiting chief sits beside the ruler's empty place before the formal invitation. The host's steward treats the act as a claim to precedence and orders the chief's gifts removed.\n\nThe visitor insists that the seating instructions directed him there. He produces the invitation, leaving the court to decide whether a scribal mistake can become a public insult."
 war_culture_and_religion_events.200.a:0 "Require a renewed acknowledgment of the ruler's authority."
 war_culture_and_religion_events.200.b:0 "Pay to revise and register the gathering's protocols."
 war_culture_and_religion_events.200.c:0 "Fund a reconciliatory reception for the visiting chief."

 war_culture_and_religion_events.201.t:0 "The Dolgan Rider without a Mount"
 war_culture_and_religion_events.201.d:0 "A Dolgan rider gives his exhausted horse to a wounded companion and walks back through deep snow. His chief removes him from the mounted muster because he has no animal to present.\n\nThe companion remembers the rider carrying his saddle so that no equipment would be abandoned. That saddle is now the only part of the man's mounted service the chief is willing to count.\n\nThe rescued companion offers testimony, but the chief insists the rule allows no exception. Other riders bring the man's empty saddle to court, asking whether his service has earned recognition."
 war_culture_and_religion_events.201.a:0 "Give the trained riders a public commission and control of their remounts."
 war_culture_and_religion_events.201.b:0 "Make the riders practice rescues beyond the winter camp."
 war_culture_and_religion_events.201.c:0 "Sell exemptions from the disputed remount obligation."
 war_culture_and_religion_events.201.dd:0 "Negotiate a settlement that neighboring camps can trust."

 war_culture_and_religion_events.202.t:0 "The Kul Oath Cut Too Deep"
 war_culture_and_religion_events.202.d:0 "A Kul champion cuts his hand while swearing an oath, then demands that every rider make the same wound. An older warrior refuses because he must still draw a bow the next morning.\n\nThe champion calls him faithless and bars him from the muster. The warrior presents his scarred hands to the ruler, asking whether a ritual should make him unable to fulfill the service it promises."
 war_culture_and_religion_events.202.a:0 "Fund the traditional rite and honor its warriors."
 war_culture_and_religion_events.202.b:0 "Negotiate the oath and suspend the champion's muster."

 war_culture_and_religion_events.203.t:0 "The Khazag Contract Sewn Shut"
 war_culture_and_religion_events.203.d:0 "A Khazag captain carries a service contract sewn inside his saddle, but refuses to open it when payment falls due. He says the stitching is sacred and the original terms are known to everyone.\n\nHis employer remembers a smaller fee and produces a separate tally. The two accounts reach [Root.Monarch.GetName] before the captain's riders begin taking payment from the supply carts."
 war_culture_and_religion_events.203.a:0 "Pay for arbitration and admit independent trading witnesses."
 war_culture_and_religion_events.203.b:0 "Collect a fee from the disputed contract."
 war_culture_and_religion_events.203.c:0 "Organize a disciplined service register for the riders."

 war_culture_and_religion_events.204.t:0 "The Tahmak Guest's Red Sash"
 war_culture_and_religion_events.204.d:0 "A Tahmak guest receives a red sash promising safe passage through a camp, then is stopped by warriors who do not recognize its knot. Their captain says the host used a mark reserved for armed retainers.\n\nThe guest refuses to remove the sash in public. The host brings him to the ruler with the visiting riders, asking for a common rule before the promise is broken."
 war_culture_and_religion_events.204.a:0 "Accept the visitors' service and open the camp to their traders."
 war_culture_and_religion_events.204.b:0 "Pay to register the recognized guest marks."
 war_culture_and_religion_events.204.c:0 "Negotiate passage and stand down the guards."
 war_culture_and_religion_events.204.dd:0 "Fund regular training in escort and guest duties."

 war_culture_and_religion_events.205.t:0 "The Tokmar Captive Chain"
 war_culture_and_religion_events.205.d:0 "A Tokmar escort discovers that several captive chains are too short for the promised marching pace. Its captain orders the column onward anyway, leaving guards to drag those who stumble.\n\nThe rear guard catches up late with broken fittings and missing men. The overseer lays the failed equipment before the ruler, asking who must answer for a march planned without checking it."
 war_culture_and_religion_events.205.a:0 "Commission trained escorts under the traditional marching rules."
 war_culture_and_religion_events.205.b:0 "Test a faster march with the surviving escorts, accepting casualties."

 war_culture_and_religion_events.206.t:0 "The Hastling Priest's Storm Shelter"
 war_culture_and_religion_events.206.d:0 "A Hastling priest orders riders to shelter in a ravine because he reads safety in the approaching storm. Floodwater instead traps them there, and a scout leads the survivors out by a dangerous climb.\n\nThe priest calls their escape proof that his warning saved them. The scout brings soaked equipment to the ruler and asks for recognition of what the riders actually did."
 war_culture_and_religion_events.206.a:0 "Pay for a military review and honor the scout despite the priest's protests."
 war_culture_and_religion_events.206.b:0 "Negotiate a settlement and stand down the riders."
 war_culture_and_religion_events.206.c:0 "Send reliable escorts to neighboring camps as a pledge of our word."

 war_culture_and_religion_events.207.t:0 "The Yusak Scout's Borrowed Knife"
 war_culture_and_religion_events.207.d:0 "A Yusak scout leaves his knife as a token with a border household that shelters him. A second scout later finds it carried by men claiming permission to use the same hidden route.\n\nThe household says the first token granted passage to its allies. Both scouts return with conflicting reports, forcing the ruler to decide which promises the knife actually represented."
 war_culture_and_religion_events.207.a:0 "Fund an inquiry and organize clear passage agreements."
 war_culture_and_religion_events.207.b:0 "Charge for recognition of the disputed passage rights."
 war_culture_and_religion_events.207.c:0 "Patrol the hidden route and confront its unauthorized users."
 war_culture_and_religion_events.207.dd:0 "Register tokens that bear the ruler's authority alone."

 war_culture_and_religion_events.208.t:0 "The Avag Falconer's Place at Council"
 war_culture_and_religion_events.208.d:0 "An Avag falconer spots a raiding party from a high ridge and warns the camp before it is struck. He asks to speak at the next council, but the chief reserves those places for inherited offices.\n\nThe riders who answered the warning escort him to the gathering. Their support forces the ruler to decide how useful service fits within the camp's older order."
 war_culture_and_religion_events.208.a:0 "Confirm the traditional offices and accept the riders' oath."
 war_culture_and_religion_events.208.b:0 "Pay to record council duties and the services performed."

 war_culture_and_religion_events.209.t:0 "The Nifflecht Bog Iron Shipment"
 war_culture_and_religion_events.209.d:0 "Nifflecht smiths reject a shipment of bog iron after finding stones packed beneath the ore. The supplying chief claims his laborers cannot distinguish waste until the furnace tests it.\n\nThe smiths produce earlier loads sorted correctly by the same workers. Guards hold the disputed carts while the ruler decides who will supervise future deliveries."
 war_culture_and_religion_events.209.a:0 "Commission trained supply guards and recognize their inspection rights."
 war_culture_and_religion_events.209.b:0 "Send an armed party through the bog to inspect the ore workings."
 war_culture_and_religion_events.209.c:0 "Let the smiths and supplier settle the load themselves."

 war_culture_and_religion_events.210.t:0 "The Ogre on the Pigbarter Wharf"
 war_culture_and_religion_events.210.d:0 "An Ogre guard falls through a Pigbarter wharf while pursuing a thief, taking several pig pens into the mud. The wharf's owner blames his weight, while the guard points to rotten supports under the planks.\n\nThe Gnoblar points out that the thief was carrying a bag belonging to the owner's clerk. The clerk claims it was stolen from him, but cannot explain why the money was still inside it.\n\nA Gnoblar stevedore retrieves the thief's bag and finds maintenance money that never reached the carpenters. The market brokers ask [Root.Monarch.GetName] to settle the damage before the next River Ruin cargo arrives."
 war_culture_and_religion_events.210.a:0 "Pay and honor an armed investigation despite the brokers' complaints."
 war_culture_and_religion_events.210.b:0 "Negotiate compensation and withdraw the guards."
 war_culture_and_religion_events.210.c:0 "Fund an audit of wharf maintenance and contracts."
 war_culture_and_religion_events.210.dd:0 "Retain fewer guards and train them properly for dock work."

 war_culture_and_religion_events.211.t:0 "The Mountain Ogre's Empty Tribute Cart"
 war_culture_and_religion_events.211.d:0 "A Mountain Ogre Tyrant opens a tribute cart and finds sacks of stones beneath the first layer of meat. The driver says the supplying camp weighed the load exactly as ordered.\n\nThe Tyrant drags the scales into the gathering and demands a new payment. Other camps watch closely, since the same measure has been used to count their own shares for years."
 war_culture_and_religion_events.211.a:0 "Pay for a settlement and replace the disputed tally system."
 war_culture_and_religion_events.211.b:0 "Take the missing value directly into the treasury."

 war_culture_and_religion_events.212.t:0 "The Fishguts Net across the Ferry"
 war_culture_and_religion_events.212.d:0 "Fishguts Ogres stretch a fishing net across a ferry route and refuse to lift it for passing boats. Their boss says the fish were using the river first and passengers can wait until he has eaten.\n\nThe ferry master arrives with a torn rope after trying to force through. Younger Ogres offer to guard both fishing and ferry traffic if the ruler guarantees their share of the catch."
 war_culture_and_religion_events.212.a:0 "Bind the volunteers to our authority and organize their service."
 war_culture_and_religion_events.212.b:0 "Pay to register fishing hours and ferry passages."
 war_culture_and_religion_events.212.c:0 "Fund compensation and guarantee the agreed passage."

 war_culture_and_religion_events.213.t:0 "The Cathayan Ogre's Contract Meal"
 war_culture_and_religion_events.213.d:0 "A Cathayan caravan master hires Ogre guards with a contract specifying meals by the bowl. The guards finish their first ration and produce bowls large enough to hold the cook's entire pot.\n\nThe master accuses them of trickery, but the interpreter confirms that no size was written down. The captain asks the ruler to settle the contract before the hungry guards leave."
 war_culture_and_religion_events.213.a:0 "Commission trained caravan guards and open their supply contracts."
 war_culture_and_religion_events.213.b:0 "Send the Ogres to scout the convoy's route, even if some are lost."
 war_culture_and_religion_events.213.c:0 "Collect a fee to recognize the disputed contract."
 war_culture_and_religion_events.213.dd:0 "Negotiate a public honor in place of part of the demand."

 war_culture_and_religion_events.214.t:0 "The Firedrinker's Ruined Feast"
 war_culture_and_religion_events.214.d:0 "A Firedrinker pours a burning mixture over a feast to prove his endurance and sets the serving platform alight. His companions rescue most of the meat, then demand that he replace what burned.\n\nHe claims the spectacle honored the whole camp and should be paid for by everyone. The scorched platters are brought before the ruler while the gathering waits for its food."
 war_culture_and_religion_events.214.a:0 "Pay for a martial feast and honor the survivors' prowess."
 war_culture_and_religion_events.214.b:0 "Negotiate the shares and end the challenge."

 war_culture_and_religion_events.215.t:0 "The Redmaw Hunter's Marked Carcass"
 war_culture_and_religion_events.215.d:0 "A Redmaw hunter returns to a stored carcass and finds another band's mark cut through his own. Their butcher claims the first wound proves they killed the beast, although they abandoned the pursuit.\n\nThe hunter produces a broken spearhead pulled from the final wound. Both bands stop preparing the meal until the ruler decides whose evidence controls the shares."
 war_culture_and_religion_events.215.a:0 "Buy replacement food and settle the hunting accounts."
 war_culture_and_religion_events.215.b:0 "Take the ruler's share for sale."
 war_culture_and_religion_events.215.c:0 "Organize the carcass division and sell the surplus."

 war_culture_and_religion_events.216.t:0 "The Irongut's Borrowed Gut Plate"
 war_culture_and_religion_events.216.d:0 "An Irongut arrives at a muster wearing a gut plate borrowed from a dead champion's stores. The champion's heir demands it back, saying the armor carries an oath of service to his household. The plate still bears dents and repairs recognized by the dead champion's companions.\n\nThe borrower offers to serve the ruler directly instead. Other poorly equipped Ogres gather behind him, forcing a decision on whether the muster follows inherited possessions or willing fighters."
 war_culture_and_religion_events.216.a:0 "Accept the irregular volunteers under an oath to the ruler."
 war_culture_and_religion_events.216.b:0 "Pay to register the armor and its service obligations."
 war_culture_and_religion_events.216.c:0 "Negotiate the claim and cancel the disputed muster."
 war_culture_and_religion_events.216.dd:0 "Buy the armor and assert the ruler's right to assign it."

 war_culture_and_religion_events.217.t:0 "The Wandering Ogre's Many Employers"
 war_culture_and_religion_events.217.d:0 "A wandering Ogre returns with contracts from three employers whose campaigns overlap. He insists he can serve all three because the papers say nothing about travel time or eating stops.\n\nA captain checks the routes and proves that the first two musters are days apart. The Ogre offers his experience to the ruler if someone will tell him which promise comes first."
 war_culture_and_religion_events.217.a:0 "Commission regular service and training, with open supply contracts."
 war_culture_and_religion_events.217.b:0 "Have him teach recruits on a forced march, accepting losses."

 war_culture_and_religion_events.218.t:0 "The Boneeater's Last Marrow Bone"
 war_culture_and_religion_events.218.d:0 "A Boneeater saves the largest marrow bone from a feast, intending to crack it before the next march. Another hunter takes it for a trophy and refuses to surrender it for eating.\n\nTheir followers divide into noisy circles around the bone. The ruler arrives as they begin wagering weapons on a contest neither side has yet agreed to fight."
 war_culture_and_religion_events.218.a:0 "Fund and honor a dangerous contest of hunting skill."
 war_culture_and_religion_events.218.b:0 "Negotiate the bone's return and stop the challenge."
 war_culture_and_religion_events.218.c:0 "Let the two hunters settle it themselves."

 war_culture_and_religion_events.219.t:0 "The Amazon Spear Left at the River Shrine"
 war_culture_and_religion_events.219.d:0 "An Amazon spearwoman leaves a captured weapon at a river shrine in thanks for surviving an ambush. The next patrol borrows it, claiming the shrine's stores are available to any defender.\n\nThe keeper stops the patrol on its return and demands the offering be restored. The spearwoman asks her matriarch to decide whether a sacred gift can be taken back into ordinary service."
 war_culture_and_religion_events.219.a:0 "Pay for a settlement preserving the traditional shrine duties."
 war_culture_and_religion_events.219.b:0 "Collect the weapon's value as a service payment."
 war_culture_and_religion_events.219.c:0 "Send a costly patrol to assess the river defenses."
 war_culture_and_religion_events.219.dd:0 "Organize a public ceremony honoring the original offering."

 war_culture_and_religion_events.220.t:0 "The Legion Listed under Two Kings"
 war_culture_and_religion_events.220.d:0 "A Nehekharan scribe discovers that the same burial cohort appears on two royal muster rolls. Each tomb captain claims the older dedication and commands the soldiers to follow him.\n\nThe cohort halts between their standards, unable to obey both. The scribe brings the disputed tablets before [Root.Monarch.GetName], asking for one command that can be enforced."
 war_culture_and_religion_events.220.a:0 "Claim the cohort under our royal authority despite rival protests."
 war_culture_and_religion_events.220.b:0 "Pay to compare and correct the mortuary rolls."

 war_culture_and_religion_events.221.t:0 "The Bhagaran Oasis Watch"
 war_culture_and_religion_events.221.d:0 "A Bhagaran watch captain finds that sand has buried the markers defining an oasis patrol. His soldiers follow the remaining stones and leave a supply route unguarded.\n\nAn engineer reconstructs the older boundary from a weathered plan. The captain presents it to the ruler with a request for a permanent watch trained to recognize the changing ground."
 war_culture_and_religion_events.221.a:0 "Select and publicly commission a smaller, fully trained oasis watch."
 war_culture_and_religion_events.221.b:0 "Send a patrol to find the buried markers, despite the desert's dangers."
 war_culture_and_religion_events.221.c:0 "Negotiate regular training with the oasis keepers."

 war_culture_and_religion_events.222.t:0 "The Zandrian Admiral's Sealed Quay"
 war_culture_and_religion_events.222.d:0 "A Zandrian admiral orders an ancient quay reopened for a fleet review. The harbor keeper discovers that its store chambers are still sealed under another ruler's burial decree.\n\nThe admiral demands immediate access while the keeper refuses to break the seals. A model of the quay and copies of the decree reach [Root.Monarch.GetName] before work can continue."
 war_culture_and_religion_events.222.a:0 "Fund and organize the naval review under a public decree."
 war_culture_and_religion_events.222.b:0 "Negotiate access and postpone the military review."
 war_culture_and_religion_events.222.c:0 "Pay to audit and register the sealed harbor stores."
 war_culture_and_religion_events.222.dd:0 "Assign crews to enforce exclusive local harbor rights."

 war_culture_and_religion_events.223.t:0 "The Lybarasian Engineer's Reversed Plan"
 war_culture_and_religion_events.223.d:0 "A Lybarasian engineer finds that builders have copied an ancient mechanism in reverse. Its lifting arm moves correctly until a full load is placed upon it, when the frame begins to buckle.\n\nThe copying scribe insists he followed the surviving diagram exactly. The engineer saves the model and brings it to court before workers attempt the same arrangement at full size."
 war_culture_and_religion_events.223.a:0 "Fund a review, reconcile the plans, and divert crews to the work."
 war_culture_and_religion_events.223.b:0 "Recover the disputed contract payments for the treasury."

 war_culture_and_religion_events.224.t:0 "The Lahmian Invitation's Hidden Obligation"
 war_culture_and_religion_events.224.d:0 "A Lahmian household accepts an invitation to a court ceremony, then learns that attendance binds its retainers to the host's service. The obligation appears in a familiar formula at the bottom of the letter.\n\nOne older example describes retainers sent to guard a guest for a single evening. Another extends the same formula to an entire season, giving each advocate a precedent and neither a decisive answer.\n\nThe household's advocate claims the phrase is ceremonial, while the host produces older examples enforced literally. Both arrive before the ruler with the retainers waiting outside."
 war_culture_and_religion_events.224.a:0 "Enforce the traditional formula and take the promised service."
 war_culture_and_religion_events.224.b:0 "Pay to register the precise obligations of court invitations."
 war_culture_and_religion_events.224.c:0 "Sponsor a public ceremony honoring a negotiated settlement."

 war_culture_and_religion_events.225.t:0 "The Bone Levy with Mismatched Limbs"
 war_culture_and_religion_events.225.d:0 "A Nagashi necromancer delivers a corpse levy whose limbs bear marks from several different burial allotments. His rival claims he has filled the quota by stripping bodies reserved for other service. One skeleton tries to walk in two directions when the masters call it at once.\n\nThe assembled dead stumble when conflicting commands are spoken. Both masters bring their tablets before [Root.Monarch.GetName], leaving the levy motionless until a single order is issued."
 war_culture_and_religion_events.225.a:0 "Organize an honored, disciplined legion with corrected service records."
 war_culture_and_religion_events.225.b:0 "Test the levy under field conditions despite the losses."
 war_culture_and_religion_events.225.c:0 "Sell the disputed surplus and take the proceeds."
 war_culture_and_religion_events.225.dd:0 "Negotiate access to the necromancer's new assembly methods."
 war_culture_and_religion_events.225.husk:0 "Nagash claims the disputed stores and their entire value."

 war_culture_and_religion_events.226.t:0 "The Yaghur Guide's Buried Markers"
 war_culture_and_religion_events.226.d:0 "A Yaghur guide discovers that a sandstorm has buried the markers along a tomb road. He brings a military convoy through by memory, then refuses to guide another until the old signs are restored.\n\nThe convoy's captain praises the rescue but questions the guide's price. They present the broken top of a marker to the ruler, making the road's neglect impossible to dismiss."
 war_culture_and_religion_events.226.a:0 "Fund the repairs and honor the guide's military service."
 war_culture_and_religion_events.226.b:0 "Negotiate the guiding fee and cancel the next convoy."

 war_culture_and_religion_events.227.t:0 "The Hobgoblin Wolf Sold Twice"
 war_culture_and_religion_events.227.d:0 "A Steppe Hobgoblin trader sells the same breeding wolf to two riders, taking payment from each before the animal changes hands. He claims one bought its services and the other its offspring.\n\nThe riders tether the wolf between their tents and begin arguing over who must feed it. The khan receives both contracts when the hungry animal breaks loose and eats the trader's baggage."
 war_culture_and_religion_events.227.a:0 "Pay for a settlement and organize clear breeding contracts."
 war_culture_and_religion_events.227.b:0 "Take the trader's payments into the treasury."
 war_culture_and_religion_events.227.c:0 "Register all breeding rights under the khan's authority."

 war_culture_and_religion_events.228.t:0 "The Overseer's Extra Cut"
 war_culture_and_religion_events.228.d:0 "A Darklands Hobgoblin overseer adds an extra share for himself to the ration count. His assistants copy the practice until the labor gang receives barely half its allotment.\n\nThe senior overseer catches them and demands punishment for theft. They bring his original tally to the ruler, exposing the rule he expected to apply only to himself."
 war_culture_and_religion_events.228.a:0 "Enforce the old hierarchy and take the assistants into service."
 war_culture_and_religion_events.228.b:0 "Pay for a full audit of the ration tallies."
 war_culture_and_religion_events.228.c:0 "Negotiate repayment and suspend the armed inspection."
 war_culture_and_religion_events.228.dd:0 "Pay the arrears and assert the ruler's control of the stores."

 war_culture_and_religion_events.229.t:0 "The Skaven Muster with Borrowed Rats"
 war_culture_and_religion_events.229.d:0 "A Skaven clawleader borrows warriors from three neighbors for an inspection, promising each that the others will not attend. All three arrive to collect their troops while the muster is still being counted.\n\nThe borrowed rats change places every time a scribe looks away. The inspecting captain blocks the exits and requests an order before the entire formation disappears into side tunnels."
 war_culture_and_religion_events.229.a:0 "Publicly commission trained inspectors and enforce regular drills."
 war_culture_and_religion_events.229.b:0 "Send the borrowed rats to scout hostile tunnels before they can leave."

 war_culture_and_religion_events.230.t:0 "The Eshin Contract's Surviving Witness"
 war_culture_and_religion_events.230.d:0 "An Eshin agent returns from a contract with the target's signet and a witness who was supposed to see nothing. The witness claims to have hired the target for a second contract against the first employer.\n\nThe agent places both payments before his master without opening either pouch. Their warlord must decide how to use a success that has exposed several competing bargains."
 war_culture_and_religion_events.230.a:0 "Pay for a military review and invite competing suppliers."
 war_culture_and_religion_events.230.b:0 "Negotiate between the employers and suspend the operation."
 war_culture_and_religion_events.230.c:0 "Sacrifice the implicated agents in a public display of success."

 war_culture_and_religion_events.231.t:0 "The Moulder Specimen with Two Brands"
 war_culture_and_religion_events.231.d:0 "Two Moulder packmasters recognize their brands on the same newly purchased beast. One claims the head and shoulders, while the other claims everything behind them.\n\nThe flesh-sculptor insists both sold their stock legally and that the finished specimen belongs to him. Its cage begins to buckle while the three bring their separate tallies before the warlord."
 war_culture_and_religion_events.231.a:0 "Pay for arbitration and record each breeder's contribution."
 war_culture_and_religion_events.231.b:0 "Sell the disputed specimen for the ruler's share."
 war_culture_and_religion_events.231.c:0 "Test the beast with a military handling party, accepting losses."
 war_culture_and_religion_events.231.dd:0 "Inventory and sell the flesh-sculptor's surplus stock."

 war_culture_and_religion_events.232.t:0 "The Mange Scribe's Eaten Debt Roll"
 war_culture_and_religion_events.232.d:0 "A Mange scribe finds his debt roll partly eaten and accuses the debtor whose name was on the missing section. The debtor points out that the scribe's own nest is lined with matching scraps.\n\nThe clawleader orders both nests searched, uncovering several contradictory copies. He carries them to the warlord rather than risk deciding which powerful creditor has been cheated."
 war_culture_and_religion_events.232.a:0 "Require both parties to acknowledge the ruler's judgment."
 war_culture_and_religion_events.232.b:0 "Pay for a new, verified register of the debts."

 war_culture_and_religion_events.233.t:0 "The Pestilens Bell Crew"
 war_culture_and_religion_events.233.d:0 "A Pestilens bell crew collapses during a march after its overseer orders the load increased. He claims the extra weight makes a holier sound and refuses to remove it.\n\nThe escort captain notes that the rest of the column cannot pass the fallen frame. Surviving attendants drag it aside and appeal for a fixed division between devotional demands and marching orders."
 war_culture_and_religion_events.233.a:0 "Give the bell crews a public commission and regular marching drills."
 war_culture_and_religion_events.233.b:0 "March the full bell train through narrow tunnels, accepting casualties."
 war_culture_and_religion_events.233.c:0 "Let the overseer and captain settle the load themselves."

 war_culture_and_religion_events.234.t:0 "The Skryre Engine That Fired Backwards"
 war_culture_and_religion_events.234.d:0 "A Skryre engineer demonstrates a new weapon and blows a hole through the wall behind his audience. He claims the reverse blast was intentional and points to a rival's workshop beyond the damage.\n\nAn apprentice quietly turns the sketch around and shows that both engineers have been reading it from opposite sides. Each immediately claims that this proves his version was the original.\n\nThe rival produces a stolen sketch showing that the barrel was fitted the wrong way round. Both demand payment for an invention whose first successful result neither will admit was an accident."
 war_culture_and_religion_events.234.a:0 "Fund a public military trial and reward useful results."
 war_culture_and_religion_events.234.b:0 "Negotiate their claims and halt the trial."
 war_culture_and_religion_events.234.c:0 "Pay to catalog the designs and the construction errors."
 war_culture_and_religion_events.234.dd:0 "Leave the engineers to settle their competing claims."

 war_culture_and_religion_events.235.t:0 "The Carrion Clan's Fresh Claim"
 war_culture_and_religion_events.235.d:0 "Carrion Skaven arrive at a battlefield after the fighting and mark every corpse as their property. A returning patrol finds them stripping equipment from wounded warriors who are still breathing.\n\nThe scavenger chief argues that anything abandoned belongs to the first finder. The patrol brings survivors before the warlord, demanding a ruling before the scavengers return for the rest."
 war_culture_and_religion_events.235.a:0 "Pay for a settlement under the old salvage customs."
 war_culture_and_religion_events.235.b:0 "Take a levy from the recovered equipment."

 war_culture_and_religion_events.236.t:0 "The Scruten Thief's Official Seal"
 war_culture_and_religion_events.236.d:0 "A Scruten thief steals a seal from an official and uses it to requisition guards for another burglary. The guards complete the assignment before realizing that their orders never passed through the proper office.\n\nThe thief returns with enough stolen records to expose his pursuers' own schemes. He offers the papers and his followers to the warlord in exchange for recognition."
 war_culture_and_religion_events.236.a:0 "Pay for the records and bind his followers to our authority."
 war_culture_and_religion_events.236.b:0 "Fund an audit of the stolen orders and requisitions."
 war_culture_and_religion_events.236.c:0 "Let the rival officials pursue their own claims."

 war_culture_and_religion_events.237.t:0 "The Mors Warrior Who Held the Door"
 war_culture_and_religion_events.237.d:0 "A Clan Mors warrior holds a tunnel door while his fleeing clawleader claims to be directing a withdrawal. When reinforcements arrive, the clawleader takes credit for the stand. The warrior has a shattered shield and no surviving weapon with which to display his feat.\n\nThe survivors drag the battered door into the muster yard and name the warrior who actually held it. Their commander asks the warlord to settle the claim before discipline turns into revenge."
 war_culture_and_religion_events.237.a:0 "Stage a military ceremony honoring the stand."
 war_culture_and_religion_events.237.b:0 "Make the survivors teach tunnel defense under live attack."
 war_culture_and_religion_events.237.c:0 "Fine the clawleader and collect the payment."
 war_culture_and_religion_events.237.dd:0 "Require a public oath acknowledging the warlord's judgment."

 war_culture_and_religion_events.238.t:0 "The Rictus Recruit's Dyed Fur"
 war_culture_and_religion_events.238.d:0 "A Rictus captain discovers that a recruit has darkened his fur to win a place among favored warriors. The deception washes away during a tunnel flood, after the recruit helps carry the captain to safety.\n\nThe captain cannot deny the rescue but refuses to ignore the fraud. He presents the stained armor before the warlord, asking what kind of service earns a place in the ranks."
 war_culture_and_religion_events.238.a:0 "Pay for a public reward honoring the rescue."
 war_culture_and_religion_events.238.b:0 "Negotiate the recruit's place and suspend the captain's judgment."

 war_culture_and_religion_events.239.t:0 "The Skurvy Captain's Floating Strongbox"
 war_culture_and_religion_events.239.d:0 "A Skurvy ship takes on water, and the captain orders its strongbox thrown overboard to lighten the hull. His crew later finds that he attached a float and sent a trusted swimmer after it.\n\nThe recovered chest contains pay he had declared lost at sea. The crew brings it to the warlord's landing, demanding that the voyage's accounts be reopened."
 war_culture_and_religion_events.239.a:0 "Pay for arbitration and assign officers to correct the accounts."
 war_culture_and_religion_events.239.b:0 "Seize the chest's value for the treasury."
 war_culture_and_religion_events.239.c:0 "Organize trials of the captain's concealed flotation device."

 war_culture_and_religion_events.240.t:0 "The Krizzor Drillmaster's Hidden Recruits"
 war_culture_and_religion_events.240.d:0 "A Krizzor drillmaster keeps his best recruits out of an inspection so that he can charge again for training them. A supply clerk exposes the scheme when the missing rats continue drawing rations.\n\nThe drillmaster claims they are a reserve and offers them directly to the warlord. Rival captains arrive with their own unpaid bills, turning the inspection into a dispute over who controls the trained troops."
 war_culture_and_religion_events.240.a:0 "Accept the hidden recruits under our authority."
 war_culture_and_religion_events.240.b:0 "Pay to audit the training and ration records."
 war_culture_and_religion_events.240.c:0 "Negotiate the bills and suspend the inspection."
 war_culture_and_religion_events.240.dd:0 "Fund a settlement that restores confidence in our contracts."

 war_culture_and_religion_events.241.t:0 "The Volkn Guard at the Furnace Door"
 war_culture_and_religion_events.241.d:0 "A Volkn guard seals a furnace door after finding its support frame cracked. The forge master orders it reopened, saying the scheduled weapons delivery matters more than the guard's fear.\n\nA dropped ingot then tears the weakened frame from its fittings. The guard brings the fragments to the warlord and demands trained crews empowered to enforce proper handling."
 war_culture_and_religion_events.241.a:0 "Give trained furnace guards a public commission to enforce handling rules."
 war_culture_and_religion_events.241.b:0 "Trial the furnace defenses with armed crews, despite the danger."

 war_culture_and_religion_events.242.t:0 "The Mordkin Grave with Fresh Orders"
 war_culture_and_religion_events.242.d:0 "Mordkin scavengers open a grave and find a corpse holding a sealed military order. The order commands a unit that is still drawing supplies, though its supposed captain has plainly been dead for some time.\n\nThe unit's clawleader claims the order remains valid until formally revoked. He brings the corpse before the warlord, hoping its discovery will earn him the dead captain's position."
 war_culture_and_religion_events.242.a:0 "Fund a military inquiry and publicly recognize the discovery."
 war_culture_and_religion_events.242.b:0 "Negotiate the command and suspend the disputed orders."
 war_culture_and_religion_events.242.c:0 "Remove the false recruits and correct the unit's records."

 war_culture_and_religion_events.243.t:0 "The Gritus Throne of Stolen Seals"
 war_culture_and_religion_events.243.d:0 "A Gritus scrap dealer builds a chair from stolen metal and discovers several official seals fixed to its arms. He begins stamping claims to goods that passed through the original owners' stores.\n\nThe owners demand the seals back, but each denies losing one. The chair is dragged before the warlord with a pile of freshly stamped claims tied to its legs."
 war_culture_and_religion_events.243.a:0 "Pay for arbitration under established ownership rules."
 war_culture_and_religion_events.243.b:0 "Collect a fee from the disputed claims."
 war_culture_and_religion_events.243.c:0 "Send fighters into rival stores to trace the stolen goods."
 war_culture_and_religion_events.243.dd:0 "Organize recruits from the dealer's scavenger gangs."

 war_culture_and_religion_events.244.t:0 "The Grutnik Tunnel Rented Twice"
 war_culture_and_religion_events.244.d:0 "A Grutnik landlord rents the same tunnel chamber to two armed gangs for different parts of the day. He neglects to tell either that the other exists, then seals the entrance when both refuse payment.\n\nThe trapped rats break through a side wall and invade a third tenant's stores. Their leaders reach the warlord with the landlord's rent marks and a demand for someone stronger to guarantee their quarters."
 war_culture_and_religion_events.244.a:0 "Take the gangs into service under our authority."
 war_culture_and_religion_events.244.b:0 "Pay for a verified register of chambers and rents."

 war_culture_and_religion_events.245.t:0 "The Ferrik Blades with Soft Centers"
 war_culture_and_religion_events.245.d:0 "A Ferrik smith delivers weapons that bend during the first drill. He accuses the recruits of striking too hard, until their captain snaps a blade and exposes its poorly worked core.\n\nThe smith's apprentices admit rushing the order after guards demanded early delivery. The broken blades reach the warlord with competing requests for control over weapons inspections."
 war_culture_and_religion_events.245.a:0 "Commission trained weapons inspectors and regular testing drills."
 war_culture_and_religion_events.245.b:0 "Trial the remaining blades against live resistance, accepting casualties."
 war_culture_and_religion_events.245.c:0 "Negotiate common standards and regular military inspections."

 war_culture_and_religion_events.246.t:0 "The Crooktail Ledger That Balanced Twice"
 war_culture_and_religion_events.246.d:0 "A Crooktail smuggler produces two ledgers, one showing a profit and the other a loss on the same cargo. He uses the profitable account to claim a reward and the loss to avoid the ruler's share.\n\nA guard catches his courier carrying both books through the same checkpoint. The smuggler arrives to explain himself before the inspectors discover which armed escorts helped conceal the shipment."
 war_culture_and_religion_events.246.a:0 "Fund a military investigation and honor its dangerous work."
 war_culture_and_religion_events.246.b:0 "Negotiate disclosure and dismiss the additional guards."
 war_culture_and_religion_events.246.c:0 "Pay for an audit of both sets of accounts."
 war_culture_and_religion_events.246.dd:0 "Release implicated escorts in exchange for their testimony."

 war_culture_and_religion_events.247.t:0 "The Jungle Warren Behind the Roots"
 war_culture_and_religion_events.247.d:0 "Jungle Skaven dig through a wall of roots and discover a dry chamber above the flood level. Two clawleaders claim it before the diggers finish widening the entrance.\n\nThe chamber's first occupant discovers scratch marks suggesting it was used before the flood. Both clawleaders immediately claim descent from the rats who made them, though neither can read the marks.\n\nOne fills it with stores while the other sends warriors to occupy it. The diggers block both parties with their carts and request a ruling before anyone settles in the chamber they uncovered."
 war_culture_and_religion_events.247.a:0 "Pay for a settlement and reorganize the warren's assignments."
 war_culture_and_religion_events.247.b:0 "Collect rent from the newly discovered chamber."

 war_culture_and_religion_events.248.t:0 "The Southlands Plaque with the Missing Corner"
 war_culture_and_religion_events.248.d:0 "A Southlands Skink reader finds a plaque whose broken corner removes the sign identifying its appointed keeper. Two temple attendants claim custody based on different copies made before the damage. The break is old enough that neither can identify when custody first became disputed.\n\nNeither will allow the plaque to leave his sight. Their interpreter brings both copies before [Root.Monarch.GetName], asking for a single authorized keeper before the scheduled rite."
 war_culture_and_religion_events.248.a:0 "Appoint the keeper under the ruler's authority."
 war_culture_and_religion_events.248.b:0 "Pay to compare and catalog the surviving copies."
 war_culture_and_religion_events.248.c:0 "Leave custody with the temple's existing attendants."

 war_culture_and_religion_events.249.t:0 "The Lustrian Pool Reflects a New Star"
 war_culture_and_religion_events.249.d:0 "A Lustrian Skink observer sees a star reflected in a temple pool that does not appear in the expected position above it. He confirms the discrepancy on several nights and summons the patrol responsible for nearby markers.\n\nThey find one marker tilted by roots beneath its base. The priests bring the observation and patrol report together, seeking instructions for guarding the restored alignment."
 war_culture_and_religion_events.249.a:0 "Publicly commission trained patrols for the alignment markers."
 war_culture_and_religion_events.249.b:0 "Send patrols to check markers deep in the jungle, accepting losses."
 war_culture_and_religion_events.249.c:0 "Collect the disputed maintenance tribute."
 war_culture_and_religion_events.249.dd:0 "Negotiate access for observers to study the changed reflection."

 war_culture_and_religion_events.250.t:0 "The Hexoatl Shield before the Solar Plaque"
 war_culture_and_religion_events.250.d:0 "A temple attendant trained in Hexoatl places a shield before a solar plaque during a defense drill. Its polished face directs light onto markings the readers had overlooked.\n\nThe guard captain calls the result an accident, but the attendant repeats it before witnesses. The priests ask the ruler to decide whether soldiers should take part in a larger test of the arrangement."
 war_culture_and_religion_events.250.a:0 "Fund an honored military expedition to test the markings, accepting losses."
 war_culture_and_religion_events.250.b:0 "Negotiate a temple-led study and cancel the military test."

 war_culture_and_religion_events.251.t:0 "The River Shrine's Borrowed Canoes"
 war_culture_and_religion_events.251.d:0 "Lizardmen attendants at a river shrine prepare canoes for a ceremonial journey and find that a patrol has borrowed them. The patrol returns with rescued workers but too few boats to complete the rite.\n\nIts captain says several hulls were lost bringing the workers through flooded channels. The shrine keeper requests a ruling on replacement and service obligations before the water rises again."
 war_culture_and_religion_events.251.a:0 "Fund replacements, negotiate duties, and release crews to the shrine."
 war_culture_and_religion_events.251.b:0 "Collect the value of the missing boats."
 war_culture_and_religion_events.251.c:0 "Organize new recruits for the river service."

 war_culture_and_religion_events.252.t:0 "The Brood Chief's Empty Gem Basket"
 war_culture_and_religion_events.252.d:0 "A Dragon Isles brood chief carries a gem basket up a step-altar and discovers that its lower layers are filled with pebbles. The tribute collectors accuse one another while warriors wait beside the blood-gong.\n\nA collector produces a full basket he says was substituted at the foot of the altar. Its gems carry another clan's tally cord, and that clan's guards move to surround him before he can explain.\n\nA priest points to scorched bones left by a dragon's last visit and demands that the tribute be made whole. The chief summons the collectors before the ruler, with their clan guards still assembled below."
 war_culture_and_religion_events.252.a:0 "Pay the shortfall and bind the clan guards to our authority."
 war_culture_and_religion_events.252.b:0 "Fund a proper count of the gem tribute."
 war_culture_and_religion_events.252.c:0 "Negotiate the clans' shares and dismiss the armed gathering."
 war_culture_and_religion_events.252.dd:0 "Buy provisions to recruit additional clan warriors."

 war_culture_and_religion_events.253.t:0 "The Fang Taken from the Shrine"
 war_culture_and_religion_events.253.d:0 "A feral Lizardman hunter removes a great fang from a shrine and wears it on his spear. Its keeper follows him to the camp, demanding the return of an offering left by an older hunting band.\n\nThe hunter lays a fresh kill beside it and claims he has earned the right to bear the fang. The gathered warriors await the ruler's sign before the dispute becomes a challenge."
 war_culture_and_religion_events.253.a:0 "Arrange a martial rite publicly honoring the hunter."
 war_culture_and_religion_events.253.b:0 "Send the hunters after another great beast, whatever the losses."

 war_culture_and_religion_events.254.t:0 "The Troglodyte Signal in the Wrong Tunnel"
 war_culture_and_religion_events.254.d:0 "A Troglodyte watch sends an alarm through a tunnel whose echoes once carried it to the main gathering. A recent collapse changes the sound, drawing defenders toward an empty passage instead.\n\nA scout finds the abandoned warning post after the danger has passed. He repeats the altered call before the ruler, showing why the tunnel watches need a new agreement on signals."
 war_culture_and_religion_events.254.a:0 "Fund and honor a military survey of the signal passages."
 war_culture_and_religion_events.254.b:0 "Negotiate new signals and suspend the disputed watch."
 war_culture_and_religion_events.254.c:0 "Release warriors to the tunnel keepers in return for an agreement."

 war_culture_and_religion_events.255.t:0 "The Sandscale Cistern Mark"
 war_culture_and_religion_events.255.d:0 "A Sandscale water keeper finds a storage mark scratched higher on a cistern wall than the water has ever reached. The collector using it has demanded deliveries that nearby wells cannot provide.\n\nWorkers bring empty jars to the gathering and refuse another journey. The keeper shows the ruler the older mark beneath a layer of hardened mineral, exposing how the quota was changed."
 war_culture_and_religion_events.255.a:0 "Pay for a settlement and reorganize the water accounts."
 war_culture_and_religion_events.255.b:0 "Collect the disputed delivery levy."
 war_culture_and_religion_events.255.c:0 "Send a costly patrol to inspect the supplying wells."
 war_culture_and_religion_events.255.dd:0 "Organize a witnessed guarantee of the corrected water obligations."

 war_culture_and_religion_events.256.t:0 "The Iron Cathayan Convoy's Missing Guards"
 war_culture_and_religion_events.256.d:0 "An Iron Cathayan supply convoy reaches a fortified gate with fewer escorts than its register promises. Its captain explains that one district sent payment instead of recruits, but the money never reached him.\n\nThe gate commander confirms that the convoy barely escaped an ambush. The district's seal and the unpaid escort roster are sent to [Root.Capital.GetName] for an enforceable ruling."
 war_culture_and_religion_events.256.a:0 "Pay to muster the missing recruits under our authority."
 war_culture_and_religion_events.256.b:0 "Fund an audit of escort and payment obligations."

 war_culture_and_religion_events.257.t:0 "The Fire Cathayan Kiln Watch"
 war_culture_and_religion_events.257.d:0 "A Fire Cathayan kiln master locks a military inspector out while a firing is in progress. The inspector orders soldiers to open the vents, ruining the heat and cracking the army's commissioned work.\n\nThe master saves a fragment bearing the inspector's official mark. His petition asks for soldiers trained to protect workshops without interrupting the processes they are sent to inspect."
 war_culture_and_religion_events.257.a:0 "Commission a trained workshop inspection corps and recognize its standing."
 war_culture_and_religion_events.257.b:0 "Test the soldiers' methods around a working kiln, despite the risks."
 war_culture_and_religion_events.257.c:0 "Let the kiln master and inspector settle the loss locally."

 war_culture_and_religion_events.258.t:0 "The Jade Cathayan Grain Measure"
 war_culture_and_religion_events.258.d:0 "A Jade Cathayan clerk finds that the army and civil granaries use baskets of different capacity under the same name. Both sets carry valid seals, leaving every transfer short in one ledger and generous in the other.\n\nThe clerk demonstrates the difference before the quartermaster, who orders the baskets held. Their report reaches the ruler before the next district deliveries make the discrepancy larger."
 war_culture_and_religion_events.258.a:0 "Fund and honor a military inspection despite official protests."
 war_culture_and_religion_events.258.b:0 "Negotiate a common measure and suspend the inspection."
 war_culture_and_religion_events.258.c:0 "Pay for a complete revision of the measure books."
 war_culture_and_religion_events.258.dd:0 "Leave the officials to reconcile the transfers themselves."

 war_culture_and_religion_events.259.t:0 "The Sea Cathayan Pilot's Unlisted Channel"
 war_culture_and_religion_events.259.d:0 "A Sea Cathayan pilot guides a trading ship through a channel missing from the official harbor chart. The patrol captain stops her on arrival because the route bypasses the inspection station.\n\nThe pilot says the registered channel has silted up and offers soundings to prove it. Merchants waiting offshore ask the ruler to settle which route they may legally use."
 war_culture_and_religion_events.259.a:0 "Pay to revise the chart and negotiate new passage rules."
 war_culture_and_religion_events.259.b:0 "Collect a special fee for the unregistered passage."

 war_culture_and_religion_events.260.t:0 "The Storm Cathayan Watcher's Wrong Forecast"
 war_culture_and_religion_events.260.d:0 "A Storm Cathayan watcher warns a garrison of strong winds and orders its signal kites grounded. A second observer sees approaching raiders and cannot raise the expected alarm.\n\nThe captain catches the raid with mounted scouts but demands a change in authority over the signals. Both observers bring their weather records before [Root.Monarch.GetName], with volunteers waiting to replace the exhausted riders."
 war_culture_and_religion_events.260.a:0 "Bind the volunteers to our authority and clarify command."
 war_culture_and_religion_events.260.b:0 "Pay to reconcile the weather and signal registers."
 war_culture_and_religion_events.260.c:0 "Fund patrol training based on the raid's lessons."

 war_culture_and_religion_events.261.t:0 "The Field Petition beneath the Muster Roll"
 war_culture_and_religion_events.261.d:0 "Cathayan village headmen submit a field petition asking that the levy wait until irrigation channels are cleared. The recruiting clerk files it beneath his muster roll without reading it. The clerk's own seal appears on the unanswered receipt.\n\nWhen the recruits arrive, they bring their digging tools and demonstrate what was left unfinished. Their captain forwards the petition to the ruler, asking whether training and field work can be assigned more carefully."
 war_culture_and_religion_events.261.a:0 "Fund a recognized training scheme with scheduled periods of service."
 war_culture_and_religion_events.261.b:0 "Make the levy train in the flooded fields, accepting losses."
 war_culture_and_religion_events.261.c:0 "Collect a payment in place of the disputed service."
 war_culture_and_religion_events.261.dd:0 "Negotiate a paid exemption for the affected households."

 war_culture_and_religion_events.262.t:0 "The Imperial Seal on an Old Order"
 war_culture_and_religion_events.262.d:0 "An Imperial Cathayan registrar discovers that an army order still carries the seal of an official removed from office. The captain insists the order remains valid because no replacement ever arrived.\n\nThe captain compares the two commands and finds that they assign the same troops to opposite roads. Both claim urgent authority, and neither acknowledges that the other route exists.\n\nA new official countersigns it with different instructions, leaving the unit with two lawful-looking commands. The registrar brings both to [Root.Monarch.GetName] before the soldiers move."
 war_culture_and_religion_events.262.a:0 "Fund a military review and publicly recognize the captain's discretion."
 war_culture_and_religion_events.262.b:0 "Negotiate the command and suspend the movement."

 war_culture_and_religion_events.263.t:0 "The Jadeblooded Audience before Sunset"
 war_culture_and_religion_events.263.d:0 "A living petitioner receives a Jadeblooded court appointment scheduled before sunset, but finds the audience chamber closed. The attendants refuse to change the hour because the invitation bears a senior official's seal.\n\nHe waits through the night and misses the deadline named in his petition. The chamberlain presents the invitation to the ruler, asking who can correct a protocol that no one will break."
 war_culture_and_religion_events.263.a:0 "Pay compensation and negotiate a workable audience schedule."
 war_culture_and_religion_events.263.b:0 "Collect the late filing fee despite the protest."
 war_culture_and_religion_events.263.c:0 "Register all audience changes under the ruler's authority."

 war_culture_and_religion_events.264.t:0 "The Koryon Pass Keeper's Inherited Seal"
 war_culture_and_religion_events.264.d:0 "A Koryon pass keeper dies, leaving his seal to a daughter whom the garrison refuses to recognize. The captain says its service oath names a line of men, though she has managed the crossing for years.\n\nCaravans stop while her receipts are rejected at the far gate. She brings the seal and the old oath to court, accompanied by guards willing to serve under a clarified command."
 war_culture_and_religion_events.264.a:0 "Uphold the traditional oath and muster guards under our authority."
 war_culture_and_religion_events.264.b:0 "Pay to register the crossing's offices and obligations."
 war_culture_and_religion_events.264.c:0 "Negotiate recognition and stand down the garrison."
 war_culture_and_religion_events.264.dd:0 "Fund professional training for the pass guards."

 war_culture_and_religion_events.265.t:0 "The Snakefolk Guard's Poisoned Gloves"
 war_culture_and_religion_events.265.d:0 "A Khureshi Snakefolk weapons keeper issues gloves treated with the wrong substance to a venom-handling crew. Several guards fall ill before their captain identifies the mislabeled jars.\n\nThe keeper blames an outside supplier, while the supplier produces the temple's written order. The captain brings the surviving gloves to court, demanding a trained inspection before another crew handles the stock."
 war_culture_and_religion_events.265.a:0 "Commission trained venom handlers and open their supply contracts."
 war_culture_and_religion_events.265.b:0 "Test the remaining stock under field conditions, accepting losses."

 war_culture_and_religion_events.266.t:0 "The Longfang Champion's Stolen Trophy"
 war_culture_and_religion_events.266.d:0 "A Longfang champion presents a trophy fang at a rite that grants a place among senior warriors. A younger hunter recognizes it as one taken from the kill of his own band.\n\nThe champion admits receiving it as tribute but claims that tribute carries the honor with it. The ritual keeper suspends the dedication until the ruler decides what the trophy proves."
 war_culture_and_religion_events.266.a:0 "Fund the traditional judgment and honor the recognized champion."
 war_culture_and_religion_events.266.b:0 "Negotiate the claim and stop the armed gathering."
 war_culture_and_religion_events.266.c:0 "Hold a dangerous public trial of the claimants' prowess."

 war_culture_and_religion_events.267.t:0 "The North Indish Elephant Keeper's Seal"
 war_culture_and_religion_events.267.d:0 "A North Indish elephant keeper refuses a military requisition because its seal belongs to a temple that never owned the animals. The captain says he was ordered to accept any properly stamped authorization.\n\nThe keeper brings the beasts' lineage register to court while handlers prevent the soldiers from approaching them. Both sides need a decision before the elephants are moved from their feeding grounds."
 war_culture_and_religion_events.267.a:0 "Pay for an audit, negotiate access, and release needed handlers."
 war_culture_and_religion_events.267.b:0 "Collect a levy from the disputed requisition."
 war_culture_and_religion_events.267.c:0 "Send a costly military trial to study the animals' use."
 war_culture_and_religion_events.267.dd:0 "Leave the temple and captain to settle the authorization."

 war_culture_and_religion_events.268.t:0 "The East Indish Convoy before the Monsoon"
 war_culture_and_religion_events.268.d:0 "An East Indish spice merchant assembles a convoy just as its escort is summoned to another muster. The escort captain warns that waiting for replacement guards will cost the merchants the seasonal crossing.\n\nThe merchant offers provisions for additional recruits if the government guarantees they can depart in time. His sealed proposal reaches [Root.Capital.GetName] with the harbor's latest wind report."
 war_culture_and_religion_events.268.a:0 "Pay to recruit an escort sworn to our authority."
 war_culture_and_religion_events.268.b:0 "Fund a clear register of convoy and muster obligations."

 war_culture_and_religion_events.269.t:0 "The South Indish Temple Watch"
 war_culture_and_religion_events.269.d:0 "A South Indish temple captain finds that pilgrims have cleared a shortcut through the jungle beyond his watchposts. After a traveler disappears, the shrine keeper demands patrols along the unapproved path.\n\nThe captain brings back abandoned sandals and evidence of a predator near the crossing. He asks the ruler for a permanent decision on how the temple's roads should be guarded."
 war_culture_and_religion_events.269.a:0 "Give the temple watch a public commission and regular patrol training."
 war_culture_and_religion_events.269.b:0 "Track the predator along the shortcut, even if guards are lost."
 war_culture_and_religion_events.269.c:0 "Let the captain and shrine keeper settle their duties."

 war_culture_and_religion_events.270.t:0 "The West Indish Jeweler's Escort Chest"
 war_culture_and_religion_events.270.d:0 "A West Indish jeweler pays a caravan escort with a sealed chest said to contain gems. At the destination, the captain finds cut glass beneath a thin layer of genuine stones.\n\nThe jeweler claims thieves replaced the contents during the journey and demands compensation from the guards. The unopened seals and the captain's route journal are presented to [Root.Monarch.GetName]."
 war_culture_and_religion_events.270.a:0 "Fund an armed inquiry and publicly honor the escort."
 war_culture_and_religion_events.270.b:0 "Negotiate compensation and stand down the guards."
 war_culture_and_religion_events.270.c:0 "Pay for an audit of cargo seals and contracts."
 war_culture_and_religion_events.270.dd:0 "Leave the merchant and captain to their existing contract."

 war_culture_and_religion_events.271.t:0 "The Tigerkin Hunter's Ceremonial Mask"
 war_culture_and_religion_events.271.d:0 "A Tigerkin hunter lends a ceremonial mask to a visiting relative, who uses it to claim entry to a restricted hunt. The hunt's keeper catches the substitution after recognizing the visitor's unfamiliar scent. The visiting hunter returns the mask immediately but refuses to surrender his share of the kill.\n\nThe visitor insists the loan included permission to participate. Both families ask the ruler to hear the case before the keeper strips the original owner of his place."
 war_culture_and_religion_events.271.a:0 "Pay for a settlement and allow outside witnesses."
 war_culture_and_religion_events.271.b:0 "Collect a penalty for the unauthorized participation."

 war_culture_and_religion_events.272.t:0 "The Monkeyfolk Bridge Keeper's Trick"
 war_culture_and_religion_events.272.d:0 "A Monkeyfolk bridge keeper moves his toll basket to the far end of a vine bridge and claims travelers must pay again to leave it. A group of messengers unties the basket and swings it back across the river.\n\nThe keeper demands protection against theft, while the messengers offer to guard the crossing themselves. Their elders bring both parties before the ruler before anyone cuts the bridge's support vines."
 war_culture_and_religion_events.272.a:0 "Pay for repairs and bind the volunteers to our authority."
 war_culture_and_religion_events.272.b:0 "Fund a clear register of bridge duties and tolls."
 war_culture_and_religion_events.272.c:0 "Let the bridge keeper and messengers settle the basket's ownership."

 war_culture_and_religion_events.273.t:0 "The Northern Nipponese Banner in the Snow"
 war_culture_and_religion_events.273.d:0 "A northern Nipponese retainer carries his clan banner through a snowstorm after the appointed bearer collapses. At the muster, the clan elder denies him the honor because the office is hereditary.\n\nThe rescued bearer confirms that the retainer saved both his life and the standard. Their captain presents the testimony to the ruler, asking how the deed should be recognized."
 war_culture_and_religion_events.273.a:0 "Honor the feat within a professional corps preserving the old offices."
 war_culture_and_religion_events.273.b:0 "Send the retainers to practice rescues in the snowbound passes."
 war_culture_and_religion_events.273.c:0 "Collect a fee to confirm the disputed office."
 war_culture_and_religion_events.273.dd:0 "Negotiate the claim and record the banner's service obligations."

 war_culture_and_religion_events.274.t:0 "The Southern Nipponese Harbor Guard's Guns"
 war_culture_and_religion_events.274.d:0 "A southern Nipponese harbor guard takes delivery of new firearms paid for by a merchant guild. The guild demands that its own captain command the men who use them.\n\nThe magistrate refuses, citing the ruler's authority over the watch. A demonstration at the harbor proves the weapons useful, leaving the court to settle who directs the armed men now carrying them."
 war_culture_and_religion_events.274.a:0 "Fund a public military review and recognize the guild captain's role."
 war_culture_and_religion_events.274.b:0 "Negotiate ownership and suspend the military demonstration."

 war_culture_and_religion_events.275.t:0 "The Drowned Captain Inside His Own Wreck"
 war_culture_and_religion_events.275.d:0 "Salvagers open a wreck and find its drowned captain still gripping the strongroom keys. He rises when they disturb him and claims both the cargo and the men who boarded his ship.\n\nOne salvager recognizes his grandfather's signature among the captain's old witnesses. The captain demands that the descendant answer for the same oath, turning a salvage claim into a dispute over inherited service.\n\nThe salvagers retreat to the dock with goods already recovered. The captain follows to demand a hearing, producing ship's articles written before any of those he accuses were born."
 war_culture_and_religion_events.275.a:0 "Pay for arbitration and recognize the captain's independent salvage claim."
 war_culture_and_religion_events.275.b:0 "Take a levy from the recovered cargo."
 war_culture_and_religion_events.275.c:0 "Organize reliable guarantees for future salvage agreements."

 war_culture_and_religion_events.276.t:0 "The Necromariner's Undead Signature"
 war_culture_and_religion_events.276.d:0 "A Necromariner clerk orders a raised sailor to sign the ship's articles and receives the dead captain's name instead. Other corpses repeat the signature, responding to an older command still bound into them.\n\nThe present captain insists their service belongs to him because he paid to recover the bodies. The clerk brings the duplicated signatures to the ruler before the crew receives conflicting orders at sea."
 war_culture_and_religion_events.276.a:0 "Confirm the ruler's authority over the disputed service."
 war_culture_and_religion_events.276.b:0 "Pay to reconstruct the crew's articles and commands."
 war_culture_and_religion_events.276.c:0 "Negotiate the claim and suspend the crew's deployment."
 war_culture_and_religion_events.276.dd:0 "Fund mediation between the captain and the corpse-keepers."

 war_culture_and_religion_events.277.t:0 "The Noctilavan Crew That Missed Its Signal"
 war_culture_and_religion_events.277.d:0 "A Noctilavan boarding crew attacks a wreck before its captain gives the signal and becomes trapped among the shifting timbers. The rescuers recover most of the crew, but lose valuable stores in the attempt.\n\nThe captain finds that several raised sailors still obeyed the signal used by their previous master. He brings the conflicting command tokens to the ruler, asking for disciplined crews before another voyage."
 war_culture_and_religion_events.277.a:0 "Commission a recognized training program using one set of crew signals."
 war_culture_and_religion_events.277.b:0 "Repeat the boarding under moving wreckage, accepting losses."

 war_culture_and_religion_events.278.t:0 "The Custodian's Misaligned Observatory"
 war_culture_and_religion_events.278.d:0 "A custodian discovers that a repaired observatory platform no longer matches the celestial measure recorded in its oldest plan. The wardens had shifted its foundations to close a breach in the defenses.\n\nThe custodian demonstrates the resulting error with the observatory's own instruments. Defenders and archivists assemble before the ruler, asking how the site can be secured without corrupting the work it was built to perform."
 war_culture_and_religion_events.278.a:0 "Fund an honored military survey with supplies open to outside providers."
 war_culture_and_religion_events.278.b:0 "Negotiate the alignment and suspend the defense works."
 war_culture_and_religion_events.278.c:0 "Dedicate a chosen force to a hazardous, publicly honored restoration."

### END GENERATED WARHAMMER CULTURE RANDOM EVENTS
