### Warhammer Religion Random Events
 war_culture_and_religion_events.1.t:0 "Vigil at the Sacred Pool"
 war_culture_and_religion_events.1.d:0 "The grail chaplains of the Lady of the Lake have called for a water-lit vigil, drawing the faithful into chapels beside clear pools. Chalices and blue banners move through the crowd while magistrates measure how much authority should stand behind the ceremony.\n\nPatronage would turn devotion into visible strength. Wardens could bind the rite to law before enthusiasm spills into the streets. A lighter hand would spare coin, though the faithful will remember who stood nearest the altar."
 war_culture_and_religion_events.1.a:0 "Fund the sacred rite."
 war_culture_and_religion_events.1.b:0 "Appoint temple wardens."
 war_culture_and_religion_events.1.c:0 "Keep a measured hand."

 war_culture_and_religion_events.2.t:0 "A Question of Mercy"
 war_culture_and_religion_events.2.d:0 "A dispute has opened among the grail chaplains of the Lady of the Lake, centered on whether chivalric mercy is being used to excuse noble weakness. The argument is still wrapped in prayers, but its edges are already sharp enough to cut policy.\n\nMediation would cost money and patience. Leaving the faithful to argue may preserve dignity, or merely teach ambitious zealots that silence is permission."
 war_culture_and_religion_events.2.a:0 "Mediate the dispute."
 war_culture_and_religion_events.2.b:0 "Let the faithful argue."

 war_culture_and_religion_events.3.t:0 "The Strategist's Offering"
 war_culture_and_religion_events.3.d:0 "The followers of Myrmidia have begun a review of bronze helms and battle prayers. In sunlit drill courts, spears and owl standards mark the line between private belief and public duty.\n\nThe court can pay for the rites and claim their fervor. It can appoint wardens to keep order around the priests. It can also hold back, trusting habit and fear to do the work of policy.\n\nFaith rarely stays private once banners begin to move. The question is who carries them."
 war_culture_and_religion_events.3.a:0 "Fund the sacred rite."
 war_culture_and_religion_events.3.b:0 "Appoint temple wardens."
 war_culture_and_religion_events.3.c:0 "Keep a measured hand."

 war_culture_and_religion_events.4.t:0 "The Price of Victory"
 war_culture_and_religion_events.4.d:0 "Whispers spread through sunlit drill courts as followers of Myrmidia argue over whether strategy or honor should guide the next campaign. The words are soft, but they move through the court with the confidence of knives.\n\nAn inquiry could find who profits from the quarrel. Public penance would make an example without naming too many names.\n\nThe priests claim they can settle it alone. That may even be true."
 war_culture_and_religion_events.4.a:0 "Investigate the whispers."
 war_culture_and_religion_events.4.b:0 "Demand public penance."
 war_culture_and_religion_events.4.c:0 "Leave it to the priests."

