 war_culture_and_religion_events.114.d:0 "The Gospodar boyars, stanitsa elders, and frontier captains have brought sled tolls, hearth oaths, and frontier musters into frost roads, timber halls, and shrine yards. Gospodar boyars speak in the Tzarina's language of endurance, while every ice-sealed clause protects a noble privilege.\n\nKislevite custom is survival wearing a legal coat, and survival has little patience for a court that sounds warm and distant. The choices before the court are plain enough: bind it by oath, bury it in records, strike a careful bargain, or spend nothing, and the Gospodar will remember which answer was chosen."
