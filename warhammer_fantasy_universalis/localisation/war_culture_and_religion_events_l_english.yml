 war_culture_and_religion_events.102.t:0 "Da Bosses Want It Written"
 war_culture_and_religion_events.102.d:0 "The Common Orc bosses, shamans, and scarred claimants have brought loot shares, boss marks, and who gets first swing into fighting pits, scrap camps, and noisy war councils. Common Orc bosses have decided custom counts as law if enough of them shout it at the same time.\n\nGreenskin politics does not become gentle when given paperwork; it merely finds a new surface to headbutt. The choices before the court are plain enough: bind it by oath, bury it in records, strike a careful bargain, or spend nothing, and the Common Orc will remember which answer was chosen."
