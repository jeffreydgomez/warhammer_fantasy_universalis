 war_culture_and_religion_events.127.d:0 "The Praager boyars, stanitsa elders, and frontier captains have brought sled tolls, hearth oaths, and frontier musters into frost roads, timber halls, and shrine yards. Praager survivors bring customs written over older wounds, where wall dues and daemon-watch memories are never far apart.\n\nKislevite custom is survival wearing a legal coat, and survival has little patience for a court that sounds warm and distant. The choices before the court are plain enough: honor the claim or turn it toward coin, and the Praager will remember which answer was chosen."
 war_culture_and_religion_events.127.a:0 "Honor the scar rights."
 war_culture_and_religion_events.127.b:0 "Tax the scar rights."

 war_culture_and_religion_events.128.t:0 "Sartosan Captain Shares"
 war_culture_and_religion_events.128.d:0 "The Sartosan merchant councillors, condottieri, and guild notaries have brought contracts, harbor dues, and militia companies into counting houses, fortified piazzas, and contract courts. Sartosan captains have made a pirate argument look like civic procedure, which in Sartosa may be the same thing.\n\nTilean pride counts coin, reputation, and hired steel together, so every answer becomes a contract whether the ruler likes it or not. The choices before the court are plain enough: back the local voices, strike a careful bargain, or let the matter fade, and the Sartosan will remember which answer was chosen."
 war_culture_and_religion_events.128.a:0 "Back the prize shares."
 war_culture_and_religion_events.128.b:0 "Bargain over the prize shares."
 war_culture_and_religion_events.128.c:0 "Let the prize shares fade."

 war_culture_and_religion_events.129.t:0 "Reman Forum Ledgers"
 war_culture_and_religion_events.129.d:0 "The Reman merchant councillors, condottieri, and guild notaries have brought contracts, harbor dues, and militia companies into counting houses, fortified piazzas, and contract courts. Reman patricians lean on antique glory and very current account books, invoking empire while pricing mercenaries.\n\nTilean pride counts coin, reputation, and hired steel together, so every answer becomes a contract whether the ruler likes it or not. The choices before the court are plain enough: reward service already rendered, call for service in return, turn it toward coin, or delay the answer, and the Reman will remember which answer was chosen."
