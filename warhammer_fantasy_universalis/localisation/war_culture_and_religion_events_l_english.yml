 war_culture_and_religion_events.148.t:0 "Herdstone Spoils"
 war_culture_and_religion_events.148.d:0 "The Beastmen herd chiefs, bray-shamans, and scarred challengers have brought spoils, scars, and claims of raw strength into blood-stakes, trampled clearings, and herdstone rings. Beastmen have turned a quarrel over strength into a ritual of noise, stink, and pointed weapons.\n\nAmong the herds, law is only another word for dominance that has not yet been challenged. The choices before the court are plain enough: back the local voices or strike a careful bargain, and the Beastmen will remember which answer was chosen."
