 war_culture_and_religion_events.130.b:0 "Enter it in the merchant books."

 war_culture_and_religion_events.131.t:0 "Tobaro Cliff Charters"
 war_culture_and_religion_events.131.d:0 "The Tobaran merchant councillors, condottieri, and guild notaries have brought contracts, harbor dues, and militia companies into counting houses, fortified piazzas, and contract courts. Tobaran wardens argue from cliffs and gates, where knowing who may enter is often the whole difference between survival and ruin.\n\nTilean pride counts coin, reputation, and hired steel together, so every answer becomes a contract whether the ruler likes it or not. The choices before the court are plain enough: honor the claim, turn it toward coin, or refuse the request, and the Tobaran will remember which answer was chosen."
