 war_culture_and_religion_events.32.d:0 "A dispute has opened among the shouty shamans of Gork and Mork, centered on which god hit first and which hit sneakiest. The argument is still wrapped in prayers, but its edges are already sharp enough to cut policy.\n\nMediation would cost money and patience. Leaving the faithful to argue may preserve dignity, or merely teach ambitious zealots that silence is permission."
 war_culture_and_religion_events.32.a:0 "Mediate the dispute."
 war_culture_and_religion_events.32.b:0 "Let the faithful argue."

