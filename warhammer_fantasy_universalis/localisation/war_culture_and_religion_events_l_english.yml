 war_culture_and_religion_events.211.t:0 "Mountain Ogre Maw-Dues"
 war_culture_and_religion_events.211.d:0 "The Mountain Ogre tyrants, gut-speakers, and camp butchers have brought meal shares, protection money, and Maw-blessed obligations into meat-smoked camps, tribute pits, and road feasts. Mountain Ogre tyrants describe tribute as a meal everyone should be honored to provide.\n\nOgre custom is blunt, hungry, and transactional; a delayed answer is just another thing to chew. The choices before the court are plain enough: honor the claim or turn it toward coin, and the Mountain Ogre will remember which answer was chosen."
 war_culture_and_religion_events.211.a:0 "Honor the Maw dues."
