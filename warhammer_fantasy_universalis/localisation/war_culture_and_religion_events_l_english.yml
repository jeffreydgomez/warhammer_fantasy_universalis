war_unite_all_elvenkind_title:0 "Unite All Elvenkind"
war_unite_all_elvenkind_desc:0 "For millennia, the Elves have stood divided—Asur, Druchii, Asrai, and others—each walking their own path through the long night of the world. Yet now, by blade and bond, we have achieved what once seemed a dream: the reunification of our shattered kin. With the sacred groves of Athel Loren, the spires of Lothern, and the dark towers of Naggarond under our banner, and with nearly all of elvenkind either bound to us in loyalty or brought low in conquest, a new age dawns. Let the world tremble before the united might of the Elves."

united_all_elvenkind:0 "United All Elvenkind"
desc_united_all_elvenkind:0 "Through conquest, diplomacy, and unyielding will, we have done what no Elf-lord has achieved since the ancient days of the Old Ones: we have brought all Elven nations together under one rule. Our unity rekindles lost glories, strengthens our ancient magics, and inspires awe and dread across the world."


 asur_events.1001.t:0 "The Sea Fortresses of the Asur"
 asur_events.1001.d:0 "Far from Ulthuan's ring of mountains and shining courts, the Asur colonies stand as lanterns on dangerous seas. Citadel of Dusk, Fortress of Dawn, the Tower of the Sun, the Tower of the Stars, Elithis, and lesser harbors beyond counting guard the routes by which treasure, news, armies, and omens move between continents.\n\nThese are not mere trading posts. Their captains maintain waystones, chart monsoon winds, watch the rites of Cadai, and keep towers bright against pirates, monsters, storms, and the slow weariness of distance. Every colony is a fortress, shrine, counting house, and listening post joined into one.\n\nAround them lie lands too rich and dangerous to ignore. Ind offers spices, temples, Tigerfolk courts, and jungles that remember blood. Khuresh coils with serpent cults and hidden gods. Cathay measures every embassy with imperial patience, while Nippon's broken islands send war, trade, and rumor across the sea.\n\nUlthuan should be the heart to which all these far places answer, but Ulthuan is divided. The Phoenix King's call, the Everqueen's warning, and the pride of ancient houses have turned the homeland inward. A distant prince or sea lord can no longer assume that help will arrive before the walls are tested.\n\nDistance changes even the long-lived. The colonies must decide whether they remain sentinels of a fading center, or become the hands by which the Asur grasp the wider world again. Across the seas, elven destiny has not ended. It has merely moved beyond sight of home."
 asur_events.1001.a:0 "Across the seas, our watch endures."

 asur_events.8.t:0 "Pearl Lamps and Harbor Ledgers"
 asur_events.8.d:0 "The pearl lamps of the harbor burn through another long night while clerks compare cargo lists from three seas. Ivory, spices, charts, and sealed letters all pass beneath their light.\n\nA strict census would remind every sea lord that distant service remains service. Trusting their reports would preserve dignity and speed. Quiet ledgers, of course, have their own uses."
 asur_events.8.a:0 "Count every warehouse."
 asur_events.8.b:0 "Trust the sea lords."
 asur_events.8.c:0 "Keep the ledgers quiet."

 asur_events.9.t:0 "The Distant Waystone"
 asur_events.9.d:0 "The colony's waystone has begun to hum at the wrong hour, drawing gulls, dreams, and anxious mages toward its base. Its light is steady, but old enchantments can fail politely before they fail completely.\n\nRepair requires coin, patience, and ritual purity. Rotating mages from the towers would be less visible and more demanding. Either choice reminds the colony that even stone grows lonely so far from Ulthuan."
 asur_events.9.a:0 "Repair the waystone."
 asur_events.9.b:0 "Rotate the mage-watch."

 asur_events.10.t:0 "Monsoon Charts"
 asur_events.10.d:0 "New monsoon charts have arrived, showing reefs, islands, and seasonal winds that human pilots still treat as rumor. The captains immediately begin arguing over who may copy them.\n\nFunding the archive would strengthen every sanctioned voyage. Sharing captains between ships would spread skill faster, though not without bruised pride. Selling copies to trusted factors would pay well and haunt us later.\n\nThe sea rewards knowledge and punishes vanity. Unfortunately, Asur captains possess both in abundance."
 asur_events.10.a:0 "Fund the chart archive."
 asur_events.10.b:0 "Share captains between ships."
 asur_events.10.c:0 "Sell select copies."
 asur_events.10.dd:0 "Seal the archive."

 asur_events.11.t:0 "Corsairs Beyond the Reef"
 asur_events.11.d:0 "Dark Elf corsairs have been sighted beyond the reef, their sails low and cruel against the sunset. The harbor bells rang once before the lookouts were ordered silent.\n\nThe colony cannot look afraid. Hunting the raiders would prove resolve, while repairing the harbor would protect the trade they came to threaten. Pulling settlers back from exposed piers may save lives, but every retreat teaches the corsairs where fear lives."
 asur_events.11.a:0 "Hunt the raiders."
 asur_events.11.b:0 "Repair the harbor."
 asur_events.11.c:0 "Pull settlers back."

 asur_events.12.t:0 "Cadai Rites at the Reef"
 asur_events.12.d:0 "A reef shrine has begun shining at low tide, revealing old Cadai marks cut into coral. Sailors leave pearls there before voyages, and scholars argue over whether the marks are authentic, altered, or simply too useful to question.\n\nSponsoring the rites would bind the harbor through shared reverence. Sending scholars may uncover something rarer than piety. Sealing the reef would avoid trouble and waste an omen."
 asur_events.12.a:0 "Sponsor the rites."
 asur_events.12.b:0 "Send the scholars."
 asur_events.12.c:0 "Seal the reef."

 asur_events.13.t:0 "Letters from a Divided Ulthuan"
 asur_events.13.d:0 "Sealed letters have arrived from Ulthuan after a journey long enough to make their orders stale. Each bears proper authority, beautiful script, and assumptions that no longer survive contact with this harbor.\n\nObedience would reassure traditionalists and distant patrons. Acting locally would solve the problem in front of us and offend the problem behind us. Distance has become a political fact, not merely a number on a chart.\n\nThe wax seals look very small beside the sea. The captains notice that before the courtiers do."
 asur_events.13.a:0 "Obey the letters."
 asur_events.13.b:0 "Act on local judgment."

 asur_events.14.t:0 "Envoys of the Old Ones"
 asur_events.14.d:0 "Lizardmen envoys wait outside the colony gate, cold-eyed and ritual-still beneath painted crests. They bring stone tokens, broken plaques, and a demand that sounds older than diplomacy.\n\nHonoring them may keep the jungle calm. Mapping the plaques could teach us more than the envoys intend. Seizing the relics would be profitable, direct, and almost certainly remembered."
 asur_events.14.a:0 "Honor the envoys."
 asur_events.14.b:0 "Map the plaques."
 asur_events.14.c:0 "Seize the relics."

 asur_events.15.t:0 "The Beacon Batteries"
 asur_events.15.d:0 "The sea-lane beacons need new batteries, crews, and polished mirrors before the storm season closes in. Without them, night ships will trust memory, moonlight, and luck.\n\nCoin can raise the batteries, while drills can make the fleet answer faster. Local pilots offer another solution, bringing weather knowledge that no tower in Ulthuan ever taught. Postponement would spare the budget and insult the sea.\n\nThe sea is very good at collecting insults. It sends the bill in wreckage."
 asur_events.15.a:0 "Build the batteries."
 asur_events.15.b:0 "Drill the fleet."
 asur_events.15.c:0 "Hire local pilots."
 asur_events.15.dd:0 "Postpone the work."

 asur_events.16.t:0 "Pearl Divers Lost"
 asur_events.16.d:0 "Pearl divers have vanished beneath a reef that glows faintly after dusk. Their families leave lamps on the shore, and the captains calculate how long grief will interrupt the season.\n\nA rescue would be costly and uncertain. Accepting the losses would be cold, efficient, and bitterly familiar to any colony built on dangerous water. The reef keeps its silence either way."
 asur_events.16.a:0 "Launch a rescue."
 asur_events.16.b:0 "Accept the losses."

 asur_events.17.t:0 "Sister Fortresses"
 asur_events.17.d:0 "A rival Asur fortress has accused our captains of hoarding charts and misreporting signal fires. Their letter is flawless in courtesy and poisonous in implication.\n\nA formal duel would give the dispute shape and spectacle. Hostage exchange would be uglier but useful. Asking Ulthuan for arbitration may calm both sides, assuming anyone there remembers how far away we are."
 asur_events.17.a:0 "Settle it by formal duel."
 asur_events.17.b:0 "Exchange noble hostages."
 asur_events.17.c:0 "Ask for arbitration."

