estate_necrotect_construction:0 "Necrotect Construction Grants"
estate_necrotect_construction_desc:0 "The Necrotects want unlimited access to national funds and resources. In return, they will craft us great works of wonder and terror like the world has never seen before. Such unparalleled investment is sure to be a drain on our resources and legitimacy, but it may be worth it."

## Starting Events
tomb_king.200.title:0 "Rise of the Tomb Kings"  
tomb_king.200.desc:0 "O mighty $MONARCH$, $MONARCHTITLE$ of the great $COUNTRY$, true ruler of Nehekhara, death has not ended your reign, nor has time withered your empire. You were once the greatest sovereign of Nehekhara, the land of golden cities and endless legions. Beneath your gaze, the Great Mortuary Cult wove its spells, promising an eternity of splendor. But treachery, vile and insidious, stole from you the paradise of undeath. The cursed Usurper, Nagash, turned the blessings of the gods into a cruel mockery, twisting your people into lifeless husks, bound to an existence neither living nor dead. \n\nYet, even through the veil of death, your will endures. The sand-shrouded ruins of your once-mighty cities stir with the echoes of conquest, and your legions lie entombed, waiting for the call to war. The priests, in their ceaseless toil, have rekindled the ancient rites, and the winds of undeath now surge through your sacred halls. Your servants rise once more, obedient and unyielding, ready to march beneath your eternal banner. The tombs have opened, and the world shall tremble at the return of the undying. \n\nNow is the hour of reckoning, great ruler. The gods have abandoned this world, and none shall deny you what is rightfully yours. The throne of Nehekhara must be reclaimed, the lands of the living crushed beneath your chariots, and the old glories restored. You shall suffer no rivals, no pretenders, no weaklings who dare profane your dominion. The sun shall rise once more upon an empire of the dead, and all shall bow before the will of the Tomb Kings!"  

tomb_king.200.a:0 "Rise, my legions!"  
