l_english:

 albion_events.1000.t:0 "Strangers on Albion's Shore"
 albion_events.1000.d:0 "A fisher brings a foreign iron coin to the clan gathering at [Root.Capital.GetName]. He found it beside the remains of a beach fire, where strangers had unloaded tools and measured the depth of the anchorage.\n\nThe island's clans have long relied on the mist and their Truthsayers to keep strangers away from the Ogham Stones. Fimir raids and reports of corrupted circles already strain the warriors who guard the interior.\n\nA Truthsayer warns that more ships will follow, drawn by the island's standing stones and buried relics. The chiefs order cattle and grain brought into the hillforts, but argue over whether the strangers should become customers or enemies. Their warriors wait outside the hall for a common command."
 albion_events.1000.a:0 "Gather supplies and summon the clan leaders."

 albion_events.1.t:0 "A Cracked Ogham Stone"
 albion_events.1.d:0 "A shepherd hears a low humming beneath the standing stones above his grazing ground. By morning, a fresh crack has opened in one stone and the sheep refuse to pass it.\n\nA Truthsayer clears the turf from its base and finds carvings buried for generations. She sends for assistants, but the local chief has already begun charging visitors to enter the circle."
 albion_events.1.a:0 "Open the circle to scholars and study the carvings."
 albion_events.1.b:0 "Have the Truthsayer teach the warriors its warning signs."
 albion_events.1.c:0 "Let the chief collect fees and control admission."

 albion_events.2.t:0 "The Empty Cattle Fold"
 albion_events.2.d:0 "A herdsman arrives at the hillfort with a splintered spear and no cattle. He describes one-eyed raiders emerging from the fog and dragging his brother toward the bog.\n\nThe next search party finds the brother's cloak beside a deep track through the reeds. The chief's hunters recognize Fimir spoor, and the surviving families refuse to return to their isolated farms."
 albion_events.2.a:0 "Send warriors into the bog, despite the losses."
 albion_events.2.b:0 "Pay to move the families and replace their cattle."

 albion_events.3.t:0 "Three Ships at the Landing"
 albion_events.3.d:0 "Three trading ships anchor beside a clan fishing beach, and their captain comes ashore carrying an iron axe as a gift. She asks to buy fresh water, timber, and hides before sailing back to the Old World.\n\nThe fishers welcome her prices, but the clan chief discovers sailors cutting trees without asking. He brings the axe and a list of demands to [Root.Capital.GetName], leaving the traders under guard at the beach."
 albion_events.3.a:0 "Let the clan settle the visit itself."
 albion_events.3.b:0 "Collect a landing fee and register the cargo."
 albion_events.3.c:0 "Expel the captain and uphold the chief's authority."
 albion_events.3.dd:0 "Reserve all foreign trade for the chief's agents."

 albion_events.4.t:0 "The Stranger at the Moot"
 albion_events.4.d:0 "A hooded traveler offers a feuding chief a charm that will make the neighboring clan's cattle sicken. A young Truthsayer recognizes the marks on it and names him a Dark Emissary.\n\nThe retainer confesses after a sick cow dies in front of the assembled families. He says the stranger promised that only the neighboring herd would suffer, then disappeared before payment could be demanded.\n\nThe chief denies accepting the charm, but one of his retainers has already used it at a boundary stone. Cattle are dying on both sides of the dispute, and armed relatives have surrounded the moot hall."
 albion_events.4.a:0 "Organize a search and destroy the corrupted charms."
 albion_events.4.b:0 "Pay compensation and negotiate the stranger's removal."
 albion_events.4.c:0 "Admit the emissary and muster his willing followers."

 albion_events.5.t:0 "A Giant Blocks the Cattle Road"
 albion_events.5.d:0 "A giant sits across the track to the seasonal cattle market, holding a drover's wagon in one hand. He demands enough beef and ale to fill it before he lets another herd pass.\n\nThe drover has sent his youngest son to the hillfort for help. Several chiefs offer spearmen, but the giant has begun piling boulders beside the road and calling for his supper."
 albion_events.5.a:0 "Promise tribute in return for the giant's service."
 albion_events.5.b:0 "Buy him a feast and have our warriors observe him."
 albion_events.5.c:0 "Clear the road by force, whatever the losses."

 albion_events.6.t:0 "A Charter for Neuland"
 albion_events.6.d:0 "The settlers who call their village Neuland send a carpenter to [Root.Capital.GetName] with a petition. Their new sawmill is working, but a neighboring chief claims a payment every time its wheel turns.\n\nThe carpenter produces the agreement his people made when they landed, which mentions timber but says nothing about water. The chief arrives with witnesses to his own version, and both ask for a ruling they can show at the mill."
 albion_events.6.a:0 "Grant open trading rights in return for charter fees."
 albion_events.6.b:0 "Record the boundary and set clear milling obligations."

 albion_events.7.t:0 "The Fen Beast at the Causeway"
 albion_events.7.d:0 "A Truthsayer loses control of a Fen Beast while repairing a flooded causeway. The creature tears away the stakes that held it and drags two workers into the reeds.\n\nIts maker breaks her staff trying to stop it, then sends her apprentice for help. The only dry route to three settlements now runs past the beast's pool, and a crowd of stranded travelers is gathering at the hillfort."
 albion_events.7.a:0 "Send our finest warriors to destroy it."
 albion_events.7.b:0 "Have the warriors drive it away from the crossing."
 albion_events.7.c:0 "Pay for a new causeway and oversee the work."
 albion_events.7.dd:0 "Seal off the pool and record its danger for travelers."

 albion_events.8.t:0 "The Chiefs' Defense Moot"
 albion_events.8.d:0 "A coastal chief lays a foreign soldier's helmet on the council table and describes a landing near his village. Two rivals interrupt to accuse him of inviting the strangers to settle an old feud.\n\nA Truthsayer calls in the fishers who witnessed the landing, and their account forces the chiefs to listen. By nightfall, they have agreed that the island needs a common response, but no chief will commit without terms sealed before witnesses."
 albion_events.8.a:0 "Settle the feuds and open the clan markets."
 albion_events.8.b:0 "Agree on a common levy and joint war plans."
 albion_events.8.c:0 "Negotiate shared tolls and protection for clan traders."

 albion_events.9.t:0 "The Hunter's Metal Fragment"
 albion_events.9.d:0 "A hunter brings the Truthsayers a piece of worked metal that stays warm in the rain. He found it beneath a collapsed doorway in a valley where his dogs would not follow him. He refuses to touch it again after it warms the Truthsayer's rain-soaked sleeve.\n\nThe oldest Truthsayer recognizes its markings from warnings about the Forge of the Old Ones. The hunter offers to lead an expedition back, but admits that two companions vanished while searching the ruins."
 albion_events.9.a:0 "Send an expedition to study the ruins, despite the danger."
 albion_events.9.b:0 "Record the location and post warriors to bar entry."

 albion_events.10.t:0 "Grain Rot in the Storehouse"
 albion_events.10.d:0 "The keeper of a clan storehouse cuts open the first sack of winter grain and finds it black with rot. Other stores report the same damage after weeks of rain seeped through their roofs.\n\nFamilies have begun slaughtering breeding cattle to make up the shortfall. At [Root.Capital.GetName], the elders bring samples of the ruined grain and demand a decision before the remaining seed is eaten."
 albion_events.10.a:0 "Buy replacement grain and organize its distribution."
 albion_events.10.b:0 "Ration the stores and release hungry men from service."
 albion_events.10.c:0 "Demand a public fast, despite the unrest it will cause."
