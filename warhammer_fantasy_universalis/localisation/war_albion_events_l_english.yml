l_english:

 albion_events.1000.t:0 "The Mist Remembers"
 albion_events.1000.d:0 "Albion has endured in rain, fog, and old stone while the empires of the Old World named it savage and forgot to look again. Truthsayers keep their circles, Fimir haunt the fens, and every hill seems to remember a warning older than mankind.\n\nNow foreign sails and greedy maps press against the shore. Traders want harbors, missionaries want souls, conquerors want claims, and darker voices want the Ogham Stones for purposes the druids refuse to name.\n\nThe island can no longer hide by mist alone. If Albion is to survive discovery, its clans, stones, marsh paths, and forbidden powers must be made into a realm that outsiders cannot simply take."
 albion_events.1000.a:0 "The stones will answer us first."

 albion_events.1.t:0 "The Ogham Stones Hum"
 albion_events.1.d:0 "The Ogham Stones have begun to hum through the rain. Truthsayers disagree over whether the sound is warning, invitation, or anger from powers older than the island clans.\n\nWarriors gather at the circles with wet cloaks and sharper questions. Outsiders would pay to witness the rite, but the druids say some secrets curdle when sold."
 albion_events.1.a:0 "Hear the Truthsayers."
 albion_events.1.b:0 "Set warriors around the stones."
 albion_events.1.c:0 "Guide paying visitors."

 albion_events.2.t:0 "Fimir in the Bog"
 albion_events.2.d:0 "A Fimir band has moved through the bogs under cover of fog. Their raids are small, but the pattern is deliberate, cutting paths between cattle grounds and lonely hillforts.\n\nThe clans want vengeance before fear spreads. The Truthsayers warn that the fen remembers every footstep, especially those made in anger."
 albion_events.2.a:0 "Hunt them through the reeds."
 albion_events.2.b:0 "Pay the blood-price quietly."

 albion_events.3.t:0 "Ships Through the Mist"
 albion_events.3.d:0 "Three foreign ships have found a gap in the coastal fog and anchored near a clan beach. Their captains claim to seek water, timber, and honest trade, which is often how theft introduces itself.\n\nSome clans want the strangers driven back into the sea. Others see tools, coin, and news from lands that have already learned how to survive discovery.\n\nThe tide is falling. By morning the beach will be full of footprints, bargains, or bodies."
 albion_events.3.a:0 "Trade under spear-point."
 albion_events.3.b:0 "Make them pay landing dues."
 albion_events.3.c:0 "Drive them back to sea."
 albion_events.3.dd:0 "Buy their charts and gossip."

 albion_events.4.t:0 "A Dark Emissary Smiles"
 albion_events.4.d:0 "A silver-tongued stranger has been seen near a bitter clan moot, speaking of wronged ancestors and stones that could be made to answer more quickly. The druids name him a Dark Emissary before the chieftains finish denying they listened.\n\nHis words have already done damage. No army has landed, yet the circle feels occupied."
 albion_events.4.a:0 "Expose his listeners."
 albion_events.4.b:0 "Feed him false grievances."
 albion_events.4.c:0 "Burn the corrupted shrine."

 albion_events.5.t:0 "Tribute for the Giant"
 albion_events.5.d:0 "A giant has come down from the high wet hills and seated himself beside the cattle road. He has not yet smashed anything important, but he has made clear that patience is making him hungry.\n\nSome call him a sacred remnant of elder days. Others note that sacred remnants still crush barns when annoyed."
 albion_events.5.a:0 "Honor him as an old guardian."
 albion_events.5.b:0 "Send cattle and singers."
 albion_events.5.c:0 "Let the clans handle him."

 albion_events.6.t:0 "Rights for Neuland"
 albion_events.6.d:0 "Settlers from across the sea have asked for a charter in the wet lands they call Neuland. Their palisades are crude, their fields stubborn, and their fear of the interior entirely sensible.\n\nA charter could turn them into a useful shoreward face. Refusing would satisfy clans who still think every foreign hut is the first stone of an invasion."
 albion_events.6.a:0 "Grant a narrow charter."
 albion_events.6.b:0 "Keep them under clan law."

 albion_events.7.t:0 "A Fen Beast Breaks Its Chain"
 albion_events.7.d:0 "A Fen Beast raised for a druidic rite has broken from its bindings and dragged three watchfires into the mire. The creature is not evil in any human sense, which is poor comfort to those in its path.\n\nThe Truthsayers insist it can be soothed. The warriors insist that soothed monsters still leave footprints through homes.\n\nRain has swallowed the trail once already. By dusk, only guesses may remain."
 albion_events.7.a:0 "Bind it with spear and chant."
 albion_events.7.b:0 "Lure it deeper into the fen."
 albion_events.7.c:0 "Rebuild after it tires."
 albion_events.7.dd:0 "Let the druids bargain alone."

 albion_events.8.t:0 "Moot Under Black Rain"
 albion_events.8.d:0 "The clans have gathered under black rain, each chief standing beside a banner soaked into darker colors. Old feuds are present, but so are old fears, and the latest foreign landings have made even proud rivals listen.\n\nA ruler who settles this moot could turn scattered hillforts into something harder to break. The price is promises made before witnesses who remember very well."
 albion_events.8.a:0 "Settle the moot with law."
 albion_events.8.b:0 "Bind the clans to muster."
 albion_events.8.c:0 "Accept a smaller bargain."

 albion_events.9.t:0 "Rumors of the Forge"
 albion_events.9.d:0 "A hunter claims to have seen a valley where the rain falls upward and old metal sings beneath moss. The Truthsayers know the tale as a warning, while younger chiefs hear only the word relic.\n\nFinding the place could bring knowledge or disaster. Sealing the path would be easier, if every guide could be trusted to forget it."
 albion_events.9.a:0 "Sponsor a careful search."
 albion_events.9.b:0 "Seal the valley paths."

 albion_events.10.t:0 "The Mist Harvest Fails"
 albion_events.10.d:0 "The harvest has rotted in fields where fog refused to lift. Grain stores smell sour, cattle are thin, and clan elders have begun speaking in the careful tone used before bad news becomes accusation.\n\nThe island has survived worse, but survival is not a policy. Food must be found, taken, or denied to someone."
 albion_events.10.a:0 "Buy grain before panic rises."
 albion_events.10.b:0 "Ration the clan stores."
 albion_events.10.c:0 "Let each clan fend alone."
