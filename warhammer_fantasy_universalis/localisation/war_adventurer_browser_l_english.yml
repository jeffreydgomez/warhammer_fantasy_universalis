 war_adventurer_browser_gotrek_felix_caption:0 "Gotrek and Felix"
 war_adventurer_browser_gotrek_felix_tt:0 "§YGotrek and Felix§!\n\nYearly Army Tradition: §G+0.5§!; Yearly Prestige: §G+1§!; Local Unrest: §R+4§!\n\nGotrek Gurnisson is a Slayer seeking a death worthy of his oath. Felix Jaeger has sworn to accompany him and record that doom, fighting beside his companion through the dangers their travels uncover.\n\n[Root.GetWarAdventurerBrowserLocation7]"
