 war_adventurer_browser_gelt_caption:0 "Balthasar Gelt"
 war_adventurer_browser_gelt_tt:0 "§YBalthasar Gelt§!\n\nYearly Innovativeness: §G+0.12§!; Yearly Inflation Reduction: §R-0.1§!\n\nGelt is a wizard of the Gold Order, renowned for his mastery of metal and his experiments with black powder. His reputation attracts craftsmen and scholars, though stories of transmuted coins have made some merchants wary.\n\n[Root.GetWarAdventurerBrowserLocation2]"
