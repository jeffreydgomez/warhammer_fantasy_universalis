 war_adventurer_browser_harald_caption:0 "Harald Hammerstorm"
 war_adventurer_browser_harald_tt:0 "§YHarald Hammerstorm§!\n\nYearly Army Tradition: §G+0.5§!; Local Unrest: §R+2§!\n\nHis reputation rests on savage feats of arms and his particular hatred of the undead. Tales of his escape from the tombs of Vorshgar claim that even the restless dead learned to fear him.\n\n[Root.GetWarAdventurerBrowserLocation9]"
