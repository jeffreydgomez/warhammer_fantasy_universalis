 war_adventurer_browser_teclis_caption:0 "Teclis"
 war_adventurer_browser_teclis_tt:0 "§YTeclis§!\n\nYearly Innovativeness: §G+0.12§!; Local Unrest: §R+2§!\n\nTeclis helped Magnus the Pious resist Chaos and establish the Imperial Colleges of Magic. His frail appearance conceals a sorcerer powerful enough to have defeated Malekith at Finuval Plain.\n\n[Root.GetWarAdventurerBrowserLocation16]"
