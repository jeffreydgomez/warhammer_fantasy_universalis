 war_adventurer_browser_repanse_caption:0 "Repanse de Lyonesse"
 war_adventurer_browser_repanse_tt:0 "§YRepanse de Lyonesse§!\n\nYearly Army Tradition: §G+0.5§!; Local Unrest: §R+2§!\n\nOnce a shepherdess, Repanse answered the Lady's call, rallied defeated knights, and broke the siege of Couronne. Preserved by the Lady's grace, she now travels as a champion of her faith rather than ruling from a ducal court.\n\n[Root.GetWarAdventurerBrowserLocation14]"
