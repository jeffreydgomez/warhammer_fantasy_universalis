 war_adventurer_browser_grombrindal_caption:0 "Grombrindal"
 war_adventurer_browser_grombrindal_tt:0 "§YGrombrindal§!\n\nYearly Army Tradition: §G+0.5§!; Local Unrest: §R+2§!\n\nThe White Dwarf is a figure of ancestral legend, said to appear when his kin face their darkest hours. Stories tell of hopeless battles turned by his arrival and of a rescuer who vanishes before gratitude can catch him.\n\n[Root.GetWarAdventurerBrowserLocation8]"
 war_adventurer_browser_grombrindal_located:0 "§Y[war_adventurer_location_grombrindal.GetName]§!, §Y[war_adventurer_location_grombrindal.Owner.GetName]§!, §Y[war_adventurer_location_grombrindal.GetSuperRegionName]§!"
