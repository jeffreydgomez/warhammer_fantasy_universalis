 war_adventurer_browser_bugman_caption:0 "Josef Bugman"
 war_adventurer_browser_bugman_tt:0 "§YJosef Bugman§!\n\nLocal Trade Value: §G+100%§!; Local Unrest: §G-2§!\n\nBugman was a celebrated master brewer before Goblins destroyed his brewery. He and its survivors now wander in search of vengeance and missing kin, carrying what remains of his famous ale.\n\n[Root.GetWarAdventurerBrowserLocation10]"
