 war_adventurer_browser_bardin_caption:0 "Bardin Goreksson"
 war_adventurer_browser_bardin_tt:0 "§YBardin Goreksson§!\n\nYearly Army Tradition: §G+0.5§!; Local Unrest: §R+2§!\n\nBardin served as an Ironbreaker at Karak Norn before taking up a ranger's wandering life. His great ambition is to find the lost hold of Karak Zorn, and few rumors of ancient Dwarf stonework escape his attention.\n\n[Root.GetWarAdventurerBrowserLocation3]"
