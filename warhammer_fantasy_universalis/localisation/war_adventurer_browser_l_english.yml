 war_adventurer_browser_tyrion_caption:0 "Tyrion"
 war_adventurer_browser_tyrion_tt:0 "§YTyrion§!\n\nYearly Army Tradition: §G+0.5§!; Local Unrest: §R+2§!\n\nA descendant of Aenarion, Tyrion is celebrated as one of Ulthuan's greatest warriors. His defeat of Urian Poisonblade at Finuval Plain is recounted wherever the struggle between the High Elves and Dark Elves is remembered.\n\n[Root.GetWarAdventurerBrowserLocation18]"
