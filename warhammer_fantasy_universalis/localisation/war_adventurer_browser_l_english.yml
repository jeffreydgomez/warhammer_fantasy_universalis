 war_adventurer_browser_malakai_caption:0 "Malakai Makaisson"
 war_adventurer_browser_malakai_tt:0 "§YMalakai Makaisson§!\n\nLocal Construction Cost: §G-75%§!; Local Construction Time: §G-75%§!; Local Great Project Upgrade Cost: §G-50%§!; Local Great Project Upgrade Time: §G-50%§!; Local Building Slots: §G+1§!; Local Manufactory Slots: §G+1§!\n\nHe took the Slayer oath after the disasters of his Unsinkable ironclad and Undestructible airship. Disgrace has done little to diminish his inventive ambition or his appetite for another experiment.\n\n[Root.GetWarAdventurerBrowserLocation11]"
 war_adventurer_browser_malakai_located:0 "§Y[war_adventurer_location_malakai.GetName]§!, §Y[war_adventurer_location_malakai.Owner.GetName]§!, §Y[war_adventurer_location_malakai.GetSuperRegionName]§!"
