 war_adventurer_browser_elspeth_caption:0 "Elspeth von Draken"
 war_adventurer_browser_elspeth_tt:0 "§YElspeth von Draken§!\n\nYearly Innovativeness: §G+0.12§!; Local Unrest: §R+2§!\n\nShe is associated with Nuln and the study of death magic. She travels in pursuit of arcane knowledge and guards her own secrets as fiercely as she seeks those of others.\n\n[Root.GetWarAdventurerBrowserLocation5]"
