 war_adventurer_browser_sienna_caption:0 "Sienna Fuegonasus"
 war_adventurer_browser_sienna_tt:0 "§YSienna Fuegonasus§!\n\nYearly Innovativeness: §G+0.12§!; Monthly Local Devastation: §R+0.1§!\n\nShe studied under Thyrus Gormann before abandoning the restrictions of the Bright College. Her command of Aqshy is formidable, as is the fascination with flame that so often tests her restraint.\n\n[Root.GetWarAdventurerBrowserLocation15]"
