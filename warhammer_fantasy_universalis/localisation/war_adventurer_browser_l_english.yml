 war_adventurer_browser_gor_rok_caption:0 "Gor-Rok"
 war_adventurer_browser_gor_rok_tt:0 "§YGor-Rok§!\n\nYearly Army Tradition: §G+0.5§!; Local Unrest: §R+2§!\n\nGor-Rok is an ancient warrior renowned for standing his ground against overwhelming attacks. His campaigns have made him a formidable guardian of the Lizardmen's cities and sacred relics, though his present purpose remains unexplained.\n\n[Root.GetWarAdventurerBrowserLocation6]"
