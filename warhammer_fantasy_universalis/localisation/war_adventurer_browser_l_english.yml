 war_adventurer_browser_thanquol_caption:0 "Thanquol and Boneripper"
 war_adventurer_browser_thanquol_tt:0 "§YThanquol and Boneripper§!\n\nSpy Network Construction: §G+30%§!; Foreign Spy Detection: §R-50%§!; Yearly Innovativeness: §G+0.12§!; Local Unrest: §R+6§!\n\nThanquol is a Grey Seer whose sorcery, ambition, and appetite for warpstone are matched by his talent for blaming others when his schemes fail. Boneripper is the name he gives his monstrous bodyguard, whose strength supplies the persuasion his boasts cannot.\n\n[Root.GetWarAdventurerBrowserLocation17]"
