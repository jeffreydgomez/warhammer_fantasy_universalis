 war_adventurer_browser_nakai_caption:0 "Nakai the Wanderer"
 war_adventurer_browser_nakai_tt:0 "§YNakai the Wanderer§!\n\nYearly Army Tradition: §G+0.5§!; Local Unrest: §R+2§!\n\nHe is remembered for holding Itza's Bridge of Stars against daemons during the Great Catastrophe. He appears where danger threatens the remnants of the Old Ones' works, then resumes his wandering without explanation.\n\n[Root.GetWarAdventurerBrowserLocation13]"
