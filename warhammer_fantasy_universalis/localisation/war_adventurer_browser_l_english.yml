 war_adventurer_browser_wulfhart_caption:0 "Markus Wulfhart"
 war_adventurer_browser_wulfhart_tt:0 "§YMarkus Wulfhart§!\n\nYearly Army Tradition: §G+0.5§!; Local Unrest: §R+2§!\n\nThe Empire's Huntsmarshal earned his reputation pursuing monsters, including the Drakwald Cyclops that destroyed his home. An expert archer and tracker, he leads scouts accustomed to following quarry that ordinary soldiers would rather avoid.\n\n[Root.GetWarAdventurerBrowserLocation12]"
