 war_adventurer_browser_snikch_caption:0 "Deathmaster Snikch"
 war_adventurer_browser_snikch_tt:0 "§YDeathmaster Snikch§!\n\nSpy Network Construction: §G+30%§!; Foreign Spy Detection: §R-50%§!\n\nSnikch is Clan Eshin's most feared assassin, notorious for reaching victims behind locked doors and guarded walls. We have a warning of his presence, but neither his hiding place nor his intended victim is known.\n\n[Root.GetWarAdventurerBrowserLocation4]"
