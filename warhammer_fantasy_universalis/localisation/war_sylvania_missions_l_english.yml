l_english:
# Sylvania uses the Empire objectives and rewards with its own courtly, predatory voice.
 sylvania_make_guilds_happy_title:0 "Charters of the Living"
 sylvania_make_guilds_happy_desc:0 "The merchants fear our castles, but their wagons still need safe roads and enforceable contracts. We must honor their petitions and secure their loyalty; a charter bearing our seal should prove more profitable than any priest's warning."
 sylvania_center_of_imperial_trade_title:0 "Trade Beneath the Gallows"
 sylvania_center_of_imperial_trade_desc:0 "Our merchants need somewhere to trade openly, beyond the whispers that follow every Sylvanian cargo. We must build a commercial center of unquestioned importance, where orderly markets make our protection difficult to refuse."
 sylvania_dominate_home_trade_node_title:0 "The Empire's Golden Veins"
 sylvania_dominate_home_trade_node_desc:0 "Commerce flows through the living realm as surely as blood through its subjects. We must command our home market until every merchant learns that prosperity requires an accommodation with our court."
 sylvania_build_up_navy_title:0 "A Fleet for the Night"
 sylvania_build_up_navy_desc:0 "The Counts' writ has little force where our servants cannot carry it. We must establish a flagship and an experienced fleet, opening routes to northern lands whose rulers have yet to receive our claims."
 sylvania_foothold_across_the_sea_title:0 "A Foothold in the North"
 sylvania_foothold_across_the_sea_desc:0 "Northern shores promise fresh estates, but a passing raid establishes no lasting title. We must secure a settled holding in Norsca or Albion, directly or through a dependent ruler, and make our presence permanent."
 sylvania_convert_the_heathens_title:0 "Northern Congregations"
 sylvania_convert_the_heathens_desc:0 "Our northern possessions cannot remain mere feeding grounds governed by terror. We must spread our faith through their settled communities, binding the living to institutions that will outlast their brief lives."
 sylvania_invest_in_magic_title:0 "Endow the Black Arts"
 sylvania_invest_in_magic_desc:0 "An ancient grimoire is of little use in the hands of an indolent apprentice. We must advance our scholarship and finance sustained magical research, turning forbidden knowledge into an instrument of government."
 sylvania_invest_in_college_title:0 "An Academy of Forbidden Arts"
 sylvania_invest_in_college_desc:0 "Our necromancers hoard discoveries in private towers and take their secrets into feuds that last centuries. We must secure a great magical college or build a developed university center, giving forbidden scholarship a permanent home under our supervision."
 sylvania_cannons_of_nuln_title:0 "Guns for the Counts"
 sylvania_cannons_of_nuln_desc:0 "A dead soldier can wait forever beneath an enemy wall; our ambitions cannot. We must secure access to Nuln and a developed supply of iron, then assemble the artillery that mortal engineers can provide to their new patrons."
 sylvania_military_powerhouse_title:0 "Muster the Mortal Levies"
 sylvania_military_powerhouse_desc:0 "Our rule still depends upon living watchmen, servants, and soldiers, however little the court acknowledges their service. We must develop a populous recruiting district and its military facilities so these levies arrive equipped to obey."
 sylvania_reform_imperial_army_title:0 "Discipline Beyond Death"
 sylvania_reform_imperial_army_desc:0 "An army of obedient bodies can still be squandered by quarrelling masters. We must combine battlefield experience with professional organization, imposing a common discipline upon the living officers and deathless captains who serve us."
 sylvania_sword_of_the_empire_title:0 "Sword of the Claimant"
 sylvania_sword_of_the_empire_desc:0 "The Electors respect a pedigree most readily when it commands the strongest army in the realm. We must surpass their hosts in strength and experience, demonstrating our claim in war against enemies beyond the old religious order."
 sylvania_reconquered_lost_lands_title:0 "Recover Our Inheritance"
 sylvania_reconquered_lost_lands_desc:0 "Foreign rulers occupy lands that belong to the inheritance we intend to claim. We must restore the Imperial marches under our authority, or muster an army great enough to enforce those rights without the shelter of Imperial law."
 sylvania_old_alliances_dwarf_title:0 "Bargain with the Dwarves"
 sylvania_old_alliances_dwarf_desc:0 "The Dwarfs remember every broken oath, and they have little reason to welcome our envoys. We must overcome that distrust through a lasting alliance or dependent relationship, supported by goodwill so strong that even their ledgers acknowledge it."
 sylvania_weaken_kislev_title:0 "Bring Kislev to Terms"
 sylvania_weaken_kislev_desc:0 "The northern courts regard our envoys with open suspicion, yet their rulers cannot ignore a neighbor of growing power. We must secure their trust or establish our claims through victory and dominion, making indifference impossible."
 sylvania_subjugate_kislev_title:0 "Winter Bound by Oath"
 sylvania_subjugate_kislev_desc:0 "A frightened northern ruler may sign any parchment and forget it by spring. We must secure the key Kislevite lands through direct authority, dependent rulers, or alliances whose trust and accumulated obligations make withdrawal costly."
 sylvania_please_nobility_title:0 "Convene the Blood Court"
 sylvania_please_nobility_desc:0 "Every ancient house considers obedience a favor granted to the throne. We must hear the nobility's petitions and secure its loyalty, giving our proudest servants a place in the court before they seek one in a conspiracy."
 sylvania_happy_estates_title:0 "The Midnight Compact"
 sylvania_happy_estates_desc:0 "Merchants, sacred orders, and noble households all sustain our dominion, but each suspects the others of enjoying our favor. We must secure their common loyalty and impose a settlement in which every estate knows its place at the table."
 sylvania_get_more_crown_land_title:0 "Estates of the Eternal Count"
 sylvania_get_more_crown_land_desc:0 "Our vassals speak of ancient rights as though those rights preceded our own. We must bring more land directly beneath the crown and curb any estate whose influence threatens to turn service into partnership."
 sylvania_backed_by_some_electors_title:0 "Enter the Electoral Game"
 sylvania_backed_by_some_electors_desc:0 "Imperial law still admits our envoys, however tightly the Electors clutch their holy symbols. We must assemble a bloc of supporters, or cultivate trusted foreign courts and sufficient standing to make our claim respectable."
 sylvania_backed_by_many_electors_title:0 "Bind the Electors"
 sylvania_backed_by_many_electors_desc:0 "A few purchased courtesies do not constitute a secure succession. We must extend our influence across the electoral college, or deepen the network of trusted courts that gives substance to our pretensions."
 sylvania_very_influential_emperor_title:0 "The Midnight Coronation"
 sylvania_very_influential_emperor_desc:0 "Our claim has survived petitions, bargains, and the resistance of lesser rulers. We must now command the full authority of the Imperial throne, or establish an equally formidable order of trusted powers around our court."
 sylvania_far_reaching_emperor_title:0 "The Eternal Throne"
 sylvania_far_reaching_emperor_desc:0 "A coronation does not compel foreign courts to regard us as anything more than a temporary horror. We must demonstrate stable, legitimate rule and unmatched prestige and diplomatic standing within the Empire, making recognition a matter of practical judgment."
 sylvania_weaken_borderlands_title:0 "Claims Beyond the Mountains"
 sylvania_weaken_borderlands_desc:0 "The Border Princes rise and fall too quickly to establish convincing pedigrees. We must bring their principal courts into our confidence or prove our superiority in war, preparing claims that will outlive their dynasties."
 sylvania_subjugate_borderlands_title:0 "Princes Under Our Seal"
 sylvania_subjugate_borderlands_desc:0 "Our frontier agreements must survive the next succession, murder, and convenient change of allegiance. We must secure the key Borderland territories beneath our rule, dependent princes, or alliances bound by exceptional trust and obligation."
 sylvania_expand_into_remen_title:0 "The Southern Realms"
 sylvania_expand_into_remen_desc:0 "The heirs of ancient Remas dispute titles whose original bearers have long since returned to dust. We must establish our influence among their successors through trusted alliances, dominion, or victory, adding the southern realms to our growing inheritance."
 sylvania_ultimate_leader_of_mankind_title:0 "The Eternal Sovereign"
 sylvania_ultimate_leader_of_mankind_desc:0 "Every mortal dynasty promises lasting order and then leaves its subjects another succession to endure. We must bind the whole western continent through Imperial authority, direct rule, dependent courts, or unbreakable alliances, placing mankind beneath a sovereignty that need never die."
 sylvania_reiksguard_title:0 "Knights of the Blood"
 sylvania_reiksguard_desc:0 "Our mounted aristocrats possess centuries of pride, but pride does not breed horses or organize a cavalry force. We must secure access to Altdorf's martial resources, develop our horse supply, and muster the riders who will carry the court's authority into battle."
 sylvania_bank_of_the_empire_title:0 "Credit Beyond the Grave"
 sylvania_bank_of_the_empire_desc:0 "An Elector who refuses our friendship may still require our money. We must surpass the Empire's other treasuries and extend financial influence through its courts, turning short-lived necessities into obligations held by an undying creditor."
 sylvania_deal_with_laurelon_title:0 "The Cursed Forest"
 sylvania_deal_with_laurelon_desc:0 "The Eonir of Laurelorn acknowledge neither our appetite nor the convenience of our Imperial claims. We must obtain their cooperation through binding obligations and exceptional trust, or bring their homeland beneath our authority."
 sylvania_old_alliances_elf_title:0 "An Audience with the Elves"
 sylvania_old_alliances_elf_desc:0 "The Elves understand the patience of long lives, though few will welcome our interpretation of it. We must secure an Elven court's deep trust and goodwill through alliance or dependence, forcing ancient prejudice to contend with a durable relationship."
 sylvania_weaken_bretonnia_title:0 "Approach the Bretonnians"
 sylvania_weaken_bretonnia_desc:0 "Bretonnian lords denounce our kind, but their quarrels offer openings that righteous speeches cannot close. We must gain the confidence of their principal courts, establish our authority over them, or demonstrate the price of resistance in war."
 sylvania_subjugate_bretonnia_title:0 "The Lily Beneath the Bat"
 sylvania_subjugate_bretonnia_desc:0 "Chivalric vows are useful only when they bind the knight to the correct master. We must secure the key Bretonnian lands through direct dominion, dependent rulers, or alliances whose trust and obligations hold their lords to our interests."
 sylvania_happy_church_title:0 "Convene the Hidden Cults"
 sylvania_happy_church_desc:0 "Our sacred servants whisper in cellars while rival teachers contest the obedience of the living. We must answer their petitions and secure their loyalty, gathering these scattered congregations into a religious estate the court can direct."
 sylvania_religious_center_title:0 "Sanctuary of the Night"
 sylvania_religious_center_desc:0 "Scattered shrines cannot sustain the religious order our dominion requires. We must unite our subjects in faith and develop a wealthy temple city, giving our rites an enduring institution beneath the protection of the Counts."
 sylvania_decide_on_witch_hunters_title:0 "The Hunters at Our Gates"
 sylvania_decide_on_witch_hunters_desc:0 "The witch hunters find allies wherever our congregations remain isolated and afraid. We must strengthen the religious estate and fulfill its petitions, allowing our own agents to answer persecution with a wider network of hidden cults."
 sylvania_production_powerhouse_title:0 "Underground Workshops"
 sylvania_production_powerhouse_desc:0 "Even an eternal court requires cloth, iron, timber, and craftsmen who understand their work. We must develop a great manufacturing district, placing a productive economy beneath the protection of our towers."
 sylvania_imperial_currency_title:0 "Coin of the Eternal Realm"
 sylvania_imperial_currency_desc:0 "Mortal rulers debase their coins and leave their creditors to argue with the next heir. We must establish orderly finances, advanced knowledge, and developed gold and copper industries, preparing a currency backed by a court that will still exist when its debts mature."
 sylvania_law_and_order_title:0 "The Count's Peace"
 sylvania_law_and_order_desc:0 "Fear may empty a street, but only reliable administration can keep its revenues flowing. We must establish functioning local courts and suppress unrest, teaching our subjects that the Count's peace governs every day between the nights of judgment."
 sylvania_defender_of_faith_title:0 "Protector of the Night"
 sylvania_defender_of_faith_desc:0 "Our fellow believers cannot trust a protector whose own subjects dispute its authority. We must establish religious unity and exceptional prestige, then assume the defense of our faith or demonstrate our leadership in war against its enemies."
 sylvania_most_of_empire_your_faith_title:0 "Cults Across the Empire"
 sylvania_most_of_empire_your_faith_desc:0 "A handful of hidden congregations can be uprooted; a faith embedded across the Empire cannot be dismissed so easily. We must spread our religion through a broad foundation of Imperial provinces until the old authorities confront an enduring presence."
 sylvania_is_your_faith_title:0 "An Empire Converted"
 sylvania_is_your_faith_desc:0 "The old order can still rally against us while its Electors pray for our destruction. We must bring the electoral college into our faith, or complete the conversion of the Imperial heartlands beyond its institutions, making our rites the foundation of the realm."
