l_english:
 nippon_rice_fields_title:0 "The Disputed Rice Fields"
 nippon_rice_fields_desc:0 "A century of disputed grants has left the same rice fields owing tax to several lords. We must measure the land, improve our domain, and restore a survey that collectors and cultivators can both obey."
 nippon_retainers_title:0 "Recall the Retainers"
 nippon_retainers_desc:0 "The old muster rolls name households that have deserted, divided, or sold their service. We must secure fresh military commitments and assemble a force worthy of the summons."
 nippon_retainers_reward:0 "Recall the Retainers"
 nippon_imperial_seals_title:0 "Recover the Imperial Seals"
 nippon_imperial_seals_desc:0 "Officials still invoke imperial seals whose registers were lost during the feuds. We must rebuild the institutions that preserve these records and give the court a seat capable of enforcing them."
 nippon_witnesses_title:0 "Witnesses at Dawn"
 nippon_witnesses_desc:0 "Debtors whisper of patrons who receive visitors only after sunset, but no magistrate will hear them alone. We must establish a capable intelligence service and build a case against the hidden households."
 nippon_clan_envoys_title:0 "Envoys to the Clans"
 nippon_clan_envoys_desc:0 "Every clan keeps its own account of promises broken during the civil wars. We must obtain public commitments from surviving neighbours, or bring their domains under a government they can no longer defy."
 nippon_measure_dragon_title:0 "Measure the Dragon"
 nippon_measure_dragon_desc:0 "Cathayan courts have learned to treat our quarrelling lords as petitioners and convenient clients. We must learn who commands their coast before presenting demands of our own."
 nippon_blood_debts_title:0 "Break the Blood Debts"
 nippon_blood_debts_desc:0 "Vampiric creditors hide their demands behind lawful contracts and obedient officers. We must place the castle towns under public magistrates and free their administration from purchased loyalties."
 nippon_blood_debts_reward:0 "Break the Blood Debts"
 nippon_officer_oaths_title:0 "Oaths Above Bloodlines"
 nippon_officer_oaths_desc:0 "Retainers obey their houses before the common command, leaving every campaign hostage to an old quarrel. We must bind officers to a shared service and make the muster independent of private feuds."
 nippon_officer_oaths_reward:0 "Oaths Above Bloodlines"
 nippon_war_harbours_title:0 "Refit the War Harbours"
 nippon_war_harbours_desc:0 "Rotting slips and unpaid crews have left our ports dependent on foreign protection. We must rebuild the docks and place a seaworthy fleet at the service of the realm."
 nippon_sword_school_title:0 "Schools of the Sword"
 nippon_sword_school_desc:0 "Famous duellists cannot hold a battle line by reputation alone. We must make disciplined practice part of the army and teach our warriors to prevail together."
 nippon_sword_school_reward:0 "Schools of the Sword"
 nippon_pacify_court_title:0 "Pacify the Court"
 nippon_pacify_court_desc:0 "Temples, officials, and warrior houses issue commands that cancel one another before they reach the provinces. We must establish a durable settlement at court and the authority to enforce it."
 nippon_pacify_court_reward:0 "Pacify the Court"
 nippon_inland_sea_title:0 "Guard the Inland Sea"
 nippon_inland_sea_desc:0 "Each disputed anchorage gives raiders another place to provision and merchants another reason to stay away. We must protect the ships that carry rice, weapons, and revenue between our ports."
 nippon_mountain_shrines_title:0 "Cleanse the Mountain Shrines"
 nippon_mountain_shrines_desc:0 "Clans have sheltered forbidden rites beneath the protection of old mountain shrines. We must restore the sanctuaries to lawful worship and make them answer for the cults they concealed."
 nippon_mountain_shrines_reward:0 "Cleanse the Mountain Shrines"
 nippon_sword_seal_title:0 "Sword and Seal"
 nippon_sword_seal_desc:0 "Imperial decrees and military commands have again begun to reach the same castles, but their authority remains unsettled. We must decide how the sword will uphold the seal before the reunification can endure."
 nippon_no_tribute_title:0 "No Tribute to Dragons"
 nippon_no_tribute_desc:0 "Cathayan protocol still places our envoys beneath rulers whose fleets once profited from our weakness. We must present a court and a navy that make such treatment costly."
 nippon_no_tribute_reward:0 "No Tribute to Dragons"
 nippon_mountain_roads_title:0 "Reopen the Mountain Roads"
 nippon_mountain_roads_desc:0 "Goblins and armed toll-keepers have inherited the passes abandoned by the clans. We must secure the roads between our castles and make it possible for orders and grain to travel safely."
 nippon_reunification_army_title:0 "Armies of Reunification"
 nippon_reunification_army_desc:0 "The court can summon warriors, but a long campaign still empties villages and exhausts private stores. We must establish permanent recruitment districts capable of sustaining the restoration."
 nippon_reunification_army_reward:0 "Armies of Reunification"
 nippon_cathayan_harbour_title:0 "Secure a Cathayan Harbour"
 nippon_cathayan_harbour_desc:0 "Our ships can cross to Cathay, but they have no safe place to repair or disembark an army. We must secure a defended mainland harbour from which our demands carry weight."
 nippon_cathayan_harbour_reward:0 "Secure a Cathayan Harbour"
 nippon_serpent_sea_title:0 "Across the Serpent Sea"
 nippon_serpent_sea_desc:0 "Khureshi raiders know which harbours change hands with every clan war. We must learn the routes to their own shore and prepare ships that can carry the contest back to them."
 nippon_one_banner_title:0 "One Muster, Many Banners"
 nippon_one_banner_desc:0 "Former enemies now march beside one another while their officers still maintain separate rolls and stores. We must bring their contingents into one professional muster without wasting their hard-won experience."
 nippon_grand_nippon_title:0 "Restore Grand Nippon"
 nippon_grand_nippon_desc:0 "The surviving domains can no longer sustain the pretence that Nippon is merely a gathering of rival courts. We must proclaim Grand Nippon through the existing formation decision and restore a single imperial authority."
 nippon_grand_nippon_reward:0 "Restore Grand Nippon"
 nippon_serpent_court_title:0 "Break the Serpent Court"
 nippon_serpent_court_desc:0 "The serpent courts have mistaken our divisions for a permanent weakness. We must defeat a substantial Khureshi power and secure a coastal base that makes renewed predation dangerous."
 nippon_serpent_court_reward:0 "Break the Serpent Court"
 nippon_century_of_night_title:0 "End the Century of Night"
 nippon_century_of_night_desc:0 "An imperial title means little while corrupted lords still rule parts of the homeland. We must reunite the settled islands under loyal authority and end the Chaos and vampiric regimes that prospered during the fracture."
 nippon_century_of_night_reward:0 "End the Century of Night"
 nippon_acknowledged_title:0 "An Empire Acknowledged"
 nippon_acknowledged_desc:0 "Our seals now bind the islands, but foreign courts still address us as one claimant among many. We must secure recognition beyond Nippon and choose how that standing will serve the restored empire."
 nippon_humble_dragon_title:0 "Humble the Dragon"
 nippon_humble_dragon_desc:0 "Cathayan ministers have measured our petitions for generations without measuring the men who carry them. We must win a war worthy of imperial notice and establish that the eastern sea has two powers."
 nippon_humble_dragon_reward:0 "Humble the Dragon"
 nippon_beneath_shrines_title:0 "Beneath the Old Shrines"
 nippon_beneath_shrines_desc:0 "The restoration has reopened sealed storehouses and forgotten stairways beneath the mountain sanctuaries. We must compare their records with known underground routes before sending soldiers into the dark."
 nippon_veterans_title:0 "Veterans of the Restoration"
 nippon_veterans_desc:0 "The restoration has produced soldiers accustomed to difficult marches and uncertain loyalties. We must organize experienced officers and reliable stores for expeditions beyond the familiar roads."
 nippon_reunited_survey_title:0 "Survey the Reunited Realm"
 nippon_reunited_survey_desc:0 "Reunification has placed incompatible surveys and tax registers under one government. We must extend cultivation and reconcile the records so that the empire can support its new ambitions."
 nippon_ocean_charters_title:0 "Charter the Ocean Voyages"
 nippon_ocean_charters_desc:0 "Victories along the eastern coast have opened a horizon our divided clans could never pursue. We must adopt the first Exploration idea and build ocean-going yards before chartering permanent expeditions."
 nippon_ocean_charters_reward:0 "Charter the Ocean Voyages"
 nippon_first_descent_title:0 "The First Descent"
 nippon_first_descent_desc:0 "Maps and lanterns have brought our soldiers to the threshold of the underground world. We must establish a defensible settlement whose garrison can survive when the surface roads are cut."
 nippon_first_descent_reward:0 "The First Descent"
 nippon_arts_of_peace_title:0 "Arts of Peace"
 nippon_arts_of_peace_desc:0 "A restored empire needs magistrates, scholars, and prosperous towns as surely as it needs swords. We must deepen learning and develop cities where those arts can flourish."
 nippon_arts_of_peace_reward:0 "Arts of Peace"
 nippon_foreign_pilots_title:0 "Pilots from Distant Shores"
 nippon_foreign_pilots_desc:0 "Our new ships still depend on charts copied from uncertain accounts. We must cultivate a trusted foreign maritime partner and turn borrowed knowledge into practiced navigation."
 nippon_beyond_sunrise_title:0 "Beyond the Sunrise"
 nippon_beyond_sunrise_desc:0 "The sea beyond the familiar islands is beginning to acquire names on our charts. We must find a coast suitable for settlement and sustain a fleet capable of reaching it again."
 nippon_lantern_garrisons_title:0 "Lantern Garrisons"
 nippon_lantern_garrisons_desc:0 "A single underground outpost is only an isolated camp waiting to be overwhelmed. We must establish defended stations with enough stores and men to keep the approaches open."
 nippon_lantern_garrisons_reward:0 "Lantern Garrisons"
 nippon_burrow_kings_title:0 "Break the Burrow-Kings"
 nippon_burrow_kings_desc:0 "The powers below the mountains treat every new garrison as prey or tribute. We must defeat a substantial underground realm and hold enough territory to defend the victory."
 nippon_burrow_kings_reward:0 "Break the Burrow-Kings"
 nippon_imperial_workshops_title:0 "Workshops of the Restored Realm"
 nippon_imperial_workshops_desc:0 "Distant armies and growing ports now demand more than the old castle workshops can supply. We must establish industries across the homeland that can sustain imperial service and civilian prosperity alike."
 nippon_imperial_workshops_reward:0 "Workshops of the Restored Realm"
 nippon_overseas_han_title:0 "The First Overseas Han"
 nippon_overseas_han_desc:0 "Our first settlers have survived long enough to ask who will govern the towns they are building. We must complete a lasting colonial settlement and decide whether its future rests with governors or chartered merchants."
 nippon_roads_below_title:0 "Roads Below the Roots"
 nippon_roads_below_desc:0 "The garrisons can hold their walls, but disputes over mines and supply roads now reach the surface court. We must establish a working underground administration and choose how it will govern the frontier."
 nippon_imperial_sword_schools_title:0 "Sword Schools of the Empire"
 nippon_imperial_sword_schools_desc:0 "The men who fought below the earth possess lessons that no isolated clan school could have taught. We must bring that experience into an imperial system of training and preserve it beyond one generation."
 nippon_imperial_sword_schools_reward:0 "Sword Schools of the Empire"
 nippon_nipponsstad_title:0 "An Embassy in Nipponsstad"
 nippon_nipponsstad_desc:0 "Nipponese merchants have long sought a place among the trading houses of the western world. We must sustain an embassy at Marienburg, or an equivalent surviving western port, and make its court a dependable partner."
 nippon_ocean_towns_title:0 "Towns Across the Ocean"
 nippon_ocean_towns_desc:0 "A lone overseas domain cannot protect the routes on which it depends. We must establish several completed settlements and develop ports that can supply one another across the ocean."
 nippon_ocean_towns_reward:0 "Towns Across the Ocean"
 nippon_deep_dawn_title:0 "Dawn in the Deep Places"
 nippon_deep_dawn_desc:0 "The underground frontier has ceased to be a succession of expeditions and emergency garrisons. We must make it a secure domain whose developed settlements contribute lasting wealth to the empire."
 nippon_deep_dawn_reward:0 "Dawn in the Deep Places"
 nippon_imperial_palaces_title:0 "The Imperial Palaces Restored"
 nippon_imperial_palaces_desc:0 "Our rulers have recovered the authority of their predecessors, but the imperial seat still bears the marks of decline. We must restore the great palaces and build a city worthy of the realm they now govern."
 nippon_imperial_palaces_reward:0 "The Imperial Palaces Restored"
 nippon_nippon_beyond_sea_title:0 "A Nippon Beyond the Sea"
 nippon_nippon_beyond_sea_desc:0 "The overseas towns now contain families who know Nippon through the laws, letters, and ships we send them. We must give those settlements prosperity and dependable government without allowing distance to dissolve their loyalty."
 nippon_nippon_beyond_sea_reward:0 "A Nippon Beyond the Sea"
 nippon_rising_sword_title:0 "The Sword of the Rising Sun"
 nippon_rising_sword_desc:0 "Our warriors have carried their discipline into caverns and distant campaigns that defeated the methods of the old clan armies. We must turn that experience into an elite force whose reputation rests on practiced excellence."
 nippon_rising_sword_reward:0 "The Sword of the Rising Sun"
 nippon_hundred_banners_title:0 "The Court of a Hundred Banners"
 nippon_hundred_banners_desc:0 "Foreign envoys now come to Nippon seeking decisions that matter beyond our islands. We must sustain a court whose reputation, ceremony, and reliability make those embassies worth maintaining."
 nippon_hundred_banners_reward:0 "The Court of a Hundred Banners"
 nippon_ancient_powers_title:0 "Equals of the Ancient Powers"
 nippon_ancient_powers_desc:0 "Our distant domains have made Nippon impossible to dismiss, but lasting standing requires durable partners. We must bind major foreign powers to relationships that can survive the end of a single campaign."
 nippon_ancient_powers_reward:0 "Equals of the Ancient Powers"
 nippon_second_dawn_title:0 "The Second Dawn"
 nippon_second_dawn_desc:0 "The old empire is no longer the measure of what Nippon can become. With its court restored, its warriors tested, and its authority carried beneath the earth and across the sea, we must claim a place among the foremost powers of the world."
 nippon_second_dawn_reward:0 "The Second Dawn"
 war_nippon_missions.1.t:0 "The Sword Beside the Seal"
 war_nippon_missions.1.d:0 "The assembled officials lay the recovered seals on a low table before the captains of the victorious houses. Beside them rests a sword presented as the emblem of the old shogunal command. Both objects have drawn obedience before, but never from every lord in the room.\n\nThe chamberlain proposes that appointments and treaties proceed through the restored court. The senior captains instead demand a military settlement that binds every household to a single chain of command. [Root.Monarch.GetName] must decide which institution will carry the greater burden of reunification."
 war_nippon_missions.1.a:0 "Let the court bind the houses."
 nippon_event_1_a:0 "Court of the Restored Seal"
 war_nippon_missions.1.b:0 "Let the sword enforce the settlement."
 nippon_event_1_b:0 "Command of the Restored Sword"
 war_nippon_missions.2.t:0 "The First Imperial Audience"
 war_nippon_missions.2.d:0 "Foreign envoys gather for the first audience held under the restored imperial protocol. Their gifts arrive with carefully revised letters that finally acknowledge the authority exercised from [Root.Capital.GetName]. The interpreters inspect every title before the doors are opened.\n\nSome councillors want these embassies to begin a wider reconciliation. Their rivals argue that recognition should make the lesser courts easier to draw into our own administration.\n\nThe audience cannot promise both policies with equal conviction. [Root.Monarch.GetName] must give the ambassadors a clear account of the empire they are recognizing."
 war_nippon_missions.2.a:0 "Let recognition open lasting negotiations."
 nippon_event_2_a:0 "The Recognized Imperial Court"
 war_nippon_missions.2.b:0 "Let the lesser courts join our order."
 nippon_event_2_b:0 "The Gathering of Lesser Courts"
 war_nippon_missions.3.t:0 "The Governors Below"
 war_nippon_missions.3.d:0 "A convoy returns from the underground stations carrying ore, casualty rolls, and three incompatible sets of toll accounts. The captains have kept their roads open, but each now claims authority over the settlements supplied through his gates. Merchants refuse to send another convoy until the court establishes whose seals they must honour.\n\nThe frontier commanders request a permanent military jurisdiction built around the fortified stations. The magistrates offer an alternative of surveyed mining domains and regular civil accounts. Both proposals promise order, though each will shape a different society beneath the mountains."
 war_nippon_missions.3.a:0 "The garrisons shall hold the frontier."
 nippon_event_3_a:0 "Military Roads of the Deep"
 war_nippon_missions.3.b:0 "The magistrates shall govern the mines."
 nippon_event_3_b:0 "Surveyed Domains Below"
 war_nippon_missions.4.t:0 "The Charter Across the Ocean"
 war_nippon_missions.4.d:0 "The first completed overseas settlement sends a delegation with a plan of its harbour and a chest of local timber. Its families have survived the first seasons and now demand a government that will survive the next governor. The delegates wait in travel-stained robes while their petition is read.\n\nVeteran officers propose hereditary overseas domains whose households owe service to the imperial centre. The merchants who supplied the crossing request chartered settlements governed through their accounts and trading privileges.\n\nBoth groups have earned a hearing, and both expect their investment to be repaid. [Root.Monarch.GetName] must decide which form of obligation will bind the new shore to Nippon."
 war_nippon_missions.4.a:0 "Grant domains to accountable governors."
 nippon_event_4_a:0 "The Overseas Han"
 war_nippon_missions.4.b:0 "Grant charters to the merchant settlements."
 nippon_event_4_b:0 "Chartered Ocean Settlements"
 war_nippon_new_world_settlement_tt:0 "A completed New World settlement founded under Nipponese or Nipponese colonial sponsorship."
 war_nippon_homeland_restored_tt:0 "Every settled province in Nippon is ours or belongs to a loyal non-tributary subject, and neither its province faith nor its ruler follows Chaos or vampirism."
 war_nippon_cathayan_victory_tt:0 "Won a war within 50 years against a surviving Cathayan state with at least 50 development, or hold 8 Cathayan cities directly or through non-sovereign subjects."
 war_nippon_khureshi_victory_tt:0 "Won a war within 50 years against a surviving Khureshi state with at least 50 development, or hold 8 Khureshi cities directly or through non-sovereign subjects."
 war_nippon_underworld_victory_tt:0 "Won a war within 50 years against a surviving underground state with at least 50 development, or hold 8 underground cities directly or through non-sovereign subjects."
