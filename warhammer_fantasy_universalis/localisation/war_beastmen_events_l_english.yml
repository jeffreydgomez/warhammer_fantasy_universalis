 ############################
 # Beastmen
 ############################
 beastmen.0100.t: "Rumors of a Beastmen Warband"
 beastmen.0100.d: "News spreads like wildfire through the towns and villages of the Old World, carried by frightened refugees and frantic messengers. Whispers in hushed tones echo through crowded marketplaces, and fear hangs heavy in the air. The ominous word is out: a Beastmen warband is on the move."
 beastmen.0100.a: "We must perpare for the worst. ."

 beastmen.0101.t: "Beastmen Warband Strikes!"
 beastmen.0101.d: "As The Beastmen emerge from their woodland lairs, ten thousand hooves stamp in agitated union, and a foetid musk arises from the sea of matted fur. The bray of the battle-horns pierces the gloom, and beyond."
 beastmen.0101.a: "To Arms!"

 beastmen.1000.t:0 "The Brayhorns Answer"
 beastmen.1000.d:0 "The Beastmen are not a kingdom, but a wound in the shape of a people. From the Drakwald to every cursed forest that still hates the axe, the Children of Chaos gather around herdstones, Bray-Shamans, and the strongest horned killer.\n\nThey despise walls, fields, bells, ledgers, and the soft order of men. To them civilization is a lie scratched over the true world, and the true world is hunger, dominance, and the Dark Gods laughing in the trees.\n\nNow the brayhorns sound through the Blood-Grounds. The herds must be driven into one stampede before rival Beastlords, jealous shamans, and eastern beast-kin turn the call into noise."
 beastmen.1000.a:0 "Let the herd trample the world."

 beastmen.1.t:0 "The New Herdstone"
 beastmen.1.d:0 "A black stone has been dragged into the clearing, slick with rain, old blood, and the handprints of those crushed beneath it. The Bray-Shamans circle it with brands, chanting until the trees answer in creaks and falling leaves.\n\nEvery herd wants the first offering. The strong demand captives, the cunning demand symbols, and the hungry simply want the screaming to begin."
 beastmen.1.a:0 "Carve the runes deep."
 beastmen.1.b:0 "Feed captives to the stone."
 beastmen.1.c:0 "Strip the offerings first."

 beastmen.2.t:0 "The Shaman's Bloody Moon"
 beastmen.2.d:0 "A Bray-Shaman has read the entrails under Morrslieb and declared that the herd must turn west before dawn. Another shaman claims the same blood points east, and both have followers with knives already drawn.\n\nThe omen may be true. It may also be a lie wrapped in antlers, which is still a kind of truth among Beastmen.\n\nThe Beastlord must decide before argument becomes stampede. No one respects a silent horn for long."
 beastmen.2.a:0 "Follow the loudest omen."
 beastmen.2.b:0 "Test it with scouts."
 beastmen.2.c:0 "Silence the shaman."
 beastmen.2.dd:0 "Take trophies from both sides."

 beastmen.3.t:0 "Ungor Muttering"
 beastmen.3.d:0 "The Ungors have begun muttering around the refuse fires. They say the Gors took the best meat, the best blades, and the best captives, leaving only cracked bones and orders.\n\nSuch complaints are weakness, but weakness has numbers. If it spreads, even the strongest Gor may wake to find a knife where obedience used to be."
 beastmen.3.a:0 "Beat the loudest chiefs."
 beastmen.3.b:0 "Throw them some spoils."
 beastmen.3.c:0 "Let the Gors feast."

 beastmen.4.t:0 "Minotaur Blood-Rage"
 beastmen.4.d:0 "The Minotaurs have scented old blood and lost what little patience they possessed. They bellow through the camp, smashing trophies, eating prisoners too early, and trampling anything slow enough to be scenery.\n\nTheir rage can still be pointed outward if someone dares stand close enough. If not, the herd will pay the price before the enemy ever sees a horn."
 beastmen.4.a:0 "Drive them toward prey."
 beastmen.4.b:0 "Feed the rage."
 beastmen.4.c:0 "Let them gorge."

 beastmen.5.t:0 "The Drakwald Lesson"
 beastmen.5.d:0 "Old raiders tell of the Drakwald, where men learned to fear every branch and every silence. A similar trap can be laid here, with false tracks, hidden horns, and the patient cruelty of beasts who know how civilization walks.\n\nThe herd grows still for once. Even the young Gors understand that the best slaughter begins before the first scream.\n\nA careful ambush could break more than bodies. It could teach nearby settlements that roads are only promises made by fools."
 beastmen.5.a:0 "Spring the perfect trap."
 beastmen.5.b:0 "Take what the dead carried."
 beastmen.5.c:0 "Track those who flee."

 beastmen.6.t:0 "Morrslieb Over the Horns"
 beastmen.6.d:0 "Morrslieb hangs low and green above the treeline, turning horns, eyes, and puddles the color of old poison. The herd raises its heads together, caught between awe and animal dread.\n\nSome say the moon demands a howl. Others say silence is wiser, because the gods hear both courage and fear, and punish whichever amuses them."
 beastmen.6.a:0 "Howl until it answers."
 beastmen.6.b:0 "Douse every fire."

 beastmen.7.t:0 "Challenge at the Herdstone"
 beastmen.7.d:0 "A Bestigor champion has stepped before the herdstone and named the Beastlord old, slow, and too fond of thinking. His followers stamp their hooves in approval, though several stand far enough back to deny involvement later.\n\nThe challenge cannot be ignored. Among Beastmen, rule is a wound that must be reopened whenever the herd grows restless.\n\nWhatever happens, the herd will remember the smell of this moment. Fear has a better memory than loyalty."
 beastmen.7.a:0 "Let the duel decide."
 beastmen.7.b:0 "Back the useful claimant."
 beastmen.7.c:0 "Poison the challenger."
 beastmen.7.dd:0 "Break the crowd."

 beastmen.8.t:0 "Paths No Map Holds"
 beastmen.8.d:0 "Scouts have found old herd-paths through thorn, marsh, and stones that men mark as sacred from a distance. Hooves remember what parchment never learned, and the forest opens where it should have been impassable.\n\nThese paths could carry raiders past watchtowers and tax roads. They could also be marked for future hunts, if the herd can resist rushing down them all at once."
 beastmen.8.a:0 "Move before dawn."
 beastmen.8.b:0 "Mark every trail."

 beastmen.9.t:0 "Waystones Under Hoof"
 beastmen.9.d:0 "A ring of captured waystones stands at the edge of the Blood-Grounds, still humming with the old wards of elves and men. Their light sickens the Ungors, but the Bray-Shamans smile as if hearing meat cook.\n\nBreaking the stones would wound the ordered world. Twisting them would be riskier, but corruption that keeps singing is a sweeter insult.\n\nThe herd waits for a sign. The stones answer by cracking."
 beastmen.9.a:0 "Shatter the wards."
 beastmen.9.b:0 "Twist their power."
 beastmen.9.c:0 "Sell the lesser shards."
 beastmen.9.dd:0 "Leave a warning omen."

 beastmen.10.t:0 "Witch-Fires on the Trail"
 beastmen.10.d:0 "Hunters, priests, and torch-bearing villagers have found the edge of the herd's trail. Their courage is probably borrowed, but borrowed courage still burns when it reaches dry grass.\n\nThe herd can scatter into the trees, feed the slow to the pursuers, or turn and meet the fires head-on. None of these choices will smell clean by morning."
 beastmen.10.a:0 "Scatter into the trees."
 beastmen.10.b:0 "Sacrifice the stragglers."
 beastmen.10.c:0 "Stand and bleed."
