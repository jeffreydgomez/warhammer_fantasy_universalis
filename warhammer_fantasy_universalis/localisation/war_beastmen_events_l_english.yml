 ############################
 # Beastmen
 ############################
 beastmen.0100.t: "The Charcoal Burner's Warning"
 beastmen.0100.d: "A charcoal burner has reached [Root.Capital.GetName] with a broken axe and a story the gate guards first dismissed. He says horned raiders surrounded his woodland camp before dawn and dragged his companions away.\n\nA patrol sent to the camp found hoofprints, overturned carts, and a human skull nailed to an oak. The captain has asked for reinforcements before his men follow the trail any farther."
 beastmen.0100.a: "Warn the garrisons. A warband is gathering."

 beastmen.0101.t: "Beastmen Break from the Woods"
 beastmen.0101.d: "The watchman at [event_target.GetName] rang the alarm when the first Ungor arrows struck the palisade. Behind the bowmen came Gors carrying axes and shields taken from our missing patrols.\n\nThe defenders have abandoned the outer farms and barricaded the village streets. A messenger escaped through the millrace with a plea for soldiers, but the road behind him is already blocked."
 beastmen.0101.a: "The warband has struck. To arms!"

 beastmen.1000.t:0 "The Gathering at the Herdstone"
 beastmen.1000.d:0 "A scarred Wargor enters the clearing with three captured banners and the heads of the men who carried them. His raiders drive stolen cattle between the campfires while Ungors drag sacks of grain to the herdstone.\n\nAt the edge of the camp, captives repair the raiders' stolen harness before being dragged to the sacrificial stakes. The shamans promise the Dark Gods fresh offerings from every settlement the united herd destroys.\n\nThe Bray-Shaman calls the scattered herds together and demands an end to their squabbling. Beyond the trees lie farms to burn and towns to sack, but rival champions are already arguing over who will lead the first attack. The Wargor lays his axe before [Root.Monarch.GetName] and waits for the order to march."
 beastmen.1000.a:0 "Give the Wargor command and divide the plunder."

 beastmen.1.t:0 "The First Offering"
 beastmen.1.d:0 "Ungor laborers have hauled a new herdstone into the war camp, losing several of their number beneath its rollers. The Bray-Shaman scrapes away the moss and finds faint runes beneath it. The stone's lower edge still has pieces of a broken dragging harness caught beneath it.\n\nA Gor champion brings captives for the first sacrifice, but the raiders who caught them refuse to surrender their possessions. The shaman has stopped the ceremony until the Beastlord settles who may take what from the altar."
 beastmen.1.a:0 "Carve our laws and victories into the stone."
 beastmen.1.b:0 "Sacrifice the captives before the warriors."
 beastmen.1.c:0 "Take the captives' valuables as the Beastlord's share."

 beastmen.2.t:0 "Two Shamans, Two Roads"
 beastmen.2.d:0 "Under Morrslieb's light, a Bray-Shaman cuts open a stolen ram and declares that the herd must march west. His rival points to the same entrails and orders the warriors east.\n\nThe two groups pull down each other's trail markers and seize the scouts sent between them. The Beastlord finds both shamans shouting beside the carcass while the raiding parties wait without orders."
 beastmen.2.a:0 "Follow the western omen, despite the disorder."
 beastmen.2.b:0 "Send scouts to test both predictions."
 beastmen.2.c:0 "Force both shamans to obey the Beastlord."
 beastmen.2.dd:0 "Confiscate both shamans' offerings."

 beastmen.3.t:0 "Empty Bowls at the Ungor Fires"
 beastmen.3.d:0 "A group of Ungors returns from scouting to find that the Gors have eaten their share of the kill. Their leader, a one-horned raider called Skarr, overturns the empty cooking pot and refuses the next patrol.\n\nBy dusk, dozens of Ungors have joined him and hidden their bows in the undergrowth. A Gor sent to beat them into obedience comes back with an arrow in his shoulder, and the camp's sentries are abandoning their posts."
 beastmen.3.a:0 "Crush the mutiny, even if warriors die."
 beastmen.3.b:0 "Buy meat and distribute it to the Ungors."
 beastmen.3.c:0 "Reserve the spoils for the Gors; let the Ungors leave."

 beastmen.4.t:0 "Minotaurs in the Captive Pens"
 beastmen.4.d:0 "A Minotaur tears open the captive pen after smelling blood from the evening sacrifice. Two others follow it through the fence, trampling the Ungors who try to drive them back.\n\nThe beasts have now overturned the plunder carts and are fighting over the prisoners. A Wargor gathers the remaining handlers behind a wagon, but none will approach without a direct order."
 beastmen.4.a:0 "Drive them out and abandon the scattered plunder."
 beastmen.4.b:0 "Spend our stores to feed them under guard."
 beastmen.4.c:0 "Let them feast openly, whatever it does to the camp."

 beastmen.5.t:0 "The Broken Wagon Ambush"
 beastmen.5.d:0 "An old Gor who once raided the Drakwald has blocked a woodland road with a stolen wagon. He leaves a wounded captive beside it to call passing travelers for help.\n\nThe scouts report that an armed merchant convoy is approaching the bend. Ungor archers already hold the banks above the road, and the Gor returns to ask whether the herd wants prisoners, plunder, or a chance to follow the merchants home."
 beastmen.5.a:0 "Destroy the convoy and unite the herd in victory."
 beastmen.5.b:0 "Seize every chest and pack animal."
 beastmen.5.c:0 "Track the survivors and share the route with allied herds."

 beastmen.6.t:0 "The Night of Green Light"
 beastmen.6.d:0 "Morrslieb rises while the herd is dividing the evening kill, and green light catches on the blades around the fire. A young Gor collapses in convulsions as new horns push through his brow.\n\nThe Bray-Shaman calls the change a blessing and leads a howling procession toward the herdstone. Other warriors drag their companions into the trees, terrified that the same change will take them before morning."
 beastmen.6.a:0 "Lead the rite, even if it consumes our warriors."
 beastmen.6.b:0 "Extinguish the fires and shelter the scattered warriors."

 beastmen.7.t:0 "An Axe Before the Beastlord"
 beastmen.7.d:0 "The Bestigor Ghorak throws his axe at the Beastlord's feet and accuses [Root.Monarch.GetName] of hoarding the finest plunder. Several warriors step forward to support him, still wearing armor taken in the last raid.\n\nGhorak points to a row of captured helms hanging outside the Beastlord's shelter. Two belong to warriors his own followers killed, and he demands that they be divided before witnesses.\n\nThe Beastlord's guards block the path to the herdstone while Ghorak strips for a challenge. Ungors begin stealing from the abandoned campfires, and the confrontation is spreading into fights across the clearing."
 beastmen.7.a:0 "Accept the challenge and break his followers."
 beastmen.7.b:0 "Order the Wargors to force him into submission."
 beastmen.7.c:0 "Pay the shaman to test a poison on Ghorak."
 beastmen.7.dd:0 "Raid his followers' camps and seize their loot."

 beastmen.8.t:0 "The Scout Beyond the Watchtower"
 beastmen.8.d:0 "A scarred Ungor returns carrying a helmet stolen from a human sentry. He reached the watchtower through a flooded ravine that the garrison believed impassable.\n\nThe scout scratches the route into the mud and shows where roots provide footholds above the water. An ambitious Wargor volunteers to lead the herd through it, though the weakest warriors will struggle to keep up."
 beastmen.8.a:0 "Give the Wargor command and force the crossing."
 beastmen.8.b:0 "Mark the route for future raids."

 beastmen.9.t:0 "The Waystone in the Clearing"
 beastmen.9.d:0 "A raiding party has found an Elven waystone inside a ring of dead trees. The Gors cannot approach without vomiting, but their Bray-Shaman has chipped a fragment from its base.\n\nBack at camp, the fragment makes the shaman's charms shake against his staff. He brings tools, captives, and his apprentices to the clearing, while Ungor scavengers follow to collect anything worth trading."
 beastmen.9.a:0 "Spend our plunder to destroy the ward completely."
 beastmen.9.b:0 "Have the shaman study and corrupt its magic."
 beastmen.9.c:0 "Sell the fragments and recruit the arriving scavengers."
 beastmen.9.dd:0 "Use its broken pieces to guard our plunder stores."

 beastmen.10.t:0 "The Wounded Scout's Warning"
 beastmen.10.d:0 "An injured Ungor limps into the war camp with a crossbow bolt in his thigh. He says hunters and armed villagers ambushed his scouting party, and a priest is leading them along the herd's tracks.\n\nThe scout names two companions taken alive and points toward the ridge where their horns last sounded. When a Wargor orders him back to the trail, he tries to stand and collapses beside the fire.\n\nBefore the shaman can pull out the bolt, another sentry spots torches between the trees. The hunters have set fire to the dry brush below the camp, leaving one narrow trail open toward the marsh."
 beastmen.10.a:0 "Split the herd and regroup in the woods."
 beastmen.10.b:0 "Leave the stragglers behind to delay the hunters."
 beastmen.10.c:0 "Rally around the Beastlord and hold the burning camp."
