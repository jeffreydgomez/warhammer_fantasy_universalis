 war_cult_of_ulric_religion_monarchy_reform:0 "Ulrican Monarchy"
 war_cult_of_ulric_religion_monarchy_reform_desc:0 "Ulrican rites are written into the first laws of the realm. This reform turns the faith's familiar strengths into state practice, while the narrower sacred order strains broad administration."
