 #skaven
 warhammer_T5_skaven_clan_moulder:0 "The Twisted"
 warhammer_T5_skaven_clan_moulder_desc:0 "'Yes-yes Warlord Krizk - for a treaty-pledge of just 200 Slaves, 12 claws of warptokens, a Breeder and certain alliances and pledges, one of our very-very finest Clan Moulder Rat Ogres can be yours...'\n\n—Clan Moulder Haggle-master\n\nClan Moulder is one of the Four Great Skaven Clans which specializes in the mastery of breeding, mutating, and surgically creating some of the most horrific and fearsome war-beasts to have ever existed. Such is the demand for these ferocious creations that Clan Moulder is one of the wealthiest of all Skaven Clans. While many are jealous of Clan Moulder's might, few dare to openly challenge them, not when the clan can field an entire army of grotesquely mutated war-beasts. "
 
 warhammer_T5_skaven_clan_skyre:0 "The Warlock"
 warhammer_T5_skaven_clan_skyre_desc:0 "'Yes-yes. The essence of the warpstone feeds my machine. To create, one must-must destroy! To destroy, one must-must create! This will-will be great-best invention! Make-force all skaven bow-grovel! Destroy-kill all-all enemies!'\n\nClan Skryre are the inventors and industrialists of the Skaven Under-Empire. From their headquarters in Skavenblight, they create foul machines which combine magic and science to destroy the enemies of the Skaven. Doom-Flayers, Doomwheels, Doomrockets, Warplock Jezzails, Warpfire Throwers, Warp Lightning Cannons and Ratling Guns are all inventions of Clan Skryre, as is the poison gas used by Poison Wind Globadiers. Clan Skryre are also one of the richest and most influential clans - they make a fortune hiring their war machines to other clans, and their leader Lord Morskittar, known as the Emperor of Warlocks, has a seat on the Council of Thirteen. Ikit Claw himself is not the overall clan leader, but an important high-ranking Warlock Engineer. The inventions of Clan Skryre rival and in some cases surpass those of the Engineers of the Dwarfs and Chaos Dwarfs. "
 
 warhammer_T5_skaven_clan_verminus:0 "Vermintide"
 warhammer_T5_skaven_clan_verminus_desc:0 "If you can't win by throwing thousands upon thousands of warm, ratty bodies at the enemy, how can you say you're playing Skaven?"
 
 warhammer_T5_skaven_clan_eshin:0 "The Shadow"
 warhammer_T5_skaven_clan_eshin_desc:0 "'All Clans fear the assassins. They envy-hate them for their power-strength. Assassins kill-kill Skaven and many Man Things. To the Lords of Decay, the assassins are valuable tools that should not be squandered like hapless Clanrats.'\n—Skreelin Thurntik, Grey Seer.\n\nClan Eshin is one of the Four Great Skaven Clans which specialises in the deadly and secretive arts of stealth, murder, poison and assassination learned from the exotic Far East. Of all the clans which populates the Under-Empire, Clan Eshin is by far the most secretive and hidden. This mysterious Clan has eyes and ears everywhere and its deadly operatives are scattered throughout the Under-Empire as well as secreted about within the cities and settlements of the surface dwellers. For the right price, the black-clad agents of Clan Eshin will steal any information, commit any act of ruthless sabotage or assassinate any rival with ruthless efficiency."
 
 warhammer_T5_skaven_clan_pestilins:0 "Clan Pestilins"
 warhammer_T5_skaven_clan_pestilins_desc:0 "'Brother-under-the-fur. Ha! Now you are brother-true. Reject false-words of seers and embrace true face of the Horned One! Bring Skrolk to the Wormstone, and you will be Plague Priest. Betray, and you become pus-bag.'\n\nClan Pestilens is one of the four Greater Clans. Its members are the Plague Monks – the disciples of disease and decay. Clan Pestilens dedicate themselves with insane fervour to spreading corruption in the name of the Great Horned Rat. Pestilens was the first clan to reach Lustria; there, in the hot, fetid conditions, did the disease-ridden ratmen start to overcome the climate to found Clan Pestilens. It wasn’t long before the emergent clan encountered the Lizardmen and an age-old enmity was born. Of all the warm-blooded invaders to trespass on Lustria, it is the Skaven – and Clan Pestilens in particular – that the Lizardmen hate the most. Eventually, after decades of self-imposed exile, the Plague Monks re-joined the Under-Empire and immediately claimed their place on the Council of Thirteen."
 
 #norscan
 mammoth_riders_reform:0 "Mammoth Riders"
 mammoth_riders_reform_desc:0 "Tainted and savage they may be, but these behemoths remain willing to bear high-status marauders into battle, trampling flat everything foolish enough to get into their way."
 
unified_empire_reform:0 "Unified Imperial Court"
unified_empire_reform_desc:0 "We have unified the empire into a single nation! And with that, we have inherited a massive court of advisors, spies, and factions vying for control. According to the complex unification accords we must give each faction its proper due and say, but the rewards of such a massive court are not to be ignored."


 found_mages_college_reform:0 "Found Mages' College"
 found_mages_college_reform_desc:0 "Magic can be a powerful tool, if used correctly. Let us take some of our religious resources and redirect them to the study of magic.\n\n§YThis decision enables the Mages Estate.§!"
 
 abolish_mages_college_reform:0 "Abolish Mages' College"
 abolish_mages_college_reform_desc:0 "Mages are fickle, dangerous creatures, and they are not to be trusted with magic or political power. Magic can be more tightly controlled if it is integrated into the established religious institutions.\n\n§YThis decision abolishes the Mages Estate.§!"


court_wizards_reform:0 "Court Wizards"
court_wizards_reform_desc:0 "By granting the noble houses limited oversight of magical institutions, we can balance arcane power with traditional authority, preventing any one faction from becoming too dominant."

magical_bureaucrats_reform:0 "Magical Bureaucrats"
magical_bureaucrats_reform_desc:0 "The application of arcane knowledge in administration vastly improves our bureaucratic efficiency. Though it stirs unrest, the gains in organization are undeniable."

war_mages_reform:0 "War Mages"
war_mages_reform_desc:0 "Our military elite shall be drawn from the ranks of powerful spellcasters. While traditional discipline suffers, the destructive power of such leadership is unmatched."

ban_magic_in_warfare_reform:0 "Ban Magic in Warfare"
ban_magic_in_warfare_reform_desc:0 "Magic is volatile and unpredictable on the battlefield. We shall rely on proven strategies and martial discipline, forbidding arcane interference in warfare."

elevate_the_mages_reform:0 "Elevate the Mages"
elevate_the_mages_reform_desc:0 "Let the mages rise above the other estates. Through their innovations and foresight, we shall lead our realm into a new golden age of arcane enlightenment."

reduce_the_mages_reform:0 "Reduce the Mages' Status"
reduce_the_mages_reform_desc:0 "The mages have overreached their station. By empowering the traditional estates, we reassert the natural order and reestablish the foundation of our realm."

embrace_transmutation_reform:0 "Embrace Transmutation"
embrace_transmutation_reform_desc:0 "By harnessing transmutative magic, we can manipulate matter and resources to our advantage, minimizing reliance on the merchant class and increasing economic stability."

tariff_magical_goods_reform:0 "Tariff Magical Goods"
tariff_magical_goods_reform_desc:0 "The trade of enchanted items must be regulated. By placing tariffs on magical goods, we bolster our trade power while curbing the unchecked influence of mages."

peasant_magical_training_reform:0 "Peasant Magical Training"
peasant_magical_training_reform_desc:0 "Why should magic be the domain of the elite? By training the common folk in basic magical arts, we increase resilience and cultural spread across the realm."

church_control_of_magic_reform:0 "Church Control of Magic"
church_control_of_magic_reform_desc:0 "Magic must serve the divine order. The clergy shall oversee all arcane matters, ensuring that spells are cast in accordance with sacred doctrine."

state_sacrifices_reform:0 "State Sacrifices"
state_sacrifices_reform_desc:0 "Through ritual sacrifice, we fuel our divine or necromantic rites. Though it costs us in manpower, the spiritual and magical rewards are considerable."

necromantic_control_reform:0 "Necromantic Control"
necromantic_control_reform_desc:0 "Our mastery over the undead is complete. Through black magic and iron will, we command them to serve without question or resistance."

necrohierarchy_reform:0 "Necrohierarchy"
necrohierarchy_reform_desc:0 "Our state is a rigid hierarchy of the undead, with power descending from dark masters through loyal servants bound by eternal pacts and ritual."

no_gods_above_us_reform:0 "No Gods Above Us"
no_gods_above_us_reform_desc:0 "The gods are gone—or never were. Our rulers alone determine the fate of the realm, answerable to no higher power."

close_the_mines_to_outsiders_reform:0 "Close the Mines to Outsiders"
close_the_mines_to_outsiders_reform_desc:0 "Trade weakens us. By shutting our gates and focusing inward, we expand our industry and strengthen our clans' economic power."

clan_holds_reform:0 "Clan Holds"
clan_holds_reform_desc:0 "The ancient clans shall rule their own strongholds with autonomy and pride. Decentralization allows each hold to thrive and fortify as needed."

khazukan_kazakit_ha_reform:0 "Khazukan Kazakit-ha!"
khazukan_kazakit_ha_reform_desc:0 "The time has come to reclaim our lost holds! With ancestral fury and unyielding pride, the Dawi march to war, vowing never to forget and never to forgive."

# Alignment Reforms

ordertide_reform:0 "Ordertide Governance"
ordertide_reform_desc:0 "Peace, order, and prosperity are not ideals to be debated—they are mandates to be enforced. With righteous administration and unwavering resolve, we shall shape the world into a bastion of stability and justice."

power_is_legitimacy_reform:0 "Power Is Legitimacy"
power_is_legitimacy_reform_desc:0 "What justifies our rule is not ideals or tradition, but strength. Power defines right, and the world shall bow to it."

chaos_bringer_reform:0 "Bringer of Chaos"
chaos_bringer_reform_desc:0 "We are the storm that unravels order, the divine madness that topples the thrones of men. To bring about the true purpose of the gods, we must plunge the world into glorious ruin."

# Elf & Dwarf Reforms

integrate_the_pantheon_reform:0 "Pantheon-Integrated Rule"
integrate_the_pantheon_reform_desc:0 "Our gods are no mere patrons—they are part of the state itself. We draw divine authority from our faith, blending sacred rites with the mechanisms of governance."

# Orc Reforms

greenskin_bureaucracy_reform:0 "Might Makes Right"
greenskin_bureaucracy_reform_desc:0 "Why write things down when you can punch someone and take their stuff? Greenskin governance is as simple as strength—if you can take it, it's yours."

waaagh_is_our_culture_reform:0 "WAAAGH! Is Our Culture"
waaagh_is_our_culture_reform_desc:0 "The WAAAGH! is not just war—it is the essence of who we are. It is the roar of the horde, the crash of iron, the beat of our unruly hearts."

nothing_is_written_reform:0 "Nothing Is Written"
nothing_is_written_reform_desc:0 "Rules are for the weak. Power flows to those bold enough to seize it. In our realms, there are no charters or laws—only dominance and the will to hold it."

# Lizardmen Reforms

old_ones_mission_reform:0 "Mission of the Old Ones"
old_ones_mission_reform_desc:0 "The Old Ones entrusted us with a grand design. Through discipline, sacred warfare, and adherence to ancient prophecy, we shall fulfill their cosmic mission."

skink_bureaucrats_reform:0 "Skink Bureaucracy"
skink_bureaucrats_reform_desc:0 "The Skinks manage our temples, logistics, and sacred duties. With tireless efficiency, they execute the plans of the Old Ones with divine precision."

world_belongs_to_the_old_ones_reform:0 "The World Belongs to the Old Ones"
world_belongs_to_the_old_ones_reform_desc:0 "The time of correction is at hand. All who resist the design must be purged or enlightened. This is not conquest—it is restoration."

# Dragon Isles Reforms

dragon_cult_theocracy:0 "Dragon-Priest Court"
dragon_cult_theocracy_desc:0 "In this realm, priests and shrine-wardens rule by claiming to interpret the hunger, dreams, and silence of living dragons. Gem tribute, volcanic rites, and sacred hostages bind the clans to the altar, while each decree must look like obedience to the wyrms above it."

dragon_cult_tribe:0 "Clutch-Bound Clan"
dragon_cult_tribe_desc:0 "This tribal order is held together by kinship, spear-oaths, and fear of the dragons nesting above its valleys. Chieftains gather tribute, guard sacred clutches, and prove authority by leading warriors where scale, ash, and clan honor demand."

dragon_cult_monarchy:0 "Blood-Voice Monarchy"
dragon_cult_monarchy_desc:0 "The ruler claims the throne as the blood-voice of a dragon whose will is rarely clear and never gentle. Altar ceremony, hostage rites, and gem-rich tribute turn draconic terror into royal law, though every island chief watches for weakness in the shadow of wings."

reformed_dragon_cult_monarchy:0 "Reformed Blood-Voice Monarchy"
reformed_dragon_cult_monarchy_desc:0 "The blood-throne no longer rests on omen and raw terror alone. With the Dragon Cult modernized, the ruler's claim is fixed in shrine law, tribute ledgers, and disciplined courts, turning draconic fear into a monarchy that can administer as well as command."

reformed_dragon_cult_theocracy:0 "Reformed Dragon-Priest Court"
reformed_dragon_cult_theocracy_desc:0 "The old altar courts have learned to write law as carefully as they read omen. A modernized Dragon Cult binds priesthood, shrine records, gem tribute, and public sacrifice into a disciplined sacred state, so dragon fear governs through offices as well as smoke."

dragon_god_king:0 "Dragon God-King"
dragon_god_king_desc:0 "Our ruler is no longer merely the regent of a distant wyrm. He is its equal. Blood-priests, brood chiefs, and altar courts proclaim him a dragon in living scale, turning gem tribute, hostage rites, and volcanic terror into obedience to his fire."

dragon_god_king_monarchy:0 "Dragon God-King"
dragon_god_king_monarchy_desc:0 "The blood-throne no longer speaks for a distant wyrm. The monarch is acclaimed as a dragon in living scale, and every brood chief, altar court, and tribute hall must obey his fire as law."

dragon_god_king_republic:0 "Dragon God-Consul"
dragon_god_king_republic_desc:0 "The republic keeps its councils, oaths, and contests for office, but the highest magistrate is proclaimed a living dragon when the blood-gong chooses him. Debate may still shape policy, but every vote is cast beneath the shadow of his sacred fire."

dragon_god_king_tribe:0 "Dragon God-Chief"
dragon_god_king_tribe_desc:0 "The clans no longer follow a mere war-leader beneath the wings. They raise one chief as a dragon in flesh and scale, binding spear-oaths, hostage rites, and gem tribute to the hunger of his command."

dragon_god_king_theocracy:0 "Dragon God-King"
dragon_god_king_theocracy_desc:0 "The priesthood declares that the ruler does not interpret the dragons from below, but bears their fire within his own sacred body. Shrine law, sacrifice, and altar judgment now flow from a living dragon enthroned among the faithful."

# Ogre Reforms

feed_the_tyrants_reform:0 "Feed the Tyrants"
feed_the_tyrants_reform_desc:0 "Keep the tyrants fed and they stay content. It’s a simple truth of ogre politics—well-fed tyrants don't look for reasons to smash things."

feed_the_clergy_reform:0 "Feed the Priests"
feed_the_clergy_reform_desc:0 "The priests of the Maw are easier to appease than they look. Heap their altars with meat and blood, and they’ll bless us with quiet fervor."

feed_the_masses_reform:0 "Feed the Masses"
feed_the_masses_reform_desc:0 "A fed ogre is a happy ogre, and a happy ogre doesn’t riot. By gorging our population, we ensure their loyalty—and avoid getting eaten ourselves."

# Skaven Reforms

eat_eat_the_world_reform:0 "Eat-Eat the World!"
eat_eat_the_world_reform_desc:0 "The surface belongs to us-us! The under-empire will rise from below, spreading our glorious filth across the weak-flesh things above."

factories_of_the_horned_rat_reform:0 "Factories of the Horned Rat"
factories_of_the_horned_rat_reform_desc:0 "Industry is worship. Every clanking machine, every toiling slave rat brings us closer to dominion. Praise the Horned Rat through smoke and steel!"


hashut_governing_reform:0 "Priesthood of Hashut"
hashut_governing_reform_desc:0 "The Father of Darkness demands obedience, sacrifice, and order. Our governance is a divine mandate, enforced by the Black Priests and consecrated in flame and iron. Through ritual, discipline, and tireless industry, we enact His will upon the world."

economy_based_on_loot:0 "Pillage-Based Economy"
economy_based_on_loot_desc:0 "This state's economic structure is built upon the spoils of war. Looting and raiding are not just acts of violence—they are the foundation of wealth, feeding the coffers of the realm and sustaining its war machine. Wherever the armies march, plunder follows, and with it, prosperity—of a kind."


war_nobles_lead_the_charge:0 "Nobles Lead the Charge"
war_nobles_lead_the_charge_desc:0 "Our nobility lead from the front. Eager to join the battle, they ride their ornamented steeds to the front lines, where they attack full force."


# Powerhouse Government Reforms
war_economic_powerhouse_monarchy:0 "Economic Powerhouse"
war_economic_powerhouse_monarchy_desc:0 "The crown can make prosperity the state's first command. By directing law, privilege, and royal attention toward workshops, markets, and construction, we will build a realm of extraordinary productivity, though such narrow focus will strain our governing capacity."
war_cultural_powerhouse_monarchy:0 "Cultural Powerhouse"
war_cultural_powerhouse_monarchy_desc:0 "The court can become the glittering center of national life. Patronage, ceremony, embassies, and cultivated manners will make our monarchy admired abroad and refined at home, though such narrow focus will strain our governing capacity."
war_military_powerhouse_monarchy:0 "Military Powerhouse"
war_military_powerhouse_monarchy_desc:0 "The crown can bind noble privilege, taxation, and public honor to the needs of the army. A monarchy so ordered will become disciplined, relentless, and ready for war, though such narrow focus will strain our governing capacity."

war_economic_powerhouse_republic:0 "Economic Powerhouse"
war_economic_powerhouse_republic_desc:0 "The republic can make productive enterprise the measure of civic virtue. Councils, guilds, and magistrates will be judged by the roads they pave, the workshops they raise, and the wealth they set in motion, though such narrow focus will strain our governing capacity."
war_cultural_powerhouse_republic:0 "Cultural Powerhouse"
war_cultural_powerhouse_republic_desc:0 "The republic can turn public life into a school of refinement. Debate, diplomacy, festivals, learned societies, and civic prestige will make our name respected across borders, though such narrow focus will strain our governing capacity."
war_military_powerhouse_republic:0 "Military Powerhouse"
war_military_powerhouse_republic_desc:0 "The republic can make service in arms the highest proof of citizenship. Drill, supply, public discipline, and shared sacrifice will harden the state into a martial commonwealth, though such narrow focus will strain our governing capacity."

war_economic_powerhouse_theocracy:0 "Economic Powerhouse"
war_economic_powerhouse_theocracy_desc:0 "The faithful can be organized into a disciplined economy of labor, tithe, and construction. If prosperity is treated as sacred stewardship, our realm will become remarkably productive, though such narrow focus will strain our governing capacity."
war_cultural_powerhouse_theocracy:0 "Cultural Powerhouse"
war_cultural_powerhouse_theocracy_desc:0 "The temple can make refinement an expression of divine order. Ritual, learning, diplomacy, sacred art, and public dignity will make our theocracy admired and trusted, though such narrow focus will strain our governing capacity."
war_military_powerhouse_theocracy:0 "Military Powerhouse"
war_military_powerhouse_theocracy_desc:0 "The faithful can be drilled into an army of doctrine and conviction. Discipline, holy service, and martial devotion will make the theocracy formidable in war, though such narrow focus will strain our governing capacity."

# Productive, Refined, and Militarized Society Government Mechanics
ability_war_productivity_mechanic:0 "Productive Society"
ability_war_productivity_mechanic_desc:0 "A productive society values output, investment, and practical organization over courtly polish or the glories of war."
war_productivity_mechanic:0 "Productive Society"
war_productivity_mechanic_desc:0 "Productivity measures how tightly our society is organized around labor, construction, trade goods, and economic expansion.\n\nHigh §YProductivity§! increases Goods Produced, reduces Development Cost, and reduces Construction Cost, but lowers Prestige and Discipline. Productivity rises from §YStability§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, §YMeritocracy§!, §YPeace§!, and unused §YGoverning Capacity§!. It falls from §YInflation§!, §YWar§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
war_productivity_power:0 "Productivity"
war_productivity_power_desc:0 "Productivity represents our society's economic discipline, practical skill, and ability to turn order into wealth. It is increased by §YStability§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, §YMeritocracy§!, §YPeace§!, and unused §YGoverning Capacity§!, and reduced by §YInflation§!, §YWar§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
monthly_war_productivity_power:0 "Monthly Productivity"
war_productivity_power_gain_modifier:0 "Productivity Gain"
boost_productivity:0 "Boost Productivity"
boost_productivity_desc:0 "Spend Administrative Power to improve the realm's economic discipline and productive habits."
war_solicit_investments:0 "Solicit Investments"
war_solicit_investments_desc:0 "Invite the estates to fund workshops, counting houses, roads, and storehouses. Their influence will grow, but so will our Productivity."
war_relax_working_standards:0 "Relax Working Standards"
war_relax_working_standards_desc:0 "Ease the burdens of administration by consuming the society's accumulated Productivity."

ability_war_refinement_mechanic:0 "Refined Society"
ability_war_refinement_mechanic_desc:0 "A refined society values culture, ceremony, diplomacy, and reputation over raw production or martial hardness."
war_refinement_mechanic:0 "Refined Society"
war_refinement_mechanic_desc:0 "Refinement measures the grace, prestige, and diplomatic polish of our society.\n\nHigh §YRefinement§! increases Diplomatic Reputation, Global Trade Power, and Prestige, but lowers Discipline and Goods Produced. Refinement rises from §YStability§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, §YMeritocracy§!, §YPrestige§!, §YRepublican Tradition§!, §YPeace§!, and unused §YGoverning Capacity§!. It falls from §YWar§!, §YBankruptcy§!, low §YRepublican Tradition§!, and being over §YGoverning Capacity§!."
war_refinement_power:0 "Refinement"
war_refinement_power_desc:0 "Refinement represents our society's cultivated manners, diplomatic confidence, and reputation for civilized excellence. It is increased by §YStability§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, §YMeritocracy§!, §YPrestige§!, §YRepublican Tradition§!, §YPeace§!, and unused §YGoverning Capacity§!, and reduced by §YWar§!, §YBankruptcy§!, low §YRepublican Tradition§!, and being over §YGoverning Capacity§!."
monthly_war_refinement_power:0 "Monthly Refinement"
war_refinement_power_gain_modifier:0 "Refinement Gain"
boost_refinement:0 "Boost Refinement"
boost_refinement_desc:0 "Spend Diplomatic Power to elevate the realm's manners, reputation, and diplomatic polish."
war_host_exposition:0 "Host Exposition"
war_host_exposition_desc:0 "Spend wealth on a grand exposition. Countries that already hold us in high regard will gain trust in us, and their admiration will increase our Refinement."
war_exploit_reputation:0 "Exploit Reputation"
war_exploit_reputation_desc:0 "Turn our cultivated reputation into immediate income, at the cost of some accumulated Refinement."

ability_war_militarization_mechanic:0 "Militarized Society"
ability_war_militarization_mechanic_desc:0 "A militarized society values discipline, readiness, and battlefield glory over wealth or refinement."
war_militarization_mechanic:0 "Militarized Society"
war_militarization_mechanic_desc:0 "Militarization measures how thoroughly our society has bent itself toward war.\n\nHigh §YMilitarization§! increases Discipline and Manpower Recovery Speed while reducing Land Maintenance, but lowers Prestige and Goods Produced. Militarization rises from §YWar§!, §YArmy Tradition§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, and §YMeritocracy§!. It falls from §YPeace§!, §YWar Exhaustion§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
ability_militarization_mechanic:0 "Militarized Society"
ability_militarization_mechanic_desc:0 "A militarized society values discipline, readiness, and battlefield glory over wealth or refinement."
militarization_mechanic:0 "Militarized Society"
militarization_mechanic_desc:0 "Militarization measures how thoroughly our society has bent itself toward war.\n\nHigh §YMilitarization§! increases Discipline and Manpower Recovery Speed while reducing Land Maintenance, but lowers Prestige and Goods Produced. Militarization rises from §YWar§!, §YArmy Tradition§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, and §YMeritocracy§!. It falls from §YPeace§!, §YWar Exhaustion§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
militarized_society:0 "Militarization"
militarized_society_desc:0 "Militarization represents our society's discipline, readiness, and devotion to arms. It is increased by §YWar§!, §YArmy Tradition§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, and §YMeritocracy§!, and reduced by §YPeace§!, §YWar Exhaustion§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
monthly_militarized_society:0 "Monthly Militarization"
militarized_society_gain_modifier:0 "Militarization Gain"
boost_militarization:0 "Boost Militarization"
boost_militarization_desc:0 "Spend Military Power to harden the realm's discipline and martial readiness."

# Power Struggle Government Mechanic
ability_war_power_struggle_mechanic:0 "Power Struggle"
ability_war_power_struggle_mechanic_desc:0 "Order fattens the weak. Power Struggle exposes them, and lets the strongest claw their way upward."
war_power_struggle_mechanic:0 "Power Struggle"
war_power_struggle_mechanic_desc:0 "Some call this realm uncivilized. We call it honest. A society kept in constant turbulence lets strength, cunning, and hunger test every rank, so the capable rise and the comfortable fall.\n\nHigh §YPower Struggle§! reduces advisor and leader costs, strengthens placed merchants, and at §Y75§! or more grants additional monarch power generation. Power Struggle rises from unrest, high autonomy, negative stability, and internal challenges. It falls from positive stability, absolutism, and constructed buildings."
war_power_struggle_power:0 "Power Struggle"
war_power_struggle_power_desc:0 "Power Struggle represents the raw contest inside our society: clan against clan, aspirant against master, hunger against comfort. It is gained from §YUnrest§!, §YLocal Autonomy§!, §YNegative Stability§!, and Power Struggle interactions. It is lost from §YPositive Stability§!, §YAbsolutism§!, and §YBuildings§! constructed in our provinces."
monthly_war_power_struggle_power:0 "Monthly Power Struggle"
war_power_struggle_power_gain_modifier:0 "Power Struggle Gain"

# Power Struggle Interactions
test_the_monarch_interaction:0 "Test the Monarch"
test_the_monarch_interaction_desc:0 "Let challengers prove whether the ruler still deserves obedience. The ordeal may kill the monarch, or sharpen the monarch's gifts before all rivals."
test_the_heir_interaction:0 "Test the Heir"
test_the_heir_interaction_desc:0 "A soft heir is a promise of future weakness. Send the heir through the old trials, where survival may reveal a stronger successor."
encourage_a_coup_interaction:0 "Encourage a Coup"
encourage_a_coup_interaction_desc:0 "Let ambitious captains, clan chiefs, and pretenders believe this is their moment. The capital will suffer as rivals test the throne, but every open challenge teaches the realm that power belongs to those bold enough to seize it."


# Corpse Stores Government Mechanic
ability_corpse_stores_mechanic:0 "Corpse Stores"
ability_corpse_stores_mechanic_desc:0 "The dead are not waste. Battles fought on our land feed the corpse pits, and necromancers can later raise those bodies into fresh regiments."
corpse_stores_mechanic:0 "Corpse Stores"
corpse_stores_mechanic_desc:0 "The dead are not waste. Battles fought on our land feed the corpse pits, and necromancers can later raise those bodies into fresh regiments."
corpse_stores_power:0 "Corpses Stored"
corpse_stores_power_desc:0 "Corpses Stored represents bodies gathered after battles fought on our own land. For every §Y2000§! friendly, enemy, or neutral casualties suffered in such battles, §G1000§! corpses are added to the stores."
monthly_corpse_stores_power:0 "Monthly Corpses Stored"
corpse_stores_power_gain_modifier:0 "Corpses Stored Gain"

# Corpse Stores Interactions
raise_the_dead_interaction:0 "Raise the Dead"
raise_the_dead_interaction_desc:0 "Open the corpse pits and bind the waiting dead to service, raising a body of infantry in our capital."
add_to_the_pile_interaction:0 "Add to the Pile"
add_to_the_pile_interaction_desc:0 "The living are temporary assets. Cull the unwanted, condemned, and already half-dead so our necromancers have more material when war demands it."
corpse_experiments_interaction:0 "Corpse Experiments"
corpse_experiments_interaction_desc:0 "Allow the necromancers to spend a vast reserve of bodies on controlled experiments in death, obedience, and reconstruction."

 ability_lizardmen_great_plan_mechanic:0 "The Great Plan"
 monthly_great_plan_insight_power:0 "Monthly Great Plan Insight"
 great_plan_insight_power_gain_modifier:0 "Great Plan Insight"
 great_plan_insight_power:0 "Great Plan Insight"
 great_plan_insight_power_desc:0 "Insight is gained from §GStability§!, §GReligious Unity§!, and control of §GTemple Cities§!. In addition, you gain §G1 Insight§! from every §Gprovince you convert§!.\n\nThe Great Plan wavers as the forces of Chaos spread. Discipline and vigilance are essential to suppress the tide of corruption."

# Interactions
great_plan_interaction_1:0 "Expand Spawning Pools"
great_plan_interaction_1_desc:0 "More warriors must be birthed to fulfill the Great Plan. Expand the spawning pools at once, for bodies are the foundation of our defense."

great_plan_interaction_2:0 "Fortify Geomantic Web"
great_plan_interaction_2_desc:0 "The roots of the Old Ones' power must be shielded. Explore new methods to enhance their power."

great_plan_interaction_3:0 "Cleanse Corrupted Artifacts"
great_plan_interaction_3_desc:0 "Artifacts once sacred have become tainted. Dispatch skink priests and purging squads to cleanse them in the name of the Great Plan."

# Modifiers
interaction_1_modif:0 "Spawning Pool Expansion"
interaction_2_modif:0 "Fortified Geomantic Web"
interaction_3_modif:0 "Cleansed Sacred Artifacts"

# Tooltips
great_plan_interaction_1_effect_tt:0 "All worshippers of the Old Ones gain §G6 months of Manpower§!."
great_plan_interaction_2_effect_tt:0 "All worshippers of the Old Ones gain §G0.5 Innovativeness§!."
great_plan_interaction_3_effect_tt:0 "All worshippers of the Old Ones gain §G6 months of Income§!."

great_plan_power_tt:0 "Insight is gained from §GStability§!, §GReligious Unity§!, and control of §GTemple Cities§!. In addition, you gain §G1 Insight§! from every §Gprovince you convert§!."

# Embrace Diversity Government Mechanic
ability_embrace_diversity_mechanic:0 "Embrace Diversity"
embrace_diversity_mechanic:0 "Embrace Diversity"
monthly_embrace_diversity_power:0 "Monthly Embrace Diversity"
embrace_diversity_power_gain_modifier:0 "Embrace Diversity Gain"
embrace_diversity_power:0 "Embrace Diversity"
embrace_diversity_power_desc:0 "Embrace Diversity represents the strength our realm draws from its many peoples, faiths, customs, and foreign contacts. The bar increases by §G+5§! when a culture is promoted and decreases by §R-5§! when a culture is demoted. Various events may also provide small increases or decreases."

# Embrace Diversity Interactions
invite_foreigners_interaction:0 "Invite Foreigners"
invite_foreigners_interaction_desc:0 "Invite neighbors and foreign communities into our realm, accepting the uncertainty that follows when new customs meet old laws."
festival_of_ideas_interaction:0 "Festival of Ideas"
festival_of_ideas_interaction_desc:0 "Welcome neighboring scholars, artisans, priests, and envoys whose traditions differ from ours, turning foreign debate into practical innovation and warmer relations."
squeeze_foreigners_interaction:0 "Squeeze Foreigners"
squeeze_foreigners_interaction_desc:0 "Press communities outside our ruling culture group for extraordinary contributions to the treasury, levies, and docks."

# Embrace Diversity Tooltips
invite_foreigners_interaction_tt:0 "Trigger a random §YNeighbor Event§!."
festival_of_ideas_interaction_tt:0 "For every neighboring country with positive opinion of us and a different technology group, spend §R25§! Diplomatic Power to gain §G0.1§! Innovativeness, §G5§! Trust, and a §G+25§! opinion bonus with that country. The opinion bonus decays over §Y10 years§!."
squeeze_foreigners_interaction_tt:0 "Gain 1 year of production income, manpower, and sailors from provinces outside your culture group."
embrace_diversity_festival_of_ideas_opinion:0 "Festival of Ideas"

 # Warhammer accessibility reform localization
 # Monarchy accessibility reforms
 war_lady_of_the_lake_monarchy_reform:0 "Grail Monarchy"
 war_lady_of_the_lake_monarchy_reform_desc:0 "Grail rites are written into the first laws of the realm. This reform turns the faith's familiar strengths into state practice, while the narrower sacred order strains broad administration."
 war_myrmidia_monarchy_reform:0 "Myrmidian Monarchy"
 war_myrmidia_monarchy_reform_desc:0 "Myrmidian rites are written into the first laws of the realm. This reform turns the faith's familiar strengths into state practice, while the narrower sacred order strains broad administration."
 war_ursun_monarchy_reform:0 "Great Orthodoxy Monarchy"
 war_ursun_monarchy_reform_desc:0 "Great Orthodoxy rites are written into the first laws of the realm. This reform turns the faith's familiar strengths into state practice, while the narrower sacred order strains broad administration."
