 #skaven
 warhammer_T5_skaven_clan_moulder:0 "The Twisted"
 warhammer_T5_skaven_clan_moulder_desc:0 "'Yes-yes Warlord Krizk - for a treaty-pledge of just 200 Slaves, 12 claws of warptokens, a Breeder and certain alliances and pledges, one of our very-very finest Clan Moulder Rat Ogres can be yours...'\n\n—Clan Moulder Haggle-master\n\nClan Moulder is one of the Four Great Skaven Clans which specializes in the mastery of breeding, mutating, and surgically creating some of the most horrific and fearsome war-beasts to have ever existed. Such is the demand for these ferocious creations that Clan Moulder is one of the wealthiest of all Skaven Clans. While many are jealous of Clan Moulder's might, few dare to openly challenge them, not when the clan can field an entire army of grotesquely mutated war-beasts. "
 
 warhammer_T5_skaven_clan_skyre:0 "The Warlock"
 warhammer_T5_skaven_clan_skyre_desc:0 "'Yes-yes. The essence of the warpstone feeds my machine. To create, one must-must destroy! To destroy, one must-must create! This will-will be great-best invention! Make-force all skaven bow-grovel! Destroy-kill all-all enemies!'\n\nClan Skryre are the inventors and industrialists of the Skaven Under-Empire. From their headquarters in Skavenblight, they create foul machines which combine magic and science to destroy the enemies of the Skaven. Doom-Flayers, Doomwheels, Doomrockets, Warplock Jezzails, Warpfire Throwers, Warp Lightning Cannons and Ratling Guns are all inventions of Clan Skryre, as is the poison gas used by Poison Wind Globadiers. Clan Skryre are also one of the richest and most influential clans - they make a fortune hiring their war machines to other clans, and their leader Lord Morskittar, known as the Emperor of Warlocks, has a seat on the Council of Thirteen. Ikit Claw himself is not the overall clan leader, but an important high-ranking Warlock Engineer. The inventions of Clan Skryre rival and in some cases surpass those of the Engineers of the Dwarfs and Chaos Dwarfs. "
 
 warhammer_T5_skaven_clan_verminus:0 "Vermintide"
 warhammer_T5_skaven_clan_verminus_desc:0 "If you can't win by throwing thousands upon thousands of warm, ratty bodies at the enemy, how can you say you're playing Skaven?"
 
 warhammer_T5_skaven_clan_eshin:0 "The Shadow"
 warhammer_T5_skaven_clan_eshin_desc:0 "'All Clans fear the assassins. They envy-hate them for their power-strength. Assassins kill-kill Skaven and many Man Things. To the Lords of Decay, the assassins are valuable tools that should not be squandered like hapless Clanrats.'\n—Skreelin Thurntik, Grey Seer.\n\nClan Eshin is one of the Four Great Skaven Clans which specialises in the deadly and secretive arts of stealth, murder, poison and assassination learned from the exotic Far East. Of all the clans which populates the Under-Empire, Clan Eshin is by far the most secretive and hidden. This mysterious Clan has eyes and ears everywhere and its deadly operatives are scattered throughout the Under-Empire as well as secreted about within the cities and settlements of the surface dwellers. For the right price, the black-clad agents of Clan Eshin will steal any information, commit any act of ruthless sabotage or assassinate any rival with ruthless efficiency."
 
 warhammer_T5_skaven_clan_pestilins:0 "Clan Pestilins"
 warhammer_T5_skaven_clan_pestilins_desc:0 "'Brother-under-the-fur. Ha! Now you are brother-true. Reject false-words of seers and embrace true face of the Horned One! Bring Skrolk to the Wormstone, and you will be Plague Priest. Betray, and you become pus-bag.'\n\nClan Pestilens is one of the four Greater Clans. Its members are the Plague Monks – the disciples of disease and decay. Clan Pestilens dedicate themselves with insane fervour to spreading corruption in the name of the Great Horned Rat. Pestilens was the first clan to reach Lustria; there, in the hot, fetid conditions, did the disease-ridden ratmen start to overcome the climate to found Clan Pestilens. It wasn’t long before the emergent clan encountered the Lizardmen and an age-old enmity was born. Of all the warm-blooded invaders to trespass on Lustria, it is the Skaven – and Clan Pestilens in particular – that the Lizardmen hate the most. Eventually, after decades of self-imposed exile, the Plague Monks re-joined the Under-Empire and immediately claimed their place on the Council of Thirteen."
 
 #norscan
 mammoth_riders_reform:0 "Mammoth Riders"
 mammoth_riders_reform_desc:0 "Tainted and savage they may be, but these behemoths remain willing to bear high-status marauders into battle, trampling flat everything foolish enough to get into their way."
 
unified_empire_reform:0 "Unified Imperial Court"
unified_empire_reform_desc:0 "We have unified the empire into a single nation! And with that, we have inherited a massive court of advisors, spies, and factions vying for control. According to the complex unification accords we must give each faction its proper due and say, but the rewards of such a massive court are not to be ignored."


 found_mages_college_reform:0 "Found Mages' College"
 found_mages_college_reform_desc:0 "Magic can be a powerful tool, if used correctly. Let us take some of our religious resources and redirect them to the study of magic.\n\n§YThis decision enables the Mages Estate.§!"
 
 abolish_mages_college_reform:0 "Abolish Mages' College"
 abolish_mages_college_reform_desc:0 "Mages are fickle, dangerous creatures, and they are not to be trusted with magic or political power. Magic can be more tightly controlled if it is integrated into the established religious institutions.\n\n§YThis decision abolishes the Mages Estate.§!"


court_wizards_reform:0 "Court Wizards"
court_wizards_reform_desc:0 "By granting the noble houses limited oversight of magical institutions, we can balance arcane power with traditional authority, preventing any one faction from becoming too dominant."

magical_bureaucrats_reform:0 "Magical Bureaucrats"
magical_bureaucrats_reform_desc:0 "The application of arcane knowledge in administration vastly improves our bureaucratic efficiency. Though it stirs unrest, the gains in organization are undeniable."

war_mages_reform:0 "War Mages"
war_mages_reform_desc:0 "Our military elite shall be drawn from the ranks of powerful spellcasters. While traditional discipline suffers, the destructive power of such leadership is unmatched."

ban_magic_in_warfare_reform:0 "Ban Magic in Warfare"
ban_magic_in_warfare_reform_desc:0 "Magic is volatile and unpredictable on the battlefield. We shall rely on proven strategies and martial discipline, forbidding arcane interference in warfare."

elevate_the_mages_reform:0 "Elevate the Mages"
elevate_the_mages_reform_desc:0 "Let the mages rise above the other estates. Through their innovations and foresight, we shall lead our realm into a new golden age of arcane enlightenment."

reduce_the_mages_reform:0 "Reduce the Mages' Status"
reduce_the_mages_reform_desc:0 "The mages have overreached their station. By empowering the traditional estates, we reassert the natural order and reestablish the foundation of our realm."

embrace_transmutation_reform:0 "Embrace Transmutation"
embrace_transmutation_reform_desc:0 "By harnessing transmutative magic, we can manipulate matter and resources to our advantage, minimizing reliance on the merchant class and increasing economic stability."

tariff_magical_goods_reform:0 "Tariff Magical Goods"
tariff_magical_goods_reform_desc:0 "The trade of enchanted items must be regulated. By placing tariffs on magical goods, we bolster our trade power while curbing the unchecked influence of mages."

peasant_magical_training_reform:0 "Peasant Magical Training"
peasant_magical_training_reform_desc:0 "Why should magic be the domain of the elite? By training the common folk in basic magical arts, we increase resilience and cultural spread across the realm."

church_control_of_magic_reform:0 "Church Control of Magic"
church_control_of_magic_reform_desc:0 "Magic must serve the divine order. The clergy shall oversee all arcane matters, ensuring that spells are cast in accordance with sacred doctrine."

state_sacrifices_reform:0 "State Sacrifices"
state_sacrifices_reform_desc:0 "Through ritual sacrifice, we fuel our divine or necromantic rites. Though it costs us in manpower, the spiritual and magical rewards are considerable."

necromantic_control_reform:0 "Necromantic Control"
necromantic_control_reform_desc:0 "Our mastery over the undead is complete. Through black magic and iron will, we command them to serve without question or resistance."

necrohierarchy_reform:0 "Necrohierarchy"
necrohierarchy_reform_desc:0 "Our state is a rigid hierarchy of the undead, with power descending from dark masters through loyal servants bound by eternal pacts and ritual."

no_gods_above_us_reform:0 "No Gods Above Us"
no_gods_above_us_reform_desc:0 "The gods are gone—or never were. Our rulers alone determine the fate of the realm, answerable to no higher power."

close_the_mines_to_outsiders_reform:0 "Close the Mines to Outsiders"
close_the_mines_to_outsiders_reform_desc:0 "Trade weakens us. By shutting our gates and focusing inward, we expand our industry and strengthen our clans' economic power."

clan_holds_reform:0 "Clan Holds"
clan_holds_reform_desc:0 "The ancient clans shall rule their own strongholds with autonomy and pride. Decentralization allows each hold to thrive and fortify as needed."

khazukan_kazakit_ha_reform:0 "Khazukan Kazakit-ha!"
khazukan_kazakit_ha_reform_desc:0 "The time has come to reclaim our lost holds! With ancestral fury and unyielding pride, the Dawi march to war, vowing never to forget and never to forgive."

# Alignment Reforms

ordertide_reform:0 "Ordertide Governance"
ordertide_reform_desc:0 "Peace, order, and prosperity are not ideals to be debated—they are mandates to be enforced. With righteous administration and unwavering resolve, we shall shape the world into a bastion of stability and justice."

power_is_legitimacy_reform:0 "Power Is Legitimacy"
power_is_legitimacy_reform_desc:0 "What justifies our rule is not ideals or tradition, but strength. Power defines right, and the world shall bow to it."

chaos_bringer_reform:0 "Bringer of Chaos"
chaos_bringer_reform_desc:0 "We are the storm that unravels order, the divine madness that topples the thrones of men. To bring about the true purpose of the gods, we must plunge the world into glorious ruin."

# Elf & Dwarf Reforms

integrate_the_pantheon_reform:0 "Pantheon-Integrated Rule"
integrate_the_pantheon_reform_desc:0 "Our gods are no mere patrons—they are part of the state itself. We draw divine authority from our faith, blending sacred rites with the mechanisms of governance."

# Orc Reforms

greenskin_bureaucracy_reform:0 "Might Makes Right"
greenskin_bureaucracy_reform_desc:0 "Why write things down when you can punch someone and take their stuff? Greenskin governance is as simple as strength—if you can take it, it's yours."

waaagh_is_our_culture_reform:0 "WAAAGH! Is Our Culture"
waaagh_is_our_culture_reform_desc:0 "The WAAAGH! is not just war—it is the essence of who we are. It is the roar of the horde, the crash of iron, the beat of our unruly hearts."

nothing_is_written_reform:0 "Nothing Is Written"
nothing_is_written_reform_desc:0 "Rules are for the weak. Power flows to those bold enough to seize it. In our realms, there are no charters or laws—only dominance and the will to hold it."

# Lizardmen Reforms

old_ones_mission_reform:0 "Mission of the Old Ones"
old_ones_mission_reform_desc:0 "The Old Ones entrusted us with a grand design. Through discipline, sacred warfare, and adherence to ancient prophecy, we shall fulfill their cosmic mission."

skink_bureaucrats_reform:0 "Skink Bureaucracy"
skink_bureaucrats_reform_desc:0 "The Skinks manage our temples, logistics, and sacred duties. With tireless efficiency, they execute the plans of the Old Ones with divine precision."

world_belongs_to_the_old_ones_reform:0 "The World Belongs to the Old Ones"
world_belongs_to_the_old_ones_reform_desc:0 "The time of correction is at hand. All who resist the design must be purged or enlightened. This is not conquest—it is restoration."

# Dragon Isles Reforms

dragon_cult_theocracy:0 "Dragon-Priest Court"
dragon_cult_theocracy_desc:0 "In this realm, priests and shrine-wardens rule by claiming to interpret the hunger, dreams, and silence of living dragons. Gem tribute, volcanic rites, and sacred hostages bind the clans to the altar, while each decree must look like obedience to the wyrms above it."

dragon_cult_tribe:0 "Clutch-Bound Clan"
dragon_cult_tribe_desc:0 "This tribal order is held together by kinship, spear-oaths, and fear of the dragons nesting above its valleys. Chieftains gather tribute, guard sacred clutches, and prove authority by leading warriors where scale, ash, and clan honor demand."

dragon_cult_monarchy:0 "Blood-Voice Monarchy"
dragon_cult_monarchy_desc:0 "The ruler claims the throne as the blood-voice of a dragon whose will is rarely clear and never gentle. Altar ceremony, hostage rites, and gem-rich tribute turn draconic terror into royal law, though every island chief watches for weakness in the shadow of wings."

reformed_dragon_cult_monarchy:0 "Reformed Blood-Voice Monarchy"
reformed_dragon_cult_monarchy_desc:0 "The blood-throne no longer rests on omen and raw terror alone. With the Dragon Cult modernized, the ruler's claim is fixed in shrine law, tribute ledgers, and disciplined courts, turning draconic fear into a monarchy that can administer as well as command."

reformed_dragon_cult_theocracy:0 "Reformed Dragon-Priest Court"
reformed_dragon_cult_theocracy_desc:0 "The old altar courts have learned to write law as carefully as they read omen. A modernized Dragon Cult binds priesthood, shrine records, gem tribute, and public sacrifice into a disciplined sacred state, so dragon fear governs through offices as well as smoke."

dragon_god_king:0 "Dragon God-King"
dragon_god_king_desc:0 "Our ruler is no longer merely the regent of a distant wyrm. He is its equal. Blood-priests, brood chiefs, and altar courts proclaim him a dragon in living scale, turning gem tribute, hostage rites, and volcanic terror into obedience to his fire."

dragon_god_king_monarchy:0 "Dragon God-King"
dragon_god_king_monarchy_desc:0 "The blood-throne no longer speaks for a distant wyrm. The monarch is acclaimed as a dragon in living scale, and every brood chief, altar court, and tribute hall must obey his fire as law."

dragon_god_king_republic:0 "Dragon God-Consul"
dragon_god_king_republic_desc:0 "The republic keeps its councils, oaths, and contests for office, but the highest magistrate is proclaimed a living dragon when the blood-gong chooses him. Debate may still shape policy, but every vote is cast beneath the shadow of his sacred fire."

dragon_god_king_tribe:0 "Dragon God-Chief"
dragon_god_king_tribe_desc:0 "The clans no longer follow a mere war-leader beneath the wings. They raise one chief as a dragon in flesh and scale, binding spear-oaths, hostage rites, and gem tribute to the hunger of his command."

dragon_god_king_theocracy:0 "Dragon God-King"
dragon_god_king_theocracy_desc:0 "The priesthood declares that the ruler does not interpret the dragons from below, but bears their fire within his own sacred body. Shrine law, sacrifice, and altar judgment now flow from a living dragon enthroned among the faithful."

# Ogre Reforms

feed_the_tyrants_reform:0 "Feed the Tyrants"
feed_the_tyrants_reform_desc:0 "Keep the tyrants fed and they stay content. It’s a simple truth of ogre politics—well-fed tyrants don't look for reasons to smash things."

feed_the_clergy_reform:0 "Feed the Priests"
feed_the_clergy_reform_desc:0 "The priests of the Maw are easier to appease than they look. Heap their altars with meat and blood, and they’ll bless us with quiet fervor."

feed_the_masses_reform:0 "Feed the Masses"
feed_the_masses_reform_desc:0 "A fed ogre is a happy ogre, and a happy ogre doesn’t riot. By gorging our population, we ensure their loyalty—and avoid getting eaten ourselves."

# Skaven Reforms

eat_eat_the_world_reform:0 "Eat-Eat the World!"
eat_eat_the_world_reform_desc:0 "The surface belongs to us-us! The under-empire will rise from below, spreading our glorious filth across the weak-flesh things above."

factories_of_the_horned_rat_reform:0 "Factories of the Horned Rat"
factories_of_the_horned_rat_reform_desc:0 "Industry is worship. Every clanking machine, every toiling slave rat brings us closer to dominion. Praise the Horned Rat through smoke and steel!"


hashut_governing_reform:0 "Priesthood of Hashut"
hashut_governing_reform_desc:0 "The Father of Darkness demands obedience, sacrifice, and order. Our governance is a divine mandate, enforced by the Black Priests and consecrated in flame and iron. Through ritual, discipline, and tireless industry, we enact His will upon the world."

economy_based_on_loot:0 "Pillage-Based Economy"
economy_based_on_loot_desc:0 "This state's economic structure is built upon the spoils of war. Looting and raiding are not just acts of violence—they are the foundation of wealth, feeding the coffers of the realm and sustaining its war machine. Wherever the armies march, plunder follows, and with it, prosperity—of a kind."


war_nobles_lead_the_charge:0 "Nobles Lead the Charge"
war_nobles_lead_the_charge_desc:0 "Our nobility lead from the front. Eager to join the battle, they ride their ornamented steeds to the front lines, where they attack full force."


# Powerhouse Government Reforms
war_economic_powerhouse_monarchy:0 "Economic Powerhouse"
war_economic_powerhouse_monarchy_desc:0 "The crown can make prosperity the state's first command. By directing law, privilege, and royal attention toward workshops, markets, and construction, we will build a realm of extraordinary productivity, though such narrow focus will strain our governing capacity."
war_cultural_powerhouse_monarchy:0 "Cultural Powerhouse"
war_cultural_powerhouse_monarchy_desc:0 "The court can become the glittering center of national life. Patronage, ceremony, embassies, and cultivated manners will make our monarchy admired abroad and refined at home, though such narrow focus will strain our governing capacity."
war_military_powerhouse_monarchy:0 "Military Powerhouse"
war_military_powerhouse_monarchy_desc:0 "The crown can bind noble privilege, taxation, and public honor to the needs of the army. A monarchy so ordered will become disciplined, relentless, and ready for war, though such narrow focus will strain our governing capacity."

war_economic_powerhouse_republic:0 "Economic Powerhouse"
war_economic_powerhouse_republic_desc:0 "The republic can make productive enterprise the measure of civic virtue. Councils, guilds, and magistrates will be judged by the roads they pave, the workshops they raise, and the wealth they set in motion, though such narrow focus will strain our governing capacity."
war_cultural_powerhouse_republic:0 "Cultural Powerhouse"
war_cultural_powerhouse_republic_desc:0 "The republic can turn public life into a school of refinement. Debate, diplomacy, festivals, learned societies, and civic prestige will make our name respected across borders, though such narrow focus will strain our governing capacity."
war_military_powerhouse_republic:0 "Military Powerhouse"
war_military_powerhouse_republic_desc:0 "The republic can make service in arms the highest proof of citizenship. Drill, supply, public discipline, and shared sacrifice will harden the state into a martial commonwealth, though such narrow focus will strain our governing capacity."

war_economic_powerhouse_theocracy:0 "Economic Powerhouse"
war_economic_powerhouse_theocracy_desc:0 "The faithful can be organized into a disciplined economy of labor, tithe, and construction. If prosperity is treated as sacred stewardship, our realm will become remarkably productive, though such narrow focus will strain our governing capacity."
war_cultural_powerhouse_theocracy:0 "Cultural Powerhouse"
war_cultural_powerhouse_theocracy_desc:0 "The temple can make refinement an expression of divine order. Ritual, learning, diplomacy, sacred art, and public dignity will make our theocracy admired and trusted, though such narrow focus will strain our governing capacity."
war_military_powerhouse_theocracy:0 "Military Powerhouse"
war_military_powerhouse_theocracy_desc:0 "The faithful can be drilled into an army of doctrine and conviction. Discipline, holy service, and martial devotion will make the theocracy formidable in war, though such narrow focus will strain our governing capacity."

# Productive, Refined, and Militarized Society Government Mechanics
ability_war_productivity_mechanic:0 "Productive Society"
ability_war_productivity_mechanic_desc:0 "A productive society values output, investment, and practical organization over courtly polish or the glories of war."
war_productivity_mechanic:0 "Productive Society"
war_productivity_mechanic_desc:0 "Productivity measures how tightly our society is organized around labor, construction, trade goods, and economic expansion.\n\nHigh §YProductivity§! increases Goods Produced, reduces Development Cost, and reduces Construction Cost, but lowers Prestige and Discipline. Productivity rises from §YStability§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, §YMeritocracy§!, §YPeace§!, and unused §YGoverning Capacity§!. It falls from §YInflation§!, §YWar§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
war_productivity_power:0 "Productivity"
war_productivity_power_desc:0 "Productivity represents our society's economic discipline, practical skill, and ability to turn order into wealth. It is increased by §YStability§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, §YMeritocracy§!, §YPeace§!, and unused §YGoverning Capacity§!, and reduced by §YInflation§!, §YWar§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
monthly_war_productivity_power:0 "Monthly Productivity"
war_productivity_power_gain_modifier:0 "Productivity Gain"
boost_productivity:0 "Boost Productivity"
boost_productivity_desc:0 "Spend Administrative Power to improve the realm's economic discipline and productive habits."
war_solicit_investments:0 "Solicit Investments"
war_solicit_investments_desc:0 "Invite the estates to fund workshops, counting houses, roads, and storehouses. Their influence will grow, but so will our Productivity."
war_encourage_construction:0 "Encourage Construction"
war_encourage_construction_desc:0 "By encouraging private investments in public works, we can quickly and cheaply raise great structures. Invest in the future!"
war_encourage_construction_modifier:0 "Encourage Construction"
war_encourage_construction_modifier_desc:0 "By encouraging private investments in public works, we can quickly and cheaply raise great structures. Invest in the future!"


ability_war_refinement_mechanic:0 "Refined Society"
ability_war_refinement_mechanic_desc:0 "A refined society values culture, ceremony, diplomacy, and reputation over raw production or martial hardness."
war_refinement_mechanic:0 "Refined Society"
war_refinement_mechanic_desc:0 "Refinement measures the grace, prestige, and diplomatic polish of our society.\n\nHigh §YRefinement§! increases Diplomatic Reputation, Global Trade Power, and Prestige, but lowers Discipline and Goods Produced. Refinement rises from §YStability§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, §YMeritocracy§!, §YPrestige§!, §YRepublican Tradition§!, §YPeace§!, and unused §YGoverning Capacity§!. It falls from §YWar§!, §YBankruptcy§!, low §YRepublican Tradition§!, and being over §YGoverning Capacity§!."
war_refinement_power:0 "Refinement"
war_refinement_power_desc:0 "Refinement represents our society's cultivated manners, diplomatic confidence, and reputation for civilized excellence. It is increased by §YStability§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, §YMeritocracy§!, §YPrestige§!, §YRepublican Tradition§!, §YPeace§!, and unused §YGoverning Capacity§!, and reduced by §YWar§!, §YBankruptcy§!, low §YRepublican Tradition§!, and being over §YGoverning Capacity§!."
monthly_war_refinement_power:0 "Monthly Refinement"
war_refinement_power_gain_modifier:0 "Refinement Gain"
boost_refinement:0 "Boost Refinement"
boost_refinement_desc:0 "Spend Diplomatic Power to elevate the realm's manners, reputation, and diplomatic polish."
war_host_exposition:0 "Host Exposition"
war_host_exposition_desc:0 "Spend wealth on a grand exposition. Countries that have over 150 opinion of us will gain trust in us, and their admiration will increase our Refinement."
war_exploit_reputation:0 "Exploit Reputation"
war_exploit_reputation_desc:0 "Turn our cultivated reputation into immediate income, at the cost of some accumulated Refinement."

ability_war_militarization_mechanic:0 "Militarized Society"
ability_war_militarization_mechanic_desc:0 "A militarized society values discipline, readiness, and battlefield glory over wealth or refinement."
war_militarization_mechanic:0 "Militarized Society"
war_militarization_mechanic_desc:0 "Militarization measures how thoroughly our society has bent itself toward war.\n\nHigh §YMilitarization§! increases Discipline and Manpower Recovery Speed while reducing Land Maintenance, but lowers Prestige and Goods Produced. Militarization rises from §YWar§!, §YArmy Tradition§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, and §YMeritocracy§!. It falls from §YPeace§!, §YWar Exhaustion§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
ability_militarization_mechanic:0 "Militarized Society"
ability_militarization_mechanic_desc:0 "A militarized society values discipline, readiness, and battlefield glory over wealth or refinement."
militarization_mechanic:0 "Militarized Society"
militarization_mechanic_desc:0 "Militarization measures how thoroughly our society has bent itself toward war.\n\nHigh §YMilitarization§! increases Discipline and Manpower Recovery Speed while reducing Land Maintenance, but lowers Prestige and Goods Produced. Militarization rises from §YWar§!, §YArmy Tradition§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, and §YMeritocracy§!. It falls from §YPeace§!, §YWar Exhaustion§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
militarized_society:0 "Militarization"
militarized_society_desc:0 "Militarization represents our society's discipline, readiness, and devotion to arms. It is increased by §YWar§!, §YArmy Tradition§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, and §YMeritocracy§!, and reduced by §YPeace§!, §YWar Exhaustion§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
monthly_militarized_society:0 "Monthly Militarization"
militarized_society_gain_modifier:0 "Militarization Gain"
war_militarization_power:0 "Militarization"
war_militarization_power_desc:0 "Militarization represents our society's discipline, readiness, and devotion to arms. It is increased by §YWar§!, §YArmy Tradition§!, §YLegitimacy§!, §YHorde Unity§!, §YDevotion§!, and §YMeritocracy§!, and reduced by §YPeace§!, §YWar Exhaustion§!, §YBankruptcy§!, and being over §YGoverning Capacity§!."
monthly_war_militarization_power:0 "Monthly Militarization"
war_militarization_power_gain_modifier:0 "Militarization Gain"
boost_militarization:0 "Boost Militarization"
boost_militarization_desc:0 "Spend Military Power to harden the realm's discipline and martial readiness."
war_boost_militarization:0 "Boost Militarization"
war_boost_militarization_desc:0 "Spend Military Power to harden the realm's discipline and martial readiness."
war_march_divided_fight_united:0 "March Divided, Fight United"
war_march_divided_fight_united_desc:0 "Put separate columns on the road and bring them together on the battlefield, turning scattered musters into a single thunderous advance."
war_rewrite_military_manual:0 "Rewrite Military Manual"
war_rewrite_military_manual_desc:0 "Revise the realm's military doctrine, drilling officers and soldiers in tactics fit for the changing face of war."

# Power Struggle Government Mechanic
ability_war_power_struggle_mechanic:0 "Power Struggle"
ability_war_power_struggle_mechanic_desc:0 "Order fattens the weak. Power Struggle exposes them, and lets the strongest claw their way upward."
war_power_struggle_mechanic:0 "Power Struggle"
war_power_struggle_mechanic_desc:0 "Some call this realm uncivilized. We call it honest. A society kept in constant turbulence lets strength, cunning, and hunger test every rank, so the capable rise and the comfortable fall.\n\nHigh §YPower Struggle§! reduces advisor and leader costs, strengthens placed merchants, and at §Y75§! or more grants additional monarch power generation. Power Struggle rises from unrest, high autonomy, negative stability, and internal challenges. It falls from positive stability, absolutism, and constructed buildings."
war_power_struggle_power:0 "Power Struggle"
war_power_struggle_power_desc:0 "Power Struggle represents the raw contest inside our society: clan against clan, aspirant against master, hunger against comfort. It is gained from §YUnrest§!, §YLocal Autonomy§!, §YNegative Stability§!, and Power Struggle interactions. It is lost from §YPositive Stability§!, §YAbsolutism§!, and §YBuildings§! constructed in our provinces."
monthly_war_power_struggle_power:0 "Monthly Power Struggle"
war_power_struggle_power_gain_modifier:0 "Power Struggle Gain"

# Power Struggle Interactions
test_the_monarch_interaction:0 "Test the Monarch"
test_the_monarch_interaction_desc:0 "Let challengers prove whether the ruler still deserves obedience. The ordeal may kill the monarch, or sharpen the monarch's gifts before all rivals."
test_the_heir_interaction:0 "Test the Heir"
test_the_heir_interaction_desc:0 "A soft heir is a promise of future weakness. Send the heir through the old trials, where survival may reveal a stronger successor."
encourage_a_coup_interaction:0 "Encourage a Coup"
encourage_a_coup_interaction_desc:0 "Let ambitious captains, clan chiefs, and pretenders believe this is their moment. The capital will suffer as rivals test the throne, but every open challenge teaches the realm that power belongs to those bold enough to seize it."


# Corpse Stores Government Mechanic
ability_corpse_stores_mechanic:0 "Corpse Stores"
ability_corpse_stores_mechanic_desc:0 "The dead are not waste. Battles fought on our land feed the corpse pits, and necromancers can later raise those bodies into fresh regiments."
corpse_stores_mechanic:0 "Corpse Stores"
corpse_stores_mechanic_desc:0 "The dead are not waste. Battles fought on our land feed the corpse pits, and necromancers can later raise those bodies into fresh regiments."
corpse_stores_power:0 "Thousand Corpses Stored"
corpse_stores_power_desc:0 "Corpses Stored represents bodies gathered after battles fought on our own land. For every §Y2000§! friendly, enemy, or neutral casualties suffered in such battles, §G1000§! corpses are added to the stores."
monthly_corpse_stores_power:0 "Monthly Thousand Corpses Stored"
corpse_stores_power_gain_modifier:0 "Thousand Corpses Stored Gain"

# Corpse Stores Interactions
raise_the_dead_interaction:0 "Raise the Dead"
raise_the_dead_interaction_desc:0 "Open the corpse pits and bind the waiting dead to service, raising a body of infantry in our capital."
spawn_10_infantry_tt:0 "Spawn 10 infantry."
add_to_the_pile_interaction:0 "Add to the Pile"
add_to_the_pile_interaction_desc:0 "The living are temporary assets. Cull the unwanted, condemned, and already half-dead so our necromancers have more material when war demands it."
corpse_experiments_interaction:0 "Corpse Experiments"
corpse_experiments_interaction_desc:0 "Allow the necromancers to spend a vast reserve of bodies on controlled experiments in death, obedience, and reconstruction."

 ability_lizardmen_great_plan_mechanic:0 "The Great Plan"
 monthly_great_plan_insight_power:0 "Monthly Great Plan Insight"
 great_plan_insight_power_gain_modifier:0 "Great Plan Insight"
 great_plan_insight_power:0 "Great Plan Insight"
 great_plan_insight_power_desc:0 "Insight is gained from §GStability§!, §GReligious Unity§!, and control of §GTemple Cities§!. In addition, you gain §G1 Insight§! from every §Gprovince you convert§!.\n\nThe Great Plan wavers as the forces of Chaos spread. Discipline and vigilance are essential to suppress the tide of corruption."

# Interactions
great_plan_interaction_1:0 "Expand Spawning Pools"
great_plan_interaction_1_desc:0 "More warriors must be birthed to fulfill the Great Plan. Expand the spawning pools at once, for bodies are the foundation of our defense."

great_plan_interaction_2:0 "Fortify Geomantic Web"
great_plan_interaction_2_desc:0 "The roots of the Old Ones' power must be shielded. Explore new methods to enhance their power."

great_plan_interaction_3:0 "Cleanse Corrupted Artifacts"
great_plan_interaction_3_desc:0 "Artifacts once sacred have become tainted. Dispatch skink priests and purging squads to cleanse them in the name of the Great Plan."

# Modifiers
interaction_1_modif:0 "Spawning Pool Expansion"
interaction_2_modif:0 "Fortified Geomantic Web"
interaction_3_modif:0 "Cleansed Sacred Artifacts"

# Tooltips
great_plan_interaction_1_effect_tt:0 "All worshippers of the Old Ones gain §G6 months of Manpower§!."
great_plan_interaction_2_effect_tt:0 "All worshippers of the Old Ones gain §G0.5 Innovativeness§!."
great_plan_interaction_3_effect_tt:0 "All worshippers of the Old Ones gain §G6 months of Income§!."

great_plan_power_tt:0 "Insight is gained from §GStability§!, §GReligious Unity§!, and control of §GTemple Cities§!. In addition, you gain §G1 Insight§! from every §Gprovince you convert§!."

# Embrace Diversity Government Mechanic
ability_embrace_diversity_mechanic:0 "Embrace Diversity"
embrace_diversity_mechanic:0 "Embrace Diversity"
monthly_embrace_diversity_power:0 "Monthly Embrace Diversity"
embrace_diversity_power_gain_modifier:0 "Embrace Diversity Gain"
embrace_diversity_power:0 "Embrace Diversity"
embrace_diversity_power_desc:0 "Embrace Diversity represents the strength our realm draws from its many peoples, faiths, customs, and foreign contacts. The bar increases by §G+5§! when a culture is promoted and decreases by §R-5§! when a culture is demoted. Various events may also provide small increases or decreases."

# Embrace Diversity Interactions
invite_foreigners_interaction:0 "Invite Foreigners"
invite_foreigners_interaction_desc:0 "Invite neighbors and foreign communities into our realm, accepting the uncertainty that follows when new customs meet old laws."
festival_of_ideas_interaction:0 "Festival of Ideas"
festival_of_ideas_interaction_desc:0 "Welcome neighboring scholars, artisans, priests, and envoys whose traditions differ from ours, turning foreign debate into practical innovation and warmer relations."
get_foreign_ideas_interaction:0 "Try Foreigner Concepts"
get_foreign_ideas_interaction_desc:0 "It may strain our social norms, but if we are to stay up to date with the rest of the world then we need to listed to foreign ideas."

# Embrace Diversity Tooltips
invite_foreigners_interaction_tt:0 "Trigger a random §YNeighbor Event§!."
festival_of_ideas_interaction_tt:0 "For every neighboring country with positive opinion of us and a different technology group, spend §R25§! Diplomatic Power to gain §G0.1§! Innovativeness, §G5§! Trust, and a §G+25§! opinion bonus with that country. The opinion bonus decays over §Y10 years§!."
squeeze_foreigners_interaction_tt:0 "Gain 1 year of production income, manpower, and sailors from provinces outside your culture group."
embrace_diversity_festival_of_ideas_opinion:0 "Festival of Ideas"

 # Warhammer accessibility reform localization
 # Monarchy accessibility reforms
 war_lady_of_the_lake_monarchy_reform:0 "Grail Monarchy"
 war_lady_of_the_lake_monarchy_reform_desc:0 "The court records Grail custom in the margins first, then discovers the margins have become law. Royal law now buys steadier revenue, loyal believers, and secure succession; the unpaid bill is costly regiments."
 war_myrmidia_monarchy_reform:0 "Myrmidian Monarchy"
 war_myrmidia_monarchy_reform_desc:0 "At council, nobody agrees why Myrmidian rule works, only that the old methods keep winning. The settlement favors harder morale, credible envoys, and more commanders, while hard-won consensus is left for quieter hands to explain."
 war_ursun_monarchy_reform:0 "Great Orthodoxy Monarchy"
 war_ursun_monarchy_reform_desc:0 "One decree carries a sermon, a threat, and a memory older than the present ruler. That is how royal law turns Great Orthodoxy authority into zealous conversion, religious unity, and stout garrisons, even as weaker trade gathers in the corners."
 war_cult_of_sigmar_monarchy_reform:0 "Sigmarite Monarchy"
 war_cult_of_sigmar_monarchy_reform_desc:0 "Sigmarite rule is taught through examples: who receives bread, who receives steel, and who is made to wait outside. From those lessons come harder morale, zealous conversion, and more commanders; from the waiting comes harsh heresy law."
 war_cult_of_ulric_religion_monarchy_reform:0 "Ulrican Monarchy"
 war_cult_of_ulric_religion_monarchy_reform_desc:0 "The crown is judged beside the winter hearth, where mercy sounds suspiciously like weakness. Ulrican law hardens loyal believers, morale, and commanders alike, while a stained reputation follows every snarled oath."
 war_cult_of_taal_religion_monarchy_reform:0 "Taalite Monarchy"
 war_cult_of_taal_religion_monarchy_reform_desc:0 "The reform begins with a small humiliation for anyone who wanted tidy government. Taalite habits are messier than statutes, but they deliver quick adaptation, swift recovery, and healed land and leave weaker trade behind them."
 war_old_world_cults_religion_monarchy_reform:0 "Imperial Pantheon Monarchy"
 war_old_world_cults_religion_monarchy_reform_desc:0 "In the capital this looks like policy; in the provinces it feels like an old bargain being enforced again. The court claims quiet provinces, managed heresy, and cultural bargains, accepting strained unity as the part no herald sings about."
 war_khornate_religion_monarchy_reform:0 "Khornate Monarchy"
 war_khornate_religion_monarchy_reform_desc:0 "A Khornate crown measures legitimacy by the distance between insult and slaughter. Brutal charges, lasting war memory, and more commanders flourish under that creed, while cold diplomacy is all that survives the audience chamber."
 war_nurglite_religion_monarchy_reform:0 "Nurglite Monarchy"
 war_nurglite_religion_monarchy_reform_desc:0 "A visitor might call it superstition until the taxmen, officers, and judges all obey it. Nurglite practice hardens into deadly terrain, hardy marches, and stout garrisons, though weaker taxes follow close enough to be noticed."
 war_tzeentchian_religion_monarchy_reform:0 "Tzeentchian Monarchy"
 war_tzeentchian_religion_monarchy_reform_desc:0 "A clerk revises the law, a cult cell revises the clerk, and the prophecy smiles at both drafts. In this court, that lesson becomes government: quick adaptation, clever scholarship, and subversion are cultivated deliberately, even when costly consensus makes the work uglier."
 war_slaaneshi_religion_monarchy_reform:0 "Slaaneshi Monarchy"
 war_slaaneshi_religion_monarchy_reform_desc:0 "The first supporters of this reform do not promise comfort. They promise swift recovery, speed, and many leaders, and they are candid enough to admit that loose discipline will come with it."
 war_chaos_undivided_religion_monarchy_reform:0 "Chaos Undivided Monarchy"
 war_chaos_undivided_religion_monarchy_reform_desc:0 "Four altars glare at one another across the hall, yet all agree the world below deserves ruin. From that habit grows a state of managed heresy, zealous conversion, and provocation; from the same root come strained unity."
 war_hashut_monarchy_reform:0 "Hashut Monarchy"
 war_hashut_monarchy_reform_desc:0 "The first law is hammered into iron while the second is branded onto a slave. From that habit grows a state of production, discipline, and fast works; from the same root come unrest."
 war_hobgoblin_religion_monarchy_reform:0 "Hobgoblin Shamanism Monarchy"
 war_hobgoblin_religion_monarchy_reform_desc:0 "The shaman blesses the crown, then asks whether the blessing can be sold twice. Cavalry weight, cheaper regiments, and easy claims come naturally to such rule, though a stained reputation is never far behind the bargain."
 war_the_great_maw_religion_monarchy_reform:0 "The Great Maw Monarchy"
 war_the_great_maw_religion_monarchy_reform_desc:0 "The sacred pit is never full, but a well-fed tyrant is easier to govern than a hungry congregation. From that habit grows a state of harder morale, quiet provinces, and rapid musters; from the same root come weaker taxes."
 war_asrai_cadai_monarchy_reform:0 "The Asrai Pantheon Monarchy"
 war_asrai_cadai_monarchy_reform_desc:0 "A trespasser hears leaves move before the arrow, and the council later calls it due process. Around the throne, seasonal courts and forest spirits decide what the realm may ask of its own; the result is home manpower, deadly terrain, and healed land, with weaker trade never far behind."
 war_cytharai_monarchy_reform:0 "The Cytharai Monarchy"
 war_cytharai_monarchy_reform_desc:0 "The knife on the altar is beautiful because it has already chosen a victim. That memory is built into appointments and punishments until terrifying blows, harder morale, and subversion feel natural and unrest feels almost inevitable."
 war_cadai_monarchy_reform:0 "The Cadai Monarchy"
 war_cadai_monarchy_reform_desc:0 "Royal law borrows the language of Cadai custom because plain commands no longer suffice. The borrowed language grants trade profit, naval nerve, and prosperity; it also teaches the realm to endure thin reserves."
 war_ancestor_gods_monarchy_reform:0 "Ancestor Gods Monarchy"
 war_ancestor_gods_monarchy_reform_desc:0 "There is a story told in every office now: ignore Ancestor Gods ways and the realm loosens in your hands. Believe it, and the state gains steadier institutions, loyal believers, and fast works, although slow scholarship becomes harder to hide."
 war_kislev_old_faith_monarchy_reform:0 "The Old Faiths Monarchy"
 war_kislev_old_faith_monarchy_reform_desc:0 "When the snow closes the road, the stone circle still knows who owes shelter and who owes blood. That memory is built into appointments and punishments until quiet provinces, steadier institutions, and healed land feel natural and weaker trade feels almost inevitable."
 war_the_one_faith_monarchy_reform:0 "The One Faith Monarchy"
 war_the_one_faith_monarchy_reform_desc:0 "The sermon begins with sunlight and ends with a magistrate asking who still doubts. From that habit grows a state of innovation, trade reach, and cultural bargains; from the same root come persecuted outsiders."
 war_nehekharan_pantheon_monarchy_reform:0 "Nehekharan Monarchy"
 war_nehekharan_pantheon_monarchy_reform_desc:0 "The reform is not a compromise so much as a verdict. Nehekharan authority wins the argument, bringing loyal believers, loyal estates, and quick monuments and making thin reserves a known cost of obedience."
 war_nagash_worship_monarchy_reform:0 "Nagashi Monarchy"
 war_nagash_worship_monarchy_reform_desc:0 "The recruiting officer carries a shovel, a scripture, and no concern for consent. Around the throne, necromancers turn graves, missionaries, and fear into instruments of state; the result is deadly terrain, missionaries, and rapid musters, with a stained reputation never far behind."
 war_horned_rat_monarchy_reform:0 "Horned Rat Monarchy"
 war_horned_rat_monarchy_reform_desc:0 "By the time the seal dries, old custom has already corrected the written order. The court uses that correction to secure loyal believers, quiet provinces, and subversion, even while leaky secrets trouble the ledger."
 war_old_ones_monarchy_reform:0 "Old Ones Monarchy"
 war_old_ones_monarchy_reform_desc:0 "Old Ones institutions work because they make private belief useful to public command. Here that means loyal believers, innovation, and quick monuments, with slow scholarship as the price of making the machinery move."
 war_enlightened_path_monarchy_reform:0 "Koa'Tzlanism Monarchy"
 war_enlightened_path_monarchy_reform_desc:0 "No one pretends this reform is clean. It lets the court draw output, steadier institutions, and prosperity from Koa'Tzlanism practice, and it leaves softer morale where cleaner states would expect applause."
 war_yin_yang_monarchy_reform:0 "Harmony Monarchy"
 war_yin_yang_monarchy_reform_desc:0 "The realm learns to hear Harmony law in ordinary sounds: bells, boots, oaths, and closed doors. Those sounds organize loyal believers, steadier revenue, and autonomy control, but they cannot drown out slow agreement."
 war_the_thousand_gods_monarchy_reform:0 "The Thousand Gods Monarchy"
 war_the_thousand_gods_monarchy_reform_desc:0 "What begins as deference becomes administration. The court puts the expectations of the Thousand Gods to work for trade reach, tolerated strangers, and cultural bargains, then lives with strained unity when the accounts are balanced."
 war_imperial_group_monarchy_reform:0 "Imperial Monarchy"
 war_imperial_group_monarchy_reform_desc:0 "A gun captain, a guildmaster, and an elector all claim the same tax is patriotic for different reasons. In this court, that lesson becomes government: production, harder morale, and autonomy control are cultivated deliberately, even when unrest makes the work uglier."
 war_kislevite_group_monarchy_reform:0 "Kislevite Monarchy"
 war_kislevite_group_monarchy_reform_desc:0 "Kislevite custom does not need to be gentle to be useful. It gives the court quiet provinces, swift recovery, and stout garrisons, and the same hardness explains why weaker trade follows."
 war_beastmen_group_monarchy_reform:0 "Beasts of Chaos Monarchy"
 war_beastmen_group_monarchy_reform_desc:0 "The reform's strength is that everyone recognizes the ritual before they understand the order. Once recognition does its work, royal law produces speed, harder morale, and provocation; misunderstanding leaves weaker tax collection."
 war_fimir_group_monarchy_reform:0 "Fimir Monarchy"
 war_fimir_group_monarchy_reform_desc:0 "Officials trained under this system learn the local answer before the legal one. That answer is Fimir in character, good for deadly terrain, steadier lines, and easy claims, and poor company for a stained reputation."
 war_chaos_dwarf_group_monarchy_reform:0 "Chaos Dwarf Monarchy"
 war_chaos_dwarf_group_monarchy_reform_desc:0 "The state stops trying to sand the edges off Chaos Dwarf rule. It sharpens them instead, winning production, firepower, and fast works while cutting itself on unrest."
 war_albionise_group_monarchy_reform:0 "Albionite Monarchy"
 war_albionise_group_monarchy_reform_desc:0 "This reform gives old authority a desk, a seal, and someone to blame. In return it provides deadly terrain, cheap development, and healed land, with slow scholarship arriving as the signature nobody can refuse."
 war_strigany_group_monarchy_reform:0 "Strigany Monarchy"
 war_strigany_group_monarchy_reform_desc:0 "A wagon court can be gone by dawn, leaving behind a fair bargain and three contradictory rumors. From that habit grows a state of speed, smooth appeasement, and cultural bargains; from the same root come a stained reputation."
 war_arabyan_group_monarchy_reform:0 "Arabyan Monarchy"
 war_arabyan_group_monarchy_reform_desc:0 "The sun sees every oath, but the caravan master still counts the guards twice. Such rule rewards people who understand the old signals, creating trade reach, cavalry weight, and easy claims, leaving outsiders to complain about hard-won consensus."
 war_hung_group_monarchy_reform:0 "Hung Monarchy"
 war_hung_group_monarchy_reform_desc:0 "A messenger who brings insult may be rewarded, provided the army rides before sunset. Such rule rewards people who understand the old signals, creating strong cavalry, larger hosts, and provocation, leaving outsiders to complain about cold diplomacy."
 war_kurgan_group_monarchy_reform:0 "Kurgan Monarchy"
 war_kurgan_group_monarchy_reform_desc:0 "The court does not make Kurgan custom respectable; it makes it functional. That difference matters, because it yields swift recovery, brutal charges, and provocation and still leaves cold diplomacy."
 war_darkland_human_group_monarchy_reform:0 "Dark Lands Human Monarchy"
 war_darkland_human_group_monarchy_reform_desc:0 "A realm can survive strange laws if the strange laws answer real needs. Here Dark Lands Human rule answers with trade reach, credible envoys, and fast works, while unrest reminds everyone how strange the bargain remains."
 war_amazon_group_monarchy_reform:0 "Amazon Monarchy"
 war_amazon_group_monarchy_reform_desc:0 "The old rite enters government through the side door and soon owns the keys. Under it, the realm gains infantry bite, deadly terrain, and more commanders; under the same lock, it accepts a stained reputation."
 war_lizardmen_group_monarchy_reform:0 "Lizardmen Monarchy"
 war_lizardmen_group_monarchy_reform_desc:0 "The useful parts of Lizardmen tradition are pulled close, named policy, and guarded jealously. The result is innovation, loyal believers, and quick monuments, though a stained reputation proves harder to domesticate."
 war_snakefolk_cg_monarchy_reform:0 "Snakefolk Monarchy"
 war_snakefolk_cg_monarchy_reform_desc:0 "The court smiles with too many teeth, and the jungle path behind it is already closing. In this court, that lesson becomes government: spycraft, deadly terrain, and subversion are cultivated deliberately, even when unrest makes the work uglier."
 war_indish_cg_monarchy_reform:0 "Indish Monarchy"
 war_indish_cg_monarchy_reform_desc:0 "Monsoon markets, temple bells, and caste bargains can fill a capital with ten kinds of authority. Such rule rewards people who understand the old signals, creating accepted peoples, trade reach, and cultural bargains, leaving outsiders to complain about strained unity."
 war_eastern_beastfolk_cg_monarchy_reform:0 "Eastern Beastfolk Monarchy"
 war_eastern_beastfolk_cg_monarchy_reform_desc:0 "This is not reform by lecture but by habit. The court repeats what already commands respect, shaping speed, brutal charges, and more commanders while a stained reputation settles into the foundation."
 war_nipponese_cg_monarchy_reform:0 "Nipponese Monarchy"
 war_nipponese_cg_monarchy_reform_desc:0 "A claim can sleep for years in a family archive, guarded by retainers who never forgot it. Such rule rewards people who understand the old signals, creating discipline, watchful agents, and lasting claims, leaving outsiders to complain about fewer diplomatic ties."
 war_vampire_coast_cg_monarchy_reform:0 "Vampire Coast Monarchy"
 war_vampire_coast_cg_monarchy_reform_desc:0 "The crown smells of salt, grave-mold, and stolen varnish. Privateers and bold admirals answer it eagerly, giving naval nerve and cheap command at sea while weaker taxes rot through the inland books."
 war_old_ones_culture_group_monarchy_reform:0 "Old Ones Monarchy"
 war_old_ones_culture_group_monarchy_reform_desc:0 "Old Ones order offers a hard bargain and then dares the realm to refuse it. Most do not, because innovation, institution spread, and quick monuments are real, even if slow scholarship is real as well."
 # Theocracy accessibility reforms
 war_lady_of_the_lake_theocracy_reform:0 "Grail Theocracy"
 war_lady_of_the_lake_theocracy_reform_desc:0 "At the chapel door, taxes are blessed with the same water that consecrates the lance. From that habit grows a state of steadier revenue, loyal believers, and prosperity; from the same root come expensive armies."
 war_myrmidia_theocracy_reform:0 "Myrmidian Theocracy"
 war_myrmidia_theocracy_reform_desc:0 "Before the banner moves, the map table is already crowded with captains, envoys, and priestesses of strategy. That memory is built into appointments and punishments until harder morale, credible envoys, and stout garrisons feel natural and weaker tax collection feels almost inevitable."
 war_ursun_theocracy_reform:0 "Great Orthodoxy Theocracy"
 war_ursun_theocracy_reform_desc:0 "The new law keeps one hand on the ledger and the other on an older symbol of power. Together they purchase zealous conversion, religious unity, and loyal believers, though poor trade returns keep appearing in the receipt."
 war_cult_of_sigmar_theocracy_reform:0 "Sigmarite Theocracy"
 war_cult_of_sigmar_theocracy_reform_desc:0 "Hammer-priests bless the musters in market squares where cowardice is named almost as loudly as heresy. From that habit grows a state of harder morale, zealous conversion, and stout garrisons; from the same root come cold diplomacy."
 war_cult_of_ulric_religion_theocracy_reform:0 "Ulrican Theocracy"
 war_cult_of_ulric_religion_theocracy_reform_desc:0 "Some reforms soften a realm; this one teaches it a more useful kind of stubbornness. Ulrican methods bring loyal believers, harder morale, and stout garrisons, with cold diplomacy left as the bruise."
 war_cult_of_taal_religion_theocracy_reform:0 "Taalite Theocracy"
 war_cult_of_taal_religion_theocracy_reform_desc:0 "Hunters, foresters, and river-priests read policy in tracks, floods, and the health of the fields. Such rule rewards people who understand the old signals, creating quick adaptation, swift recovery, and prosperity, leaving outsiders to complain about slow scholarship."
 war_old_world_cults_religion_theocracy_reform:0 "Imperial Pantheon Theocracy"
 war_old_world_cults_religion_theocracy_reform_desc:0 "The priesthood asks what the people already fear, honor, or obey, then builds from there. That answer gives quiet provinces, managed heresy, and prosperity, while weaker conversion marks the limits of the design."
 war_vampiric_theocracy_reform:0 "Vampiric Theocracy"
 war_vampiric_theocracy_reform_desc:0 "A practical ruler can dislike Vampiric custom and still need it. The reform admits as much, turning necessity into diplomats, steadier revenue, and subversion and leaving unrest as the insult."
 war_khornate_religion_theocracy_reform:0 "Khornate Theocracy"
 war_khornate_religion_theocracy_reform_desc:0 "Once this system takes root, opposition has to argue against memory as well as law. Memory helps provide brutal charges, lasting war memory, and provocation; law is left to manage a stained reputation."
 war_nurglite_religion_theocracy_reform:0 "Nurglite Theocracy"
 war_nurglite_religion_theocracy_reform_desc:0 "Sacred office becomes a stage where Nurglite authority performs until performance turns into power. The performance gives deadly terrain, hardy marches, and healed land, and the power casts weakened production as its shadow."
 war_tzeentchian_religion_theocracy_reform:0 "Tzeentchian Theocracy"
 war_tzeentchian_religion_theocracy_reform_desc:0 "This settlement smells of old halls, hard bargains, and ink dried over objections. It is worth the trouble for quick adaptation, clever scholarship, and easy claims, though unrest remains part of the settlement."
 war_slaaneshi_religion_theocracy_reform:0 "Slaaneshi Theocracy"
 war_slaaneshi_religion_theocracy_reform_desc:0 "The reform works because it lets the realm recognize itself in the machinery of rule. Recognition becomes swift recovery, speed, and prosperity; the machinery still grinds out softer morale."
 war_norscan_theocracy_reform:0 "Norscan Gods Theocracy"
 war_norscan_theocracy_reform_desc:0 "A feast, a raid, and a funeral can all be the same public meeting if the gods are pleased. From that habit grows a state of larger hosts, larger fleets, and cheap admirals; from the same root come poor trade returns."
 war_chaos_undivided_religion_theocracy_reform:0 "Chaos Undivided Theocracy"
 war_chaos_undivided_religion_theocracy_reform_desc:0 "Nobody has to love this arrangement for it to bite. Chaos Undivided custom supplies managed heresy, zealous conversion, and more commanders, while unrest is what the bitten remember."
 war_hobgoblin_religion_theocracy_reform:0 "Hobgoblin Shamanism Theocracy"
 war_hobgoblin_religion_theocracy_reform_desc:0 "The law is written after the custom, not before it. That reversal gives the priesthood cavalry weight, cheaper regiments, and lasting claims, but it also leaves leaky secrets embedded in the text."
 war_the_great_maw_religion_theocracy_reform:0 "The Great Maw Theocracy"
 war_the_great_maw_religion_theocracy_reform_desc:0 "This reform takes a local certainty and makes it national. The certainty produces harder morale, quiet provinces, and provocation; the act of making it national produces weakened production."
 war_asrai_cadai_theocracy_reform:0 "The Asrai Pantheon Theocracy"
 war_asrai_cadai_theocracy_reform_desc:0 "Where other states see contradiction, this one sees a tool with two edges. One edge cuts toward home manpower, deadly terrain, and prosperity; the other draws fewer diplomatic ties."
 war_cytharai_theocracy_reform:0 "The Cytharai Theocracy"
 war_cytharai_theocracy_reform_desc:0 "The priesthood learns to govern by leaning into what outsiders misunderstand. Its reward is terrifying blows, harder morale, and easy claims, and its recurring difficulty is a stained reputation."
 war_cadai_theocracy_reform:0 "The Cadai Theocracy"
 war_cadai_theocracy_reform_desc:0 "Lanterns burn above the harbor while nobles argue over whether profit can be made graceful. From that habit grows a state of trade profit, naval nerve, and cultural bargains; from the same root come expensive armies."
 war_ancestor_gods_theocracy_reform:0 "Ancestor Gods Theocracy"
 war_ancestor_gods_theocracy_reform_desc:0 "The policy sounds new only to those who never listened to the old oaths. Properly harnessed, those oaths yield steadier institutions, loyal believers, and quick monuments, although sluggish musters follow the harness marks."
 war_kislev_old_faith_theocracy_reform:0 "The Old Faiths Theocracy"
 war_kislev_old_faith_theocracy_reform_desc:0 "The Old Faith is made administrative here without being made tame. It strengthens quiet provinces, steadier institutions, and stout garrisons, and it leaves slow scholarship as proof that tameness was never the point."
 war_nagash_worship_theocracy_reform:0 "Nagashi Theocracy"
 war_nagash_worship_theocracy_reform_desc:0 "The reform moves through the realm like a familiar song with harsher verses added. People obey the tune, granting deadly terrain, missionaries, and subversion, while unrest lingers in the harsher lines."
 war_horned_rat_theocracy_reform:0 "Horned Rat Theocracy"
 war_horned_rat_theocracy_reform_desc:0 "Every appointment under this system carries an expectation older than the office. Those expectations reward loyal believers, quiet provinces, and easy claims, but they do not make room easily for leaky secrets."
 war_enlightened_path_theocracy_reform:0 "Koa'Tzlanism Theocracy"
 war_enlightened_path_theocracy_reform_desc:0 "Koa'Tzlan teachers turn obedience into a quiet technology of the soul. Output, steadier institutions, and cultural bargains deepen under their instruction, while loose discipline reveals what contemplation cannot drill."
 war_yin_yang_theocracy_reform:0 "Harmony Theocracy"
 war_yin_yang_theocracy_reform_desc:0 "A tax decree is placed beside an omen chart, because imbalance in either can topple a province. In this temple court, that lesson becomes government: loyal believers, steadier revenue, and prosperity are cultivated deliberately, even when unrest makes the work uglier."
 war_the_thousand_gods_theocracy_reform:0 "The Thousand Gods Theocracy"
 war_the_thousand_gods_theocracy_reform_desc:0 "The state takes what was once implicit and gives it a uniform, a seal, and a budget. The Thousand Gods practice then delivers trade reach, tolerated strangers, and prosperity, along with slower consensus."
 war_imperial_group_theocracy_reform:0 "Imperial Theocracy"
 war_imperial_group_theocracy_reform_desc:0 "The priesthood builds around the pressure point instead of pretending it is not there. Pressed correctly, Imperial custom yields production, harder morale, and stout garrisons; pressed too hard, it reveals costly consensus."
 war_estalian_group_theocracy_reform:0 "Estalian Theocracy"
 war_estalian_group_theocracy_reform_desc:0 "The reform has the confidence of something that has already survived worse rulers. It offers trade reach, naval nerve, and blockades, and it treats slow agreement as the old scar that proves the lesson."
 war_bretonnian_group_theocracy_reform:0 "Bretonnian Theocracy"
 war_bretonnian_group_theocracy_reform_desc:0 "The chapel keeps a lance above the altar, not as ornament but as a reminder that prayer may ride armed. Sacred office turns Bretonnian chivalry into strong cavalry, loyal believers, and strong claims, while expensive armies test the treasury like a penance."
 war_kislevite_group_theocracy_reform:0 "Kislevite Theocracy"
 war_kislevite_group_theocracy_reform_desc:0 "The boyar signs the order with frost on the ink and a raid report under his elbow. Around the altar, ice roads, frontier musters, and stubborn households make survival administrative; the result is quiet provinces, swift recovery, and healed land, with poor trade returns never far behind."
 war_tilean_group_theocracy_reform:0 "Tilean Theocracy"
 war_tilean_group_theocracy_reform_desc:0 "Tilean law enters the record books with mud, incense, or blood still on its shoes. The record books gain mercenary discipline, trade reach, and easy claims, but they also inherit hard-won consensus."
 war_norse_group_theocracy_reform:0 "Norscan Theocracy"
 war_norse_group_theocracy_reform_desc:0 "The priesthood makes a discipline out of what used to be handled by instinct. Discipline brings swift recovery, larger fleets, and cheap admirals; instinct, not entirely banished, leaves poor trade returns."
 war_asrai_group_theocracy_reform:0 "Wood Elves Theocracy"
 war_asrai_group_theocracy_reform_desc:0 "The glade votes in silence, and the forest answers before the outsiders know there was a question. That memory is built into appointments and punishments until deadly terrain, home manpower, and prosperity feel natural and fewer diplomatic ties feel almost inevitable."
 war_beastmen_group_theocracy_reform:0 "Beasts of Chaos Theocracy"
 war_beastmen_group_theocracy_reform_desc:0 "The herdstone is a parliament if enough rivals have been broken against it. Such rule rewards people who understand the old signals, creating speed, harder morale, and frontier pressure, leaving outsiders to complain about a stained reputation."
 war_asur_group_theocracy_reform:0 "Asur Theocracy"
 war_asur_group_theocracy_reform_desc:0 "An Asur altar can sound like a court, a school, and a fleet office in the same breath. Credible envoys, naval nerve, and cultural bargains gleam from that refinement, though expensive armies carry the less graceful burden."
 war_druchii_group_theocracy_reform:0 "Druchii Theocracy"
 war_druchii_group_theocracy_reform_desc:0 "This reform does not ask the realm to become simpler. It teaches the realm to use its complications for spycraft, terrifying blows, and easy claims, even when a stained reputation becomes the cost of doing so."
 war_fimir_group_theocracy_reform:0 "Fimir Theocracy"
 war_fimir_group_theocracy_reform_desc:0 "The decisive argument is not spoken in court; it is carried by custom, fear, and useful precedent. Together they create deadly terrain, steadier lines, and subversion, with weaker trade attached to the precedent."
 war_dwarf_group_theocracy_reform:0 "Dwarfen Theocracy"
 war_dwarf_group_theocracy_reform_desc:0 "The guild seal is struck only after the engineer, thane, and ancestor record all stop arguing. Around the altar, stone gates and clan ledgers build durable industry at deliberate speed; the result is production, fortitude, and quick monuments, with sluggish musters never far behind."
 war_albionise_group_theocracy_reform:0 "Albionite Theocracy"
 war_albionise_group_theocracy_reform_desc:0 "A lesser reform would hide the bargain. This one names deadly terrain, cheap development, and stout garrisons as the prize and lets weaker trade stand openly beside it."
 war_strigany_group_theocracy_reform:0 "Strigany Theocracy"
 war_strigany_group_theocracy_reform_desc:0 "The state reaches for Strigany tradition because ordinary administration cannot reach far enough. It gains speed, smooth appeasement, and healed land, though weaker taxes show where the reach becomes a strain."
 war_hung_group_theocracy_reform:0 "Hung Theocracy"
 war_hung_group_theocracy_reform_desc:0 "The reform's genius is practical rather than polite. It turns Hung expectation into strong cavalry, larger hosts, and more commanders, while a stained reputation becomes the unavoidable abrasion."
 war_kurgan_group_theocracy_reform:0 "Kurgan Theocracy"
 war_kurgan_group_theocracy_reform_desc:0 "In the hands of the priesthood, old practice becomes a lever. Pull it and the realm receives swift recovery, brutal charges, and more commanders; pull it long enough and a stained reputation appears."
 war_darkland_human_group_theocracy_reform:0 "Dark Lands Human Theocracy"
 war_darkland_human_group_theocracy_reform_desc:0 "In the Dark Lands, even sacred promises are weighed like ore. Trade reach, credible envoys, and easy claims grow from that hard bargaining, while unrest follows every desperate clause."
 war_ogre_group_theocracy_reform:0 "Ogre Theocracy"
 war_ogre_group_theocracy_reform_desc:0 "This order carries its own folklore, which makes it easier to obey and harder to question. Folklore helps secure brutal charges, harder morale, and provocation, while weakened production survives in the questions left unasked."
 war_amazon_group_theocracy_reform:0 "Amazon Theocracy"
 war_amazon_group_theocracy_reform_desc:0 "The jungle path is a drill ground, a shrine road, and a warning to strangers. Around the altar, ambush discipline and veteran captains guard the homeland fiercely; the result is infantry bite, deadly terrain, and stout garrisons, with weaker trade never far behind."
 war_hobgoblin_group_theocracy_reform:0 "Hobgoblin Theocracy"
 war_hobgoblin_group_theocracy_reform_desc:0 "The lesser khans agree that betrayal is shameful unless it works. Around the altar, wolf riders and profitable treachery make armies cheap and mobile; the result is cavalry weight, cheaper regiments, and lasting claims, with leaky secrets never far behind."
 war_skaven_group_theocracy_reform:0 "Skaven Theocracy"
 war_skaven_group_theocracy_reform_desc:0 "A bell rings below the floorboards, and three priests insist they meant it to happen. Skaven rites make clever scholarship, cheaper regiments, and easy claims terrifyingly efficient, though leaky secrets crawl out with every success."
 war_cathayan_cg_theocracy_reform:0 "Cathayan Theocracy"
 war_cathayan_cg_theocracy_reform_desc:0 "Cathayan rule has never needed elegance to command respect. The reform spends that respect on governing reach, steadier revenue, and fast works, and pays for it with unrest."
 war_snakefolk_cg_theocracy_reform:0 "Snakefolk Theocracy"
 war_snakefolk_cg_theocracy_reform_desc:0 "The priesthood translates an old way of living into offices and obligations. Translation gives the realm spycraft, deadly terrain, and easy claims, though a stained reputation clings to every hidden clause."
 war_indish_cg_theocracy_reform:0 "Indish Theocracy"
 war_indish_cg_theocracy_reform_desc:0 "People remember who protected them, who frightened them, and who made the harvest count. This reform uses that memory for accepted peoples, trade reach, and prosperity, leaving costly consensus in the aftertaste."
 war_eastern_beastfolk_cg_theocracy_reform:0 "Eastern Beastfolk Theocracy"
 war_eastern_beastfolk_cg_theocracy_reform_desc:0 "The shrine pack moves before the dust settles, led by champions chosen for speed and claws. Such rule rewards people who understand the old signals, creating speed, brutal charges, and stout garrisons, leaving outsiders to complain about weaker trade."
 war_nipponese_cg_theocracy_reform:0 "Nipponese Theocracy"
 war_nipponese_cg_theocracy_reform_desc:0 "The law arrives dressed in local colors because naked authority would be ignored. Dressed properly, it commands discipline, watchful agents, and stout garrisons; underneath, it still carries cold diplomacy."
 war_vampire_coast_cg_theocracy_reform:0 "Vampire Coast Theocracy"
 war_vampire_coast_cg_theocracy_reform_desc:0 "What looks archaic from outside feels brutally current to those who must obey it. The result is naval nerve, privateers, and blockades, balanced by a stained reputation."
 war_old_ones_culture_group_theocracy_reform:0 "Old Ones Theocracy"
 war_old_ones_culture_group_theocracy_reform_desc:0 "Star charts and geomantic tools survive in hands that only partly understand their makers. Around the altar, ancient methods spread knowledge through surviving temple craft; the result is innovation, institution spread, and stout garrisons, with a stained reputation never far behind."
 # Republic accessibility reforms
 war_lady_of_the_lake_republic_reform:0 "Grail Republic"
 war_lady_of_the_lake_republic_reform_desc:0 "In Grail hands, the same lesson is carried by different witnesses: a cautious elder, a paid scribe, and someone who remembers the last disaster. Among these magistrates, that lesson becomes government: steadier revenue, loyal believers, and cultural bargains are cultivated deliberately, even when slow agreement makes the work uglier."
 war_myrmidia_republic_reform:0 "Myrmidian Republic"
 war_myrmidia_republic_reform_desc:0 "The councils accept that legitimacy sometimes comes from the older, stranger source. They turn that source toward harder morale, credible envoys, and provocation, while corruption remains the warning label."
 war_ursun_republic_reform:0 "Great Orthodoxy Republic"
 war_ursun_republic_reform_desc:0 "The reform tightens around the realm's favorite certainty until it becomes policy. Policy brings zealous conversion, religious unity, and prosperity; certainty brings hard-won consensus."
 war_cult_of_sigmar_republic_reform:0 "Sigmarite Republic"
 war_cult_of_sigmar_republic_reform_desc:0 "The republic version of Sigmarite rule begins with a sharper question: who benefits if the old custom is ignored. Among these magistrates, that lesson becomes government: harder morale, zealous conversion, and provocation are cultivated deliberately, even when unrest makes the work uglier."
 war_cult_of_ulric_religion_republic_reform:0 "Ulrican Republic"
 war_cult_of_ulric_religion_republic_reform_desc:0 "Judgment is spoken beside the hearth, but everyone knows the wolf waits outside for the weak. Around the council hall, hard oaths, warrior prestige, and fierce local loyalty matter more than polished diplomacy; the result is loyal believers, harder morale, and provocation, with poor trade returns never far behind."
 war_cult_of_taal_religion_republic_reform:0 "Taalite Republic"
 war_cult_of_taal_religion_republic_reform_desc:0 "This arrangement is half memory and half instrument. The memory makes it acceptable, the instrument makes quick adaptation, swift recovery, and stout garrisons possible, and together they leave weaker tax collection."
 war_old_world_cults_religion_republic_reform:0 "Imperial Pantheon Republic"
 war_old_world_cults_religion_republic_reform_desc:0 "The state learns the difference between honoring custom and being ruled by it, then chooses both. That choice yields quiet provinces, managed heresy, and loyal believers, with costly consensus close behind."
 war_vampiric_republic_reform:0 "Vampiric Republic"
 war_vampiric_republic_reform_desc:0 "The councils make peace with an inconvenient truth: Vampiric authority already governs much of daily life. Formalizing it grants diplomats, steadier revenue, and easy claims, but also formalizes a stained reputation."
 war_khornate_religion_republic_reform:0 "Khornate Republic"
 war_khornate_religion_republic_reform_desc:0 "The court does not applaud speeches; it counts skulls, scars, and the courage to answer insult with murder. Around the council hall, office belongs to those who prove themselves in slaughter; the result is brutal charges, lasting war memory, and rapid musters, with poor trade returns never far behind."
 war_nurglite_religion_republic_reform:0 "Nurglite Republic"
 war_nurglite_religion_republic_reform_desc:0 "The garden blooms in rot, and every besieger learns too late that decay has a garrison of its own. That memory is built into appointments and punishments until deadly terrain, hardy marches, and rapid musters feel natural and weaker trade feels almost inevitable."
 war_tzeentchian_religion_republic_reform:0 "Tzeentchian Republic"
 war_tzeentchian_religion_republic_reform_desc:0 "Here, Tzeentchian authority enters through a side passage, smelling of wax, rain, and unfinished argument. Such rule rewards people who understand the old signals, creating quick adaptation, clever scholarship, and many leaders, leaving outsiders to complain about leaky secrets."
 war_slaaneshi_religion_republic_reform:0 "Slaaneshi Republic"
 war_slaaneshi_religion_republic_reform_desc:0 "In this system, the old sign is not decoration; it is authorization. Once raised over the offices, it secures swift recovery, speed, and cultural bargains and exposes slow agreement."
 war_norscan_republic_reform:0 "Norscan Gods Republic"
 war_norscan_republic_reform_desc:0 "The first order under this reform is less a command than a test of who still recognizes Norscan Gods signs. Among these magistrates, that lesson becomes government: larger hosts, larger fleets, and blockades are cultivated deliberately, even when cold diplomacy makes the work uglier."
 war_chaos_undivided_religion_republic_reform:0 "Chaos Undivided Republic"
 war_chaos_undivided_religion_republic_reform_desc:0 "The reform gives the realm a story about why obedience is not surrender. The story supports managed heresy, zealous conversion, and subversion, while cold diplomacy is the chapter no one reads aloud."
 war_hashut_republic_reform:0 "Hashut Republic"
 war_hashut_republic_reform_desc:0 "The bargain is remembered because it hurts in useful places. It gives production, discipline, and stout garrisons, and the hurt takes the form of weaker trade."
 war_gork_n_mork_religion_republic_reform:0 "Gork n' Mork Republic"
 war_gork_n_mork_religion_republic_reform_desc:0 "The councils take a custom built for survival and ask it to run a state. It manages harder morale, swift recovery, and rapid musters, though weaker trade shows where survival and statecraft quarrel."
 war_hobgoblin_religion_republic_reform:0 "Hobgoblin Shamanism Republic"
 war_hobgoblin_religion_republic_reform_desc:0 "A wolf-khan swears by the spirits, then asks what the oath is worth if sold before sunset. Around the council hall, steppe shamans bless bargains, ambushes, and profitable treachery; the result is cavalry weight, cheaper regiments, and subversion, with unrest never far behind."
 war_the_great_maw_religion_republic_reform:0 "The Great Maw Republic"
 war_the_great_maw_religion_republic_reform_desc:0 "This is governance by inherited reflex, sharpened until it can sign orders. The reflex produces harder morale, quiet provinces, and stout garrisons; the sharpening produces a stained reputation."
 war_asrai_cadai_republic_reform:0 "The Asrai Pantheon Republic"
 war_asrai_cadai_republic_reform_desc:0 "The reform makes old loyalty legible to officials without making it harmless. Legibility brings home manpower, deadly terrain, and cultural bargains, and the remaining danger brings slow scholarship."
 war_cytharai_republic_reform:0 "The Cytharai Republic"
 war_cytharai_republic_reform_desc:0 "Cytharai office is won by those who can make cruelty look like policy. Terrifying blows, harder morale, and provocation become public virtues, though hard-won consensus must be dragged through the blood after them."
 war_cadai_republic_reform:0 "The Cadai Republic"
 war_cadai_republic_reform_desc:0 "By dusk, the reform has already changed three ordinary habits: who speaks first, who waits, and who pays. Among these magistrates, that lesson becomes government: trade profit, naval nerve, and quick monuments are cultivated deliberately, even when weaker tax collection makes the work uglier."
 war_ancestor_gods_republic_reform:0 "Ancestor Gods Republic"
 war_ancestor_gods_republic_reform_desc:0 "No gate is raised and no law is sealed until the dead have been given their due. The magistrates turn that debt into steadier institutions, loyal believers, and stout garrisons, while weaker trade is accepted as respect paid in coin."
 war_druidism_republic_reform:0 "Druidic Republic"
 war_druidism_republic_reform_desc:0 "Druidic custom becomes a road through difficult country: narrow, known, and hard to replace. It carries cheap development, faithful advisers, and stout garrisons, but every passage pays a stained reputation."
 war_kislev_old_faith_republic_reform:0 "The Old Faiths Republic"
 war_kislev_old_faith_republic_reform_desc:0 "The Old Faith keeps its minutes in frost, root, and stories told beside standing stones. Quiet provinces, steadier institutions, and prosperity follow its patient authority, while a stained reputation clings to what outsiders cannot map."
 war_nagash_worship_republic_reform:0 "Nagashi Republic"
 war_nagash_worship_republic_reform_desc:0 "The councils do not invent legitimacy here; they harvest it. The harvest is deadly terrain, missionaries, and quick monuments, with weaker taxes left among the stubble."
 war_horned_rat_republic_reform:0 "Horned Rat Republic"
 war_horned_rat_republic_reform_desc:0 "Every tunnel has a watcher, every watcher has a rival, and the Grey Seer blesses both. That memory is built into appointments and punishments until loyal believers, quiet provinces, and rapid musters feel natural and costly consensus feels almost inevitable."
 war_old_ones_republic_reform:0 "Old Ones Republic"
 war_old_ones_republic_reform_desc:0 "A cracked plaque can overrule a living ruler if the Skinks read the stars correctly. The magistrates follow those broken instructions toward loyal believers, innovation, and prosperity, even when thin reserves make the plan feel older than mercy."
 war_enlightened_path_republic_reform:0 "Koa'Tzlanism Republic"
 war_enlightened_path_republic_reform_desc:0 "The system rewards anyone who can read the old signs before the written order arrives. Those readers produce output, steadier institutions, and loyal believers; everyone else notices softer morale."
 war_yin_yang_republic_reform:0 "Harmony Republic"
 war_yin_yang_republic_reform_desc:0 "The councils keep a private list of customs too useful to abolish, and Harmony practice sits near the top. From that habit grows a state of loyal believers, steadier revenue, and cultural bargains; from the same root come weaker trade."
 war_the_thousand_gods_republic_reform:0 "The Thousand Gods Republic"
 war_the_thousand_gods_republic_reform_desc:0 "A state built this way has fewer illusions about virtue and more uses for obedience. It gains trade reach, tolerated strangers, and loyal believers, while weaker conversion becomes the moral weather."
 war_imperial_group_republic_reform:0 "Imperial Republic"
 war_imperial_group_republic_reform_desc:0 "A stranger sees ceremony; locals see the old machinery being given new teeth. Such rule rewards people who understand the old signals, creating production, harder morale, and many leaders, leaving outsiders to complain about fewer diplomatic ties."
 war_bretonnian_group_republic_reform:0 "Bretonnian Republic"
 war_bretonnian_group_republic_reform_desc:0 "The reform survives because it makes sense to the people who matter locally, even when outsiders sneer. Local sense becomes strong cavalry, loyal believers, and cultural bargains; outsider suspicion becomes weaker trade."
 war_greenskins_group_republic_reform:0 "Greenskins Republic"
 war_greenskins_group_republic_reform_desc:0 "A Greenskin assembly ends when the loudest plan has survived the most punches. Harder morale, loot, and rapid musters come roaring out of that method, while weaker trade is what happens to anything too delicate to shove back."
 war_kislevite_group_republic_reform:0 "Kislevite Republic"
 war_kislevite_group_republic_reform_desc:0 "The councils bind law to habit until defying one feels like defying both. That binding creates quiet provinces, swift recovery, and provocation, but it also knots in a stained reputation."
 war_norse_group_republic_reform:0 "Norscan Republic"
 war_norse_group_republic_reform_desc:0 "A law is remembered best if it rhymes, bleeds, and can be shouted from a prow. The magistrates turn saga-law into swift recovery, larger fleets, and blockades, while cold diplomacy is what remains after the song ends."
 war_asrai_group_republic_reform:0 "Wood Elves Republic"
 war_asrai_group_republic_reform_desc:0 "This reform is a lesson in making rough material carry official weight. The material carries deadly terrain, home manpower, and cultural bargains; its roughness remains as slow scholarship."
 war_beastmen_group_republic_reform:0 "Beasts of Chaos Republic"
 war_beastmen_group_republic_reform_desc:0 "The assembly survives by letting the loudest challenge become tomorrow's agenda. Raids and brutal trials keep the horde moving toward speed, harder morale, and rapid musters, while poor trade returns mark everything too civilized to trample."
 war_druchii_group_republic_reform:0 "Druchii Republic"
 war_druchii_group_republic_reform_desc:0 "A Druchii council can pass a naval budget and arrange three assassinations before breakfast. Around the council hall, black arks, slave pens, and noble vendettas make cruelty precise; the result is spycraft, terrifying blows, and provocation, with slow agreement never far behind."
 war_fimir_group_republic_reform:0 "Fimir Republic"
 war_fimir_group_republic_reform_desc:0 "By the time the fog lifts, the border marker, the witness, and the patrol are all missing. Public law learns from that disappearance, gaining deadly terrain, steadier lines, and stout garrisons while unrest seeps through the mist."
 war_dwarf_group_republic_reform:0 "Dwarfen Republic"
 war_dwarf_group_republic_reform_desc:0 "The realm's old instincts are not retired, only given clerks. With clerks behind them, they provide production, fortitude, and stout garrisons and document weaker trade."
 war_chaos_dwarf_group_republic_reform:0 "Chaos Dwarf Republic"
 war_chaos_dwarf_group_republic_reform_desc:0 "The furnace bell is both work order and warning; either way, someone below obeys. The magistrates build production, firepower, and stout garrisons from that obedience, while weaker trade proves that fear is a poor merchant."
 war_albionise_group_republic_reform:0 "Albionite Republic"
 war_albionise_group_republic_reform_desc:0 "The councils turn a familiar pressure into an administrative rhythm. The rhythm sustains deadly terrain, cheap development, and prosperity, though a stained reputation keeps time beneath it."
 war_strigany_group_republic_reform:0 "Strigany Republic"
 war_strigany_group_republic_reform_desc:0 "The reform looks backward for permission and forward for results. Permission gives it authority; results mean speed, smooth appeasement, and safe passages; the backward glance leaves weaker trade."
 war_hung_group_republic_reform:0 "Hung Republic"
 war_hung_group_republic_reform_desc:0 "What once depended on charisma is made repeatable, inspected, and taxed. Repeatability gives strong cavalry, larger hosts, and rapid musters, while inspection exposes weaker trade."
 war_kurgan_group_republic_reform:0 "Kurgan Republic"
 war_kurgan_group_republic_reform_desc:0 "The councils let custom sit beside statute and then pretend not to notice which one speaks louder. The louder voice grants swift recovery, brutal charges, and rapid musters, but it also demands weaker trade."
 war_darkland_human_group_republic_reform:0 "Dark Lands Human Republic"
 war_darkland_human_group_republic_reform_desc:0 "A realm ruled this way learns to mistake endurance for agreement. That mistake is useful for trade reach, credible envoys, and rapid musters, and costly through weaker taxes."
 war_ogre_group_republic_reform:0 "Ogre Republic"
 war_ogre_group_republic_reform_desc:0 "Negotiations improve once everyone agrees who is lunch and who is paying for it. Such rule rewards people who understand the old signals, creating brutal charges, harder morale, and stout garrisons, leaving outsiders to complain about a stained reputation."
 war_amazon_group_republic_reform:0 "Amazon Republic"
 war_amazon_group_republic_reform_desc:0 "The reform gives old practice permission to be ambitious. Ambition produces infantry bite, deadly terrain, and rapid musters; old practice keeps hard-won consensus attached."
 war_hobgoblin_group_republic_reform:0 "Hobgoblin Republic"
 war_hobgoblin_group_republic_reform_desc:0 "The councils use Hobgoblin tradition as a map through dangerous politics. It leads to cavalry weight, cheaper regiments, and subversion, but the route passes through unrest."
 war_skaven_group_republic_reform:0 "Skaven Republic"
 war_skaven_group_republic_reform_desc:0 "The arrangement is not elegant, but it is memorable enough to be obeyed. Obedience supplies clever scholarship, cheaper regiments, and rapid musters; memory preserves slower consensus."
 war_lizardmen_group_republic_reform:0 "Lizardmen Republic"
 war_lizardmen_group_republic_reform_desc:0 "A Skink clerk scratches the order onto a tablet while Saurus guards wait without blinking. From that habit grows a state of innovation, loyal believers, and healed land; from the same root come weaker trade."
 war_cathayan_cg_republic_reform:0 "Cathayan Republic"
 war_cathayan_cg_republic_reform_desc:0 "A stamp in Wei-Jin can move grain, soldiers, and three offended magistrates before noon. Around the council hall, mandarins and tax registers make hierarchy vast and precise; the result is governing reach, steadier revenue, and prosperity, with strained diplomacy never far behind."
 war_snakefolk_cg_republic_reform:0 "Snakefolk Republic"
 war_snakefolk_cg_republic_reform_desc:0 "Snakefolk legitimacy is not polished here, only made harder to disobey. Such rule rewards people who understand the old signals, creating spycraft, deadly terrain, and cultural bargains, leaving outsiders to complain about costly consensus."
 war_indish_cg_republic_reform:0 "Indish Republic"
 war_indish_cg_republic_reform_desc:0 "This reform makes administration feel less like foreign machinery and more like local fate. Fate grants accepted peoples, trade reach, and loyal believers, and local limits impose weaker conversion."
 war_eastern_beastfolk_cg_republic_reform:0 "Eastern Beastfolk Republic"
 war_eastern_beastfolk_cg_republic_reform_desc:0 "The councils choose the tool already in every hand and call that choice wisdom. The tool builds speed, brutal charges, and rapid musters, while its old notches leave slow agreement."
 war_nipponese_cg_republic_reform:0 "Nipponese Republic"
 war_nipponese_cg_republic_reform_desc:0 "In practice, the reform is a chain of small recognitions: this oath, that shrine, this scar, that debt. Linked together, they pull discipline, watchful agents, and cheap admirals into reach and drag weaker trade after them."
 war_vampire_coast_cg_republic_reform:0 "Vampire Coast Republic"
 war_vampire_coast_cg_republic_reform_desc:0 "The admiral is dead, the crew is dead, and the prize court still expects its share. Around the council hall, black sails and drowned crews turn plunder into administration; the result is naval nerve, privateers, and quick shipyards, with softer morale never far behind."
 war_old_ones_culture_group_republic_reform:0 "Old Ones Republic"
 war_old_ones_culture_group_republic_reform_desc:0 "The system teaches officials to ask what custom will tolerate before asking what law permits. Tolerance gives innovation, institution spread, and prosperity, but the question itself leaves thin reserves."
 # Tribal accessibility reforms
 war_lady_of_the_lake_tribal_reform:0 "Grail Tribe"
 war_lady_of_the_lake_tribal_reform_desc:0 "The clans give inherited authority a public job and a private appetite. The job delivers steadier revenue, loyal believers, and stout garrisons; the appetite is weaker trade."
 war_myrmidia_tribal_reform:0 "Myrmidian Tribe"
 war_myrmidia_tribal_reform_desc:0 "This reform makes the realm easier to command by making it less innocent about power. Command improves harder morale, credible envoys, and rapid musters, and lost innocence appears as cold diplomacy."
 war_ursun_tribal_reform:0 "Great Orthodoxy Tribe"
 war_ursun_tribal_reform_desc:0 "Bear bells sound over frozen walls while priests count who still stands after the last raid. Such rule rewards people who understand the old signals, creating zealous conversion, religious unity, and frontier pressure, leaving outsiders to complain about fewer diplomatic ties."
 war_cult_of_sigmar_tribal_reform:0 "Sigmarite Tribe"
 war_cult_of_sigmar_tribal_reform_desc:0 "The old ways are not merely preserved; they are made answerable for results. The results are harder morale, zealous conversion, and frontier pressure, while the answer they give for their failures is hard-won consensus."
 war_cult_of_ulric_religion_tribal_reform:0 "Ulrican Tribe"
 war_cult_of_ulric_religion_tribal_reform_desc:0 "The reform begins in the awkward space between respect and coercion, where Ulrican rule has always worked best. That memory is built into appointments and punishments until loyal believers, harder morale, and frontier pressure feel natural and weaker tax collection feels almost inevitable."
 war_cult_of_taal_religion_tribal_reform:0 "Taalite Tribe"
 war_cult_of_taal_religion_tribal_reform_desc:0 "The clans bind policy to the stories people already tell at doors, docks, shrines, and fires. Those stories sustain quick adaptation, swift recovery, and frontier pressure, even as they carry a stained reputation."
 war_old_world_cults_religion_tribal_reform:0 "Imperial Pantheon Tribe"
 war_old_world_cults_religion_tribal_reform_desc:0 "The reform has the shape of a local bargain enlarged until it fills the map. Enlarged, it grants quiet provinces, managed heresy, and autonomy control; stretched, it leaves persecuted outsiders."
 war_vampiric_tribal_reform:0 "Vampiric Tribe"
 war_vampiric_tribal_reform_desc:0 "A sealed invitation, a missing witness, and a perfectly legal inheritance can conquer more quietly than an army. Such rule rewards people who understand the old signals, creating diplomats, steadier revenue, and blockades, leaving outsiders to complain about cold diplomacy."
 war_khornate_religion_tribal_reform:0 "Khornate Tribe"
 war_khornate_religion_tribal_reform_desc:0 "Before the ink dries, everyone important has already translated the decree into older obligations. That memory is built into appointments and punishments until brutal charges, lasting war memory, and storming walls feel natural and costly consensus feels almost inevitable."
 war_nurglite_religion_tribal_reform:0 "Nurglite Tribe"
 war_nurglite_religion_tribal_reform_desc:0 "The clans do not need the whole realm to understand this reform, only to recognize its consequences. From that habit grows a state of deadly terrain, hardy marches, and frontier pressure; from the same root come costly development."
 war_tzeentchian_religion_tribal_reform:0 "Tzeentchian Tribe"
 war_tzeentchian_religion_tribal_reform_desc:0 "This statecraft is built from whatever people already salute, fear, or bargain with. That foundation supports quick adaptation, clever scholarship, and lasting claims, but settles unevenly into a stained reputation."
 war_slaaneshi_religion_tribal_reform:0 "Slaaneshi Tribe"
 war_slaaneshi_religion_tribal_reform_desc:0 "The clans learn that the shortest path to obedience is through something older than obedience. The path reaches swift recovery, speed, and provocation, though it is paved with weaker taxes."
 war_chaos_undivided_religion_tribal_reform:0 "Chaos Undivided Tribe"
 war_chaos_undivided_religion_tribal_reform_desc:0 "The reform speaks in familiar symbols so the unfamiliar machinery can pass. The machinery delivers managed heresy, zealous conversion, and rapid musters; the symbols carry a stained reputation."
 war_hashut_tribal_reform:0 "Hashut Tribe"
 war_hashut_tribal_reform_desc:0 "A state can be made from prayers, grudges, contracts, and drilled reflexes if someone is ruthless enough to index them. Hashut's clans are ruthless enough, gaining production, discipline, and rapid musters while recording slow agreement as a cost."
 war_hobgoblin_religion_tribal_reform:0 "Hobgoblin Shamanism Tribe"
 war_hobgoblin_religion_tribal_reform_desc:0 "A provincial officer learns quickly that the written rule is only half the instruction. That memory is built into appointments and punishments until cavalry weight, cheaper regiments, and provocation feel natural and cold diplomacy feels almost inevitable."
 war_the_great_maw_religion_tribal_reform:0 "The Great Maw Tribe"
 war_the_great_maw_religion_tribal_reform_desc:0 "The clans record Maw custom in the margins first, then discover the margins have become law. Oath custom now buys harder morale, quiet provinces, and more commanders; the unpaid bill is weaker trade."
 war_asrai_cadai_tribal_reform:0 "The Asrai Pantheon Tribe"
 war_asrai_cadai_tribal_reform_desc:0 "The forest does not attend the moot, yet every chief waits for its answer. Home manpower, deadly terrain, and stout garrisons flourish beneath Asrai spirit-law, while smaller hosts are accepted as the cost of hidden strength."
 war_cytharai_tribal_reform:0 "The Cytharai Tribe"
 war_cytharai_tribal_reform_desc:0 "At council, nobody agrees why Cytharai rule works, only that the old methods keep winning. The settlement favors terrifying blows, harder morale, and many leaders, while cold diplomacy is left for quieter hands to explain."
 war_cadai_tribal_reform:0 "The Cadai Tribe"
 war_cadai_tribal_reform_desc:0 "Cadai custom is not invited into government politely; it is found already sitting there. That is how oath custom turns Cadai authority into trade profit, naval nerve, and stout garrisons, even as a stained reputation gathers in the corners."
 war_ancestor_gods_tribal_reform:0 "Ancestor Gods Tribe"
 war_ancestor_gods_tribal_reform_desc:0 "Ancestor Gods rule is taught through examples: who receives bread, who receives steel, and who is made to wait outside. From those lessons come steadier institutions, loyal believers, and frontier pressure; from the waiting comes slow scholarship."
 war_kislev_old_faith_tribal_reform:0 "The Old Faiths Tribe"
 war_kislev_old_faith_tribal_reform_desc:0 "The bargain has old fingerprints on it, but the seal is new enough to frighten people. The Old Faiths habits are messier than statutes, but they deliver quiet provinces, steadier institutions, and frontier pressure and leave costly provinces behind them."
 war_nehekharan_pantheon_tribal_reform:0 "Nehekharan Tribe"
 war_nehekharan_pantheon_tribal_reform_desc:0 "What changes here is not the custom itself, but the number of clerks ordered to serve it. The clans claim loyal believers, loyal estates, and healed land, accepting slow scholarship as the part no herald sings about."
 war_nagash_worship_tribal_reform:0 "Nagashi Tribe"
 war_nagash_worship_tribal_reform_desc:0 "Nagashi chiefs count graves as future musters and speak of mercy as poor accounting. Deadly terrain, missionaries, and stout garrisons answer that arithmetic, while strained unity withers wherever the living still object."
 war_horned_rat_tribal_reform:0 "Horned Rat Tribe"
 war_horned_rat_tribal_reform_desc:0 "The reform takes an old local instinct and gives it a route through every office. From that habit grows a state of loyal believers, quiet provinces, and stout garrisons; from the same root come a stained reputation."
 war_old_ones_tribal_reform:0 "Old Ones Tribe"
 war_old_ones_tribal_reform_desc:0 "A broken plaque is still treated like a witness if its glyphs point toward the Great Plan. The chiefs turn that reverence into loyal believers, innovation, and fast works, accepting hard-won consensus when mortal patience lags behind ancient design."
 war_enlightened_path_tribal_reform:0 "Koa'Tzlanism Tribe"
 war_enlightened_path_tribal_reform_desc:0 "No proclamation can explain this system as well as one afternoon spent watching it punish hesitation. Koa'Tzlanism practice hardens into output, steadier institutions, and autonomy control, though unrest follows close enough to be noticed."
 war_yin_yang_tribal_reform:0 "Harmony Tribe"
 war_yin_yang_tribal_reform_desc:0 "The clans discover that Harmony custom can be measured, funded, and made to answer summons. They promise loyal believers, steadier revenue, and fast works, and they are candid enough to admit that strained diplomacy will come with it."
 war_the_thousand_gods_tribal_reform:0 "The Thousand Gods Tribe"
 war_the_thousand_gods_tribal_reform_desc:0 "Oath custom borrows the language of the Thousand Gods because plain commands no longer suffice. The borrowed language grants trade reach, tolerated strangers, and autonomy control; it also teaches the realm to endure fewer diplomatic ties."
 war_imperial_group_tribal_reform:0 "Imperial Tribe"
 war_imperial_group_tribal_reform_desc:0 "There is a story told in every office now: ignore Imperial ways and the realm loosens in your hands. Believe it, and the state gains production, harder morale, and fast works, although corruption becomes harder to hide."
 war_estalian_group_tribal_reform:0 "Estalian Tribe"
 war_estalian_group_tribal_reform_desc:0 "This settlement begins with a practical confession: the realm already obeys more than the written law. Estalian authority wins the argument, bringing trade reach, naval nerve, and quick shipyards and making thin reserves a known cost of obedience."
 war_bretonnian_group_tribal_reform:0 "Bretonnian Tribe"
 war_bretonnian_group_tribal_reform_desc:0 "A lance in the chapel can settle questions that would take other realms a year of debate. Among these clans, that lesson becomes government: strong cavalry, loyal believers, and stout garrisons are cultivated deliberately, even when costly consensus makes the work uglier."
 war_kislevite_group_tribal_reform:0 "Kislevite Tribe"
 war_kislevite_group_tribal_reform_desc:0 "The old symbols are carried into the offices first, so the orders that follow feel less foreign. Around the moot-fire, ice roads, frontier musters, and stubborn households make survival administrative; the result is quiet provinces, swift recovery, and frontier pressure, with costly provinces never far behind."
 war_tilean_group_tribal_reform:0 "Tilean Tribe"
 war_tilean_group_tribal_reform_desc:0 "A reform like this survives because it lets memory do work that statutes cannot. The clans use that correction to secure mercenary discipline, trade reach, and blockades, even while unrest troubles the ledger."
 war_norse_group_tribal_reform:0 "Norscan Tribe"
 war_norse_group_tribal_reform_desc:0 "Norscan institutions work because they make private belief useful to public command. Here that means swift recovery, larger fleets, and rapid musters, with weaker taxes as the price of making the machinery move."
 war_asrai_group_tribal_reform:0 "Wood Elves Tribe"
 war_asrai_group_tribal_reform_desc:0 "The clans give Wood Elf custom an official voice and immediately learn how loudly it can speak. It lets them draw deadly terrain, home manpower, and stout garrisons from forest practice, while smaller hosts remain the price of vanishing so well."
 war_asur_group_tribal_reform:0 "Asur Tribe"
 war_asur_group_tribal_reform_desc:0 "The realm learns to hear Asur law in ordinary sounds: bells, boots, oaths, and closed doors. Those sounds organize credible envoys, naval nerve, and stout garrisons, but they cannot drown out thin reserves."
 war_druchii_group_tribal_reform:0 "Druchii Tribe"
 war_druchii_group_tribal_reform_desc:0 "The first converts to the reform are not idealists; they are people who have seen the older method succeed. That memory is built into appointments and punishments until spycraft, terrifying blows, and cheap admirals feel natural and cold diplomacy feels almost inevitable."
 war_dwarf_group_tribal_reform:0 "Dwarfen Tribe"
 war_dwarf_group_tribal_reform_desc:0 "Dwarfen rule becomes visible in small procedures: which door opens, which name is spoken, which debt is remembered. Around the moot-fire, stone gates and clan ledgers build durable industry at deliberate speed; the result is production, fortitude, and frontier pressure, with slow agreement never far behind."
 war_chaos_dwarf_group_tribal_reform:0 "Chaos Dwarf Tribe"
 war_chaos_dwarf_group_tribal_reform_desc:0 "This is the sort of law that arrives with witnesses who were never asked to testify. The clans put Chaos Dwarf expectations to work for production, firepower, and rapid musters, then live with hard-won consensus when the accounts are balanced."
 war_albionise_group_tribal_reform:0 "Albionite Tribe"
 war_albionise_group_tribal_reform_desc:0 "Albionite custom does not need to be gentle to be useful. It gives the clans deadly terrain, cheap development, and safe passages, and the same hardness explains why expensive provinces follow."
 war_strigany_group_tribal_reform:0 "Strigany Tribe"
 war_strigany_group_tribal_reform_desc:0 "The clans build the reform around a local certainty that refuses to stay local. Once recognition does its work, oath custom produces speed, smooth appeasement, and easy claims; misunderstanding leaves costly consensus."
 war_hung_group_tribal_reform:0 "Hung Tribe"
 war_hung_group_tribal_reform_desc:0 "At first it looks like deference to tradition; by the second order it is clearly administration. Among these clans, that lesson becomes government: strong cavalry, larger hosts, and lasting claims are cultivated deliberately, even when slow agreement makes the work uglier."
 war_kurgan_group_tribal_reform:0 "Kurgan Tribe"
 war_kurgan_group_tribal_reform_desc:0 "The reform's quiet trick is making Kurgan obedience feel older than opposition. That answer is Kurgan in character, good for swift recovery, brutal charges, and lasting claims, and poor company for slower consensus."
 war_darkland_human_group_tribal_reform:0 "Dark Lands Human Tribe"
 war_darkland_human_group_tribal_reform_desc:0 "The state stops trying to sand the edges off Dark Lands Human rule. It sharpens them instead, winning trade reach, credible envoys, and frontier pressure while cutting itself on hard-won consensus."
 war_amazon_group_tribal_reform:0 "Amazon Tribe"
 war_amazon_group_tribal_reform_desc:0 "The clans place the old custom where a tax seal, muster roll, or court summons can reach it. Around the moot-fire, ambush discipline and veteran captains guard the homeland fiercely; the result is infantry bite, deadly terrain, and healed land, with weaker taxes never far behind."
 war_nehekharan_group_tribal_reform:0 "Nehekharan Tribe"
 war_nehekharan_group_tribal_reform_desc:0 "The system starts with one familiar gesture and ends with a province realizing the gesture now has penalties. In return it provides loyal believers, quiet provinces, and healed land, with slow scholarship arriving as the signature nobody can refuse."
 war_hobgoblin_group_tribal_reform:0 "Hobgoblin Tribe"
 war_hobgoblin_group_tribal_reform_desc:0 "Hobgoblin authority is trimmed just enough to fit through the bureaucracy, not enough to become harmless. Around the moot-fire, wolf riders and profitable treachery make armies cheap and mobile; the result is cavalry weight, cheaper regiments, and provocation, with cold diplomacy never far behind."
 war_skaven_group_tribal_reform:0 "Skaven Tribe"
 war_skaven_group_tribal_reform_desc:0 "The minutes are eaten, the witness is stabbed, and somehow the machine is finished ahead of schedule. Among these clans, that lesson becomes government: clever scholarship, cheaper regiments, and stout garrisons are cultivated deliberately, even when a stained reputation makes the work uglier."
 war_lizardmen_group_tribal_reform:0 "Lizardmen Tribe"
 war_lizardmen_group_tribal_reform_desc:0 "The clans do not make Lizardmen custom respectable; they make it functional. That difference matters, because it yields innovation, loyal believers, and fast works and still leaves costly consensus."
 war_cathayan_cg_tribal_reform:0 "Cathayan Tribe"
 war_cathayan_cg_tribal_reform_desc:0 "Every realm has old habits; this one promotes them, audits them, and sends them to collect. That memory is built into appointments and punishments until governing reach, steadier revenue, and cultural bargains feel natural and costly provinces feel almost inevitable."
 war_snakefolk_cg_tribal_reform:0 "Snakefolk Tribe"
 war_snakefolk_cg_tribal_reform_desc:0 "The clans turn Snakefolk memory into a public instrument, and the instrument is not gentle. Here Snakefolk rule answers with spycraft, deadly terrain, and lasting claims, while leaky secrets remind everyone how strange the bargain remains."
 war_indish_cg_tribal_reform:0 "Indish Tribe"
 war_indish_cg_tribal_reform_desc:0 "The reform asks old loyalties to do official work, then counts the results without embarrassment. Among these clans, that lesson becomes government: accepted peoples, trade reach, and autonomy control are cultivated deliberately, even when strained diplomacy makes the work uglier."
 war_eastern_beastfolk_cg_tribal_reform:0 "Eastern Beastfolk Tribe"
 war_eastern_beastfolk_cg_tribal_reform_desc:0 "A lesser court would call this contradiction; here it is filed as procedure. Under it, the realm gains speed, brutal charges, and provocation; under the same lock, it accepts weaker taxes."
 war_nipponese_cg_tribal_reform:0 "Nipponese Tribe"
 war_nipponese_cg_tribal_reform_desc:0 "Nipponese custom becomes a language of rule spoken in offices that once pretended not to know it. Among these clans, that lesson becomes government: discipline, watchful agents, and many leaders are cultivated deliberately, even when slow agreement makes the work uglier."
 war_vampire_coast_cg_tribal_reform:0 "Vampire Coast Tribe"
 war_vampire_coast_cg_tribal_reform_desc:0 "The old bargain is widened until it can cover strangers, soldiers, priests, and taxmen. That memory is built into appointments and punishments until naval nerve, privateers, and naval barrages feel natural and unrest feels almost inevitable."
 war_old_ones_culture_group_tribal_reform:0 "Old Ones Tribe"
 war_old_ones_culture_group_tribal_reform_desc:0 "In Old Ones hands, the same lesson is carried by different witnesses: a cautious elder, a paid scribe, and someone who remembers the last disaster. Around the moot-fire, ancient methods spread knowledge through surviving temple craft; the result is innovation, institution spread, and fast works, with hard-won consensus never far behind."
 # End Warhammer accessibility reform localization
