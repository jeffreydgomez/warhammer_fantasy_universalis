l_english:


 nippon_events.100.t:0 "The Seals No Longer Agree"
 nippon_events.100.d:0 "A courier reaches [Root.Capital.GetName] carrying orders from an imperial official and a clan lord who both claim command of the same garrison. The captain has obeyed neither, fearing that either choice will make him a traitor.\n\nA century of clan rivalries and disputed commands has broken the old unity of emperor and shogun. Each castle now keeps its own account of which promises still bind it to the rest of Nippon.\n\nReports from other castles describe assassinations, missing tax shipments, and armed retainers changing banners. Priests warn of vampiric patrons and Chaos worship behind some of the feuds, while mountain villages ask for protection from Goblins. [Root.Monarch.GetName] summons the officers to decide which commands the realm can still enforce."
 nippon_events.100.a:0 "Restore the chain of command and secure our own domain."

 nippon_events.1.t:0 "The Fields Missing from the Survey"
 nippon_events.1.d:0 "A surveyor reaches [Root.Capital.GetName] with two maps of the same village. The headman's copy omits a broad strip of irrigated fields that appears in an older temple register.\n\nThe local retainer claims those fields were granted to his family and refuses to let the surveyors measure them. Farmers wait beside the disputed boundary, uncertain which collector will arrive for their rice."
 nippon_events.1.a:0 "Complete the survey and tax the recorded acreage."
 nippon_events.1.b:0 "Require a public oath confirming the ruler's authority."
 nippon_events.1.c:0 "Negotiate access and compile the conflicting claims."

 nippon_events.2.t:0 "The Shinobi Broker's Proof"
 nippon_events.2.d:0 "A shinobi broker leaves a stolen gate roster on the chamberlain's desk to demonstrate his reach. He offers further access to rival castles if our agents receive money and freedom to travel as merchants.\n\nThe chamberlain checks the roster against a recent report and finds it accurate. He summons the broker back under guard, unwilling to let someone with such easy access leave without an answer."
 nippon_events.2.a:0 "Pay the network and relax restrictions on its merchant covers."
 nippon_events.2.b:0 "Use the information without granting a contract."
 nippon_events.2.c:0 "Sell the roster through an intermediary."

 nippon_events.3.t:0 "The False Road Markers"
 nippon_events.3.d:0 "A merchant escapes the mountain road at [event_target.GetName] after Goblins replace its markers and lead his caravan into a ravine. He reaches the nearest watchpost carrying a painted wooden face used to mock the victims.\n\nThe patrol finds more false markers along the pass and carts stripped of their wheels. Local villagers refuse to guide another convoy until the Goblin camps above the road are cleared."
 nippon_events.3.a:0 "Fund a costly patrol campaign to restore order."
 nippon_events.3.b:0 "Clear the camps and establish a military settlement in the pass."

 nippon_events.4.t:0 "The Smith's Foreign Matchlock"
 nippon_events.4.d:0 "A smith brings a copied foreign matchlock to the castle yard and fires it through a practice shield. His second shot misfires, but the first has already drawn the attention of the assembled officers. A young retainer asks to try it again, while the smith checks the damaged firing mechanism.\n\nThe smith says reliable production needs better tools and a steady powder supply. Guild elders request exclusive rights to the design, while the captain asks to keep the sample for training."
 nippon_events.4.a:0 "Fund workshops to improve our troops' firepower."
 nippon_events.4.b:0 "Negotiate clear rules for manufacture and ownership."
 nippon_events.4.c:0 "Sell exclusive production licenses to the guilds."
 nippon_events.4.dd:0 "Give the sample to the officers for military study."

 nippon_events.5.t:0 "The Monks of Cedar Peak"
 nippon_events.5.d:0 "Warrior monks from the Cedar Peak monastery march to [Root.Capital.GetName] carrying a tax collector's broken staff. Their abbot says the collector seized temple rice reserved for dependent villages.\n\nThe collector claims the monastery has been hiding income and arrives with his own armed witnesses. The gate captain keeps both groups outside the castle, where townspeople are beginning to gather around the disputed rice carts."
 nippon_events.5.a:0 "Pay compensation and bring the monks into our military rites."
 nippon_events.5.b:0 "Deploy guards and impose an orderly settlement."
 nippon_events.5.c:0 "Uphold the collection and take the temple's payment."

 nippon_events.6.t:0 "The Patron Who Visits After Dark"
 nippon_events.6.d:0 "A wealthy patron has paid several officers' debts but insists they attend him only after sunset. A shrine attendant reports finding one debtor pale and confused outside a locked guesthouse.\n\nThe victim recalls signing nothing beyond an ordinary repayment agreement. His family brings the document to the shrine, but the ink has faded from every line naming what was given in exchange.\n\nThe magistrate produces contracts that make every transaction appear lawful. The attendant brings the victim to [Root.Capital.GetName], forcing the court to confront a patron whose clients now hold positions throughout the town."
 nippon_events.6.a:0 "Investigate his network, even if the arrests cause turmoil."
 nippon_events.6.b:0 "Accept his money and tolerate his influence over the officers."

 nippon_events.7.t:0 "The Poem That Named a Thief"
 nippon_events.7.d:0 "At a court poetry gathering, a retainer recites a verse that unmistakably accuses another clan of stealing a harvest. The accused clan's representative reaches for his sword before the host stops him.\n\nBoth delegations demand an apology, and their escorts have begun confronting each other outside the guesthouses. The court poet proposes a supervised hearing before either side sends an account home."
 nippon_events.7.a:0 "Pay to host a formal reconciliation."
 nippon_events.7.b:0 "Preside over the hearing and secure public acceptance of the ruling."
 nippon_events.7.c:0 "Negotiate privately with the two delegations."

 nippon_events.8.t:0 "The Banner in the Shrine Storehouse"
 nippon_events.8.d:0 "A shrine keeper discovers a red banner bearing Khorne's marks behind a retainer's donated rice chests. When he reports it, armed men arrive to collect both the banner and the keeper.\n\nThe keeper escapes to [Root.Capital.GetName] with a cut from the cloth. The accused household denies owning it, but its warriors have begun gathering outside their compound with weapons drawn."
 nippon_events.8.a:0 "Investigate and suppress the cult, despite the immediate unrest."
 nippon_events.8.b:0 "Bargain for silence and tighten control of the household's trade."
 nippon_events.8.c:0 "Take its fanatical warriors into service, accepting the cost."

 nippon_events.9.t:0 "The Locked Market Gate"
 nippon_events.9.d:0 "New merchants arrive for market day at [Root.Capital.GetName] and find the za guilds have locked the trading yard. Their spokesman produces a petition asking for rakuichi privileges, while the guild elders cite their old monopolies.\n\nThe magistrate counts carts waiting in the street and warns that the town is losing fees. Temple stewards also claim rights over nearby stalls, leaving the government to decide whose charter the guards should enforce."
 nippon_events.9.a:0 "Register traders under a state charter and collect regular taxes."
 nippon_events.9.b:0 "Fund guild construction under exclusive local licenses."
 nippon_events.9.c:0 "Pay the temples to expand their religious work."
 nippon_events.9.dd:0 "Negotiate while preserving the established monopolies."

 nippon_events.10.t:0 "The Claimed Sword of the Shogun"
 nippon_events.10.d:0 "A temple attendant claims to have seen the Shogun's Katana displayed during a private ceremony. He describes the fittings precisely, but admits that he never saw the blade drawn.\n\nThe story reaches the barracks, where officers argue over whether its appearance signals renewed central authority. The attendant is brought to [Root.Capital.GetName] so that the court can decide how to use or verify his account."
 nippon_events.10.a:0 "Fund a ceremony to rally the troops around the sword's legend."
 nippon_events.10.b:0 "Send agents to identify the sword and its keeper."
