l_english:

indish_happy_church:0 "Blessing of the Priests"
desc_indish_happy_church:0 "The loyalty of our religious leaders ensures peace and harmony within our nation, granting us greater tolerance towards our people."

indish_place_of_study:0 "Halls of Wisdom"
desc_indish_place_of_study:0 "With our prestigious centers of learning, we foster the growth of institutions, allowing knowledge to spread swiftly throughout our lands."

indish_place_of_law:0 "Seat of Justice"
desc_indish_place_of_law:0 "Establishing strong legal institutions has lowered the costs of maintaining stability, ensuring that our realm is governed by order and fairness."

indish_place_of_innovation:0 "Cradle of Innovation"
desc_indish_place_of_innovation:0 "In our centers of innovation, the brightest minds come together, pushing the boundaries of knowledge and ushering in new ideas for the advancement of our society."

indish_charitable:0 "Charitable Legacy"
desc_indish_charitable:0 "By sharing our wealth with neighboring states, we build strong bonds of friendship, enhancing our diplomatic reputation and fostering goodwill among those of the same faith."

indish_historical_defender:0 "Defender of the Faith"
desc_indish_historical_defender:0 "We stand as the defenders of our faith, with a prestigious history of shielding the devout and strengthening our bond with fellow believers."

indish_add_missionary_1:0 "Expanded Missionary Presence"
desc_indish_add_missionary_1:0 "Our efforts to spread our faith are bolstered, allowing us to send more missionaries and increase the strength of their work."

indish_add_missionary_2:0 "Missionary Surge"
desc_indish_add_missionary_2:0 "As our influence expands, we are able to send additional missionaries to further spread our faith across distant lands."

indish_trade_hub:0 "Hub of Commerce"
desc_indish_trade_hub:0 "Our mastery over trade ensures that our nation becomes a central hub of commerce, enriching our coffers and increasing our trade efficiency."

indish_cavalry_fraction:0 "Cavalry Supremacy"
desc_indish_cavalry_fraction:0 "Our armies are renowned for their cavalry superiority, with enhanced flanking power and a larger proportion of mounted units in battle."

indish_holy_war:0 "Righteous Crusade"
desc_indish_holy_war:0 "Our zeal to wage holy wars grants us a powerful casus belli against the infidels, strengthening our ability to expand the faith by force."

indish_holy_war_2:0 "Holy Expansion"
desc_indish_holy_war_2:0 "Through holy war, we have honed our tactics, reducing the cost of enforcing religious dominance and making it easier to subjugate heretics."

indish_expand_abroad:0 "Overseas Expansion"
desc_indish_expand_abroad:0 "Our sights are set on new lands across the seas, where we will expand our colonies and extend our influence."

indish_ultimate_reward:0 "Divine Reward"
desc_indish_ultimate_reward:0 "Through our efforts to spread the faith and advance our knowledge, we are rewarded with divine favor, bringing prosperity and influence to our nation."




gen_indish_please_nobility_title:0 "Please the Nobility"
gen_indish_please_nobility_desc:0 "The support of the nobility is crucial to maintaining the stability of our realm. We must ensure their loyalty to strengthen our rule and secure additional religious influence."

gen_indish_cavalry_title:0 "Strengthen the Cavalry"
gen_indish_cavalry_desc:0 "Our cavalry is the backbone of our armies. By expanding and improving our cavalry forces, we ensure that we dominate the battlefield with swift and decisive maneuvers."

gen_indish_war_with_infidel_title:0 "War with the Infidel"
gen_indish_war_with_infidel_desc:0 "The time has come to wage war against those who do not share our faith. We will lead a righteous crusade to cleanse the lands of unbelievers and bring them under our control."

gen_indish_war_expand_faith_title:0 "Expand the Faith"
gen_indish_war_expand_faith_desc:0 "Through conquest and holy wars, we will extend the reach of our faith, asserting our dominance over foreign lands and ensuring the supremacy of our beliefs."

gen_indish_build_docks_title:0 "Build Coastal Infrastructure"
gen_indish_build_docks_desc:0 "To expand overseas, we must first establish the infrastructure to support naval expeditions. By building docks and drydocks, we lay the foundation for our future maritime empire."

gen_indish_expand_overseas_title:0 "Expand Overseas"
gen_indish_expand_overseas_desc:0 "The world beyond our shores offers immense opportunities. We must expand our territories across multiple continents to secure resources and spread our influence."

gen_indish_center_of_trade_title:0 "Center of Trade"
gen_indish_center_of_trade_desc:0 "By controlling the seas and establishing a powerful fleet of light ships, we can transform our ports into thriving centers of trade, dominating the flow of wealth across the seas."

gen_indish_ultimate_mission_title:0 "The Ultimate Reward"
gen_indish_ultimate_mission_desc:0 "As a great power, we have achieved unparalleled dominance. Now is the time to claim the ultimate reward, spreading our influence across the world and securing the divine favor that comes with our success."



gen_thousand_gods_happy_priest_title:0 "Appease the Priests"
gen_thousand_gods_happy_priest_desc:0 "The priests of the Thousand Gods hold great sway over the spiritual and political life of our nation. By securing their loyalty, we gain the favor of the divine."

gen_thousand_gods_places_of_worship_title:0 "Expand Places of Worship"
gen_thousand_gods_places_of_worship_desc:0 "Our devotion to the Thousand Gods must be reflected in the grand temples we build. By expanding our places of worship, we ensure that the gods continue to favor us."

gen_thousand_gods_place_of_study_title:0 "Establish Centers of Study"
gen_thousand_gods_place_of_study_desc:0 "Knowledge is power, and by fostering centers of study, we can accelerate the growth of institutions and secure our place as a hub of learning."

gen_thousand_gods_places_of_law_title:0 "Fortify the Rule of Law"
gen_thousand_gods_places_of_law_desc:0 "A strong legal framework ensures stability and order across our lands. By building courthouses and town halls, we entrench the rule of law and reduce the cost of maintaining stability."

gen_thousand_gods_places_of_innovation_title:0 "Foster Innovation"
gen_thousand_gods_places_of_innovation_desc:0 "Through our investment in universities and centers of knowledge, we create an environment where new ideas can flourish, pushing the boundaries of what is possible."

gen_thousand_gods_charitable_title:0 "Charitable Deeds"
gen_thousand_gods_charitable_desc:0 "In the name of the Thousand Gods, we must show generosity to our neighbors, improving relations with those who share our faith and enhancing our standing in the eyes of the divine."

gen_thousand_gods_defender_of_faith_title:0 "Defender of the Faith"
gen_thousand_gods_defender_of_faith_desc:0 "Having proven our dedication to the Thousand Gods, we now stand as the foremost defender of our faith, ensuring the unity of our religion and securing our prestige."



 ind_events.1000.t:0 "The Temples and Jungles of Ind"
 ind_events.1000.d:0 "Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. Whether every boast is true matters less than the fact that millions believe it, pray by it, and kill beneath its banners.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler of Ind knows that grain, pilgrims, taxes, and devotion are as important as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk rule and bargain in the southern jungles, while deeper groves hide monsters, blood shrines, and gods whose names are spoken only after offerings have been made. The old forests grow around the roads as though waiting for stone and law to weaken.\n\nInd is ringed by powers that cannot be ignored. Cathay watches from the northeast, Khuresh bleeds and coils in the east, Elven colonies command islands and sea lanes, and Ogres gather to the north and northwest alongside darker appetites. Wealth has made Ind mighty, but it has also made the land visible to every hungry neighbor.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now it must prove that age is not the same as decay."
 ind_events.1000.a:0 "The cities of Ind shall endure."

 ind_events.1.t:0 "The Monsoon Granaries"
 ind_events.1.d:0 "The monsoon has filled the lowland granaries until their doors groan under the weight of rice and millet. Temple accountants call the abundance a blessing, while city magistrates warn that hungry districts will riot if relief is delayed.\n\nMerchants argue that the roads must be guarded and taxed before the stores rot. Priests insist the grain belongs first to the gods and then to the poor. The court can turn plenty into order, profit, or another ledger war."
 ind_events.1.a:0 "Open the royal granaries."
 ind_events.1.b:0 "Tax the spice merchants moving grain."
 ind_events.1.c:0 "Audit the temple storehouses."

 ind_events.2.t:0 "The Sacred Elephant Herds"
 ind_events.2.d:0 "A herd of temple elephants has been claimed by both priests and generals. Their handlers say the beasts kneel only before sacred bells, but the army sees living towers that could break enemy lines.\n\nNo one in court doubts their value. The dispute is over whether that value belongs in the shrine, the parade ground, or the treasury of whatever lord can feed them."
 ind_events.2.a:0 "Train the mahouts for war."
 ind_events.2.b:0 "Spare the sacred herds."

 ind_events.3.t:0 "Tigerfolk on the Pilgrim Road"
 ind_events.3.d:0 "Tigerfolk envoys have arrived on the pilgrim road with painted claws, lacquered gifts, and a retinue that watches every shadow. Some courtiers call them civilized beastfolk, while others mutter that the word civilized does too much work.\n\nThe southern jungle courts know paths our taxmen cannot find. They also remember insults for generations. If we bind them with honor, we gain teeth in the green places, but if we keep them at the edge of court, fewer priests will need calming.\n\nBeyond the road, wilder Beastmen hear every rumor. A careless answer may travel faster than any royal decree."
 ind_events.3.a:0 "Honor the Tigerfolk envoys."
 ind_events.3.b:0 "Grant them jungle courts."
 ind_events.3.c:0 "Keep them at a careful distance."

 ind_events.4.t:0 "The Blood-Hungry Grove"
 ind_events.4.d:0 "Travelers near [event_target.GetName] have begun leaving offerings at a grove where the leaves drip red after sunset. Priests of the Thousand Gods disagree on whether the place is holy, cursed, or merely older than their own temple lists.\n\nThe local Rajah wants the road reopened before the market season begins. Villagers want the screaming to stop. Soldiers say a grove can burn like anything else if enough oil is carried into the trees."
 ind_events.4.a:0 "Pay the old offerings."
 ind_events.4.b:0 "Burn the shrine before it spreads."

 ind_events.5.t:0 "The Spice Road Monopoly"
 ind_events.5.d:0 "The great spice guilds have petitioned for exclusive rights over a chain of river roads and caravanserais. They promise steady taxes, guarded warehouses, and fewer arguments with port officials.\n\nSmaller traders call the request an elegant theft. Temple treasurers suggest that if a monopoly must exist, the gods should hold a share. Every answer will enrich someone and anger someone else."
 ind_events.5.a:0 "Charter the guild monopoly."
 ind_events.5.b:0 "Break the monopolies before they harden."
 ind_events.5.c:0 "Give the temples their share."
 ind_events.5.dd:0 "Sell limited charters."

 ind_events.6.t:0 "Ogre Tolls in the Northern Passes"
 ind_events.6.d:0 "Ogre toll-takers have settled near the northern caravan passes with cooking fires, heavy clubs, and a cheerful lack of legal theory. They eat well from merchants who prefer losing coin to losing limbs.\n\nThe caravans demand protection, but the Ogres are not only raiders. A paid brute can become a guard if the price and the meal are large enough. Refusing them entirely may preserve dignity while costing blood."
 ind_events.6.a:0 "Pay the tolls for now."
 ind_events.6.b:0 "Hire them as caravan guards."
 ind_events.6.c:0 "Refuse their passage."

 ind_events.7.t:0 "Flood of Pilgrims"
 ind_events.7.d:0 "Pilgrims have filled the ghats of [event_target.GetName], sleeping under awnings, chanting through the heat, and leaving coins wherever a priest raises a bowl. The river steps are slick with flowers, ash, and bargaining.\n\nThe city is blessed and overwhelmed. New landings would serve generations, but the treasury groans at the thought. A tax on pilgrims would be easy to collect and hard to forgive.\n\nSome ministers advise closing the roads until the flood passes. That would quiet the streets, though not the complaints."
 ind_events.7.a:0 "Build new ghats."
 ind_events.7.b:0 "Tax the pilgrim flood."
 ind_events.7.c:0 "Close the roads."

 ind_events.8.t:0 "Jewels in the Court Ledger"
 ind_events.8.d:0 "A clerk has found emeralds hidden inside a provincial revenue ledger. The jewels are beautiful, poorly concealed, and connected to enough noble names that the court has suddenly become very quiet.\n\nExposing the bribery would prove that the ruler's eye reaches deep into the bureaucracy. Accepting the gifts would spare several powerful families from disgrace. In Ind, wealth is rarely silent for long."
 ind_events.8.a:0 "Expose the bribes."
 ind_events.8.b:0 "Accept the gifts quietly."

 ind_events.9.t:0 "Monsoon Shipwrights"
 ind_events.9.d:0 "Coastal shipwrights have proposed new hulls built for the monsoon routes. They claim Indish timber, foreign pilotage, and disciplined dockyards can carry our banners farther than the old seasonal convoys.\n\nThe court is divided between sea-minded merchants and inland lords who distrust every horizon. Elven pilots offer precise charts for a precise price. Spice captains offer coin, if they are allowed to keep choosing their own risks."
 ind_events.9.a:0 "Hire the foreign pilots."
 ind_events.9.b:0 "Build proper dockyards."
 ind_events.9.c:0 "Levy the spice convoys."
 ind_events.9.dd:0 "Keep our strength inland."

 ind_events.10.t:0 "The City of a Thousand Lamps"
 ind_events.10.d:0 "One of the great temple cities has lit a thousand lamps along its walls, towers, and sacred tanks. Envoys report that the sight has calmed feuding neighborhoods and drawn scholars, pilgrims, and merchants into the same glowing streets.\n\nThe priests want state support to make the rite permanent. Shrine guards want funds to keep order during the night ceremonies. Merchant houses, naturally, want their names engraved on every bronze lamp.\n\nThe gods may enjoy light, but men will argue over who pays for oil. A ruler who pays wisely may turn the glow into loyalty."
 ind_events.10.a:0 "Fund the lamps from the treasury."
 ind_events.10.b:0 "Guard the shrines through the rite."
 ind_events.10.c:0 "Invite merchant sponsors."

ind_mandala_envoys_title:0 "Mandala Envoys"
ind_mandala_envoys_desc:0 "Ind is a mandala of courts before it is a realm, so we must teach neighboring rulers to answer our envoys without mistaking courtesy for weakness."
ind_rajah_hostages_title:0 "Rajah Hostages"
ind_rajah_hostages_desc:0 "Local Rajahs hold land, forts, and elephants by inherited custom, so the crown must make those customs answer a central oath."
ind_elephant_road_forts_title:0 "Elephant Road Forts"
ind_elephant_road_forts_desc:0 "The elephant roads are rich, slow, and tempting, so forts must turn them from plunder paths into royal arteries."
ind_elephant_muster_title:0 "Elephant Muster"
ind_elephant_muster_desc:0 "The courts can no longer rely on ceremonial beasts alone, so the elephant lines must become a dependable war host."
ind_break_black_road_raids_title:0 "Break Black Road Raids"
ind_break_black_road_raids_desc:0 "Orcs, Ogres, and black-smoke tyrants test the northern roads, so Ind must prove the plunder trail ends at our forts."
ind_crackhorn_gate_title:0 "Crackhorn Gate"
ind_crackhorn_gate_desc:0 "Crackhorn is a gate of stone, spice, and road-taxes, so its horns must sound for the united realm."
ind_bodhimalai_scriptoria_title:0 "Bodhimalai Scriptoria"
ind_bodhimalai_scriptoria_desc:0 "Bodhimalai preserves holy scripts, mountain commentaries, and court law, so its scholars must write for all Ind."
ind_spice_guild_ledgers_title:0 "Spice Guild Ledgers"
ind_spice_guild_ledgers_desc:0 "The spice guilds can enrich or choke the realm, so their ledgers must be made public enough for royal use."
ind_spice_road_tollhouses_title:0 "Spice Road Tollhouses"
ind_spice_road_tollhouses_desc:0 "Road tolls are collected by custom, shrine, guild, and knife, so the crown must make the spice road countable."
ind_saffron_silk_workshops_title:0 "Saffron Silk Workshops"
ind_saffron_silk_workshops_desc:0 "Saffron, silk, dyes, and cloth pass through too many private hands, so royal workshops must bind luxury to state capacity."
ind_granaries_caravanserais_title:0 "Granaries and Caravanserais"
ind_granaries_caravanserais_desc:0 "A crowded land is only rich while its roads and granaries hold, so the monsoon stores must serve the whole canopy."
ind_black_smoke_green_hide_title:0 "Black Smoke, Green Hide"
ind_black_smoke_green_hide_desc:0 "Black smoke from the west and green-hide raids from the roads threaten the new canopy before it can settle, so the frontier must harden."
ind_dragon_toll_admiralty_title:0 "Dragon-Toll Admiralty"
ind_dragon_toll_admiralty_desc:0 "Dragons and River Ruin captains do not respect polite maps, so a united admiralty must meet them at the toll-water."
ind_river_ruin_gatekeepers_title:0 "River Ruin Gatekeepers"
ind_river_ruin_gatekeepers_desc:0 "Once the Dragon Isles are watched, River Ruin merchants must choose whether to pay in coin, gems, or fear."
ind_rajapur_spice_court_title:0 "Rajapur Spice Court"
ind_rajapur_spice_court_desc:0 "Rajapur's spice court measures aroma, weight, oath, and tax in the same breath, so its court must enrich the realm."
ind_dvaraka_tide_ledger_title:0 "Dvaraka Tide Ledger"
ind_dvaraka_tide_ledger_desc:0 "Dvaraka hears every western tide before the inland courts do, so its pilots must make the sea road a royal ledger."
ind_universities_thousand_gods_title:0 "Universities of the Thousand Gods"
ind_universities_thousand_gods_desc:0 "The Thousand Gods need more than priests, so their jurists, astronomers, and physicians must have stone halls."
ind_jeweled_court_prestige_title:0 "Jeweled Court Prestige"
ind_jeweled_court_prestige_desc:0 "The jeweled courts are too proud to follow a shabby ruler, so we must make prestige into policy."
ind_provincial_courts_title:0 "Provincial Courts"
ind_provincial_courts_desc:0 "Custom is strong because law is weak, so provincial courts must make old bargains legible to the crown."
ind_first_canopy_claims_title:0 "First Canopy Claims"
ind_first_canopy_claims_desc:0 "The canopy cannot be declared from one throne, so enough towns and courts must already live inside it."
ind_one_canopy_over_ind_title:0 "One Canopy Over Ind"
ind_one_canopy_over_ind_desc:0 "Ind has never lacked wealth or peoples; it has lacked one political imagination strong enough to hold them."
ind_celestial_line_held_title:0 "Celestial Line Held"
ind_celestial_line_held_desc:0 "Cathay's empty throne still casts a long shadow, so the eastern line must learn to meet protocol with strength."
ind_jaffna_pearl_dues_title:0 "Jaffna Pearl Dues"
ind_jaffna_pearl_dues_desc:0 "Jaffna's pearl dues depend on divers, clan elders, ferries, and shrines, so the strait must pay without tearing itself apart."
ind_malwa_plateau_court_title:0 "Malwa Plateau Court"
ind_malwa_plateau_court_desc:0 "Malwa's plateau court turns height, poetry, law, and road command into authority, so its learning must serve the canopy."
ind_twelve_banners_commerce_title:0 "Twelve Banners of Commerce"
ind_twelve_banners_commerce_desc:0 "Ind's diversity must become a commercial order so broad that twelve different trade banners answer the canopy."
ind_temple_account_keepers_title:0 "Temple Account Keepers"
ind_temple_account_keepers_desc:0 "Temples are treasuries, courts, employers, and theaters of the gods, so their accounts must serve the public rhythm."
ind_lamp_oath_scholars_title:0 "Lamp-Oath Scholars"
ind_lamp_oath_scholars_desc:0 "Lamp-oath scholars read stars, omens, contracts, and old jungle warnings, so their learning must be admitted to court."
ind_sacred_rivers_pacified_title:0 "Sacred Rivers Pacified"
ind_sacred_rivers_pacified_desc:0 "The sacred rivers bind pilgrims, ferries, markets, and cremation ghats, so disorder along them poisons the whole realm."
ind_many_tongues_title:0 "Many Tongues"
ind_many_tongues_desc:0 "Ind's many tongues are not a weakness unless the state forces them to become one, so diversity must be made administrable."
ind_envoys_empty_throne_title:0 "Envoys to the Empty Throne"
ind_envoys_empty_throne_desc:0 "Cathay's throne is empty, but its protocols remain sharp, so our envoys must know when to bow and when to count spears."
ind_hold_eastern_passes_title:0 "Hold the Eastern Passes"
ind_hold_eastern_passes_desc:0 "Eastern passes and jungle roads carry merchants in peace and armies in crisis, so they must be held before Cathay tests them."
ind_cathay_kept_at_treaty_distance_title:0 "Treaty Distance"
ind_cathay_kept_at_treaty_distance_desc:0 "Cathay must learn that Ind is not a spice garden awaiting protocol, but a peer, a wall, and a market."
ind_mrauk_u_glass_palaces_title:0 "Mrauk U Glass Palaces"
ind_mrauk_u_glass_palaces_desc:0 "Mrauk U is glass, river trade, elephant bells, and foreign tongues beneath palace roofs, so its wealth must remain ordered."
ind_stock_exchanges_monsoon_title:0 "Monsoon Stock Exchanges"
ind_stock_exchanges_monsoon_desc:0 "The spice wealth must mature from caravan profit into institutional finance, port credit, and exchange houses."
ind_diversity_thrives_title:0 "Diversity Thrives"
ind_diversity_thrives_desc:0 "The old disunity fed local custom; the new unity must let those customs thrive without letting them rule."
ind_monsoon_keels_title:0 "Monsoon Keels"
ind_monsoon_keels_desc:0 "The monsoon enriches those who respect it and drowns those who do not, so our first fleet must learn its temper."
ind_licensed_monsoon_pilots_title:0 "Licensed Monsoon Pilots"
ind_licensed_monsoon_pilots_desc:0 "Pilots, ferrymen, pearl boats, and spice captains know routes no court map records, so the state must license them."
ind_spice_sea_patrols_title:0 "Spice Sea Patrols"
ind_spice_sea_patrols_desc:0 "Spice ships invite raiders, private tolls, and foreign escorts, so patrols must make the coast feel watched."
ind_monsoon_admiralty_title:0 "Monsoon Admiralty"
ind_monsoon_admiralty_desc:0 "Pilots can guide a coast, but admirals must defend a civilization; the monsoon fleet needs command."
ind_khureshi_quarantine_posts_title:0 "Khureshi Quarantine Posts"
ind_khureshi_quarantine_posts_desc:0 "Khuresh is a warning written in green ink, so the border posts must quarantine venom, rumor, and raiders alike."
ind_coils_beyond_jungle_title:0 "Coils Beyond the Jungle"
ind_coils_beyond_jungle_desc:0 "The serpent courts can be held beyond the border, broken in the jungle, or forced to treat with Ind from fear."
ind_khuresh_answered_title:0 "Khuresh Answered"
ind_khuresh_answered_desc:0 "Khuresh must never again decide whether Ind is prey; either the jungle bends, or the border becomes a wall of spears."
ind_pegu_river_mandala_title:0 "Pegu River Mandala"
ind_pegu_river_mandala_desc:0 "Pegu is a river mandala of ports, monks, guilds, and tolls, so its delta politics must flow through the canopy."
ind_veterans_frontier_title:0 "Veterans of the Frontier"
ind_veterans_frontier_desc:0 "The frontier has taught expensive lessons, so veterans, barracks, and drill yards must keep those lessons alive."

ind_defeat_or_secure_darklands_tt:0 "Defeat a Greenskin, Chaos Dwarf, Ogre-road, or Darklands power in war within the last 50 years, or secure Ind with at least 5 level 2 forts and full army strength."
ind_defeat_or_contain_cathay_tt:0 "Defeat a Cathayan power in war within the last 50 years, or secure eastern Ind with at least 4 level 2 forts and full army strength."
ind_defeat_or_enter_khuresh_tt:0 "Own or subject at least 5 provinces in Khuresh, or defeat a Khureshi power in war within the last 50 years."

ind_mandala_envoys_mod:0 "Mandala Envoys"
desc_ind_mandala_envoys_mod:0 "Our envoys have learned to turn Ind's courtly diversity into useful diplomacy."
ind_elephant_road_forts_mod:0 "Elephant Road Forts"
desc_ind_elephant_road_forts_mod:0 "The inland roads are anchored by forts that answer the canopy."
ind_elephant_muster_mod:0 "Elephant Muster"
desc_ind_elephant_muster_mod:0 "Ceremonial elephant lines have become a disciplined arm of war."
ind_black_road_raids_broken_mod:0 "Black Road Raids Broken"
desc_ind_black_road_raids_broken_mod:0 "The northern raiders have learned that Ind's roads end at prepared armies."
ind_spice_road_tollhouses_mod:0 "Spice Road Tollhouses"
desc_ind_spice_road_tollhouses_mod:0 "Royal tollhouses make the spice roads easier to count, protect, and tax."
ind_saffron_silk_workshops_mod:0 "Saffron Silk Workshops"
desc_ind_saffron_silk_workshops_mod:0 "Luxury workshops now turn Ind's dyes, cloth, and silk into state capacity."
ind_granaries_caravanserais_mod:0 "Granaries and Caravanserais"
desc_ind_granaries_caravanserais_mod:0 "The monsoon stores and caravanserais keep a crowded realm moving."
ind_black_smoke_green_hide_mod:0 "Black Smoke, Green Hide"
desc_ind_black_smoke_green_hide_mod:0 "Threats from the north and west have sharpened Ind's mustering habits."
ind_river_ruin_gatekeepers_mod:0 "River Ruin Gatekeepers"
desc_ind_river_ruin_gatekeepers_mod:0 "River Ruin merchants now meet Indish tolls before they meet Indish markets."
ind_universities_thousand_gods_mod:0 "Universities of the Thousand Gods"
desc_ind_universities_thousand_gods_mod:0 "Stone halls give priests, jurists, astronomers, and physicians a shared place in public life."
ind_jeweled_court_prestige_mod:0 "Jeweled Court Prestige"
desc_ind_jeweled_court_prestige_mod:0 "The glitter of the court has been made useful to government."
ind_provincial_courts_mod:0 "Provincial Courts"
desc_ind_provincial_courts_mod:0 "Old bargains and local customs now pass through courts the canopy can understand."
ind_twelve_banners_commerce_mod:0 "Twelve Banners of Commerce"
desc_ind_twelve_banners_commerce_mod:0 "Twelve trade banners answer the canopy, and the world's appetite now moves through Indish ledgers."
ind_sacred_rivers_pacified_mod:0 "Sacred Rivers Pacified"
desc_ind_sacred_rivers_pacified_mod:0 "Order along the sacred rivers quiets pilgrims, markets, and temple towns alike."
ind_many_tongues_mod:0 "Many Tongues"
desc_ind_many_tongues_mod:0 "The languages of Ind have been made administrable without being made small."
ind_envoys_empty_throne_mod:0 "Envoys to the Empty Throne"
desc_ind_envoys_empty_throne_mod:0 "Our diplomats know how to answer Cathayan protocol with courtesy and steel."
ind_hold_eastern_passes_mod:0 "Eastern Passes Held"
desc_ind_hold_eastern_passes_mod:0 "The eastern passes are maintained as roads in peace and fortresses in crisis."
ind_cathay_treaty_distance_mod:0 "Treaty Distance"
desc_ind_cathay_treaty_distance_mod:0 "Cathay must treat Ind as a peer beyond easy intimidation."
ind_stock_exchanges_monsoon_mod:0 "Monsoon Stock Exchanges"
desc_ind_stock_exchanges_monsoon_mod:0 "Spice wealth has matured into credit, exchange houses, and port finance."
ind_diversity_thrives_mod:0 "Diversity Thrives"
desc_ind_diversity_thrives_mod:0 "Custom thrives beneath the canopy without becoming a rival throne."
ind_monsoon_keels_mod:0 "Monsoon Keels"
desc_ind_monsoon_keels_mod:0 "Our first state keels are built around the season's anger instead of against it."
ind_licensed_monsoon_pilots_mod:0 "Licensed Monsoon Pilots"
desc_ind_licensed_monsoon_pilots_mod:0 "Private sea knowledge now serves public routes."
ind_spice_sea_patrols_mod:0 "Spice Sea Patrols"
desc_ind_spice_sea_patrols_mod:0 "Patrols make private tolls and coastal raiders think twice."
ind_monsoon_admiralty_mod:0 "Monsoon Admiralty"
desc_ind_monsoon_admiralty_mod:0 "The fleet has commanders who understand both war and weather."
ind_khureshi_quarantine_posts_mod:0 "Khureshi Quarantine Posts"
desc_ind_khureshi_quarantine_posts_mod:0 "The eastern posts watch for venom, rumor, and infiltration from the serpent courts."
ind_khuresh_answered_mod:0 "Khuresh Answered"
desc_ind_khuresh_answered_mod:0 "Khuresh can no longer decide whether Ind is prey without paying the price."
ind_veterans_frontier_mod:0 "Veterans of the Frontier"
desc_ind_veterans_frontier_mod:0 "Frontier veterans keep hard lessons alive in drill yards and barracks."
ind_one_canopy_centralized_mod:0 "Centralized Canopy"
desc_ind_one_canopy_centralized_mod:0 "The canopy is held by court law and a firmer royal hand."
ind_one_canopy_mandala_mod:0 "Mandala Canopy"
desc_ind_one_canopy_mandala_mod:0 "The canopy recognizes local custom and turns it toward the realm."
ind_one_canopy_temple_mod:0 "Processional Canopy"
desc_ind_one_canopy_temple_mod:0 "The canopy moves through temple procession, oath, and sacred spectacle."
ind_dragon_toll_admiralty_mod:0 "Dragon-Toll Admiralty"
desc_ind_dragon_toll_admiralty_mod:0 "Fear of dragons has become naval discipline."
ind_dragon_toll_pilots_mod:0 "Dragon-Toll Pilots"
desc_ind_dragon_toll_pilots_mod:0 "Pilots on the dangerous routes turn fear into trade power."
ind_dragon_toll_tribute_mod:0 "Priced Dragon Tribute"
desc_ind_dragon_toll_tribute_mod:0 "Even tribute to monsters can be measured, recorded, and bent toward profit."
ind_celestial_line_forts_mod:0 "Celestial Line Forts"
desc_ind_celestial_line_forts_mod:0 "Eastern fortresses answer Cathayan protocol with stone."
ind_celestial_line_envoys_mod:0 "Celestial Line Envoys"
desc_ind_celestial_line_envoys_mod:0 "Our envoys can meet Cathayan pride without surrendering Indish dignity."
ind_celestial_line_markets_mod:0 "Celestial Line Markets"
desc_ind_celestial_line_markets_mod:0 "Trade gives Ind leverage where armies alone would be too blunt."
ind_khuresh_wall_mod:0 "Wall Against Khuresh"
desc_ind_khuresh_wall_mod:0 "The jungle border has become a wall of watchers, posts, and hard roads."
ind_khuresh_jungle_war_mod:0 "Jungle War Doctrine"
desc_ind_khuresh_jungle_war_mod:0 "Indish soldiers have learned how to fight where the green closes in."
ind_khuresh_serpent_treaties_mod:0 "Serpent Treaties"
desc_ind_khuresh_serpent_treaties_mod:0 "Treaties with Khuresh are written as warnings as much as agreements."
ind_crackhorn_gate_mod:0 "Crackhorn Gate"
desc_ind_crackhorn_gate_mod:0 "Crackhorn commands road tolls, spice traffic, and hard stone gates."
ind_bodhimalai_scriptoria_mod:0 "Bodhimalai Scriptoria"
desc_ind_bodhimalai_scriptoria_mod:0 "Bodhimalai's commentaries now circulate through the learned courts of Ind."
ind_rajapur_spice_court_mod:0 "Rajapur Spice Court"
desc_ind_rajapur_spice_court_mod:0 "Rajapur grades aroma, oath, and revenue in the same public court."
ind_dvaraka_tide_ledger_mod:0 "Dvaraka Tide Ledger"
desc_ind_dvaraka_tide_ledger_mod:0 "Dvaraka's pilots have made the western tides legible to the crown."
ind_jaffna_pearl_dues_mod:0 "Jaffna Pearl Dues"
desc_ind_jaffna_pearl_dues_mod:0 "Jaffna's divers, ferries, and shrine dues now serve the wider realm."
ind_malwa_plateau_court_mod:0 "Malwa Plateau Court"
desc_ind_malwa_plateau_court_mod:0 "Malwa's height, poetry, and road law reinforce the canopy."
ind_mrauk_u_glass_palaces_mod:0 "Mrauk U Glass Palaces"
desc_ind_mrauk_u_glass_palaces_mod:0 "Mrauk U orders river trade and foreign tongues beneath glass palace roofs."
ind_pegu_river_mandala_mod:0 "Pegu River Mandala"
desc_ind_pegu_river_mandala_mod:0 "Pegu's monks, guilds, ports, and tolls now flow through one delta order."

ind_events.100.t:0 "One Canopy Over Ind"
ind_events.100.d:0 "The old courts have sent their elephants, jeweled umbrellas, temple lamps, and seal-bearing clerks to stand beneath one canopy. No one in the crowd believes disunity has vanished. They do believe, perhaps for the first time in generations, that disunity must explain itself.\n\nThe question now is what kind of unity Ind will recognize. Court ministers want law and capacity, Rajahs want their customs honored, and priests insist the Thousand Gods must be seen leading the procession."
ind_events.100.a:0 "Bind the courts beneath royal law."
ind_events.100.b:0 "Let each mandala keep its honored place."
ind_events.100.c:0 "Process with the Thousand Gods."

ind_events.101.t:0 "The Dragon-Toll Admiralty"
ind_events.101.d:0 "The River Ruin routes carry gem tribute, terrified captains, dragon rumors, and captives who have seen too much. The Dragon Isles are not a polite neighbor, but they are close enough that Ind cannot pretend the sea ends at a map line.\n\nAdmirals demand harder command, pilots ask for licenses over routes only they know, and merchants argue that even fear can be priced. The canopy must decide what kind of toll-water this will become."
ind_events.101.a:0 "Drill the admiralty for hard waters."
ind_events.101.b:0 "License the pilots who know the fear-routes."
ind_events.101.c:0 "Price the tribute and tax the passage."

ind_events.102.t:0 "The Celestial Line Held"
ind_events.102.d:0 "Cathayan protocol has reached the eastern passes in silk, jade, and threat. The Dragon Emperor's absence has not emptied Cathay of pride, nor has Ind's wealth made it invisible to officials who still write as though the world should queue before their gates.\n\nThe passes held. Now the court must decide whether the answer is stone, etiquette, or commercial pressure. Each will be understood in Cathay, though not in the same language."
ind_events.102.a:0 "Let the fortresses speak first."
ind_events.102.b:0 "Send envoys who know every bow."
ind_events.102.c:0 "Bind the frontier with markets."

ind_events.103.t:0 "Coils Beyond the Jungle"
ind_events.103.d:0 "Khuresh has always been close enough for rumor and far enough for fear to grow teeth. Serpent courts, jungle raiders, and venomous cults have tested the border while Ind argued with itself over who should answer.\n\nThe answer now belongs to the canopy. We can wall the jungle, carry war southward, or write treaties that treat the serpent courts as dangers to be watched instead of mysteries to be whispered about."
ind_events.103.a:0 "Wall the jungle and watch every road."
ind_events.103.b:0 "Carry the war into the coils."
ind_events.103.c:0 "Treaty the serpents from strength."

ind_clove_contracts_title:0 "Clove Contracts"
ind_clove_contracts_desc:0 "Clove groves, island brokers, and jungle roads enrich whoever can measure them, so the canopy must bind their fragrance to public contracts."
ind_spice_weight_standards_title:0 "Spice Weight Standards"
ind_spice_weight_standards_desc:0 "Spices cannot enrich one canopy while every port weighs them differently, so royal standards must make the trade legible from grove to wharf."
ind_tropical_wood_yards_title:0 "Tropical Wood Yards"
ind_tropical_wood_yards_desc:0 "Tropical wood is more than jungle wealth; it is hulls, wharves, temple beams, and state reach, so the yards must answer the canopy."
ind_monsoon_exchange_houses_title:0 "Monsoon Exchange Houses"
ind_monsoon_exchange_houses_desc:0 "The monsoon makes fortunes and ruins them, so exchange houses must turn seasonal risk into credit rather than panic."
ind_clove_spice_factors_title:0 "Clove and Spice Factors"
ind_clove_spice_factors_desc:0 "Clove groves and spice ports must report to factors who answer the canopy before they answer private guild houses."
ind_twelve_trade_courts_title:0 "Twelve Trade Courts"
ind_twelve_trade_courts_desc:0 "The diversity of Ind can command the world's appetite only if twelve trade courts translate custom into enforceable commercial law."
ind_canopy_road_survey_title:0 "Canopy Road Survey"
ind_canopy_road_survey_desc:0 "Surveyors and road clerks must make the canopy visible where local custom once hid obligations from every distant throne."
ind_tiger_courts_south_title:0 "Tiger Courts of the South"
ind_tiger_courts_south_desc:0 "Tigerfolk courts know the southern jungle roads, so Ind must bind them through honor before fear turns them into permanent rivals."
ind_tiger_claw_auxiliaries_title:0 "Tiger Claw Auxiliaries"
ind_tiger_claw_auxiliaries_desc:0 "Tiger claws in royal service must be auxiliaries with pay, command, and oaths, not rumors bought in panic when the jungle stirs."
ind_imperial_canopy_bureau_title:0 "Imperial Canopy Bureau"
ind_imperial_canopy_bureau_desc:0 "A realm of so many peoples needs offices that can hear provincial reports without flattening the land beneath them."
ind_frontier_mandalas_title:0 "Frontier Mandalas"
ind_frontier_mandalas_desc:0 "The frontier mandalas must turn Ind's new unity toward the powers that once fed on its disunity: orcs, black smoke, dragons, Cathay, and Khuresh."
ind_markets_under_one_canopy_title:0 "Markets Under One Canopy"
ind_markets_under_one_canopy_desc:0 "Ind's diversity must become a commercial order broad enough that foreign ledgers answer its prices before they answer their own courts."
ind_cities_under_one_canopy_title:0 "Cities Under One Canopy"
ind_cities_under_one_canopy_desc:0 "The eight great urban mandalas have entered the canopy without losing their particular splendor, so their shared order can now become national strength."
ind_census_thousand_peoples_title:0 "Census of the Thousand Peoples"
ind_census_thousand_peoples_desc:0 "A census of the thousand peoples must record obligations without pretending every language, caste, shrine, and guild is the same."
ind_tigerfolk_compact_title:0 "Tigerfolk Compact"
ind_tigerfolk_compact_desc:0 "A compact with the Tigerfolk turns fear of the jungle courts into recognized obligations, shared defense, and quieter roads."
ind_tame_blood_groves_title:0 "Tame the Blood Groves"
ind_tame_blood_groves_desc:0 "Blood groves, old offerings, and tiger courts must be contained before rumor becomes rule along the southern roads."
ind_royal_weighing_houses_title:0 "Royal Weighing Houses"
ind_royal_weighing_houses_desc:0 "Royal weighing houses must turn custom, scent, pearl, and coin into public measures that no guild can quietly bend."
ind_court_many_customs_title:0 "Court of Many Customs"
ind_court_many_customs_desc:0 "A court of many customs must make diversity administrable without reducing it to one language, one shrine, or one brittle law."
ind_guild_oath_reforms_title:0 "Guild Oath Reforms"
ind_guild_oath_reforms_desc:0 "Guild oaths must bind private houses to the public order of the canopy, so wealth builds roads instead of rival thrones."
ind_temple_port_endowments_title:0 "Temple Port Endowments"
ind_temple_port_endowments_desc:0 "Temple ports must endow shrines, piers, and ferry-rights without letting each holy harbor become a private kingdom."

ind_defeat_or_secure_dragon_isles_tt:0 "Own or subject at least 3 provinces in the Dragon Isles, or defeat a Dragon Isles power in war within the last 50 years."

ind_canopy_road_survey_mod:0 "Canopy Road Survey"
desc_ind_canopy_road_survey_mod:0 "Road surveys make local obligations visible enough for state building."
ind_tiger_courts_south_mod:0 "Tiger Courts of the South"
desc_ind_tiger_courts_south_mod:0 "Recognized Tigerfolk courts make one more people governable under the canopy."
ind_tiger_claw_auxiliaries_mod:0 "Tiger Claw Auxiliaries"
desc_ind_tiger_claw_auxiliaries_mod:0 "Tigerfolk auxiliaries add ferocity and discipline to the royal host."
ind_imperial_canopy_bureau_mod:0 "Imperial Canopy Bureau"
desc_ind_imperial_canopy_bureau_mod:0 "A bureau built for many customs lets the realm govern more without becoming brittle."
ind_clove_contracts_mod:0 "Clove Contracts"
desc_ind_clove_contracts_mod:0 "Clove contracts make a luxury trade answer public ledgers."
ind_spice_weight_standards_mod:0 "Spice Weight Standards"
desc_ind_spice_weight_standards_mod:0 "Standard weights make Ind's spice merchants stronger in their own markets."
ind_tropical_wood_yards_mod:0 "Tropical Wood Yards"
desc_ind_tropical_wood_yards_mod:0 "Jungle timber is now cut, seasoned, and counted for shipyards."
ind_monsoon_exchange_houses_mod:0 "Monsoon Exchange Houses"
desc_ind_monsoon_exchange_houses_mod:0 "Seasonal trade risk has become productive credit."
ind_clove_spice_factors_mod:0 "Clove and Spice Factors"
desc_ind_clove_spice_factors_mod:0 "Factors in the groves and ports raise the output of Ind's most coveted goods."
ind_twelve_trade_courts_mod:0 "Twelve Trade Courts"
desc_ind_twelve_trade_courts_mod:0 "Twelve courts steer Ind's diverse commerce through one legal order."
ind_census_thousand_peoples_mod:0 "Census of the Thousand Peoples"
desc_ind_census_thousand_peoples_mod:0 "A better census turns population into steadier revenue."
ind_court_many_customs_mod:0 "Court of Many Customs"
desc_ind_court_many_customs_mod:0 "Accepted peoples see themselves represented in the court's habits."
ind_guild_oath_reforms_mod:0 "Guild Oath Reforms"
desc_ind_guild_oath_reforms_mod:0 "Guild obligations now help pay for public works."
ind_temple_port_endowments_mod:0 "Temple Port Endowments"
desc_ind_temple_port_endowments_mod:0 "Shrine ports now support sailors as well as pilgrims."
ind_royal_weighing_houses_mod:0 "Royal Weighing Houses"
desc_ind_royal_weighing_houses_mod:0 "Public weights and measures strengthen Indish trade power."
ind_frontier_mandalas_mod:0 "Frontier Mandalas"
desc_ind_frontier_mandalas_mod:0 "The outer marches are organized as watchful mandalas of fort, road, and court."
ind_markets_under_one_canopy_mod:0 "Markets Under One Canopy"
desc_ind_markets_under_one_canopy_mod:0 "Ind's home markets are harder for foreign merchants to dislodge."
ind_cities_under_one_canopy_mod:0 "Cities Under One Canopy"
desc_ind_cities_under_one_canopy_mod:0 "The great cities quiet the realm by proving unity need not erase local splendor."
ind_tigerfolk_compact_mod:0 "Tigerfolk Compact"
desc_ind_tigerfolk_compact_mod:0 "The compact quiets the southern jungle courts."
ind_tame_blood_groves_mod:0 "Tamed Blood Groves"
desc_ind_tame_blood_groves_mod:0 "Enemies who cross the green border pay for every step."
