desc_ind_unified_jaffna_pearl_dues_mod:0 "Jaffna's divers, ferries, and shrine dues now serve the wider unified realm."
ind_unified_malwa_plateau_court_mod:0 "Malwa Plateau Court"
desc_ind_unified_malwa_plateau_court_mod:0 "Malwa's height, poetry, and road law reinforce the united canopy."
ind_unified_mrauk_u_glass_palaces_mod:0 "Mrauk U Glass Palaces"
desc_ind_unified_mrauk_u_glass_palaces_mod:0 "Mrauk U orders river trade and foreign tongues beneath glass palace roofs for all Ind."
ind_unified_pegu_river_mandala_mod:0 "Pegu River Mandala"
desc_ind_unified_pegu_river_mandala_mod:0 "Pegu's monks, guilds, ports, and tolls now flow through one unified delta order."

ind_events.100.t:0 "The Charters Beneath the State Canopy"
ind_events.100.d:0 "Delegates from the courts of Ind assemble at [Root.Capital.GetName] to swear allegiance beneath the state canopy. The ceremony stops when two delegations present charters granting them authority over the same river crossing. Their attendants begin arguing before the witnesses have taken their places.\n\nThe chief minister clears a table and lays out the charters beside the new levy rolls. Similar contradictions appear in the records of several other districts, each supported by generations of local judgments.\n\nThe delegates agree to remain until the court establishes how such disputes will be heard. Temple representatives bring their own records of oaths, while the scribes prepare to copy a settlement for every province. The assembled courts are ready to recognize a common authority, but its powers must now be written down."
ind_events.100.a:0 "Place provincial administration under a single state register."
ind_events.100.b:0 "Recognize the laws and customs of our different peoples."
ind_events.100.c:0 "Entrust the oaths to religious courts and protect the faithful."

ind_events.101.t:0 "Three Tolls for One Cargo"
ind_events.101.d:0 "Captain Mira returns from the River Ruin with three receipts for the same cargo. One was issued by an island harbor chief, another by the keeper of a dragon's feeding terrace, and the third by a patrol that refused to recognize either payment. Her crew lost two days waiting offshore while the collectors argued.\n\nThe captain presents the receipts to the new admiralty alongside her sailing chart. Other masters report similar demands, and several refuse to make another voyage without agreed instructions. Our fleet can now maintain a regular presence on the route, but its commanders need a settled policy for these encounters."
ind_events.101.a:0 "Drill the fleet to stand firm against intimidation at sea."
ind_events.101.b:0 "License experienced pilots to guide and organize our trading ships."
ind_events.101.c:0 "Negotiate fixed tribute payments and direct traffic through agreed ports."

ind_events.102.t:0 "The Envoy's Revised Proclamation"
ind_events.102.d:0 "A Cathayan envoy arrives at [Root.Capital.GetName] with a proclamation describing our eastern officials as keepers of a tributary frontier. Our chamberlain refuses to read it at the public audience. He places reports of our army and frontier positions beside the document and asks the envoy to revise his terms.\n\nAfter consulting his attendants, the envoy returns with a new address recognizing [Root.Monarch.GetName]'s authority. He asks for permanent arrangements covering the passes, envoys, and merchants moving between the two realms. The court has secured a hearing on equal terms; it must now decide which work receives lasting support."
ind_events.102.a:0 "Strengthen the fortifications guarding our approaches."
ind_events.102.b:0 "Establish an embassy trained in Cathayan court protocol."
ind_events.102.c:0 "Secure trading privileges for our merchants in foreign markets."

ind_events.103.t:0 "The Prisoner with the Serpent Seal"
ind_events.103.d:0 "A patrol brings a Khureshi messenger to our frontier headquarters with a sealed letter sewn into his clothing. Under guard, he identifies the routes used by raiders and names a serpent court willing to discuss their withdrawal. The commander sends the letter and a copy of his testimony to [Root.Capital.GetName].\n\nA scout recognizes one of the named routes and confirms that a camp there was recently abandoned. Other tracks still lead into the jungle, and the messenger admits that his mistress cannot answer for every raiding band.\n\nThe frontier captains have enough men to act on the information, while the court's interpreters have prepared a reply. For the first time, we can pursue these claims with troops and officials already in place. The messenger remains under guard until the court decides its policy."
ind_events.103.a:0 "Fortify the frontier and make every invasion costly."
ind_events.103.b:0 "Prepare the troops for jungle war and claim the lands of Khuresh."
ind_events.103.c:0 "Establish regular negotiations with the serpent courts."

ind_clove_contracts_title:0 "Clove Contracts"
ind_clove_contracts_desc:0 "Clove groves, island brokers, and jungle roads enrich whoever can measure them, so the canopy must bind their fragrance to public contracts."
ind_spice_weight_standards_title:0 "Spice Weight Standards"
ind_spice_weight_standards_desc:0 "Spices cannot enrich one canopy while every port weighs them differently, so royal standards must make the trade legible from grove to wharf."
ind_tropical_wood_yards_title:0 "Tropical Wood Yards"
ind_tropical_wood_yards_desc:0 "Tropical wood is more than jungle wealth; it is hulls, wharves, temple beams, and state reach, so the yards must answer the canopy."
ind_monsoon_exchange_houses_title:0 "Monsoon Exchange Houses"
ind_monsoon_exchange_houses_desc:0 "The monsoon makes fortunes and ruins them, so exchange houses must turn seasonal risk into credit rather than panic."
ind_clove_spice_factors_title:0 "Clove and Spice Factors"
ind_clove_spice_factors_desc:0 "Clove groves and spice ports must report to factors who answer the canopy before they answer private guild houses."
ind_twelve_trade_courts_title:0 "Twelve Trade Courts"
ind_twelve_trade_courts_desc:0 "The diversity of Ind can command the world's appetite only if twelve trade courts translate custom into enforceable commercial law."
ind_canopy_road_survey_title:0 "Canopy Road Survey"
ind_canopy_road_survey_desc:0 "Surveyors and road clerks must make the canopy visible where local custom once hid obligations from every distant throne."
ind_tiger_courts_south_title:0 "Tiger Courts of the South"
ind_tiger_courts_south_desc:0 "Tigerfolk courts know the southern jungle roads, so Ind must bind them through honor before fear turns them into permanent rivals."
ind_tiger_claw_auxiliaries_title:0 "Tiger Claw Auxiliaries"
ind_tiger_claw_auxiliaries_desc:0 "Tiger claws in royal service must be auxiliaries with pay, command, and oaths, not rumors bought in panic when the jungle stirs."
ind_imperial_canopy_bureau_title:0 "Imperial Canopy Bureau"
ind_imperial_canopy_bureau_desc:0 "A realm of so many peoples needs offices that can hear provincial reports without flattening the land beneath them."
ind_frontier_mandalas_title:0 "Frontier Mandalas"
ind_frontier_mandalas_desc:0 "The frontier mandalas must turn Ind's new unity toward the powers that once fed on its disunity: orcs, black smoke, dragons, Cathay, and Khuresh."
ind_markets_under_one_canopy_title:0 "Markets Under One Canopy"
ind_markets_under_one_canopy_desc:0 "Ind's diversity must become a commercial order broad enough that foreign ledgers answer its prices before they answer their own courts."
ind_cities_under_one_canopy_title:0 "Cities Under One Canopy"
ind_cities_under_one_canopy_desc:0 "The eight great urban mandalas have entered the canopy without losing their particular splendor, so their shared order can now become national strength."
ind_census_thousand_peoples_title:0 "Census of the Thousand Peoples"
ind_census_thousand_peoples_desc:0 "A census of the thousand peoples must record obligations without pretending every language, caste, shrine, and guild is the same."
ind_tigerfolk_compact_title:0 "Tigerfolk Compact"
ind_tigerfolk_compact_desc:0 "A compact with the Tigerfolk turns fear of the jungle courts into recognized obligations, shared defense, and quieter roads."
ind_tame_blood_groves_title:0 "Tame the Blood Groves"
ind_tame_blood_groves_desc:0 "Blood groves, old offerings, and tiger courts must be contained before rumor becomes rule along the southern roads."
ind_royal_weighing_houses_title:0 "Royal Weighing Houses"
ind_royal_weighing_houses_desc:0 "Royal weighing houses must turn custom, scent, pearl, and coin into public measures that no guild can quietly bend."
ind_court_many_customs_title:0 "Court of Many Customs"
ind_court_many_customs_desc:0 "A court of many customs must make diversity administrable without reducing it to one language, one shrine, or one brittle law."
ind_guild_oath_reforms_title:0 "Guild Oath Reforms"
ind_guild_oath_reforms_desc:0 "Guild oaths must bind private houses to the public order of the canopy, so wealth builds roads instead of rival thrones."
ind_temple_port_endowments_title:0 "Temple Port Endowments"
ind_temple_port_endowments_desc:0 "Temple ports must endow shrines, piers, and ferry-rights without letting each holy harbor become a private kingdom."

ind_defeat_or_secure_dragon_isles_tt:0 "Own or subject at least 3 provinces in the Dragon Isles, or defeat a Dragon Isles power in war within the last 50 years."

ind_canopy_road_survey_mod:0 "Canopy Road Survey"
desc_ind_canopy_road_survey_mod:0 "Road surveys make local obligations visible enough for state building."
ind_tiger_courts_south_mod:0 "Tiger Courts of the South"
desc_ind_tiger_courts_south_mod:0 "Recognized Tigerfolk courts make one more people governable under the canopy."
ind_tiger_claw_auxiliaries_mod:0 "Tiger Claw Auxiliaries"
desc_ind_tiger_claw_auxiliaries_mod:0 "Tigerfolk auxiliaries add ferocity and discipline to the royal host."
ind_imperial_canopy_bureau_mod:0 "Imperial Canopy Bureau"
desc_ind_imperial_canopy_bureau_mod:0 "A bureau built for many customs lets the realm govern more without becoming brittle."
ind_clove_contracts_mod:0 "Clove Contracts"
desc_ind_clove_contracts_mod:0 "Clove contracts make a luxury trade answer public ledgers."
ind_spice_weight_standards_mod:0 "Spice Weight Standards"
desc_ind_spice_weight_standards_mod:0 "Standard weights make Ind's spice merchants stronger in their own markets."
ind_tropical_wood_yards_mod:0 "Tropical Wood Yards"
desc_ind_tropical_wood_yards_mod:0 "Jungle timber is now cut, seasoned, and counted for shipyards."
ind_monsoon_exchange_houses_mod:0 "Monsoon Exchange Houses"
desc_ind_monsoon_exchange_houses_mod:0 "Seasonal trade risk has become productive credit."
ind_clove_spice_factors_mod:0 "Clove and Spice Factors"
desc_ind_clove_spice_factors_mod:0 "Factors in the groves and ports raise the output of Ind's most coveted goods."
ind_twelve_trade_courts_mod:0 "Twelve Trade Courts"
desc_ind_twelve_trade_courts_mod:0 "Twelve courts steer Ind's diverse commerce through one legal order."
ind_census_thousand_peoples_mod:0 "Census of the Thousand Peoples"
desc_ind_census_thousand_peoples_mod:0 "A better census turns population into steadier revenue."
ind_court_many_customs_mod:0 "Court of Many Customs"
desc_ind_court_many_customs_mod:0 "Accepted peoples see themselves represented in the court's habits."
ind_guild_oath_reforms_mod:0 "Guild Oath Reforms"
desc_ind_guild_oath_reforms_mod:0 "Guild obligations now help pay for public works."
ind_temple_port_endowments_mod:0 "Temple Port Endowments"
desc_ind_temple_port_endowments_mod:0 "Shrine ports now support sailors as well as pilgrims."
ind_royal_weighing_houses_mod:0 "Royal Weighing Houses"
desc_ind_royal_weighing_houses_mod:0 "Public weights and measures strengthen Indish trade power."
ind_frontier_mandalas_mod:0 "Frontier Mandalas"
desc_ind_frontier_mandalas_mod:0 "The outer marches are organized as watchful mandalas of fort, road, and court."
ind_markets_under_one_canopy_mod:0 "Markets Under One Canopy"
desc_ind_markets_under_one_canopy_mod:0 "Ind's home markets are harder for foreign merchants to dislodge."
ind_cities_under_one_canopy_mod:0 "Cities Under One Canopy"
desc_ind_cities_under_one_canopy_mod:0 "The great cities quiet the realm by proving unity need not erase local splendor."
ind_tigerfolk_compact_mod:0 "Tigerfolk Compact"
desc_ind_tigerfolk_compact_mod:0 "The compact quiets the southern jungle courts."
ind_tame_blood_groves_mod:0 "Tamed Blood Groves"
desc_ind_tame_blood_groves_mod:0 "Enemies who cross the green border pay for every step."

# New Ind mission tree
ind_unified_mandala_envoys_title:0 "Mandala Envoys"
ind_unified_mandala_envoys_desc:0 "Ind is a mandala of courts before it is a realm, so we must teach neighboring rulers to answer our envoys without mistaking courtesy for weakness."
ind_unified_rajah_hostages_title:0 "Rajah Hostages"
ind_unified_rajah_hostages_desc:0 "Local Rajahs hold land, forts, and elephants by inherited custom, so the crown must make those customs answer a central oath."
ind_unified_elephant_road_forts_title:0 "Elephant Road Forts"
ind_unified_elephant_road_forts_desc:0 "The elephant roads are rich, slow, and tempting, so forts must turn them from plunder paths into royal arteries."
ind_unified_elephant_muster_title:0 "Elephant Muster"
ind_unified_elephant_muster_desc:0 "The courts can no longer rely on ceremonial beasts alone, so the elephant lines must become a dependable war host."
ind_unified_canopy_road_survey_title:0 "Canopy Road Survey"
ind_unified_canopy_road_survey_desc:0 "Surveyors and road clerks must make the canopy visible where local custom once hid obligations from every distant throne."
ind_unified_tiger_courts_south_title:0 "Tiger Courts of the South"
ind_unified_tiger_courts_south_desc:0 "Tigerfolk courts know the southern jungle roads, so Ind must bind them through honor before fear turns them into permanent rivals."
ind_unified_tiger_claw_auxiliaries_title:0 "Tiger Claw Auxiliaries"
ind_unified_tiger_claw_auxiliaries_desc:0 "Tiger claws in royal service must be auxiliaries with pay, command, and oaths, not rumors bought in panic when the jungle stirs."
ind_unified_imperial_canopy_bureau_title:0 "Imperial Canopy Bureau"
ind_unified_imperial_canopy_bureau_desc:0 "A realm of so many peoples needs offices that can hear provincial reports without flattening the land beneath them."
ind_unified_black_smoke_green_hide_title:0 "Mourn Road Footholds"
ind_unified_black_smoke_green_hide_desc:0 "Black smoke from the west and green-hide raids from the mountain roads threaten the new canopy, so Ind must seize footholds through the Mourn and turn toward Gnoblar Country."
ind_unified_break_black_road_raids_title:0 "Break Black Road Raids"
ind_unified_break_black_road_raids_desc:0 "Orcs, Ogres, and black-smoke tyrants test the northern roads from the Darklands, so Ind must take the road war west and open the way toward the Southern Wastes."
ind_unified_dragon_isles_footholds_title:0 "Dragon Isles Footholds"
ind_unified_dragon_isles_footholds_desc:0 "The Dragon Isles cannot remain a rumor beyond the monsoon routes, so Ind must seize island footholds before claiming the rest of the scaled frontier."
ind_unified_crackhorn_gate_title:0 "Crackhorn Gate"
ind_unified_crackhorn_gate_desc:0 "Crackhorn is a gate of stone, spice, and road-taxes, so its horns must sound for the united realm."
ind_unified_bodhimalai_scriptoria_title:0 "Bodhimalai Scriptoria"
ind_unified_bodhimalai_scriptoria_desc:0 "Bodhimalai preserves holy scripts, mountain commentaries, and court law, so its scholars must write for all Ind."
ind_unified_spice_guild_ledgers_title:0 "Spice Guild Ledgers"
ind_unified_spice_guild_ledgers_desc:0 "The spice guilds can enrich or choke the realm, so their ledgers must be made public enough for royal use."
ind_unified_spice_road_tollhouses_title:0 "Spice Road Tollhouses"
ind_unified_spice_road_tollhouses_desc:0 "Road tolls are collected by custom, shrine, guild, and knife, so the crown must make the spice road countable."
ind_unified_saffron_silk_workshops_title:0 "Saffron Silk Workshops"
ind_unified_saffron_silk_workshops_desc:0 "Saffron, silk, dyes, and cloth pass through too many private hands, so royal workshops must bind luxury to state capacity."
ind_unified_granaries_caravanserais_title:0 "Granaries and Caravanserais"
ind_unified_granaries_caravanserais_desc:0 "A crowded land is only rich while its roads and granaries hold, so the monsoon stores must serve the whole canopy."
ind_unified_clove_contracts_title:0 "Clove Contracts"
ind_unified_clove_contracts_desc:0 "Clove groves, island brokers, and jungle roads enrich whoever can measure them, so the canopy must bind their fragrance to public contracts."
ind_unified_spice_weight_standards_title:0 "Spice Weight Standards"
ind_unified_spice_weight_standards_desc:0 "Spices cannot enrich one canopy while every port weighs them differently, so royal standards must make the trade legible from grove to wharf."
ind_unified_tropical_wood_yards_title:0 "Tropical Wood Yards"
ind_unified_tropical_wood_yards_desc:0 "Tropical wood is more than jungle wealth; it is hulls, wharves, temple beams, and state reach, so the yards must answer the canopy."
ind_unified_monsoon_exchange_houses_title:0 "Monsoon Exchanges"
ind_unified_monsoon_exchange_houses_desc:0 "The monsoon makes fortunes and ruins them, so exchange houses must turn seasonal risk into credit rather than panic."
ind_unified_clove_spice_factors_title:0 "Clove and Spice Factors"
ind_unified_clove_spice_factors_desc:0 "Clove groves and spice ports must report to factors who answer the canopy before they answer private guild houses."
ind_unified_twelve_trade_courts_title:0 "Twelve Trade Courts"
ind_unified_twelve_trade_courts_desc:0 "The diversity of Ind can command the world's appetite only if twelve trade courts translate custom into enforceable commercial law."
ind_unified_dragon_toll_admiralty_title:0 "Mourn Road Garrisons"
ind_unified_dragon_toll_admiralty_desc:0 "The mountain road cannot be secured by border stones alone, so Ind must push forts and courts through the Mourn."
ind_unified_river_ruin_gatekeepers_title:0 "Gates of the Mourn"
ind_unified_river_ruin_gatekeepers_desc:0 "Once the high road is taken, the passes must become toll gates and royal garrisons instead of plunder paths."
ind_unified_rajapur_spice_court_title:0 "Rajapur Spice Court"
ind_unified_rajapur_spice_court_desc:0 "Rajapur's spice court measures aroma, weight, oath, and tax in the same breath, so its court must enrich the realm."
ind_unified_dvaraka_tide_ledger_title:0 "Dvaraka Tide Ledger"
ind_unified_dvaraka_tide_ledger_desc:0 "Dvaraka hears every western tide before the inland courts do, so its pilots must make the sea road a royal ledger."
ind_unified_jeweled_court_prestige_title:0 "Jeweled Court Prestige"
ind_unified_jeweled_court_prestige_desc:0 "The jeweled courts are too proud to follow a shabby ruler, so we must make prestige into policy."
ind_unified_provincial_courts_title:0 "Provincial Courts"
ind_unified_provincial_courts_desc:0 "Custom is strong because law is weak, so provincial courts must make old bargains legible to the crown."
ind_unified_first_canopy_claims_title:0 "First Canopy Claims"
ind_unified_first_canopy_claims_desc:0 "The canopy cannot be declared from one throne, so enough towns and courts must already live inside it."
ind_unified_one_canopy_over_ind_title:0 "One Canopy Over Ind"
ind_unified_one_canopy_over_ind_desc:0 "Ind has never lacked wealth or peoples; it has lacked one political imagination strong enough to hold them."
ind_unified_frontier_mandalas_title:0 "Frontier Mandalas"
ind_unified_frontier_mandalas_desc:0 "The frontier mandalas must turn Ind's new unity toward the powers that once fed on its disunity: orcs, black smoke, dragons, Cathay, and Khuresh."
ind_unified_envoys_empty_throne_title:0 "Cathayan Footholds"
ind_unified_envoys_empty_throne_desc:0 "Cathay's throne is empty, but its provinces are not, so Ind must take footholds before protocol can turn the Western and Southern Provinces into a wall."
ind_unified_celestial_line_held_title:0 "Celestial Line Held"
ind_unified_celestial_line_held_desc:0 "Cathay's empty throne still casts a long shadow, so Wei-Jin itself must answer Ind or an Indish subject before the eastern line is truly held."
ind_unified_markets_under_one_canopy_title:0 "Markets Under One Canopy"
ind_unified_markets_under_one_canopy_desc:0 "Mourn roads, Cathayan cities, and Khureshi marches will not enrich Ind while foreign ledgers set the price, so Ind must command trade across more than eight nodes."
ind_unified_cities_under_one_canopy_title:0 "Cities Under One Canopy"
ind_unified_cities_under_one_canopy_desc:0 "The eight great urban mandalas have entered the canopy without losing their particular splendor, so their shared order can now become national strength."
ind_unified_twelve_banners_commerce_title:0 "The Spice Must Flow"
ind_unified_twelve_banners_commerce_desc:0 "Ind's diversity must become a commercial order so broad that twelve different trade banners answer the canopy."
ind_unified_temple_account_keepers_title:0 "Temple Keepers"
ind_unified_temple_account_keepers_desc:0 "Temples are treasuries, courts, employers, and theaters of the gods, so their accounts must serve the public rhythm."
ind_unified_lamp_oath_scholars_title:0 "Lamp-Oath Scholars"
ind_unified_lamp_oath_scholars_desc:0 "Lamp-oath scholars read stars, omens, contracts, and old jungle warnings, so their learning must be admitted to court."
ind_unified_sacred_rivers_pacified_title:0 "Sacred Rivers Pacified"
ind_unified_sacred_rivers_pacified_desc:0 "The sacred rivers bind pilgrims, ferries, markets, and cremation ghats, so disorder along them poisons the whole realm."
ind_unified_many_tongues_title:0 "Many Tongues"
ind_unified_many_tongues_desc:0 "Ind's many tongues are not a weakness unless the state forces them to become one, so diversity must be made administrable."
ind_unified_court_many_customs_title:0 "Court of Many Customs"
ind_unified_court_many_customs_desc:0 "A court of many customs must make diversity administrable without reducing it to one language, one shrine, or one brittle law."
ind_unified_stock_exchanges_monsoon_title:0 "Monsoon Markets"
ind_unified_stock_exchanges_monsoon_desc:0 "The spice wealth must mature from caravan profit into institutional finance, port credit, and exchange houses."
ind_unified_guild_oath_reforms_title:0 "Guild Oath Reforms"
ind_unified_guild_oath_reforms_desc:0 "Guild oaths must bind private houses to the public order of the canopy, so wealth builds roads instead of rival thrones."
ind_unified_temple_port_endowments_title:0 "Temple Port Endowments"
ind_unified_temple_port_endowments_desc:0 "Temple ports must endow shrines, piers, and ferry-rights without letting each holy harbor become a private kingdom."
ind_unified_diversity_thrives_title:0 "Diversity Thrives"
ind_unified_diversity_thrives_desc:0 "The old disunity fed local custom; the new unity must let those customs thrive without letting them rule."
ind_unified_universities_thousand_gods_title:0 "Universities of the Thousand"
ind_unified_universities_thousand_gods_desc:0 "The Thousand Gods need more than priests, so their jurists, astronomers, and physicians must have stone halls."
ind_unified_hold_eastern_passes_title:0 "Take the Eastern Passes"
ind_unified_hold_eastern_passes_desc:0 "Eastern passes and Cathayan roads carry merchants in peace and armies in crisis, so they must be taken before Cathay tests them."
ind_unified_cathay_kept_at_treaty_distance_title:0 "Sword Distance"
ind_unified_cathay_kept_at_treaty_distance_desc:0 "Cathay must learn that Ind is not a spice garden awaiting protocol, but a peer whose armies can hold the road to the Celestial provinces."
ind_unified_mrauk_u_glass_palaces_title:0 "Mrauk U Glass Palaces"
ind_unified_mrauk_u_glass_palaces_desc:0 "Mrauk U is glass, river trade, elephant bells, and foreign tongues beneath palace roofs, so its wealth must remain ordered."
ind_unified_jaffna_pearl_dues_title:0 "Jaffna Pearl Dues"
ind_unified_jaffna_pearl_dues_desc:0 "Jaffna's pearl dues depend on divers, clan elders, ferries, and shrines, so the strait must pay without tearing itself apart."
ind_unified_monsoon_keels_title:0 "Monsoon Keels"
ind_unified_monsoon_keels_desc:0 "The monsoon enriches those who respect it and drowns those who do not, so our first fleet must learn its temper."
ind_unified_licensed_monsoon_pilots_title:0 "Licensed Monsoon Pilots"
ind_unified_licensed_monsoon_pilots_desc:0 "Pilots, ferrymen, pearl boats, and spice captains know routes no court map records, so the state must license them."
ind_unified_spice_sea_patrols_title:0 "Spice Sea Patrols"
ind_unified_spice_sea_patrols_desc:0 "Spice ships invite raiders, private tolls, and foreign escorts, so patrols must make the coast feel watched."
ind_unified_monsoon_admiralty_title:0 "Monsoon Admiralty"
ind_unified_monsoon_admiralty_desc:0 "Pilots can guide a coast, but admirals must defend a civilization; the monsoon fleet needs command."
ind_unified_census_thousand_peoples_title:0 "Thousand Census"
ind_unified_census_thousand_peoples_desc:0 "A census of the thousand peoples must record obligations without pretending every language, caste, shrine, and guild is the same."
ind_unified_tigerfolk_compact_title:0 "Tigerfolk Compact"
ind_unified_tigerfolk_compact_desc:0 "A compact with the Tigerfolk turns fear of the jungle courts into recognized obligations, shared defense, and quieter roads."
ind_unified_tame_blood_groves_title:0 "Tame the Blood Groves"
ind_unified_tame_blood_groves_desc:0 "Blood groves, old offerings, and tiger courts must be contained before rumor becomes rule along the southern roads."
ind_unified_royal_weighing_houses_title:0 "Weighing Houses"
ind_unified_royal_weighing_houses_desc:0 "Royal weighing houses must turn custom, scent, pearl, and coin into public measures that no guild can quietly bend."
ind_unified_khureshi_quarantine_posts_title:0 "Khureshi Inroads"
ind_unified_khureshi_quarantine_posts_desc:0 "Khuresh is a warning written in green ink, so Ind must make its first inroads before venom, rumor, and raiders decide the border."
ind_unified_coils_beyond_jungle_title:0 "Coils Beyond the Jungle"
ind_unified_coils_beyond_jungle_desc:0 "The serpent courts can be held beyond the border, broken in the jungle, or forced to treat with Ind from fear."
ind_unified_khuresh_answered_title:0 "Khuresh Answered"
ind_unified_khuresh_answered_desc:0 "Khuresh must never again decide whether Ind is prey; either the jungle bends, or the border becomes a wall of spears."
ind_unified_veterans_frontier_title:0 "Veterans of the Frontier"
ind_unified_veterans_frontier_desc:0 "Khuresh's jungle marches teach expensive lessons, so conquered borderlands, veterans, barracks, and drill yards must keep those lessons alive."
ind_unified_pegu_river_mandala_title:0 "Pegu River Mandala"
ind_unified_pegu_river_mandala_desc:0 "Pegu is a river mandala of ports, monks, guilds, and tolls, so its delta politics must flow through the canopy."
ind_unified_malwa_plateau_court_title:0 "Malwa Plateau Court"
ind_unified_malwa_plateau_court_desc:0 "Malwa's plateau court turns height, poetry, law, and road command into authority, so its learning must serve the canopy."

ind_mourn_road_footholds_mod:0 "Mourn Road Footholds"
desc_ind_mourn_road_footholds_mod:0 "Footholds beyond the mountain passes have sharpened Ind's northern mustering habits."
ind_gates_of_mourn_mod:0 "Gates of the Mourn"
desc_ind_gates_of_mourn_mod:0 "The high roads now answer Indish tolls before they answer raiders."
ind_cathayan_footholds_mod:0 "Cathayan Footholds"
desc_ind_cathayan_footholds_mod:0 "Indish footholds in Cathay make protocol answer steel."
ind_eastern_passes_taken_mod:0 "Eastern Passes Taken"
desc_ind_eastern_passes_taken_mod:0 "Cathayan roads and passes now carry Indish armies as well as merchants."
ind_sword_distance_mod:0 "Sword Distance"
desc_ind_sword_distance_mod:0 "Cathay must treat Ind as a peer whose armies can hold the eastern roads."
ind_mourn_road_garrisons_mod:0 "Mourn Road Garrisons"
desc_ind_mourn_road_garrisons_mod:0 "The mountain road is guarded by forts, clerks, and hard frontier drill."
