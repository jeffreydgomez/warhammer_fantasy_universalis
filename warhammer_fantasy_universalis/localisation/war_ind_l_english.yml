ind_veterans_frontier_mod:0 "Veterans of the Frontier"
desc_ind_veterans_frontier_mod:0 "Frontier veterans keep hard lessons alive in drill yards and barracks."
ind_one_canopy_centralized_mod:0 "Centralized Canopy"
