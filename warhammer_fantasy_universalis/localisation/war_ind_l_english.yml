l_english:

indish_happy_church:0 "Blessing of the Priests"
desc_indish_happy_church:0 "The loyalty of our religious leaders ensures peace and harmony within our nation, granting us greater tolerance towards our people."

indish_place_of_study:0 "Halls of Wisdom"
desc_indish_place_of_study:0 "With our prestigious centers of learning, we foster the growth of institutions, allowing knowledge to spread swiftly throughout our lands."

indish_place_of_law:0 "Seat of Justice"
desc_indish_place_of_law:0 "Establishing strong legal institutions has lowered the costs of maintaining stability, ensuring that our realm is governed by order and fairness."

indish_place_of_innovation:0 "Cradle of Innovation"
desc_indish_place_of_innovation:0 "In our centers of innovation, the brightest minds come together, pushing the boundaries of knowledge and ushering in new ideas for the advancement of our society."

indish_charitable:0 "Charitable Legacy"
desc_indish_charitable:0 "By sharing our wealth with neighboring states, we build strong bonds of friendship, enhancing our diplomatic reputation and fostering goodwill among those of the same faith."

indish_historical_defender:0 "Defender of the Faith"
desc_indish_historical_defender:0 "We stand as the defenders of our faith, with a prestigious history of shielding the devout and strengthening our bond with fellow believers."

indish_add_missionary_1:0 "Expanded Missionary Presence"
desc_indish_add_missionary_1:0 "Our efforts to spread our faith are bolstered, allowing us to send more missionaries and increase the strength of their work."

indish_add_missionary_2:0 "Missionary Surge"
desc_indish_add_missionary_2:0 "As our influence expands, we are able to send additional missionaries to further spread our faith across distant lands."

indish_trade_hub:0 "Hub of Commerce"
desc_indish_trade_hub:0 "Our mastery over trade ensures that our nation becomes a central hub of commerce, enriching our coffers and increasing our trade efficiency."

indish_cavalry_fraction:0 "Cavalry Supremacy"
desc_indish_cavalry_fraction:0 "Our armies are renowned for their cavalry superiority, with enhanced flanking power and a larger proportion of mounted units in battle."

indish_holy_war:0 "Righteous Crusade"
desc_indish_holy_war:0 "Our zeal to wage holy wars grants us a powerful casus belli against the infidels, strengthening our ability to expand the faith by force."

indish_holy_war_2:0 "Holy Expansion"
desc_indish_holy_war_2:0 "Through holy war, we have honed our tactics, reducing the cost of enforcing religious dominance and making it easier to subjugate heretics."

indish_expand_abroad:0 "Overseas Expansion"
desc_indish_expand_abroad:0 "Our sights are set on new lands across the seas, where we will expand our colonies and extend our influence."

indish_ultimate_reward:0 "Divine Reward"
desc_indish_ultimate_reward:0 "Through our efforts to spread the faith and advance our knowledge, we are rewarded with divine favor, bringing prosperity and influence to our nation."




gen_indish_please_nobility_title:0 "Please the Nobility"
gen_indish_please_nobility_desc:0 "The support of the nobility is crucial to maintaining the stability of our realm. We must ensure their loyalty to strengthen our rule and secure additional religious influence."

gen_indish_cavalry_title:0 "Strengthen the Cavalry"
gen_indish_cavalry_desc:0 "Our cavalry is the backbone of our armies. By expanding and improving our cavalry forces, we ensure that we dominate the battlefield with swift and decisive maneuvers."

gen_indish_war_with_infidel_title:0 "War with the Infidel"
gen_indish_war_with_infidel_desc:0 "The time has come to wage war against those who do not share our faith. We will lead a righteous crusade to cleanse the lands of unbelievers and bring them under our control."

gen_indish_war_expand_faith_title:0 "Expand the Faith"
gen_indish_war_expand_faith_desc:0 "Through conquest and holy wars, we will extend the reach of our faith, asserting our dominance over foreign lands and ensuring the supremacy of our beliefs."

gen_indish_build_docks_title:0 "Build Coastal Infrastructure"
gen_indish_build_docks_desc:0 "To expand overseas, we must first establish the infrastructure to support naval expeditions. By building docks and drydocks, we lay the foundation for our future maritime empire."

gen_indish_expand_overseas_title:0 "Expand Overseas"
gen_indish_expand_overseas_desc:0 "The world beyond our shores offers immense opportunities. We must expand our territories across multiple continents to secure resources and spread our influence."

gen_indish_center_of_trade_title:0 "Center of Trade"
gen_indish_center_of_trade_desc:0 "By controlling the seas and establishing a powerful fleet of light ships, we can transform our ports into thriving centers of trade, dominating the flow of wealth across the seas."

gen_indish_ultimate_mission_title:0 "The Ultimate Reward"
gen_indish_ultimate_mission_desc:0 "As a great power, we have achieved unparalleled dominance. Now is the time to claim the ultimate reward, spreading our influence across the world and securing the divine favor that comes with our success."



gen_thousand_gods_happy_priest_title:0 "Appease the Priests"
gen_thousand_gods_happy_priest_desc:0 "The priests of the Thousand Gods hold great sway over the spiritual and political life of our nation. By securing their loyalty, we gain the favor of the divine."

gen_thousand_gods_places_of_worship_title:0 "Expand Places of Worship"
gen_thousand_gods_places_of_worship_desc:0 "Our devotion to the Thousand Gods must be reflected in the grand temples we build. By expanding our places of worship, we ensure that the gods continue to favor us."

gen_thousand_gods_place_of_study_title:0 "Establish Centers of Study"
gen_thousand_gods_place_of_study_desc:0 "Knowledge is power, and by fostering centers of study, we can accelerate the growth of institutions and secure our place as a hub of learning."

gen_thousand_gods_places_of_law_title:0 "Fortify the Rule of Law"
gen_thousand_gods_places_of_law_desc:0 "A strong legal framework ensures stability and order across our lands. By building courthouses and town halls, we entrench the rule of law and reduce the cost of maintaining stability."

gen_thousand_gods_places_of_innovation_title:0 "Foster Innovation"
gen_thousand_gods_places_of_innovation_desc:0 "Through our investment in universities and centers of knowledge, we create an environment where new ideas can flourish, pushing the boundaries of what is possible."

gen_thousand_gods_charitable_title:0 "Charitable Deeds"
gen_thousand_gods_charitable_desc:0 "In the name of the Thousand Gods, we must show generosity to our neighbors, improving relations with those who share our faith and enhancing our standing in the eyes of the divine."

gen_thousand_gods_defender_of_faith_title:0 "Defender of the Faith"
gen_thousand_gods_defender_of_faith_desc:0 "Having proven our dedication to the Thousand Gods, we now stand as the foremost defender of our faith, ensuring the unity of our religion and securing our prestige."



 ind_events.1000.t:0 "Petitions at the Palace Gate"
 ind_events.1000.d:0 "At [Root.Capital.GetName], the morning audience begins with a temple steward, a spice merchant, and a captain from the jungle road. The steward brings grain accounts, the merchant brings silver, and the captain leads a wounded porter who escaped a raiding party. Each insists that [Root.Monarch.GetName] hear his petition first.\n\nThe steward needs guards for the harvest carts, while the merchant wants the same troops to escort a caravan. The porter describes clawed tracks beside the road and captives driven toward the eastern jungle. At the palace gate, pilgrims have halted their procession to listen.\n\nOur towns can raise the money and soldiers these petitioners need, but every guild and temple claims an exemption from the levy. The treasury clerk unrolls the collection register and waits for the court's seal. The next harvest convoy leaves in three days."
 ind_events.1000.a:0 "Collect the dues and muster guards for the roads."

 ind_events.1.t:0 "Rice Behind the Temple Doors"
 ind_events.1.d:0 "After a good monsoon harvest, the granary at [Root.Capital.GetName]'s Temple of Vishnu is filled to its rafters. Steward Govinda has begun stacking surplus rice in the outer court. Beyond the temple walls, laborers whose own fields flooded queue to buy grain at last month's price.\n\nGovinda refuses to open the stores until the court settles who will pay for transport and guards. A merchant offers to buy the surplus in bulk, and the hungry crowd starts pelting his wagons with mud. The city watch has closed the street, trapping the grain carts inside the temple compound."
 ind_events.1.a:0 "Pay to distribute the rice among the hungry districts."
 ind_events.1.b:0 "Sell the surplus through licensed local merchants despite outside objections."
 ind_events.1.c:0 "Audit the stores and collect the overdue temple taxes."

 ind_events.2.t:0 "The General at the Elephant Gate"
 ind_events.2.d:0 "Our cavalry commander arrives at the Elephant Gate temple with orders to take its trained herd into army service. Head mahout Nalin refuses to hand over the animals, pointing to an old exemption carved beside the stable entrance. Soldiers begin removing the ceremonial harness while the temple attendants ring the alarm bell.\n\nThe commander says the herd could break an enemy battle line, but training its crews would take recruits away from other units. Nalin offers temple porters for ordinary service if the elephants are spared. The soldiers halt at the gate while a messenger carries both claims to [Root.Monarch.GetName]."
 ind_events.2.a:0 "Conscript crews and train the herd for war over the temple's protests."
 ind_events.2.b:0 "Spare the herd and recruit porters, disappointing the cavalry."

 ind_events.3.t:0 "The Tiger Captain's Broken Seal"
 ind_events.3.d:0 "A Tigerfolk envoy named Rajan arrives at [Root.Capital.GetName] carrying a broken pilgrim-road seal. He says a toll captain seized his escort's weapons and tore up their safe-conduct. His followers recovered the seal, disarmed the captain's guards, and brought both parties to the nearest shrine.\n\nRajan returns the captured weapons as proof that he seeks an agreement. He offers warriors for paid service and asks the court to recognize his people's authority over their own settlements. Merchants who use the road have gathered outside the audience chamber, anxious to learn whose passes will be honored."
 ind_events.3.a:0 "Pay the Tigerfolk warriors to serve and train beside our troops."
 ind_events.3.b:0 "Negotiate recognized local courts in return for regular recruits."
 ind_events.3.c:0 "Send the envoys home with trade terms that favor our own merchants."

 ind_events.4.t:0 "The Drover at the Red Grove"
 ind_events.4.d:0 "A drover reaches [event_target.GetName] after abandoning his herd beside an old jungle shrine. He says roots closed around one animal and dragged it beneath the altar. When the village headman sent men to retrieve the cattle, only one returned.\n\nThe survivor brings a brass offering bowl packed with fresh blood, although he swears it was empty when he found it. The shrine keeper demands livestock to satisfy whatever lives beneath the grove. Families along the road have barred their doors, and the nearest garrison is waiting for orders."
 ind_events.4.a:0 "Buy cattle for the shrine's offering."
 ind_events.4.b:0 "Order the grove burned, overruling the shrine keeper despite the damage."

 ind_events.5.t:0 "A Chain Across the Spice Road"
 ind_events.5.d:0 "The spice guild has stretched a chain across the main road into [Root.Capital.GetName] and stationed hired guards beside it. Guild master Padma presents a charter granting her members the right to maintain the route. She claims this also lets them exclude traders who refuse to join.\n\nAn independent carter produces receipts for tolls he paid at three earlier gates. Builders and army suppliers join his complaint after learning that the guild intends to control their wagons too. The guards have detained the carter's cargo, leaving the court to settle the charter before the next convoy arrives."
 ind_events.5.a:0 "Confirm the monopoly and collect the guild's payment."
 ind_events.5.b:0 "Revoke the monopoly and organize building supplies and army transport."
 ind_events.5.c:0 "Pay the temples to establish roadside missions beyond the guild's gates."
 ind_events.5.dd:0 "Negotiate limited trading privileges for local merchants."

 ind_events.6.t:0 "Gorlag's Supper Toll"
 ind_events.6.d:0 "An Ogre named Gorlag has chained two wagons across a caravan pass and set his cooking pot in the road. He demands payment from every passing merchant, claiming that the money covers his supper and the cost of guarding it. A caravan master reaches our court with the ransom demand tied around a gnawed axle pin.\n\nGorlag has enough followers to stop an ordinary escort, and they have already eaten the caravan's pack animals. The detained merchants offer to testify that he keeps other raiders away from the pass. Their messenger warns that the Ogres have begun arguing over what goes into the pot next."
 ind_events.6.a:0 "Pay the toll to release the caravan."
 ind_events.6.b:0 "Pay Gorlag to guard the pass under the old protection terms."
 ind_events.6.c:0 "Send troops to clear the pass, accepting the casualties."

 ind_events.7.t:0 "The Broken Steps of the Pilgrim Ghat"
 ind_events.7.d:0 "During the river pilgrimage at [event_target.GetName], a section of stone steps collapses beneath a crowd of worshippers. Boatmen pull the fallen pilgrims from the water while the priestess closes the damaged landing. Hundreds more arrive before she can clear the bank.\n\nA mason finds that floodwater has washed away the foundations beneath the neighboring steps. The pilgrims have begun sleeping on private fields, and some ask for land so they can remain near the shrine. The local magistrate sends the court a repair estimate and a list of families willing to settle."
 ind_events.7.a:0 "Pay for new river steps and permanent market stalls."
 ind_events.7.b:0 "Collect a special levy from the pilgrims despite their complaints."
 ind_events.7.c:0 "Negotiate settlement rights and militia service for the pilgrim families."

 ind_events.8.t:0 "Emeralds Between the Pages"
 ind_events.8.d:0 "A revenue clerk opens a ledger sent to [Root.Capital.GetName] and finds its center cut away to conceal six emeralds. A note asks him to approve reduced spice duties for a merchant house. He brings the parcel to the chief minister after recognizing the seal of a court noble.\n\nThe minister finds similar reductions in several earlier accounts, all witnessed by the same customs officer. When summoned, the officer offers to name the people who paid him. The merchant house sends another messenger, this time asking whether the court has found its missing gift."
 ind_events.8.a:0 "Investigate the bribery network and revoke the merchants' privileges."
 ind_events.8.b:0 "Keep the emeralds and approve the arrangement despite the scandal."

 ind_events.9.t:0 "The Shipwright's Model"
 ind_events.9.d:0 "Shipwright Mira brings a model hull to the court at [Root.Capital.GetName], together with a section of timber recovered from a wreck. She shows how the old joint split under heavy seas and demonstrates a stronger brace. A pilot who survived the wreck confirms her account.\n\nMira's yard can build the new hulls, but its laborers are still hauling timber across a flooded mudflat. Spice merchants offer to finance the work in exchange for privileges over the next convoy. The treasury asks the court to settle responsibility for the yard before another sailing season is lost."
 ind_events.9.a:0 "Hire experienced pilots to chart safer long-distance routes."
 ind_events.9.b:0 "Fund organized building yards and cheaper construction."
 ind_events.9.c:0 "Charge the spice convoys for exclusive trading privileges."
 ind_events.9.dd:0 "Decline the shipping scheme and organize timber sales inland."

 ind_events.10.t:0 "The Night the Lamps Went Out"
 ind_events.10.d:0 "At the Festival of Lamps in [Root.Capital.GetName], a dispute between two oil sellers leaves half the temple square dark. A scholar from Saraswati's temple persuades both sellers to meet beside the sacred tank. While they argue, her students relight the lamps with oil collected from neighboring houses.\n\nThe crowd stays to hear the scholar's account of an earlier settlement between the same guilds. By dawn, the sellers have signed a new delivery agreement and the watch reports its quietest festival in years. The temple asks the court to make the gathering an annual occasion for teaching and public worship."
 ind_events.10.a:0 "Fund the festival and the scholars who settled the quarrel."
 ind_events.10.b:0 "Assign troops to guard preachers throughout the festival."
 ind_events.10.c:0 "Sell local merchants the right to supply and sponsor the lamps."

ind_mandala_envoys_title:0 "Mandala Envoys"
ind_mandala_envoys_desc:0 "Ind is a mandala of courts before it is a realm, so we must teach neighboring rulers to answer our envoys without mistaking courtesy for weakness."
ind_rajah_hostages_title:0 "Rajah Hostages"
ind_rajah_hostages_desc:0 "Local Rajahs hold land, forts, and elephants by inherited custom, so the crown must make those customs answer a central oath."
ind_elephant_road_forts_title:0 "Elephant Road Forts"
ind_elephant_road_forts_desc:0 "The elephant roads are rich, slow, and tempting, so forts must turn them from plunder paths into royal arteries."
ind_elephant_muster_title:0 "Elephant Muster"
ind_elephant_muster_desc:0 "The courts can no longer rely on ceremonial beasts alone, so the elephant lines must become a dependable war host."
ind_break_black_road_raids_title:0 "Break Black Road Raids"
ind_break_black_road_raids_desc:0 "Orcs, Ogres, and black-smoke tyrants test the northern roads, so Ind must prove the plunder trail ends at our forts."
ind_crackhorn_gate_title:0 "Crackhorn Gate"
ind_crackhorn_gate_desc:0 "Crackhorn is a gate of stone, spice, and road-taxes, so its horns must sound for the united realm."
ind_bodhimalai_scriptoria_title:0 "Bodhimalai Scriptoria"
ind_bodhimalai_scriptoria_desc:0 "Bodhimalai preserves holy scripts, mountain commentaries, and court law, so its scholars must write for all Ind."
ind_spice_guild_ledgers_title:0 "Spice Guild Ledgers"
ind_spice_guild_ledgers_desc:0 "The spice guilds can enrich or choke the realm, so their ledgers must be made public enough for royal use."
ind_spice_road_tollhouses_title:0 "Spice Road Tollhouses"
ind_spice_road_tollhouses_desc:0 "Road tolls are collected by custom, shrine, guild, and knife, so the crown must make the spice road countable."
ind_saffron_silk_workshops_title:0 "Saffron Silk Workshops"
ind_saffron_silk_workshops_desc:0 "Saffron, silk, dyes, and cloth pass through too many private hands, so royal workshops must bind luxury to state capacity."
ind_granaries_caravanserais_title:0 "Granaries and Caravanserais"
ind_granaries_caravanserais_desc:0 "A crowded land is only rich while its roads and granaries hold, so the monsoon stores must serve the whole canopy."
ind_black_smoke_green_hide_title:0 "Black Smoke, Green Hide"
ind_black_smoke_green_hide_desc:0 "Black smoke from the west and green-hide raids from the roads threaten the new canopy before it can settle, so the frontier must harden."
ind_dragon_toll_admiralty_title:0 "Dragon-Toll Admiralty"
ind_dragon_toll_admiralty_desc:0 "Dragons and River Ruin captains do not respect polite maps, so a united admiralty must meet them at the toll-water."
ind_river_ruin_gatekeepers_title:0 "River Ruin Gatekeepers"
ind_river_ruin_gatekeepers_desc:0 "Once the Dragon Isles are watched, River Ruin merchants must choose whether to pay in coin, gems, or fear."
ind_rajapur_spice_court_title:0 "Rajapur Spice Court"
ind_rajapur_spice_court_desc:0 "Rajapur's spice court measures aroma, weight, oath, and tax in the same breath, so its court must enrich the realm."
ind_dvaraka_tide_ledger_title:0 "Dvaraka Tide Ledger"
ind_dvaraka_tide_ledger_desc:0 "Dvaraka hears every western tide before the inland courts do, so its pilots must make the sea road a royal ledger."
ind_universities_thousand_gods_title:0 "Universities of the Thousand Gods"
ind_universities_thousand_gods_desc:0 "The Thousand Gods need more than priests, so their jurists, astronomers, and physicians must have stone halls."
ind_jeweled_court_prestige_title:0 "Jeweled Court Prestige"
ind_jeweled_court_prestige_desc:0 "The jeweled courts are too proud to follow a shabby ruler, so we must make prestige into policy."
ind_provincial_courts_title:0 "Provincial Courts"
ind_provincial_courts_desc:0 "Custom is strong because law is weak, so provincial courts must make old bargains legible to the crown."
ind_first_canopy_claims_title:0 "First Canopy Claims"
ind_first_canopy_claims_desc:0 "The canopy cannot be declared from one throne, so enough towns and courts must already live inside it."
ind_one_canopy_over_ind_title:0 "One Canopy Over Ind"
ind_one_canopy_over_ind_desc:0 "Ind has never lacked wealth or peoples; it has lacked one political imagination strong enough to hold them."
ind_celestial_line_held_title:0 "Celestial Line Held"
ind_celestial_line_held_desc:0 "Cathay's empty throne still casts a long shadow, so the eastern line must learn to meet protocol with strength."
ind_jaffna_pearl_dues_title:0 "Jaffna Pearl Dues"
ind_jaffna_pearl_dues_desc:0 "Jaffna's pearl dues depend on divers, clan elders, ferries, and shrines, so the strait must pay without tearing itself apart."
ind_malwa_plateau_court_title:0 "Malwa Plateau Court"
ind_malwa_plateau_court_desc:0 "Malwa's plateau court turns height, poetry, law, and road command into authority, so its learning must serve the canopy."
ind_twelve_banners_commerce_title:0 "Twelve Banners of Commerce"
ind_twelve_banners_commerce_desc:0 "Ind's diversity must become a commercial order so broad that twelve different trade banners answer the canopy."
ind_temple_account_keepers_title:0 "Temple Account Keepers"
ind_temple_account_keepers_desc:0 "Temples are treasuries, courts, employers, and theaters of the gods, so their accounts must serve the public rhythm."
ind_lamp_oath_scholars_title:0 "Lamp-Oath Scholars"
ind_lamp_oath_scholars_desc:0 "Lamp-oath scholars read stars, omens, contracts, and old jungle warnings, so their learning must be admitted to court."
ind_sacred_rivers_pacified_title:0 "Sacred Rivers Pacified"
ind_sacred_rivers_pacified_desc:0 "The sacred rivers bind pilgrims, ferries, markets, and cremation ghats, so disorder along them poisons the whole realm."
ind_many_tongues_title:0 "Many Tongues"
ind_many_tongues_desc:0 "Ind's many tongues are not a weakness unless the state forces them to become one, so diversity must be made administrable."
ind_envoys_empty_throne_title:0 "Envoys to the Empty Throne"
ind_envoys_empty_throne_desc:0 "Cathay's throne is empty, but its protocols remain sharp, so our envoys must know when to bow and when to count spears."
ind_hold_eastern_passes_title:0 "Hold the Eastern Passes"
ind_hold_eastern_passes_desc:0 "Eastern passes and jungle roads carry merchants in peace and armies in crisis, so they must be held before Cathay tests them."
ind_cathay_kept_at_treaty_distance_title:0 "Treaty Distance"
ind_cathay_kept_at_treaty_distance_desc:0 "Cathay must learn that Ind is not a spice garden awaiting protocol, but a peer, a wall, and a market."
ind_mrauk_u_glass_palaces_title:0 "Mrauk U Glass Palaces"
ind_mrauk_u_glass_palaces_desc:0 "Mrauk U is glass, river trade, elephant bells, and foreign tongues beneath palace roofs, so its wealth must remain ordered."
ind_stock_exchanges_monsoon_title:0 "Monsoon Stock Exchanges"
ind_stock_exchanges_monsoon_desc:0 "The spice wealth must mature from caravan profit into institutional finance, port credit, and exchange houses."
ind_diversity_thrives_title:0 "Diversity Thrives"
ind_diversity_thrives_desc:0 "The old disunity fed local custom; the new unity must let those customs thrive without letting them rule."
ind_monsoon_keels_title:0 "Monsoon Keels"
ind_monsoon_keels_desc:0 "The monsoon enriches those who respect it and drowns those who do not, so our first fleet must learn its temper."
ind_licensed_monsoon_pilots_title:0 "Licensed Monsoon Pilots"
ind_licensed_monsoon_pilots_desc:0 "Pilots, ferrymen, pearl boats, and spice captains know routes no court map records, so the state must license them."
ind_spice_sea_patrols_title:0 "Spice Sea Patrols"
ind_spice_sea_patrols_desc:0 "Spice ships invite raiders, private tolls, and foreign escorts, so patrols must make the coast feel watched."
ind_monsoon_admiralty_title:0 "Monsoon Admiralty"
ind_monsoon_admiralty_desc:0 "Pilots can guide a coast, but admirals must defend a civilization; the monsoon fleet needs command."
ind_khureshi_quarantine_posts_title:0 "Khureshi Quarantine Posts"
ind_khureshi_quarantine_posts_desc:0 "Khuresh is a warning written in green ink, so the border posts must quarantine venom, rumor, and raiders alike."
ind_coils_beyond_jungle_title:0 "Coils Beyond the Jungle"
ind_coils_beyond_jungle_desc:0 "The serpent courts can be held beyond the border, broken in the jungle, or forced to treat with Ind from fear."
ind_khuresh_answered_title:0 "Khuresh Answered"
ind_khuresh_answered_desc:0 "Khuresh must never again decide whether Ind is prey; either the jungle bends, or the border becomes a wall of spears."
ind_pegu_river_mandala_title:0 "Pegu River Mandala"
ind_pegu_river_mandala_desc:0 "Pegu is a river mandala of ports, monks, guilds, and tolls, so its delta politics must flow through the canopy."
ind_veterans_frontier_title:0 "Veterans of the Frontier"
ind_veterans_frontier_desc:0 "The frontier has taught expensive lessons, so veterans, barracks, and drill yards must keep those lessons alive."

ind_defeat_or_secure_darklands_tt:0 "Defeat a Greenskin, Chaos Dwarf, Ogre-road, or Darklands power in war within the last 50 years, or secure Ind with at least 5 level 2 forts and full army strength."
ind_defeat_or_contain_cathay_tt:0 "Defeat a Cathayan power in war within the last 50 years, or secure eastern Ind with at least 4 level 2 forts and full army strength."
ind_defeat_or_enter_khuresh_tt:0 "Own or subject at least 5 provinces in Khuresh, or defeat a Khureshi power in war within the last 50 years."

ind_mandala_envoys_mod:0 "Mandala Envoys"
desc_ind_mandala_envoys_mod:0 "Our envoys have learned to turn Ind's courtly diversity into useful diplomacy."
ind_elephant_road_forts_mod:0 "Elephant Road Forts"
desc_ind_elephant_road_forts_mod:0 "The inland roads are anchored by forts that answer the canopy."
ind_elephant_muster_mod:0 "Elephant Muster"
desc_ind_elephant_muster_mod:0 "Ceremonial elephant lines have become a disciplined arm of war."
ind_black_road_raids_broken_mod:0 "Black Road Raids Broken"
desc_ind_black_road_raids_broken_mod:0 "The northern raiders have learned that Ind's roads end at prepared armies."
ind_spice_road_tollhouses_mod:0 "Spice Road Tollhouses"
desc_ind_spice_road_tollhouses_mod:0 "Royal tollhouses make the spice roads easier to count, protect, and tax."
ind_saffron_silk_workshops_mod:0 "Saffron Silk Workshops"
desc_ind_saffron_silk_workshops_mod:0 "Luxury workshops now turn Ind's dyes, cloth, and silk into state capacity."
ind_granaries_caravanserais_mod:0 "Granaries and Caravanserais"
desc_ind_granaries_caravanserais_mod:0 "The monsoon stores and caravanserais keep a crowded realm moving."
ind_black_smoke_green_hide_mod:0 "Black Smoke, Green Hide"
desc_ind_black_smoke_green_hide_mod:0 "Threats from the north and west have sharpened Ind's mustering habits."
ind_river_ruin_gatekeepers_mod:0 "River Ruin Gatekeepers"
desc_ind_river_ruin_gatekeepers_mod:0 "River Ruin merchants now meet Indish tolls before they meet Indish markets."
ind_universities_thousand_gods_mod:0 "Universities of the Thousand Gods"
desc_ind_universities_thousand_gods_mod:0 "Stone halls give priests, jurists, astronomers, and physicians a shared place in public life."
ind_jeweled_court_prestige_mod:0 "Jeweled Court Prestige"
desc_ind_jeweled_court_prestige_mod:0 "The glitter of the court has been made useful to government."
ind_provincial_courts_mod:0 "Provincial Courts"
desc_ind_provincial_courts_mod:0 "Old bargains and local customs now pass through courts the canopy can understand."
ind_twelve_banners_commerce_mod:0 "Twelve Banners of Commerce"
desc_ind_twelve_banners_commerce_mod:0 "Twelve trade banners answer the canopy, and the world's appetite now moves through Indish ledgers."
ind_sacred_rivers_pacified_mod:0 "Sacred Rivers Pacified"
desc_ind_sacred_rivers_pacified_mod:0 "Order along the sacred rivers quiets pilgrims, markets, and temple towns alike."
ind_many_tongues_mod:0 "Many Tongues"
desc_ind_many_tongues_mod:0 "The languages of Ind have been made administrable without being made small."
ind_envoys_empty_throne_mod:0 "Envoys to the Empty Throne"
desc_ind_envoys_empty_throne_mod:0 "Our diplomats know how to answer Cathayan protocol with courtesy and steel."
ind_hold_eastern_passes_mod:0 "Eastern Passes Held"
desc_ind_hold_eastern_passes_mod:0 "The eastern passes are maintained as roads in peace and fortresses in crisis."
