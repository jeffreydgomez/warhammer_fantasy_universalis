l_english:

indish_happy_church:0 "Blessing of the Priests"
desc_indish_happy_church:0 "The loyalty of our religious leaders ensures peace and harmony within our nation, granting us greater tolerance towards our people."

indish_place_of_study:0 "Halls of Wisdom"
desc_indish_place_of_study:0 "With our prestigious centers of learning, we foster the growth of institutions, allowing knowledge to spread swiftly throughout our lands."

indish_place_of_law:0 "Seat of Justice"
desc_indish_place_of_law:0 "Establishing strong legal institutions has lowered the costs of maintaining stability, ensuring that our realm is governed by order and fairness."

indish_place_of_innovation:0 "Cradle of Innovation"
desc_indish_place_of_innovation:0 "In our centers of innovation, the brightest minds come together, pushing the boundaries of knowledge and ushering in new ideas for the advancement of our society."

indish_charitable:0 "Charitable Legacy"
desc_indish_charitable:0 "By sharing our wealth with neighboring states, we build strong bonds of friendship, enhancing our diplomatic reputation and fostering goodwill among those of the same faith."

indish_historical_defender:0 "Defender of the Faith"
desc_indish_historical_defender:0 "We stand as the defenders of our faith, with a prestigious history of shielding the devout and strengthening our bond with fellow believers."

indish_add_missionary_1:0 "Expanded Missionary Presence"
desc_indish_add_missionary_1:0 "Our efforts to spread our faith are bolstered, allowing us to send more missionaries and increase the strength of their work."

indish_add_missionary_2:0 "Missionary Surge"
desc_indish_add_missionary_2:0 "As our influence expands, we are able to send additional missionaries to further spread our faith across distant lands."

indish_trade_hub:0 "Hub of Commerce"
desc_indish_trade_hub:0 "Our mastery over trade ensures that our nation becomes a central hub of commerce, enriching our coffers and increasing our trade efficiency."

indish_cavalry_fraction:0 "Cavalry Supremacy"
desc_indish_cavalry_fraction:0 "Our armies are renowned for their cavalry superiority, with enhanced flanking power and a larger proportion of mounted units in battle."

indish_holy_war:0 "Righteous Crusade"
desc_indish_holy_war:0 "Our zeal to wage holy wars grants us a powerful casus belli against the infidels, strengthening our ability to expand the faith by force."

indish_holy_war_2:0 "Holy Expansion"
desc_indish_holy_war_2:0 "Through holy war, we have honed our tactics, reducing the cost of enforcing religious dominance and making it easier to subjugate heretics."

indish_expand_abroad:0 "Overseas Expansion"
desc_indish_expand_abroad:0 "Our sights are set on new lands across the seas, where we will expand our colonies and extend our influence."

indish_ultimate_reward:0 "Divine Reward"
desc_indish_ultimate_reward:0 "Through our efforts to spread the faith and advance our knowledge, we are rewarded with divine favor, bringing prosperity and influence to our nation."




gen_indish_please_nobility_title:0 "Please the Nobility"
gen_indish_please_nobility_desc:0 "The support of the nobility is crucial to maintaining the stability of our realm. We must ensure their loyalty to strengthen our rule and secure additional religious influence."

gen_indish_cavalry_title:0 "Strengthen the Cavalry"
gen_indish_cavalry_desc:0 "Our cavalry is the backbone of our armies. By expanding and improving our cavalry forces, we ensure that we dominate the battlefield with swift and decisive maneuvers."

gen_indish_war_with_infidel_title:0 "War with the Infidel"
gen_indish_war_with_infidel_desc:0 "The time has come to wage war against those who do not share our faith. We will lead a righteous crusade to cleanse the lands of unbelievers and bring them under our control."

gen_indish_war_expand_faith_title:0 "Expand the Faith"
gen_indish_war_expand_faith_desc:0 "Through conquest and holy wars, we will extend the reach of our faith, asserting our dominance over foreign lands and ensuring the supremacy of our beliefs."

gen_indish_build_docks_title:0 "Build Coastal Infrastructure"
gen_indish_build_docks_desc:0 "To expand overseas, we must first establish the infrastructure to support naval expeditions. By building docks and drydocks, we lay the foundation for our future maritime empire."

gen_indish_expand_overseas_title:0 "Expand Overseas"
gen_indish_expand_overseas_desc:0 "The world beyond our shores offers immense opportunities. We must expand our territories across multiple continents to secure resources and spread our influence."

gen_indish_center_of_trade_title:0 "Center of Trade"
gen_indish_center_of_trade_desc:0 "By controlling the seas and establishing a powerful fleet of light ships, we can transform our ports into thriving centers of trade, dominating the flow of wealth across the seas."

gen_indish_ultimate_mission_title:0 "The Ultimate Reward"
gen_indish_ultimate_mission_desc:0 "As a great power, we have achieved unparalleled dominance. Now is the time to claim the ultimate reward, spreading our influence across the world and securing the divine favor that comes with our success."



gen_thousand_gods_happy_priest_title:0 "Appease the Priests"
gen_thousand_gods_happy_priest_desc:0 "The priests of the Thousand Gods hold great sway over the spiritual and political life of our nation. By securing their loyalty, we gain the favor of the divine."

gen_thousand_gods_places_of_worship_title:0 "Expand Places of Worship"
gen_thousand_gods_places_of_worship_desc:0 "Our devotion to the Thousand Gods must be reflected in the grand temples we build. By expanding our places of worship, we ensure that the gods continue to favor us."

gen_thousand_gods_place_of_study_title:0 "Establish Centers of Study"
gen_thousand_gods_place_of_study_desc:0 "Knowledge is power, and by fostering centers of study, we can accelerate the growth of institutions and secure our place as a hub of learning."

gen_thousand_gods_places_of_law_title:0 "Fortify the Rule of Law"
gen_thousand_gods_places_of_law_desc:0 "A strong legal framework ensures stability and order across our lands. By building courthouses and town halls, we entrench the rule of law and reduce the cost of maintaining stability."

gen_thousand_gods_places_of_innovation_title:0 "Foster Innovation"
gen_thousand_gods_places_of_innovation_desc:0 "Through our investment in universities and centers of knowledge, we create an environment where new ideas can flourish, pushing the boundaries of what is possible."

gen_thousand_gods_charitable_title:0 "Charitable Deeds"
gen_thousand_gods_charitable_desc:0 "In the name of the Thousand Gods, we must show generosity to our neighbors, improving relations with those who share our faith and enhancing our standing in the eyes of the divine."

gen_thousand_gods_defender_of_faith_title:0 "Defender of the Faith"
gen_thousand_gods_defender_of_faith_desc:0 "Having proven our dedication to the Thousand Gods, we now stand as the foremost defender of our faith, ensuring the unity of our religion and securing our prestige."



 ind_events.1000.t:0 "The Temples and Jungles of Ind"
 ind_events.1000.d:0 "Ind is older than the histories of the Old World claim. Its priests speak of kingdoms that rose while the west was still mud and wolf-hide, and of jungles that were ancient before the Old Ones descended from the stars. Whether every boast is true matters less than the fact that millions believe it, pray by it, and kill beneath its banners.\n\nHere stand immense cities, swollen river ports, spice markets, jeweled courts, and temples so vast that generations have lived and died in their shadow. Humanity fills the plains and coasts in numbers that astonish foreign envoys, and every ruler of Ind knows that grain, pilgrims, taxes, and devotion are as important as swords.\n\nYet the land is not wholly tamed. Civilized Tigerfolk rule and bargain in the southern jungles, while deeper groves hide monsters, blood shrines, and gods whose names are spoken only after offerings have been made. The old forests grow around the roads as though waiting for stone and law to weaken.\n\nInd is ringed by powers that cannot be ignored. Cathay watches from the northeast, Khuresh bleeds and coils in the east, Elven colonies command islands and sea lanes, and Ogres gather to the north and northwest alongside darker appetites. Wealth has made Ind mighty, but it has also made the land visible to every hungry neighbor.\n\nThe temples must be guarded, the cities fed, the jungles respected, and the gods appeased or defied. Ind has endured for ages beyond counting. Now it must prove that age is not the same as decay."
 ind_events.1000.a:0 "The cities of Ind shall endure."

 ind_events.1.t:0 "The Monsoon Granaries"
 ind_events.1.d:0 "The monsoon has filled the lowland granaries until their doors groan under the weight of rice and millet. Temple accountants call the abundance a blessing, while city magistrates warn that hungry districts will riot if relief is delayed.\n\nMerchants argue that the roads must be guarded and taxed before the stores rot. Priests insist the grain belongs first to the gods and then to the poor. The court can turn plenty into order, profit, or another ledger war."
 ind_events.1.a:0 "Open the royal granaries."
 ind_events.1.b:0 "Tax the spice merchants moving grain."
 ind_events.1.c:0 "Audit the temple storehouses."

 ind_events.2.t:0 "The Sacred Elephant Herds"
 ind_events.2.d:0 "A herd of temple elephants has been claimed by both priests and generals. Their handlers say the beasts kneel only before sacred bells, but the army sees living towers that could break enemy lines.\n\nNo one in court doubts their value. The dispute is over whether that value belongs in the shrine, the parade ground, or the treasury of whatever lord can feed them."
 ind_events.2.a:0 "Train the mahouts for war."
 ind_events.2.b:0 "Spare the sacred herds."

 ind_events.3.t:0 "Tigerfolk on the Pilgrim Road"
 ind_events.3.d:0 "Tigerfolk envoys have arrived on the pilgrim road with painted claws, lacquered gifts, and a retinue that watches every shadow. Some courtiers call them civilized beastfolk, while others mutter that the word civilized does too much work.\n\nThe southern jungle courts know paths our taxmen cannot find. They also remember insults for generations. If we bind them with honor, we gain teeth in the green places, but if we keep them at the edge of court, fewer priests will need calming.\n\nBeyond the road, wilder Beastmen hear every rumor. A careless answer may travel faster than any royal decree."
 ind_events.3.a:0 "Honor the Tigerfolk envoys."
 ind_events.3.b:0 "Grant them jungle courts."
 ind_events.3.c:0 "Keep them at a careful distance."

 ind_events.4.t:0 "The Blood-Hungry Grove"
 ind_events.4.d:0 "Travelers near [event_target.GetName] have begun leaving offerings at a grove where the leaves drip red after sunset. Priests of the Thousand Gods disagree on whether the place is holy, cursed, or merely older than their own temple lists.\n\nThe local Rajah wants the road reopened before the market season begins. Villagers want the screaming to stop. Soldiers say a grove can burn like anything else if enough oil is carried into the trees."
 ind_events.4.a:0 "Pay the old offerings."
 ind_events.4.b:0 "Burn the shrine before it spreads."

 ind_events.5.t:0 "The Spice Road Monopoly"
 ind_events.5.d:0 "The great spice guilds have petitioned for exclusive rights over a chain of river roads and caravanserais. They promise steady taxes, guarded warehouses, and fewer arguments with port officials.\n\nSmaller traders call the request an elegant theft. Temple treasurers suggest that if a monopoly must exist, the gods should hold a share. Every answer will enrich someone and anger someone else."
 ind_events.5.a:0 "Charter the guild monopoly."
 ind_events.5.b:0 "Break the monopolies before they harden."
 ind_events.5.c:0 "Give the temples their share."
 ind_events.5.dd:0 "Sell limited charters."

 ind_events.6.t:0 "Ogre Tolls in the Northern Passes"
 ind_events.6.d:0 "Ogre toll-takers have settled near the northern caravan passes with cooking fires, heavy clubs, and a cheerful lack of legal theory. They eat well from merchants who prefer losing coin to losing limbs.\n\nThe caravans demand protection, but the Ogres are not only raiders. A paid brute can become a guard if the price and the meal are large enough. Refusing them entirely may preserve dignity while costing blood."
 ind_events.6.a:0 "Pay the tolls for now."
 ind_events.6.b:0 "Hire them as caravan guards."
 ind_events.6.c:0 "Refuse their passage."

 ind_events.7.t:0 "Flood of Pilgrims"
 ind_events.7.d:0 "Pilgrims have filled the ghats of [event_target.GetName], sleeping under awnings, chanting through the heat, and leaving coins wherever a priest raises a bowl. The river steps are slick with flowers, ash, and bargaining.\n\nThe city is blessed and overwhelmed. New landings would serve generations, but the treasury groans at the thought. A tax on pilgrims would be easy to collect and hard to forgive.\n\nSome ministers advise closing the roads until the flood passes. That would quiet the streets, though not the complaints."
 ind_events.7.a:0 "Build new ghats."
 ind_events.7.b:0 "Tax the pilgrim flood."
 ind_events.7.c:0 "Close the roads."

 ind_events.8.t:0 "Jewels in the Court Ledger"
 ind_events.8.d:0 "A clerk has found emeralds hidden inside a provincial revenue ledger. The jewels are beautiful, poorly concealed, and connected to enough noble names that the court has suddenly become very quiet.\n\nExposing the bribery would prove that the ruler's eye reaches deep into the bureaucracy. Accepting the gifts would spare several powerful families from disgrace. In Ind, wealth is rarely silent for long."
 ind_events.8.a:0 "Expose the bribes."
 ind_events.8.b:0 "Accept the gifts quietly."

 ind_events.9.t:0 "Monsoon Shipwrights"
 ind_events.9.d:0 "Coastal shipwrights have proposed new hulls built for the monsoon routes. They claim Indish timber, foreign pilotage, and disciplined dockyards can carry our banners farther than the old seasonal convoys.\n\nThe court is divided between sea-minded merchants and inland lords who distrust every horizon. Elven pilots offer precise charts for a precise price. Spice captains offer coin, if they are allowed to keep choosing their own risks."
 ind_events.9.a:0 "Hire the foreign pilots."
 ind_events.9.b:0 "Build proper dockyards."
 ind_events.9.c:0 "Levy the spice convoys."
 ind_events.9.dd:0 "Keep our strength inland."

 ind_events.10.t:0 "The City of a Thousand Lamps"
 ind_events.10.d:0 "One of the great temple cities has lit a thousand lamps along its walls, towers, and sacred tanks. Envoys report that the sight has calmed feuding neighborhoods and drawn scholars, pilgrims, and merchants into the same glowing streets.\n\nThe priests want state support to make the rite permanent. Shrine guards want funds to keep order during the night ceremonies. Merchant houses, naturally, want their names engraved on every bronze lamp.\n\nThe gods may enjoy light, but men will argue over who pays for oil. A ruler who pays wisely may turn the glow into loyalty."
 ind_events.10.a:0 "Fund the lamps from the treasury."
 ind_events.10.b:0 "Guard the shrines through the rite."
 ind_events.10.c:0 "Invite merchant sponsors."
