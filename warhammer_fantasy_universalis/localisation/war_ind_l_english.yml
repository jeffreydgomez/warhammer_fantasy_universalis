ind_celestial_line_envoys_mod:0 "Celestial Line Envoys"
desc_ind_celestial_line_envoys_mod:0 "Our envoys can meet Cathayan pride without surrendering Indish dignity."
ind_celestial_line_markets_mod:0 "Celestial Line Markets"
desc_ind_celestial_line_markets_mod:0 "Trade gives Ind leverage where armies alone would be too blunt."
ind_khuresh_wall_mod:0 "Wall Against Khuresh"
desc_ind_khuresh_wall_mod:0 "The jungle border has become a wall of watchers, posts, and hard roads."
ind_khuresh_jungle_war_mod:0 "Jungle War Doctrine"
desc_ind_khuresh_jungle_war_mod:0 "Indish soldiers have learned how to fight where the green closes in."
ind_khuresh_serpent_treaties_mod:0 "Serpent Treaties"
desc_ind_khuresh_serpent_treaties_mod:0 "Treaties with Khuresh are written as warnings as much as agreements."
ind_crackhorn_gate_mod:0 "Crackhorn Gate"
desc_ind_crackhorn_gate_mod:0 "Crackhorn commands road tolls, spice traffic, and hard stone gates."
ind_bodhimalai_scriptoria_mod:0 "Bodhimalai Scriptoria"
desc_ind_bodhimalai_scriptoria_mod:0 "Bodhimalai's commentaries now circulate through the learned courts of Ind."
ind_rajapur_spice_court_mod:0 "Rajapur Spice Court"
desc_ind_rajapur_spice_court_mod:0 "Rajapur grades aroma, oath, and revenue in the same public court."
ind_dvaraka_tide_ledger_mod:0 "Dvaraka Tide Ledger"
desc_ind_dvaraka_tide_ledger_mod:0 "Dvaraka's pilots have made the western tides legible to the crown."
ind_jaffna_pearl_dues_mod:0 "Jaffna Pearl Dues"
desc_ind_jaffna_pearl_dues_mod:0 "Jaffna's divers, ferries, and shrine dues now serve the wider realm."
ind_malwa_plateau_court_mod:0 "Malwa Plateau Court"
desc_ind_malwa_plateau_court_mod:0 "Malwa's height, poetry, and road law reinforce the canopy."
ind_mrauk_u_glass_palaces_mod:0 "Mrauk U Glass Palaces"
