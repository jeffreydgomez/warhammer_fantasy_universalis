l_english:
 war_warpmoon_project:0 "The Warpmoon Project"
 war_warpmoon_project_desc:0 "The warlock-engineers have turned their instruments upon Morrslieb. Concealed beneath banks of pistons, focusing coils and warpstone vats, an immense cannon is taking shape: a weapon intended to break the Chaos Moon and claim its substance for the Skaven.\n\nThe project is fixed in Central Skavenblight and grants no passive benefits. Its owner must have Skaven Administration, Military Technology 12 and production of at least 20 units of warpstone to build or upgrade it. Each stage costs twice as much and takes twice as long as an ordinary monument. Completing the final stage fires the engine, destroys the project permanently and unleashes a worldwide catastrophe."
 war_destroy_warpmoon_project_title:0 "Destroy the Warpmoon Project"
 war_destroy_warpmoon_project_desc:0 "The Skaven are building a machine to shatter Morrslieb. Whoever controls the site can wreck its completed works, seize the treasury of its engineers and win renown for averting the catastrophe.\n\nDestroying the completed stages returns the project to level 0 and grants 50 Prestige and 1,000 ducats. The site remains available for rebuilding. Use Go To to locate the project in Central Skavenblight."
 war_warpmoon_control_site_tt:0 "Control the province containing the Warpmoon Project at level 1 or 2. Ownership is not required."
 war_warpmoon_reset_tt:0 "The Warpmoon Project returns to level §Y0§! at its current location. It can be rebuilt."
 war_warpmoon_stage_warning_tt:0 "The owner receives a progress report, and every other country receives a warning identifying the Warpmoon Project's location. Anyone controlling its province can take the decision to reduce it to level 0 for §G50 Prestige§! and §G1,000 ducats§!."
 war_warpmoon_warning_tt:0 "The §YDestroy the Warpmoon Project§! decision is now available to every country. Control its province to return the project to level 0 and gain §G50 Prestige§! and §G1,000 ducats§!."
 war_warpmoon_completion_tt:0 "§RMorrslieb will be destroyed!§!\n\nThe Warpmoon Project is permanently destroyed. Its owner gains §YWe destroyed the Moon§! permanently: §G+2§! yearly Prestige, Legitimacy, Devotion and Horde Unity, §G+1§! yearly Republican Tradition, §G+2§! Tolerance of the True Faith and §G+15%§! Religious Unity.\n\nEvery habitable land province outside Dwarfen Underways, Dwarf Karaks, Skaven Passages and Warren-Cities has an independent §Y15%§! chance of reaching §R100 Devastation§!, permanently producing §Ywarpstone§! and becoming a §YWarpmoon Impact Site§! with §R100%§! additional local attrition for §Y1 year§!.\n\nEvery non-Skaven country gains §R50 Aggressive Expansion§! against the owner. Every country receives an announcement."
 war_we_destroyed_the_moon:0 "We destroyed the Moon"
 desc_war_we_destroyed_the_moon:0 "Our engine shattered Morrslieb. The priesthood proclaims the Horned Rat's favor, our rulers claim a triumph beyond the reach of lesser creatures, and the surviving world has learned to fear our ingenuity."
 war_warpmoon_impact_site:0 "Warpmoon Impact Site"
 desc_war_warpmoon_impact_site:0 "A fragment of Morrslieb has struck this province. Green fire and poisonous warpstone dust make the crater lethal to armies of every allegiance. The worst radiation lasts one year; the warpstone deposits remain."
 war_warpmoon.1.t:0 "The Warpmoon Project"
 war_warpmoon.1.d:0 "Reports from [war_warpmoon_province.GetName] describe a vast construction funded by [war_warpmoon_builder.GetName]. Skryre warlock-engineers are assembling focusing rings around a cannon whose barrel points into the heavens, while guarded convoys deliver warpstone to its foundations. Captured calculations identify a single target: Morrslieb, the Chaos Moon.\n\nThe first stage is complete, and the engineers boast that the moon's riches will soon belong to the Skaven. Their rivals dismiss the scheme as another costly delusion, but the machinery is real and its foundations can still be broken. Whoever controls the site can destroy the completed works before the final weapon is ready."
 war_warpmoon.1.a:0 "They mean to fire upon Morrslieb."
 war_warpmoon.2.t:0 "The Engine Turns Moonward"
 war_warpmoon.2.d:0 "A sickly light now hangs above the works in [war_warpmoon_province.GetName]. The engineers serving [war_warpmoon_builder.GetName] have completed the second stage of the Warpmoon Project, linking their cannon to immense reservoirs of refined warpstone. Test discharges climb into the clouds, and the machinery follows Morrslieb's passage across the night sky.\n\nThe remaining work will give the engine the power its creators demand. Their Grey Seers promise a rain of sacred stone, while astronomers beyond the warrens warn that the fragments could devastate every surface realm.\n\nThere is still time to seize the site and wreck the completed stages. Once the final charge is ready, the Skaven will have no reason to wait."
 war_warpmoon.2.a:0 "The final stage must be stopped."
 war_warpmoon.3.t:0 "The Skaven Have Destroyed the Moon"
 war_warpmoon.3.d:0 "A pillar of green fire has risen from [war_warpmoon_province.GetName] and struck Morrslieb. For a heartbeat the Chaos Moon shone brighter than the sun; then its surface split, spilling burning fragments across the heavens. The engine of [war_warpmoon_builder.GetName] consumed itself in the discharge, leaving no weapon for the survivors to seize.\n\nAcross the surface world, falling warpstone has torn open fields, cities and forests. The deep Underways, Karaks, Skaven Passages and warrens shelter beneath their stone roofs, while exposed lands face green fire and poisoned dust. The Skaven who ordered the shot proclaim the Horned Rat's favor, and the other peoples of the world will remember who shattered their sky."
 war_warpmoon.3.a:0 "Morrslieb is gone."
 war_warpmoon_aftermath_tt:0 "The impacts have already struck: each eligible surface province had an independent §Y15%§! chance of suffering §R100 Devastation§!, changing permanently to §Ywarpstone§! and receiving §YWarpmoon Impact Site§! for §Y1 year§!.\n\nThe country that fired the engine has received its permanent reward and §R50 Aggressive Expansion§! with every non-Skaven country. The Warpmoon Project is gone forever."

 war_warpmoon.4.t:0 "The Heavens Will Be Ours"
 war_warpmoon.4.d:0 "The first stage of our Warpmoon Project stands complete in [war_warpmoon_province.GetName]. Deep beneath its iron ribs, warlock-engineers squabble over stolen calculations while gangs of exhausted slaves haul the first focusing rings into place. Above them hangs Morrslieb, swollen with warpstone that lesser minds insist must remain beyond our reach.\n\nSoon-soon, all that sacred stone will belong to us! Already our rivals have learned enough to fear the work, and their spies will seek a way to break what they cannot build. We must guard the completed machinery and feed the next stage with gold, labor and warpstone."
 war_warpmoon.4.a:0 "More coils! More slaves! Guard the engine!"
 war_warpmoon.5.t:0 "One More Charge, Yes-Yes!"
 war_warpmoon.5.d:0 "The second stage is complete, and our engine in [war_warpmoon_province.GetName] has turned its great barrel upon Morrslieb. Its reservoirs hiss with refined warpstone, while the surviving engineers assure us that the latest test deaths prove their calculations correct.\n\nThe Grey Seers proclaim that the Great Horned Rat has placed his treasure in the sky for us to seize. Our rivals call the plan madness, yet their spies grow bolder with every convoy that reaches the works.\n\nOne final stage will give the cannon its full charge, and then no creature shall deny our greatness. Until that moment, we must hold the site against every jealous fool who would drag our triumph back into the mud."
 war_warpmoon.5.a:0 "Finish it! The moon is ours-ours!"
 war_warpmoon.6.t:0 "We Destroyed the Moon!"
 war_warpmoon.6.d:0 "Our cannon fired, and the heavens broke. A pillar of green fire leapt from [war_warpmoon_province.GetName] into Morrslieb, splitting the Chaos Moon and scattering its sacred substance across the world. The engine tore itself apart beneath the strain, but what need have we of a moon-breaking cannon when the moon is already broken?\n\nThe Grey Seers shriek of the Great Horned Rat's favor, and every surviving engineer insists that the triumph was his alone. Beyond our warrens, burning warpstone falls upon fields and cities, leaving poisoned craters rich with the prize we sought. Let the surface rulers curse our name: they will remember who reached into the sky and took what was ours!"
 war_warpmoon.6.a:0 "Greatest-best of all Skaven!"
 war_warpmoon_owner_warning_tt:0 "Our completed work is vulnerable to sabotage. Any country controlling the project province can use §YDestroy the Warpmoon Project§! to return it to level §Y0§! and gain §G50 Prestige§! and §G1,000 ducats§!. Protect the site while completing the remaining stages."
 war_warpmoon_owner_aftermath_tt:0 "We have gained §YWe destroyed the Moon§! permanently: §G+2§! yearly Prestige, Legitimacy, Devotion and Horde Unity, §G+1§! yearly Republican Tradition, §G+2§! Tolerance of the True Faith and §G+15%§! Religious Unity.\n\nThe impacts have already struck, leaving devastation, permanent warpstone deposits and §YWarpmoon Impact Sites§! that last §Y1 year§!. Every non-Skaven country has gained §R50 Aggressive Expansion§! against us. The Warpmoon Project is gone forever."
 war_warpmoon_internal.a:0 "Continue."
