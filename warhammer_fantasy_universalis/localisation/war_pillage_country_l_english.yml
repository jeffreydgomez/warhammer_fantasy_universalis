 po_pillage_country:0 "Pillage Country"
 PEACE_po_pillage_country:0 "Pillage Country"
 CB_ALLOWED_po_pillage_country:0 "Pillage Country"
 po_pillage_country_desc:0 "Pillage every province owned by §Y[From.GetName]§!, transferring its wealth and people to §Y[Root.GetName]§!. Take §Y1§! random development, plus §Y1§! additional development for every full §Y15§! total development the province has before pillaging.\n\nEach stolen point retains its type and is added to a randomly chosen province owned by the recipient. Base tax, production, and manpower cannot be reduced below §Y1§!; provinces with no development to spare are skipped."
 war_pillage_country_tt:0 "Take §Y1§! random development from each enemy-owned province, plus §Y1§! for every full §Y15§! total development it has before pillaging. Each point is transferred to a random province we own, retaining its type. No development type can fall below §Y1§!."
