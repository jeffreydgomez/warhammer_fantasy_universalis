l_english:
 po_pillage_country:0 "Pillage Country"
 PEACE_po_pillage_country:0 "Pillage Country"
 CB_ALLOWED_po_pillage_country:0 "Pillage Country"
 po_pillage_country_desc:0 "Pillage every province owned by §Y[From.GetName]§!, transferring its wealth and people to §Y[Root.GetName]§!. Take §Y1§! random development, plus §Y1§! additional development for every full §Y20§! total development the province has before pillaging.\n\nThe stolen development is delivered immediately when the peace deal is accepted. Each point retains its type and is independently added to a random province owned by the recipient; a province may receive multiple points. Base tax, production, and manpower cannot be reduced below §Y1§!; provinces with no development to spare are skipped."
 war_pillage_country_tt:0 "Take §Y1§! random development from each enemy-owned province, plus §Y1§! for every full §Y20§! total development it has before pillaging. The stolen development is delivered immediately when the peace deal is accepted. Each point goes independently to a random province we own, retaining its type; provinces may receive multiple points. No development type can fall below §Y1§!."
