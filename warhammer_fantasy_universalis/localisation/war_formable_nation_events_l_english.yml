l_english:

war_formable_nations.1.t:0 "The Tzardom Reforged"
war_formable_nations.1.d:0 "Kislev is more than a crown upon the northern steppe. It is the shield of the Old World, a hard land of ice, faith, and horse-lords standing between civilization and the horrors beyond the Troll Country. Every village knows the sound of warning bells, every city remembers siege and famine, and every noble house measures its worth by what it has endured.\n\nTo restore Kislev is to bind the old Ungol riders, the Gospodar nobles, the cities of Praag, Erengard, and Kislev itself, and the cults of Ursun, Dazh, and Tor into a single watchful realm. The Tzar's authority is not merely a claim to rule, but a compact with a people who have survived by discipline, stubbornness, and winter-bitten courage. The land is harsh, yet that harshness has become a sacred inheritance.\n\nThe reborn Tzardom carries a meaning beyond its borders. To the south, Kislev is the first warning that Chaos is moving; to the north, it is the last wall that refuses to break. Its formation declares that the snows have not swallowed the old realm, and that the riders of Kislev will meet the next storm with banners raised."
war_formable_nations.1.a:0 "Kislev endures."

war_formable_nations.2.t:0 "The Dragon Empire Restored"
war_formable_nations.2.d:0 "Grand Cathay is one of the oldest realms in the world, a civilization ordered by celestial law, imperial bureaucracy, geomantic wisdom, and the terrible majesty of dragons. Its walls, rivers, caravans, and courts all serve the promise of harmony beneath Heaven. Even when its provinces quarrel and its governors drift from obedience, the idea of Cathay remains vast enough to shape the dreams of the east.\n\nTo reunite Cathay is to claim that the Mandate is whole again. The Celestial bureaucracy may once more record the empire as a single body, with road, river, fortress, and granary aligned to the will of the throne. This is not only political consolidation, but the restoration of a cosmic order that Cathayan scholars insist has governed the world since ancient days.\n\nA restored Dragon Empire looks outward with renewed certainty. The caravans of the Ivory Road, the sentinels of the Great Bastion, and the magistrates of the river valleys all become signs that harmony has survived its fracture. Foreign courts may see only wealth and power, but Cathay sees the world returning to its proper balance beneath Heaven."
war_formable_nations.2.a:0 "Harmony is restored."

war_formable_nations.3.t:0 "Ulthuan United"
war_formable_nations.3.d:0 "Ulthuan is the ancestral heart of the Asur, a ring of enchanted kingdoms guarded by mists, fleets, ancient waystones, and the memory of glories older than most human nations. Its princes are proud and fractious, each kingdom cherishing its own customs, rivalries, and claims to honor. Yet all understand that the island-continent is more than their separate courts, for the fate of the vortex and the legacy of the Phoenix Kings bind them together.\n\nTo unite Ulthuan is to gather that ancient inheritance beneath one banner again. Lothern's harbors, Saphery's towers, Caledor's memories of dragons, and the sacred groves of Avelorn become parts of a single awakened realm. The act does not end elven pride, but gives it a common direction and a renewed purpose.\n\nA united Ulthuan means more than safety for the Asur. It is a declaration that the elder race has not surrendered its role as guardian, teacher, and judge of the younger world. Whether other peoples welcome such guidance is another question, but the white towers now speak with one voice."
war_formable_nations.3.a:0 "The Phoenix realm is whole."

war_formable_nations.4.t:0 "Strygos Reborn"
war_formable_nations.4.d:0 "Strygos is a memory of a fallen kingdom, a name whispered among ruins, exiles, and the undead heirs of Mourkain. Once it promised a realm for the Strigoi and their subjects, a place where outcasts might be kings rather than monsters in hiding. In ruin it became a wound, haunted by betrayal, hunger, and the long shadow of Ushoran.\n\nTo restore Strygos is to give that broken dream a new body. Its rebirth is not clean or gentle, for too much grief and blood cling to the name, but it offers a throne to those who have known only caves, crypts, and persecution. The old cities may lie shattered, yet memory can be stronger than stone when carried by the undying.\n\nThe return of Strygos will be read differently by every neighbor. Some will see vengeance rising from the badlands, others a cursed court seeking legitimacy, and others still the terrible proof that destroyed kingdoms do not always remain dead. For the Strigoi and their followers, however, it means the lost crown has found a brow once more."
war_formable_nations.4.a:0 "The lost crown rises."

war_formable_nations.5.t:0 "The Karaz Ankor Reclaimed"
war_formable_nations.5.d:0 "The Karaz Ankor is the ancient realm of the Dawi, the mountain empire of holds, roads, mines, and oaths that once bound the World's Edge Mountains into a single unbreakable chain. Every hold is a fortress, every lineage a record, and every wrong a mark in the Dammaz Kron. Even after ages of loss, the Dawi remember the old realm not as legend, but as rightful order interrupted by disaster.\n\nTo restore the Karaz Ankor is to declare that the age of retreat is ending. The High King's authority reaches once more through stone halls and underway passages, calling clans, guilds, thanes, and kings into renewed fellowship. Reopened roads and rekindled forges become symbols that the mountain realm can be rebuilt one oath at a time.\n\nThe reborn Karaz Ankor carries with it both hope and obligation. It is a promise to honor the ancestors, recover what was stolen, and settle the grudges that have darkened Dawi hearts for generations. The world may see a Dwarf empire returning, but the Dawi see a debt finally coming due."
war_formable_nations.5.a:0 "The holds answer."

war_formable_nations.6.t:0 "The Cold Empire Ascendant"
war_formable_nations.6.d:0 "The Cold Empire is the dominion of the Lizardmen temple-cities, a realm less concerned with mortal ambition than with the Great Plan of the Old Ones. Its rulers measure time in ages, read destiny in plaques of sacred stone, and marshal cold-blooded hosts when the world strays from its intended design. To outsiders it may look silent and alien, but within that silence lies a purpose older than recorded history.\n\nTo form the Cold Empire is to bind scattered temple-cities into a single instrument of ancient will. The spawning pools, sacred causeways, geomantic nodes, and slumbering Slann now serve one coordinated design. This is not empire as younger races understand it, but cosmic maintenance conducted with spears, scales, and relentless patience.\n\nThe meaning of the Cold Empire is correction. Chaos, disorder, and mortal ignorance have bent the world away from the pattern set by its vanished creators, and the Lizardmen now move to force it back into alignment. Whether the world understands its salvation is irrelevant, for the Great Plan does not require consent."
war_formable_nations.6.a:0 "The Great Plan advances."

war_formable_nations.7.t:0 "The Ogre Kingdoms Gather"
war_formable_nations.7.d:0 "The Ogre Kingdoms are a brutal confederation of tyrants, tribes, camps, and wandering appetites, born in the Mountains of Mourn and measured by strength, plunder, and the demands of the Great Maw. Ogres respect little beyond size, violence, and the promise of a full cauldron. Their society may seem crude to softer peoples, but it has its own hard logic of dominance, tribute, and survival.\n\nTo unite the Ogre Kingdoms is to make hunger political. Camps that once raided alone now thunder in the same direction, guided by a ruler large enough in body, wealth, or reputation to make other tyrants listen. The feast halls, slave pens, caravan tolls, and battle lines of the mountains become parts of a single devouring order.\n\nSuch a kingdom does not ask the world for respect. It takes cattle, gold, captives, and fear, then calls the result diplomacy if the survivors are useful. The formation of the Ogre Kingdoms means the Great Maw's children have found a shared table, and the rest of the world may be invited only as the meal."
war_formable_nations.7.a:0 "The feast begins."

war_formable_nations.8.t:0 "Tilea United"
war_formable_nations.8.d:0 "Tilea is a land of wealthy city-states, merchant princes, condottieri, scholars, artists, and knife-edged politics. Its cities compete with coin, ships, mercenaries, and intrigue, turning rivalry into a way of life and ambition into an art. Every palace balcony and counting house seems to hide a treaty, a contract, or a betrayal waiting for the proper price.\n\nTo unite Tilea is to do what generations of princes only imagined: bind the southern republics and lordships into one nation. Remas, Miragliano, Luccini, and their rivals bring different traditions of commerce, war, and civic pride to the common table. The achievement is remarkable precisely because Tileans have always known how profitable division can be.\n\nA united Tilea does not cease to be clever, mercantile, or argumentative. Instead, its ports, banks, workshops, and mercenary companies now pursue advantage beneath a shared banner. The world will learn that when Tilea bargains as one, even kings must read the fine print carefully."
war_formable_nations.8.a:0 "Tilea has a single banner."

war_formable_nations.9.t:0 "The Dreadwater Empire"
war_formable_nations.9.d:0 "The Dreadwater Empire is a nightmare realm of undead fleets, black harbors, and drowned ambition. It belongs to the same dark legend as vampire admirals, cursed ships, and coastlines where the tide brings corpses back with orders. Sailors will speak its name in low voices, because the sea is frightening enough before the dead begin to command it.\n\nTo proclaim the Dreadwater Empire is to make the ocean itself a throne. Ports become lairs, captains become dread nobles, and shipwrecks become recruiting grounds for crews that do not breathe. The symbols of ordinary maritime power are twisted into something colder, older, and far less willing to stay sunk.\n\nThe meaning of this empire is dominion over fear. Trade routes, fishing villages, island courts, and naval powers must now reckon with a sovereign power that does not tire, does not age, and does not mourn its losses. Wherever black sails rise, the living remember that the deep keeps its dead only until a stronger will calls them back."
war_formable_nations.9.a:0 "The dead command the waves."

war_formable_nations.10.t:0 "Ankhor Dumbaraz Founded"
war_formable_nations.10.d:0 "Ankhor Dumbaraz is the realm of the Norse Dwarfs, kin of the Dawi shaped by harsher seas, colder mountains, and long isolation from the great holds of the south. Their halls remember old traditions, but their lives are marked by the wind, the oar, and survival on the edge of Norsca. They have endured where stone meets storm, keeping ancestor rites alive beneath skies that rarely forgive weakness.\n\nTo found Ankhor Dumbaraz is to give these scattered clans a common name and future. It is neither simple return nor full separation, but the forging of a northern Dwarf kingdom with its own memory and temper. The realm honors the craft, oaths, and grudges of the Dawi while admitting that distance and hardship have made it something distinct.\n\nIts birth matters because it proves the northern clans are not a footnote to greater holds. They are a people capable of shaping their own kingdom, guarding their own mountains, and carving dignity from a hostile coast. Ankhor Dumbaraz stands with salt in its beard, stone in its heart, and no need to ask whether it belongs."
war_formable_nations.10.a:0 "A northern holdfast is born."

war_formable_nations.11.t:0 "The League of Osterlund"
war_formable_nations.11.d:0 "Osterlund is a northern imperial realm of hard towns, old forests, watchful roads, and stubborn burghers accustomed to surviving where larger powers overlook them. It is a land shaped by frontier politics, provincial pride, and the need for mutual defense. Its people know that danger often arrives before help, and that survival belongs to those already organized when the alarm sounds.\n\nTo form Osterlund is to gather the northern marches of the Empire into a single league. The towns, nobles, militias, and river communities gain a common structure without losing the wary independence that made them endure. This is unity born less from pageantry than from the practical knowledge that a divided frontier is a vulnerable one.\n\nOsterlund's meaning is therefore direct and unsentimental. It is a realm that will not wait for distant courts to understand its dangers, nor trust that imperial politics will always send aid in time. Against cold, beast, raider, and ambitious neighbor, the north now stands together under its own name."
war_formable_nations.11.a:0 "The north stands together."

war_formable_nations.12.t:0 "The Hobgoblin Khaganate"
war_formable_nations.12.d:0 "The Hobgoblin Khaganate is a steppe empire of wolf riders, treacherous chiefs, and hard bargains. Hobgoblins survive by cunning as much as by steel, serving stronger masters when useful and betraying them when the road opens wider. Their enemies call this cowardice, but the steppe often rewards the one who lives to choose the next battle.\n\nTo form the Khaganate is to turn scattered tribes and warbands into a single mounted menace. The camps, herds, raiding trails, and rival chiefs now orbit a khagan whose authority rests on fear, reward, and the promise of plunder. Oaths remain tools rather than sacred bonds, yet even tools can build an empire when held by a clever hand.\n\nThe Khaganate means motion, calculation, and sudden violence. It gives the Hobgoblins a banner broad enough to frighten settled kingdoms and useful enough to tempt every ambitious chieftain. The steppe has found one sly, brutal purpose, and its wolves are already running ahead of the news."
war_formable_nations.12.a:0 "The wolves ride as one."

war_formable_nations.13.t:0 "Karak Eight Peaks Restored"
war_formable_nations.13.d:0 "Karak Eight Peaks is one of the greatest and most tragic of all Dwarf holds, a city of immense halls, deep mines, and bitter memory. Dwarfs, Skaven, and Greenskins have bled through its levels for generations, each claiming the ruins as prize, lair, or sacred inheritance. No chamber is merely stone here, for every gate and gallery has been weighed down by loss.\n\nTo restore Karak Eight Peaks is to answer a grief carved into the heart of the Dawi. Its halls are not merely occupied; they are reclaimed from humiliation, infestation, and the laughter of enemies. The act rings through the mountain like a hammer on an anvil, telling every clan that an old wound has begun to close.\n\nYet restoration is not only about vengeance. It is also about relighting forges, reopening halls, and proving that what was lost can be made living again without forgetting the dead. Karak Eight Peaks returns as a symbol that the Dawi may be diminished, but their oaths can still reshape the world."
war_formable_nations.13.a:0 "The peaks are reclaimed."

war_formable_nations.14.t:0 "Goblin Eight Peaks"
war_formable_nations.14.d:0 "Goblin Eight Peaks is what happens when the old Dwarf dream is painted green. To the Crooked Moon and their kin, the deeps are not a solemn inheritance but the greatest lair a boss could want. They are full of tunnels, loot, ambushes, hiding places, and stories of very serious enemies who failed to take them back.\n\nTo crown a goblin realm in the Eight Peaks is to turn a legendary grudge into a mocking triumph. The hold's meaning changes with its masters, becoming not a monument to order and memory, but a sprawling den of spite, cunning, and victorious noise. Every broken statue and stolen hall becomes proof that the small, sneaky, and vicious can outlast the grand and stubborn.\n\nThe new realm may look absurd to outsiders, but that is part of its power. Goblins understand fear, numbers, tunnels, and the value of making stronger foes angry enough to make mistakes. Goblin Eight Peaks is a joke told at Dwarf expense, and the worst part is that it now has walls, banners, and teeth."
war_formable_nations.14.a:0 "The bad moon grins."

war_formable_nations.15.t:0 "Norsca United"
war_formable_nations.15.d:0 "Norsca is a land of fjords, longships, mammoth trails, dark gods, and kings whose authority lasts only as long as their strength. Its tribes raid southward, feud among themselves, and measure honor in plunder, saga, and the favor of terrible powers. The land breeds hard people, and hard people rarely bend unless someone stronger makes them.\n\nTo unite Norsca is to make those tribes a storm with one eye. Jarls who once sought glory alone now answer to a higher throne, however grudgingly, because victory has a language even the proud understand. Longships, warbands, shamans, and champions now move with a single northern momentum.\n\nThis unity changes the meaning of every raid that follows. The south has long feared Norscan ships as disasters from the horizon, but now those disasters may have strategy, memory, and a royal will behind them. Norsca is no longer only a place that sends raiders; it is a kingdom that can decide where the age will burn."
war_formable_nations.15.a:0 "The north has a king."

war_formable_nations.16.t:0 "Da Great Waagh"
war_formable_nations.16.d:0 "Da Great Waagh is not a state in the tidy sense. It is a green tide of bosses, mobs, drums, banners, squigs, idols, and unstoppable momentum. It is held together by the biggest fists, the loudest promises, and the shared joy of a fight worth crossing the world to find.\n\nTo form Da Great Waagh is to become the shout that every Greenskin hears in its bones. The tribes no longer merely scrap among themselves; they surge outward as one roaring challenge to everything that builds walls, writes laws, or stands still long enough to be hit. Its unity is violent, unstable, and completely real while the winning continues.\n\nThe meaning of Da Great Waagh cannot be captured by diplomats or scholars. It is a migration, a crusade, a riot, and a coronation all at once, fueled by belief that the next battle will be even better than the last. For the rest of the world, it means the horizon has turned green and started laughing."
war_formable_nations.16.a:0 "Waaagh!"

war_formable_nations.17.t:0 "Zharr-Naggrund"
war_formable_nations.17.d:0 "Zharr-Naggrund is the black heart of the Chaos Dwarfs, a city of ziggurats, furnaces, slave pits, and the worship of Hashut. Its sorcerer-prophets turn industry into sacrament and suffering into fuel, forging an empire where iron law and daemonfire are one. Smoke, brass, stone, and cruelty rise together until they become indistinguishable from civilization itself.\n\nTo restore Zharr-Naggrund is to gather the Dawi-Zharr around their terrible center once more. The Plain of Zharr darkens beneath ordered smoke, and every forge becomes a shrine to domination as much as production. This is not a realm seeking acceptance from its western kin, but one that has made exile into doctrine and bitterness into power.\n\nIts meaning is a warning written in fire. Craft can be cruel, discipline can be monstrous, and empire can be built from chains as surely as from laws. With Zharr-Naggrund restored, the world is reminded that the Dawi-Zharr have not merely survived in darkness; they have learned to make darkness work."
war_formable_nations.17.a:0 "The furnaces are lit."

war_formable_nations.18.t:0 "Dhrath-Zharr-Ankor"
war_formable_nations.18.d:0 "Dhrath-Zharr-Ankor is the dark mirror of the ancient Dwarf realm, an empire of Chaos Dwarfs claiming not merely the Plain of Zharr, but the mountain inheritance of their sundered kin. It is ambition hammered into blasphemous imperial form. Where the old Dawi remember honor, the Dawi-Zharr remember abandonment, and they have made that memory burn.\n\nTo form Dhrath-Zharr-Ankor is to announce that the Chaos Dwarfs will no longer be contained by exile or geography. Holds, roads, mines, and forges are to be remade under Hashut's shadow, their old purposes stripped and recast. The mountains that once echoed with ancestral songs may now answer with chains, engines, and daemonic furnaces.\n\nThe realm's meaning is conquest of legacy itself. It does not only seek land, wealth, or slaves, but the right to define what Dwarf civilization becomes after betrayal and corruption. Dhrath-Zharr-Ankor tells the world that the dark holds have awakened, and that they intend to inherit everything."
war_formable_nations.18.a:0 "The dark holds awaken."

war_formable_nations.19.t:0 "Khuresh Coils"
war_formable_nations.19.d:0 "Khuresh is a haunted land of steaming jungles, hidden temples, serpent cults, and nightmares carried by rumor from every border that touches it. Outsiders speak of naga queens, blood rites, and cities where beauty and horror are deliberately entwined. Whether every tale is true hardly matters, because fear itself has long served as one of Khuresh's outer walls.\n\nTo unite Khuresh is to give that secretive dread a political shape. The coils tighten around jungle, coast, and court, drawing scattered powers into a single realm of veiled ceremony and watchful menace. What was once a collection of feared mysteries becomes a kingdom able to decide when the world may glimpse its face.\n\nThe meaning of Khuresh's unity lies in control over the unknown. Rivals can no longer dismiss it as a distant jungle of rumors, nor treat its borders as empty space on a map. The serpent realm has gathered itself, and the wider world must now fear not only what it imagines, but what may actually emerge."
war_formable_nations.19.a:0 "The coils tighten."

war_formable_nations.20.t:0 "The Border Princes Confederacy"
war_formable_nations.20.d:0 "The Border Princes are a patchwork of exiles, mercenaries, petty lords, adventurers, and desperate settlers, each carving a claim from dangerous marches between greater powers. Their politics are unstable, their borders negotiable, and their survival often depends on nerve. Many arrive seeking a throne, a pardon, a fortune, or a second chance no civilized court would grant.\n\nTo form the Border Princes Confederacy is to turn that unruly frontier into a common cause. It does not erase the ambition of its princes, but it forces ambition to recognize the usefulness of a shared shield. Castles, market towns, river crossings, and mercenary companies become part of a bargain that may be fragile, but is stronger than isolation.\n\nThe Confederacy matters because it gives a lawless region a voice without pretending it has become orderly. It is still a land of sharp contracts, private grudges, and rulers with dubious pedigrees. Yet now the frontier can answer threats as a realm, and independence may last longer than the life of a single lucky prince."
war_formable_nations.20.a:0 "The frontier has a voice."

war_formable_nations.21.t:0 "Naggaroth Ascendant"
war_formable_nations.21.d:0 "Naggaroth is the cold empire of the Druchii, born from betrayal, exile, and the unending hatred of Ulthuan. Its black cities, raiding fleets, slave markets, and noble houses serve a society where cruelty is discipline and ambition is expected to draw blood. It is a realm that has turned grievance into culture and survival into domination.\n\nTo unite Naggaroth is to gather the Dark Elves beneath one terrible purpose. The Witch King's legacy is no longer scattered among rival lords, temple factions, beastmasters, and corsair princes. Their intrigues remain, but they now unfold within an imperial order aimed outward at the enemies they have hated for millennia.\n\nThe meaning of Naggaroth's ascendance is vengeance made durable. Its fleets do not merely raid for slaves and treasure; they carry the political will of a realm that sees the world as something to punish. The black arks gather, the cities obey, and the long shadow of the Sundering stretches once again across the seas."
war_formable_nations.21.a:0 "The black arks gather."

war_formable_nations.22.t:0 "Nippon United"
war_formable_nations.22.d:0 "Nippon is an island realm of ancient courts, warrior houses, mountain shrines, and fiercely guarded traditions. Its lords prize honor, mastery, and hierarchy, yet the islands have long known rivalry between clans as much as obedience to any single sovereign. Isolation has preserved much, but it has also given every powerful house room to dream of supremacy.\n\nTo unite Nippon is to draw sword and seal into one hand. Castles, ports, monasteries, and clan domains now answer to a common authority that can turn internal discipline into national strength. The achievement does not abolish old codes and rivalries, but binds them beneath a wider idea of order.\n\nThe united realm means that the islands can look beyond their shores without first watching for knives at home. Merchants, warriors, priests, and courtiers all inherit a larger stage on which to pursue honor and advantage. Nippon has become not merely a collection of proud houses, but a nation with a single horizon."
war_formable_nations.22.a:0 "The islands are one."

war_formable_nations.23.t:0 "Estalia United"
war_formable_nations.23.d:0 "Estalia is a sunlit land of proud kingdoms, fortified towns, sailors, duelists, pilgrims, and old rivalries. Its people stand between the southern seas, the mountains, and the ambitions of neighbors who too often mistake division for weakness. The peninsula has always guarded its honor fiercely, whether in courtly quarrels, religious devotion, or war against foreign invaders.\n\nTo unite Estalia is to make those proud realms a nation. The ports, courts, hilltop cities, and pilgrim roads of the peninsula now share a fate larger than any single crown or city. Rival traditions remain, but they are gathered into a common story of defiance, faith, and hard-won independence.\n\nThe new Estalia means that defense of home, honor, and belief is no longer a local matter. Its fleets can guard the coasts, its armies can hold the passes, and its nobles can quarrel under a banner that still belongs to all of them. What was once a set of proud voices has become a chorus loud enough for the world to hear."
war_formable_nations.23.a:0 "Estalia stands together."

war_formable_nations.24.t:0 "Nehekhara Restored"
war_formable_nations.24.d:0 "Nehekhara is the land of ancient kings, desert necropolises, towering pyramids, and dynasties that refused to surrender their pride even to death. Its glory predates the young realms of men, and its fall still walks beneath the sun in gilded bone and royal wrath. Every tomb city is a court, every pyramid a claim, and every awakened monarch a reminder that time has not softened royal ambition.\n\nTo restore Nehekhara is to gather the tomb kingdoms beneath an imperial memory older than most gods of men. The rival kings and priesthoods may remember different grievances, but they all inherit the same vanished grandeur. Reunification turns scattered necropolises into a civilization that insists it has merely been interrupted.\n\nThe living may call it a realm of the dead, but to its kings it is the rightful return of order. Fields, monuments, soldiers, and subjects are expected to serve as they did in the age of gold, even if flesh has given way to bone. Nehekhara's restoration declares that oblivion failed, and that the first empire of men still demands obedience."
war_formable_nations.24.a:0 "The dead remember empire."

war_formable_nations.25.t:0 "Albion Awakened"
war_formable_nations.25.d:0 "Albion is an island of mist, standing stones, fenland, old giants, and truthsayers who guard memories from before the rise of younger kingdoms. Its shores are remote, but its sacred places have drawn conquerors, seekers, and fools for ages. The island seems poor to those who count only coin, yet it is rich in secrets that older powers have never fully claimed.\n\nTo unite Albion is to draw scattered tribes, circles, and strongholds into a single island realm. The mists still hide old mysteries, but they now shelter a people who can speak with one will when outsiders land upon their shores. Sacred stones, rough hillforts, and marsh paths become parts of a common inheritance rather than isolated refuges.\n\nThe meaning of Albion's awakening is the return of agency to an ancient land. It will no longer be only a prize for foreign adventurers, a rumor on old maps, or a battlefield for powers seeking relics. The island has remembered itself, and beneath the mist a nation begins to move."
war_formable_nations.25.a:0 "The mists part."

war_formable_nations.26.t:0 "Ind United"
war_formable_nations.26.d:0 "Ind is a vast and storied land of sacred beasts, spice roads, jeweled courts, dense jungles, holy cities, and kingdoms whose wealth has drawn the envy of merchants and conquerors alike. Its diversity is a strength, but also a history of competing powers. Every region carries its own customs, dynasties, temples, and trade routes, making unity both difficult and immensely meaningful.\n\nTo unite Ind is to bind its many realms into a civilization conscious of its own scale. Pilgrimage, trade, ritual, and royal authority now move through a common body rather than a field of rival courts. The spices, elephants, ports, river valleys, and sacred places of the subcontinent become parts of a shared political imagination.\n\nA united Ind is not simply wealthy; it is self-aware. Foreign merchants may still covet its goods and distant rulers may still misunderstand its complexity, but they now face a realm able to define itself. The formation of Ind means that abundance has found structure, and that ancient splendor has chosen a single destiny."
war_formable_nations.26.a:0 "Ind has found its center."

war_formable_nations.27.t:0 "Bretonnia Reforged"
war_formable_nations.27.d:0 "Bretonnia is the realm of chivalry, Grail vows, proud dukes, sacred lakes, and peasantry bound beneath the shining burden of noble ideals. Its knights believe themselves chosen to defend honor and the Lady's grace, whatever the cost borne by those below them. The realm is glorious, unequal, devout, and stubbornly convinced that virtue can ride in armor.\n\nTo restore Bretonnia is to gather the duchies beneath a single crown and a single myth. Couronne, Bordeleaux, Parravon, Carcassonne, and the lesser lordships all become chapters in a renewed tale of fealty and divine favor. The old compact of sword, faith, and land is not invented anew, but recalled and sworn again.\n\nThe meaning of Bretonnia's restoration lies in belief. Its nobles ride because they think the world can still be judged by courage, purity, and service, even when reality is less graceful. When the realm of knights rides as one, friend and enemy alike must decide whether they are seeing holy purpose or a beautiful illusion made dangerous by conviction."
war_formable_nations.27.a:0 "For the Lady."

war_formable_nations.28.t:0 "The Under-Empire"
war_formable_nations.28.d:0 "The Under-Empire is the hidden dominion of the Skaven, a world beneath the world made of tunnels, warrens, laboratories, temples, and gnawing ambition. Aboveground nations draw borders on maps, unaware how often those borders sit atop clawed hands and listening ears. The Skaven have always been everywhere in rumor; now they become everywhere in fact.\n\nTo form the Under-Empire is to bring that secret sprawl into a single verminous purpose. The clans still scheme, betray, and bargain, because Skaven nature does not become orderly simply because it becomes imperial. Yet their paranoia, hunger, inventions, plagues, and prophecies now serve a structure large enough to threaten the surface as a whole.\n\nThe meaning of the Under-Empire is revelation delayed. The world above may continue its wars and treaties, but beneath it a second map has been drawn in claw marks and warpstone dust. When the time comes, the surface will learn that it was never standing on solid ground."
war_formable_nations.28.a:0 "The tunnels answer."

war_formable_nations.29.t:0 "Araby United"
war_formable_nations.29.d:0 "Araby is a realm of desert cities, caravan routes, corsair ports, scholars, horse tribes, and radiant faith. Its wealth lies not only in gold and spice, but in its place between continents, where trade, prophecy, and ambition meet beneath the sun. The desert seems empty to strangers, yet those who know its roads understand that it binds more than it divides.\n\nTo unite Araby is to gather oasis, coast, palace, and banner into one civilization. The horse tribes, merchant councils, holy teachers, port captains, and desert princes all gain a shared horizon. Rivalries remain, but they are now contained within a realm conscious of its faith, wealth, and strategic place in the world.\n\nThe meaning of Araby's unity is radiance made political. Caravans may carry its goods, fleets may carry its banners, and preachers may carry its convictions far beyond the dunes. The sun rises over a realm that no longer waits to be crossed, taxed, raided, or interpreted by others."
war_formable_nations.29.a:0 "The sun rises over Araby."

war_formable_nations.30.t:0 "The Empire Restored"
war_formable_nations.30.d:0 "The Empire is the great human realm of the Old World, heir to Sigmar's covenant and a patchwork of provinces, cults, towns, electors, and stubborn local rights. Its strength has always come from holding contradiction together: faith and politics, freedom and duty, province and crown. When it breaks, it does not merely lose land; it loses the argument that mankind can survive through unity.\n\nTo restore the Empire is to mend a political and spiritual idea older than many ruling houses. The electors, cities, and marches may still argue as they always have, because argument is almost an imperial institution in itself. Yet beneath the disputes stands a throne that can once again call the provinces to a common defense.\n\nThe restored Empire matters because darkness presses from every side. Beastmen haunt the forests, the dead stir in cursed lands, northern powers watch for weakness, and ambition gnaws from within. Against all of that, Sigmar's realm becomes whole again, not perfect, not peaceful, but capable of standing."
war_formable_nations.30.a:0 "Sigmar's realm is whole."

war_formable_nations.31.t:0 "The Reman Empire"
war_formable_nations.31.d:0 "The Reman Empire is a southern imperial dream rooted in the legacy of Remas, Myrmidia, law, commerce, and disciplined ambition. It looks back to antiquity not as nostalgia, but as proof that the southern peoples can build more than competing city-states and quarrelsome leagues. In its memory, the south was not merely rich or clever, but capable of order on a grand scale.\n\nTo restore the Reman Empire is to turn memory into a program of rule. The southern Old World is called to order under a revived imperial mantle, where roads, legions, temples, and markets all serve the dignity of the center. Remas becomes more than a city again, not by forgetting its mercantile instincts, but by giving them imperial purpose.\n\nThe meaning of the Reman Empire is disciplined revival. It tells Tileans, Estalians, Myrmidians, merchants, soldiers, and magistrates that the south need not live forever as a field of rivals. Ancient grandeur has been invoked, and now it must prove that a restored name can command living loyalty."
war_formable_nations.31.a:0 "Remas remembers empire."

war_formable_nations.32.t:0 "The Dragon Isles United"
war_formable_nations.32.d:0 "The Dragon Isles are a remote realm of volcanic shores, ancient beasts, island clans, and powers watched uneasily by the great civilizations around them. Their isolation has preserved strange customs and fierce local loyalties, but also kept their strength divided. To outsiders they are a frontier of rumors; to those who dwell there, they are a harsh inheritance worth defending.\n\nTo unite the Dragon Isles is to make those islands a single will. The old local lords, rival centers, sacred places, and coastal strongholds now answer to a common authority able to command the sea lanes between them. Unity does not erase the islands' strangeness, but it gives that strangeness a crown and a direction.\n\nThe new realm means the Dragon Isles can no longer be treated as scattered rocks on the edge of other peoples' maps. They can honor their draconic legacy, guard their volcanic coasts, and decide how much of the wider world they will allow to intrude. The isles breathe as one, and the sound carries farther than before."
war_formable_nations.32.a:0 "The isles breathe as one."
