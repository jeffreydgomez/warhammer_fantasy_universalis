l_english:

war_formable_nations.1.t:0 "The Tzardom Reforged"
war_formable_nations.1.d:0 "At last the Tzardom stands whole again, not as a memory half-buried in snow, but as a living oath kept by riders, boyars, witches, and city folk alike. They said the north could only endure, yet we have done more than endure: we have raised a realm worthy of our ancestors. With Kislev reforged, the next storm from the Wastes will break against a nation that knows why it must survive.\n\n   §YKislevite Ideas§!\n   §YTraditions:§! Regiment Cost §G-10%§!, Manpower §G+15%§!\n   §YSiege Mentality:§! Manpower Recovery §G+10%§!\n   §YFor the people:§! Prestige Decay §G-1.5%§!\n   §YUngol Horse Archers:§! Cavalry Combat Ability §G+15%§!\n   §YImproved Lookouts:§! Fort Maintenance §G-20%§!\n   §YBy Our Blood:§! Morale of Armies §G+10%§!\n   §YIce Rites:§! Hostile Attrition §G+1§!, Max Hostile Attrition §G+1§!\n   §YImperial Efficiency:§! Technology Cost §G-5%§!\n   §YAmbition:§! Infantry Combat Ability §G+10%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.1.a:0 "Kislev endures."

war_formable_nations.2.t:0 "The Dragon Empire Restored"
war_formable_nations.2.d:0 "A new day dawns over Grand Cathay, and the Mandate no longer sounds like a prayer for lost order but a command carried by every court, river, wall, and caravan road. The Dragon Empire has gathered its broken provinces and proven that harmony can be restored by will as much as by Heaven. With Cathay whole again, the east may look outward with confidence and teach the world what order beneath the dragons truly means.\n\n   §YCathayan Ideas§!\n   §YTraditions:§! National Unrest §G-3§!, Governing Capacity §G+15%§!\n   §YSilkscreen Court:§! State Maintenance §G-50%§!, Possible Advisors §G+1§!\n   §YBureaucrat Training:§! Yearly Corruption §G-0.15§!\n   §YDefense in Depth:§! Fort Defense §G+30%§!\n   §YDrill Training:§! Discipline §G+7.5%§!\n   §YNan-Gau Forges:§! Technology Cost §G-7.5%§!\n   §YDynastic Finishing:§! Tax Modifier §G+15%§!\n   §YSky-Junks:§! Artillery Combat Ability §G+15%§!\n   §YAmbition:§! Regiment Cost §G-15%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.2.a:0 "Harmony is restored."

war_formable_nations.3.t:0 "Ulthuan United"
war_formable_nations.3.d:0 "Ulthuan stands united, its white towers and sacred groves no longer speaking as rival courts but as one ancient realm. They said elven pride would always divide the island, yet we have bound that pride to a purpose worthy of the Phoenix Kings. From Lothern to Avelorn, the elder race can now meet the darkening age not as scattered guardians, but as a civilization reborn.\n\n   §YUlthuan Ideas (Asur)§!\n   §YTraditions:§! Trade Efficiency §G+15%§!, Naval Force Limit §G+30%§!\n   §YAsur Craftsmanship:§! Goods Produced §G+15%§!\n   §YWhite Lions of Chrace:§! Morale Damage Received §G-15%§!, Spy Defense §G+15%§!\n   §YEllyrian Reavers:§! Cavalry to Infantry Ratio §G+20%§!, Cavalry Flanking Ability §G+100%§!\n   §YLothern Sea Guard:§! Fire Damage §G+15%§!\n   §YSea Patrol:§! Morale of Navies §G+15%§!, Can Recruit Marines, Marine Force Limit §G+10%§!\n   §YLoremasters of Hoeth:§! Leader Land Maneuver §G+1§!, Innovativeness Gain §G+25%§!\n   §YIthilmar Armour:§! Fire Damage Received §G-10%§!, Movement Speed §G+10%§!\n   §YAmbition:§! Diplomatic Reputation §G+3§!\n\n   §YUlthuan Ideas (Druchii)§!\n   §YTraditions:§! Military Advisor Cost §G-33%§!, Yearly Navy Tradition §G+2§!\n   §YHeir of Aenarion:§! Core Creation Cost §G-30%§!\n   §YCold-Blooded Ascendancy:§! Morale Damage §G+15%§!\n   §YTyrant of All Elves:§! National Unrest §G-3§!\n   §YCorsairs of the Inner Sea:§! Marine Force Limit §G+33%§!, Privateer Efficiency §G+50%§!\n   §YChains of the Phoenix:§! Goods Produced §G+15%§!\n   §YBlack Arks Unbound:§! Heavy Ship Combat Ability §G+15%§!\n   §YDominion of Khaine:§! Monthly War Exhaustion §G-0.03§!\n   §YAmbition:§! Shock Damage §G+15%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.3.a:0 "The Phoenix realm is whole."

war_formable_nations.4.t:0 "Strygos Reborn"
war_formable_nations.4.d:0 "Strygos rises again from ruin, hunger, and exile, giving the heirs of Mourkain a throne where the world expected only caves and curses. The old dream of Ushoran has found flesh, bone, and royal will once more. With Strygos restored, the Badlands will learn that even a murdered kingdom can return with its crown sharpened into vengeance.\n\n   §YStrygos Ideas§!\n   §YTraditions:§! Morale of Armies §G+15%§!, Manpower in Own Culture Provinces §G+30%§!\n   §YGhoul's Delusion:§! Yearly Devotion §G+2§!, Yearly Horde Unity §G+2§!, Yearly Legitimacy §G+2§!, Yearly Meritocracy §G+2§!, Yearly Republican Tradition §G+0.5§!\n   §YCharnel Throne:§! Stability Cost §G-25%§!\n   §YEndless Hunger:§! Looting Speed §G+1§!, Siege Ability §G+25%§!\n   §YCrypt Haunter Courtier:§! Cavalry Combat Ability §G+25%§!\n   §YCarrion Call:§! Reinforce Speed §G+10%§!, Movement Speed §G+10%§!\n   §YTenuous Alliances:§! Diplomatic Reputation §G+3§!\n   §YThe Ghoul King:§! Yearly Prestige §G+2§!\n   §YAmbition:§! Goods Produced §G+15%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.4.a:0 "The lost crown rises."

war_formable_nations.5.t:0 "The Karaz Ankor Reclaimed"
war_formable_nations.5.d:0 "The Karaz Ankor is reclaimed, and the sound of renewed oaths carries through halls that long knew only grief, smoke, and grudges. They said the old mountain empire was a tale for mourning ancestors, but the Dawi have made memory into stone, steel, and command. With the holds answering as one, every stolen gate and broken road becomes a promise that the age of retreat is ending.\n\n   §YKaraz Ankor Ideas§!\n   §YTraditions:§! Primary Culture Development Cost §G-15%§!, Infantry Combat Ability §G+15%§!\n   §YThe Everpeak:§! Discipline §G+7.5%§!\n   §YThe Hold Of The Mountain Pass:§! Goods Produced §G+15%§!\n   §YThe Torrent Gates:§! Fort Defense §G+30%§!\n   §YThe Hornhold:§! Military Technology Cost §G-15%§!\n   §YThe Copper Hold:§! Shock Damage Received §G-7.5%§!, Fire Damage Received §G-7.5%§!\n   §YThe Queen of the Silver Depths:§! Spy Defense §G+50%§!, Morale of Armies §G+7.5%§!\n   §YThe Iron Peak:§! Siege Ability §G+10%§!, Build Time §G-20%§!\n   §YAmbition:§! Domestic Trade Power §G+25%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.5.a:0 "The holds answer."

war_formable_nations.6.t:0 "The Cold Empire Ascendant"
war_formable_nations.6.d:0 "The Cold Empire ascends, not as a mortal vanity, but as the Great Plan finding its instruments at last. Temple-cities, spawning pools, geomantic lines, and slumbering wisdom now move in a single cold-blooded rhythm. With the Lizardmen united, the world may resist correction, but it can no longer pretend the Old Ones have no servants left to enforce their design.\n\n   §YCold Empire Ideas§!\n   §YTraditions:§! War Score Cost vs Other Religions §G-20%§!, Yearly Corruption §G-0.15§!\n   §YMastery of Magic:§! Innovativeness Gain §G+75%§!\n   §YBerserk Rage:§! Morale of Armies §G+15%§!\n   §YGreat Warriors:§! Infantry Combat Ability §G+15%§!\n   §YNo Fear of War:§! Monthly War Exhaustion §G-0.03§!\n   §YGrowth of the Temple Cities:§! Build Cost §G-15%§!\n   §YSweeping Away Corruption:§! Missionary Strength §G+2%§!, Culture Conversion Cost §G-10%§!\n   §YTemporal Mastery:§! Monthly Devastation §G-0.5§!\n   §YAmbition:§! Tolerance of the True Faith §G+5§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.6.a:0 "The Great Plan advances."

war_formable_nations.7.t:0 "The Ogre Kingdoms Gather"
war_formable_nations.7.d:0 "The Ogre Kingdoms have gathered, and every tyrant, camp, cauldron, and caravan toll now points toward one enormous appetite. They said Ogres could feast, raid, and brawl, but never build a kingdom large enough to frighten the world. With the Great Maw's children seated at one table, every neighbor must wonder whether it has been invited as guest, client, or meal.\n\n   §YOgre Kingdoms Ideas§!\n   §YTraditions:§! Fort Defense §G+30%§!, Build Cost §G-15%§!\n   §Y'Protectors' of Trade:§! Trade Efficiency §G+15%§!\n   §YShockingly Obese:§! War Score Cost vs Other Religions §G-20%§!\n   §YBig Migrations:§! Fort Maintenance §G-30%§!\n   §YLucky Gnoblars:§! Morale of Armies §G+15%§!\n   §YProtein Power:§! Infantry Combat Ability §G+15%§!\n   §YMore Tyrants:§! Land Attrition §G-25%§!\n   §YImpressive Wealth:§! Manpower §G+25%§!\n   §YAmbition:§! Siege Ability §G+30%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.7.a:0 "The feast begins."

war_formable_nations.8.t:0 "Tilea United"
war_formable_nations.8.d:0 "Tilea stands united at last, its republics, princes, bankers, condottieri, and jealous ports gathered beneath a single brilliant banner. They said the city-states loved rivalry too much to share a future, yet ambition has done what caution never could. With Tilea speaking as one, the south will bargain, build, sail, and fight with a confidence that even emperors must respect.\n\n   §YTilean Ideas§!\n   §YTraditions:§! Mercenary Maintenance §G-40%§!, Infantry Combat Ability §G+12.5%§!\n   §YDogs of War:§! Mercenary Discipline §G+6%§!\n   §YMost Serene:§! Trade Efficiency §G+12.5%§!\n   §YPatronage of the Arts:§! Advisor Cost §G-12.5%§!\n   §YMyrmidia's Ward:§! Fort Defense §G+25%§!\n   §YMarhsal Plan:§! Development Cost §G-10%§!\n   §YThe Capital:§! Merchants §G+1§!\n   §YArt workshops:§! Production Efficiency §G+12.5%§!\n   §YAmbition:§! Discipline §G+6%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.8.a:0 "Tilea has a single banner."

war_formable_nations.9.t:0 "The Dreadwater Empire"
war_formable_nations.9.d:0 "The Dreadwater Empire rises with black sails, drowned crews, and a throne set upon the tide itself. They said the sea could not be ruled because it forgets all masters, but the dead do not forget, and neither do those who command them. With the coastlines bound to our will, every harbor from the Old World to the eastern seas will learn to fear what returns on the next tide.\n\n   §YDreadwater Ideas§!\n   §YTraditions:§! Overseas Casus Belli, Infantry Fire §G+0.3§!, Marine Force Limit §G+75%§!\n   §YHull of the Damned:§! Ship Durability §G+5%§!, Morale of Navies §G+10%§!\n   §YScourge of the Coasts:§! Privateer Efficiency §G+40%§!, Looting Speed §G+0.3§!, Coastal Raid Range §G+100%§!\n   §YGhostfire Bombardment:§! Fire Damage §G+15%§!, Artillery Cost §G-10%§!\n   §YCommand of the Depths:§! Naval Engagement Width §G+15%§!\n   §YNavigator's Curse:§! Max Admiral Maneuver §G+1§!, Leader Naval Maneuver §G+1§!\n   §YSunken Foundations:§! Development Cost §G-10%§!\n   §YTerror-Bound Authority:§! Yearly Legitimacy §G+2§!, Yearly Devotion §G+2§!, Yearly Horde Unity §G+2§!, Yearly Meritocracy §G+2§!, Yearly Republican Tradition §G+0.75§!\n   §YAmbition:§! Naval Force Limit §G+40%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.9.a:0 "The dead command the waves."

war_formable_nations.10.t:0 "Ankhor Dumbaraz Founded"
war_formable_nations.10.d:0 "Ankhor Dumbaraz is founded, and the Norse Dwarfs now stand as a people with a realm, not a footnote to distant holds. Storm, salt, stone, and isolation have tempered these clans into something proud enough to honor the ancestors without asking permission from the south. With a northern holdfast secure, the cold coasts will know Dawi endurance in a new voice.\n\n   §YNorse Dwarfen Ideas§!\n   §YTraditions:§! Development Cost §G-10%§!, Infantry Combat Ability §G+12.5%§!\n   §YDammaz Kron, The Great Book of Grudges:§! Discipline §G+6%§!\n   §YInterchangeable Parts:§! Goods Produced §G+12.5%§!\n   §YDwarf Fortresses:§! Fort Defense §G+25%§!\n   §YEngineers' Guild Hall:§! Military Technology Cost §G-12.5%§!\n   §YGromril Forges:§! Shock Damage Received §G-6%§!, Fire Damage Received §G-6%§!\n   §YRat Poison:§! Spy Defense §G+25%§!, Morale of Armies §G+3%§!\n   §YConstruction Duty:§! Siege Ability §G+7.5%§!, Build Time §G-10%§!\n   §YAmbition:§! Domestic Trade Power §G+12.5%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.10.a:0 "A northern holdfast is born."

war_formable_nations.11.t:0 "The League of Osterlund"
war_formable_nations.11.d:0 "The League of Osterlund has been forged from hard towns, winter roads, old forests, and frontier stubbornness. They said the northern marches would always wait for stronger provinces to notice their danger, but we have chosen to stand before the alarm is sounded. With Osterlund united, the north gains a shield of its own and a future shaped by those who live closest to the cold.\n\n   §YOsterlund Ideas§!\n   §YTraditions:§! Morale of Armies §G+10%§!, Fort Defense §G+20%§!\n   §YSons of the Eastern March:§! Manpower §G+15%§!\n   §YUlrican Winter Shrines:§! Tolerance of the True Faith §G+1§!, Missionary Strength §G+1%§!\n   §YMiddenlander Hearth Tax:§! Tax Modifier §G+10%§!\n   §YWolf-Road Patrols:§! Leader Land Maneuver §G+1§!\n   §YMarcher Councils:§! Stability Cost §G-15%§!\n   §YEnvoys to Middenheim:§! Diplomatic Reputation §G+2§!\n   §YHold the Frost Line:§! Shock Damage Received §G-10%§!\n   §YAmbition:§! Infantry Combat Ability §G+10%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.11.a:0 "The north stands together."

war_formable_nations.12.t:0 "The Hobgoblin Khaganate"
war_formable_nations.12.d:0 "The Hobgoblin Khaganate rides at last, its wolf herds, camps, lesser khans, and sharp bargains drawn into one ruthless purpose. They said Hobgoblins were too treacherous to build anything lasting, but treachery guided by a clever hand can become policy, empire, and terror. With the steppe united, every settled kingdom will watch the horizon for dust and wonder which oath will break first.\n\n   §YKhanate Ideas§!\n   §YTraditions:§! Aggressive Expansion Impact §G-10%§!, Years of Separatism §G-5§!\n   §YThe Life of a Hobgoblin:§! Land Attrition §G-15%§!\n   §YHorse Supplies:§! Cavalry Combat Ability §G+15%§!\n   §YSteppe Leaders:§! Land Maintenance §G-5%§!\n   §YTraditions of the Great Khan:§! Leader Land Shock §G+1§!\n   §YThe Tradition of Conquest:§! Core Creation Cost §G-20%§!\n   §YLogistics of the Khan:§! Manpower Recovery §G+30%§!\n   §YThe Glory of Conquest:§! Manpower §G+15%§!\n   §YAmbition:§! Colonists §G+1§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.12.a:0 "The wolves ride as one."

war_formable_nations.13.t:0 "Karak Eight Peaks Restored"
war_formable_nations.13.d:0 "Karak Eight Peaks is restored, and the echo of that triumph travels through every Dwarf hall that ever grieved its fall. They said the hold was too bloodied, too infested, too cursed by old defeats to live again, yet the gates have answered Dawi hands once more. With the peaks reclaimed, a wound in the mountain heart begins to close, and every enemy below the stone learns that grudges can build as surely as they can kill.\n\n   §YEight-Peaks Ideas§!\n   §YTraditions:§! Infantry Combat Ability §G+10%§!, Capital Terrain Combat Bonus §G+1§!\n   §YRightful King Of Karak-Eight-Peak:§! Yearly Legitimacy §G+1§!, Diplomatic Reputation §G+1§!\n   §YMaster Of Tunnel Warfare:§! Infantry Fire §G+0.2§!\n   §YQueen Of The Silver Depth:§! Production Efficiency §G+15%§!\n   §YGrand Citadel Of Karak-Eight-Peak:§! Fort Defense §G+15%§!, Monthly Devastation §G-0.05§!\n   §YRestoring Our Heritage:§! Primary Culture Development Cost §G-10%§!\n   §YIronbreaker Veterans:§! Shock Damage Received §G-10%§!\n   §YA New Golden Age:§! Yearly Prestige §G+1§!, Trade Power §G+10%§!\n   §YAmbition:§! Land Force Limit §G+25%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.13.a:0 "The peaks are reclaimed."

war_formable_nations.14.t:0 "Goblin Eight Peaks"
war_formable_nations.14.d:0 "Goblin Eight Peaks is what happens when the old Dwarf dream is painted green. To the Crooked Moon and their kin, the deeps are not a solemn inheritance but the greatest lair a boss could want. They are full of tunnels, loot, ambushes, hiding places, and stories of very serious enemies who failed to take them back.\n\nTo crown a goblin realm in the Eight Peaks is to turn a legendary grudge into a mocking triumph. The hold's meaning changes with its masters, becoming not a monument to order and memory, but a sprawling den of spite, cunning, and victorious noise. Every broken statue and stolen hall becomes proof that the small, sneaky, and vicious can outlast the grand and stubborn.\n\nThe new realm may look absurd to outsiders, but that is part of its power. Goblins understand fear, numbers, tunnels, and the value of making stronger foes angry enough to make mistakes. Goblin Eight Peaks is a joke told at Dwarf expense, and the worst part is that it now has walls, banners, and teeth."
war_formable_nations.14.a:0 "The bad moon grins."

war_formable_nations.15.t:0 "Norsca United"
war_formable_nations.15.d:0 "Norsca is united, and the longships, warbands, jarls, mammoth trails, and dark shrines now thunder beneath a single will. They said the tribes would always spend their strength on feuds and boasts, but one ruler has made saga into command. With Norsca gathered, the southern shores will see more than raids on the horizon; they will see a northern destiny coming for them.\n\n   §YNorse Ideas§!\n   §YTraditions:§! Leader Naval Maneuver §G+2§!, Manpower §G+20%§!, May Recruit Female Generals\n   §YFearsome Warriors:§! Infantry Combat Ability §G+15%§!\n   §YThe Great Hall:§! National Unrest §G-3§!\n   §YSea Marauder's Tools:§! Sailor Recovery §G+7.5%§!, Manpower Recovery §G+7.5%§!\n   §YFuelled by War:§! Monthly War Exhaustion §G-0.03§!\n   §YLongship Armanda:§! Ship Cost §G-15%§!\n   §YSea's Bounty:§! Trade Efficiency §G+15%§!\n   §YLongship Armanda:§! Naval Force Limit §G+30%§!\n   §YAmbition:§! Shock Damage Received §G-15%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.15.a:0 "The north has a king."

war_formable_nations.16.t:0 "Da Great Waagh"
war_formable_nations.16.d:0 "Da Great Waagh has begun, bigger, louder, and meaner than any boss dared promise before the drums started shaking the earth. They said no mob could keep this many greenskins pointed in the same direction, but the fighting has proved them wrong in the only language that matters. With da ladz united, every wall, crown, beard, tower, and shiny thing in the world is just waiting to be smashed.\n\n   §YDa Great Waagh Ideas§!\n   §YTraditions:§! Diplomatic Relations §G+3§!, Years of Separatism §G-5§!\n   §YHealy Mushrooms:§! Land Attrition §G-25%§!\n   §Y'Eavy Metal':§! Shock Damage §G+15%§!\n   §YLadz, Ladz Ladz:§! Land Maintenance §G-10%§!\n   §YBigga n' Betta Bosses:§! Leader Land Shock §G+2§!\n   §YNo complain':§! Core Creation Cost §G-30%§!\n   §YWaaagh!!:§! Manpower Recovery §G+15%§!\n   §YBeyond Countin':§! Manpower §G+25%§!\n   §YAmbition:§! Stability Cost §G-25%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.16.a:0 "Waaagh!"

war_formable_nations.17.t:0 "Zharr-Naggrund"
war_formable_nations.17.d:0 "Zharr-Naggrund rises in smoke and brass, its furnaces, ziggurats, sorcerer-prophets, and slave roads made into the black heart of Hashut's dominion. They said cruelty could only destroy, yet we have made it build cities, engines, and law. With the Dawi-Zharr enthroned in fire, the Dark Lands will become the forge from which an age of chains is cast.\n\n   §YZharr-Naggrund Ideas§!\n   §YTraditions:§! Infantry Combat Ability §G+10%§!, Build Cost §G-10%§!\n   §YThe City of Fire and Desolation:§! Production Efficiency §G+10%§!\n   §YMilitary Convoys:§! Caravan Power §G+30%§!\n   §YA Twisted Parody of Hearth & Oath:§! Discipline §G+5%§!\n   §YFuture of the Dawi-Zharr:§! Yearly Army Tradition §G+0.5§!\n   §YDreadquake Mortar:§! Siege Ability §G+20%§!\n   §YFires of Industry:§! Technology Cost §G-5%§!\n   §YTemple of Hashut:§! Yearly Patriarch Authority §G+0.01§!, Harmonization Speed §G+25%§!, Church Power §G+15%§!, Monthly Fervor §G+1.5§!, Monthly Piety Accelerator §G+0§!, Yearly Harmony §G+0.25§!, Yearly Karma Decay §G+0.05§!, Yearly Authority §G+2§!, Yearly Papal Influence §G+4§!\n   §YAmbition:§! Back Row Artillery Damage §G+10%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.17.a:0 "The furnaces are lit."

war_formable_nations.18.t:0 "Dhrath-Zharr-Ankor"
war_formable_nations.18.d:0 "Dhrath-Zharr-Ankor has been proclaimed, and the dark mirror of the old Dwarf empire now burns with purpose. They said the Dawi-Zharr were exiles gnawing at the edge of a stolen inheritance, but exile has become empire and abandonment has become flame. With the mountains marked for Hashut, every ancient hold must decide whether it will kneel before iron or be remade in it.\n\n   §YZharr Ankor Ideas§!\n   §YTraditions:§! Infantry Combat Ability §G+15%§!, Yearly Army Professionalism §G+0.5%§!\n   §YAn Ancient Schism:§! Leader Land Shock §G+1§!, Leader(s) Without Upkeep §G+3§!\n   §YIncreased Resource Allocation :§! Stability Cost §G-25%§!\n   §YChosen by the Father:§! Morale of Armies §G+15%§!\n   §YInfernal Guard:§! Discipline §G+7.5%§!\n   §YHellforged Ordnance:§! Siege Ability §G+30%§!\n   §YIndustrial Revolution:§! Yearly Prestige §G+2.5§!\n   §YFinest Leaders:§! Innovativeness Gain §G+25%§!\n   §YAmbition:§! Monthly War Exhaustion §G-0.03§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.18.a:0 "The dark holds awaken."

war_formable_nations.19.t:0 "Khuresh Coils"
war_formable_nations.19.d:0 "Khuresh coils into unity, its serpent courts, hidden temples, blood rites, and jungle paths no longer scattered behind rumor and fear. They said the land was too secretive, too hungry, and too treacherous to answer one will, but the veil has tightened into a crown. With Khuresh awakened, every neighbor will learn that beauty, terror, and ambition can strike from the same shadow.\n\n   §YKhuresh Ideas§!\n   §YTraditions:§! Morale of Armies §G+15%§!, Leader Land Shock §G+2§!\n   §YTigerkin Warriors:§! Shock Damage §G+15%§!\n   §YSpice Trade Routes:§! Trade Efficiency §G+15%§!\n   §YKhuresh Philosophy:§! Idea Cost §G-12.5%§!\n   §YLand of a Thousand Gods:§! Production Efficiency §G+15%§!\n   §YElephant Cavalry:§! Cavalry Combat Ability §G+25%§!\n   §YYogic Mysticism:§! Improve Relations §G+30%§!\n   §YKhuresh Mandala System:§! Reform Progress Growth §G+75%§!\n   §YAmbition:§! Morale Damage Received §G-15%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.19.a:0 "The coils tighten."

war_formable_nations.20.t:0 "The Border Princes Confederacy"
war_formable_nations.20.d:0 "The Border Princes Confederacy has done what polite courts considered impossible: it has made a frontier of exiles, sellswords, petty crowns, and desperate towns speak with one voice. They said this land could only be survived, never united, yet necessity has become a banner and opportunity has become law. With the Confederacy standing, the marches can face empires, greenskins, and creditors with the same hard grin.\n\n   §YBorder Prince Ideas§!\n   §YTraditions:§! Land Maintenance §G-15%§!, Trade Power §G+20%§!, May Recruit Female Generals\n   §YCall to Adventure:§! Manpower §G+20%§!\n   §YRough Riders:§! Cavalry Combat Ability §G+25%§!, Nobility Loyalty Equilibrium §G+5%§!\n   §YAgainst the Greenskins:§! Morale of Armies §G+15%§!, Morale of Navies §G+10%§!\n   §YThe Renegade Crown:§! Culture Conversion Cost §G-25%§!, Culture Conversion Time §G-25%§!\n   §YFrontiersmen:§! Leader Land Shock §G+1§!, Leader Naval Shock §G+1§!\n   §YLegacy of Heroes:§! Reform Progress Growth §G+25%§!, National Unrest §G-2§!\n   §YPeople From All Walks of Life:§! Missionary Strength §G+3%§!, Church Loyalty Equilibrium §G+5%§!\n   §YAmbition:§! Manpower Recovery §G+20%§!\n\n   §YDawi Varr Ideas§!\n   §YTraditions:§! Land Maintenance §G-15%§!, Trade Power §G+20%§!\n   §YMuster the Exiled Clans:§! Manpower §G+20%§!\n   §YThane-Guild Batteries:§! Artillery Fire §G+0.25§!, Nobility Loyalty Equilibrium §G+5%§!\n   §YSettle the Greenskin Grudge:§! Morale of Armies §G+15%§!, Morale of Navies §G+10%§!\n   §YThe Renegade Karak:§! Culture Conversion Cost §G-25%§!, Culture Conversion Time §G-25%§!\n   §YFrontier Powdermasters:§! Leader Land Fire §G+1§!, Leader Naval Fire §G+1§!\n   §YOathbound Confederacy:§! Reform Progress Growth §G+25%§!, National Unrest §G-2§!\n   §YShrines of the Ancestors:§! Missionary Strength §G+3%§!, Church Loyalty Equilibrium §G+5%§!\n   §YAmbition:§! Manpower Recovery §G+20%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.20.a:0 "The frontier has a voice."

war_formable_nations.21.t:0 "Naggaroth Ascendant"
war_formable_nations.21.d:0 "Naggaroth ascends, and the black cities, corsair fleets, noble houses, and temples of murder now serve one cold imperial purpose. They said the Druchii would always devour themselves with intrigue before they could master the world, but hatred has been given discipline and vengeance has been given a state. With Naggaroth united, the shadow of the Sundering stretches across every sea that dares carry our enemies.\n\n   §YNaggarothi Ideas§!\n   §YTraditions:§! Military Advisor Cost §G-25%§!, Yearly Navy Tradition §G+1§!\n   §YHeir of Aenerion:§! Core Creation Cost §G-20%§!\n   §YCold Blooded Killers:§! Morale Damage §G+10%§!\n   §YTyrant of Naggaroth:§! National Unrest §G-2§!\n   §YCorsairs of Karond Kar:§! Marine Force Limit §G+25%§!, Privateer Efficiency §G+30%§!\n   §YCrack the Whip:§! Goods Produced §G+10%§!\n   §YBlack Arks:§! Heavy Ship Combat Ability §G+10%§!\n   §YFavoured of Khaine:§! Monthly War Exhaustion §G-0.02§!\n   §YAmbition:§! Shock Damage §G+10%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.21.a:0 "The black arks gather."

war_formable_nations.22.t:0 "Nippon United"
war_formable_nations.22.d:0 "Nippon is united, sword and seal drawn together after generations of clan rivalry, haunted ambition, and watchful mountain shrines. They said the islands would always be divided by pride, knives, and old claims, but a single authority now commands castle, port, monastery, and court. With Nippon whole, honor has a horizon beyond the shore, and the world beyond the waves can no longer ignore the rising sun.\n\n   §YNippon Ideas§!\n   §YTraditions:§! Infantry Combat Ability §G+10%§!, Morale of Armies §G+10%§!\n   §YRakuichi & Rakuza:§! Goods Produced §G+10%§!\n   §YTenka Fubu:§! Core Creation Cost §G-20%§!\n   §YNippon Generals:§! Leader Land Shock §G+1§!\n   §YInfluential Strongholds:§! Leader Siege §G+1§!\n   §YTriple Firing:§! Fire Damage §G+10%§!\n   §YPatronization of Foreigners:§! Technology Cost §G-5%§!\n   §YKenchi:§! Manpower §G+15%§!\n   §YAmbition:§! Leader Land Fire §G+1§!, Max General Fire §G+1§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.22.a:0 "The islands are one."

war_formable_nations.23.t:0 "Estalia United"
war_formable_nations.23.d:0 "Estalia stands together, its proud kingdoms, ports, pilgrims, duelists, and fortified towns gathered into a nation worthy of the peninsula's long defiance. They said rivalry and foreign pressure would keep the west divided, but pride has become unity without surrendering its fire. With Estalia united, the southern seas will carry our banners farther than any doubter imagined.\n\n   §YEstalian Ideas§!\n   §YTraditions:§! Trade Power §G+12.5%§!, Trade Efficiency §G+12.5%§!\n   §YIrregulars:§! Fort Defense §G+25%§!\n   §YHombres Villanos:§! Discipline §G+7.5%§!\n   §YFlourishing Southern Trade:§! Morale of Navies §G+12.5%§!\n   §YMercenary Hosts:§! Mercenary Manpower §G+60%§!\n   §YMasters of the Sea:§! Heavy Ship Combat Ability §G+12.5%§!\n   §YConquistador Lords:§! Land Attrition §G-10%§!, Naval Attrition §G-60%§!\n   §YGreater Rites of Myrmidia:§! Missionary Strength §G+2.5%§!\n   §YAmbition:§! Prestige Decay §G-2%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.23.a:0 "Estalia stands together."

war_formable_nations.24.t:0 "Nehekhara Restored"
war_formable_nations.24.d:0 "Nehekhara is restored, and the first empire of men has risen from tomb, sand, pyramid, and deathless memory. They said time, Nagash, and ruin had ended the golden age forever, but royal will has outlasted oblivion itself. With the dynasties gathered once more, the living and the dead alike must remember that Nehekhara does not ask for obedience; it demands what was always owed.\n\n   §YSeventh Dynasty Ideas§!\n   §YTraditions:§! Production Efficiency §G+15%§!, Primary Culture Development Cost §G-15%§!\n   §YWrath of the Creator:§! Great Project Upgrade Time §G-30%§!, Great Project Upgrade Cost §G-30%§!\n   §YMy Will be Done:§! Monthly Splendor §G+2§!\n   §YEntombed Beneath the Sands:§! Hostile Attrition §G+2§!, Max Hostile Attrition §G+2§!\n   §YSun-scorched Bones:§! Morale of Armies §G+15%§!\n   §YMaster Charioteers:§! Cavalry Combat Ability §G+25%§!\n   §YCharnel Plazas:§! Trade Power Abroad §G+30%§!\n   §YRise of the Seventh Dynasty:§! Stability Cost §G-25%§!\n   §YAmbition:§! National Unrest §G-3§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.24.a:0 "The dead remember empire."

war_formable_nations.25.t:0 "Albion Awakened"
war_formable_nations.25.d:0 "Albion awakens beneath mist, stone, fen, and storm, no longer a rumor for foreign maps or a prize for wandering conquerors. They said the island was too wild and hidden to become a nation, but the tribes and circles have remembered a common fate. With Albion moving as one, the old stones will guard more than secrets; they will guard a future of our own choosing.\n\n   §YAlbionise Ideas§!\n   §YTraditions:§! May Raid Coasts for Slaves, Manpower §G+25%§!, May Recruit Female Generals\n   §YFearsome Warriors:§! Infantry Combat Ability §G+15%§!\n   §YThe Great Hall:§! National Unrest §G-3§!\n   §YSea Marauder's Tools:§! Sailor Recovery §G+10%§!, Manpower Recovery §G+10%§!\n   §YFuelled by War:§! Monthly War Exhaustion §G-0.03§!\n   §YLongship Armanda:§! Ship Cost §G-15%§!\n   §YSea's Bounty:§! Trade Efficiency §G+15%§!\n   §YLongship Armanda:§! Naval Force Limit §G+30%§!\n   §YAmbition:§! Shock Damage Received §G-15%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.25.a:0 "The mists part."

war_formable_nations.26.t:0 "Ind United"
war_formable_nations.26.d:0 "Ind is united, its sacred cities, jungle courts, spice roads, river valleys, and jeweled thrones gathered into a realm conscious of its own splendor. They said abundance would always feed rivalry before unity, yet the many kingdoms have found a single destiny. With Ind whole, foreign merchants and hungry neighbors will meet not a prize to divide, but a civilization ready to define itself.\n\n   §YIndish Ideas§!\n   §YTraditions:§! Morale of Armies §G+20%§!, Leader Land Shock §G+1§!\n   §YTigerkin Warriors:§! Shock Damage §G+15%§!\n   §YSpice Trade Routes:§! Trade Efficiency §G+15%§!\n   §YIndish Philosophy:§! Idea Cost §G-15%§!\n   §YLand of a Thousand Gods:§! Tolerance of Heathens §G+2§!, Production Efficiency §G+7.5%§!\n   §YElephant Cavalry:§! Cavalry Combat Ability §G+20%§!\n   §YYogic Mysticism:§! Improve Relations §G+30%§!\n   §YIndic Mandala System:§! Reform Progress Growth §G+25%§!\n   §YAmbition:§! Morale Damage Received §G-15%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.26.a:0 "Ind has found its center."

war_formable_nations.27.t:0 "Bretonnia Reforged"
war_formable_nations.27.d:0 "Bretonnia is reforged, and the duchies ride beneath one crown, one myth, and one shining vow before the Lady. They said chivalry was too proud, too unequal, and too bound by local honor to answer a single call, but faith has made a realm where politics faltered. With Bretonnia united, the lance points outward, and every darkness beyond the tourney field will learn what conviction can do in armor.\n\n   §YBretonnian Ideas§!\n   §YTraditions:§! Cavalry Combat Ability §G+25%§!, Cavalry Cost §G-20%§!\n   §YKnights of the Sea:§! Morale of Navies §G+15%§!\n   §YBigger Bobbins:§! Build Cost §G-15%§!\n   §YThe Chivalric Code:§! Monthly War Exhaustion §G-0.03§!\n   §YBretonnian Steeds:§! Shock Damage §G+15%§!\n   §YKing's Decree:§! Yearly Corruption §G-0.15§!\n   §YOverseas Diplomancy:§! Diplomatic Reputation §G+3§!\n   §YTenth Share:§! Tax Modifier §G+15%§!\n   §YAmbition:§! Cavalry Shock §G+30%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.27.a:0 "For the Lady."

war_formable_nations.28.t:0 "The Under-Empire"
war_formable_nations.28.d:0 "The Under-Empire is revealed in all but name, its warrens, laboratories, temples, tunnels, and claw-marked maps united beneath one verminous destiny. They said Skaven could only betray, scatter, and gnaw from below, but now the gnawing has become an empire. With the Skaven unified, the world above will tremble without knowing which floor will collapse first.\n\n   §YUnderempire Ideas§!\n   §YTraditions:§! Innovativeness Gain §G+75%§!, Movement Speed §G+25%§!\n   §YBest-Better of All, Yes-Yes!:§! Fire Damage §G+15%§!\n   §YSneak-Sniff Spies!:§! Diplomats §G+1§!, Spy Offense §G+25%§!\n   §YWarp-Turbine Boom-Bang!:§! Technology Cost §G-7.5%§!\n   §YBubbling Bizarre Labs!:§! Siege Ability §G+30%§!\n   §YClimb-Claw for Power!:§! Leader Land Maneuver §G+1§!, Max General Maneuver §G+1§!, Prestige from Land Battles §G+50%§!\n   §YTunnels-Tunnels Everywhere!:§! Hostile Attrition §G+2§!, Max Hostile Attrition §G+2§!\n   §YAlways-More! Never Enough!:§! Infantry Cost §G-15%§!\n   §YAmbition:§! State Governing Cost §G-15%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.28.a:0 "The tunnels answer."

war_formable_nations.29.t:0 "Araby United"
war_formable_nations.29.d:0 "Araby is united beneath sun, caravan, coast, scholar, horse tribe, and radiant faith. They said the desert would divide city from oasis and palace from port, but the roads beneath the sun have carried one purpose across them all. With Araby whole, prophecy and commerce can travel together, and the world will see a realm that no longer waits to be crossed or interpreted by others.\n\n   §YArabyan Ideas§!\n   §YTraditions:§! Manpower §G+20%§!, Land Attrition §G-20%§!\n   §YMasters of the Dunes:§! Trade Efficiency §G+15%§!\n   §YMan and Horse:§! Cavalry Cost §G-15%§!, Cavalry to Infantry Ratio §G+25%§!\n   §YTo Each, Their Own:§! National Unrest §G-3§!\n   §YThe Cult of the One:§! Missionary Strength §G+3%§!, Yearly Imperial Mandate §G+0.1§!\n   §YPort Cities:§! Trade Power §G+15%§!\n   §YSaddle or Sail:§! Leader Land Maneuver §G+1§!, Leader Naval Maneuver §G+1§!\n   §YBinding of Djinn:§! Innovativeness Gain §G+25%§!\n   §YAmbition:§! Leader Land Shock §G+1§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.29.a:0 "The sun rises over Araby."

war_formable_nations.30.t:0 "The Empire Restored"
war_formable_nations.30.d:0 "The Empire is restored, and Sigmar's realm stands whole enough to argue, muster, pray, tax, and fight as one again. They said mankind's bulwark had become too fractured by electors, cults, towns, and jealous rights to rise before the dark, but unity has answered where despair expected silence. With the Empire renewed, the forests, graves, mountains, and northern wastes will find mankind ready behind its old shield.\n\n   §YThe Empire Ideas§!\n   §YTraditions:§! Morale Damage Received §G-15%§!, Morale of Armies §G+15%§!\n   §YThe Colleges of Magic:§! Innovativeness Gain §G+25%§!\n   §YSteel, Faith and Gunpowder:§! Discipline §G+7.5%§!\n   §YMulti-Racial Empire:§! Accepted Cultures §G+3§!, Tolerance of Heretics §G+2§!\n   §YForges of Nuln:§! Production Efficiency §G+15%§!\n   §YImperial Bereacuracy:§! Tax Modifier §G+15%§!\n   §YConclave of Light:§! Diplomatic Reputation §G+3§!\n   §YImperium of Man:§! Artillery Fire §G+0.35§!\n   §YAmbition:§! Governing Capacity §G+20%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.30.a:0 "Sigmar's realm is whole."

war_formable_nations.31.t:0 "The Reman Empire"
war_formable_nations.31.d:0 "The Reman Empire returns, and the southern dream of law, commerce, Myrmidia, roads, legions, and disciplined ambition has stepped out of memory into power. They said Remas and the south could only remember antiquity, not command it, but the old name has found living loyalty. With the Reman mantle restored, the southern peoples can build a future grand enough to make the ancient stones proud.\n\n   §YReman Ideas§!\n   §YTraditions:§! Mercenary Maintenance §G-40%§!, Infantry Combat Ability §G+15%§!\n   §YA Great Empire:§! Governing Capacity §G+20%§!\n   §YMost Serene:§! Trade Efficiency §G+15%§!\n   §YPatronage of the Arts:§! Advisor Cost §G-15%§!\n   §YMyrmidia's Ward:§! Fort Defense §G+30%§!\n   §YMarshal Plan:§! Development Cost §G-10%§!\n   §YThe Capital:§! Merchants §G+2§!\n   §YArt Workshops:§! Production Efficiency §G+15%§!\n   §YAmbition:§! Discipline §G+7.5%§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.31.a:0 "Remas remembers empire."

war_formable_nations.32.t:0 "The Blood-Gong Unites the Isles"
war_formable_nations.32.d:0 "The blood-gong has sounded, and the Dragon Isles now answer as one realm of volcanic shores, obsidian rites, gem tribute, and watchful wings. They said the scale-clans would always fear dragons more than they trusted each other, but fear has been hammered into unity and unity into command. With the isles gathered, the River Ruin, Ind, and the eastern seas must reckon with a blood-throne that bargains from strength.\n\n   §YDragon Isles Ideas§!\n   §YTraditions:§! Infantry Combat Ability §G+15%§!, Primary Culture Development Cost §G-15%§!\n   §YBreak the Harbor Taboos:§! Goods Produced §G+15%§!\n   §YThe Obsidian Blood-Throne:§! Diplomatic Reputation §G+3§!\n   §YDragon Isles War-Chiefs:§! Leader Land Shock §G+1§!, Leader Naval Shock §G+1§!, Prestige from Land Battles §G+25%§!\n   §YInfluential Shrine-Forts:§! Leader Siege §G+1§!, Leader Naval Maneuver §G+1§!, Prestige from Naval Battles §G+10%§!\n   §YTriple Firing:§! Fire Damage §G+15%§!\n   §YPatronization of the Warmblooded:§! Morale of Armies §G+15%§!\n   §YBeyond Our Shores:§! Galley Combat Ability §G+30%§!\n   §YAmbition:§! Leader Land Fire §G+1§!, Max General Fire §G+1§!\n\nChoose whether to adopt these national ideas while keeping current idea progress, or preserve the ideas that brought us here."
war_formable_nations.32.a:0 "Let the blood-gong carry."
