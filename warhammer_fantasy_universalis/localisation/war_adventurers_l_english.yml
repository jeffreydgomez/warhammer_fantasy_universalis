l_english:
 war_adventurer_gelt:0 "Balthasar Gelt, Adventurer"
 desc_war_adventurer_gelt:0 "A gold-masked alchemist has taken an interest in the province's furnaces, and metalworkers crowd his demonstrations of transmutation. Gelt's advice promises purer alloys and hotter forges, though merchants have begun testing every suspiciously bright coin. His experiments keep the workshops busy and the neighbors awake."
 war_adventurer_gelt.1.option_a:0 "Recognize the engineers and adopt the method"
 war_adventurer_gelt.1.option_b:0 "Purchase the notes for civilian furnaces"
 war_adventurer_gelt.1.option_c:0 "Leave the dispute to the guild and collect its licence fee"
 war_adventurer_gelt.1.t:0 "Powder Without Smoke"
 war_adventurer_gelt.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering wizard and alchemist Balthasar Gelt. Our artillery clerk reports that Gelt's overnight experiments produced a cleaner powder batch, but the guild has impounded his notes after a dispute over credit. A powder-blackened brass measure accompanies the clerk's letter, its rim marked with the quantities that survived the test.\n\nOur officials ask us to recognize the engineers and adopt the method. Others argue that we should instead purchase the notes for civilian furnaces. Gelt has left his instruments packed for another journey, and the escort cannot promise to detain him."
 war_adventurer_gelt.2.option_a:0 "Rebuild around the recovered instruments"
 war_adventurer_gelt.2.option_b:0 "Give them to the college"
 war_adventurer_gelt.2.t:0 "Behind the Golden Door"
 war_adventurer_gelt.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering wizard and alchemist Balthasar Gelt. A magistrate reports an explosion in a rented laboratory. Gelt rescued the apprentices and escaped behind his mask; salvagers have recovered unfamiliar refining instruments from the wreckage. The salvagers have stacked the intact retorts beside a list of broken windows and the apprentices who must be paid.\n\nOur officials ask us to rebuild around the recovered instruments. Others argue that we should instead give them to the college. The masked alchemist has slipped away from the officials sent to demand an explanation."
 war_adventurer_gelt.3.option_a:0 "Compensate the captain and study the sample"
 war_adventurer_gelt.3.option_b:0 "Broker a guild settlement and restore the landing facilities"
 war_adventurer_gelt.3.option_c:0 "Dismiss the claim but retain the evidence"
 war_adventurer_gelt.3.t:0 "The Captain's Old Claim"
 war_adventurer_gelt.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering wizard and alchemist Balthasar Gelt. A river captain petitions our court over gold that became lead after Gelt paid his fare. Examination of the remaining metal reveals a useful assay technique, while the captain demands restitution. The captain has nailed one of the dull grey coins to his petition so that nobody can dismiss his loss as a tavern tale.\n\nOur officials ask us to compensate the captain and study the sample. Others argue that we should instead broker a guild settlement and restore the landing facilities. The remaining attendants expect Gelt to be across the border before any summons can reach him."
 war_adventurer_gelt.4.option_a:0 "Prosecute the organizers"
 war_adventurer_gelt.4.option_b:0 "Recover their remaining assets"
 war_adventurer_gelt.4.option_c:0 "Pay the informants to map the conspiracy for our investigators"
 war_adventurer_gelt.4.t:0 "A Mutiny Paid in Lead"
 war_adventurer_gelt.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering wizard and alchemist Balthasar Gelt. Our treasurer reports that conspirators preparing to seize a local arsenal have lost their mercenary payroll to Gelt's transmutation. Their abandoned accounts name officials involved in the plot. Several mercenary captains have surrendered their worthless advances and offered to identify the men who hired them.\n\nOur officials ask us to prosecute the organizers. Others argue that we should instead recover their remaining assets. Gelt's latest lodgings stand empty, leaving his hosts to settle the accounts after his departure."
 war_adventurer_gelt.5.option_a:0 "Authorize a public trial"
 war_adventurer_gelt.5.option_b:0 "Commission controlled workshop copies"
 war_adventurer_gelt.5.option_c:0 "Sponsor independent verification"
 war_adventurer_gelt.5.option_d:0 "Exhibit the successful demonstration in a public archive"
 war_adventurer_gelt.5.t:0 "The Engineers' Dinner"
 war_adventurer_gelt.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering wizard and alchemist Balthasar Gelt. Guild officers report that a quarrel at a banquet ended with Gelt demonstrating a safer powder measure on the dining table.\n\nHe departed before the senior master could forbid its use. A scorched tablecloth bears the measurements, copied in wine by an apprentice before the servants cleared the hall.\n\nOur officials ask us to authorize a public trial. Others argue that we should instead commission controlled workshop copies. No search party has persuaded the golden-masked visitor to remain for an audience."
 war_adventurer_gelt.6.option_a:0 "Pay affected merchants and equip a permanent assay office"
 war_adventurer_gelt.6.option_b:0 "Retain the residue for scholars"
 war_adventurer_gelt.6.option_c:0 "Permit a private settlement and collect the agreed duties"
 war_adventurer_gelt.6.t:0 "Lead on Foreign Scales"
 war_adventurer_gelt.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering wizard and alchemist Balthasar Gelt. Our customs officers intercepted counterfeit-looking gold after Gelt left a caravanserai. A local assayer found that the residue exposes adulterated imports more reliably than the existing test. The assayer has kept the suspect coins beside samples of imported metal that failed the new test.\n\nThe council proposes that we pay affected merchants and equip a permanent assay office. A second proposal would have us retain the residue for scholars. Gelt has left his instruments packed for another journey, and the escort cannot promise to detain him."
 war_adventurer_gelt.7.option_a:0 "Publish a translation"
 war_adventurer_gelt.7.option_b:0 "Grant a limited charter"
 war_adventurer_gelt.7.option_c:0 "Divide access through a new system of guild permits"
 war_adventurer_gelt.7.t:0 "The Furnace Translator"
 war_adventurer_gelt.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering wizard and alchemist Balthasar Gelt. A foreign-language notebook left by Gelt has helped local metalworkers recover ore they previously discarded. Two guilds now claim exclusive rights to the technique. Workers have already separated a small pile of saleable metal from slag previously carted outside the town.\n\nThe council proposes that we publish a translation. A second proposal would have us grant a limited charter. The masked alchemist has slipped away from the officials sent to demand an explanation."
 war_adventurer_gelt.8.option_a:0 "Equip local infirmaries with the reagents"
 war_adventurer_gelt.8.option_b:0 "Reserve them for study"
 war_adventurer_gelt.8.t:0 "The Masked Patient"
 war_adventurer_gelt.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering wizard and alchemist Balthasar Gelt. A physician reports treating apprentices after an alchemical flash in Gelt's lodgings. The wizard paid with medical reagents and vanished, leaving both useful supplies and alarming rumours about his face. Among the supplies are sealed burn dressings and labelled jars whose preparation the physician has carefully recorded.\n\nThe council proposes that we equip local infirmaries with the reagents. A second proposal would have us reserve them for study. The remaining attendants expect Gelt to be across the border before any summons can reach him."
 war_adventurer_gelt.9.option_a:0 "Buy the ledgers and disrupt the network"
 war_adventurer_gelt.9.option_b:0 "Seize implicated goods"
 war_adventurer_gelt.9.option_c:0 "Finance protected caravans"
 war_adventurer_gelt.9.t:0 "A Warlord's Worthless Chest"
 war_adventurer_gelt.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering wizard and alchemist Balthasar Gelt. Border traders report that Gelt turned a raider's tribute chest into lead before its owner could hire an army.\n\nCaptured ledgers expose the foreign brokers supplying the raiders. The ledgers match the seals on several warehouses whose owners have been loudly proclaiming their innocence.\n\nThe council proposes that we buy the ledgers and disrupt the network. A second proposal would have us seize implicated goods. Gelt's latest lodgings stand empty, leaving his hosts to settle the accounts after his departure."
 war_adventurer_gelt.10.option_a:0 "Pay for restoration while retaining the method"
 war_adventurer_gelt.10.option_b:0 "Commission a scholarly explanation"
 war_adventurer_gelt.10.option_c:0 "Let the temple claim the discovery"
 war_adventurer_gelt.10.t:0 "The Price of a Golden Statue"
 war_adventurer_gelt.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering wizard and alchemist Balthasar Gelt. Temple stewards report that Gelt used a damaged ceremonial statue to demonstrate metalworking, leaving stronger fittings but a scandal over its altered appearance. The stewards have submitted both the altered fittings and an itemized estimate for restoring the statue's ceremonial covering.\n\nThe council proposes that we pay for restoration while retaining the method. A second proposal would have us commission a scholarly explanation. No search party has persuaded the golden-masked visitor to remain for an audience."
 war_adventurer_gelt.11.option_a:0 "Replace the payroll"
 war_adventurer_gelt.11.option_b:0 "Delay payment and contain the disorder"
 war_adventurer_gelt.11.option_c:0 "Reorganize the garrison and acknowledge the sabotage"
 war_adventurer_gelt.11.t:0 "The Salzenmund Trick"
 war_adventurer_gelt.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering wizard and alchemist Balthasar Gelt. Our paymaster reports that the garrison's chest now contains lead coins. Witnesses saw a golden rider leaving the tower; unpaid soldiers are already gathering outside the treasury. The soldiers have broken open three further chests, and every supposedly golden coin has yielded beneath a knife.\n\nOne course would be to replace the payroll. Alternatively, we could delay payment and contain the disorder. Gelt has left his instruments packed for another journey, and the escort cannot promise to detain him."
 war_adventurer_gelt.12.option_a:0 "Purchase replacement fittings"
 war_adventurer_gelt.12.option_b:0 "Salvage the metal and suspend operations"
 war_adventurer_gelt.12.t:0 "The Arsenal's Soft Teeth"
 war_adventurer_gelt.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering wizard and alchemist Balthasar Gelt. An ordnance inspection finds cannon fittings softened beyond use after Gelt entered the occupied foundry in disguise. He has fled through a service passage known to the former workers. The master gunner refuses to fire another piece until the weakened collars have been replaced or individually examined.\n\nOne course would be to purchase replacement fittings. Alternatively, we could salvage the metal and suspend operations. The masked alchemist has slipped away from the officials sent to demand an explanation."
 war_adventurer_gelt.13.option_a:0 "Reimburse the network"
 war_adventurer_gelt.13.option_b:0 "Abandon the compromised contacts"
 war_adventurer_gelt.13.option_c:0 "Prosecute the agents"
 war_adventurer_gelt.13.t:0 "A Bounty in False Gold"
 war_adventurer_gelt.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering wizard and alchemist Balthasar Gelt. Our governor reports that agents bribed to locate Gelt accepted coins that reverted to lead.\n\nTheir furious informants have exposed several government safe houses. Two frightened couriers have abandoned their lodgings after finding the exposed addresses posted outside a counting house.\n\nOne course would be to reimburse the network. Alternatively, we could abandon the compromised contacts. The remaining attendants expect Gelt to be across the border before any summons can reach him."
 war_adventurer_gelt.14.option_a:0 "Pay specialist smiths"
 war_adventurer_gelt.14.option_b:0 "Force a breach"
 war_adventurer_gelt.14.option_c:0 "Abandon the building and restore discipline"
 war_adventurer_gelt.14.t:0 "Windows of Brass"
 war_adventurer_gelt.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering wizard and alchemist Balthasar Gelt. The occupation commandant reports that Gelt sealed a requisitioned laboratory in metal while prisoners escaped through its cellar. The frightened garrison has damaged adjoining houses trying to break in. A smith has scraped a sample from the sealed door, but ordinary chisels have only spread cracks through its supporting wall.\n\nOne course would be to pay specialist smiths. Alternatively, we could force a breach. Gelt's latest lodgings stand empty, leaving his hosts to settle the accounts after his departure."
 war_adventurer_gelt.15.option_a:0 "Recall and replace the shipment"
 war_adventurer_gelt.15.option_b:0 "Suspend casting and audit every mould"
 war_adventurer_gelt.15.option_c:0 "Blame the foreman"
 war_adventurer_gelt.15.t:0 "A Foundry's Silent Strike"
 war_adventurer_gelt.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering wizard and alchemist Balthasar Gelt. Our inspector discovers that Gelt left apprentices instructions for quietly ruining military castings. The apprentices have disappeared, and the foundry's next delivery must be condemned. The rejected castings bear the correct inspection stamps, making it impossible to distinguish safe deliveries by their paperwork alone.\n\nOne course would be to recall and replace the shipment. Alternatively, we could suspend casting and audit every mould. No search party has persuaded the golden-masked visitor to remain for an audience."
 war_adventurer_gelt.16.option_a:0 "Compensate offended guests"
 war_adventurer_gelt.16.option_b:0 "Admit the deception"
 war_adventurer_gelt.16.t:0 "The Diplomatic Gift"
 war_adventurer_gelt.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering wizard and alchemist Balthasar Gelt. Our chamberlain reports that an impressive gold gift brought by Gelt has reverted during an audience. Foreign guests witnessed the humiliation before the wizard escaped from his lodgings. The chamberlain has recovered the crumbling presentation tray, but every guest has already seen the dull metal beneath the gilding.\n\nOur advisers recommend that we compensate offended guests. There is also a proposal to admit the deception. Gelt has left his instruments packed for another journey, and the escort cannot promise to detain him."
 war_adventurer_gelt.17.option_a:0 "Pay the company again"
 war_adventurer_gelt.17.option_b:0 "Cancel the commission and reorganize the garrison"
 war_adventurer_gelt.17.option_c:0 "Refuse and contain their looting"
 war_adventurer_gelt.17.t:0 "Mercenaries Without Masters"
 war_adventurer_gelt.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering wizard and alchemist Balthasar Gelt. A frontier commander reports that Gelt transmuted the advance payment for imported mercenaries.\n\nThe company is threatening to loot the district before marching away. The company's quartermaster has delivered a demand for payment together with the lead bars that replaced its promised advance.\n\nOur advisers recommend that we pay the company again. There is also a proposal to cancel the commission and reorganize the garrison. The masked alchemist has slipped away from the officials sent to demand an explanation."
 war_adventurer_gelt.18.option_a:0 "Hire foreign pumps"
 war_adventurer_gelt.18.option_b:0 "Abandon the flooded galleries"
 war_adventurer_gelt.18.option_c:0 "Divert engineers from other duties"
 war_adventurer_gelt.18.t:0 "The Golden Sluice"
 war_adventurer_gelt.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering wizard and alchemist Balthasar Gelt. Mine officers report that Gelt fused a drainage mechanism while helping captives escape. Water is rising through the lower workings, and the fugitive has crossed the outer cordon. Miners have marked the rising water against the gallery posts, and the lowest pump can no longer be reached safely.\n\nOur advisers recommend that we hire foreign pumps. There is also a proposal to abandon the flooded galleries. The remaining attendants expect Gelt to be across the border before any summons can reach him."
 war_adventurer_gelt.19.option_a:0 "Fund relief and replace records"
 war_adventurer_gelt.19.option_b:0 "Isolate the quarter"
 war_adventurer_gelt.19.option_c:0 "Conceal the failure"
 war_adventurer_gelt.19.t:0 "An Embassy of Ash"
 war_adventurer_gelt.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering wizard and alchemist Balthasar Gelt. An official searching Gelt's abandoned workshop triggered a dangerous residue. The explosion destroyed seized military papers and spread panic through the administrative quarter. Clerks are drying the surviving pages in a neighbouring courtyard while displaced households queue beside the same temporary office.\n\nOur advisers recommend that we fund relief and replace records. There is also a proposal to isolate the quarter. Gelt's latest lodgings stand empty, leaving his hosts to settle the accounts after his departure."
 war_adventurer_gelt.20.option_a:0 "Exchange suspect coins at a loss"
 war_adventurer_gelt.20.option_b:0 "Impose a temporary accounting settlement"
 war_adventurer_gelt.20.option_c:0 "Threaten the guilds"
 war_adventurer_gelt.20.t:0 "The Merchant's Last Lesson"
 war_adventurer_gelt.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering wizard and alchemist Balthasar Gelt. Our trade commissioner reports that Gelt publicly demonstrated the adulteration of state-issued coinage, then disappeared. Merchants are refusing the next tax payment in that currency. The merchants have brought their own scales to the counting house and are testing every official payment before accepting it.\n\nOur advisers recommend that we exchange suspect coins at a loss. There is also a proposal to impose a temporary accounting settlement. No search party has persuaded the golden-masked visitor to remain for an audience."
 war_adventurer_gelt.21.t:0 "Balthasar Gelt has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_gelt.21.d:0 "Our officials report that the wandering wizard and alchemist Balthasar Gelt has arrived in [war_adventurer_arrival_province.GetName]. The visitor wears a golden mask and travels with the instruments of an alchemist.\n\nGelt is a wizard of the Gold Order, renowned for his mastery of metal and his experiments with black powder. His reputation attracts craftsmen and scholars, though stories of transmuted coins have made some merchants wary."
 war_adventurer_teclis:0 "Teclis, Adventurer"
 desc_war_adventurer_teclis:0 "Teclis is examining old inscriptions and neglected wards in this province, drawing scholars eager to question the archmage who helped establish the human Colleges of Magic. Even a few words of his instruction can overturn a lifetime of study. His impatience with dangerous ignorance has already offended several local authorities."
 war_adventurer_teclis.1.option_a:0 "Close the site for scholarly study"
 war_adventurer_teclis.1.option_b:0 "Consecrate a safe memorial"
 war_adventurer_teclis.1.option_c:0 "Pay veteran wardens to train our officers at the site"
 war_adventurer_teclis.1.t:0 "The Scar of Finuval"
 war_adventurer_teclis.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf archmage Teclis. Our wardens report that Teclis broke a lingering hostile enchantment at an old battlefield.\n\nFragments of its design offer rare lessons, but pilgrims are entering the still-dangerous site. The wardens have fenced the broken inscriptions with rope, but pilgrims continue to slip through seeking fragments of the defeated spell.\n\nWe could authorize our officials to close the site for scholarly study. The competing request is to consecrate a safe memorial. The Elf has left his conclusions in writing rather than wait upon another court debate."
 war_adventurer_teclis.2.option_a:0 "Endorse the exchange"
 war_adventurer_teclis.2.option_b:0 "Circulate corrected manuals"
 war_adventurer_teclis.2.option_c:0 "Restrict attendance but retain the findings"
 war_adventurer_teclis.2.t:0 "Students from the Human Lands"
 war_adventurer_teclis.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf archmage Teclis. A harbour officer reports that Teclis admitted visiting human apprentices to a private lesson despite objections from local tutors. Their demonstrations have revealed mistakes in the province's teaching manuals. The pupils' corrected exercises show that the disputed lesson exposed a real flaw rather than merely insulting established masters.\n\nWe could authorize our officials to endorse the exchange. The competing request is to circulate corrected manuals. The messengers sent to find Teclis returned with his notes and no promise that he would stay."
 war_adventurer_teclis.3.option_a:0 "Train investigators from the evidence"
 war_adventurer_teclis.3.option_b:0 "Distribute warnings to captains"
 war_adventurer_teclis.3.t:0 "The Old Alliance's Dispatches"
 war_adventurer_teclis.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf archmage Teclis. An archivist reports that Teclis recovered correspondence from the war fought beside Magnus. A comparison with current border reports exposes a familiar pattern of cult infiltration. Several names in the old dispatches correspond to symbols recently found on confiscated charms and concealed meeting places.\n\nWe could authorize our officials to train investigators from the evidence. The competing request is to distribute warnings to captains. Teclis considers the immediate danger settled and has turned his attention to another distant disturbance."
 war_adventurer_teclis.4.option_a:0 "Finance a survey"
 war_adventurer_teclis.4.option_b:0 "Share findings with allied scholars"
 war_adventurer_teclis.4.option_c:0 "Secure the stone in a guarded archive"
 war_adventurer_teclis.4.t:0 "Mud from Albion"
 war_adventurer_teclis.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf archmage Teclis. Our scholars receive Teclis's analysis of a mud-covered stone associated with an overseas expedition. He has neutralized its influence, leaving a useful map of related geomantic disturbances. The stone rests in a sealed chest beside Teclis's sketches of the places where its influence can still be measured.\n\nWe could authorize our officials to finance a survey. The competing request is to share findings with allied scholars. The archmage's escort has already made preparations for travel beyond our jurisdiction."
 war_adventurer_teclis.5.option_a:0 "Appoint the novice with oversight"
 war_adventurer_teclis.5.option_b:0 "Reward the custodians for adopting the correction"
 war_adventurer_teclis.5.option_c:0 "Keep the custodians and reopen the protected precinct"
 war_adventurer_teclis.5.t:0 "A Ward Without a Master"
 war_adventurer_teclis.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf archmage Teclis. Temple attendants report that Teclis repaired a failing protective inscription and identified a local novice capable of maintaining it.\n\nSenior custodians refuse to accept the novice's appointment. The novice has copied the repaired inscription onto wax tablets so that the custodians cannot quietly erase the correction.\n\nWe could authorize our officials to appoint the novice with oversight. The competing request is to reward the custodians for adopting the correction. Teclis has declined an audience and intends to continue his investigations elsewhere."
 war_adventurer_teclis.6.option_a:0 "Charter supervised instruction"
 war_adventurer_teclis.6.option_b:0 "Place pupils under existing tutors"
 war_adventurer_teclis.6.option_c:0 "Close the school but preserve its methods"
 war_adventurer_teclis.6.t:0 "The Unlicensed School"
 war_adventurer_teclis.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf archmage Teclis. Our magistrate reports that Teclis has already taught several gifted children to control dangerous magic. Their families seek protection while established authorities demand the school be closed. The children can now extinguish the sparks that once burned their bedding, although their families still fear the inspectors.\n\nOur officials ask us to charter supervised instruction. Others argue that we should instead place pupils under existing tutors. The Elf has left his conclusions in writing rather than wait upon another court debate."
 war_adventurer_teclis.7.option_a:0 "Reward the defenders"
 war_adventurer_teclis.7.option_b:0 "Adopt the recommended drills"
 war_adventurer_teclis.7.option_c:0 "Fund a recovery station and return fit soldiers to duty"
 war_adventurer_teclis.7.t:0 "A Second Magnus"
 war_adventurer_teclis.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf archmage Teclis. Scouts report that Teclis helped local defenders repel a daemonic breach, then left a stern account comparing their preparation with Magnus's army. Survivors ask for recognition. The defenders have preserved their broken weapons beside a list of practical failings recorded in the Elf's own hand.\n\nOur officials ask us to reward the defenders. Others argue that we should instead adopt the recommended drills. The messengers sent to find Teclis returned with his notes and no promise that he would stay."
 war_adventurer_teclis.8.option_a:0 "Pay for a protected survey"
 war_adventurer_teclis.8.option_b:0 "Compensate the farmers and restore cultivation around the marker"
 war_adventurer_teclis.8.t:0 "Stones Beneath the Orchard"
 war_adventurer_teclis.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf archmage Teclis. Farmers report that Teclis uncovered an ancient stone beneath their orchard and silenced the nightmares troubling the district. His notes warn against removing its neighbouring markers. A ploughshare rests against the exposed marker, and the farmer refuses to work that corner until the warning is explained.\n\nOur officials ask us to pay for a protected survey. Others argue that we should instead compensate the farmers and restore cultivation around the marker. Teclis considers the immediate danger settled and has turned his attention to another distant disturbance."
 war_adventurer_teclis.9.option_a:0 "Expose the plot"
 war_adventurer_teclis.9.option_b:0 "Quietly dismantle its network"
 war_adventurer_teclis.9.option_c:0 "Ransom implicated intermediaries"
 war_adventurer_teclis.9.t:0 "The Foreign Court's Duel"
 war_adventurer_teclis.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf archmage Teclis. Our envoy reports that Teclis defeated a visiting sorcerer's attempt to dominate the court through a concealed spell.\n\nThe defeated mage fled, leaving compromising letters behind. The abandoned letters carry enough recognizable seals to make a public accusation possible, but also dangerous to several established interests.\n\nOur officials ask us to expose the plot. Others argue that we should instead quietly dismantle its network. The archmage's escort has already made preparations for travel beyond our jurisdiction."
 war_adventurer_teclis.10.option_a:0 "Publish the translation"
 war_adventurer_teclis.10.option_b:0 "License reliable practitioners"
 war_adventurer_teclis.10.option_c:0 "Ask the guild to reform itself"
 war_adventurer_teclis.10.option_d:0 "Retain it privately"
 war_adventurer_teclis.10.t:0 "The Translator of Eight Winds"
 war_adventurer_teclis.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf archmage Teclis. A local scholar has translated instructions Teclis left after correcting a dangerous magical experiment. The manuscript challenges a profitable monopoly on supposedly protective charms. Customers have begun bringing their purchased charms to the scholar, demanding to know which inscriptions ever offered protection.\n\nOur officials ask us to publish the translation. Others argue that we should instead license reliable practitioners. Teclis has declined an audience and intends to continue his investigations elsewhere."
 war_adventurer_teclis.11.option_a:0 "Replace the wards with mundane works"
 war_adventurer_teclis.11.option_b:0 "Rebuild discipline and supply"
 war_adventurer_teclis.11.option_c:0 "Pull back from the damaged perimeter"
 war_adventurer_teclis.11.t:0 "The Unravelling at Dawn"
 war_adventurer_teclis.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf archmage Teclis. Our commandant reports that Teclis stripped the wards from an occupied fortress before local insurgents stole its supplies. He has vanished, and the defenders no longer trust their protective charms. The garrison has stripped the useless charms from its gate and is demanding timber, labourers, and trustworthy supply officers.\n\nThe council proposes that we replace the wards with mundane works. A second proposal would have us rebuild discipline and supply. The Elf has left his conclusions in writing rather than wait upon another court debate."
 war_adventurer_teclis.12.option_a:0 "Recruit replacements"
 war_adventurer_teclis.12.option_b:0 "Reorganize the institution"
 war_adventurer_teclis.12.t:0 "The Missing Novices"
 war_adventurer_teclis.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf archmage Teclis. Our governor reports that Teclis led conscripted magical pupils out of a guarded school. Instructors found their coercive bindings broken and their records copied. The empty dormitory contains broken restraints and lesson books with the names of the escaped pupils carefully removed.\n\nThe council proposes that we recruit replacements. A second proposal would have us reorganize the institution. The messengers sent to find Teclis returned with his notes and no promise that he would stay."
 war_adventurer_teclis.13.option_a:0 "Change the routes and codes"
 war_adventurer_teclis.13.option_b:0 "Confiscate the correspondence"
 war_adventurer_teclis.13.option_c:0 "Concede a public failure"
 war_adventurer_teclis.13.t:0 "Letters to the Resistance"
 war_adventurer_teclis.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf archmage Teclis. Our intelligence office intercepted only the last of Teclis's warnings to local communities.\n\nThe letters compare our rule with former Chaos incursions and identify weaknesses in our patrol routes. Patrol officers have found copies of the same letter in settlements whose elders previously claimed never to communicate.\n\nThe council proposes that we change the routes and codes. A second proposal would have us confiscate the correspondence. Teclis considers the immediate danger settled and has turned his attention to another distant disturbance."
 war_adventurer_teclis.14.option_a:0 "Relocate the project"
 war_adventurer_teclis.14.option_b:0 "Stabilize the ground"
 war_adventurer_teclis.14.option_c:0 "Abandon the workings"
 war_adventurer_teclis.14.t:0 "The Stone That Refused Us"
 war_adventurer_teclis.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf archmage Teclis. Surveyors report that a geomantic stone seized for our project became inert after Teclis visited it. Workers fled when its surrounding ground shifted, and the site is now unusable. Cracks now run through the measuring platforms, and the surveyors cannot recover their instruments without reopening unstable ground.\n\nThe council proposes that we relocate the project. A second proposal would have us stabilize the ground. The archmage's escort has already made preparations for travel beyond our jurisdiction."
 war_adventurer_teclis.15.option_a:0 "Acknowledge the risk"
 war_adventurer_teclis.15.option_b:0 "Purge the compromised archive"
 war_adventurer_teclis.15.option_c:0 "Pay for an independent inquiry"
 war_adventurer_teclis.15.t:0 "A Crown's Forbidden Formula"
 war_adventurer_teclis.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf archmage Teclis. Our court mage reports that Teclis removed a dangerous formula from the palace archive and left evidence of its earlier disasters. Courtiers are questioning the ruler's judgement. The court mage has retained the note explaining the formula's dangers, but several courtiers have already copied it.\n\nThe council proposes that we acknowledge the risk. A second proposal would have us purge the compromised archive. Teclis has declined an audience and intends to continue his investigations elsewhere."
 war_adventurer_teclis.16.option_a:0 "Admit the relic was unsafe"
 war_adventurer_teclis.16.option_b:0 "Purchase a replacement symbol"
 war_adventurer_teclis.16.option_c:0 "Investigate the keeper's patrons"
 war_adventurer_teclis.16.t:0 "The Empty Reliquary"
 war_adventurer_teclis.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf archmage Teclis. Our keeper of treasures discovers a relic missing and a note from Teclis warning that it was feeding a hostile power. Witnesses saw the Elf leave before the alarm. The keeper's inventory still records the missing relic as the centrepiece of the coming display, which foreign visitors expect to see.\n\nOne course would be to admit the relic was unsafe. Alternatively, we could purchase a replacement symbol. The Elf has left his conclusions in writing rather than wait upon another court debate."
 war_adventurer_teclis.17.option_a:0 "Compensate affected households"
 war_adventurer_teclis.17.option_b:0 "Reorganize the office"
 war_adventurer_teclis.17.option_c:0 "Suppress the testimony"
 war_adventurer_teclis.17.t:0 "An Enemy's Apprentices"
 war_adventurer_teclis.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf archmage Teclis. Provincial officials report that Teclis taught a group of persecuted spellcasters enough control to escape a state roundup.\n\nTheir flight has exposed the recruitment office's abuses. The abandoned recruitment office contains bindings cut cleanly through and petitions bearing the names of the escaped families.\n\nOne course would be to compensate affected households. Alternatively, we could reorganize the office. The messengers sent to find Teclis returned with his notes and no promise that he would stay."
 war_adventurer_teclis.18.option_a:0 "Restore equipment and pay"
 war_adventurer_teclis.18.option_b:0 "Conduct emergency drills"
 war_adventurer_teclis.18.option_c:0 "Withdraw from the exposed district"
 war_adventurer_teclis.18.t:0 "A Battle Already Lost"
 war_adventurer_teclis.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf archmage Teclis. A garrison report describes Teclis breaking its commander's sorcerous advantage in a brief duel. The commander survived, but the troops abandoned stores during the retreat. The surviving soldiers have surrendered their failed protective tokens and demand instructions that do not rely on the commander's magic.\n\nOne course would be to restore equipment and pay. Alternatively, we could conduct emergency drills. Teclis considers the immediate danger settled and has turned his attention to another distant disturbance."
 war_adventurer_teclis.19.option_a:0 "Buy a negotiated settlement"
 war_adventurer_teclis.19.option_b:0 "Revise the offending administration"
 war_adventurer_teclis.19.option_c:0 "Endure the public accusations"
 war_adventurer_teclis.19.t:0 "The Coalition He Left Behind"
 war_adventurer_teclis.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf archmage Teclis. Our diplomats learn that Teclis has convinced local opponents to exchange information rather than compete. Their coordinated petitions reveal scandals that were previously isolated. The petitions now cite one another's witnesses, preventing officials from dismissing each grievance as an isolated misunderstanding.\n\nOne course would be to buy a negotiated settlement. Alternatively, we could revise the offending administration. The archmage's escort has already made preparations for travel beyond our jurisdiction."
 war_adventurer_teclis.20.option_a:0 "Replace magical surveillance with paid agents"
 war_adventurer_teclis.20.option_b:0 "Change the security system"
 war_adventurer_teclis.20.option_c:0 "Conceal the escape"
 war_adventurer_teclis.20.t:0 "A Tower Without Shadows"
 war_adventurer_teclis.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf archmage Teclis. Watchmen report that Teclis cleansed a tower being used for state-sponsored magical coercion. Its bound watchers are gone, and prisoners escaped during the disturbance. The tower's attendants can no longer call their watchers, leaving the surrounding streets beyond the reach of the former surveillance network.\n\nOne course would be to replace magical surveillance with paid agents. Alternatively, we could change the security system. Teclis has declined an audience and intends to continue his investigations elsewhere."
 war_adventurer_teclis.21.t:0 "Teclis has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_teclis.21.d:0 "A dispatch from [war_adventurer_arrival_province.GetName] announces the arrival of the renowned High Elf archmage Teclis. He is asking after old inscriptions and places where the Winds of Magic gather.\n\nTeclis helped Magnus the Pious resist Chaos and establish the Imperial Colleges of Magic. His frail appearance conceals a sorcerer powerful enough to have defeated Malekith at Finuval Plain."
 war_adventurer_snikch:0 "Deathmaster Snikch, Adventurer"
 desc_war_adventurer_snikch:0 "Reports of a shadow with three blades have sent the province's officials searching their bedchambers for hidden entrances. Clan Eshin's Deathmaster leaves few witnesses, but locked doors offer little reassurance when a body is found beyond them. Merchants pay dearly for escorts while the watch inspects every drain and roofline."
 war_adventurer_snikch.1.option_a:0 "Exploit the letters"
 war_adventurer_snikch.1.option_b:0 "Seize the rival's assets"
 war_adventurer_snikch.1.option_c:0 "Pay the messenger and proclaim the rival plot defeated"
 war_adventurer_snikch.1.t:0 "The Rival's Prayer"
 war_adventurer_snikch.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the elusive Skaven assassin Deathmaster Snikch. Our clan overseer reports that a rival's foreign champion was found dead at prayer.\n\nSnikch's messenger has delivered the champion's correspondence, but insists the service remain unacknowledged. The letters identify a concealed payment route that can be exploited before the champion's patrons appoint a replacement.\n\nOur advisers recommend that we exploit the letters. There is also a proposal to seize the rival's assets. The messenger who delivered the evidence disappeared before a second question could be asked."
 war_adventurer_snikch.2.option_a:0 "Plan limited raids"
 war_adventurer_snikch.2.option_b:0 "Sell selected routes to another clan"
 war_adventurer_snikch.2.option_c:0 "Strengthen our own tunnel security"
 war_adventurer_snikch.2.t:0 "One Winter's Ledgers"
 war_adventurer_snikch.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the elusive Skaven assassin Deathmaster Snikch. Tunnel officers recover ledgers from a stronghold Snikch infiltrated over several months. The records reveal safe routes through its patrol system and stocks worth stealing. The stolen ledgers include changes of guard recorded in several different hands, confirming the assassin's prolonged access.\n\nOur advisers recommend that we plan limited raids. There is also a proposal to sell selected routes to another clan. By the time the latest report was sealed, the trail had already passed beyond the search cordon."
 war_adventurer_snikch.3.option_a:0 "Study the charts"
 war_adventurer_snikch.3.option_b:0 "Sell them through intermediaries"
 war_adventurer_snikch.3.t:0 "An Observatory's Last Chart"
 war_adventurer_snikch.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the elusive Skaven assassin Deathmaster Snikch. A courier deposits star charts stolen from a murdered surface wizard. Snikch's involvement is suggested by a blood-mark, but our agents cannot authenticate it. The courier has wrapped the charts around a bloodstained observatory seal, offering evidence of the theft but none of its precise author.\n\nOur advisers recommend that we study the charts. There is also a proposal to sell them through intermediaries. The watch expects to find abandoned hiding places rather than an assassin waiting to be arrested."
 war_adventurer_snikch.4.option_a:0 "Reward the team and distribute stores"
 war_adventurer_snikch.4.option_b:0 "Sell captured goods"
 war_adventurer_snikch.4.option_c:0 "Exploit the signal once more"
 war_adventurer_snikch.4.t:0 "The Gatekeeper's Successor"
 war_adventurer_snikch.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the elusive Skaven assassin Deathmaster Snikch. Our commander reports that Snikch removed a hostile gatekeeper and obtained the signal used to admit supply wagons. A small infiltration team has already returned with military stores. The returning infiltrators have brought intact ration sacks and the wooden tally used to authorize the captured wagons.\n\nOur advisers recommend that we reward the team and distribute stores. There is also a proposal to sell captured goods. The investigators found the suspected assassin's last refuge empty."
 war_adventurer_snikch.5.option_a:0 "Blackmail both sponsors"
 war_adventurer_snikch.5.option_b:0 "Expose one and recruit the other"
 war_adventurer_snikch.5.option_c:0 "Suppress the affair"
 war_adventurer_snikch.5.t:0 "The Assassins' Quarrel"
 war_adventurer_snikch.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the elusive Skaven assassin Deathmaster Snikch. Our steward finds two rival murder-contracts pinned to the same corpse.\n\nSnikch has killed their intended victim, leaving both sponsors exposed and our court unexpectedly secure. Both contracts bear genuine payment marks, leaving their sponsors with little room to deny their intentions.\n\nOur advisers recommend that we blackmail both sponsors. There is also a proposal to expose one and recruit the other. No guard can promise that the killer remains anywhere near the scene."
 war_adventurer_snikch.6.option_a:0 "Dismantle the payments and reopen the seized counting houses"
 war_adventurer_snikch.6.option_b:0 "Auction the names discreetly"
 war_adventurer_snikch.6.option_c:0 "Cultivate the compromised merchants"
 war_adventurer_snikch.6.t:0 "The Chapel's Foreign Patron"
 war_adventurer_snikch.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the elusive Skaven assassin Deathmaster Snikch. An agent reports that Snikch killed a knight protecting an overseas enemy's trade interests. The knight's secret payment book has reached our provincial headquarters. Several supposedly independent merchants appear repeatedly in the payment book under the same discreet identifying marks.\n\nWe could authorize our officials to dismantle the payments and reopen the seized counting houses. The competing request is to auction the names discreetly. The messenger who delivered the evidence disappeared before a second question could be asked."
 war_adventurer_snikch.7.option_a:0 "Recover more property"
 war_adventurer_snikch.7.option_b:0 "Copy the fortifications"
 war_adventurer_snikch.7.option_c:0 "Pay smugglers to establish a permanent supply station"
 war_adventurer_snikch.7.t:0 "Behind the Mountain's Doors"
 war_adventurer_snikch.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the elusive Skaven assassin Deathmaster Snikch. A caravan courier brings sketches Snikch made inside a supposedly sealed foreign hold. Our agents have already used one route to recover confiscated clan property. The sketches mark a service passage omitted from every plan previously sold to the provincial agents.\n\nWe could authorize our officials to recover more property. The competing request is to copy the fortifications. By the time the latest report was sealed, the trail had already passed beyond the search cordon."
 war_adventurer_snikch.8.option_a:0 "Read the diplomatic messages"
 war_adventurer_snikch.8.option_b:0 "Extract astronomical tables"
 war_adventurer_snikch.8.t:0 "The Astrologer's Cipher"
 war_adventurer_snikch.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the elusive Skaven assassin Deathmaster Snikch. Our provincial spymaster receives coded correspondence from a locked observatory whose master has vanished. Snikch's accompanying instructions explain the cipher but nothing about the disappearance. A worked example of the cipher has been written on the envelope, allowing the first intercepted message to be read immediately.\n\nWe could authorize our officials to read the diplomatic messages. The competing request is to extract astronomical tables. The watch expects to find abandoned hiding places rather than an assassin waiting to be arrested."
 war_adventurer_snikch.9.option_a:0 "Prepare countermeasures"
 war_adventurer_snikch.9.option_b:0 "Sell a warning to threatened clients"
 war_adventurer_snikch.9.option_c:0 "Keep the route for future intelligence"
 war_adventurer_snikch.9.t:0 "An Open Door at the Feast"
 war_adventurer_snikch.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the elusive Skaven assassin Deathmaster Snikch. Our agents report that Snikch removed a banquet's security officer and left a servant's route open.\n\nThey escaped with plans for a rival's military expedition. The stolen plans record supply dates as well as troop destinations, making them valuable before the expedition departs.\n\nWe could authorize our officials to prepare countermeasures. The competing request is to sell a warning to threatened clients. The investigators found the suspected assassin's last refuge empty."
 war_adventurer_snikch.10.option_a:0 "Regularize the route quietly"
 war_adventurer_snikch.10.option_b:0 "Take an immediate payment"
 war_adventurer_snikch.10.option_c:0 "Protect the merchant as an informant"
 war_adventurer_snikch.10.t:0 "The Price of Silence"
 war_adventurer_snikch.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the elusive Skaven assassin Deathmaster Snikch. A frightened foreign merchant tells our governor that Snikch spared him after discovering a profitable smuggling route. The assassin left instructions for directing its customs payments to our agents. The merchant has submitted his next consignment for inspection, apparently more afraid of the assassin than of the customs office.\n\nWe could authorize our officials to regularize the route quietly. The competing request is to take an immediate payment. No guard can promise that the killer remains anywhere near the scene."
 war_adventurer_snikch.11.option_a:0 "Hire a replacement and reconstruct the charts"
 war_adventurer_snikch.11.option_b:0 "Suspend the observatory and review access"
 war_adventurer_snikch.11.option_c:0 "Conceal the missing charts"
 war_adventurer_snikch.11.t:0 "No Lock Broken"
 war_adventurer_snikch.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the elusive Skaven assassin Deathmaster Snikch. Our astronomer is found dead inside an observatory with every door locked. Officials whisper Snikch's name, but the only certain losses are the scholar and several sensitive charts. The observatory key was still inside the room, and none of the servants can account for the missing charts.\n\nOur officials ask us to hire a replacement and reconstruct the charts. Others argue that we should instead suspend the observatory and review access. The messenger who delivered the evidence disappeared before a second question could be asked."
 war_adventurer_snikch.12.option_a:0 "Pay for a security overhaul"
 war_adventurer_snikch.12.option_b:0 "Maintain the closure"
 war_adventurer_snikch.12.option_c:0 "Reopen and admit defeat"
 war_adventurer_snikch.12.t:0 "The Sealed Hold"
 war_adventurer_snikch.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the elusive Skaven assassin Deathmaster Snikch. Our commandant reports killings continuing despite a complete closure of the settlement. After weeks of paralysis, scouts find evidence that Snikch escaped through the supposedly sealed perimeter. Freshly sealed shutters and untouched gate chains have become a source of ridicule among the people they were meant to reassure.\n\nOur officials ask us to pay for a security overhaul. Others argue that we should instead maintain the closure. By the time the latest report was sealed, the trail had already passed beyond the search cordon."
 war_adventurer_snikch.13.option_a:0 "Stage a state funeral"
 war_adventurer_snikch.13.option_b:0 "Reorganize the guard"
 war_adventurer_snikch.13.t:0 "A Champion at Prayer"
 war_adventurer_snikch.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the elusive Skaven assassin Deathmaster Snikch. Attendants discover the provincial champion slain at a private shrine.\n\nThe assassin has gone, and the garrison interprets the killing as proof that even sacred refuges are unsafe. The attendants have covered the body, but blood remains across the steps where the champion's own guards should have stood.\n\nOur officials ask us to stage a state funeral. Others argue that we should instead reorganize the guard. The watch expects to find abandoned hiding places rather than an assassin waiting to be arrested."
 war_adventurer_snikch.14.option_a:0 "Replace stores and security"
 war_adventurer_snikch.14.option_b:0 "Abandon the compromised wing"
 war_adventurer_snikch.14.option_c:0 "Court-martial the surviving officers"
 war_adventurer_snikch.14.t:0 "The Warden's Unwatched Stair"
 war_adventurer_snikch.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the elusive Skaven assassin Deathmaster Snikch. Our fortress warden has been assassinated at a secluded lookout. Infiltrators used his stolen signal to enter the stores before a relief patrol drove them away. The relief patrol recovered a false supply order bearing the dead warden's mark among the emptied sacks.\n\nOur officials ask us to replace stores and security. Others argue that we should instead abandon the compromised wing. The investigators found the suspected assassin's last refuge empty."
 war_adventurer_snikch.15.option_a:0 "Commission a credible inquiry"
 war_adventurer_snikch.15.option_b:0 "Confiscate the papers"
 war_adventurer_snikch.15.option_c:0 "Accept the scandal"
 war_adventurer_snikch.15.t:0 "The Murder That Named Us"
 war_adventurer_snikch.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the elusive Skaven assassin Deathmaster Snikch. Our governor reports that Snikch arranged a victim's papers to implicate government agents. The true assassin escaped while witnesses spread the accusation through the district. Several witnesses have already recognized official seals in the planted papers, whether those impressions are genuine or copied.\n\nOur officials ask us to commission a credible inquiry. Others argue that we should instead confiscate the papers. No guard can promise that the killer remains anywhere near the scene."
 war_adventurer_snikch.16.option_a:0 "Recall and replace the mission"
 war_adventurer_snikch.16.option_b:0 "Pay to repair relations"
 war_adventurer_snikch.16.option_c:0 "Publicly acknowledge the breach"
 war_adventurer_snikch.16.t:0 "The Chapel on Foreign Soil"
 war_adventurer_snikch.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the elusive Skaven assassin Deathmaster Snikch. Our envoy's armed protector is found murdered during prayer in a provincial shrine. Snikch has left the envoy alive but stripped of confidential documents. The surviving envoy can identify the stolen dispatch cases, but cannot say which of their contents has already been read.\n\nThe council proposes that we recall and replace the mission. A second proposal would have us pay to repair relations. The messenger who delivered the evidence disappeared before a second question could be asked."
 war_adventurer_snikch.17.option_a:0 "Rebuild the customs administration"
 war_adventurer_snikch.17.option_b:0 "Reimburse compromised clients"
 war_adventurer_snikch.17.option_c:0 "Abandon the disputed claims"
 war_adventurer_snikch.17.t:0 "Winter Behind the Customs Wall"
 war_adventurer_snikch.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the elusive Skaven assassin Deathmaster Snikch. A border governor reports repeated disappearances inside a closed customs compound.\n\nSnikch finally escaped with seizure records that expose the state's hidden revenues. The governor's seal remains unbroken on the compound gate, deepening the embarrassment over the missing records and vanished guards.\n\nThe council proposes that we rebuild the customs administration. A second proposal would have us reimburse compromised clients. By the time the latest report was sealed, the trail had already passed beyond the search cordon."
 war_adventurer_snikch.18.option_a:0 "Replace seals and recall couriers"
 war_adventurer_snikch.18.option_b:0 "Compensate recipients of false orders"
 war_adventurer_snikch.18.t:0 "The Wizard's Missing Seal"
 war_adventurer_snikch.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the elusive Skaven assassin Deathmaster Snikch. A court magician is found dead in a locked study, and letters bearing his stolen seal have already redirected official couriers. Investigators suspect Snikch but cannot prove it. Two courier stations have confirmed receiving the forged instructions before the magician's death was discovered.\n\nThe council proposes that we replace seals and recall couriers. A second proposal would have us compensate recipients of false orders. The watch expects to find abandoned hiding places rather than an assassin waiting to be arrested."
 war_adventurer_snikch.19.option_a:0 "Purchase replacement supplies"
 war_adventurer_snikch.19.option_b:0 "Reduce the garrison's commitments"
 war_adventurer_snikch.19.option_c:0 "Punish the district collectively"
 war_adventurer_snikch.19.t:0 "A Gate Opened from Within"
 war_adventurer_snikch.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the elusive Skaven assassin Deathmaster Snikch. Our commander reports a slain watch officer and a supply gate opened during the night. Raiders escaped with powder and prisoners before the alarm reached headquarters. The opened gate shows no damage, while the dead officer's signal cord is missing from his belt.\n\nThe council proposes that we purchase replacement supplies. A second proposal would have us reduce the garrison's commitments. The investigators found the suspected assassin's last refuge empty."
 war_adventurer_snikch.20.option_a:0 "Relocate endangered informants"
 war_adventurer_snikch.20.option_b:0 "Replace the network"
 war_adventurer_snikch.20.option_c:0 "Bury the mistake"
 war_adventurer_snikch.20.t:0 "The Decoy's Funeral"
 war_adventurer_snikch.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the elusive Skaven assassin Deathmaster Snikch. Our intelligence office admits that the alleged assassin it displayed was a decoy. While officials celebrated, Snikch stole the informant register and disappeared. Informants named in the stolen register have begun arriving at government offices demanding new lodgings and protection.\n\nThe council proposes that we relocate endangered informants. A second proposal would have us replace the network. No guard can promise that the killer remains anywhere near the scene."
 war_adventurer_snikch.21.t:0 "Deathmaster Snikch has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_snikch.21.d:0 "Our informants in [war_adventurer_arrival_province.GetName] believe that the elusive Skaven assassin Deathmaster Snikch has entered the province. Their reports describe a cloaked Skaven and blades carried in both paws and tail.\n\nSnikch is Clan Eshin's most feared assassin, notorious for reaching victims behind locked doors and guarded walls. We have a warning of his presence, but neither his hiding place nor his intended victim is known."
 war_adventurer_bugman:0 "Josef Bugman, Adventurer"
 desc_war_adventurer_bugman:0 "Bugman's rangers have found somewhere to broach a cask, and every brewer in the province wants a taste of the master's ale. Between arguments over malt and fermentation, the Dwarfs ask after Goblin raiders and survivors of the ruined brewery. Better beer brings customers, but crossed grudges and loaded crossbows make for uneasy company."
 war_adventurer_bugman.1.option_a:0 "Share the method under inspection"
 war_adventurer_bugman.1.option_b:0 "Auction a limited licence"
 war_adventurer_bugman.1.option_c:0 "Endorse a public tasting"
 war_adventurer_bugman.1.t:0 "The Seventh Cask"
 war_adventurer_bugman.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the famed Dwarf brewer and ranger Josef Bugman. Our brewer's guild reports that Bugman corrected a spoiled batch and left instructions inspired by his celebrated ales.\n\nRival masters are fighting over who may advertise the association. The brewers have kept the corrected batch under lock while their apprentices copy the new fermentation schedule.\n\nOne course would be to share the method under inspection. Alternatively, we could auction a limited licence. Bugman has no intention of remaining until the local accounts are balanced."
 war_adventurer_bugman.2.option_a:0 "Fund homes and premises for the brewing families"
 war_adventurer_bugman.2.option_b:0 "Settle the brewers in our workshops and copy their methods"
 war_adventurer_bugman.2.option_c:0 "Sell surplus vessels and retain the proceeds after relief"
 war_adventurer_bugman.2.t:0 "Charcoal Beneath the Brewhouse"
 war_adventurer_bugman.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the famed Dwarf brewer and ranger Josef Bugman. Workmen restoring an abandoned brewery uncovered records Bugman recognized from his ruined settlement. His rangers recovered stolen vessels from a nearby camp, and displaced brewing families are asking to settle. The recovered copper vessels still bear the marks of families whose names survive in the charred brewery records.\n\nOne course would be to fund homes and premises for the brewing families. Alternatively, we could settle the brewers in our workshops and copy their methods. The rangers' departing wagon bears the same brewery marks that first brought them into this affair."
 war_adventurer_bugman.3.option_a:0 "Settle the families"
 war_adventurer_bugman.3.option_b:0 "Recruit experienced survivors"
 war_adventurer_bugman.3.option_c:0 "Finance their return to kin"
 war_adventurer_bugman.3.t:0 "Names on the Missing List"
 war_adventurer_bugman.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the famed Dwarf brewer and ranger Josef Bugman. A ranger delivers rescued captives and a list of families taken by raiders. Bugman has continued the pursuit; the survivors require somewhere safe to rebuild their lives. Several rescued workers have brought tools hidden during their captivity and are ready to resume their old trades.\n\nOne course would be to settle the families. Alternatively, we could recruit experienced survivors. Bugman's rangers have packed their crossbows and casks for another march."
 war_adventurer_bugman.4.option_a:0 "Distribute the stores and copy the rangers’ supply arrangements"
 war_adventurer_bugman.4.option_b:0 "Return stolen property and restore the affected homes"
 war_adventurer_bugman.4.option_c:0 "Sell unclaimed spoils"
 war_adventurer_bugman.4.t:0 "Crossbows Before Dawn"
 war_adventurer_bugman.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the famed Dwarf brewer and ranger Josef Bugman. Our field officer reports that Bugman's rangers broke an encircling raider camp during the night. They departed after sharing ale with the exhausted defenders, leaving captured supplies. The abandoned camp contains unopened ration barrels, spare crossbow strings, and goods whose owners have come forward to claim them.\n\nOne course would be to distribute the stores and copy the rangers’ supply arrangements. Alternatively, we could return stolen property and restore the affected homes. The brewer has left the settlement of these claims to us while his rangers follow another trail."
 war_adventurer_bugman.5.option_a:0 "Adopt controlled rations"
 war_adventurer_bugman.5.option_b:0 "Pay the quartermaster and retain brewing advice"
 war_adventurer_bugman.5.option_c:0 "Stage a veterans' gathering"
 war_adventurer_bugman.5.t:0 "Troll Brew at the Muster"
 war_adventurer_bugman.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the famed Dwarf brewer and ranger Josef Bugman. A muster captain reports that Bugman's potent beer revived weary volunteers but caused a noisy dispute with the quartermaster.\n\nThe brewer left enough ordinary ale to provision the next march. The captain has separated the ordinary marching ale from the stronger casks after finding volunteers asleep beside the muster rolls.\n\nOne course would be to adopt controlled rations. Alternatively, we could pay the quartermaster and retain brewing advice. Scouts last saw the rangers moving out with their baggage and a stubborn refusal to wait for officials."
 war_adventurer_bugman.6.option_a:0 "Pay the suppliers to expand the caravan stop"
 war_adventurer_bugman.6.option_b:0 "Use the route survey"
 war_adventurer_bugman.6.t:0 "A Caravan with Empty Tankards"
 war_adventurer_bugman.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the famed Dwarf brewer and ranger Josef Bugman. Merchants report that Bugman's rangers rescued their wagons, then consumed much of the recovered beer. The remaining cargo and an accurate route survey have reached our customs house. The merchants' petition carefully distinguishes the freight recovered by the rangers from the drink consumed during their celebration.\n\nOur advisers recommend that we pay the suppliers to expand the caravan stop. There is also a proposal to use the route survey. Bugman has no intention of remaining until the local accounts are balanced."
 war_adventurer_bugman.7.option_a:0 "Support wider production"
 war_adventurer_bugman.7.option_b:0 "Sponsor a merchant fair"
 war_adventurer_bugman.7.option_c:0 "Sell the recipe rights locally"
 war_adventurer_bugman.7.t:0 "Grain from a Strange Valley"
 war_adventurer_bugman.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the famed Dwarf brewer and ranger Josef Bugman. Local brewers report that Bugman adapted his methods to unfamiliar grain and repaired their failing vats. He has left, but their first successful batch attracted merchants from neighbouring markets. The brewers have preserved samples from each stage, allowing the new method to be repeated after their demanding guest has gone.\n\nOur advisers recommend that we support wider production. There is also a proposal to sponsor a merchant fair. The rangers' departing wagon bears the same brewery marks that first brought them into this affair."
 war_adventurer_bugman.8.option_a:0 "Protect the witnesses"
 war_adventurer_bugman.8.option_b:0 "Employ their skills"
 war_adventurer_bugman.8.option_c:0 "Confiscate the smugglers' stock"
 war_adventurer_bugman.8.t:0 "A Brand on the Barrel"
 war_adventurer_bugman.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the famed Dwarf brewer and ranger Josef Bugman. Our market inspector found Bugman's old brewery mark on stolen casks. The ranger followed the sellers, returned with freed workers, and vanished before the smugglers' patrons could retaliate. The rescued workers recognized both the brewery marks and the merchant who ordered those marks scraped away.\n\nOur advisers recommend that we protect the witnesses. There is also a proposal to employ their skills. Bugman's rangers have packed their crossbows and casks for another march."
 war_adventurer_bugman.9.option_a:0 "Survey and open the route"
 war_adventurer_bugman.9.option_b:0 "Buy the recovered provisions"
 war_adventurer_bugman.9.option_c:0 "Circulate the warning to merchants"
 war_adventurer_bugman.9.t:0 "The Pass Beyond the Mountains"
 war_adventurer_bugman.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the famed Dwarf brewer and ranger Josef Bugman. A caravan master reports that Bugman tracked raiders across a pass dismissed as impassable.\n\nThe rangers recovered supplies and left cairns marking a safer crossing. The caravan master has copied the cairns onto a route map and marked the narrowest crossing with a warning for loaded wagons.\n\nOur advisers recommend that we survey and open the route. There is also a proposal to buy the recovered provisions. The brewer has left the settlement of these claims to us while his rangers follow another trail."
 war_adventurer_bugman.10.option_a:0 "Forward it with an escort"
 war_adventurer_bugman.10.option_b:0 "Arrange a paid local sale"
 war_adventurer_bugman.10.option_c:0 "Compensate the carrier and retain brewing samples"
 war_adventurer_bugman.10.t:0 "The Emperor's Delivery"
 war_adventurer_bugman.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the famed Dwarf brewer and ranger Josef Bugman. Our governor receives a battered consignment bearing a distant customer's seal. Bugman recovered it from thieves and left the decision to forward it or settle the disputed freight charges to our officials. The consignment's seals survived the theft, leaving little doubt about the intended recipient or the carrier's outstanding charges.\n\nOur advisers recommend that we forward it with an escort. There is also a proposal to arrange a paid local sale. Scouts last saw the rangers moving out with their baggage and a stubborn refusal to wait for officials."
 war_adventurer_bugman.11.option_a:0 "Import replacements"
 war_adventurer_bugman.11.option_b:0 "Divert civilian stocks"
 war_adventurer_bugman.11.option_c:0 "Reduce military allocations"
 war_adventurer_bugman.11.t:0 "The Brewery Burns Twice"
 war_adventurer_bugman.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the famed Dwarf brewer and ranger Josef Bugman. Our governor reports that Bugman destroyed a requisitioned brewery after finding stolen family equipment inside. The workers escaped with his rangers, leaving the garrison without its contracted supplies. The abandoned account books show exactly how much of the garrison's next delivery was stored in the burned vats.\n\nWe could authorize our officials to import replacements. The competing request is to divert civilian stocks. Bugman has no intention of remaining until the local accounts are balanced."
 war_adventurer_bugman.12.option_a:0 "Buy replacement grain"
 war_adventurer_bugman.12.option_b:0 "Redistribute existing supplies"
 war_adventurer_bugman.12.option_c:0 "Ignore the demand and endure shortages"
 war_adventurer_bugman.12.t:0 "A Grudge in the Granary"
 war_adventurer_bugman.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the famed Dwarf brewer and ranger Josef Bugman. Quartermasters discover that Bugman's rangers emptied a grain depot serving the troops who occupied a Dwarf settlement. The raiders posted the names of missing captives on the doors. The posted list has drawn relatives of the missing prisoners to the depot, where they are questioning its surviving guards.\n\nWe could authorize our officials to buy replacement grain. The competing request is to redistribute existing supplies. The rangers' departing wagon bears the same brewery marks that first brought them into this affair."
 war_adventurer_bugman.13.option_a:0 "Rebuild the equipment"
 war_adventurer_bugman.13.option_b:0 "Abandon the operation"
 war_adventurer_bugman.13.option_c:0 "Requisition local materials"
 war_adventurer_bugman.13.t:0 "The Night of Broken Crossbows"
 war_adventurer_bugman.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the famed Dwarf brewer and ranger Josef Bugman. Our camp commander reports a night attack that freed prisoners and destroyed siege equipment.\n\nTracks suggest Bugman's rangers had watched the camp for days before striking. The damaged engines cannot be moved without replacement fittings, and the camp's remaining prisoners have already dispersed.\n\nWe could authorize our officials to rebuild the equipment. The competing request is to abandon the operation. Bugman's rangers have packed their crossbows and casks for another march."
 war_adventurer_bugman.14.option_a:0 "Refund purchasers"
 war_adventurer_bugman.14.option_b:0 "Investigate the licence"
 war_adventurer_bugman.14.t:0 "The False XXXXXX"
 war_adventurer_bugman.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the famed Dwarf brewer and ranger Josef Bugman. Our excise officer reports that Bugman exposed counterfeit ale sold under his name by a state contractor. Merchants now distrust the whole consignment, and the contractor has fled. Several innkeepers have returned unopened barrels and demand reimbursement before agreeing to stock any further government purchases.\n\nWe could authorize our officials to refund purchasers. The competing request is to investigate the licence. The brewer has left the settlement of these claims to us while his rangers follow another trail."
 war_adventurer_bugman.15.option_a:0 "Replace the cargo quietly"
 war_adventurer_bugman.15.option_b:0 "Tighten river controls"
 war_adventurer_bugman.15.option_c:0 "Deny the prisoners existed"
 war_adventurer_bugman.15.t:0 "A Delivery That Never Arrived"
 war_adventurer_bugman.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the famed Dwarf brewer and ranger Josef Bugman. A supply barge vanished near the site of a former Dwarf brewery. Survivors say Bugman spared the hired crew but took its cargo and released prisoners hidden below deck. The hired crew has handed over the convoy orders to prove that the hidden prisoners were not their own venture.\n\nWe could authorize our officials to replace the cargo quietly. The competing request is to tighten river controls. Scouts last saw the rangers moving out with their baggage and a stubborn refusal to wait for officials."
 war_adventurer_bugman.16.option_a:0 "Pay the merchants"
 war_adventurer_bugman.16.option_b:0 "Contest the contracts"
 war_adventurer_bugman.16.option_c:0 "Abandon the purchase"
 war_adventurer_bugman.16.t:0 "Ale for the Wrong Army"
 war_adventurer_bugman.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the famed Dwarf brewer and ranger Josef Bugman. Our commissary reports that Bugman intercepted a purchased ale convoy and redirected it to our local opponents. The merchants demand payment despite the loss. The merchants have produced signed receipts showing when responsibility for the convoy passed to the commissary's escort.\n\nOur officials ask us to pay the merchants. Others argue that we should instead contest the contracts. Bugman has no intention of remaining until the local accounts are balanced."
 war_adventurer_bugman.17.option_a:0 "Compensate surrounding businesses"
 war_adventurer_bugman.17.option_b:0 "Let the district absorb the damage"
 war_adventurer_bugman.17.option_c:0 "Expose and dismantle the trafficking network"
 war_adventurer_bugman.17.t:0 "The Brewer's Mark Abroad"
 war_adventurer_bugman.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the famed Dwarf brewer and ranger Josef Bugman. A provincial officer found Bugman's rangers inside a warehouse dealing in plundered Dwarf goods.\n\nThey escaped with captives and set fire to the illegally stored cargo. Neighbours are submitting fire-damage claims together with descriptions of captives led out through the warehouse's broken rear doors.\n\nOur officials ask us to compensate surrounding businesses. Others argue that we should instead let the district absorb the damage. The rangers' departing wagon bears the same brewery marks that first brought them into this affair."
 war_adventurer_bugman.18.option_a:0 "Purchase animals and equipment"
 war_adventurer_bugman.18.option_b:0 "Reduce the convoy service"
 war_adventurer_bugman.18.t:0 "The Caravan's Last Campfire"
 war_adventurer_bugman.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the famed Dwarf brewer and ranger Josef Bugman. Scouts find our raiding convoy abandoned around cold fires. Bugman's rangers freed its prisoners and removed the pack animals, leaving a grudgingly precise inventory of what they took. The inventory specifies each animal and provision sack, making the extent of the loss impossible to disguise.\n\nOur officials ask us to purchase animals and equipment. Others argue that we should instead reduce the convoy service. Bugman's rangers have packed their crossbows and casks for another march."
 war_adventurer_bugman.19.option_a:0 "Pay restitution"
 war_adventurer_bugman.19.option_b:0 "Prosecute compromised officials"
 war_adventurer_bugman.19.option_c:0 "Silence the witnesses"
 war_adventurer_bugman.19.t:0 "A Tavern Full of Witnesses"
 war_adventurer_bugman.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the famed Dwarf brewer and ranger Josef Bugman. Our governor reports that Bugman publicly identified captives from his lost community among a merchant's servants. The ensuing rescue exposed the merchant's official protection and emptied the tavern into the streets. The merchant's protection letters were read aloud before the rangers left, and several witnesses have retained copies.\n\nOur officials ask us to pay restitution. Others argue that we should instead prosecute compromised officials. The brewer has left the settlement of these claims to us while his rangers follow another trail."
 war_adventurer_bugman.20.option_a:0 "Compensate the delegation"
 war_adventurer_bugman.20.option_b:0 "Renegotiate the supply agreement"
 war_adventurer_bugman.20.option_c:0 "Abandon the ceremony"
 war_adventurer_bugman.20.t:0 "The Mountain King's Barrels"
 war_adventurer_bugman.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the famed Dwarf brewer and ranger Josef Bugman. An imported ceremonial ale shipment was destroyed after Bugman discovered that its profits supported raiders. Visiting delegates watched the dispute and now demand guarantees for their own goods. The shattered casks still stand outside the reception hall, where delegates can compare their marks with the supplier's contracts.\n\nOur officials ask us to compensate the delegation. Others argue that we should instead renegotiate the supply agreement. Scouts last saw the rangers moving out with their baggage and a stubborn refusal to wait for officials."
 war_adventurer_bugman.21.t:0 "Josef Bugman has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_bugman.21.d:0 "Travelers in [war_adventurer_arrival_province.GetName] have identified the famed Dwarf brewer and ranger Josef Bugman among a band of heavily armed Dwarf rangers. Their baggage includes casks whose markings have already attracted the attention of local brewers.\n\nBugman was a celebrated master brewer before Goblins destroyed his brewery. He and its survivors now wander in search of vengeance and missing kin, carrying what remains of his famous ale."
 war_adventurer_bardin:0 "Bardin Goreksson, Adventurer"
 desc_war_adventurer_bardin:0 "Bardin Goreksson is questioning miners and comparing battered maps in his search for the lost hold of Karak Zorn. The former Ironbreaker has an eye for weak stonework and passages a careless sentry might miss. His tunnel excursions, booming songs, and stubborn disputes over ancient Dwarf claims have become familiar local complaints."
 war_adventurer_bardin.1.option_a:0 "Reopen the refuge and rebuild its access tunnel"
 war_adventurer_bardin.1.option_b:0 "Train the rescue crews"
 war_adventurer_bardin.1.option_c:0 "Reward the workers' testimony"
 war_adventurer_bardin.1.t:0 "The Old Ironbreaker's Tunnel"
 war_adventurer_bardin.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf ranger Bardin Goreksson. Our engineer reports that Bardin recognized a failing support pattern from his Ironbreaker service and led trapped workers out.\n\nHe left a sketch of how to brace the passage before moving on. The rescued workers have reproduced Bardin's brace marks on the tunnel entrance so that a new crew can follow them.\n\nThe council proposes that we reopen the refuge and rebuild its access tunnel. A second proposal would have us train the rescue crews. The ranger has left the immediate dispute behind and returned to his unfinished quest."
 war_adventurer_bardin.2.option_a:0 "Fund a careful survey"
 war_adventurer_bardin.2.option_b:0 "Catalogue the fragments"
 war_adventurer_bardin.2.t:0 "A Map That Ends in Questions"
 war_adventurer_bardin.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf ranger Bardin Goreksson. An archivist reports that Bardin compared a supposed Karak Zorn map with old toll records and exposed a forgery. The genuine fragments still identify forgotten trading routes. The archivist has placed the forged map beside the genuine fragments, making the invented roads visible even to an untrained reader.\n\nThe council proposes that we fund a careful survey. A second proposal would have us catalogue the fragments. Bardin has taken up his pack and resumed the search that brought him through our lands."
 war_adventurer_bardin.3.option_a:0 "Honour the rescue and enlist willing survivors"
 war_adventurer_bardin.3.option_b:0 "Investigate the tunnels"
 war_adventurer_bardin.3.option_c:0 "Compensate the storekeeper and preserve the evidence"
 war_adventurer_bardin.3.t:0 "Five Voices in the Cellar"
 war_adventurer_bardin.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf ranger Bardin Goreksson. Our watch captain reports that Bardin organized a mixed band of locals against ratmen beneath a storehouse. Survivors disagree over who deserves credit, but several missing households have returned. The returned families agree that the defenders worked together, even when their accounts differ over who struck the final blow.\n\nThe council proposes that we honour the rescue and enlist willing survivors. A second proposal would have us investigate the tunnels. The ranger's last lodging contains a few chalk marks and no indication that he intends to wait for a summons."
 war_adventurer_bardin.4.option_a:0 "Purchase the prototype"
 war_adventurer_bardin.4.option_b:0 "Pay for repairs and train gunsmiths"
 war_adventurer_bardin.4.option_c:0 "Return the sketches to the guild"
 war_adventurer_bardin.4.t:0 "The Crank Gun in the Yard"
 war_adventurer_bardin.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf ranger Bardin Goreksson. A workshop master reports that Bardin's improvised gun drove off attackers during a delivery dispute. The machine jammed immediately afterward, leaving useful design sketches and an angry insurance claimant. The workshop floor is strewn with spent casings, but the intact sketches explain the mechanism more clearly than the jammed weapon itself.\n\nThe council proposes that we purchase the prototype. A second proposal would have us pay for repairs and train gunsmiths. Bardin has refused an official escort and set off along a route known better to him than to our patrols."
 war_adventurer_bardin.5.option_a:0 "Fund permanent watch stations and circulate the alarm plan"
 war_adventurer_bardin.5.option_b:0 "Reward the reeves"
 war_adventurer_bardin.5.option_c:0 "Redistribute the saved supplies"
 war_adventurer_bardin.5.t:0 "A Ranger's Warning Bells"
 war_adventurer_bardin.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf ranger Bardin Goreksson. Village reeves report that Bardin linked their watchposts after recognizing signs of a coordinated underground attack.\n\nThe first alarm allowed several settlements to evacuate their stores safely. The reeves have sent the first warning bell along with a timetable showing how quickly the alarm reached each storehouse.\n\nThe council proposes that we fund permanent watch stations and circulate the alarm plan. A second proposal would have us reward the reeves. His hosts expect the Dwarf to continue travelling before the court's decision reaches them."
 war_adventurer_bardin.6.option_a:0 "Use the mining advice"
 war_adventurer_bardin.6.option_b:0 "Preserve the inscription for scholars"
 war_adventurer_bardin.6.option_c:0 "Sponsor translation"
 war_adventurer_bardin.6.t:0 "The Stone in the Caravan"
 war_adventurer_bardin.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf ranger Bardin Goreksson. A merchant reports that Bardin identified a carved stone as a clue in his search for Karak Zorn. He traded practical mining advice for permission to copy it and left without claiming a discovery. The merchant has surrendered a rubbing of the stone and kept a second copy of Bardin's notes on draining wet mine shafts.\n\nOne course would be to use the mining advice. Alternatively, we could preserve the inscription for scholars. The ranger has left the immediate dispute behind and returned to his unfinished quest."
 war_adventurer_bardin.7.option_a:0 "Restore the refuge"
 war_adventurer_bardin.7.option_b:0 "Catalogue its fittings"
 war_adventurer_bardin.7.option_c:0 "Provision a rescue station staffed by willing recruits"
 war_adventurer_bardin.7.t:0 "A Door Made for Shorter Men"
 war_adventurer_bardin.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf ranger Bardin Goreksson. Our surveyors report that Bardin opened a forgotten Dwarf refuge beneath a foreign hill. He rescued stranded travellers and sealed a dangerous lower passage, leaving the upper chambers usable. The surveyors have marked the sealed stair in red and recorded enough intact upper rooms to shelter the next stranded party.\n\nOne course would be to restore the refuge. Alternatively, we could catalogue its fittings. Bardin has taken up his pack and resumed the search that brought him through our lands."
 war_adventurer_bardin.8.option_a:0 "Recover the duties fairly"
 war_adventurer_bardin.8.option_b:0 "Honour the rescuers"
 war_adventurer_bardin.8.t:0 "The Stranger Who Held the Stairs"
 war_adventurer_bardin.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf ranger Bardin Goreksson. A magistrate reports that Bardin held a stairwell while civilians fled a vermin-infested customs house. The rescued clerks recovered records of unpaid duties during their escape. The rescued clerks recovered the duty books before the fire reached their shelves, preserving several accounts that would otherwise have vanished.\n\nOne course would be to recover the duties fairly. Alternatively, we could honour the rescuers. The ranger's last lodging contains a few chalk marks and no indication that he intends to wait for a summons."
 war_adventurer_bardin.9.option_a:0 "Sponsor controlled trials"
 war_adventurer_bardin.9.option_b:0 "Adopt the hauling mechanism"
 war_adventurer_bardin.9.option_c:0 "Compensate the guild and publish the drawings"
 war_adventurer_bardin.9.t:0 "A Machine the Guild Never Approved"
 war_adventurer_bardin.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf ranger Bardin Goreksson. Artisans report that Bardin adapted a hand-cranked mechanism to clear a collapsed quarry route.\n\nConservative masters object to his methods, but the recovered workforce has returned safely. The workers have drawn the hauling arrangement in charcoal on the quarry wall so that their own craftsmen can reproduce it.\n\nOne course would be to sponsor controlled trials. Alternatively, we could adopt the hauling mechanism. Bardin has refused an official escort and set off along a route known better to him than to our patrols."
 war_adventurer_bardin.10.option_a:0 "Return deposits and prosecute accomplices"
 war_adventurer_bardin.10.option_b:0 "Fund a map archive"
 war_adventurer_bardin.10.option_c:0 "Retain unclaimed funds"
 war_adventurer_bardin.10.t:0 "The Lost Hold's False Heir"
 war_adventurer_bardin.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf ranger Bardin Goreksson. Our court receives evidence from Bardin that a travelling claimant sold invented rights to Karak Zorn. The claimant fled, leaving deposits and genuine geographical notes behind. The abandoned deposits remain under official seal while claimants arrive with certificates granting them imaginary estates.\n\nOne course would be to return deposits and prosecute accomplices. Alternatively, we could fund a map archive. His hosts expect the Dwarf to continue travelling before the court's decision reaches them."
 war_adventurer_bardin.11.option_a:0 "Pay engineers to secure the route"
 war_adventurer_bardin.11.option_b:0 "Close the lower barracks"
 war_adventurer_bardin.11.option_c:0 "Reorganize detention records"
 war_adventurer_bardin.11.t:0 "The Passage Beneath the Barracks"
 war_adventurer_bardin.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf ranger Bardin Goreksson. Our commandant reports that Bardin used an old Ironbreaker route to free detainees beneath the barracks. The tunnel map he left is deliberately incomplete. The prison rolls list the escaped detainees by name, while the commandant still cannot explain where the incomplete tunnel branches lead.\n\nOur advisers recommend that we pay engineers to secure the route. There is also a proposal to close the lower barracks. The ranger has left the immediate dispute behind and returned to his unfinished quest."
 war_adventurer_bardin.12.option_a:0 "Compensate the injured patrol"
 war_adventurer_bardin.12.option_b:0 "Investigate the failed operation"
 war_adventurer_bardin.12.t:0 "A False Map Turned Against Us"
 war_adventurer_bardin.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf ranger Bardin Goreksson. Our governor admits that a forged Karak Zorn map intended to lure Bardin into custody instead led our pursuit into an abandoned quarry. He escaped after exposing the scheme. The forged expedition map has been pinned outside the barracks beside copies of the orders that sent the soldiers astray.\n\nOur advisers recommend that we compensate the injured patrol. There is also a proposal to investigate the failed operation. Bardin has taken up his pack and resumed the search that brought him through our lands."
 war_adventurer_bardin.13.option_a:0 "Replace the supplies and guards"
 war_adventurer_bardin.13.option_b:0 "Sweep the district"
 war_adventurer_bardin.13.option_c:0 "Admit the post was compromised"
 war_adventurer_bardin.13.t:0 "The Cellar That Answered Back"
 war_adventurer_bardin.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf ranger Bardin Goreksson. Our occupation officer reports that Bardin organized civilians and deserters against a hidden supply post.\n\nThe attackers recovered captives, scattered the guards, and escaped through the drains. The surviving jailer can identify the emptied cells but refuses to enter the passage through which the prisoners fled.\n\nOur advisers recommend that we replace the supplies and guards. There is also a proposal to sweep the district. The ranger's last lodging contains a few chalk marks and no indication that he intends to wait for a summons."
 war_adventurer_bardin.14.option_a:0 "Rebuild the gate mechanism"
 war_adventurer_bardin.14.option_b:0 "Hold a wider perimeter"
 war_adventurer_bardin.14.option_c:0 "Abandon nearby houses for a clear field of fire"
 war_adventurer_bardin.14.t:0 "Cog Teeth in the Gatehouse"
 war_adventurer_bardin.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf ranger Bardin Goreksson. Our fortress engineer reports that Bardin used a compact experimental weapon to drive guards from a gatehouse. Escaping prisoners disabled the winch before he withdrew. The engineers have collected the stripped gear teeth, confirming that the damage was deliberate and cannot be repaired by adjustment alone.\n\nOur advisers recommend that we rebuild the gate mechanism. There is also a proposal to hold a wider perimeter. Bardin has refused an official escort and set off along a route known better to him than to our patrols."
 war_adventurer_bardin.15.option_a:0 "Repay disputed requisitions"
 war_adventurer_bardin.15.option_b:0 "Revise the patrol service"
 war_adventurer_bardin.15.option_c:0 "Dismiss the accusations"
 war_adventurer_bardin.15.t:0 "The Ranger's Empty Camp"
 war_adventurer_bardin.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf ranger Bardin Goreksson. Patrols raided Bardin's camp after he exposed their abuse of villagers. They found misleading trail signs and a ledger of requisitions already copied for local petitioners. The abandoned camp contains false route markers that sent the pursuing patrols in three different directions.\n\nOur advisers recommend that we repay disputed requisitions. There is also a proposal to revise the patrol service. His hosts expect the Dwarf to continue travelling before the court's decision reaches them."
 war_adventurer_bardin.16.option_a:0 "Pay for repairs and replacement labour"
 war_adventurer_bardin.16.option_b:0 "Abandon the galleries"
 war_adventurer_bardin.16.option_c:0 "Divert state engineers"
 war_adventurer_bardin.16.t:0 "A Mine Without Its Captives"
 war_adventurer_bardin.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf ranger Bardin Goreksson. Our overseer reports that Bardin rescued forced labourers from a failing mine and dismantled the winch to prevent pursuit. Surviving workers refuse to descend until the shaft is inspected. The overseer's surviving ledger records the skilled workers who escaped, along with the machinery they had been forced to maintain.\n\nWe could authorize our officials to pay for repairs and replacement labour. The competing request is to abandon the galleries. The ranger has left the immediate dispute behind and returned to his unfinished quest."
 war_adventurer_bardin.17.option_a:0 "Refund the buyers"
 war_adventurer_bardin.17.option_b:0 "Negotiate smaller settlements"
 war_adventurer_bardin.17.option_c:0 "Deny responsibility"
 war_adventurer_bardin.17.t:0 "The Auction of a False Kingdom"
 war_adventurer_bardin.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf ranger Bardin Goreksson. Our collector reports that Bardin exposed a state-backed sale of invented Karak Zorn claims.\n\nForeign buyers demand restitution and threaten to publish the correspondence. Several buyers have produced receipts for the false expedition, implicating officials who vouched for its supposed destination.\n\nWe could authorize our officials to refund the buyers. The competing request is to negotiate smaller settlements. Bardin has taken up his pack and resumed the search that brought him through our lands."
 war_adventurer_bardin.18.option_a:0 "Compensate the victims"
 war_adventurer_bardin.18.option_b:0 "Replace the customs staff"
 war_adventurer_bardin.18.t:0 "The Customs House Survivors"
 war_adventurer_bardin.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf ranger Bardin Goreksson. Our governor reports that Bardin led detainees out of a fortified customs house during a vermin attack. Their testimony reveals that officials had ignored warnings for months. The rescued clerks have taken their own copies of the inspection accounts, leaving the governor unable to control the testimony.\n\nWe could authorize our officials to compensate the victims. The competing request is to replace the customs staff. The ranger's last lodging contains a few chalk marks and no indication that he intends to wait for a summons."
 war_adventurer_bardin.19.option_a:0 "Buy substitute parts"
 war_adventurer_bardin.19.option_b:0 "Restart the research"
 war_adventurer_bardin.19.option_c:0 "Abandon the project publicly"
 war_adventurer_bardin.19.t:0 "The Missing Mechanism"
 war_adventurer_bardin.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf ranger Bardin Goreksson. Our arsenal officer reports that Bardin recovered stolen Dwarf components and used them to disable a pursuit squad. The experimental assembly is gone, and the remaining plans are incomplete. The arsenal crew has laid the remaining components across its workbench, unable to reconstruct the lost assembly from the surviving drawings.\n\nWe could authorize our officials to buy substitute parts. The competing request is to restart the research. Bardin has refused an official escort and set off along a route known better to him than to our patrols."
 war_adventurer_bardin.20.option_a:0 "Rebuild the passages"
 war_adventurer_bardin.20.option_b:0 "Prosecute the contractor"
 war_adventurer_bardin.20.option_c:0 "Suppress the report"
 war_adventurer_bardin.20.t:0 "An Ironbreaker's Inspection"
 war_adventurer_bardin.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf ranger Bardin Goreksson. A foreign engineer invited into our fort proved to be Bardin. Before disappearing, he released a report showing that the contractor had built unsafe escape passages for himself. The inspection report bears the signatures of officers who never noticed the concealed route beneath their own post.\n\nWe could authorize our officials to rebuild the passages. The competing request is to prosecute the contractor. His hosts expect the Dwarf to continue travelling before the court's decision reaches them."
 war_adventurer_bardin.21.t:0 "Bardin Goreksson has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_bardin.21.d:0 "Our officials in [war_adventurer_arrival_province.GetName] report the arrival of the wandering Dwarf ranger Bardin Goreksson. He has been questioning miners and studying maps of forgotten mountain roads.\n\nBardin served as an Ironbreaker at Karak Norn before taking up a ranger's wandering life. His great ambition is to find the lost hold of Karak Zorn, and few rumors of ancient Dwarf stonework escape his attention."
 war_adventurer_harald:0 "Harald Hammerstorm, Adventurer"
 desc_war_adventurer_harald:0 "Harald Hammerstorm's camp attracts northern warriors eager to test their strength beside the bearer of that terrible hammer. Tales of the dead recoiling before him have spread from the burial grounds to the barracks. His followers spend freely on weapons and drink, but every boast seems to end in a challenge."
 war_adventurer_harald.1.option_a:0 "Divide the spoils among the camps"
 war_adventurer_harald.1.option_b:0 "Claim a ruler's share"
 war_adventurer_harald.1.option_c:0 "Have the scouts teach other patrols their approach"
 war_adventurer_harald.1.t:0 "The Hammer's Trophy"
 war_adventurer_harald.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the northern Chaos champion Harald Hammerstorm. Our warband's herald reports that Harald destroyed a daemon preying on tributary camps.\n\nIts scattered followers left armour and tribute, but rival captains dispute the right to collect them. The recovered tribute includes tools taken from the camps, and their former owners have marked them before the captains divide the spoils.\n\nOur officials ask us to divide the spoils among the camps. Others argue that we should instead claim a ruler's share. Harald has moved on in search of another worthy opponent."
 war_adventurer_harald.2.option_a:0 "Confiscate dangerous relics for study"
 war_adventurer_harald.2.option_b:0 "Auction mundane treasure"
 war_adventurer_harald.2.option_c:0 "Reward the warning"
 war_adventurer_harald.2.t:0 "Vorshgar's Other Door"
 war_adventurer_harald.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the northern Chaos champion Harald Hammerstorm. Treasure-seekers return from a ruin Harald cleared after they awakened its dead. They carry surviving relics and a bitter warning against following the deeper stair. The treasure-seekers have drawn the sealed lower doorway on the back of their inventory as a warning to anyone following them.\n\nOur officials ask us to confiscate dangerous relics for study. Others argue that we should instead auction mundane treasure. The surviving scouts refuse to promise that any escort could compel the hammerer to remain."
 war_adventurer_harald.3.option_a:0 "Rebuild with the rescued households"
 war_adventurer_harald.3.option_b:0 "Honour the defenders and enlist willing survivors"
 war_adventurer_harald.3.option_c:0 "Sell surplus supplies and revise the relief registers"
 war_adventurer_harald.3.t:0 "A Night of Broken Bones"
 war_adventurer_harald.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the northern Chaos champion Harald Hammerstorm. Our camp reeve reports that Harald stood against walking dead until sunrise while families escaped. He has departed, leaving the warriors arguing over whether to rebuild or abandon the camp. The surviving families have brought their salvaged household goods to the muster ground, waiting to learn where they may rebuild.\n\nOur officials ask us to rebuild with the rescued households. Others argue that we should instead honour the defenders and enlist willing survivors. His followers are already gathering their trophies for the next march."
 war_adventurer_harald.4.option_a:0 "Clear and reopen the road"
 war_adventurer_harald.4.option_b:0 "Recover military stores"
 war_adventurer_harald.4.t:0 "The Dead That Fled"
 war_adventurer_harald.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the northern Chaos champion Harald Hammerstorm. Scouts report a fleeing column of undead after Harald struck its leader. Their abandoned baggage has blocked a road that traders can now reopen. Drivers have begun sorting usable harness from the abandoned baggage while scouts watch the road for any returning dead.\n\nOur officials ask us to clear and reopen the road. Others argue that we should instead recover military stores. Harald has shown no interest in waiting while officials settle the consequences of his passage."
 war_adventurer_harald.5.option_a:0 "Organize supervised contests"
 war_adventurer_harald.5.option_b:0 "Enlist the eager recruits"
 war_adventurer_harald.5.option_c:0 "Sponsor a victory feast"
 war_adventurer_harald.5.t:0 "A Champion's Unwanted Example"
 war_adventurer_harald.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the northern Chaos champion Harald Hammerstorm. Our captains report that Harald defeated a boasting challenger before the assembled warband.\n\nRecruits are imitating his discipline as eagerly as his reckless thirst for combat. The herald has recorded which recruits held their formation during the challenge and which merely rushed forward to see the killing.\n\nOur officials ask us to organize supervised contests. Others argue that we should instead enlist the eager recruits. The last report places the hammerer on a road leading beyond our patrols."
 war_adventurer_harald.6.option_a:0 "Restore it under our guards"
 war_adventurer_harald.6.option_b:0 "Salvage its stores"
 war_adventurer_harald.6.option_c:0 "Pay for funerary clearance"
 war_adventurer_harald.6.t:0 "The Haunted Caravanserai"
 war_adventurer_harald.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the northern Chaos champion Harald Hammerstorm. Merchants report that Harald demolished the undead guarding an abandoned caravanserai. They want it reopened but fear the warrior's returning followers more than the former ghosts. The merchants' estimates distinguish the stores that can be sold immediately from the repairs needed before caravans can stay overnight.\n\nThe council proposes that we restore it under our guards. A second proposal would have us salvage its stores. Harald has moved on in search of another worthy opponent."
 war_adventurer_harald.7.option_a:0 "Return tools to their owners"
 war_adventurer_harald.7.option_b:0 "Inspect the remains under guard"
 war_adventurer_harald.7.option_c:0 "Claim unowned tribute"
 war_adventurer_harald.7.t:0 "A Daemon's Broken Idol"
 war_adventurer_harald.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the northern Chaos champion Harald Hammerstorm. Our local governor reports that Harald shattered a daemon's material anchor during a clash outside town. The liberated workshops still contain tribute and useful tools. The workshop masters have identified their confiscated tools among the rubble surrounding the shattered idol.\n\nThe council proposes that we return tools to their owners. A second proposal would have us inspect the remains under guard. The surviving scouts refuse to promise that any escort could compel the hammerer to remain."
 war_adventurer_harald.8.option_a:0 "Permit supervised burials"
 war_adventurer_harald.8.option_b:0 "Seize the keeper's accumulated fees"
 war_adventurer_harald.8.t:0 "The Cemetery's Empty Watch"
 war_adventurer_harald.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the northern Chaos champion Harald Hammerstorm. Our magistrate reports that the graveyard's walking sentries collapsed after Harald passed through. Families are asking permission to recover remains previously held for ransom by a rogue keeper. The keeper's fee ledger names households that paid repeatedly without ever receiving permission to bury their relatives.\n\nThe council proposes that we permit supervised burials. A second proposal would have us seize the keeper's accumulated fees. His followers are already gathering their trophies for the next march."
 war_adventurer_harald.9.option_a:0 "Translate the tablets"
 war_adventurer_harald.9.option_b:0 "Have officers record and practise the cleared approach"
 war_adventurer_harald.9.option_c:0 "Charge merchants for access to the cleared outer chambers"
 war_adventurer_harald.9.t:0 "The Foreign Barrow's Warning"
 war_adventurer_harald.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the northern Chaos champion Harald Hammerstorm. Excavators report that Harald fought through a night of awakened skeletons after their survey breached a barrow.\n\nThe surviving tablets describe safer routes through neighbouring ruins. The excavators have copied the warning marks onto a plan of the outer chambers before the original tablets deteriorate further.\n\nThe council proposes that we translate the tablets. A second proposal would have us have officers record and practise the cleared approach. Harald has shown no interest in waiting while officials settle the consequences of his passage."
 war_adventurer_harald.10.option_a:0 "Return verified payments and restore the damaged waystation"
 war_adventurer_harald.10.option_b:0 "Pay and recruit a new body of road wardens"
 war_adventurer_harald.10.option_c:0 "Retain unclaimed funds"
 war_adventurer_harald.10.t:0 "A Hammer at the Toll Road"
 war_adventurer_harald.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the northern Chaos champion Harald Hammerstorm. A caravan captain reports that Harald killed a monstrous toll-collector and walked away without claiming the toll chest. Several settlements now petition over the recovered payments. Several toll receipts remain inside the chest, allowing at least some of the recovered money to be returned to its owners.\n\nThe council proposes that we return verified payments and restore the damaged waystation. A second proposal would have us pay and recruit a new body of road wardens. The last report places the hammerer on a road leading beyond our patrols."
 war_adventurer_harald.11.option_a:0 "Rebuild the guard"
 war_adventurer_harald.11.option_b:0 "Redirect other forces"
 war_adventurer_harald.11.option_c:0 "Abandon the exposed district"
 war_adventurer_harald.11.t:0 "Bones at the Northern Gate"
 war_adventurer_harald.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the northern Chaos champion Harald Hammerstorm. Our necromantic commander reports that Harald destroyed the dead guarding a northern gate. The surviving attendants fled when creatures supposedly incapable of fear turned and ran. The attendants have collected the guard's scattered weapons, but the spirits that once animated their bearers no longer answer.\n\nOne course would be to rebuild the guard. Alternatively, we could redirect other forces. Harald has moved on in search of another worthy opponent."
 war_adventurer_harald.12.option_a:0 "Replace the champion's retinue"
 war_adventurer_harald.12.option_b:0 "Reorganize the defence"
 war_adventurer_harald.12.option_c:0 "Absorb the humiliation"
 war_adventurer_harald.12.t:0 "The Shrine's Shattered Champion"
 war_adventurer_harald.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the northern Chaos champion Harald Hammerstorm. Our governor reports that Harald killed the champion defending a newly established occupation shrine. Local warriors are circulating the story as proof that our protection is hollow. The champion's shattered insignia has been carried through nearby camps by witnesses eager to describe the defeat.\n\nOne course would be to replace the champion's retinue. Alternatively, we could reorganize the defence. The surviving scouts refuse to promise that any escort could compel the hammerer to remain."
 war_adventurer_harald.13.option_a:0 "Pay a new survey team"
 war_adventurer_harald.13.option_b:0 "Seal the site permanently"
 war_adventurer_harald.13.option_c:0 "Salvage only the records"
 war_adventurer_harald.13.t:0 "The Barrow We Reopened"
 war_adventurer_harald.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the northern Chaos champion Harald Hammerstorm. Our excavators awakened an ancient garrison and then watched Harald destroy it along with their equipment.\n\nThe dig has collapsed and the survivors refuse to return. The survey stakes disappear beneath fallen stone, and the survivors cannot even recover the tools needed to reopen the entrance.\n\nOne course would be to pay a new survey team. Alternatively, we could seal the site permanently. His followers are already gathering their trophies for the next march."
 war_adventurer_harald.14.option_a:0 "Recover and replace equipment"
 war_adventurer_harald.14.option_b:0 "Discontinue patrols through the ruin"
 war_adventurer_harald.14.t:0 "The Night Watch's Last Horn"
 war_adventurer_harald.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the northern Chaos champion Harald Hammerstorm. The last survivors of our patrol report that Harald pursued them through an ancestral ruin after they tried to arrest him. Their equipment remains scattered among freshly smashed tombs. The patrol's last horn was recovered from the threshold, broken where its bearer fell during the retreat.\n\nOne course would be to recover and replace equipment. Alternatively, we could discontinue patrols through the ruin. Harald has shown no interest in waiting while officials settle the consequences of his passage."
 war_adventurer_harald.15.option_a:0 "Renegotiate the pledges"
 war_adventurer_harald.15.option_b:0 "Buy renewed loyalty"
 war_adventurer_harald.15.option_c:0 "Maintain the claim despite ridicule"
 war_adventurer_harald.15.t:0 "A Hammer Against Our Oath"
 war_adventurer_harald.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the northern Chaos champion Harald Hammerstorm. Our occupation captain reports that Harald defeated an officer who claimed the local tribes had submitted willingly. The officer survived, but the public challenge has undermined our agreements. Several tribal spokesmen now insist that their supposed pledges be read aloud and renewed before another levy is collected.\n\nOne course would be to renegotiate the pledges. Alternatively, we could buy renewed loyalty. The last report places the hammerer on a road leading beyond our patrols."
 war_adventurer_harald.16.option_a:0 "Restore the procession at expense"
 war_adventurer_harald.16.option_b:0 "Suspend ceremonies and reorganize security"
 war_adventurer_harald.16.option_c:0 "Accept the public humiliation"
 war_adventurer_harald.16.t:0 "A Procession of Empty Armour"
 war_adventurer_harald.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the northern Chaos champion Harald Hammerstorm. Our court receives a report that Harald smashed an undead ceremonial escort in full view of the population. Its attendants fled, leaving the state's sacred insignia trampled in the road. The procession's discarded standards have been recovered by street traders, who demand payment before returning them to the attendants.\n\nOur advisers recommend that we restore the procession at expense. There is also a proposal to suspend ceremonies and reorganize security. Harald has moved on in search of another worthy opponent."
 war_adventurer_harald.17.option_a:0 "Hire replacements"
 war_adventurer_harald.17.option_b:0 "Retrain the garrison"
 war_adventurer_harald.17.t:0 "The Foreign Fort's Broken Hero"
 war_adventurer_harald.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the northern Chaos champion Harald Hammerstorm. Our commander reports that Harald killed the champion stationed at an isolated fort.\n\nThe remaining soldiers abandoned their outer post rather than accept his next challenge. The fort's officers have withdrawn the outer watch to the inner gate, leaving a stretch of road unpatrolled.\n\nOur advisers recommend that we hire replacements. There is also a proposal to retrain the garrison. The surviving scouts refuse to promise that any escort could compel the hammerer to remain."
 war_adventurer_harald.18.option_a:0 "Rehouse the workers and repair the road"
 war_adventurer_harald.18.option_b:0 "Abandon the site"
 war_adventurer_harald.18.option_c:0 "Investigate the failed excavation"
 war_adventurer_harald.18.t:0 "A Tomb Opened for Tribute"
 war_adventurer_harald.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the northern Chaos champion Harald Hammerstorm. Officials excavating a tomb to collect valuables report that Harald fought its awakened defenders until both treasury chambers and survey camp were ruined. He has already left the district. The surviving excavators have submitted a list of the tools lost beneath the collapsed treasury chambers.\n\nOur advisers recommend that we rehouse the workers and repair the road. There is also a proposal to abandon the site. His followers are already gathering their trophies for the next march."
 war_adventurer_harald.19.option_a:0 "Purchase mundane guards"
 war_adventurer_harald.19.option_b:0 "Redesign the defences"
 war_adventurer_harald.19.option_c:0 "Conceal the weakness"
 war_adventurer_harald.19.t:0 "The Spirit That Could Not Return"
 war_adventurer_harald.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the northern Chaos champion Harald Hammerstorm. Our necromancer reports that a bound guardian struck by Harald cannot be summoned again. Its disappearance has exposed a route previously considered secure. The necromancer has repeated the binding three times without response and finally requests guards who can walk to their posts unaided.\n\nOur advisers recommend that we purchase mundane guards. There is also a proposal to redesign the defences. Harald has shown no interest in waiting while officials settle the consequences of his passage."
 war_adventurer_harald.20.option_a:0 "Recognize the result"
 war_adventurer_harald.20.option_b:0 "Compensate the defeated company"
 war_adventurer_harald.20.option_c:0 "Discipline the organizers"
 war_adventurer_harald.20.t:0 "The Tournament's Uninvited Guest"
 war_adventurer_harald.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the northern Chaos champion Harald Hammerstorm. Our herald reports that Harald entered a provincial martial display, defeated its champion, and escaped before the guards closed the field. Foreign observers are asking whether the result will be acknowledged. The herald's official score sheet contradicts the account already sent to the visiting observers by their own attendants.\n\nOur advisers recommend that we recognize the result. There is also a proposal to compensate the defeated company. The last report places the hammerer on a road leading beyond our patrols."
 war_adventurer_harald.21.t:0 "Harald Hammerstorm has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_harald.21.d:0 "Scouts report that the northern Chaos champion Harald Hammerstorm has arrived in [war_adventurer_arrival_province.GetName]. The warrior carries the great hammer from which his name is taken.\n\nHis reputation rests on savage feats of arms and his particular hatred of the undead. Tales of his escape from the tombs of Vorshgar claim that even the restless dead learned to fear him."
 war_adventurer_abhorash:0 "Abhorash, Adventurer"
 desc_war_adventurer_abhorash:0 "A solitary swordsman is testing the province's finest fighters with a discipline that makes their bravado look childish. Those who recognize Abhorash whisper of the vampire who overcame his thirst by drinking a dragon's blood. His example sharpens blades and drills alike, while rumors of his nature keep shutters closed after dusk."
 war_adventurer_abhorash.1.option_a:0 "Preserve his testimony alongside the old account"
 war_adventurer_abhorash.1.option_b:0 "Honour the rescued workers and rebuild their homes"
 war_adventurer_abhorash.1.option_c:0 "Quietly retain the corrections"
 war_adventurer_abhorash.1.t:0 "The Palace Steps Remember"
 war_adventurer_abhorash.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the ancient vampire swordsman Abhorash. Our custodians report that Abhorash defended workers restoring an ancient palace stair against tomb predators.\n\nHis terse corrections to their inscription contradict the official account of Lahmia's fall. The custodians have preserved the damaged inscription beside a fresh copy of the corrections dictated by their unexpected defender.\n\nWe could authorize our officials to preserve his testimony alongside the old account. The competing request is to honour the rescued workers and rebuild their homes. The swordsman left before the local officers could arrange an audience."
 war_adventurer_abhorash.2.option_a:0 "Investigate the network"
 war_adventurer_abhorash.2.option_b:0 "Accept a negotiated departure"
 war_adventurer_abhorash.2.option_c:0 "Confiscate the conspirators' funds"
 war_adventurer_abhorash.2.t:0 "The Prisoner He Would Not Yield"
 war_adventurer_abhorash.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the ancient vampire swordsman Abhorash. Our governor reports that Abhorash defeated a dangerous vampire but refused to surrender the captive to a sorcerer claiming authority over her. Their abandoned correspondence exposes a local coercion network. The abandoned letters name intermediaries who collected payments for threats the defeated vampire was supposed to enforce.\n\nWe could authorize our officials to investigate the network. The competing request is to accept a negotiated departure. No witness believes the stranger would accept confinement while the court debates his actions."
 war_adventurer_abhorash.3.option_a:0 "Fund cautious study"
 war_adventurer_abhorash.3.option_b:0 "Preserve the remains as a trophy"
 war_adventurer_abhorash.3.option_c:0 "Recruit the guides and circulate their hunting methods"
 war_adventurer_abhorash.3.t:0 "Blood Beyond Hunger"
 war_adventurer_abhorash.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the ancient vampire swordsman Abhorash. A physician brings observations left by Abhorash after he slew a dangerous scaled beast. He rejected ordinary tribute and warned against mistaking his ancient triumph over hunger for an easily repeated cure. The physician has sealed the samples separately from the hunters' trophies to discourage anyone from testing the blood on themselves.\n\nWe could authorize our officials to fund cautious study. The competing request is to preserve the remains as a trophy. Abhorash has taken no payment that could oblige him to remain in our service."
 war_adventurer_abhorash.4.option_a:0 "Repair the escape route"
 war_adventurer_abhorash.4.option_b:0 "Instruct the guard from the account"
 war_adventurer_abhorash.4.t:0 "The Last Gate of Lahmia"
 war_adventurer_abhorash.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the ancient vampire swordsman Abhorash. Our garrison commander reports that Abhorash held a breach until civilians escaped a collapsing ruin. Survivors compare the rescue with his doomed defence of ancient Lahmia. The last families escaped carrying the wounded through a passage whose entrance the defenders had believed impossible to hold.\n\nWe could authorize our officials to repair the escape route. The competing request is to instruct the guard from the account. The swordsman's hosts found his quarters empty when they returned with the governor's summons."
 war_adventurer_abhorash.5.option_a:0 "Adopt supervised training"
 war_adventurer_abhorash.5.option_b:0 "Honour restraint publicly"
 war_adventurer_abhorash.5.option_c:0 "Keep the instructions within the guard"
 war_adventurer_abhorash.5.t:0 "A Duel Without Feeding"
 war_adventurer_abhorash.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the ancient vampire swordsman Abhorash. A local champion returns defeated but alive after challenging Abhorash.\n\nThe stranger refused the customary payment and left a demanding schedule of exercises for anyone seeking another contest. The defeated champion has copied the exercises for his own officers rather than conceal the manner of his defeat.\n\nWe could authorize our officials to adopt supervised training. The competing request is to honour restraint publicly. Abhorash has refused a position at court and continued his wandering."
 war_adventurer_abhorash.6.option_a:0 "Secure and distribute the hoard"
 war_adventurer_abhorash.6.option_b:0 "Fund anatomical study"
 war_adventurer_abhorash.6.option_c:0 "Pay the guides’ settlements to rebuild their homes"
 war_adventurer_abhorash.6.t:0 "The Dragon's Empty Lair"
 war_adventurer_abhorash.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the ancient vampire swordsman Abhorash. Our scouts report that Abhorash killed a dangerous drake and departed without taking its hoard. His followers insist the deed recalls his victory over a true dragon, but cannot promise miraculous properties in the remains. The scouts have placed guards over the abandoned valuables while guides from the threatened settlements identify what was stolen from them.\n\nOur officials ask us to secure and distribute the hoard. Others argue that we should instead fund anatomical study. The swordsman left before the local officers could arrange an audience."
 war_adventurer_abhorash.7.option_a:0 "Broker a settlement from the letters"
 war_adventurer_abhorash.7.option_b:0 "Expose the coercive bargain"
 war_adventurer_abhorash.7.option_c:0 "Confiscate abandoned valuables"
 war_adventurer_abhorash.7.t:0 "A Captive Claimed by Two Courts"
 war_adventurer_abhorash.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the ancient vampire swordsman Abhorash. Our magistrate reports that Abhorash defeated a visiting vampire and prevented another sorcerer from taking custody. Their dispute spilled confidential letters into our officials' hands. Both claimants used the same local intermediaries, leaving enough correspondence to reconstruct their concealed arrangements.\n\nOur officials ask us to broker a settlement from the letters. Others argue that we should instead expose the coercive bargain. No witness believes the stranger would accept confinement while the court debates his actions."
 war_adventurer_abhorash.8.option_a:0 "Settle the survivors"
 war_adventurer_abhorash.8.option_b:0 "Recruit the rescued volunteers and circulate his defence"
 war_adventurer_abhorash.8.option_c:0 "Recover abandoned property"
 war_adventurer_abhorash.8.t:0 "The Foreign City's Stair"
 war_adventurer_abhorash.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the ancient vampire swordsman Abhorash. Refugees report that Abhorash held a palace stair while a marauding force searched for captives. He left after the evacuation, refusing an invitation to take command. The refugees have brought intact tools and household possessions through the defended stair, giving them a chance to begin again.\n\nOur officials ask us to settle the survivors. Others argue that we should instead recruit the rescued volunteers and circulate his defence. Abhorash has taken no payment that could oblige him to remain in our service."
 war_adventurer_abhorash.9.option_a:0 "Pay for the officers to teach others"
 war_adventurer_abhorash.9.option_b:0 "Preserve the account as a training text"
 war_adventurer_abhorash.9.t:0 "The Swordsman's Unpaid Lesson"
 war_adventurer_abhorash.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the ancient vampire swordsman Abhorash. Our guard captain admits that a stranger defeated his best officers, then showed them how their formation failed.\n\nWitnesses identify Abhorash, who has already continued his journey. The guard captain has marked the stranger's corrections on his formation chart and signed an account admitting his own errors.\n\nOur officials ask us to pay for the officers to teach others. Others argue that we should instead preserve the account as a training text. The swordsman's hosts found his quarters empty when they returned with the governor's summons."
 war_adventurer_abhorash.10.option_a:0 "Prosecute the fraud"
 war_adventurer_abhorash.10.option_b:0 "Refund victims from seized funds"
 war_adventurer_abhorash.10.option_c:0 "Confiscate unclaimed proceeds"
 war_adventurer_abhorash.10.t:0 "The Shrine of a False Dragon"
 war_adventurer_abhorash.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the ancient vampire swordsman Abhorash. Temple officials report that Abhorash exposed a charlatan selling a supposed cure for vampiric hunger. He destroyed the fraudulent draughts but left evidence of the sellers' wider network. Several purchasers have surrendered unopened bottles, while the temple keeps the false remedy's account books under seal.\n\nOur officials ask us to prosecute the fraud. Others argue that we should instead refund victims from seized funds. Abhorash has refused a position at court and continued his wandering."
 war_adventurer_abhorash.11.option_a:0 "Rebuild and reinforce the guard"
 war_adventurer_abhorash.11.option_b:0 "Relinquish the exposed palace quarter"
 war_adventurer_abhorash.11.option_c:0 "Suppress the growing legend"
 war_adventurer_abhorash.11.t:0 "The Steps We Could Not Hold"
 war_adventurer_abhorash.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the ancient vampire swordsman Abhorash. Our occupation commander reports that Abhorash cut through the palace guard and led captives out by an ancient stair. The attack has revived stories of Lahmia's defence among the inhabitants. The surviving guards have abandoned the lower stair, allowing local residents to carry the rescued prisoners away before reinforcements arrive.\n\nThe council proposes that we rebuild and reinforce the guard. A second proposal would have us relinquish the exposed palace quarter. The swordsman left before the local officers could arrange an audience."
 war_adventurer_abhorash.12.option_a:0 "Negotiate an end to the dispute"
 war_adventurer_abhorash.12.option_b:0 "Compensate the escort's families"
 war_adventurer_abhorash.12.t:0 "The Sorcerer's Refused Demand"
 war_adventurer_abhorash.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the ancient vampire swordsman Abhorash. Our envoy reports that Abhorash defeated our escort after it tried to seize a vampire under his protection. The prisoner escaped, and the papers authorizing the seizure are now public. Copies of the seizure order now bear witnesses' descriptions of the defeated escort beside the envoy's official seal.\n\nThe council proposes that we negotiate an end to the dispute. A second proposal would have us compensate the escort's families. No witness believes the stranger would accept confinement while the court debates his actions."
 war_adventurer_abhorash.13.option_a:0 "Import another military beast"
 war_adventurer_abhorash.13.option_b:0 "Replace its role with troops"
 war_adventurer_abhorash.13.option_c:0 "Admit the loss publicly"
 war_adventurer_abhorash.13.t:0 "An Empty Beast Pen"
 war_adventurer_abhorash.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the ancient vampire swordsman Abhorash. Our beast-master reports that Abhorash killed a prized draconic creature in single combat.\n\nHe ignored the treasury beside its pen, making the loss look like judgement rather than robbery. The surviving handlers have locked the empty pen and submitted the purchase records to demonstrate the value of the loss.\n\nThe council proposes that we import another military beast. A second proposal would have us replace its role with troops. Abhorash has taken no payment that could oblige him to remain in our service."
 war_adventurer_abhorash.14.option_a:0 "Review the disputed judgment and meet his demand"
 war_adventurer_abhorash.14.option_b:0 "Pay for a new guard establishment"
 war_adventurer_abhorash.14.option_c:0 "Reject it despite the scandal"
 war_adventurer_abhorash.14.t:0 "The Challenge on the Gate"
 war_adventurer_abhorash.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the ancient vampire swordsman Abhorash. Our governor finds the garrison champion's broken weapon hung above the city gate. Abhorash spared the defeated soldiers but left a demand that prisoners be treated honourably. Families of the released prisoners have gathered below the broken weapon, demanding that the stranger's warning be obeyed.\n\nThe council proposes that we review the disputed judgment and meet his demand. A second proposal would have us pay for a new guard establishment. The swordsman's hosts found his quarters empty when they returned with the governor's summons."
 war_adventurer_abhorash.15.option_a:0 "Repay the disputed levy"
 war_adventurer_abhorash.15.option_b:0 "Investigate the collectors"
 war_adventurer_abhorash.15.option_c:0 "Deny liability"
 war_adventurer_abhorash.15.t:0 "The Collector of Blood"
 war_adventurer_abhorash.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the ancient vampire swordsman Abhorash. Our tax officer reports that Abhorash scattered an armed collection party abusing local households. Its ledgers were left with the victims, who now demand repayment. The households have compared the seized ledgers with their own receipts, producing a list of payments they expect returned.\n\nThe council proposes that we repay the disputed levy. A second proposal would have us investigate the collectors. Abhorash has refused a position at court and continued his wandering."
 war_adventurer_abhorash.16.option_a:0 "Acknowledge the duel"
 war_adventurer_abhorash.16.option_b:0 "Fund a state funeral"
 war_adventurer_abhorash.16.option_c:0 "Challenge the testimony"
 war_adventurer_abhorash.16.t:0 "The Champion's Last Salute"
 war_adventurer_abhorash.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the ancient vampire swordsman Abhorash. Our herald reports that Abhorash killed a celebrated officer in an openly witnessed duel. The officer's companions escaped unharmed and insist that their ruler honour the result. The officer's companions have returned his broken sword and insist that no ambush or treachery caused his death.\n\nOne course would be to acknowledge the duel. Alternatively, we could fund a state funeral. The swordsman left before the local officers could arrange an audience."
 war_adventurer_abhorash.17.option_a:0 "Pay the contract"
 war_adventurer_abhorash.17.option_b:0 "Renegotiate under threat of scandal"
 war_adventurer_abhorash.17.option_c:0 "Requisition compensation from the district"
 war_adventurer_abhorash.17.t:0 "A Dragon Sold Too Soon"
 war_adventurer_abhorash.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the ancient vampire swordsman Abhorash. Our merchant-agent reports that Abhorash slew the drake bought for our army before delivery.\n\nThe contract is enforceable, and the creature's remains are worth much less than the promised weapon. The merchant has presented the signed delivery terms together with an estimate of the much smaller sum the carcass might fetch.\n\nOne course would be to pay the contract. Alternatively, we could renegotiate under threat of scandal. No witness believes the stranger would accept confinement while the court debates his actions."
 war_adventurer_abhorash.18.option_a:0 "Settle their claims"
 war_adventurer_abhorash.18.option_b:0 "Investigate the escort's secret orders"
 war_adventurer_abhorash.18.t:0 "The Fugitive He Protected"
 war_adventurer_abhorash.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the ancient vampire swordsman Abhorash. Our prison commander reports that Abhorash took a captive vampire from a sorcerer's escort after defeating its guards. Neither fugitive remains in the province, and the escort's allies demand answers. The defeated escort has returned with empty restraints and conflicting instructions from the sorcerer who claimed the captive.\n\nOne course would be to settle their claims. Alternatively, we could investigate the escort's secret orders. Abhorash has taken no payment that could oblige him to remain in our service."
 war_adventurer_abhorash.19.option_a:0 "Restore the guard's equipment and pay"
 war_adventurer_abhorash.19.option_b:0 "Abandon the outer compound"
 war_adventurer_abhorash.19.option_c:0 "Reorganize the command"
 war_adventurer_abhorash.19.t:0 "The Foreign Palace Breach"
 war_adventurer_abhorash.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the ancient vampire swordsman Abhorash. Our governor reports that Abhorash opened a route through the palace guard during a mass escape. The surviving soldiers refuse to pursue him into the ruins beyond the city. The gate's outer hinges were cut during the escape, and the quartermaster cannot secure the compound with the remaining guard.\n\nOne course would be to restore the guard's equipment and pay. Alternatively, we could abandon the outer compound. The swordsman's hosts found his quarters empty when they returned with the governor's summons."
 war_adventurer_abhorash.20.option_a:0 "Compensate those harmed by the noble"
 war_adventurer_abhorash.20.option_b:0 "Remove his office"
 war_adventurer_abhorash.20.option_c:0 "Defend him despite the disgrace"
 war_adventurer_abhorash.20.t:0 "The Trophy He Left Behind"
 war_adventurer_abhorash.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the ancient vampire swordsman Abhorash. A provincial noble presented Abhorash with captives as a reward for killing a monster. Our officials now report the captives freed and the noble publicly defeated before the entire court. The freed captives have given matching accounts of the presentation, leaving the noble unable to dismiss the humiliation as private gossip.\n\nOne course would be to compensate those harmed by the noble. Alternatively, we could remove his office. Abhorash has refused a position at court and continued his wandering."
 war_adventurer_abhorash.21.t:0 "Abhorash has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_abhorash.21.d:0 "Reports from [war_adventurer_arrival_province.GetName] describe a solitary warrior whom our informants identify as the ancient vampire swordsman Abhorash. He has shown little interest in titles or hospitality, but considerable interest in worthy opponents.\n\nHis pursuit of martial perfection inspired the Blood Dragons. It is said that he slew a dragon and drank its blood, freeing himself from the thirst that rules his kind."
 war_adventurer_elspeth:0 "Elspeth von Draken, Adventurer"
 desc_war_adventurer_elspeth:0 "Elspeth von Draken has requested old burial records and access to vaults whose seals the custodians would rather leave undisturbed. Her studies of death and forgotten relics have prompted a hurried inspection of crypt doors and neglected wards. Petitioners gather outside her lodgings, but the Amethyst wizard has little patience for officials who interrupt her work."
 war_adventurer_elspeth.1.option_a:0 "Correct the burial register and rites"
 war_adventurer_elspeth.1.option_b:0 "Commission a guarded study"
 war_adventurer_elspeth.1.option_c:0 "Honour the keeper's cooperation"
 war_adventurer_elspeth.1.t:0 "The Tower's Returned Reliquary"
 war_adventurer_elspeth.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the reclusive Amethyst wizard Elspeth von Draken. Our cemetery keeper reports that Elspeth recovered a stolen funerary relic and identified a dangerous error in its inscription.\n\nShe returned to her tower before officials could question her methods. The keeper has copied the faulty line beside Elspeth's correction so that the same mistake need not be repeated at future burials.\n\nOur advisers recommend that we correct the burial register and rites. There is also a proposal to commission a guarded study. The Amethyst visitor has closed her temporary refuge and prepared to depart."
 war_adventurer_elspeth.2.option_a:0 "Restore the waterways"
 war_adventurer_elspeth.2.option_b:0 "Study the creature safely"
 war_adventurer_elspeth.2.option_c:0 "Sell surplus baggage and equip willing patrol recruits"
 war_adventurer_elspeth.2.t:0 "Rawbones in the Reed Beds"
 war_adventurer_elspeth.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the reclusive Amethyst wizard Elspeth von Draken. Our marsh patrol brings remains of a monstrous corpse-heap destroyed by Elspeth. Witnesses compare it to Rawbones, while nearby villagers demand the blocked waterways be cleared. Reeds and broken bones have lodged around the mill sluice, while patrolmen keep curious villagers away from the largest remains.\n\nOur advisers recommend that we restore the waterways. There is also a proposal to study the creature safely. Elspeth has left a written warning in place of an audience and moved beyond the local watch."
 war_adventurer_elspeth.3.option_a:0 "Investigate the correspondents"
 war_adventurer_elspeth.3.option_b:0 "Quietly reverse the bargains"
 war_adventurer_elspeth.3.t:0 "The Lady Behind the Mirror"
 war_adventurer_elspeth.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the reclusive Amethyst wizard Elspeth von Draken. Our court clerk reports that Elspeth exposed a vampire intermediary using borrowed identities. The intruder escaped her first trap, but abandoned letters reveal a network resembling Vashara's methods. The clerk has matched several false names to gifts still held by officials who deny ever meeting the same visitor twice.\n\nOur advisers recommend that we investigate the correspondents. There is also a proposal to quietly reverse the bargains. No officer has persuaded the wizard to remain while the surviving papers are examined."
 war_adventurer_elspeth.4.option_a:0 "Review their mandate and use the evidence"
 war_adventurer_elspeth.4.option_b:0 "Broker limits on future searches"
 war_adventurer_elspeth.4.option_c:0 "Reward the useful discovery without endorsing the intrusion"
 war_adventurer_elspeth.4.t:0 "The Witch Hunters' Silence"
 war_adventurer_elspeth.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the reclusive Amethyst wizard Elspeth von Draken. Our magistrate reports that hunters who forced their way into Elspeth's refuge returned alive but unable to explain what they saw. They left recovered criminal evidence and a dispute over jurisdiction. The hunters will discuss the recovered evidence, but none will volunteer to lead another search of the refuge.\n\nOur advisers recommend that we review their mandate and use the evidence. There is also a proposal to broker limits on future searches. Elspeth has withdrawn from the officials sent to question her and will pursue her own investigations elsewhere."
 war_adventurer_elspeth.5.option_a:0 "Have officers and scholars study the ward’s preparation"
 war_adventurer_elspeth.5.option_b:0 "Fund the champion's dependants"
 war_adventurer_elspeth.5.option_c:0 "Preserve the preparation records"
 war_adventurer_elspeth.5.t:0 "The Champion's Black Talisman"
 war_adventurer_elspeth.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the reclusive Amethyst wizard Elspeth von Draken. Our military council receives a survivor's account of a warded champion who died when an enemy tried to possess his body.\n\nElspeth's talisman destroyed the intruder, leaving the council both a defence to study and a family to compensate. The champion's surviving attendant has brought the broken talisman together with the family's petition for support.\n\nOur advisers recommend that we have officers and scholars study the ward’s preparation. There is also a proposal to fund the champion's dependants. Her attendants have offered no promise that the wizard will remain within reach of our messengers."
 war_adventurer_elspeth.6.option_a:0 "Translate and publish the notes"
 war_adventurer_elspeth.6.option_b:0 "Settle ownership claims and restore the archive"
 war_adventurer_elspeth.6.option_c:0 "Keep the knowledge within the court"
 war_adventurer_elspeth.6.t:0 "A Tower in Another Language"
 war_adventurer_elspeth.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the reclusive Amethyst wizard Elspeth von Draken. Local scholars report that Elspeth opened a sealed archive and removed a lethal curse before departing with one disputed object. Her remaining notes explain several previously unreadable inscriptions. The remaining shelves contain legible catalogues, giving local scholars their first reliable guide to what the sealed archive once held.\n\nWe could authorize our officials to translate and publish the notes. The competing request is to settle ownership claims and restore the archive. The Amethyst visitor has closed her temporary refuge and prepared to depart."
 war_adventurer_elspeth.7.option_a:0 "Fund honourable burials and rebuild the survivors’ homes"
 war_adventurer_elspeth.7.option_b:0 "Recover the desecrators' property"
 war_adventurer_elspeth.7.option_c:0 "Study the binding method under guard"
 war_adventurer_elspeth.7.t:0 "The Marsh's Borrowed Dead"
 war_adventurer_elspeth.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the reclusive Amethyst wizard Elspeth von Draken. Our governor reports that Elspeth dismantled a shambling mass of stolen corpses outside a foreign burial ground. Families seek their remains while officials argue over who pays for identification. Burial attendants have separated recognizable belongings from the remains, allowing several families to identify those they lost.\n\nWe could authorize our officials to fund honourable burials and rebuild the survivors’ homes. The competing request is to recover the desecrators' property. Elspeth has left a written warning in place of an audience and moved beyond the local watch."
 war_adventurer_elspeth.8.option_a:0 "Disentangle the agreements"
 war_adventurer_elspeth.8.option_b:0 "Purify and sell the gifts"
 war_adventurer_elspeth.8.t:0 "A Diplomat with No Reflection"
 war_adventurer_elspeth.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the reclusive Amethyst wizard Elspeth von Draken. Our chamberlain receives Elspeth's evidence that a charming visitor has been enthralling officials. The visitor fled, leaving gifts that can be reclaimed once their enchantments are removed. The chamberlain has suspended the disputed agreements and placed the visitor's abandoned gifts under a guarded cover.\n\nWe could authorize our officials to disentangle the agreements. The competing request is to purify and sell the gifts. No officer has persuaded the wizard to remain while the surviving papers are examined."
 war_adventurer_elspeth.9.option_a:0 "Circulate the raiders’ plans to our patrol officers"
 war_adventurer_elspeth.9.option_b:0 "Reward rescuers and survivors"
 war_adventurer_elspeth.9.option_c:0 "Sell unclaimed military cargo"
 war_adventurer_elspeth.9.t:0 "The Dragon Above the Caravan"
 war_adventurer_elspeth.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the reclusive Amethyst wizard Elspeth von Draken. Caravan survivors report Elspeth intercepting a hostile dragon-rider before it reached their camp.\n\nHer victory was costly, but recovered baggage includes the raiders' route plans. The caravan master has marked the intercepted routes against his own schedule, revealing where further attacks had been prepared.\n\nWe could authorize our officials to circulate the raiders’ plans to our patrol officers. The competing request is to reward rescuers and survivors. Elspeth has withdrawn from the officials sent to question her and will pursue her own investigations elsewhere."
 war_adventurer_elspeth.10.option_a:0 "Approve tightly supervised safeguards"
 war_adventurer_elspeth.10.option_b:0 "Compensate those affected and close the practice"
 war_adventurer_elspeth.10.option_c:0 "Preserve the warning for magistrates"
 war_adventurer_elspeth.10.t:0 "The Possessor's Empty Vessel"
 war_adventurer_elspeth.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the reclusive Amethyst wizard Elspeth von Draken. Our physician reports that Elspeth laid a trap inside a warded body intended for possession by a hostile spirit. The trap consumed the vessel, saving the ward but leaving an ethical dispute. The physician preserved the preparation notes, but the destruction of the vessel has left witnesses demanding limits on any repetition.\n\nWe could authorize our officials to approve tightly supervised safeguards. The competing request is to compensate those affected and close the practice. Her attendants have offered no promise that the wizard will remain within reach of our messengers."
 war_adventurer_elspeth.11.option_a:0 "Replace the lost services"
 war_adventurer_elspeth.11.option_b:0 "Audit the institution"
 war_adventurer_elspeth.11.option_c:0 "Suppress the records"
 war_adventurer_elspeth.11.t:0 "The Garden Gives Up Its Prisoners"
 war_adventurer_elspeth.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the reclusive Amethyst wizard Elspeth von Draken. Our custodian reports that Elspeth entered a requisitioned mortuary and released spirits bound to official service. The records she left expose who ordered the bindings. The surviving burial records identify which offices requested the bound spirits and what services they were compelled to perform.\n\nOur officials ask us to replace the lost services. Others argue that we should instead audit the institution. The Amethyst visitor has closed her temporary refuge and prepared to depart."
 war_adventurer_elspeth.12.option_a:0 "Fund safe clearance"
 war_adventurer_elspeth.12.option_b:0 "Abandon the yard"
 war_adventurer_elspeth.12.option_c:0 "Divert specialists to rebuild the project"
 war_adventurer_elspeth.12.t:0 "The Hulk That Fell Apart"
 war_adventurer_elspeth.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the reclusive Amethyst wizard Elspeth von Draken. Our necromantic engineer reports that Elspeth destroyed a corpse-built siege creature in its assembly yard. Contaminated remains now block the workshops and frighten the labour force. The engineers have cordoned off the assembly yard after workers found contaminated matter among the tools needed for the next commission.\n\nOur officials ask us to fund safe clearance. Others argue that we should instead abandon the yard. Elspeth has left a written warning in place of an audience and moved beyond the local watch."
 war_adventurer_elspeth.13.option_a:0 "Renegotiate the agreements"
 war_adventurer_elspeth.13.option_b:0 "Buy settlements"
 war_adventurer_elspeth.13.t:0 "The Courtier's Broken Hold"
 war_adventurer_elspeth.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the reclusive Amethyst wizard Elspeth von Draken. Our governor reports that Elspeth broke a vampire agent's influence over provincial officials.\n\nSeveral agreements collapsed with the enchantment, and their beneficiaries are demanding enforcement. The officials freed from the agent's influence have begun contradicting the agreements they signed while under its power.\n\nOur officials ask us to renegotiate the agreements. Others argue that we should instead buy settlements. No officer has persuaded the wizard to remain while the surviving papers are examined."
 war_adventurer_elspeth.14.option_a:0 "Review the operation"
 war_adventurer_elspeth.14.option_b:0 "Restore the officers' standing through compensation"
 war_adventurer_elspeth.14.option_c:0 "Accept the public embarrassment"
 war_adventurer_elspeth.14.t:0 "The Tower We Could Not Search"
 war_adventurer_elspeth.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the reclusive Amethyst wizard Elspeth von Draken. Our officers return from an attempted search of Elspeth's refuge unable to describe the interior. Their prisoners escaped during the confusion, and the warrant has become an object of ridicule. The search party returned without its seized papers, and the surviving officers cannot agree on what frightened them into flight.\n\nOur officials ask us to review the operation. Others argue that we should instead restore the officers' standing through compensation. Elspeth has withdrawn from the officials sent to question her and will pursue her own investigations elsewhere."
 war_adventurer_elspeth.15.option_a:0 "Rebuild elsewhere"
 war_adventurer_elspeth.15.option_b:0 "Seal the chamber"
 war_adventurer_elspeth.15.option_c:0 "Suspend the programme and purge its records"
 war_adventurer_elspeth.15.t:0 "The Ward That Burned Its Master"
 war_adventurer_elspeth.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the reclusive Amethyst wizard Elspeth von Draken. Our court sorcerer tried to occupy a body prepared by Elspeth and triggered a hidden ward. The resulting blast destroyed the ritual chamber and much of its equipment. The demonstration's attendants have submitted incompatible accounts of the ward, leaving the ritual office unable to explain its own losses.\n\nOur officials ask us to rebuild elsewhere. Others argue that we should instead seal the chamber. Her attendants have offered no promise that the wizard will remain within reach of our messengers."
 war_adventurer_elspeth.16.option_a:0 "Cancel the display"
 war_adventurer_elspeth.16.option_b:0 "Reimburse its sponsors"
 war_adventurer_elspeth.16.option_c:0 "Investigate the acquisition"
 war_adventurer_elspeth.16.t:0 "The Collector's Missing Prize"
 war_adventurer_elspeth.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the reclusive Amethyst wizard Elspeth von Draken. Our treasury keeper reports that Elspeth removed an artefact from a foreign collection before a planned display. She left proof of its danger, but no explanation of where she took it. The keeper has marked an empty place in the display inventory while sponsors demand to know why their promised attraction has vanished.\n\nThe council proposes that we cancel the display. A second proposal would have us reimburse its sponsors. The Amethyst visitor has closed her temporary refuge and prepared to depart."
 war_adventurer_elspeth.17.option_a:0 "Pay specialist crews"
 war_adventurer_elspeth.17.option_b:0 "Abandon the trapped supplies"
 war_adventurer_elspeth.17.option_c:0 "Force clearance through nearby land"
 war_adventurer_elspeth.17.t:0 "The Mire Engine's Ruin"
 war_adventurer_elspeth.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the reclusive Amethyst wizard Elspeth von Draken. Our frontier commander reports that Elspeth shattered a corpse-powered engine on a marsh road.\n\nThe wreckage traps supply wagons, and labourers refuse to handle its remains. The trapped wagons still contain usable supplies, but their drivers refuse to cross the contaminated wreckage to recover them.\n\nThe council proposes that we pay specialist crews. A second proposal would have us abandon the trapped supplies. Elspeth has left a written warning in place of an audience and moved beyond the local watch."
 war_adventurer_elspeth.18.option_a:0 "Repair relations"
 war_adventurer_elspeth.18.option_b:0 "Compensate the offended authorities"
 war_adventurer_elspeth.18.option_c:0 "Repudiate the mission"
 war_adventurer_elspeth.18.t:0 "The Ambassador Unmasked"
 war_adventurer_elspeth.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the reclusive Amethyst wizard Elspeth von Draken. Our envoy reports that Elspeth exposed a vampire operative travelling under diplomatic protection. The operative escaped her attack, but the host's officials now hold the forged credentials. The forged credentials bear impressions of official seals, making a quiet denial increasingly difficult as copies circulate abroad.\n\nThe council proposes that we repair relations. A second proposal would have us compensate the offended authorities. No officer has persuaded the wizard to remain while the surviving papers are examined."
 war_adventurer_elspeth.19.option_a:0 "Replenish stores and defences"
 war_adventurer_elspeth.19.option_b:0 "Abandon the damaged buildings"
 war_adventurer_elspeth.19.option_c:0 "Reassign troops to replace aerial support"
 war_adventurer_elspeth.19.t:0 "A Rider Falls from the Clouds"
 war_adventurer_elspeth.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the reclusive Amethyst wizard Elspeth von Draken. Our scouts report that Elspeth defeated a dragon-mounted officer above an outlying fortress. The fallen mount destroyed storehouses before she vanished from the scene. The quartermaster has separated burned stores from salvageable equipment and warns that the fortress cannot be supplied from the wreckage alone.\n\nThe council proposes that we replenish stores and defences. A second proposal would have us abandon the damaged buildings. Elspeth has withdrawn from the officials sent to question her and will pursue her own investigations elsewhere."
 war_adventurer_elspeth.20.option_a:0 "Pay for recovery and replacements"
 war_adventurer_elspeth.20.option_b:0 "Investigate every surviving order"
 war_adventurer_elspeth.20.option_c:0 "Conceal the failure at court"
 war_adventurer_elspeth.20.t:0 "The Trap in the Captive"
 war_adventurer_elspeth.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the reclusive Amethyst wizard Elspeth von Draken. Our interrogator reports that a prisoner selected for a possession ritual carried Elspeth's concealed ward. Its activation destroyed the apparatus and scattered the officers attending the demonstration. The surviving attendants have sealed the shattered chamber, afraid that another concealed ward may remain among the prisoners' possessions.\n\nThe council proposes that we pay for recovery and replacements. A second proposal would have us investigate every surviving order. Her attendants have offered no promise that the wizard will remain within reach of our messengers."
 war_adventurer_elspeth.21.t:0 "Elspeth von Draken has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_elspeth.21.d:0 "Our officials have learned that the reclusive Amethyst wizard Elspeth von Draken is now in [war_adventurer_arrival_province.GetName]. Requests for old burial records and sealed collections of relics first drew their attention to her arrival.\n\nShe is associated with Nuln and the study of death magic. She travels in pursuit of arcane knowledge and guards her own secrets as fiercely as she seeks those of others."
 war_adventurer_wulfhart:0 "Markus Wulfhart, Adventurer"
 desc_war_adventurer_wulfhart:0 "Markus Wulfhart is buying reports of claw marks, missing livestock, and carcasses too large for any ordinary wolf to have dragged away. Hunters compete to join the Huntsmarshal's scouts, hoping to learn how he brought down the Drakwald Cyclops. His preparations fill workshops with orders for arrows and traps, while rumors of his quarry unsettle the countryside."
 war_adventurer_wulfhart.1.option_a:0 "Return supplies to the villages"
 war_adventurer_wulfhart.1.option_b:0 "Honour the hunters and recruit willing volunteers"
 war_adventurer_wulfhart.1.option_c:0 "Sell unclaimed goods"
 war_adventurer_wulfhart.1.t:0 "The Arrow in the Giant's Eye"
 war_adventurer_wulfhart.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Imperial monster hunter Markus Wulfhart. Our forester reports that Wulfhart blinded a giant threatening woodland villages and finished it on foot.\n\nThe recovered captives carry stores taken from several missing caravans. The caravan marks on the recovered sacks allow several village headmen to identify goods thought permanently lost to the creature.\n\nOne course would be to return supplies to the villages. Alternatively, we could honour the hunters and recruit willing volunteers. The last patrol to encounter the Huntsmarshal found him preparing to travel beyond our jurisdiction."
 war_adventurer_wulfhart.2.option_a:0 "Train selected scouts"
 war_adventurer_wulfhart.2.option_b:0 "Copy the notebook widely"
 war_adventurer_wulfhart.2.option_c:0 "Recognize the rescuers"
 war_adventurer_wulfhart.2.t:0 "The Emperor's Scoutbook"
 war_adventurer_wulfhart.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Imperial monster hunter Markus Wulfhart. Our captain receives a field notebook Wulfhart left after correcting a patrol's tracking errors. Several recruits have already used its methods to find missing travellers. The recruits have added their own successful search routes to the notebook's margins, showing that the methods can be taught.\n\nOne course would be to train selected scouts. Alternatively, we could copy the notebook widely. Wulfhart has entrusted the survivors to the authorities and resumed his hunt."
 war_adventurer_wulfhart.3.option_a:0 "Organize an informed watch"
 war_adventurer_wulfhart.3.option_b:0 "Shelter exposed herds"
 war_adventurer_wulfhart.3.option_c:0 "Compensate and relocate frontier families"
 war_adventurer_wulfhart.3.t:0 "Tracks from the Northern Hunt"
 war_adventurer_wulfhart.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Imperial monster hunter Markus Wulfhart. Our watch receives Wulfhart's warning that creatures resembling those he pursued in Norsca have crossed into the province. His scouts recovered abandoned livestock but did not catch their leaders. The recovered animals carry wounds unlike those left by ordinary wolves, giving the watch a practical warning of the danger.\n\nOne course would be to organize an informed watch. Alternatively, we could shelter exposed herds. Wulfhart has already taken his scouts after another dangerous trail."
 war_adventurer_wulfhart.4.option_a:0 "Support reconstruction"
 war_adventurer_wulfhart.4.option_b:0 "Enlist experienced volunteers"
 war_adventurer_wulfhart.4.option_c:0 "Honour the village and copy its evacuation arrangements"
 war_adventurer_wulfhart.4.t:0 "The Village He Would Not Leave"
 war_adventurer_wulfhart.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Imperial monster hunter Markus Wulfhart. Our governor reports that Wulfhart stayed with an exposed settlement after its paid guard withdrew. He killed the predator attacking its fields, leaving villagers willing to rebuild together. The villagers have gathered timber and surviving tools beside the damaged fields, but need official support to finish the work.\n\nOne course would be to support reconstruction. Alternatively, we could enlist experienced volunteers. The hunter left his account with the local officials rather than remain for their ceremony."
 war_adventurer_wulfhart.5.option_a:0 "Repay victims from seized funds"
 war_adventurer_wulfhart.5.option_b:0 "Reform the patrol levy"
 war_adventurer_wulfhart.5.t:0 "A Trophy with a Tax Receipt"
 war_adventurer_wulfhart.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Imperial monster hunter Markus Wulfhart. Our excise officer tried to confiscate a beast Wulfhart had slain for villagers.\n\nThe hunter departed after leaving proof that the officer had collected protection money without providing guards. The villagers' payment receipts bear the same seal as the officer's order to confiscate their hard-won trophy.\n\nOne course would be to repay victims from seized funds. Alternatively, we could reform the patrol levy. Wulfhart's camp is packed, and its scouts refuse to be detained while another quarry is loose."
 war_adventurer_wulfhart.6.option_a:0 "Fund supervised dissection"
 war_adventurer_wulfhart.6.option_b:0 "Sell safe parts through licensed merchants"
 war_adventurer_wulfhart.6.option_c:0 "Honour the guides and establish a permanent waystation"
 war_adventurer_wulfhart.6.t:0 "A Beast No Bestiary Names"
 war_adventurer_wulfhart.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Imperial monster hunter Markus Wulfhart. Our court receives a strange carcass from Wulfhart's latest hunt. Local guides say it attacked caravans, while scholars disagree over whether its valuable glands are poisonous. The guides have labelled the carcass's dangerous parts while the scholars dispute which specimens can safely be handled.\n\nOur advisers recommend that we fund supervised dissection. There is also a proposal to sell safe parts through licensed merchants. The last patrol to encounter the Huntsmarshal found him preparing to travel beyond our jurisdiction."
 war_adventurer_wulfhart.7.option_a:0 "Purchase the map"
 war_adventurer_wulfhart.7.option_b:0 "Protect the cleared route"
 war_adventurer_wulfhart.7.option_c:0 "Honour the survivors"
 war_adventurer_wulfhart.7.t:0 "The Cyclops Beyond the Desert"
 war_adventurer_wulfhart.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Imperial monster hunter Markus Wulfhart. A caravan guard reports that Wulfhart used an eye-shot and close pursuit to bring down a giant in unfamiliar terrain. The surviving guide offers a reliable map of the creature's hunting grounds. The guide's map includes water sources and resting places that were never recorded by the customs office.\n\nOur advisers recommend that we purchase the map. There is also a proposal to protect the cleared route. Wulfhart has entrusted the survivors to the authorities and resumed his hunt."
 war_adventurer_wulfhart.8.option_a:0 "Seize the stores"
 war_adventurer_wulfhart.8.option_b:0 "Dismantle the broker network"
 war_adventurer_wulfhart.8.option_c:0 "Fund a cautious follow-up"
 war_adventurer_wulfhart.8.t:0 "The Northern Beasts' Broker"
 war_adventurer_wulfhart.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Imperial monster hunter Markus Wulfhart. Our customs officers receive Wulfhart's evidence that a merchant has been supplying a monstrous northern warband. The merchant escaped, but ledgers and concealed stores remain. Several concealed crates carry the broker's private mark alongside altered declarations intended to disguise their northern destination.\n\nOur advisers recommend that we seize the stores. There is also a proposal to dismantle the broker network. Wulfhart has already taken his scouts after another dangerous trail."
 war_adventurer_wulfhart.9.option_a:0 "Reform the licence"
 war_adventurer_wulfhart.9.option_b:0 "Compensate the guild and train volunteers"
 war_adventurer_wulfhart.9.t:0 "The Local Hunters' Dispute"
 war_adventurer_wulfhart.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Imperial monster hunter Markus Wulfhart. A guild petitions after Wulfhart bypassed its exclusive hunting rights to rescue missing children.\n\nHe left a practical account of the rescue, and the families refuse to surrender the recovered goods. The families have preserved the rescue account together with the guild's unanswered demands for payment before it would send hunters.\n\nOur advisers recommend that we reform the licence. There is also a proposal to compensate the guild and train volunteers. The hunter left his account with the local officials rather than remain for their ceremony."
 war_adventurer_wulfhart.10.option_a:0 "Fund the wardens’ enclosure and restore the shrine buildings"
 war_adventurer_wulfhart.10.option_b:0 "Recruit and equip permanent shrine wardens"
 war_adventurer_wulfhart.10.option_c:0 "Record the compromise as policy"
 war_adventurer_wulfhart.10.t:0 "A Hunt That Ended at the Shrine"
 war_adventurer_wulfhart.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Imperial monster hunter Markus Wulfhart. Our magistrate reports that Wulfhart wounded a dangerous beast but stopped pursuit when it entered a locally protected refuge. He left a safe containment plan rather than force a religious confrontation. The refuge's custodians have marked safe observation points on the hunter's plan and kept visitors away from the wounded beast.\n\nOur advisers recommend that we fund the wardens’ enclosure and restore the shrine buildings. There is also a proposal to recruit and equip permanent shrine wardens. Wulfhart's camp is packed, and its scouts refuse to be detained while another quarry is loose."
 war_adventurer_wulfhart.11.option_a:0 "Repair and replace the asset"
 war_adventurer_wulfhart.11.option_b:0 "Abandon the enclosure"
 war_adventurer_wulfhart.11.option_c:0 "Substitute infantry units"
 war_adventurer_wulfhart.11.t:0 "The Beast Pen in the Forest"
 war_adventurer_wulfhart.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Imperial monster hunter Markus Wulfhart. Our military keeper reports that Wulfhart killed a giant being held for battlefield service. Freed labourers escaped with him, and the damaged pen now threatens adjoining buildings. The beast's torn harness remains attached to the damaged pen, proving that it was intended for military service rather than a harmless display.\n\nWe could authorize our officials to repair and replace the asset. The competing request is to abandon the enclosure. The last patrol to encounter the Huntsmarshal found him preparing to travel beyond our jurisdiction."
 war_adventurer_wulfhart.12.option_a:0 "Reorganize the patrol system"
 war_adventurer_wulfhart.12.option_b:0 "Compensate exposed households"
 war_adventurer_wulfhart.12.option_c:0 "Suppress their testimony"
 war_adventurer_wulfhart.12.t:0 "The Scouts Who Knew Too Much"
 war_adventurer_wulfhart.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Imperial monster hunter Markus Wulfhart. Our patrol commander reports that Wulfhart exposed the routes used to seize villagers for forced service. The hunters escaped after guiding detainees through gaps in the cordon. Copies of the exposed patrol routes have reached households whose detained relatives were never entered in the official muster.\n\nWe could authorize our officials to reorganize the patrol system. The competing request is to compensate exposed households. Wulfhart has entrusted the survivors to the authorities and resumed his hunt."
 war_adventurer_wulfhart.13.option_a:0 "Replace the shipment"
 war_adventurer_wulfhart.13.option_b:0 "Cancel the arrangement"
 war_adventurer_wulfhart.13.option_c:0 "Requisition local goods"
 war_adventurer_wulfhart.13.t:0 "Telldros' Lost Convoy"
 war_adventurer_wulfhart.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Imperial monster hunter Markus Wulfhart. Our supply officer reports that Wulfhart ambushed goods destined for a monstrous warband.\n\nHe could not catch its leaders, but destroyed the stores and released their intended captives. The burned stores still carry recognizable supply marks, leaving the quartermaster unable to deny the arrangement with the warband.\n\nWe could authorize our officials to replace the shipment. The competing request is to cancel the arrangement. Wulfhart has already taken his scouts after another dangerous trail."
 war_adventurer_wulfhart.14.option_a:0 "Negotiate a revised levy"
 war_adventurer_wulfhart.14.option_b:0 "Offer compensation"
 war_adventurer_wulfhart.14.t:0 "A Head Above the Village Gate"
 war_adventurer_wulfhart.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Imperial monster hunter Markus Wulfhart. Our governor reports that Wulfhart left the head of our appointed beast-keeper's predator above a village gate. The display has emboldened residents to refuse another levy. The beast-keeper's insignia hangs beside the severed head, turning the hunter's warning into a direct accusation against the governor.\n\nWe could authorize our officials to negotiate a revised levy. The competing request is to offer compensation. The hunter left his account with the local officials rather than remain for their ceremony."
 war_adventurer_wulfhart.15.option_a:0 "Retrain the guard"
 war_adventurer_wulfhart.15.option_b:0 "Investigate the lodge staff"
 war_adventurer_wulfhart.15.option_c:0 "Conceal the failed arrest"
 war_adventurer_wulfhart.15.t:0 "The Empty Hunting Lodge"
 war_adventurer_wulfhart.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Imperial monster hunter Markus Wulfhart. Our commissioner found Wulfhart's supposed refuge empty and the lodge's former prisoners already gone. A scout manual left behind exposes the complacency of our officers. The abandoned manual marks the blind spots in the search cordon more clearly than the commissioner's own inspection report.\n\nWe could authorize our officials to retrain the guard. The competing request is to investigate the lodge staff. Wulfhart's camp is packed, and its scouts refuse to be detained while another quarry is loose."
 war_adventurer_wulfhart.16.option_a:0 "Buy replacement forces"
 war_adventurer_wulfhart.16.option_b:0 "Pursue the handlers"
 war_adventurer_wulfhart.16.option_c:0 "Reduce the frontier commitment"
 war_adventurer_wulfhart.16.t:0 "The War Beast's Single Wound"
 war_adventurer_wulfhart.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Imperial monster hunter Markus Wulfhart. Our frontier commander reports that Wulfhart killed an imported giant with a carefully placed arrow and a finishing attack. Its handlers fled with part of the purchase money. The surviving handlers have produced conflicting receipts for the missing payment, complicating any attempt to replace the dead creature quickly.\n\nOur officials ask us to buy replacement forces. Others argue that we should instead pursue the handlers. The last patrol to encounter the Huntsmarshal found him preparing to travel beyond our jurisdiction."
 war_adventurer_wulfhart.17.option_a:0 "Refund illicit buyers quietly"
 war_adventurer_wulfhart.17.option_b:0 "Prosecute the officials"
 war_adventurer_wulfhart.17.option_c:0 "Refuse the accusations"
 war_adventurer_wulfhart.17.t:0 "The Foreign Trophy Market"
 war_adventurer_wulfhart.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Imperial monster hunter Markus Wulfhart. Our market inspector reports that Wulfhart exposed a trade in live man-eaters protected by officials.\n\nHe freed the handlers' captives and left incriminating bills of sale. The recovered bills identify the officials who approved each shipment and the pens where its intended victims were held.\n\nOur officials ask us to refund illicit buyers quietly. Others argue that we should instead prosecute the officials. Wulfhart has entrusted the survivors to the authorities and resumed his hunt."
 war_adventurer_wulfhart.18.option_a:0 "Pay the traders"
 war_adventurer_wulfhart.18.option_b:0 "Close the route and investigate"
 war_adventurer_wulfhart.18.option_c:0 "Abandon the damaged holding ground"
 war_adventurer_wulfhart.18.t:0 "The Trail Back to Norsca"
 war_adventurer_wulfhart.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Imperial monster hunter Markus Wulfhart. Our governor learns that Wulfhart traced a foreign monster shipment to brokers serving a northern warband. He burned the cages after an escape, and traders now demand compensation. The traders' claims list both the destroyed cages and the fees already paid to move their cargo through official checkpoints.\n\nOur officials ask us to pay the traders. Others argue that we should instead close the route and investigate. Wulfhart has already taken his scouts after another dangerous trail."
 war_adventurer_wulfhart.19.option_a:0 "Disavow and reorganize the patrol"
 war_adventurer_wulfhart.19.option_b:0 "Compensate victims"
 war_adventurer_wulfhart.19.t:0 "The Guide Who Changed Sides"
 war_adventurer_wulfhart.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Imperial monster hunter Markus Wulfhart. A local guide led Wulfhart to our scouts instead of the beast they claimed to be hunting. The scouts' prisoners escaped, and the guide has published their orders. The published orders identify the households the scouts were meant to seize, exposing the false pretext for their expedition.\n\nOur officials ask us to disavow and reorganize the patrol. Others argue that we should instead compensate victims. The hunter left his account with the local officials rather than remain for their ceremony."
 war_adventurer_wulfhart.20.option_a:0 "Fund relief"
 war_adventurer_wulfhart.20.option_b:0 "Remove and investigate the governor"
 war_adventurer_wulfhart.20.option_c:0 "Defend the collection"
 war_adventurer_wulfhart.20.t:0 "The Governor's Private Menagerie"
 war_adventurer_wulfhart.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Imperial monster hunter Markus Wulfhart. Our governor reports that Wulfhart entered his private menagerie after a creature escaped into town. The hunter killed the threat and departed with witnesses to the governor's negligence. Residents have brought broken doors and damaged goods to the governor's office, demanding compensation for the creature's rampage.\n\nOur officials ask us to fund relief. Others argue that we should instead remove and investigate the governor. Wulfhart's camp is packed, and its scouts refuse to be detained while another quarry is loose."
 war_adventurer_wulfhart.21.t:0 "Markus Wulfhart has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_wulfhart.21.d:0 "A report from [war_adventurer_arrival_province.GetName] places the Imperial monster hunter Markus Wulfhart in the province. He is gathering accounts of dangerous beasts and the tracks they leave behind.\n\nThe Empire's Huntsmarshal earned his reputation pursuing monsters, including the Drakwald Cyclops that destroyed his home. An expert archer and tracker, he leads scouts accustomed to following quarry that ordinary soldiers would rather avoid."
 war_adventurer_gotrek_felix:0 "Gotrek and Felix, Adventurers"
 desc_war_adventurer_gotrek_felix:0 "Gotrek and Felix are lodging in the province, where the Slayer's search for a worthy doom has led them toward suspicious cellars and heavily barred tunnels. Felix fights beside him and records their exploits, though the innkeepers seem more interested in recording the damage. They leave battered monsters, reassured survivors, and fresh tavern quarrels wherever they go."
 war_adventurer_gotrek_felix.1.option_a:0 "Review and reform the collection"
 war_adventurer_gotrek_felix.1.option_b:0 "Compensate victims from recovered fees"
 war_adventurer_gotrek_felix.1.option_c:0 "Publish a moderated account"
 war_adventurer_gotrek_felix.1.t:0 "The Window Tax Witness"
 war_adventurer_gotrek_felix.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our magistrate reports that Gotrek pulled a young protester from charging guards while Felix recorded the incident.\n\nThe pair disappeared into a tavern, leaving witnesses prepared to expose an abusive collector. Felix's witness list includes shopkeepers who saw the collector provoke the charge and guards willing to confirm their orders.\n\nThe council proposes that we review and reform the collection. A second proposal would have us compensate victims from recovered fees. Neither the Slayer nor his chronicler has agreed to stay within reach of a government escort."
 war_adventurer_gotrek_felix.2.option_a:0 "Send investigators after the evidence"
 war_adventurer_gotrek_felix.2.option_b:0 "Restore the warehouses from recovered goods"
 war_adventurer_gotrek_felix.2.option_c:0 "Honour the rescue publicly"
 war_adventurer_gotrek_felix.2.t:0 "Ratmen Beneath the Warehouses"
 war_adventurer_gotrek_felix.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our watch reports collapsed cellars, rescued townsfolk and evidence of a ratman plot uncovered by Gotrek and Felix. The pair escaped into the catacombs while officials argued over whether to acknowledge the threat. Among the rescued townsfolk are cellar workers who can identify the tunnels beneath the damaged warehouses.\n\nThe council proposes that we send investigators after the evidence. A second proposal would have us restore the warehouses from recovered goods. Gotrek refuses to wait for an audience, and Felix is gathering his papers for their next journey."
 war_adventurer_gotrek_felix.3.option_a:0 "Return identifiable goods and repair the claimants’ premises"
 war_adventurer_gotrek_felix.3.option_b:0 "Auction unclaimed treasure"
 war_adventurer_gotrek_felix.3.option_c:0 "Pay wardens to secure the pass"
 war_adventurer_gotrek_felix.3.t:0 "A Dragon's Unclaimed Hoard"
 war_adventurer_gotrek_felix.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Mountain wardens report that Gotrek and Felix killed a dragon threatening a pass. Felix left an inventory of recovered property, but several towns now claim the same treasure. The inventory separates recognizable family possessions from unmarked treasure, leaving a practical basis for settling the rival claims.\n\nThe council proposes that we return identifiable goods and repair the claimants’ premises. A second proposal would have us auction unclaimed treasure. The pair have escaped the local watch and left their witnesses to present the account."
 war_adventurer_gotrek_felix.4.option_a:0 "Fund repairs and investigate the cult’s surviving records"
 war_adventurer_gotrek_felix.4.option_b:0 "Confiscate the cult's wealth"
 war_adventurer_gotrek_felix.4.option_c:0 "Honour the local helpers and recruit willing veterans"
 war_adventurer_gotrek_felix.4.t:0 "The Blood on the Chapel Floor"
 war_adventurer_gotrek_felix.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our priest reports that Gotrek destroyed a summoned daemon while Felix led worshippers out through the crypt. The chapel is damaged, but the cult's hidden accounts survived. The surviving accounts record payments to the cult's suppliers, giving the authorities evidence beyond the blood on the chapel stones.\n\nThe council proposes that we fund repairs and investigate the cult’s surviving records. A second proposal would have us confiscate the cult's wealth. Felix's last message says that his companion will not remain while officials argue over the consequences."
 war_adventurer_gotrek_felix.5.option_a:0 "Sponsor a public archive"
 war_adventurer_gotrek_felix.5.option_b:0 "Return the heirlooms diplomatically"
 war_adventurer_gotrek_felix.5.option_c:0 "Sell a licensed edition"
 war_adventurer_gotrek_felix.5.t:0 "The Chronicle Nobody Commissioned"
 war_adventurer_gotrek_felix.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our archivist receives Felix's account of a dangerous expedition and a request to identify rescued heirlooms.\n\nGotrek refuses an audience, while merchants argue over the cost of distributing the testimony. Several of the rescued heirlooms carry names or guild marks that can still be matched to surviving records.\n\nThe council proposes that we sponsor a public archive. A second proposal would have us return the heirlooms diplomatically. The watch found their lodging empty, with the pair already following another road."
 war_adventurer_gotrek_felix.6.option_a:0 "Settle the survivors"
 war_adventurer_gotrek_felix.6.option_b:0 "Recruit veteran defenders and circulate their siege lessons"
 war_adventurer_gotrek_felix.6.option_c:0 "Fund their onward journey"
 war_adventurer_gotrek_felix.6.t:0 "The Siege Survivors' Petition"
 war_adventurer_gotrek_felix.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Refugees report that Gotrek and Felix held a street during a foreign siege long enough for families to escape. The pair have moved on, leaving survivors and captured supplies at our border office. The refugees have brought salvaged tools and captured ration sacks, giving the border office something more useful than a list of losses.\n\nOne course would be to settle the survivors. Alternatively, we could recruit veteran defenders and circulate their siege lessons. Neither the Slayer nor his chronicler has agreed to stay within reach of a government escort."
 war_adventurer_gotrek_felix.7.option_a:0 "Fit out a repair workshop and study the recovered tools"
 war_adventurer_gotrek_felix.7.option_b:0 "Buy the recovered equipment"
 war_adventurer_gotrek_felix.7.option_c:0 "Help the survivors return home"
 war_adventurer_gotrek_felix.7.t:0 "The Airship's Returned Passengers"
 war_adventurer_gotrek_felix.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. An expedition crew delivers survivors escorted from a lost hold by Gotrek and Felix. The pair travelled aboard a Dwarf airship; its captain requests a landing ground while officials inventory recovered tools. The crew has placed the recovered tools beside its damaged landing tackle while the survivors identify the families to whom they belong.\n\nOne course would be to fit out a repair workshop and study the recovered tools. Alternatively, we could buy the recovered equipment. Gotrek refuses to wait for an audience, and Felix is gathering his papers for their next journey."
 war_adventurer_gotrek_felix.8.option_a:0 "Seal and document the sanctuary"
 war_adventurer_gotrek_felix.8.option_b:0 "Return rescued property"
 war_adventurer_gotrek_felix.8.option_c:0 "Honour the guides and recruit volunteers for the local watch"
 war_adventurer_gotrek_felix.8.t:0 "A Slayer in the Summoning Pit"
 war_adventurer_gotrek_felix.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our scouts report that Gotrek killed a great daemon inside a ruined sanctuary while Felix rescued captives. The pair departed before our troops arrived, leaving a dangerous site and grateful witnesses. The guides have marked the entrance used by the rescued captives and warned soldiers away from the remaining ritual debris.\n\nOne course would be to seal and document the sanctuary. Alternatively, we could return rescued property. The pair have escaped the local watch and left their witnesses to present the account."
 war_adventurer_gotrek_felix.9.option_a:0 "Recognize the villagers' rights"
 war_adventurer_gotrek_felix.9.option_b:0 "Buy samples for scholars"
 war_adventurer_gotrek_felix.9.t:0 "The Wrong Dragon's Bones"
 war_adventurer_gotrek_felix.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our customs office receives bones from a dragon the pair slew in unfamiliar country.\n\nFelix disputes a merchant's claim to the remains and has left sworn statements from the endangered villagers. The villagers' statements identify the merchant's agents as purchasers of stolen property rather than sponsors of the hunt.\n\nOne course would be to recognize the villagers' rights. Alternatively, we could buy samples for scholars. Felix's last message says that his companion will not remain while officials argue over the consequences."
 war_adventurer_gotrek_felix.10.option_a:0 "Recover the fraudulent takings"
 war_adventurer_gotrek_felix.10.option_b:0 "Reform the guard's instructions"
 war_adventurer_gotrek_felix.10.option_c:0 "Mediate compensation"
 war_adventurer_gotrek_felix.10.t:0 "A Riot in an Unfamiliar Tongue"
 war_adventurer_gotrek_felix.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. A governor reports that Gotrek rescued Felix and several locals from a violent tax protest. Felix's translated account exposes a collector's fraud but embarrasses the town guard. Felix's translation preserves the collector's own figures, allowing the magistrates to compare the charges with the permitted levy.\n\nOne course would be to recover the fraudulent takings. Alternatively, we could reform the guard's instructions. The watch found their lodging empty, with the pair already following another road."
 war_adventurer_gotrek_felix.11.option_a:0 "Refund disputed payments"
 war_adventurer_gotrek_felix.11.option_b:0 "Investigate the escort"
 war_adventurer_gotrek_felix.11.option_c:0 "Suppress the account"
 war_adventurer_gotrek_felix.11.t:0 "The Collector's Broken Escort"
 war_adventurer_gotrek_felix.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our collector reports that Gotrek scattered his escort during a protest and Felix carried away the levy records. Witnesses are gathering around copies of the pair's accusations. The copied records bear enough matching receipts to convince households that the disputed levy can no longer be concealed.\n\nOur advisers recommend that we refund disputed payments. There is also a proposal to investigate the escort. Neither the Slayer nor his chronicler has agreed to stay within reach of a government escort."
 war_adventurer_gotrek_felix.12.option_a:0 "Rebuild the damaged district"
 war_adventurer_gotrek_felix.12.option_b:0 "Seal the lower passages"
 war_adventurer_gotrek_felix.12.option_c:0 "Reorganize security before the evidence spreads"
 war_adventurer_gotrek_felix.12.t:0 "The Catacombs' Empty Cells"
 war_adventurer_gotrek_felix.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our occupation officer reports that the pair broke into a concealed detention site while pursuing ratmen. Captives escaped, supplies burned, and Felix has taken evidence of official involvement. The survivors have carried descriptions of the hidden cells beyond the damaged quarter, linking the site to officers in public service.\n\nOur advisers recommend that we rebuild the damaged district. There is also a proposal to seal the lower passages. Gotrek refuses to wait for an audience, and Felix is gathering his papers for their next journey."
 war_adventurer_gotrek_felix.13.option_a:0 "Replace its military role"
 war_adventurer_gotrek_felix.13.option_b:0 "Divert existing troops"
 war_adventurer_gotrek_felix.13.option_c:0 "Abandon the damaged compound"
 war_adventurer_gotrek_felix.13.t:0 "The Beast We Had Purchased"
 war_adventurer_gotrek_felix.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our commander reports that Gotrek killed a dragon held for military service while Felix released its handlers' prisoners.\n\nThe pair escaped through the ruined pen. The handlers' abandoned contracts establish the dragon's intended military role and the price already paid for keeping it alive.\n\nOur advisers recommend that we replace its military role. There is also a proposal to divert existing troops. The pair have escaped the local watch and left their witnesses to present the account."
 war_adventurer_gotrek_felix.14.option_a:0 "Rebuild conventional defences"
 war_adventurer_gotrek_felix.14.option_b:0 "Close the ruined chamber"
 war_adventurer_gotrek_felix.14.option_c:0 "Investigate the failed contract"
 war_adventurer_gotrek_felix.14.t:0 "The Summoner's Last Bargain"
 war_adventurer_gotrek_felix.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our ritual officer reports that Gotrek destroyed the daemon meant to secure a local garrison. Felix led its intended offerings away, and the apparatus collapsed during the fight. The ritualists have submitted replacement estimates without explaining why the prisoners were bound beside the apparatus.\n\nOur advisers recommend that we rebuild conventional defences. There is also a proposal to close the ruined chamber. Felix's last message says that his companion will not remain while officials argue over the consequences."
 war_adventurer_gotrek_felix.15.option_a:0 "Settle the victims' claims"
 war_adventurer_gotrek_felix.15.option_b:0 "Remove implicated officials"
 war_adventurer_gotrek_felix.15.option_c:0 "Endure the circulation"
 war_adventurer_gotrek_felix.15.t:0 "The Book with Our Names in It"
 war_adventurer_gotrek_felix.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our governor reports that Felix's account of a recent clash names officers involved in extortion. Gotrek protected the first public reading, then both vanished before an arrest could be organized. Several accused officers have demanded that the book be seized, but their own subordinates have already copied the relevant passages.\n\nOur advisers recommend that we settle the victims' claims. There is also a proposal to remove implicated officials. The watch found their lodging empty, with the pair already following another road."
 war_adventurer_gotrek_felix.16.option_a:0 "Replace the stores"
 war_adventurer_gotrek_felix.16.option_b:0 "Reorganize the encirclement"
 war_adventurer_gotrek_felix.16.option_c:0 "Requisition nearby settlements"
 war_adventurer_gotrek_felix.16.t:0 "The Supply Street at the Siege"
 war_adventurer_gotrek_felix.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our commander reports that Gotrek and Felix opened an escape route through our siege camp. Refugees fled with captured supplies, and the pair disappeared amid the traffic. The raided supply tents stand beside an open lane through which the last refugees escaped before the reserve arrived.\n\nWe could authorize our officials to replace the stores. The competing request is to reorganize the encirclement. Neither the Slayer nor his chronicler has agreed to stay within reach of a government escort."
 war_adventurer_gotrek_felix.17.option_a:0 "Repair the machinery and guard"
 war_adventurer_gotrek_felix.17.option_b:0 "Abandon aerial interception"
 war_adventurer_gotrek_felix.17.option_c:0 "Conceal the loss of the heirlooms"
 war_adventurer_gotrek_felix.17.t:0 "The Airship Above the Prison"
 war_adventurer_gotrek_felix.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our governor reports that the pair evacuated captives and stolen heirlooms aboard a passing expedition airship.\n\nGround crews escaped after disabling the landing machinery used by our pursuers. The damaged machinery cannot lift another pursuit craft, while the empty heirloom cases advertise the expedition's success.\n\nWe could authorize our officials to repair the machinery and guard. The competing request is to abandon aerial interception. Gotrek refuses to wait for an audience, and Felix is gathering his papers for their next journey."
 war_adventurer_gotrek_felix.18.option_a:0 "Replace the equipment"
 war_adventurer_gotrek_felix.18.option_b:0 "Dismantle the programme"
 war_adventurer_gotrek_felix.18.option_c:0 "Leave the district to recover unaided"
 war_adventurer_gotrek_felix.18.t:0 "The Daemon's Broken Chain"
 war_adventurer_gotrek_felix.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our overseer reports that Gotrek attacked a bound daemon while Felix cut its captives free. The surviving ritualists demand compensation for equipment they abandoned during the escape. The abandoned restraints and burned records make it difficult to conceal what the daemon's attendants were demanding from the captives.\n\nWe could authorize our officials to replace the equipment. The competing request is to dismantle the programme. The pair have escaped the local watch and left their witnesses to present the account."
 war_adventurer_gotrek_felix.19.option_a:0 "Repay proven claims"
 war_adventurer_gotrek_felix.19.option_b:0 "Investigate the purchase"
 war_adventurer_gotrek_felix.19.option_c:0 "Deny the evidence"
 war_adventurer_gotrek_felix.19.t:0 "A Trophy Stolen from the Court"
 war_adventurer_gotrek_felix.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our governor displayed a dragon's hoard acquired from raiders. Gotrek and Felix identified stolen property among it, defeated the guards, and left with witnesses to the original theft. The witnesses have identified particular objects in the governor's collection, giving their accusations a precision the court cannot easily dismiss.\n\nWe could authorize our officials to repay proven claims. The competing request is to investigate the purchase. Felix's last message says that his companion will not remain while officials argue over the consequences."
 war_adventurer_gotrek_felix.20.option_a:0 "Repair the cellar and repay victims"
 war_adventurer_gotrek_felix.20.option_b:0 "Purge the compromised staff"
 war_adventurer_gotrek_felix.20.option_c:0 "Hide the scandal"
 war_adventurer_gotrek_felix.20.t:0 "The Palace's Rat-Filled Cellar"
 war_adventurer_gotrek_felix.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our chamberlain reports that the pair exposed a ratman passage beneath the provincial palace and wrecked the cellar while escaping. Their discovery also revealed secret payments made by palace staff. The broken cellar wall exposes both the ratmen's passage and the concealed shelves where the palace payments were recorded.\n\nWe could authorize our officials to repair the cellar and repay victims. The competing request is to purge the compromised staff. The watch found their lodging empty, with the pair already following another road."
 war_adventurer_gotrek_felix.21.t:0 "Gotrek and Felix have arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_gotrek_felix.21.d:0 "Our officials report that the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger have arrived in [war_adventurer_arrival_province.GetName]. Witnesses describe an orange-crested Dwarf with a formidable axe and a human carrying writing materials.\n\nGotrek Gurnisson is a Slayer seeking a death worthy of his oath. Felix Jaeger has sworn to accompany him and record that doom, fighting beside his companion through the dangers their travels uncover."
 war_adventurer_repanse:0 "Repanse de Lyonesse, Adventurer"
 desc_war_adventurer_repanse:0 "Repanse's banner has drawn pilgrims and would-be soldiers who repeat the tale of the shepherdess who rallied Bretonnia's knights and saved Couronne. Her insistence that courage matters more than birth has stirred the common folk and offended those who guard their rank. Smiths and provisioners welcome the gathering, even as local officers struggle to keep it orderly."
 war_adventurer_repanse.1.option_a:0 "Repair the chapel"
 war_adventurer_repanse.1.option_b:0 "Enlist the rallied volunteers"
 war_adventurer_repanse.1.option_c:0 "Have veterans teach the village watch"
 war_adventurer_repanse.1.t:0 "The Banner from the Chapel"
 war_adventurer_repanse.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Bretonnian holy warrior Repanse de Lyonesse. Our bailiff reports that Repanse carried an old chapel banner into a village threatened by raiders, speaking of the Lady's vision that first sent her to war.\n\nFrightened retainers rallied behind her, and the chaplain now petitions for repairs to the damaged sanctuary. The chaplain has laid the torn banner beside the repair petition, while the rallied retainers wait to learn who will lead their training.\n\nOur officials ask us to repair the chapel. Others argue that we should instead enlist the rallied volunteers. Repanse has entrusted the immediate aftermath to the local authorities and resumed her pilgrimage."
 war_adventurer_repanse.2.option_a:0 "Hear the families' claims"
 war_adventurer_repanse.2.option_b:0 "Recognize their service publicly"
 war_adventurer_repanse.2.option_c:0 "Recover the collector's illicit proceeds"
 war_adventurer_repanse.2.t:0 "The Armour in the Hayloft"
 war_adventurer_repanse.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Bretonnian holy warrior Repanse de Lyonesse. Our steward reports that Repanse recovered a dead knight's armour from a corrupt collector and gave it to the family he had defended. Her account of her own humble calling has drawn witnesses to other abuses. The rescued family's claim has drawn other households to the steward, each carrying receipts for possessions seized by the same collector.\n\nOur officials ask us to hear the families' claims. Others argue that we should instead recognize their service publicly. Her companions are preparing to travel, and she has declined any office that would require her to remain."
 war_adventurer_repanse.3.option_a:0 "Restore the relief route"
 war_adventurer_repanse.3.option_b:0 "Honour the escort and enlist willing volunteers"
 war_adventurer_repanse.3.option_c:0 "Study the breakthrough"
 war_adventurer_repanse.3.t:0 "The Road to Couronne"
 war_adventurer_repanse.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Bretonnian holy warrior Repanse de Lyonesse. Our marshal reports that Repanse broke a raiding force blocking a relief road, cutting down its champion before the convoy arrived. Veterans compare the rescue to Couronne, and several isolated settlements can now be supplied. The convoy's drivers have unloaded their relief stores at the first reopened settlement and marked the remaining obstructions on a road plan.\n\nOur officials ask us to restore the relief route. Others argue that we should instead honour the escort and enlist willing volunteers. The last messenger found Repanse leaving under her banner rather than waiting for another audience."
 war_adventurer_repanse.4.option_a:0 "Publicly confirm the mediated settlement"
 war_adventurer_repanse.4.option_b:0 "Preserve her testimony in the court record"
 war_adventurer_repanse.4.option_c:0 "Recognize both villages' cooperation"
 war_adventurer_repanse.4.t:0 "The Duchess Who Would Not Stay"
 war_adventurer_repanse.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Bretonnian holy warrior Repanse de Lyonesse. Our seneschal reports that villagers asked Repanse to judge a dispute under the authority of her ancient dukedom. She settled the immediate violence but referred the lasting decision to our court and departed. Representatives of both villages have signed the temporary settlement, leaving the court an agreement it can confirm without reviving the fighting.\n\nOur officials ask us to publicly confirm the mediated settlement. Others argue that we should instead preserve her testimony in the court record. Repanse claims no right to govern this province and will continue beyond its borders."
 war_adventurer_repanse.5.option_a:0 "Acknowledge the rescue"
 war_adventurer_repanse.5.option_b:0 "Fund military instruction for the volunteer"
 war_adventurer_repanse.5.option_c:0 "Teach the deed as a military lesson without altering rank"
 war_adventurer_repanse.5.t:0 "A Knight's Name on the Roll"
 war_adventurer_repanse.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Bretonnian holy warrior Repanse de Lyonesse. Our herald reports that Repanse insisted a lowborn rescuer be recorded beside the knights he saved.\n\nShe invoked her own knighthood under Louis the Young, leaving our officials to resolve the offended nobles' petitions. The rescued knights agree about the volunteer's deed, although several object to seeing his name entered on the same page as theirs.\n\nOur officials ask us to acknowledge the rescue. Others argue that we should instead fund military instruction for the volunteer. The Damoiselle has left a petition in place of a demand for permanent command."
 war_adventurer_repanse.6.option_a:0 "Settle the willing families"
 war_adventurer_repanse.6.option_b:0 "Reunite them with their communities"
 war_adventurer_repanse.6.option_c:0 "Employ willing adults on public repairs"
 war_adventurer_repanse.6.t:0 "The Foreign Chapel's Refugees"
 war_adventurer_repanse.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Bretonnian holy warrior Repanse de Lyonesse. Our governor reports that Repanse escorted captives out of a raiders' camp and sheltered them in a local sanctuary. Its unfamiliar priesthood has requested our help feeding the rescued families. The sanctuary's custodians have counted the rescued families and set aside a yard where donated provisions can be distributed.\n\nThe council proposes that we settle the willing families. A second proposal would have us reunite them with their communities. Repanse has entrusted the immediate aftermath to the local authorities and resumed her pilgrimage."
 war_adventurer_repanse.7.option_a:0 "Adopt the useful signals"
 war_adventurer_repanse.7.option_b:0 "Have the returning soldiers retrain their comrades"
 war_adventurer_repanse.7.option_c:0 "Display the captured standards"
 war_adventurer_repanse.7.t:0 "The Banner Nobody Recognized"
 war_adventurer_repanse.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Bretonnian holy warrior Repanse de Lyonesse. Our border commander reports that soldiers who could not understand Repanse's words followed her banner through a broken enemy line. Survivors have returned with a practical account of her signals and formations. The soldiers have reproduced the banner signals with scraps of coloured cloth, demonstrating the orders even without an interpreter.\n\nThe council proposes that we adopt the useful signals. A second proposal would have us have the returning soldiers retrain their comrades. Her companions are preparing to travel, and she has declined any office that would require her to remain."
 war_adventurer_repanse.8.option_a:0 "Distribute the food"
 war_adventurer_repanse.8.option_b:0 "Provision the garrison"
 war_adventurer_repanse.8.option_c:0 "Sell surplus stores and retain the proceeds after repairs"
 war_adventurer_repanse.8.t:0 "The Champion at the Water Gate"
 war_adventurer_repanse.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Bretonnian holy warrior Repanse de Lyonesse. Our governor reports that Repanse slew the champion holding a town's water gate and opened it for a relief convoy. Her companions have gone on, leaving captured supplies and competing petitions for their distribution. The recovered wagons contain food intended for the besiegers, now urgently requested by both the relieved households and their exhausted guards.\n\nThe council proposes that we distribute the food. A second proposal would have us provision the garrison. The last messenger found Repanse leaving under her banner rather than waiting for another audience."
 war_adventurer_repanse.9.option_a:0 "Prosecute the forgeries"
 war_adventurer_repanse.9.option_b:0 "Recover fraudulent fees"
 war_adventurer_repanse.9.option_c:0 "Publish her testimony"
 war_adventurer_repanse.9.t:0 "A Title That Buys No Passage"
 war_adventurer_repanse.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Bretonnian holy warrior Repanse de Lyonesse. Our customs judge reports that Repanse refused a merchant's attempt to purchase privileges in her name as Duchess of Lyonesse.\n\nShe left evidence of his forged letters, but claimed no authority over our officials. The customs judge has compared the merchant's letters with authentic seals and identified the fees collected under their protection.\n\nThe council proposes that we prosecute the forgeries. A second proposal would have us recover fraudulent fees. Repanse claims no right to govern this province and will continue beyond its borders."
 war_adventurer_repanse.10.option_a:0 "Accept the patrol instruction"
 war_adventurer_repanse.10.option_b:0 "Return the heirlooms with an official escort"
 war_adventurer_repanse.10.option_c:0 "Keep the reopened road supplied"
 war_adventurer_repanse.10.t:0 "The Fallen Knight's Foreign Grave"
 war_adventurer_repanse.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Bretonnian holy warrior Repanse de Lyonesse. Our magistrate reports that Repanse recovered a traveller's armour from bandits and arranged his burial according to the family's wishes. The rescued retainers offer to teach our patrols what they learned during the pursuit. The retainers have brought the recovered armour and a route sketch showing the bandits' concealed approach to the road.\n\nThe council proposes that we accept the patrol instruction. A second proposal would have us return the heirlooms with an official escort. The Damoiselle has left a petition in place of a demand for permanent command."
 war_adventurer_repanse.11.option_a:0 "Rebuild the cordon"
 war_adventurer_repanse.11.option_b:0 "Negotiate the detainees' settlement"
 war_adventurer_repanse.11.option_c:0 "Order a search that finds only abandoned camps"
 war_adventurer_repanse.11.t:0 "The Chapel We Had Sealed"
 war_adventurer_repanse.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Bretonnian holy warrior Repanse de Lyonesse. Our governor reports that Repanse broke the seal on a confiscated chapel, raised its banner, and escorted detained villagers out through the guard cordon. Her followers have dispersed among sympathetic households. The broken seals have been displayed beside the chapel steps, where villagers are gathering to identify the released detainees.\n\nOne course would be to rebuild the cordon. Alternatively, we could negotiate the detainees' settlement. Repanse has entrusted the immediate aftermath to the local authorities and resumed her pilgrimage."
 war_adventurer_repanse.12.option_a:0 "Replace the lost stores and equipment"
 war_adventurer_repanse.12.option_b:0 "Reorganize the blockade"
 war_adventurer_repanse.12.option_c:0 "Abandon damaged forward positions"
 war_adventurer_repanse.12.t:0 "The Relief Column We Missed"
 war_adventurer_repanse.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Bretonnian holy warrior Repanse de Lyonesse. Our siege commander reports that Repanse killed his champion and forced a supply convoy through the blockade. Occupied villages are now openly repeating the story of Couronne. The convoy's passage exposed a gap in the blockade that local guides are now using to carry messages between the occupied villages.\n\nOne course would be to replace the lost stores and equipment. Alternatively, we could reorganize the blockade. Her companions are preparing to travel, and she has declined any office that would require her to remain."
 war_adventurer_repanse.13.option_a:0 "Refund the disputed levy"
 war_adventurer_repanse.13.option_b:0 "Investigate the officials responsible"
 war_adventurer_repanse.13.option_c:0 "Enforce collection despite the evidence"
 war_adventurer_repanse.13.t:0 "The Duke's Old Seal"
 war_adventurer_repanse.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Bretonnian holy warrior Repanse de Lyonesse. Our tax officer reports that Repanse exposed forged orders bearing the seal of her former dukedom.\n\nVillagers have withheld the disputed payments and circulated copies of her declaration. The disputed orders remain posted in several settlements, but now carry handwritten copies of Repanse's accusation beneath their seals.\n\nOne course would be to refund the disputed levy. Alternatively, we could investigate the officials responsible. The last messenger found Repanse leaving under her banner rather than waiting for another audience."
 war_adventurer_repanse.14.option_a:0 "Offer an amnesty and buy back the arms"
 war_adventurer_repanse.14.option_b:0 "Contain the holdouts"
 war_adventurer_repanse.14.option_c:0 "Withdraw exposed collection teams"
 war_adventurer_repanse.14.t:0 "Peasants Beneath the Banner"
 war_adventurer_repanse.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Bretonnian holy warrior Repanse de Lyonesse. Our marshal reports that Repanse armed villagers from a captured depot and led them out of the district. A small band remains behind to resist our collectors, while she has already escaped pursuit. The remaining holdouts have kept enough captured weapons to threaten another collection party unless the government settles or suppresses them.\n\nOne course would be to offer an amnesty and buy back the arms. Alternatively, we could contain the holdouts. Repanse claims no right to govern this province and will continue beyond its borders."
 war_adventurer_repanse.15.option_a:0 "Compensate the defeated escort"
 war_adventurer_repanse.15.option_b:0 "Revise the disputed judgment"
 war_adventurer_repanse.15.option_c:0 "Uphold the sentence in her absence"
 war_adventurer_repanse.15.t:0 "A Knighthood Denied"
 war_adventurer_repanse.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Bretonnian holy warrior Repanse de Lyonesse. Our herald reports that Repanse publicly defended a prisoner condemned for claiming a knight's honours. She broke the escort, took the prisoner away, and invoked her own elevation by Louis the Young before a large crowd. The herald's written judgment has become a public embarrassment now that witnesses can repeat Repanse's answer almost word for word.\n\nOne course would be to compensate the defeated escort. Alternatively, we could revise the disputed judgment. The Damoiselle has left a petition in place of a demand for permanent command."
 war_adventurer_repanse.16.option_a:0 "Rebuild and audit the camp"
 war_adventurer_repanse.16.option_b:0 "Reconstruct the missing records"
 war_adventurer_repanse.16.option_c:0 "Leave the ruined site abandoned"
 war_adventurer_repanse.16.t:0 "The Camp with Open Gates"
 war_adventurer_repanse.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Bretonnian holy warrior Repanse de Lyonesse. Our overseer reports that Repanse broke into a labour camp and led its captives away beneath her banner. The gatehouse and the records of the camp's contracts were destroyed in the fighting. Fragments of the burned contracts have been recovered from the gatehouse, leaving creditors unable to prove all the claims they still demand.\n\nOur advisers recommend that we rebuild and audit the camp. There is also a proposal to reconstruct the missing records. Repanse has entrusted the immediate aftermath to the local authorities and resumed her pilgrimage."
 war_adventurer_repanse.17.option_a:0 "Compensate the guards and custodians"
 war_adventurer_repanse.17.option_b:0 "Investigate the original plunder"
 war_adventurer_repanse.17.option_c:0 "Dismiss the incident publicly"
 war_adventurer_repanse.17.t:0 "The Shrine's Broken Trophy"
 war_adventurer_repanse.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Bretonnian holy warrior Repanse de Lyonesse. Our governor reports that Repanse destroyed a trophy taken from a plundered sanctuary and returned its fragments to local custodians.\n\nOur guards were disarmed before they could stop her. The custodians have laid out the returned fragments and invited witnesses to identify who brought the original trophy into the governor's possession.\n\nOur advisers recommend that we compensate the guards and custodians. There is also a proposal to investigate the original plunder. Her companions are preparing to travel, and she has declined any office that would require her to remain."
 war_adventurer_repanse.18.option_a:0 "Replace the damaged occupation force"
 war_adventurer_repanse.18.option_b:0 "Review its command"
 war_adventurer_repanse.18.option_c:0 "Try to contain the testimony"
 war_adventurer_repanse.18.t:0 "A Couronne in Foreign Soil"
 war_adventurer_repanse.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Bretonnian holy warrior Repanse de Lyonesse. Our field officer reports that Repanse cut down the champion enforcing our occupation and opened a passage for refugees. Their departure has carried accounts of the garrison's abuses beyond the frontier. The surviving occupation officers disagree over the champion's orders, but none denies that the refugees escaped through his abandoned position.\n\nOur advisers recommend that we replace the damaged occupation force. There is also a proposal to review its command. The last messenger found Repanse leaving under her banner rather than waiting for another audience."
 war_adventurer_repanse.19.option_a:0 "Compensate those harmed by the contracts"
 war_adventurer_repanse.19.option_b:0 "Purge the compromised registry"
 war_adventurer_repanse.19.option_c:0 "Defend the officials' conduct"
 war_adventurer_repanse.19.t:0 "The Knight's Stolen Name"
 war_adventurer_repanse.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Bretonnian holy warrior Repanse de Lyonesse. Our customs office reports that Repanse exposed a slave broker using her name and supposed ducal protection. She freed his prisoners before the watch arrived, leaving our officials implicated by their signatures. The broker's ledgers carry official endorsements beside promises of ducal protection that Repanse has publicly repudiated.\n\nOur advisers recommend that we compensate those harmed by the contracts. There is also a proposal to purge the compromised registry. Repanse claims no right to govern this province and will continue beyond its borders."
 war_adventurer_repanse.20.option_a:0 "Replace the weapons before rumours spread"
 war_adventurer_repanse.20.option_b:0 "Discipline the officer"
 war_adventurer_repanse.20.option_c:0 "Let the humiliation pass"
 war_adventurer_repanse.20.t:0 "The Banner Beyond the Frontier"
 war_adventurer_repanse.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Bretonnian holy warrior Repanse de Lyonesse. Our commander reports that Repanse scattered a patrol holding a group of pilgrims and escorted them toward a foreign border. She left the patrol's weapons stacked around its officer's broken standard. The disarmed patrol has returned with its recovered weapons and a standard too damaged to display without revealing the defeat.\n\nOur advisers recommend that we replace the weapons before rumours spread. There is also a proposal to discipline the officer. The Damoiselle has left a petition in place of a demand for permanent command."
 war_adventurer_repanse.21.t:0 "Repanse de Lyonesse has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_repanse.21.d:0 "Word from [war_adventurer_arrival_province.GetName] announces the arrival of the Bretonnian holy warrior Repanse de Lyonesse. Her banner has been recognized by travelers familiar with Bretonnian tales.\n\nOnce a shepherdess, Repanse answered the Lady's call, rallied defeated knights, and broke the siege of Couronne. Preserved by the Lady's grace, she now travels as a champion of her faith rather than ruling from a ducal court."
 war_adventurer_sienna:0 "Sienna Fuegonasus, Adventurer"
 desc_war_adventurer_sienna:0 "Sienna Fuegonasus has been coaxing extraordinary heat from local furnaces, to the delight of craftsmen and the alarm of their neighbors. The Bright Wizard's fascination with Aqshy runs far beyond the patient routines her former tutors would prefer. Orders for metalwork are rising, but so are complaints about sparks, scorched roofs, and laughter from the workshop after midnight."
 war_adventurer_sienna.1.option_a:0 "Copy the corrected design"
 war_adventurer_sienna.1.option_b:0 "Fund its use in a workshop"
 war_adventurer_sienna.1.option_c:0 "Recognize the guild's safer practice"
 war_adventurer_sienna.1.t:0 "Thyrus's Marginal Notes"
 war_adventurer_sienna.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering human fire wizard Sienna Fuegonasus. Our guild reports that Sienna corrected a dangerous furnace design using lessons she attributes to Thyrus Gormann.\n\nShe quarrelled with its masters over supervision and left before the successful test was complete. The guild's apprentices have copied the corrected air channels before the offended masters can order the chalk marks scrubbed away.\n\nWe could authorize our officials to copy the corrected design. The competing request is to fund its use in a workshop. The Bright Wizard's temporary hearth is cold, and her travelling things are gone."
 war_adventurer_sienna.2.option_a:0 "Pardon the incident and support the survivors"
 war_adventurer_sienna.2.option_b:0 "Train the watch from their account"
 war_adventurer_sienna.2.option_c:0 "Use recovered supplies to rebuild the cellar"
 war_adventurer_sienna.2.t:0 "The Prisoner's Burning Rescue"
 war_adventurer_sienna.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering human fire wizard Sienna Fuegonasus. Our watch captain reports that Sienna, being escorted for questioning, broke her restraints when attackers trapped civilians in a cellar. She burned through the obstruction and helped the escort escape, then disappeared herself. The surviving escort has submitted statements confirming that its own guards would have died had the prisoner remained chained.\n\nWe could authorize our officials to pardon the incident and support the survivors. The competing request is to train the watch from their account. Sienna has made it clear that she will not remain under a local magistrate's supervision."
 war_adventurer_sienna.3.option_a:0 "Release the grain to the district"
 war_adventurer_sienna.3.option_b:0 "Retain a reserve for the garrison"
 war_adventurer_sienna.3.option_c:0 "Investigate how the infestation began"
 war_adventurer_sienna.3.t:0 "The Fire in the Grain Store"
 war_adventurer_sienna.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering human fire wizard Sienna Fuegonasus. Our magistrate reports that Sienna burned an infested store before its vermin could reach the public granary. Watchmen who tried to arrest her instead helped pull workers clear; the saved grain is now under official seal. The sealed grain is sound, but officials must decide whether it belongs in the public stores or should be issued immediately.\n\nWe could authorize our officials to release the grain to the district. The competing request is to retain a reserve for the garrison. The last witness saw her taking the road before the watch could assemble another escort."
 war_adventurer_sienna.4.option_a:0 "Examine the surviving evidence"
 war_adventurer_sienna.4.option_b:0 "Correct the mistaken accusation"
 war_adventurer_sienna.4.option_c:0 "Pay for honourable burials and publicly clear her name"
 war_adventurer_sienna.4.t:0 "The Sister in the Testimony"
 war_adventurer_sienna.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering human fire wizard Sienna Fuegonasus. Our investigator receives conflicting descriptions of a woman resembling Sienna near disturbed graves. Sienna has burned a necromantic cache and left a warning naming her twin Sofia. The surviving labels distinguish the seized reagents from an ordinary healer's supplies, giving the investigator evidence beyond the witnesses' confusion.\n\nWe could authorize our officials to examine the surviving evidence. The competing request is to correct the mistaken accusation. Her hosts have received no promise that the wandering wizard will return to answer the remaining accusations."
 war_adventurer_sienna.5.option_a:0 "Buy the apprentices' notes"
 war_adventurer_sienna.5.option_b:0 "Install the finished casting in public works"
 war_adventurer_sienna.5.option_c:0 "Sell the casting and retain the balance after repairs"
 war_adventurer_sienna.5.t:0 "The Workshop's Unwelcome Miracle"
 war_adventurer_sienna.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering human fire wizard Sienna Fuegonasus. Our smiths petition after Sienna used Aqshy to finish a difficult casting, cracked the roof tiles, and walked out during the ensuing argument.\n\nThe casting survived and the apprentices recorded the process. The apprentices have placed the successful casting beside the broken tiles so that the magistrate can see both the benefit and the damage.\n\nWe could authorize our officials to buy the apprentices' notes. The competing request is to install the finished casting in public works. Sienna has slipped away before the authorities can turn their questions into another detention."
 war_adventurer_sienna.6.option_a:0 "Translate and circulate the diagrams"
 war_adventurer_sienna.6.option_b:0 "Support a safer furnace"
 war_adventurer_sienna.6.option_c:0 "Buy the trial output to equip new recruits"
 war_adventurer_sienna.6.t:0 "A Furnace with No Shared Language"
 war_adventurer_sienna.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering human fire wizard Sienna Fuegonasus. Our provincial engineer reports that Sienna and local smiths overcame a language barrier by drawing furnace diagrams in soot. The trial produced useful metal, although its heat drove officials out of the building. The diagrams explain the trial clearly enough for the smiths to repeat it with better shielding and a controlled supply of fuel.\n\nOur officials ask us to translate and circulate the diagrams. Others argue that we should instead support a safer furnace. The Bright Wizard's temporary hearth is cold, and her travelling things are gone."
 war_adventurer_sienna.7.option_a:0 "Return the cargo and recognize the guards"
 war_adventurer_sienna.7.option_b:0 "Use unclaimed stores for relief"
 war_adventurer_sienna.7.option_c:0 "Teach the guards’ ambush account to the army"
 war_adventurer_sienna.7.t:0 "The Captive Who Cleared the Road"
 war_adventurer_sienna.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering human fire wizard Sienna Fuegonasus. Our governor reports that Sienna was detained for carrying unfamiliar magical tools, then rescued the same guards when raiders attacked their convoy. Survivors returned with recovered cargo and a request to clear her name. The convoy's guards have returned Sienna's confiscated tools to the magistrate together with their request that the detention be reconsidered.\n\nOur officials ask us to return the cargo and recognize the guards. Others argue that we should instead use unclaimed stores for relief. Sienna has made it clear that she will not remain under a local magistrate's supervision."
 war_adventurer_sienna.8.option_a:0 "Preserve samples from the unburned crates"
 war_adventurer_sienna.8.option_b:0 "Publish corrected witness statements"
 war_adventurer_sienna.8.option_c:0 "Return the stolen goods at a public hearing"
 war_adventurer_sienna.8.t:0 "The Foreign Pyre"
 war_adventurer_sienna.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering human fire wizard Sienna Fuegonasus. Our harbour magistrate reports that Sienna burned a concealed shipment of corpse-raising reagents. Her warning mentions Sofia, but local witnesses had mistaken the two women for one person. The customs office has retained unburned labels and cargo seals, allowing investigators to follow the shipment beyond the harbour.\n\nOur officials ask us to preserve samples from the unburned crates. Others argue that we should instead publish corrected witness statements. The last witness saw her taking the road before the watch could assemble another escort."
 war_adventurer_sienna.9.option_a:0 "Offer temporary homes"
 war_adventurer_sienna.9.option_b:0 "Hire willing survivors as scouts"
 war_adventurer_sienna.9.option_c:0 "Record the defence for officers"
 war_adventurer_sienna.9.t:0 "The Bridge of Sparks"
 war_adventurer_sienna.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering human fire wizard Sienna Fuegonasus. Our commander reports that Sienna held a narrow bridge with fire while a mixed group of travellers brought civilians to safety.\n\nThe strangers have separated, leaving our officials to house the rescued families. The rescued travellers have assembled their surviving possessions in the customs yard while officers record how the bridge defence held.\n\nOur officials ask us to offer temporary homes. Others argue that we should instead hire willing survivors as scouts. Her hosts have received no promise that the wandering wizard will return to answer the remaining accusations."
 war_adventurer_sienna.10.option_a:0 "Trace the courier"
 war_adventurer_sienna.10.option_b:0 "Study the seal safely"
 war_adventurer_sienna.10.option_c:0 "Expose the traffickers to their victims"
 war_adventurer_sienna.10.t:0 "The Invitation She Burned"
 war_adventurer_sienna.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering human fire wizard Sienna Fuegonasus. Our customs officer reports that Sienna destroyed a letter offering forbidden instruction in exchange for stolen bodies. She left its seal and a sketch of the courier, warning that the invitation was meant to exploit her family's history. The preserved seal matches marks on several recently seized consignments whose contents were disguised as ordinary funerary supplies.\n\nOur officials ask us to trace the courier. Others argue that we should instead study the seal safely. Sienna has slipped away before the authorities can turn their questions into another detention."
 war_adventurer_sienna.11.option_a:0 "Replace the lost ammunition"
 war_adventurer_sienna.11.option_b:0 "Redistribute existing stocks"
 war_adventurer_sienna.11.option_c:0 "Abandon the damaged magazine"
 war_adventurer_sienna.11.t:0 "The Powder Store's Red Dawn"
 war_adventurer_sienna.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering human fire wizard Sienna Fuegonasus. Our quartermaster reports that Sienna set fire to ammunition stored beside captives taken from nearby villages. The captives escaped through a breach she burned in the outer wall. The quartermaster's surviving inventory shows that the ammunition was already allocated to detachments expecting their next issue within days.\n\nThe council proposes that we replace the lost ammunition. A second proposal would have us redistribute existing stocks. The Bright Wizard's temporary hearth is cold, and her travelling things are gone."
 war_adventurer_sienna.12.option_a:0 "Replace the escort's equipment"
 war_adventurer_sienna.12.option_b:0 "Investigate its orders"
 war_adventurer_sienna.12.option_c:0 "Conceal the humiliating escape"
 war_adventurer_sienna.12.t:0 "The Escort That Lost Its Prisoner"
 war_adventurer_sienna.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering human fire wizard Sienna Fuegonasus. Our magistrate reports that guards attempted to chain Sienna after recognizing her college training. She burned the restraints, released other detainees, and vanished into the smoke. The damaged restraints remain on the guardroom floor, making the escort's claim of an orderly transfer impossible to sustain.\n\nThe council proposes that we replace the escort's equipment. A second proposal would have us investigate its orders. Sienna has made it clear that she will not remain under a local magistrate's supervision."
 war_adventurer_sienna.13.option_a:0 "Replace the stores conventionally"
 war_adventurer_sienna.13.option_b:0 "Reorganize the exposed operation"
 war_adventurer_sienna.13.option_c:0 "Abandon the contaminated compound"
 war_adventurer_sienna.13.t:0 "The Grain We Could Not Issue"
 war_adventurer_sienna.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering human fire wizard Sienna Fuegonasus. Our supply officer reports that Sienna burned a stockpile prepared with plague-tainted vermin for distribution into a rival district.\n\nWorkers escaped, but the operation's surviving records now circulate among witnesses. Copies of the distribution orders have escaped with the workers, exposing the intended use of stores the office now calls merely spoiled.\n\nThe council proposes that we replace the stores conventionally. A second proposal would have us reorganize the exposed operation. The last witness saw her taking the road before the watch could assemble another escort."
 war_adventurer_sienna.14.option_a:0 "Rebuild the damaged facilities"
 war_adventurer_sienna.14.option_b:0 "Investigate the false identity trail"
 war_adventurer_sienna.14.option_c:0 "Deny the experiments existed"
 war_adventurer_sienna.14.t:0 "The Wrong Sister's Warrant"
 war_adventurer_sienna.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering human fire wizard Sienna Fuegonasus. Our governor reports that an arrest warrant intended for a necromancer with Sienna's likeness brought her to our mortuary. She destroyed its hidden experiments and left the warrant pinned to a scorched door. The warrant's description fits two different women, while the scorched worktables reveal why the mortuary staff feared any investigation.\n\nThe council proposes that we rebuild the damaged facilities. A second proposal would have us investigate the false identity trail. Her hosts have received no promise that the wandering wizard will return to answer the remaining accusations."
 war_adventurer_sienna.15.option_a:0 "Repair the machinery properly"
 war_adventurer_sienna.15.option_b:0 "Reorganize the foundry's supervision"
 war_adventurer_sienna.15.option_c:0 "Blame an unexplained accident"
 war_adventurer_sienna.15.t:0 "The Lesson the Guild Rejected"
 war_adventurer_sienna.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering human fire wizard Sienna Fuegonasus. Our foundry master reports that Sienna recognized coercive production practices and ruined the machinery driving them. Her chalk diagrams explain exactly which corners the guild had cut. The diagrams show the dangerous alterations precisely, leaving the foundry master unable to blame the damage on an unexplained furnace failure.\n\nThe council proposes that we repair the machinery properly. A second proposal would have us reorganize the foundry's supervision. Sienna has slipped away before the authorities can turn their questions into another detention."
 war_adventurer_sienna.16.option_a:0 "Replace the damaged stores"
 war_adventurer_sienna.16.option_b:0 "Reassign troops to temporary depots"
 war_adventurer_sienna.16.option_c:0 "Leave the burnt compound closed"
 war_adventurer_sienna.16.t:0 "The Arsenal's Failed Arrest"
 war_adventurer_sienna.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering human fire wizard Sienna Fuegonasus. Our commander reports that an attempt to seize Sienna inside a provincial arsenal ended in a spreading fire. Labourers fled with her assistance, and the pursuers returned without their prisoner. The surviving labourers' statements describe both the attempted arrest and the unsafe ammunition stores beside their workstations.\n\nOne course would be to replace the damaged stores. Alternatively, we could reassign troops to temporary depots. The Bright Wizard's temporary hearth is cold, and her travelling things are gone."
 war_adventurer_sienna.17.option_a:0 "Repair the transport"
 war_adventurer_sienna.17.option_b:0 "Audit the failed watch"
 war_adventurer_sienna.17.option_c:0 "Abandon the claim to its passengers"
 war_adventurer_sienna.17.t:0 "The Ship with the Empty Hold"
 war_adventurer_sienna.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering human fire wizard Sienna Fuegonasus. Our customs officer reports that Sienna burned the locks from a captive transport and destroyed its restraining equipment.\n\nThe released prisoners reached shore while the crew tried to contain the fire. The crew has submitted its repair estimate, but the harbour watch has already recorded the passengers' accounts of their confinement.\n\nOne course would be to repair the transport. Alternatively, we could audit the failed watch. Sienna has made it clear that she will not remain under a local magistrate's supervision."
 war_adventurer_sienna.18.option_a:0 "Settle the outstanding claims"
 war_adventurer_sienna.18.option_b:0 "Reconstruct the lost records"
 war_adventurer_sienna.18.option_c:0 "Repudiate the collector publicly"
 war_adventurer_sienna.18.t:0 "A Necromancer's Rejected Gift"
 war_adventurer_sienna.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering human fire wizard Sienna Fuegonasus. Our collector reports that Sienna destroyed a manuscript offered as the work of her twin. The flames also consumed records of the collector's dealings in forbidden remains, leaving angry suppliers at our door. The suppliers' demands identify dealings that the collector had hoped would disappear with his destroyed account books.\n\nOne course would be to settle the outstanding claims. Alternatively, we could reconstruct the lost records. The last witness saw her taking the road before the watch could assemble another escort."
 war_adventurer_sienna.19.option_a:0 "Hire replacements and repair the works"
 war_adventurer_sienna.19.option_b:0 "Redistribute surviving workshops' capacity"
 war_adventurer_sienna.19.option_c:0 "Abandon the ruined yard"
 war_adventurer_sienna.19.t:0 "The Furnace Turned Outward"
 war_adventurer_sienna.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering human fire wizard Sienna Fuegonasus. Our overseer reports that Sienna reversed a forced-labour foundry's magical draft, blasting open its holding yard. Its skilled workers escaped with tools and account books. The escaped workers took the payroll and maintenance books, leaving the overseer without either skilled labour or reliable production records.\n\nOne course would be to hire replacements and repair the works. Alternatively, we could redistribute surviving workshops' capacity. Her hosts have received no promise that the wandering wizard will return to answer the remaining accusations."
 war_adventurer_sienna.20.option_a:0 "Compensate the archive staff"
 war_adventurer_sienna.20.option_b:0 "Reconstruct the missing intelligence"
 war_adventurer_sienna.20.option_c:0 "Dismiss the fugitives' allegations"
 war_adventurer_sienna.20.t:0 "The Witnesses in the Smoke"
 war_adventurer_sienna.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering human fire wizard Sienna Fuegonasus. Our governor reports that Sienna covered a group of fugitives with a wall of flame while they carried evidence out of a seized archive. The provincial guard cannot explain how an apparent prisoner became the organizer of the escape. The surviving archive staff can identify the missing files, but cannot deny that the fugitives carried genuine evidence out through the smoke.\n\nOne course would be to compensate the archive staff. Alternatively, we could reconstruct the missing intelligence. Sienna has slipped away before the authorities can turn their questions into another detention."
 war_adventurer_sienna.21.t:0 "Sienna Fuegonasus has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_sienna.21.d:0 "Our officials in [war_adventurer_arrival_province.GetName] report that the wandering human fire wizard Sienna Fuegonasus has arrived. The red-haired traveler has already shown a lively interest in the province's furnaces and fire pits.\n\nShe studied under Thyrus Gormann before abandoning the restrictions of the Bright College. Her command of Aqshy is formidable, as is the fascination with flame that so often tests her restraint."
 war_adventurer_malakai:0 "Malakai Makaisson, Adventurer"
 desc_war_adventurer_malakai:0 "Malakai Makaisson has filled a rented yard with gears, gun barrels, and a machine whose purpose changes with each explanation. The Slayer engineer's demonstrations attract smiths and gunners, despite whispered accounts of the Unsinkable and the Undestructible. His suggestions are improving local defenses; his test firings are doing rather less for the neighbors' peace of mind."
 war_adventurer_malakai.1.option_a:0 "Fund another controlled trial"
 war_adventurer_malakai.1.option_b:0 "Adapt the compartments for storehouses"
 war_adventurer_malakai.1.option_c:0 "Publish the failure report"
 war_adventurer_malakai.1.t:0 "The Unsinkable's Last Rivet"
 war_adventurer_malakai.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Dwarf Slayer and engineer Malakai Makaisson. Our engineers report that Malakai used salvaged plans from the Unsinkable to demonstrate a safer compartmented hull.\n\nThe test barge sank, but the sealed cargo compartment reached shore intact and its measurements survived. The sealed compartment reached the bank with its measuring marks intact, allowing the engineers to distinguish a useful design from the lost hull.\n\nOur advisers recommend that we fund another controlled trial. There is also a proposal to adapt the compartments for storehouses. His assistants have loaded the remaining machinery for a journey beyond our officials' reach."
 war_adventurer_malakai.2.option_a:0 "Repair the site and study the drawings"
 war_adventurer_malakai.2.option_b:0 "Salvage the intact machinery"
 war_adventurer_malakai.2.option_c:0 "Circulate the safety lessons"
 war_adventurer_malakai.2.t:0 "The Hangar with No Roof"
 war_adventurer_malakai.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Dwarf Slayer and engineer Malakai Makaisson. Our hold engineer reports that Malakai's lifting-engine trial blew the roof off a disused hangar. He left corrected drawings and a bitter note comparing the failure with the Undestructible before disappearing into the mountains. The intact engine parts have been laid beneath a temporary awning while the guild compares them with the corrected drawings.\n\nOur advisers recommend that we repair the site and study the drawings. There is also a proposal to salvage the intact machinery. Malakai refuses to wait while the authorities debate the wisdom of his experiment."
 war_adventurer_malakai.3.option_a:0 "Rebuild the firing platform and train its guards"
 war_adventurer_malakai.3.option_b:0 "Train the surviving crew"
 war_adventurer_malakai.3.option_c:0 "Distribute the recovered weapons"
 war_adventurer_malakai.3.t:0 "Axes in the Target Wall"
 war_adventurer_malakai.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Dwarf Slayer and engineer Malakai Makaisson. Our garrison reports that a trial Goblin-hewer broke a raiding force before its own platform collapsed. The defenders recovered usable axes and a detailed ammunition-loading diagram. The crew has marked each loading step beside the shattered platform so that a safer emplacement can preserve what worked.\n\nOur advisers recommend that we rebuild the firing platform and train its guards. There is also a proposal to train the surviving crew. The last messenger found the engineer's workshop shuttered and its travelling equipment gone."
 war_adventurer_malakai.4.option_a:0 "Confirm the workshop settlement"
 war_adventurer_malakai.4.option_b:0 "Buy copies for apprentices"
 war_adventurer_malakai.4.option_c:0 "Honour the fulfilled debt"
 war_adventurer_malakai.4.t:0 "A Slayer's Workshop Debt"
 war_adventurer_malakai.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Dwarf Slayer and engineer Malakai Makaisson. Our guild court reports that Malakai settled an old workshop debt by repairing machinery, then refused an offer of reinstatement that might soften his disgrace. The repaired works are producing again, but rival masters dispute ownership of his notes. The workshop's repaired machinery is turning again, and its apprentices have carefully copied the adjustments before the guild court rules.\n\nOur advisers recommend that we confirm the workshop settlement. There is also a proposal to buy copies for apprentices. Malakai has packed the surviving tools and departed in search of another proving ground."
 war_adventurer_malakai.5.option_a:0 "Survey the samples"
 war_adventurer_malakai.5.option_b:0 "Develop the promising workings"
 war_adventurer_malakai.5.option_c:0 "Use the rescue account for officer training and public honours"
 war_adventurer_malakai.5.t:0 "The Cargo Above the Pass"
 war_adventurer_malakai.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Dwarf Slayer and engineer Malakai Makaisson. Our border warden reports that Malakai's experimental flying machine carried stranded prospectors over a blocked pass.\n\nThey returned with mineral samples and sketches of ruins he hopes might guide a future expedition to a lost hold. The prospectors have numbered their mineral samples to match the sketches, making a second expedition possible without the inventor's presence.\n\nOur advisers recommend that we survey the samples. There is also a proposal to develop the promising workings. The engineer has left his corrections behind rather than remain for a guild hearing."
 war_adventurer_malakai.6.option_a:0 "Adopt the hoist design"
 war_adventurer_malakai.6.option_b:0 "Extend its use to public cargo handling"
 war_adventurer_malakai.6.option_c:0 "Auction the spare machinery"
 war_adventurer_malakai.6.t:0 "The Harbour's Unscheduled Landing"
 war_adventurer_malakai.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Dwarf Slayer and engineer Malakai Makaisson. Our harbour master reports that Malakai landed a flying prototype between the warehouses and commandeered a damaged crane to lift it again. He left the crane repaired and its operators trained in a new hoist arrangement. The crane operators have already used the repaired hoist to clear freight that had stood untouched beside the harbour wall.\n\nWe could authorize our officials to adopt the hoist design. The competing request is to extend its use to public cargo handling. His assistants have loaded the remaining machinery for a journey beyond our officials' reach."
 war_adventurer_malakai.7.option_a:0 "Circulate the rescue method through merchant shipping contacts"
 war_adventurer_malakai.7.option_b:0 "Fund sealed relief barges"
 war_adventurer_malakai.7.option_c:0 "Preserve the test results"
 war_adventurer_malakai.7.t:0 "The River Refused the Name"
 war_adventurer_malakai.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Dwarf Slayer and engineer Malakai Makaisson. Our ferrymen report that Malakai declined to call a test vessel unsinkable, then deliberately flooded it to prove a rescue method. The vessel was lost, but every passenger and the sealed food cargo reached shore. The ferrymen have measured the sealed compartments and written down the order in which the test passengers entered the water.\n\nWe could authorize our officials to circulate the rescue method through merchant shipping contacts. The competing request is to fund sealed relief barges. Malakai refuses to wait while the authorities debate the wisdom of his experiment."
 war_adventurer_malakai.8.option_a:0 "Authorize supervised trials"
 war_adventurer_malakai.8.option_b:0 "Reorganize the frontier post around regular training"
 war_adventurer_malakai.8.option_c:0 "Display the recovered enemy standards"
 war_adventurer_malakai.8.t:0 "The Foreign Range's Axe Rain"
 war_adventurer_malakai.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Dwarf Slayer and engineer Malakai Makaisson. Our commander reports that Malakai tested a compact axe-thrower against raiders threatening a frontier post. Local armourers recovered its throwing pattern and have asked how much of the experiment they may copy. The recovered axes show where the experimental volley struck, giving the armourers evidence more reliable than the excited defenders' estimates.\n\nWe could authorize our officials to authorize supervised trials. The competing request is to reorganize the frontier post around regular training. The last messenger found the engineer's workshop shuttered and its travelling equipment gone."
 war_adventurer_malakai.9.option_a:0 "Make the drill standard practice"
 war_adventurer_malakai.9.option_b:0 "Compensate the damage and honour the rescuers publicly"
 war_adventurer_malakai.9.option_c:0 "Study the discarded valves"
 war_adventurer_malakai.9.t:0 "The Burnt Balloon's Survivors"
 war_adventurer_malakai.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Dwarf Slayer and engineer Malakai Makaisson. Our magistrate reports that Malakai cut a failing experimental envelope free before its fire reached a crowded market.\n\nHis own account invokes the Undestructible's disaster, and merchants credit the evacuation drill he shouted from the rigging. The merchants' damage claims are accompanied by witness statements crediting the shouted drill with keeping the market approaches clear.\n\nWe could authorize our officials to make the drill standard practice. The competing request is to compensate the damage and honour the rescuers publicly. Malakai has packed the surviving tools and departed in search of another proving ground."
 war_adventurer_malakai.10.option_a:0 "Fund a ground survey"
 war_adventurer_malakai.10.option_b:0 "Restore an identified route"
 war_adventurer_malakai.10.option_c:0 "Purchase the recovered tools"
 war_adventurer_malakai.10.t:0 "The Ruin Seen from Above"
 war_adventurer_malakai.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Dwarf Slayer and engineer Malakai Makaisson. Our surveyor reports that Malakai carried an expedition over impassable ground and recovered a stranded team with ancient tools. His crew has departed, leaving aerial sketches of roads and ruins unfamiliar to our administration. The aerial sketches identify a usable line through ground where the surveyors had previously abandoned their road project.\n\nWe could authorize our officials to fund a ground survey. The competing request is to restore an identified route. The engineer has left his corrections behind rather than remain for a guild hearing."
 war_adventurer_malakai.11.option_a:0 "Replace the gun crew and stores"
 war_adventurer_malakai.11.option_b:0 "Redistribute the surviving battery"
 war_adventurer_malakai.11.option_c:0 "Abandon the damaged position"
 war_adventurer_malakai.11.t:0 "The Battery that Fired Axes"
 war_adventurer_malakai.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Dwarf Slayer and engineer Malakai Makaisson. Our siege commander reports that Malakai's improvised Goblin-hewer tore through a supply approach and wrecked the nearest gun crew. The machine was dismantled before our counterattack arrived. The surviving gunners have dragged their damaged pieces behind the camp, but lack the fittings and stores needed to reopen fire.\n\nOur officials ask us to replace the gun crew and stores. Others argue that we should instead redistribute the surviving battery. His assistants have loaded the remaining machinery for a journey beyond our officials' reach."
 war_adventurer_malakai.12.option_a:0 "Pay to raise the hull"
 war_adventurer_malakai.12.option_b:0 "Write off the naval experiment"
 war_adventurer_malakai.12.option_c:0 "Investigate the stolen design"
 war_adventurer_malakai.12.t:0 "The Dock's Flooded Prize"
 war_adventurer_malakai.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Dwarf Slayer and engineer Malakai Makaisson. Our dockmaster reports that Malakai sabotaged a seized experimental ironclad by exploiting weaknesses he compared to his own Unsinkable. Its prisoners escaped in compartmented floats before the hull settled into the mud. The salvagers have marked the flooded hull's position, while the empty prisoner berths make the dockmaster's failure plain.\n\nOur officials ask us to pay to raise the hull. Others argue that we should instead write off the naval experiment. Malakai refuses to wait while the authorities debate the wisdom of his experiment."
 war_adventurer_malakai.13.option_a:0 "Replace the machinery"
 war_adventurer_malakai.13.option_b:0 "Revise the air-defence programme"
 war_adventurer_malakai.13.option_c:0 "Abandon the scorched installation"
 war_adventurer_malakai.13.t:0 "The Hangar's Escape Valve"
 war_adventurer_malakai.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Dwarf Slayer and engineer Malakai Makaisson. Our engineer reports that Malakai opened the lift apparatus on a captured flying prototype and used the resulting confusion to free its workers.\n\nThe empty machine exploded after drifting clear of the hangar. The engineers recovered fragments of the lift apparatus, but the workers who understood its construction have already escaped.\n\nOur officials ask us to replace the machinery. Others argue that we should instead revise the air-defence programme. The last messenger found the engineer's workshop shuttered and its travelling equipment gone."
 war_adventurer_malakai.14.option_a:0 "Hire replacement artisans"
 war_adventurer_malakai.14.option_b:0 "Rebuild the missing contract records"
 war_adventurer_malakai.14.option_c:0 "Let the failed purchase become public"
 war_adventurer_malakai.14.t:0 "The Guild We Had Purchased"
 war_adventurer_malakai.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Dwarf Slayer and engineer Malakai Makaisson. Our governor reports that Malakai destroyed a ledger binding a workshop to our military contracts. The masters followed his example of accepting disgrace rather than submission and fled with their finest tools. The surviving clerks possess only partial copies of the military contracts and cannot identify every tool taken from the workshop.\n\nOur officials ask us to hire replacement artisans. Others argue that we should instead rebuild the missing contract records. Malakai has packed the surviving tools and departed in search of another proving ground."
 war_adventurer_malakai.15.option_a:0 "Expand the watch and repair its equipment"
 war_adventurer_malakai.15.option_b:0 "Retrain the garrison"
 war_adventurer_malakai.15.option_c:0 "Deny the value of the lost captives and trophies"
 war_adventurer_malakai.15.t:0 "The Pass Below the Airship"
 war_adventurer_malakai.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Dwarf Slayer and engineer Malakai Makaisson. Our warden reports that Malakai carried captives and heirlooms out of a sealed mountain fortress by air. Our costly blockade held every road but never reached the departing craft. The fortress warden has marked every guarded road on his map, unintentionally demonstrating how little the blockade mattered to an aircraft.\n\nOur officials ask us to expand the watch and repair its equipment. Others argue that we should instead retrain the garrison. The engineer has left his corrections behind rather than remain for a guild hearing."
 war_adventurer_malakai.16.option_a:0 "Replace the stores"
 war_adventurer_malakai.16.option_b:0 "Reorganize dispersed depots"
 war_adventurer_malakai.16.option_c:0 "Leave the burnt district unrepaired"
 war_adventurer_malakai.16.t:0 "The Depot Under the Shadow"
 war_adventurer_malakai.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Dwarf Slayer and engineer Malakai Makaisson. Our quartermaster reports that an unfamiliar flying machine dropped explosives onto a military depot. Survivors identified a red-haired Dwarf pilot; rescued labourers departed with the craft before our scouts arrived. The quartermaster has counted the burned stores against the last delivery receipts and warns that nearby detachments will miss their issue.\n\nThe council proposes that we replace the stores. A second proposal would have us reorganize dispersed depots. His assistants have loaded the remaining machinery for a journey beyond our officials' reach."
 war_adventurer_malakai.17.option_a:0 "Rebuild the vessel safely"
 war_adventurer_malakai.17.option_b:0 "Audit the procurement office"
 war_adventurer_malakai.17.option_c:0 "Abandon the project publicly"
 war_adventurer_malakai.17.t:0 "The Trial Ship's Missing Bulkheads"
 war_adventurer_malakai.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Dwarf Slayer and engineer Malakai Makaisson. Our shipwright reports that Malakai removed critical fittings from a stolen prototype and left a mocking account of the Unsinkable.\n\nThe vessel foundered during launch, although its workers escaped. The shipwright's launch report names the missing fittings, exposing the procurement office's failure to inspect its stolen design.\n\nThe council proposes that we rebuild the vessel safely. A second proposal would have us audit the procurement office. Malakai refuses to wait while the authorities debate the wisdom of his experiment."
 war_adventurer_malakai.18.option_a:0 "Replace the escort's arms"
 war_adventurer_malakai.18.option_b:0 "Reorganize convoy doctrine"
 war_adventurer_malakai.18.option_c:0 "Abandon the contested street"
 war_adventurer_malakai.18.t:0 "The Axe Machine in the Alley"
 war_adventurer_malakai.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Dwarf Slayer and engineer Malakai Makaisson. Our governor reports that Malakai installed an experimental axe-thrower across the route of a captive convoy. The escort broke, and the freed workers carried away its ammunition while he dismantled the machine. The escort's surviving soldiers recovered scattered axe heads, but most of their own weapons left with the freed convoy workers.\n\nThe council proposes that we replace the escort's arms. A second proposal would have us reorganize convoy doctrine. The last messenger found the engineer's workshop shuttered and its travelling equipment gone."
 war_adventurer_malakai.19.option_a:0 "Repair the roof and salvage records"
 war_adventurer_malakai.19.option_b:0 "Reconstruct the missing research"
 war_adventurer_malakai.19.option_c:0 "Acknowledge the security failure"
 war_adventurer_malakai.19.t:0 "The Fire Above the Foundry"
 war_adventurer_malakai.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Dwarf Slayer and engineer Malakai Makaisson. Our foundry master reports that Malakai used a small lifting engine to pull stolen plans out of the archive, then destroyed it before our guards could study it. Burning fragments damaged the roof and scattered the records. Clerks are recovering damp papers from beneath the damaged roof while the foundry master determines which drawings cannot be replaced.\n\nThe council proposes that we repair the roof and salvage records. A second proposal would have us reconstruct the missing research. Malakai has packed the surviving tools and departed in search of another proving ground."
 war_adventurer_malakai.20.option_a:0 "Replace the workshop's equipment"
 war_adventurer_malakai.20.option_b:0 "Reorganize the surviving workforce"
 war_adventurer_malakai.20.option_c:0 "Repudiate the governor's coercion"
 war_adventurer_malakai.20.t:0 "The Engineer's Refused Commission"
 war_adventurer_malakai.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Dwarf Slayer and engineer Malakai Makaisson. Our governor reports that an attempt to compel Malakai into service ended with disabled lathes and apprentices escaping through a maintenance passage. He left a note explaining why neither patronage nor disgrace would make him work for you. The apprentices' abandoned benches show that the best tools were carried away before the governor's men could close the workshop.\n\nThe council proposes that we replace the workshop's equipment. A second proposal would have us reorganize the surviving workforce. The engineer has left his corrections behind rather than remain for a guild hearing."
 war_adventurer_malakai.21.t:0 "Malakai Makaisson has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_malakai.21.d:0 "A dispatch from [war_adventurer_arrival_province.GetName] records the arrival of the Dwarf Slayer and engineer Malakai Makaisson. The visitor has brought tools, sketches, and firm opinions about the shortcomings of other people's machinery.\n\nHe took the Slayer oath after the disasters of his Unsinkable ironclad and Undestructible airship. Disgrace has done little to diminish his inventive ambition or his appetite for another experiment."
 war_adventurer_tyrion:0 "Tyrion, Adventurer"
 desc_war_adventurer_tyrion:0 "Word that the victor over Urian Poisonblade is passing through the province has drawn swordsmen eager to watch Tyrion train. His effortless command of horse and blade inspires recruits and leaves proud veterans demanding another bout. Armorers welcome the custom, while officers contend with wounded pride and arguments over the High Elf champion's presence."
 war_adventurer_tyrion.1.option_a:0 "Restore the sanctuary with the offerings"
 war_adventurer_tyrion.1.option_b:0 "Train a disciplined watch for the restored sanctuary"
 war_adventurer_tyrion.1.option_c:0 "Commemorate the rescue"
 war_adventurer_tyrion.1.t:0 "The Shrine's Renewed Watch"
 war_adventurer_tyrion.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf prince and warrior Tyrion. Our shrine wardens report that Tyrion broke a daemonic incursion at an outer sanctuary and left instructions recalling his stand against N'Kari at the Phoenix Shrine.\n\nPilgrims have returned, but the wardens disagree over the recovered offerings. The returned pilgrims have placed their offerings under the wardens' seal, giving the government a practical means of restoring the damaged sanctuary.\n\nOne course would be to restore the sanctuary with the offerings. Alternatively, we could train a disciplined watch for the restored sanctuary. The champion has declined a prolonged stay while officials settle the disputes left behind."
 war_adventurer_tyrion.2.option_a:0 "Adopt the revised training"
 war_adventurer_tyrion.2.option_b:0 "Use the battle commentary in regular officer training"
 war_adventurer_tyrion.2.option_c:0 "Reward the officer for accepting correction"
 war_adventurer_tyrion.2.t:0 "Urian's Lesson on the Practice Field"
 war_adventurer_tyrion.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf prince and warrior Tyrion. Our marshal reports that Tyrion corrected an overconfident officer's sword drill by explaining how he defeated Urian Poisonblade. The demonstration ended with an embarrassed officer and a regiment eager to practise. The officer has redrawn his drill chart in front of the regiment, accepting corrections he would have rejected from a less celebrated instructor.\n\nOne course would be to adopt the revised training. Alternatively, we could use the battle commentary in regular officer training. The last report places Tyrion on the road, already beyond the escort sent to find him."
 war_adventurer_tyrion.3.option_a:0 "Recover the stores for the garrison"
 war_adventurer_tyrion.3.option_b:0 "Study and seal the route"
 war_adventurer_tyrion.3.option_c:0 "Sell unclaimed cargo to repair the road"
 war_adventurer_tyrion.3.t:0 "One Rider at the Culvert"
 war_adventurer_tyrion.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf prince and warrior Tyrion. Our patrol reports that Tyrion and Malhandir broke a ratman force emerging beneath a supply road. Survivors compare the charge to Kritsqueel's defeat, and abandoned stores now block the culvert. The patrol has separated captured rations from civilian cargo and marked the point where the culvert joins the road's foundations.\n\nOne course would be to recover the stores for the garrison. Alternatively, we could study and seal the route. Tyrion has mounted Malhandir and continued his journey without requesting an office or reward."
 war_adventurer_tyrion.4.option_a:0 "Investigate the accomplices"
 war_adventurer_tyrion.4.option_b:0 "Establish safer tournament inspections"
 war_adventurer_tyrion.4.option_c:0 "Honour the attendants publicly"
 war_adventurer_tyrion.4.t:0 "The Poisoned Champion's Purse"
 war_adventurer_tyrion.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf prince and warrior Tyrion. Our herald reports that Tyrion exposed a would-be champion's poisoned blade before a ceremonial bout. He left testimony comparing the deception with Urian's methods and asked that the injured attendants be remembered. The attendants preserved the poisoned weapon before its owner could discard it, allowing the accusation to be tested openly.\n\nOne course would be to investigate the accomplices. Alternatively, we could establish safer tournament inspections. The Elf has left his testimony with the witnesses rather than await the governor's summons."
 war_adventurer_tyrion.5.option_a:0 "Restore the records"
 war_adventurer_tyrion.5.option_b:0 "Exhibit the recovered token"
 war_adventurer_tyrion.5.option_c:0 "Fund a public ceremony honouring the sanctuary’s custodians"
 war_adventurer_tyrion.5.t:0 "The Heirloom at the Phoenix Gate"
 war_adventurer_tyrion.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf prince and warrior Tyrion. Our keeper reports that Tyrion recovered an ancestral token from thieves operating near a sanctuary.\n\nHis refusal to let them bargain with a relic associated with Aenarion has renewed interest in the shrine's neglected records. The recovered token matches an entry in a neglected shrine register whose remaining pages now require careful preservation.\n\nOne course would be to restore the records. Alternatively, we could exhibit the recovered token. Tyrion's hosts cannot promise that a rider of his ability will remain within their patrol lines."
 war_adventurer_tyrion.6.option_a:0 "Share the warding records"
 war_adventurer_tyrion.6.option_b:0 "Support the displaced custodians"
 war_adventurer_tyrion.6.option_c:0 "Recognize the rescue across religious differences"
 war_adventurer_tyrion.6.t:0 "The Stranger at the Defiled Shrine"
 war_adventurer_tyrion.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf prince and warrior Tyrion. Our governor reports that Tyrion expelled a summoned creature from a local sanctuary, despite understanding little of its rites. Its custodians compare his description of the Phoenix Shrine with their own account of the breach. The custodians have written down both their own warning signs and the Elf's account of the disturbance for a joint examination.\n\nOur advisers recommend that we share the warding records. There is also a proposal to support the displaced custodians. The champion has declined a prolonged stay while officials settle the disputes left behind."
 war_adventurer_tyrion.7.option_a:0 "Teach the feint to officers"
 war_adventurer_tyrion.7.option_b:0 "Reward the rescued interpreter"
 war_adventurer_tyrion.7.option_c:0 "Purchase and translate the full account"
 war_adventurer_tyrion.7.t:0 "The Duel Beyond the Interpreter"
 war_adventurer_tyrion.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf prince and warrior Tyrion. Our commander reports that Tyrion defeated a marauder champion after negotiations failed through an interpreter. He left a sketch of the feint he used, annotated with a reference to Finuval Plain. The interpreter has translated the sketch's short annotations, making its practical lesson available to officers unfamiliar with Elven swordcraft.\n\nOur advisers recommend that we teach the feint to officers. There is also a proposal to reward the rescued interpreter. The last report places Tyrion on the road, already beyond the escort sent to find him."
 war_adventurer_tyrion.8.option_a:0 "Map the raiders' routes"
 war_adventurer_tyrion.8.option_b:0 "Recover unclaimed merchandise"
 war_adventurer_tyrion.8.option_c:0 "Train escorts from the survivors' account"
 war_adventurer_tyrion.8.t:0 "Malhandir on the Caravan Road"
 war_adventurer_tyrion.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf prince and warrior Tyrion. Our caravan master reports that Tyrion and his horse scattered a tunnelling ambush before the guards could form. The rescued merchants have surrendered captured intelligence to our customs office. The recovered papers identify the concealed approach to the road as well as the merchants the ambushers expected to capture.\n\nOur advisers recommend that we map the raiders' routes. There is also a proposal to recover unclaimed merchandise. Tyrion has mounted Malhandir and continued his journey without requesting an office or reward."
 war_adventurer_tyrion.9.option_a:0 "Accept their instruction"
 war_adventurer_tyrion.9.option_b:0 "Settle civilian survivors"
 war_adventurer_tyrion.9.option_c:0 "Celebrate the prisoners' return"
 war_adventurer_tyrion.9.t:0 "A Prison Opened by One Rider"
 war_adventurer_tyrion.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf prince and warrior Tyrion. Our border officer reports that Tyrion broke a raiders' prison and escorted captives to the frontier.\n\nThe released soldiers have requested permission to teach our recruits the disciplined counterattack they witnessed. The released soldiers have assembled willing volunteers outside the border post while civilian families petition for shelter nearby.\n\nOur advisers recommend that we accept their instruction. There is also a proposal to settle civilian survivors. The Elf has left his testimony with the witnesses rather than await the governor's summons."
 war_adventurer_tyrion.10.option_a:0 "Revise the school's curriculum"
 war_adventurer_tyrion.10.option_b:0 "Fund translated training notes"
 war_adventurer_tyrion.10.option_c:0 "Honour the instructor's candour"
 war_adventurer_tyrion.10.t:0 "The Foreign Swordmaster's Testimony"
 war_adventurer_tyrion.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf prince and warrior Tyrion. Our governor receives a foreign instructor's account of losing a friendly bout to Tyrion. The visitor identified a dangerous flaw in the local school and explained his duel with Urian as a warning against theatrical swordplay. The instructor's signed testimony admits the flaw plainly, preventing his assistants from dismissing the defeat as a mere contest of strength.\n\nOur advisers recommend that we revise the school's curriculum. There is also a proposal to fund translated training notes. Tyrion's hosts cannot promise that a rider of his ability will remain within their patrol lines."
 war_adventurer_tyrion.11.option_a:0 "Rebuild conventional security"
 war_adventurer_tyrion.11.option_b:0 "Investigate the lost ritual"
 war_adventurer_tyrion.11.option_c:0 "Abandon the chamber"
 war_adventurer_tyrion.11.t:0 "The Occupier's Empty Shrine"
 war_adventurer_tyrion.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf prince and warrior Tyrion. Our governor reports that Tyrion destroyed a summoning apparatus installed in a seized sanctuary. The bound creature is gone, the attendants escaped, and the provincial guard refuses to approach the damaged chamber. The frightened attendants have left the broken controlling apparatus where it fell, refusing to enter the chamber to retrieve official records.\n\nWe could authorize our officials to rebuild conventional security. The competing request is to investigate the lost ritual. The champion has declined a prolonged stay while officials settle the disputes left behind."
 war_adventurer_tyrion.12.option_a:0 "Replace the officer's equipment and escort"
 war_adventurer_tyrion.12.option_b:0 "Revise the garrison's command"
 war_adventurer_tyrion.12.option_c:0 "Endure the public comparisons"
 war_adventurer_tyrion.12.t:0 "The Champion Before the Gate"
 war_adventurer_tyrion.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf prince and warrior Tyrion. Our marshal reports that Tyrion defeated the officer guarding a confiscated estate and returned its heirlooms to their claimants. Witnesses have begun comparing our officer unfavourably with Urian Poisonblade. The restored heirlooms have been displayed before witnesses, leaving the governor unable to deny either their confiscation or the guard's defeat.\n\nWe could authorize our officials to replace the officer's equipment and escort. The competing request is to revise the garrison's command. The last report places Tyrion on the road, already beyond the escort sent to find him."
 war_adventurer_tyrion.13.option_a:0 "Replace the lost supplies"
 war_adventurer_tyrion.13.option_b:0 "Reorganize the march order"
 war_adventurer_tyrion.13.option_c:0 "Requisition replacements locally"
 war_adventurer_tyrion.13.t:0 "The Column that Met Malhandir"
 war_adventurer_tyrion.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf prince and warrior Tyrion. Our quartermaster reports that Tyrion and Malhandir scattered an isolated supply column before nearby troops could intervene.\n\nIts surviving guards insist that no supporting army ever appeared. The surviving quartermasters have submitted separate accounts that agree on the loss even when they disagree about the rider's route.\n\nWe could authorize our officials to replace the lost supplies. The competing request is to reorganize the march order. Tyrion has mounted Malhandir and continued his journey without requesting an office or reward."
 war_adventurer_tyrion.14.option_a:0 "Compensate the defeated guards"
 war_adventurer_tyrion.14.option_b:0 "Rebuild the sanctuary's security"
 war_adventurer_tyrion.14.option_c:0 "Dismiss the relic's importance"
 war_adventurer_tyrion.14.t:0 "The Ancestor's Confiscated Relic"
 war_adventurer_tyrion.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf prince and warrior Tyrion. Our keeper reports that Tyrion recovered a seized ancestral relic and released the attendants held with it. He left a warning invoking the defence of Aenarion's line, then rode through the closing gates. The released attendants carried the confiscation order away with the relic, giving its former custodians evidence of the government's involvement.\n\nWe could authorize our officials to compensate the defeated guards. The competing request is to rebuild the sanctuary's security. The Elf has left his testimony with the witnesses rather than await the governor's summons."
 war_adventurer_tyrion.15.option_a:0 "Recruit replacement instructors"
 war_adventurer_tyrion.15.option_b:0 "Reorganize military education"
 war_adventurer_tyrion.15.option_c:0 "Tolerate the loss of authority"
 war_adventurer_tyrion.15.t:0 "The School with No Master"
 war_adventurer_tyrion.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf prince and warrior Tyrion. Our military tutor reports that Tyrion defeated the champion enforcing compulsory instruction at an occupied sword school. The pupils dispersed with the school's records and have begun training opposition volunteers. The school's empty racks and missing attendance books reveal how thoroughly its pupils prepared before the defeated champion could recover.\n\nWe could authorize our officials to recruit replacement instructors. The competing request is to reorganize military education. Tyrion's hosts cannot promise that a rider of his ability will remain within their patrol lines."
 war_adventurer_tyrion.16.option_a:0 "Replace the convoy's military role"
 war_adventurer_tyrion.16.option_b:0 "Investigate the failed containment"
 war_adventurer_tyrion.16.option_c:0 "Abandon its damaged staging ground"
 war_adventurer_tyrion.16.t:0 "The Broken Summoning Escort"
 war_adventurer_tyrion.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf prince and warrior Tyrion. Our commander reports that Tyrion attacked a convoy carrying a bound daemon and destroyed its controlling vessel. The escort fled while captive labourers escaped along the road. The controlling vessel's broken pieces have been recovered from the road, but its handlers refuse to promise that another binding would hold.\n\nOur officials ask us to replace the convoy's military role. Others argue that we should instead investigate the failed containment. The champion has declined a prolonged stay while officials settle the disputes left behind."
 war_adventurer_tyrion.17.option_a:0 "Pay compensation to restore order"
 war_adventurer_tyrion.17.option_b:0 "Retrain the humiliated guard"
 war_adventurer_tyrion.17.option_c:0 "Preserve the governor's account despite witnesses"
 war_adventurer_tyrion.17.t:0 "The Governor's Champion Unhorsed"
 war_adventurer_tyrion.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf prince and warrior Tyrion. Our governor reports that Tyrion publicly defeated his champion after discovering prisoners held as tournament stakes.\n\nHe released them and left before the reserve guard assembled. The freed prisoners have repeated the tournament's terms to the crowd, stripping the governor's explanation of any appearance of generosity.\n\nOur officials ask us to pay compensation to restore order. Others argue that we should instead retrain the humiliated guard. The last report places Tyrion on the road, already beyond the escort sent to find him."
 war_adventurer_tyrion.18.option_a:0 "Rebuild the mechanism"
 war_adventurer_tyrion.18.option_b:0 "Reorganize the tunnel garrison"
 war_adventurer_tyrion.18.option_c:0 "Abandon the entrance"
 war_adventurer_tyrion.18.t:0 "The Tunnel Mouth's Lone Rider"
 war_adventurer_tyrion.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf prince and warrior Tyrion. Our engineer reports that Tyrion and Malhandir broke a sortie from a concealed military tunnel. Work crews fled, leaving the access mechanism destroyed and the stored provisions in enemy hands. The access mechanism lies broken beneath the tunnel mouth, trapping equipment the engineer still hopes to recover.\n\nOur officials ask us to rebuild the mechanism. Others argue that we should instead reorganize the tunnel garrison. Tyrion has mounted Malhandir and continued his journey without requesting an office or reward."
 war_adventurer_tyrion.19.option_a:0 "Repair and secure the excavation"
 war_adventurer_tyrion.19.option_b:0 "Examine the custodians' claims"
 war_adventurer_tyrion.19.option_c:0 "Deny the public accusation"
 war_adventurer_tyrion.19.t:0 "A Shrine Beyond His Homeland"
 war_adventurer_tyrion.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf prince and warrior Tyrion. Our overseer reports that Tyrion removed a captive temple custodian from a guarded excavation and wrecked the apparatus restraining a dangerous relic. His warning concerns the relic's use, regardless of the temple's faith. The rescued custodian left a copy of the warning with local witnesses, making the dangerous excavation a matter of public concern.\n\nOur officials ask us to repair and secure the excavation. Others argue that we should instead examine the custodians' claims. The Elf has left his testimony with the witnesses rather than await the governor's summons."
 war_adventurer_tyrion.20.option_a:0 "Replace damaged equipment and reassure the troops"
 war_adventurer_tyrion.20.option_b:0 "Overhaul officer training"
 war_adventurer_tyrion.20.option_c:0 "Forbid the story and accept the ridicule"
 war_adventurer_tyrion.20.t:0 "The Lesson Our Officers Received"
 war_adventurer_tyrion.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf prince and warrior Tyrion. Our commander reports that Tyrion defeated an officer sent to arrest him and explained the officer's mistakes to the watching soldiers. His account of Finuval Plain has become an embarrassing favourite in the barracks. Several soldiers have written the corrections on their practice boards, preserving the very lesson their embarrassed officers would prefer forgotten.\n\nOur officials ask us to replace damaged equipment and reassure the troops. Others argue that we should instead overhaul officer training. Tyrion's hosts cannot promise that a rider of his ability will remain within their patrol lines."
 war_adventurer_tyrion.21.t:0 "Tyrion has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_tyrion.21.d:0 "Travelers have brought us word that the renowned High Elf prince and warrior Tyrion has arrived in [war_adventurer_arrival_province.GetName]. Their descriptions of his bearing and extraordinary horsemanship agree with accounts of the High Elf champion.\n\nA descendant of Aenarion, Tyrion is celebrated as one of Ulthuan's greatest warriors. His defeat of Urian Poisonblade at Finuval Plain is recounted wherever the struggle between the High Elves and Dark Elves is remembered."
 war_adventurer_gor_rok:0 "Gor-Rok, Adventurer"
 desc_war_adventurer_gor_rok:0 "The Great White Lizard stands watch near ancient stones in this province, his immense shield scarred by blows that would have felled lesser warriors. Reports of Gor-Rok's unyielding defense have set soldiers inspecting their own shield walls and barricades. He offers no explanation to officials, and anyone approaching the relics he guards does so with considerable caution."
 war_adventurer_gor_rok.1.option_a:0 "Restore the shrine and catalogue the stone"
 war_adventurer_gor_rok.1.option_b:0 "Fortify its approach and train its guards"
 war_adventurer_gor_rok.1.option_c:0 "Commemorate the recovery"
 war_adventurer_gor_rok.1.t:0 "The Stela Returned with a Spear"
 war_adventurer_gor_rok.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the mighty albino Saurus warrior Gor-Rok. Our temple liaison reports that Gor-Rok recovered a stolen inscribed stone from raiders and waited until it was secured before allowing a spear to be drawn from his side.\n\nThe custodians compare the incident with the Star Stela of Quetli's recovery under Tepec-Inzi. The attendants have laid the removed spear beside the recovered stone, recording that the guardian refused treatment until the relic was safe.\n\nThe council proposes that we restore the shrine and catalogue the stone. A second proposal would have us fortify its approach and train its guards. The patrol sent to observe him has returned after losing his trail beyond its accustomed routes."
 war_adventurer_gor_rok.2.option_a:0 "Return the tools to their workshops"
 war_adventurer_gor_rok.2.option_b:0 "Examine the fragments"
 war_adventurer_gor_rok.2.option_c:0 "Train guards from the surviving witnesses"
 war_adventurer_gor_rok.2.t:0 "The Chariot in the Causeway"
 war_adventurer_gor_rok.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the mighty albino Saurus warrior Gor-Rok. Our road warden reports that Gor-Rok smashed a raider commander's chariot while blocking a temple causeway. The defeated band's abandoned cargo includes stolen tools and fragments of sacred inscriptions. The recovered fragments fit several damaged inscriptions already held by the custodians, allowing part of the site's history to be reconstructed.\n\nThe council proposes that we return the tools to their workshops. A second proposal would have us examine the fragments. The white Saurus has left the officials behind and resumed his silent march."
 war_adventurer_gor_rok.3.option_a:0 "Study the carcass safely"
 war_adventurer_gor_rok.3.option_b:0 "Have the scouts teach other units how they protected civilians"
 war_adventurer_gor_rok.3.option_c:0 "Use recovered raider supplies for relief"
 war_adventurer_gor_rok.3.t:0 "The Rider and the Wings"
 war_adventurer_gor_rok.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the mighty albino Saurus warrior Gor-Rok. Our scouts report that Gor-Rok killed a raider chief and its flying mount beside a settlement's pools. Attendants invoke Bloodpools while petitioning for the dangerous remains to be removed. The scouts have cordoned off both carcasses and set aside the raiders' intact equipment for official inspection.\n\nThe council proposes that we study the carcass safely. A second proposal would have us have the scouts teach other units how they protected civilians. No interpreter has persuaded Gor-Rok to remain while the court considers the report."
 war_adventurer_gor_rok.4.option_a:0 "Teach the defensive formation"
 war_adventurer_gor_rok.4.option_b:0 "Rebuild the battered approach and train its guards"
 war_adventurer_gor_rok.4.option_c:0 "Recognize the defenders' recovery"
 war_adventurer_gor_rok.4.t:0 "The Line That Did Not Move"
 war_adventurer_gor_rok.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the mighty albino Saurus warrior Gor-Rok. Our commander reports that Gor-Rok held a narrow approach against repeated charges by hired Ogre raiders. His stand allowed the settlement's defenders to regroup, and their officers have returned with a precise account of the formation. The defenders have marked where each rank stood during the charges, providing a usable account of the position rather than another heroic legend.\n\nThe council proposes that we teach the defensive formation. A second proposal would have us rebuild the battered approach and train its guards. The last scouts saw the guardian moving away from the recovered site with no sign of accepting an escort."
 war_adventurer_gor_rok.5.option_a:0 "Record the witnesses' account"
 war_adventurer_gor_rok.5.option_b:0 "Retrain the wardens to hold their positions"
 war_adventurer_gor_rok.5.option_c:0 "Honour the successful defence"
 war_adventurer_gor_rok.5.t:0 "The Blow Against the White Shield"
 war_adventurer_gor_rok.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the mighty albino Saurus warrior Gor-Rok. Our temple watch reports that Gor-Rok survived a summoned horror's blow long enough for attendants to close the breach behind it.\n\nThe site is secure, but his cracked shield marks have become the subject of competing interpretations. The attendants have copied the marks around the sealed breach before repairing the stones disturbed during the fight.\n\nThe council proposes that we record the witnesses' account. A second proposal would have us retrain the wardens to hold their positions. Gor-Rok appears to consider his task complete, whatever remains for our administration to settle."
 war_adventurer_gor_rok.6.option_a:0 "Map the winter approaches"
 war_adventurer_gor_rok.6.option_b:0 "Establish a shelter for patrols and train its guards"
 war_adventurer_gor_rok.6.option_c:0 "Recover abandoned raider stores"
 war_adventurer_gor_rok.6.t:0 "The Snow on the White Saurus"
 war_adventurer_gor_rok.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the mighty albino Saurus warrior Gor-Rok. Our frontier governor reports that Gor-Rok crossed freezing ground to destroy raiders threatening an ancient ruin. His tracks and the survivors' route notes offer a rare account of travel in conditions reminiscent of his Chaos Wastes campaigns. The survivors' notes identify sheltered approaches and a supply route that ordinary frontier patrols had considered impassable in winter.\n\nOne course would be to map the winter approaches. Alternatively, we could establish a shelter for patrols and train its guards. The patrol sent to observe him has returned after losing his trail beyond its accustomed routes."
 war_adventurer_gor_rok.7.option_a:0 "Study the recovered inscription"
 war_adventurer_gor_rok.7.option_b:0 "Compensate the yard and return stolen goods"
 war_adventurer_gor_rok.7.option_c:0 "Prosecute the smuggling records"
 war_adventurer_gor_rok.7.t:0 "The Auction's Broken Chariot"
 war_adventurer_gor_rok.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the mighty albino Saurus warrior Gor-Rok. Our magistrate reports that Gor-Rok intercepted a smuggler's chariot carrying a stolen inscribed slab. He held the yard despite an embedded weapon until the frightened custodians recovered the slab, then left them with our officials. The magistrate has placed the recovered slab under guard while the custodians identify its missing sections among the smuggler's cargo.\n\nOne course would be to study the recovered inscription. Alternatively, we could compensate the yard and return stolen goods. The white Saurus has left the officials behind and resumed his silent march."
 war_adventurer_gor_rok.8.option_a:0 "Equip a local watch"
 war_adventurer_gor_rok.8.option_b:0 "Sell surplus equipment and retain the balance after repairs"
 war_adventurer_gor_rok.8.option_c:0 "Catalogue the beast's remains"
 war_adventurer_gor_rok.8.t:0 "The Wyvern Above the Quarry"
 war_adventurer_gor_rok.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the mighty albino Saurus warrior Gor-Rok. Our overseer reports that Gor-Rok killed both a flying beast and its marauding rider before they reached a workers' camp. The workers have offered the recovered equipment to our government in gratitude. The workers have separated sound weapons and harness from the wreckage, offering supplies for a watch that might prevent another attack.\n\nOne course would be to equip a local watch. Alternatively, we could sell surplus equipment and retain the balance after repairs. No interpreter has persuaded Gor-Rok to remain while the court considers the report."
 war_adventurer_gor_rok.9.option_a:0 "Preserve and examine the foundation"
 war_adventurer_gor_rok.9.option_b:0 "Rebuild and staff the public refuge with recovered stone"
 war_adventurer_gor_rok.9.option_c:0 "Honour the workers for protecting their neighbours"
 war_adventurer_gor_rok.9.t:0 "The Ruin Beneath the New Street"
 war_adventurer_gor_rok.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the mighty albino Saurus warrior Gor-Rok. Our surveyor reports that Gor-Rok stood against a hired raiding band's heavy charge at an exposed ancient foundation.\n\nHe protected the excavation without acknowledging either the officials or the workers now petitioning for its preservation. The surveyors' plan shows how the exposed masonry could be preserved without leaving the settlement's new street permanently blocked.\n\nOne course would be to preserve and examine the foundation. Alternatively, we could rebuild and staff the public refuge with recovered stone. The last scouts saw the guardian moving away from the recovered site with no sign of accepting an escort."
 war_adventurer_gor_rok.10.option_a:0 "Reward and train the defenders"
 war_adventurer_gor_rok.10.option_b:0 "Repair the gate from recovered supplies and train its guards"
 war_adventurer_gor_rok.10.option_c:0 "Investigate the breach's remains"
 war_adventurer_gor_rok.10.t:0 "The Horror in the Foreign Gate"
 war_adventurer_gor_rok.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the mighty albino Saurus warrior Gor-Rok. Our garrison reports that Gor-Rok absorbed the first assault of a summoned creature at an isolated gate while civilians escaped. Local defenders then closed the breach, but cannot explain why he chose their settlement. The garrison has counted the civilians brought through the gate and recorded the defenders who held long enough to seal it.\n\nOne course would be to reward and train the defenders. Alternatively, we could repair the gate from recovered supplies and train its guards. Gor-Rok appears to consider his task complete, whatever remains for our administration to settle."
 war_adventurer_gor_rok.11.option_a:0 "Replace the convoy and guards"
 war_adventurer_gor_rok.11.option_b:0 "Reorganize relic transport"
 war_adventurer_gor_rok.11.option_c:0 "Abandon the wrecked depot"
 war_adventurer_gor_rok.11.t:0 "The Stela's Empty Wagon"
 war_adventurer_gor_rok.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the mighty albino Saurus warrior Gor-Rok. Our occupation officer reports that Gor-Rok destroyed a relic convoy's command chariot and recovered its stone cargo. Even a spear through his body failed to stop him before the surviving temple attendants escaped. The surviving escorts describe the same impaling wound, removing their excuse that the guardian escaped merely because nobody struck him.\n\nOur advisers recommend that we replace the convoy and guards. There is also a proposal to reorganize relic transport. The patrol sent to observe him has returned after losing his trail beyond its accustomed routes."
 war_adventurer_gor_rok.12.option_a:0 "Replace the lost military capacity"
 war_adventurer_gor_rok.12.option_b:0 "Reorganize beast-handling detachments"
 war_adventurer_gor_rok.12.option_c:0 "Leave the compound ruined"
 war_adventurer_gor_rok.12.t:0 "The Wyvern Pen's Two Corpses"
 war_adventurer_gor_rok.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the mighty albino Saurus warrior Gor-Rok. Our beast-master reports that Gor-Rok killed a military Wyvern and the champion riding it during a demonstration. The ruined pen has drawn crowds of hostile local witnesses. The beast-master's purchase rolls and the champion's discarded harness leave no doubt about the value of the destroyed military asset.\n\nOur advisers recommend that we replace the lost military capacity. There is also a proposal to reorganize beast-handling detachments. The white Saurus has left the officials behind and resumed his silent march."
 war_adventurer_gor_rok.13.option_a:0 "Pay the troops' recovery costs"
 war_adventurer_gor_rok.13.option_b:0 "Replace their officers"
 war_adventurer_gor_rok.13.option_c:0 "Deny the defeat's significance"
 war_adventurer_gor_rok.13.t:0 "The Charge Against the Causeway"
 war_adventurer_gor_rok.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the mighty albino Saurus warrior Gor-Rok. Our commander reports that hired heavy troops broke themselves against Gor-Rok at a temple approach.\n\nHe withdrew with the custodians after the failed charge left our formation in disorder. The hired troops demand treatment and replacement equipment before they will attempt another advance along the same approach.\n\nOur advisers recommend that we pay the troops' recovery costs. There is also a proposal to replace their officers. No interpreter has persuaded Gor-Rok to remain while the court considers the report."
 war_adventurer_gor_rok.14.option_a:0 "Replace the shattered apparatus"
 war_adventurer_gor_rok.14.option_b:0 "Abandon the ritual programme"
 war_adventurer_gor_rok.14.option_c:0 "Close the ruined shrine"
 war_adventurer_gor_rok.14.t:0 "The Greater Horror's Failed Blow"
 war_adventurer_gor_rok.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the mighty albino Saurus warrior Gor-Rok. Our ritual officer reports that the summoned creature guarding a confiscated shrine failed to dislodge Gor-Rok. The struggle wrecked its apparatus and allowed captives to escape into the surrounding district. The broken apparatus lies among abandoned restraints, exposing the connection between the confiscated shrine and its captive labourers.\n\nOur advisers recommend that we replace the shattered apparatus. There is also a proposal to abandon the ritual programme. The last scouts saw the guardian moving away from the recovered site with no sign of accepting an escort."
 war_adventurer_gor_rok.15.option_a:0 "Replace the escort and display"
 war_adventurer_gor_rok.15.option_b:0 "Investigate the trophies' provenance"
 war_adventurer_gor_rok.15.option_c:0 "Endure the public humiliation"
 war_adventurer_gor_rok.15.t:0 "The Commander's Crushed Trophy"
 war_adventurer_gor_rok.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the mighty albino Saurus warrior Gor-Rok. Our governor reports that Gor-Rok smashed the vehicle displaying stolen temple trophies, defeated its commander, and carried away the inscribed pieces. The remaining guards refuse to pursue him into the jungle. The surviving escort brought back only splintered display boards, while the inscribed trophies disappeared with their formidable rescuer.\n\nOur advisers recommend that we replace the escort and display. There is also a proposal to investigate the trophies' provenance. Gor-Rok appears to consider his task complete, whatever remains for our administration to settle."
 war_adventurer_gor_rok.16.option_a:0 "Replace the winter stores"
 war_adventurer_gor_rok.16.option_b:0 "Reorganize the exposed patrol routes"
 war_adventurer_gor_rok.16.option_c:0 "Abandon the damaged camp"
 war_adventurer_gor_rok.16.t:0 "The Camp Beyond the Snowline"
 war_adventurer_gor_rok.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the mighty albino Saurus warrior Gor-Rok. Our frontier commander reports that Gor-Rok broke a supply camp thought safe behind severe winter terrain. He left its engines wrecked and disappeared toward ancient ruins outside the patrol routes. The frontier officers have marked the broken camp on their winter charts, admitting that the route can no longer be treated as secure.\n\nWe could authorize our officials to replace the winter stores. The competing request is to reorganize the exposed patrol routes. The patrol sent to observe him has returned after losing his trail beyond its accustomed routes."
 war_adventurer_gor_rok.17.option_a:0 "Replace the equipment"
 war_adventurer_gor_rok.17.option_b:0 "Relocate the work crews"
 war_adventurer_gor_rok.17.option_c:0 "Leave the quarry closed"
 war_adventurer_gor_rok.17.t:0 "The Stone the Quarry Would Not Yield"
 war_adventurer_gor_rok.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the mighty albino Saurus warrior Gor-Rok. Our quarry overseer reports that Gor-Rok destroyed the lifting equipment around an inscribed foundation.\n\nHeavy guards failed to shift him until labourers fled with several recovered tablets. The remaining quarry crews refuse to approach the broken lifting frame until officials explain whether the excavation will continue.\n\nWe could authorize our officials to replace the equipment. The competing request is to relocate the work crews. The white Saurus has left the officials behind and resumed his silent march."
 war_adventurer_gor_rok.18.option_a:0 "Replace the district's security"
 war_adventurer_gor_rok.18.option_b:0 "Reconstruct the missing labour records"
 war_adventurer_gor_rok.18.option_c:0 "Abandon the damaged yard"
 war_adventurer_gor_rok.18.t:0 "The Foreign Champion's Fallen Mount"
 war_adventurer_gor_rok.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the mighty albino Saurus warrior Gor-Rok. Our governor reports that Gor-Rok slew the winged beast used to intimidate a labour district and then killed its rider. The workers have scattered with the district's tools and records. The workers' missing records include both equipment inventories and the orders authorizing the beast's use against their district.\n\nWe could authorize our officials to replace the district's security. The competing request is to reconstruct the missing labour records. No interpreter has persuaded Gor-Rok to remain while the court considers the report."
 war_adventurer_gor_rok.19.option_a:0 "Pay for the soldiers' recovery"
 war_adventurer_gor_rok.19.option_b:0 "Revise their tactical training"
 war_adventurer_gor_rok.19.option_c:0 "Dismiss the failed spectacle"
 war_adventurer_gor_rok.19.t:0 "The Demonstration of Heavy Troops"
 war_adventurer_gor_rok.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the mighty albino Saurus warrior Gor-Rok. Our marshal reports that a public charge intended to capture Gor-Rok ended with the attackers thrown back. Witnesses saw him hold his ground until a group of detained excavators escaped behind him. The marshal has collected the damaged shields, but the crowd remembers the unmoved Saurus more vividly than the soldiers' injuries.\n\nWe could authorize our officials to pay for the soldiers' recovery. The competing request is to revise their tactical training. The last scouts saw the guardian moving away from the recovered site with no sign of accepting an escort."
 war_adventurer_gor_rok.20.option_a:0 "Repair the vault and its guards"
 war_adventurer_gor_rok.20.option_b:0 "Investigate the failed guardian"
 war_adventurer_gor_rok.20.option_c:0 "Seal the ruined galleries"
 war_adventurer_gor_rok.20.t:0 "The Relic Behind the Daemon"
 war_adventurer_gor_rok.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the mighty albino Saurus warrior Gor-Rok. Our keeper reports that Gor-Rok endured the bound guardian's blows, broke its controlling frame, and carried a confiscated relic out of the vault. The remaining exhibits lie beneath collapsed masonry. The vault keeper can identify the missing relic, although collapsed masonry still prevents a full count of the other losses.\n\nWe could authorize our officials to repair the vault and its guards. The competing request is to investigate the failed guardian. Gor-Rok appears to consider his task complete, whatever remains for our administration to settle."
 war_adventurer_gor_rok.21.t:0 "Gor-Rok has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_gor_rok.21.d:0 "Witnesses in [war_adventurer_arrival_province.GetName] report the arrival of the mighty albino Saurus warrior Gor-Rok. The newcomer carries a battered shield and has been identified as the Great White Lizard of Itza.\n\nGor-Rok is an ancient warrior renowned for standing his ground against overwhelming attacks. His campaigns have made him a formidable guardian of the Lizardmen's cities and sacred relics, though his present purpose remains unexplained."
 war_adventurer_nakai:0 "Nakai the Wanderer, Adventurer"
 desc_war_adventurer_nakai:0 "Enormous tracks lead toward old ruins, where witnesses report a Kroxigor looming over stones half buried by the years. Skink travelers name him Nakai, the wanderer said to have held Itza's Bridge of Stars against the daemonic host. His unexplained arrival has prompted hurried repairs to gates and barricades, while carts and crowds detour around his chosen path."
 war_adventurer_nakai.1.option_a:0 "Rebuild the crossing and train its guards"
 war_adventurer_nakai.1.option_b:0 "Train the defenders from the battle account"
 war_adventurer_nakai.1.option_c:0 "Restore the interrupted supply route"
 war_adventurer_nakai.1.t:0 "The Crossing Before the Alarm"
 war_adventurer_nakai.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the towering reptilian guardian Nakai the Wanderer. Our river warden reports that Nakai held a crossing against a daemonic incursion before the alarm reached the nearest temple.\n\nAttendants compare the piled remains with stories of the Bridge of Stars, while the surviving defenders await instructions. The defenders have stacked the recovered equipment beside the damaged crossing and marked the span that must be rebuilt before wagons return.\n\nOur officials ask us to rebuild the crossing and train its guards. Others argue that we should instead train the defenders from the battle account. Nakai has resumed his wandering, leaving no explanation of his next destination."
 war_adventurer_nakai.2.option_a:0 "Publicly honour the recovered stores’ rightful owners"
 war_adventurer_nakai.2.option_b:0 "Provision the temple watch"
 war_adventurer_nakai.2.option_c:0 "Publish the testimony as an account of the temple’s rescue"
 war_adventurer_nakai.2.t:0 "The Temple that Sent No Messenger"
 war_adventurer_nakai.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the towering reptilian guardian Nakai the Wanderer. Our liaison reports that Nakai arrived at a threatened temple before its trapped custodians could send for help. He broke the attackers and vanished, leaving the custodians disputing which endangered storehouse should receive the recovered supplies. The custodians have submitted separate inventories of the recovered supplies, revealing how little remained in several of the threatened storehouses.\n\nOur officials ask us to publicly honour the recovered stores’ rightful owners. Others argue that we should instead provision the temple watch. The giant's tracks lead away from the site, and no official has persuaded him to stay."
 war_adventurer_nakai.3.option_a:0 "Map the safe route"
 war_adventurer_nakai.3.option_b:0 "Teach the surviving procession guards to train others"
 war_adventurer_nakai.3.option_c:0 "Honour the rescued custodians"
 war_adventurer_nakai.3.t:0 "The Procession Returned at Dawn"
 war_adventurer_nakai.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the towering reptilian guardian Nakai the Wanderer. Our patrol reports that a missing group of temple attendants returned behind Nakai with their relics intact. He led them around a concealed ambush, then walked away without accepting their offered escort. The rescued attendants have sketched the bypass they followed, giving the patrols a route that avoids the concealed ambush position.\n\nOur officials ask us to map the safe route. Others argue that we should instead teach the surviving procession guards to train others. The custodians found that their unexpected guardian had departed before they could prepare an escort."
 war_adventurer_nakai.4.option_a:0 "Repair and reopen the route"
 war_adventurer_nakai.4.option_b:0 "Train guards to exploit the crossing’s defensive advantage"
 war_adventurer_nakai.4.option_c:0 "Record the observed reaction"
 war_adventurer_nakai.4.t:0 "The Bridge Nobody Would Approach"
 war_adventurer_nakai.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the towering reptilian guardian Nakai the Wanderer. Our scouts report that hostile summoned creatures recoiled from a crossing after Nakai's defence of it. The effect recalls the Bridge of Stars' dread reputation, but engineers caution that the shattered roadway still needs repair. The scouts' account records the creatures' hesitation, while the engineers' accompanying drawing makes the broken road's immediate danger equally plain.\n\nOur officials ask us to repair and reopen the route. Others argue that we should instead train guards to exploit the crossing’s defensive advantage. Scouts following Nakai turned back after his trail left the roads they knew."
 war_adventurer_nakai.5.option_a:0 "Train a disciplined watch for the recovered site"
 war_adventurer_nakai.5.option_b:0 "Catalogue its surviving records"
 war_adventurer_nakai.5.option_c:0 "Help its displaced workers return"
 war_adventurer_nakai.5.t:0 "The Watch Left Behind"
 war_adventurer_nakai.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the towering reptilian guardian Nakai the Wanderer. Our temple officer reports that Nakai drove raiders from a neglected site and remained until local guardians returned.\n\nHe has since disappeared, leaving our administration to sustain the recovered position. The returning guardians have found records and usable tools inside the recovered enclosure, but lack the means to maintain its watch alone.\n\nOur officials ask us to train a disciplined watch for the recovered site. Others argue that we should instead catalogue its surviving records. His sudden departure offers as little explanation as his arrival."
 war_adventurer_nakai.6.option_a:0 "Survey the shrine"
 war_adventurer_nakai.6.option_b:0 "Recognize the custodians' protection"
 war_adventurer_nakai.6.option_c:0 "Use recovered supplies for the settlement"
 war_adventurer_nakai.6.t:0 "The Shrine Beyond the Black Forest"
 war_adventurer_nakai.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the towering reptilian guardian Nakai the Wanderer. Our governor reports that Nakai destroyed raiders occupying a forgotten shrine in unfamiliar woodland. Its local custodians believe the site predates their settlement; his interest is unexplained, and he has moved on. The custodians have identified old foundations beneath the raiders' camp and carefully separated recovered objects from ordinary plunder.\n\nThe council proposes that we survey the shrine. A second proposal would have us recognize the custodians' protection. Nakai has resumed his wandering, leaving no explanation of his next destination."
 war_adventurer_nakai.7.option_a:0 "Examine the stones"
 war_adventurer_nakai.7.option_b:0 "Rebuild the causeway and train its guards"
 war_adventurer_nakai.7.option_c:0 "Settle rescued workers near the route"
 war_adventurer_nakai.7.t:0 "The Causeway Through the Mist"
 war_adventurer_nakai.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the towering reptilian guardian Nakai the Wanderer. Our frontier officer reports that Nakai held a mist-covered causeway long enough for an archaeological party to escape with inscribed stones. The survivors believe the abandoned enclosure beyond it could support a protected settlement. The rescued party has numbered the stones and recorded their original positions before the causeway disappears beneath the mist again.\n\nThe council proposes that we examine the stones. A second proposal would have us rebuild the causeway and train its guards. The giant's tracks lead away from the site, and no official has persuaded him to stay."
 war_adventurer_nakai.8.option_a:0 "Maintain a survey station"
 war_adventurer_nakai.8.option_b:0 "Train a permanent patrol around the sheltered camp"
 war_adventurer_nakai.8.option_c:0 "Reopen the nearby caravan route"
 war_adventurer_nakai.8.t:0 "The Camp Built Around His Tracks"
 war_adventurer_nakai.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the towering reptilian guardian Nakai the Wanderer. Our surveyors report that Nakai cleared raiders from a ruined enclosure and lingered until a defensible camp had been established. He departed without claiming it, leaving our officials to decide the camp's purpose. The surveyors' first plan marks sheltered storage, an old well, and a defensible entrance that could support a lasting outpost.\n\nThe council proposes that we maintain a survey station. A second proposal would have us train a permanent patrol around the sheltered camp. The custodians found that their unexpected guardian had departed before they could prepare an escort."
 war_adventurer_nakai.9.option_a:0 "Repair the crossing and nearby homes"
 war_adventurer_nakai.9.option_b:0 "Recruit willing survivors for rescue patrols"
 war_adventurer_nakai.9.option_c:0 "Record the defenders' methods"
 war_adventurer_nakai.9.t:0 "The Giant in the Floodwater"
 war_adventurer_nakai.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the towering reptilian guardian Nakai the Wanderer. Our river officer reports that Nakai held a damaged crossing while travellers escaped an attack during a flood.\n\nHis timely arrival has become a popular tale, although none of the witnesses knows where he went afterward. The travellers have brought salvaged goods to the river office while officers count the households left without a safe crossing.\n\nThe council proposes that we repair the crossing and nearby homes. A second proposal would have us recruit willing survivors for rescue patrols. Scouts following Nakai turned back after his trail left the roads they knew."
 war_adventurer_nakai.10.option_a:0 "Offer a temporary scholarly refuge"
 war_adventurer_nakai.10.option_b:0 "Return the tablets under official protection"
 war_adventurer_nakai.10.option_c:0 "Prosecute the trafficker's surviving records"
 war_adventurer_nakai.10.t:0 "The Tablets on the Governor's Steps"
 war_adventurer_nakai.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the towering reptilian guardian Nakai the Wanderer. Our governor reports that Nakai left recovered tablets beside the provincial office after breaking a relic trafficker's camp. Several displaced custodians followed him to the town and now seek a protected place to study them. The displaced custodians have copied several inscriptions onto temporary boards, fearing that their recovered tablets may be seized again.\n\nThe council proposes that we offer a temporary scholarly refuge. A second proposal would have us return the tablets under official protection. His sudden departure offers as little explanation as his arrival."
 war_adventurer_nakai.11.option_a:0 "Replace the column's equipment"
 war_adventurer_nakai.11.option_b:0 "Reorganize its route and command"
 war_adventurer_nakai.11.option_c:0 "Abandon the battered approach"
 war_adventurer_nakai.11.t:0 "The Invasion Stopped at the Bridge"
 war_adventurer_nakai.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the towering reptilian guardian Nakai the Wanderer. Our commander reports that Nakai shattered the leading units of an invasion column at a temple crossing. Surviving scouts refuse to follow the same approach, recalling the ancient stories of Itza. The surviving scouts have marked the failed crossing in their reports and demand a different route before the invasion resumes.\n\nOne course would be to replace the column's equipment. Alternatively, we could reorganize its route and command. Nakai has resumed his wandering, leaving no explanation of his next destination."
 war_adventurer_nakai.12.option_a:0 "Replace the damaged equipment"
 war_adventurer_nakai.12.option_b:0 "Review the occupation's security"
 war_adventurer_nakai.12.option_c:0 "Admit the garrison's failure"
 war_adventurer_nakai.12.t:0 "The Garrison's Unannounced Visitor"
 war_adventurer_nakai.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the towering reptilian guardian Nakai the Wanderer. Our occupation officer reports that Nakai entered a poorly guarded shrine compound and broke open its holding pens. The captives dispersed while he destroyed the equipment intended to restrain them. The abandoned holding pens contain broken restraints and an inventory naming captives who can no longer be found.\n\nOne course would be to replace the damaged equipment. Alternatively, we could review the occupation's security. The giant's tracks lead away from the site, and no official has persuaded him to stay."
 war_adventurer_nakai.13.option_a:0 "Replace the escort and transport"
 war_adventurer_nakai.13.option_b:0 "Investigate the information leak"
 war_adventurer_nakai.13.option_c:0 "Deny the trophies' importance"
 war_adventurer_nakai.13.t:0 "The Relics Gone Before Dawn"
 war_adventurer_nakai.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the towering reptilian guardian Nakai the Wanderer. Our keeper reports that Nakai recovered confiscated temple objects and escorted their custodians into the jungle.\n\nHe appeared before the scheduled transfer, although its route had been disclosed only to senior officials. The surviving transfer orders bear senior officials' seals, making the unexplained warning to the intruder particularly embarrassing.\n\nOne course would be to replace the escort and transport. Alternatively, we could investigate the information leak. The custodians found that their unexpected guardian had departed before they could prepare an escort."
 war_adventurer_nakai.14.option_a:0 "Replace the apparatus and landing"
 war_adventurer_nakai.14.option_b:0 "Abandon the summoned formation"
 war_adventurer_nakai.14.option_c:0 "Leave the site sealed"
 war_adventurer_nakai.14.t:0 "The Daemons at the Water's Edge"
 war_adventurer_nakai.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the towering reptilian guardian Nakai the Wanderer. Our ritual commander reports that summoned troops faltered at the crossing Nakai defended, allowing its captives to escape. The subsequent fighting wrecked the control apparatus and our supply landing. The commander has recovered parts of the apparatus, but the attendants refuse to summon another formation beside the same crossing.\n\nOne course would be to replace the apparatus and landing. Alternatively, we could abandon the summoned formation. Scouts following Nakai turned back after his trail left the roads they knew."
 war_adventurer_nakai.15.option_a:0 "Replace the expedition's tools"
 war_adventurer_nakai.15.option_b:0 "Reconstruct its lost surveys"
 war_adventurer_nakai.15.option_c:0 "Relinquish the position and its prestige"
 war_adventurer_nakai.15.t:0 "The Ruin Reoccupied Without Us"
 war_adventurer_nakai.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the towering reptilian guardian Nakai the Wanderer. Our surveyor reports that Nakai drove our labour guard from a sacred enclosure and remained until its former custodians returned. Our stored tools and maps have been taken inside the renewed defences. The returned custodians have raised a barricade with timber taken from the abandoned survey camp, using the expedition's supplies against it.\n\nOne course would be to replace the expedition's tools. Alternatively, we could reconstruct its lost surveys. His sudden departure offers as little explanation as his arrival."
 war_adventurer_nakai.16.option_a:0 "Replace the compound's equipment"
 war_adventurer_nakai.16.option_b:0 "Reorganize the exposed frontier administration"
 war_adventurer_nakai.16.option_c:0 "Abandon the damaged site"
 war_adventurer_nakai.16.t:0 "The Shrine Beneath the Slave Camp"
 war_adventurer_nakai.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the towering reptilian guardian Nakai the Wanderer. Our overseer reports that Nakai demolished a camp built over ancient foundations and carried recovered carvings away. The captives followed him beyond the patrol perimeter. The broken camp foundations expose the carved stonework beneath them, giving witnesses a visible explanation for the giant's intervention.\n\nOur advisers recommend that we replace the compound's equipment. There is also a proposal to reorganize the exposed frontier administration. Nakai has resumed his wandering, leaving no explanation of his next destination."
 war_adventurer_nakai.17.option_a:0 "Replace the lost stores"
 war_adventurer_nakai.17.option_b:0 "Reorganize the escort doctrine"
 war_adventurer_nakai.17.option_c:0 "Requisition the river settlements"
 war_adventurer_nakai.17.t:0 "The Foreign Bridge's Broken Column"
 war_adventurer_nakai.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the towering reptilian guardian Nakai the Wanderer. Our commander reports that Nakai stood across a narrow bridge and broke the convoy attempting to cross it.\n\nCaptive labourers escaped during the struggle, leaving our stores scattered in the river. The quartermaster has recovered floating ration sacks downstream, but most of the convoy's stores remain beyond the exhausted guards' reach.\n\nOur advisers recommend that we replace the lost stores. There is also a proposal to reorganize the escort doctrine. The giant's tracks lead away from the site, and no official has persuaded him to stay."
 war_adventurer_nakai.18.option_a:0 "Compensate the requisition party"
 war_adventurer_nakai.18.option_b:0 "Revise the district's collection arrangements"
 war_adventurer_nakai.18.option_c:0 "Accept the public defiance"
 war_adventurer_nakai.18.t:0 "The Settlement He Would Not Leave"
 war_adventurer_nakai.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the towering reptilian guardian Nakai the Wanderer. Our governor reports that Nakai drove an armed requisition party out of a small settlement beside an ancient ruin. He stayed until its inhabitants had repaired a barricade, then disappeared into unfamiliar country. The settlement's repaired barricade now blocks the collection route, and the dismissed requisition party has returned with empty wagons.\n\nOur advisers recommend that we compensate the requisition party. There is also a proposal to revise the district's collection arrangements. The custodians found that their unexpected guardian had departed before they could prepare an escort."
 war_adventurer_nakai.19.option_a:0 "Replace the collector's equipment"
 war_adventurer_nakai.19.option_b:0 "Investigate the failed expedition"
 war_adventurer_nakai.19.option_c:0 "Disown the spectacle"
 war_adventurer_nakai.19.t:0 "The Monster Hunter's Empty Cage"
 war_adventurer_nakai.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the towering reptilian guardian Nakai the Wanderer. Our collector reports that an attempt to trap Nakai for a court menagerie ended with broken cages and released prisoners. The tracks lead toward a threatened shrine well beyond our scouts' usual routes. The collector's surviving assistants brought back the trap plans, making it clear how badly they underestimated the creature they meant to display.\n\nOur advisers recommend that we replace the collector's equipment. There is also a proposal to investigate the failed expedition. Scouts following Nakai turned back after his trail left the roads they knew."
 war_adventurer_nakai.20.option_a:0 "Replace the expedition and its stores"
 war_adventurer_nakai.20.option_b:0 "Reconstruct the missing research"
 war_adventurer_nakai.20.option_c:0 "Abandon the shattered outpost"
 war_adventurer_nakai.20.t:0 "The Tablets Beyond the Frontier"
 war_adventurer_nakai.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the towering reptilian guardian Nakai the Wanderer. Our expedition leader reports that Nakai overran a fortified excavation and escorted its coerced interpreters away with the sacred tablets. Their departure leaves our planned outpost without its records, workers, or defensible entrance. The remaining expedition staff cannot read the few inscriptions left behind without the interpreters who escaped with their guardian.\n\nOur advisers recommend that we replace the expedition and its stores. There is also a proposal to reconstruct the missing research. His sudden departure offers as little explanation as his arrival."
 war_adventurer_nakai.21.t:0 "Nakai the Wanderer has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_nakai.21.d:0 "Reports from [war_adventurer_arrival_province.GetName] identify a visitor among the old ruins as the towering reptilian guardian Nakai the Wanderer. Skink travelers recognize him as an ancient Kroxigor, one of the immense creatures that fight for the Lizardmen.\n\nHe is remembered for holding Itza's Bridge of Stars against daemons during the Great Catastrophe. He appears where danger threatens the remnants of the Old Ones' works, then resumes his wandering without explanation."
 war_adventurer_thanquol:0 "Thanquol and Boneripper, Adventurer"
 desc_war_adventurer_thanquol:0 "Thanquol and Boneripper are concealed somewhere beneath the province, judging by the sudden demand for warpstone and the size of the broken doors. The Grey Seer's extravagant schemes keep smugglers busy, while his Rat Ogre bodyguard gives reluctant suppliers a reason to deliver. They leave rival informants, frightened witnesses, and unpaid accounts for the authorities to untangle."
 war_adventurer_thanquol.1.option_a:0 "Confiscate the recovered goods"
 war_adventurer_thanquol.1.option_b:0 "Study the exposed conspiracy"
 war_adventurer_thanquol.1.option_c:0 "Announce the plot's defeat while omitting his excesses"
 war_adventurer_thanquol.1.t:0 "The Triumph in the Wrong Sewer"
 war_adventurer_thanquol.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Thanquol's courier claims he destroyed a traitorous rival's plague laboratory.\n\nOur own inspectors confirm that his intended attack misfired, but the wreckage exposed stolen treasury goods and a genuine plot against our rule. The inspectors have placed the recovered treasury marks beside Thanquol's extravagant account, confirming a useful result without confirming his explanation.\n\nWe could authorize our officials to confiscate the recovered goods. The competing request is to study the exposed conspiracy. The Grey Seer's demand for recognition arrived after he and Boneripper had already moved on."
 war_adventurer_thanquol.2.option_a:0 "Recover the grain for the army"
 war_adventurer_thanquol.2.option_b:0 "Sell surplus stores"
 war_adventurer_thanquol.2.option_c:0 "Reconstruct the embezzlement network"
 war_adventurer_thanquol.2.option_d:0 "Let the inspector claim the discovery"
 war_adventurer_thanquol.2.t:0 "The Vermin that Found the Stores"
 war_adventurer_thanquol.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our granary inspector reports that Thanquol's engineered vermin escaped their handlers and uncovered a hidden cache of embezzled grain. His letter describes this accident as a flawless investigation. The concealed grain sacks still carry official inventory marks that the granary's accounts insist were lost months ago.\n\nWe could authorize our officials to recover the grain for the army. The competing request is to sell surplus stores. No official has managed to keep Thanquol in one place long enough to settle the disputed accounts."
 war_adventurer_thanquol.3.option_a:0 "Buy the engineer's reconstruction"
 war_adventurer_thanquol.3.option_b:0 "Use its measurements to train artillery crews"
 war_adventurer_thanquol.3.option_c:0 "Sell the valuable spare parts"
 war_adventurer_thanquol.3.t:0 "The Lonely Workshop's Stolen Gear"
 war_adventurer_thanquol.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our engineer reports that Thanquol returned from a raid on a foreign workshop with an unfamiliar rangefinder. Most of the stolen equipment was destroyed during his escape, but the surviving instrument can still be studied. The engineer has secured the rangefinder on a stable mount and recorded the first measurements before the Grey Seer can reclaim it.\n\nWe could authorize our officials to buy the engineer's reconstruction. The competing request is to use its measurements to train artillery crews. Thanquol has found another reason to travel, taking whichever Rat Ogre currently answers to Boneripper with him."
 war_adventurer_thanquol.4.option_a:0 "Study the sketches"
 war_adventurer_thanquol.4.option_b:0 "Recover the cargo for the treasury"
 war_adventurer_thanquol.4.option_c:0 "Train a specialist interception team"
 war_adventurer_thanquol.4.t:0 "The Airship that Was Almost Captured"
 war_adventurer_thanquol.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our tunnel commander reports that Thanquol's attempt to seize a passing experimental aircraft failed spectacularly. The retreat nevertheless left our forces with a dropped cargo crate and sketches of its ground crew's procedures. The crate's contents and the sketches agree about the aircraft's lifting system, making the failed capture less useless than its witnesses first assumed.\n\nWe could authorize our officials to study the sketches. The competing request is to recover the cargo for the treasury. The pair have slipped beyond the search parties, leaving their hosts to explain the damage and divide the surviving spoils."
 war_adventurer_thanquol.5.option_a:0 "Recover the supplier's illicit gains"
 war_adventurer_thanquol.5.option_b:0 "Retain the handlers' inspection method"
 war_adventurer_thanquol.5.option_c:0 "Equip the garrison from the seized stores"
 war_adventurer_thanquol.5.t:0 "Boneripper's Replacement Invoice"
 war_adventurer_thanquol.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our beast-handlers petition over a bill for a new Rat Ogre after Thanquol's previous bodyguard was destroyed.\n\nTheir inspection of the replacement exposed a supplier's fraud, and they have seized usable equipment from his pens. The seized harness and instruments have been checked against the supplier's invoices, revealing charges for equipment he never delivered.\n\nWe could authorize our officials to recover the supplier's illicit gains. The competing request is to retain the handlers' inspection method. Thanquol has departed with his bodyguard before the inspectors can compare his claims with the surviving evidence."
 war_adventurer_thanquol.6.option_a:0 "Exploit the correspondence"
 war_adventurer_thanquol.6.option_b:0 "Sell expendable secrets"
 war_adventurer_thanquol.6.option_c:0 "Train the enclave’s guards to detect similar infiltrators"
 war_adventurer_thanquol.6.t:0 "The Provincial Palace's Secret Pipe"
 war_adventurer_thanquol.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our provincial agent reports that Thanquol escaped a failed attempt on a foreign dignitary through an overlooked drain. He failed to kill his target but brought back correspondence revealing a plot against our nearby enclave. The captured correspondence identifies intermediaries already trading with the enclave, allowing its officers to act before the plot develops further.\n\nOur officials ask us to exploit the correspondence. Others argue that we should instead sell expendable secrets. The Grey Seer's demand for recognition arrived after he and Boneripper had already moved on."
 war_adventurer_thanquol.7.option_a:0 "Seize the safe merchandise"
 war_adventurer_thanquol.7.option_b:0 "Map the concealed route"
 war_adventurer_thanquol.7.option_c:0 "Use the evidence to settle internal disputes"
 war_adventurer_thanquol.7.t:0 "The Plague Shipment's Useful Mistake"
 war_adventurer_thanquol.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our customs agent reports that a diseased shipment intended for an enemy instead exposed a rival supplier's concealed route. Thanquol blames the error on a subordinate; the route records and untainted goods are now in our custody. The customs agent has separated the untainted merchandise from the diseased cargo and copied the route markings for the provincial office.\n\nOur officials ask us to seize the safe merchandise. Others argue that we should instead map the concealed route. No official has managed to keep Thanquol in one place long enough to settle the disputed accounts."
 war_adventurer_thanquol.8.option_a:0 "Fund a reconstruction"
 war_adventurer_thanquol.8.option_b:0 "Adapt the mechanism for local works"
 war_adventurer_thanquol.8.option_c:0 "Sell copies to selected buyers"
 war_adventurer_thanquol.8.t:0 "The Workshop Plans in Three Pieces"
 war_adventurer_thanquol.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our frontier engineer reports that Thanquol and Boneripper escaped a raid on a Dwarf workshop with fragments of its machinery plans. Boneripper tore the papers during the retreat, but enough remains to identify a useful mechanism. The engineer has pinned the torn sheets together and identified enough matching measurements to attempt a careful reconstruction.\n\nOur officials ask us to fund a reconstruction. Others argue that we should instead adapt the mechanism for local works. Thanquol has found another reason to travel, taking whichever Rat Ogre currently answers to Boneripper with him."
 war_adventurer_thanquol.9.option_a:0 "Study the lifting apparatus"
 war_adventurer_thanquol.9.option_b:0 "Train handlers on the captured winch"
 war_adventurer_thanquol.9.option_c:0 "Sell the valuable machinery"
 war_adventurer_thanquol.9.t:0 "The Captured Ground Crew"
 war_adventurer_thanquol.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our agent reports that Thanquol failed to take an experimental flying machine but returned with its abandoned winch and ground instructions.\n\nHis demand for a victory celebration arrives before the quieter report of his retreat. The recovered winch still bears the crew's numbered loading marks, giving local handlers practical instructions despite the failed seizure.\n\nOur officials ask us to study the lifting apparatus. Others argue that we should instead train handlers on the captured winch. The pair have slipped beyond the search parties, leaving their hosts to explain the damage and divide the surviving spoils."
 war_adventurer_thanquol.10.option_a:0 "Confiscate the contraband"
 war_adventurer_thanquol.10.option_b:0 "Investigate the officials"
 war_adventurer_thanquol.10.option_c:0 "Supply the border guard from the stores"
 war_adventurer_thanquol.10.t:0 "The Ogre That Broke the Smugglers"
 war_adventurer_thanquol.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our provincial officer reports that Thanquol's newly acquired Boneripper smashed a smuggling depot while pursuing a debtor. The Grey Seer escaped an ensuing fire, leaving seized contraband and enough records to identify corrupt officials. Several contraband cases remain sealed, while the recovered account book names officials who accepted payments to overlook the depot.\n\nOur officials ask us to confiscate the contraband. Others argue that we should instead investigate the officials. Thanquol has departed with his bodyguard before the inspectors can compare his claims with the surviving evidence."
 war_adventurer_thanquol.11.option_a:0 "Replace the supplies and fund relief"
 war_adventurer_thanquol.11.option_b:0 "Redeploy workers to containment"
 war_adventurer_thanquol.11.option_c:0 "Seal the damaged district"
 war_adventurer_thanquol.11.t:0 "The Fever Beneath the Occupation"
 war_adventurer_thanquol.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our district physician reports that Thanquol contaminated a supply conduit beneath the occupied tunnels. His own followers also suffered, but he escaped while our workers struggled to isolate the affected stores. The physicians have traced the contaminated conduit to stores already promised to work crews elsewhere in the occupied district.\n\nThe council proposes that we replace the supplies and fund relief. A second proposal would have us redeploy workers to containment. The Grey Seer's demand for recognition arrived after he and Boneripper had already moved on."
 war_adventurer_thanquol.12.option_a:0 "Replace the lost grain"
 war_adventurer_thanquol.12.option_b:0 "Reorganize supply security"
 war_adventurer_thanquol.12.option_c:0 "Requisition nearby districts"
 war_adventurer_thanquol.12.t:0 "The Granary Full of Teeth"
 war_adventurer_thanquol.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our quartermaster reports that engineered vermin burst into an occupied tunnel granary. Boneripper broke the cordon during the confusion and carried Thanquol away, leaving scattered grain and panicked labourers. The quartermaster has sealed the remaining grain, but the ruined sacks and frightened labourers make an ordinary issue impossible.\n\nThe council proposes that we replace the lost grain. A second proposal would have us reorganize supply security. No official has managed to keep Thanquol in one place long enough to settle the disputed accounts."
 war_adventurer_thanquol.13.option_a:0 "Hire replacements and secure the workshop"
 war_adventurer_thanquol.13.option_b:0 "Reconstruct the missing research"
 war_adventurer_thanquol.13.option_c:0 "Conceal the failed protection"
 war_adventurer_thanquol.13.t:0 "The Engineer's Missing Night Shift"
 war_adventurer_thanquol.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our engineer reports that Thanquol raided a military workshop beneath the occupied city.\n\nHe failed to seize its main engine but escaped with technical notes and several frightened specialists. The workshop's surviving staff can identify the stolen notes, yet lack the specialists needed to reconstruct their missing calculations quickly.\n\nThe council proposes that we hire replacements and secure the workshop. A second proposal would have us reconstruct the missing research. Thanquol has found another reason to travel, taking whichever Rat Ogre currently answers to Boneripper with him."
 war_adventurer_thanquol.14.option_a:0 "Repair the loading equipment"
 war_adventurer_thanquol.14.option_b:0 "Reroute the military deliveries"
 war_adventurer_thanquol.14.option_c:0 "Announce the attempted theft without admitting the damage"
 war_adventurer_thanquol.14.t:0 "The Landing Stage's Broken Winch"
 war_adventurer_thanquol.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our commander reports that Thanquol tried to steal a supply aircraft from an underground staging shaft. The attempt failed, but Boneripper wrecked the winch while opening their escape route. The damaged winch has left military cargo suspended above the staging floor, where it obstructs every attempt to resume deliveries.\n\nThe council proposes that we repair the loading equipment. A second proposal would have us reroute the military deliveries. The pair have slipped beyond the search parties, leaving their hosts to explain the damage and divide the surviving spoils."
 war_adventurer_thanquol.15.option_a:0 "Replace the damaged guard equipment"
 war_adventurer_thanquol.15.option_b:0 "Revise identification and pursuit orders"
 war_adventurer_thanquol.15.option_c:0 "Admit the premature victory announcement"
 war_adventurer_thanquol.15.t:0 "The Bodyguard We Already Killed"
 war_adventurer_thanquol.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our governor reports that a new Rat Ogre calling forth the same terrified cries of Boneripper broke Thanquol out of an inspection cordon. The previous creature's corpse remains in our custody; the guards had mistaken its death for the Grey Seer's defeat. The governor's earlier victory notice is still posted in the market beside fresh descriptions of a different Rat Ogre bearing the same name.\n\nThe council proposes that we replace the damaged guard equipment. A second proposal would have us revise identification and pursuit orders. Thanquol has departed with his bodyguard before the inspectors can compare his claims with the surviving evidence."
 war_adventurer_thanquol.16.option_a:0 "Repair the residence and records"
 war_adventurer_thanquol.16.option_b:0 "Purge compromised access arrangements"
 war_adventurer_thanquol.16.option_c:0 "Acknowledge the security scandal"
 war_adventurer_thanquol.16.t:0 "The Governor Survived the Sewer Plot"
 war_adventurer_thanquol.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our chamberlain reports that Thanquol reached the provincial residence through its drains but failed to murder the governor. He escaped with Boneripper after wrecking the treasury office and setting rival agents against one another. The treasury clerks have recovered fragments of the raiders' orders, which reveal competing instructions as well as the residence's failed security.\n\nOne course would be to repair the residence and records. Alternatively, we could purge compromised access arrangements. The Grey Seer's demand for recognition arrived after he and Boneripper had already moved on."
 war_adventurer_thanquol.17.option_a:0 "Replace the food and support treatment"
 war_adventurer_thanquol.17.option_b:0 "Organize emergency distribution"
 war_adventurer_thanquol.17.option_c:0 "Isolate the district and accept disruption"
 war_adventurer_thanquol.17.t:0 "The Plague that Spoiled His Own Plan"
 war_adventurer_thanquol.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our physician reports that Thanquol's contaminated stores sickened his own attackers before they reached their objective.\n\nTheir retreat still left our food reserves unusable and workers tending the affected district. The contaminated sacks can be identified by their delivery marks, but several were opened before the physicians reached the stores.\n\nOne course would be to replace the food and support treatment. Alternatively, we could organize emergency distribution. No official has managed to keep Thanquol in one place long enough to settle the disputed accounts."
 war_adventurer_thanquol.18.option_a:0 "Replace the rangefinder and gantry"
 war_adventurer_thanquol.18.option_b:0 "Revise vulnerable weapon settings"
 war_adventurer_thanquol.18.option_c:0 "Suppress the embarrassing theft"
 war_adventurer_thanquol.18.t:0 "The Tower's Stolen Rangefinder"
 war_adventurer_thanquol.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our engineer reports that Thanquol's raid failed to capture a fortified workshop, but the attackers escaped with a rangefinder and fragments of its drawings. Boneripper tore down a gantry to cover their retreat. The surviving engineers have listed the exposed measurements so that officers can judge which weapon settings must now be changed.\n\nOne course would be to replace the rangefinder and gantry. Alternatively, we could revise vulnerable weapon settings. Thanquol has found another reason to travel, taking whichever Rat Ogre currently answers to Boneripper with him."
 war_adventurer_thanquol.19.option_a:0 "Replace the landing equipment"
 war_adventurer_thanquol.19.option_b:0 "Reorganize military transport"
 war_adventurer_thanquol.19.option_c:0 "Leave the ruined yard closed"
 war_adventurer_thanquol.19.t:0 "The Airship He Could Not Keep"
 war_adventurer_thanquol.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our air-transport officer reports that Thanquol briefly seized a grounded experimental craft but lost it when its crew cut the moorings. His escape wrecked the landing equipment and scattered military cargo across the district. The ground crew recovered the craft, but the broken moorings and scattered stores leave the landing yard unusable without substantial work.\n\nOne course would be to replace the landing equipment. Alternatively, we could reorganize military transport. The pair have slipped beyond the search parties, leaving their hosts to explain the damage and divide the surviving spoils."
 war_adventurer_thanquol.20.option_a:0 "Compensate the traders"
 war_adventurer_thanquol.20.option_b:0 "Revise the pursuit instructions"
 war_adventurer_thanquol.20.option_c:0 "Let the damaged market recover without official aid"
 war_adventurer_thanquol.20.t:0 "The Replacement in the Market Square"
 war_adventurer_thanquol.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our watch reports that Thanquol used a newly acquired Rat Ogre to break an arrest cordon and escape through a busy market. Witnesses disagree over whether Boneripper had mechanical fittings, scars, or both; several stalls lie crushed. The traders' claims include crushed shutters and broken weighing tables, providing a precise account of damage the watch would rather minimize.\n\nOne course would be to compensate the traders. Alternatively, we could revise the pursuit instructions. Thanquol has departed with his bodyguard before the inspectors can compare his claims with the surviving evidence."
 war_adventurer_thanquol.21.t:0 "Thanquol and Boneripper have arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_thanquol.21.d:0 "Our informants report that the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper have entered [war_adventurer_arrival_province.GetName]. Witnesses saw a horned ratman and his hulking protector slipping through concealed passages.\n\nThanquol is a Grey Seer whose sorcery, ambition, and appetite for warpstone are matched by his talent for blaming others when his schemes fail. Boneripper is the name he gives his monstrous bodyguard, whose strength supplies the persuasion his boasts cannot."
 war_adventurer_grombrindal:0 "Grombrindal, Adventurer"
 desc_war_adventurer_grombrindal:0 "Travelers insist that a white-bearded Dwarf has appeared wherever the province's fighting is fiercest, only to vanish before anyone can thank him. Tales of Grombrindal's impossible rescues stiffen the defenders' resolve and bring curious visitors to the taverns. They also awaken old grudges, as Dwarfs demand to know whose broken oaths required the White Dwarf's intervention."
 war_adventurer_grombrindal.1.option_a:0 "Train the militia from the account"
 war_adventurer_grombrindal.1.option_b:0 "Restore the saved district"
 war_adventurer_grombrindal.1.option_c:0 "Honour the surviving defenders"
 war_adventurer_grombrindal.1.t:0 "Umthi's Story at the Barricade"
 war_adventurer_grombrindal.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our hold captain reports that a white-bearded stranger rallied defenders surrounded by raiders and led their counterattack.\n\nBy the time the survivors sought him, he was gone; their testimony closely recalls Umthi the Damned's saga. The surviving captain has recorded the defenders' renewed formation and the wounded they carried out during the counterattack.\n\nOur advisers recommend that we train the militia from the account. There is also a proposal to restore the saved district. Grombrindal has left the people he aided to fulfil their own obligations and continued his mysterious wandering."
 war_adventurer_grombrindal.2.option_a:0 "Fund a public distribution to the distressed families"
 war_adventurer_grombrindal.2.option_b:0 "Preserve the recovered account"
 war_adventurer_grombrindal.2.option_c:0 "Commemorate the old pledge"
 war_adventurer_grombrindal.2.t:0 "The Three Names on the Old Tablet"
 war_adventurer_grombrindal.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our archivist reports that Grombrindal recovered an account of the stand at Karak Varn naming himself, the Dwarf Slayer Gotrek Gurnisson, and the Dwarf brewer Josef Bugman. He demanded that its promise of aid to endangered kin be honoured, then departed alone. The archivist has placed the recovered account beside the neglected relief records, making the old promise an obligation the court can examine.\n\nOur advisers recommend that we fund a public distribution to the distressed families. There is also a proposal to preserve the recovered account. No escort remains with the stranger, and his witnesses cannot agree on the road he took."
 war_adventurer_grombrindal.3.option_a:0 "Adopt the veterans' instruction"
 war_adventurer_grombrindal.3.option_b:0 "Restore the regiment's records"
 war_adventurer_grombrindal.3.option_c:0 "Celebrate the renewed oath"
 war_adventurer_grombrindal.3.t:0 "The Ancestor at the Muster"
 war_adventurer_grombrindal.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our muster officer reports that Grombrindal recognized an old regiment's forgotten oath and shamed its quarrelling veterans into helping new recruits. Some call him Snorri Whitebeard; the officer records that identification only as rumour. The veterans have reopened their drill book and begun correcting the recruits' footing while the muster officer verifies the old oath.\n\nOur advisers recommend that we adopt the veterans' instruction. There is also a proposal to restore the regiment's records. The last report ends with the White Dwarf's departure rather than a demand for land or office."
 war_adventurer_grombrindal.4.option_a:0 "Reopen the saved workings"
 war_adventurer_grombrindal.4.option_b:0 "Train the mine watch"
 war_adventurer_grombrindal.4.option_c:0 "Honour the rescuers with the recovered supplies"
 war_adventurer_grombrindal.4.t:0 "The Miners Beyond the Goblin Ring"
 war_adventurer_grombrindal.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our mine steward reports that Grombrindal broke through raiders surrounding a stranded work party. The miners fought their way out to him and returned with their tools, while their rescuer disappeared into another passage. The returned miners have counted their recovered tools and identified the blocked gallery that must be secured before work resumes.\n\nOur advisers recommend that we reopen the saved workings. There is also a proposal to train the mine watch. The white-bearded stranger vanished before the witnesses could arrange a formal audience."
 war_adventurer_grombrindal.5.option_a:0 "Honour the claim and reconcile the families"
 war_adventurer_grombrindal.5.option_b:0 "Preserve the testimony"
 war_adventurer_grombrindal.5.option_c:0 "Recognize the rescue pledge publicly"
 war_adventurer_grombrindal.5.t:0 "The Grudge He Would Not Let Us Forget"
 war_adventurer_grombrindal.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our clan judge reports that Grombrindal returned a stolen family heirloom and produced witnesses to an unfulfilled rescue pledge.\n\nHis warning echoed the obligation remembered from Karak Varn, leaving the court to settle the descendants' claims. The returned heirloom bears the family mark cited in the old claim, allowing the judge to connect the grievance with living petitioners.\n\nOur advisers recommend that we honour the claim and reconcile the families. There is also a proposal to preserve the testimony. The surviving officers found no trace of Grombrindal when they returned with the court's messenger."
 war_adventurer_grombrindal.6.option_a:0 "Restore the caravan route"
 war_adventurer_grombrindal.6.option_b:0 "Train escorts from the survivors' testimony"
 war_adventurer_grombrindal.6.option_c:0 "Recover duties on the rescued goods"
 war_adventurer_grombrindal.6.t:0 "The Caravan's White-Bearded Guard"
 war_adventurer_grombrindal.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our governor receives a caravan's account of a white-bearded Dwarf who broke a bandit encirclement, rallied its guards, and vanished before payment could be offered. The survivors have brought recovered trade goods to our customs house. The customs clerks have matched the recovered trade goods to the caravan's original declarations, preserving both property claims and outstanding duties.\n\nWe could authorize our officials to restore the caravan route. The competing request is to train escorts from the survivors' testimony. Grombrindal has left the people he aided to fulfil their own obligations and continued his mysterious wandering."
 war_adventurer_grombrindal.7.option_a:0 "Honour the shelter agreement"
 war_adventurer_grombrindal.7.option_b:0 "Authenticate the archive"
 war_adventurer_grombrindal.7.option_c:0 "Recognize the rescued community"
 war_adventurer_grombrindal.7.t:0 "The Agreement Older than the Province"
 war_adventurer_grombrindal.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our magistrate reports that Grombrindal recovered an old mutual-aid agreement from a raided archive and insisted that endangered settlers receive its promised shelter. Witnesses offer contradictory legends about the age of its bearer. The agreement names a shelter site still used by the settlement, giving the magistrate a practical way to honour its neglected terms.\n\nWe could authorize our officials to honour the shelter agreement. The competing request is to authenticate the archive. No escort remains with the stranger, and his witnesses cannot agree on the road he took."
 war_adventurer_grombrindal.8.option_a:0 "Fund the miners' return"
 war_adventurer_grombrindal.8.option_b:0 "Preserve their survey records"
 war_adventurer_grombrindal.8.option_c:0 "Employ willing survivors in local works"
 war_adventurer_grombrindal.8.t:0 "The Pledge Carried Far from Karak Varn"
 war_adventurer_grombrindal.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our border officer reports that Grombrindal rescued a mining party and left a copy of the pledge associated with his stand beside the Dwarf Slayer Gotrek Gurnisson and the Dwarf brewer Josef Bugman. The miners arrived with their survey records and a request for passage back to their kin. The rescued miners have brought survey records and their surviving tools, offering useful knowledge wherever they are permitted to settle.\n\nWe could authorize our officials to fund the miners' return. The competing request is to preserve their survey records. The last report ends with the White Dwarf's departure rather than a demand for land or office."
 war_adventurer_grombrindal.9.option_a:0 "Rebuild the gate and train its guards"
 war_adventurer_grombrindal.9.option_b:0 "Train the rallied garrison"
 war_adventurer_grombrindal.9.option_c:0 "Honour those who protected the civilians"
 war_adventurer_grombrindal.9.t:0 "The Foreign Fortress's Last Gate"
 war_adventurer_grombrindal.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our commander reports that Grombrindal held a gate while civilians and a trapped Dwarf detachment escaped.\n\nHis example rallied the remaining garrison, but he was gone before the relief force arrived. The relief commander found the rallied garrison still holding the inner yard, with the civilians sheltered behind its damaged gate.\n\nWe could authorize our officials to rebuild the gate and train its guards. The competing request is to train the rallied garrison. The white-bearded stranger vanished before the witnesses could arrange a formal audience."
 war_adventurer_grombrindal.10.option_a:0 "Recover the fraudulent fees"
 war_adventurer_grombrindal.10.option_b:0 "Secure the registry against further forgeries"
 war_adventurer_grombrindal.10.option_c:0 "Publish the victims' vindication"
 war_adventurer_grombrindal.10.t:0 "The King's Name He Never Claimed"
 war_adventurer_grombrindal.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our governor reports that a merchant tried to sell privileges supposedly granted by Snorri Whitebeard. Grombrindal exposed the fraud and returned the victims' seals, refusing to answer questions about his own identity. The returned seals match genuine registry entries, allowing officials to separate the merchant's forged privileges from the victims' lawful documents.\n\nWe could authorize our officials to recover the fraudulent fees. The competing request is to secure the registry against further forgeries. The surviving officers found no trace of Grombrindal when they returned with the court's messenger."
 war_adventurer_grombrindal.11.option_a:0 "Replace the lost siege stores"
 war_adventurer_grombrindal.11.option_b:0 "Revise the encirclement"
 war_adventurer_grombrindal.11.option_c:0 "Abandon the damaged siege position"
 war_adventurer_grombrindal.11.t:0 "The Encirclement Broken from Within"
 war_adventurer_grombrindal.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our siege officer reports that Grombrindal appeared among surrounded defenders and led them through our weakest position. The escaping force carried its wounded and stores away before our reserve could arrive. The abandoned siege stores show where the defenders broke through, while the reserve's late orders explain why the breach remained open.\n\nOur officials ask us to replace the lost siege stores. Others argue that we should instead revise the encirclement. Grombrindal has left the people he aided to fulfil their own obligations and continued his mysterious wandering."
 war_adventurer_grombrindal.12.option_a:0 "Compensate the defeated guard"
 war_adventurer_grombrindal.12.option_b:0 "Investigate the original confiscations"
 war_adventurer_grombrindal.12.option_c:0 "Dismiss the written grievance"
 war_adventurer_grombrindal.12.t:0 "The Heirlooms Taken from Our Hall"
 war_adventurer_grombrindal.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our governor reports that Grombrindal entered a trophy hall, defeated its guard, and restored seized heirlooms to their surviving families. He left a formal account of the grudge beside the empty cases. The trophy keeper has retained the grudge beside his inventory, unable to explain why so many seized objects could be identified by surviving families.\n\nOur officials ask us to compensate the defeated guard. Others argue that we should instead investigate the original confiscations. No escort remains with the stranger, and his witnesses cannot agree on the road he took."
 war_adventurer_grombrindal.13.option_a:0 "Replace the damaged prison works"
 war_adventurer_grombrindal.13.option_b:0 "Reorganize detention security"
 war_adventurer_grombrindal.13.option_c:0 "Leave the ruined compound closed"
 war_adventurer_grombrindal.13.t:0 "The Promise Behind the Prison Break"
 war_adventurer_grombrindal.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our jailer reports that Grombrindal opened the cells holding a captured Dwarf work party.\n\nA pledge recalling Karak Varn was carved into the broken gate, and copies of the prison roll have begun circulating among the prisoners' kin. The jailer has delivered a cart of broken shackles but cannot produce a single member of the escaped work party.\n\nOur officials ask us to replace the damaged prison works. Others argue that we should instead reorganize detention security. The last report ends with the White Dwarf's departure rather than a demand for land or office."
 war_adventurer_grombrindal.14.option_a:0 "Buy new service contracts"
 war_adventurer_grombrindal.14.option_b:0 "Reorganize the reduced muster"
 war_adventurer_grombrindal.14.option_c:0 "Endure the repudiation of our authority"
 war_adventurer_grombrindal.14.t:0 "The Muster that Turned Against Us"
 war_adventurer_grombrindal.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our commander reports that Grombrindal exposed the breaking of an ancestral service agreement before a conscript muster. Several companies refused to assemble, and he escorted their detained spokesmen away. The absent companies have returned copies of their service agreement, with the broken terms marked beside the commander's own requisition orders.\n\nOur officials ask us to buy new service contracts. Others argue that we should instead reorganize the reduced muster. The white-bearded stranger vanished before the witnesses could arrange a formal audience."
 war_adventurer_grombrindal.15.option_a:0 "Replace the equipment and workers"
 war_adventurer_grombrindal.15.option_b:0 "Redirect production to other mines"
 war_adventurer_grombrindal.15.option_c:0 "Close the damaged workings"
 war_adventurer_grombrindal.15.t:0 "The Mine's Unpaid Debt"
 war_adventurer_grombrindal.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our overseer reports that Grombrindal broke the guard around a captive mining crew and rallied them into an escape. The fugitives carried off the tools our administration had seized from their families. The overseer's inventory lists the tools as state property, but their surviving family marks support the fugitives' claim to them.\n\nOur officials ask us to replace the equipment and workers. Others argue that we should instead redirect production to other mines. The surviving officers found no trace of Grombrindal when they returned with the court's messenger."
 war_adventurer_grombrindal.16.option_a:0 "Replace the expedition's losses"
 war_adventurer_grombrindal.16.option_b:0 "Investigate its failed command"
 war_adventurer_grombrindal.16.option_c:0 "Repudiate the expedition publicly"
 war_adventurer_grombrindal.16.t:0 "The Slaving Expedition's Return"
 war_adventurer_grombrindal.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our frontier officer reports that Grombrindal scattered a slaving expedition and freed its captives. Survivors returned with a written grudge and no explanation of how the old Dwarf vanished after the battle. The returning officers have produced the written grudge instead of their promised captives, exposing the expedition's failure to the frontier settlements.\n\nThe council proposes that we replace the expedition's losses. A second proposal would have us investigate its failed command. Grombrindal has left the people he aided to fulfil their own obligations and continued his mysterious wandering."
 war_adventurer_grombrindal.17.option_a:0 "Settle the broken contract"
 war_adventurer_grombrindal.17.option_b:0 "Investigate the approving officials"
 war_adventurer_grombrindal.17.option_c:0 "Defend the contractor despite the evidence"
 war_adventurer_grombrindal.17.t:0 "The Foreign Oathbreaker's Ledger"
 war_adventurer_grombrindal.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our magistrate reports that Grombrindal defeated a contractor who withheld promised protection from a Dwarf settlement.\n\nHe left the contractor's ledger with witnesses and carried its detained petitioners to safety. The witnesses have compared the contractor's payments with the protection actually supplied, leaving several approving officials directly implicated.\n\nThe council proposes that we settle the broken contract. A second proposal would have us investigate the approving officials. No escort remains with the stranger, and his witnesses cannot agree on the road he took."
 war_adventurer_grombrindal.18.option_a:0 "Replace the missing treasury allocation"
 war_adventurer_grombrindal.18.option_b:0 "Audit the confiscation"
 war_adventurer_grombrindal.18.option_c:0 "Deny the petitioners' claim"
 war_adventurer_grombrindal.18.t:0 "The Karak Varn Petition"
 war_adventurer_grombrindal.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our governor reports that Grombrindal recovered a seized relief fund after its custodians invoked the promise associated with Karak Varn. He acted alone, leaving the fund's accounts nailed to the treasury door. The recovered accounts identify the households whose contributions were diverted, making the relief petition difficult to dismiss as a private dispute.\n\nThe council proposes that we replace the missing treasury allocation. A second proposal would have us audit the confiscation. The last report ends with the White Dwarf's departure rather than a demand for land or office."
 war_adventurer_grombrindal.19.option_a:0 "Replace the camp's stores"
 war_adventurer_grombrindal.19.option_b:0 "Reorganize interception tactics"
 war_adventurer_grombrindal.19.option_c:0 "Requisition nearby settlements"
 war_adventurer_grombrindal.19.t:0 "The Caravan We Had Surrounded"
 war_adventurer_grombrindal.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our commander reports that Grombrindal rallied an encircled caravan and broke its captives out through a supply camp. He disappeared after the rescued guards reached a safe route, leaving our camp stripped of provisions. The captured caravan's guards carried off the camp's provisions on their recovered wagons, leaving the interception force without its next issue.\n\nThe council proposes that we replace the camp's stores. A second proposal would have us reorganize interception tactics. The white-bearded stranger vanished before the witnesses could arrange a formal audience."
 war_adventurer_grombrindal.20.option_a:0 "Compensate the affected households"
 war_adventurer_grombrindal.20.option_b:0 "Investigate the officer's collection"
 war_adventurer_grombrindal.20.option_c:0 "Refuse the grievance and accept the shame"
 war_adventurer_grombrindal.20.t:0 "The Ancestor's Unanswered Grudge"
 war_adventurer_grombrindal.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our court receives a formal grievance after Grombrindal defeated a provincial officer holding stolen clan relics. The officer survived, the relics are gone, and witnesses disagree whether the rescuer was an ancient king or simply an indomitable traveller. The surviving officer has confirmed the relics' return, although he refuses to endorse either of the legends spreading about his conqueror.\n\nThe council proposes that we compensate the affected households. A second proposal would have us investigate the officer's collection. The surviving officers found no trace of Grombrindal when they returned with the court's messenger."
 war_adventurer_grombrindal.21.t:0 "Grombrindal has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_grombrindal.21.d:0 "Travelers from [war_adventurer_arrival_province.GetName] insist that the legendary Dwarf champion Grombrindal, known as the White Dwarf, has appeared there. Their accounts agree on a white-bearded warrior, though none can explain where he came from.\n\nThe White Dwarf is a figure of ancestral legend, said to appear when his kin face their darkest hours. Stories tell of hopeless battles turned by his arrival and of a rescuer who vanishes before gratitude can catch him."
 war_adventurer_setup.1.a:0 "Their journeys begin."
 war_adventurer_arrival_acknowledge:0 "Noted."
 war_adventurer_leaves_tt:0 "The Adventurer departs for [war_adventurer_destination_country.GetName]."
 war_adventurer_stays_tt:0 "The Adventurer remains here."
 war_adventurer_mainlands:0 "Adventurer Mainlands"
