l_english:
 war_adventurer_gelt:0 "Balthasar Gelt, Adventurer"
 desc_war_adventurer_gelt:0 "A gold-masked alchemist has taken an interest in the province's furnaces, and metalworkers crowd his demonstrations of transmutation. Gelt's advice promises purer alloys and hotter forges, though merchants have begun testing every suspiciously bright coin. His experiments keep the workshops busy and the neighbors awake."
 war_adventurer_gelt.1.option_a:0 "Issue the cleaner powder to the provincial militia"
 war_adventurer_gelt.1.option_b:0 "Share the measurements with local furnace masters"
 war_adventurer_gelt.1.option_c:0 "Endow a counting house for the powder guild"
 war_adventurer_gelt.1.t:0 "Powder Without Smoke"
 war_adventurer_gelt.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering wizard and alchemist Balthasar Gelt. Our artillery clerk reports that Gelt's overnight experiments produced a cleaner powder batch, but the guild has impounded his notes after a dispute over credit. A powder-blackened brass measure accompanies the clerk's letter, its rim marked with the quantities that survived the test.\n\nOur officials ask whether we should issue the cleaner powder to the provincial militia. Another proposal is to share the measurements with local furnace masters. Gelt has left his instruments packed for another journey, and the escort cannot promise to detain him."
 war_adventurer_gelt.2.option_a:0 "Reequip local workshops with the salvaged instruments"
 war_adventurer_gelt.2.option_b:0 "Let scholars examine the recovered retorts"
 war_adventurer_gelt.2.t:0 "Behind the Golden Door"
 war_adventurer_gelt.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering wizard and alchemist Balthasar Gelt. A magistrate reports an explosion in a rented laboratory. Gelt rescued the apprentices and escaped behind his mask; salvagers have recovered unfamiliar refining instruments from the wreckage. The salvagers have stacked the intact retorts beside a list of broken windows and the apprentices who must be paid.\n\nOur officials ask whether we should reequip local workshops with the salvaged instruments. Another proposal is to let scholars examine the recovered retorts. The masked alchemist has slipped away from the officials sent to demand an explanation."
 war_adventurer_gelt.3.option_a:0 "Settle the claim through a permanent local assay office"
 war_adventurer_gelt.3.option_b:0 "Teach local smiths to use the assay technique"
 war_adventurer_gelt.3.option_c:0 "File the captain's petition without intervention"
 war_adventurer_gelt.3.t:0 "The Captain's Old Claim"
 war_adventurer_gelt.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering wizard and alchemist Balthasar Gelt. A river captain petitions our court over gold that became lead after Gelt paid his fare. Examination of the remaining metal reveals a useful assay technique, while the captain demands restitution. The captain has nailed one of the dull grey coins to his petition so that nobody can dismiss his loss as a tavern tale.\n\nOur officials ask whether we should settle the claim through a permanent local assay office. Another proposal is to teach local smiths to use the assay technique. The remaining attendants expect Gelt to be across the border before any summons can reach him."
 war_adventurer_gelt.4.option_a:0 "Restore the arsenal district's confiscated tax holdings"
 war_adventurer_gelt.4.option_b:0 "Give the recovered equipment to the local watch"
 war_adventurer_gelt.4.option_c:0 "House the investigators in a new town hall"
 war_adventurer_gelt.4.t:0 "A Mutiny Paid in Lead"
 war_adventurer_gelt.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering wizard and alchemist Balthasar Gelt. Our treasurer reports that conspirators preparing to seize a local arsenal have lost their mercenary payroll to Gelt's transmutation. Their abandoned accounts name officials involved in the plot. Several mercenary captains have surrendered their worthless advances and offered to identify the men who hired them.\n\nOur officials ask whether we should restore the arsenal district's confiscated tax holdings. Another proposal is to give the recovered equipment to the local watch. Gelt's latest lodgings stand empty, leaving his hosts to settle the accounts after his departure."
 war_adventurer_gelt.5.option_a:0 "Teach the safer powder measure to local recruits"
 war_adventurer_gelt.5.option_b:0 "Distribute workshop copies of the measuring device"
 war_adventurer_gelt.5.option_c:0 "Have scholars verify the surviving measurements"
 war_adventurer_gelt.5.option_d:0 "Let the engineers settle their quarrel"
 war_adventurer_gelt.5.t:0 "The Engineers' Dinner"
 war_adventurer_gelt.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering wizard and alchemist Balthasar Gelt. Guild officers report that a quarrel at a banquet ended with Gelt demonstrating a safer powder measure on the dining table.\n\nHe departed before the senior master could forbid its use. A scorched tablecloth bears the measurements, copied in wine by an apprentice before the servants cleared the hall.\n\nOur officials ask whether we should teach the safer powder measure to local recruits. Another proposal is to distribute workshop copies of the measuring device. No search party has persuaded the golden-masked visitor to remain for an audience."
 war_adventurer_gelt.6.option_a:0 "Use the assay to register honest local imports"
 war_adventurer_gelt.6.option_b:0 "Preserve the residue for alchemical research"
 war_adventurer_gelt.6.option_c:0 "Establish a stock exchange with a permanent assay desk"
 war_adventurer_gelt.6.t:0 "Lead on Foreign Scales"
 war_adventurer_gelt.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering wizard and alchemist Balthasar Gelt. Our customs officers intercepted counterfeit-looking gold after Gelt left a caravanserai. A local assayer found that the residue exposes adulterated imports more reliably than the existing test. The assayer has kept the suspect coins beside samples of imported metal that failed the new test.\n\nOur officials ask whether we should use the assay to register honest local imports. Another proposal is to preserve the residue for alchemical research. Gelt has left his instruments packed for another journey, and the escort cannot promise to detain him."
 war_adventurer_gelt.7.option_a:0 "Publish the furnace method for local metalworkers"
 war_adventurer_gelt.7.option_b:0 "License the recovered-metal trade through the provincial office"
 war_adventurer_gelt.7.option_c:0 "Leave the rival guilds to negotiate"
 war_adventurer_gelt.7.t:0 "The Furnace Translator"
 war_adventurer_gelt.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering wizard and alchemist Balthasar Gelt. A foreign-language notebook left by Gelt has helped local metalworkers recover ore they previously discarded. Two guilds now claim exclusive rights to the technique. Workers have already separated a small pile of saleable metal from slag previously carted outside the town.\n\nOur officials ask whether we should publish the furnace method for local metalworkers. Another proposal is to license the recovered-metal trade through the provincial office. The masked alchemist has slipped away from the officials sent to demand an explanation."
 war_adventurer_gelt.8.option_a:0 "Supply the provincial infirmaries and return recruits to health"
 war_adventurer_gelt.8.option_b:0 "Have physicians study the labelled reagents"
 war_adventurer_gelt.8.t:0 "The Masked Patient"
 war_adventurer_gelt.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering wizard and alchemist Balthasar Gelt. A physician reports treating apprentices after an alchemical flash in Gelt's lodgings. The wizard paid with medical reagents and vanished, leaving both useful supplies and alarming rumours about his face. Among the supplies are sealed burn dressings and labelled jars whose preparation the physician has carefully recorded.\n\nOur officials ask whether we should supply the provincial infirmaries and return recruits to health. Another proposal is to have physicians study the labelled reagents. The remaining attendants expect Gelt to be across the border before any summons can reach him."
 war_adventurer_gelt.9.option_a:0 "Reopen the seized warehouses under local customs officers"
 war_adventurer_gelt.9.option_b:0 "Redistribute the stored tools to provincial workshops"
 war_adventurer_gelt.9.option_c:0 "Bring the recovered trade into a provincial stock exchange"
 war_adventurer_gelt.9.t:0 "A Warlord's Worthless Chest"
 war_adventurer_gelt.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering wizard and alchemist Balthasar Gelt. Border traders report that Gelt turned a raider's tribute chest into lead before its owner could hire an army.\n\nCaptured ledgers expose the foreign brokers supplying the raiders. The ledgers match the seals on several warehouses whose owners have been loudly proclaiming their innocence.\n\nOur officials ask whether we should reopen the seized warehouses under local customs officers. Another proposal is to redistribute the stored tools to provincial workshops. Gelt's latest lodgings stand empty, leaving his hosts to settle the accounts after his departure."
 war_adventurer_gelt.10.option_a:0 "Teach local metalworkers to reproduce the stronger fittings"
 war_adventurer_gelt.10.option_b:0 "Have scholars document the transformation"
 war_adventurer_gelt.10.option_c:0 "Use the restored statue to endow a cathedral"
 war_adventurer_gelt.10.t:0 "The Price of a Golden Statue"
 war_adventurer_gelt.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering wizard and alchemist Balthasar Gelt. Temple stewards report that Gelt used a damaged ceremonial statue to demonstrate metalworking, leaving stronger fittings but a scandal over its altered appearance. The stewards have submitted both the altered fittings and an itemized estimate for restoring the statue's ceremonial covering.\n\nOur officials ask whether we should teach local metalworkers to reproduce the stronger fittings. Another proposal is to have scholars document the transformation. No search party has persuaded the golden-masked visitor to remain for an audience."
 war_adventurer_gelt.11.option_a:0 "Pay the garrison again from the treasury"
 war_adventurer_gelt.11.option_b:0 "Let the garrison collect its own local dues"
 war_adventurer_gelt.11.option_c:0 "Refuse payment and let the mutiny ravage the district"
 war_adventurer_gelt.11.t:0 "The Salzenmund Trick"
 war_adventurer_gelt.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering wizard and alchemist Balthasar Gelt. Our paymaster reports that the garrison's chest now contains lead coins. Witnesses saw a golden rider leaving the tower; unpaid soldiers are already gathering outside the treasury. The soldiers have broken open three further chests, and every supposedly golden coin has yielded beneath a knife.\n\nOur officials ask whether we should pay the garrison again from the treasury. Another proposal is to let the garrison collect its own local dues. Gelt has left his instruments packed for another journey, and the escort cannot promise to detain him."
 war_adventurer_gelt.12.option_a:0 "Buy replacement fittings from outside the province"
 war_adventurer_gelt.12.option_b:0 "Let the foundry guild suspend deliveries and govern its own works"
 war_adventurer_gelt.12.t:0 "The Arsenal's Soft Teeth"
 war_adventurer_gelt.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering wizard and alchemist Balthasar Gelt. An ordnance inspection finds cannon fittings softened beyond use after Gelt entered the occupied foundry in disguise. He has fled through a service passage known to the former workers. The master gunner refuses to fire another piece until the weakened collars have been replaced or individually examined.\n\nOur officials ask whether we should buy replacement fittings from outside the province. Another proposal is to let the foundry guild suspend deliveries and govern its own works. The masked alchemist has slipped away from the officials sent to demand an explanation."
 war_adventurer_gelt.13.option_a:0 "Reimburse the exposed informants"
 war_adventurer_gelt.13.option_b:0 "Withdraw state agents and leave local security to the guilds"
 war_adventurer_gelt.13.option_c:0 "Admit that the entire bounty operation failed"
 war_adventurer_gelt.13.t:0 "A Bounty in False Gold"
 war_adventurer_gelt.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering wizard and alchemist Balthasar Gelt. Our governor reports that agents bribed to locate Gelt accepted coins that reverted to lead.\n\nTheir furious informants have exposed several government safe houses. Two frightened couriers have abandoned their lodgings after finding the exposed addresses posted outside a counting house.\n\nOur officials ask whether we should reimburse the exposed informants. Another proposal is to withdraw state agents and leave local security to the guilds. The remaining attendants expect Gelt to be across the border before any summons can reach him."
 war_adventurer_gelt.14.option_a:0 "Hire specialist smiths to open the sealed laboratory"
 war_adventurer_gelt.14.option_b:0 "Order a breach through the adjoining houses"
 war_adventurer_gelt.14.option_c:0 "Demolish the compromised university laboratory"
 war_adventurer_gelt.14.t:0 "Windows of Brass"
 war_adventurer_gelt.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering wizard and alchemist Balthasar Gelt. The occupation commandant reports that Gelt sealed a requisitioned laboratory in metal while prisoners escaped through its cellar. The frightened garrison has damaged adjoining houses trying to break in. A smith has scraped a sample from the sealed door, but ordinary chisels have only spread cracks through its supporting wall.\n\nOur officials ask whether we should hire specialist smiths to open the sealed laboratory. Another proposal is to order a breach through the adjoining houses. Gelt's latest lodgings stand empty, leaving his hosts to settle the accounts after his departure."
 war_adventurer_gelt.15.option_a:0 "Recall and replace the unsafe castings"
 war_adventurer_gelt.15.option_b:0 "Give the foundry guild control of its own inspections"
 war_adventurer_gelt.15.option_c:0 "Close and dismantle the foundry's counting house"
 war_adventurer_gelt.15.t:0 "A Foundry's Silent Strike"
 war_adventurer_gelt.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering wizard and alchemist Balthasar Gelt. Our inspector discovers that Gelt left apprentices instructions for quietly ruining military castings. The apprentices have disappeared, and the foundry's next delivery must be condemned. The rejected castings bear the correct inspection stamps, making it impossible to distinguish safe deliveries by their paperwork alone.\n\nOur officials ask whether we should recall and replace the unsafe castings. Another proposal is to give the foundry guild control of its own inspections. No search party has persuaded the golden-masked visitor to remain for an audience."
 war_adventurer_gelt.16.option_a:0 "Compensate the guests for their worthless gifts"
 war_adventurer_gelt.16.option_b:0 "Publicly admit that the court was deceived"
 war_adventurer_gelt.16.t:0 "The Diplomatic Gift"
 war_adventurer_gelt.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering wizard and alchemist Balthasar Gelt. Our chamberlain reports that an impressive gold gift brought by Gelt has reverted during an audience. Foreign guests witnessed the humiliation before the wizard escaped from his lodgings. The chamberlain has recovered the crumbling presentation tray, but every guest has already seen the dull metal beneath the gilding.\n\nOur officials ask whether we should compensate the guests for their worthless gifts. Another proposal is to publicly admit that the court was deceived. Gelt has left his instruments packed for another journey, and the escort cannot promise to detain him."
 war_adventurer_gelt.17.option_a:0 "Pay the mercenaries from the treasury"
 war_adventurer_gelt.17.option_b:0 "Give the company the right to collect local dues"
 war_adventurer_gelt.17.option_c:0 "Refuse payment despite the threatened looting"
 war_adventurer_gelt.17.t:0 "Mercenaries Without Masters"
 war_adventurer_gelt.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering wizard and alchemist Balthasar Gelt. A frontier commander reports that Gelt transmuted the advance payment for imported mercenaries.\n\nThe company is threatening to loot the district before marching away. The company's quartermaster has delivered a demand for payment together with the lead bars that replaced its promised advance.\n\nOur officials ask whether we should pay the mercenaries from the treasury. Another proposal is to give the company the right to collect local dues. The masked alchemist has slipped away from the officials sent to demand an explanation."
 war_adventurer_gelt.18.option_a:0 "Hire pumps and drain the workings"
 war_adventurer_gelt.18.option_b:0 "Abandon the flooded galleries and surrounding works"
 war_adventurer_gelt.18.option_c:0 "Turn the mine district over to its own guild council"
 war_adventurer_gelt.18.t:0 "The Golden Sluice"
 war_adventurer_gelt.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering wizard and alchemist Balthasar Gelt. Mine officers report that Gelt fused a drainage mechanism while helping captives escape. Water is rising through the lower workings, and the fugitive has crossed the outer cordon. Miners have marked the rising water against the gallery posts, and the lowest pump can no longer be reached safely.\n\nOur officials ask whether we should hire pumps and drain the workings. Another proposal is to abandon the flooded galleries and surrounding works. The remaining attendants expect Gelt to be across the border before any summons can reach him."
 war_adventurer_gelt.19.option_a:0 "Pay for relief and replacement records"
 war_adventurer_gelt.19.option_b:0 "Seal off the ruined quarter without rebuilding it"
 war_adventurer_gelt.19.option_c:0 "Let the displaced wards administer their own recovery"
 war_adventurer_gelt.19.t:0 "An Embassy of Ash"
 war_adventurer_gelt.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering wizard and alchemist Balthasar Gelt. An official searching Gelt's abandoned workshop triggered a dangerous residue. The explosion destroyed seized military papers and spread panic through the administrative quarter. Clerks are drying the surviving pages in a neighbouring courtyard while displaced households queue beside the same temporary office.\n\nOur officials ask whether we should pay for relief and replacement records. Another proposal is to seal off the ruined quarter without rebuilding it. Gelt's latest lodgings stand empty, leaving his hosts to settle the accounts after his departure."
 war_adventurer_gelt.20.option_a:0 "Exchange the discredited coins at the treasury's expense"
 war_adventurer_gelt.20.option_b:0 "Let the merchant guild set its own payment rules"
 war_adventurer_gelt.20.option_c:0 "Acknowledge the debasement in a public proclamation"
 war_adventurer_gelt.20.t:0 "The Merchant's Last Lesson"
 war_adventurer_gelt.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering wizard and alchemist Balthasar Gelt. Our trade commissioner reports that Gelt publicly demonstrated the adulteration of state-issued coinage, then disappeared. Merchants are refusing the next tax payment in that currency. The merchants have brought their own scales to the counting house and are testing every official payment before accepting it.\n\nOur officials ask whether we should exchange the discredited coins at the treasury's expense. Another proposal is to let the merchant guild set its own payment rules. No search party has persuaded the golden-masked visitor to remain for an audience."
 war_adventurer_gelt.21.t:0 "Balthasar Gelt has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_gelt.21.d:0 "Our officials report that the wandering wizard and alchemist Balthasar Gelt has arrived in [war_adventurer_arrival_province.GetName]. The visitor wears a golden mask and travels with the instruments of an alchemist.\n\nGelt is a wizard of the Gold Order, renowned for his mastery of metal and his experiments with black powder. His reputation attracts craftsmen and scholars, though stories of transmuted coins have made some merchants wary."
 war_adventurer_teclis:0 "Teclis, Adventurer"
 desc_war_adventurer_teclis:0 "Teclis is examining old inscriptions and neglected wards in this province, drawing scholars eager to question the archmage who helped establish the human Colleges of Magic. Even a few words of his instruction can overturn a lifetime of study. His impatience with dangerous ignorance has already offended several local authorities."
 war_adventurer_teclis.1.option_a:0 "Have scholars examine the broken enchantment"
 war_adventurer_teclis.1.option_b:0 "Create a regulated memorial precinct for local pilgrims"
 war_adventurer_teclis.1.option_c:0 "Raise a cathedral around the cleared memorial"
 war_adventurer_teclis.1.t:0 "The Scar of Finuval"
 war_adventurer_teclis.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf archmage Teclis. Our wardens report that Teclis broke a lingering hostile enchantment at an old battlefield.\n\nFragments of its design offer rare lessons, but pilgrims are entering the still-dangerous site. The wardens have fenced the broken inscriptions with rope, but pilgrims continue to slip through seeking fragments of the defeated spell.\n\nOur officials ask whether we should have scholars examine the broken enchantment. Another proposal is to create a regulated memorial precinct for local pilgrims. The Elf has left his conclusions in writing rather than wait upon another court debate."
 war_adventurer_teclis.2.option_a:0 "Assign the trained apprentices to the provincial watch"
 war_adventurer_teclis.2.option_b:0 "Circulate the corrected magical manuals"
 war_adventurer_teclis.2.option_c:0 "Leave admission decisions to the existing tutors"
 war_adventurer_teclis.2.t:0 "Students from the Human Lands"
 war_adventurer_teclis.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf archmage Teclis. A harbour officer reports that Teclis admitted visiting human apprentices to a private lesson despite objections from local tutors. Their demonstrations have revealed mistakes in the province's teaching manuals. The pupils' corrected exercises show that the disputed lesson exposed a real flaw rather than merely insulting established masters.\n\nOur officials ask whether we should assign the trained apprentices to the provincial watch. Another proposal is to circulate the corrected magical manuals. The messengers sent to find Teclis returned with his notes and no promise that he would stay."
 war_adventurer_teclis.3.option_a:0 "Restore local offices infiltrated by the cult"
 war_adventurer_teclis.3.option_b:0 "Teach provincial patrols to recognize the cult's signs"
 war_adventurer_teclis.3.t:0 "The Old Alliance's Dispatches"
 war_adventurer_teclis.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf archmage Teclis. An archivist reports that Teclis recovered correspondence from the war fought beside Magnus. A comparison with current border reports exposes a familiar pattern of cult infiltration. Several names in the old dispatches correspond to symbols recently found on confiscated charms and concealed meeting places.\n\nOur officials ask whether we should restore local offices infiltrated by the cult. Another proposal is to teach provincial patrols to recognize the cult's signs. Teclis considers the immediate danger settled and has turned his attention to another distant disturbance."
 war_adventurer_teclis.4.option_a:0 "Use the survey to reclaim disturbed provincial fields"
 war_adventurer_teclis.4.option_b:0 "Share the geomantic findings with scholars"
 war_adventurer_teclis.4.option_c:0 "Establish a university archive for the stone and its surveys"
 war_adventurer_teclis.4.t:0 "Mud from Albion"
 war_adventurer_teclis.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf archmage Teclis. Our scholars receive Teclis's analysis of a mud-covered stone associated with an overseas expedition. He has neutralized its influence, leaving a useful map of related geomantic disturbances. The stone rests in a sealed chest beside Teclis's sketches of the places where its influence can still be measured.\n\nOur officials ask whether we should use the survey to reclaim disturbed provincial fields. Another proposal is to share the geomantic findings with scholars. The archmage's escort has already made preparations for travel beyond our jurisdiction."
 war_adventurer_teclis.5.option_a:0 "Reopen the protected precinct under the novice's care"
 war_adventurer_teclis.5.option_b:0 "Train local wardens to maintain the inscription"
 war_adventurer_teclis.5.option_c:0 "House the protective inscription in a new cathedral"
 war_adventurer_teclis.5.t:0 "A Ward Without a Master"
 war_adventurer_teclis.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf archmage Teclis. Temple attendants report that Teclis repaired a failing protective inscription and identified a local novice capable of maintaining it.\n\nSenior custodians refuse to accept the novice's appointment. The novice has copied the repaired inscription onto wax tablets so that the custodians cannot quietly erase the correction.\n\nOur officials ask whether we should reopen the protected precinct under the novice's care. Another proposal is to train local wardens to maintain the inscription. Teclis has declined an audience and intends to continue his investigations elsewhere."
 war_adventurer_teclis.6.option_a:0 "Keep the trained pupils in the provincial watch"
 war_adventurer_teclis.6.option_b:0 "Record the methods under scholarly supervision"
 war_adventurer_teclis.6.option_c:0 "Let the families and tutors make their own arrangements"
 war_adventurer_teclis.6.t:0 "The Unlicensed School"
 war_adventurer_teclis.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf archmage Teclis. Our magistrate reports that Teclis has already taught several gifted children to control dangerous magic. Their families seek protection while established authorities demand the school be closed. The children can now extinguish the sparks that once burned their bedding, although their families still fear the inspectors.\n\nOur officials ask whether we should keep the trained pupils in the provincial watch. Another proposal is to record the methods under scholarly supervision. The Elf has left his conclusions in writing rather than wait upon another court debate."
 war_adventurer_teclis.7.option_a:0 "Rebuild the provincial militia around the surviving defenders"
 war_adventurer_teclis.7.option_b:0 "Circulate the defenders' lessons to our army officers"
 war_adventurer_teclis.7.option_c:0 "Establish training fields where the breach was contained"
 war_adventurer_teclis.7.t:0 "A Second Magnus"
 war_adventurer_teclis.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf archmage Teclis. Scouts report that Teclis helped local defenders repel a daemonic breach, then left a stern account comparing their preparation with Magnus's army. Survivors ask for recognition. The defenders have preserved their broken weapons beside a list of practical failings recorded in the Elf's own hand.\n\nOur officials ask whether we should rebuild the provincial militia around the surviving defenders. Another proposal is to circulate the defenders' lessons to our army officers. The messengers sent to find Teclis returned with his notes and no promise that he would stay."
 war_adventurer_teclis.8.option_a:0 "Restore the orchards around the protected marker"
 war_adventurer_teclis.8.option_b:0 "Record the marker and its geomantic connections"
 war_adventurer_teclis.8.t:0 "Stones Beneath the Orchard"
 war_adventurer_teclis.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf archmage Teclis. Farmers report that Teclis uncovered an ancient stone beneath their orchard and silenced the nightmares troubling the district. His notes warn against removing its neighbouring markers. A ploughshare rests against the exposed marker, and the farmer refuses to work that corner until the warning is explained.\n\nOur officials ask whether we should restore the orchards around the protected marker. Another proposal is to record the marker and its geomantic connections. Teclis considers the immediate danger settled and has turned his attention to another distant disturbance."
 war_adventurer_teclis.9.option_a:0 "Remove the conspirators from the provincial offices"
 war_adventurer_teclis.9.option_b:0 "Place the liberated attendants in a strengthened palace guard"
 war_adventurer_teclis.9.option_c:0 "Publish the evidence that the court resisted magical coercion"
 war_adventurer_teclis.9.t:0 "The Foreign Court's Duel"
 war_adventurer_teclis.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf archmage Teclis. Our envoy reports that Teclis defeated a visiting sorcerer's attempt to dominate the court through a concealed spell.\n\nThe defeated mage fled, leaving compromising letters behind. The abandoned letters carry enough recognizable seals to make a public accusation possible, but also dangerous to several established interests.\n\nOur officials ask whether we should remove the conspirators from the provincial offices. Another proposal is to place the liberated attendants in a strengthened palace guard. The archmage's escort has already made preparations for travel beyond our jurisdiction."
 war_adventurer_teclis.10.option_a:0 "Teach provincial craftsmen to make reliable protective charms"
 war_adventurer_teclis.10.option_b:0 "Register honest practitioners with the local authorities"
 war_adventurer_teclis.10.option_c:0 "Have scholars verify the translated instructions"
 war_adventurer_teclis.10.option_d:0 "Leave the manuscript with its translator"
 war_adventurer_teclis.10.t:0 "The Translator of Eight Winds"
 war_adventurer_teclis.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf archmage Teclis. A local scholar has translated instructions Teclis left after correcting a dangerous magical experiment. The manuscript challenges a profitable monopoly on supposedly protective charms. Customers have begun bringing their purchased charms to the scholar, demanding to know which inscriptions ever offered protection.\n\nOur officials ask whether we should teach provincial craftsmen to make reliable protective charms. Another proposal is to register honest practitioners with the local authorities. Teclis has declined an audience and intends to continue his investigations elsewhere."
 war_adventurer_teclis.11.option_a:0 "Buy timber and supplies to replace the failed wards"
 war_adventurer_teclis.11.option_b:0 "Let district captains provision and command themselves"
 war_adventurer_teclis.11.option_c:0 "Abandon the exposed perimeter and its settlements"
 war_adventurer_teclis.11.t:0 "The Unravelling at Dawn"
 war_adventurer_teclis.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf archmage Teclis. Our commandant reports that Teclis stripped the wards from an occupied fortress before local insurgents stole its supplies. He has vanished, and the defenders no longer trust their protective charms. The garrison has stripped the useless charms from its gate and is demanding timber, labourers, and trustworthy supply officers.\n\nOur officials ask whether we should buy timber and supplies to replace the failed wards. Another proposal is to let district captains provision and command themselves. The Elf has left his conclusions in writing rather than wait upon another court debate."
 war_adventurer_teclis.12.option_a:0 "Recruit and equip replacement pupils"
 war_adventurer_teclis.12.option_b:0 "Let the surviving tutors run the school without state control"
 war_adventurer_teclis.12.t:0 "The Missing Novices"
 war_adventurer_teclis.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf archmage Teclis. Our governor reports that Teclis led conscripted magical pupils out of a guarded school. Instructors found their coercive bindings broken and their records copied. The empty dormitory contains broken restraints and lesson books with the names of the escaped pupils carefully removed.\n\nOur officials ask whether we should recruit and equip replacement pupils. Another proposal is to let the surviving tutors run the school without state control. The messengers sent to find Teclis returned with his notes and no promise that he would stay."
 war_adventurer_teclis.13.option_a:0 "Pay for new patrol routes and secure couriers"
 war_adventurer_teclis.13.option_b:0 "Concede local control of patrols to the petitioning communities"
 war_adventurer_teclis.13.option_c:0 "Publish the letters and admit the security failure"
 war_adventurer_teclis.13.t:0 "Letters to the Resistance"
 war_adventurer_teclis.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf archmage Teclis. Our intelligence office intercepted only the last of Teclis's warnings to local communities.\n\nThe letters compare our rule with former Chaos incursions and identify weaknesses in our patrol routes. Patrol officers have found copies of the same letter in settlements whose elders previously claimed never to communicate.\n\nOur officials ask whether we should pay for new patrol routes and secure couriers. Another proposal is to concede local control of patrols to the petitioning communities. Teclis considers the immediate danger settled and has turned his attention to another distant disturbance."
 war_adventurer_teclis.14.option_a:0 "Move the survey and replace the lost instruments"
 war_adventurer_teclis.14.option_b:0 "Let the affected landowners decide how to use the site"
 war_adventurer_teclis.14.option_c:0 "Abandon the unstable workings"
 war_adventurer_teclis.14.t:0 "The Stone That Refused Us"
 war_adventurer_teclis.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf archmage Teclis. Surveyors report that a geomantic stone seized for our project became inert after Teclis visited it. Workers fled when its surrounding ground shifted, and the site is now unusable. Cracks now run through the measuring platforms, and the surveyors cannot recover their instruments without reopening unstable ground.\n\nOur officials ask whether we should move the survey and replace the lost instruments. Another proposal is to let the affected landowners decide how to use the site. The archmage's escort has already made preparations for travel beyond our jurisdiction."
 war_adventurer_teclis.15.option_a:0 "Admit that the formula should never have been retained"
 war_adventurer_teclis.15.option_b:0 "Place the provincial archives under an independent council"
 war_adventurer_teclis.15.option_c:0 "Pay outside scholars to examine the remaining collections"
 war_adventurer_teclis.15.t:0 "A Crown's Forbidden Formula"
 war_adventurer_teclis.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf archmage Teclis. Our court mage reports that Teclis removed a dangerous formula from the palace archive and left evidence of its earlier disasters. Courtiers are questioning the ruler's judgement. The court mage has retained the note explaining the formula's dangers, but several courtiers have already copied it.\n\nOur officials ask whether we should admit that the formula should never have been retained. Another proposal is to place the provincial archives under an independent council. Teclis has declined an audience and intends to continue his investigations elsewhere."
 war_adventurer_teclis.16.option_a:0 "Admit that the prized relic was dangerous"
 war_adventurer_teclis.16.option_b:0 "Purchase a safe replacement for the public display"
 war_adventurer_teclis.16.option_c:0 "Grant the local custodians independent control of their collections"
 war_adventurer_teclis.16.t:0 "The Empty Reliquary"
 war_adventurer_teclis.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf archmage Teclis. Our keeper of treasures discovers a relic missing and a note from Teclis warning that it was feeding a hostile power. Witnesses saw the Elf leave before the alarm. The keeper's inventory still records the missing relic as the centrepiece of the coming display, which foreign visitors expect to see.\n\nOur officials ask whether we should admit that the prized relic was dangerous. Another proposal is to purchase a safe replacement for the public display. The Elf has left his conclusions in writing rather than wait upon another court debate."
 war_adventurer_teclis.17.option_a:0 "Compensate the escaped pupils' households"
 war_adventurer_teclis.17.option_b:0 "Return recruitment to the provincial communities"
 war_adventurer_teclis.17.option_c:0 "Enforce the roundup through destructive house searches"
 war_adventurer_teclis.17.t:0 "An Enemy's Apprentices"
 war_adventurer_teclis.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf archmage Teclis. Provincial officials report that Teclis taught a group of persecuted spellcasters enough control to escape a state roundup.\n\nTheir flight has exposed the recruitment office's abuses. The abandoned recruitment office contains bindings cut cleanly through and petitions bearing the names of the escaped families.\n\nOur officials ask whether we should compensate the escaped pupils' households. Another proposal is to return recruitment to the provincial communities. The messengers sent to find Teclis returned with his notes and no promise that he would stay."
 war_adventurer_teclis.18.option_a:0 "Replace the stores and equipment lost in retreat"
 war_adventurer_teclis.18.option_b:0 "Allow local captains to govern their own defensive districts"
 war_adventurer_teclis.18.option_c:0 "Abandon the exposed district and its stores"
 war_adventurer_teclis.18.t:0 "A Battle Already Lost"
 war_adventurer_teclis.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf archmage Teclis. A garrison report describes Teclis breaking its commander's sorcerous advantage in a brief duel. The commander survived, but the troops abandoned stores during the retreat. The surviving soldiers have surrendered their failed protective tokens and demand instructions that do not rely on the commander's magic.\n\nOur officials ask whether we should replace the stores and equipment lost in retreat. Another proposal is to allow local captains to govern their own defensive districts. Teclis considers the immediate danger settled and has turned his attention to another distant disturbance."
 war_adventurer_teclis.19.option_a:0 "Pay the compensation sought in the petitions"
 war_adventurer_teclis.19.option_b:0 "Grant the petitioners an independent provincial council"
 war_adventurer_teclis.19.option_c:0 "Endure the coordinated public accusations"
 war_adventurer_teclis.19.t:0 "The Coalition He Left Behind"
 war_adventurer_teclis.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf archmage Teclis. Our diplomats learn that Teclis has convinced local opponents to exchange information rather than compete. Their coordinated petitions reveal scandals that were previously isolated. The petitions now cite one another's witnesses, preventing officials from dismissing each grievance as an isolated misunderstanding.\n\nOur officials ask whether we should pay the compensation sought in the petitions. Another proposal is to grant the petitioners an independent provincial council. The archmage's escort has already made preparations for travel beyond our jurisdiction."
 war_adventurer_teclis.20.option_a:0 "Hire ordinary watchmen to replace the magical watchers"
 war_adventurer_teclis.20.option_b:0 "Leave the surrounding wards to police themselves"
 war_adventurer_teclis.20.option_c:0 "Close the university that supplied the coercive bindings"
 war_adventurer_teclis.20.t:0 "A Tower Without Shadows"
 war_adventurer_teclis.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf archmage Teclis. Watchmen report that Teclis cleansed a tower being used for state-sponsored magical coercion. Its bound watchers are gone, and prisoners escaped during the disturbance. The tower's attendants can no longer call their watchers, leaving the surrounding streets beyond the reach of the former surveillance network.\n\nOur officials ask whether we should hire ordinary watchmen to replace the magical watchers. Another proposal is to leave the surrounding wards to police themselves. Teclis has declined an audience and intends to continue his investigations elsewhere."
 war_adventurer_teclis.21.t:0 "Teclis has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_teclis.21.d:0 "A dispatch from [war_adventurer_arrival_province.GetName] announces the arrival of the renowned High Elf archmage Teclis. He is asking after old inscriptions and places where the Winds of Magic gather.\n\nTeclis helped Magnus the Pious resist Chaos and establish the Imperial Colleges of Magic. His frail appearance conceals a sorcerer powerful enough to have defeated Malekith at Finuval Plain."
 war_adventurer_snikch:0 "Deathmaster Snikch, Adventurer"
 desc_war_adventurer_snikch:0 "Reports of a shadow with three blades have sent the province's officials searching their bedchambers for hidden entrances. Clan Eshin's Deathmaster leaves few witnesses, but locked doors offer little reassurance when a body is found beyond them. Merchants pay dearly for escorts while the watch inspects every drain and roofline."
 war_adventurer_snikch.1.option_a:0 "Bring the exposed payment route under provincial customs"
 war_adventurer_snikch.1.option_b:0 "Turn the seized workshops over to local suppliers"
 war_adventurer_snikch.1.option_c:0 "Consolidate the seized trade in a stock exchange"
 war_adventurer_snikch.1.t:0 "The Rival's Prayer"
 war_adventurer_snikch.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the elusive Skaven assassin Deathmaster Snikch. Our clan overseer reports that a rival's foreign champion was found dead at prayer.\n\nSnikch's messenger has delivered the champion's correspondence, but insists the service remain unacknowledged. The letters identify a concealed payment route that can be exploited before the champion's patrons appoint a replacement.\n\nOur officials ask whether we should bring the exposed payment route under provincial customs. Another proposal is to turn the seized workshops over to local suppliers. The messenger who delivered the evidence disappeared before a second question could be asked."
 war_adventurer_snikch.2.option_a:0 "Train provincial tunnel patrols from the stolen schedules"
 war_adventurer_snikch.2.option_b:0 "Distribute recovered tools to local workshops"
 war_adventurer_snikch.2.option_c:0 "Establish training fields for tunnel guards"
 war_adventurer_snikch.2.t:0 "One Winter's Ledgers"
 war_adventurer_snikch.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the elusive Skaven assassin Deathmaster Snikch. Tunnel officers recover ledgers from a stronghold Snikch infiltrated over several months. The records reveal safe routes through its patrol system and stocks worth stealing. The stolen ledgers include changes of guard recorded in several different hands, confirming the assassin's prolonged access.\n\nOur officials ask whether we should train provincial tunnel patrols from the stolen schedules. Another proposal is to distribute recovered tools to local workshops. By the time the latest report was sealed, the trail had already passed beyond the search cordon."
 war_adventurer_snikch.3.option_a:0 "Study the stolen star charts"
 war_adventurer_snikch.3.option_b:0 "Give the survey tables to provincial instrument makers"
 war_adventurer_snikch.3.t:0 "An Observatory's Last Chart"
 war_adventurer_snikch.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the elusive Skaven assassin Deathmaster Snikch. A courier deposits star charts stolen from a murdered surface wizard. Snikch's involvement is suggested by a blood-mark, but our agents cannot authenticate it. The courier has wrapped the charts around a bloodstained observatory seal, offering evidence of the theft but none of its precise author.\n\nOur officials ask whether we should study the stolen star charts. Another proposal is to give the survey tables to provincial instrument makers. The watch expects to find abandoned hiding places rather than an assassin waiting to be arrested."
 war_adventurer_snikch.4.option_a:0 "Equip local recruits with the captured military stores"
 war_adventurer_snikch.4.option_b:0 "Distribute the captured wagons to provincial suppliers"
 war_adventurer_snikch.4.option_c:0 "Use the stores to establish permanent training fields"
 war_adventurer_snikch.4.t:0 "The Gatekeeper's Successor"
 war_adventurer_snikch.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the elusive Skaven assassin Deathmaster Snikch. Our commander reports that Snikch removed a hostile gatekeeper and obtained the signal used to admit supply wagons. A small infiltration team has already returned with military stores. The returning infiltrators have brought intact ration sacks and the wooden tally used to authorize the captured wagons.\n\nOur officials ask whether we should equip local recruits with the captured military stores. Another proposal is to distribute the captured wagons to provincial suppliers. The investigators found the suspected assassin's last refuge empty."
 war_adventurer_snikch.5.option_a:0 "Confiscate the conspirators' provincial revenue offices"
 war_adventurer_snikch.5.option_b:0 "Recruit guards from the exposed sponsors' retainers"
 war_adventurer_snikch.5.option_c:0 "Destroy the contracts and keep the affair private"
 war_adventurer_snikch.5.t:0 "The Assassins' Quarrel"
 war_adventurer_snikch.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the elusive Skaven assassin Deathmaster Snikch. Our steward finds two rival murder-contracts pinned to the same corpse.\n\nSnikch has killed their intended victim, leaving both sponsors exposed and our court unexpectedly secure. Both contracts bear genuine payment marks, leaving their sponsors with little room to deny their intentions.\n\nOur officials ask whether we should confiscate the conspirators' provincial revenue offices. Another proposal is to recruit guards from the exposed sponsors' retainers. No guard can promise that the killer remains anywhere near the scene."
 war_adventurer_snikch.6.option_a:0 "Reopen the seized counting offices under provincial supervision"
 war_adventurer_snikch.6.option_b:0 "Return the confiscated cargo to local workshops"
 war_adventurer_snikch.6.option_c:0 "Establish a stock exchange for the recovered trade"
 war_adventurer_snikch.6.t:0 "The Chapel's Foreign Patron"
 war_adventurer_snikch.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the elusive Skaven assassin Deathmaster Snikch. An agent reports that Snikch killed a knight protecting an overseas enemy's trade interests. The knight's secret payment book has reached our provincial headquarters. Several supposedly independent merchants appear repeatedly in the payment book under the same discreet identifying marks.\n\nOur officials ask whether we should reopen the seized counting offices under provincial supervision. Another proposal is to return the confiscated cargo to local workshops. The messenger who delivered the evidence disappeared before a second question could be asked."
 war_adventurer_snikch.7.option_a:0 "Distribute the recovered property among local workshops"
 war_adventurer_snikch.7.option_b:0 "Train provincial scouts from the concealed-passage sketches"
 war_adventurer_snikch.7.option_c:0 "Establish a counting house for the recovered supplies"
 war_adventurer_snikch.7.t:0 "Behind the Mountain's Doors"
 war_adventurer_snikch.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the elusive Skaven assassin Deathmaster Snikch. A caravan courier brings sketches Snikch made inside a supposedly sealed foreign hold. Our agents have already used one route to recover confiscated clan property. The sketches mark a service passage omitted from every plan previously sold to the provincial agents.\n\nOur officials ask whether we should distribute the recovered property among local workshops. Another proposal is to train provincial scouts from the concealed-passage sketches. By the time the latest report was sealed, the trail had already passed beyond the search cordon."
 war_adventurer_snikch.8.option_a:0 "Use the decoded accounts to register concealed local trade"
 war_adventurer_snikch.8.option_b:0 "Study the astronomical tables in the correspondence"
 war_adventurer_snikch.8.t:0 "The Astrologer's Cipher"
 war_adventurer_snikch.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the elusive Skaven assassin Deathmaster Snikch. Our provincial spymaster receives coded correspondence from a locked observatory whose master has vanished. Snikch's accompanying instructions explain the cipher but nothing about the disappearance. A worked example of the cipher has been written on the envelope, allowing the first intercepted message to be read immediately.\n\nOur officials ask whether we should use the decoded accounts to register concealed local trade. Another proposal is to study the astronomical tables in the correspondence. The watch expects to find abandoned hiding places rather than an assassin waiting to be arrested."
 war_adventurer_snikch.9.option_a:0 "Prepare provincial patrols along the threatened supply routes"
 war_adventurer_snikch.9.option_b:0 "Give local suppliers the expedition's abandoned contracts"
 war_adventurer_snikch.9.option_c:0 "Establish training fields for the threatened district"
 war_adventurer_snikch.9.t:0 "An Open Door at the Feast"
 war_adventurer_snikch.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the elusive Skaven assassin Deathmaster Snikch. Our agents report that Snikch removed a banquet's security officer and left a servant's route open.\n\nThey escaped with plans for a rival's military expedition. The stolen plans record supply dates as well as troop destinations, making them valuable before the expedition departs.\n\nOur officials ask whether we should prepare provincial patrols along the threatened supply routes. Another proposal is to give local suppliers the expedition's abandoned contracts. The investigators found the suspected assassin's last refuge empty."
 war_adventurer_snikch.10.option_a:0 "Register the route with the provincial customs office"
 war_adventurer_snikch.10.option_b:0 "Supply local workshops through the regularized route"
 war_adventurer_snikch.10.option_c:0 "Bring the merchant's business into a stock exchange"
 war_adventurer_snikch.10.t:0 "The Price of Silence"
 war_adventurer_snikch.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the elusive Skaven assassin Deathmaster Snikch. A frightened foreign merchant tells our governor that Snikch spared him after discovering a profitable smuggling route. The assassin left instructions for directing its customs payments to our agents. The merchant has submitted his next consignment for inspection, apparently more afraid of the assassin than of the customs office.\n\nOur officials ask whether we should register the route with the provincial customs office. Another proposal is to supply local workshops through the regularized route. No guard can promise that the killer remains anywhere near the scene."
 war_adventurer_snikch.11.option_a:0 "Hire a replacement astronomer and reconstruct the charts"
 war_adventurer_snikch.11.option_b:0 "Let the observatory's scholars control their own security"
 war_adventurer_snikch.11.option_c:0 "Close and dismantle the compromised university observatory"
 war_adventurer_snikch.11.t:0 "No Lock Broken"
 war_adventurer_snikch.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the elusive Skaven assassin Deathmaster Snikch. Our astronomer is found dead inside an observatory with every door locked. Officials whisper Snikch's name, but the only certain losses are the scholar and several sensitive charts. The observatory key was still inside the room, and none of the servants can account for the missing charts.\n\nOur officials ask whether we should hire a replacement astronomer and reconstruct the charts. Another proposal is to let the observatory's scholars control their own security. The messenger who delivered the evidence disappeared before a second question could be asked."
 war_adventurer_snikch.12.option_a:0 "Pay for new guards and an independent security inquiry"
 war_adventurer_snikch.12.option_b:0 "Keep the settlement sealed despite the damage to local livelihoods"
 war_adventurer_snikch.12.option_c:0 "Reopen the gates and return security to local wardens"
 war_adventurer_snikch.12.t:0 "The Sealed Hold"
 war_adventurer_snikch.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the elusive Skaven assassin Deathmaster Snikch. Our commandant reports killings continuing despite a complete closure of the settlement. After weeks of paralysis, scouts find evidence that Snikch escaped through the supposedly sealed perimeter. Freshly sealed shutters and untouched gate chains have become a source of ridicule among the people they were meant to reassure.\n\nOur officials ask whether we should pay for new guards and an independent security inquiry. Another proposal is to keep the settlement sealed despite the damage to local livelihoods. By the time the latest report was sealed, the trail had already passed beyond the search cordon."
 war_adventurer_snikch.13.option_a:0 "Pay for the champion's funeral and replacement guards"
 war_adventurer_snikch.13.option_b:0 "Let the shrine's custodians organize their own protection"
 war_adventurer_snikch.13.t:0 "A Champion at Prayer"
 war_adventurer_snikch.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the elusive Skaven assassin Deathmaster Snikch. Attendants discover the provincial champion slain at a private shrine.\n\nThe assassin has gone, and the garrison interprets the killing as proof that even sacred refuges are unsafe. The attendants have covered the body, but blood remains across the steps where the champion's own guards should have stood.\n\nOur officials ask whether we should pay for the champion's funeral and replacement guards. Another proposal is to let the shrine's custodians organize their own protection. The watch expects to find abandoned hiding places rather than an assassin waiting to be arrested."
 war_adventurer_snikch.14.option_a:0 "Replace the stolen stores and gate signals"
 war_adventurer_snikch.14.option_b:0 "Abandon the compromised wing and its adjoining stores"
 war_adventurer_snikch.14.option_c:0 "Give the fortress district's captains independent command"
 war_adventurer_snikch.14.t:0 "The Warden's Unwatched Stair"
 war_adventurer_snikch.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the elusive Skaven assassin Deathmaster Snikch. Our fortress warden has been assassinated at a secluded lookout. Infiltrators used his stolen signal to enter the stores before a relief patrol drove them away. The relief patrol recovered a false supply order bearing the dead warden's mark among the emptied sacks.\n\nOur officials ask whether we should replace the stolen stores and gate signals. Another proposal is to abandon the compromised wing and its adjoining stores. The investigators found the suspected assassin's last refuge empty."
 war_adventurer_snikch.15.option_a:0 "Fund a credible inquiry into the planted evidence"
 war_adventurer_snikch.15.option_b:0 "Let local elders examine the papers without state interference"
 war_adventurer_snikch.15.option_c:0 "Accept the public accusation against our agents"
 war_adventurer_snikch.15.t:0 "The Murder That Named Us"
 war_adventurer_snikch.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the elusive Skaven assassin Deathmaster Snikch. Our governor reports that Snikch arranged a victim's papers to implicate government agents. The true assassin escaped while witnesses spread the accusation through the district. Several witnesses have already recognized official seals in the planted papers, whether those impressions are genuine or copied.\n\nOur officials ask whether we should fund a credible inquiry into the planted evidence. Another proposal is to let local elders examine the papers without state interference. No guard can promise that the killer remains anywhere near the scene."
 war_adventurer_snikch.16.option_a:0 "Replace the envoy's guard and compromised dispatches"
 war_adventurer_snikch.16.option_b:0 "Leave the shrine district to its own protectors"
 war_adventurer_snikch.16.option_c:0 "Acknowledge the embassy's security failure"
 war_adventurer_snikch.16.t:0 "The Chapel on Foreign Soil"
 war_adventurer_snikch.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the elusive Skaven assassin Deathmaster Snikch. Our envoy's armed protector is found murdered during prayer in a provincial shrine. Snikch has left the envoy alive but stripped of confidential documents. The surviving envoy can identify the stolen dispatch cases, but cannot say which of their contents has already been read.\n\nOur officials ask whether we should replace the envoy's guard and compromised dispatches. Another proposal is to leave the shrine district to its own protectors. The messenger who delivered the evidence disappeared before a second question could be asked."
 war_adventurer_snikch.17.option_a:0 "Reconstruct the customs records and replace the guards"
 war_adventurer_snikch.17.option_b:0 "Let provincial merchants administer their own customs dues"
 war_adventurer_snikch.17.option_c:0 "Close the compromised stock exchange"
 war_adventurer_snikch.17.t:0 "Winter Behind the Customs Wall"
 war_adventurer_snikch.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the elusive Skaven assassin Deathmaster Snikch. A border governor reports repeated disappearances inside a closed customs compound.\n\nSnikch finally escaped with seizure records that expose the state's hidden revenues. The governor's seal remains unbroken on the compound gate, deepening the embarrassment over the missing records and vanished guards.\n\nOur officials ask whether we should reconstruct the customs records and replace the guards. Another proposal is to let provincial merchants administer their own customs dues. By the time the latest report was sealed, the trail had already passed beyond the search cordon."
 war_adventurer_snikch.18.option_a:0 "Replace the stolen seals and recall the couriers"
 war_adventurer_snikch.18.option_b:0 "Let local courier stations verify orders independently"
 war_adventurer_snikch.18.t:0 "The Wizard's Missing Seal"
 war_adventurer_snikch.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the elusive Skaven assassin Deathmaster Snikch. A court magician is found dead in a locked study, and letters bearing his stolen seal have already redirected official couriers. Investigators suspect Snikch but cannot prove it. Two courier stations have confirmed receiving the forged instructions before the magician's death was discovered.\n\nOur officials ask whether we should replace the stolen seals and recall the couriers. Another proposal is to let local courier stations verify orders independently. The watch expects to find abandoned hiding places rather than an assassin waiting to be arrested."
 war_adventurer_snikch.19.option_a:0 "Purchase replacement powder and supplies"
 war_adventurer_snikch.19.option_b:0 "Let the garrison districts provision themselves"
 war_adventurer_snikch.19.option_c:0 "Order destructive collective searches through the district"
 war_adventurer_snikch.19.t:0 "A Gate Opened from Within"
 war_adventurer_snikch.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the elusive Skaven assassin Deathmaster Snikch. Our commander reports a slain watch officer and a supply gate opened during the night. Raiders escaped with powder and prisoners before the alarm reached headquarters. The opened gate shows no damage, while the dead officer's signal cord is missing from his belt.\n\nOur officials ask whether we should purchase replacement powder and supplies. Another proposal is to let the garrison districts provision themselves. The investigators found the suspected assassin's last refuge empty."
 war_adventurer_snikch.20.option_a:0 "Relocate the informants whose names were stolen"
 war_adventurer_snikch.20.option_b:0 "Return intelligence work to independent provincial officers"
 war_adventurer_snikch.20.option_c:0 "Admit that the celebrated capture was a decoy"
 war_adventurer_snikch.20.t:0 "The Decoy's Funeral"
 war_adventurer_snikch.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the elusive Skaven assassin Deathmaster Snikch. Our intelligence office admits that the alleged assassin it displayed was a decoy. While officials celebrated, Snikch stole the informant register and disappeared. Informants named in the stolen register have begun arriving at government offices demanding new lodgings and protection.\n\nOur officials ask whether we should relocate the informants whose names were stolen. Another proposal is to return intelligence work to independent provincial officers. No guard can promise that the killer remains anywhere near the scene."
 war_adventurer_snikch.21.t:0 "Deathmaster Snikch has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_snikch.21.d:0 "Our informants in [war_adventurer_arrival_province.GetName] believe that the elusive Skaven assassin Deathmaster Snikch has entered the province. Their reports describe a cloaked Skaven and blades carried in both paws and tail.\n\nSnikch is Clan Eshin's most feared assassin, notorious for reaching victims behind locked doors and guarded walls. We have a warning of his presence, but neither his hiding place nor his intended victim is known."
 war_adventurer_bugman:0 "Josef Bugman, Adventurer"
 desc_war_adventurer_bugman:0 "Bugman's rangers have found somewhere to broach a cask, and every brewer in the province wants a taste of the master's ale. Between arguments over malt and fermentation, the Dwarfs ask after Goblin raiders and survivors of the ruined brewery. Better beer brings customers, but crossed grudges and loaded crossbows make for uneasy company."
 war_adventurer_bugman.1.option_a:0 "Share the fermentation schedule with local brewers"
 war_adventurer_bugman.1.option_b:0 "License the improved ale through the provincial guild"
 war_adventurer_bugman.1.option_c:0 "Establish a counting house for the brewing trade"
 war_adventurer_bugman.1.t:0 "The Seventh Cask"
 war_adventurer_bugman.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the famed Dwarf brewer and ranger Josef Bugman. Our brewer's guild reports that Bugman corrected a spoiled batch and left instructions inspired by his celebrated ales.\n\nRival masters are fighting over who may advertise the association. The brewers have kept the corrected batch under lock while their apprentices copy the new fermentation schedule.\n\nOur officials ask whether we should share the fermentation schedule with local brewers. Another proposal is to license the improved ale through the provincial guild. Bugman has no intention of remaining until the local accounts are balanced."
 war_adventurer_bugman.2.option_a:0 "Settle the displaced brewing families in restored homes"
 war_adventurer_bugman.2.option_b:0 "Return the copper vessels to working provincial breweries"
 war_adventurer_bugman.2.option_c:0 "Equip a brewers' counting house with the recovered vessels"
 war_adventurer_bugman.2.t:0 "Charcoal Beneath the Brewhouse"
 war_adventurer_bugman.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the famed Dwarf brewer and ranger Josef Bugman. Workmen restoring an abandoned brewery uncovered records Bugman recognized from his ruined settlement. His rangers recovered stolen vessels from a nearby camp, and displaced brewing families are asking to settle. The recovered copper vessels still bear the marks of families whose names survive in the charred brewery records.\n\nOur officials ask whether we should settle the displaced brewing families in restored homes. Another proposal is to return the copper vessels to working provincial breweries. The rangers' departing wagon bears the same brewery marks that first brought them into this affair."
 war_adventurer_bugman.3.option_a:0 "Give the rescued families abandoned local holdings"
 war_adventurer_bugman.3.option_b:0 "Enlist willing survivors in the provincial watch"
 war_adventurer_bugman.3.option_c:0 "Reequip the survivors' workshops with their recovered tools"
 war_adventurer_bugman.3.t:0 "Names on the Missing List"
 war_adventurer_bugman.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the famed Dwarf brewer and ranger Josef Bugman. A ranger delivers rescued captives and a list of families taken by raiders. Bugman has continued the pursuit; the survivors require somewhere safe to rebuild their lives. Several rescued workers have brought tools hidden during their captivity and are ready to resume their old trades.\n\nOur officials ask whether we should give the rescued families abandoned local holdings. Another proposal is to enlist willing survivors in the provincial watch. Bugman's rangers have packed their crossbows and casks for another march."
 war_adventurer_bugman.4.option_a:0 "Equip local defenders with the captured supplies"
 war_adventurer_bugman.4.option_b:0 "Restore the raided households from their recovered property"
 war_adventurer_bugman.4.option_c:0 "Use the captured stores to establish training fields"
 war_adventurer_bugman.4.t:0 "Crossbows Before Dawn"
 war_adventurer_bugman.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the famed Dwarf brewer and ranger Josef Bugman. Our field officer reports that Bugman's rangers broke an encircling raider camp during the night. They departed after sharing ale with the exhausted defenders, leaving captured supplies. The abandoned camp contains unopened ration barrels, spare crossbow strings, and goods whose owners have come forward to claim them.\n\nOur officials ask whether we should equip local defenders with the captured supplies. Another proposal is to restore the raided households from their recovered property. The brewer has left the settlement of these claims to us while his rangers follow another trail."
 war_adventurer_bugman.5.option_a:0 "Provision and register the provincial volunteers"
 war_adventurer_bugman.5.option_b:0 "Teach local brewers the safe ration recipe"
 war_adventurer_bugman.5.option_c:0 "Leave the remaining casks with the quartermaster"
 war_adventurer_bugman.5.t:0 "Troll Brew at the Muster"
 war_adventurer_bugman.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the famed Dwarf brewer and ranger Josef Bugman. A muster captain reports that Bugman's potent beer revived weary volunteers but caused a noisy dispute with the quartermaster.\n\nThe brewer left enough ordinary ale to provision the next march. The captain has separated the ordinary marching ale from the stronger casks after finding volunteers asleep beside the muster rolls.\n\nOur officials ask whether we should provision and register the provincial volunteers. Another proposal is to teach local brewers the safe ration recipe. Scouts last saw the rangers moving out with their baggage and a stubborn refusal to wait for officials."
 war_adventurer_bugman.6.option_a:0 "Expand the caravan stop with the recovered freight"
 war_adventurer_bugman.6.option_b:0 "Train local road wardens from the route survey"
 war_adventurer_bugman.6.t:0 "A Caravan with Empty Tankards"
 war_adventurer_bugman.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the famed Dwarf brewer and ranger Josef Bugman. Merchants report that Bugman's rangers rescued their wagons, then consumed much of the recovered beer. The remaining cargo and an accurate route survey have reached our customs house. The merchants' petition carefully distinguishes the freight recovered by the rangers from the drink consumed during their celebration.\n\nOur officials ask whether we should expand the caravan stop with the recovered freight. Another proposal is to train local road wardens from the route survey. Bugman has no intention of remaining until the local accounts are balanced."
 war_adventurer_bugman.7.option_a:0 "Share the adapted grain recipe with local brewers"
 war_adventurer_bugman.7.option_b:0 "Open a regulated provincial market for the new ale"
 war_adventurer_bugman.7.option_c:0 "Establish a brewers' counting house for the growing trade"
 war_adventurer_bugman.7.t:0 "Grain from a Strange Valley"
 war_adventurer_bugman.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the famed Dwarf brewer and ranger Josef Bugman. Local brewers report that Bugman adapted his methods to unfamiliar grain and repaired their failing vats. He has left, but their first successful batch attracted merchants from neighbouring markets. The brewers have preserved samples from each stage, allowing the new method to be repeated after their demanding guest has gone.\n\nOur officials ask whether we should share the adapted grain recipe with local brewers. Another proposal is to open a regulated provincial market for the new ale. The rangers' departing wagon bears the same brewery marks that first brought them into this affair."
 war_adventurer_bugman.8.option_a:0 "Settle the rescued workers in protected local homes"
 war_adventurer_bugman.8.option_b:0 "Restore the workers to provincial breweries"
 war_adventurer_bugman.8.option_c:0 "Turn the seized premises into a brewers' counting house"
 war_adventurer_bugman.8.t:0 "A Brand on the Barrel"
 war_adventurer_bugman.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the famed Dwarf brewer and ranger Josef Bugman. Our market inspector found Bugman's old brewery mark on stolen casks. The ranger followed the sellers, returned with freed workers, and vanished before the smugglers' patrons could retaliate. The rescued workers recognized both the brewery marks and the merchant who ordered those marks scraped away.\n\nOur officials ask whether we should settle the rescued workers in protected local homes. Another proposal is to restore the workers to provincial breweries. Bugman's rangers have packed their crossbows and casks for another march."
 war_adventurer_bugman.9.option_a:0 "Register the newly opened pass with provincial customs"
 war_adventurer_bugman.9.option_b:0 "Equip local pass wardens from the recovered supplies"
 war_adventurer_bugman.9.option_c:0 "Supply provincial workshops through the safer crossing"
 war_adventurer_bugman.9.t:0 "The Pass Beyond the Mountains"
 war_adventurer_bugman.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the famed Dwarf brewer and ranger Josef Bugman. A caravan master reports that Bugman tracked raiders across a pass dismissed as impassable.\n\nThe rangers recovered supplies and left cairns marking a safer crossing. The caravan master has copied the cairns onto a route map and marked the narrowest crossing with a warning for loaded wagons.\n\nOur officials ask whether we should register the newly opened pass with provincial customs. Another proposal is to equip local pass wardens from the recovered supplies. The brewer has left the settlement of these claims to us while his rangers follow another trail."
 war_adventurer_bugman.10.option_a:0 "Return the sealed delivery to its rightful customer"
 war_adventurer_bugman.10.option_b:0 "Settle the freight dispute through a permanent local delivery office"
 war_adventurer_bugman.10.option_c:0 "Retain lawful brewing samples for the provincial guild"
 war_adventurer_bugman.10.t:0 "The Emperor's Delivery"
 war_adventurer_bugman.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the famed Dwarf brewer and ranger Josef Bugman. Our governor receives a battered consignment bearing a distant customer's seal. Bugman recovered it from thieves and left the decision to forward it or settle the disputed freight charges to our officials. The consignment's seals survived the theft, leaving little doubt about the intended recipient or the carrier's outstanding charges.\n\nOur officials ask whether we should return the sealed delivery to its rightful customer. Another proposal is to settle the freight dispute through a permanent local delivery office. Scouts last saw the rangers moving out with their baggage and a stubborn refusal to wait for officials."
 war_adventurer_bugman.11.option_a:0 "Import the garrison's replacement supplies"
 war_adventurer_bugman.11.option_b:0 "Let local suppliers renegotiate their own military obligations"
 war_adventurer_bugman.11.option_c:0 "Write off the burned brewery's counting house"
 war_adventurer_bugman.11.t:0 "The Brewery Burns Twice"
 war_adventurer_bugman.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the famed Dwarf brewer and ranger Josef Bugman. Our governor reports that Bugman destroyed a requisitioned brewery after finding stolen family equipment inside. The workers escaped with his rangers, leaving the garrison without its contracted supplies. The abandoned account books show exactly how much of the garrison's next delivery was stored in the burned vats.\n\nOur officials ask whether we should import the garrison's replacement supplies. Another proposal is to let local suppliers renegotiate their own military obligations. Bugman has no intention of remaining until the local accounts are balanced."
 war_adventurer_bugman.12.option_a:0 "Purchase replacement grain"
 war_adventurer_bugman.12.option_b:0 "Give local communities control of grain deliveries"
 war_adventurer_bugman.12.option_c:0 "Seize civilian seed stocks to keep the troops supplied"
 war_adventurer_bugman.12.t:0 "A Grudge in the Granary"
 war_adventurer_bugman.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the famed Dwarf brewer and ranger Josef Bugman. Quartermasters discover that Bugman's rangers emptied a grain depot serving the troops who occupied a Dwarf settlement. The raiders posted the names of missing captives on the doors. The posted list has drawn relatives of the missing prisoners to the depot, where they are questioning its surviving guards.\n\nOur officials ask whether we should purchase replacement grain. Another proposal is to give local communities control of grain deliveries. The rangers' departing wagon bears the same brewery marks that first brought them into this affair."
 war_adventurer_bugman.13.option_a:0 "Purchase replacement siege equipment"
 war_adventurer_bugman.13.option_b:0 "Let the provincial commanders abandon the operation"
 war_adventurer_bugman.13.option_c:0 "Strip the district for replacement timber and iron"
 war_adventurer_bugman.13.t:0 "The Night of Broken Crossbows"
 war_adventurer_bugman.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the famed Dwarf brewer and ranger Josef Bugman. Our camp commander reports a night attack that freed prisoners and destroyed siege equipment.\n\nTracks suggest Bugman's rangers had watched the camp for days before striking. The damaged engines cannot be moved without replacement fittings, and the camp's remaining prisoners have already dispersed.\n\nOur officials ask whether we should purchase replacement siege equipment. Another proposal is to let the provincial commanders abandon the operation. Bugman's rangers have packed their crossbows and casks for another march."
 war_adventurer_bugman.14.option_a:0 "Refund the purchasers of counterfeit ale"
 war_adventurer_bugman.14.option_b:0 "Give the brewing guild independent control of inspections"
 war_adventurer_bugman.14.t:0 "The False XXXXXX"
 war_adventurer_bugman.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the famed Dwarf brewer and ranger Josef Bugman. Our excise officer reports that Bugman exposed counterfeit ale sold under his name by a state contractor. Merchants now distrust the whole consignment, and the contractor has fled. Several innkeepers have returned unopened barrels and demand reimbursement before agreeing to stock any further government purchases.\n\nOur officials ask whether we should refund the purchasers of counterfeit ale. Another proposal is to give the brewing guild independent control of inspections. The brewer has left the settlement of these claims to us while his rangers follow another trail."
 war_adventurer_bugman.15.option_a:0 "Replace the stolen cargo from the treasury"
 war_adventurer_bugman.15.option_b:0 "Return convoy protection to the local river communities"
 war_adventurer_bugman.15.option_c:0 "Admit that the state transported concealed prisoners"
 war_adventurer_bugman.15.t:0 "A Delivery That Never Arrived"
 war_adventurer_bugman.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the famed Dwarf brewer and ranger Josef Bugman. A supply barge vanished near the site of a former Dwarf brewery. Survivors say Bugman spared the hired crew but took its cargo and released prisoners hidden below deck. The hired crew has handed over the convoy orders to prove that the hidden prisoners were not their own venture.\n\nOur officials ask whether we should replace the stolen cargo from the treasury. Another proposal is to return convoy protection to the local river communities. Scouts last saw the rangers moving out with their baggage and a stubborn refusal to wait for officials."
 war_adventurer_bugman.16.option_a:0 "Honour the merchants' convoy contracts"
 war_adventurer_bugman.16.option_b:0 "Let provincial merchants set their own convoy terms"
 war_adventurer_bugman.16.option_c:0 "Requisition local stocks to replace the intercepted shipment"
 war_adventurer_bugman.16.t:0 "Ale for the Wrong Army"
 war_adventurer_bugman.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the famed Dwarf brewer and ranger Josef Bugman. Our commissary reports that Bugman intercepted a purchased ale convoy and redirected it to our local opponents. The merchants demand payment despite the loss. The merchants have produced signed receipts showing when responsibility for the convoy passed to the commissary's escort.\n\nOur officials ask whether we should honour the merchants' convoy contracts. Another proposal is to let provincial merchants set their own convoy terms. Bugman has no intention of remaining until the local accounts are balanced."
 war_adventurer_bugman.17.option_a:0 "Compensate the businesses damaged in the fire"
 war_adventurer_bugman.17.option_b:0 "Leave the burned warehouse district unrepaired"
 war_adventurer_bugman.17.option_c:0 "Dismantle the traffickers' counting house"
 war_adventurer_bugman.17.t:0 "The Brewer's Mark Abroad"
 war_adventurer_bugman.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the famed Dwarf brewer and ranger Josef Bugman. A provincial officer found Bugman's rangers inside a warehouse dealing in plundered Dwarf goods.\n\nThey escaped with captives and set fire to the illegally stored cargo. Neighbours are submitting fire-damage claims together with descriptions of captives led out through the warehouse's broken rear doors.\n\nOur officials ask whether we should compensate the businesses damaged in the fire. Another proposal is to leave the burned warehouse district unrepaired. The rangers' departing wagon bears the same brewery marks that first brought them into this affair."
 war_adventurer_bugman.18.option_a:0 "Purchase replacement pack animals and equipment"
 war_adventurer_bugman.18.option_b:0 "Withdraw the state convoy service and leave transport to local companies"
 war_adventurer_bugman.18.t:0 "The Caravan's Last Campfire"
 war_adventurer_bugman.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the famed Dwarf brewer and ranger Josef Bugman. Scouts find our raiding convoy abandoned around cold fires. Bugman's rangers freed its prisoners and removed the pack animals, leaving a grudgingly precise inventory of what they took. The inventory specifies each animal and provision sack, making the extent of the loss impossible to disguise.\n\nOur officials ask whether we should purchase replacement pack animals and equipment. Another proposal is to withdraw the state convoy service and leave transport to local companies. Bugman's rangers have packed their crossbows and casks for another march."
 war_adventurer_bugman.19.option_a:0 "Pay restitution to the rescued captives"
 war_adventurer_bugman.19.option_b:0 "Give the provincial communities control of trafficking investigations"
 war_adventurer_bugman.19.option_c:0 "Admit that our officials protected the captive trader"
 war_adventurer_bugman.19.t:0 "A Tavern Full of Witnesses"
 war_adventurer_bugman.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the famed Dwarf brewer and ranger Josef Bugman. Our governor reports that Bugman publicly identified captives from his lost community among a merchant's servants. The ensuing rescue exposed the merchant's official protection and emptied the tavern into the streets. The merchant's protection letters were read aloud before the rangers left, and several witnesses have retained copies.\n\nOur officials ask whether we should pay restitution to the rescued captives. Another proposal is to give the provincial communities control of trafficking investigations. The brewer has left the settlement of these claims to us while his rangers follow another trail."
 war_adventurer_bugman.20.option_a:0 "Compensate the visiting delegation"
 war_adventurer_bugman.20.option_b:0 "Let the provincial merchants choose their own suppliers"
 war_adventurer_bugman.20.option_c:0 "Cancel the disgraced ceremony"
 war_adventurer_bugman.20.t:0 "The Mountain King's Barrels"
 war_adventurer_bugman.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the famed Dwarf brewer and ranger Josef Bugman. An imported ceremonial ale shipment was destroyed after Bugman discovered that its profits supported raiders. Visiting delegates watched the dispute and now demand guarantees for their own goods. The shattered casks still stand outside the reception hall, where delegates can compare their marks with the supplier's contracts.\n\nOur officials ask whether we should compensate the visiting delegation. Another proposal is to let the provincial merchants choose their own suppliers. Scouts last saw the rangers moving out with their baggage and a stubborn refusal to wait for officials."
 war_adventurer_bugman.21.t:0 "Josef Bugman has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_bugman.21.d:0 "Travelers in [war_adventurer_arrival_province.GetName] have identified the famed Dwarf brewer and ranger Josef Bugman among a band of heavily armed Dwarf rangers. Their baggage includes casks whose markings have already attracted the attention of local brewers.\n\nBugman was a celebrated master brewer before Goblins destroyed his brewery. He and its survivors now wander in search of vengeance and missing kin, carrying what remains of his famous ale."
 war_adventurer_bardin:0 "Bardin Goreksson, Adventurer"
 desc_war_adventurer_bardin:0 "Bardin Goreksson is questioning miners and comparing battered maps in his search for the lost hold of Karak Zorn. The former Ironbreaker has an eye for weak stonework and passages a careless sentry might miss. His tunnel excursions, booming songs, and stubborn disputes over ancient Dwarf claims have become familiar local complaints."
 war_adventurer_bardin.1.option_a:0 "Reopen the refuge as a permanent provincial shelter"
 war_adventurer_bardin.1.option_b:0 "Organize local rescue crews around the saved workers"
 war_adventurer_bardin.1.option_c:0 "Establish training fields for the tunnel rescue crews"
 war_adventurer_bardin.1.t:0 "The Old Ironbreaker's Tunnel"
 war_adventurer_bardin.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf ranger Bardin Goreksson. Our engineer reports that Bardin recognized a failing support pattern from his Ironbreaker service and led trapped workers out.\n\nHe left a sketch of how to brace the passage before moving on. The rescued workers have reproduced Bardin's brace marks on the tunnel entrance so that a new crew can follow them.\n\nOur officials ask whether we should reopen the refuge as a permanent provincial shelter. Another proposal is to organize local rescue crews around the saved workers. The ranger has left the immediate dispute behind and returned to his unfinished quest."
 war_adventurer_bardin.2.option_a:0 "Register the forgotten local trading routes"
 war_adventurer_bardin.2.option_b:0 "Catalogue the genuine map fragments"
 war_adventurer_bardin.2.t:0 "A Map That Ends in Questions"
 war_adventurer_bardin.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf ranger Bardin Goreksson. An archivist reports that Bardin compared a supposed Karak Zorn map with old toll records and exposed a forgery. The genuine fragments still identify forgotten trading routes. The archivist has placed the forged map beside the genuine fragments, making the invented roads visible even to an untrained reader.\n\nOur officials ask whether we should register the forgotten local trading routes. Another proposal is to catalogue the genuine map fragments. Bardin has taken up his pack and resumed the search that brought him through our lands."
 war_adventurer_bardin.3.option_a:0 "Enlist willing survivors in a permanent local watch"
 war_adventurer_bardin.3.option_b:0 "Restore the rescued families to their homes"
 war_adventurer_bardin.3.option_c:0 "Establish training fields for mixed provincial patrols"
 war_adventurer_bardin.3.t:0 "Five Voices in the Cellar"
 war_adventurer_bardin.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf ranger Bardin Goreksson. Our watch captain reports that Bardin organized a mixed band of locals against ratmen beneath a storehouse. Survivors disagree over who deserves credit, but several missing households have returned. The returned families agree that the defenders worked together, even when their accounts differ over who struck the final blow.\n\nOur officials ask whether we should enlist willing survivors in a permanent local watch. Another proposal is to restore the rescued families to their homes. The ranger's last lodging contains a few chalk marks and no indication that he intends to wait for a summons."
 war_adventurer_bardin.4.option_a:0 "Have engineers examine the jammed prototype"
 war_adventurer_bardin.4.option_b:0 "Train local gunsmiths from the surviving sketches"
 war_adventurer_bardin.4.option_c:0 "Equip a counting house for the provincial gunsmiths"
 war_adventurer_bardin.4.t:0 "The Crank Gun in the Yard"
 war_adventurer_bardin.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf ranger Bardin Goreksson. A workshop master reports that Bardin's improvised gun drove off attackers during a delivery dispute. The machine jammed immediately afterward, leaving useful design sketches and an angry insurance claimant. The workshop floor is strewn with spent casings, but the intact sketches explain the mechanism more clearly than the jammed weapon itself.\n\nOur officials ask whether we should have engineers examine the jammed prototype. Another proposal is to train local gunsmiths from the surviving sketches. Bardin has refused an official escort and set off along a route known better to him than to our patrols."
 war_adventurer_bardin.5.option_a:0 "Staff the linked provincial watch stations"
 war_adventurer_bardin.5.option_b:0 "Restore the evacuated households and their stores"
 war_adventurer_bardin.5.option_c:0 "Return the saved supplies to local workshops"
 war_adventurer_bardin.5.t:0 "A Ranger's Warning Bells"
 war_adventurer_bardin.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf ranger Bardin Goreksson. Village reeves report that Bardin linked their watchposts after recognizing signs of a coordinated underground attack.\n\nThe first alarm allowed several settlements to evacuate their stores safely. The reeves have sent the first warning bell along with a timetable showing how quickly the alarm reached each storehouse.\n\nOur officials ask whether we should staff the linked provincial watch stations. Another proposal is to restore the evacuated households and their stores. His hosts expect the Dwarf to continue travelling before the court's decision reaches them."
 war_adventurer_bardin.6.option_a:0 "Teach provincial miners the drainage method"
 war_adventurer_bardin.6.option_b:0 "Catalogue the copied inscription"
 war_adventurer_bardin.6.option_c:0 "Let the caravan carry its stone onward"
 war_adventurer_bardin.6.t:0 "The Stone in the Caravan"
 war_adventurer_bardin.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf ranger Bardin Goreksson. A merchant reports that Bardin identified a carved stone as a clue in his search for Karak Zorn. He traded practical mining advice for permission to copy it and left without claiming a discovery. The merchant has surrendered a rubbing of the stone and kept a second copy of Bardin's notes on draining wet mine shafts.\n\nOur officials ask whether we should teach provincial miners the drainage method. Another proposal is to catalogue the copied inscription. The ranger has left the immediate dispute behind and returned to his unfinished quest."
 war_adventurer_bardin.7.option_a:0 "Reopen the upper chambers as a provincial refuge"
 war_adventurer_bardin.7.option_b:0 "Catalogue the old Dwarf fittings"
 war_adventurer_bardin.7.option_c:0 "Recruit local rescue crews for the refuge"
 war_adventurer_bardin.7.t:0 "A Door Made for Shorter Men"
 war_adventurer_bardin.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf ranger Bardin Goreksson. Our surveyors report that Bardin opened a forgotten Dwarf refuge beneath a foreign hill. He rescued stranded travellers and sealed a dangerous lower passage, leaving the upper chambers usable. The surveyors have marked the sealed stair in red and recorded enough intact upper rooms to shelter the next stranded party.\n\nOur officials ask whether we should reopen the upper chambers as a provincial refuge. Another proposal is to catalogue the old Dwarf fittings. Bardin has taken up his pack and resumed the search that brought him through our lands."
 war_adventurer_bardin.8.option_a:0 "Restore the surviving customs accounts"
 war_adventurer_bardin.8.option_b:0 "Enlist willing rescuers in the provincial watch"
 war_adventurer_bardin.8.t:0 "The Stranger Who Held the Stairs"
 war_adventurer_bardin.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf ranger Bardin Goreksson. A magistrate reports that Bardin held a stairwell while civilians fled a vermin-infested customs house. The rescued clerks recovered records of unpaid duties during their escape. The rescued clerks recovered the duty books before the fire reached their shelves, preserving several accounts that would otherwise have vanished.\n\nOur officials ask whether we should restore the surviving customs accounts. Another proposal is to enlist willing rescuers in the provincial watch. The ranger's last lodging contains a few chalk marks and no indication that he intends to wait for a summons."
 war_adventurer_bardin.9.option_a:0 "Have engineers test the hand-cranked mechanism"
 war_adventurer_bardin.9.option_b:0 "Reopen the quarry using the new hauling arrangement"
 war_adventurer_bardin.9.option_c:0 "Equip a counting house for the restored quarry trade"
 war_adventurer_bardin.9.t:0 "A Machine the Guild Never Approved"
 war_adventurer_bardin.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf ranger Bardin Goreksson. Artisans report that Bardin adapted a hand-cranked mechanism to clear a collapsed quarry route.\n\nConservative masters object to his methods, but the recovered workforce has returned safely. The workers have drawn the hauling arrangement in charcoal on the quarry wall so that their own craftsmen can reproduce it.\n\nOur officials ask whether we should have engineers test the hand-cranked mechanism. Another proposal is to reopen the quarry using the new hauling arrangement. Bardin has refused an official escort and set off along a route known better to him than to our patrols."
 war_adventurer_bardin.10.option_a:0 "Rebuild local land records from the genuine evidence"
 war_adventurer_bardin.10.option_b:0 "Catalogue the geographical notes"
 war_adventurer_bardin.10.option_c:0 "Return the unclaimed papers to their depositors"
 war_adventurer_bardin.10.t:0 "The Lost Hold's False Heir"
 war_adventurer_bardin.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf ranger Bardin Goreksson. Our court receives evidence from Bardin that a travelling claimant sold invented rights to Karak Zorn. The claimant fled, leaving deposits and genuine geographical notes behind. The abandoned deposits remain under official seal while claimants arrive with certificates granting them imaginary estates.\n\nOur officials ask whether we should rebuild local land records from the genuine evidence. Another proposal is to catalogue the geographical notes. His hosts expect the Dwarf to continue travelling before the court's decision reaches them."
 war_adventurer_bardin.11.option_a:0 "Pay engineers to secure the escape route"
 war_adventurer_bardin.11.option_b:0 "Place detention under independent provincial wardens"
 war_adventurer_bardin.11.option_c:0 "Close and dismantle the compromised barracks"
 war_adventurer_bardin.11.t:0 "The Passage Beneath the Barracks"
 war_adventurer_bardin.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf ranger Bardin Goreksson. Our commandant reports that Bardin used an old Ironbreaker route to free detainees beneath the barracks. The tunnel map he left is deliberately incomplete. The prison rolls list the escaped detainees by name, while the commandant still cannot explain where the incomplete tunnel branches lead.\n\nOur officials ask whether we should pay engineers to secure the escape route. Another proposal is to place detention under independent provincial wardens. The ranger has left the immediate dispute behind and returned to his unfinished quest."
 war_adventurer_bardin.12.option_a:0 "Compensate the injured patrol"
 war_adventurer_bardin.12.option_b:0 "Give the provincial watch control of future investigations"
 war_adventurer_bardin.12.t:0 "A False Map Turned Against Us"
 war_adventurer_bardin.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf ranger Bardin Goreksson. Our governor admits that a forged Karak Zorn map intended to lure Bardin into custody instead led our pursuit into an abandoned quarry. He escaped after exposing the scheme. The forged expedition map has been pinned outside the barracks beside copies of the orders that sent the soldiers astray.\n\nOur officials ask whether we should compensate the injured patrol. Another proposal is to give the provincial watch control of future investigations. Bardin has taken up his pack and resumed the search that brought him through our lands."
 war_adventurer_bardin.13.option_a:0 "Replace the stolen supplies and scattered guards"
 war_adventurer_bardin.13.option_b:0 "Sweep the district with destructive house searches"
 war_adventurer_bardin.13.option_c:0 "Withdraw the occupation officers and let the wards police themselves"
 war_adventurer_bardin.13.t:0 "The Cellar That Answered Back"
 war_adventurer_bardin.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf ranger Bardin Goreksson. Our occupation officer reports that Bardin organized civilians and deserters against a hidden supply post.\n\nThe attackers recovered captives, scattered the guards, and escaped through the drains. The surviving jailer can identify the emptied cells but refuses to enter the passage through which the prisoners fled.\n\nOur officials ask whether we should replace the stolen supplies and scattered guards. Another proposal is to sweep the district with destructive house searches. The ranger's last lodging contains a few chalk marks and no indication that he intends to wait for a summons."
 war_adventurer_bardin.14.option_a:0 "Rebuild the gate winch"
 war_adventurer_bardin.14.option_b:0 "Let local captains choose and supply a new perimeter"
 war_adventurer_bardin.14.option_c:0 "Demolish nearby houses for a clear field of fire"
 war_adventurer_bardin.14.t:0 "Cog Teeth in the Gatehouse"
 war_adventurer_bardin.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf ranger Bardin Goreksson. Our fortress engineer reports that Bardin used a compact experimental weapon to drive guards from a gatehouse. Escaping prisoners disabled the winch before he withdrew. The engineers have collected the stripped gear teeth, confirming that the damage was deliberate and cannot be repaired by adjustment alone.\n\nOur officials ask whether we should rebuild the gate winch. Another proposal is to let local captains choose and supply a new perimeter. Bardin has refused an official escort and set off along a route known better to him than to our patrols."
 war_adventurer_bardin.15.option_a:0 "Repay the disputed requisitions"
 war_adventurer_bardin.15.option_b:0 "Let villages supervise the patrols that requisition their goods"
 war_adventurer_bardin.15.option_c:0 "Accept the published accusations against our patrols"
 war_adventurer_bardin.15.t:0 "The Ranger's Empty Camp"
 war_adventurer_bardin.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf ranger Bardin Goreksson. Patrols raided Bardin's camp after he exposed their abuse of villagers. They found misleading trail signs and a ledger of requisitions already copied for local petitioners. The abandoned camp contains false route markers that sent the pursuing patrols in three different directions.\n\nOur officials ask whether we should repay the disputed requisitions. Another proposal is to let villages supervise the patrols that requisition their goods. His hosts expect the Dwarf to continue travelling before the court's decision reaches them."
 war_adventurer_bardin.16.option_a:0 "Repair the winch and hire replacement workers"
 war_adventurer_bardin.16.option_b:0 "Abandon the flooded and unstable galleries"
 war_adventurer_bardin.16.option_c:0 "Turn the mine over to an independent workers' council"
 war_adventurer_bardin.16.t:0 "A Mine Without Its Captives"
 war_adventurer_bardin.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf ranger Bardin Goreksson. Our overseer reports that Bardin rescued forced labourers from a failing mine and dismantled the winch to prevent pursuit. Surviving workers refuse to descend until the shaft is inspected. The overseer's surviving ledger records the skilled workers who escaped, along with the machinery they had been forced to maintain.\n\nOur officials ask whether we should repair the winch and hire replacement workers. Another proposal is to abandon the flooded and unstable galleries. The ranger has left the immediate dispute behind and returned to his unfinished quest."
 war_adventurer_bardin.17.option_a:0 "Refund the buyers of invented land rights"
 war_adventurer_bardin.17.option_b:0 "Let the provincial claimants arbitrate their own settlements"
 war_adventurer_bardin.17.option_c:0 "Admit that officials endorsed the fraudulent auction"
 war_adventurer_bardin.17.t:0 "The Auction of a False Kingdom"
 war_adventurer_bardin.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf ranger Bardin Goreksson. Our collector reports that Bardin exposed a state-backed sale of invented Karak Zorn claims.\n\nForeign buyers demand restitution and threaten to publish the correspondence. Several buyers have produced receipts for the false expedition, implicating officials who vouched for its supposed destination.\n\nOur officials ask whether we should refund the buyers of invented land rights. Another proposal is to let the provincial claimants arbitrate their own settlements. Bardin has taken up his pack and resumed the search that brought him through our lands."
 war_adventurer_bardin.18.option_a:0 "Compensate the customs-house survivors"
 war_adventurer_bardin.18.option_b:0 "Place customs inspections under the provincial communities"
 war_adventurer_bardin.18.t:0 "The Customs House Survivors"
 war_adventurer_bardin.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf ranger Bardin Goreksson. Our governor reports that Bardin led detainees out of a fortified customs house during a vermin attack. Their testimony reveals that officials had ignored warnings for months. The rescued clerks have taken their own copies of the inspection accounts, leaving the governor unable to control the testimony.\n\nOur officials ask whether we should compensate the customs-house survivors. Another proposal is to place customs inspections under the provincial communities. The ranger's last lodging contains a few chalk marks and no indication that he intends to wait for a summons."
 war_adventurer_bardin.19.option_a:0 "Purchase substitute machinery"
 war_adventurer_bardin.19.option_b:0 "Grant the provincial engineers independent control of the arsenal project"
 war_adventurer_bardin.19.option_c:0 "Dismantle the compromised arsenal counting house"
 war_adventurer_bardin.19.t:0 "The Missing Mechanism"
 war_adventurer_bardin.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf ranger Bardin Goreksson. Our arsenal officer reports that Bardin recovered stolen Dwarf components and used them to disable a pursuit squad. The experimental assembly is gone, and the remaining plans are incomplete. The arsenal crew has laid the remaining components across its workbench, unable to reconstruct the lost assembly from the surviving drawings.\n\nOur officials ask whether we should purchase substitute machinery. Another proposal is to grant the provincial engineers independent control of the arsenal project. Bardin has refused an official escort and set off along a route known better to him than to our patrols."
 war_adventurer_bardin.20.option_a:0 "Rebuild the unsafe passages"
 war_adventurer_bardin.20.option_b:0 "Let local officers commission their own fort inspections"
 war_adventurer_bardin.20.option_c:0 "Publish the contractor's damning inspection report"
 war_adventurer_bardin.20.t:0 "An Ironbreaker's Inspection"
 war_adventurer_bardin.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf ranger Bardin Goreksson. A foreign engineer invited into our fort proved to be Bardin. Before disappearing, he released a report showing that the contractor had built unsafe escape passages for himself. The inspection report bears the signatures of officers who never noticed the concealed route beneath their own post.\n\nOur officials ask whether we should rebuild the unsafe passages. Another proposal is to let local officers commission their own fort inspections. His hosts expect the Dwarf to continue travelling before the court's decision reaches them."
 war_adventurer_bardin.21.t:0 "Bardin Goreksson has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_bardin.21.d:0 "Our officials in [war_adventurer_arrival_province.GetName] report the arrival of the wandering Dwarf ranger Bardin Goreksson. He has been questioning miners and studying maps of forgotten mountain roads.\n\nBardin served as an Ironbreaker at Karak Norn before taking up a ranger's wandering life. His great ambition is to find the lost hold of Karak Zorn, and few rumors of ancient Dwarf stonework escape his attention."
 war_adventurer_harald:0 "Harald Hammerstorm, Adventurer"
 desc_war_adventurer_harald:0 "Harald Hammerstorm's camp attracts northern warriors eager to test their strength beside the bearer of that terrible hammer. Tales of the dead recoiling before him have spread from the burial grounds to the barracks. His followers spend freely on weapons and drink, but every boast seems to end in a challenge."
 war_adventurer_harald.1.option_a:0 "Return the recovered tools to the tributary workshops"
 war_adventurer_harald.1.option_b:0 "Equip provincial camp guards with the captured armour"
 war_adventurer_harald.1.option_c:0 "Restore the tribute rolls from the recovered accounts"
 war_adventurer_harald.1.t:0 "The Hammer's Trophy"
 war_adventurer_harald.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the northern Chaos champion Harald Hammerstorm. Our warband's herald reports that Harald destroyed a daemon preying on tributary camps.\n\nIts scattered followers left armour and tribute, but rival captains dispute the right to collect them. The recovered tribute includes tools taken from the camps, and their former owners have marked them before the captains divide the spoils.\n\nOur officials ask whether we should return the recovered tools to the tributary workshops. Another proposal is to equip provincial camp guards with the captured armour. Harald has moved on in search of another worthy opponent."
 war_adventurer_harald.2.option_a:0 "Have guarded scholars examine the harmless inscriptions"
 war_adventurer_harald.2.option_b:0 "Distribute mundane salvaged tools to local craftsmen"
 war_adventurer_harald.2.option_c:0 "Leave the deeper chambers sealed"
 war_adventurer_harald.2.t:0 "Vorshgar's Other Door"
 war_adventurer_harald.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the northern Chaos champion Harald Hammerstorm. Treasure-seekers return from a ruin Harald cleared after they awakened its dead. They carry surviving relics and a bitter warning against following the deeper stair. The treasure-seekers have drawn the sealed lower doorway on the back of their inventory as a warning to anyone following them.\n\nOur officials ask whether we should have guarded scholars examine the harmless inscriptions. Another proposal is to distribute mundane salvaged tools to local craftsmen. The surviving scouts refuse to promise that any escort could compel the hammerer to remain."
 war_adventurer_harald.3.option_a:0 "Settle the rescued households in a rebuilt camp"
 war_adventurer_harald.3.option_b:0 "Enlist the surviving defenders in the provincial guard"
 war_adventurer_harald.3.option_c:0 "Restore the families' workshops with their salvaged goods"
 war_adventurer_harald.3.t:0 "A Night of Broken Bones"
 war_adventurer_harald.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the northern Chaos champion Harald Hammerstorm. Our camp reeve reports that Harald stood against walking dead until sunrise while families escaped. He has departed, leaving the warriors arguing over whether to rebuild or abandon the camp. The surviving families have brought their salvaged household goods to the muster ground, waiting to learn where they may rebuild.\n\nOur officials ask whether we should settle the rescued households in a rebuilt camp. Another proposal is to enlist the surviving defenders in the provincial guard. His followers are already gathering their trophies for the next march."
 war_adventurer_harald.4.option_a:0 "Reopen the cleared road under provincial toll officers"
 war_adventurer_harald.4.option_b:0 "Equip local road guards from the abandoned stores"
 war_adventurer_harald.4.t:0 "The Dead That Fled"
 war_adventurer_harald.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the northern Chaos champion Harald Hammerstorm. Scouts report a fleeing column of undead after Harald struck its leader. Their abandoned baggage has blocked a road that traders can now reopen. Drivers have begun sorting usable harness from the abandoned baggage while scouts watch the road for any returning dead.\n\nOur officials ask whether we should reopen the cleared road under provincial toll officers. Another proposal is to equip local road guards from the abandoned stores. Harald has shown no interest in waiting while officials settle the consequences of his passage."
 war_adventurer_harald.5.option_a:0 "Organize the eager provincial recruits"
 war_adventurer_harald.5.option_b:0 "Circulate the disciplined formation exercises to army officers"
 war_adventurer_harald.5.option_c:0 "Establish training fields for supervised contests"
 war_adventurer_harald.5.t:0 "A Champion's Unwanted Example"
 war_adventurer_harald.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the northern Chaos champion Harald Hammerstorm. Our captains report that Harald defeated a boasting challenger before the assembled warband.\n\nRecruits are imitating his discipline as eagerly as his reckless thirst for combat. The herald has recorded which recruits held their formation during the challenge and which merely rushed forward to see the killing.\n\nOur officials ask whether we should organize the eager provincial recruits. Another proposal is to circulate the disciplined formation exercises to army officers. The last report places the hammerer on a road leading beyond our patrols."
 war_adventurer_harald.6.option_a:0 "Restore the caravanserai as a provincial waystation"
 war_adventurer_harald.6.option_b:0 "Distribute its usable stores to local workshops"
 war_adventurer_harald.6.option_c:0 "Establish a stock exchange beside the reopened caravan stop"
 war_adventurer_harald.6.t:0 "The Haunted Caravanserai"
 war_adventurer_harald.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the northern Chaos champion Harald Hammerstorm. Merchants report that Harald demolished the undead guarding an abandoned caravanserai. They want it reopened but fear the warrior's returning followers more than the former ghosts. The merchants' estimates distinguish the stores that can be sold immediately from the repairs needed before caravans can stay overnight.\n\nOur officials ask whether we should restore the caravanserai as a provincial waystation. Another proposal is to distribute its usable stores to local workshops. Harald has moved on in search of another worthy opponent."
 war_adventurer_harald.7.option_a:0 "Return the liberated tools to the provincial craftsmen"
 war_adventurer_harald.7.option_b:0 "Examine the broken idol under scholarly guard"
 war_adventurer_harald.7.option_c:0 "Restore the workshops to the provincial tax rolls"
 war_adventurer_harald.7.t:0 "A Daemon's Broken Idol"
 war_adventurer_harald.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the northern Chaos champion Harald Hammerstorm. Our local governor reports that Harald shattered a daemon's material anchor during a clash outside town. The liberated workshops still contain tribute and useful tools. The workshop masters have identified their confiscated tools among the rubble surrounding the shattered idol.\n\nOur officials ask whether we should return the liberated tools to the provincial craftsmen. Another proposal is to examine the broken idol under scholarly guard. The surviving scouts refuse to promise that any escort could compel the hammerer to remain."
 war_adventurer_harald.8.option_a:0 "Reopen the cemetery and its surrounding households"
 war_adventurer_harald.8.option_b:0 "Recruit a living watch for the cleared burial ground"
 war_adventurer_harald.8.t:0 "The Cemetery's Empty Watch"
 war_adventurer_harald.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the northern Chaos champion Harald Hammerstorm. Our magistrate reports that the graveyard's walking sentries collapsed after Harald passed through. Families are asking permission to recover remains previously held for ransom by a rogue keeper. The keeper's fee ledger names households that paid repeatedly without ever receiving permission to bury their relatives.\n\nOur officials ask whether we should reopen the cemetery and its surrounding households. Another proposal is to recruit a living watch for the cleared burial ground. His followers are already gathering their trophies for the next march."
 war_adventurer_harald.9.option_a:0 "Translate the surviving warning tablets"
 war_adventurer_harald.9.option_b:0 "Train provincial ruin wardens along the cleared approach"
 war_adventurer_harald.9.option_c:0 "Establish a university archive for the recovered tablets"
 war_adventurer_harald.9.t:0 "The Foreign Barrow's Warning"
 war_adventurer_harald.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the northern Chaos champion Harald Hammerstorm. Excavators report that Harald fought through a night of awakened skeletons after their survey breached a barrow.\n\nThe surviving tablets describe safer routes through neighbouring ruins. The excavators have copied the warning marks onto a plan of the outer chambers before the original tablets deteriorate further.\n\nOur officials ask whether we should translate the surviving warning tablets. Another proposal is to train provincial ruin wardens along the cleared approach. Harald has shown no interest in waiting while officials settle the consequences of his passage."
 war_adventurer_harald.10.option_a:0 "Restore the waystation with the recovered tolls"
 war_adventurer_harald.10.option_b:0 "Equip local road wardens from the abandoned stores"
 war_adventurer_harald.10.option_c:0 "Return recovered tools and freight to provincial craftsmen"
 war_adventurer_harald.10.t:0 "A Hammer at the Toll Road"
 war_adventurer_harald.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the northern Chaos champion Harald Hammerstorm. A caravan captain reports that Harald killed a monstrous toll-collector and walked away without claiming the toll chest. Several settlements now petition over the recovered payments. Several toll receipts remain inside the chest, allowing at least some of the recovered money to be returned to its owners.\n\nOur officials ask whether we should restore the waystation with the recovered tolls. Another proposal is to equip local road wardens from the abandoned stores. The last report places the hammerer on a road leading beyond our patrols."
 war_adventurer_harald.11.option_a:0 "Purchase and equip replacement gate guards"
 war_adventurer_harald.11.option_b:0 "Let district captains organize their own defensive forces"
 war_adventurer_harald.11.option_c:0 "Abandon the exposed gate district"
 war_adventurer_harald.11.t:0 "Bones at the Northern Gate"
 war_adventurer_harald.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the northern Chaos champion Harald Hammerstorm. Our necromantic commander reports that Harald destroyed the dead guarding a northern gate. The surviving attendants fled when creatures supposedly incapable of fear turned and ran. The attendants have collected the guard's scattered weapons, but the spirits that once animated their bearers no longer answer.\n\nOur officials ask whether we should purchase and equip replacement gate guards. Another proposal is to let district captains organize their own defensive forces. Harald has moved on in search of another worthy opponent."
 war_adventurer_harald.12.option_a:0 "Recruit a replacement for the champion's retinue"
 war_adventurer_harald.12.option_b:0 "Let local warriors choose their own protectors"
 war_adventurer_harald.12.option_c:0 "Accept the public humiliation at the shrine"
 war_adventurer_harald.12.t:0 "The Shrine's Shattered Champion"
 war_adventurer_harald.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the northern Chaos champion Harald Hammerstorm. Our governor reports that Harald killed the champion defending a newly established occupation shrine. Local warriors are circulating the story as proof that our protection is hollow. The champion's shattered insignia has been carried through nearby camps by witnesses eager to describe the defeat.\n\nOur officials ask whether we should recruit a replacement for the champion's retinue. Another proposal is to let local warriors choose their own protectors. The surviving scouts refuse to promise that any escort could compel the hammerer to remain."
 war_adventurer_harald.13.option_a:0 "Pay a new team to clear and stabilize the dig"
 war_adventurer_harald.13.option_b:0 "Leave the collapsed excavation and its camp abandoned"
 war_adventurer_harald.13.option_c:0 "Turn all future excavations over to the local communities"
 war_adventurer_harald.13.t:0 "The Barrow We Reopened"
 war_adventurer_harald.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the northern Chaos champion Harald Hammerstorm. Our excavators awakened an ancient garrison and then watched Harald destroy it along with their equipment.\n\nThe dig has collapsed and the survivors refuse to return. The survey stakes disappear beneath fallen stone, and the survivors cannot even recover the tools needed to reopen the entrance.\n\nOur officials ask whether we should pay a new team to clear and stabilize the dig. Another proposal is to leave the collapsed excavation and its camp abandoned. His followers are already gathering their trophies for the next march."
 war_adventurer_harald.14.option_a:0 "Recover and replace the patrol's equipment"
 war_adventurer_harald.14.option_b:0 "Leave the ancestral ruin beyond the state patrols' authority"
 war_adventurer_harald.14.t:0 "The Night Watch's Last Horn"
 war_adventurer_harald.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the northern Chaos champion Harald Hammerstorm. The last survivors of our patrol report that Harald pursued them through an ancestral ruin after they tried to arrest him. Their equipment remains scattered among freshly smashed tombs. The patrol's last horn was recovered from the threshold, broken where its bearer fell during the retreat.\n\nOur officials ask whether we should recover and replace the patrol's equipment. Another proposal is to leave the ancestral ruin beyond the state patrols' authority. Harald has shown no interest in waiting while officials settle the consequences of his passage."
 war_adventurer_harald.15.option_a:0 "Recognize the tribes' right to negotiate their own obligations"
 war_adventurer_harald.15.option_b:0 "Purchase renewed loyalty with compensation"
 war_adventurer_harald.15.option_c:0 "Admit that the officer's submission claims were false"
 war_adventurer_harald.15.t:0 "A Hammer Against Our Oath"
 war_adventurer_harald.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the northern Chaos champion Harald Hammerstorm. Our occupation captain reports that Harald defeated an officer who claimed the local tribes had submitted willingly. The officer survived, but the public challenge has undermined our agreements. Several tribal spokesmen now insist that their supposed pledges be read aloud and renewed before another levy is collected.\n\nOur officials ask whether we should recognize the tribes' right to negotiate their own obligations. Another proposal is to purchase renewed loyalty with compensation. The last report places the hammerer on a road leading beyond our patrols."
 war_adventurer_harald.16.option_a:0 "Rebuild the ceremonial escort"
 war_adventurer_harald.16.option_b:0 "Let the provincial custodians arrange their own processions"
 war_adventurer_harald.16.option_c:0 "Acknowledge the destruction of the sacred escort"
 war_adventurer_harald.16.t:0 "A Procession of Empty Armour"
 war_adventurer_harald.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the northern Chaos champion Harald Hammerstorm. Our court receives a report that Harald smashed an undead ceremonial escort in full view of the population. Its attendants fled, leaving the state's sacred insignia trampled in the road. The procession's discarded standards have been recovered by street traders, who demand payment before returning them to the attendants.\n\nOur officials ask whether we should rebuild the ceremonial escort. Another proposal is to let the provincial custodians arrange their own processions. Harald has moved on in search of another worthy opponent."
 war_adventurer_harald.17.option_a:0 "Hire soldiers to replace the abandoned outer watch"
 war_adventurer_harald.17.option_b:0 "Let the garrison captains decide which districts they will protect"
 war_adventurer_harald.17.t:0 "The Foreign Fort's Broken Hero"
 war_adventurer_harald.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the northern Chaos champion Harald Hammerstorm. Our commander reports that Harald killed the champion stationed at an isolated fort.\n\nThe remaining soldiers abandoned their outer post rather than accept his next challenge. The fort's officers have withdrawn the outer watch to the inner gate, leaving a stretch of road unpatrolled.\n\nOur officials ask whether we should hire soldiers to replace the abandoned outer watch. Another proposal is to let the garrison captains decide which districts they will protect. The surviving scouts refuse to promise that any escort could compel the hammerer to remain."
 war_adventurer_harald.18.option_a:0 "Rehouse the workers and repair the excavation road"
 war_adventurer_harald.18.option_b:0 "Abandon the ruined camp and treasury workings"
 war_adventurer_harald.18.option_c:0 "Give the local custodians authority over future tomb surveys"
 war_adventurer_harald.18.t:0 "A Tomb Opened for Tribute"
 war_adventurer_harald.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the northern Chaos champion Harald Hammerstorm. Officials excavating a tomb to collect valuables report that Harald fought its awakened defenders until both treasury chambers and survey camp were ruined. He has already left the district. The surviving excavators have submitted a list of the tools lost beneath the collapsed treasury chambers.\n\nOur officials ask whether we should rehouse the workers and repair the excavation road. Another proposal is to abandon the ruined camp and treasury workings. His followers are already gathering their trophies for the next march."
 war_adventurer_harald.19.option_a:0 "Hire ordinary guards for the exposed route"
 war_adventurer_harald.19.option_b:0 "Leave the road communities to organize their own protection"
 war_adventurer_harald.19.option_c:0 "Admit that the bound guardian is gone for good"
 war_adventurer_harald.19.t:0 "The Spirit That Could Not Return"
 war_adventurer_harald.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the northern Chaos champion Harald Hammerstorm. Our necromancer reports that a bound guardian struck by Harald cannot be summoned again. Its disappearance has exposed a route previously considered secure. The necromancer has repeated the binding three times without response and finally requests guards who can walk to their posts unaided.\n\nOur officials ask whether we should hire ordinary guards for the exposed route. Another proposal is to leave the road communities to organize their own protection. Harald has shown no interest in waiting while officials settle the consequences of his passage."
 war_adventurer_harald.20.option_a:0 "Recognize Harald's victory before the observers"
 war_adventurer_harald.20.option_b:0 "Compensate the defeated provincial company"
 war_adventurer_harald.20.option_c:0 "Let the local martial guild administer future tournaments"
 war_adventurer_harald.20.t:0 "The Tournament's Uninvited Guest"
 war_adventurer_harald.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the northern Chaos champion Harald Hammerstorm. Our herald reports that Harald entered a provincial martial display, defeated its champion, and escaped before the guards closed the field. Foreign observers are asking whether the result will be acknowledged. The herald's official score sheet contradicts the account already sent to the visiting observers by their own attendants.\n\nOur officials ask whether we should recognize Harald's victory before the observers. Another proposal is to compensate the defeated provincial company. The last report places the hammerer on a road leading beyond our patrols."
 war_adventurer_harald.21.t:0 "Harald Hammerstorm has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_harald.21.d:0 "Scouts report that the northern Chaos champion Harald Hammerstorm has arrived in [war_adventurer_arrival_province.GetName]. The warrior carries the great hammer from which his name is taken.\n\nHis reputation rests on savage feats of arms and his particular hatred of the undead. Tales of his escape from the tombs of Vorshgar claim that even the restless dead learned to fear him."
 war_adventurer_abhorash:0 "Abhorash, Adventurer"
 desc_war_adventurer_abhorash:0 "A solitary swordsman is testing the province's finest fighters with a discipline that makes their bravado look childish. Those who recognize Abhorash whisper of the vampire who overcame his thirst by drinking a dragon's blood. His example sharpens blades and drills alike, while rumors of his nature keep shutters closed after dusk."
 war_adventurer_abhorash.1.option_a:0 "Preserve the corrected account beside the old inscription"
 war_adventurer_abhorash.1.option_b:0 "Restore homes for the rescued palace workers"
 war_adventurer_abhorash.1.option_c:0 "Establish a university archive for the surviving palace records"
 war_adventurer_abhorash.1.t:0 "The Palace Steps Remember"
 war_adventurer_abhorash.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the ancient vampire swordsman Abhorash. Our custodians report that Abhorash defended workers restoring an ancient palace stair against tomb predators.\n\nHis terse corrections to their inscription contradict the official account of Lahmia's fall. The custodians have preserved the damaged inscription beside a fresh copy of the corrections dictated by their unexpected defender.\n\nOur officials ask whether we should preserve the corrected account beside the old inscription. Another proposal is to restore homes for the rescued palace workers. The swordsman left before the local officers could arrange an audience."
 war_adventurer_abhorash.2.option_a:0 "Remove the coercion network from provincial revenue collection"
 war_adventurer_abhorash.2.option_b:0 "Recruit a local watch independent of the exposed intermediaries"
 war_adventurer_abhorash.2.option_c:0 "File the letters and let the fugitives depart"
 war_adventurer_abhorash.2.t:0 "The Prisoner He Would Not Yield"
 war_adventurer_abhorash.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the ancient vampire swordsman Abhorash. Our governor reports that Abhorash defeated a dangerous vampire but refused to surrender the captive to a sorcerer claiming authority over her. Their abandoned correspondence exposes a local coercion network. The abandoned letters name intermediaries who collected payments for threats the defeated vampire was supposed to enforce.\n\nOur officials ask whether we should remove the coercion network from provincial revenue collection. Another proposal is to recruit a local watch independent of the exposed intermediaries. No witness believes the stranger would accept confinement while the court debates his actions."
 war_adventurer_abhorash.3.option_a:0 "Study the sealed specimens without promising a cure"
 war_adventurer_abhorash.3.option_b:0 "Recruit the experienced guides into the provincial watch"
 war_adventurer_abhorash.3.option_c:0 "Establish training fields for the surviving beast hunters"
 war_adventurer_abhorash.3.t:0 "Blood Beyond Hunger"
 war_adventurer_abhorash.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the ancient vampire swordsman Abhorash. A physician brings observations left by Abhorash after he slew a dangerous scaled beast. He rejected ordinary tribute and warned against mistaking his ancient triumph over hunger for an easily repeated cure. The physician has sealed the samples separately from the hunters' trophies to discourage anyone from testing the blood on themselves.\n\nOur officials ask whether we should study the sealed specimens without promising a cure. Another proposal is to recruit the experienced guides into the provincial watch. Abhorash has taken no payment that could oblige him to remain in our service."
 war_adventurer_abhorash.4.option_a:0 "Restore the passage and the rescued households' homes"
 war_adventurer_abhorash.4.option_b:0 "Teach provincial guards how the stair was defended"
 war_adventurer_abhorash.4.t:0 "The Last Gate of Lahmia"
 war_adventurer_abhorash.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the ancient vampire swordsman Abhorash. Our garrison commander reports that Abhorash held a breach until civilians escaped a collapsing ruin. Survivors compare the rescue with his doomed defence of ancient Lahmia. The last families escaped carrying the wounded through a passage whose entrance the defenders had believed impossible to hold.\n\nOur officials ask whether we should restore the passage and the rescued households' homes. Another proposal is to teach provincial guards how the stair was defended. The swordsman's hosts found his quarters empty when they returned with the governor's summons."
 war_adventurer_abhorash.5.option_a:0 "Train the provincial guard from the swordsman's exercises"
 war_adventurer_abhorash.5.option_b:0 "Circulate the formation exercises to our army officers"
 war_adventurer_abhorash.5.option_c:0 "Establish training fields for supervised sword practice"
 war_adventurer_abhorash.5.t:0 "A Duel Without Feeding"
 war_adventurer_abhorash.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the ancient vampire swordsman Abhorash. A local champion returns defeated but alive after challenging Abhorash.\n\nThe stranger refused the customary payment and left a demanding schedule of exercises for anyone seeking another contest. The defeated champion has copied the exercises for his own officers rather than conceal the manner of his defeat.\n\nOur officials ask whether we should train the provincial guard from the swordsman's exercises. Another proposal is to circulate the formation exercises to our army officers. Abhorash has refused a position at court and continued his wandering."
 war_adventurer_abhorash.6.option_a:0 "Return hoarded tools and goods to provincial workshops"
 war_adventurer_abhorash.6.option_b:0 "Have scholars examine the drake's remains"
 war_adventurer_abhorash.6.option_c:0 "Restore the threatened settlements with recovered valuables"
 war_adventurer_abhorash.6.t:0 "The Dragon's Empty Lair"
 war_adventurer_abhorash.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the ancient vampire swordsman Abhorash. Our scouts report that Abhorash killed a dangerous drake and departed without taking its hoard. His followers insist the deed recalls his victory over a true dragon, but cannot promise miraculous properties in the remains. The scouts have placed guards over the abandoned valuables while guides from the threatened settlements identify what was stolen from them.\n\nOur officials ask whether we should return hoarded tools and goods to provincial workshops. Another proposal is to have scholars examine the drake's remains. The swordsman left before the local officers could arrange an audience."
 war_adventurer_abhorash.7.option_a:0 "Remove the exposed intermediaries from provincial offices"
 war_adventurer_abhorash.7.option_b:0 "Establish a local watch free of the claimants' influence"
 war_adventurer_abhorash.7.option_c:0 "Keep the correspondence under seal"
 war_adventurer_abhorash.7.t:0 "A Captive Claimed by Two Courts"
 war_adventurer_abhorash.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the ancient vampire swordsman Abhorash. Our magistrate reports that Abhorash defeated a visiting vampire and prevented another sorcerer from taking custody. Their dispute spilled confidential letters into our officials' hands. Both claimants used the same local intermediaries, leaving enough correspondence to reconstruct their concealed arrangements.\n\nOur officials ask whether we should remove the exposed intermediaries from provincial offices. Another proposal is to establish a local watch free of the claimants' influence. No witness believes the stranger would accept confinement while the court debates his actions."
 war_adventurer_abhorash.8.option_a:0 "Settle the rescued households in the province"
 war_adventurer_abhorash.8.option_b:0 "Enlist willing survivors in the provincial guard"
 war_adventurer_abhorash.8.option_c:0 "Reequip the refugees' workshops with their saved tools"
 war_adventurer_abhorash.8.t:0 "The Foreign City's Stair"
 war_adventurer_abhorash.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the ancient vampire swordsman Abhorash. Refugees report that Abhorash held a palace stair while a marauding force searched for captives. He left after the evacuation, refusing an invitation to take command. The refugees have brought intact tools and household possessions through the defended stair, giving them a chance to begin again.\n\nOur officials ask whether we should settle the rescued households in the province. Another proposal is to enlist willing survivors in the provincial guard. Abhorash has taken no payment that could oblige him to remain in our service."
 war_adventurer_abhorash.9.option_a:0 "Teach the corrected formations to provincial recruits"
 war_adventurer_abhorash.9.option_b:0 "Use the captain's account in army officer instruction"
 war_adventurer_abhorash.9.t:0 "The Swordsman's Unpaid Lesson"
 war_adventurer_abhorash.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the ancient vampire swordsman Abhorash. Our guard captain admits that a stranger defeated his best officers, then showed them how their formation failed.\n\nWitnesses identify Abhorash, who has already continued his journey. The guard captain has marked the stranger's corrections on his formation chart and signed an account admitting his own errors.\n\nOur officials ask whether we should teach the corrected formations to provincial recruits. Another proposal is to use the captain's account in army officer instruction. The swordsman's hosts found his quarters empty when they returned with the governor's summons."
 war_adventurer_abhorash.10.option_a:0 "Replace fraudulent licences with inspected local practices"
 war_adventurer_abhorash.10.option_b:0 "Give the seized ordinary equipment to honest provincial apothecaries"
 war_adventurer_abhorash.10.option_c:0 "Endow a cathedral to supervise the shrine's charitable work"
 war_adventurer_abhorash.10.t:0 "The Shrine of a False Dragon"
 war_adventurer_abhorash.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the ancient vampire swordsman Abhorash. Temple officials report that Abhorash exposed a charlatan selling a supposed cure for vampiric hunger. He destroyed the fraudulent draughts but left evidence of the sellers' wider network. Several purchasers have surrendered unopened bottles, while the temple keeps the false remedy's account books under seal.\n\nOur officials ask whether we should replace fraudulent licences with inspected local practices. Another proposal is to give the seized ordinary equipment to honest provincial apothecaries. Abhorash has refused a position at court and continued his wandering."
 war_adventurer_abhorash.11.option_a:0 "Reequip and reinforce the palace guard"
 war_adventurer_abhorash.11.option_b:0 "Relinquish state control of the exposed palace quarter"
 war_adventurer_abhorash.11.option_c:0 "Demolish houses around the escape route to deny further shelter"
 war_adventurer_abhorash.11.t:0 "The Steps We Could Not Hold"
 war_adventurer_abhorash.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the ancient vampire swordsman Abhorash. Our occupation commander reports that Abhorash cut through the palace guard and led captives out by an ancient stair. The attack has revived stories of Lahmia's defence among the inhabitants. The surviving guards have abandoned the lower stair, allowing local residents to carry the rescued prisoners away before reinforcements arrive.\n\nOur officials ask whether we should reequip and reinforce the palace guard. Another proposal is to relinquish state control of the exposed palace quarter. The swordsman left before the local officers could arrange an audience."
 war_adventurer_abhorash.12.option_a:0 "Leave disputes over local captives to provincial arbiters"
 war_adventurer_abhorash.12.option_b:0 "Compensate the defeated escort's families"
 war_adventurer_abhorash.12.t:0 "The Sorcerer's Refused Demand"
 war_adventurer_abhorash.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the ancient vampire swordsman Abhorash. Our envoy reports that Abhorash defeated our escort after it tried to seize a vampire under his protection. The prisoner escaped, and the papers authorizing the seizure are now public. Copies of the seizure order now bear witnesses' descriptions of the defeated escort beside the envoy's official seal.\n\nOur officials ask whether we should leave disputes over local captives to provincial arbiters. Another proposal is to compensate the defeated escort's families. No witness believes the stranger would accept confinement while the court debates his actions."
 war_adventurer_abhorash.13.option_a:0 "Purchase a replacement for the military beast"
 war_adventurer_abhorash.13.option_b:0 "Let provincial commanders arrange their own defences"
 war_adventurer_abhorash.13.option_c:0 "Publicly acknowledge the beast-master's defeat"
 war_adventurer_abhorash.13.t:0 "An Empty Beast Pen"
 war_adventurer_abhorash.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the ancient vampire swordsman Abhorash. Our beast-master reports that Abhorash killed a prized draconic creature in single combat.\n\nHe ignored the treasury beside its pen, making the loss look like judgement rather than robbery. The surviving handlers have locked the empty pen and submitted the purchase records to demonstrate the value of the loss.\n\nOur officials ask whether we should purchase a replacement for the military beast. Another proposal is to let provincial commanders arrange their own defences. Abhorash has taken no payment that could oblige him to remain in our service."
 war_adventurer_abhorash.14.option_a:0 "Give the provincial communities oversight of prisoner treatment"
 war_adventurer_abhorash.14.option_b:0 "Rebuild the defeated guard establishment"
 war_adventurer_abhorash.14.option_c:0 "Endure the public challenge above the gate"
 war_adventurer_abhorash.14.t:0 "The Challenge on the Gate"
 war_adventurer_abhorash.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the ancient vampire swordsman Abhorash. Our governor finds the garrison champion's broken weapon hung above the city gate. Abhorash spared the defeated soldiers but left a demand that prisoners be treated honourably. Families of the released prisoners have gathered below the broken weapon, demanding that the stranger's warning be obeyed.\n\nOur officials ask whether we should give the provincial communities oversight of prisoner treatment. Another proposal is to rebuild the defeated guard establishment. The swordsman's hosts found his quarters empty when they returned with the governor's summons."
 war_adventurer_abhorash.15.option_a:0 "Repay the disputed household levy"
 war_adventurer_abhorash.15.option_b:0 "Let the communities supervise their own tax collection"
 war_adventurer_abhorash.15.option_c:0 "Accept the published accusations against the collectors"
 war_adventurer_abhorash.15.t:0 "The Collector of Blood"
 war_adventurer_abhorash.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the ancient vampire swordsman Abhorash. Our tax officer reports that Abhorash scattered an armed collection party abusing local households. Its ledgers were left with the victims, who now demand repayment. The households have compared the seized ledgers with their own receipts, producing a list of payments they expect returned.\n\nOur officials ask whether we should repay the disputed household levy. Another proposal is to let the communities supervise their own tax collection. Abhorash has refused a position at court and continued his wandering."
 war_adventurer_abhorash.16.option_a:0 "Acknowledge the officer's defeat in the witnessed duel"
 war_adventurer_abhorash.16.option_b:0 "Pay for the officer's funeral and dependants"
 war_adventurer_abhorash.16.option_c:0 "Let the provincial martial guild adjudicate the challenge"
 war_adventurer_abhorash.16.t:0 "The Champion's Last Salute"
 war_adventurer_abhorash.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the ancient vampire swordsman Abhorash. Our herald reports that Abhorash killed a celebrated officer in an openly witnessed duel. The officer's companions escaped unharmed and insist that their ruler honour the result. The officer's companions have returned his broken sword and insist that no ambush or treachery caused his death.\n\nOur officials ask whether we should acknowledge the officer's defeat in the witnessed duel. Another proposal is to pay for the officer's funeral and dependants. The swordsman left before the local officers could arrange an audience."
 war_adventurer_abhorash.17.option_a:0 "Honour the drake purchase contract"
 war_adventurer_abhorash.17.option_b:0 "Allow provincial merchants to arbitrate the failed delivery"
 war_adventurer_abhorash.17.option_c:0 "Strip the district of supplies to recover the lost payment"
 war_adventurer_abhorash.17.t:0 "A Dragon Sold Too Soon"
 war_adventurer_abhorash.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the ancient vampire swordsman Abhorash. Our merchant-agent reports that Abhorash slew the drake bought for our army before delivery.\n\nThe contract is enforceable, and the creature's remains are worth much less than the promised weapon. The merchant has presented the signed delivery terms together with an estimate of the much smaller sum the carcass might fetch.\n\nOur officials ask whether we should honour the drake purchase contract. Another proposal is to allow provincial merchants to arbitrate the failed delivery. No witness believes the stranger would accept confinement while the court debates his actions."
 war_adventurer_abhorash.18.option_a:0 "Settle the defeated escort's claims"
 war_adventurer_abhorash.18.option_b:0 "Give provincial magistrates control of future custody disputes"
 war_adventurer_abhorash.18.t:0 "The Fugitive He Protected"
 war_adventurer_abhorash.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the ancient vampire swordsman Abhorash. Our prison commander reports that Abhorash took a captive vampire from a sorcerer's escort after defeating its guards. Neither fugitive remains in the province, and the escort's allies demand answers. The defeated escort has returned with empty restraints and conflicting instructions from the sorcerer who claimed the captive.\n\nOur officials ask whether we should settle the defeated escort's claims. Another proposal is to give provincial magistrates control of future custody disputes. Abhorash has taken no payment that could oblige him to remain in our service."
 war_adventurer_abhorash.19.option_a:0 "Replace the guard's pay and damaged equipment"
 war_adventurer_abhorash.19.option_b:0 "Abandon the broken outer compound"
 war_adventurer_abhorash.19.option_c:0 "Let local captains reorganize the palace district independently"
 war_adventurer_abhorash.19.t:0 "The Foreign Palace Breach"
 war_adventurer_abhorash.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the ancient vampire swordsman Abhorash. Our governor reports that Abhorash opened a route through the palace guard during a mass escape. The surviving soldiers refuse to pursue him into the ruins beyond the city. The gate's outer hinges were cut during the escape, and the quartermaster cannot secure the compound with the remaining guard.\n\nOur officials ask whether we should replace the guard's pay and damaged equipment. Another proposal is to abandon the broken outer compound. The swordsman's hosts found his quarters empty when they returned with the governor's summons."
 war_adventurer_abhorash.20.option_a:0 "Compensate the freed captives"
 war_adventurer_abhorash.20.option_b:0 "Transfer the noble's authority to an independent provincial council"
 war_adventurer_abhorash.20.option_c:0 "Defend the disgraced noble before the court"
 war_adventurer_abhorash.20.t:0 "The Trophy He Left Behind"
 war_adventurer_abhorash.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the ancient vampire swordsman Abhorash. A provincial noble presented Abhorash with captives as a reward for killing a monster. Our officials now report the captives freed and the noble publicly defeated before the entire court. The freed captives have given matching accounts of the presentation, leaving the noble unable to dismiss the humiliation as private gossip.\n\nOur officials ask whether we should compensate the freed captives. Another proposal is to transfer the noble's authority to an independent provincial council. Abhorash has refused a position at court and continued his wandering."
 war_adventurer_abhorash.21.t:0 "Abhorash has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_abhorash.21.d:0 "Reports from [war_adventurer_arrival_province.GetName] describe a solitary warrior whom our informants identify as the ancient vampire swordsman Abhorash. He has shown little interest in titles or hospitality, but considerable interest in worthy opponents.\n\nHis pursuit of martial perfection inspired the Blood Dragons. It is said that he slew a dragon and drank its blood, freeing himself from the thirst that rules his kind."
 war_adventurer_elspeth:0 "Elspeth von Draken, Adventurer"
 desc_war_adventurer_elspeth:0 "Elspeth von Draken has requested old burial records and access to vaults whose seals the custodians would rather leave undisturbed. Her studies of death and forgotten relics have prompted a hurried inspection of crypt doors and neglected wards. Petitioners gather outside her lodgings, but the Amethyst wizard has little patience for officials who interrupt her work."
 war_adventurer_elspeth.1.option_a:0 "Reopen the corrected burial precinct and its local records"
 war_adventurer_elspeth.1.option_b:0 "Have scholars examine the corrected funerary inscription"
 war_adventurer_elspeth.1.option_c:0 "House the restored reliquary in a new cathedral"
 war_adventurer_elspeth.1.t:0 "The Tower's Returned Reliquary"
 war_adventurer_elspeth.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the reclusive Amethyst wizard Elspeth von Draken. Our cemetery keeper reports that Elspeth recovered a stolen funerary relic and identified a dangerous error in its inscription.\n\nShe returned to her tower before officials could question her methods. The keeper has copied the faulty line beside Elspeth's correction so that the same mistake need not be repeated at future burials.\n\nOur officials ask whether we should reopen the corrected burial precinct and its local records. Another proposal is to have scholars examine the corrected funerary inscription. The Amethyst visitor has closed her temporary refuge and prepared to depart."
 war_adventurer_elspeth.2.option_a:0 "Clear the sluices and reopen the provincial mills"
 war_adventurer_elspeth.2.option_b:0 "Examine the remains under supervised conditions"
 war_adventurer_elspeth.2.option_c:0 "Equip willing local marsh wardens with the recovered baggage"
 war_adventurer_elspeth.2.t:0 "Rawbones in the Reed Beds"
 war_adventurer_elspeth.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the reclusive Amethyst wizard Elspeth von Draken. Our marsh patrol brings remains of a monstrous corpse-heap destroyed by Elspeth. Witnesses compare it to Rawbones, while nearby villagers demand the blocked waterways be cleared. Reeds and broken bones have lodged around the mill sluice, while patrolmen keep curious villagers away from the largest remains.\n\nOur officials ask whether we should clear the sluices and reopen the provincial mills. Another proposal is to examine the remains under supervised conditions. Elspeth has left a written warning in place of an audience and moved beyond the local watch."
 war_adventurer_elspeth.3.option_a:0 "Remove the vampire's false contracts from provincial administration"
 war_adventurer_elspeth.3.option_b:0 "Return confiscated tools and goods to the local traders"
 war_adventurer_elspeth.3.t:0 "The Lady Behind the Mirror"
 war_adventurer_elspeth.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the reclusive Amethyst wizard Elspeth von Draken. Our court clerk reports that Elspeth exposed a vampire intermediary using borrowed identities. The intruder escaped her first trap, but abandoned letters reveal a network resembling Vashara's methods. The clerk has matched several false names to gifts still held by officials who deny ever meeting the same visitor twice.\n\nOur officials ask whether we should remove the vampire's false contracts from provincial administration. Another proposal is to return confiscated tools and goods to the local traders. No officer has persuaded the wizard to remain while the surviving papers are examined."
 war_adventurer_elspeth.4.option_a:0 "Reopen local offices compromised by the recovered criminal evidence"
 war_adventurer_elspeth.4.option_b:0 "Reorganize the provincial watch around lawful searches"
 war_adventurer_elspeth.4.option_c:0 "File the hunters' testimony without endorsing another search"
 war_adventurer_elspeth.4.t:0 "The Witch Hunters' Silence"
 war_adventurer_elspeth.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the reclusive Amethyst wizard Elspeth von Draken. Our magistrate reports that hunters who forced their way into Elspeth's refuge returned alive but unable to explain what they saw. They left recovered criminal evidence and a dispute over jurisdiction. The hunters will discuss the recovered evidence, but none will volunteer to lead another search of the refuge.\n\nOur officials ask whether we should reopen local offices compromised by the recovered criminal evidence. Another proposal is to reorganize the provincial watch around lawful searches. Elspeth has withdrawn from the officials sent to question her and will pursue her own investigations elsewhere."
 war_adventurer_elspeth.5.option_a:0 "Have scholars document the ward's preparation"
 war_adventurer_elspeth.5.option_b:0 "Provide a secure local holding for the champion's dependants"
 war_adventurer_elspeth.5.option_c:0 "Train provincial wardens from the surviving preparation records"
 war_adventurer_elspeth.5.t:0 "The Champion's Black Talisman"
 war_adventurer_elspeth.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the reclusive Amethyst wizard Elspeth von Draken. Our military council receives a survivor's account of a warded champion who died when an enemy tried to possess his body.\n\nElspeth's talisman destroyed the intruder, leaving the council both a defence to study and a family to compensate. The champion's surviving attendant has brought the broken talisman together with the family's petition for support.\n\nOur officials ask whether we should have scholars document the ward's preparation. Another proposal is to provide a secure local holding for the champion's dependants. Her attendants have offered no promise that the wizard will remain within reach of our messengers."
 war_adventurer_elspeth.6.option_a:0 "Translate the remaining archive notes"
 war_adventurer_elspeth.6.option_b:0 "Restore the cleared archive and its provincial records office"
 war_adventurer_elspeth.6.option_c:0 "Establish a university around the recovered collection"
 war_adventurer_elspeth.6.t:0 "A Tower in Another Language"
 war_adventurer_elspeth.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the reclusive Amethyst wizard Elspeth von Draken. Local scholars report that Elspeth opened a sealed archive and removed a lethal curse before departing with one disputed object. Her remaining notes explain several previously unreadable inscriptions. The remaining shelves contain legible catalogues, giving local scholars their first reliable guide to what the sealed archive once held.\n\nOur officials ask whether we should translate the remaining archive notes. Another proposal is to restore the cleared archive and its provincial records office. The Amethyst visitor has closed her temporary refuge and prepared to depart."
 war_adventurer_elspeth.7.option_a:0 "Restore homes and burial records for the surviving families"
 war_adventurer_elspeth.7.option_b:0 "Return recovered ordinary tools to provincial households"
 war_adventurer_elspeth.7.option_c:0 "Study the dismantled binding under guard"
 war_adventurer_elspeth.7.t:0 "The Marsh's Borrowed Dead"
 war_adventurer_elspeth.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the reclusive Amethyst wizard Elspeth von Draken. Our governor reports that Elspeth dismantled a shambling mass of stolen corpses outside a foreign burial ground. Families seek their remains while officials argue over who pays for identification. Burial attendants have separated recognizable belongings from the remains, allowing several families to identify those they lost.\n\nOur officials ask whether we should restore homes and burial records for the surviving families. Another proposal is to return recovered ordinary tools to provincial households. Elspeth has left a written warning in place of an audience and moved beyond the local watch."
 war_adventurer_elspeth.8.option_a:0 "Restore provincial contracts freed from the enchantment"
 war_adventurer_elspeth.8.option_b:0 "Put the purified ordinary gifts into local workshops"
 war_adventurer_elspeth.8.t:0 "A Diplomat with No Reflection"
 war_adventurer_elspeth.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the reclusive Amethyst wizard Elspeth von Draken. Our chamberlain receives Elspeth's evidence that a charming visitor has been enthralling officials. The visitor fled, leaving gifts that can be reclaimed once their enchantments are removed. The chamberlain has suspended the disputed agreements and placed the visitor's abandoned gifts under a guarded cover.\n\nOur officials ask whether we should restore provincial contracts freed from the enchantment. Another proposal is to put the purified ordinary gifts into local workshops. No officer has persuaded the wizard to remain while the surviving papers are examined."
 war_adventurer_elspeth.9.option_a:0 "Train provincial patrols from the captured route plans"
 war_adventurer_elspeth.9.option_b:0 "Restore the caravan survivors' waystations"
 war_adventurer_elspeth.9.option_c:0 "Return recovered cargo to provincial suppliers"
 war_adventurer_elspeth.9.t:0 "The Dragon Above the Caravan"
 war_adventurer_elspeth.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the reclusive Amethyst wizard Elspeth von Draken. Caravan survivors report Elspeth intercepting a hostile dragon-rider before it reached their camp.\n\nHer victory was costly, but recovered baggage includes the raiders' route plans. The caravan master has marked the intercepted routes against his own schedule, revealing where further attacks had been prepared.\n\nOur officials ask whether we should train provincial patrols from the captured route plans. Another proposal is to restore the caravan survivors' waystations. Elspeth has withdrawn from the officials sent to question her and will pursue her own investigations elsewhere."
 war_adventurer_elspeth.10.option_a:0 "Preserve the physician's preparation notes for careful study"
 war_adventurer_elspeth.10.option_b:0 "Train provincial wardens to recognize possession risks"
 war_adventurer_elspeth.10.option_c:0 "Seal the notes and forbid further demonstrations"
 war_adventurer_elspeth.10.t:0 "The Possessor's Empty Vessel"
 war_adventurer_elspeth.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the reclusive Amethyst wizard Elspeth von Draken. Our physician reports that Elspeth laid a trap inside a warded body intended for possession by a hostile spirit. The trap consumed the vessel, saving the ward but leaving an ethical dispute. The physician preserved the preparation notes, but the destruction of the vessel has left witnesses demanding limits on any repetition.\n\nOur officials ask whether we should preserve the physician's preparation notes for careful study. Another proposal is to train provincial wardens to recognize possession risks. Her attendants have offered no promise that the wizard will remain within reach of our messengers."
 war_adventurer_elspeth.11.option_a:0 "Hire workers to replace the released bound spirits"
 war_adventurer_elspeth.11.option_b:0 "Give local custodians control of the mortuary"
 war_adventurer_elspeth.11.option_c:0 "Close the cathedral that administered the coercive bindings"
 war_adventurer_elspeth.11.t:0 "The Garden Gives Up Its Prisoners"
 war_adventurer_elspeth.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the reclusive Amethyst wizard Elspeth von Draken. Our custodian reports that Elspeth entered a requisitioned mortuary and released spirits bound to official service. The records she left expose who ordered the bindings. The surviving burial records identify which offices requested the bound spirits and what services they were compelled to perform.\n\nOur officials ask whether we should hire workers to replace the released bound spirits. Another proposal is to give local custodians control of the mortuary. The Amethyst visitor has closed her temporary refuge and prepared to depart."
 war_adventurer_elspeth.12.option_a:0 "Pay specialist crews to clear the contaminated remains"
 war_adventurer_elspeth.12.option_b:0 "Abandon the ruined assembly yard"
 war_adventurer_elspeth.12.option_c:0 "Turn the workshops over to their own independent guild"
 war_adventurer_elspeth.12.t:0 "The Hulk That Fell Apart"
 war_adventurer_elspeth.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the reclusive Amethyst wizard Elspeth von Draken. Our necromantic engineer reports that Elspeth destroyed a corpse-built siege creature in its assembly yard. Contaminated remains now block the workshops and frighten the labour force. The engineers have cordoned off the assembly yard after workers found contaminated matter among the tools needed for the next commission.\n\nOur officials ask whether we should pay specialist crews to clear the contaminated remains. Another proposal is to abandon the ruined assembly yard. Elspeth has left a written warning in place of an audience and moved beyond the local watch."
 war_adventurer_elspeth.13.option_a:0 "Let the freed officials renegotiate their own provincial agreements"
 war_adventurer_elspeth.13.option_b:0 "Purchase settlements with the disappointed beneficiaries"
 war_adventurer_elspeth.13.t:0 "The Courtier's Broken Hold"
 war_adventurer_elspeth.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the reclusive Amethyst wizard Elspeth von Draken. Our governor reports that Elspeth broke a vampire agent's influence over provincial officials.\n\nSeveral agreements collapsed with the enchantment, and their beneficiaries are demanding enforcement. The officials freed from the agent's influence have begun contradicting the agreements they signed while under its power.\n\nOur officials ask whether we should let the freed officials renegotiate their own provincial agreements. Another proposal is to purchase settlements with the disappointed beneficiaries. No officer has persuaded the wizard to remain while the surviving papers are examined."
 war_adventurer_elspeth.14.option_a:0 "Transfer search authority to independent provincial magistrates"
 war_adventurer_elspeth.14.option_b:0 "Compensate the returning search party"
 war_adventurer_elspeth.14.option_c:0 "Accept the public ridicule of the failed warrant"
 war_adventurer_elspeth.14.t:0 "The Tower We Could Not Search"
 war_adventurer_elspeth.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the reclusive Amethyst wizard Elspeth von Draken. Our officers return from an attempted search of Elspeth's refuge unable to describe the interior. Their prisoners escaped during the confusion, and the warrant has become an object of ridicule. The search party returned without its seized papers, and the surviving officers cannot agree on what frightened them into flight.\n\nOur officials ask whether we should transfer search authority to independent provincial magistrates. Another proposal is to compensate the returning search party. Elspeth has withdrawn from the officials sent to question her and will pursue her own investigations elsewhere."
 war_adventurer_elspeth.15.option_a:0 "Rebuild the ritual facilities elsewhere"
 war_adventurer_elspeth.15.option_b:0 "Leave the shattered ritual quarter sealed and unrepaired"
 war_adventurer_elspeth.15.option_c:0 "Close the university responsible for the possession programme"
 war_adventurer_elspeth.15.t:0 "The Ward That Burned Its Master"
 war_adventurer_elspeth.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the reclusive Amethyst wizard Elspeth von Draken. Our court sorcerer tried to occupy a body prepared by Elspeth and triggered a hidden ward. The resulting blast destroyed the ritual chamber and much of its equipment. The demonstration's attendants have submitted incompatible accounts of the ward, leaving the ritual office unable to explain its own losses.\n\nOur officials ask whether we should rebuild the ritual facilities elsewhere. Another proposal is to leave the shattered ritual quarter sealed and unrepaired. Her attendants have offered no promise that the wizard will remain within reach of our messengers."
 war_adventurer_elspeth.16.option_a:0 "Cancel the promised display and explain the danger"
 war_adventurer_elspeth.16.option_b:0 "Reimburse the collection's sponsors"
 war_adventurer_elspeth.16.option_c:0 "Let the local custodians regulate future acquisitions"
 war_adventurer_elspeth.16.t:0 "The Collector's Missing Prize"
 war_adventurer_elspeth.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the reclusive Amethyst wizard Elspeth von Draken. Our treasury keeper reports that Elspeth removed an artefact from a foreign collection before a planned display. She left proof of its danger, but no explanation of where she took it. The keeper has marked an empty place in the display inventory while sponsors demand to know why their promised attraction has vanished.\n\nOur officials ask whether we should cancel the promised display and explain the danger. Another proposal is to reimburse the collection's sponsors. The Amethyst visitor has closed her temporary refuge and prepared to depart."
 war_adventurer_elspeth.17.option_a:0 "Pay specialist crews to recover the trapped supplies"
 war_adventurer_elspeth.17.option_b:0 "Leave the marsh road and its traffic to local wardens"
 war_adventurer_elspeth.17.option_c:0 "Cut a destructive bypass through the neighbouring land"
 war_adventurer_elspeth.17.t:0 "The Mire Engine's Ruin"
 war_adventurer_elspeth.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the reclusive Amethyst wizard Elspeth von Draken. Our frontier commander reports that Elspeth shattered a corpse-powered engine on a marsh road.\n\nThe wreckage traps supply wagons, and labourers refuse to handle its remains. The trapped wagons still contain usable supplies, but their drivers refuse to cross the contaminated wreckage to recover them.\n\nOur officials ask whether we should pay specialist crews to recover the trapped supplies. Another proposal is to leave the marsh road and its traffic to local wardens. Elspeth has left a written warning in place of an audience and moved beyond the local watch."
 war_adventurer_elspeth.18.option_a:0 "Give provincial officials independent control of diplomatic credentials"
 war_adventurer_elspeth.18.option_b:0 "Compensate the authorities deceived by the operative"
 war_adventurer_elspeth.18.option_c:0 "Publicly repudiate the compromised mission"
 war_adventurer_elspeth.18.t:0 "The Ambassador Unmasked"
 war_adventurer_elspeth.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the reclusive Amethyst wizard Elspeth von Draken. Our envoy reports that Elspeth exposed a vampire operative travelling under diplomatic protection. The operative escaped her attack, but the host's officials now hold the forged credentials. The forged credentials bear impressions of official seals, making a quiet denial increasingly difficult as copies circulate abroad.\n\nOur officials ask whether we should give provincial officials independent control of diplomatic credentials. Another proposal is to compensate the authorities deceived by the operative. No officer has persuaded the wizard to remain while the surviving papers are examined."
 war_adventurer_elspeth.19.option_a:0 "Replace the fortress's burned supplies"
 war_adventurer_elspeth.19.option_b:0 "Abandon the damaged storehouse district"
 war_adventurer_elspeth.19.option_c:0 "Allow local captains to arrange their own replacement patrols"
 war_adventurer_elspeth.19.t:0 "A Rider Falls from the Clouds"
 war_adventurer_elspeth.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the reclusive Amethyst wizard Elspeth von Draken. Our scouts report that Elspeth defeated a dragon-mounted officer above an outlying fortress. The fallen mount destroyed storehouses before she vanished from the scene. The quartermaster has separated burned stores from salvageable equipment and warns that the fortress cannot be supplied from the wreckage alone.\n\nOur officials ask whether we should replace the fortress's burned supplies. Another proposal is to abandon the damaged storehouse district. Elspeth has withdrawn from the officials sent to question her and will pursue her own investigations elsewhere."
 war_adventurer_elspeth.20.option_a:0 "Pay for recovery and replacement equipment"
 war_adventurer_elspeth.20.option_b:0 "Place interrogations under an independent provincial council"
 war_adventurer_elspeth.20.option_c:0 "Close the university that supplied the possession apparatus"
 war_adventurer_elspeth.20.t:0 "The Trap in the Captive"
 war_adventurer_elspeth.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the reclusive Amethyst wizard Elspeth von Draken. Our interrogator reports that a prisoner selected for a possession ritual carried Elspeth's concealed ward. Its activation destroyed the apparatus and scattered the officers attending the demonstration. The surviving attendants have sealed the shattered chamber, afraid that another concealed ward may remain among the prisoners' possessions.\n\nOur officials ask whether we should pay for recovery and replacement equipment. Another proposal is to place interrogations under an independent provincial council. Her attendants have offered no promise that the wizard will remain within reach of our messengers."
 war_adventurer_elspeth.21.t:0 "Elspeth von Draken has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_elspeth.21.d:0 "Our officials have learned that the reclusive Amethyst wizard Elspeth von Draken is now in [war_adventurer_arrival_province.GetName]. Requests for old burial records and sealed collections of relics first drew their attention to her arrival.\n\nShe is associated with Nuln and the study of death magic. She travels in pursuit of arcane knowledge and guards her own secrets as fiercely as she seeks those of others."
 war_adventurer_wulfhart:0 "Markus Wulfhart, Adventurer"
 desc_war_adventurer_wulfhart:0 "Markus Wulfhart is buying reports of claw marks, missing livestock, and carcasses too large for any ordinary wolf to have dragged away. Hunters compete to join the Huntsmarshal's scouts, hoping to learn how he brought down the Drakwald Cyclops. His preparations fill workshops with orders for arrows and traps, while rumors of his quarry unsettle the countryside."
 war_adventurer_wulfhart.1.option_a:0 "Return the recovered caravan goods to provincial workshops"
 war_adventurer_wulfhart.1.option_b:0 "Enlist willing hunters in the local watch"
 war_adventurer_wulfhart.1.option_c:0 "Restore the rescued households and their village holdings"
 war_adventurer_wulfhart.1.t:0 "The Arrow in the Giant's Eye"
 war_adventurer_wulfhart.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Imperial monster hunter Markus Wulfhart. Our forester reports that Wulfhart blinded a giant threatening woodland villages and finished it on foot.\n\nThe recovered captives carry stores taken from several missing caravans. The caravan marks on the recovered sacks allow several village headmen to identify goods thought permanently lost to the creature.\n\nOur officials ask whether we should return the recovered caravan goods to provincial workshops. Another proposal is to enlist willing hunters in the local watch. The last patrol to encounter the Huntsmarshal found him preparing to travel beyond our jurisdiction."
 war_adventurer_wulfhart.2.option_a:0 "Train provincial scouts from the field notebook"
 war_adventurer_wulfhart.2.option_b:0 "Circulate the tracking methods to army officers"
 war_adventurer_wulfhart.2.option_c:0 "Establish training fields for local search patrols"
 war_adventurer_wulfhart.2.t:0 "The Emperor's Scoutbook"
 war_adventurer_wulfhart.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Imperial monster hunter Markus Wulfhart. Our captain receives a field notebook Wulfhart left after correcting a patrol's tracking errors. Several recruits have already used its methods to find missing travellers. The recruits have added their own successful search routes to the notebook's margins, showing that the methods can be taught.\n\nOur officials ask whether we should train provincial scouts from the field notebook. Another proposal is to circulate the tracking methods to army officers. Wulfhart has entrusted the survivors to the authorities and resumed his hunt."
 war_adventurer_wulfhart.3.option_a:0 "Establish provincial watch teams trained to recognize the creatures"
 war_adventurer_wulfhart.3.option_b:0 "Restore the recovered livestock to local farms"
 war_adventurer_wulfhart.3.option_c:0 "Settle the exposed families in safer provincial holdings"
 war_adventurer_wulfhart.3.t:0 "Tracks from the Northern Hunt"
 war_adventurer_wulfhart.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Imperial monster hunter Markus Wulfhart. Our watch receives Wulfhart's warning that creatures resembling those he pursued in Norsca have crossed into the province. His scouts recovered abandoned livestock but did not catch their leaders. The recovered animals carry wounds unlike those left by ordinary wolves, giving the watch a practical warning of the danger.\n\nOur officials ask whether we should establish provincial watch teams trained to recognize the creatures. Another proposal is to restore the recovered livestock to local farms. Wulfhart has already taken his scouts after another dangerous trail."
 war_adventurer_wulfhart.4.option_a:0 "Rebuild the village's homes and common store"
 war_adventurer_wulfhart.4.option_b:0 "Enlist experienced village volunteers"
 war_adventurer_wulfhart.4.option_c:0 "Establish training fields for a permanent village guard"
 war_adventurer_wulfhart.4.t:0 "The Village He Would Not Leave"
 war_adventurer_wulfhart.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Imperial monster hunter Markus Wulfhart. Our governor reports that Wulfhart stayed with an exposed settlement after its paid guard withdrew. He killed the predator attacking its fields, leaving villagers willing to rebuild together. The villagers have gathered timber and surviving tools beside the damaged fields, but need official support to finish the work.\n\nOur officials ask whether we should rebuild the village's homes and common store. Another proposal is to enlist experienced village volunteers. The hunter left his account with the local officials rather than remain for their ceremony."
 war_adventurer_wulfhart.5.option_a:0 "Restore honest local assessments from the villagers' receipts"
 war_adventurer_wulfhart.5.option_b:0 "Replace the false protection levy with a provincial watch"
 war_adventurer_wulfhart.5.t:0 "A Trophy with a Tax Receipt"
 war_adventurer_wulfhart.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Imperial monster hunter Markus Wulfhart. Our excise officer tried to confiscate a beast Wulfhart had slain for villagers.\n\nThe hunter departed after leaving proof that the officer had collected protection money without providing guards. The villagers' payment receipts bear the same seal as the officer's order to confiscate their hard-won trophy.\n\nOur officials ask whether we should restore honest local assessments from the villagers' receipts. Another proposal is to replace the false protection levy with a provincial watch. Wulfhart's camp is packed, and its scouts refuse to be detained while another quarry is loose."
 war_adventurer_wulfhart.6.option_a:0 "Dissect the unfamiliar carcass under supervision"
 war_adventurer_wulfhart.6.option_b:0 "Let provincial craftsmen process the safe remains"
 war_adventurer_wulfhart.6.option_c:0 "Establish a permanent waystation for the rescued caravans"
 war_adventurer_wulfhart.6.t:0 "A Beast No Bestiary Names"
 war_adventurer_wulfhart.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Imperial monster hunter Markus Wulfhart. Our court receives a strange carcass from Wulfhart's latest hunt. Local guides say it attacked caravans, while scholars disagree over whether its valuable glands are poisonous. The guides have labelled the carcass's dangerous parts while the scholars dispute which specimens can safely be handled.\n\nOur officials ask whether we should dissect the unfamiliar carcass under supervision. Another proposal is to let provincial craftsmen process the safe remains. The last patrol to encounter the Huntsmarshal found him preparing to travel beyond our jurisdiction."
 war_adventurer_wulfhart.7.option_a:0 "Register the cleared road and its water stops"
 war_adventurer_wulfhart.7.option_b:0 "Recruit provincial road guards from the surviving guides"
 war_adventurer_wulfhart.7.option_c:0 "Establish a stock exchange at the reopened caravan stop"
 war_adventurer_wulfhart.7.t:0 "The Cyclops Beyond the Desert"
 war_adventurer_wulfhart.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Imperial monster hunter Markus Wulfhart. A caravan guard reports that Wulfhart used an eye-shot and close pursuit to bring down a giant in unfamiliar terrain. The surviving guide offers a reliable map of the creature's hunting grounds. The guide's map includes water sources and resting places that were never recorded by the customs office.\n\nOur officials ask whether we should register the cleared road and its water stops. Another proposal is to recruit provincial road guards from the surviving guides. Wulfhart has entrusted the survivors to the authorities and resumed his hunt."
 war_adventurer_wulfhart.8.option_a:0 "Distribute the concealed stores to local workshops"
 war_adventurer_wulfhart.8.option_b:0 "Bring the exposed warehouses under honest provincial customs"
 war_adventurer_wulfhart.8.option_c:0 "Train local scouts to watch the broker's supply routes"
 war_adventurer_wulfhart.8.t:0 "The Northern Beasts' Broker"
 war_adventurer_wulfhart.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Imperial monster hunter Markus Wulfhart. Our customs officers receive Wulfhart's evidence that a merchant has been supplying a monstrous northern warband. The merchant escaped, but ledgers and concealed stores remain. Several concealed crates carry the broker's private mark alongside altered declarations intended to disguise their northern destination.\n\nOur officials ask whether we should distribute the concealed stores to local workshops. Another proposal is to bring the exposed warehouses under honest provincial customs. Wulfhart has already taken his scouts after another dangerous trail."
 war_adventurer_wulfhart.9.option_a:0 "Replace the hunting monopoly with a supervised provincial licence"
 war_adventurer_wulfhart.9.option_b:0 "Train local rescue volunteers from the hunter's account"
 war_adventurer_wulfhart.9.t:0 "The Local Hunters' Dispute"
 war_adventurer_wulfhart.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Imperial monster hunter Markus Wulfhart. A guild petitions after Wulfhart bypassed its exclusive hunting rights to rescue missing children.\n\nHe left a practical account of the rescue, and the families refuse to surrender the recovered goods. The families have preserved the rescue account together with the guild's unanswered demands for payment before it would send hunters.\n\nOur officials ask whether we should replace the hunting monopoly with a supervised provincial licence. Another proposal is to train local rescue volunteers from the hunter's account. The hunter left his account with the local officials rather than remain for their ceremony."
 war_adventurer_wulfhart.10.option_a:0 "Restore the shrine precinct around the safe enclosure"
 war_adventurer_wulfhart.10.option_b:0 "Recruit permanent provincial shrine wardens"
 war_adventurer_wulfhart.10.option_c:0 "Endow a cathedral around the protected shrine"
 war_adventurer_wulfhart.10.t:0 "A Hunt That Ended at the Shrine"
 war_adventurer_wulfhart.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Imperial monster hunter Markus Wulfhart. Our magistrate reports that Wulfhart wounded a dangerous beast but stopped pursuit when it entered a locally protected refuge. He left a safe containment plan rather than force a religious confrontation. The refuge's custodians have marked safe observation points on the hunter's plan and kept visitors away from the wounded beast.\n\nOur officials ask whether we should restore the shrine precinct around the safe enclosure. Another proposal is to recruit permanent provincial shrine wardens. Wulfhart's camp is packed, and its scouts refuse to be detained while another quarry is loose."
 war_adventurer_wulfhart.11.option_a:0 "Repair the beast pen and replace the lost military asset"
 war_adventurer_wulfhart.11.option_b:0 "Abandon the enclosure and its damaged surroundings"
 war_adventurer_wulfhart.11.option_c:0 "Let provincial captains arrange their own substitute forces"
 war_adventurer_wulfhart.11.t:0 "The Beast Pen in the Forest"
 war_adventurer_wulfhart.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Imperial monster hunter Markus Wulfhart. Our military keeper reports that Wulfhart killed a giant being held for battlefield service. Freed labourers escaped with him, and the damaged pen now threatens adjoining buildings. The beast's torn harness remains attached to the damaged pen, proving that it was intended for military service rather than a harmless display.\n\nOur officials ask whether we should repair the beast pen and replace the lost military asset. Another proposal is to abandon the enclosure and its damaged surroundings. The last patrol to encounter the Huntsmarshal found him preparing to travel beyond our jurisdiction."
 war_adventurer_wulfhart.12.option_a:0 "Give the villages oversight of their own patrols"
 war_adventurer_wulfhart.12.option_b:0 "Compensate the households exposed to forced service"
 war_adventurer_wulfhart.12.option_c:0 "Admit the abuse recorded in the exposed routes"
 war_adventurer_wulfhart.12.t:0 "The Scouts Who Knew Too Much"
 war_adventurer_wulfhart.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Imperial monster hunter Markus Wulfhart. Our patrol commander reports that Wulfhart exposed the routes used to seize villagers for forced service. The hunters escaped after guiding detainees through gaps in the cordon. Copies of the exposed patrol routes have reached households whose detained relatives were never entered in the official muster.\n\nOur officials ask whether we should give the villages oversight of their own patrols. Another proposal is to compensate the households exposed to forced service. Wulfhart has entrusted the survivors to the authorities and resumed his hunt."
 war_adventurer_wulfhart.13.option_a:0 "Replace the destroyed shipment"
 war_adventurer_wulfhart.13.option_b:0 "Let frontier communities control future supply contracts"
 war_adventurer_wulfhart.13.option_c:0 "Requisition civilian stores to replace the burned goods"
 war_adventurer_wulfhart.13.t:0 "Telldros' Lost Convoy"
 war_adventurer_wulfhart.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Imperial monster hunter Markus Wulfhart. Our supply officer reports that Wulfhart ambushed goods destined for a monstrous warband.\n\nHe could not catch its leaders, but destroyed the stores and released their intended captives. The burned stores still carry recognizable supply marks, leaving the quartermaster unable to deny the arrangement with the warband.\n\nOur officials ask whether we should replace the destroyed shipment. Another proposal is to let frontier communities control future supply contracts. Wulfhart has already taken his scouts after another dangerous trail."
 war_adventurer_wulfhart.14.option_a:0 "Let the village councils negotiate their own levies"
 war_adventurer_wulfhart.14.option_b:0 "Compensate the households threatened by the beast-keeper"
 war_adventurer_wulfhart.14.t:0 "A Head Above the Village Gate"
 war_adventurer_wulfhart.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Imperial monster hunter Markus Wulfhart. Our governor reports that Wulfhart left the head of our appointed beast-keeper's predator above a village gate. The display has emboldened residents to refuse another levy. The beast-keeper's insignia hangs beside the severed head, turning the hunter's warning into a direct accusation against the governor.\n\nOur officials ask whether we should let the village councils negotiate their own levies. Another proposal is to compensate the households threatened by the beast-keeper. The hunter left his account with the local officials rather than remain for their ceremony."
 war_adventurer_wulfhart.15.option_a:0 "Hire instructors to rebuild the provincial guard"
 war_adventurer_wulfhart.15.option_b:0 "Place detention lodges under independent local inspectors"
 war_adventurer_wulfhart.15.option_c:0 "Admit the failure of the attempted arrest"
 war_adventurer_wulfhart.15.t:0 "The Empty Hunting Lodge"
 war_adventurer_wulfhart.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Imperial monster hunter Markus Wulfhart. Our commissioner found Wulfhart's supposed refuge empty and the lodge's former prisoners already gone. A scout manual left behind exposes the complacency of our officers. The abandoned manual marks the blind spots in the search cordon more clearly than the commissioner's own inspection report.\n\nOur officials ask whether we should hire instructors to rebuild the provincial guard. Another proposal is to place detention lodges under independent local inspectors. Wulfhart's camp is packed, and its scouts refuse to be detained while another quarry is loose."
 war_adventurer_wulfhart.16.option_a:0 "Purchase forces to replace the dead giant"
 war_adventurer_wulfhart.16.option_b:0 "Leave the district's defence to its own captains"
 war_adventurer_wulfhart.16.option_c:0 "Abandon the exposed frontier settlements"
 war_adventurer_wulfhart.16.t:0 "The War Beast's Single Wound"
 war_adventurer_wulfhart.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Imperial monster hunter Markus Wulfhart. Our frontier commander reports that Wulfhart killed an imported giant with a carefully placed arrow and a finishing attack. Its handlers fled with part of the purchase money. The surviving handlers have produced conflicting receipts for the missing payment, complicating any attempt to replace the dead creature quickly.\n\nOur officials ask whether we should purchase forces to replace the dead giant. Another proposal is to leave the district's defence to its own captains. The last patrol to encounter the Huntsmarshal found him preparing to travel beyond our jurisdiction."
 war_adventurer_wulfhart.17.option_a:0 "Settle the cancelled buyers' contracts"
 war_adventurer_wulfhart.17.option_b:0 "Give local magistrates control of the exposed trafficking cases"
 war_adventurer_wulfhart.17.option_c:0 "Accept the evidence of official protection for the trade"
 war_adventurer_wulfhart.17.t:0 "The Foreign Trophy Market"
 war_adventurer_wulfhart.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Imperial monster hunter Markus Wulfhart. Our market inspector reports that Wulfhart exposed a trade in live man-eaters protected by officials.\n\nHe freed the handlers' captives and left incriminating bills of sale. The recovered bills identify the officials who approved each shipment and the pens where its intended victims were held.\n\nOur officials ask whether we should settle the cancelled buyers' contracts. Another proposal is to give local magistrates control of the exposed trafficking cases. Wulfhart has entrusted the survivors to the authorities and resumed his hunt."
 war_adventurer_wulfhart.18.option_a:0 "Compensate the traders for the destroyed cages"
 war_adventurer_wulfhart.18.option_b:0 "Let local communities regulate the closed route"
 war_adventurer_wulfhart.18.option_c:0 "Abandon the damaged holding ground"
 war_adventurer_wulfhart.18.t:0 "The Trail Back to Norsca"
 war_adventurer_wulfhart.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Imperial monster hunter Markus Wulfhart. Our governor learns that Wulfhart traced a foreign monster shipment to brokers serving a northern warband. He burned the cages after an escape, and traders now demand compensation. The traders' claims list both the destroyed cages and the fees already paid to move their cargo through official checkpoints.\n\nOur officials ask whether we should compensate the traders for the destroyed cages. Another proposal is to let local communities regulate the closed route. Wulfhart has already taken his scouts after another dangerous trail."
 war_adventurer_wulfhart.19.option_a:0 "Put the provincial patrols under the communities' oversight"
 war_adventurer_wulfhart.19.option_b:0 "Compensate the households named in the seizure orders"
 war_adventurer_wulfhart.19.t:0 "The Guide Who Changed Sides"
 war_adventurer_wulfhart.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Imperial monster hunter Markus Wulfhart. A local guide led Wulfhart to our scouts instead of the beast they claimed to be hunting. The scouts' prisoners escaped, and the guide has published their orders. The published orders identify the households the scouts were meant to seize, exposing the false pretext for their expedition.\n\nOur officials ask whether we should put the provincial patrols under the communities' oversight. Another proposal is to compensate the households named in the seizure orders. The hunter left his account with the local officials rather than remain for their ceremony."
 war_adventurer_wulfhart.20.option_a:0 "Pay for relief after the menagerie's rampage"
 war_adventurer_wulfhart.20.option_b:0 "Transfer the governor's oversight to a provincial council"
 war_adventurer_wulfhart.20.option_c:0 "Leave the damaged streets unrepaired to protect the collection's funds"
 war_adventurer_wulfhart.20.t:0 "The Governor's Private Menagerie"
 war_adventurer_wulfhart.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Imperial monster hunter Markus Wulfhart. Our governor reports that Wulfhart entered his private menagerie after a creature escaped into town. The hunter killed the threat and departed with witnesses to the governor's negligence. Residents have brought broken doors and damaged goods to the governor's office, demanding compensation for the creature's rampage.\n\nOur officials ask whether we should pay for relief after the menagerie's rampage. Another proposal is to transfer the governor's oversight to a provincial council. Wulfhart's camp is packed, and its scouts refuse to be detained while another quarry is loose."
 war_adventurer_wulfhart.21.t:0 "Markus Wulfhart has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_wulfhart.21.d:0 "A report from [war_adventurer_arrival_province.GetName] places the Imperial monster hunter Markus Wulfhart in the province. He is gathering accounts of dangerous beasts and the tracks they leave behind.\n\nThe Empire's Huntsmarshal earned his reputation pursuing monsters, including the Drakwald Cyclops that destroyed his home. An expert archer and tracker, he leads scouts accustomed to following quarry that ordinary soldiers would rather avoid."
 war_adventurer_gotrek_felix:0 "Gotrek and Felix, Adventurers"
 desc_war_adventurer_gotrek_felix:0 "Gotrek and Felix are lodging in the province, where the Slayer's search for a worthy doom has led them toward suspicious cellars and heavily barred tunnels. Felix fights beside him and records their exploits, though the innkeepers seem more interested in recording the damage. They leave battered monsters, reassured survivors, and fresh tavern quarrels wherever they go."
 war_adventurer_gotrek_felix.1.option_a:0 "Replace the abusive collection with verified local assessments"
 war_adventurer_gotrek_felix.1.option_b:0 "Return confiscated goods to the provincial shopkeepers"
 war_adventurer_gotrek_felix.1.option_c:0 "File Felix's witness account without intervening"
 war_adventurer_gotrek_felix.1.t:0 "The Window Tax Witness"
 war_adventurer_gotrek_felix.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our magistrate reports that Gotrek pulled a young protester from charging guards while Felix recorded the incident.\n\nThe pair disappeared into a tavern, leaving witnesses prepared to expose an abusive collector. Felix's witness list includes shopkeepers who saw the collector provoke the charge and guards willing to confirm their orders.\n\nOur officials ask whether we should replace the abusive collection with verified local assessments. Another proposal is to return confiscated goods to the provincial shopkeepers. Neither the Slayer nor his chronicler has agreed to stay within reach of a government escort."
 war_adventurer_gotrek_felix.2.option_a:0 "Train provincial cellar patrols from the rescued workers' testimony"
 war_adventurer_gotrek_felix.2.option_b:0 "Restore the warehouses with the recovered goods"
 war_adventurer_gotrek_felix.2.option_c:0 "Rehouse the rescued townsfolk in the damaged district"
 war_adventurer_gotrek_felix.2.t:0 "Ratmen Beneath the Warehouses"
 war_adventurer_gotrek_felix.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our watch reports collapsed cellars, rescued townsfolk and evidence of a ratman plot uncovered by Gotrek and Felix. The pair escaped into the catacombs while officials argued over whether to acknowledge the threat. Among the rescued townsfolk are cellar workers who can identify the tunnels beneath the damaged warehouses.\n\nOur officials ask whether we should train provincial cellar patrols from the rescued workers' testimony. Another proposal is to restore the warehouses with the recovered goods. Gotrek refuses to wait for an audience, and Felix is gathering his papers for their next journey."
 war_adventurer_gotrek_felix.3.option_a:0 "Return identifiable property and restore the claimants' premises"
 war_adventurer_gotrek_felix.3.option_b:0 "Give unclaimed tools and freight to provincial workshops"
 war_adventurer_gotrek_felix.3.option_c:0 "Equip local pass wardens from the recovered stores"
 war_adventurer_gotrek_felix.3.t:0 "A Dragon's Unclaimed Hoard"
 war_adventurer_gotrek_felix.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Mountain wardens report that Gotrek and Felix killed a dragon threatening a pass. Felix left an inventory of recovered property, but several towns now claim the same treasure. The inventory separates recognizable family possessions from unmarked treasure, leaving a practical basis for settling the rival claims.\n\nOur officials ask whether we should return identifiable property and restore the claimants' premises. Another proposal is to give unclaimed tools and freight to provincial workshops. The pair have escaped the local watch and left their witnesses to present the account."
 war_adventurer_gotrek_felix.4.option_a:0 "Restore the chapel precinct from the cult's recovered assets"
 war_adventurer_gotrek_felix.4.option_b:0 "Recruit willing rescuers into the provincial watch"
 war_adventurer_gotrek_felix.4.option_c:0 "Endow a cathedral on the cleared chapel site"
 war_adventurer_gotrek_felix.4.t:0 "The Blood on the Chapel Floor"
 war_adventurer_gotrek_felix.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our priest reports that Gotrek destroyed a summoned daemon while Felix led worshippers out through the crypt. The chapel is damaged, but the cult's hidden accounts survived. The surviving accounts record payments to the cult's suppliers, giving the authorities evidence beyond the blood on the chapel stones.\n\nOur officials ask whether we should restore the chapel precinct from the cult's recovered assets. Another proposal is to recruit willing rescuers into the provincial watch. Felix's last message says that his companion will not remain while officials argue over the consequences."
 war_adventurer_gotrek_felix.5.option_a:0 "Catalogue Felix's account and identify its recovered heirlooms"
 war_adventurer_gotrek_felix.5.option_b:0 "Restore local households' property rights from the heirlooms' marks"
 war_adventurer_gotrek_felix.5.option_c:0 "Establish a university archive for the expedition's records"
 war_adventurer_gotrek_felix.5.t:0 "The Chronicle Nobody Commissioned"
 war_adventurer_gotrek_felix.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our archivist receives Felix's account of a dangerous expedition and a request to identify rescued heirlooms.\n\nGotrek refuses an audience, while merchants argue over the cost of distributing the testimony. Several of the rescued heirlooms carry names or guild marks that can still be matched to surviving records.\n\nOur officials ask whether we should catalogue Felix's account and identify its recovered heirlooms. Another proposal is to restore local households' property rights from the heirlooms' marks. The watch found their lodging empty, with the pair already following another road."
 war_adventurer_gotrek_felix.6.option_a:0 "Settle the rescued households in the province"
 war_adventurer_gotrek_felix.6.option_b:0 "Enlist willing veterans in the local guard"
 war_adventurer_gotrek_felix.6.option_c:0 "Reequip the survivors' workshops with their saved tools"
 war_adventurer_gotrek_felix.6.t:0 "The Siege Survivors' Petition"
 war_adventurer_gotrek_felix.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Refugees report that Gotrek and Felix held a street during a foreign siege long enough for families to escape. The pair have moved on, leaving survivors and captured supplies at our border office. The refugees have brought salvaged tools and captured ration sacks, giving the border office something more useful than a list of losses.\n\nOur officials ask whether we should settle the rescued households in the province. Another proposal is to enlist willing veterans in the local guard. Neither the Slayer nor his chronicler has agreed to stay within reach of a government escort."
 war_adventurer_gotrek_felix.7.option_a:0 "Fit out a provincial airship repair workshop"
 war_adventurer_gotrek_felix.7.option_b:0 "Examine the recovered Dwarf tools"
 war_adventurer_gotrek_felix.7.option_c:0 "Provide local homes for the rescued families"
 war_adventurer_gotrek_felix.7.t:0 "The Airship's Returned Passengers"
 war_adventurer_gotrek_felix.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. An expedition crew delivers survivors escorted from a lost hold by Gotrek and Felix. The pair travelled aboard a Dwarf airship; its captain requests a landing ground while officials inventory recovered tools. The crew has placed the recovered tools beside its damaged landing tackle while the survivors identify the families to whom they belong.\n\nOur officials ask whether we should fit out a provincial airship repair workshop. Another proposal is to examine the recovered Dwarf tools. Gotrek refuses to wait for an audience, and Felix is gathering his papers for their next journey."
 war_adventurer_gotrek_felix.8.option_a:0 "Document the ritual debris before sealing the sanctuary"
 war_adventurer_gotrek_felix.8.option_b:0 "Restore the rescued captives' homes and property"
 war_adventurer_gotrek_felix.8.option_c:0 "Enlist willing guides in a provincial sanctuary watch"
 war_adventurer_gotrek_felix.8.t:0 "A Slayer in the Summoning Pit"
 war_adventurer_gotrek_felix.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our scouts report that Gotrek killed a great daemon inside a ruined sanctuary while Felix rescued captives. The pair departed before our troops arrived, leaving a dangerous site and grateful witnesses. The guides have marked the entrance used by the rescued captives and warned soldiers away from the remaining ritual debris.\n\nOur officials ask whether we should document the ritual debris before sealing the sanctuary. Another proposal is to restore the rescued captives' homes and property. The pair have escaped the local watch and left their witnesses to present the account."
 war_adventurer_gotrek_felix.9.option_a:0 "Let the endangered villagers process the lawful remains"
 war_adventurer_gotrek_felix.9.option_b:0 "Have scholars examine the dragon bones"
 war_adventurer_gotrek_felix.9.t:0 "The Wrong Dragon's Bones"
 war_adventurer_gotrek_felix.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our customs office receives bones from a dragon the pair slew in unfamiliar country.\n\nFelix disputes a merchant's claim to the remains and has left sworn statements from the endangered villagers. The villagers' statements identify the merchant's agents as purchasers of stolen property rather than sponsors of the hunt.\n\nOur officials ask whether we should let the endangered villagers process the lawful remains. Another proposal is to have scholars examine the dragon bones. Felix's last message says that his companion will not remain while officials argue over the consequences."
 war_adventurer_gotrek_felix.10.option_a:0 "Correct the local levy from Felix's translated figures"
 war_adventurer_gotrek_felix.10.option_b:0 "Retrain the provincial guard to protect the tax hearings"
 war_adventurer_gotrek_felix.10.option_c:0 "Return fraudulently seized goods to the townsfolk"
 war_adventurer_gotrek_felix.10.t:0 "A Riot in an Unfamiliar Tongue"
 war_adventurer_gotrek_felix.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. A governor reports that Gotrek rescued Felix and several locals from a violent tax protest. Felix's translated account exposes a collector's fraud but embarrasses the town guard. Felix's translation preserves the collector's own figures, allowing the magistrates to compare the charges with the permitted levy.\n\nOur officials ask whether we should correct the local levy from Felix's translated figures. Another proposal is to retrain the provincial guard to protect the tax hearings. The watch found their lodging empty, with the pair already following another road."
 war_adventurer_gotrek_felix.11.option_a:0 "Refund the disputed levy"
 war_adventurer_gotrek_felix.11.option_b:0 "Give the provincial communities oversight of collection"
 war_adventurer_gotrek_felix.11.option_c:0 "Accept the publication of the pair's accusations"
 war_adventurer_gotrek_felix.11.t:0 "The Collector's Broken Escort"
 war_adventurer_gotrek_felix.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our collector reports that Gotrek scattered his escort during a protest and Felix carried away the levy records. Witnesses are gathering around copies of the pair's accusations. The copied records bear enough matching receipts to convince households that the disputed levy can no longer be concealed.\n\nOur officials ask whether we should refund the disputed levy. Another proposal is to give the provincial communities oversight of collection. Neither the Slayer nor his chronicler has agreed to stay within reach of a government escort."
 war_adventurer_gotrek_felix.12.option_a:0 "Rebuild the damaged quarter"
 war_adventurer_gotrek_felix.12.option_b:0 "Seal the lower passages and abandon the ruined cellars"
 war_adventurer_gotrek_felix.12.option_c:0 "Place local detention under independent provincial magistrates"
 war_adventurer_gotrek_felix.12.t:0 "The Catacombs' Empty Cells"
 war_adventurer_gotrek_felix.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our occupation officer reports that the pair broke into a concealed detention site while pursuing ratmen. Captives escaped, supplies burned, and Felix has taken evidence of official involvement. The survivors have carried descriptions of the hidden cells beyond the damaged quarter, linking the site to officers in public service.\n\nOur officials ask whether we should rebuild the damaged quarter. Another proposal is to seal the lower passages and abandon the ruined cellars. Gotrek refuses to wait for an audience, and Felix is gathering his papers for their next journey."
 war_adventurer_gotrek_felix.13.option_a:0 "Purchase troops to replace the dead military beast"
 war_adventurer_gotrek_felix.13.option_b:0 "Let provincial captains determine their own defensive commitments"
 war_adventurer_gotrek_felix.13.option_c:0 "Abandon the ruined beast compound"
 war_adventurer_gotrek_felix.13.t:0 "The Beast We Had Purchased"
 war_adventurer_gotrek_felix.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our commander reports that Gotrek killed a dragon held for military service while Felix released its handlers' prisoners.\n\nThe pair escaped through the ruined pen. The handlers' abandoned contracts establish the dragon's intended military role and the price already paid for keeping it alive.\n\nOur officials ask whether we should purchase troops to replace the dead military beast. Another proposal is to let provincial captains determine their own defensive commitments. The pair have escaped the local watch and left their witnesses to present the account."
 war_adventurer_gotrek_felix.14.option_a:0 "Build conventional defences to replace the ritual's promise"
 war_adventurer_gotrek_felix.14.option_b:0 "Seal the collapsed chamber and abandon its surroundings"
 war_adventurer_gotrek_felix.14.option_c:0 "Close the university that supplied the summoning apparatus"
 war_adventurer_gotrek_felix.14.t:0 "The Summoner's Last Bargain"
 war_adventurer_gotrek_felix.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our ritual officer reports that Gotrek destroyed the daemon meant to secure a local garrison. Felix led its intended offerings away, and the apparatus collapsed during the fight. The ritualists have submitted replacement estimates without explaining why the prisoners were bound beside the apparatus.\n\nOur officials ask whether we should build conventional defences to replace the ritual's promise. Another proposal is to seal the collapsed chamber and abandon its surroundings. Felix's last message says that his companion will not remain while officials argue over the consequences."
 war_adventurer_gotrek_felix.15.option_a:0 "Settle the extortion victims' claims"
 war_adventurer_gotrek_felix.15.option_b:0 "Transfer the implicated officers' powers to a provincial council"
 war_adventurer_gotrek_felix.15.option_c:0 "Allow the accusations to circulate unanswered"
 war_adventurer_gotrek_felix.15.t:0 "The Book with Our Names in It"
 war_adventurer_gotrek_felix.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our governor reports that Felix's account of a recent clash names officers involved in extortion. Gotrek protected the first public reading, then both vanished before an arrest could be organized. Several accused officers have demanded that the book be seized, but their own subordinates have already copied the relevant passages.\n\nOur officials ask whether we should settle the extortion victims' claims. Another proposal is to transfer the implicated officers' powers to a provincial council. The watch found their lodging empty, with the pair already following another road."
 war_adventurer_gotrek_felix.16.option_a:0 "Replace the captured stores"
 war_adventurer_gotrek_felix.16.option_b:0 "Let local commanders negotiate their own blockade duties"
 war_adventurer_gotrek_felix.16.option_c:0 "Strip nearby settlements of replacement supplies"
 war_adventurer_gotrek_felix.16.t:0 "The Supply Street at the Siege"
 war_adventurer_gotrek_felix.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our commander reports that Gotrek and Felix opened an escape route through our siege camp. Refugees fled with captured supplies, and the pair disappeared amid the traffic. The raided supply tents stand beside an open lane through which the last refugees escaped before the reserve arrived.\n\nOur officials ask whether we should replace the captured stores. Another proposal is to let local commanders negotiate their own blockade duties. Neither the Slayer nor his chronicler has agreed to stay within reach of a government escort."
 war_adventurer_gotrek_felix.17.option_a:0 "Repair the disabled landing machinery"
 war_adventurer_gotrek_felix.17.option_b:0 "Let the provincial engineers control aerial interception"
 war_adventurer_gotrek_felix.17.option_c:0 "Admit the loss of the stolen heirlooms"
 war_adventurer_gotrek_felix.17.t:0 "The Airship Above the Prison"
 war_adventurer_gotrek_felix.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our governor reports that the pair evacuated captives and stolen heirlooms aboard a passing expedition airship.\n\nGround crews escaped after disabling the landing machinery used by our pursuers. The damaged machinery cannot lift another pursuit craft, while the empty heirloom cases advertise the expedition's success.\n\nOur officials ask whether we should repair the disabled landing machinery. Another proposal is to let the provincial engineers control aerial interception. Gotrek refuses to wait for an audience, and Felix is gathering his papers for their next journey."
 war_adventurer_gotrek_felix.18.option_a:0 "Replace the abandoned ritual equipment"
 war_adventurer_gotrek_felix.18.option_b:0 "Give local custodians authority to end the binding programme"
 war_adventurer_gotrek_felix.18.option_c:0 "Leave the damaged ritual district to recover unaided"
 war_adventurer_gotrek_felix.18.t:0 "The Daemon's Broken Chain"
 war_adventurer_gotrek_felix.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our overseer reports that Gotrek attacked a bound daemon while Felix cut its captives free. The surviving ritualists demand compensation for equipment they abandoned during the escape. The abandoned restraints and burned records make it difficult to conceal what the daemon's attendants were demanding from the captives.\n\nOur officials ask whether we should replace the abandoned ritual equipment. Another proposal is to give local custodians authority to end the binding programme. The pair have escaped the local watch and left their witnesses to present the account."
 war_adventurer_gotrek_felix.19.option_a:0 "Repay the proven claims to stolen property"
 war_adventurer_gotrek_felix.19.option_b:0 "Give provincial magistrates independent control of restitution"
 war_adventurer_gotrek_felix.19.option_c:0 "Defend the governor's discredited collection"
 war_adventurer_gotrek_felix.19.t:0 "A Trophy Stolen from the Court"
 war_adventurer_gotrek_felix.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our governor displayed a dragon's hoard acquired from raiders. Gotrek and Felix identified stolen property among it, defeated the guards, and left with witnesses to the original theft. The witnesses have identified particular objects in the governor's collection, giving their accusations a precision the court cannot easily dismiss.\n\nOur officials ask whether we should repay the proven claims to stolen property. Another proposal is to give provincial magistrates independent control of restitution. Felix's last message says that his companion will not remain while officials argue over the consequences."
 war_adventurer_gotrek_felix.20.option_a:0 "Repair the cellar and compensate those harmed"
 war_adventurer_gotrek_felix.20.option_b:0 "Place palace accounts under an independent provincial council"
 war_adventurer_gotrek_felix.20.option_c:0 "Seal and abandon the damaged cellar quarter"
 war_adventurer_gotrek_felix.20.t:0 "The Palace's Rat-Filled Cellar"
 war_adventurer_gotrek_felix.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger. Our chamberlain reports that the pair exposed a ratman passage beneath the provincial palace and wrecked the cellar while escaping. Their discovery also revealed secret payments made by palace staff. The broken cellar wall exposes both the ratmen's passage and the concealed shelves where the palace payments were recorded.\n\nOur officials ask whether we should repair the cellar and compensate those harmed. Another proposal is to place palace accounts under an independent provincial council. The watch found their lodging empty, with the pair already following another road."
 war_adventurer_gotrek_felix.21.t:0 "Gotrek and Felix have arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_gotrek_felix.21.d:0 "Our officials report that the wandering Dwarf Slayer Gotrek Gurnisson and the human swordsman and chronicler Felix Jaeger have arrived in [war_adventurer_arrival_province.GetName]. Witnesses describe an orange-crested Dwarf with a formidable axe and a human carrying writing materials.\n\nGotrek Gurnisson is a Slayer seeking a death worthy of his oath. Felix Jaeger has sworn to accompany him and record that doom, fighting beside his companion through the dangers their travels uncover."
 war_adventurer_repanse:0 "Repanse de Lyonesse, Adventurer"
 desc_war_adventurer_repanse:0 "Repanse's banner has drawn pilgrims and would-be soldiers who repeat the tale of the shepherdess who rallied Bretonnia's knights and saved Couronne. Her insistence that courage matters more than birth has stirred the common folk and offended those who guard their rank. Smiths and provisioners welcome the gathering, even as local officers struggle to keep it orderly."
 war_adventurer_repanse.1.option_a:0 "Restore the chapel precinct and its village homes"
 war_adventurer_repanse.1.option_b:0 "Enlist the rallied provincial volunteers"
 war_adventurer_repanse.1.option_c:0 "Raise a cathedral around the rescued chapel banner"
 war_adventurer_repanse.1.t:0 "The Banner from the Chapel"
 war_adventurer_repanse.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Bretonnian holy warrior Repanse de Lyonesse. Our bailiff reports that Repanse carried an old chapel banner into a village threatened by raiders, speaking of the Lady's vision that first sent her to war.\n\nFrightened retainers rallied behind her, and the chaplain now petitions for repairs to the damaged sanctuary. The chaplain has laid the torn banner beside the repair petition, while the rallied retainers wait to learn who will lead their training.\n\nOur officials ask whether we should restore the chapel precinct and its village homes. Another proposal is to enlist the rallied provincial volunteers. Repanse has entrusted the immediate aftermath to the local authorities and resumed her pilgrimage."
 war_adventurer_repanse.2.option_a:0 "Restore the families' holdings from their receipts"
 war_adventurer_repanse.2.option_b:0 "Recruit a village watch to protect the claimants"
 war_adventurer_repanse.2.option_c:0 "Return the collector's seized tools to local households"
 war_adventurer_repanse.2.t:0 "The Armour in the Hayloft"
 war_adventurer_repanse.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Bretonnian holy warrior Repanse de Lyonesse. Our steward reports that Repanse recovered a dead knight's armour from a corrupt collector and gave it to the family he had defended. Her account of her own humble calling has drawn witnesses to other abuses. The rescued family's claim has drawn other households to the steward, each carrying receipts for possessions seized by the same collector.\n\nOur officials ask whether we should restore the families' holdings from their receipts. Another proposal is to recruit a village watch to protect the claimants. Her companions are preparing to travel, and she has declined any office that would require her to remain."
 war_adventurer_repanse.3.option_a:0 "Reopen the relief road and its village stations"
 war_adventurer_repanse.3.option_b:0 "Enlist willing relief escorts in the provincial guard"
 war_adventurer_repanse.3.option_c:0 "Establish training fields for relief-column escorts"
 war_adventurer_repanse.3.t:0 "The Road to Couronne"
 war_adventurer_repanse.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Bretonnian holy warrior Repanse de Lyonesse. Our marshal reports that Repanse broke a raiding force blocking a relief road, cutting down its champion before the convoy arrived. Veterans compare the rescue to Couronne, and several isolated settlements can now be supplied. The convoy's drivers have unloaded their relief stores at the first reopened settlement and marked the remaining obstructions on a road plan.\n\nOur officials ask whether we should reopen the relief road and its village stations. Another proposal is to enlist willing relief escorts in the provincial guard. The last messenger found Repanse leaving under her banner rather than waiting for another audience."
 war_adventurer_repanse.4.option_a:0 "Register the settlement and restore the disputed holdings"
 war_adventurer_repanse.4.option_b:0 "Form a joint village watch under the settlement"
 war_adventurer_repanse.4.option_c:0 "Keep the temporary agreement in the court record"
 war_adventurer_repanse.4.t:0 "The Duchess Who Would Not Stay"
 war_adventurer_repanse.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Bretonnian holy warrior Repanse de Lyonesse. Our seneschal reports that villagers asked Repanse to judge a dispute under the authority of her ancient dukedom. She settled the immediate violence but referred the lasting decision to our court and departed. Representatives of both villages have signed the temporary settlement, leaving the court an agreement it can confirm without reviving the fighting.\n\nOur officials ask whether we should register the settlement and restore the disputed holdings. Another proposal is to form a joint village watch under the settlement. Repanse claims no right to govern this province and will continue beyond its borders."
 war_adventurer_repanse.5.option_a:0 "Train willing village rescuers alongside the local guard"
 war_adventurer_repanse.5.option_b:0 "Teach the rescue as an exercise for army officers"
 war_adventurer_repanse.5.option_c:0 "Establish training fields open to the province's volunteers"
 war_adventurer_repanse.5.t:0 "A Knight's Name on the Roll"
 war_adventurer_repanse.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Bretonnian holy warrior Repanse de Lyonesse. Our herald reports that Repanse insisted a lowborn rescuer be recorded beside the knights he saved.\n\nShe invoked her own knighthood under Louis the Young, leaving our officials to resolve the offended nobles' petitions. The rescued knights agree about the volunteer's deed, although several object to seeing his name entered on the same page as theirs.\n\nOur officials ask whether we should train willing village rescuers alongside the local guard. Another proposal is to teach the rescue as an exercise for army officers. The Damoiselle has left a petition in place of a demand for permanent command."
 war_adventurer_repanse.6.option_a:0 "Settle the willing rescued families in the province"
 war_adventurer_repanse.6.option_b:0 "Equip the refugees to resume their local trades"
 war_adventurer_repanse.6.option_c:0 "Recruit willing adults into the sanctuary watch"
 war_adventurer_repanse.6.t:0 "The Foreign Chapel's Refugees"
 war_adventurer_repanse.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Bretonnian holy warrior Repanse de Lyonesse. Our governor reports that Repanse escorted captives out of a raiders' camp and sheltered them in a local sanctuary. Its unfamiliar priesthood has requested our help feeding the rescued families. The sanctuary's custodians have counted the rescued families and set aside a yard where donated provisions can be distributed.\n\nOur officials ask whether we should settle the willing rescued families in the province. Another proposal is to equip the refugees to resume their local trades. Repanse has entrusted the immediate aftermath to the local authorities and resumed her pilgrimage."
 war_adventurer_repanse.7.option_a:0 "Teach the banner signals to provincial recruits"
 war_adventurer_repanse.7.option_b:0 "Circulate the returning soldiers' signal exercises to army officers"
 war_adventurer_repanse.7.option_c:0 "Establish training fields for signalling drills"
 war_adventurer_repanse.7.t:0 "The Banner Nobody Recognized"
 war_adventurer_repanse.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Bretonnian holy warrior Repanse de Lyonesse. Our border commander reports that soldiers who could not understand Repanse's words followed her banner through a broken enemy line. Survivors have returned with a practical account of her signals and formations. The soldiers have reproduced the banner signals with scraps of coloured cloth, demonstrating the orders even without an interpreter.\n\nOur officials ask whether we should teach the banner signals to provincial recruits. Another proposal is to circulate the returning soldiers' signal exercises to army officers. Her companions are preparing to travel, and she has declined any office that would require her to remain."
 war_adventurer_repanse.8.option_a:0 "Restore the relieved households with recovered food"
 war_adventurer_repanse.8.option_b:0 "Provision the provincial garrison from the captured stores"
 war_adventurer_repanse.8.option_c:0 "Distribute surplus wagons and stores to local suppliers"
 war_adventurer_repanse.8.t:0 "The Champion at the Water Gate"
 war_adventurer_repanse.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Bretonnian holy warrior Repanse de Lyonesse. Our governor reports that Repanse slew the champion holding a town's water gate and opened it for a relief convoy. Her companions have gone on, leaving captured supplies and competing petitions for their distribution. The recovered wagons contain food intended for the besiegers, now urgently requested by both the relieved households and their exhausted guards.\n\nOur officials ask whether we should restore the relieved households with recovered food. Another proposal is to provision the provincial garrison from the captured stores. The last messenger found Repanse leaving under her banner rather than waiting for another audience."
 war_adventurer_repanse.9.option_a:0 "Correct the customs rolls using the proven forgeries"
 war_adventurer_repanse.9.option_b:0 "Return illicitly seized goods to provincial merchants"
 war_adventurer_repanse.9.option_c:0 "Place Repanse's testimony in the public record"
 war_adventurer_repanse.9.t:0 "A Title That Buys No Passage"
 war_adventurer_repanse.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Bretonnian holy warrior Repanse de Lyonesse. Our customs judge reports that Repanse refused a merchant's attempt to purchase privileges in her name as Duchess of Lyonesse.\n\nShe left evidence of his forged letters, but claimed no authority over our officials. The customs judge has compared the merchant's letters with authentic seals and identified the fees collected under their protection.\n\nOur officials ask whether we should correct the customs rolls using the proven forgeries. Another proposal is to return illicitly seized goods to provincial merchants. Repanse claims no right to govern this province and will continue beyond its borders."
 war_adventurer_repanse.10.option_a:0 "Train provincial patrols from the retainers' route sketch"
 war_adventurer_repanse.10.option_b:0 "Restore the reopened road's waystations"
 war_adventurer_repanse.10.option_c:0 "Establish training fields for the road patrols"
 war_adventurer_repanse.10.t:0 "The Fallen Knight's Foreign Grave"
 war_adventurer_repanse.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Bretonnian holy warrior Repanse de Lyonesse. Our magistrate reports that Repanse recovered a traveller's armour from bandits and arranged his burial according to the family's wishes. The rescued retainers offer to teach our patrols what they learned during the pursuit. The retainers have brought the recovered armour and a route sketch showing the bandits' concealed approach to the road.\n\nOur officials ask whether we should train provincial patrols from the retainers' route sketch. Another proposal is to restore the reopened road's waystations. The Damoiselle has left a petition in place of a demand for permanent command."
 war_adventurer_repanse.11.option_a:0 "Replace the broken guard cordon"
 war_adventurer_repanse.11.option_b:0 "Let the chapel's communities oversee their own custodial disputes"
 war_adventurer_repanse.11.option_c:0 "Scour the district through destructive camp searches"
 war_adventurer_repanse.11.t:0 "The Chapel We Had Sealed"
 war_adventurer_repanse.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Bretonnian holy warrior Repanse de Lyonesse. Our governor reports that Repanse broke the seal on a confiscated chapel, raised its banner, and escorted detained villagers out through the guard cordon. Her followers have dispersed among sympathetic households. The broken seals have been displayed beside the chapel steps, where villagers are gathering to identify the released detainees.\n\nOur officials ask whether we should replace the broken guard cordon. Another proposal is to let the chapel's communities oversee their own custodial disputes. Repanse has entrusted the immediate aftermath to the local authorities and resumed her pilgrimage."
 war_adventurer_repanse.12.option_a:0 "Replace the blockade's lost stores and equipment"
 war_adventurer_repanse.12.option_b:0 "Let provincial captains arrange their own blockade duties"
 war_adventurer_repanse.12.option_c:0 "Abandon the damaged forward positions"
 war_adventurer_repanse.12.t:0 "The Relief Column We Missed"
 war_adventurer_repanse.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Bretonnian holy warrior Repanse de Lyonesse. Our siege commander reports that Repanse killed his champion and forced a supply convoy through the blockade. Occupied villages are now openly repeating the story of Couronne. The convoy's passage exposed a gap in the blockade that local guides are now using to carry messages between the occupied villages.\n\nOur officials ask whether we should replace the blockade's lost stores and equipment. Another proposal is to let provincial captains arrange their own blockade duties. Her companions are preparing to travel, and she has declined any office that would require her to remain."
 war_adventurer_repanse.13.option_a:0 "Refund the levy collected under forged orders"
 war_adventurer_repanse.13.option_b:0 "Give the villages control of their own collection records"
 war_adventurer_repanse.13.option_c:0 "Enforce payment through destructive seizures"
 war_adventurer_repanse.13.t:0 "The Duke's Old Seal"
 war_adventurer_repanse.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Bretonnian holy warrior Repanse de Lyonesse. Our tax officer reports that Repanse exposed forged orders bearing the seal of her former dukedom.\n\nVillagers have withheld the disputed payments and circulated copies of her declaration. The disputed orders remain posted in several settlements, but now carry handwritten copies of Repanse's accusation beneath their seals.\n\nOur officials ask whether we should refund the levy collected under forged orders. Another proposal is to give the villages control of their own collection records. The last messenger found Repanse leaving under her banner rather than waiting for another audience."
 war_adventurer_repanse.14.option_a:0 "Buy back the captured weapons under an amnesty"
 war_adventurer_repanse.14.option_b:0 "Withdraw the collection teams and let local councils collect dues"
 war_adventurer_repanse.14.option_c:0 "Burn out the remaining armed camps"
 war_adventurer_repanse.14.t:0 "Peasants Beneath the Banner"
 war_adventurer_repanse.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Bretonnian holy warrior Repanse de Lyonesse. Our marshal reports that Repanse armed villagers from a captured depot and led them out of the district. A small band remains behind to resist our collectors, while she has already escaped pursuit. The remaining holdouts have kept enough captured weapons to threaten another collection party unless the government settles or suppresses them.\n\nOur officials ask whether we should buy back the captured weapons under an amnesty. Another proposal is to withdraw the collection teams and let local councils collect dues. Repanse claims no right to govern this province and will continue beyond its borders."
 war_adventurer_repanse.15.option_a:0 "Compensate the defeated escort"
 war_adventurer_repanse.15.option_b:0 "Leave the disputed honours to provincial courts"
 war_adventurer_repanse.15.option_c:0 "Uphold the discredited sentence in Repanse's absence"
 war_adventurer_repanse.15.t:0 "A Knighthood Denied"
 war_adventurer_repanse.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Bretonnian holy warrior Repanse de Lyonesse. Our herald reports that Repanse publicly defended a prisoner condemned for claiming a knight's honours. She broke the escort, took the prisoner away, and invoked her own elevation by Louis the Young before a large crowd. The herald's written judgment has become a public embarrassment now that witnesses can repeat Repanse's answer almost word for word.\n\nOur officials ask whether we should compensate the defeated escort. Another proposal is to leave the disputed honours to provincial courts. The Damoiselle has left a petition in place of a demand for permanent command."
 war_adventurer_repanse.16.option_a:0 "Rebuild the gatehouse and settle the lost contracts"
 war_adventurer_repanse.16.option_b:0 "Place labour contracts under an independent provincial council"
 war_adventurer_repanse.16.option_c:0 "Leave the ruined camp abandoned"
 war_adventurer_repanse.16.t:0 "The Camp with Open Gates"
 war_adventurer_repanse.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Bretonnian holy warrior Repanse de Lyonesse. Our overseer reports that Repanse broke into a labour camp and led its captives away beneath her banner. The gatehouse and the records of the camp's contracts were destroyed in the fighting. Fragments of the burned contracts have been recovered from the gatehouse, leaving creditors unable to prove all the claims they still demand.\n\nOur officials ask whether we should rebuild the gatehouse and settle the lost contracts. Another proposal is to place labour contracts under an independent provincial council. Repanse has entrusted the immediate aftermath to the local authorities and resumed her pilgrimage."
 war_adventurer_repanse.17.option_a:0 "Compensate the disarmed guards and robbed custodians"
 war_adventurer_repanse.17.option_b:0 "Give the sanctuary's custodians authority over restitution"
 war_adventurer_repanse.17.option_c:0 "Dismiss the witnesses' evidence of plunder"
 war_adventurer_repanse.17.t:0 "The Shrine's Broken Trophy"
 war_adventurer_repanse.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Bretonnian holy warrior Repanse de Lyonesse. Our governor reports that Repanse destroyed a trophy taken from a plundered sanctuary and returned its fragments to local custodians.\n\nOur guards were disarmed before they could stop her. The custodians have laid out the returned fragments and invited witnesses to identify who brought the original trophy into the governor's possession.\n\nOur officials ask whether we should compensate the disarmed guards and robbed custodians. Another proposal is to give the sanctuary's custodians authority over restitution. Her companions are preparing to travel, and she has declined any office that would require her to remain."
 war_adventurer_repanse.18.option_a:0 "Replace the damaged occupation force"
 war_adventurer_repanse.18.option_b:0 "Transfer the district's security to its own captains"
 war_adventurer_repanse.18.option_c:0 "Accept the refugees' public testimony"
 war_adventurer_repanse.18.t:0 "A Couronne in Foreign Soil"
 war_adventurer_repanse.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Bretonnian holy warrior Repanse de Lyonesse. Our field officer reports that Repanse cut down the champion enforcing our occupation and opened a passage for refugees. Their departure has carried accounts of the garrison's abuses beyond the frontier. The surviving occupation officers disagree over the champion's orders, but none denies that the refugees escaped through his abandoned position.\n\nOur officials ask whether we should replace the damaged occupation force. Another proposal is to transfer the district's security to its own captains. The last messenger found Repanse leaving under her banner rather than waiting for another audience."
 war_adventurer_repanse.19.option_a:0 "Compensate those harmed by the broker's contracts"
 war_adventurer_repanse.19.option_b:0 "Let local magistrates control the compromised registry"
 war_adventurer_repanse.19.option_c:0 "Defend the officials who endorsed the false protection"
 war_adventurer_repanse.19.t:0 "The Knight's Stolen Name"
 war_adventurer_repanse.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Bretonnian holy warrior Repanse de Lyonesse. Our customs office reports that Repanse exposed a slave broker using her name and supposed ducal protection. She freed his prisoners before the watch arrived, leaving our officials implicated by their signatures. The broker's ledgers carry official endorsements beside promises of ducal protection that Repanse has publicly repudiated.\n\nOur officials ask whether we should compensate those harmed by the broker's contracts. Another proposal is to let local magistrates control the compromised registry. Repanse claims no right to govern this province and will continue beyond its borders."
 war_adventurer_repanse.20.option_a:0 "Reequip the disarmed patrol"
 war_adventurer_repanse.20.option_b:0 "Give the border communities control of pilgrim escorts"
 war_adventurer_repanse.20.option_c:0 "Acknowledge the patrol's defeat"
 war_adventurer_repanse.20.t:0 "The Banner Beyond the Frontier"
 war_adventurer_repanse.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Bretonnian holy warrior Repanse de Lyonesse. Our commander reports that Repanse scattered a patrol holding a group of pilgrims and escorted them toward a foreign border. She left the patrol's weapons stacked around its officer's broken standard. The disarmed patrol has returned with its recovered weapons and a standard too damaged to display without revealing the defeat.\n\nOur officials ask whether we should reequip the disarmed patrol. Another proposal is to give the border communities control of pilgrim escorts. The Damoiselle has left a petition in place of a demand for permanent command."
 war_adventurer_repanse.21.t:0 "Repanse de Lyonesse has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_repanse.21.d:0 "Word from [war_adventurer_arrival_province.GetName] announces the arrival of the Bretonnian holy warrior Repanse de Lyonesse. Her banner has been recognized by travelers familiar with Bretonnian tales.\n\nOnce a shepherdess, Repanse answered the Lady's call, rallied defeated knights, and broke the siege of Couronne. Preserved by the Lady's grace, she now travels as a champion of her faith rather than ruling from a ducal court."
 war_adventurer_sienna:0 "Sienna Fuegonasus, Adventurer"
 desc_war_adventurer_sienna:0 "Sienna Fuegonasus has been coaxing extraordinary heat from local furnaces, to the delight of craftsmen and the alarm of their neighbors. The Bright Wizard's fascination with Aqshy runs far beyond the patient routines her former tutors would prefer. Orders for metalwork are rising, but so are complaints about sparks, scorched roofs, and laughter from the workshop after midnight."
 war_adventurer_sienna.1.option_a:0 "Record the corrected furnace design"
 war_adventurer_sienna.1.option_b:0 "Rebuild local furnaces with the safer air channels"
 war_adventurer_sienna.1.option_c:0 "Equip a counting house for the improved metalworking trade"
 war_adventurer_sienna.1.t:0 "Thyrus's Marginal Notes"
 war_adventurer_sienna.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering human fire wizard Sienna Fuegonasus. Our guild reports that Sienna corrected a dangerous furnace design using lessons she attributes to Thyrus Gormann.\n\nShe quarrelled with its masters over supervision and left before the successful test was complete. The guild's apprentices have copied the corrected air channels before the offended masters can order the chalk marks scrubbed away.\n\nOur officials ask whether we should record the corrected furnace design. Another proposal is to rebuild local furnaces with the safer air channels. The Bright Wizard's temporary hearth is cold, and her travelling things are gone."
 war_adventurer_sienna.2.option_a:0 "Restore homes for the rescued cellar workers"
 war_adventurer_sienna.2.option_b:0 "Organize a provincial rescue watch from the survivors"
 war_adventurer_sienna.2.option_c:0 "Return recovered tools and supplies to the damaged workshops"
 war_adventurer_sienna.2.t:0 "The Prisoner's Burning Rescue"
 war_adventurer_sienna.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering human fire wizard Sienna Fuegonasus. Our watch captain reports that Sienna, being escorted for questioning, broke her restraints when attackers trapped civilians in a cellar. She burned through the obstruction and helped the escort escape, then disappeared herself. The surviving escort has submitted statements confirming that its own guards would have died had the prisoner remained chained.\n\nOur officials ask whether we should restore homes for the rescued cellar workers. Another proposal is to organize a provincial rescue watch from the survivors. Sienna has made it clear that she will not remain under a local magistrate's supervision."
 war_adventurer_sienna.3.option_a:0 "Restore the threatened households from the saved grain"
 war_adventurer_sienna.3.option_b:0 "Provision the provincial militia from the sound reserves"
 war_adventurer_sienna.3.option_c:0 "Supply local millers with the salvaged grain"
 war_adventurer_sienna.3.t:0 "The Fire in the Grain Store"
 war_adventurer_sienna.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering human fire wizard Sienna Fuegonasus. Our magistrate reports that Sienna burned an infested store before its vermin could reach the public granary. Watchmen who tried to arrest her instead helped pull workers clear; the saved grain is now under official seal. The sealed grain is sound, but officials must decide whether it belongs in the public stores or should be issued immediately.\n\nOur officials ask whether we should restore the threatened households from the saved grain. Another proposal is to provision the provincial militia from the sound reserves. The last witness saw her taking the road before the watch could assemble another escort."
 war_adventurer_sienna.4.option_a:0 "Catalogue the surviving necromantic evidence under guard"
 war_adventurer_sienna.4.option_b:0 "Restore the disturbed burial precinct and its records"
 war_adventurer_sienna.4.option_c:0 "Endow a cathedral for the restored burial ground"
 war_adventurer_sienna.4.t:0 "The Sister in the Testimony"
 war_adventurer_sienna.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering human fire wizard Sienna Fuegonasus. Our investigator receives conflicting descriptions of a woman resembling Sienna near disturbed graves. Sienna has burned a necromantic cache and left a warning naming her twin Sofia. The surviving labels distinguish the seized reagents from an ordinary healer's supplies, giving the investigator evidence beyond the witnesses' confusion.\n\nOur officials ask whether we should catalogue the surviving necromantic evidence under guard. Another proposal is to restore the disturbed burial precinct and its records. Her hosts have received no promise that the wandering wizard will return to answer the remaining accusations."
 war_adventurer_sienna.5.option_a:0 "Have engineers document the casting process"
 war_adventurer_sienna.5.option_b:0 "Install the casting in a provincial workshop"
 war_adventurer_sienna.5.option_c:0 "Use the finished work to equip the local public works office"
 war_adventurer_sienna.5.t:0 "The Workshop's Unwelcome Miracle"
 war_adventurer_sienna.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering human fire wizard Sienna Fuegonasus. Our smiths petition after Sienna used Aqshy to finish a difficult casting, cracked the roof tiles, and walked out during the ensuing argument.\n\nThe casting survived and the apprentices recorded the process. The apprentices have placed the successful casting beside the broken tiles so that the magistrate can see both the benefit and the damage.\n\nOur officials ask whether we should have engineers document the casting process. Another proposal is to install the casting in a provincial workshop. Sienna has slipped away before the authorities can turn their questions into another detention."
 war_adventurer_sienna.6.option_a:0 "Translate the surviving furnace diagrams"
 war_adventurer_sienna.6.option_b:0 "Equip local smithies with safer furnace shielding"
 war_adventurer_sienna.6.option_c:0 "Use the trial metal to equip provincial recruits"
 war_adventurer_sienna.6.t:0 "A Furnace with No Shared Language"
 war_adventurer_sienna.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering human fire wizard Sienna Fuegonasus. Our provincial engineer reports that Sienna and local smiths overcame a language barrier by drawing furnace diagrams in soot. The trial produced useful metal, although its heat drove officials out of the building. The diagrams explain the trial clearly enough for the smiths to repeat it with better shielding and a controlled supply of fuel.\n\nOur officials ask whether we should translate the surviving furnace diagrams. Another proposal is to equip local smithies with safer furnace shielding. The Bright Wizard's temporary hearth is cold, and her travelling things are gone."
 war_adventurer_sienna.7.option_a:0 "Restore the caravan stop with the recovered cargo"
 war_adventurer_sienna.7.option_b:0 "Return the freight to local suppliers"
 war_adventurer_sienna.7.option_c:0 "Train provincial convoy guards from the survivors' account"
 war_adventurer_sienna.7.t:0 "The Captive Who Cleared the Road"
 war_adventurer_sienna.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering human fire wizard Sienna Fuegonasus. Our governor reports that Sienna was detained for carrying unfamiliar magical tools, then rescued the same guards when raiders attacked their convoy. Survivors returned with recovered cargo and a request to clear her name. The convoy's guards have returned Sienna's confiscated tools to the magistrate together with their request that the detention be reconsidered.\n\nOur officials ask whether we should restore the caravan stop with the recovered cargo. Another proposal is to return the freight to local suppliers. Sienna has made it clear that she will not remain under a local magistrate's supervision."
 war_adventurer_sienna.8.option_a:0 "Examine the surviving labels and unburned reagents under guard"
 war_adventurer_sienna.8.option_b:0 "Correct the harbour's cargo registry using the preserved seals"
 war_adventurer_sienna.8.option_c:0 "Return the legitimate recovered goods to provincial workshops"
 war_adventurer_sienna.8.t:0 "The Foreign Pyre"
 war_adventurer_sienna.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering human fire wizard Sienna Fuegonasus. Our harbour magistrate reports that Sienna burned a concealed shipment of corpse-raising reagents. Her warning mentions Sofia, but local witnesses had mistaken the two women for one person. The customs office has retained unburned labels and cargo seals, allowing investigators to follow the shipment beyond the harbour.\n\nOur officials ask whether we should examine the surviving labels and unburned reagents under guard. Another proposal is to correct the harbour's cargo registry using the preserved seals. The last witness saw her taking the road before the watch could assemble another escort."
 war_adventurer_sienna.9.option_a:0 "Settle the rescued families in provincial homes"
 war_adventurer_sienna.9.option_b:0 "Enlist willing survivors as local scouts"
 war_adventurer_sienna.9.option_c:0 "Establish training fields for the provincial bridge guard"
 war_adventurer_sienna.9.t:0 "The Bridge of Sparks"
 war_adventurer_sienna.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering human fire wizard Sienna Fuegonasus. Our commander reports that Sienna held a narrow bridge with fire while a mixed group of travellers brought civilians to safety.\n\nThe strangers have separated, leaving our officials to house the rescued families. The rescued travellers have assembled their surviving possessions in the customs yard while officers record how the bridge defence held.\n\nOur officials ask whether we should settle the rescued families in provincial homes. Another proposal is to enlist willing survivors as local scouts. Her hosts have received no promise that the wandering wizard will return to answer the remaining accusations."
 war_adventurer_sienna.10.option_a:0 "Remove the traffickers' false entries from the provincial registry"
 war_adventurer_sienna.10.option_b:0 "Examine the preserved seal under scholarly guard"
 war_adventurer_sienna.10.option_c:0 "Train local watchmen to recognize the traffickers' consignments"
 war_adventurer_sienna.10.t:0 "The Invitation She Burned"
 war_adventurer_sienna.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering human fire wizard Sienna Fuegonasus. Our customs officer reports that Sienna destroyed a letter offering forbidden instruction in exchange for stolen bodies. She left its seal and a sketch of the courier, warning that the invitation was meant to exploit her family's history. The preserved seal matches marks on several recently seized consignments whose contents were disguised as ordinary funerary supplies.\n\nOur officials ask whether we should remove the traffickers' false entries from the provincial registry. Another proposal is to examine the preserved seal under scholarly guard. Sienna has slipped away before the authorities can turn their questions into another detention."
 war_adventurer_sienna.11.option_a:0 "Purchase replacement ammunition"
 war_adventurer_sienna.11.option_b:0 "Let provincial garrisons arrange their own supply contracts"
 war_adventurer_sienna.11.option_c:0 "Abandon the damaged magazine and its surroundings"
 war_adventurer_sienna.11.t:0 "The Powder Store's Red Dawn"
 war_adventurer_sienna.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering human fire wizard Sienna Fuegonasus. Our quartermaster reports that Sienna set fire to ammunition stored beside captives taken from nearby villages. The captives escaped through a breach she burned in the outer wall. The quartermaster's surviving inventory shows that the ammunition was already allocated to detachments expecting their next issue within days.\n\nOur officials ask whether we should purchase replacement ammunition. Another proposal is to let provincial garrisons arrange their own supply contracts. The Bright Wizard's temporary hearth is cold, and her travelling things are gone."
 war_adventurer_sienna.12.option_a:0 "Replace the escort's burned equipment"
 war_adventurer_sienna.12.option_b:0 "Transfer detention powers to provincial magistrates"
 war_adventurer_sienna.12.option_c:0 "Admit the humiliating escape"
 war_adventurer_sienna.12.t:0 "The Escort That Lost Its Prisoner"
 war_adventurer_sienna.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering human fire wizard Sienna Fuegonasus. Our magistrate reports that guards attempted to chain Sienna after recognizing her college training. She burned the restraints, released other detainees, and vanished into the smoke. The damaged restraints remain on the guardroom floor, making the escort's claim of an orderly transfer impossible to sustain.\n\nOur officials ask whether we should replace the escort's burned equipment. Another proposal is to transfer detention powers to provincial magistrates. Sienna has made it clear that she will not remain under a local magistrate's supervision."
 war_adventurer_sienna.13.option_a:0 "Purchase clean replacement stores"
 war_adventurer_sienna.13.option_b:0 "Place local supply inspections under an independent council"
 war_adventurer_sienna.13.option_c:0 "Abandon the contaminated compound"
 war_adventurer_sienna.13.t:0 "The Grain We Could Not Issue"
 war_adventurer_sienna.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering human fire wizard Sienna Fuegonasus. Our supply officer reports that Sienna burned a stockpile prepared with plague-tainted vermin for distribution into a rival district.\n\nWorkers escaped, but the operation's surviving records now circulate among witnesses. Copies of the distribution orders have escaped with the workers, exposing the intended use of stores the office now calls merely spoiled.\n\nOur officials ask whether we should purchase clean replacement stores. Another proposal is to place local supply inspections under an independent council. The last witness saw her taking the road before the watch could assemble another escort."
 war_adventurer_sienna.14.option_a:0 "Repair the mortuary's burned facilities"
 war_adventurer_sienna.14.option_b:0 "Let local magistrates investigate the mistaken identity"
 war_adventurer_sienna.14.option_c:0 "Close the university that supplied the hidden experiments"
 war_adventurer_sienna.14.t:0 "The Wrong Sister's Warrant"
 war_adventurer_sienna.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering human fire wizard Sienna Fuegonasus. Our governor reports that an arrest warrant intended for a necromancer with Sienna's likeness brought her to our mortuary. She destroyed its hidden experiments and left the warrant pinned to a scorched door. The warrant's description fits two different women, while the scorched worktables reveal why the mortuary staff feared any investigation.\n\nOur officials ask whether we should repair the mortuary's burned facilities. Another proposal is to let local magistrates investigate the mistaken identity. Her hosts have received no promise that the wandering wizard will return to answer the remaining accusations."
 war_adventurer_sienna.15.option_a:0 "Repair the foundry machinery properly"
 war_adventurer_sienna.15.option_b:0 "Grant the foundry workers independent safety supervision"
 war_adventurer_sienna.15.option_c:0 "Dismantle the foundry's compromised counting house"
 war_adventurer_sienna.15.t:0 "The Lesson the Guild Rejected"
 war_adventurer_sienna.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering human fire wizard Sienna Fuegonasus. Our foundry master reports that Sienna recognized coercive production practices and ruined the machinery driving them. Her chalk diagrams explain exactly which corners the guild had cut. The diagrams show the dangerous alterations precisely, leaving the foundry master unable to blame the damage on an unexplained furnace failure.\n\nOur officials ask whether we should repair the foundry machinery properly. Another proposal is to grant the foundry workers independent safety supervision. Sienna has slipped away before the authorities can turn their questions into another detention."
 war_adventurer_sienna.16.option_a:0 "Replace the arsenal's burned stores"
 war_adventurer_sienna.16.option_b:0 "Let provincial garrisons organize their own temporary depots"
 war_adventurer_sienna.16.option_c:0 "Leave the burned compound closed"
 war_adventurer_sienna.16.t:0 "The Arsenal's Failed Arrest"
 war_adventurer_sienna.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the wandering human fire wizard Sienna Fuegonasus. Our commander reports that an attempt to seize Sienna inside a provincial arsenal ended in a spreading fire. Labourers fled with her assistance, and the pursuers returned without their prisoner. The surviving labourers' statements describe both the attempted arrest and the unsafe ammunition stores beside their workstations.\n\nOur officials ask whether we should replace the arsenal's burned stores. Another proposal is to let provincial garrisons organize their own temporary depots. The Bright Wizard's temporary hearth is cold, and her travelling things are gone."
 war_adventurer_sienna.17.option_a:0 "Repair the damaged transport"
 war_adventurer_sienna.17.option_b:0 "Transfer harbour inspections to the local maritime council"
 war_adventurer_sienna.17.option_c:0 "Publicly abandon the claim to the released captives"
 war_adventurer_sienna.17.t:0 "The Ship with the Empty Hold"
 war_adventurer_sienna.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the wandering human fire wizard Sienna Fuegonasus. Our customs officer reports that Sienna burned the locks from a captive transport and destroyed its restraining equipment.\n\nThe released prisoners reached shore while the crew tried to contain the fire. The crew has submitted its repair estimate, but the harbour watch has already recorded the passengers' accounts of their confinement.\n\nOur officials ask whether we should repair the damaged transport. Another proposal is to transfer harbour inspections to the local maritime council. Sienna has made it clear that she will not remain under a local magistrate's supervision."
 war_adventurer_sienna.18.option_a:0 "Settle the collector's outstanding contracts"
 war_adventurer_sienna.18.option_b:0 "Put the provincial collections under independent local auditors"
 war_adventurer_sienna.18.option_c:0 "Publicly repudiate the collector's dealings"
 war_adventurer_sienna.18.t:0 "A Necromancer's Rejected Gift"
 war_adventurer_sienna.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the wandering human fire wizard Sienna Fuegonasus. Our collector reports that Sienna destroyed a manuscript offered as the work of her twin. The flames also consumed records of the collector's dealings in forbidden remains, leaving angry suppliers at our door. The suppliers' demands identify dealings that the collector had hoped would disappear with his destroyed account books.\n\nOur officials ask whether we should settle the collector's outstanding contracts. Another proposal is to put the provincial collections under independent local auditors. The last witness saw her taking the road before the watch could assemble another escort."
 war_adventurer_sienna.19.option_a:0 "Repair the works and hire replacement labour"
 war_adventurer_sienna.19.option_b:0 "Let the surviving workshop guilds direct their own production"
 war_adventurer_sienna.19.option_c:0 "Abandon the ruined holding yard"
 war_adventurer_sienna.19.t:0 "The Furnace Turned Outward"
 war_adventurer_sienna.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the wandering human fire wizard Sienna Fuegonasus. Our overseer reports that Sienna reversed a forced-labour foundry's magical draft, blasting open its holding yard. Its skilled workers escaped with tools and account books. The escaped workers took the payroll and maintenance books, leaving the overseer without either skilled labour or reliable production records.\n\nOur officials ask whether we should repair the works and hire replacement labour. Another proposal is to let the surviving workshop guilds direct their own production. Her hosts have received no promise that the wandering wizard will return to answer the remaining accusations."
 war_adventurer_sienna.20.option_a:0 "Compensate the archive staff and replace damaged equipment"
 war_adventurer_sienna.20.option_b:0 "Give provincial magistrates independent access to the surviving files"
 war_adventurer_sienna.20.option_c:0 "Accept the fugitives' published allegations"
 war_adventurer_sienna.20.t:0 "The Witnesses in the Smoke"
 war_adventurer_sienna.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the wandering human fire wizard Sienna Fuegonasus. Our governor reports that Sienna covered a group of fugitives with a wall of flame while they carried evidence out of a seized archive. The provincial guard cannot explain how an apparent prisoner became the organizer of the escape. The surviving archive staff can identify the missing files, but cannot deny that the fugitives carried genuine evidence out through the smoke.\n\nOur officials ask whether we should compensate the archive staff and replace damaged equipment. Another proposal is to give provincial magistrates independent access to the surviving files. Sienna has slipped away before the authorities can turn their questions into another detention."
 war_adventurer_sienna.21.t:0 "Sienna Fuegonasus has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_sienna.21.d:0 "Our officials in [war_adventurer_arrival_province.GetName] report that the wandering human fire wizard Sienna Fuegonasus has arrived. The red-haired traveler has already shown a lively interest in the province's furnaces and fire pits.\n\nShe studied under Thyrus Gormann before abandoning the restrictions of the Bright College. Her command of Aqshy is formidable, as is the fascination with flame that so often tests her restraint."
 war_adventurer_malakai:0 "Malakai Makaisson, Adventurer"
 desc_war_adventurer_malakai:0 "Malakai Makaisson has filled a rented yard with gears, gun barrels, and a machine whose purpose changes with each explanation. The Slayer engineer's demonstrations attract smiths and gunners, despite whispered accounts of the Unsinkable and the Undestructible. His suggestions are improving local defenses; his test firings are doing rather less for the neighbors' peace of mind."
 war_adventurer_malakai.1.option_a:0 "Test the surviving sealed-compartment measurements"
 war_adventurer_malakai.1.option_b:0 "Fit provincial storehouses with watertight compartments"
 war_adventurer_malakai.1.option_c:0 "Archive the failed hull's trial report"
 war_adventurer_malakai.1.t:0 "The Unsinkable's Last Rivet"
 war_adventurer_malakai.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Dwarf Slayer and engineer Malakai Makaisson. Our engineers report that Malakai used salvaged plans from the Unsinkable to demonstrate a safer compartmented hull.\n\nThe test barge sank, but the sealed cargo compartment reached shore intact and its measurements survived. The sealed compartment reached the bank with its measuring marks intact, allowing the engineers to distinguish a useful design from the lost hull.\n\nOur officials ask whether we should test the surviving sealed-compartment measurements. Another proposal is to fit provincial storehouses with watertight compartments. His assistants have loaded the remaining machinery for a journey beyond our officials' reach."
 war_adventurer_malakai.2.option_a:0 "Compare the intact machinery with the corrected drawings"
 war_adventurer_malakai.2.option_b:0 "Install the salvaged machinery in local workshops"
 war_adventurer_malakai.2.option_c:0 "Rebuild the workshop trade around a new counting house"
 war_adventurer_malakai.2.t:0 "The Hangar with No Roof"
 war_adventurer_malakai.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Dwarf Slayer and engineer Malakai Makaisson. Our hold engineer reports that Malakai's lifting-engine trial blew the roof off a disused hangar. He left corrected drawings and a bitter note comparing the failure with the Undestructible before disappearing into the mountains. The intact engine parts have been laid beneath a temporary awning while the guild compares them with the corrected drawings.\n\nOur officials ask whether we should compare the intact machinery with the corrected drawings. Another proposal is to install the salvaged machinery in local workshops. Malakai refuses to wait while the authorities debate the wisdom of his experiment."
 war_adventurer_malakai.3.option_a:0 "Equip provincial defenders with the recovered axes"
 war_adventurer_malakai.3.option_b:0 "Teach the surviving crew's loading drill to army officers"
 war_adventurer_malakai.3.option_c:0 "Establish training fields for safer firing-platform drills"
 war_adventurer_malakai.3.t:0 "Axes in the Target Wall"
 war_adventurer_malakai.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Dwarf Slayer and engineer Malakai Makaisson. Our garrison reports that a trial Goblin-hewer broke a raiding force before its own platform collapsed. The defenders recovered usable axes and a detailed ammunition-loading diagram. The crew has marked each loading step beside the shattered platform so that a safer emplacement can preserve what worked.\n\nOur officials ask whether we should equip provincial defenders with the recovered axes. Another proposal is to teach the surviving crew's loading drill to army officers. The last messenger found the engineer's workshop shuttered and its travelling equipment gone."
 war_adventurer_malakai.4.option_a:0 "Confirm the settlement and reopen the repaired workshop"
 war_adventurer_malakai.4.option_b:0 "Have engineers examine the apprentices' copied adjustments"
 war_adventurer_malakai.4.option_c:0 "Endow a counting house for the restored workshop guild"
 war_adventurer_malakai.4.t:0 "A Slayer's Workshop Debt"
 war_adventurer_malakai.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Dwarf Slayer and engineer Malakai Makaisson. Our guild court reports that Malakai settled an old workshop debt by repairing machinery, then refused an offer of reinstatement that might soften his disgrace. The repaired works are producing again, but rival masters dispute ownership of his notes. The workshop's repaired machinery is turning again, and its apprentices have carefully copied the adjustments before the guild court rules.\n\nOur officials ask whether we should confirm the settlement and reopen the repaired workshop. Another proposal is to have engineers examine the apprentices' copied adjustments. Malakai has packed the surviving tools and departed in search of another proving ground."
 war_adventurer_malakai.5.option_a:0 "Catalogue the numbered mineral samples"
 war_adventurer_malakai.5.option_b:0 "Open the promising provincial workings"
 war_adventurer_malakai.5.option_c:0 "Organize local rescue crews around the returned prospectors"
 war_adventurer_malakai.5.t:0 "The Cargo Above the Pass"
 war_adventurer_malakai.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Dwarf Slayer and engineer Malakai Makaisson. Our border warden reports that Malakai's experimental flying machine carried stranded prospectors over a blocked pass.\n\nThey returned with mineral samples and sketches of ruins he hopes might guide a future expedition to a lost hold. The prospectors have numbered their mineral samples to match the sketches, making a second expedition possible without the inventor's presence.\n\nOur officials ask whether we should catalogue the numbered mineral samples. Another proposal is to open the promising provincial workings. The engineer has left his corrections behind rather than remain for a guild hearing."
 war_adventurer_malakai.6.option_a:0 "Install the improved hoist in provincial cargo yards"
 war_adventurer_malakai.6.option_b:0 "Reopen the public cargo office around the repaired crane"
 war_adventurer_malakai.6.option_c:0 "Establish a stock exchange beside the restored freight yards"
 war_adventurer_malakai.6.t:0 "The Harbour's Unscheduled Landing"
 war_adventurer_malakai.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Dwarf Slayer and engineer Malakai Makaisson. Our harbour master reports that Malakai landed a flying prototype between the warehouses and commandeered a damaged crane to lift it again. He left the crane repaired and its operators trained in a new hoist arrangement. The crane operators have already used the repaired hoist to clear freight that had stood untouched beside the harbour wall.\n\nOur officials ask whether we should install the improved hoist in provincial cargo yards. Another proposal is to reopen the public cargo office around the repaired crane. His assistants have loaded the remaining machinery for a journey beyond our officials' reach."
 war_adventurer_malakai.7.option_a:0 "Train provincial ferrymen as permanent rescue crews"
 war_adventurer_malakai.7.option_b:0 "Build sealed cargo compartments for local carriers"
 war_adventurer_malakai.7.option_c:0 "Record the controlled flooding trial"
 war_adventurer_malakai.7.t:0 "The River Refused the Name"
 war_adventurer_malakai.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Dwarf Slayer and engineer Malakai Makaisson. Our ferrymen report that Malakai declined to call a test vessel unsinkable, then deliberately flooded it to prove a rescue method. The vessel was lost, but every passenger and the sealed food cargo reached shore. The ferrymen have measured the sealed compartments and written down the order in which the test passengers entered the water.\n\nOur officials ask whether we should train provincial ferrymen as permanent rescue crews. Another proposal is to build sealed cargo compartments for local carriers. Malakai refuses to wait while the authorities debate the wisdom of his experiment."
 war_adventurer_malakai.8.option_a:0 "Train provincial defenders from the axe-thrower's firing pattern"
 war_adventurer_malakai.8.option_b:0 "Have army officers study the frontier crew's drill"
 war_adventurer_malakai.8.option_c:0 "Establish training fields for supervised weapons trials"
 war_adventurer_malakai.8.t:0 "The Foreign Range's Axe Rain"
 war_adventurer_malakai.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Dwarf Slayer and engineer Malakai Makaisson. Our commander reports that Malakai tested a compact axe-thrower against raiders threatening a frontier post. Local armourers recovered its throwing pattern and have asked how much of the experiment they may copy. The recovered axes show where the experimental volley struck, giving the armourers evidence more reliable than the excited defenders' estimates.\n\nOur officials ask whether we should train provincial defenders from the axe-thrower's firing pattern. Another proposal is to have army officers study the frontier crew's drill. The last messenger found the engineer's workshop shuttered and its travelling equipment gone."
 war_adventurer_malakai.9.option_a:0 "Organize a permanent provincial evacuation watch"
 war_adventurer_malakai.9.option_b:0 "Restore the cleared market approaches and local stalls"
 war_adventurer_malakai.9.option_c:0 "Examine the discarded pressure valves"
 war_adventurer_malakai.9.t:0 "The Burnt Balloon's Survivors"
 war_adventurer_malakai.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Dwarf Slayer and engineer Malakai Makaisson. Our magistrate reports that Malakai cut a failing experimental envelope free before its fire reached a crowded market.\n\nHis own account invokes the Undestructible's disaster, and merchants credit the evacuation drill he shouted from the rigging. The merchants' damage claims are accompanied by witness statements crediting the shouted drill with keeping the market approaches clear.\n\nOur officials ask whether we should organize a permanent provincial evacuation watch. Another proposal is to restore the cleared market approaches and local stalls. Malakai has packed the surviving tools and departed in search of another proving ground."
 war_adventurer_malakai.10.option_a:0 "Compare the aerial sketches with the ancient tools"
 war_adventurer_malakai.10.option_b:0 "Reopen the identified provincial road"
 war_adventurer_malakai.10.option_c:0 "Equip local workshops with the recovered tools"
 war_adventurer_malakai.10.t:0 "The Ruin Seen from Above"
 war_adventurer_malakai.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Dwarf Slayer and engineer Malakai Makaisson. Our surveyor reports that Malakai carried an expedition over impassable ground and recovered a stranded team with ancient tools. His crew has departed, leaving aerial sketches of roads and ruins unfamiliar to our administration. The aerial sketches identify a usable line through ground where the surveyors had previously abandoned their road project.\n\nOur officials ask whether we should compare the aerial sketches with the ancient tools. Another proposal is to reopen the identified provincial road. The engineer has left his corrections behind rather than remain for a guild hearing."
 war_adventurer_malakai.11.option_a:0 "Replace the gun crew's equipment and stores"
 war_adventurer_malakai.11.option_b:0 "Let provincial battery commanders arrange their own supplies"
 war_adventurer_malakai.11.option_c:0 "Abandon the damaged firing position"
 war_adventurer_malakai.11.t:0 "The Battery that Fired Axes"
 war_adventurer_malakai.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Dwarf Slayer and engineer Malakai Makaisson. Our siege commander reports that Malakai's improvised Goblin-hewer tore through a supply approach and wrecked the nearest gun crew. The machine was dismantled before our counterattack arrived. The surviving gunners have dragged their damaged pieces behind the camp, but lack the fittings and stores needed to reopen fire.\n\nOur officials ask whether we should replace the gun crew's equipment and stores. Another proposal is to let provincial battery commanders arrange their own supplies. His assistants have loaded the remaining machinery for a journey beyond our officials' reach."
 war_adventurer_malakai.12.option_a:0 "Pay salvagers to raise the flooded hull"
 war_adventurer_malakai.12.option_b:0 "Leave the dock guild to decide the experiment's future"
 war_adventurer_malakai.12.option_c:0 "Dismantle the shipyard that held the seized prototype"
 war_adventurer_malakai.12.t:0 "The Dock's Flooded Prize"
 war_adventurer_malakai.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Dwarf Slayer and engineer Malakai Makaisson. Our dockmaster reports that Malakai sabotaged a seized experimental ironclad by exploiting weaknesses he compared to his own Unsinkable. Its prisoners escaped in compartmented floats before the hull settled into the mud. The salvagers have marked the flooded hull's position, while the empty prisoner berths make the dockmaster's failure plain.\n\nOur officials ask whether we should pay salvagers to raise the flooded hull. Another proposal is to leave the dock guild to decide the experiment's future. Malakai refuses to wait while the authorities debate the wisdom of his experiment."
 war_adventurer_malakai.13.option_a:0 "Purchase replacement lifting machinery"
 war_adventurer_malakai.13.option_b:0 "Give provincial engineers independent control of aerial security"
 war_adventurer_malakai.13.option_c:0 "Abandon the scorched hangar district"
 war_adventurer_malakai.13.t:0 "The Hangar's Escape Valve"
 war_adventurer_malakai.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Dwarf Slayer and engineer Malakai Makaisson. Our engineer reports that Malakai opened the lift apparatus on a captured flying prototype and used the resulting confusion to free its workers.\n\nThe empty machine exploded after drifting clear of the hangar. The engineers recovered fragments of the lift apparatus, but the workers who understood its construction have already escaped.\n\nOur officials ask whether we should purchase replacement lifting machinery. Another proposal is to give provincial engineers independent control of aerial security. The last messenger found the engineer's workshop shuttered and its travelling equipment gone."
 war_adventurer_malakai.14.option_a:0 "Hire artisans and buy replacement tools"
 war_adventurer_malakai.14.option_b:0 "Allow the workshop guild to renegotiate its own military contracts"
 war_adventurer_malakai.14.option_c:0 "Close the deserted workshop's counting house"
 war_adventurer_malakai.14.t:0 "The Guild We Had Purchased"
 war_adventurer_malakai.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Dwarf Slayer and engineer Malakai Makaisson. Our governor reports that Malakai destroyed a ledger binding a workshop to our military contracts. The masters followed his example of accepting disgrace rather than submission and fled with their finest tools. The surviving clerks possess only partial copies of the military contracts and cannot identify every tool taken from the workshop.\n\nOur officials ask whether we should hire artisans and buy replacement tools. Another proposal is to allow the workshop guild to renegotiate its own military contracts. Malakai has packed the surviving tools and departed in search of another proving ground."
 war_adventurer_malakai.15.option_a:0 "Expand the provincial watch and replace its equipment"
 war_adventurer_malakai.15.option_b:0 "Let local captains determine how to guard the mountain approaches"
 war_adventurer_malakai.15.option_c:0 "Admit that the expensive blockade failed"
 war_adventurer_malakai.15.t:0 "The Pass Below the Airship"
 war_adventurer_malakai.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Dwarf Slayer and engineer Malakai Makaisson. Our warden reports that Malakai carried captives and heirlooms out of a sealed mountain fortress by air. Our costly blockade held every road but never reached the departing craft. The fortress warden has marked every guarded road on his map, unintentionally demonstrating how little the blockade mattered to an aircraft.\n\nOur officials ask whether we should expand the provincial watch and replace its equipment. Another proposal is to let local captains determine how to guard the mountain approaches. The engineer has left his corrections behind rather than remain for a guild hearing."
 war_adventurer_malakai.16.option_a:0 "Replace the burned military stores"
 war_adventurer_malakai.16.option_b:0 "Let provincial garrisons manage their own dispersed depots"
 war_adventurer_malakai.16.option_c:0 "Leave the burned depot district unrepaired"
 war_adventurer_malakai.16.t:0 "The Depot Under the Shadow"
 war_adventurer_malakai.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the Dwarf Slayer and engineer Malakai Makaisson. Our quartermaster reports that an unfamiliar flying machine dropped explosives onto a military depot. Survivors identified a red-haired Dwarf pilot; rescued labourers departed with the craft before our scouts arrived. The quartermaster has counted the burned stores against the last delivery receipts and warns that nearby detachments will miss their issue.\n\nOur officials ask whether we should replace the burned military stores. Another proposal is to let provincial garrisons manage their own dispersed depots. His assistants have loaded the remaining machinery for a journey beyond our officials' reach."
 war_adventurer_malakai.17.option_a:0 "Rebuild the vessel with inspected fittings"
 war_adventurer_malakai.17.option_b:0 "Give the dock guild independent control of procurement"
 war_adventurer_malakai.17.option_c:0 "Close the shipyard responsible for the failed stolen prototype"
 war_adventurer_malakai.17.t:0 "The Trial Ship's Missing Bulkheads"
 war_adventurer_malakai.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the Dwarf Slayer and engineer Malakai Makaisson. Our shipwright reports that Malakai removed critical fittings from a stolen prototype and left a mocking account of the Unsinkable.\n\nThe vessel foundered during launch, although its workers escaped. The shipwright's launch report names the missing fittings, exposing the procurement office's failure to inspect its stolen design.\n\nOur officials ask whether we should rebuild the vessel with inspected fittings. Another proposal is to give the dock guild independent control of procurement. Malakai refuses to wait while the authorities debate the wisdom of his experiment."
 war_adventurer_malakai.18.option_a:0 "Replace the escort's lost weapons"
 war_adventurer_malakai.18.option_b:0 "Let provincial captains supervise future captive convoys"
 war_adventurer_malakai.18.option_c:0 "Abandon and barricade the contested street"
 war_adventurer_malakai.18.t:0 "The Axe Machine in the Alley"
 war_adventurer_malakai.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the Dwarf Slayer and engineer Malakai Makaisson. Our governor reports that Malakai installed an experimental axe-thrower across the route of a captive convoy. The escort broke, and the freed workers carried away its ammunition while he dismantled the machine. The escort's surviving soldiers recovered scattered axe heads, but most of their own weapons left with the freed convoy workers.\n\nOur officials ask whether we should replace the escort's lost weapons. Another proposal is to let provincial captains supervise future captive convoys. The last messenger found the engineer's workshop shuttered and its travelling equipment gone."
 war_adventurer_malakai.19.option_a:0 "Repair the foundry roof and salvage the records"
 war_adventurer_malakai.19.option_b:0 "Put the provincial archive under independent guild supervision"
 war_adventurer_malakai.19.option_c:0 "Close the foundry's ruined counting house"
 war_adventurer_malakai.19.t:0 "The Fire Above the Foundry"
 war_adventurer_malakai.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the Dwarf Slayer and engineer Malakai Makaisson. Our foundry master reports that Malakai used a small lifting engine to pull stolen plans out of the archive, then destroyed it before our guards could study it. Burning fragments damaged the roof and scattered the records. Clerks are recovering damp papers from beneath the damaged roof while the foundry master determines which drawings cannot be replaced.\n\nOur officials ask whether we should repair the foundry roof and salvage the records. Another proposal is to put the provincial archive under independent guild supervision. Malakai has packed the surviving tools and departed in search of another proving ground."
 war_adventurer_malakai.20.option_a:0 "Replace the disabled lathes and missing tools"
 war_adventurer_malakai.20.option_b:0 "Grant the remaining artisans control of their own workshop"
 war_adventurer_malakai.20.option_c:0 "Publicly repudiate the governor's coercion"
 war_adventurer_malakai.20.t:0 "The Engineer's Refused Commission"
 war_adventurer_malakai.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the Dwarf Slayer and engineer Malakai Makaisson. Our governor reports that an attempt to compel Malakai into service ended with disabled lathes and apprentices escaping through a maintenance passage. He left a note explaining why neither patronage nor disgrace would make him work for you. The apprentices' abandoned benches show that the best tools were carried away before the governor's men could close the workshop.\n\nOur officials ask whether we should replace the disabled lathes and missing tools. Another proposal is to grant the remaining artisans control of their own workshop. The engineer has left his corrections behind rather than remain for a guild hearing."
 war_adventurer_malakai.21.t:0 "Malakai Makaisson has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_malakai.21.d:0 "A dispatch from [war_adventurer_arrival_province.GetName] records the arrival of the Dwarf Slayer and engineer Malakai Makaisson. The visitor has brought tools, sketches, and firm opinions about the shortcomings of other people's machinery.\n\nHe took the Slayer oath after the disasters of his Unsinkable ironclad and Undestructible airship. Disgrace has done little to diminish his inventive ambition or his appetite for another experiment."
 war_adventurer_tyrion:0 "Tyrion, Adventurer"
 desc_war_adventurer_tyrion:0 "Word that the victor over Urian Poisonblade is passing through the province has drawn swordsmen eager to watch Tyrion train. His effortless command of horse and blade inspires recruits and leaves proud veterans demanding another bout. Armorers welcome the custom, while officers contend with wounded pride and arguments over the High Elf champion's presence."
 war_adventurer_tyrion.1.option_a:0 "Restore the sanctuary precinct with the recovered offerings"
 war_adventurer_tyrion.1.option_b:0 "Train the provincial sanctuary watch"
 war_adventurer_tyrion.1.option_c:0 "Raise a cathedral around the restored sanctuary"
 war_adventurer_tyrion.1.t:0 "The Shrine's Renewed Watch"
 war_adventurer_tyrion.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf prince and warrior Tyrion. Our shrine wardens report that Tyrion broke a daemonic incursion at an outer sanctuary and left instructions recalling his stand against N'Kari at the Phoenix Shrine.\n\nPilgrims have returned, but the wardens disagree over the recovered offerings. The returned pilgrims have placed their offerings under the wardens' seal, giving the government a practical means of restoring the damaged sanctuary.\n\nOur officials ask whether we should restore the sanctuary precinct with the recovered offerings. Another proposal is to train the provincial sanctuary watch. The champion has declined a prolonged stay while officials settle the disputes left behind."
 war_adventurer_tyrion.2.option_a:0 "Teach the corrected sword drill to provincial recruits"
 war_adventurer_tyrion.2.option_b:0 "Circulate the battle commentary to our army officers"
 war_adventurer_tyrion.2.option_c:0 "Establish training fields for the revised exercises"
 war_adventurer_tyrion.2.t:0 "Urian's Lesson on the Practice Field"
 war_adventurer_tyrion.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf prince and warrior Tyrion. Our marshal reports that Tyrion corrected an overconfident officer's sword drill by explaining how he defeated Urian Poisonblade. The demonstration ended with an embarrassed officer and a regiment eager to practise. The officer has redrawn his drill chart in front of the regiment, accepting corrections he would have rejected from a less celebrated instructor.\n\nOur officials ask whether we should teach the corrected sword drill to provincial recruits. Another proposal is to circulate the battle commentary to our army officers. The last report places Tyrion on the road, already beyond the escort sent to find him."
 war_adventurer_tyrion.3.option_a:0 "Equip the provincial road guard from the recovered stores"
 war_adventurer_tyrion.3.option_b:0 "Restore the road's offices and its cleared culvert"
 war_adventurer_tyrion.3.option_c:0 "Return unclaimed civilian cargo to local suppliers"
 war_adventurer_tyrion.3.t:0 "One Rider at the Culvert"
 war_adventurer_tyrion.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf prince and warrior Tyrion. Our patrol reports that Tyrion and Malhandir broke a ratman force emerging beneath a supply road. Survivors compare the charge to Kritsqueel's defeat, and abandoned stores now block the culvert. The patrol has separated captured rations from civilian cargo and marked the point where the culvert joins the road's foundations.\n\nOur officials ask whether we should equip the provincial road guard from the recovered stores. Another proposal is to restore the road's offices and its cleared culvert. Tyrion has mounted Malhandir and continued his journey without requesting an office or reward."
 war_adventurer_tyrion.4.option_a:0 "Establish an inspected provincial tournament registry"
 war_adventurer_tyrion.4.option_b:0 "Train local guards to check competitors' weapons"
 war_adventurer_tyrion.4.option_c:0 "Enter the attendants' testimony in the public record"
 war_adventurer_tyrion.4.t:0 "The Poisoned Champion's Purse"
 war_adventurer_tyrion.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf prince and warrior Tyrion. Our herald reports that Tyrion exposed a would-be champion's poisoned blade before a ceremonial bout. He left testimony comparing the deception with Urian's methods and asked that the injured attendants be remembered. The attendants preserved the poisoned weapon before its owner could discard it, allowing the accusation to be tested openly.\n\nOur officials ask whether we should establish an inspected provincial tournament registry. Another proposal is to train local guards to check competitors' weapons. The Elf has left his testimony with the witnesses rather than await the governor's summons."
 war_adventurer_tyrion.5.option_a:0 "Restore the shrine's neglected provincial records"
 war_adventurer_tyrion.5.option_b:0 "Catalogue the ancestral token and its register"
 war_adventurer_tyrion.5.option_c:0 "Endow a cathedral for the recovered token"
 war_adventurer_tyrion.5.t:0 "The Heirloom at the Phoenix Gate"
 war_adventurer_tyrion.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf prince and warrior Tyrion. Our keeper reports that Tyrion recovered an ancestral token from thieves operating near a sanctuary.\n\nHis refusal to let them bargain with a relic associated with Aenarion has renewed interest in the shrine's neglected records. The recovered token matches an entry in a neglected shrine register whose remaining pages now require careful preservation.\n\nOur officials ask whether we should restore the shrine's neglected provincial records. Another proposal is to catalogue the ancestral token and its register. Tyrion's hosts cannot promise that a rider of his ability will remain within their patrol lines."
 war_adventurer_tyrion.6.option_a:0 "Compare the custodians' warding accounts"
 war_adventurer_tyrion.6.option_b:0 "Restore the displaced custodians' sanctuary precinct"
 war_adventurer_tyrion.6.option_c:0 "Endow a cathedral around the cleansed sanctuary"
 war_adventurer_tyrion.6.t:0 "The Stranger at the Defiled Shrine"
 war_adventurer_tyrion.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf prince and warrior Tyrion. Our governor reports that Tyrion expelled a summoned creature from a local sanctuary, despite understanding little of its rites. Its custodians compare his description of the Phoenix Shrine with their own account of the breach. The custodians have written down both their own warning signs and the Elf's account of the disturbance for a joint examination.\n\nOur officials ask whether we should compare the custodians' warding accounts. Another proposal is to restore the displaced custodians' sanctuary precinct. The champion has declined a prolonged stay while officials settle the disputes left behind."
 war_adventurer_tyrion.7.option_a:0 "Teach the translated feint to provincial recruits"
 war_adventurer_tyrion.7.option_b:0 "Have army officers practise the annotated manoeuvre"
 war_adventurer_tyrion.7.option_c:0 "Establish training fields for the translated sword exercises"
 war_adventurer_tyrion.7.t:0 "The Duel Beyond the Interpreter"
 war_adventurer_tyrion.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf prince and warrior Tyrion. Our commander reports that Tyrion defeated a marauder champion after negotiations failed through an interpreter. He left a sketch of the feint he used, annotated with a reference to Finuval Plain. The interpreter has translated the sketch's short annotations, making its practical lesson available to officers unfamiliar with Elven swordcraft.\n\nOur officials ask whether we should teach the translated feint to provincial recruits. Another proposal is to have army officers practise the annotated manoeuvre. The last report places Tyrion on the road, already beyond the escort sent to find him."
 war_adventurer_tyrion.8.option_a:0 "Secure the caravan route under provincial customs"
 war_adventurer_tyrion.8.option_b:0 "Return recovered merchandise to local suppliers"
 war_adventurer_tyrion.8.option_c:0 "Train provincial escorts from the survivors' account"
 war_adventurer_tyrion.8.t:0 "Malhandir on the Caravan Road"
 war_adventurer_tyrion.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf prince and warrior Tyrion. Our caravan master reports that Tyrion and his horse scattered a tunnelling ambush before the guards could form. The rescued merchants have surrendered captured intelligence to our customs office. The recovered papers identify the concealed approach to the road as well as the merchants the ambushers expected to capture.\n\nOur officials ask whether we should secure the caravan route under provincial customs. Another proposal is to return recovered merchandise to local suppliers. Tyrion has mounted Malhandir and continued his journey without requesting an office or reward."
 war_adventurer_tyrion.9.option_a:0 "Enlist willing released soldiers in the provincial guard"
 war_adventurer_tyrion.9.option_b:0 "Settle the rescued civilian households"
 war_adventurer_tyrion.9.option_c:0 "Establish training fields for the former prisoners' instruction"
 war_adventurer_tyrion.9.t:0 "A Prison Opened by One Rider"
 war_adventurer_tyrion.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf prince and warrior Tyrion. Our border officer reports that Tyrion broke a raiders' prison and escorted captives to the frontier.\n\nThe released soldiers have requested permission to teach our recruits the disciplined counterattack they witnessed. The released soldiers have assembled willing volunteers outside the border post while civilian families petition for shelter nearby.\n\nOur officials ask whether we should enlist willing released soldiers in the provincial guard. Another proposal is to settle the rescued civilian households. The Elf has left his testimony with the witnesses rather than await the governor's summons."
 war_adventurer_tyrion.10.option_a:0 "Teach the corrected curriculum to provincial recruits"
 war_adventurer_tyrion.10.option_b:0 "Circulate the translated training notes to army officers"
 war_adventurer_tyrion.10.option_c:0 "Establish training fields for the reformed sword school"
 war_adventurer_tyrion.10.t:0 "The Foreign Swordmaster's Testimony"
 war_adventurer_tyrion.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf prince and warrior Tyrion. Our governor receives a foreign instructor's account of losing a friendly bout to Tyrion. The visitor identified a dangerous flaw in the local school and explained his duel with Urian as a warning against theatrical swordplay. The instructor's signed testimony admits the flaw plainly, preventing his assistants from dismissing the defeat as a mere contest of strength.\n\nOur officials ask whether we should teach the corrected curriculum to provincial recruits. Another proposal is to circulate the translated training notes to army officers. Tyrion's hosts cannot promise that a rider of his ability will remain within their patrol lines."
 war_adventurer_tyrion.11.option_a:0 "Install conventional guards around the sanctuary"
 war_adventurer_tyrion.11.option_b:0 "Give local custodians authority over the damaged shrine"
 war_adventurer_tyrion.11.option_c:0 "Seal and abandon the shattered ritual chamber"
 war_adventurer_tyrion.11.t:0 "The Occupier's Empty Shrine"
 war_adventurer_tyrion.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf prince and warrior Tyrion. Our governor reports that Tyrion destroyed a summoning apparatus installed in a seized sanctuary. The bound creature is gone, the attendants escaped, and the provincial guard refuses to approach the damaged chamber. The frightened attendants have left the broken controlling apparatus where it fell, refusing to enter the chamber to retrieve official records.\n\nOur officials ask whether we should install conventional guards around the sanctuary. Another proposal is to give local custodians authority over the damaged shrine. The champion has declined a prolonged stay while officials settle the disputes left behind."
 war_adventurer_tyrion.12.option_a:0 "Replace the defeated escort's equipment"
 war_adventurer_tyrion.12.option_b:0 "Let provincial captains reorganize their own commands"
 war_adventurer_tyrion.12.option_c:0 "Accept the public comparisons with the defeated champion"
 war_adventurer_tyrion.12.t:0 "The Champion Before the Gate"
 war_adventurer_tyrion.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf prince and warrior Tyrion. Our marshal reports that Tyrion defeated the officer guarding a confiscated estate and returned its heirlooms to their claimants. Witnesses have begun comparing our officer unfavourably with Urian Poisonblade. The restored heirlooms have been displayed before witnesses, leaving the governor unable to deny either their confiscation or the guard's defeat.\n\nOur officials ask whether we should replace the defeated escort's equipment. Another proposal is to let provincial captains reorganize their own commands. The last report places Tyrion on the road, already beyond the escort sent to find him."
 war_adventurer_tyrion.13.option_a:0 "Purchase replacement supplies"
 war_adventurer_tyrion.13.option_b:0 "Give provincial quartermasters independent control of their routes"
 war_adventurer_tyrion.13.option_c:0 "Requisition replacement stores from the surrounding households"
 war_adventurer_tyrion.13.t:0 "The Column that Met Malhandir"
 war_adventurer_tyrion.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf prince and warrior Tyrion. Our quartermaster reports that Tyrion and Malhandir scattered an isolated supply column before nearby troops could intervene.\n\nIts surviving guards insist that no supporting army ever appeared. The surviving quartermasters have submitted separate accounts that agree on the loss even when they disagree about the rider's route.\n\nOur officials ask whether we should purchase replacement supplies. Another proposal is to give provincial quartermasters independent control of their routes. Tyrion has mounted Malhandir and continued his journey without requesting an office or reward."
 war_adventurer_tyrion.14.option_a:0 "Compensate the guards defeated at the sanctuary"
 war_adventurer_tyrion.14.option_b:0 "Return sanctuary security to its local custodians"
 war_adventurer_tyrion.14.option_c:0 "Deny the relic's importance despite the witnesses"
 war_adventurer_tyrion.14.t:0 "The Ancestor's Confiscated Relic"
 war_adventurer_tyrion.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf prince and warrior Tyrion. Our keeper reports that Tyrion recovered a seized ancestral relic and released the attendants held with it. He left a warning invoking the defence of Aenarion's line, then rode through the closing gates. The released attendants carried the confiscation order away with the relic, giving its former custodians evidence of the government's involvement.\n\nOur officials ask whether we should compensate the guards defeated at the sanctuary. Another proposal is to return sanctuary security to its local custodians. The Elf has left his testimony with the witnesses rather than await the governor's summons."
 war_adventurer_tyrion.15.option_a:0 "Hire and equip replacement instructors"
 war_adventurer_tyrion.15.option_b:0 "Let the provincial schools regulate their own instruction"
 war_adventurer_tyrion.15.option_c:0 "Close the deserted sword school's training fields"
 war_adventurer_tyrion.15.t:0 "The School with No Master"
 war_adventurer_tyrion.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf prince and warrior Tyrion. Our military tutor reports that Tyrion defeated the champion enforcing compulsory instruction at an occupied sword school. The pupils dispersed with the school's records and have begun training opposition volunteers. The school's empty racks and missing attendance books reveal how thoroughly its pupils prepared before the defeated champion could recover.\n\nOur officials ask whether we should hire and equip replacement instructors. Another proposal is to let the provincial schools regulate their own instruction. Tyrion's hosts cannot promise that a rider of his ability will remain within their patrol lines."
 war_adventurer_tyrion.16.option_a:0 "Purchase conventional forces to replace the bound daemon"
 war_adventurer_tyrion.16.option_b:0 "Let local commanders control future containment work"
 war_adventurer_tyrion.16.option_c:0 "Abandon the damaged convoy staging ground"
 war_adventurer_tyrion.16.t:0 "The Broken Summoning Escort"
 war_adventurer_tyrion.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the renowned High Elf prince and warrior Tyrion. Our commander reports that Tyrion attacked a convoy carrying a bound daemon and destroyed its controlling vessel. The escort fled while captive labourers escaped along the road. The controlling vessel's broken pieces have been recovered from the road, but its handlers refuse to promise that another binding would hold.\n\nOur officials ask whether we should purchase conventional forces to replace the bound daemon. Another proposal is to let local commanders control future containment work. The champion has declined a prolonged stay while officials settle the disputes left behind."
 war_adventurer_tyrion.17.option_a:0 "Compensate the prisoners used as tournament stakes"
 war_adventurer_tyrion.17.option_b:0 "Let local courts supervise future martial displays"
 war_adventurer_tyrion.17.option_c:0 "Uphold the governor's account against the witnesses"
 war_adventurer_tyrion.17.t:0 "The Governor's Champion Unhorsed"
 war_adventurer_tyrion.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the renowned High Elf prince and warrior Tyrion. Our governor reports that Tyrion publicly defeated his champion after discovering prisoners held as tournament stakes.\n\nHe released them and left before the reserve guard assembled. The freed prisoners have repeated the tournament's terms to the crowd, stripping the governor's explanation of any appearance of generosity.\n\nOur officials ask whether we should compensate the prisoners used as tournament stakes. Another proposal is to let local courts supervise future martial displays. The last report places Tyrion on the road, already beyond the escort sent to find him."
 war_adventurer_tyrion.18.option_a:0 "Replace the broken tunnel mechanism"
 war_adventurer_tyrion.18.option_b:0 "Give the tunnel district's captains independent command"
 war_adventurer_tyrion.18.option_c:0 "Abandon the entrance and trapped equipment"
 war_adventurer_tyrion.18.t:0 "The Tunnel Mouth's Lone Rider"
 war_adventurer_tyrion.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the renowned High Elf prince and warrior Tyrion. Our engineer reports that Tyrion and Malhandir broke a sortie from a concealed military tunnel. Work crews fled, leaving the access mechanism destroyed and the stored provisions in enemy hands. The access mechanism lies broken beneath the tunnel mouth, trapping equipment the engineer still hopes to recover.\n\nOur officials ask whether we should replace the broken tunnel mechanism. Another proposal is to give the tunnel district's captains independent command. Tyrion has mounted Malhandir and continued his journey without requesting an office or reward."
 war_adventurer_tyrion.19.option_a:0 "Repair and secure the excavation"
 war_adventurer_tyrion.19.option_b:0 "Recognize the local custodians' authority over the relic"
 war_adventurer_tyrion.19.option_c:0 "Seal the damaged excavation without restoration"
 war_adventurer_tyrion.19.t:0 "A Shrine Beyond His Homeland"
 war_adventurer_tyrion.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the renowned High Elf prince and warrior Tyrion. Our overseer reports that Tyrion removed a captive temple custodian from a guarded excavation and wrecked the apparatus restraining a dangerous relic. His warning concerns the relic's use, regardless of the temple's faith. The rescued custodian left a copy of the warning with local witnesses, making the dangerous excavation a matter of public concern.\n\nOur officials ask whether we should repair and secure the excavation. Another proposal is to recognize the local custodians' authority over the relic. The Elf has left his testimony with the witnesses rather than await the governor's summons."
 war_adventurer_tyrion.20.option_a:0 "Replace the arrest party's damaged equipment"
 war_adventurer_tyrion.20.option_b:0 "Let provincial officers devise their own training standards"
 war_adventurer_tyrion.20.option_c:0 "Forbid the story despite its circulation through the barracks"
 war_adventurer_tyrion.20.t:0 "The Lesson Our Officers Received"
 war_adventurer_tyrion.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the renowned High Elf prince and warrior Tyrion. Our commander reports that Tyrion defeated an officer sent to arrest him and explained the officer's mistakes to the watching soldiers. His account of Finuval Plain has become an embarrassing favourite in the barracks. Several soldiers have written the corrections on their practice boards, preserving the very lesson their embarrassed officers would prefer forgotten.\n\nOur officials ask whether we should replace the arrest party's damaged equipment. Another proposal is to let provincial officers devise their own training standards. Tyrion's hosts cannot promise that a rider of his ability will remain within their patrol lines."
 war_adventurer_tyrion.21.t:0 "Tyrion has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_tyrion.21.d:0 "Travelers have brought us word that the renowned High Elf prince and warrior Tyrion has arrived in [war_adventurer_arrival_province.GetName]. Their descriptions of his bearing and extraordinary horsemanship agree with accounts of the High Elf champion.\n\nA descendant of Aenarion, Tyrion is celebrated as one of Ulthuan's greatest warriors. His defeat of Urian Poisonblade at Finuval Plain is recounted wherever the struggle between the High Elves and Dark Elves is remembered."
 war_adventurer_gor_rok:0 "Gor-Rok, Adventurer"
 desc_war_adventurer_gor_rok:0 "The Great White Lizard stands watch near ancient stones in this province, his immense shield scarred by blows that would have felled lesser warriors. Reports of Gor-Rok's unyielding defense have set soldiers inspecting their own shield walls and barricades. He offers no explanation to officials, and anyone approaching the relics he guards does so with considerable caution."
 war_adventurer_gor_rok.1.option_a:0 "Catalogue the recovered inscriptions"
 war_adventurer_gor_rok.1.option_b:0 "Train provincial guards for the restored shrine approach"
 war_adventurer_gor_rok.1.option_c:0 "Endow a cathedral around the recovered sacred stone"
 war_adventurer_gor_rok.1.t:0 "The Stela Returned with a Spear"
 war_adventurer_gor_rok.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the mighty albino Saurus warrior Gor-Rok. Our temple liaison reports that Gor-Rok recovered a stolen inscribed stone from raiders and waited until it was secured before allowing a spear to be drawn from his side.\n\nThe custodians compare the incident with the Star Stela of Quetli's recovery under Tepec-Inzi. The attendants have laid the removed spear beside the recovered stone, recording that the guardian refused treatment until the relic was safe.\n\nOur officials ask whether we should catalogue the recovered inscriptions. Another proposal is to train provincial guards for the restored shrine approach. The patrol sent to observe him has returned after losing his trail beyond its accustomed routes."
 war_adventurer_gor_rok.2.option_a:0 "Return the captured tools to provincial workshops"
 war_adventurer_gor_rok.2.option_b:0 "Compare the recovered fragments with the damaged inscriptions"
 war_adventurer_gor_rok.2.option_c:0 "Train local causeway guards from the witnesses' account"
 war_adventurer_gor_rok.2.t:0 "The Chariot in the Causeway"
 war_adventurer_gor_rok.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the mighty albino Saurus warrior Gor-Rok. Our road warden reports that Gor-Rok smashed a raider commander's chariot while blocking a temple causeway. The defeated band's abandoned cargo includes stolen tools and fragments of sacred inscriptions. The recovered fragments fit several damaged inscriptions already held by the custodians, allowing part of the site's history to be reconstructed.\n\nOur officials ask whether we should return the captured tools to provincial workshops. Another proposal is to compare the recovered fragments with the damaged inscriptions. The white Saurus has left the officials behind and resumed his silent march."
 war_adventurer_gor_rok.3.option_a:0 "Examine the carcasses under supervision"
 war_adventurer_gor_rok.3.option_b:0 "Equip provincial scouts with the raiders' recovered gear"
 war_adventurer_gor_rok.3.option_c:0 "Return the raiders' captured stores to local households"
 war_adventurer_gor_rok.3.t:0 "The Rider and the Wings"
 war_adventurer_gor_rok.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the mighty albino Saurus warrior Gor-Rok. Our scouts report that Gor-Rok killed a raider chief and its flying mount beside a settlement's pools. Attendants invoke Bloodpools while petitioning for the dangerous remains to be removed. The scouts have cordoned off both carcasses and set aside the raiders' intact equipment for official inspection.\n\nOur officials ask whether we should examine the carcasses under supervision. Another proposal is to equip provincial scouts with the raiders' recovered gear. No interpreter has persuaded Gor-Rok to remain while the court considers the report."
 war_adventurer_gor_rok.4.option_a:0 "Teach the defensive formation to provincial recruits"
 war_adventurer_gor_rok.4.option_b:0 "Restore the settlement's battered approach and homes"
 war_adventurer_gor_rok.4.option_c:0 "Establish training fields for holding narrow approaches"
 war_adventurer_gor_rok.4.t:0 "The Line That Did Not Move"
 war_adventurer_gor_rok.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the mighty albino Saurus warrior Gor-Rok. Our commander reports that Gor-Rok held a narrow approach against repeated charges by hired Ogre raiders. His stand allowed the settlement's defenders to regroup, and their officers have returned with a precise account of the formation. The defenders have marked where each rank stood during the charges, providing a usable account of the position rather than another heroic legend.\n\nOur officials ask whether we should teach the defensive formation to provincial recruits. Another proposal is to restore the settlement's battered approach and homes. The last scouts saw the guardian moving away from the recovered site with no sign of accepting an escort."
 war_adventurer_gor_rok.5.option_a:0 "Record the markings around the sealed breach"
 war_adventurer_gor_rok.5.option_b:0 "Train the provincial temple wardens"
 war_adventurer_gor_rok.5.option_c:0 "Rebuild the protected shrine as a cathedral"
 war_adventurer_gor_rok.5.t:0 "The Blow Against the White Shield"
 war_adventurer_gor_rok.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the mighty albino Saurus warrior Gor-Rok. Our temple watch reports that Gor-Rok survived a summoned horror's blow long enough for attendants to close the breach behind it.\n\nThe site is secure, but his cracked shield marks have become the subject of competing interpretations. The attendants have copied the marks around the sealed breach before repairing the stones disturbed during the fight.\n\nOur officials ask whether we should record the markings around the sealed breach. Another proposal is to train the provincial temple wardens. Gor-Rok appears to consider his task complete, whatever remains for our administration to settle."
 war_adventurer_gor_rok.6.option_a:0 "Establish a provincial waystation on the mapped winter route"
 war_adventurer_gor_rok.6.option_b:0 "Train local winter patrols from the survivors' notes"
 war_adventurer_gor_rok.6.option_c:0 "Supply provincial craftsmen with the recovered raider stores"
 war_adventurer_gor_rok.6.t:0 "The Snow on the White Saurus"
 war_adventurer_gor_rok.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the mighty albino Saurus warrior Gor-Rok. Our frontier governor reports that Gor-Rok crossed freezing ground to destroy raiders threatening an ancient ruin. His tracks and the survivors' route notes offer a rare account of travel in conditions reminiscent of his Chaos Wastes campaigns. The survivors' notes identify sheltered approaches and a supply route that ordinary frontier patrols had considered impassable in winter.\n\nOur officials ask whether we should establish a provincial waystation on the mapped winter route. Another proposal is to train local winter patrols from the survivors' notes. The patrol sent to observe him has returned after losing his trail beyond its accustomed routes."
 war_adventurer_gor_rok.7.option_a:0 "Examine the recovered slab and its missing sections"
 war_adventurer_gor_rok.7.option_b:0 "Restore the damaged yard and return the claimants' property"
 war_adventurer_gor_rok.7.option_c:0 "Return the smugglers' stolen tools to provincial craftsmen"
 war_adventurer_gor_rok.7.t:0 "The Auction's Broken Chariot"
 war_adventurer_gor_rok.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the mighty albino Saurus warrior Gor-Rok. Our magistrate reports that Gor-Rok intercepted a smuggler's chariot carrying a stolen inscribed slab. He held the yard despite an embedded weapon until the frightened custodians recovered the slab, then left them with our officials. The magistrate has placed the recovered slab under guard while the custodians identify its missing sections among the smuggler's cargo.\n\nOur officials ask whether we should examine the recovered slab and its missing sections. Another proposal is to restore the damaged yard and return the claimants' property. The white Saurus has left the officials behind and resumed his silent march."
 war_adventurer_gor_rok.8.option_a:0 "Equip a provincial quarry watch"
 war_adventurer_gor_rok.8.option_b:0 "Distribute spare harness and tools to local workshops"
 war_adventurer_gor_rok.8.option_c:0 "Catalogue the flying beast's remains"
 war_adventurer_gor_rok.8.t:0 "The Wyvern Above the Quarry"
 war_adventurer_gor_rok.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the mighty albino Saurus warrior Gor-Rok. Our overseer reports that Gor-Rok killed both a flying beast and its marauding rider before they reached a workers' camp. The workers have offered the recovered equipment to our government in gratitude. The workers have separated sound weapons and harness from the wreckage, offering supplies for a watch that might prevent another attack.\n\nOur officials ask whether we should equip a provincial quarry watch. Another proposal is to distribute spare harness and tools to local workshops. No interpreter has persuaded Gor-Rok to remain while the court considers the report."
 war_adventurer_gor_rok.9.option_a:0 "Examine the exposed ancient foundation"
 war_adventurer_gor_rok.9.option_b:0 "Rebuild the public refuge beside the preserved masonry"
 war_adventurer_gor_rok.9.option_c:0 "Enlist willing workers in the provincial watch"
 war_adventurer_gor_rok.9.t:0 "The Ruin Beneath the New Street"
 war_adventurer_gor_rok.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the mighty albino Saurus warrior Gor-Rok. Our surveyor reports that Gor-Rok stood against a hired raiding band's heavy charge at an exposed ancient foundation.\n\nHe protected the excavation without acknowledging either the officials or the workers now petitioning for its preservation. The surveyors' plan shows how the exposed masonry could be preserved without leaving the settlement's new street permanently blocked.\n\nOur officials ask whether we should examine the exposed ancient foundation. Another proposal is to rebuild the public refuge beside the preserved masonry. The last scouts saw the guardian moving away from the recovered site with no sign of accepting an escort."
 war_adventurer_gor_rok.10.option_a:0 "Train the provincial gate defenders"
 war_adventurer_gor_rok.10.option_b:0 "Restore the gate district with recovered supplies"
 war_adventurer_gor_rok.10.option_c:0 "Examine the sealed breach's remains"
 war_adventurer_gor_rok.10.t:0 "The Horror in the Foreign Gate"
 war_adventurer_gor_rok.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the mighty albino Saurus warrior Gor-Rok. Our garrison reports that Gor-Rok absorbed the first assault of a summoned creature at an isolated gate while civilians escaped. Local defenders then closed the breach, but cannot explain why he chose their settlement. The garrison has counted the civilians brought through the gate and recorded the defenders who held long enough to seal it.\n\nOur officials ask whether we should train the provincial gate defenders. Another proposal is to restore the gate district with recovered supplies. Gor-Rok appears to consider his task complete, whatever remains for our administration to settle."
 war_adventurer_gor_rok.11.option_a:0 "Replace the relic convoy and its guards"
 war_adventurer_gor_rok.11.option_b:0 "Let local custodians regulate relic transport"
 war_adventurer_gor_rok.11.option_c:0 "Abandon the wrecked convoy depot"
 war_adventurer_gor_rok.11.t:0 "The Stela's Empty Wagon"
 war_adventurer_gor_rok.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the mighty albino Saurus warrior Gor-Rok. Our occupation officer reports that Gor-Rok destroyed a relic convoy's command chariot and recovered its stone cargo. Even a spear through his body failed to stop him before the surviving temple attendants escaped. The surviving escorts describe the same impaling wound, removing their excuse that the guardian escaped merely because nobody struck him.\n\nOur officials ask whether we should replace the relic convoy and its guards. Another proposal is to let local custodians regulate relic transport. The patrol sent to observe him has returned after losing his trail beyond its accustomed routes."
 war_adventurer_gor_rok.12.option_a:0 "Purchase troops to replace the Wyvern and its rider"
 war_adventurer_gor_rok.12.option_b:0 "Give provincial commanders control of their own beast detachments"
 war_adventurer_gor_rok.12.option_c:0 "Leave the ruined beast compound abandoned"
 war_adventurer_gor_rok.12.t:0 "The Wyvern Pen's Two Corpses"
 war_adventurer_gor_rok.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the mighty albino Saurus warrior Gor-Rok. Our beast-master reports that Gor-Rok killed a military Wyvern and the champion riding it during a demonstration. The ruined pen has drawn crowds of hostile local witnesses. The beast-master's purchase rolls and the champion's discarded harness leave no doubt about the value of the destroyed military asset.\n\nOur officials ask whether we should purchase troops to replace the Wyvern and its rider. Another proposal is to give provincial commanders control of their own beast detachments. The white Saurus has left the officials behind and resumed his silent march."
 war_adventurer_gor_rok.13.option_a:0 "Pay for the hired troops' treatment and equipment"
 war_adventurer_gor_rok.13.option_b:0 "Allow local captains to direct future operations at the causeway"
 war_adventurer_gor_rok.13.option_c:0 "Deny the defeat despite the witnesses"
 war_adventurer_gor_rok.13.t:0 "The Charge Against the Causeway"
 war_adventurer_gor_rok.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the mighty albino Saurus warrior Gor-Rok. Our commander reports that hired heavy troops broke themselves against Gor-Rok at a temple approach.\n\nHe withdrew with the custodians after the failed charge left our formation in disorder. The hired troops demand treatment and replacement equipment before they will attempt another advance along the same approach.\n\nOur officials ask whether we should pay for the hired troops' treatment and equipment. Another proposal is to allow local captains to direct future operations at the causeway. No interpreter has persuaded Gor-Rok to remain while the court considers the report."
 war_adventurer_gor_rok.14.option_a:0 "Replace the shattered ritual apparatus"
 war_adventurer_gor_rok.14.option_b:0 "Return control of the shrine to local custodians"
 war_adventurer_gor_rok.14.option_c:0 "Close the ruined shrine and leave the surrounding works unrepaired"
 war_adventurer_gor_rok.14.t:0 "The Greater Horror's Failed Blow"
 war_adventurer_gor_rok.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the mighty albino Saurus warrior Gor-Rok. Our ritual officer reports that the summoned creature guarding a confiscated shrine failed to dislodge Gor-Rok. The struggle wrecked its apparatus and allowed captives to escape into the surrounding district. The broken apparatus lies among abandoned restraints, exposing the connection between the confiscated shrine and its captive labourers.\n\nOur officials ask whether we should replace the shattered ritual apparatus. Another proposal is to return control of the shrine to local custodians. The last scouts saw the guardian moving away from the recovered site with no sign of accepting an escort."
 war_adventurer_gor_rok.15.option_a:0 "Replace the broken display and escort"
 war_adventurer_gor_rok.15.option_b:0 "Let local custodians investigate the trophies' ownership"
 war_adventurer_gor_rok.15.option_c:0 "Accept the public humiliation"
 war_adventurer_gor_rok.15.t:0 "The Commander's Crushed Trophy"
 war_adventurer_gor_rok.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the mighty albino Saurus warrior Gor-Rok. Our governor reports that Gor-Rok smashed the vehicle displaying stolen temple trophies, defeated its commander, and carried away the inscribed pieces. The remaining guards refuse to pursue him into the jungle. The surviving escort brought back only splintered display boards, while the inscribed trophies disappeared with their formidable rescuer.\n\nOur officials ask whether we should replace the broken display and escort. Another proposal is to let local custodians investigate the trophies' ownership. Gor-Rok appears to consider his task complete, whatever remains for our administration to settle."
 war_adventurer_gor_rok.16.option_a:0 "Purchase replacement winter stores"
 war_adventurer_gor_rok.16.option_b:0 "Give frontier communities control of their own patrol routes"
 war_adventurer_gor_rok.16.option_c:0 "Abandon the wrecked supply camp"
 war_adventurer_gor_rok.16.t:0 "The Camp Beyond the Snowline"
 war_adventurer_gor_rok.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the mighty albino Saurus warrior Gor-Rok. Our frontier commander reports that Gor-Rok broke a supply camp thought safe behind severe winter terrain. He left its engines wrecked and disappeared toward ancient ruins outside the patrol routes. The frontier officers have marked the broken camp on their winter charts, admitting that the route can no longer be treated as secure.\n\nOur officials ask whether we should purchase replacement winter stores. Another proposal is to give frontier communities control of their own patrol routes. The patrol sent to observe him has returned after losing his trail beyond its accustomed routes."
 war_adventurer_gor_rok.17.option_a:0 "Replace the lifting equipment"
 war_adventurer_gor_rok.17.option_b:0 "Let the quarry workers decide how future excavation proceeds"
 war_adventurer_gor_rok.17.option_c:0 "Leave the damaged quarry closed"
 war_adventurer_gor_rok.17.t:0 "The Stone the Quarry Would Not Yield"
 war_adventurer_gor_rok.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the mighty albino Saurus warrior Gor-Rok. Our quarry overseer reports that Gor-Rok destroyed the lifting equipment around an inscribed foundation.\n\nHeavy guards failed to shift him until labourers fled with several recovered tablets. The remaining quarry crews refuse to approach the broken lifting frame until officials explain whether the excavation will continue.\n\nOur officials ask whether we should replace the lifting equipment. Another proposal is to let the quarry workers decide how future excavation proceeds. The white Saurus has left the officials behind and resumed his silent march."
 war_adventurer_gor_rok.18.option_a:0 "Hire replacement guards for the labour district"
 war_adventurer_gor_rok.18.option_b:0 "Give local workers control of the district's labour records"
 war_adventurer_gor_rok.18.option_c:0 "Abandon the damaged holding yard"
 war_adventurer_gor_rok.18.t:0 "The Foreign Champion's Fallen Mount"
 war_adventurer_gor_rok.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the mighty albino Saurus warrior Gor-Rok. Our governor reports that Gor-Rok slew the winged beast used to intimidate a labour district and then killed its rider. The workers have scattered with the district's tools and records. The workers' missing records include both equipment inventories and the orders authorizing the beast's use against their district.\n\nOur officials ask whether we should hire replacement guards for the labour district. Another proposal is to give local workers control of the district's labour records. No interpreter has persuaded Gor-Rok to remain while the court considers the report."
 war_adventurer_gor_rok.19.option_a:0 "Pay for the soldiers' treatment and replacement shields"
 war_adventurer_gor_rok.19.option_b:0 "Let provincial officers set their own tactical training"
 war_adventurer_gor_rok.19.option_c:0 "Accept the public failure of the spectacle"
 war_adventurer_gor_rok.19.t:0 "The Demonstration of Heavy Troops"
 war_adventurer_gor_rok.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the mighty albino Saurus warrior Gor-Rok. Our marshal reports that a public charge intended to capture Gor-Rok ended with the attackers thrown back. Witnesses saw him hold his ground until a group of detained excavators escaped behind him. The marshal has collected the damaged shields, but the crowd remembers the unmoved Saurus more vividly than the soldiers' injuries.\n\nOur officials ask whether we should pay for the soldiers' treatment and replacement shields. Another proposal is to let provincial officers set their own tactical training. The last scouts saw the guardian moving away from the recovered site with no sign of accepting an escort."
 war_adventurer_gor_rok.20.option_a:0 "Repair the vault and replace its guards"
 war_adventurer_gor_rok.20.option_b:0 "Give local custodians control of the surviving collection"
 war_adventurer_gor_rok.20.option_c:0 "Seal the collapsed galleries without repairs"
 war_adventurer_gor_rok.20.t:0 "The Relic Behind the Daemon"
 war_adventurer_gor_rok.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the mighty albino Saurus warrior Gor-Rok. Our keeper reports that Gor-Rok endured the bound guardian's blows, broke its controlling frame, and carried a confiscated relic out of the vault. The remaining exhibits lie beneath collapsed masonry. The vault keeper can identify the missing relic, although collapsed masonry still prevents a full count of the other losses.\n\nOur officials ask whether we should repair the vault and replace its guards. Another proposal is to give local custodians control of the surviving collection. Gor-Rok appears to consider his task complete, whatever remains for our administration to settle."
 war_adventurer_gor_rok.21.t:0 "Gor-Rok has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_gor_rok.21.d:0 "Witnesses in [war_adventurer_arrival_province.GetName] report the arrival of the mighty albino Saurus warrior Gor-Rok. The newcomer carries a battered shield and has been identified as the Great White Lizard of Itza.\n\nGor-Rok is an ancient warrior renowned for standing his ground against overwhelming attacks. His campaigns have made him a formidable guardian of the Lizardmen's cities and sacred relics, though his present purpose remains unexplained."
 war_adventurer_nakai:0 "Nakai the Wanderer, Adventurer"
 desc_war_adventurer_nakai:0 "Enormous tracks lead toward old ruins, where witnesses report a Kroxigor looming over stones half buried by the years. Skink travelers name him Nakai, the wanderer said to have held Itza's Bridge of Stars against the daemonic host. His unexplained arrival has prompted hurried repairs to gates and barricades, while carts and crowds detour around his chosen path."
 war_adventurer_nakai.1.option_a:0 "Rebuild the crossing and its provincial waystation"
 war_adventurer_nakai.1.option_b:0 "Train local crossing guards from the battle account"
 war_adventurer_nakai.1.option_c:0 "Restore provincial workshops along the reopened supply route"
 war_adventurer_nakai.1.t:0 "The Crossing Before the Alarm"
 war_adventurer_nakai.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the towering reptilian guardian Nakai the Wanderer. Our river warden reports that Nakai held a crossing against a daemonic incursion before the alarm reached the nearest temple.\n\nAttendants compare the piled remains with stories of the Bridge of Stars, while the surviving defenders await instructions. The defenders have stacked the recovered equipment beside the damaged crossing and marked the span that must be rebuilt before wagons return.\n\nOur officials ask whether we should rebuild the crossing and its provincial waystation. Another proposal is to train local crossing guards from the battle account. Nakai has resumed his wandering, leaving no explanation of his next destination."
 war_adventurer_nakai.2.option_a:0 "Restore the custodians' damaged storehouse precincts"
 war_adventurer_nakai.2.option_b:0 "Provision the provincial temple watch"
 war_adventurer_nakai.2.option_c:0 "Endow a cathedral beside the rescued temple stores"
 war_adventurer_nakai.2.t:0 "The Temple that Sent No Messenger"
 war_adventurer_nakai.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the towering reptilian guardian Nakai the Wanderer. Our liaison reports that Nakai arrived at a threatened temple before its trapped custodians could send for help. He broke the attackers and vanished, leaving the custodians disputing which endangered storehouse should receive the recovered supplies. The custodians have submitted separate inventories of the recovered supplies, revealing how little remained in several of the threatened storehouses.\n\nOur officials ask whether we should restore the custodians' damaged storehouse precincts. Another proposal is to provision the provincial temple watch. The giant's tracks lead away from the site, and no official has persuaded him to stay."
 war_adventurer_nakai.3.option_a:0 "Register the bypass as a protected provincial route"
 war_adventurer_nakai.3.option_b:0 "Train local procession guards from the survivors' account"
 war_adventurer_nakai.3.option_c:0 "Establish training fields for provincial escort patrols"
 war_adventurer_nakai.3.t:0 "The Procession Returned at Dawn"
 war_adventurer_nakai.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the towering reptilian guardian Nakai the Wanderer. Our patrol reports that a missing group of temple attendants returned behind Nakai with their relics intact. He led them around a concealed ambush, then walked away without accepting their offered escort. The rescued attendants have sketched the bypass they followed, giving the patrols a route that avoids the concealed ambush position.\n\nOur officials ask whether we should register the bypass as a protected provincial route. Another proposal is to train local procession guards from the survivors' account. The custodians found that their unexpected guardian had departed before they could prepare an escort."
 war_adventurer_nakai.4.option_a:0 "Repair and reopen the broken crossing"
 war_adventurer_nakai.4.option_b:0 "Train local guards to hold the bridge approach"
 war_adventurer_nakai.4.option_c:0 "Record the scouts' observations of the summoned creatures"
 war_adventurer_nakai.4.t:0 "The Bridge Nobody Would Approach"
 war_adventurer_nakai.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the towering reptilian guardian Nakai the Wanderer. Our scouts report that hostile summoned creatures recoiled from a crossing after Nakai's defence of it. The effect recalls the Bridge of Stars' dread reputation, but engineers caution that the shattered roadway still needs repair. The scouts' account records the creatures' hesitation, while the engineers' accompanying drawing makes the broken road's immediate danger equally plain.\n\nOur officials ask whether we should repair and reopen the broken crossing. Another proposal is to train local guards to hold the bridge approach. Scouts following Nakai turned back after his trail left the roads they knew."
 war_adventurer_nakai.5.option_a:0 "Train a permanent provincial watch for the recovered site"
 war_adventurer_nakai.5.option_b:0 "Catalogue the surviving temple records"
 war_adventurer_nakai.5.option_c:0 "Return the site's usable tools to displaced local workers"
 war_adventurer_nakai.5.t:0 "The Watch Left Behind"
 war_adventurer_nakai.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the towering reptilian guardian Nakai the Wanderer. Our temple officer reports that Nakai drove raiders from a neglected site and remained until local guardians returned.\n\nHe has since disappeared, leaving our administration to sustain the recovered position. The returning guardians have found records and usable tools inside the recovered enclosure, but lack the means to maintain its watch alone.\n\nOur officials ask whether we should train a permanent provincial watch for the recovered site. Another proposal is to catalogue the surviving temple records. His sudden departure offers as little explanation as his arrival."
 war_adventurer_nakai.6.option_a:0 "Survey the shrine's ancient foundations"
 war_adventurer_nakai.6.option_b:0 "Restore a provincial refuge for the returned custodians"
 war_adventurer_nakai.6.option_c:0 "Distribute the recovered tools and stores to the settlement"
 war_adventurer_nakai.6.t:0 "The Shrine Beyond the Black Forest"
 war_adventurer_nakai.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the towering reptilian guardian Nakai the Wanderer. Our governor reports that Nakai destroyed raiders occupying a forgotten shrine in unfamiliar woodland. Its local custodians believe the site predates their settlement; his interest is unexplained, and he has moved on. The custodians have identified old foundations beneath the raiders' camp and carefully separated recovered objects from ordinary plunder.\n\nOur officials ask whether we should survey the shrine's ancient foundations. Another proposal is to restore a provincial refuge for the returned custodians. Nakai has resumed his wandering, leaving no explanation of his next destination."
 war_adventurer_nakai.7.option_a:0 "Examine the numbered inscribed stones"
 war_adventurer_nakai.7.option_b:0 "Train local causeway guards from the rescue account"
 war_adventurer_nakai.7.option_c:0 "Settle the rescued workers beside the restored route"
 war_adventurer_nakai.7.t:0 "The Causeway Through the Mist"
 war_adventurer_nakai.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the towering reptilian guardian Nakai the Wanderer. Our frontier officer reports that Nakai held a mist-covered causeway long enough for an archaeological party to escape with inscribed stones. The survivors believe the abandoned enclosure beyond it could support a protected settlement. The rescued party has numbered the stones and recorded their original positions before the causeway disappears beneath the mist again.\n\nOur officials ask whether we should examine the numbered inscribed stones. Another proposal is to train local causeway guards from the rescue account. The giant's tracks lead away from the site, and no official has persuaded him to stay."
 war_adventurer_nakai.8.option_a:0 "Survey the enclosure and its old foundations"
 war_adventurer_nakai.8.option_b:0 "Establish a permanent provincial patrol at the sheltered camp"
 war_adventurer_nakai.8.option_c:0 "Reopen the nearby caravan road and its toll station"
 war_adventurer_nakai.8.t:0 "The Camp Built Around His Tracks"
 war_adventurer_nakai.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the towering reptilian guardian Nakai the Wanderer. Our surveyors report that Nakai cleared raiders from a ruined enclosure and lingered until a defensible camp had been established. He departed without claiming it, leaving our officials to decide the camp's purpose. The surveyors' first plan marks sheltered storage, an old well, and a defensible entrance that could support a lasting outpost.\n\nOur officials ask whether we should survey the enclosure and its old foundations. Another proposal is to establish a permanent provincial patrol at the sheltered camp. The custodians found that their unexpected guardian had departed before they could prepare an escort."
 war_adventurer_nakai.9.option_a:0 "Repair the crossing and the displaced families' homes"
 war_adventurer_nakai.9.option_b:0 "Enlist willing survivors in provincial river rescue patrols"
 war_adventurer_nakai.9.option_c:0 "Return salvaged goods to local river carriers"
 war_adventurer_nakai.9.t:0 "The Giant in the Floodwater"
 war_adventurer_nakai.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the towering reptilian guardian Nakai the Wanderer. Our river officer reports that Nakai held a damaged crossing while travellers escaped an attack during a flood.\n\nHis timely arrival has become a popular tale, although none of the witnesses knows where he went afterward. The travellers have brought salvaged goods to the river office while officers count the households left without a safe crossing.\n\nOur officials ask whether we should repair the crossing and the displaced families' homes. Another proposal is to enlist willing survivors in provincial river rescue patrols. Scouts following Nakai turned back after his trail left the roads they knew."
 war_adventurer_nakai.10.option_a:0 "Give the displaced custodians a protected place to study"
 war_adventurer_nakai.10.option_b:0 "Reopen the recovered precinct under provincial registration"
 war_adventurer_nakai.10.option_c:0 "Establish a university archive for the recovered tablets"
 war_adventurer_nakai.10.t:0 "The Tablets on the Governor's Steps"
 war_adventurer_nakai.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the towering reptilian guardian Nakai the Wanderer. Our governor reports that Nakai left recovered tablets beside the provincial office after breaking a relic trafficker's camp. Several displaced custodians followed him to the town and now seek a protected place to study them. The displaced custodians have copied several inscriptions onto temporary boards, fearing that their recovered tablets may be seized again.\n\nOur officials ask whether we should give the displaced custodians a protected place to study. Another proposal is to reopen the recovered precinct under provincial registration. His sudden departure offers as little explanation as his arrival."
 war_adventurer_nakai.11.option_a:0 "Replace the invasion column's broken equipment"
 war_adventurer_nakai.11.option_b:0 "Let provincial captains choose their own routes and commitments"
 war_adventurer_nakai.11.option_c:0 "Abandon the battered crossing approach"
 war_adventurer_nakai.11.t:0 "The Invasion Stopped at the Bridge"
 war_adventurer_nakai.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the towering reptilian guardian Nakai the Wanderer. Our commander reports that Nakai shattered the leading units of an invasion column at a temple crossing. Surviving scouts refuse to follow the same approach, recalling the ancient stories of Itza. The surviving scouts have marked the failed crossing in their reports and demand a different route before the invasion resumes.\n\nOur officials ask whether we should replace the invasion column's broken equipment. Another proposal is to let provincial captains choose their own routes and commitments. Nakai has resumed his wandering, leaving no explanation of his next destination."
 war_adventurer_nakai.12.option_a:0 "Replace the compound's shattered equipment"
 war_adventurer_nakai.12.option_b:0 "Place local detention under independent provincial officers"
 war_adventurer_nakai.12.option_c:0 "Admit that the garrison lost its captives"
 war_adventurer_nakai.12.t:0 "The Garrison's Unannounced Visitor"
 war_adventurer_nakai.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the towering reptilian guardian Nakai the Wanderer. Our occupation officer reports that Nakai entered a poorly guarded shrine compound and broke open its holding pens. The captives dispersed while he destroyed the equipment intended to restrain them. The abandoned holding pens contain broken restraints and an inventory naming captives who can no longer be found.\n\nOur officials ask whether we should replace the compound's shattered equipment. Another proposal is to place local detention under independent provincial officers. The giant's tracks lead away from the site, and no official has persuaded him to stay."
 war_adventurer_nakai.13.option_a:0 "Replace the relic escort and transport"
 war_adventurer_nakai.13.option_b:0 "Let local custodians supervise all future relic transfers"
 war_adventurer_nakai.13.option_c:0 "Dismiss the lost trophies despite the witnesses"
 war_adventurer_nakai.13.t:0 "The Relics Gone Before Dawn"
 war_adventurer_nakai.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the towering reptilian guardian Nakai the Wanderer. Our keeper reports that Nakai recovered confiscated temple objects and escorted their custodians into the jungle.\n\nHe appeared before the scheduled transfer, although its route had been disclosed only to senior officials. The surviving transfer orders bear senior officials' seals, making the unexplained warning to the intruder particularly embarrassing.\n\nOur officials ask whether we should replace the relic escort and transport. Another proposal is to let local custodians supervise all future relic transfers. The custodians found that their unexpected guardian had departed before they could prepare an escort."
 war_adventurer_nakai.14.option_a:0 "Replace the control apparatus and supply landing"
 war_adventurer_nakai.14.option_b:0 "Let local commanders refuse further summoning operations"
 war_adventurer_nakai.14.option_c:0 "Seal and abandon the wrecked crossing site"
 war_adventurer_nakai.14.t:0 "The Daemons at the Water's Edge"
 war_adventurer_nakai.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the towering reptilian guardian Nakai the Wanderer. Our ritual commander reports that summoned troops faltered at the crossing Nakai defended, allowing its captives to escape. The subsequent fighting wrecked the control apparatus and our supply landing. The commander has recovered parts of the apparatus, but the attendants refuse to summon another formation beside the same crossing.\n\nOur officials ask whether we should replace the control apparatus and supply landing. Another proposal is to let local commanders refuse further summoning operations. Scouts following Nakai turned back after his trail left the roads they knew."
 war_adventurer_nakai.15.option_a:0 "Purchase tools to replace the expedition's losses"
 war_adventurer_nakai.15.option_b:0 "Recognize the returned custodians' authority over the enclosure"
 war_adventurer_nakai.15.option_c:0 "Publicly relinquish the failed expedition's claims"
 war_adventurer_nakai.15.t:0 "The Ruin Reoccupied Without Us"
 war_adventurer_nakai.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the towering reptilian guardian Nakai the Wanderer. Our surveyor reports that Nakai drove our labour guard from a sacred enclosure and remained until its former custodians returned. Our stored tools and maps have been taken inside the renewed defences. The returned custodians have raised a barricade with timber taken from the abandoned survey camp, using the expedition's supplies against it.\n\nOur officials ask whether we should purchase tools to replace the expedition's losses. Another proposal is to recognize the returned custodians' authority over the enclosure. His sudden departure offers as little explanation as his arrival."
 war_adventurer_nakai.16.option_a:0 "Replace the demolished compound's equipment"
 war_adventurer_nakai.16.option_b:0 "Return frontier labour administration to provincial communities"
 war_adventurer_nakai.16.option_c:0 "Abandon the damaged camp site"
 war_adventurer_nakai.16.t:0 "The Shrine Beneath the Slave Camp"
 war_adventurer_nakai.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the towering reptilian guardian Nakai the Wanderer. Our overseer reports that Nakai demolished a camp built over ancient foundations and carried recovered carvings away. The captives followed him beyond the patrol perimeter. The broken camp foundations expose the carved stonework beneath them, giving witnesses a visible explanation for the giant's intervention.\n\nOur officials ask whether we should replace the demolished compound's equipment. Another proposal is to return frontier labour administration to provincial communities. Nakai has resumed his wandering, leaving no explanation of his next destination."
 war_adventurer_nakai.17.option_a:0 "Purchase stores to replace the convoy's losses"
 war_adventurer_nakai.17.option_b:0 "Let river communities organize their own escort service"
 war_adventurer_nakai.17.option_c:0 "Requisition replacement supplies from the river settlements"
 war_adventurer_nakai.17.t:0 "The Foreign Bridge's Broken Column"
 war_adventurer_nakai.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the towering reptilian guardian Nakai the Wanderer. Our commander reports that Nakai stood across a narrow bridge and broke the convoy attempting to cross it.\n\nCaptive labourers escaped during the struggle, leaving our stores scattered in the river. The quartermaster has recovered floating ration sacks downstream, but most of the convoy's stores remain beyond the exhausted guards' reach.\n\nOur officials ask whether we should purchase stores to replace the convoy's losses. Another proposal is to let river communities organize their own escort service. The giant's tracks lead away from the site, and no official has persuaded him to stay."
 war_adventurer_nakai.18.option_a:0 "Compensate the dismissed requisition party"
 war_adventurer_nakai.18.option_b:0 "Let the settlement regulate its own dues and collection"
 war_adventurer_nakai.18.option_c:0 "Accept the public defiance of our requisition orders"
 war_adventurer_nakai.18.t:0 "The Settlement He Would Not Leave"
 war_adventurer_nakai.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the towering reptilian guardian Nakai the Wanderer. Our governor reports that Nakai drove an armed requisition party out of a small settlement beside an ancient ruin. He stayed until its inhabitants had repaired a barricade, then disappeared into unfamiliar country. The settlement's repaired barricade now blocks the collection route, and the dismissed requisition party has returned with empty wagons.\n\nOur officials ask whether we should compensate the dismissed requisition party. Another proposal is to let the settlement regulate its own dues and collection. The custodians found that their unexpected guardian had departed before they could prepare an escort."
 war_adventurer_nakai.19.option_a:0 "Replace the collector's wrecked trapping equipment"
 war_adventurer_nakai.19.option_b:0 "Give provincial magistrates control of future collecting expeditions"
 war_adventurer_nakai.19.option_c:0 "Publicly disown the failed menagerie spectacle"
 war_adventurer_nakai.19.t:0 "The Monster Hunter's Empty Cage"
 war_adventurer_nakai.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the towering reptilian guardian Nakai the Wanderer. Our collector reports that an attempt to trap Nakai for a court menagerie ended with broken cages and released prisoners. The tracks lead toward a threatened shrine well beyond our scouts' usual routes. The collector's surviving assistants brought back the trap plans, making it clear how badly they underestimated the creature they meant to display.\n\nOur officials ask whether we should replace the collector's wrecked trapping equipment. Another proposal is to give provincial magistrates control of future collecting expeditions. Scouts following Nakai turned back after his trail left the roads they knew."
 war_adventurer_nakai.20.option_a:0 "Replace the expedition's equipment and stores"
 war_adventurer_nakai.20.option_b:0 "Let local custodians direct future excavations"
 war_adventurer_nakai.20.option_c:0 "Abandon the shattered outpost"
 war_adventurer_nakai.20.t:0 "The Tablets Beyond the Frontier"
 war_adventurer_nakai.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the towering reptilian guardian Nakai the Wanderer. Our expedition leader reports that Nakai overran a fortified excavation and escorted its coerced interpreters away with the sacred tablets. Their departure leaves our planned outpost without its records, workers, or defensible entrance. The remaining expedition staff cannot read the few inscriptions left behind without the interpreters who escaped with their guardian.\n\nOur officials ask whether we should replace the expedition's equipment and stores. Another proposal is to let local custodians direct future excavations. His sudden departure offers as little explanation as his arrival."
 war_adventurer_nakai.21.t:0 "Nakai the Wanderer has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_nakai.21.d:0 "Reports from [war_adventurer_arrival_province.GetName] identify a visitor among the old ruins as the towering reptilian guardian Nakai the Wanderer. Skink travelers recognize him as an ancient Kroxigor, one of the immense creatures that fight for the Lizardmen.\n\nHe is remembered for holding Itza's Bridge of Stars against daemons during the Great Catastrophe. He appears where danger threatens the remnants of the Old Ones' works, then resumes his wandering without explanation."
 war_adventurer_thanquol:0 "Thanquol and Boneripper, Adventurer"
 desc_war_adventurer_thanquol:0 "Thanquol and Boneripper are concealed somewhere beneath the province, judging by the sudden demand for warpstone and the size of the broken doors. The Grey Seer's extravagant schemes keep smugglers busy, while his Rat Ogre bodyguard gives reluctant suppliers a reason to deliver. They leave rival informants, frightened witnesses, and unpaid accounts for the authorities to untangle."
 war_adventurer_thanquol.1.option_a:0 "Distribute the recovered treasury goods to provincial workshops"
 war_adventurer_thanquol.1.option_b:0 "Restore the local accounts exposed by the theft"
 war_adventurer_thanquol.1.option_c:0 "Equip provincial inspectors to guard the recovered stores"
 war_adventurer_thanquol.1.t:0 "The Triumph in the Wrong Sewer"
 war_adventurer_thanquol.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Thanquol's courier claims he destroyed a traitorous rival's plague laboratory.\n\nOur own inspectors confirm that his intended attack misfired, but the wreckage exposed stolen treasury goods and a genuine plot against our rule. The inspectors have placed the recovered treasury marks beside Thanquol's extravagant account, confirming a useful result without confirming his explanation.\n\nOur officials ask whether we should distribute the recovered treasury goods to provincial workshops. Another proposal is to restore the local accounts exposed by the theft. The Grey Seer's demand for recognition arrived after he and Boneripper had already moved on."
 war_adventurer_thanquol.2.option_a:0 "Provision the provincial garrison from the recovered grain"
 war_adventurer_thanquol.2.option_b:0 "Supply local millers with the sound surplus grain"
 war_adventurer_thanquol.2.option_c:0 "Correct the provincial storehouse accounts"
 war_adventurer_thanquol.2.option_d:0 "Let the inspector claim credit without further intervention"
 war_adventurer_thanquol.2.t:0 "The Vermin that Found the Stores"
 war_adventurer_thanquol.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our granary inspector reports that Thanquol's engineered vermin escaped their handlers and uncovered a hidden cache of embezzled grain. His letter describes this accident as a flawless investigation. The concealed grain sacks still carry official inventory marks that the granary's accounts insist were lost months ago.\n\nOur officials ask whether we should provision the provincial garrison from the recovered grain. Another proposal is to supply local millers with the sound surplus grain. No official has managed to keep Thanquol in one place long enough to settle the disputed accounts."
 war_adventurer_thanquol.3.option_a:0 "Have engineers examine the recovered rangefinder"
 war_adventurer_thanquol.3.option_b:0 "Teach provincial artillery crews to use its measurements"
 war_adventurer_thanquol.3.option_c:0 "Distribute the spare fittings to local instrument makers"
 war_adventurer_thanquol.3.t:0 "The Lonely Workshop's Stolen Gear"
 war_adventurer_thanquol.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our engineer reports that Thanquol returned from a raid on a foreign workshop with an unfamiliar rangefinder. Most of the stolen equipment was destroyed during his escape, but the surviving instrument can still be studied. The engineer has secured the rangefinder on a stable mount and recorded the first measurements before the Grey Seer can reclaim it.\n\nOur officials ask whether we should have engineers examine the recovered rangefinder. Another proposal is to teach provincial artillery crews to use its measurements. Thanquol has found another reason to travel, taking whichever Rat Ogre currently answers to Boneripper with him."
 war_adventurer_thanquol.4.option_a:0 "Examine the aircraft's lifting-system sketches"
 war_adventurer_thanquol.4.option_b:0 "Give the recovered cargo to provincial workshops"
 war_adventurer_thanquol.4.option_c:0 "Train a local interception team from the ground procedures"
 war_adventurer_thanquol.4.t:0 "The Airship that Was Almost Captured"
 war_adventurer_thanquol.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our tunnel commander reports that Thanquol's attempt to seize a passing experimental aircraft failed spectacularly. The retreat nevertheless left our forces with a dropped cargo crate and sketches of its ground crew's procedures. The crate's contents and the sketches agree about the aircraft's lifting system, making the failed capture less useless than its witnesses first assumed.\n\nOur officials ask whether we should examine the aircraft's lifting-system sketches. Another proposal is to give the recovered cargo to provincial workshops. The pair have slipped beyond the search parties, leaving their hosts to explain the damage and divide the surviving spoils."
 war_adventurer_thanquol.5.option_a:0 "Correct the supplier's false provincial invoices"
 war_adventurer_thanquol.5.option_b:0 "Equip local beast-handlers with the inspected harness"
 war_adventurer_thanquol.5.option_c:0 "Establish training fields for supervised beast handling"
 war_adventurer_thanquol.5.t:0 "Boneripper's Replacement Invoice"
 war_adventurer_thanquol.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our beast-handlers petition over a bill for a new Rat Ogre after Thanquol's previous bodyguard was destroyed.\n\nTheir inspection of the replacement exposed a supplier's fraud, and they have seized usable equipment from his pens. The seized harness and instruments have been checked against the supplier's invoices, revealing charges for equipment he never delivered.\n\nOur officials ask whether we should correct the supplier's false provincial invoices. Another proposal is to equip local beast-handlers with the inspected harness. Thanquol has departed with his bodyguard before the inspectors can compare his claims with the surviving evidence."
 war_adventurer_thanquol.6.option_a:0 "Remove the exposed intermediaries from the enclave's revenue offices"
 war_adventurer_thanquol.6.option_b:0 "Redirect confiscated goods into the enclave's workshops"
 war_adventurer_thanquol.6.option_c:0 "Train the enclave's provincial guards to detect infiltrators"
 war_adventurer_thanquol.6.t:0 "The Provincial Palace's Secret Pipe"
 war_adventurer_thanquol.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our provincial agent reports that Thanquol escaped a failed attempt on a foreign dignitary through an overlooked drain. He failed to kill his target but brought back correspondence revealing a plot against our nearby enclave. The captured correspondence identifies intermediaries already trading with the enclave, allowing its officers to act before the plot develops further.\n\nOur officials ask whether we should remove the exposed intermediaries from the enclave's revenue offices. Another proposal is to redirect confiscated goods into the enclave's workshops. The Grey Seer's demand for recognition arrived after he and Boneripper had already moved on."
 war_adventurer_thanquol.7.option_a:0 "Distribute the untainted merchandise to local craftsmen"
 war_adventurer_thanquol.7.option_b:0 "Register the concealed route with provincial customs"
 war_adventurer_thanquol.7.option_c:0 "Train local inspectors to identify contaminated cargo"
 war_adventurer_thanquol.7.t:0 "The Plague Shipment's Useful Mistake"
 war_adventurer_thanquol.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our customs agent reports that a diseased shipment intended for an enemy instead exposed a rival supplier's concealed route. Thanquol blames the error on a subordinate; the route records and untainted goods are now in our custody. The customs agent has separated the untainted merchandise from the diseased cargo and copied the route markings for the provincial office.\n\nOur officials ask whether we should distribute the untainted merchandise to local craftsmen. Another proposal is to register the concealed route with provincial customs. No official has managed to keep Thanquol in one place long enough to settle the disputed accounts."
 war_adventurer_thanquol.8.option_a:0 "Have engineers reconstruct the torn machinery drawings"
 war_adventurer_thanquol.8.option_b:0 "Adapt the recovered mechanism for provincial workshops"
 war_adventurer_thanquol.8.option_c:0 "Equip a counting house for the reconstructed machinery trade"
 war_adventurer_thanquol.8.t:0 "The Workshop Plans in Three Pieces"
 war_adventurer_thanquol.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our frontier engineer reports that Thanquol and Boneripper escaped a raid on a Dwarf workshop with fragments of its machinery plans. Boneripper tore the papers during the retreat, but enough remains to identify a useful mechanism. The engineer has pinned the torn sheets together and identified enough matching measurements to attempt a careful reconstruction.\n\nOur officials ask whether we should have engineers reconstruct the torn machinery drawings. Another proposal is to adapt the recovered mechanism for provincial workshops. Thanquol has found another reason to travel, taking whichever Rat Ogre currently answers to Boneripper with him."
 war_adventurer_thanquol.9.option_a:0 "Examine the captured lifting apparatus"
 war_adventurer_thanquol.9.option_b:0 "Train provincial military handlers on the winch"
 war_adventurer_thanquol.9.option_c:0 "Install the captured winch in a local freight yard"
 war_adventurer_thanquol.9.t:0 "The Captured Ground Crew"
 war_adventurer_thanquol.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our agent reports that Thanquol failed to take an experimental flying machine but returned with its abandoned winch and ground instructions.\n\nHis demand for a victory celebration arrives before the quieter report of his retreat. The recovered winch still bears the crew's numbered loading marks, giving local handlers practical instructions despite the failed seizure.\n\nOur officials ask whether we should examine the captured lifting apparatus. Another proposal is to train provincial military handlers on the winch. The pair have slipped beyond the search parties, leaving their hosts to explain the damage and divide the surviving spoils."
 war_adventurer_thanquol.10.option_a:0 "Distribute lawful seized goods to provincial workshops"
 war_adventurer_thanquol.10.option_b:0 "Correct the corrupt officials' provincial accounts"
 war_adventurer_thanquol.10.option_c:0 "Supply the local border guard from the seized stores"
 war_adventurer_thanquol.10.t:0 "The Ogre That Broke the Smugglers"
 war_adventurer_thanquol.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our provincial officer reports that Thanquol's newly acquired Boneripper smashed a smuggling depot while pursuing a debtor. The Grey Seer escaped an ensuing fire, leaving seized contraband and enough records to identify corrupt officials. Several contraband cases remain sealed, while the recovered account book names officials who accepted payments to overlook the depot.\n\nOur officials ask whether we should distribute lawful seized goods to provincial workshops. Another proposal is to correct the corrupt officials' provincial accounts. Thanquol has departed with his bodyguard before the inspectors can compare his claims with the surviving evidence."
 war_adventurer_thanquol.11.option_a:0 "Replace the contaminated supplies and fund treatment"
 war_adventurer_thanquol.11.option_b:0 "Let the affected tunnel districts administer their own containment"
 war_adventurer_thanquol.11.option_c:0 "Seal and abandon the contaminated district"
 war_adventurer_thanquol.11.t:0 "The Fever Beneath the Occupation"
 war_adventurer_thanquol.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our district physician reports that Thanquol contaminated a supply conduit beneath the occupied tunnels. His own followers also suffered, but he escaped while our workers struggled to isolate the affected stores. The physicians have traced the contaminated conduit to stores already promised to work crews elsewhere in the occupied district.\n\nOur officials ask whether we should replace the contaminated supplies and fund treatment. Another proposal is to let the affected tunnel districts administer their own containment. The Grey Seer's demand for recognition arrived after he and Boneripper had already moved on."
 war_adventurer_thanquol.12.option_a:0 "Purchase replacement grain"
 war_adventurer_thanquol.12.option_b:0 "Leave tunnel granary security to local wardens"
 war_adventurer_thanquol.12.option_c:0 "Strip nearby households of grain to replace the ruined stores"
 war_adventurer_thanquol.12.t:0 "The Granary Full of Teeth"
 war_adventurer_thanquol.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our quartermaster reports that engineered vermin burst into an occupied tunnel granary. Boneripper broke the cordon during the confusion and carried Thanquol away, leaving scattered grain and panicked labourers. The quartermaster has sealed the remaining grain, but the ruined sacks and frightened labourers make an ordinary issue impossible.\n\nOur officials ask whether we should purchase replacement grain. Another proposal is to leave tunnel granary security to local wardens. No official has managed to keep Thanquol in one place long enough to settle the disputed accounts."
 war_adventurer_thanquol.13.option_a:0 "Hire replacement specialists and secure the workshop"
 war_adventurer_thanquol.13.option_b:0 "Give local engineers independent control of their research"
 war_adventurer_thanquol.13.option_c:0 "Close the university workshop that lost its specialists"
 war_adventurer_thanquol.13.t:0 "The Engineer's Missing Night Shift"
 war_adventurer_thanquol.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our engineer reports that Thanquol raided a military workshop beneath the occupied city.\n\nHe failed to seize its main engine but escaped with technical notes and several frightened specialists. The workshop's surviving staff can identify the stolen notes, yet lack the specialists needed to reconstruct their missing calculations quickly.\n\nOur officials ask whether we should hire replacement specialists and secure the workshop. Another proposal is to give local engineers independent control of their research. Thanquol has found another reason to travel, taking whichever Rat Ogre currently answers to Boneripper with him."
 war_adventurer_thanquol.14.option_a:0 "Repair the loading winch"
 war_adventurer_thanquol.14.option_b:0 "Let the provincial transport guild reroute its own deliveries"
 war_adventurer_thanquol.14.option_c:0 "Abandon the obstructed staging shaft"
 war_adventurer_thanquol.14.t:0 "The Landing Stage's Broken Winch"
 war_adventurer_thanquol.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our commander reports that Thanquol tried to steal a supply aircraft from an underground staging shaft. The attempt failed, but Boneripper wrecked the winch while opening their escape route. The damaged winch has left military cargo suspended above the staging floor, where it obstructs every attempt to resume deliveries.\n\nOur officials ask whether we should repair the loading winch. Another proposal is to let the provincial transport guild reroute its own deliveries. The pair have slipped beyond the search parties, leaving their hosts to explain the damage and divide the surviving spoils."
 war_adventurer_thanquol.15.option_a:0 "Replace the guard's broken equipment"
 war_adventurer_thanquol.15.option_b:0 "Let provincial officers set their own pursuit and identification rules"
 war_adventurer_thanquol.15.option_c:0 "Retract the premature victory announcement"
 war_adventurer_thanquol.15.t:0 "The Bodyguard We Already Killed"
 war_adventurer_thanquol.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our governor reports that a new Rat Ogre calling forth the same terrified cries of Boneripper broke Thanquol out of an inspection cordon. The previous creature's corpse remains in our custody; the guards had mistaken its death for the Grey Seer's defeat. The governor's earlier victory notice is still posted in the market beside fresh descriptions of a different Rat Ogre bearing the same name.\n\nOur officials ask whether we should replace the guard's broken equipment. Another proposal is to let provincial officers set their own pursuit and identification rules. Thanquol has departed with his bodyguard before the inspectors can compare his claims with the surviving evidence."
 war_adventurer_thanquol.16.option_a:0 "Repair the residence and reconstruct its accounts"
 war_adventurer_thanquol.16.option_b:0 "Place provincial access controls under an independent council"
 war_adventurer_thanquol.16.option_c:0 "Acknowledge the security scandal"
 war_adventurer_thanquol.16.t:0 "The Governor Survived the Sewer Plot"
 war_adventurer_thanquol.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our chamberlain reports that Thanquol reached the provincial residence through its drains but failed to murder the governor. He escaped with Boneripper after wrecking the treasury office and setting rival agents against one another. The treasury clerks have recovered fragments of the raiders' orders, which reveal competing instructions as well as the residence's failed security.\n\nOur officials ask whether we should repair the residence and reconstruct its accounts. Another proposal is to place provincial access controls under an independent council. The Grey Seer's demand for recognition arrived after he and Boneripper had already moved on."
 war_adventurer_thanquol.17.option_a:0 "Replace the food reserves and pay for treatment"
 war_adventurer_thanquol.17.option_b:0 "Let the affected communities organize their own food distribution"
 war_adventurer_thanquol.17.option_c:0 "Isolate the contaminated district without rebuilding its stores"
 war_adventurer_thanquol.17.t:0 "The Plague that Spoiled His Own Plan"
 war_adventurer_thanquol.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our physician reports that Thanquol's contaminated stores sickened his own attackers before they reached their objective.\n\nTheir retreat still left our food reserves unusable and workers tending the affected district. The contaminated sacks can be identified by their delivery marks, but several were opened before the physicians reached the stores.\n\nOur officials ask whether we should replace the food reserves and pay for treatment. Another proposal is to let the affected communities organize their own food distribution. No official has managed to keep Thanquol in one place long enough to settle the disputed accounts."
 war_adventurer_thanquol.18.option_a:0 "Replace the rangefinder and damaged gantry"
 war_adventurer_thanquol.18.option_b:0 "Give provincial engineers control of their own weapon settings"
 war_adventurer_thanquol.18.option_c:0 "Close the university workshop whose drawings were stolen"
 war_adventurer_thanquol.18.t:0 "The Tower's Stolen Rangefinder"
 war_adventurer_thanquol.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our engineer reports that Thanquol's raid failed to capture a fortified workshop, but the attackers escaped with a rangefinder and fragments of its drawings. Boneripper tore down a gantry to cover their retreat. The surviving engineers have listed the exposed measurements so that officers can judge which weapon settings must now be changed.\n\nOur officials ask whether we should replace the rangefinder and damaged gantry. Another proposal is to give provincial engineers control of their own weapon settings. Thanquol has found another reason to travel, taking whichever Rat Ogre currently answers to Boneripper with him."
 war_adventurer_thanquol.19.option_a:0 "Replace the broken moorings and landing equipment"
 war_adventurer_thanquol.19.option_b:0 "Let provincial carriers manage their own military deliveries"
 war_adventurer_thanquol.19.option_c:0 "Leave the ruined landing yard closed"
 war_adventurer_thanquol.19.t:0 "The Airship He Could Not Keep"
 war_adventurer_thanquol.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our air-transport officer reports that Thanquol briefly seized a grounded experimental craft but lost it when its crew cut the moorings. His escape wrecked the landing equipment and scattered military cargo across the district. The ground crew recovered the craft, but the broken moorings and scattered stores leave the landing yard unusable without substantial work.\n\nOur officials ask whether we should replace the broken moorings and landing equipment. Another proposal is to let provincial carriers manage their own military deliveries. The pair have slipped beyond the search parties, leaving their hosts to explain the damage and divide the surviving spoils."
 war_adventurer_thanquol.20.option_a:0 "Compensate the traders for crushed stalls and scales"
 war_adventurer_thanquol.20.option_b:0 "Let the merchant wards control future pursuits through their markets"
 war_adventurer_thanquol.20.option_c:0 "Leave the damaged market to recover without repairs"
 war_adventurer_thanquol.20.t:0 "The Replacement in the Market Square"
 war_adventurer_thanquol.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper. Our watch reports that Thanquol used a newly acquired Rat Ogre to break an arrest cordon and escape through a busy market. Witnesses disagree over whether Boneripper had mechanical fittings, scars, or both; several stalls lie crushed. The traders' claims include crushed shutters and broken weighing tables, providing a precise account of damage the watch would rather minimize.\n\nOur officials ask whether we should compensate the traders for crushed stalls and scales. Another proposal is to let the merchant wards control future pursuits through their markets. Thanquol has departed with his bodyguard before the inspectors can compare his claims with the surviving evidence."
 war_adventurer_thanquol.21.t:0 "Thanquol and Boneripper have arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_thanquol.21.d:0 "Our informants report that the scheming Skaven sorcerer Thanquol and his Rat Ogre bodyguard Boneripper have entered [war_adventurer_arrival_province.GetName]. Witnesses saw a horned ratman and his hulking protector slipping through concealed passages.\n\nThanquol is a Grey Seer whose sorcery, ambition, and appetite for warpstone are matched by his talent for blaming others when his schemes fail. Boneripper is the name he gives his monstrous bodyguard, whose strength supplies the persuasion his boasts cannot."
 war_adventurer_grombrindal:0 "Grombrindal, Adventurer"
 desc_war_adventurer_grombrindal:0 "Travelers insist that a white-bearded Dwarf has appeared wherever the province's fighting is fiercest, only to vanish before anyone can thank him. Tales of Grombrindal's impossible rescues stiffen the defenders' resolve and bring curious visitors to the taverns. They also awaken old grudges, as Dwarfs demand to know whose broken oaths required the White Dwarf's intervention."
 war_adventurer_grombrindal.1.option_a:0 "Train the provincial militia from the captain's account"
 war_adventurer_grombrindal.1.option_b:0 "Restore the rescued households and their district"
 war_adventurer_grombrindal.1.option_c:0 "Establish training fields for the rallied defenders"
 war_adventurer_grombrindal.1.t:0 "Umthi's Story at the Barricade"
 war_adventurer_grombrindal.1.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our hold captain reports that a white-bearded stranger rallied defenders surrounded by raiders and led their counterattack.\n\nBy the time the survivors sought him, he was gone; their testimony closely recalls Umthi the Damned's saga. The surviving captain has recorded the defenders' renewed formation and the wounded they carried out during the counterattack.\n\nOur officials ask whether we should train the provincial militia from the captain's account. Another proposal is to restore the rescued households and their district. Grombrindal has left the people he aided to fulfil their own obligations and continued his mysterious wandering."
 war_adventurer_grombrindal.2.option_a:0 "Provide provincial holdings for the distressed families"
 war_adventurer_grombrindal.2.option_b:0 "Preserve and compare the recovered Karak Varn account"
 war_adventurer_grombrindal.2.option_c:0 "Endow a cathedral to administer the promised relief"
 war_adventurer_grombrindal.2.t:0 "The Three Names on the Old Tablet"
 war_adventurer_grombrindal.2.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our archivist reports that Grombrindal recovered an account of the stand at Karak Varn naming himself, the Dwarf Slayer Gotrek Gurnisson, and the Dwarf brewer Josef Bugman. He demanded that its promise of aid to endangered kin be honoured, then departed alone. The archivist has placed the recovered account beside the neglected relief records, making the old promise an obligation the court can examine.\n\nOur officials ask whether we should provide provincial holdings for the distressed families. Another proposal is to preserve and compare the recovered Karak Varn account. No escort remains with the stranger, and his witnesses cannot agree on the road he took."
 war_adventurer_grombrindal.3.option_a:0 "Train provincial recruits under the veterans' instruction"
 war_adventurer_grombrindal.3.option_b:0 "Restore the regiment's provincial muster records"
 war_adventurer_grombrindal.3.option_c:0 "Establish training fields for the renewed regiment"
 war_adventurer_grombrindal.3.t:0 "The Ancestor at the Muster"
 war_adventurer_grombrindal.3.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our muster officer reports that Grombrindal recognized an old regiment's forgotten oath and shamed its quarrelling veterans into helping new recruits. Some call him Snorri Whitebeard; the officer records that identification only as rumour. The veterans have reopened their drill book and begun correcting the recruits' footing while the muster officer verifies the old oath.\n\nOur officials ask whether we should train provincial recruits under the veterans' instruction. Another proposal is to restore the regiment's provincial muster records. The last report ends with the White Dwarf's departure rather than a demand for land or office."
 war_adventurer_grombrindal.4.option_a:0 "Reopen the saved workings with the recovered tools"
 war_adventurer_grombrindal.4.option_b:0 "Train a provincial mine watch"
 war_adventurer_grombrindal.4.option_c:0 "Restore the rescued miners' homes and local holdings"
 war_adventurer_grombrindal.4.t:0 "The Miners Beyond the Goblin Ring"
 war_adventurer_grombrindal.4.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our mine steward reports that Grombrindal broke through raiders surrounding a stranded work party. The miners fought their way out to him and returned with their tools, while their rescuer disappeared into another passage. The returned miners have counted their recovered tools and identified the blocked gallery that must be secured before work resumes.\n\nOur officials ask whether we should reopen the saved workings with the recovered tools. Another proposal is to train a provincial mine watch. The white-bearded stranger vanished before the witnesses could arrange a formal audience."
 war_adventurer_grombrindal.5.option_a:0 "Register the reconciled families' restored property claims"
 war_adventurer_grombrindal.5.option_b:0 "Preserve the heirloom's testimony beside the old pledge"
 war_adventurer_grombrindal.5.option_c:0 "Enter the rescue pledge in the public record"
 war_adventurer_grombrindal.5.t:0 "The Grudge He Would Not Let Us Forget"
 war_adventurer_grombrindal.5.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our clan judge reports that Grombrindal returned a stolen family heirloom and produced witnesses to an unfulfilled rescue pledge.\n\nHis warning echoed the obligation remembered from Karak Varn, leaving the court to settle the descendants' claims. The returned heirloom bears the family mark cited in the old claim, allowing the judge to connect the grievance with living petitioners.\n\nOur officials ask whether we should register the reconciled families' restored property claims. Another proposal is to preserve the heirloom's testimony beside the old pledge. The surviving officers found no trace of Grombrindal when they returned with the court's messenger."
 war_adventurer_grombrindal.6.option_a:0 "Restore the caravan route and its provincial waystations"
 war_adventurer_grombrindal.6.option_b:0 "Train local escorts from the survivors' account"
 war_adventurer_grombrindal.6.option_c:0 "Return recovered merchandise to provincial suppliers"
 war_adventurer_grombrindal.6.t:0 "The Caravan's White-Bearded Guard"
 war_adventurer_grombrindal.6.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our governor receives a caravan's account of a white-bearded Dwarf who broke a bandit encirclement, rallied its guards, and vanished before payment could be offered. The survivors have brought recovered trade goods to our customs house. The customs clerks have matched the recovered trade goods to the caravan's original declarations, preserving both property claims and outstanding duties.\n\nOur officials ask whether we should restore the caravan route and its provincial waystations. Another proposal is to train local escorts from the survivors' account. Grombrindal has left the people he aided to fulfil their own obligations and continued his mysterious wandering."
 war_adventurer_grombrindal.7.option_a:0 "Restore the shelter promised to the endangered settlers"
 war_adventurer_grombrindal.7.option_b:0 "Authenticate and preserve the old agreement"
 war_adventurer_grombrindal.7.option_c:0 "Recruit a provincial watch for the rescued community"
 war_adventurer_grombrindal.7.t:0 "The Agreement Older than the Province"
 war_adventurer_grombrindal.7.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our magistrate reports that Grombrindal recovered an old mutual-aid agreement from a raided archive and insisted that endangered settlers receive its promised shelter. Witnesses offer contradictory legends about the age of its bearer. The agreement names a shelter site still used by the settlement, giving the magistrate a practical way to honour its neglected terms.\n\nOur officials ask whether we should restore the shelter promised to the endangered settlers. Another proposal is to authenticate and preserve the old agreement. No escort remains with the stranger, and his witnesses cannot agree on the road he took."
 war_adventurer_grombrindal.8.option_a:0 "Settle willing rescued miners in provincial homes"
 war_adventurer_grombrindal.8.option_b:0 "Catalogue the miners' surviving surveys"
 war_adventurer_grombrindal.8.option_c:0 "Employ willing survivors with their recovered mining tools"
 war_adventurer_grombrindal.8.t:0 "The Pledge Carried Far from Karak Varn"
 war_adventurer_grombrindal.8.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our border officer reports that Grombrindal rescued a mining party and left a copy of the pledge associated with his stand beside the Dwarf Slayer Gotrek Gurnisson and the Dwarf brewer Josef Bugman. The miners arrived with their survey records and a request for passage back to their kin. The rescued miners have brought survey records and their surviving tools, offering useful knowledge wherever they are permitted to settle.\n\nOur officials ask whether we should settle willing rescued miners in provincial homes. Another proposal is to catalogue the miners' surviving surveys. The last report ends with the White Dwarf's departure rather than a demand for land or office."
 war_adventurer_grombrindal.9.option_a:0 "Restore the gate district and its sheltered homes"
 war_adventurer_grombrindal.9.option_b:0 "Train the rallied provincial garrison"
 war_adventurer_grombrindal.9.option_c:0 "Establish training fields for the surviving gate defenders"
 war_adventurer_grombrindal.9.t:0 "The Foreign Fortress's Last Gate"
 war_adventurer_grombrindal.9.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our commander reports that Grombrindal held a gate while civilians and a trapped Dwarf detachment escaped.\n\nHis example rallied the remaining garrison, but he was gone before the relief force arrived. The relief commander found the rallied garrison still holding the inner yard, with the civilians sheltered behind its damaged gate.\n\nOur officials ask whether we should restore the gate district and its sheltered homes. Another proposal is to train the rallied provincial garrison. The white-bearded stranger vanished before the witnesses could arrange a formal audience."
 war_adventurer_grombrindal.10.option_a:0 "Correct local privilege records using the returned seals"
 war_adventurer_grombrindal.10.option_b:0 "Restore the defrauded merchants' provincial businesses"
 war_adventurer_grombrindal.10.option_c:0 "House the verified registry in a new town hall"
 war_adventurer_grombrindal.10.t:0 "The King's Name He Never Claimed"
 war_adventurer_grombrindal.10.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our governor reports that a merchant tried to sell privileges supposedly granted by Snorri Whitebeard. Grombrindal exposed the fraud and returned the victims' seals, refusing to answer questions about his own identity. The returned seals match genuine registry entries, allowing officials to separate the merchant's forged privileges from the victims' lawful documents.\n\nOur officials ask whether we should correct local privilege records using the returned seals. Another proposal is to restore the defrauded merchants' provincial businesses. The surviving officers found no trace of Grombrindal when they returned with the court's messenger."
 war_adventurer_grombrindal.11.option_a:0 "Replace the lost siege stores"
 war_adventurer_grombrindal.11.option_b:0 "Let provincial captains negotiate their own siege commitments"
 war_adventurer_grombrindal.11.option_c:0 "Abandon the damaged siege position"
 war_adventurer_grombrindal.11.t:0 "The Encirclement Broken from Within"
 war_adventurer_grombrindal.11.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our siege officer reports that Grombrindal appeared among surrounded defenders and led them through our weakest position. The escaping force carried its wounded and stores away before our reserve could arrive. The abandoned siege stores show where the defenders broke through, while the reserve's late orders explain why the breach remained open.\n\nOur officials ask whether we should replace the lost siege stores. Another proposal is to let provincial captains negotiate their own siege commitments. Grombrindal has left the people he aided to fulfil their own obligations and continued his mysterious wandering."
 war_adventurer_grombrindal.12.option_a:0 "Compensate the defeated trophy-hall guard"
 war_adventurer_grombrindal.12.option_b:0 "Give local magistrates authority over the confiscation claims"
 war_adventurer_grombrindal.12.option_c:0 "Dismiss the written grudge despite the identified heirlooms"
 war_adventurer_grombrindal.12.t:0 "The Heirlooms Taken from Our Hall"
 war_adventurer_grombrindal.12.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our governor reports that Grombrindal entered a trophy hall, defeated its guard, and restored seized heirlooms to their surviving families. He left a formal account of the grudge beside the empty cases. The trophy keeper has retained the grudge beside his inventory, unable to explain why so many seized objects could be identified by surviving families.\n\nOur officials ask whether we should compensate the defeated trophy-hall guard. Another proposal is to give local magistrates authority over the confiscation claims. No escort remains with the stranger, and his witnesses cannot agree on the road he took."
 war_adventurer_grombrindal.13.option_a:0 "Replace the prison's shattered gates and equipment"
 war_adventurer_grombrindal.13.option_b:0 "Transfer detention to independent provincial wardens"
 war_adventurer_grombrindal.13.option_c:0 "Leave the ruined prison compound closed"
 war_adventurer_grombrindal.13.t:0 "The Promise Behind the Prison Break"
 war_adventurer_grombrindal.13.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our jailer reports that Grombrindal opened the cells holding a captured Dwarf work party.\n\nA pledge recalling Karak Varn was carved into the broken gate, and copies of the prison roll have begun circulating among the prisoners' kin. The jailer has delivered a cart of broken shackles but cannot produce a single member of the escaped work party.\n\nOur officials ask whether we should replace the prison's shattered gates and equipment. Another proposal is to transfer detention to independent provincial wardens. The last report ends with the White Dwarf's departure rather than a demand for land or office."
 war_adventurer_grombrindal.14.option_a:0 "Purchase new service contracts"
 war_adventurer_grombrindal.14.option_b:0 "Let the provincial companies negotiate their own obligations"
 war_adventurer_grombrindal.14.option_c:0 "Accept the public repudiation of the muster"
 war_adventurer_grombrindal.14.t:0 "The Muster that Turned Against Us"
 war_adventurer_grombrindal.14.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our commander reports that Grombrindal exposed the breaking of an ancestral service agreement before a conscript muster. Several companies refused to assemble, and he escorted their detained spokesmen away. The absent companies have returned copies of their service agreement, with the broken terms marked beside the commander's own requisition orders.\n\nOur officials ask whether we should purchase new service contracts. Another proposal is to let the provincial companies negotiate their own obligations. The white-bearded stranger vanished before the witnesses could arrange a formal audience."
 war_adventurer_grombrindal.15.option_a:0 "Hire replacement miners and buy new equipment"
 war_adventurer_grombrindal.15.option_b:0 "Let local mining guilds allocate their own production"
 war_adventurer_grombrindal.15.option_c:0 "Close and abandon the damaged workings"
 war_adventurer_grombrindal.15.t:0 "The Mine's Unpaid Debt"
 war_adventurer_grombrindal.15.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our overseer reports that Grombrindal broke the guard around a captive mining crew and rallied them into an escape. The fugitives carried off the tools our administration had seized from their families. The overseer's inventory lists the tools as state property, but their surviving family marks support the fugitives' claim to them.\n\nOur officials ask whether we should hire replacement miners and buy new equipment. Another proposal is to let local mining guilds allocate their own production. The surviving officers found no trace of Grombrindal when they returned with the court's messenger."
 war_adventurer_grombrindal.16.option_a:0 "Replace the expedition's lost equipment"
 war_adventurer_grombrindal.16.option_b:0 "Put frontier expeditions under provincial oversight"
 war_adventurer_grombrindal.16.option_c:0 "Publicly repudiate the slaving expedition"
 war_adventurer_grombrindal.16.t:0 "The Slaving Expedition's Return"
 war_adventurer_grombrindal.16.d:0 "A sealed report from [war_adventurer_province.GetName] concerns the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our frontier officer reports that Grombrindal scattered a slaving expedition and freed its captives. Survivors returned with a written grudge and no explanation of how the old Dwarf vanished after the battle. The returning officers have produced the written grudge instead of their promised captives, exposing the expedition's failure to the frontier settlements.\n\nOur officials ask whether we should replace the expedition's lost equipment. Another proposal is to put frontier expeditions under provincial oversight. Grombrindal has left the people he aided to fulfil their own obligations and continued his mysterious wandering."
 war_adventurer_grombrindal.17.option_a:0 "Settle the contractor's broken protection agreement"
 war_adventurer_grombrindal.17.option_b:0 "Let provincial petitioners supervise future protection contracts"
 war_adventurer_grombrindal.17.option_c:0 "Defend the contractor despite the published evidence"
 war_adventurer_grombrindal.17.t:0 "The Foreign Oathbreaker's Ledger"
 war_adventurer_grombrindal.17.d:0 "The latest dispatch from [war_adventurer_province.GetName] describes an incident linked to the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our magistrate reports that Grombrindal defeated a contractor who withheld promised protection from a Dwarf settlement.\n\nHe left the contractor's ledger with witnesses and carried its detained petitioners to safety. The witnesses have compared the contractor's payments with the protection actually supplied, leaving several approving officials directly implicated.\n\nOur officials ask whether we should settle the contractor's broken protection agreement. Another proposal is to let provincial petitioners supervise future protection contracts. No escort remains with the stranger, and his witnesses cannot agree on the road he took."
 war_adventurer_grombrindal.18.option_a:0 "Replace the confiscated relief allocation"
 war_adventurer_grombrindal.18.option_b:0 "Give local relief custodians independent control of their funds"
 war_adventurer_grombrindal.18.option_c:0 "Deny the claim despite the posted accounts"
 war_adventurer_grombrindal.18.t:0 "The Karak Varn Petition"
 war_adventurer_grombrindal.18.d:0 "Witnesses from [war_adventurer_province.GetName] have brought our officials an account concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our governor reports that Grombrindal recovered a seized relief fund after its custodians invoked the promise associated with Karak Varn. He acted alone, leaving the fund's accounts nailed to the treasury door. The recovered accounts identify the households whose contributions were diverted, making the relief petition difficult to dismiss as a private dispute.\n\nOur officials ask whether we should replace the confiscated relief allocation. Another proposal is to give local relief custodians independent control of their funds. The last report ends with the White Dwarf's departure rather than a demand for land or office."
 war_adventurer_grombrindal.19.option_a:0 "Replace the supply camp's provisions"
 war_adventurer_grombrindal.19.option_b:0 "Let provincial commanders arrange their own interception patrols"
 war_adventurer_grombrindal.19.option_c:0 "Requisition replacement stores from nearby settlements"
 war_adventurer_grombrindal.19.t:0 "The Caravan We Had Surrounded"
 war_adventurer_grombrindal.19.d:0 "Our officials in [war_adventurer_province.GetName] have forwarded a report about the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our commander reports that Grombrindal rallied an encircled caravan and broke its captives out through a supply camp. He disappeared after the rescued guards reached a safe route, leaving our camp stripped of provisions. The captured caravan's guards carried off the camp's provisions on their recovered wagons, leaving the interception force without its next issue.\n\nOur officials ask whether we should replace the supply camp's provisions. Another proposal is to let provincial commanders arrange their own interception patrols. The white-bearded stranger vanished before the witnesses could arrange a formal audience."
 war_adventurer_grombrindal.20.option_a:0 "Compensate the households whose relics were seized"
 war_adventurer_grombrindal.20.option_b:0 "Let provincial magistrates adjudicate the clan's grievance"
 war_adventurer_grombrindal.20.option_c:0 "Refuse the grievance despite the surviving officer's testimony"
 war_adventurer_grombrindal.20.t:0 "The Ancestor's Unanswered Grudge"
 war_adventurer_grombrindal.20.d:0 "A courier from [war_adventurer_province.GetName] has delivered testimony concerning the legendary Dwarf champion Grombrindal, known as the White Dwarf. Our court receives a formal grievance after Grombrindal defeated a provincial officer holding stolen clan relics. The officer survived, the relics are gone, and witnesses disagree whether the rescuer was an ancient king or simply an indomitable traveller. The surviving officer has confirmed the relics' return, although he refuses to endorse either of the legends spreading about his conqueror.\n\nOur officials ask whether we should compensate the households whose relics were seized. Another proposal is to let provincial magistrates adjudicate the clan's grievance. The surviving officers found no trace of Grombrindal when they returned with the court's messenger."
 war_adventurer_grombrindal.21.t:0 "Grombrindal has arrived in [war_adventurer_arrival_province.GetName]"
 war_adventurer_grombrindal.21.d:0 "Travelers from [war_adventurer_arrival_province.GetName] insist that the legendary Dwarf champion Grombrindal, known as the White Dwarf, has appeared there. Their accounts agree on a white-bearded warrior, though none can explain where he came from.\n\nThe White Dwarf is a figure of ancestral legend, said to appear when his kin face their darkest hours. Stories tell of hopeless battles turned by his arrival and of a rescuer who vanishes before gratitude can catch him."
 war_adventurer_setup.1.a:0 "Their journeys begin."
 war_adventurer_arrival_acknowledge:0 "Noted."
 war_adventurer_leaves_tt:0 "The Adventurer departs for [war_adventurer_destination_country.GetName]."
 war_adventurer_stays_tt:0 "The Adventurer remains here."
 war_adventurer_mainlands:0 "Adventurer Mainlands"
