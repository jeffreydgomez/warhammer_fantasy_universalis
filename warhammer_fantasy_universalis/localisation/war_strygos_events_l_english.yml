l_english:

 strygos_events.1000.t:0 "An Oath to Restore Strygos"
 strygos_events.1000.d:0 "A Strigany elder arrives with a chest carried north by her ancestors when Mourkain fell. Inside are a broken palace tile, a list of family names, and a banner she has repaired throughout her life.\n\nHer account names Ushoran as the ruler who made Strygos a kingdom and describes the Greenskin invasion that destroyed it. Each family in the caravan has preserved a different fragment of that history through generations of exile.\n\nThe elder lays them before [Root.Monarch.GetName] and asks for protection for the returning caravans. Beyond the camp, necromancers assemble the dead while warriors study the routes into the Badlands. The descendants of Ushoran's subjects have brought enough witnesses to swear that Strygos will rise again."
 strygos_events.1000.a:0 "Renew the old rites and gather the veterans."

 strygos_events.1.t:0 "The Circlet from the Drowned Tomb"
 strygos_events.1.d:0 "Grave-diggers uncover a blackened circlet beneath the collapsed roof of a flooded tomb. A necromancer notices that its markings resemble diagrams attributed to Kadon and stops the workers from selling it.\n\nWhen his apprentice washes away the mud, nearby bones begin scraping against their burial jars. The necromancer brings the circlet to court in a sealed box and asks where he may examine it safely."
 strygos_events.1.a:0 "Invite outside scholars to study it under supervision."
 strygos_events.1.b:0 "Keep the research secret and isolate the chamber."

 strygos_events.2.t:0 "The Elder with the Family Book"
 strygos_events.2.d:0 "A Strigany caravan reaches our lands with a family book wrapped in layers of oiled cloth. Its elder reads the names of ancestors who fled Strygos and points out the descendants traveling in her wagons. The elder recognizes several names on the local watch roster and asks whether their descendants are still alive.\n\nSeveral young travelers offer their service, while others ask to settle near relatives already under our protection. The elder also brings accounts of graves and ruined settlements that do not appear in our records."
 strygos_events.2.a:0 "Welcome the caravan and accept its recruits on generous terms."
 strygos_events.2.b:0 "Copy the family book and record the lost settlements."
 strygos_events.2.c:0 "Collect a settlement levy and require an oath to the ruler."

 strygos_events.3.t:0 "A Ghoul Claims the Steward's Chair"
 strygos_events.3.d:0 "A ghoul pack leader enters the audience chamber wearing a stolen chain of office. He drives the steward from his chair and declares himself keeper of the royal table.\n\nOther ghouls begin dragging benches into rival arrangements while the living servants flee the room. The actual steward returns with guards and demands that [Root.Monarch.GetName] settle the matter before the next petitioners arrive."
 strygos_events.3.a:0 "Recognize ghoul offices under the ruler's authority."
 strygos_events.3.b:0 "Pay for provisions and drill the packs into useful units."
 strygos_events.3.c:0 "Have the guards restore the steward's authority."

 strygos_events.4.t:0 "The Bones Beneath the Reeds"
 strygos_events.4.d:0 "A draining ditch exposes a field of enormous bones tangled with rusted choppas. A Strigany guide recognizes the place from accounts of the Greenskin invasion that destroyed Strygos.\n\nThe workers uncover broken defenses beneath the skeletons, showing where the old army made its stand. Necromancers and caravan elders arrive together, each demanding custody of the remains before the rains cover them again."
 strygos_events.4.a:0 "Study how the old defenders were overwhelmed."
 strygos_events.4.b:0 "Record the battlefield and the names of the dead."
 strygos_events.4.c:0 "Raise laborers and soldiers from the buried remains."
 strygos_events.4.dd:0 "Share the findings and compare the surviving accounts."

 strygos_events.5.t:0 "Notes in Kadon's Hand"
 strygos_events.5.d:0 "An apprentice pries open a stone chest and finds a necromantic treatise covered in cramped annotations. Her master identifies passages attributed to Kadon, then notices that the skeleton holding the lamp is responding to the words she reads.\n\nThe master stops the reading and orders the chamber sealed. A complete copy could help organize the dead, but news of the discovery has already brought rival scholars to the door demanding access."
 strygos_events.5.a:0 "Use the recovered commands to strengthen our rule."
 strygos_events.5.b:0 "Copy and test the unfamiliar passages."
 strygos_events.5.c:0 "Share controlled copies with trusted foreign scholars."

 strygos_events.6.t:0 "Missing Servants at the Night Court"
 strygos_events.6.d:0 "The palace steward reports that three servants vanished after carrying supper into a vampire's chambers. He found their discarded trays, but the chamber guards refuse to let him search farther.\n\nA kitchen servant identifies one victim's ring among the ashes below the chambers. The steward keeps it wrapped in a cloth, knowing that accusing a vampire requires more than another frightened witness.\n\nOther servants now travel in groups and refuse duties below the main hall. A senior courtier complains that this defiance is disrupting the night court, while the steward brings the missing families' petitions to [Root.Monarch.GetName]."
 strygos_events.6.a:0 "Organize a compulsory blood levy from our subjects."
 strygos_events.6.b:0 "Buy supplies discreetly through outside intermediaries."
 strygos_events.6.c:0 "Admit new armed retainers and let the court feed unchecked."

 strygos_events.7.t:0 "A Cargo Without Questions"
 strygos_events.7.d:0 "A Black Gulf skipper offers to transport sealed coffins, relic chests, and letters without opening them. To prove her discretion, she returns a packet that another captain tried to sell to our rivals.\n\nHer proposed contract reserves several landing places for her crew and names a substantial advance. The harbor official suspects she has other employers, but admits that her charts show routes our own boats rarely use."
 strygos_events.7.a:0 "Grant an exclusive license and assign soldiers to her cargoes."
 strygos_events.7.b:0 "Pay her to carry confidential correspondence."
 strygos_events.7.c:0 "Sell her the seized cargo and end the negotiations."
 strygos_events.7.dd:0 "Recruit her shore crews into our service."

 strygos_events.8.t:0 "The Palace Stones in a Merchant's Cart"
 strygos_events.8.d:0 "A merchant is stopped with carved masonry hidden beneath a load of firewood. A Strigany mason recognizes the pattern as work from the old Palace of Mourkain.\n\nThe merchant leads guards to a half-buried foundation where laborers have been stripping the walls. Enough remains to reconstruct part of the building's plan, and the mason asks for a ruling before the stones are scattered among private houses."
 strygos_events.8.a:0 "Reclaim the stones publicly in the name of Strygos."
 strygos_events.8.b:0 "Have the masons record the palace plan."
 strygos_events.8.c:0 "Sell the recovered stone through the treasury."

 strygos_events.9.t:0 "The Figure in the Ruined Hall"
 strygos_events.9.d:0 "A scavenger returns from an abandoned hall claiming that a monstrous figure called him by his grandfather's name. It wore a broken crown and spoke of Ushoran's court before ordering him away.\n\nThe scavenger's companions refuse to approach the hall again, although none saw the figure clearly. Strigany families gather outside the court asking whether an ancient protector has returned, and the chamberlain demands an answer before the story spreads farther."
 strygos_events.9.a:0 "Seal the hall and preserve the account as received tradition."
 strygos_events.9.b:0 "Send an envoy to learn what the figure wants."
 strygos_events.9.c:0 "Fund a public vigil honoring the lost kings."

 strygos_events.10.t:0 "The Necromancers' Stolen Skeletons"
 strygos_events.10.d:0 "Two necromancers arrive at court with identical lists of skeletons, each accusing the other of stealing an entire work gang. Their apprentices have painted ownership marks on the bones, but rain has washed most of them away.\n\nMeanwhile, the disputed skeletons stand idle beside an unfinished wall. The foreman brings both lists to [Root.Monarch.GetName] and asks for a decision before the next section collapses."
 strygos_events.10.a:0 "Impose a central register, despite the masters' protests."
 strygos_events.10.b:0 "Mediate the dispute and divide the work assignments."
 strygos_events.10.c:0 "Fine both necromancers for obstructing the works."
