l_english:

 albion_hillfires_belenii:0 "Hillfires of the Belenii"
 albion_hillfires_belenii_title:0 "Hillfires of the Belenii"
 albion_hillfires_belenii_desc:0 "The western hills still answer clan before realm, and each beacon fire warns only its own kin. We must make the Belenii hillfires carry one Albionese summons through rain, smoke, and moonlight."
 albion_marsh_paths_boreni:0 "Boreni Marsh Paths"
 albion_marsh_paths_boreni_title:0 "Boreni Marsh Paths"
 albion_marsh_paths_boreni_desc:0 "The Boreni know every path that becomes a drowning place when the mist turns. We must bind their fen-guides to the realm so old footways can move warriors, judges, and warning songs."
 albion_trogland_warnings:0 "Warnings from Trogland"
 albion_trogland_warnings_title:0 "Warnings from Trogland"
 albion_trogland_warnings_desc:0 "Trogland is not empty country; it is a wet ear pressed against the dark. We must place sickle-men, reed horns, and moon-watch cairns there before Fimir raids or darker whispers find us sleeping."
 albion_seal_citadel_lead:0 "Seal the Citadel of Lead"
 albion_seal_citadel_lead_title:0 "Seal the Citadel of Lead"
 albion_seal_citadel_lead_desc:0 "The Citadel of Lead is a wound in the island's memory, and wounds draw hands that should not touch them. We must bind it with walls, warding stones, and law until even bold fools turn away."
 albion_landfall_norsca:0 "Landfall in Norsca"
 albion_landfall_norsca_title:0 "Landfall in Norsca"
 albion_landfall_norsca_desc:0 "Norscan sails have learned the shape of our fog, and raids have followed their lesson. We must land among their cold beaches and show that Albionese cairns can be raised in fjord-spray."
 albion_cairns_fjords:0 "Cairns in the Fjords"
 albion_cairns_fjords_title:0 "Cairns in the Fjords"
 albion_cairns_fjords_desc:0 "The fjords teach hard lessons about storm, knife, and hunger. We must raise stones where raiders once counted us prey, proving that old rites can hold even hostile shores."
 albion_break_raider_harbors:0 "Break the Raider Harbors"
 albion_break_raider_harbors_title:0 "Break the Raider Harbors"
 albion_break_raider_harbors_desc:0 "Norscan harbors fed the ships that found Albion through the mist. We must break their certainty at the waterline and turn their old launch-beaches into warnings."

 albion_truthsayers_moon_oaths:0 "Moon Oaths of the Truthsayers"
 albion_truthsayers_moon_oaths_title:0 "Moon Oaths of the Truthsayers"
 albion_truthsayers_moon_oaths_desc:0 "Truthsayers cannot bind a realm if their moonlit oaths are treated as ornament. We must make the sacred voices useful to chiefs, captains, and common hearths alike."
 albion_rain_moot_estates:0 "The Rain-Moot"
 albion_rain_moot_estates_title:0 "The Rain-Moot"
 albion_rain_moot_estates_desc:0 "The clans, sacred circles, and harbor traders pull Albion in different directions whenever the rain grows loud enough to hide argument. We must gather them under one moot and make shared obligation heavier than old suspicion."
 albion_legitimacy_old_ways:0 "Legitimacy of Old Ways"
 albion_legitimacy_old_ways_title:0 "Legitimacy of Old Ways"
 albion_legitimacy_old_ways_desc:0 "Outsiders call Albion backward because they do not understand what survived here. We must make stone-law, clan memory, and public honor visible enough that no chief mistakes age for weakness."
 albion_moonlit_marriage_clans:0 "Moonlit Clan Marriages"
 albion_moonlit_marriage_clans_title:0 "Moonlit Clan Marriages"
 albion_moonlit_marriage_clans_desc:0 "The clans still remember separate hearths even after they obey one crown. We must marry their rites beneath the moon until old rival kinships become the living grammar of the realm."
 albion_hearthfires_old_world:0 "Hearthfires in the Old World"
 albion_hearthfires_old_world_title:0 "Hearthfires in the Old World"
 albion_hearthfires_old_world_desc:0 "The Old World thinks stone circles cannot travel. We must build an Albionese hearth on its coast and let the locals learn that old customs grow wherever rain, oath, and smoke are allowed to gather."
 albion_cairn_halls_men:0 "Cairn-Halls of Men"
 albion_cairn_halls_men_title:0 "Cairn-Halls of Men"
 albion_cairn_halls_men_desc:0 "Men trust halls, ledgers, and garrisons more readily than wet stones. We must put cairn-law inside forms they understand without letting their habits make us ashamed of our own."
 albion_teach_fear_rain:0 "Teach Fear of Rain"
 albion_teach_fear_rain_title:0 "Teach Fear of Rain"
 albion_teach_fear_rain_desc:0 "The world of men respects thunder once it has broken gates. We must teach them that Albionese rain is not weather alone, but patience, siege, and storm-command given shape."
 albion_sea_claws_old_world_proved:0 "Sea-Claws Proved"
 albion_sea_claws_old_world_proved_title:0 "Sea-Claws Proved"
 albion_sea_claws_old_world_proved_desc:0 "The Old World has measured our customs and found them dangerous. We must turn that lesson into supply lines, strongholds, and veterans who carry the old ways beyond the island."

 albion_gather_mist_moot:0 "Gather the Mist-Moot"
 albion_gather_mist_moot_title:0 "Gather the Mist-Moot"
 albion_gather_mist_moot_desc:0 "Albion is found by fog, not maps, and fog cannot govern by itself. We must gather chiefs, druids, captains, and sworn speakers before outsiders gather us piecemeal."
 albion_raise_cairn_roads:0 "Raise the Cairn-Roads"
 albion_raise_cairn_roads_title:0 "Raise the Cairn-Roads"
 albion_raise_cairn_roads_desc:0 "Mud tracks and memory cannot hold a realm alone. We must raise cairn-roads that old feet, pack carts, and new armies can trust without flattening the island into foreign geometry."
 albion_great_ogham_wakes:0 "The Great Ogham Wakes"
 albion_great_ogham_wakes_title:0 "The Great Ogham Wakes"
 albion_great_ogham_wakes_desc:0 "The Great Ogham does not sleep; it waits for rulers worth answering. We must wake its carved memory without letting ancient power own the living realm."
 albion_crown_beneath_moon:0 "Crown of the Moon"
 albion_crown_beneath_moon_title:0 "Crown of the Moon"
 albion_crown_beneath_moon_desc:0 "The island is one body of rain, stone, and oath, but it needs one public shape before the world believes it. We must crown Albion beneath the moon and claim every coast that laughed at our fog."
 albion_old_ways_take_sea:0 "Old Ways Take Sea"
 albion_old_ways_take_sea_title:0 "Old Ways Take Sea"
 albion_old_ways_take_sea_desc:0 "The sea need not make us modern. We must lash waystones to mast, teach pilots the moon-paths, and make moving water obey customs older than charts."
 albion_mist_road_armada:0 "The Mist-Road Armada"
 albion_mist_road_armada_title:0 "The Mist-Road Armada"
 albion_mist_road_armada_desc:0 "The armada is not a modern navy; it is a moving stone circle with warriors aboard. We must carry enough clansmen, boats, and storm-readers to make foreign landfall more than a tale."
 albion_world_remembers:0 "The World Remembers"
 albion_world_remembers_title:0 "The World Remembers"
 albion_world_remembers_desc:0 "The world has learned to name Albion, but names are often made small in foreign mouths. We must make that name a warning, a rite, and a sea-mark no court can simplify."

 albion_clan_speakers_fires:0 "Clan Speakers by Fire"
 albion_clan_speakers_fires_title:0 "Clan Speakers by Fire"
 albion_clan_speakers_fires_desc:0 "Clan speakers can make old grudges useful or fatal, depending on who hears them first. We must teach the fire-circles to carry one law before private honor becomes public weakness."
 albion_stone_circles_repaired:0 "Repair the Stone Circles"
 albion_stone_circles_repaired_title:0 "Repair the Stone Circles"
 albion_stone_circles_repaired_desc:0 "Broken circles make broken memories, and broken memories invite Dark Emissaries to finish the damage. We must repair enough sacred places that even non-druids fear to neglect them."
 albion_develop_moor_parishes:0 "Moorland Parishes"
 albion_develop_moor_parishes_title:0 "Moorland Parishes"
 albion_develop_moor_parishes_desc:0 "Albion's parishes are wet, poor, and stubborn, which is why they have survived. We must strengthen moorland settlement without sanding away the old edges that keep it ours."
 albion_cairns_as_courts:0 "Cairns as Courts"
 albion_cairns_as_courts_title:0 "Cairns as Courts"
 albion_cairns_as_courts_desc:0 "Cairns can be courts if every oath is witnessed, remembered, and enforced. We must give old law a place to sit where chiefs, traders, and druids can all be answered."
 albion_great_ogham_restored:0 "Restore the Great Ogham"
 albion_great_ogham_restored_title:0 "Restore the Great Ogham"
 albion_great_ogham_restored_desc:0 "Restoring the Great Ogham must mean more than gold on stone. We must make the whole island hear it clearly enough that local quarrels fall silent before older memory."
 albion_white_shores_grey_stones:0 "White Shores, Grey Stones"
 albion_white_shores_grey_stones_title:0 "White Shores, Grey Stones"
 albion_white_shores_grey_stones_desc:0 "Ulthuan's white shores are used to prettier envoys and cleaner claims. We must land with grey stones, moon rites, and rain-black banners until beauty becomes irrelevant."
 albion_obelisks_before_lothern:0 "Obelisks Before Lothern"
 albion_obelisks_before_lothern_title:0 "Obelisks Before Lothern"
 albion_obelisks_before_lothern_desc:0 "Lothern's world is built of towers, treaties, and sea pride. We must raise Albionese obelisks where the Asur can see them and learn that age is not theirs alone."
 albion_moon_inner_sea:0 "Moon Over the Inner Sea"
 albion_moon_inner_sea_title:0 "Moon Over the Inner Sea"
 albion_moon_inner_sea_desc:0 "The Inner Sea has seen Phoenix Kings, Druchii raids, and centuries of elven certainty. We must make it see moonlit Albionese sails and reckon with a cruder wisdom that still works."
 albion_elven_coasts_proved:0 "Ulthuan Coasts Proved"
 albion_elven_coasts_proved_title:0 "Ulthuan Coasts Proved"
 albion_elven_coasts_proved_desc:0 "Ulthuan's courts are certain that Albion should have stayed primitive. We must prove them wrong with shipyards, moonlit routes, and stones that endure their scorn."

 albion_peatwood_keels:0 "Peatwood Keels"
 albion_peatwood_keels_title:0 "Peatwood Keels"
 albion_peatwood_keels_desc:0 "Peatwood boats are not elegant, but they know shallow fog and sullen water. We must make them numerous enough that every inlet can become a road when the mist chooses."
 albion_salt_hide_harbors:0 "Salt-Hide Harbors"
 albion_salt_hide_harbors_title:0 "Salt-Hide Harbors"
 albion_salt_hide_harbors_desc:0 "Salt, hides, and peat-smoke can pay for more than feasts if the harbors obey one hand. We must make Albionese trade useful without letting foreign counting houses teach us self-contempt."
 albion_mist_fleet_muster:0 "Muster the Mist-Fleet"
 albion_mist_fleet_muster_title:0 "Muster the Mist-Fleet"
 albion_mist_fleet_muster_desc:0 "A mist-fleet must be more than boats hiding in fog. We must muster heavy keels and crews that trust old pilots when charts fail and moonlight lies."
 albion_black_coast_landing:0 "The Black Coast Landing"
 albion_black_coast_landing_title:0 "The Black Coast Landing"
 albion_black_coast_landing_desc:0 "Naggaroth is a black coast of iron pride and colder cruelty. We must land there with older stones than their hate and prove that no shore is too cruel for Albionese rites."
 albion_cairns_witchwood:0 "Cairns in the Witchwood"
 albion_cairns_witchwood_title:0 "Cairns in the Witchwood"
 albion_cairns_witchwood_desc:0 "The Witchwood and the cold forests do not welcome strangers, but Albion knows unfriendly trees. We must raise cairns that remember every path home and every ambush paid for in blood."
 albion_cold_hearth_strongholds:0 "Cold Hearth Strongholds"
 albion_cold_hearth_strongholds_title:0 "Cold Hearth Strongholds"
 albion_cold_hearth_strongholds_desc:0 "Naggaroth respects strongholds more than speeches. We must make cold hearths that cannot be dragged away in chains and cannot be laughed out of the snow."

 albion_claims_on_coasts_tt:0 "Gain permanent claims on every coastal province in the Old World, Ulthuan, and Naggaroth."

 albion_events.1101.t:0 "The Great Ogham Wakes"
 albion_events.1101.d:0 "The Great Ogham answers before dawn, when the rain pauses and every carved mark shines as if moonlight has been poured into it. Truthsayers kneel first, then chiefs, then captains who pretend the old fear is only respect.\n\nThe situation is dangerous because old power has woken in a realm that is still learning to stand upright. We must decide whether the Ogham will speak as law, lore, or rite, before every clan hears only the answer it wanted."
 albion_events.1101.a:0 "Let the stones bind law."
 albion_events.1101.b:0 "Let the stones gather lore."
 albion_events.1101.c:0 "Let the stones guard the rites."
 albion_events.1102.t:0 "Crown Beneath the Moon"
 albion_events.1102.d:0 "The clans gather where three rings of stones stand in a field too wet for armies and too old for argument. The crown is not gold alone: it is antler, oath, ship-nail, peat-smoke, and a sickle held edge-down beneath the moon.\n\nThe situation is larger than Albion now, because the island has become one voice and every coast beyond the mist is listening. We must choose whether the new realm is first remembered for its stones, its keels, or its storms."
 albion_events.1102.a:0 "Crown the stones."
 albion_events.1102.b:0 "Crown the keels."
 albion_events.1102.c:0 "Crown the storms."
 albion_events.1103.t:0 "The World Remembers Albion"
 albion_events.1103.d:0 "From Norscan fjords to the Old World coast, from Ulthuan's bright harbors to Naggaroth's black shore, Albionese stones now stand where foreign pride expected only mud and superstition. The rites are rough, the songs are wet with rain, and the roads often look like mistakes until armies pass over them.\n\nThe situation has reversed: the world no longer asks whether Albion can endure discovery, but what discovery will cost those who underestimated it. We must decide which lesson will outlive this age, so the old ways are remembered as strength rather than curiosity."
 albion_events.1103.a:0 "Let the world remember stone."
 albion_events.1103.b:0 "Let the world remember sea."
 albion_events.1103.c:0 "Let the world remember storm."

 albion_mist_moot_mod:0 "Mist-Moot Diplomacy"
 desc_albion_mist_moot_mod:0 "Chiefs, druids, and captains now know which fires to answer before strangers can divide them."
 albion_moon_oaths_mod:0 "Moonlit Truthsayer Oaths"
 desc_albion_moon_oaths_mod:0 "The sacred oaths are spoken in ways that hearths and warbands can both understand."
 albion_clan_speakers_mod:0 "Fire-Circle Speakers"
 desc_albion_clan_speakers_mod:0 "Clan speakers carry one law through local memory instead of letting local memory break the law."
 albion_hillfires_mod:0 "Belenii Hillfire Network"
 desc_albion_hillfires_mod:0 "Western beacons now warn the realm before private fear becomes public disaster."
 albion_cairn_roads_mod:0 "Cairn-Road Crews"
 desc_albion_cairn_roads_mod:0 "Waystones, work gangs, and old foot-path lore make construction faster across the wet island."
 albion_peatwood_keels_mod:0 "Peatwood Keelwrights"
 desc_albion_peatwood_keels_mod:0 "Simple boats built for fog and shoal can be produced cheaply in great number."
 albion_marsh_paths_mod:0 "Boreni Fen-Guides"
 desc_albion_marsh_paths_mod:0 "Enemies who do not know the marsh paths learn that each dry step was chosen for them."
 albion_stone_circles_mod:0 "Repaired Stone Circles"
 desc_albion_stone_circles_mod:0 "Restored circles calm disputes and remind the clans that neglect has a cost."
 albion_rain_moot_mod:0 "Rain-Moot Settlement"
 desc_albion_rain_moot_mod:0 "Estates now argue beneath shared rites, turning quarrel into usable reform."
 albion_ogham_law_mod:0 "Ogham Law"
 desc_albion_ogham_law_mod:0 "The Great Ogham is read as a public memory of law, muting private feuds."
 albion_ogham_lore_mod:0 "Ogham Lore"
 desc_albion_ogham_lore_mod:0 "Truthsayers and record-keepers draw useful patterns from the oldest carved marks."
 albion_ogham_rites_mod:0 "Ogham Rites"
 desc_albion_ogham_rites_mod:0 "Rituals around the Great Ogham make faith feel older, nearer, and harder to deny."
 albion_salt_hide_harbors_mod:0 "Salt-Hide Harbors"
 desc_albion_salt_hide_harbors_mod:0 "Albionese harbors trade in practical goods without surrendering their local customs."
 albion_trogland_warnings_mod:0 "Trogland Reed Warnings"
 desc_albion_trogland_warnings_mod:0 "Reed horns and watch-cairns give the frontier time to close around danger."
 albion_moor_parishes_mod:0 "Stubborn Moor Parishes"
 desc_albion_moor_parishes_mod:0 "Moorland settlements prosper by growing around old habits instead of replacing them."
 albion_citadel_sealed_mod:0 "Sealed Citadel Watch"
 desc_albion_citadel_sealed_mod:0 "The Citadel of Lead is watched by fort-keepers who treat curiosity as a breach."
 albion_old_ways_legitimacy_mod:0 "Legitimacy of the Old Ways"
 desc_albion_old_ways_legitimacy_mod:0 "Albion's old customs now carry visible authority rather than embarrassed survival."
 albion_mist_fleet_mod:0 "Mist-Fleet Muster"
 desc_albion_mist_fleet_mod:0 "Crews and pilots organize around fog routes that outsiders cannot easily read."
 albion_crown_stones_mod:0 "Crown of Stones"
 desc_albion_crown_stones_mod:0 "The crown is seated among stones, giving old law more room to govern."
 albion_crown_keels_mod:0 "Crown of Keels"
 desc_albion_crown_keels_mod:0 "The crown is sworn beside ship-nails and salt, binding the realm to the sea."
 albion_crown_storms_mod:0 "Crown of Storms"
 desc_albion_crown_storms_mod:0 "The crown is named beneath thunder, and warriors hear a promise in the rain."
 albion_cairn_courts_mod:0 "Cairn-Courts"
 desc_albion_cairn_courts_mod:0 "Courts raised beside cairns turn remembered oaths into cheaper administration."
 albion_moonlit_marriage_mod:0 "Moonlit Clan Marriages"
 desc_albion_moonlit_marriage_mod:0 "Marriage rites turn rival hearths into diplomatic bridges between old enemies."
 albion_old_ways_take_sea_mod:0 "Moon-Path Pilots"
 desc_albion_old_ways_take_sea_mod:0 "Albionese pilots preserve naval memory by steering from moon, fog, and inherited warning."
 albion_ogham_restored_mod:0 "Restored Great Ogham"
 desc_albion_ogham_restored_mod:0 "The island's greatest stone now gives religious purpose to the realm's public life."
 albion_mist_road_armada_mod:0 "Mist-Road Armada"
 desc_albion_mist_road_armada_mod:0 "The fleet carries Albion's old waymarks outward, stretching the roads between shores."
 albion_norsca_landfall_mod:0 "Norscan Landfall"
 desc_albion_norsca_landfall_mod:0 "Warriors who stand on Norscan beaches learn that raiders can be reached at home."
 albion_old_world_hearthfires_mod:0 "Old World Hearthfires"
 desc_albion_old_world_hearthfires_mod:0 "Foreign neighbors bargain more carefully when Albionese hearth-law is visible on their coast."
 albion_white_shores_mod:0 "Grey Stones on White Shores"
 desc_albion_white_shores_mod:0 "Ulthuan's harbors now carry rumor of Albionese stones and stubborn ships."
 albion_black_coast_mod:0 "Black Coast Watchers"
 desc_albion_black_coast_mod:0 "Scouts and whisperers learn Druchii roads before the Druchii can choose the battlefield."
 albion_fjord_cairns_mod:0 "Fjord Cairn Strongpoints"
 desc_albion_fjord_cairns_mod:0 "Cairns in the fjords anchor supply and reduce the cost of keeping hostile coasts held."
 albion_cairn_halls_mod:0 "Cairn-Halls"
 desc_albion_cairn_halls_mod:0 "Foreign halls become bearers of Albionese law without pretending to be stone circles."
 albion_lothern_obelisks_mod:0 "Obelisks Before Lothern"
 desc_albion_lothern_obelisks_mod:0 "Elven witnesses now carry tales of Albionese obelisks and the ships that placed them."
 albion_witchwood_cairns_mod:0 "Witchwood Cairns"
 desc_albion_witchwood_cairns_mod:0 "Raised cairns make cold forests easier to hold and harder to raid."
 albion_raider_harbors_broken_mod:0 "Broken Raider Harbors"
 desc_albion_raider_harbors_broken_mod:0 "The fall of raider ports fills the levies with clansmen eager to carry the lesson farther."
 albion_fear_the_rain_mod:0 "Fear of Albionese Rain"
 desc_albion_fear_the_rain_mod:0 "Foreign fortresses now hear rain as a siege engine rather than a comfort."
 albion_inner_sea_moon_mod:0 "Moon Over the Inner Sea"
 desc_albion_inner_sea_moon_mod:0 "Albionese sailors fight harder in waters that once knew only elven certainty."
 albion_cold_hearth_strongholds_mod:0 "Cold Hearth Strongholds"
 desc_albion_cold_hearth_strongholds_mod:0 "Forts in Naggaroth are treated as hearths: supplied, defended, and never abandoned lightly."
 albion_sea_claws_old_world_mod:0 "Sea-Claws of the Old World"
 desc_albion_sea_claws_old_world_mod:0 "Norscan and Old World holdings supply one another through proven coastal routes."
 albion_elven_coasts_proved_mod:0 "Ulthuan Coasts Proved"
 desc_albion_elven_coasts_proved_mod:0 "Shipwrights on Ulthuan's shores now repair Albionese hulls as facts, not insults."
 albion_world_remembers_stone_mod:0 "The World Remembers Stone"
 desc_albion_world_remembers_stone_mod:0 "Albion's lasting lesson is stone-law: stubborn, defensive, and older than mockery."
 albion_world_remembers_sea_mod:0 "The World Remembers Sea"
 desc_albion_world_remembers_sea_mod:0 "Albion's lasting lesson is sea-memory: fog roads, cheap hulls, and moon-path pilots."
 albion_world_remembers_storm_mod:0 "The World Remembers Storm"
 desc_albion_world_remembers_storm_mod:0 "Albion's lasting lesson is storm-war: thunder on land, rain at the walls, and old fury made disciplined."
