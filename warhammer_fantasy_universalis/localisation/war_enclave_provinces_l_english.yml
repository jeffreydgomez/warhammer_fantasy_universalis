l_english:
 war_enclave_Y00:0 "Zacharias' Domain Enclave"
 desc_war_enclave_Y00:0 "Zacharias the Everliving commands the dead from a hidden tower in the Forest of Shadows. Once the pupil of the Necrarch Melkhior, he coveted his master's forbidden books and wrested the tower from him through necromantic war. Now corpse-bearing servants pass beneath the trees, and the settlements around his refuge supply unwilling subjects for experiments intended to outlast the living world."
 war_root_out_Y00_title:0 "Root Out Zacharias' Domain"
 war_root_out_Y00_desc:0 "Zacharias the Everliving commands the dead from a hidden tower in the Forest of Shadows. Once the pupil of the Necrarch Melkhior, he coveted his master's forbidden books and wrested the tower from him through necromantic war. Now corpse-bearing servants pass beneath the trees, and the settlements around his refuge supply unwilling subjects for experiments intended to outlast the living world.\n\nFind the paths used by Zacharias' servants and carry the war to his tower. Every burial left within his reach adds to the army we must face. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y01:0 "Dieter Helsnicht's Domain Enclave"
 desc_war_enclave_Y01:0 "Dieter Helsnicht, the Doom Lord of Middenheim, broods in a concealed stronghold in the forests around Ferlangen. In 2499, Valmir von Raukov defeated him at the Battle of Wolfen River, but the necromancer survived to gather the dead once more. His servants strip graves and waylay travelers, rebuilding the host with which he means to avenge another humiliation at Imperial hands."
 war_root_out_Y01_title:0 "Root Out Dieter Helsnicht's Domain"
 war_root_out_Y01_desc:0 "Dieter Helsnicht, the Doom Lord of Middenheim, broods in a concealed stronghold in the forests around Ferlangen. In 2499, Valmir von Raukov defeated him at the Battle of Wolfen River, but the necromancer survived to gather the dead once more. His servants strip graves and waylay travelers, rebuilding the host with which he means to avenge another humiliation at Imperial hands.\n\nSearch the forest approaches and break Helsnicht's hold over the surrounding burial grounds. We must confront his growing host before he chooses the hour of his return. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y02:0 "Cluster Eye Tribe Enclave"
 desc_war_enclave_Y02:0 "Vish Venombarb leads the Cluster Eye Tribe through the spider-haunted woods of Deinste, near the approaches to the Black Pit. An experienced slaver, he trades captured humans and Ungors to the Night Goblins who dwell below. His Forest Goblins ride enormous spiders through branches no patrol can easily reach, carrying villagers away to the tribe's pens and sacred feeding grounds."
 war_root_out_Y02_title:0 "Root Out Cluster Eye Tribe"
 war_root_out_Y02_desc:0 "Vish Venombarb leads the Cluster Eye Tribe through the spider-haunted woods of Deinste, near the approaches to the Black Pit. An experienced slaver, he trades captured humans and Ungors to the Night Goblins who dwell below. His Forest Goblins ride enormous spiders through branches no patrol can easily reach, carrying villagers away to the tribe's pens and sacred feeding grounds.\n\nTrack the slavers to their webbed camps and cut the routes leading to the Black Pit. Venombarb's spider-riders will come down from the canopy to defend their hunting ground. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y03:0 "Brass Keep Enclave"
 desc_war_enclave_Y03:0 "Brass Keep rises above the approaches to Dripping Peak, sheltering a Nurglite garrison among the Middle Mountains. Egil Rusthand's Bjornling warriors endure behind its foul walls, emerging to seize provisions and drag captives uphill. Below them, abandoned farms and diseased livestock mark the reach of a fortress whose strength grows wherever fear keeps our patrols away."
 war_root_out_Y03_title:0 "Root Out Brass Keep"
 war_root_out_Y03_desc:0 "Brass Keep rises above the approaches to Dripping Peak, sheltering a Nurglite garrison among the Middle Mountains. Egil Rusthand's Bjornling warriors endure behind its foul walls, emerging to seize provisions and drag captives uphill. Below them, abandoned farms and diseased livestock mark the reach of a fortress whose strength grows wherever fear keeps our patrols away.\n\nClear the mountain approaches and bring Rusthand's garrison out from behind the walls. Leaving the keep undisturbed only gives its raiders more villages to empty. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y04:0 "House von Wittgenstein Enclave"
 desc_war_enclave_Y04:0 "Above Wittgendorf, the von Wittgensteins shelter behind the rights of an ancient barony. Dagmar brought a warpstone meteorite to the castle in 2402; the family withdrew from society as corruption spread through its estate. Margritte now pursues necromantic experiments behind the gates, while the villagers below bear the hunger, mutation, and disappearances that noble privilege conceals."
 war_root_out_Y04_title:0 "Root Out House von Wittgenstein"
 war_root_out_Y04_desc:0 "Above Wittgendorf, the von Wittgensteins shelter behind the rights of an ancient barony. Dagmar brought a warpstone meteorite to the castle in 2402; the family withdrew from society as corruption spread through its estate. Margritte now pursues necromantic experiments behind the gates, while the villagers below bear the hunger, mutation, and disappearances that noble privilege conceals.\n\nOpen the castle to investigation by force and dismantle Margritte's laboratories. The household's guards and monstrous servants will defend the secrets that have poisoned Wittgendorf. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y05:0 "Cult of the Red Crown Enclave"
 desc_war_enclave_Y05:0 "The Red Crown maintains a hidden foothold in the woods around Delberz. Its Master of Change directs scattered sorcerers and apprentices who shelter mutants and bargain with Beastmen in the name of Tzeentch. Those rescued from the witch hunters become recruits for a greater rising, while messengers carry forbidden teachings between forest camps and unsuspecting towns."
 war_root_out_Y05_title:0 "Root Out Cult of the Red Crown"
 war_root_out_Y05_desc:0 "The Red Crown maintains a hidden foothold in the woods around Delberz. Its Master of Change directs scattered sorcerers and apprentices who shelter mutants and bargain with Beastmen in the name of Tzeentch. Those rescued from the witch hunters become recruits for a greater rising, while messengers carry forbidden teachings between forest camps and unsuspecting towns.\n\nSeize the cult's messengers and strike its forest meeting places. Exposing the network will drive its sorcerers, mutants, and Beastmen into open revolt. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y06:0 "Slugtongue's Warherd Enclave"
 desc_war_enclave_Y06:0 "Slugtongue's warherd lurks beneath the diseased boughs of Nattern Forest. Vermin crawl through the Bray-Shaman's ruined body, and his passing brings failed harvests, dying herds, and the hunger that empties villages. His Beastmen watch the roads for starving refugees and supply wagons, striking when famine has weakened those who would otherwise drive them from the woods."
 war_root_out_Y06_title:0 "Root Out Slugtongue's Warherd"
 war_root_out_Y06_desc:0 "Slugtongue's warherd lurks beneath the diseased boughs of Nattern Forest. Vermin crawl through the Bray-Shaman's ruined body, and his passing brings failed harvests, dying herds, and the hunger that empties villages. His Beastmen watch the roads for starving refugees and supply wagons, striking when famine has weakened those who would otherwise drive them from the woods.\n\nHunt down the warherd's camps and protect the roads into the stricken countryside. Slugtongue's followers must be brought to battle before another harvest withers. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y07:0 "Drycha's Wargrove Enclave"
 desc_war_enclave_Y07:0 "Drycha gathers embittered forest spirits in the Gryphon Wood around Borkum. The Branchwraith despises the Elves' claim to rule the forests and sees human clearings as another wound cut into living wood. Her dryads stalk the margins of farms and logging camps, leaving torn bodies among the roots as a warning against the next axe or plough."
 war_root_out_Y07_title:0 "Root Out Drycha's Wargrove"
 war_root_out_Y07_desc:0 "Drycha gathers embittered forest spirits in the Gryphon Wood around Borkum. The Branchwraith despises the Elves' claim to rule the forests and sees human clearings as another wound cut into living wood. Her dryads stalk the margins of farms and logging camps, leaving torn bodies among the roots as a warning against the next axe or plough.\n\nAdvance into the wargrove and break the spirits' hold over its approaches. Drycha will answer an intrusion into her refuge with every root and claw at her command. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y08:0 "Morghur's Warherd Enclave"
 desc_war_enclave_Y08:0 "Morghur the Shadowgave haunts the Forest of Arden around Beaussons, drawing Beastmen to the corruption that seeps from his presence. Trees twist, flesh changes, and the boundaries between beast and man lose their meaning wherever he lingers. His warherd descends on Bretonnian settlements for slaughter and sacrifice, then withdraws into woodland that grows more hostile with every passing season."
 war_root_out_Y08_title:0 "Root Out Morghur's Warherd"
 war_root_out_Y08_desc:0 "Morghur the Shadowgave haunts the Forest of Arden around Beaussons, drawing Beastmen to the corruption that seeps from his presence. Trees twist, flesh changes, and the boundaries between beast and man lose their meaning wherever he lingers. His warherd descends on Bretonnian settlements for slaughter and sacrifice, then withdraws into woodland that grows more hostile with every passing season.\n\nDrive the warherd from its gathering places and cut a path through the corrupted forest. Morghur's beasts will rally against any force that approaches their living idol. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y09:0 "Red Duke's Exiles Enclave"
 desc_war_enclave_Y09:0 "The Red Duke keeps an exiled court in Derrevin Libre, nursing his claim to Aquitaine. He returned from the crusades as a vampire and was defeated and entombed after Ceren Field in 1454, but the grave failed to hold him. His undead retainers now raid the countryside, turning an ancient knightly grievance into a war that the living must fight again."
 war_root_out_Y09_title:0 "Root Out Red Duke's Exiles"
 war_root_out_Y09_desc:0 "The Red Duke keeps an exiled court in Derrevin Libre, nursing his claim to Aquitaine. He returned from the crusades as a vampire and was defeated and entombed after Ceren Field in 1454, but the grave failed to hold him. His undead retainers now raid the countryside, turning an ancient knightly grievance into a war that the living must fight again.\n\nBreak the exile court and confront the Duke's retainers on their own ground. Aquitaine's old tragedy will continue to claim new dead while his refuge endures. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y10:0 "Aucassin's Household Enclave"
 desc_war_enclave_Y10:0 "Aucassin's household extends its influence into Yremy from the courtly world of Mousillon. At Chateau Hane, the vampire presides over poetry, fine furnishings, and the traffic across the Grismerie; his gracious manners persuade many guests to overlook what sustains him. Wealth buys discretion and fresh victims, while armed retainers ensure that the surrounding villages continue to serve their elegant predator."
 war_root_out_Y10_title:0 "Root Out Aucassin's Household"
 war_root_out_Y10_desc:0 "Aucassin's household extends its influence into Yremy from the courtly world of Mousillon. At Chateau Hane, the vampire presides over poetry, fine furnishings, and the traffic across the Grismerie; his gracious manners persuade many guests to overlook what sustains him. Wealth buys discretion and fresh victims, while armed retainers ensure that the surrounding villages continue to serve their elegant predator.\n\nStrip away the household's protection and confront the retainers who keep its victims silent. Aucassin's courtesies will offer little shelter once his feeding grounds are threatened. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y11:0 "Brachnar's Laboratory Enclave"
 desc_war_enclave_Y11:0 "Brachnar the Damned hides his experiments in Montlac, still consumed by hatred of Heinrich Kemmler. The Lichemaster reduced him to dust in 2424, but an unwitting hedge wizard restored him in 2464; in 2480, Brachnar ambushed his old enemy in the Vaults. His servants now gather corpses and occult supplies for the next reckoning, leaving the neighboring settlements to pay for his patience."
 war_root_out_Y11_title:0 "Root Out Brachnar's Laboratory"
 war_root_out_Y11_desc:0 "Brachnar the Damned hides his experiments in Montlac, still consumed by hatred of Heinrich Kemmler. The Lichemaster reduced him to dust in 2424, but an unwitting hedge wizard restored him in 2464; in 2480, Brachnar ambushed his old enemy in the Vaults. His servants now gather corpses and occult supplies for the next reckoning, leaving the neighboring settlements to pay for his patience.\n\nSeize the laboratory and scatter the servants gathering Brachnar's next army. His feud with Kemmler has already outlived generations of bystanders. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y12:0 "Bowmen of Bergerac Enclave"
 desc_war_enclave_Y12:0 "Bertrand the Brigand shelters the Bowmen of Bergerac among the woods and vineyards of Vignoble. A ploughman who took up the bow when his lord's heir would not defend the peasants, he slew the monster of Chateau Mal and refused to settle into a knight's life. His followers protect common folk and strike at abusive nobles, making them heroes to villagers and outlaws to the authorities they defy."
 war_root_out_Y12_title:0 "Root Out Bowmen of Bergerac"
 war_root_out_Y12_desc:0 "Bertrand the Brigand shelters the Bowmen of Bergerac among the woods and vineyards of Vignoble. A ploughman who took up the bow when his lord's heir would not defend the peasants, he slew the monster of Chateau Mal and refused to settle into a knight's life. His followers protect common folk and strike at abusive nobles, making them heroes to villagers and outlaws to the authorities they defy.\n\nSurround the bowmen's refuge and enforce our authority over the roads they patrol. Bertrand's archers and the villagers who shelter them will resist the destruction of their haven. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y13:0 "Coeddil's Wildwood Enclave"
 desc_war_enclave_Y13:0 "Coeddil remains imprisoned within the Cythral Forest, behind the waystones that contain the Wildwood. After he attacked the King's Glade to prevent Orion's rebirth, Ariel defeated the ancient Treeman and bound him with his followers. The spirits within still nurse their hatred of Elven rule, and every disturbance of the boundary risks giving that ancient fury a path into the world."
 war_root_out_Y13_title:0 "Root Out Coeddil's Wildwood"
 war_root_out_Y13_desc:0 "Coeddil remains imprisoned within the Cythral Forest, behind the waystones that contain the Wildwood. After he attacked the King's Glade to prevent Orion's rebirth, Ariel defeated the ancient Treeman and bound him with his followers. The spirits within still nurse their hatred of Elven rule, and every disturbance of the boundary risks giving that ancient fury a path into the world.\n\nEnter the forbidden glades and confront the spirits behind the waystones. An assault on their prison will bring Coeddil's followers into battle at its boundaries. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y14:0 "Knights of Irrana Enclave"
 desc_war_enclave_Y14:0 "The Knights of Irrana maintain a blood-hungry brotherhood in Llaqueno under Armand de Sangrivage. Their order abandoned Myrmidia when its Grand Master judged Abhorash's martial teachings greater and led his knights into undeath. They still observe the forms of knightly honor, but their challenges, demands for tribute, and search for worthy recruits leave the surrounding countryside at the mercy of immortal warriors."
 war_root_out_Y14_title:0 "Root Out Knights of Irrana"
 war_root_out_Y14_desc:0 "The Knights of Irrana maintain a blood-hungry brotherhood in Llaqueno under Armand de Sangrivage. Their order abandoned Myrmidia when its Grand Master judged Abhorash's martial teachings greater and led his knights into undeath. They still observe the forms of knightly honor, but their challenges, demands for tribute, and search for worthy recruits leave the surrounding countryside at the mercy of immortal warriors.\n\nChallenge the brotherhood's claim to tribute and march against its chapter house. The knights will welcome a battle worthy of their weapons and their pride. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y15:0 "Long Drong's Anchorage Enclave"
 desc_war_enclave_Y15:0 "Long Drong's Slayer Pirates keep their powder, plunder, and repaired hulls at Caprio. The captain and his crew took the Slayer oath after the loss of the Barrel of Ale and its precious Dwarf brew, then seized the pirate ship they rebuilt as the Fair Fregar. Their anchorage supports voyages in pursuit of treasure, pay chests, and a death worthy of their shame."
 war_root_out_Y15_title:0 "Root Out Long Drong's Anchorage"
 war_root_out_Y15_desc:0 "Long Drong's Slayer Pirates keep their powder, plunder, and repaired hulls at Caprio. The captain and his crew took the Slayer oath after the loss of the Barrel of Ale and its precious Dwarf brew, then seized the pirate ship they rebuilt as the Fair Fregar. Their anchorage supports voyages in pursuit of treasure, pay chests, and a death worthy of their shame.\n\nTake the anchorage and deny the Slayer Pirates their stores and landing places. Drong's crew have sworn to seek death in battle, giving them little reason to surrender. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y16:0 "Shadewraith Haven Enclave"
 desc_war_enclave_Y16:0 "Vangheist's spectral crew haunts the coast of Grotta, where the Shadewraith finds shelter beyond the reach of ordinary harbor law. The ghost ship and its dead sailors bring terror to sea lanes that living captains must still navigate. Wreckage and abandoned landing places mark their shoreward reach, while the promise of lost cargo draws fresh victims toward the haven."
 war_root_out_Y16_title:0 "Root Out Shadewraith Haven"
 war_root_out_Y16_desc:0 "Vangheist's spectral crew haunts the coast of Grotta, where the Shadewraith finds shelter beyond the reach of ordinary harbor law. The ghost ship and its dead sailors bring terror to sea lanes that living captains must still navigate. Wreckage and abandoned landing places mark their shoreward reach, while the promise of lost cargo draws fresh victims toward the haven.\n\nSecure the haunted shore and confront the dead where their raids reach land. Vangheist's crew will not abandon its refuge simply because a living ruler commands it. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y17:0 "Golgfag's Winter Camp Enclave"
 desc_war_enclave_Y17:0 "Golgfag Maneater has established a winter camp near Heldegrad, bringing veteran Ogres and enormous appetites into the Border Princes. The famous mercenary sells his strength wherever the bargain suits him, and rival rulers court his company while fearing its upkeep. His followers demand meat, shelter, and payment from nearby settlements; a village that cannot supply the camp may become its next meal."
 war_root_out_Y17_title:0 "Root Out Golgfag's Winter Camp"
 war_root_out_Y17_desc:0 "Golgfag Maneater has established a winter camp near Heldegrad, bringing veteran Ogres and enormous appetites into the Border Princes. The famous mercenary sells his strength wherever the bargain suits him, and rival rulers court his company while fearing its upkeep. His followers demand meat, shelter, and payment from nearby settlements; a village that cannot supply the camp may become its next meal.\n\nEnd Golgfag's demands and force his company out of its winter quarters. The Maneaters will treat an eviction as another battle for which the countryside must pay. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y18:0 "Wintertooth Enclave"
 desc_war_enclave_Y18:0 "Throgg rules from the Lair of the Troll King, gathering creatures that human warlords normally hunt, enslave, or drive before their armies. His unnatural intelligence allows him to turn a Troll's hunger and strength toward ambitions his brutish kin could never imagine. Trolls and other monsters answer his summons, raiding the neighboring lands as he prepares a world in which mankind is the prey."
 war_root_out_Y18_title:0 "Root Out Wintertooth"
 war_root_out_Y18_desc:0 "Throgg rules from the Lair of the Troll King, gathering creatures that human warlords normally hunt, enslave, or drive before their armies. His unnatural intelligence allows him to turn a Troll's hunger and strength toward ambitions his brutish kin could never imagine. Trolls and other monsters answer his summons, raiding the neighboring lands as he prepares a world in which mankind is the prey.\n\nMarch on the Troll King's lair and break the gathering before it becomes a greater host. Throgg understands the threat and will summon his monsters to meet it. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y19:0 "Beasts of Telldros Enclave"
 desc_war_enclave_Y19:0 "The Beasts of Telldros range from Skraevold under the Dragon Ogre Kharzulg Stormscar. Their warband descends from the monsters that survived Telldros' defeat at Icicle Pass, when Dragon Ogres rallied the scattered spawn and other creatures into a vengeful pack. Markus Wulfhart hunted the beasts across Norsca in 2501 without bringing them to heel; their raids still leave shattered camps and stripped carcasses behind."
 war_root_out_Y19_title:0 "Root Out Beasts of Telldros"
 war_root_out_Y19_desc:0 "The Beasts of Telldros range from Skraevold under the Dragon Ogre Kharzulg Stormscar. Their warband descends from the monsters that survived Telldros' defeat at Icicle Pass, when Dragon Ogres rallied the scattered spawn and other creatures into a vengeful pack. Markus Wulfhart hunted the beasts across Norsca in 2501 without bringing them to heel; their raids still leave shattered camps and stripped carcasses behind.\n\nTrack the beasts to their gathering ground and force the elusive pack to stand. Stormscar's monsters will turn on the hunters once retreat is cut off. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y20:0 "Sog'Kog's Feeding Ground Enclave"
 desc_war_enclave_Y20:0 "The two-headed mutant Troll Sog'Kog feeds in the country around Fort Straghov. Scavengers and lesser brutes gather in the wake of his kills, turning a single monster's hunting ground into a refuge for creatures driven from settled lands. Livestock, baggage animals, and isolated travelers disappear along the approaches, while the fort's name offers little comfort to those beyond its walls."
 war_root_out_Y20_title:0 "Root Out Sog'Kog's Feeding Ground"
 war_root_out_Y20_desc:0 "The two-headed mutant Troll Sog'Kog feeds in the country around Fort Straghov. Scavengers and lesser brutes gather in the wake of his kills, turning a single monster's hunting ground into a refuge for creatures driven from settled lands. Livestock, baggage animals, and isolated travelers disappear along the approaches, while the fort's name offers little comfort to those beyond its walls.\n\nClear the feeding grounds and drive Sog'Kog's followers from the approaches to the fort. The Troll and his scavengers will fight for a territory that keeps them fed. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y21:0 "Black Ogham Circle Enclave"
 desc_war_enclave_Y21:0 "Maelor Blackreed's Dark Emissaries hold a hidden circle of standing stones near Dunnok. They corrupt Albion's sacred sites with captive sacrifices, seeking to turn the old powers of the island against its Truthsayers. Bog paths carry prisoners into the mist, and the settlements around the circle learn that the stones which once guarded their land now shelter its enemies."
 war_root_out_Y21_title:0 "Root Out Black Ogham Circle"
 war_root_out_Y21_desc:0 "Maelor Blackreed's Dark Emissaries hold a hidden circle of standing stones near Dunnok. They corrupt Albion's sacred sites with captive sacrifices, seeking to turn the old powers of the island against its Truthsayers. Bog paths carry prisoners into the mist, and the settlements around the circle learn that the stones which once guarded their land now shelter its enemies.\n\nFind the paths to the corrupted circle and interrupt its rites. Blackreed's servants will gather around the stones to defend the power they have stolen. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y22:0 "Brothers' Giant Moot Enclave"
 desc_war_enclave_Y22:0 "Bologs and his brother Cachtorr have become the center of a Giant gathering in Everpeak. Other wandering Giants meet them among the heights, where old stones and open pasture offer space for feasting far from human walls. Nearby communities surrender cattle to keep the brothers content, but each new guest at the moot brings another appetite that tribute must satisfy."
 war_root_out_Y22_title:0 "Root Out Brothers' Giant Moot"
 war_root_out_Y22_desc:0 "Bologs and his brother Cachtorr have become the center of a Giant gathering in Everpeak. Other wandering Giants meet them among the heights, where old stones and open pasture offer space for feasting far from human walls. Nearby communities surrender cattle to keep the brothers content, but each new guest at the moot brings another appetite that tribute must satisfy.\n\nRefuse the Giants' demands and move against the gathering in the heights. Bologs and Cachtorr will call their companions down to defend their feast grounds. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y23:0 "Rime-Eater Clans Enclave"
 desc_war_enclave_Y23:0 "Hrogg Rimehide leads the Rime-Eater Clans through the snows of Mount Hellspire. These Ymir beastfolk shelter in frozen passes above the Norse settlements, descending when storms hide their movement. Stolen livestock sustains their camps, while attacks on mines and mountain caravans prevent the lowland chiefs from claiming the routes they regard as their own."
 war_root_out_Y23_title:0 "Root Out Rime-Eater Clans"
 war_root_out_Y23_desc:0 "Hrogg Rimehide leads the Rime-Eater Clans through the snows of Mount Hellspire. These Ymir beastfolk shelter in frozen passes above the Norse settlements, descending when storms hide their movement. Stolen livestock sustains their camps, while attacks on mines and mountain caravans prevent the lowland chiefs from claiming the routes they regard as their own.\n\nSecure the snowbound tracks and force Rimehide's clans from their shelters. They will gather to defend the passes that feed them through the long winter. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y24:0 "Rabidscar Remnant Enclave"
 desc_war_enclave_Y24:0 "Furblak's Rabidscar remnant gnaws at the tunnels around Snag. The clan once held power in the Black Chasm, but internal strife drove its ruler and his followers into exile. They have returned to the underways with old grudges and too few resources, stealing supplies and murdering rivals as Furblak searches for a route back to the seat he lost."
 war_root_out_Y24_title:0 "Root Out Rabidscar Remnant"
 war_root_out_Y24_desc:0 "Furblak's Rabidscar remnant gnaws at the tunnels around Snag. The clan once held power in the Black Chasm, but internal strife drove its ruler and his followers into exile. They have returned to the underways with old grudges and too few resources, stealing supplies and murdering rivals as Furblak searches for a route back to the seat he lost.\n\nSeal the remnant's supply tunnels and advance on Furblak's refuge. Cornering the exiles will bring their struggle for survival into open war. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y25:0 "Drachenfels Restorationists Enclave"
 desc_war_enclave_Y25:0 "Albrecht Gravenhorst gathers necromancers and tomb robbers within Castle Drachenfels. His followers seek to restore the dread associated with its former master, scavenging the ruins for instruments of torment and scraps of forbidden learning. Captives vanish behind the broken walls, and the neighboring countryside finds that a ruined fortress can still command obedience when its cellars hold the dead."
 war_root_out_Y25_title:0 "Root Out Drachenfels Restorationists"
 war_root_out_Y25_desc:0 "Albrecht Gravenhorst gathers necromancers and tomb robbers within Castle Drachenfels. His followers seek to restore the dread associated with its former master, scavenging the ruins for instruments of torment and scraps of forbidden learning. Captives vanish behind the broken walls, and the neighboring countryside finds that a ruined fortress can still command obedience when its cellars hold the dead.\n\nEnter the ruins and destroy Gravenhorst's gathering before the castle becomes a seat of terror again. The cult will defend both its refuge and the relics buried within it. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y26:0 "Ember-Script Heretics Enclave"
 desc_war_enclave_Y26:0 "Durgan Emberbrand's renegade Dwarfs work hidden forges beneath Vogg. Having turned from the Ancestor Gods to Hashut, they carve forbidden runes and bind spirits into engines that orthodox Runesmiths would condemn. Stolen tools, ore, and captives keep the workshops burning, while raiding parties descend on neighboring mines to obtain what honest trade will no longer provide."
 war_root_out_Y26_title:0 "Root Out Ember-Script Heretics"
 war_root_out_Y26_desc:0 "Durgan Emberbrand's renegade Dwarfs work hidden forges beneath Vogg. Having turned from the Ancestor Gods to Hashut, they carve forbidden runes and bind spirits into engines that orthodox Runesmiths would condemn. Stolen tools, ore, and captives keep the workshops burning, while raiding parties descend on neighboring mines to obtain what honest trade will no longer provide.\n\nLocate the hidden furnaces and break Emberbrand's workshops. His smiths and guards will fight to preserve the forbidden craft for which they abandoned their kin. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y27:0 "Badwater Hagdom Enclave"
 desc_war_enclave_Y27:0 "Grulma Bogbelly rules a River Troll gathering in the flooded hollows of Felwing Cave. The hag's followers watch the Blight Water crossings from reed beds and foul pools, overturning rafts and dragging pack animals beneath the surface. Caravans that survive the river must still pass the trails to her lair, where discarded cargo and gnawed bones mark the cost of her appetite."
 war_root_out_Y27_title:0 "Root Out Badwater Hagdom"
 war_root_out_Y27_desc:0 "Grulma Bogbelly rules a River Troll gathering in the flooded hollows of Felwing Cave. The hag's followers watch the Blight Water crossings from reed beds and foul pools, overturning rafts and dragging pack animals beneath the surface. Caravans that survive the river must still pass the trails to her lair, where discarded cargo and gnawed bones mark the cost of her appetite.\n\nClear the crossings and drive the Trolls back upon their flooded refuge. Grulma's brood will emerge to defend the river approaches that supply its food. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y28:0 "Boglar-Fimir Compact Enclave"
 desc_war_enclave_Y28:0 "In Stinkwater Fen, Skibbit Mireclaw's Boglars share their refuge with Fimir who cloak the marsh in concealing mist. The Goblins prepare traps and hidden paths while their larger allies strike from waters too deep for ordinary patrols. Their uneasy compact survives on plunder, drawing captives and supplies from Orc camps, passing armies, and the margins of nearby settlements."
 war_root_out_Y28_title:0 "Root Out Boglar-Fimir Compact"
 war_root_out_Y28_desc:0 "In Stinkwater Fen, Skibbit Mireclaw's Boglars share their refuge with Fimir who cloak the marsh in concealing mist. The Goblins prepare traps and hidden paths while their larger allies strike from waters too deep for ordinary patrols. Their uneasy compact survives on plunder, drawing captives and supplies from Orc camps, passing armies, and the margins of nearby settlements.\n\nMap the safe approaches and attack the compact's marsh camps. Boglar traps and Fimir raiders will bar the way once the enclave is threatened. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y29:0 "Black Lantern Prospectors Enclave"
 desc_war_enclave_Y29:0 "Borri Graveshaft's dead miners still work the abandoned seams of Redstone Underpass. Lanterns move through galleries that living Dwarfs have long since forsaken, and the sound of picks continues without rest or shift change. The prospectors seize ore, tools, and bodies from neighboring workings, pressing each new acquisition into a mining enterprise whose laborers are never allowed to leave."
 war_root_out_Y29_title:0 "Root Out Black Lantern Prospectors"
 war_root_out_Y29_desc:0 "Borri Graveshaft's dead miners still work the abandoned seams of Redstone Underpass. Lanterns move through galleries that living Dwarfs have long since forsaken, and the sound of picks continues without rest or shift change. The prospectors seize ore, tools, and bodies from neighboring workings, pressing each new acquisition into a mining enterprise whose laborers are never allowed to leave.\n\nDescend into the abandoned workings and halt the corpse crews. Graveshaft will send his dead to defend the galleries and seize replacements for those we destroy. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y30:0 "Golden Magus' Refuge Enclave"
 desc_war_enclave_Y30:0 "The Golden Magus keeps a corsair refuge in Al-Qayid, where stolen cargo pays for sorcery and the service of bound djinn. His reputation as a master of spirits draws sailors who would rather bargain with an uncanny patron than submit to the Prophet's laws. From these sheltered landings, his followers prey on coastal trade and defy the One Faith's condemnation of their pacts."
 war_root_out_Y30_title:0 "Root Out Golden Magus' Refuge"
 war_root_out_Y30_desc:0 "The Golden Magus keeps a corsair refuge in Al-Qayid, where stolen cargo pays for sorcery and the service of bound djinn. His reputation as a master of spirits draws sailors who would rather bargain with an uncanny patron than submit to the Prophet's laws. From these sheltered landings, his followers prey on coastal trade and defy the One Faith's condemnation of their pacts.\n\nClose the corsair landings and confront the Magus' servants ashore. The haven's sailors and spirit-bound defenders will resist the loss of their refuge. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y31:0 "Alhazred's Observatory Enclave"
 desc_war_enclave_Y31:0 "Abdul Alhazred studies forbidden lore in an observatory at Sharikah. Once educated alongside a Caliph's sons, the Mad Sorcerer became obsessed with Nehekhara, stole an artifact from his patron, and sought knowledge among its ruined cities. Here his disciples pursue necromancy and bargains with djinn, hiding books and experiments that the followers of Anmar Fakir would consign to the flames."
 war_root_out_Y31_title:0 "Root Out Alhazred's Observatory"
 war_root_out_Y31_desc:0 "Abdul Alhazred studies forbidden lore in an observatory at Sharikah. Once educated alongside a Caliph's sons, the Mad Sorcerer became obsessed with Nehekhara, stole an artifact from his patron, and sought knowledge among its ruined cities. Here his disciples pursue necromancy and bargains with djinn, hiding books and experiments that the followers of Anmar Fakir would consign to the flames.\n\nSeize the observatory and the routes by which its disciples obtain their supplies. Alhazred's followers will defend the forbidden library with the arts learned within it. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y32:0 "Moon-Well Keepers Enclave"
 desc_war_enclave_Y32:0 "Nadir al-Qamar's Moon-Well Keepers guard the old shrines of Zafira Oasis. They preserve the rites of Nehekhara's gods and reject the Prophet's demand that those devotions yield to the One Faith. Pilgrims and fugitives find shelter behind their walls, while missionaries and tax collectors meet closed gates and armed worshippers prepared to defend the sacred wells."
 war_root_out_Y32_title:0 "Root Out Moon-Well Keepers"
 war_root_out_Y32_desc:0 "Nadir al-Qamar's Moon-Well Keepers guard the old shrines of Zafira Oasis. They preserve the rites of Nehekhara's gods and reject the Prophet's demand that those devotions yield to the One Faith. Pilgrims and fugitives find shelter behind their walls, while missionaries and tax collectors meet closed gates and armed worshippers prepared to defend the sacred wells.\n\nBring the shrine compounds under our authority and end the keepers' control of the oasis. Their devotees will take up arms rather than surrender the wells and their ancestral rites. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y33:0 "Free Spears of the Copper Dunes Enclave"
 desc_war_enclave_Y33:0 "Hamid al-Nahas leads escaped soldiers and slaves from a fortified refuge near Dhiban. His Free Spears invoke the One Faith's promise of a message for all peoples against the masters who once owned them. They raid slave caravans, arm those they release, and seize supplies from estates whose wealth rests on bondage, turning each rescue into another challenge to the surrounding rulers."
 war_root_out_Y33_title:0 "Root Out Free Spears of the Copper Dunes"
 war_root_out_Y33_desc:0 "Hamid al-Nahas leads escaped soldiers and slaves from a fortified refuge near Dhiban. His Free Spears invoke the One Faith's promise of a message for all peoples against the masters who once owned them. They raid slave caravans, arm those they release, and seize supplies from estates whose wealth rests on bondage, turning each rescue into another challenge to the surrounding rulers.\n\nMove against the refuge and break the Free Spears' control of the caravan approaches. Hamid's followers will defend the freedom they won with stolen weapons. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y34:0 "Court of the Cursed Scarab Enclave"
 desc_war_enclave_Y34:0 "Apophas, the Cursed Scarab Lord, haunts the burial places of Khepesh in a shifting body of beetles. Condemned after murdering the royal family of Numas, he bargained with Usirian to find a soul that could replace his own. His hunt has no possible end, yet every caravan and settlement within reach offers another victim whom the desperate prince believes may free him."
 war_root_out_Y34_title:0 "Root Out Court of the Cursed Scarab"
 war_root_out_Y34_desc:0 "Apophas, the Cursed Scarab Lord, haunts the burial places of Khepesh in a shifting body of beetles. Condemned after murdering the royal family of Numas, he bargained with Usirian to find a soul that could replace his own. His hunt has no possible end, yet every caravan and settlement within reach offers another victim whom the desperate prince believes may free him.\n\nSearch the sepulchres from which the scarab swarms emerge and confront the cursed prince. Apophas will turn his hunt upon those who intrude on his refuge. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y35:0 "Rikek Ash-Warrens Enclave"
 desc_war_enclave_Y35:0 "Skreev Ashsnout leads the Rikek remnant through the ash-choked warrens beneath Cripple Peak. The survivors cling to their clan's name while scavenging the margins of Nagash's domain for warpstone and forgotten weapons. Tomb raids bring them into conflict with the undead, while stolen tribute and murdered envoys keep stronger Skaven clans from making obedient servants of them."
 war_root_out_Y35_title:0 "Root Out Rikek Ash-Warrens"
 war_root_out_Y35_desc:0 "Skreev Ashsnout leads the Rikek remnant through the ash-choked warrens beneath Cripple Peak. The survivors cling to their clan's name while scavenging the margins of Nagash's domain for warpstone and forgotten weapons. Tomb raids bring them into conflict with the undead, while stolen tribute and murdered envoys keep stronger Skaven clans from making obedient servants of them.\n\nClose the scavengers' tunnels and force Ashsnout's warriors into the open. They will defend the warrens that shelter them from both Nagash's dead and their own kind. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y36:0 "Black Oasis Riders Enclave"
 desc_war_enclave_Y36:0 "Salim al-Rimal's Black Oasis Riders shelter among the living communities around Phaktra. They reject the authority of dead kings over the wells and grazing grounds on which their families depend. Mounted raiders break into burial stores and intercept tomb caravans, drawing provisions from the ancient wealth of Nehekhara while provoking the rulers who still claim it."
 war_root_out_Y36_title:0 "Root Out Black Oasis Riders"
 war_root_out_Y36_desc:0 "Salim al-Rimal's Black Oasis Riders shelter among the living communities around Phaktra. They reject the authority of dead kings over the wells and grazing grounds on which their families depend. Mounted raiders break into burial stores and intercept tomb caravans, drawing provisions from the ancient wealth of Nehekhara while provoking the rulers who still claim it.\n\nTake control of the riders' watering places and end their attacks on the tomb roads. Salim's bands will gather to defend the wells that keep their resistance alive. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y37:0 "Clan Festerlingus Enclave"
 desc_war_enclave_Y37:0 "Pustik Rotthroat's Clan Festerlingus has hollowed a plague refuge beneath the Cuexotl Wilds. Its Skaven carry Pestilens rites into the jungle, fouling water and raiding the approaches to Lizardmen sacred sites. The clan's small warrens cannot withstand the great powers around them in open war, so disease and ambush prepare the ground for every advance."
 war_root_out_Y37_title:0 "Root Out Clan Festerlingus"
 war_root_out_Y37_desc:0 "Pustik Rotthroat's Clan Festerlingus has hollowed a plague refuge beneath the Cuexotl Wilds. Its Skaven carry Pestilens rites into the jungle, fouling water and raiding the approaches to Lizardmen sacred sites. The clan's small warrens cannot withstand the great powers around them in open war, so disease and ambush prepare the ground for every advance.\n\nFind the plague warrens and cut off the parties carrying filth into nearby waters. Rotthroat will bring his infected warriors together when their sanctuary is exposed. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y38:0 "Hellbeard's Cinder Anchorage Enclave"
 desc_war_enclave_Y38:0 "Abnagg Hellbeard's followers hold a smoke-stained anchorage on the Scaleback Coast. The surviving corsairs of his Chaos Dwarf venture repair their vessels with slave labor and trade stolen cargo for the supplies their distant homeland cannot provide. Their raiders hunt coastal traffic and Elven shipping, dragging captives back to workshops where the furnaces burn through the night."
 war_root_out_Y38_title:0 "Root Out Hellbeard's Cinder Anchorage"
 war_root_out_Y38_desc:0 "Abnagg Hellbeard's followers hold a smoke-stained anchorage on the Scaleback Coast. The surviving corsairs of his Chaos Dwarf venture repair their vessels with slave labor and trade stolen cargo for the supplies their distant homeland cannot provide. Their raiders hunt coastal traffic and Elven shipping, dragging captives back to workshops where the furnaces burn through the night.\n\nBlock the landings and storm the slave workshops that keep Hellbeard's corsairs at sea. The garrison will fight to preserve its ships, captives, and last secure harbor. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y39:0 "Root-Eye Brood Enclave"
 desc_war_enclave_Y39:0 "Zikrit Rootfang's Forest Goblins nest among the trees and broken slopes of the Nahuontl Peaks. Their Root-Eye Brood worships the spiders that carry its hunters through the canopy, above the roads watched by larger Greenskin tribes. Ambushed traders supply metal and captives, while poisoned arrows answer any Orc boss who demands that the brood surrender its independence."
 war_root_out_Y39_title:0 "Root Out Root-Eye Brood"
 war_root_out_Y39_desc:0 "Zikrit Rootfang's Forest Goblins nest among the trees and broken slopes of the Nahuontl Peaks. Their Root-Eye Brood worships the spiders that carry its hunters through the canopy, above the roads watched by larger Greenskin tribes. Ambushed traders supply metal and captives, while poisoned arrows answer any Orc boss who demands that the brood surrender its independence.\n\nCut the paths between the canopy camps and force Rootfang's hunters to defend their nests. The brood's spiders will descend wherever our advance disturbs their webs. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y40:0 "River of Teeth Covenant Enclave"
 desc_war_enclave_Y40:0 "Zafira Nightwater's vampires hold hidden courts along the channels of the Flooded Jungle. The River of Teeth Covenant presents its members as guardians who keep worse dangers from the water, collecting blood in return for passage and protection. Boatmen who refuse the bargain disappear among the reeds, and the villages along the banks learn to provision a court they rarely see by daylight."
 war_root_out_Y40_title:0 "Root Out River of Teeth Covenant"
 war_root_out_Y40_desc:0 "Zafira Nightwater's vampires hold hidden courts along the channels of the Flooded Jungle. The River of Teeth Covenant presents its members as guardians who keep worse dangers from the water, collecting blood in return for passage and protection. Boatmen who refuse the bargain disappear among the reeds, and the villages along the banks learn to provision a court they rarely see by daylight.\n\nTrace the covenant's tribute boats to its concealed landing places. Nightwater's servants will defend the channels through which their victims and wealth arrive. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y41:0 "Braugh's Corpse-Train Enclave"
 desc_war_enclave_Y41:0 "Braugh Slavelord keeps his shuffling captive train near Brimstone Pass. After escaping a necromancer's dungeon, the Ogre took enchanted chains whose victims remain bound to his service even after death. Living prisoners and corpses now haul his possessions together, while his raiders seize fresh captives from the mountain traffic to replace those too broken to move."
 war_root_out_Y41_title:0 "Root Out Braugh's Corpse-Train"
 war_root_out_Y41_desc:0 "Braugh Slavelord keeps his shuffling captive train near Brimstone Pass. After escaping a necromancer's dungeon, the Ogre took enchanted chains whose victims remain bound to his service even after death. Living prisoners and corpses now haul his possessions together, while his raiders seize fresh captives from the mountain traffic to replace those too broken to move.\n\nStrike the slave train and break Braugh's grip on the pass. The Slavelord will drag his chained followers into battle rather than surrender his possessions. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y42:0 "Sneaky Gits of Gash Kadrak Enclave"
 desc_war_enclave_Y42:0 "Nagrit Shivtail's Sneaky Gits work from the Zharr Outskirts, drawing wealth and influence from the slave pits of Gash Kadrak. These Hobgoblins thrive as overseers, informers, and hired killers under Chaos Dwarf protection. Their knives enforce bargains that their patrons prefer to leave unrecorded, while hidden stores and private loyalties give the gang room to plot against anyone who trusts it."
 war_root_out_Y42_title:0 "Root Out Sneaky Gits of Gash Kadrak"
 war_root_out_Y42_desc:0 "Nagrit Shivtail's Sneaky Gits work from the Zharr Outskirts, drawing wealth and influence from the slave pits of Gash Kadrak. These Hobgoblins thrive as overseers, informers, and hired killers under Chaos Dwarf protection. Their knives enforce bargains that their patrons prefer to leave unrecorded, while hidden stores and private loyalties give the gang room to plot against anyone who trusts it.\n\nSeize the gang's stores and close the passages used by its hired killers. Shivtail's cutthroats will defend the privileges and secrets that make them valuable. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y43:0 "Black Tally Rebellion Enclave"
 desc_war_enclave_Y43:0 "Grakk Chainbreaker's Black Orcs occupy an armed refuge in Blackfire. Forged for obedience and war, these escaped soldiers have turned their discipline against the overseers who once counted them as property. They raid industrial roads for weapons and food, free useful captives, and keep the names of their former masters on the black tally that gives the rebellion its name."
 war_root_out_Y43_title:0 "Root Out Black Tally Rebellion"
 war_root_out_Y43_desc:0 "Grakk Chainbreaker's Black Orcs occupy an armed refuge in Blackfire. Forged for obedience and war, these escaped soldiers have turned their discipline against the overseers who once counted them as property. They raid industrial roads for weapons and food, free useful captives, and keep the names of their former masters on the black tally that gives the rebellion its name.\n\nAdvance on the rebel barracks and deny Chainbreaker's troops access to the supply roads. The Black Orcs will meet the assault as soldiers defending a hard-won stronghold. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y44:0 "Unchained Furnace Enclave"
 desc_war_enclave_Y44:0 "Dorin Shacklecleaver's freed Dwarfs have rekindled the ancestor shrines of a hidden hold in the Black Smoke Peaks. The Unchained Furnace rejects Hashut and the slave forges that supplied its founders with years of captivity. Its warriors ambush labor columns and carry rescued prisoners uphill, taking tools and weapons from the same workshops they now seek to undermine."
 war_root_out_Y44_title:0 "Root Out Unchained Furnace"
 war_root_out_Y44_desc:0 "Dorin Shacklecleaver's freed Dwarfs have rekindled the ancestor shrines of a hidden hold in the Black Smoke Peaks. The Unchained Furnace rejects Hashut and the slave forges that supplied its founders with years of captivity. Its warriors ambush labor columns and carry rescued prisoners uphill, taking tools and weapons from the same workshops they now seek to undermine.\n\nFind the hold's concealed entrances and cut the routes used by its rescue parties. Shacklecleaver's people will fight rather than return their refuge to an overseer's control. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y45:0 "Ghuth's Spawnchompers Enclave"
 desc_war_enclave_Y45:0 "Ghuth Spawnchomper's Ogres feast on Chaos-tainted flesh around Bloodpeak. Their appetite for spawn has left its mark upon their bodies, and creatures shunned by other tribes gather around a camp where mutation is no obstacle to belonging. Dragon Ogres and malformed brutes add their strength to Ghuth's raiders, who descend on neighboring camps in search of the next extraordinary meal."
 war_root_out_Y45_title:0 "Root Out Ghuth's Spawnchompers"
 war_root_out_Y45_desc:0 "Ghuth Spawnchomper's Ogres feast on Chaos-tainted flesh around Bloodpeak. Their appetite for spawn has left its mark upon their bodies, and creatures shunned by other tribes gather around a camp where mutation is no obstacle to belonging. Dragon Ogres and malformed brutes add their strength to Ghuth's raiders, who descend on neighboring camps in search of the next extraordinary meal.\n\nClose on Ghuth's feast grounds and scatter the creatures gathering there. The Spawnchompers will regard an approaching army as both a threat and a promising supply of meat. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y46:0 "Bezer's Small Empire Enclave"
 desc_war_enclave_Y46:0 "Bezer proclaims his small empire from the hiding places around Gutbuster's Gate. A Gnoblar ruler credited with uniting two and a half tribes, he offers his followers the rare prospect of serving someone who does not intend to eat them. Stolen food, concealed traps, and raids on Ogre stores keep his boast alive, irritating far larger neighbors who struggle to pin down their tiny adversaries."
 war_root_out_Y46_title:0 "Root Out Bezer's Small Empire"
 war_root_out_Y46_desc:0 "Bezer proclaims his small empire from the hiding places around Gutbuster's Gate. A Gnoblar ruler credited with uniting two and a half tribes, he offers his followers the rare prospect of serving someone who does not intend to eat them. Stolen food, concealed traps, and raids on Ogre stores keep his boast alive, irritating far larger neighbors who struggle to pin down their tiny adversaries.\n\nSearch the burrows and storage pits that sustain Bezer's empire. His Gnoblars will defend their independence with every trap they can prepare before our arrival. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y47:0 "White Hunger Enclave"
 desc_war_enclave_Y47:0 "Urrgh Whiteclaw's Yhetees haunt the frozen heights above Choketooth Vale. The White Hunger moves with the storms, descending on caravan camps when snow and darkness separate the guards from their fires. Ogre hunters enter the high passes to prove their strength, but abandoned weapons and frozen remains show how often the hunting runs the other way."
 war_root_out_Y47_title:0 "Root Out White Hunger"
 war_root_out_Y47_desc:0 "Urrgh Whiteclaw's Yhetees haunt the frozen heights above Choketooth Vale. The White Hunger moves with the storms, descending on caravan camps when snow and darkness separate the guards from their fires. Ogre hunters enter the high passes to prove their strength, but abandoned weapons and frozen remains show how often the hunting runs the other way.\n\nSecure the high trails and drive Whiteclaw's packs from their shelters. The Yhetees will gather to defend the slopes from which they stalk the valley. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y48:0 "Last Hearth of the Tall Ones Enclave"
 desc_war_enclave_Y48:0 "Hrol Hearthkeeper's Giants cling to ancestral ruins along Giant's Ridge. Their gathering preserves the memory of a country overrun by Ogre expansion, feeding its resentment with each new camp raised among the broken stones. Raids on Ogre herds and settlements supply the Last Hearth, while tales told around its fires give dispossessed wanderers a reason to remain and fight."
 war_root_out_Y48_title:0 "Root Out Last Hearth of the Tall Ones"
 war_root_out_Y48_desc:0 "Hrol Hearthkeeper's Giants cling to ancestral ruins along Giant's Ridge. Their gathering preserves the memory of a country overrun by Ogre expansion, feeding its resentment with each new camp raised among the broken stones. Raids on Ogre herds and settlements supply the Last Hearth, while tales told around its fires give dispossessed wanderers a reason to remain and fight.\n\nAdvance into the ruined gathering grounds and confront the Giants defending them. Hearthkeeper's followers regard every new boundary marker as another theft of their homeland. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y49:0 "Oglah Khan's Exiles Enclave"
 desc_war_enclave_Y49:0 "Oglah Khan's wolf-riders camp near Heicheng, selling the speed and ferocity that once served the Hobgobla Khan. Oglah lost that patronage when he changed sides at Xen-Tu and found he had backed the defeated army. Exile made him a mercenary; now neighboring rulers bid for his services, while his riders provision themselves from a frontier that cannot easily keep them out."
 war_root_out_Y49_title:0 "Root Out Oglah Khan's Exiles"
 war_root_out_Y49_desc:0 "Oglah Khan's wolf-riders camp near Heicheng, selling the speed and ferocity that once served the Hobgobla Khan. Oglah lost that patronage when he changed sides at Xen-Tu and found he had backed the defeated army. Exile made him a mercenary; now neighboring rulers bid for his services, while his riders provision themselves from a frontier that cannot easily keep them out.\n\nDrive the riders from their camp and close the routes that sustain their contracts. Oglah will bring his wolves to battle when his livelihood and refuge are threatened. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y50:0 "Ash-Hoof Herd Enclave"
 desc_war_enclave_Y50:0 "Khorgh Ashhoof's Centigors range across the pasturelands of Tuoba, carrying skulls and torn harnesses back to their gathering grounds. The Ash-Hoof Herd worships Khorne through close slaughter, falling upon horse camps and isolated riders before larger forces can assemble. Human and Hobgoblin herders alike lose animals and kin, while the herd claims each bloodied stretch of grass as another victory over settled rule."
 war_root_out_Y50_title:0 "Root Out Ash-Hoof Herd"
 war_root_out_Y50_desc:0 "Khorgh Ashhoof's Centigors range across the pasturelands of Tuoba, carrying skulls and torn harnesses back to their gathering grounds. The Ash-Hoof Herd worships Khorne through close slaughter, falling upon horse camps and isolated riders before larger forces can assemble. Human and Hobgoblin herders alike lose animals and kin, while the herd claims each bloodied stretch of grass as another victory over settled rule.\n\nGather our forces at the pasture approaches and drive the herd into battle. Ashhoof's warriors will answer a challenge to their hunting grounds with a charge. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y51:0 "Broken Harness Freehold Enclave"
 desc_war_enclave_Y51:0 "Shun Liu's Broken Harness Freehold shelters escaped captives and deserters behind the stockades of Icescar. Its inhabitants come from both sides of the frontier and bind themselves through mutual defense rather than service to a khan or governor. They attack slave caravans and hide those they free, making their settlement a refuge to the hunted and a provocation to every authority that claims them."
 war_root_out_Y51_title:0 "Root Out Broken Harness Freehold"
 war_root_out_Y51_desc:0 "Shun Liu's Broken Harness Freehold shelters escaped captives and deserters behind the stockades of Icescar. Its inhabitants come from both sides of the frontier and bind themselves through mutual defense rather than service to a khan or governor. They attack slave caravans and hide those they free, making their settlement a refuge to the hunted and a provocation to every authority that claims them.\n\nBring the stockades under our authority and cut the freeholders' access to the caravan roads. Liu's defenders will fight to keep another ruler from fastening the harness again. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y52:0 "Cult of the Painted Skin Enclave"
 desc_war_enclave_Y52:0 "Xiu Shen's Painted Skin cult has woven itself into the households and offices of Xienxen. Its traditions reach back to the secret Chaos worship associated with Beichai, where outward respectability concealed devotion to forbidden powers. Here the cult serves the Changer of Ways through bribery, stolen identities, and concealed rites, using official seals and polite invitations to reach places an armed invader could not."
 war_root_out_Y52_title:0 "Root Out Cult of the Painted Skin"
 war_root_out_Y52_desc:0 "Xiu Shen's Painted Skin cult has woven itself into the households and offices of Xienxen. Its traditions reach back to the secret Chaos worship associated with Beichai, where outward respectability concealed devotion to forbidden powers. Here the cult serves the Changer of Ways through bribery, stolen identities, and concealed rites, using official seals and polite invitations to reach places an armed invader could not.\n\nExpose the cult's patrons and seize its meeting houses before they can vanish behind new names. Shen's armed devotees will abandon their disguises when the network is threatened. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y53:0 "Vermilion Tax Revolt Enclave"
 desc_war_enclave_Y53:0 "Bao Zhang's followers hold grain stores and fortified villages in the Radiant Plains. The Vermilion Tax Revolt began among farmers who saw corrupt collectors empty their granaries while speaking solemnly of Harmony. Its militias now seize revenue convoys and destroy tax registers, claiming that defense of the proper order requires resistance to the officials appointed to uphold it."
 war_root_out_Y53_title:0 "Root Out Vermilion Tax Revolt"
 war_root_out_Y53_desc:0 "Bao Zhang's followers hold grain stores and fortified villages in the Radiant Plains. The Vermilion Tax Revolt began among farmers who saw corrupt collectors empty their granaries while speaking solemnly of Harmony. Its militias now seize revenue convoys and destroy tax registers, claiming that defense of the proper order requires resistance to the officials appointed to uphold it.\n\nRetake the occupied granaries and re-establish collection along the village roads. Zhang's militias will rally to defend the harvests on which their rebellion depends. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y54:0 "Jade Coffin Society Enclave"
 desc_war_enclave_Y54:0 "Mei Jiang's Jade Coffin Society rules a concealed world of graveyards, smugglers, and indebted households in Minghua. Its vampires disregard the restraints and ceremonies by which the Jiangshi Court maintains its place among Cathay's rulers. Kidnapping and illicit burial work supply their hunger, while paid accomplices keep the dead moving through streets where respectable officials insist nothing is amiss."
 war_root_out_Y54_title:0 "Root Out Jade Coffin Society"
 war_root_out_Y54_desc:0 "Mei Jiang's Jade Coffin Society rules a concealed world of graveyards, smugglers, and indebted households in Minghua. Its vampires disregard the restraints and ceremonies by which the Jiangshi Court maintains its place among Cathay's rulers. Kidnapping and illicit burial work supply their hunger, while paid accomplices keep the dead moving through streets where respectable officials insist nothing is amiss.\n\nBreak the society's protection among the smugglers and open its hidden burial houses. Jiang's retainers will fight to preserve the trade that feeds them. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y55:0 "Copper Tail Refuge Enclave"
 desc_war_enclave_Y55:0 "Kavi Copper-Tail leads an independent Monkeyfolk refuge in Sapphire Grove. His followers reject both the Dragon rulers' demands for obedience and the Monkey King's claim to speak for all their kind. From concealed paths above the pilgrim roads they seize provisions and tribute, using the grove's heights to frustrate soldiers sent by patrons they have already refused."
 war_root_out_Y55_title:0 "Root Out Copper Tail Refuge"
 war_root_out_Y55_desc:0 "Kavi Copper-Tail leads an independent Monkeyfolk refuge in Sapphire Grove. His followers reject both the Dragon rulers' demands for obedience and the Monkey King's claim to speak for all their kind. From concealed paths above the pilgrim roads they seize provisions and tribute, using the grove's heights to frustrate soldiers sent by patrons they have already refused.\n\nSecure the pilgrim roads and climb toward Copper-Tail's refuge. His followers will defend the grove against another attempt to place them under an outside ruler. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y56:0 "Bengals of the Tiger's Eye Enclave"
 desc_war_enclave_Y56:0 "Rajar Stripeclaw's Bengals guard the caves and forest paths of Kushan. The Tiger's Eye tribe belongs to Ind's older jungle world, where sacred beasts and their descendants command offerings from neighboring communities. Treasure seekers and hunters who intrude upon its caverns meet claws and spears, while disputes over tribute and access to the forest keep the tribe at odds with the surrounding courts."
 war_root_out_Y56_title:0 "Root Out Bengals of the Tiger's Eye"
 war_root_out_Y56_desc:0 "Rajar Stripeclaw's Bengals guard the caves and forest paths of Kushan. The Tiger's Eye tribe belongs to Ind's older jungle world, where sacred beasts and their descendants command offerings from neighboring communities. Treasure seekers and hunters who intrude upon its caverns meet claws and spears, while disputes over tribute and access to the forest keep the tribe at odds with the surrounding courts.\n\nEnter the guarded forest and end the tribe's independent control of its approaches. Stripeclaw's warriors will defend the caves and offerings on which their authority rests. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y57:0 "Red Banquet Court Enclave"
 desc_war_enclave_Y57:0 "Gorakka Redgullet's vampiric Ogres keep a lavish court in Panchala. Their banquets consume cattle and blood alike, with tribute brought from villages too exposed to refuse the invitation. Rajahs resent the loss of revenue and subjects, while living Ogre rivals find their strength challenged by cousins whose hunger continues beyond death and whose household grows with every successful hunt."
 war_root_out_Y57_title:0 "Root Out Red Banquet Court"
 war_root_out_Y57_desc:0 "Gorakka Redgullet's vampiric Ogres keep a lavish court in Panchala. Their banquets consume cattle and blood alike, with tribute brought from villages too exposed to refuse the invitation. Rajahs resent the loss of revenue and subjects, while living Ogre rivals find their strength challenged by cousins whose hunger continues beyond death and whose household grows with every successful hunt.\n\nClose the tribute roads and march upon Redgullet's banquet halls. The court will bring its hungry retainers to battle when the flow of provisions is threatened. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y58:0 "Ash Lotus Ascetics Enclave"
 desc_war_enclave_Y58:0 "Harendra Ashlotus gathers outcast ascetics around the cremation grounds of the Kushari Plains. Their pursuit of release from mortal limits has led them into necromancy, turning funeral rites into experiments upon the remains entrusted to them. Temple authorities condemn the sect, but its disciples steal ashes, bodies, and sacred vessels while a growing company of the dead guards their retreat."
 war_root_out_Y58_title:0 "Root Out Ash Lotus Ascetics"
 war_root_out_Y58_desc:0 "Harendra Ashlotus gathers outcast ascetics around the cremation grounds of the Kushari Plains. Their pursuit of release from mortal limits has led them into necromancy, turning funeral rites into experiments upon the remains entrusted to them. Temple authorities condemn the sect, but its disciples steal ashes, bodies, and sacred vessels while a growing company of the dead guards their retreat.\n\nTake the cremation grounds back from Ashlotus' disciples and interrupt their rites. The sect will call upon its dead defenders when its sanctuary is entered. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y59:0 "Emerald Throat Brood Enclave"
 desc_war_enclave_Y59:0 "Ssaritha Emerald-Throat's displaced Snakefolk household has taken refuge in the tangled forests of Ceylon. Denied the security of a greater serpent court, it survives through hidden shrines, captive labor, and raids on the human communities along its margins. Prisoners are carried inland for service and sacrifice, while the brood's venomous hunters punish anyone who follows their trail."
 war_root_out_Y59_title:0 "Root Out Emerald Throat Brood"
 war_root_out_Y59_desc:0 "Ssaritha Emerald-Throat's displaced Snakefolk household has taken refuge in the tangled forests of Ceylon. Denied the security of a greater serpent court, it survives through hidden shrines, captive labor, and raids on the human communities along its margins. Prisoners are carried inland for service and sacrifice, while the brood's venomous hunters punish anyone who follows their trail.\n\nFollow the captive trails into the forest and break the brood's guarded shrines. Ssaritha's household will fight for the refuge that sustains its claim to power. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y60:0 "Moltless Sepulchre Enclave"
 desc_war_enclave_Y60:0 "Ssilak Moltless rules a forbidden sepulchre in Dragonfall, where Snakefolk adepts preserve dead flesh instead of surrendering it to decay and renewal. They steal eggs, ancestral remains, and the corpses of royal servants for rites condemned by rival serpent courts. Their hidden chambers hold the promise of an unchanging existence, paid for with raids upon the living lineages around them."
 war_root_out_Y60_title:0 "Root Out Moltless Sepulchre"
 war_root_out_Y60_desc:0 "Ssilak Moltless rules a forbidden sepulchre in Dragonfall, where Snakefolk adepts preserve dead flesh instead of surrendering it to decay and renewal. They steal eggs, ancestral remains, and the corpses of royal servants for rites condemned by rival serpent courts. Their hidden chambers hold the promise of an unchanging existence, paid for with raids upon the living lineages around them.\n\nEnter the sepulchre and halt the theft of eggs and ancestral dead. Ssilak's adepts will defend their preserved masters and the secrets of their unnatural survival. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y61:0 "Unbitten League Enclave"
 desc_war_enclave_Y61:0 "Devendra Nagesh's Unbitten League holds palisaded refuges in the Silvermist Hills. Its founders escaped the captive pens of Khuresh and learned to hide villages where serpent patrols struggle to follow. They ambush prisoner columns and guide survivors uphill, striking at the traffic that sustains nearby courts while refusing to accept that humans must remain prey."
 war_root_out_Y61_title:0 "Root Out Unbitten League"
 war_root_out_Y61_desc:0 "Devendra Nagesh's Unbitten League holds palisaded refuges in the Silvermist Hills. Its founders escaped the captive pens of Khuresh and learned to hide villages where serpent patrols struggle to follow. They ambush prisoner columns and guide survivors uphill, striking at the traffic that sustains nearby courts while refusing to accept that humans must remain prey.\n\nLocate the hill refuges and bring the league's fighters to battle. They will defend the escape routes and stockades that stand between their families and renewed captivity. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y62:0 "Hollow Gong Warren Enclave"
 desc_war_enclave_Y62:0 "Chikkit Gonggnaw's Skaven burrow beneath the shrines and waterways of Silent Lotus. The Hollow Gong Warren steals venom from Snakefolk stores and undermines the causeways used by ritual processions. Poisoned blades and sudden collapses conceal a small clan's weakness, allowing Gonggnaw to plunder temple traffic while stronger enemies search the jungle above his tunnels."
 war_root_out_Y62_title:0 "Root Out Hollow Gong Warren"
 war_root_out_Y62_desc:0 "Chikkit Gonggnaw's Skaven burrow beneath the shrines and waterways of Silent Lotus. The Hollow Gong Warren steals venom from Snakefolk stores and undermines the causeways used by ritual processions. Poisoned blades and sudden collapses conceal a small clan's weakness, allowing Gonggnaw to plunder temple traffic while stronger enemies search the jungle above his tunnels.\n\nTrace the stolen venom to its underground stores and close the warren's exits. Gonggnaw's warriors will emerge when their hidden routes are cut. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y63:0 "Mangrove Eye Court Enclave"
 desc_war_enclave_Y63:0 "Morrga Mangrove-Eye's Fimir hold a mist-shrouded court in the Zhanggan Wetlands. Their raiders cross drowned channels at night, taking captives from villages and rival serpent households before withdrawing beyond the firm ground. The court's power rests on waters few outsiders can navigate, and every abandoned boat adds to the warning against entering its fog."
 war_root_out_Y63_title:0 "Root Out Mangrove Eye Court"
 war_root_out_Y63_desc:0 "Morrga Mangrove-Eye's Fimir hold a mist-shrouded court in the Zhanggan Wetlands. Their raiders cross drowned channels at night, taking captives from villages and rival serpent households before withdrawing beyond the firm ground. The court's power rests on waters few outsiders can navigate, and every abandoned boat adds to the warning against entering its fog.\n\nFind guides through the drowned channels and advance on Morrga's court. The Fimir will rally where deep water and fog give them the strongest defense. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y64:0 "Empty Sheath League Enclave"
 desc_war_enclave_Y64:0 "Akihiro Kuroda's Empty Sheath League shelters peasants and masterless fighters around the fortified temples of Spirit of the Crane. Its warrior monks refuse the levies of competing daimyo, arguing that no lord has earned obedience by bringing another war to the fields. Armed processions guard the roads, and grain owed to neighboring castles feeds refugees behind the temple gates."
 war_root_out_Y64_title:0 "Root Out Empty Sheath League"
 war_root_out_Y64_desc:0 "Akihiro Kuroda's Empty Sheath League shelters peasants and masterless fighters around the fortified temples of Spirit of the Crane. Its warrior monks refuse the levies of competing daimyo, arguing that no lord has earned obedience by bringing another war to the fields. Armed processions guard the roads, and grain owed to neighboring castles feeds refugees behind the temple gates.\n\nBring the fortified temples under our authority and end the league's refusal of service. Kuroda's monks and village fighters will assemble to defend their sanctuary. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y65:0 "Cinder-Eye Burrow Enclave"
 desc_war_enclave_Y65:0 "Skarrik Cinder-Eye's Kobolds occupy sulfur workings beneath Iseki. The burrow turns stolen tools and dangerous powders into traps for the samurai patrols and Goblin rivals that seek to drive it out. Smoke seeps from cracks above the workshops, while attacks on pack trains keep the little forges supplied and the mountain roads under constant threat."
 war_root_out_Y65_title:0 "Root Out Cinder-Eye Burrow"
 war_root_out_Y65_desc:0 "Skarrik Cinder-Eye's Kobolds occupy sulfur workings beneath Iseki. The burrow turns stolen tools and dangerous powders into traps for the samurai patrols and Goblin rivals that seek to drive it out. Smoke seeps from cracks above the workshops, while attacks on pack trains keep the little forges supplied and the mountain roads under constant threat.\n\nSeize the workings and cut off the supplies feeding Cinder-Eye's workshops. The burrow's defenders will meet our advance with prepared traps and stolen powder. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y66:0 "Antlered Hunger Enclave"
 desc_war_enclave_Y66:0 "Ghorak Thornhorn's Caprigor herd lurks in the forests of Ixtoc, scavenging the wrecks and abandoned camps along the coast. The Antlered Hunger treats the Elven colonies as a spreading trespass, tearing down boundary markers and hunting parties sent beyond the settled clearings. Captured tools arm the herd, and each failed expedition leaves more spoils beneath its crude shrines."
 war_root_out_Y66_title:0 "Root Out Antlered Hunger"
 war_root_out_Y66_desc:0 "Ghorak Thornhorn's Caprigor herd lurks in the forests of Ixtoc, scavenging the wrecks and abandoned camps along the coast. The Antlered Hunger treats the Elven colonies as a spreading trespass, tearing down boundary markers and hunting parties sent beyond the settled clearings. Captured tools arm the herd, and each failed expedition leaves more spoils beneath its crude shrines.\n\nPush beyond the colonial clearings and find the herd's gathering places. Thornhorn's beasts will defend the woods from which they strike at the coast. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y67:0 "Unmoored Spears Enclave"
 desc_war_enclave_Y67:0 "Aelar Wavebreaker's Unmoored Spears hold a renegade camp in Elithis Outpost. Once charged with defending Asur settlements, these abandoned soldiers have turned toward the darker gods of the Cytharai and the profits of armed predation. Their knowledge of watch posts, warehouses, and coastal tracks lets them raid the same communities whose safety was once their duty."
 war_root_out_Y67_title:0 "Root Out Unmoored Spears"
 war_root_out_Y67_desc:0 "Aelar Wavebreaker's Unmoored Spears hold a renegade camp in Elithis Outpost. Once charged with defending Asur settlements, these abandoned soldiers have turned toward the darker gods of the Cytharai and the profits of armed predation. Their knowledge of watch posts, warehouses, and coastal tracks lets them raid the same communities whose safety was once their duty.\n\nRetake the renegades' camp and deny them the coastal routes they once guarded. Wavebreaker's soldiers will bring their old discipline to the defense of their new livelihood. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y68:0 "Itz-Itza Enclave"
 desc_war_enclave_Y68:0 "Itz-Huax's followers preserve the worship of the Old Ones in Pyooshupya. Surrounded by Dragon Isles clans that offer blood and treasure to living dragons, the Itz-Itza guard old tablets and spawning rites as remnants of an order their neighbors have forsaken. Rival priests covet their sacred places, while Itz-Huax's warriors resist tribute demands and strike at those who would turn the shrines into dragon altars."
 war_root_out_Y68_title:0 "Root Out Itz-Itza"
 war_root_out_Y68_desc:0 "Itz-Huax's followers preserve the worship of the Old Ones in Pyooshupya. Surrounded by Dragon Isles clans that offer blood and treasure to living dragons, the Itz-Itza guard old tablets and spawning rites as remnants of an order their neighbors have forsaken. Rival priests covet their sacred places, while Itz-Huax's warriors resist tribute demands and strike at those who would turn the shrines into dragon altars.\n\nAdvance on the guarded shrines and break Itz-Huax's independent hold over them. The defenders will rally around the relics they believe preserve the purpose of their people. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y69:0 "River-Ruin Chainport Enclave"
 desc_war_enclave_Y69:0 "Zarkhul Ironwake's Chaos Dwarfs have fortified the docks of Noigo at the mouth of the River Ruin. Their chainport shelters iron vessels, slave pens, and workshops that turn island timber and stolen labor into provisions for further voyages. Raiding parties seize captives from neighboring scale-clans, making the harbor a permanent foothold for the slavers of the river."
 war_root_out_Y69_title:0 "Root Out River-Ruin Chainport"
 war_root_out_Y69_desc:0 "Zarkhul Ironwake's Chaos Dwarfs have fortified the docks of Noigo at the mouth of the River Ruin. Their chainport shelters iron vessels, slave pens, and workshops that turn island timber and stolen labor into provisions for further voyages. Raiding parties seize captives from neighboring scale-clans, making the harbor a permanent foothold for the slavers of the river.\n\nStorm the docks and close the slave pens that provision Ironwake's vessels. The harbor garrison will defend its landing ground and the workshops behind it. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y70:0 "Cave of the First Hunger Enclave"
 desc_war_enclave_Y70:0 "Gor-Ulk's Troglodytes inhabit the deep caves beneath Xcha. Their hunting bands emerge along forgotten passages to raid island clans, gem workings, and foreign mining camps. Food and captives disappear into chambers beyond the reach of daylight, while repeated attacks prevent any surface ruler from treating the ground above the caves as secure territory."
 war_root_out_Y70_title:0 "Root Out Cave of the First Hunger"
 war_root_out_Y70_desc:0 "Gor-Ulk's Troglodytes inhabit the deep caves beneath Xcha. Their hunting bands emerge along forgotten passages to raid island clans, gem workings, and foreign mining camps. Food and captives disappear into chambers beyond the reach of daylight, while repeated attacks prevent any surface ruler from treating the ground above the caves as secure territory.\n\nSearch the cave mouths and force Gor-Ulk's hunters out of their hidden passages. They will fight to preserve the routes by which they reach the surface. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y71:0 "Scourge of Khaine Enclave"
 desc_war_enclave_Y71:0 "Nocrusith's Scourge of Khaine maintains a Druchii foothold in Darkspire. Its warriors carry the Murder God's worship into Ulthuan, using fortified heights and guarded tracks to threaten the roads through the surrounding mountains. Raids bring captives and supplies back to the stronghold, while its continued survival mocks the Asur lords who claim to have secured their homeland."
 war_root_out_Y71_title:0 "Root Out Scourge of Khaine"
 war_root_out_Y71_desc:0 "Nocrusith's Scourge of Khaine maintains a Druchii foothold in Darkspire. Its warriors carry the Murder God's worship into Ulthuan, using fortified heights and guarded tracks to threaten the roads through the surrounding mountains. Raids bring captives and supplies back to the stronghold, while its continued survival mocks the Asur lords who claim to have secured their homeland.\n\nClose the mountain approaches and advance on the Khainite stronghold. Nocrusith will call his raiders back to defend their foothold in Ulthuan. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y72:0 "Cult of Excess Enclave"
 desc_war_enclave_Y72:0 "Arathar's Cult of Excess hides armed devotees among the secluded estates of the Circle of Night. Wealth and cultivated taste conceal a Slaaneshi circle whose private indulgences demand servants, victims, and ever greater freedom from restraint. Abductions feed its rites, while influential patrons keep inquiries from reaching the doors behind which their neighbors disappear."
 war_root_out_Y72_title:0 "Root Out Cult of Excess"
 war_root_out_Y72_desc:0 "Arathar's Cult of Excess hides armed devotees among the secluded estates of the Circle of Night. Wealth and cultivated taste conceal a Slaaneshi circle whose private indulgences demand servants, victims, and ever greater freedom from restraint. Abductions feed its rites, while influential patrons keep inquiries from reaching the doors behind which their neighbors disappear.\n\nExpose the patrons and enter the secluded estates where the cult gathers. Arathar's devotees will take up arms when wealth and influence can no longer protect them. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y73:0 "Blackfang's Worshippers Enclave"
 desc_war_enclave_Y73:0 "Gharr Blackfang's Beastmen have made the wild approaches of Arithor a shrine to the terror of Blackfang, the Chimera of the Annulii. The beast's legend gives their scattered raiders a common idol and a reason to gather trophies from the mountain roads. Travelers are carried to crude altars, and each unanswered raid strengthens the herd's claim that the heights belong to monsters."
 war_root_out_Y73_title:0 "Root Out Blackfang's Worshippers"
 war_root_out_Y73_desc:0 "Gharr Blackfang's Beastmen have made the wild approaches of Arithor a shrine to the terror of Blackfang, the Chimera of the Annulii. The beast's legend gives their scattered raiders a common idol and a reason to gather trophies from the mountain roads. Travelers are carried to crude altars, and each unanswered raid strengthens the herd's claim that the heights belong to monsters.\n\nBreak the roadside hunting camps and advance on the herd's altars. Gharr's followers will defend the places where they offer their captives to Blackfang's memory. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y74:0 "Blackpine Autarii Enclave"
 desc_war_enclave_Y74:0 "Draleth Blackpine leads Shade families in the trackless country around Skarnshade. These Autarii preserve the independence of Naggaroth's wilderness clans, rejecting the taxes and commands of distant city lords. They intercept slave columns and supply trains, sell what they seize, and vanish into terrain that punishes the heavily armed expeditions sent to bring them to heel."
 war_root_out_Y74_title:0 "Root Out Blackpine Autarii"
 war_root_out_Y74_desc:0 "Draleth Blackpine leads Shade families in the trackless country around Skarnshade. These Autarii preserve the independence of Naggaroth's wilderness clans, rejecting the taxes and commands of distant city lords. They intercept slave columns and supply trains, sell what they seize, and vanish into terrain that punishes the heavily armed expeditions sent to bring them to heel.\n\nCut the tracks between the Shade camps and force Blackpine's families to defend their refuge. Their knowledge of the wilderness will make every approach contested. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y75:0 "Hotek's Lost Apprentices Enclave"
 desc_war_enclave_Y75:0 "Vaelir Ashforge's renegade smiths work in concealed foundries in Shadowfrost. Claiming the legacy of Hotek, they seek mastery of forbidden runes and weapons beyond the supervision of Naggaroth's rulers. Raids on royal workshops provide metal, tools, and skilled captives, while secret commissions give ambitious patrons reason to protect artisans they would publicly condemn."
 war_root_out_Y75_title:0 "Root Out Hotek's Lost Apprentices"
 war_root_out_Y75_desc:0 "Vaelir Ashforge's renegade smiths work in concealed foundries in Shadowfrost. Claiming the legacy of Hotek, they seek mastery of forbidden runes and weapons beyond the supervision of Naggaroth's rulers. Raids on royal workshops provide metal, tools, and skilled captives, while secret commissions give ambitious patrons reason to protect artisans they would publicly condemn.\n\nSeize the concealed foundries and interrupt the supply of stolen craftsmen and equipment. Ashforge's followers will defend the workshops on which their independence depends. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y76:0 "Deadwood Unbound Enclave"
 desc_war_enclave_Y76:0 "Hakon Freedhand's fugitives have fortified the timber works of Deadwood. Escaped foreign captives use the tools of their former labor to raise palisades, stock provisions, and prepare for the slavers' return. Rescue raids bring new hands into the settlement, while Druchii masters and opportunistic Norse raiders watch for a chance to seize the people sheltering behind its walls."
 war_root_out_Y76_title:0 "Root Out Deadwood Unbound"
 war_root_out_Y76_desc:0 "Hakon Freedhand's fugitives have fortified the timber works of Deadwood. Escaped foreign captives use the tools of their former labor to raise palisades, stock provisions, and prepare for the slavers' return. Rescue raids bring new hands into the settlement, while Druchii masters and opportunistic Norse raiders watch for a chance to seize the people sheltering behind its walls.\n\nSurround the fortified timber works and confront the free settlement's defenders. Freedhand's people will treat the advance as another attempt to carry them back into bondage. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y77:0 "Rimejaw Families Enclave"
 desc_war_enclave_Y77:0 "Rulgh Rimejaw's Troll families shelter in the frozen gullies of Nightair. Driven to resist the beastmasters who would chain them, they feed on baggage trains, herd animals, and patrols separated from their support. Their scattered dens make a single decisive hunt difficult, while every unattended carcass draws more of the clan down from the cold heights."
 war_root_out_Y77_title:0 "Root Out Rimejaw Families"
 war_root_out_Y77_desc:0 "Rulgh Rimejaw's Troll families shelter in the frozen gullies of Nightair. Driven to resist the beastmasters who would chain them, they feed on baggage trains, herd animals, and patrols separated from their support. Their scattered dens make a single decisive hunt difficult, while every unattended carcass draws more of the clan down from the cold heights.\n\nSearch the gullies and bring the Troll families to battle before they scatter. Rimejaw's followers will defend their dens against hunters and beastmasters alike. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y78:0 "Vashnaar's Foothold Enclave"
 desc_war_enclave_Y78:0 "Vashnaar the Tormentor has established a gathering ground at Gorepeak for Chaos warriors and Druchii adventurers. His followers combine the strength of armored northern fighters with the cruelty and discipline of Naggaroth's exiles. Raids provision the camp and recruit captives for its labor gangs, while Vashnaar turns his attention toward the wealth and ancient cities of Lustria."
 war_root_out_Y78_title:0 "Root Out Vashnaar's Foothold"
 war_root_out_Y78_desc:0 "Vashnaar the Tormentor has established a gathering ground at Gorepeak for Chaos warriors and Druchii adventurers. His followers combine the strength of armored northern fighters with the cruelty and discipline of Naggaroth's exiles. Raids provision the camp and recruit captives for its labor gangs, while Vashnaar turns his attention toward the wealth and ancient cities of Lustria.\n\nStrike the gathering ground before Vashnaar can turn its accumulated strength toward a greater conquest. His mixed host will rally to defend the stores and captives that sustain it. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y79:0 "Cylostra's Drowned Enclave"
 desc_war_enclave_Y79:0 "Cylostra Direfin's drowned court haunts the shore of Blightward. The Bretonnian singer's death at sea left her bound to an audience and crew who can no longer escape the performance. Ghostly sailors and waterlogged dead raid the coast in her service, threatening shipping and competing with Druchii slavers for the living who still dare to approach her waters."
 war_root_out_Y79_title:0 "Root Out Cylostra's Drowned"
 war_root_out_Y79_desc:0 "Cylostra Direfin's drowned court haunts the shore of Blightward. The Bretonnian singer's death at sea left her bound to an audience and crew who can no longer escape the performance. Ghostly sailors and waterlogged dead raid the coast in her service, threatening shipping and competing with Druchii slavers for the living who still dare to approach her waters.\n\nSecure the haunted landings and confront Direfin's dead ashore. Her drowned retainers will gather when the refuge of their eternal performance is disturbed. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y80:0 "Azure Fang Brood Enclave"
 desc_war_enclave_Y80:0 "Tzak-Huax leads the Azure Fang Brood around the ancient sites of Tlacox. Isolated from the guidance of the great temple-cities, its Lizardmen defend spawning grounds and ruined sanctuaries through inherited custom and immediate necessity. Druchii logging parties and settlers meet ambushes beyond their clearings, while the brood dismantles new works raised on ground it has guarded for generations."
 war_root_out_Y80_title:0 "Root Out Azure Fang Brood"
 war_root_out_Y80_desc:0 "Tzak-Huax leads the Azure Fang Brood around the ancient sites of Tlacox. Isolated from the guidance of the great temple-cities, its Lizardmen defend spawning grounds and ruined sanctuaries through inherited custom and immediate necessity. Druchii logging parties and settlers meet ambushes beyond their clearings, while the brood dismantles new works raised on ground it has guarded for generations.\n\nAdvance beyond the clearings and confront the brood at its guarded approaches. Tzak-Huax's warriors will defend the spawning grounds and ruins from another encroachment. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y81:0 "Port Reaver Enclave"
 desc_war_enclave_Y81:0 "Lorenzo Saltavento's sea captains hold the quays and storehouses of Port Reaver. The settlement traces its founding to Lucciano Soprania, who established the pirate haven in 1801 after losing his position on Sartosa. Its present crews live by stolen cargo and expeditions into Lustria, turning a precarious coastal foothold into a market for plunder that neighboring powers cannot easily control."
 war_root_out_Y81_title:0 "Root Out Port Reaver"
 war_root_out_Y81_desc:0 "Lorenzo Saltavento's sea captains hold the quays and storehouses of Port Reaver. The settlement traces its founding to Lucciano Soprania, who established the pirate haven in 1801 after losing his position on Sartosa. Its present crews live by stolen cargo and expeditions into Lustria, turning a precarious coastal foothold into a market for plunder that neighboring powers cannot easily control.\n\nTake the quays and deny the captains access to their warehouses and landing places. Saltavento's crews will come ashore to defend the port that buys their plunder. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y82:0 "Swamp Town Enclave"
 desc_war_enclave_Y82:0 "Konrad Reedhaven speaks for the traders, fugitives, and fortune seekers of Swamp Town. Its timber houses and muddy wharves offer a comparatively safe place to barter on a coast troubled by pirates and the dangers of Lustria. The townsfolk defend that freedom with armed watches and guarded stores, resisting outside rulers whose taxes or garrisons might turn a refuge into another possession."
 war_root_out_Y82_title:0 "Root Out Swamp Town"
 war_root_out_Y82_desc:0 "Konrad Reedhaven speaks for the traders, fugitives, and fortune seekers of Swamp Town. Its timber houses and muddy wharves offer a comparatively safe place to barter on a coast troubled by pirates and the dangers of Lustria. The townsfolk defend that freedom with armed watches and guarded stores, resisting outside rulers whose taxes or garrisons might turn a refuge into another possession.\n\nBring the wharves and stockades under our authority. Reedhaven's townsfolk will defend the independence on which their trade and refuge depend. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y83:0 "Sven's River Company Enclave"
 desc_war_enclave_Y83:0 "Sven Hasselfriesian's river company maintains a fortified camp in Xotlzax. The exiled Dwarf engineer brought his appetite for invention to Lustria, where steamboats and stubborn crews carry explorers far beyond the coastal settlements. Their demands for fuel, salvage, and access to ancient sites draw resistance from the Lizardmen, but Sven's followers regard each obstacle as something to engineer or shoot their way through."
 war_root_out_Y83_title:0 "Root Out Sven's River Company"
 war_root_out_Y83_desc:0 "Sven Hasselfriesian's river company maintains a fortified camp in Xotlzax. The exiled Dwarf engineer brought his appetite for invention to Lustria, where steamboats and stubborn crews carry explorers far beyond the coastal settlements. Their demands for fuel, salvage, and access to ancient sites draw resistance from the Lizardmen, but Sven's followers regard each obstacle as something to engineer or shoot their way through.\n\nSeize the river camp and deny the company its fuel and landing places. Sven's crews will defend the workshops and vessels that make their inland ventures possible. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y84:0 "Bregonne Enclave"
 desc_war_enclave_Y84:0 "Marcel de Parravon's Bretonnian settlers hold a fortified foothold in Axmin under the name of Bregonne. Knights and adventurers have carried their familiar ranks and claims into a land whose temples they regard as sources of treasure. Stolen relics finance the settlement, while Lizardmen patrols contest every expedition sent beyond its walls to enlarge this distant piece of Bretonnia."
 war_root_out_Y84_title:0 "Root Out Bregonne"
 war_root_out_Y84_desc:0 "Marcel de Parravon's Bretonnian settlers hold a fortified foothold in Axmin under the name of Bregonne. Knights and adventurers have carried their familiar ranks and claims into a land whose temples they regard as sources of treasure. Stolen relics finance the settlement, while Lizardmen patrols contest every expedition sent beyond its walls to enlarge this distant piece of Bretonnia.\n\nSurround the colonial fort and cut the roads used by its temple raiders. Marcel's knights and settlers will gather to defend their foothold and the riches stored within it. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y85:0 "Nuevo Luccini Enclave"
 desc_war_enclave_Y85:0 "Marco Venturi's captains maintain Nuevo Luccini among the waterways of Tzul'cata. The Tilean settlement lives on river trade, piracy, and the sale of goods whose owners rarely accompany them to market. Competing colonial agents find willing smugglers behind its wharves, while armed crews resist attempts by neighboring authorities to inspect cargo or claim a share of the proceeds."
 war_root_out_Y85_title:0 "Root Out Nuevo Luccini"
 war_root_out_Y85_desc:0 "Marco Venturi's captains maintain Nuevo Luccini among the waterways of Tzul'cata. The Tilean settlement lives on river trade, piracy, and the sale of goods whose owners rarely accompany them to market. Competing colonial agents find willing smugglers behind its wharves, while armed crews resist attempts by neighboring authorities to inspect cargo or claim a share of the proceeds.\n\nTake the river landings and close the warehouses sheltering stolen cargo. Venturi's crews will defend a port whose prosperity depends on keeping outside officials at bay. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y86:0 "Amber Maw Expedition Enclave"
 desc_war_enclave_Y86:0 "Borgut Ambermaw's Ogres have abandoned their employers and made their own camp in Xolt. The expedition feeds on the great beasts of Lustria and plunders the stores of anyone who ventures within reach. Sacred animals and guarded spawning pools hold no special claim on the Maneaters' restraint, bringing the camp into repeated conflict with the Lizardmen who defend them."
 war_root_out_Y86_title:0 "Root Out Amber Maw Expedition"
 war_root_out_Y86_desc:0 "Borgut Ambermaw's Ogres have abandoned their employers and made their own camp in Xolt. The expedition feeds on the great beasts of Lustria and plunders the stores of anyone who ventures within reach. Sacred animals and guarded spawning pools hold no special claim on the Maneaters' restraint, bringing the camp into repeated conflict with the Lizardmen who defend them.\n\nClose on the expedition's camp and end its raids on the surrounding sacred sites. Ambermaw's Maneaters will defend their supplies and the hunting grounds that feed them. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y87:0 "Ashen Plaque Covenant Enclave"
 desc_war_enclave_Y87:0 "Xol-Tzek's Ashen Plaque Covenant holds dissident shrines in Xaltlan. Its Skink priests teach that the Slann's reading of the Great Plan has failed, and that living dragons must receive the blood once offered under older rites. Converts carry sacred objects into the renegade sanctuaries, while attacks on loyal temple servants turn a dispute over prophecy into open hostility."
 war_root_out_Y87_title:0 "Root Out Ashen Plaque Covenant"
 war_root_out_Y87_desc:0 "Xol-Tzek's Ashen Plaque Covenant holds dissident shrines in Xaltlan. Its Skink priests teach that the Slann's reading of the Great Plan has failed, and that living dragons must receive the blood once offered under older rites. Converts carry sacred objects into the renegade sanctuaries, while attacks on loyal temple servants turn a dispute over prophecy into open hostility.\n\nEnter the dissident shrines and break Xol-Tzek's control over their warriors. The covenant will defend the altars on which it has staked its challenge to the Slann. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y88:0 "Culchan Feather Exiles Enclave"
 desc_war_enclave_Y88:0 "Itzara Culchanfeather's Amazon exiles range across the Southern Plains. Rejection of their queen's alliances has left them dependent on their own hunters, guarded camps, and swift raids. Temple stores and foreign expeditions provide supplies for the company, while captured weapons and growing bands of disaffected warriors sustain the hope of returning home on their own terms."
 war_root_out_Y88_title:0 "Root Out Culchan Feather Exiles"
 war_root_out_Y88_desc:0 "Itzara Culchanfeather's Amazon exiles range across the Southern Plains. Rejection of their queen's alliances has left them dependent on their own hunters, guarded camps, and swift raids. Temple stores and foreign expeditions provide supplies for the company, while captured weapons and growing bands of disaffected warriors sustain the hope of returning home on their own terms.\n\nLocate the exiles' camps and cut off the raids that provision them. Culchanfeather's warriors will defend the stores and followers on which their return depends. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y89:0 "Deep Drum Hold Enclave"
 desc_war_enclave_Y89:0 "Grundi Deepdrum's Dwarfs hold a secluded mine beneath Izaltl. Descendants of a lost expedition, they have made the workings a home and the surrounding ore deposits a claim recorded in their own books of possession. Lizardmen labor parties and temple guards dispute those rights, while Deepdrum's miners answer interference with fortified galleries and armed sorties into the jungle."
 war_root_out_Y89_title:0 "Root Out Deep Drum Hold"
 war_root_out_Y89_desc:0 "Grundi Deepdrum's Dwarfs hold a secluded mine beneath Izaltl. Descendants of a lost expedition, they have made the workings a home and the surrounding ore deposits a claim recorded in their own books of possession. Lizardmen labor parties and temple guards dispute those rights, while Deepdrum's miners answer interference with fortified galleries and armed sorties into the jungle.\n\nSecure the mine approaches and confront Deepdrum's garrison in its claimed workings. The hold will defend its ore and ancestral settlement with the stubbornness of a much greater karak. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y90:0 "Clan Skaar Enclave"
 desc_war_enclave_Y90:0 "Krizzik Oreclaw directs Clan Skaar's miners beneath Falco. The clan's wealth rests on warpstone, and its leaders play the needs of Moulder and Skryre against one another to avoid becoming the servants of either. Secret shafts reach toward fresh deposits while slave gangs haul the ore away, leaving subsidence, missing workers, and violent disputes beneath the surface settlements."
 war_root_out_Y90_title:0 "Root Out Clan Skaar"
 war_root_out_Y90_desc:0 "Krizzik Oreclaw directs Clan Skaar's miners beneath Falco. The clan's wealth rests on warpstone, and its leaders play the needs of Moulder and Skryre against one another to avoid becoming the servants of either. Secret shafts reach toward fresh deposits while slave gangs haul the ore away, leaving subsidence, missing workers, and violent disputes beneath the surface settlements.\n\nFind the ore shafts and cut the routes carrying warpstone out of the enclave. Oreclaw's warriors will defend the mines that purchase his clan's independence. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y91:0 "Clan Skaul Enclave"
 desc_war_enclave_Y91:0 "Skaalrik Dreamfang's Clan Skaul burrows beneath Weissbuck. Known for warpstone narcotics and a remarkable number of horned young, the clan feeds both its appetites and its ambitions through crowded breeding pits and illicit trade. Kidnapping gangs supply labor and victims, while struggles over drugs and privilege spill from the warrens into the streets above."
 war_root_out_Y91_title:0 "Root Out Clan Skaul"
 war_root_out_Y91_desc:0 "Skaalrik Dreamfang's Clan Skaul burrows beneath Weissbuck. Known for warpstone narcotics and a remarkable number of horned young, the clan feeds both its appetites and its ambitions through crowded breeding pits and illicit trade. Kidnapping gangs supply labor and victims, while struggles over drugs and privilege spill from the warrens into the streets above.\n\nClose the clan's trading passages and advance on Dreamfang's hidden dens. Its gangs will gather to defend the stores and captive labor on which their excess depends. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y92:0 "Clan Sleekit Enclave"
 desc_war_enclave_Y92:0 "Fleetmaster Shipgnawer Nikkitt's Clan Sleekit controls hidden docks beneath Fielbach, linked to the river traffic of Under-Altdorf. Its barges carry Skaven goods, warriors, and contraband through channels the surface authorities scarcely understand. Dockside theft and sudden interruptions to trade reveal only fragments of the network, while armed crews ensure that those who discover its landings seldom return to report them."
 war_root_out_Y92_title:0 "Root Out Clan Sleekit"
 war_root_out_Y92_desc:0 "Fleetmaster Shipgnawer Nikkitt's Clan Sleekit controls hidden docks beneath Fielbach, linked to the river traffic of Under-Altdorf. Its barges carry Skaven goods, warriors, and contraband through channels the surface authorities scarcely understand. Dockside theft and sudden interruptions to trade reveal only fragments of the network, while armed crews ensure that those who discover its landings seldom return to report them.\n\nSeize the concealed docks and block Nikkitt's barge routes. Sleekit's crews will fight ashore when the river network that sustains them is threatened. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y93:0 "Clan Septik Enclave"
 desc_war_enclave_Y93:0 "Blightskab's Clan Septik Plaguepack shelters beneath Dotternbach. Fanatical servants of Pestilens, its warriors wrap diseased bodies in filthy bandages and carry corroded weapons into the tunnels around their refuge. They spread infection through stolen supplies and contaminated passages, weakening the settlements above before emerging to harvest captives and claim the stricken ground."
 war_root_out_Y93_title:0 "Root Out Clan Septik"
 war_root_out_Y93_desc:0 "Blightskab's Clan Septik Plaguepack shelters beneath Dotternbach. Fanatical servants of Pestilens, its warriors wrap diseased bodies in filthy bandages and carry corroded weapons into the tunnels around their refuge. They spread infection through stolen supplies and contaminated passages, weakening the settlements above before emerging to harvest captives and claim the stricken ground.\n\nTrace the sources of infection to the Plaguepack's tunnels and destroy its refuge. Blightskab's zealots will gather to defend the filth they regard as sacred. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y94:0 "Clan Kreepus Enclave"
 desc_war_enclave_Y94:0 "Garrott of Mordheim leads Clan Kreepus from a concealed warren in Eaglecrest. Once enslaved by a rival clan, the Kreepus rats won freedom with poisoned daggers supplied by Eshin, wielding them with their tails when shackles bound their paws. Their debt became willing service, and the clan now turns that murderous skill against officials, rivals, and patrols that threaten its refuge."
 war_root_out_Y94_title:0 "Root Out Clan Kreepus"
 war_root_out_Y94_desc:0 "Garrott of Mordheim leads Clan Kreepus from a concealed warren in Eaglecrest. Once enslaved by a rival clan, the Kreepus rats won freedom with poisoned daggers supplied by Eshin, wielding them with their tails when shackles bound their paws. Their debt became willing service, and the clan now turns that murderous skill against officials, rivals, and patrols that threaten its refuge.\n\nExpose the assassins' warren and cut their escape passages. Garrott's followers will defend the freedom and patronage they purchased through murder. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y95:0 "Clan Feesik Enclave"
 desc_war_enclave_Y95:0 "Rikzik Seepage's Clan Feesik festers beneath the Mangrove Delta. Poverty and filth have made the clan a fitting client for Pestilens, though its professions of devotion conceal the same struggle for survival that drives any lesser Skaven power. Fouled irrigation channels spread sickness through the fields above, while stolen harvests and captive labor keep Seepage's hungry warrens alive."
 war_root_out_Y95_title:0 "Root Out Clan Feesik"
 war_root_out_Y95_desc:0 "Rikzik Seepage's Clan Feesik festers beneath the Mangrove Delta. Poverty and filth have made the clan a fitting client for Pestilens, though its professions of devotion conceal the same struggle for survival that drives any lesser Skaven power. Fouled irrigation channels spread sickness through the fields above, while stolen harvests and captive labor keep Seepage's hungry warrens alive.\n\nFollow the contaminated channels and cut off the clan's hidden stores. Feesik's warriors will rise to defend the warrens that shelter them from hunger and stronger rivals. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y96:0 "Clan Gratzz Enclave"
 desc_war_enclave_Y96:0 "Gratzik Rotwhisker's Clan Gratzz occupies plague warrens below Xotec. Bound to the Pestilent Brotherhood but resentful of its greater masters, the clan seeks captives and sacred spoils with which to improve its standing. Raids on spawning pools and temple supplies spread disease through the surrounding jungle, while Rotwhisker hides the best of the plunder from those who demand his obedience."
 war_root_out_Y96_title:0 "Root Out Clan Gratzz"
 war_root_out_Y96_desc:0 "Gratzik Rotwhisker's Clan Gratzz occupies plague warrens below Xotec. Bound to the Pestilent Brotherhood but resentful of its greater masters, the clan seeks captives and sacred spoils with which to improve its standing. Raids on spawning pools and temple supplies spread disease through the surrounding jungle, while Rotwhisker hides the best of the plunder from those who demand his obedience.\n\nFind the plague warrens and intercept the raiders returning from the sacred pools. Rotwhisker's followers will defend the spoils on which their ambitions depend. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y97:0 "Clan Rikket Enclave"
 desc_war_enclave_Y97:0 "Rikkaz Warpwake's Clan Rikket shelters its vessels in the hidden shipyards of Ratscar. One of the Skaven's seafaring clans, it contests the trade and raiding grounds claimed by Skurvy and Skuttle. Captives labor beneath tar-stained timbers, stolen cargo fills the caves, and new hulls take shape for voyages that threaten both coastal settlements and rival rat fleets."
 war_root_out_Y97_title:0 "Root Out Clan Rikket"
 war_root_out_Y97_desc:0 "Rikkaz Warpwake's Clan Rikket shelters its vessels in the hidden shipyards of Ratscar. One of the Skaven's seafaring clans, it contests the trade and raiding grounds claimed by Skurvy and Skuttle. Captives labor beneath tar-stained timbers, stolen cargo fills the caves, and new hulls take shape for voyages that threaten both coastal settlements and rival rat fleets.\n\nTake the shipyards and deny Rikket the stores needed to refit its vessels. Warpwake's crews will come ashore to defend the harbor that keeps them at sea. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y98:0 "Clan Skuttle Enclave"
 desc_war_enclave_Y98:0 "Skuttik Bilgetail's Clan Skuttle keeps an armed anchorage in Dusklair. The clan commands one of the largest Skaven fleets, second only to Skurvy, and its crews prize ships that can be captured intact and pressed into service. Boarding raids feed the harbor with stolen hulls, cargo, and labor, while rivalry with other clans keeps its guards as watchful inland as at sea."
 war_root_out_Y98_title:0 "Root Out Clan Skuttle"
 war_root_out_Y98_desc:0 "Skuttik Bilgetail's Clan Skuttle keeps an armed anchorage in Dusklair. The clan commands one of the largest Skaven fleets, second only to Skurvy, and its crews prize ships that can be captured intact and pressed into service. Boarding raids feed the harbor with stolen hulls, cargo, and labor, while rivalry with other clans keeps its guards as watchful inland as at sea.\n\nStorm the anchorage and seize the captured hulls before they can sail again. Bilgetail's boarding crews will turn their weapons on anyone who threatens their ships and plunder. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
 war_enclave_Y99:0 "Clan Gristlecrack Enclave"
 desc_war_enclave_Y99:0 "Grissk Fleshsuture's Clan Gristlecrack operates hidden flesh-workshops beneath Snikt. The enclave's handlers trade captives and malformed beasts to Moulder buyers, testing their own crude surgery on whatever the raiding gangs drag below. Escaped specimens prowl the outer tunnels, while slave auctions and stolen livestock keep the workshops supplied with bodies that living settlements can ill afford to lose."
 war_root_out_Y99_title:0 "Root Out Clan Gristlecrack"
 war_root_out_Y99_desc:0 "Grissk Fleshsuture's Clan Gristlecrack operates hidden flesh-workshops beneath Snikt. The enclave's handlers trade captives and malformed beasts to Moulder buyers, testing their own crude surgery on whatever the raiding gangs drag below. Escaped specimens prowl the outer tunnels, while slave auctions and stolen livestock keep the workshops supplied with bodies that living settlements can ill afford to lose.\n\nEnter the flesh-workshops and break the trade in captives and altered beasts. Fleshsuture's handlers will unleash their surviving experiments to defend the pens. The enclave modifier will be removed, but separatist rebels will immediately occupy the province."
