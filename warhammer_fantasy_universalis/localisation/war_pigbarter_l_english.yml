l_english:

pigbarter_events.1000.t:0 "The Morning Toll Dispute"
pigbarter_events.1000.d:0 "A Pigbarter merchant reaches the court at [Root.Capital.GetName] with a broken toll pole and a bill for six missing pigs. An Ogre escort broke the pole after being charged twice for the same caravan. The toll keeper insists that a second payment was due because the Ogre ate one pig while crossing.\n\nA Gnoblar porter arrives carrying the caravan's strongbox, followed by guards who have been looking for it since dawn. Inside are jade, ivory receipts, and a Chaos Dwarf contract offering protection to any merchant willing to surrender his warehouses as security.\n\nThe guards bring the disputing parties before [Root.Monarch.GetName] while the rest of the caravan waits outside. Trade along the River Ruin keeps our settlements supplied, but every collector and hired sword wants a separate share. The court needs tolls that merchants can understand and captains who will enforce them."
pigbarter_events.1000.a:0 "Set the tolls and organize the caravan guards."

pigbarter_events.1.t:0 "Two Bids from the Same Merchant"
pigbarter_events.1.d:0 "At the River Ruin toll auction, factor Hessel bids against a masked buyer seated behind the boatmen. A clerk notices that both bidders send instructions through the same servant. When challenged, the masked buyer admits that Hessel paid him to frighten the other bidders away.\n\nThe boatmen demand that the auction be canceled, but Hessel offers a larger advance if his bid is accepted. His foreign partners have already promised their customers passage at favorable rates. The harbor captain seals the bid chest and asks the court to settle the dispute before the collectors return to the wharves."
pigbarter_events.1.a:0 "Take Hessel's advance and grant the local toll monopoly despite foreign complaints."
pigbarter_events.1.b:0 "Fund harbor patrols and channel surveys under our officers."
pigbarter_events.1.c:0 "Publicly back the boatmen and expose Hessel's scheme to the envoys."

pigbarter_events.2.t:0 "Skrik's Crew Under the Wharf"
pigbarter_events.2.d:0 "Gnoblar foreman Skrik brings a gang of porters to a damaged wharf and offers to replace its piles for half the builders' usual price. By noon, his crew has lifted the first section and stacked the usable timber. The builders' guild responds by removing every ladder from the site.\n\nSkrik demands an advance and permission to work without the guild's approval. The harbor master says he can instead assign soldiers to unload cargo under strict quotas, collecting the overdue handling fees himself. Boats are waiting beyond the broken landing, and neither crew will begin without an order."
pigbarter_events.2.a:0 "Pay Skrik's crew and negotiate their right to take building contracts."
pigbarter_events.2.b:0 "Divert soldiers to the wharves and collect the handling fees."

pigbarter_events.3.t:0 "The Strix That Brought a Red Sash"
pigbarter_events.3.d:0 "Falconer Marta's great eagle owl returns to its roost with a torn red sash caught in its talons. Marta recognizes the cloth worn by a caravan watchman and follows the bird to a reed bed beside the road. She finds the watchman bound there, within sight of raiders hiding stolen wagons.\n\nThe rescued man gives the guards time to catch the raiders before they move the cargo. Marta brings his testimony to the court and asks for more roosts along the approaches to our markets.\n\nMerchants begin bidding for exclusive warning signals from her handlers. The watch captain protests that a warning is useless if no patrol can reach the raiders. Marta refuses to issue further reports until someone settles who will pay her staff."
pigbarter_events.3.a:0 "Fund the roosts and recruit handlers as informants."
pigbarter_events.3.b:0 "Negotiate paid warning contracts with the merchants."
pigbarter_events.3.c:0 "Assign troops to night patrols under the handlers' guidance."
pigbarter_events.3.dd:0 "Give her reports to our envoys without payment, despite her protests."

pigbarter_events.4.t:0 "A Warehouse in the Fine Print"
pigbarter_events.4.d:0 "A Chaos Dwarf factor presents a debt tablet at our market court and demands possession of a riverside warehouse. The owner says he borrowed money for roof repairs, but the factor points to a clause giving his masters the building if a single payment arrives late. Armed retainers are already standing across its doors.\n\nThe warehouse contains cargo belonging to several merchants who never signed the loan. When the watch approaches, the factor warns that interference will be reported to Zharr-Naggrund. The merchants bring their receipts to [Root.Monarch.GetName] and demand access to their goods."
pigbarter_events.4.a:0 "Pay the disputed installment to reopen the warehouse."
pigbarter_events.4.b:0 "Assign soldiers to covert surveillance and steal the factor's records."
pigbarter_events.4.c:0 "Pay and train a detachment to evict his guards, accepting losses."

pigbarter_events.5.t:0 "The Pig That Broke the Lists"
pigbarter_events.5.d:0 "At the market's pig-jousting contest, a rider named Odo loses his lance and drives his mount straight through the judges' table. The pig escapes into a grain stall while the crowd carries Odo around the ring as the winner. Two rival bookmakers refuse to pay, each claiming that the bout never finished.\n\nThe militia captain arrives to find his own recruits among the spectators. They offer to rebuild the ring and hold supervised contests if the court will recognize the games. The bookmakers instead offer a share of the wagers, provided the watch enforces their debts."
pigbarter_events.5.a:0 "Fund supervised games to build the troops' confidence."
pigbarter_events.5.b:0 "License and tax the betting despite the visitors' complaints."
pigbarter_events.5.c:0 "Break up the games and return the recruits to military training."

pigbarter_events.6.t:0 "A Caravan Mule Without Its Driver"
pigbarter_events.6.d:0 "A mule carrying two ivory tusks wanders into a roadside guard post without its driver. Its harness bears the mark of a caravan overdue at our markets, and an arrow is lodged in one of the pack frames. The watch sends a patrol along its tracks but turns back after finding armed raiders on the ridge.\n\nThe caravan's factor gathers the families of the missing drivers outside the court. A mercenary captain offers to lead a rescue if our troops carry supplies and accept his command. The treasury clerk confirms that we guaranteed part of the cargo and must pay compensation if it cannot be recovered."
pigbarter_events.6.a:0 "Fund a rescue under the mercenary captain and assign troops to his column."
pigbarter_events.6.b:0 "Pay compensation for the lost caravan."

pigbarter_events.7.t:0 "Brugg's Bodyguard Office"
pigbarter_events.7.d:0 "An Ogre named Brugg nails a painted shield above a livestock shed and announces that all bodyguard contracts must pass through his new guild. Three merchants sign before midday after he demonstrates his service by throwing a thief into a watering trough. By evening, unaffiliated guards complain that his followers are blocking their customers.\n\nBrugg arrives at the court with a sample contract and a demand for a regular meat allowance. He offers reliable fighters if hired, but insists that a licensed guild should collect fees from every rival company. The watch keeps his followers outside while the merchants argue over how much protection they can afford."
pigbarter_events.7.a:0 "Hire Brugg's company on regular mercenary contracts."
pigbarter_events.7.b:0 "License the guild and collect its fees despite foreign complaints."
pigbarter_events.7.c:0 "Negotiate limits on the guild's contracts and settle the dispute."
pigbarter_events.7.dd:0 "Buy meat for the Ogres and hold joint musters with our troops."

pigbarter_events.8.t:0 "The Channel Beneath the Red Mark"
pigbarter_events.8.d:0 "Smuggler Voss offers our harbor master a chart of the Scalded Delta with a narrow channel marked in red. He says a boat can pass there at high water and emerge beyond the toll landing. To prove it, he produces a receipt for cargo that arrived without passing any of our collectors.\n\nThe harbor master sends a small boat to check the entrance and confirms that the channel exists. Voss refuses to reveal the remaining soundings until he is paid. His chart also names the warehouses that receive untaxed goods, giving the court a reason to examine more than the waterway."
pigbarter_events.8.a:0 "Buy the chart and use it to guide longer voyages through the delta."
pigbarter_events.8.b:0 "Have our agents copy the chart and investigate the smugglers' contacts."

pigbarter_events.9.t:0 "Names in the Shrine's Debt Book"
pigbarter_events.9.d:0 "A porter escapes from a debtor shrine with an iron token stamped with the bull of Hashut. He tells the watch that men seeking extensions on their loans are being held in a cellar until a caravan can take them away. One of the missing borrowers serves in our own militia.\n\nAn informant finds a debt book listing the prisoners as goods promised to a Chaos Dwarf buyer. The shrine keeper refuses entry to the watch and calls armed retainers into the courtyard.\n\nFamilies of the missing gather at the gate, while neighboring lenders insist that an investigation would ruin honest business. The watch captain warns that a raid will become a street battle. He asks for orders before the buyer's caravan leaves."
pigbarter_events.9.a:0 "Storm the shrine and break the gang despite the unrest and casualties."
pigbarter_events.9.b:0 "Pay informants and negotiate the prisoners' release."
pigbarter_events.9.c:0 "Have our envoys excuse the shrine's privileges, sacrificing taxes and trust."

pigbarter_events.10.t:0 "Coughing in the Pig Pens"
pigbarter_events.10.d:0 "A pig dealer in [event_target.GetName] finds several animals coughing blood before the morning sale. He moves the healthy-looking pigs into a neighboring pen, but its keeper notices the stained straw and calls the market inspector. Two carcasses are found beneath a loading cart.\n\nThe inspector closes the gate while buyers demand repayment for animals already taken away. A butcher offers to purchase the remaining stock immediately, and nearby traders threaten to force the market open. The magistrate sends the court a count of the infected pens and the cost of destroying them."
pigbarter_events.10.a:0 "Enforce a long quarantine despite the damage to the district."
pigbarter_events.10.b:0 "Sell the stock despite the disease and damage to our reputation."
pigbarter_events.10.c:0 "Pay to destroy the infected stock and burn the emptied pens."
