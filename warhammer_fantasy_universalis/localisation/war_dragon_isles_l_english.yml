l_english:
 
 dragon_isles_events.1000.t:0 "Tribute at the Crater Steps"
 dragon_isles_events.1000.d:0 "A tribute procession reaches the crater shrine above [Root.Capital.GetName]. Skink bearers carry baskets of gems between files of spear-wielding Saurus, while the blood-priests drag bound captives up the steps. Before the offering is complete, a dragon lands on the upper terrace and devours the first prisoner.\n\nThe surviving bearers flatten themselves against the stone as the priests strike the blood-gong. The dragon takes the gems into its cave, leaving the clan chiefs to count the dead and argue over whose share of the tribute was short. A chief who sent nothing has already withdrawn his warriors from the courtyard.\n\nOn these islands, no Slann comes to settle such disputes, and the plaques of the Old Ones go unread. [Root.Monarch.GetName] must make the clans deliver their dues and keep their warriors together. The dragon will return for another offering whether the chiefs agree or not."
 dragon_isles_events.1000.a:0 "Collect the clan tribute and muster the surviving warriors."

 unreformed_buy_galley_title:0 "Buy a Foreign Galley"
 unreformed_buy_galley_desc:0 "We don't know how to build these yet, but a more civilized nation came along and is offering."
 unreformed_buy_light_ship_title:0 "Buy a Foreign Light Ship"
 unreformed_buy_light_ship_desc:0 "We don't know how to build these yet, but a more civilized nation came along and is offering."

 dragon_isles_events.1.t:0 "Gems for Split Fang"
 dragon_isles_events.1.d:0 "A dragon known to the miners as Split Fang has blocked the gem cave in [event_target.GetName]. It crushed the first tribute basket under one claw and let a single bearer crawl away. The survivor reports that the dragon wants twice the usual offering, with living attendants to carry it into the cave.\n\nThe mine overseer brings the remaining gems to the altar court under guard. A foreign buyer has already offered silver for them, while neighboring clans complain that another demand will fall on their mines if ours refuses. Their messengers are still waiting at the shrine steps."
 dragon_isles_events.1.a:0 "Send gems and warriors as an offering to renew the army's faith."
 dragon_isles_events.1.b:0 "Sell the gems despite the other clans' protests."
 dragon_isles_events.1.c:0 "Negotiate a shared offering with the neighboring clans."

 dragon_isles_events.2.t:0 "The Plaques Beneath the Altar"
 dragon_isles_events.2.d:0 "Workers repairing the Red Crater shrine in [event_target.GetName] uncover a sealed chamber beneath the sacrificial steps. Inside lie gold plaques bearing the signs of the Old Ones. An elderly Skink recognizes a spawning glyph, but the dragon-priest orders him to stop reading.\n\nThe priest claims the tablets record a dragon's blessing upon our ruling brood, although one of the carvings plainly shows a different creature. Word reaches foreign collectors, who send buyers with scales and silver. The guards close the chamber after catching a temple attendant trying to remove a plaque."
 dragon_isles_events.2.a:0 "Pay scholars to preserve and study the original glyphs."
 dragon_isles_events.2.b:0 "Recarve the plaques to confirm our brood's right to rule."
 dragon_isles_events.2.c:0 "Seal the chamber and grant relic licenses to local dealers."

 dragon_isles_events.3.t:0 "The Reed-Scale Hostages"
 dragon_isles_events.3.d:0 "The Reed-Scale clan sends a file of newly spawned warriors to [event_target.GetName], accompanied by their oldest priest. He offers to leave them in our keeping as proof that his chief will obey the next summons. The warriors have brought sleeping mats and provisions, expecting a permanent posting.\n\nOur garrison commander wants to settle the newcomers beside the barracks and train them with his own troops. Their priest objects when he learns that they will be forbidden to return home without permission. The clan's tribute bearers halt outside the gate while the two argue."
 dragon_isles_events.3.a:0 "Keep the warriors as hostages and settle them into the garrison."
 dragon_isles_events.3.b:0 "Take gem tribute instead and send our warriors to collect it."

 dragon_isles_events.4.t:0 "The Pilot and the Broken Rudder"
 dragon_isles_events.4.d:0 "A trader entering the River Ruin strikes an unmarked shoal and limps into an island anchorage with a broken rudder. A Skink pilot named Tzik guides the damaged vessel through the remaining channels. The captain offers to pay him for charts of the passage.\n\nTzik brings the request to the altar court with a list of other wrecks along the route. Our war-canoe crews know the nearby reefs, but none has surveyed the channels beyond them. Several clan chiefs have begun placing their own toll collectors at the landing, each demanding payment from the same ship."
 dragon_isles_events.4.a:0 "Fund channel surveys and drill the escort troops."
 dragon_isles_events.4.b:0 "Collect harbor tolls and reserve pilotage to our traders."
 dragon_isles_events.4.c:0 "Place experienced pilots aboard the fleet to steady its crews."

 dragon_isles_events.5.t:0 "The New Obsidian Field"
 dragon_isles_events.5.d:0 "A vent above [event_target.GetName] has erupted, leaving a field of black volcanic glass across the hillside. Quarry workers return with sharp flakes, and a weapons maker fits them to arrows for a demonstration at the muster ground. The first volley cuts through the hide screens behind the targets.\n\nMiners have begun digging while the lower slope is still hot, forcing nearby families out of their homes. Blood-priests arrive with orders for obsidian idols, and traders demand wagonloads for export. The overseer stops work after a quarry face collapses and asks who will take responsibility for the site."
 dragon_isles_events.5.a:0 "Pay knappers to arm our missile troops."
 dragon_isles_events.5.b:0 "Expand the quarry and sell the glass despite the damage."
 dragon_isles_events.5.c:0 "Quarry glass for missionary idols, whatever the cost to the settlement."
 dragon_isles_events.5.dd:0 "Close the quarry and settle the displaced families beside our barracks."

 dragon_isles_events.6.t:0 "Red Maw Descends"
 dragon_isles_events.6.d:0 "The watch fires above [event_target.GetName] go out shortly before dawn. A survivor reaches the nearest altar with burns across his back and reports that the dragon called Red Maw has left its cave. It has already torn open a cattle pen and eaten the herdsmen who tried to drive it off.\n\nThe blood-priest orders livestock brought to the old feeding terrace, but the clan's herds have scattered. Below the slope, warriors gather around the blood-gong while families carry eggs and provisions away from the fields. Red Maw is circling back toward the settlement."
 dragon_isles_events.6.a:0 "Buy enough livestock to feed the dragon."
 dragon_isles_events.6.b:0 "Order the warriors to hold the settlement, whatever the losses."

 dragon_isles_events.7.t:0 "Blood in the Spawning Pool"
 dragon_isles_events.7.d:0 "Pool keeper Otl finds a broken sacrificial drain emptying into a spawning pool in [event_target.GetName]. The warriors emerging from the red water attack their attendants and tear apart the reed pens around the bank. Otl bars the outer gate with two wounded guards still inside.\n\nThe blood-priest declares the frenzy a blessing and orders the gate reopened. Older keepers refuse, pointing to the smashed pens and the bodies floating in the pool. Warriors on both sides have gathered at the enclosure, waiting for the altar court's ruling."
 dragon_isles_events.7.a:0 "Pay to cleanse the pools by the old rites and sacrifice the tainted spawning."
 dragon_isles_events.7.b:0 "Release the frenzied warriors as sacred troops despite the destruction."
 dragon_isles_events.7.c:0 "Contain the frenzy and study its course, accepting the losses."

 dragon_isles_events.8.t:0 "A Cathayan Calendar at the Shrine"
 dragon_isles_events.8.d:0 "Two island shrines claim the same tribute procession after calculating different dates for its arrival. Their guards block opposite ends of the causeway in [event_target.GetName], leaving the bearers trapped between them. A visiting Cathayan scholar, Master Shen, asks permission to compare the priests' calendars.\n\nShen finds that one calendar omitted a month and demonstrates the error with a star chart. Both priests allow the procession through, but each refuses to accept the other's reckoning thereafter. Shen's interpreters offer to remain long enough to teach the calculations and explain them to the clan chiefs."
 dragon_isles_events.8.a:0 "Pay Shen to establish a shared ritual calendar."
 dragon_isles_events.8.b:0 "Hire his interpreters to settle disputes between the clans."
 dragon_isles_events.8.c:0 "Question the visitors about Cathayan courts and armies, then send them away."

 dragon_isles_events.9.t:0 "Eggs in the Gem Cave"
 dragon_isles_events.9.d:0 "Gem cutters in [event_target.GetName] break through a thin wall and discover three dragon eggs on a bed of polished stones. The foreman orders everyone out after finding fresh claw marks beside the nest. One worker returns with an emerald hidden in his mouth.\n\nA blood-priest demands guards for the cave, warning that the mother will search every nearby settlement if an egg disappears. The foreman insists that his miners can remove the loose gems without touching the clutch. While they argue, a dragon begins circling the hillside above the mine."
 dragon_isles_events.9.a:0 "Withdraw warriors from the army to guard the sacred clutch."
 dragon_isles_events.9.b:0 "Take the gems and fight our way out if the dragon returns."

 dragon_isles_events.10.t:0 "The Chief Who Silenced the Gong"
 dragon_isles_events.10.d:0 "A messenger reaches [event_target.GetName] with orders to strike the blood-gong and assemble the clans. One chief obeys, another sends only his standard bearer, and a third has the gong keeper beaten for interrupting a sacrifice. By nightfall, warriors from the first clan have camped outside the third clan's shrine.\n\nThe injured keeper arrives at the altar court with the broken striker wrapped in his cloak. The assembled warriors demand punishment, but their captains have brought provisions for only a few days. Unless the court settles the summons, the camps will begin taking food from the surrounding settlements."
 dragon_isles_events.10.a:0 "Pay for a full war muster and renew the warriors' oaths."
 dragon_isles_events.10.b:0 "Feed the delegates and negotiate a common summons."
 dragon_isles_events.10.c:0 "Pay officials to enforce tribute rolls and the chiefs' obedience."
 dragon_isles_events.10.dd:0 "Postpone the muster and fund a settlement between the shrines."

 dragon_isles_survey_river_ruin_mouth:0 "Survey the River Mouth"
 dragon_isles_survey_river_ruin_mouth_title:0 "Survey the River Mouth"
 dragon_isles_survey_river_ruin_mouth_desc:0 "The mouth of the River Ruin is half gate and half wound. We must chart every reef and channel before warmblood captains or Chaos Dwarf scouts know them better than our own pilots."
 dragon_isles_license_island_pilots:0 "Licensed Reef Pilots"
 dragon_isles_license_island_pilots_title:0 "Licensed Reef Pilots"
 dragon_isles_license_island_pilots_desc:0 "The reefs still answer to clan memory and private oaths. We must bind the island pilots by blood-mark so local knowledge serves the whole altar rather than the next chief with gems to spend."
 dragon_isles_patrol_river_mouth:0 "Patrol the River Mouth"
 dragon_isles_patrol_river_mouth_title:0 "Patrol the River Mouth"
 dragon_isles_patrol_river_mouth_desc:0 "Foreign sails enter our waters smiling, lost, or lying. We must make regular patrols the first thing they see and the last thing they forget."
 dragon_isles_gem_toll_harbors:0 "Gem-Toll Harbors"
 dragon_isles_gem_toll_harbors_title:0 "Gem-Toll Harbors"
 dragon_isles_gem_toll_harbors_desc:0 "The harbors are rich, but clan custom still treats tolls as private prey. We must make gem dues a public law that feeds shrine, fleet, and throne together."
 dragon_isles_river_ruin_customs:0 "River Ruin Customs"
 dragon_isles_river_ruin_customs_title:0 "River Ruin Customs"
 dragon_isles_river_ruin_customs_desc:0 "The River Ruin carries profit, spies, and smoke. We must build customs that can tax the first, expose the second, and prepare for the third."
 dragon_isles_foreign_sails_under_license:0 "Foreign Sails Under License"
 dragon_isles_foreign_sails_under_license_title:0 "Foreign Sails Under License"
 dragon_isles_foreign_sails_under_license_desc:0 "Indish, Cathayan, and river captains now bargain at our reefs. We must let them come marked and watched, proving the unified isles can trade without being mastered."
 dragon_isles_dragonwake_admiralty:0 "Dragonwake Admiralty"
 dragon_isles_dragonwake_admiralty_title:0 "Dragonwake Admiralty"
 dragon_isles_dragonwake_admiralty_desc:0 "The island fleets are still trophies of clan pride. We must bind pilot houses, harbor wardens, and war-canoe captains into one admiralty under the dragonwake."
 dragon_isles_deepwater_dragon_harbors:0 "Deepwater Harbors"
 dragon_isles_deepwater_dragon_harbors_title:0 "Deepwater Harbors"
 dragon_isles_deepwater_dragon_harbors_desc:0 "Our beaches can guard the isles, but they cannot carry our ambitions. We must raise deepwater harbors fit for heavy hulls and dragon-shadowed convoys."
 dragon_isles_command_eastern_sea_lanes:0 "Command the Eastern Sea"
 dragon_isles_command_eastern_sea_lanes_title:0 "Command the Eastern Sea"
 dragon_isles_command_eastern_sea_lanes_desc:0 "The eastern sea lanes no longer end at our reefs. We must make every route toward Ind and the river markets account for the Dragon Isles."
 dragon_isles_scalded_delta_watch:0 "Scalded Delta Watch"
 dragon_isles_scalded_delta_watch_title:0 "Scalded Delta Watch"
 dragon_isles_scalded_delta_watch_desc:0 "Smoke, iron, and ambition gather in the Scalded Delta. We must hold the river's mouth before any northern power makes it a blade pointed at our islands."

 dragon_isles_shoguns_drum:0 "The Blood-Gong"
 dragon_isles_shoguns_drum_title:0 "The Blood-Gong"
 dragon_isles_shoguns_drum_desc:0 "The clans hear a hundred local drums and obey whichever is nearest. We must make the blood-gong louder than lineage, hunger, and private feud."
 dragon_isles_quiet_council:0 "The Ash-Moot"
 dragon_isles_quiet_council_title:0 "The Ash-Moot"
 dragon_isles_quiet_council_desc:0 "The chiefs answer insult with spearpoints because blood custom gives them no softer language. We must teach them to bargain in ash-moot before every grievance demands a corpse."
 dragon_isles_oath_hostages_of_the_daimyo:0 "Hostages of the Clans"
 dragon_isles_oath_hostages_of_the_daimyo_title:0 "Hostages of the Clans"
 dragon_isles_oath_hostages_of_the_daimyo_desc:0 "The old hostage rites keep obedience through fear. We must turn those frightened bonds into living bridges between clans."
 dragon_isles_break_private_wars:0 "Break the Private Wars"
 dragon_isles_break_private_wars_title:0 "Break the Private Wars"
 dragon_isles_break_private_wars_desc:0 "The scale-clans still treat each valley as a battlefield waiting for permission. We must end private wars so the Dragon Isles can strike as one realm."
 dragon_isles_daimyo_under_one_seal:0 "Clans Under One Fang"
 dragon_isles_daimyo_under_one_seal_title:0 "Clans Under One Fang"
 dragon_isles_daimyo_under_one_seal_desc:0 "The isles remain many realms in habit even when the blood-gong is known. We must unite the archipelago before dragons or strangers decide we are only prey divided by water."
 dragon_isles_census_of_the_clans:0 "Census of the Clans"
 dragon_isles_census_of_the_clans_title:0 "Census of the Clans"
 dragon_isles_census_of_the_clans_desc:0 "A unified realm cannot be governed by rumor, grudges, and remembered spawning pools. We must count the clans so obligation becomes administration."
 dragon_isles_inner_isles_obey:0 "The Isles Made One"
 dragon_isles_inner_isles_obey_title:0 "The Isles Made One"
 dragon_isles_inner_isles_obey_desc:0 "The Dragon Isles are united on the map, but unity must reach shrine, harbor, brood, and court. We must make one realm out of the habits left by many islands."
 dragon_isles_hostages_become_governors:0 "Governors, Not Hostages"
 dragon_isles_hostages_become_governors_title:0 "Governors, Not Hostages"
 dragon_isles_hostages_become_governors_desc:0 "The hostage generation understands both the high altar and the clans that surrendered them. We must free them from the old cage and make them governors of a less wasteful fear."

 dragon_isles_shrine_of_the_great_dragon:0 "Shrine of the Great Dragon"
 dragon_isles_shrine_of_the_great_dragon_title:0 "Shrine of the Great Dragon"
 dragon_isles_shrine_of_the_great_dragon_desc:0 "The Great Dragon does not need a shrine, but the clans need one place to bleed. We must give the Dragon Cult a sacred center before reverence scatters into rival altars."
 dragon_isles_tribute_of_gem_scales:0 "Tribute of Gem-Scales"
 dragon_isles_tribute_of_gem_scales_title:0 "Tribute of Gem-Scales"
 dragon_isles_tribute_of_gem_scales_desc:0 "Dragons understand wealth, scent, and hunger before they understand law. We must bring tribute rich enough that even sleeping wyrms smell the will of the united clans."
 dragon_isles_guard_the_sacred_clutches:0 "Guard the Sacred Clutches"
 dragon_isles_guard_the_sacred_clutches_title:0 "Guard the Sacred Clutches"
 dragon_isles_guard_the_sacred_clutches_desc:0 "Dragon eggs turn greed into blasphemy and fear into policy. We must guard the clutches as wards of the realm rather than trophies of any shrine or clan."
 dragon_isles_feed_the_waking_wyrms:0 "Feed the Waking Wyrms"
 dragon_isles_feed_the_waking_wyrms_title:0 "Feed the Waking Wyrms"
 dragon_isles_feed_the_waking_wyrms_desc:0 "A waking dragon can scatter villages as easily as enemies. We must feed and honor the wyrms without teaching the realm that terror is the only law."
 dragon_isles_regent_beneath_the_wings:0 "Voice Beneath the Wings"
 dragon_isles_regent_beneath_the_wings_title:0 "Voice Beneath the Wings"
 dragon_isles_regent_beneath_the_wings_desc:0 "No clan voice matters until dragons, priests, and warriors accept it beneath the wings. We must make one command loud enough to survive both sacred hunger and island pride."
 dragon_isles_seal_the_great_dragons_mandate:0 "Carve the Blood Mandate"
 dragon_isles_seal_the_great_dragons_mandate_title:0 "Carve the Blood Mandate"
 dragon_isles_seal_the_great_dragons_mandate_desc:0 "The mandate is still wrapped in inherited fear and rival taboos. We must carve it into law while cutting away customs that waste blood without building power."
 dragon_isles_gem_throne:0 "The Obsidian Blood-Throne"
 dragon_isles_gem_throne_title:0 "The Obsidian Blood-Throne"
 dragon_isles_gem_throne_desc:0 "The throne once displayed tribute and submission. We must make it shine as proof that wealth, altar, clan, and dragon terror now share one seat."
 dragon_isles_wake_the_great_dragon:0 "Wake the Devourer"
 dragon_isles_wake_the_great_dragon_title:0 "Wake the Devourer"
 dragon_isles_wake_the_great_dragon_desc:0 "Dragons still remember us as attendants, tribute-bearers, and prey that learned ceremony. We must stand before them as a unified people strong enough to be partners in the same brutal age."

 dragon_isles_plaques_beneath_the_ash:0 "Plaques Beneath Ash"
 dragon_isles_plaques_beneath_the_ash_title:0 "Plaques Beneath Ash"
 dragon_isles_plaques_beneath_the_ash_desc:0 "The ash hides plaques older than the Dragon Cult and less obedient than court doctrine. We must recover them before priests grind memory into convenient omens."
 dragon_isles_catalogue_the_island_rites:0 "Catalogue the Island Rites"
 dragon_isles_catalogue_the_island_rites_title:0 "Catalogue the Island Rites"
 dragon_isles_catalogue_the_island_rites_desc:0 "Every island has its own offerings, taboos, and dragon stories. We must catalogue those rites before unity becomes another word for erasure."
 dragon_isles_shrine_courts_reconciled:0 "Shrine Courts Reconciled"
 dragon_isles_shrine_courts_reconciled_title:0 "Shrine Courts Reconciled"
 dragon_isles_shrine_courts_reconciled_desc:0 "The shrines settle feuds with sacred language, private knives, and blood demanded after the argument is already lost. We must reconcile their courts so warriors are no longer the first answer to every prayer."
 dragon_isles_cathayan_harmonists_at_court:0 "Cathayans at Court"
 dragon_isles_cathayan_harmonists_at_court_title:0 "Cathayans at Court"
 dragon_isles_cathayan_harmonists_at_court_desc:0 "Cathay speaks of dragons as balance and order rather than hunger alone. We must learn what is useful in that language without surrendering our island soul."
 dragon_isles_a_thousand_shrines_one_voice:0 "A Thousand Shrines"
 dragon_isles_a_thousand_shrines_one_voice_title:0 "A Thousand Shrines"
 dragon_isles_a_thousand_shrines_one_voice_desc:0 "The isles may keep their thousand shrines, but they cannot keep a thousand rival verdicts. We must let many rites survive under one voice."
 dragon_isles_preserve_the_broken_glyphs:0 "Preserve the Broken Glyphs"
 dragon_isles_preserve_the_broken_glyphs_title:0 "Preserve the Broken Glyphs"
 dragon_isles_preserve_the_broken_glyphs_desc:0 "The broken glyphs do not flatter the Dragon Cult, and that is why they matter. We must preserve them so rule grows from memory rather than appetite."
 dragon_isles_faith_of_scale_and_ash:0 "Faith of Scale and Ash"
 dragon_isles_faith_of_scale_and_ash_title:0 "Faith of Scale and Ash"
 dragon_isles_faith_of_scale_and_ash_desc:0 "Fear of dragons built the first taboos, but fear alone cannot guide a realm that means to live. We must join scale, ash, old glyphs, blood rites, and island memory into a faith that can stand beside dragons."

 dragon_isles_obsidian_spearheads:0 "Feral Spear-Broods"
 dragon_isles_obsidian_spearheads_title:0 "Feral Spear-Broods"
 dragon_isles_obsidian_spearheads_desc:0 "The war-broods still fight like hunters chasing blood through smoke. We must keep their ferocity while teaching them to answer the blood-gong."
 dragon_isles_smoke_watched_barracks:0 "Chain the Hunt-Cohorts"
 dragon_isles_smoke_watched_barracks_title:0 "Chain the Hunt-Cohorts"
 dragon_isles_smoke_watched_barracks_desc:0 "Discipline feels like a chain to warriors born beside volcanic hunts. We must make that chain strong enough for battle and loose enough that the hunt still lives."
 dragon_isles_volcano_glass_forges:0 "Volcano-Glass Forges"
 dragon_isles_volcano_glass_forges_title:0 "Volcano-Glass Forges"
 dragon_isles_volcano_glass_forges_desc:0 "Volcanic glass is treated as omen, accident, and shrine gift. We must make it an industry of blades, masks, idols, and trade goods."
 dragon_isles_war_masks_of_black_glass:0 "War-Masks of Black Glass"
 dragon_isles_war_masks_of_black_glass_title:0 "War-Masks of Black Glass"
 dragon_isles_war_masks_of_black_glass_desc:0 "Fear once followed our warriors by accident. We must shape black glass masks so terror becomes a weapon chosen by the state."
 dragon_isles_rouse_the_mountain_wyrms:0 "Rouse the Fire Wyrms"
 dragon_isles_rouse_the_mountain_wyrms_title:0 "Rouse the Fire Wyrms"
 dragon_isles_rouse_the_mountain_wyrms_desc:0 "The lesser wyrms obey neither chief nor shrine, and forced service would only earn fire. We must become strong enough that they choose to fight beside us."

 dragon_isles_events.11.t:0 "The First Shell Breaks"
 dragon_isles_events.11.d:0 "A guard at a fortified clutch cave hears scraping from inside a dragon egg and summons the keeper. By morning, a hatchling has broken through and bitten the Skink who tried to move the shell. The keeper clears the cave, leaving meat where the creature can reach it.\n\nNews brings rival clan priests to [Root.Capital.GetName], each claiming the right to appoint its attendants. Traders follow them, offering silver for the discarded shell and stones from the nest. The keeper asks the altar court for a single set of rules before the next egg opens."
 dragon_isles_events.11.a:0 "Protect every clutch cave under a common truce."
 dragon_isles_events.11.b:0 "Train attendants and soldiers to stand firm around the hatchlings."
 dragon_isles_events.11.c:0 "License the trade in discarded shells and nesting gems."

 dragon_isles_events.12.t:0 "Two Tithes for One Shrine"
 dragon_isles_events.12.d:0 "A Cathayan scholar examines the tribute records of two island shrines and finds the same village listed in both. For years, each priest has demanded a full offering and accused the villagers of withholding the other half. The scholar lays the paired records before the altar court at [Root.Capital.GetName].\n\nA village elder produces receipts carved on bone, proving that both payments were made. Neither priest will yield until an interpreter reads their founding oaths aloud and exposes the conflicting boundaries. The chiefs ask the court to decide how the visiting scholars should help prevent another dispute."
 dragon_isles_events.12.a:0 "Establish schools to teach their methods of calculation and study."
 dragon_isles_events.12.b:0 "Employ their interpreters in negotiations with other courts."
 dragon_isles_events.12.c:0 "Use their records to settle shrine boundaries and tribute disputes."

 dragon_isles_events.13.t:0 "The Wyrm at the Drill Ground"
 dragon_isles_events.13.d:0 "A mountain wyrm descends onto a drill ground and devours the livestock tethered beside its feeding platform. When recruits run, it follows them through the practice barriers. A veteran captain halts the flight by ordering his troops to stand behind their shields.\n\nThe creature turns back for another carcass, allowing the attendants to lead it away from the barracks. The captain reports that disciplined troops can work near the wyrms, provided everyone keeps clear when they breathe fire. His officers begin planning how to use that lesson in the forts and field armies."
 dragon_isles_events.13.a:0 "Build feeding roosts above our fortress approaches."
 dragon_isles_events.13.b:0 "Drill the cohorts to attack immediately after a wyrm's fiery breath."
 dragon_isles_events.13.c:0 "Teach every levy to hold formation in the presence of dragons."

 dragon_isles_events.14.t:0 "The Offering the Great Dragon Accepted"
 dragon_isles_events.14.d:0 "At the great crater, the chiefs of the united isles assemble behind [Root.Monarch.GetName]. Each has brought gems from the expanded mines, and the baskets fill the old sacrificial terrace. The Great Dragon emerges from its cave before the final procession reaches the steps.\n\nIt pushes aside the captives and inspects the gems, then demands that the same offering be brought each year. The senior blood-priest answers that the mines can meet the demand only if their workers and settlements remain unharmed. For the first time, the assembled chiefs remain standing while he speaks.\n\nThe dragon accepts the condition and allows the procession to leave. Back at [Root.Capital.GetName], the chiefs repeat the agreement before the blood-gong and renew their oaths to the altar court. A regular tribute has replaced raids on our own settlements, and the realm can now commit its wealth to a lasting purpose."
 dragon_isles_events.14.a:0 "Expand the mines and organize the gem trade under the pact."
 dragon_isles_events.14.b:0 "Equip the infantry and renew every war-host's oath before the dragon."
 dragon_isles_events.14.c:0 "Extend the altar courts and enforce peace between the clans."

 dragon_isles_surveyed_river_ruin_mouth:0 "Surveyed River Mouth"
 dragon_isles_licensed_island_pilots:0 "Licensed Reef Pilots"
 dragon_isles_river_mouth_patrols:0 "River Mouth Patrols"
 dragon_isles_gem_toll_harbors_mod:0 "Gem-Toll Harbors"
 dragon_isles_river_ruin_customs_mod:0 "River Ruin Customs"
 dragon_isles_licensed_foreign_sails:0 "Licensed Foreign Sails"
 dragon_isles_dragonwake_admiralty_mod:0 "Dragonwake Admiralty"
 dragon_isles_deepwater_dragon_harbors_mod:0 "Deepwater Dragon Harbors"
 dragon_isles_eastern_sea_lanes:0 "Eastern Sea Lanes"
