l_english:

 barak_varr_border_oaths_title:0 "Sea-Gate Oaths"
 barak_varr_border_oaths_desc:0 "Barak Varr is held by oath, toll, and tide. A sea-gate that stands alone becomes a prize for every pirate, prince, and Greenskin chief with enough nerve to test its walls. We must bind enough allies to prove our word carries beyond the harbor chains."
 barak_varr_petty_crowns_bent_title:0 "Clan Councils Bent"
 barak_varr_petty_crowns_bent_desc:0 "The situation is that Dawi clans, merchant factors, and marcher captains all think their ledgers show the most urgent truth. Pride is useful only when it can be made to pull in one direction. We must gather enough prestige that even the loudest councils accept the sea-gate's authority."
 barak_varr_black_fire_tollhouses_title:0 "Black Fire Tollhouses"
 barak_varr_black_fire_tollhouses_desc:0 "The road through Black Fire Pass carries merchants, spies, pilgrims, and raiders in the same dust. Whoever owns the pass with a market and a fort can tax fear as easily as trade. We must make that hard road pay for the guards who keep Barak Varr's landward gate open."
 barak_varr_claim_iron_veins_title:0 "Claim the Iron Veins"
 barak_varr_claim_iron_veins_desc:0 "The situation is that toll roads are only as strong as the iron behind their gates. Barak Varr needs ore for harbor chains, cannon hoops, armor plates, and the tools that keep stone honest. We must command enough iron that the sea-gate is never forced to bargain for its own strength."
 barak_varr_sea_gate_steel_title:0 "Sea-Gate Steel"
 barak_varr_sea_gate_steel_desc:0 "Iron in Dawi hands becomes more than a trade good. It becomes steel for ship ribs, gun carriages, winches, locks, anchors, and every stubborn device that keeps the Black Gulf from becoming someone else's road. We must double our iron command and let the forges answer."
 barak_varr_monopoly_of_steel_title:0 "Monopoly of Steel"
 barak_varr_monopoly_of_steel_desc:0 "The situation is that rivals need iron for the same walls, chains, guns, and hulls we do. If Barak Varr controls the flow of steel, enemies must pay before they can threaten us. We must bend the iron market until even distant courts feel the weight of Dawi accounting."
 barak_varr_courts_arbitration_title:0 "Guild Courts"
 barak_varr_courts_arbitration_desc:0 "Every road toll, berth fee, clan claim, and marcher contract can become a quarrel worthy of ink or axes. A sea-gate that lets every dispute become private war will lose trade before it loses walls. We must build courthouses enough that judgment becomes cheaper and safer than feud."
 barak_varr_great_power_envoys_title:0 "Karaz Ankor Envoys"
 barak_varr_great_power_envoys_desc:0 "The old holds still judge Barak Varr by stone, oath, and endurance. Sea air may touch our gates, but saltwater has not softened our duty to the Karaz Ankor. We must cultivate enough diplomatic reputation that our envoys are received as kin with proof, not merchants with excuses."
 barak_varr_allies_among_giants_title:0 "Oaths Among Giants"
 barak_varr_allies_among_giants_desc:0 "Recognition matters most when powerful realms have reason to keep it. A treaty with a giant is dangerous, and two trusted giants are harder still to manage. We must bind two great powers with enough trust that Barak Varr's survival becomes part of their calculations."
 barak_varr_ten_roads_into_tilea_title:0 "Ten Roads Into Tilea"
 barak_varr_ten_roads_into_tilea_desc:0 "Tilea looks at the marches with purse, dagger, and contract already in hand. Its cities know the value of a road before the road is safe. We must control ten footholds there through our own rule or our subjects."
 barak_varr_twenty_five_in_tilea_title:0 "Twenty-Five in Tilea"
 barak_varr_twenty_five_in_tilea_desc:0 "Ten Tilean footholds are leverage, but leverage can still be bargained away. Twenty-five holdings make our presence a fact written into every western contract. We must make the merchant princes count us before they count their profits."

 barak_varr_refugee_rolls_title:0 "Settler Ledger Rolls"
 barak_varr_refugee_rolls_desc:0 "The Borderlands send Barak Varr exiles, artisans, debtors, guards, and frightened families in the same wagons. Each newcomer is either a burden or a future entry in the hold's ledgers. We must turn desperate arrivals into settlers, soldiers, and taxpayers."
 barak_varr_named_princes_seats_title:0 "Marcher Toll-Seats"
 barak_varr_named_princes_seats_desc:0 "The famous seats of the marches still carry weight long after their banners change. A capital taken from a known prince is more than land; it is a road, a market, and a name other captains understand. We must hold enough of these seats to speak for the region."
 barak_varr_claim_border_thrones_title:0 "Claim the Marcher Thrones"
 barak_varr_claim_border_thrones_desc:0 "A realm of claims needs the nerve to engrave a larger map. Petty crowns will not bend because our scribes wish them to, but claims backed by roads, soldiers, and Dawi ledgers have a different weight. We must hold enough marches to claim the rest."
 barak_varr_passes_made_stone_title:0 "Passes Made Stone"
 barak_varr_passes_made_stone_desc:0 "Brave speeches do not stop raiders at a pass. Stone, stores, watch rotations, and paid garrisons do. We must raise seven serious forts so the roads to Barak Varr become habits that endure longer than any one captain."
 barak_varr_university_march_title:0 "Engineers' University"
 barak_varr_university_march_desc:0 "Modern power needs more than stubborn walls and lucky captains. Engineers, jurists, surgeons, and accountants can tame a frontier in ways axes cannot. We must build a university in a province whose infrastructure can carry useful Dawi learning."
 barak_varr_ten_warrens_below_title:0 "Ten Underway Stations"
 barak_varr_ten_warrens_below_desc:0 "The Underway is not a memory to the Dawi; it is an obligation half-buried in darkness. Skaven, raiders, and worse things use broken roads when we leave them unguarded. We must hold ten stations below the world before others use them against Barak Varr."
 barak_varr_twenty_five_below_title:0 "Twenty-Five Below"
 barak_varr_twenty_five_below_desc:0 "Ten warrens are a map of danger. Twenty-five are a frontier with patrols, locks, stores, and grudges of its own. We must make the darkness below answer our seal as surely as the roads above."

 barak_varr_raised_palisades_title:0 "Raised Sea-Gates"
 barak_varr_raised_palisades_desc:0 "Loose walls invite every hungry neighbor to test us. A sea-gate without layered forts is only a promise that someone else will arrive first. We must raise defenses before ambition outruns shelter."
 barak_varr_frontier_muster_title:0 "Harbor Muster"
 barak_varr_frontier_muster_desc:0 "A harbor army cannot be hired at the last bell. Mercenaries vanish, militias haggle, and brave captains still need grain. We must fill the ranks before the next raid tests the gates."
 barak_varr_fortress_crossings_title:0 "Fortress Crossings"
 barak_varr_fortress_crossings_desc:0 "Roads and rivers meet at hard points where a realm can be held or broken. Forts need soldiers close enough to answer when the horns sound. We must build barracks and training fields so the crossings are defended by more than walls."
 barak_varr_orc_camps_burned_title:0 "Orc Camps Burned"
 barak_varr_orc_camps_burned_desc:0 "Greenskin camps teach the frontier to sleep lightly. If we are not a Greenskin host ourselves, no Greenskin military power can be allowed to hold land around Barak Varr. We must make the marches safe from raiders or prove that the raiders now answer to us."
 barak_varr_border_princes_confederacy_title:0 "Sea-Gate Compact"
 barak_varr_border_princes_confederacy_desc:0 "The situation is too dangerous for lonely crowns and isolated gates. Petty princes, refugee towns, mercenary captains, clan factors, and shrine-keepers all need a shield larger than their own walls. We must bind the Border Princes under Barak Varr's compact."
 barak_varr_stable_frontier_title:0 "Stable Frontier"
 barak_varr_stable_frontier_desc:0 "Peace in the marches is never quiet. It sounds like toll bells, angry petitions, grudging payments, and soldiers arriving before the fire spreads. We must push average unrest below zero until rebellion becomes less likely than paperwork."
 barak_varr_modern_muster_title:0 "The Modern Muster"
 barak_varr_modern_muster_desc:0 "The realm can no longer rely on lucky captains and convenient contracts. A lasting state needs officers, records, drill, and supply habits that survive a bad campaign. We must build a professional army with a memory longer than one contract."
 barak_varr_great_power_recognized_title:0 "Great Power Recognized"
 barak_varr_great_power_recognized_desc:0 "The world must stop treating us as a buffer between older ambitions. A frontier with polished envoys, one hundred thousand soldiers, and fifty ships is no longer a convenient absence on the map. We must be named among the great powers and make the title impossible to mock."
 barak_varr_votes_or_standards_title:0 "Votes or Standards"
 barak_varr_votes_or_standards_desc:0 "The Empire will respect us by ballots or by standards. Its princes understand votes, marches, and armed facts better than frontier boasting. We must hold ten Imperial provinces or win an elector's vote."
 barak_varr_imperial_foothold_title:0 "Imperial Foothold"
 barak_varr_imperial_foothold_desc:0 "A vote is influence and provinces are proof. Imperial politics rewards patience, pressure, and the careful use of fear. We must deepen our reach until no court can ignore it."
 barak_varr_five_horizons_title:0 "The Five Horizons"
 barak_varr_five_horizons_desc:0 "Five horizons now answer our contracts. Tilean roads, warrens below, Imperial footholds, eastern stations, and southern dominions can still look like accidents unless one policy binds them together. We must hold twenty-five provinces in each horizon and prove that distant claims form one system."
 barak_varr_empire_from_no_ones_land_title:0 "Hold of Stone and Sail"
 barak_varr_empire_from_no_ones_land_desc:0 "The world once treated Barak Varr as a strange exception, a Dawi hold that listened to waves as often as hammers. Now stone, sail, iron, and oath can become one imperial habit. We must make the sea-gate the heart of a power recognized by fear, treaty, and endurance."

 barak_varr_safe_havens_title:0 "Ancestor Havens"
 barak_varr_safe_havens_desc:0 "The frontier does not become orderly just because a banner says it is. Ancestor shrines and guarded sanctuaries give frightened people places to gather before fear becomes flight. We must build havens that make survival feel less temporary."
 barak_varr_break_raiders_title:0 "Break the Raiders"
 barak_varr_break_raiders_desc:0 "Raiders thrive when princes argue. Greenskin warbands and other hard-bitten predators know every weak border by smell and rumor. We must defeat or displace the threat around the marches."
 barak_varr_great_sea_gate_ledger_title:0 "Great Sea-Gate Ledger"
 barak_varr_great_sea_gate_ledger_desc:0 "Barak Varr is a ledger written in grudges, stone, and harbor chains. Inheriting the hold means little if its great works are not maintained beyond their inherited strength. We must raise the sea-gate to its fullest glory and make it worthy of the Black Gulf."
 barak_varr_companies_under_contract_title:0 "Companies Under Contract"
 barak_varr_companies_under_contract_desc:0 "Sellswords built half these crowns. Coin can raise an army quickly, but coin without articles creates another armed problem. We must make the companies answer contracts instead of whims."
 barak_varr_manufactories_order_title:0 "Guild Manufactories"
 barak_varr_manufactories_order_desc:0 "Most outsiders think factories cannot survive around Barak Varr. They imagine every foundry robbed, every clock broken, and every wage chest stolen before the second shift. We must prove that the sea-gate can keep furnaces, schedules, and wages moving."
 barak_varr_defeat_crowned_giant_title:0 "Defeat a Crowned Giant"
 barak_varr_defeat_crowned_giant_desc:0 "A great power's defeat is worth more than a hundred petitions. Old crowns listen more carefully when their banners have been dragged through frontier mud. We must beat one in war and carry enough power projection that the victory cannot be dismissed as luck."
 barak_varr_caravan_far_east_title:0 "Caravan to the Dark Lands"
 barak_varr_caravan_far_east_desc:0 "The Dark Lands are not only a road east; they are kinship turned bitter, furnace smoke, and old grudges that have not cooled. Barak Varr cannot let the Dawi-Zharr define every route beyond the World's Edge. We must hold ten stations there to prove our reach is more than tavern talk."
 barak_varr_eastern_stations_title:0 "Eastern Stations"
 barak_varr_eastern_stations_desc:0 "Ten stations are a caravan story. Twenty-five are a road system with guards, storehouses, scribes, and expected payments. We must make the eastern routes recognize our habits of rule."

 barak_varr_toll_road_charters_title:0 "Toll-Road Charters"
 barak_varr_toll_road_charters_desc:0 "Roads need coin before they need poetry. A toll that pays guards is less hated than a toll that vanishes into a prince's cup. We must turn markets and road charters into a frontier purse."
 barak_varr_market_crossroads_title:0 "Market Crossroads"
 barak_varr_market_crossroads_desc:0 "Toll roads need anchors where merchants can argue, store goods, and be taxed in predictable ways. Upgraded centers of trade turn a road charter from a promise into a habit. We must raise two such crossroads and make them worth defending."
 barak_varr_black_gulf_shipyards_title:0 "Black Gulf Shipyards"
 barak_varr_black_gulf_shipyards_desc:0 "The Black Gulf cannot remain another distant shore. Trade that reaches the water without escorts is only an invitation to pirates, rivals, and opportunists. We must build ships fit to guard our claims."
 barak_varr_black_gulf_patrols_title:0 "Black Gulf Patrols"
 barak_varr_black_gulf_patrols_desc:0 "A frontier with ports still needs ships that can actually watch the water. Light ships are the eyes, toll collectors, and quiet threats of the Black Gulf. We must build enough of them that trade captains see our flags before they see danger."
 barak_varr_home_node_dominance_title:0 "Command the Home Node"
 barak_varr_home_node_dominance_desc:0 "Patrols matter most when they command the waters that feed the realm. If our home trade node remains divided, every escort becomes a service sold partly to our rivals. We must control eighty percent of the node and make the frontier's trade answer home first."
 barak_varr_southlands_marches_title:0 "Badlands Marches"
 barak_varr_southlands_marches_desc:0 "The Badlands turn frontier skill into a harsher kind of empire. Heat, Greenskin camps, ruined roads, and long supply lines punish any power that arrives unprepared. We must hold ten provinces there and show that Barak Varr's habits travel."
 barak_varr_southlands_dominion_title:0 "Badlands Dominion"
 barak_varr_southlands_dominion_desc:0 "Ten marches are outposts. Twenty-five are a dominion with routes, garrisons, grudges, and local bargains of its own. We must make the southern frontier recognize our seal."

 barak_varr_claims_border_princes_tt:0 "Gain permanent claims on the Border Princes region."
 barak_varr_claims_tilea_tt:0 "Gain permanent claims on Tilea."
 barak_varr_claims_underempire_tt:0 "Gain permanent claims on the Under-Empire."
 barak_varr_claims_empire_tt:0 "Gain permanent claims on the Empire."
 barak_varr_claims_darklands_tt:0 "Gain permanent claims on the Darklands."
 barak_varr_claims_badlands_tt:0 "Gain permanent claims on the Badlands."
 barak_varr_claim_all_iron_tt:0 "Gain permanent claims on all Iron deposits."

 barak_varr_frontier_oaths:0 "Sea-Gate Oaths"
 desc_barak_varr_frontier_oaths:0 "Our agreements are not elegant, but they are witnessed, remembered, and dangerous to break."
 barak_varr_petty_crowns_bent_mod:0 "Bent Clan Councils"
 desc_barak_varr_petty_crowns_bent_mod:0 "Councils and captains now understand that pride survives by answering a broader order."
 barak_varr_black_fire_tollhouses_mod:0 "Black Fire Tollhouses"
 desc_barak_varr_black_fire_tollhouses_mod:0 "The pass tolls now fund guards, ledgers, and the quiet work of keeping roads open."
 barak_varr_courts_arbitration_mod:0 "Guild Arbitration"
 desc_barak_varr_courts_arbitration_mod:0 "Disputes that once became raids now pass through courts backed by soldiers and guild ledgers."
 barak_varr_great_power_envoys_mod:0 "Karaz Ankor Envoys"
 desc_barak_varr_great_power_envoys_mod:0 "Our envoys carry stone-born certainty into old holds and foreign courts alike."
 barak_varr_allies_among_giants_mod:0 "Oaths Among Giants"
 desc_barak_varr_allies_among_giants_mod:0 "Powerful allies make the sea-gate's independence harder to dismiss."
 barak_varr_twenty_five_in_tilea_mod:0 "Tilean Road Authority"
 desc_barak_varr_twenty_five_in_tilea_mod:0 "Tilean merchants now calculate our tolls before they write their contracts."
 barak_varr_refugee_rolls_mod:0 "Settler Ledger Rolls"
 desc_barak_varr_refugee_rolls_mod:0 "New arrivals are no longer only mouths at the gate; they are recorded as hands, skills, and obligations."
 barak_varr_named_princes_seats_mod:0 "Marcher Toll-Seats"
 desc_barak_varr_named_princes_seats_mod:0 "Famous marcher seats now lend their names and roads to a larger authority."
 barak_varr_passes_made_stone_mod:0 "Stone Passes"
 desc_barak_varr_passes_made_stone_mod:0 "The passes are no longer hopes on a map; they are walls, stores, and paid watchmen."
 barak_varr_university_march_mod:0 "Engineers' University"
 desc_barak_varr_university_march_mod:0 "Scholars, engineers, jurists, and captains now share an institution built for useful learning."
 barak_varr_twenty_five_below_mod:0 "Underway Frontier"
 desc_barak_varr_twenty_five_below_mod:0 "Our soldiers have learned to defend in tunnels, underroads, and places where sunlight is a rumor."
 barak_varr_raised_palisades_mod:0 "Raised Sea-Gates"
 desc_barak_varr_raised_palisades_mod:0 "Even a rough outer wall is a promise that someone will stand guard."
 barak_varr_frontier_muster_mod:0 "Harbor Muster"
 desc_barak_varr_frontier_muster_mod:0 "The sea-gate has learned to fill ranks before smoke appears on the horizon."
 barak_varr_fortress_crossings_mod:0 "Fortress Crossings"
 desc_barak_varr_fortress_crossings_mod:0 "The crossings now have gates, watch captains, stores, and fewer excuses."
 barak_varr_orc_camps_burned_mod:0 "Burned Raider Camps"
 desc_barak_varr_orc_camps_burned_mod:0 "The smoke from broken camps has bought the frontier a little sleep."
 barak_varr_stable_frontier_mod:0 "Stable Frontier"
 desc_barak_varr_stable_frontier_mod:0 "No one would call the marches peaceful, but fewer disputes now become rebellions."
 barak_varr_modern_muster_mod:0 "Modern Muster"
 desc_barak_varr_modern_muster_mod:0 "Captains, drillmasters, and quartermasters have begun to outlast the wars that made them."
 barak_varr_imperial_foothold_mod:0 "Imperial Foothold"
 desc_barak_varr_imperial_foothold_mod:0 "Our name now carries weight in Imperial calculations, whether by vote, fear, or possession."
 barak_varr_five_horizons_mod:0 "Five Horizons"
 desc_barak_varr_five_horizons_mod:0 "Distant holdings no longer look like accidents; they form a system of roads, stations, dominions, and claims."
 barak_varr_empire_from_no_ones_land_mod:0 "Hold of Stone and Sail"
 desc_barak_varr_empire_from_no_ones_land_mod:0 "The sea-gate now binds stone, sail, iron, and oath into a power other realms must account for."
 barak_varr_safe_havens_mod:0 "Ancestor Havens"
 desc_barak_varr_safe_havens_mod:0 "Shrines and sanctuaries give the frontier somewhere to gather before fear turns into flight."
 barak_varr_break_raiders_mod:0 "Broken Raiders"
 desc_barak_varr_break_raiders_mod:0 "Enemies who cross the marches now learn that the land itself has been taught to punish them."
 barak_varr_sea_gate_steel_mod:0 "Sea-Gate Steel"
 desc_barak_varr_sea_gate_steel_mod:0 "Our steel feeds cannon hoops, harbor chains, ship plates, and tools that fail only after long complaint."
 barak_varr_great_sea_gate_ledger_mod:0 "Great Sea-Gate Ledger"
 desc_barak_varr_great_sea_gate_ledger_mod:0 "The Black Gulf road now has ledgers precise enough to satisfy merchants and irritate Dwarfs only moderately."
 barak_varr_companies_under_contract_mod:0 "Companies Under Contract"
 desc_barak_varr_companies_under_contract_mod:0 "Paid soldiers still love coin, but the coin now comes with stricter articles."
 barak_varr_manufactories_order_mod:0 "Guild Industry"
 desc_barak_varr_manufactories_order_mod:0 "Factories once dismissed as impossible around Barak Varr now keep schedules, tools, and wages moving."
 barak_varr_defeat_crowned_giant_mod:0 "A Crowned Giant Defeated"
 desc_barak_varr_defeat_crowned_giant_mod:0 "The victory is now told as proof that the frontier can humble powers older than its crown."
 barak_varr_eastern_stations_mod:0 "Eastern Stations"
 desc_barak_varr_eastern_stations_mod:0 "Far roads now pass through stations that know our seal and rates."
 barak_varr_toll_road_charters_mod:0 "Toll-Road Charters"
 desc_barak_varr_toll_road_charters_mod:0 "The roads now pay for the privilege of remaining roads."
 barak_varr_market_crossroads_mod:0 "Market Crossroads"
 desc_barak_varr_market_crossroads_mod:0 "Upgraded trade centers make frontier tolls more predictable, profitable, and worth defending."
 barak_varr_black_gulf_shipyards_mod:0 "Black Gulf Shipyards"
 desc_barak_varr_black_gulf_shipyards_mod:0 "Ships launched for the Black Gulf carry the same hard practicality as our forts."
 barak_varr_home_node_dominance_mod:0 "Home Node Dominance"
 desc_barak_varr_home_node_dominance_mod:0 "Our merchants, escorts, and toll officers now command the trade routes closest to home."
 barak_varr_southlands_dominion_mod:0 "Badlands Dominion"
 desc_barak_varr_southlands_dominion_mod:0 "Southern marches now carry our provisions, seals, grudges, and hard-learned habits of defense."
 barak_varr_loose_charters_mod:0 "Marcher Charters"
 desc_barak_varr_loose_charters_mod:0 "Recognition is broad, practical, and just formal enough to keep marcher towns useful."
 barak_varr_hard_census_mod:0 "Hard Ledger Census"
 desc_barak_varr_hard_census_mod:0 "Every camp, shrine, language, and oath has been counted so the hold can decide what must be made common."
 barak_varr_camp_law_mod:0 "Hold Law Supreme"
 desc_barak_varr_camp_law_mod:0 "The compact tolerates many customs, but not private violence against the common order."
 barak_varr_embassy_seals_mod:0 "Rune-Sealed Embassies"
 desc_barak_varr_embassy_seals_mod:0 "Our embassies carry seals that even old courts have learned to read without smirking."
 barak_varr_frontier_titles_mod:0 "Sea-Gate Titles"
 desc_barak_varr_frontier_titles_mod:0 "Our titles are practical in origin but increasingly useful in treaty rooms."
 barak_varr_war_renown_mod:0 "Grudge-War Renown"
 desc_barak_varr_war_renown_mod:0 "Victories against great powers now train our officers as surely as they fill the ledgers."
 barak_varr_licensed_black_gulf_trade_mod:0 "Protected Black Gulf Trade"
 desc_barak_varr_licensed_black_gulf_trade_mod:0 "Merchants under our patrol licenses move with more confidence and pay for the privilege."
 barak_varr_guarded_harbor_roads_mod:0 "Guarded Harbor Roads"
 desc_barak_varr_guarded_harbor_roads_mod:0 "Harbors and roadsteads watched by our patrols are harder to raid and easier to tax."
 barak_varr_black_gulf_escorts_mod:0 "Black Gulf Escorts"
 desc_barak_varr_black_gulf_escorts_mod:0 "Escort ships make the Black Gulf route safer for our merchants and less comfortable for everyone else's raiders."

 barak_varr_events.1001.t:0 "One Hold, Many Oaths"
 barak_varr_events.1001.d:0 "Barak Varr has done what many princes and merchants thought impossible: the camps, roads, markets, shrines, and hill forts around the sea-gate now recognize one authority. Recognition is not affection. It is a bargain made because the alternative is worse.\n\nThe question is what kind of bargain should endure. Broad charters would make the marcher towns useful without forcing every custom into Dawi shape. A hard census would make the ledgers honest, while hold law would let many habits survive beneath a sharper public order.\n\nBarak Varr will not become tidy. It can, however, become legible enough that soldiers, judges, merchants, priests, and clan elders know which quarrels are private and which ones threaten the hold."
 barak_varr_events.1001.a:0 "Charter the marcher towns."
 barak_varr_events.1001.b:0 "Count every oath."
 barak_varr_events.1001.c:0 "Make hold law supreme."

 barak_varr_events.1002.t:0 "Envoys at the Sea-Gate"
 barak_varr_events.1002.d:0 "Foreign envoys have arrived with proper seals and careful faces. Some call Barak Varr a necessary ally, some a useful danger, and some a temporary exception that has become awkwardly permanent. None of them call the sea-gate irrelevant.\n\nThis is recognition, but recognition is only the beginning. We can answer with rune-sealed embassies and procedure, with titles that force other courts to speak our language, or with the reputation earned by defeating powers that thought us too small to count.\n\nThe old world of pedigrees has met the Dawi world of oath and ledger. Both now understand that the meeting cannot be undone."
 barak_varr_events.1002.a:0 "Send rune-sealed embassies."
 barak_varr_events.1002.b:0 "Proclaim sea-gate titles."
 barak_varr_events.1002.c:0 "Let victory speak."

 barak_varr_events.1003.t:0 "Black Gulf Patrols"
 barak_varr_events.1003.d:0 "Our light ships now move through the Black Gulf in numbers no merchant can ignore. They are not grand battle lines, but they are fast enough to find pirates, visible enough to reassure caravans, and numerous enough to make tolls feel backed by more than ink.\n\nThe patrols can serve protected merchants, harbor roads, or direct escort work. Each choice profits the hold, but each tells captains what kind of sea power Barak Varr intends to become.\n\nThe Black Gulf has long belonged to whoever could keep ships alive on it. Now Dawi flags are part of that calculation."
 barak_varr_events.1003.a:0 "License protected merchants."
 barak_varr_events.1003.b:0 "Guard the harbor roads."
 barak_varr_events.1003.c:0 "Escort the Black Gulf."
