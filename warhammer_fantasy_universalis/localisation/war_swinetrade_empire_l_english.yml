l_english:
 X30:0 "Swinetrade Empire"
 X30_ADJ:0 "Swinetrade"
 swinetrade_empire_nation_title:0 "Proclaim the Swinetrade Empire"
 swinetrade_empire_nation_desc:0 "The merchants of the Dark Lands have carried their bargains far beyond the muddy wharves of Pigbarter. With at least fifty fully settled provinces under our authority and peace secured, we can bind markets, caravan stations, and distant peoples into an imperial republic. A common charter will give our many peoples a stake in its trade, while paid garrisons and armed convoys protect the bargains that hold it together. Any fully settled province counts toward this ambition, whatever its culture or location."
 X30_ideas:0 "Swinetrade Ideas"
 X30_ideas_start:0 "Swinetrade Traditions"
 X30_ideas_bonus:0 "Swinetrade Ambition"
 X30_idea_1:0 "Factors of the Ivory Road"
 X30_idea_1_desc:0 "The Ivory Road carries fortunes through country where an unguarded purse soon acquires a new owner. Our factors will maintain permanent counting houses along its branches, buying information, arranging escorts, and securing contracts before rival merchants even learn that a caravan has departed."
 X30_idea_2:0 "Convoys of the Golden Boar"
 X30_idea_2_desc:0 "A merchant's seal means little beyond the reach of a loaded gun. Standard hulls and shared contracts will put more light ships beneath the golden boar, giving our merchants escorts that can bargain at one anchorage and defend their cargo at the next."
 X30_idea_3:0 "The Great Charter of Weights"
 X30_idea_3_desc:0 "Every market has its own measures, its own tolls, and its own excellent explanation for why the books do not balance. A common charter of weights, dues, and appeals will make imperial authority predictable and disputes easier to settle. Extending its standards to fortress stores and garrison contracts will keep our walls supplied without paying three times for the same sack of grain."
 X30_idea_4:0 "No Cargo Surrendered"
 X30_idea_4_desc:0 "Pirates, raiders, and the servants of Hashut all covet the wealth passing through our waters. Shared dockyard crews and bulk timber purchases will make war galleys affordable, while practised oarsmen and boarding companies turn narrow waters into a killing ground for anyone who demands our cargo. The golden boar will yield neither a chest of silver nor a single squealing pig."
 X30_idea_5:0 "From Caravan to Quayside"
 X30_idea_5_desc:0 "The fortunes of Cathay and Ind need more than a road to reach our counting houses. By coordinating caravan arrivals, warehouse credit, river barges, and seagoing convoys, we can direct each cargo through the markets where our merchants have prepared its next profitable journey. Resident factors backed by imperial credit will carry greater weight at every bargaining table, ensuring that the routes we organise also enrich our own houses."
 X30_idea_6:0 "The Charter Guard"
 X30_idea_6_desc:0 "Merchants who cannot defend their contracts soon become somebody else's cargo. Regular pay, shares in captured supplies, and provision for wounded veterans will bind our caravan guards and provincial companies to the imperial charter. Rival congregations of our own faith will find equal standing in its ranks, for a soldier's loyalty is measured by the line he holds, not the prayers his neighbours disapprove of."
 X30_idea_7:0 "The Peace of the Counting Houses"
 X30_idea_7_desc:0 "A quarrel that closes the market costs everyone money, and a rebellion costs rather more. Paid watchmen, reliable grain contracts, and courts that settle debts before blades are drawn will turn the counting houses into guardians of public order. Those who worship foreign gods will share the charter's protection so long as they keep its peace and honour their bargains. Even the loudest rivals can agree that tomorrow's market should open on time."

 # Pigbarter and Swinetrade governments and the imperial charter settlement.
 war_pigbarter_republic_reform:0 "Pigbarter Merchant Republic"
 war_pigbarter_republic_reform_desc:0 "Pigbarter's merchant houses elect a chief magistrate every four years to keep the wharves open, the caravan contracts honoured, and the watch paid. Human traders bargain with Ogre captains, Cathayan factors, and anyone else whose coin survives the journey down the River Ruin. Their web of agreements brings ships, allies, and armed retainers to the city's defence, but a council accustomed to settling warehouse disputes struggles to govern distant provinces."
 war_swinetrade_republic_reform:0 "Swinetrade Imperial Republic"
 war_swinetrade_republic_reform_desc:0 "The Swinetrade Empire extends the bargaining tables of the Dark Lands into an imperial government of chartered ports, provincial companies, and elected magistrates. Every four years its merchant houses entrust the republic's seal to a ruler charged with protecting their markets and keeping the great convoys moving. Commercial ties support a wide circle of allies, experienced captains, and substantial citizen levies, while the competing privileges of its constituent companies still limit central administration."
 pigbarter_events.1001.t:0 "One People or a Thousand Bargains?"
 pigbarter_events.1001.d:0 "The Swinetrade Empire has survived the mud, the toll collectors, and neighbours who would rather eat a merchant than pay him. Now its charter must govern provincial towns, caravan stations, and harbours where human settlers, Ogre companies, foreign factors, and unfamiliar priesthoods all expect their bargains to be honoured. The council can agree on the price of a pig more readily than it can agree on what makes an imperial citizen.\n\nSome delegates demand a single public faith and a common culture, arguing that rival customs will leave our realm divided when Hashut's servants come down the River Ruin. Others insist that our strength has always come from making room at the counting table for strangers, provided they keep the peace and pay their dues. We must decide whether the golden boar gathers one people beneath its banner or protects many peoples through a shared commercial charter."
 pigbarter_events.1001.a:0 "One people, one faith, one imperial charter."
 pigbarter_events.1001.b:0 "A place at the counting table for every people."
 swinetrade_unity:0 "The Common Charter"
 desc_swinetrade_unity:0 "The imperial republic promotes a common culture and public faith across its dominions. Temples, schools, and provincial magistrates teach the same civic duties, binding the scattered settlements of the Dark Lands into a single people beneath the golden boar."
 swinetrade_diversity:0 "The Charter of Many Peoples"
 desc_swinetrade_diversity:0 "The imperial republic protects the customs and creeds of the peoples who keep its markets alive. Provincial communities retain a recognised place beneath the golden boar, while shared courts and commercial obligations make cooperation more profitable than sectarian quarrels."
