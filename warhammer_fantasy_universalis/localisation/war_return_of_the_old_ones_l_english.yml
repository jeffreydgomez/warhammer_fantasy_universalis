prophesy_the_old_ones_title:0 "Foretell the Return of the Old Ones"
prophesy_the_old_ones_desc:0 "The stars begin to align. The sacred plaques are deciphered with greater clarity, and the Slann grow restless in their meditations. The return of the Old Ones is drawing near — or is it? Read the signs to determine the strength of their return.\n\nThe Return of the Old Ones will occur in the first years of the fourth age. Once they return, your choice cannot be changed."

return_of_the_old_ones_events.999.t:0 "Foretell the Return of the Old Ones"
return_of_the_old_ones_events.999.d:0 "Deep in the jungles of Lustria, the ancient ziggurats tremble with unseen power. The geomantic web pulses with renewed intensity, as if awakening from a long and troubled slumber. The Slann stir in their trance-like meditations, their minds drifting not through time, but into the realm of prophecy. The stars themselves begin to drift into positions last seen in the Time of Creation — configurations recorded only in the most sacred of plaques, their meanings long debated, feared, and yearned for.\n\nBeasts grow silent in the deep canopies. Mists rise unbidden from temple lakes. Glyphs once faded reappear, glowing softly with energies no longer dormant. Across the world, ancient watchers stir — artefacts buried beneath mountains hum to life, and dormant portals flicker with unstable light. Some say the Old Ones draw near, returning at long last to finish what they began. Others whisper that what comes may not be the Old Ones at all, but something that has followed in their wake.\n\nIs this salvation or the final judgment? Is the Great Plan reaching its ultimate phase, or unraveling into madness? What signs are truth, and which are illusions cast by ambition, desperation, or something more malign?\n\nYou must decide how strong the return will be. The stars will not wait forever.\n\n§RDestroying an Old One grants one of each tech.§!"
return_of_the_old_ones_events.999.option_1:0 "The Old Ones shall not return. §G(No Old Ones)§!"
return_of_the_old_ones_events.999.option_2:0 "Their legends are overstated. §Y(Easy Old Ones)§!"
return_of_the_old_ones_events.999.option_3:0 "They shall reshape the world. §R(Normal Old Ones)§!"


