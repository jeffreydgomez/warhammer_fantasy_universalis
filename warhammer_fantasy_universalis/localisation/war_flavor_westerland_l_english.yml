l_english:
 ##############
 ###MISSIONS###
 ##############
 permanent_claims_on_westerland_marches_tt:0 "Gain permanent claims on the Couronne Marches, Bitter Moors, Marienburg, and Tumble Downs areas."
 westerland_claims_on_empire_tt:0 "Gain claims on the Empire."

 westerland_guard_reikmouth_title:0 "Guard the Reikmouth"
 westerland_guard_reikmouth_desc:0 "The situation is exposed, with Bretonnian ambition to the west and Imperial memory to the east, so we must make the Reikmouth impossible to cross cheaply. If enough ships watch the passage, no army reaches Marienburg without first bleeding at sea."
 westerland_trade_ships_title:0 "Armed Trade Convoys"
 westerland_trade_ships_desc:0 "The situation is commercial but dangerous, so our trade ships must be more than floating ledgers. Let every convoy carry the guns, crews, and discipline needed to keep Marienburg's wealth moving."
 westerland_flagship_title:0 "Pride of the Fleet"
 westerland_flagship_desc:0 "The situation demands a symbol that captains and merchants both understand, so we must raise a flagship worthy of the Suiddock. A great admiral at its helm will prove that Westerland's freedom has a keel beneath it."
 westerland_base_of_exploration_title:0 "Foundation for Exploration"
 westerland_base_of_exploration_desc:0 "The situation rewards those who reach distant markets first, so our docks must become the base for longer voyages. Once the yards are ready, Marienburg can turn ocean risk into ocean profit."
 westerland_land_on_foreign_shores_title:0 "Foreign Shore Charters"
 westerland_land_on_foreign_shores_desc:0 "The situation beyond the Old World is rich and unsettled, so Westerland must plant chartered posts before rivals close the routes. A port abroad is a bargain written on the map."
 westerland_the_new_world_1_title:0 "New World Profits"
 westerland_the_new_world_1_desc:0 "The situation in the New World is dangerous but lucrative, so our factors must turn distant landings into cargo holds full of coin. Every returning ship makes Marienburg harder to threaten."
 westerland_the_new_world_2_title:0 "Endure the New World"
 westerland_the_new_world_2_desc:0 "The situation in our colonies is harsh, so settlers and guards must be supplied for jungle, ice, hunger, and war. A charter that cannot survive hardship is only ink."
 westerland_colonial_armies_title:0 "Colonial Musters"
 westerland_colonial_armies_desc:0 "The situation overseas cannot be defended from Marienburg alone, so our colonies must raise armies able to hold their own frontiers. Local strength will keep distant profits loyal."

 westerland_reforge_alliances_title:0 "Establish Prestige"
 westerland_reforge_alliances_desc:0 "The situation is precarious, so reputation must turn bought freedom into recognized freedom. With enough prestige, Westerland can make old guarantees and new bargains matter."
 westerland_diplomatic_reputation_title:0 "Diplomatic Supremacy"
 westerland_diplomatic_reputation_desc:0 "The situation is crowded with envoys, creditors, and suspicious neighbors, so Marienburg must become the court everyone answers. A republic that cannot command diplomacy will be auctioned by others."
 westerland_markets_title:0 "Suiddock Markets"
 westerland_markets_desc:0 "The situation is profitable, so our markets must train merchants as carefully as barracks train soldiers. Every counting house should strengthen the state as well as private fortunes."
 westerland_dominate_home_trade_node_title:0 "Dominate Reikmouth"
 westerland_dominate_home_trade_node_desc:0 "The situation begins at home, so no foreign merchant should profit more from the Reikmouth than Marienburg does. Control of our own node is the first law of survival."
 westerland_galleys_or_heavies_title:0 "Passage Warships"
 westerland_galleys_or_heavies_desc:0 "The situation demands a doctrine for defending coast, river mouth, and open sea. Our shipwrights must decide which hulls will carry Westerland's future."
 westerland_transports_title:0 "Efficient Sea Lanes"
 westerland_transports_desc:0 "The situation stretches across water, so soldiers and supplies must move as reliably as cargo. Better transports will let Marienburg answer crises before rivals exploit them."
 westerland_araby_1_title:0 "Southlands Tradepost"
 westerland_araby_1_desc:0 "The situation in the Southlands promises rare cargo and hard competition, so Westerland must secure a beachhead for trade. A distant post can be more valuable than a nearby boast."
 westerland_araby_2_title:0 "Southlands Stations"
 westerland_araby_2_desc:0 "The situation demands more than one flag on one pier, so our Southlands presence must become a network. Stations, warehouses, and escorts will pull foreign wealth toward Marienburg."
 westerland_foreign_investments_title:0 "Overseas Investments"
 westerland_foreign_investments_desc:0 "The situation overseas is growing faster than old law can govern, so private capital must be organized into state policy. Investment will make our subjects richer, stronger, and harder to pry away."
 westerland_colonial_economies_title:0 "Colonial Economies"
 westerland_colonial_economies_desc:0 "The situation in our colonies now requires mature ledgers rather than heroic improvisation. Prosperous subjects will feed the trade empire that protects them."
 westerland_a_new_type_of_subject_title:0 "Chartered Subject Rule"
 westerland_a_new_type_of_subject_desc:0 "The situation calls for subjects that are represented, profitable, and obedient. Westerland can bind overseas partners by charter instead of only by garrison."
 westerland_rightful_colonial_overlord_title:0 "Masters of the New World"
 westerland_rightful_colonial_overlord_desc:0 "The situation in the New World will not wait for ancient claims or foreign scruples, so Westerland must declare its own commercial order. Where our charters go, Marienburg's future follows."

 westerland_gather_allies_title:0 "Gather Allies"
 westerland_gather_allies_desc:0 "The situation is dangerous on both horizons, so Westerland must not stand alone. Three reliable allies will make any Imperial or Bretonnian attack look less like policy and more like folly."
 westerland_capital_area_title:0 "Strengthen the Heartland"
 westerland_capital_area_desc:0 "The situation around Marienburg is rich but vulnerable, so the capital and its neighbors must become a proper heartland. Wealth without depth only invites siege."
 westerland_centralize_power_title:0 "Centralize the Stadsraad"
 westerland_centralize_power_desc:0 "The situation rewards quick decisions, so guilds, magistrates, captains, and councillors must answer a single policy. A divided council cannot defend a free city."
 westerland_build_temples_title:0 "State and Faith Aligned"
 westerland_build_temples_desc:0 "The situation requires legitimacy that is more than coin, so the temples must stand with the state. Piety, order, and public trust will steady the ledgers."
 westerland_marienburg_above_kings_title:0 "Marienburg Above Kings"
 westerland_marienburg_above_kings_desc:0 "The situation is simple: old crowns want obedience, but Marienburg has grown beyond them. We must make the capital so rich, populous, and formidable that kings bargain with it rather than command it."
 westerland_native_policy_title:0 "Streamline Colonial Policy"
 westerland_native_policy_desc:0 "The situation in our colonies is too complex for improvised orders from home, so policy must become predictable. Clear charters will make expansion faster and less fragile."
 westerland_please_guilds_title:0 "Win Over the Guilds"
 westerland_please_guilds_desc:0 "The situation gives the guilds enormous leverage, so they must be convinced that national strength protects private profit. Their ships and ledgers must serve Westerland's statecraft."
 westerland_far_east_trade_title:0 "Establish Far East Trade"
 westerland_far_east_trade_desc:0 "The situation in Cathay and Ind is crowded with riches, rivals, and danger, so our merchants must find a durable place there. Far eastern trade will prove Marienburg is not merely an Old World port."
 westerland_subject_governance_title:0 "Colonial Governance"
 westerland_subject_governance_desc:0 "The situation among our subjects demands loyalty before crisis arrives. Faith, low unrest, and orderly charters will keep the overseas system from splitting under its own success."
 westerland_weaken_bretonnia_title:0 "Challenge Bretonnia"
 westerland_weaken_bretonnia_desc:0 "The situation to the west is wrapped in chivalric language, but Bretonnian power is still power. Westerland must break, bind, or outmaneuver the knights before they decide Marienburg is a prize."
 westerland_global_empire_title:0 "Global Trade Empire"
 westerland_global_empire_desc:0 "The situation has become global, so Westerland's merchants must be present wherever valuable trade moves. A share in every market will make Marienburg the counting house of the world."

 westerland_mercs_1_title:0 "Contract the Companies"
 westerland_mercs_1_desc:0 "The situation is urgent, so hired companies must be ready before our enemies gather banners. Westerland's coin can buy time, and time can buy survival."
 westerland_mercs_2_title:0 "Chartered Companies"
 westerland_mercs_2_desc:0 "The situation requires more than temporary contracts, so our paid soldiers must be organized into state-backed companies. A mercenary who depends on Marienburg's favor can become almost reliable."
 westerland_mercs_3_title:0 "War and Wealth"
 westerland_mercs_3_desc:0 "The situation ties war to credit, indemnity, and reputation, so Westerland must make victory pay for readiness. Our army should teach rivals that attacking merchants can be expensive."
 westerland_myrmidian_knowledge_title:0 "westerland_colonial_economies_desc Knowledge"
 westerland_myrmidian_knowledge_desc:0 "The situation favors those who calculate before they march, so learning must serve navigation, finance, law, and artillery. Knowledge is another wall around Marienburg."
 westerland_myrmidian_universities_title:0 "Found Houses of Learning"
 westerland_myrmidian_universities_desc:0 "The situation demands institutions that can outlast any one merchant prince. Schools, libraries, and academies will turn useful knowledge into public strength."
 westerland_secure_western_marches_title:0 "Secure the Western Marches"
 westerland_secure_western_marches_desc:0 "The situation around Marienburg is too exposed for a city-state's illusion, so the Couronne Marches, Bitter Moors, Marienburg, and Tumble Downs must become a developed frontier. Holding them will make Westerland a realm, not a loophole."
 westerland_please_nobles_title:0 "Win Over the Nobility"
 westerland_please_nobles_desc:0 "The situation still gives old families men, forts, and names, so the nobles must see their future inside Westerland. Their pride is dangerous unless it is made useful."
 westerland_reform_society_title:0 "Reform the Republic"
 westerland_reform_society_desc:0 "The situation has outgrown the habits that won independence, so Westerland must reform its councils, charters, and military obligations. Freedom must become government."
 westerland_future_of_the_old_world_title:0 "The Future, Not the Past"
 westerland_future_of_the_old_world_desc:0 "The situation is clear: the Empire and Bretonnia are old powers pretending age is destiny. Westerland is rich, armed, and alive, so we must claim the future while their old orders decay."
 westerland_weaken_borderlands_title:0 "Outflank the Southern Roads"
 westerland_weaken_borderlands_desc:0 "The situation beyond the mountains can threaten every trade road south, so Westerland must shape the Border Princes before chaos there reaches our ledgers. Control of the routes is control of the bargain."
 westerland_leader_of_the_old_world_title:0 "Master of the Old World"
 westerland_leader_of_the_old_world_desc:0 "The situation has left no equal standing, so Westerland must be recognized as the power no Old World state can ignore. The ledgers will record what the crowns refused to admit."

 westerland_raise_city_watch_title:0 "Raise the City Watch"
 westerland_raise_city_watch_desc:0 "The situation around Marienburg can become war faster than diplomacy can explain it, so the city must arm in haste. A merchant republic survives only when its walls have soldiers on them."
 westerland_build_barracks_title:0 "Fortified Drill Yards"
 westerland_build_barracks_desc:0 "The situation demands trained defenders, so Westerland needs barracks and yards where militia, marines, and hired captains can drill. Improvised courage will not hold the gates."
 westerland_modern_army_title:0 "Modernize the Army"
 westerland_modern_army_desc:0 "The situation has changed since independence was bought, so our army must become disciplined enough to fight powers larger than itself. Modern drill will make numbers matter less."
 westerland_legions_title:0 "Stadsraad Regiments"
 westerland_legions_desc:0 "The situation requires forces that answer the state, not only their paymasters. Regiments raised under the Stadsraad will give Westerland a military spine."
 westerland_myrmidian_military_title:0 "Marienburger Generalship"
 westerland_myrmidian_military_desc:0 "The situation needs commanders who understand walls, water, contracts, and cannon. A great general will teach Westerland how to survive wars that richer states are expected to lose."
 westerland_please_church_title:0 "Win Over the Temples"
 westerland_please_church_desc:0 "The situation gives the temples moral weight in a city accused of buying its soul, so they must support the state. Faith can help make independence look lawful."
 westerland_weaken_empire_title:0 "Break Imperial Designs"
 westerland_weaken_empire_desc:0 "The situation to the east is the oldest threat of all, for the Empire remembers Westerland as property. We must defeat, bind, or humble Altdorf before it remembers how badly it wants Marienburg back."
 westerland_weaken_kislev_title:0 "Humble the North"
 westerland_weaken_kislev_desc:0 "The situation in the north can overturn every market in the Old World, so Westerland must prove it can shape even distant powers. No frontier should be beyond our reach."

 westerland_more_sailors:0 "Reikmouth Fleet"
 desc_westerland_more_sailors:0 "Marienburg's passages are watched by a fleet raised to make invasion costly."
 westerland_better_trade_ships:0 "Armed Trade Convoys"
 desc_westerland_better_trade_ships:0 "Our merchantmen sail with crews trained to protect cargo, coin, and charter."
 westerland_naval_tradition:0 "Pride of the Suiddock"
 desc_westerland_naval_tradition:0 "The flagship has become a floating argument for Westerland's independence."
 westerland_exploration_1:0 "Chartered Exploration"
 desc_westerland_exploration_1:0 "Marienburg's docks now support voyages beyond familiar waters."
 westerland_exploration_2:0 "Foreign Shore Charters"
 desc_westerland_exploration_2:0 "Our first overseas holdings give Westerland a wider commercial horizon."
 westerland_exploration_3:0 "Colonial Charter Doctrine"
 desc_westerland_exploration_3:0 "Clearer colonial policy helps settlers and factors expand with less delay."
 westerland_new_world_explorers:0 "Equipped Chartermen"
 desc_westerland_new_world_explorers:0 "Our overseas agents are supplied for hard country and long routes."
 westerland_diplomatic_connections_1:0 "Reforged Alliances"
 desc_westerland_diplomatic_connections_1:0 "Westerland's prestige has made old guarantees and new alliances easier to sustain."
 westerland_diplomatic_connections_2:0 "Diplomatic Supremacy"
 desc_westerland_diplomatic_connections_2:0 "Our envoys move with the confidence of a state others must court."
 westerland_merchants_1:0 "Suiddock Merchant Schools"
 desc_westerland_merchants_1:0 "Marienburg's markets train merchants to serve public strength and private profit together."
 westerland_merchants_2:0 "Master of Reikmouth Trade"
 desc_westerland_merchants_2:0 "Trade through the Reikmouth increasingly answers to Marienburg."
 westerland_focus_on_heavies:0 "Heavy Ship Doctrine"
 desc_westerland_focus_on_heavies:0 "Our dockyards favor heavy ships for open-sea power."
 westerland_focus_on_gallies:0 "Passage Galley Doctrine"
 desc_westerland_focus_on_gallies:0 "Our dockyards favor galleys for river mouths, shallows, and coastal defense."
 westerland_focus_on_light_ships:0 "Escort Ship Doctrine"
 desc_westerland_focus_on_light_ships:0 "Our light ships are built to guard trade as well as profit from it."
 westerland_better_transports:0 "Chartered Sea Lanes"
 desc_westerland_better_transports:0 "Better transports keep troops and cargo moving between Westerland's holdings."
 westerland_southlands_domination:0 "Southlands Stations"
 desc_westerland_southlands_domination:0 "Our overseas stations pull distant commerce toward Marienburg."
 westerland_respectful_legal_arrangements:0 "Chartered Subject Rights"
 desc_westerland_respectful_legal_arrangements:0 "Legal recognition keeps faraway subjects tied to Marienburg's commercial order."
 westerland_stable_core:0 "Fortified Heartland"
 desc_westerland_stable_core:0 "The capital and its surroundings are more stable, better defended, and harder to intimidate."
 westerland_unified_society:0 "United Stadsraad"
 desc_westerland_unified_society:0 "The great interests of Westerland have been made to support a common policy."
 westerland_religion_of_state:0 "Temples of Independence"
 desc_westerland_religion_of_state:0 "The temples help present Westerland's freedom as lawful, orderly, and worthy of defense."
 westerland_guilds_on_board:0 "Guilds on Board"
 desc_westerland_guilds_on_board:0 "The guilds now treat national strength as a condition of profit."
 westerland_far_east_trade:0 "Far East Factors"
 desc_westerland_far_east_trade:0 "Our merchants maintain a serious presence in the rich markets of Cathay and Ind."
 westerland_global_empire:0 "Global Trade Empire"
 desc_westerland_global_empire:0 "Marienburg's ships, creditors, and factors have become fixtures of world commerce."
 westerland_mercenaries_1:0 "Contracted Free Companies"
 desc_westerland_mercenaries_1:0 "Paid companies stand ready to defend Westerland's freedom."
 westerland_mercenaries_2:0 "Chartered Companies"
 desc_westerland_mercenaries_2:0 "Our mercenaries depend on Westerland's contracts and fight at more reliable terms."
 westerland_mercenaries_3:0 "Gold for Steel"
 desc_westerland_mercenaries_3:0 "Westerland pays well, pays consistently, and expects disciplined violence in return."
 westerland_professional_armies_1:0 "City Army Reform"
 desc_westerland_professional_armies_1:0 "The first reforms toward a more permanent Marienburger army are underway."
 westerland_professional_armies_2:0 "Professional Defense"
 desc_westerland_professional_armies_2:0 "Our officers drill troops for defense of city, marsh, and coast."
 westerland_professional_armies_3:0 "Permanent Readiness"
 desc_westerland_professional_armies_3:0 "Westerland's army trains as if the next Imperial demand has already arrived."
 westerland_embrace_knowledge_1:0 "Counting-House Scholarship"
 desc_westerland_embrace_knowledge_1:0 "Scholars, navigators, lawyers, and financiers spread useful knowledge through the realm."
 westerland_embrace_knowledge_2:0 "Marienburg Academies"
 desc_westerland_embrace_knowledge_2:0 "Our houses of learning make new institutions easier to understand and adopt."
 westerland_nobles_on_board:0 "Noble Frontier Support"
 desc_westerland_nobles_on_board:0 "The nobles lend men and fortifications to Westerland's frontier policy."
 westerland_master_of_the_old_world:0 "Master of the Old World"
 desc_westerland_master_of_the_old_world:0 "No Old World power can now treat Westerland as a mere commercial accident."
 westerland_pride_in_the_army:0 "City Watch Pride"
 desc_westerland_pride_in_the_army:0 "Marienburg's defenders know the city depends on their speed and nerve."
 westerland_training_grounds:0 "Fortified Drill Yards"
 desc_westerland_training_grounds:0 "Our soldiers train in facilities built for discipline and readiness."
 westerland_modern_army_modifier:0 "Marienburg Army Reforms"
 desc_westerland_modern_army_modifier:0 "The army is being reshaped for modern war and stubborn defense."
 westerland_new_legions:0 "Stadsraad Regiments"
 desc_westerland_new_legions:0 "State-backed regiments give Westerland disciplined force beyond hired companies."
 westerland_myrmidian_military:0 "Marienburger Generalship"
 desc_westerland_myrmidian_military:0 "A brilliant commander has taught Westerland lasting lessons in modern war."
 westerland_church_on_board:0 "Temple Support"
 desc_westerland_church_on_board:0 "The temples support the state and lend moral force to Westerland's independence."
 westerland_reformed_society:0 "Reformed Marienburg State"
 desc_westerland_reformed_society:0 "Westerland has rebuilt its institutions for a larger and more dangerous future."
 
 ############
 ###EVENTS###
 ############
 war_westerland_events.1.t:0 "Specialize the Marienburg Fleet"
 war_westerland_events.1.d:0 "The shipyards of Marienburg are loud with argument. Some captains insist that only heavy ships can keep Bretonnian, Imperial, and pirate ambitions honest on the open sea. Others point to the river mouth, the shallows, and the maze of approaches where smaller craft can make an invasion bleed before it reaches the quays.\n\nThe merchant houses add their own demand. Trade ships already sail wherever profit calls, and many factors would rather arm the vessels that guard commerce than fund a fleet that waits for battle. The Stadsraad must choose which doctrine will define Westerland's defense."
 war_westerland_events.1.option_1:0 "Heavy ships will overawe the sea."
 war_westerland_events.1.option_2:0 "Galleys will hold the passage."
 war_westerland_events.1.option_3:0 "Trade ships must fight as escorts."
 war_westerland_events.2.t:0 "The Future of the City Army"
 war_westerland_events.2.d:0 "Westerland has always known the usefulness of paid soldiers. Free companies can be hired quickly, dismissed cleanly, and pointed at problems too ugly for polite city militias. Yet every captain with a contract also knows exactly how much Marienburg fears being caught unready.\n\nA faction in the Stadsraad now argues for a more permanent force: drilled, loyal to the city, and less dependent on emergency bargaining. The old merchants answer that contracts are flexible, and flexibility is the soul of survival. The choice will shape how Westerland defends its bought freedom."
 war_westerland_events.2.option_1:0 "Keep the free companies close."
 war_westerland_events.2.option_2:0 "Build a permanent city army."


 #################
 ###GOV REFORMS###
 #################
 grand_barony_of_westerland_reform:0 "Grand Barony of Westerland"
 grand_barony_of_westerland_reform_desc:0 "The Grand Baron shares power with Westerland's advisory council, the Stadsraad. The Stadsraad primarily represents the interests of the burghers, and select clergy and noblity."
