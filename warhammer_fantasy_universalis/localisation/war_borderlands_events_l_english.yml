l_english:

 borderlands_events.1000.t:0 "A Court of Exiles"
 borderlands_events.1000.d:0 "The first petitioner at [Root.Capital.GetName] is a mercenary captain demanding wages from a prince who fled last night. Behind him stand a Tilean grain merchant, a Bretonnian refugee, and a Dwarf carrying a rubbing of an old boundary stone.\n\nThe captain's contract promises him the same fields that the merchant has leased for next year's harvest. The refugee has already planted them, while the Dwarf insists that the stone proves his clan owns the ground beneath all three claims. Our clerk clears a table and asks them to produce their witnesses.\n\nScouts interrupt the hearing with news of Greenskin fires beyond the settlements. The captain offers his company, the merchant offers supplies, and the refugee names neighbors willing to join the watch. All need someone to guarantee their place here before they commit to its defense."
 borderlands_events.1000.a:0 "Collect the dues, settle the claims, and organize the captains."

 borderlands_events.1.t:0 "The Company at the Treasury Door"
 borderlands_events.1.d:0 "Captain Rinaldo marches his unpaid company to the treasury at [Root.Capital.GetName] and orders the men to sit across its entrance. The paymaster admits that two promised installments never arrived. A tax collector admits that a local lord kept the money intended for the company.\n\nShopkeepers close their stalls as the soldiers begin taking food on credit. Rinaldo still keeps their weapons stacked, but warns that he cannot answer for hungry men after sunset."
 borderlands_events.1.a:0 "Pay the company's overdue wages."
 borderlands_events.1.b:0 "Study their fighting methods while the captains haggle over wages."
 borderlands_events.1.c:0 "Dismiss the company and organize patrols against its deserters."

 borderlands_events.2.t:0 "The Man with the Crusader's Seal"
 borderlands_events.2.d:0 "A traveler calling himself Prince Armand presents a battered seal and claims his grandfather ruled one of our frontier castles. Two armed companions swear to his descent, although neither can name the grandfather.\n\nThe castle's present occupants refuse him entry and send the seal to [Root.Capital.GetName]. Armand follows with a growing band of creditors, asking the government to recognize a title he has already used to borrow money."
 borderlands_events.2.a:0 "Recognize his title in return for an oath of obedience."
 borderlands_events.2.b:0 "Sell him a registered title and collect the fee."
 borderlands_events.2.c:0 "Reject his claim and enlist his disappointed followers."
 borderlands_events.2.dd:0 "Pay soldiers to investigate his claim at the castle."

 borderlands_events.3.t:0 "Smoke Beyond the Blood River"
 borderlands_events.3.d:0 "A ferryman reports that Greenskins crossed the Blood River under cover of darkness and burned a hamlet near the disputed watchtower. The two princes responsible for the crossing each insist that the other owes the garrison's pay.\n\nSurvivors reach our patrol with wounded relatives piled onto grain carts. The raiders are still close enough to pursue, but no local captain will leave his fort without orders from [Root.Capital.GetName]."
 borderlands_events.3.a:0 "Pull the companies out of drill and organize a pursuit."
 borderlands_events.3.b:0 "Pay the local captains to defend the crossing."
 borderlands_events.3.c:0 "Enlist the displaced families despite the disorder."

 borderlands_events.4.t:0 "The Dwarf's Toll Receipts"
 borderlands_events.4.d:0 "A merchant from Barak Varr places seven toll receipts before [Root.Monarch.GetName]. Every one was collected on the same stretch of road, and two bear the seal of a captain who claims to serve us.\n\nThe merchant demands a single published tariff and repayment for a wagon seized at the last gate. Our own traders support his complaint, but the local toll collectors refuse to surrender their privileges."
 borderlands_events.4.a:0 "Guarantee local trading rights and settle with Barak Varr."
 borderlands_events.4.b:0 "Negotiate a common tariff with the Dwarf merchants."
 borderlands_events.4.c:0 "Send auditors to replace the competing tariffs with one toll register."

 borderlands_events.5.t:0 "Skulls Above the Cattle Pens"
 borderlands_events.5.d:0 "Market guards find cattle skulls painted red above the livestock pens, then catch a drover leading stolen beasts to a nearby barn. Inside, armed cultists have gathered around a butcher's block and a pile of bloodied shields.\n\nThe drover claims the group merely blesses cattle before slaughter, but a missing guard's helmet lies beneath the altar. The market master closes the pens and asks for help before the next herds arrive."
 borderlands_events.5.a:0 "Fund a raid and question the captured cultists."
 borderlands_events.5.b:0 "Negotiate their surrender through the drovers."
 borderlands_events.5.c:0 "Pay informants to uncover the cult's methods and contacts."

 borderlands_events.6.t:0 "A Caravan Seeking Winter Quarters"
 borderlands_events.6.d:0 "A refugee caravan reaches [Root.Capital.GetName] after losing its last safe winter camp to raiders. A Tilean mason offers to repair the walls, while an Imperial deserter presents the names of men willing to join the watch.\n\nThe gate captain has let the children shelter beneath the covered market. He needs instructions for the adults, who have begun marking out places for workshops and arguing with guildsmen over the right to trade."
 borderlands_events.6.a:0 "Admit the families, enlist recruits, and open the guilds to their trades."
 borderlands_events.6.b:0 "Set orderly rules for the temporary camp."
 borderlands_events.6.c:0 "Sell them provisions and provide an escort onward."

 borderlands_events.7.t:0 "The Wagons at Black Fire Pass"
 borderlands_events.7.d:0 "A caravan master traveling from Black Fire Pass reaches our tollhouse with twice the usual number of wagons. He says the other routes have become unsafe and offers regular traffic if our guards can keep this road open.\n\nThe toll keeper has run out of receipts, and drovers are sleeping beside loaded carts. He asks [Root.Capital.GetName] to settle the terms before rival captains begin collecting unofficial payments."
 borderlands_events.7.a:0 "Apply the old toll rules consistently."
 borderlands_events.7.b:0 "Collect a special fee from the waiting caravans."
 borderlands_events.7.c:0 "Collect escort fees and enlist caravan guards."

 borderlands_events.8.t:0 "Three Claims to Greywatch Tower"
 borderlands_events.8.d:0 "A surveyor marking the road below Greywatch Tower is found dead beside his measuring chain. Three landholders arrive at the inquest, each with a deed placing the ruin inside his estate.\n\nThe dead surveyor's assistant admits that two claimants had paid his master to adjust the boundary. A third paid him to preserve it, leaving three sealed receipts in the same work bag.\n\nNone had repaired the tower until traders began using the road beneath it. Now all three have armed retainers on the ridge, and the surviving surveyor's assistant refuses to return without an escort."
 borderlands_events.8.a:0 "Occupy the disputed tower and drill the garrison there."
 borderlands_events.8.b:0 "Negotiate shared rights and record the settlement."
 borderlands_events.8.c:0 "Auction the claim to the highest bidder."
 borderlands_events.8.dd:0 "Send an armed survey party to establish the boundary."

 borderlands_events.9.t:0 "The Processions at Market Cross"
 borderlands_events.9.d:0 "A priest of Sigmar and a priestess of Shallya each claim the market square for a holy day that falls on the same morning. The keeper of the local shrine to Morr objects that both processions will block a funeral.\n\nThe town watch separates their followers after a cart of ceremonial candles is overturned. The mayor sends the competing requests to [Root.Capital.GetName], asking for a ruling before the bells summon another crowd."
 borderlands_events.9.a:0 "Negotiate separate routes with the priests."
 borderlands_events.9.b:0 "Publish a common calendar and street-use rules."
 borderlands_events.9.c:0 "Charge for procession permits under our authority."

 borderlands_events.10.t:0 "An Invitation to Confederacy"
 borderlands_events.10.d:0 "A messenger delivers a proposal for a league of frontier towns, signed by rulers who recently refused to share a road patrol. A merchant has persuaded them that a common seal could make their caravans safer.\n\nTheir delegates ask to meet in [Root.Capital.GetName], but each demands an armed escort larger than the others'. The captain of the watch wants a decision before their retainers turn the negotiations into another border quarrel."
 borderlands_events.10.a:0 "Host the delegates and accommodate their unruly escorts."
 borderlands_events.10.b:0 "Settle our own towns' disputes before joining negotiations."
