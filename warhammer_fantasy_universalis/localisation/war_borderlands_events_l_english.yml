l_english:

 borderlands_events.1000.t:0 "Crowns on the Frontier"
 borderlands_events.1000.d:0 "The Borderlands are where ambition goes when older realms refuse it. Exiles, mercenary captains, refugees, petty nobles, cult priests, Dwarf traders, Greenskin raiders, and hungry adventurers all crowd the same roads and call the result opportunity.\n\nNo law rules every valley. A castle may be a kingdom, a river crossing may be a war, and a prince may be only the last person who survived long enough to print coins.\n\nYet the region is not weak because it is divided. If its quarrels can be bound into a common shield, the Borderlands could command the roads between Empire and Badlands, the approaches to Black Fire Pass, and the wealth that follows danger."
 borderlands_events.1000.a:0 "One frontier, many blades."

 borderlands_events.1.t:0 "Mercenary Arrears"
 borderlands_events.1.d:0 "A mercenary company has lined its helmets along the road outside the treasury. Their captain says this is not a threat, merely a reminder that unpaid soldiers become shoppers in the market of violence.\n\nThe Borderlands understands contracts better than sermons. The question is whether this one should be honored, renegotiated, or made into an example."
 borderlands_events.1.a:0 "Pay them late, but in full."
 borderlands_events.1.b:0 "Offer plunder rights instead."
 borderlands_events.1.c:0 "Dismiss the loudest captains."

 borderlands_events.2.t:0 "A Prince of Questionable Name"
 borderlands_events.2.d:0 "A stranger has arrived wearing a crown that looks old enough to be stolen honestly. He claims descent from a forgotten crusader prince, and his witnesses are both confident and expensive.\n\nRecognizing him could buy useful loyalty. Exposing him could please rivals who are no more legitimate, only better established.\n\nIn the Borderlands, truth is valuable mostly because it is rare. Everyone else calls that politics."
 borderlands_events.2.a:0 "Recognize his claim."
 borderlands_events.2.b:0 "Sell him better papers."
 borderlands_events.2.c:0 "Expose the fraud publicly."
 borderlands_events.2.dd:0 "Use him against a rival."

 borderlands_events.3.t:0 "Across the Blood River"
 borderlands_events.3.d:0 "Greenskin raiders have crossed the Blood River while two local princes argue over a ruined watchtower. Each prince insists the other must respond first, since the smoke is technically on disputed land.\n\nEvery hour spent debating maps gives the raiders more livestock and confidence. The frontier has made cowards out of better lawyers than these."
 borderlands_events.3.a:0 "Force a joint muster."
 borderlands_events.3.b:0 "Hire riders at emergency rates."
 borderlands_events.3.c:0 "Let the feud burn with them."

 borderlands_events.4.t:0 "Barak Varr Toll Envoys"
 borderlands_events.4.d:0 "Dwarf envoys from the road to Barak Varr have arrived with ledgers, witnesses, and a very precise list of insults suffered by their caravans. They do not ask for friendship. They ask for compensation, patrols, and proof that this frontier can count.\n\nMeeting their terms would strengthen the route. Refusing would save coin and invite a grudge with interest."
 borderlands_events.4.a:0 "Secure the Barak Varr road."
 borderlands_events.4.b:0 "Pay only the provable claims."
 borderlands_events.4.c:0 "Argue over every line."

 borderlands_events.5.t:0 "The Cattle Skull Cult"
 borderlands_events.5.d:0 "A cattle market has been marked with crude skull shields and red cloaks. The rustlers call themselves holy men, though their doctrine appears to consist mostly of knives, stolen herds, and theatrical cruelty.\n\nThe locals want protection, but they also want someone else to pay for it. That is nearly a religion of its own in the Borderlands.\n\nIf this cult is allowed to grow, every pasture will become a shrine to fear. Fear taxes faster than any prince."
 borderlands_events.5.a:0 "Break the cult openly."
 borderlands_events.5.b:0 "Buy informers in red cloaks."
 borderlands_events.5.c:0 "Abandon the outer herds."

 borderlands_events.6.t:0 "Refugees at the Gate"
 borderlands_events.6.d:0 "A refugee caravan has reached the gate with Tilean masons, Imperial deserters, Bretonnian peasants, and a priest who refuses to say which god exiled him. They bring useful hands, hungry mouths, and arguments in several languages.\n\nThe Borderlands was made by people no one else wanted. The trick is making them useful before they remember why they left."
 borderlands_events.6.a:0 "Settle them in empty holdings."
 borderlands_events.6.b:0 "Sort them by useful skills."
 borderlands_events.6.c:0 "Turn away the troublesome ones."

 borderlands_events.7.t:0 "Black Fire Pass Duties"
 borderlands_events.7.d:0 "Traffic near Black Fire Pass has swollen with traders, pilgrims, scouts, and men who claim not to be spies because spies dress better. Every wagon needs protection, and every protection can become a fee.\n\nA disciplined toll could make the frontier richer. A greedy one could make every road captain into an enemy with wheels."
 borderlands_events.7.a:0 "Order the pass duties properly."
 borderlands_events.7.b:0 "Tax lightly and consistently."
 borderlands_events.7.c:0 "Sell collection rights."

 borderlands_events.8.t:0 "Tower With Three Owners"
 borderlands_events.8.d:0 "A ruined tower on a ridge has acquired three owners, four maps, and one dead surveyor. None of the claimants cared about it last year, but now each insists the stones command a road, a pasture, or destiny.\n\nThe dispute is small enough to solve and large enough to start a war. That makes it perfectly Borderlandish.\n\nA wise ruler can use the tower. A foolish one may become part of its history."
 borderlands_events.8.a:0 "Seize the tower for the realm."
 borderlands_events.8.b:0 "Mediate the competing claims."
 borderlands_events.8.c:0 "Sell the ruling quietly."
 borderlands_events.8.dd:0 "Ignore the cursed stones."

 borderlands_events.9.t:0 "Council of Many Shrines"
 borderlands_events.9.d:0 "A market town has somehow built shrines to five faiths, two saints, and one local hero whose miracles sound suspiciously like good accounting. The priests now demand a ruling before the next festival turns into a street battle.\n\nOne faith would be simpler. The Borderlands rarely offers simple without charging extra."
 borderlands_events.9.a:0 "Recognize the shrine council."
 borderlands_events.9.b:0 "Set strict festival rules."
 borderlands_events.9.c:0 "Make the priests fund order."

 borderlands_events.10.t:0 "The Confederacy Rumor"
 borderlands_events.10.d:0 "Rumor says the princes are ready for a confederacy. This is surprising, since half of them deny speaking to the other half, and the rest are waiting to see who pays for the seal.\n\nStill, the idea has force. A shared banner might frighten enemies, attract mercenaries, and make every petty crown feel slightly less alone.\n\nIt might also give those crowns something new to argue over. That too would make it real."
 borderlands_events.10.a:0 "Encourage the confederacy talk."
 borderlands_events.10.b:0 "Mock the dream in public."
