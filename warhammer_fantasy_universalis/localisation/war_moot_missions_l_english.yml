l_english:
 moot_guilds_title:0 "Bakers' and Butchers' Guilds"
 moot_guilds_desc:0 "Every village has a baker who distrusts the butcher next door, yet both depend upon the same roads and customers. We must settle their grievances and give the guilds a reason to work together."
 moot_market_title:0 "Eicheschatten Market"
 moot_market_desc:0 "Fieldwardens can keep the roads clear, but merchants still need somewhere to unload their carts. We must equip Eicheschatten with a market worthy of the produce arriving from every corner of the Moot."
 moot_neighbours_title:0 "Good Neighbours"
 moot_neighbours_desc:0 "Stirland and Averland have long memories when the Mootland boundary is mentioned. We must cultivate dependable neighbours through agreements, goodwill, and meals generous enough to keep old grievances off the table."
 moot_pipeweed_title:0 "Greenleaf Pipeweed"
 moot_pipeweed_desc:0 "Greenleaf pipeweed already travels farther than many of the folk who grow it. We must improve the leaf and expand its cultivation until visiting merchants ask for our growers by name."
 moot_dwarf_friends_title:0 "Old Dwarf Friendships"
 moot_dwarf_friends_desc:0 "Dwarf merchants appreciate a sound bargain and a properly filled plate. We must renew the friendships that bring honest scales, reliable metalwork, and mountain customers to our markets."
 moot_caravans_title:0 "Caravans Beyond"
 moot_caravans_desc:0 "Our Dwarf friends know the passes, and our hired guards know the cost of an unattended wagon. We must establish trade beyond our home market and carry Mootland produce into the wider Old World."
 moot_kitchen_contracts_title:0 "Imperial Kitchens"
 moot_kitchen_contracts_desc:0 "Supplying an Ogre supper has taught our contractors what a hungry company can consume. We must turn that experience into dependable deliveries for imperial households, garrisons, and marching armies."
 moot_counting_houses_title:0 "Mootland Counting Houses"
 moot_counting_houses_desc:0 "The old practice of keeping accounts on a flour sack cannot serve businesses spread across the Empire. We must establish proper counting houses and keep our expanding commerce on sound money."
 moot_imperial_appetite_title:0 "An Imperial Appetite"
 moot_imperial_appetite_desc:0 "Safe roads and reliable deliveries have made our food a familiar sight in imperial markets. We must secure the commercial influence needed to ensure that this appetite is supplied by Mootland merchants."
 moot_famous_pies_title:0 "World Famous Pies"
 moot_famous_pies_desc:0 "Soldiers remember the pies that reached them in winter, and ambassadors remember the suppers that ended an argument. We must make the Moot a name welcomed at courts far beyond its modest borders."
 moot_fieldwardens_title:0 "Muster the Fieldwardens"
 moot_fieldwardens_desc:0 "Human patrols are often elsewhere when trouble reaches a Mootland hedge. We must strengthen our local levy, appoint a capable commander, and put enough Fieldwardens on the roads to answer the next alarm."
 moot_shortbows_title:0 "Slingstones and Shortbows"
 moot_shortbows_desc:0 "A stout heart does not make a halfling taller than an Orc. We must train our companies to use cover, careful shooting, and familiar ground before an enemy can bring its greater weight to bear."
 moot_hearth_shrines_title:0 "Shrines of Hearth"
 moot_hearth_shrines_desc:0 "Esmeralda watches over hearth and home, but the shrines that serve our villages need more than warm words. We must support their keepers and make room for worship wherever the Moot gathers to share its bread."
 moot_witch_hunters_title:0 "Witch Hunters at Supper"
 moot_witch_hunters_desc:0 "Visiting witch hunters have begun asking whether every unfamiliar hearth custom conceals a darker devotion. Our assembly must establish clear terms for their investigations before suspicion sets neighbour against neighbour."
 moot_hired_heroes_title:0 "Heroes for Hire"
 moot_hired_heroes_desc:0 "Our mountain friendships have introduced captains willing to work for honest coin and excellent board. We must retain experienced soldiers and keep enough money aside to honour their contracts."
 moot_ogre_guests_title:0 "Ogres at Our Table"
 moot_ogre_guests_desc:0 "Ogre travellers have discovered that a halfling kitchen rarely underestimates an appetite. We must demonstrate that we can feed and pay these formidable guests before offering them a lasting place in our service."
 moot_sylvanian_watch_title:0 "The Sylvanian Watch"
 moot_sylvanian_watch_desc:0 "Prosperity has filled our storehouses, but Sylvania still casts a long shadow over the eastern roads. We must strengthen the Mootland watches and prepare soldiers who can hold their posts when the dead begin to move."
 moot_hungry_dead_title:0 "Drive Back the Hungry Dead"
 moot_hungry_dead_desc:0 "Fortifications buy time, but they cannot silence the masters who send corpses against our fields. We must take our place in a victorious war against the undead and bring our companies home with their purpose fulfilled."
 moot_army_provisions_title:0 "Provision the Empire"
 moot_army_provisions_desc:0 "Imperial armies cannot live on declarations of courage. We must organise the harvests, households, and contracts needed to keep allied soldiers fed through long campaigns against the enemies of the living."
 moot_defended_homeland_title:0 "A Home Worth Defending"
 moot_defended_homeland_desc:0 "Every hedge now shelters the work of generations, and every village helps sustain the wider Empire. We must ensure that our capital, settlements, and reserves can withstand a renewed assault without abandoning the harvest."
 moot_family_elders_title:0 "Assemble the Family Elders"
 moot_family_elders_desc:0 "Every family knows how the Moot ought to be governed, and most insist upon explaining it at length. We must bring the elders together and give their decisions an administration capable of carrying them beyond the supper table."
 moot_boundary_stones_title:0 "Settle the Boundary"
 moot_boundary_stones_desc:0 "A disputed ditch can keep two families quarrelling longer than an imperial succession. We must survey the marches, improve their settlements, and let the Fieldwardens enforce boundaries everyone can recognise."
 moot_assembly_title:0 "A Proper Moot Assembly"
 moot_assembly_desc:0 "The elders have settled local disputes, but common concerns still disappear between village records. We must provide the assembly with dependable courts and preserve the trust on which its authority rests."
 moot_charter_title:0 "Ludwig's Charter"
 moot_charter_desc:0 "Ludwig the Fat gave the Moot its privileges, but old parchment needs living defenders. We must secure recognition from the imperial ruler or a dependable coalition of allies, then decide how those liberties should serve our future."
 moot_diet_title:0 "A Voice in the Diet"
 moot_diet_desc:0 "Our electoral dignity means little if taller delegates speak over every proposal. We must build friendships among the electors, or an equally substantial alliance network, so that the Moot is heard when its security and trade are discussed."
 moot_full_bloom_title:0 "The Moot in Full Bloom"
 moot_full_bloom_desc:0 "Recognised rights, dependable defenders, and thriving vineyards have given the Moot a chance to flourish. We must spread that prosperity through all five of our old districts before pursuing greater ambitions abroad."
 moot_cookery_college_title:0 "A College of Cookery"
 moot_cookery_college_desc:0 "Our finest recipes are still scattered among family cupboards and jealously guarded notebooks. We must establish a college where skilled teachers can preserve those discoveries and train cooks capable of serving an entire province."
 moot_pie_week_title:0 "The Grand Pie Week"
 moot_pie_week_desc:0 "The dead have been driven back, and our kitchens are ready to celebrate the peace they helped sustain. We must prepare a Pie Week whose ovens, guests, and generous tables will be remembered throughout the Empire."
 moot_breadbasket_title:0 "Breadbasket of the Empire"
 moot_breadbasket_desc:0 "The Empire has come to rely on our kitchens, but a reputation cannot replace a poor harvest. We must expand the farms and food industries that can sustain that promise in hard years as well as good ones."
 moot_end_times_feast_title:0 "A Feast to Remember"
 moot_end_times_feast_desc:0 "Darkness has tested the living, yet our fields still yield and our tables still welcome those who stood beside us. We must preserve every ingredient of our great feast, lead the world in grain or beer, restore the whole Moot to prosperity, and return victorious from a great war against Chaos or undeath in the age of gathering doom. Then we shall show the Empire that there is still something worth coming home to."
 moot_bread_title:0 "Bread for Every Table"
 moot_bread_desc:0 "Our ovens need a dependable supply of grain, but too many fields still yield less than they should. We must improve cultivation in a grain-producing district until every village can depend upon a sound loaf."
 moot_granaries_title:0 "Mootland Granaries"
 moot_granaries_desc:0 "A larger harvest will be wasted if it lies damp in a cart or disappears into an unrecorded store. The elders must equip our districts with the workshops and storage businesses needed to preserve and process their produce."
 moot_cattle_title:0 "Cattle for the Cookpots"
 moot_cattle_desc:0 "Settled boundaries have made room for dependable grazing and honest cattle markets. We must develop a productive source of livestock, within our lands or those of our subjects, or secure enough of the cattle trade to keep the cookpots filled."
 moot_fish_title:0 "A Proper River Supper"
 moot_fish_desc:0 "The Aver and Blue Reach bring fishermen to our doors, yet fresh catches still fail to reach many village tables. We must combine a reliable fish supply with a market capable of distributing it."
 moot_beer_title:0 "Beer by the Barrel"
 moot_beer_desc:0 "Our renewed privileges give the brewers confidence to enlarge their cellars. We must develop a dependable brewing district whose barrels can accompany our merchants wherever they travel."
 moot_wine_title:0 "Wine for Our Guests"
 moot_wine_desc:0 "A louder voice in imperial affairs brings more guests to our tables. We must develop a wine-producing district until even the most exacting visitor has something kind to say before the negotiations begin."
 moot_game_title:0 "Game for the Great Roast"
 moot_game_desc:0 "The new cookbook describes roasts that deserve more than an ordinary market joint. We must establish a developed hunting district or a reliable share of the fur trade, bringing the game of those woodland economies into our kitchens."
 moot_sugar_title:0 "Sugar for the Pies"
 moot_sugar_desc:0 "The college has devised pastries whose sweetness cannot be supplied by a handful of local stores. We must secure substantial sugar production or a dependable place in its long-distance trade."
 moot_tea_coffee_title:0 "A Cup After Supper"
 moot_tea_coffee_desc:0 "Our guests linger after dessert, and foreign travellers have introduced drinks that make those conversations longer still. We must secure a regular supply of tea or coffee to complete the hospitality for which the Moot is becoming famous."
 moot_laden_table_title:0 "A Table Laden with Plenty"
 moot_laden_table_desc:0 "Every course has found its cooks, but a great table depends on supplies that last beyond a single celebration. We must maintain the entire menu and support it with food industries capable of serving our guests year after year."
 moot_salt_title:0 "Salt for the Larder"
 moot_salt_desc:0 "A good harvest is little comfort when its meat spoils before winter. We must secure salt and a proper distribution market so that our larders can preserve the food our farmers and fishermen provide."
 moot_spices_title:0 "Season the Stew"
 moot_spices_desc:0 "Our larders can preserve a meal, but the best cooks want to make it memorable. We must develop a source of spices or draw their trade into our markets, giving familiar dishes a little of the wider world."
 moot_cloves_title:0 "Cloves from Distant Shores"
 moot_cloves_desc:0 "Travelling merchants speak of a fragrant clove whose smallest measure can transform a dish. We must establish a dependable supply from its distant growers and teach our cooks to use it with a suitably careful hand."
 moot_pantry_title:0 "A Well-Stocked Pantry"
 moot_pantry_desc:0 "Seasonings are welcome, but a clever recipe cannot conceal an empty pantry. We must keep grain, livestock, and fish arriving together, with enough money in reserve to withstand an interrupted delivery."
 moot_master_cooks_title:0 "Secrets of the Master Cooks"
 moot_master_cooks_desc:0 "Our brewers and household cooks have accumulated knowledge that apprentices learn only by patient service. We must support skilled teachers and better methods so that these secrets strengthen the whole Moot."
 moot_cookbook_title:0 "The Halfling Cookbook"
 moot_cookbook_desc:0 "Wine, beer, seasonings, and years of kitchen experiments have filled more notebooks than any family can preserve alone. We must gather that knowledge into an authoritative cookbook and encourage the discoveries that will fill its next edition."
 moot_chocolate_title:0 "Chocolate Delicacies"
 moot_chocolate_desc:0 "Foreign traders bring a bitter cocoa that our confectioners insist can become something extraordinary. We must secure a mature source of the beans and the expertise needed to turn an unfamiliar luxury into a Mootland delicacy."
 moot_dessert_title:0 "The Dessert Course"
 moot_dessert_desc:0 "Sugar and cocoa have reached our kitchens, but a proper dessert course requires confectioners working at a greater scale. We must sustain both supplies and develop Eicheschatten into a capital capable of hosting the tables they deserve."
 moot_missions.1.t:0 "Witch Hunters at Supper"
 moot_missions.1.d:0 "The witch hunters arrived before the soup, carrying warrants that said a great deal about wickedness and very little about Mootland law. The keepers of our hearth shrines have answered with records of service, family testimony, and a determined refusal to see every old custom treated as a confession. Even the hunters concede that a frightened village makes a poor witness.\n\nOur assembly must now decide who may investigate beneath these roofs. We can make the protection of lawful hearth worship our first principle, or license a closely supervised watch to pursue genuine conspirators. Either settlement will place a clear rule between an accusation and a burning home."
 moot_missions.1.a:0 "Protect our hearth customs."
 moot_missions.1.b:0 "License a watch answerable to the assembly."
 moot_missions.2.t:0 "Ludwig's Charter Renewed"
 moot_missions.2.d:0 "The charter has been read aloud, with every privilege carefully repeated for the benefit of our guests. Some human listeners still smile at the story of Ludwig the Fat and his fondness for halfling cooking. The elders have let them finish smiling before producing the boundaries, seals, and obligations that followed from that supposedly excellent joke.\n\nRecognition now rests upon more than the age of our parchment. Friends beyond the Moot have agreed that its liberties deserve a place in the present order.\n\nThe question is how to make that agreement endure. Some elders want stronger local arrangements that keep distant officials from meddling in village business, while others would send trusted speakers to every friendly court. The charter can support either course, provided we give its words a living purpose."
 moot_missions.2.a:0 "Strengthen the administration of our liberties."
 moot_missions.2.b:0 "Give our friends a permanent voice at our table."
 moot_missions.3.t:0 "Ogres at Our Table"
 moot_missions.3.d:0 "The visiting Ogres have emptied three cookpots and inspected the fourth with considerable interest. Their spokesman calls the meal a promising beginning, which our quartermaster has wisely entered in the accounts as praise. Behind the cooks, several elders are calculating how many wagons would be needed to maintain such an appetite through winter.\n\nA contract has nevertheless begun to take shape. The Ogres can lend their formidable weight to our household defenders, or accompany merchant caravans whose goods attract unwelcome attention. They seem content with either arrangement, so long as the clauses concerning supper remain exceptionally clear."
 moot_missions.3.a:0 "Stand with our household defenders."
 moot_missions.3.b:0 "Keep our merchants and their wagons safe."
 moot_missions.4.t:0 "The Grand Pie Week"
 moot_missions.4.d:0 "Before dawn the ovens of Eicheschatten were already glowing, and the roads were filling with guests. There are soldiers who remember our bread on a cold march, merchants who remember a fair bargain, and delegates who claim that they came solely to discuss public affairs. All have found a place in the queue.\n\nThe college has set out its finest work beside the recipes that families have guarded for generations. Apprentices carry trays between tables while their teachers argue over pastry, fruit, seasoning, and precisely whose grandmother first solved each problem.\n\nThe elders can turn this gathering into a lasting exchange of methods among our cooks and producers. They can also use its generous hospitality to settle disputes and draw distant friends closer. For once, everyone agrees that either proposal deserves another helping."
 moot_missions.4.a:0 "Let every kitchen learn from the best."
 moot_missions.4.b:0 "Invite every delegation to share our table."
