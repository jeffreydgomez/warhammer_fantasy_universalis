l_english:

 hobgoblin_events.1000.t:0 "The Khan's Long Shadow"
 hobgoblin_events.1000.d:0 "The Hobgoblin tribes ride the eastern steppes north of Cathay, where a camp can vanish by dawn and a wolf-rider can return with news, plunder, or a better offer. They are Greenskins, but not the simple roaring kind that mistakes noise for strategy.\n\nKhans rule by fear, gifts, and the promise that betrayal is disgraceful only when it fails. The Hobgobla Khan casts a long shadow over the grasslands, while lesser chiefs bargain with Chaos Dwarfs, raid Cathayan borders, and sell their spears when coin and survival agree.\n\nTo unite the tribes is to make cunning into empire. The wolves are already running, and every campfire on the horizon may be an oath, a trap, or both."
 hobgoblin_events.1000.a:0 "A clever blade cuts deepest."

 hobgoblin_events.1.t:0 "The Wolf Herds Scatter"
 hobgoblin_events.1.d:0 "A prized wolf herd has scattered across the cold grass after a rival feast ended with shouting, smoke, and suspiciously full saddlebags. The herders blame spirits, which is how Hobgoblins pronounce names they cannot safely accuse.\n\nWithout wolves, a khan is just a loud pedestrian. The loss must be answered quickly."
 hobgoblin_events.1.a:0 "Track them before dawn."
 hobgoblin_events.1.b:0 "Buy ugly replacements."

 hobgoblin_events.2.t:0 "An Oath From a Lesser Khan"
 hobgoblin_events.2.d:0 "A lesser khan has arrived to offer loyalty, tribute, and a smile that makes every guard check his belt. His oath names every ancestor, every wolf, and several escape routes.\n\nAccepting him could grow the horde. Refusing him could leave a dangerous rider free to find someone more gullible.\n\nHobgoblin loyalty is not false. It is simply priced by the day."
 hobgoblin_events.2.a:0 "Accept the oath carefully."
 hobgoblin_events.2.b:0 "Demand a hostage first."
 hobgoblin_events.2.c:0 "Refuse the smiling snake."

 hobgoblin_events.3.t:0 "Cathayan Caravan Dust"
 hobgoblin_events.3.d:0 "Scouts have spotted Cathayan caravan dust beyond the ridge, slow, guarded, and heavy with goods. The merchants believe distance from the Great Bastion gives them safety, which is a touching idea.\n\nA raid would feed the camps and frighten the frontier. A bargain might bring longer profit, if anyone can resist stealing the negotiator's horse."
 hobgoblin_events.3.a:0 "Ride them down."
 hobgoblin_events.3.b:0 "Offer an expensive escort."
 hobgoblin_events.3.c:0 "Send riders to count guards."
 hobgoblin_events.3.dd:0 "Let this one pass."

 hobgoblin_events.4.t:0 "Black Iron Envoys"
 hobgoblin_events.4.d:0 "Chaos Dwarf envoys have come with black iron tablets and the kind of politeness that expects obedience. They want riders for a distant war and pretend this is a request.\n\nServing them brings protection and shame in equal measure. Refusing them brings pride, which is much less useful against artillery."
 hobgoblin_events.4.a:0 "Send riders and remember the price."
 hobgoblin_events.4.b:0 "Haggle over every rider."
 hobgoblin_events.4.c:0 "Refuse the black tablets."

 hobgoblin_events.5.t:0 "Masks of Gork-Khan and Mork-Khan"
 hobgoblin_events.5.d:0 "The shamans have taken out the masks of Gork-khan and Mork-khan, each snarling in a different direction. They insist the spirits require a rite before the next raid, which means someone important has offended them or someone unimportant is about to pay.\n\nThe warriors like the masks. The khans like anything that makes warriors listen for five minutes."
 hobgoblin_events.5.a:0 "Fund the masked rite."
 hobgoblin_events.5.b:0 "Use the rite to cow rivals."
 hobgoblin_events.5.c:0 "Mock the shuffling priests."

 hobgoblin_events.6.t:0 "Knives at the Feast"
 hobgoblin_events.6.d:0 "A victory feast has produced three dead captains, two missing cups, and one singer who insists he saw nothing because he was under the table professionally. Every surviving guest claims innocence with impressive speed.\n\nThe horde expects punishment. It also expects the punishment to miss anyone important enough to be useful."
 hobgoblin_events.6.a:0 "Punish the careless knives."
 hobgoblin_events.6.b:0 "Stage a very selective trial."
 hobgoblin_events.6.c:0 "Let the feud teach caution."

 hobgoblin_events.7.t:0 "Scouts by the Great Bastion"
 hobgoblin_events.7.d:0 "Scouts near the Great Bastion have returned with maps, rumors, and arrows in places they refuse to discuss. They say the walls are strong, the patrols nervous, and the supply lines worth knowing.\n\nThe reports could guide raids or bargaining. They could also be bait, since Cathay knows how to write maps for fools.\n\nNo one trusts the scouts fully. That means they are probably doing their job."
 hobgoblin_events.7.a:0 "Plan around the supply lines."
 hobgoblin_events.7.b:0 "Sell copies to rivals."
 hobgoblin_events.7.c:0 "Check every mark twice."
 hobgoblin_events.7.dd:0 "Ignore the obvious bait."

 hobgoblin_events.8.t:0 "A Contract Worth Keeping"
 hobgoblin_events.8.d:0 "A foreign captain has offered a mercenary contract with clear payment, limited risk, and enemies no one in the camp likes anyway. The elders agree this is suspiciously close to honest work.\n\nKeeping the contract could make the tribes richer and more respected. Betraying it would be traditional, but tradition does not always pay in advance."
 hobgoblin_events.8.a:0 "Keep this contract clean."
 hobgoblin_events.8.b:0 "Fight smart and collect."
 hobgoblin_events.8.c:0 "Pocket the advance and wait."

 hobgoblin_events.9.t:0 "Tribute to the Mournguls"
 hobgoblin_events.9.d:0 "Messengers from the Mourngul tribe have arrived to demand tribute in wolves, arrows, and properly terrified respect. They speak in the name of the Hobgobla Khan, which makes refusing both tempting and dangerous.\n\nPaying tribute buys time. Dodging tribute buys stories, and stories are not famous for stopping lances."
 hobgoblin_events.9.a:0 "Pay the tribute and smile."
 hobgoblin_events.9.b:0 "Send a short count."
 hobgoblin_events.9.c:0 "Refuse in the Khan's name."

 hobgoblin_events.10.t:0 "A Lesson in Betrayal"
 hobgoblin_events.10.d:0 "Young riders have asked the elders to explain the difference between cunning betrayal and stupid betrayal. The elders are delighted, because this is the sort of education that can be demonstrated on enemies and relatives alike.\n\nA formal lesson could make sharper captains. A practical test could remove dull ones.\n\nNo one has volunteered to be the example. That shows promise."
 hobgoblin_events.10.a:0 "Teach the useful rules."
 hobgoblin_events.10.b:0 "Test them against rivals."
 hobgoblin_events.10.c:0 "Charge families for lessons."
 hobgoblin_events.10.dd:0 "Let fools learn last."

### Hobgoblin Khanate Missions

 hobgoblin_please_nobility_title:0 "Bind the Lesser Khans"
 hobgoblin_please_nobility_desc:0 "No Hobgobla Khan rules by title alone. The lesser khans must be flattered, threatened, and made useful before their riders will answer one horn."
 hobgoblin_few_subjects_title:0 "Tribute at the Saddle"
 hobgoblin_few_subjects_desc:0 "The first kneeling chiefs prove that our word travels beyond our own campfires. Tribute must arrive in horses, wolves, arrows, and hostages that smile only when watched."
 hobgoblin_more_subjects_title:0 "Squeeze the Clients"
 hobgoblin_more_subjects_desc:0 "A subject that pays once can pay again. We must tighten the tribute routes until every client knows that loyalty is cheaper than being reminded."
 hobgoblin_tame_the_wastes_title:0 "Tames the Wastes"
 hobgoblin_tame_the_wastes_desc:0 "Cathay lies south, but the steppe behind us is full of hungry claimants. We must tame the Great Eastern Steppes before any rival can cut our road home."
 hobgoblin_grow_1_title:0 "First Cathayan Throne"
 hobgoblin_grow_1_desc:0 "Cathay is fractured, and every court pretends its seal still matters. We must seize the first of their capitals and make the dragon courts learn our name."
 hobgoblin_grow_2_title:0 "More Cathayan Thrones"
 hobgoblin_grow_2_desc:0 "One captured court is a raid; several become policy. The Great Khan's shadow must fall across more palaces before the south believes we intend to stay."
 hobgoblin_grow_3_title:0 "Break the Dragon Courts"
 hobgoblin_grow_3_desc:0 "The dragon courts survive by letting rivals bleed for them. We must break enough capitals that their ministers begin bargaining with us before their armies arrive."
 hobgoblin_grow_4_title:0 "The Khan's Shadow"
 hobgoblin_grow_4_desc:0 "Cathay's lords still speak of protocol, mandate, and proper order. We must answer with occupied capitals, tribute ledgers, and wolf tracks outside their gates."
 hobgoblin_grow_5_title:0 "Cathay Beneath the Hooves"
 hobgoblin_grow_5_desc:0 "The legacy of Khengai Khan will not be restored by raiding only the borders. We must ride over every Cathayan claimant, from Wei-Jin to Koryo, until the empire is a road under our hooves."

 hobgoblin_warfare_1_title:0 "Challenge a Greater Host"
 hobgoblin_warfare_1_desc:0 "The lesser khans respect a ruler who can pick a dangerous fight and survive it. We must face a stronger army and show that cunning and nerve can outweigh raw numbers."
 hobgoblin_warfare_2_title:0 "Make Them Fear Us"
 hobgoblin_warfare_2_desc:0 "Fear is cheaper than garrisons. If enough neighbors gather against us, the tribes will know our enemies have begun to think like prey."
 hobgoblin_warfare_3_title:0 "Defy the Greatest Host"
 hobgoblin_warfare_3_desc:0 "The Khanate cannot be built on easy victories. We must take the field against an army that should crush us and leave its survivors telling better stories."
 hobgoblin_protect_our_flanks_title:0 "Protect Our Flanks"
 hobgoblin_protect_our_flanks_desc:0 "A conqueror who loses the steppe dies rich and surrounded. We must secure more of the Great Eastern Steppes so Cathay cannot buy our enemies behind us."
 hobgoblin_build_barracks_title:0 "Wolf-Rider Barracks"
 hobgoblin_build_barracks_desc:0 "Felt camps move quickly, but a realm needs places where riders can gather, drill, and sleep without losing half the herd. We must build mustering grounds fit for a larger Khanate."
 hobgoblin_army_tradition_title:0 "Old Riders' Lessons"
 hobgoblin_army_tradition_desc:0 "The oldest riders know which feigned retreat becomes a rout and which smile hides a knife. We must make their lessons survive longer than their scars."
 hobgoblin_professionalism_title:0 "Ordered Warbands"
 hobgoblin_professionalism_desc:0 "Discipline is not a Cathayan invention. A Hobgoblin who obeys today can betray tomorrow from a stronger position, and our armies must learn that lesson."
 hobgoblin_reform_army_title:0 "Discipline or Tradition"
 hobgoblin_reform_army_desc:0 "The Khanate has grown too large for every band to fight by instinct alone. We must decide whether the army is bound by old rider custom or by harsher drill."

 hobgoblin_try_mork_title:0 "Please the Tribes"
 hobgoblin_try_mork_desc:0 "The nomadic tribes are proud, greedy, and useful. We must satisfy their demands before the Khan asks them to ride far from their familiar pasture."
 hobgoblin_try_gork_title:0 "One Camp, One Faith"
 hobgoblin_try_gork_desc:0 "A divided horde wastes blades on itself. We must bring the camps into one religious order and raise the Khan's prestige high enough that doubters lower their eyes."
 hobgoblin_happy_priest_title:0 "Steppe Rites"
 hobgoblin_happy_priest_desc:0 "The shamans speak of the Hobgobla Khan's shadow, wolf-oaths, and old steppe spirits that favor sharp bargains. We must give them rites grand enough to make the camps listen."
 hobgoblin_estates_title:0 "Council of the Camps"
 hobgoblin_estates_desc:0 "The khans, shamans, traders, and captains all pull at the saddle straps of the realm. We must make their rival demands serve the Khanate instead of tearing it loose."
 hobgoblin_reform_personal_freedom_title:0 "Rights Under the Khan"
 hobgoblin_reform_personal_freedom_desc:0 "Every camp wants room to scheme, trade, and quarrel. We must decide how much freedom sharpens the tribes and how much simply invites a knife in the dark."
 hobgoblin_reform_government_title:0 "Reform the Khanate"
 hobgoblin_reform_government_desc:0 "The horde is becoming a state, whether the old riders admit it or not. We must either rule with near-unquestioned authority or make unrest so low that obedience becomes habit."
 hobgoblin_reform_fightiness_title:0 "The Khanate's Road"
 hobgoblin_reform_fightiness_desc:0 "The Khanate must choose what keeps it alive after conquest. We can let power struggle keep every chief sharp, or we can mark roads, ledgers, and laws across the lands we have taken."
 hobgoblin_global_khanate_title:0 "Khanate Without Borders"
 hobgoblin_global_khanate_desc:0 "The Khanate is no longer a steppe rumor. Its riders, envoys, and tribute collectors now cross enough land that distant camps begin to ask what our favor costs."
 hobgoblin_reform_orcs_hobgoblin_or_goblin_title:0 "Choose the Legacy"
 hobgoblin_reform_orcs_hobgoblin_or_goblin_desc:0 "The old Hobgoblin road, the Chaos warrior way, and the Cathayan courtly path all promise strength. We must choose which legacy will shape the khans who rule after us."

 hobgoblin_some_war_reps_title:0 "War Tribute"
 hobgoblin_some_war_reps_desc:0 "A defeated enemy should keep paying after the shouting stops. We must make war reparations part of the Khanate's ordinary income."
 hobgoblin_more_war_reps_title:0 "More War Tribute"
 hobgoblin_more_war_reps_desc:0 "The first tribute trains proved the idea. Now we must make more beaten rulers send wealth over the roads while thanking us for accepting it."
 hobgoblin_make_guilds_happy_title:0 "Bend the Traders"
 hobgoblin_make_guilds_happy_desc:0 "Merchants are not brave, but their ledgers know where the wealth hides. We must keep the guilds useful enough to count our plunder and afraid enough not to count it twice."
 hobgoblin_build_churches_title:0 "Raise Khanate Shrines"
 hobgoblin_build_churches_desc:0 "A shrine beside a road tells every caravan whose spirits watch the crossing. We must build places where faith, fear, and tribute meet."
 hobgoblin_build_markets_title:0 "Market Camps"
 hobgoblin_build_markets_desc:0 "Loot rots if it cannot be sold. We must raise markets where horses, silk, iron, hostages, and promises can change hands under the Khan's eye."
 hobgoblin_reform_economy_title:0 "Count the Plunder"
 hobgoblin_reform_economy_desc:0 "Raiding makes wealth arrive quickly and vanish faster. We must decide whether plunder remains a windfall or becomes the foundation of a richer Khanate."

 hobgoblin_raid_naggarond_title:0 "Sack Naggarond"
 hobgoblin_raid_naggarond_desc:0 "Naggarond is cold, cruel, and swollen with treasures stolen by older predators. We must prove Hobgoblin riders can take from the Druchii as easily as from caravan guards."
 hobgoblin_raid_hexotl_title:0 "Sack Hexoatl"
 hobgoblin_raid_hexotl_desc:0 "Hexoatl's temple wealth lies far from the steppe, guarded by scales and old magic. A raid there would make even distant courts speak carefully of the Khanate."
 hobgoblin_raid_lothern_title:0 "Sack Tlaxtlan"
 hobgoblin_raid_lothern_desc:0 "Tlaxtlan is a temple-city of stone, gold, and cold-blooded certainty. We must show that even ancient plans can be interrupted by riders who arrive at the wrong time."
 hobgoblin_raid_itza_title:0 "Sack Itza"
 hobgoblin_raid_itza_desc:0 "Itza is older than most kingdoms and richer than most liars claim. We must strike it, loot what can be carried, and leave the jungle wondering where the horses went."
 hobgoblin_raid_couronne_title:0 "Sack Couronne"
 hobgoblin_raid_couronne_desc:0 "Couronne's knights dress pride in bright steel and call it honor. We must carry off enough banners and horses to make that pride expensive."
 hobgoblin_raid_athel_loren_title:0 "Burn Athel Loren"
 hobgoblin_raid_athel_loren_desc:0 "Athel Loren is a forest that thinks itself a kingdom. We must raid its edges, break its sanctuaries, and remind the elves that trees do not stop fire forever."
 hobgoblin_raid_remas_title:0 "Sack Remas"
 hobgoblin_raid_remas_desc:0 "Remas believes stone walls and clever merchants can tame every threat. We must arrive as the threat that cannot be priced fairly."
 hobgoblin_raid_palace_of_the_wizard_caliph_title:0 "Rob the Wizard Caliph"
 hobgoblin_raid_palace_of_the_wizard_caliph_desc:0 "The Wizard Caliph's palace gathers magic, gold, and dangerous arrogance in one place. We must take what can be taken and leave before the cleverest spells wake."
 hobgoblin_raid_kislev_title:0 "Sack Kislev"
 hobgoblin_raid_kislev_desc:0 "Kislev knows the cost of northern war, but not every rider comes from the north. We must break its capital's confidence and carry away proof."
 hobgoblin_raid_altdorf_title:0 "Sack Altdorf"
 hobgoblin_raid_altdorf_desc:0 "Altdorf is the Empire's loud heart, full of colleges, priests, and rulers who think the east is a rumor. We must make that rumor kick down a gate."
 hobgoblin_raid_barak_varr_title:0 "Sack Barak Varr"
 hobgoblin_raid_barak_varr_desc:0 "Barak Varr guards ships, cannon, and Dwarf grudges by the sea. We must raid it hard enough that even stone remembers hooves."
 hobgoblin_raid_khemri_title:0 "Sack Khemri"
 hobgoblin_raid_khemri_desc:0 "Khemri's dead kings sleep beneath gold and old curses. We must take the gold and leave the curses arguing over who was careless."
 hobgoblin_raid_skavenhold_title:0 "Sack Skavenhold"
 hobgoblin_raid_skavenhold_desc:0 "Skavenhold is a nest of tunnels, teeth, and bad promises. We know enough about betrayal to recognize amateurs and dangerous professionals alike."
 hobgoblin_raid_zharr_naggrund_title:0 "Sack Zharr-Naggrund"
 hobgoblin_raid_zharr_naggrund_desc:0 "The Chaos Dwarfs remember Hobgoblin service and expect obedience to follow it. We must remind them that a useful servant can become a costly enemy."
 hobgoblin_raid_karaz_a_karak_title:0 "Sack Karaz-a-Karak"
 hobgoblin_raid_karaz_a_karak_desc:0 "Karaz-a-Karak is the greatest Dwarf hold, armored in stone and grievance. We must strike it for wealth, glory, and the satisfaction of adding a new insult to their books."
 hobgoblin_raid_pigbarter_title:0 "Sack Pigbarter"
 hobgoblin_raid_pigbarter_desc:0 "Pigbarter is a noisy market where every road sells something and every promise has a smell. We must take the crossroads before someone else profits from them."
 hobgoblin_raid_dragon_gate_title:0 "Break Dragon Gate"
 hobgoblin_raid_dragon_gate_desc:0 "The Great Bastion was raised to keep the northern terrors out of Cathay. We must break Dragon Gate and prove that walls are only bargains made with time."
 hobgoblin_raid_wei_jin_title:0 "Sack Wei-Jin"
 hobgoblin_raid_wei_jin_desc:0 "Wei-Jin is the prize Cathay wraps in ceremony, jade, and fear. We must sack the empty heart of the Dragon Empire and make the Great Khan's legacy undeniable."
 hobgoblin_raid_goldtooth_mine_title:0 "Sack Goldtooth Mine"
 hobgoblin_raid_goldtooth_mine_desc:0 "Goldtooth Mine is held by Ogres who understand appetite better than caution. We must take their gold before they decide we are part of the meal."
 hobgoblin_raid_mrauk_u_title:0 "Sack Mrauk U"
 hobgoblin_raid_mrauk_u_desc:0 "Mrauk U sits rich with spice, elephants, and river wealth. We must ride far enough to make even distant southern courts price Hobgoblin danger into their ledgers."
 hobgoblin_ultimate_title:0 "The Great Khan's World"
 hobgoblin_ultimate_desc:0 "The greatest cities have burned, paid, or opened their gates too late. The Khanate now stands as a world-spanning terror, and every court knows the riders may come again."

 HOBGOBLIN_CLAIM_ALL_NEIGHBOR_TT:0 "Gain Claims on all neighboring provinces."

### Hobgoblin Khanate Mission Events

 hobgoblin_events.1101.t:0 "Rights Under the Khan"
 hobgoblin_events.1101.d:0 "The enlarged Khanate now contains more camps, captains, clients, and conquered towns than one rider can threaten before breakfast. Some chiefs want harsh rules, public punishments, and a short rope for every ambitious subordinate.\n\nOthers argue that Hobgoblins are most useful when given enough room to scheme. They say a clever camp invents better bargains, better ambushes, and better excuses when the Khan allows it to breathe."
 hobgoblin_events.1101.a:0 "Fear keeps the saddle tight."
 hobgoblin_events.1101.b:0 "Let clever captains bargain."

 hobgoblin_events.1102.t:0 "Discipline or Tradition"
 hobgoblin_events.1102.d:0 "The old riders still trust the loose crescent, the false retreat, and the sudden knife more than any shouted command. They say discipline is useful only when enemies are watching and dangerous when chiefs begin to believe it.\n\nThe younger captains answer that Cathay will not fall to memory alone. A Khanate that means to hold cities, roads, and tribute must teach its warbands to move as one without forgetting how to lie."
 hobgoblin_events.1102.a:0 "Stoke the old rider fury."
 hobgoblin_events.1102.b:0 "Drill them until obedience is useful."

 hobgoblin_events.1103.t:0 "Reform the Khanate"
 hobgoblin_events.1103.d:0 "What began as a moving court of tents and threats has become a realm with roads to guard, tribute to count, and ambitious chiefs to disappoint. The Khan's word travels farther now, but distance gives every order time to collect excuses.\n\nSome advisers would turn the new state toward sharper conquest and make government another weapon. Others would chain the camps into a quieter order, reducing private feuds so the Khanate can spend its violence outward."
 hobgoblin_events.1103.a:0 "Make rule another blade."
 hobgoblin_events.1103.b:0 "Chain the camps into order."

 hobgoblin_events.1104.t:0 "The Khanate's Road"
 hobgoblin_events.1104.d:0 "The road from the Eastern Steppes into Cathay is no longer just a trail of hooves and smoke. It is a line of tribute, hostages, market camps, and conquered gates that lesser khans now fight to control.\n\nWe can let that struggle remain open, keeping every chief sharp and every office contested. Or we can mark the roads in a more Cathayan fashion, using signs, records, and hard appointments to make conquest easier to govern."
 hobgoblin_events.1104.a:0 "Let power struggle keep them sharp."
 hobgoblin_events.1104.b:0 "Mark the roads and count the gates."

 hobgoblin_events.1105.t:0 "Count the Plunder"
 hobgoblin_events.1105.d:0 "Plunder has always been simple: take it, count it badly, and accuse the dead of losing the rest. That custom works for a raid, but the Khanate now drags home wealth too large to vanish into saddlebags.\n\nThe treasurers want stricter counts and stable coin so tribute does not rot into argument. The builders want roads, markets, and storehouses so the next raid begins from a stronger camp."
 hobgoblin_events.1105.a:0 "Stabilize the tribute counts."
 hobgoblin_events.1105.b:0 "Build where the loot returns."

 hobgoblin_events.1106.t:0 "Choose the Legacy"
 hobgoblin_events.1106.d:0 "The Khanate has become large enough that imitation is now a political weapon. Some chiefs insist we must keep the old Hobgoblin legacy of wolf-riders, lesser khans, and knife-practical bargains.\n\nOthers look west to Chaos warriors and admire their brutal discipline, iron hierarchy, and contempt for weakness. A quieter faction studies Cathay, arguing that the dragon courts survived because scribes, ministers, and rituals can bind more land than terror alone."
 hobgoblin_events.1106.a:0 "Keep the Hobgoblin legacy."
 hobgoblin_events.1106.b:0 "Embrace the Chaos warrior way."
 hobgoblin_events.1106.c:0 "Embrace the Cathayan way."

### Hobgoblin Khanate Mission Modifiers

 hobgoblin_squeeze_vassals_1:0 "Saddle Tribute"
 desc_hobgoblin_squeeze_vassals_1:0 "Our subjects send riders and supplies before they are asked twice."
 hobgoblin_squeeze_vassals_2:0 "Hard Saddle Tribute"
 desc_hobgoblin_squeeze_vassals_2:0 "Our subjects now pay in soldiers, coin, and the quiet understanding that refusal has a short future."
 hobgoblin_respect_of_the_nobles_1:0 "Lesser Khans Acknowledged"
 desc_hobgoblin_respect_of_the_nobles_1:0 "The lesser khans have been given enough gifts and attention to make obedience profitable."
 hobgoblin_respect_of_the_nobles_2:0 "Lesser Khans Honored"
 desc_hobgoblin_respect_of_the_nobles_2:0 "Titles, loot, and careful threats keep the lesser khans aligned with the Khanate."
 hobgoblin_respect_of_the_nobles_3:0 "Lesser Khans Bound"
 desc_hobgoblin_respect_of_the_nobles_3:0 "The chief families now see service to the Khan as the safest path to power."
 hobgoblin_army_tradition:0 "Old Rider Lessons"
 desc_hobgoblin_army_tradition:0 "Veteran riders keep the old tricks alive in every camp and mustering ground."
 hobgoblin_tried_mork:0 "Tribal Bargains"
 desc_hobgoblin_tried_mork:0 "Pleasing the tribes has strengthened our web of favors, scouts, and carefully priced loyalties."
 hobgoblin_tried_gork:0 "United Camp Rites"
 desc_hobgoblin_tried_gork:0 "The camps share enough rites and prestige to turn religious unity into harder blows."
 hobgoblin_rituals:0 "Steppe Fire Rites"
 desc_hobgoblin_rituals:0 "Shamans and captains bless the warbands with rites of flame, fear, and sharp timing."
 hobgoblin_reform_personal_freedom_repression:0 "Fear Under the Khan"
 desc_hobgoblin_reform_personal_freedom_repression:0 "The camps are ruled by visible punishment and short arguments."
 hobgoblin_reform_personal_freedom_expression:0 "Bargained Camp Rights"
 desc_hobgoblin_reform_personal_freedom_expression:0 "The Khan allows enough room for clever captains to produce useful ideas."
 hobgoblin_professionalism:0 "Ordered Warbands"
 desc_hobgoblin_professionalism:0 "Our riders drill without forgetting that obedience is another weapon."
 hobgoblin_reform_army_morale:0 "Old Rider Fury"
 desc_hobgoblin_reform_army_morale:0 "The warbands charge with the confidence of tribes that know every false retreat by heart."
 hobgoblin_reform_army_discipline:0 "Khanate Drill"
 desc_hobgoblin_reform_army_discipline:0 "The Khan's captains have made discipline useful enough for even suspicious riders to respect."
 hobgoblin_ultimate:0 "The Great Khan's World"
 desc_hobgoblin_ultimate:0 "The greatest cities of the world know Hobgoblin hooves, and the Khanate rides with terrible confidence."
 hobgoblin_reform_warscore_cost_1:0 "Tribute Clauses"
 desc_hobgoblin_reform_warscore_cost_1:0 "Our treaties make enemies pay before they have time to understand the smaller writing."
 hobgoblin_reform_warscore_cost_2:0 "Predatory Tribute Clauses"
 desc_hobgoblin_reform_warscore_cost_2:0 "Our diplomats have become excellent at turning victory into humiliating payment schedules."
 hobgoblin_reform_government_war:0 "Government as a Blade"
