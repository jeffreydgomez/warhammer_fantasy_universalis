l_english:
 #H12
 string_start_title_naggaroth:0 "Naggaroth, the Dark Exiles"
 string_start_naggaroth:0 "§g\"There are not enough words in your simple tongue to express our hatred for them, Human. Killers, despoilers, slavers and thieves we name them, but not one of these oft-earned titles begins to describe the depths of their depravity. They have neither mercy nor honour. They roam and kill in darkness called up by their foul sorceries. They are so base as to specifically target children for their depredations. The capricious folk of Ulthuan claim that they are their despised kin, exiled long ago, but truly, can one ever trust the words of an Elf?".\n-Hargrim Furgilsson, Dwarf Trader§!\n\nIn the chill land of Naggaroth lies a realm steeped in malice. This is the home of the Dark Elves, the outcast warrior children of Ulthuan. They watch the world with malevolent eyes, knowing it is their birthright to rule and the destiny of all others to serve, if they are permitted to live at all. Yet the Dark Elves know that they cannot claim their glorious inheritance while the hated betrayers the High Elves endure. They are two halves of a race sundered long ago, separated by the greatest betrayal ever to occur in all the ages of the world, when the soft and weak Asur cast out those who had loyally fought to defend their homeland. Even should every other land bow to their rule, the Naggarothi will not rest until they have brought ruin to the traitors of Ulthuan, toppled their temples, and driven them into the sea.\n\nOn that day the Witch King of Naggaroth, Malekith himself, will finally claim a throne long denied him, and his and his alone rule will spread to every corner of the world."

 #land of the dead
 string_start_title_nehekhara:0 "Nehekhara - the Tomb Kings"
 string_start_nehekhara:0 "The lands of §YNehekhara§! were once vast and fertile and for more than a thousand years it prospered and grew in influence, ruled by Priest Kings, each of whom controlled a city state. Greatest amongst the Priest Kings was §YSettra§!, first to unify Nehekhara under his authority, and it was Settra who brought the Mortuary Cult to power, for he wished to find a way to conquer death itself and rule eternally. Though the Cult could prolong the lives of their rulers greatly, they could not stave off death entirely, and instead promised a future glorious eternal afterlife. This promise led directly to the Nehekharan obsession with death and countless tombs were created to house the Royal families of Nehekhara as generations passed, until the riches of the dead far outweighed those of the living. \n\nNehekhara's fate came in the form of §YNagash§!, a genius Priest turned Necromancer who wrought the Great Ritual that laid waste to the land, slew every living soul, and bound the dead to his will in a state of undeath. Nagash was fortunately defeated and the risen Kings of Nehekhara regained their free will, but found they now ruled over a blasted land of undeath. Yet mummified undead Kings are Kings still, generations of rulers accustomed to unquestioned authority and power, and they now set forth with their numberless undead legions and animated statues to reclaim their lost empire."

 #skaven
 string_start_title_skaven:0 "Rise of the Under-Empire"
 string_start_skaven:0 "The Skaven are a malevolent and diabolical race of large, intelligent, humanoid rats that inhabit the underground of the Warhammer world, known as the Under-Empire. The sprawlings tunnels of the Under-Empire reach from the steaming jungles of the South Lands to the snow-covered steppes of Kislev, from the Western borders of Estalia and Bretonnia to the distant realms of the Far East.\n\nAt the very heart of Skavendom lies the horrific underground city of Skavenblight, hidden in the centre of the foul marches lying on the western borders of Tilea. There the  mighty Lords of Decay, ruthless rulers of all Skaven, sit in the Council of Thirteen, scheming and planning in preparation for the time when their armies will emerge from their subterranean realm to raze the entire surface world and rule over its ruins, which they refer to as the Great Ascendancy. This is the ultimate ambition of the Skaven race, a destiny which is preached by the Grey Seers, who are prophets of the Horned Rat - the festering, disgusting god Skaven deity. \n\nSkaven society follows a strict heirarchy; the Council of Thirteen and Grey Seers at the top, the Greater and Warlord Clans in the middle and the countless masses of slaves at the bottom. The fortunes of any individual are a different matter though; no race is so prone to scheming, intrigue and outright betrayal as the Skaven, with each ratlike mind devoted almost entirely to climbing the slippery ladder of power. Every skaven knows it is genius surrounded by expendable fools, and they will eventually rise to command all it surveys and conquer the above-ground in the name of their scabrous deity, for it is the ultimate recipient of the Horned Rat’s favour.\n\n§RSkaven, have a tough time administering lands above ground or outside of cities."

# Greenskin
 string_start_title_badlands_gs:0 "WAAAAGH"
 string_start_badlands_gs:0 "There is no race so pervasive, prolific, diverse, and destructive as the Greenskins. From cowardly Goblins to rugged Orcs and lumbering Trolls they are a bane to civilisations across the known world.\n\nThe cradle of the greenskins is the Badlands. Where they originally came from no one knows, but where they are strongest now is the Badlands.\n\n Greenskins thrive on war, and dissolve in peace. War is necessary for their economy to function. A warlord who embraces peace will find his coffers empty, his armies disbanded, and his men standing behind him with choppers. \n\nWith such multitudes of greenskins, it is only a matter of time before a great warlord arises from the countless masses, and the time has come. Rally the greenskins of the Badlands, and perhaps the World, for the greatest WAAAGH! yet to come.\n\n§RGreenskins Fightiness may be found on the government tab. Win battles to increase fightiness."

 #dwarf
 string_start_title_dwarf:0 "Age of Retribution"
 string_start_dwarf:0 "The Dwarfs are an ancient race, said to have been birthed from solid stone. This seems plausible, for the spirit and body of a Dwarf are hardy like stone. Many centuries ago the Dwarfs enjoyed an era of peace and prosperity known as the Golden Age, with an empire of Karaks connected by countless underground passages, featuring powerful militaries, gold, silver, iron and gromril in unimaginable abundance and rune-endowed halls full of laughter and song.\n\nHowever the Dwarfs found they had many enemies and very few true friends. As first, the arrogant Elves betrayed the Dwarfs, starting a centuries long conflict known as the War of Vengeance. The Dwarfen victory in the conflict was short-lived, as shortly after hordes of Greenskins and foul Skaven swarmed against their defences. In time the Dwarfs, strong as they may have been, were reduced to a shadow of their former glory, eroded much as a mighty mountain is by mere rain and wind.\n\nBut as the other races squabble amongst themselves and forget the wisdom of their fathers, Dwarfs hone their skills and work together to reforge their shattered empire. As the the time of the Age of Retribution draws closer, the power of Dwarf determination grows stronger.\n\n§RDwarves have a tough time administering lands above ground or outside of urban environments."
 
# arabyn

string_start_title_arabyn:0 "The Rise of a Prophet"
string_start_arabyn:0 "In 2502 IC, the deserts of Araby stand transformed by the rise of a new faith. For centuries the land bowed to many powers—ancient desert gods, fickle djinn, and a thousand whispered spirits that promised favor at a hidden price. Each city and tribe followed its own traditions, and though Araby endured, its soul remained divided.\n\nThat division was shattered by the coming of Anmar Fakir, the Prophet of the Sun. Preaching that there is but one true god, whose sign is the blazing sun above the desert, Fakir denounced all other powers as demons cloaked in familiar forms. In little more than a generation he rode across Araby through treaty and conquest alike, forging a fragile unity among the emirs, tribes, and cities beneath the banner of the Solar Mandate.\n\nYet unity born of revelation is not easily secured. Many still cling in secret to old spirits and ancient bargains, while others question whether the Prophet’s authority truly carries divine favor. The Solar Mandate rests not only upon power, but upon belief—and should faith falter, the same sun that crowned Fakir may expose his failures.\n\nStill, the Prophet teaches that the truth of the Sun is not meant for Araby alone. The next bearer of the revelation may rise from any people or land, should they proclaim the One Truth and gather followers to their cause. Whether Araby becomes the heart of a great awakening or fractures once more beneath doubt will be decided in the years to come."
## Cathay
string_start_title_cathay:0 "Cathay - A Kingdom on the Edge of Chaos"
string_start_cathay:0 "Grand Cathay remains a vast and powerful empire, its cities glittering under the rule of the Dragon Emperor and his children. Yet, beneath this grandeur, the unity of Cathay is strained. Each region of the empire is effectively governed by different factions—some led by the Dragon Emperor’s children, others by ambitious warlords, powerful merchant guilds, or secretive sorcerers. While the Emperor’s divine authority remains unchallenged in name, his control over the sprawling empire is increasingly symbolic.\n\nThese regional rulers hold significant autonomy, and in many areas, non-governmental power brokers wield more influence than the Dragon Throne itself. Merchant consortiums control trade routes, religious sects shape local policies, and ancient academies guard arcane secrets that even the imperial court dares not interfere with. The empire remains a formidable force, but its true power lies in the delicate balance between these competing factions, each with its own agenda, all vying for dominance within Cathay’s vast borders.\n\nCan the Imperial Throne reign in these rogue elements? Will a prince claim the throne? Or will the realm fall to chaos?\n\n§RCathay is a network of Dominions, semi-independent subjects that may war upon each other. Force the ruler into a dominion to take all of his dominions for yourself."

## Ogres
string_start_title_ogre:0 "The Ogre Tribes - Feeding off Greater Powers"
string_start_ogre:0 "The Ogre Kingdoms, scattered across the brutal expanse of the Mountains of Mourn, remain a fractured and fearsome presence. Along the Ivory Road, their warbands regularly descend upon caravans, shaking down traders for gold, supplies, and fresh meat. These marauding ogres are united only by their devotion to the Great Maw, a monstrous deity that demands endless sacrifice. Yet, to their great distress, the sacred Great Maw crater lies in the hands of Grand Cathay, a constant source of tension and humiliation for the ogre tribes. \n\nThough fearsome in battle, the ogres remain disorganized, each tribe driven by its own needs for food and plunder. Some whisper of a potential unification—of a time when the warring bands might come together to form a true kingdom, driven by hunger and the desire to reclaim their holy site. Yet, for now, they remain little more than wandering bandits, feared by all who dare traverse their desolate lands. The question looms - will the ogres remain divided, or rise as a cohesive force to challenge the world?"

## Chaos Dwarves

string_start_title_chaos_dwarf:0 "The Tyanny of Hashut"
string_start_chaos_dwarf:0 "In the Dark Lands, the Chaos Dwarves of Zharr-Naggrund gather their strength, their forges burning night and day as they prepare for war. Militant and tyrannical, these twisted descendants of the dwarven race are united in their devotion to Hashut, the Father of Darkness, whose fiery will drives their endless expansion. Their obsidian towers rise above slave-filled mines, where orcs, hobgoblins, and ogres toil under the lash—creatures the Chaos Dwarves despise with utter contempt.\n\nFor centuries, they have bided their time, perfecting their war machines and bolstering their armies of twisted creations. Now, the time draws near for them to strike out and claim the Dark Lands entirely. With their infernal weaponry and unyielding discipline, the Chaos Dwarves are ready to impose their iron rule on the lands around them, crushing any who dare oppose their dominion. Their neighbors, chaotic and disorganized, will be swept aside as the empire of Hashut rises."




### New ones
# Imperial
string_start_title_imperial:0 "The Men of the Old World"
string_start_imperial:0 "The Old World is a testament to humanity’s resilience, its kingdoms each forged through struggle and ambition. At its heart lies the Empire of Sigmar, a realm of independent electorates united under the Emperor, balancing power between its Elector Counts, the Imperial Crown, and the Church of Sigmar. To the north, Kislev’s Tsars and Ice Witches defend against Chaos with discipline and sorcery, while to the west, Bretonnia’s knights uphold ideals of honor and faith in service to the Lady of the Lake.\n\nFurther south, the city-states of Tilea and Estalia embody ambition and adaptability. Tilean condottieri fight for profit, while Estalian explorers seek wealth in distant lands. In the Border Princes, exiles and adventurers carve out precarious domains amidst constant turmoil, representing humanity’s unyielding drive for survival.\n\nYet, these realms face a shared threat - the unrelenting tide of Chaos. Only through unity and sacrifice can they hope to stand as the bulwark against the storm."  


string_start_title_albionise:0 "The Mist-Shrouded Isle of Albion"
string_start_albionise:0 "Albion, shrouded in mist and mystery, is a land of ancient magic and fierce rivalries. Its humans, guided by the Truthsayers, strive to protect their sacred lands from corruption, while sharing the island with the brutish Fimir, dark magic-wielding creatures who prey upon the weak. From the north, Norscan raiders strike Albion’s shores, bringing Chaos and threatening the fragile balance. Survival on the island demands strength, cunning, and unity.\n\nAlbion’s verdant moors and ancient stone circles hum with untapped power, coveted by all who tread its mist-laden soil. The Truthsayers preserve this energy, while Dark Emissaries twist Albion’s clans to serve the Ruinous Powers. Humans face Fimir raids, Norscan invasions, and their own fractured loyalties as they battle for control of Albion’s magic.\n\nThe struggle for Albion could shape the eternal war between Chaos and Order. If the Fimir or Chaos take control, Albion’s power could bring devastation far beyond its shores. Divided and embattled, the island teeters on the edge of ruin, its future precariously balanced."

string_start_title_vampire_count:0 "The Eternal Night of the Vampire Nations"
string_start_vampire_count:0 "Hidden in the shadows of the world, the vampire nations weave a web of intrigue and undeath. From Sylvania to the cursed courts of Mousillon, these immortal rulers prey on the living while plotting to expand their dark dominion. Vampires are not just conquerors but corrupters, capable of turning entire nations to their cause through diplomacy, espionage, and dark magic. A whispered promise of immortality or a well-placed agent can unravel even the strongest kingdoms, spreading vampiric influence like a plague.\n\nRuled by terrifying undead lords like the von Carsteins and Lahmians, these realms summon skeletons, ghouls, and wights to enforce their will. Subtlety is their weapon of choice, as they infiltrate courts, turn noble houses into undead vassals, and sabotage rivals. This allows them to grow their influence without provoking outright war with the Old World’s defenders.\n\nThe threat of vampirism is more than political—it is an existential danger to the world. As the curse spreads, entire populations fall to undeath, their lands turned into lifeless domains of eternal night. For those who stand against the vampires, failure means not only death but eternal servitude in the armies of darkness. The nations of the world must guard both their borders and their souls to resist this rising horror.\n\n§RVampires may spread their curse peacefully through the Convert Them diplomatic action or the Implant Cults spy action."  

string_start_title_norscan:0 "The Heralds of Chaos"
string_start_norscan:0 "The fierce tribes of Norsca hail from the frozen northern wastes, where survival is a brutal struggle against harsh elements and monstrous beasts. Devoted to the Ruinous Powers, the Norscans worship the gods of Chaos, offering blood and plunder in exchange for unholy blessings. Their warriors raid the Old World in savage attacks, looting and burning to prove their worth to the dark gods.\n\nChaos defines Norscan life, from their champions, twisted by mutations and arcane power, to their marauding warbands and monstrous allies. As they destroy and conquer, the Norscans spread Chaos’s will, sowing instability in the Old World. Their leaders compete for the gods' favor, knowing only the strongest and most brutal may rise to glory.\n\nIn the Age of the End Times, Norscans and other Chaos nations vie to crown the Everchosen, champion of the Ruinous Powers. The most powerful Chaos nation holds the best chance of ascension, its leader gaining immense strength and uniting Chaos under their rule. Every Norscan victory edges the world closer to ruin, heralding the apocalyptic storm to come.\n\n§RThe Everchosen will be selected from a Chaos nation in the age of the End Times. Increase your chances by growing and completing your mission tree."  

string_start_title_chaos_warrior:0 "The Warriors of Chaos"
string_start_chaos_warrior:0 "The Warriors of Chaos march as the chosen instruments of the Ruinous Powers, their dark armor and unholy banners striking fear into mortals. From the desolate Chaos Wastes, they spread destruction and corruption across the Old World, fighting for the favor of their gods. Each warrior seeks blessings, mutations, and ultimate ascension, their warbands uniting ruthless champions, marauding tribes, and monstrous creatures in a relentless crusade.\n\nChaos-aligned nations rise by serving the Ruinous Powers, gaining favor through growth and destruction. Completing the Chaos Warrior mission tree grants powerful boons and greatly increases the chance to become the Everchosen. Larger and more developed Chaos nations have the best chance to claim this title, their strength and conquests drawing the gods’ gaze and fulfilling their apocalyptic ambitions.\n\nIn the Age of the End Times, the Everchosen will emerge as the champion of Chaos, wielding immense power to unite the Ruinous Powers’ forces under one banner. This figure will lead a tide of destruction that threatens to engulf the world in darkness. Every conquest brings the Chaos nations closer to this ultimate goal, as the Warriors of Chaos march to unleash the final storm.\n\n§RThe Everchosen will be selected from a Chaos nation in the age of the End Times. Increase your chances by growing and completing your mission tree."

string_start_title_fimir:0 "The Fimir of Albion"
string_start_fimir:0 "The Fimir, ancient cyclopean creatures shrouded in mist and myth, stalk the marshes and moors of Albion, preying on its people and waging endless war. These servants of Chaos revel in their dark pacts with the Ruinous Powers, trading loyalty and blood sacrifice for power and protection. Fimir society is ruled by sinister matriarchs and warlike nobles, their legions of mist-wreathed warriors and enslaved thralls spreading fear and destruction. Isolated yet deeply connected to Chaos, the Fimir seek not only dominance over Albion but a place of prominence in the dark gods’ eternal plans.\n\nIn the Age of the End Times, the Fimir, like all Chaos-aligned nations, vie for the favor of the Ruinous Powers, striving to elevate one of their own as the Everchosen. Through conquest, sacrifice, and completing their own sinister missions, a Fimir nation can rise to claim this apocalyptic mantle. Larger and more powerful Fimir realms, marked by their devotion and destruction, hold the greatest chance of gaining the gods' blessings. This ultimate prize would unify their fractured clans under a single banner, unleashing their cyclopean might upon the world.\n\nShould a Fimir leader ascend as the Everchosen, Albion’s already fragile balance would collapse entirely, and their corrupted magic would spill into the wider Old World. With the dark gods’ power behind them, the Fimir would march as the vanguard of Chaos, spreading ruin far beyond their misty homeland. As Albion teeters on the brink of disaster, the Fimir sharpen their blades and prepare their dark rites, knowing their time may soon come to claim ultimate power."

string_start_title_wood_elf:0 "The Wood Elves"
string_start_wood_elf:0 "The Wood Elves are an ancient and reclusive people, dwelling in the enchanted forests of the Old World, far from the turmoil of human and dwarven lands. Their society thrives in harmony with nature, guided by mystical leaders and protected by skilled warriors and powerful forest spirits. Fiercely isolationist, the Wood Elves guard their woodland realms with unwavering vigilance, striking out at intruders with deadly precision. To them, the world beyond the forest is a place of corruption and chaos, and they see themselves as its last true defenders.\n\nThe strength of the Wood Elves is inextricably tied to their forests, where ancient magic flows and nature’s power is at its peak. Within these magical groves, their armies are nearly invincible, bolstered by the spirits of the forest and the blessings of the Asrai gods. However, the elves struggle to adapt to lands without forests or jungles, finding little benefit from controlling barren or urbanized provinces. For the Asrai, each forest is not only a home but a source of sustenance and spiritual strength, making its preservation essential to their survival.\n\nThough the Wood Elves shun the wider world, their power and influence are undeniable. They see themselves as protectors of balance, ensuring the sanctity of nature in the face of growing Chaos. Yet their refusal to engage in broader alliances leaves them vulnerable to the rising storm, their strength confined to the woods they call home. As the Age of the End Times looms, the Wood Elves must decide whether to step from the shadows or risk losing their forests—and their way of life—forever.\n\n§RAs a Wood Elf, you have a tough time administering lands outside of Forest."

string_start_title_high_elf:0 "The High Elves of Ulthuan"
string_start_high_elf:0 "The High Elves are a proud and ancient race, hailing from the island continent of Ulthuan, a land of unparalleled beauty and magical might. As the self-proclaimed protectors of the world, they see it as their duty to maintain balance and ward off the forces of Chaos. Their mastery of magic and naval power is unmatched, allowing them to influence events far beyond their shores. However, their arrogance and aloofness often alienate potential allies, leaving them isolated in their struggle to uphold their lofty ideals.\n\nUlthuan’s strength lies in its intricate network of magical waystones, which channel immense arcane energy to stabilize the world and shield it from the Realm of Chaos. High Elf armies are disciplined and versatile, with a unique affinity for magic that enhances their combat prowess. Their colonies across the globe extend their reach, but lands without strategic or magical importance are often neglected, reflecting their focus on preserving their heartlands. For the High Elves, the defense of Ulthuan is paramount, for its fall would spell doom for their race and the wider world.\n\nAs the Age of the End Times approaches, the High Elves face growing threats from all sides—Dark Elf raiders, Chaos invasions, and the unraveling of the world’s delicate balance. Their leaders must weigh whether to retreat to Ulthuan’s defenses or risk their diminishing strength in aiding the mortal races. With the fate of the world hanging in the balance, the High Elves must decide if their pride will be their undoing or the key to salvation."


string_start_title_vampire_coast:0 "The Vampire Coast"
string_start_vampire_coast:0 "The Vampire Coast is a nightmarish realm of piracy and undeath, ruled by vampiric admirals who command fleets of ghostly ships and undead sailors. Nestled in the tropical reaches of the world, these vampirates combine their lust for power with an insatiable hunger for plunder, raiding coastal settlements and claiming the seas as their domain. Their cursed fleets are feared for their relentless assaults, and their leaders, from Luthor Harkon to other infamous sea lords, use necromancy to bolster their ranks with the corpses of their enemies. To the Vampire Coast, the oceans are both battlefield and lifeblood, where they can extend their undead empire far beyond landlocked rivals.\n\nThe strength of the Vampire Coast lies in its mastery of naval warfare and its ability to raise undead armies at sea. Their settlements thrive on piracy, thriving most where trade routes converge, while traditional inland provinces hold less appeal. Coastal regions are not merely strategic but essential, providing the resources and bodies needed to fuel their undead legions. With their dark magic, they create monstrous abominations and weaponize the seas themselves, making their fleets unmatched in terror and power.\n\nIn the Age of the End Times, the Vampire Coast’s ambitions grow ever darker. As Chaos rises, the vampirates see an opportunity to expand their dominion, preying on weakened nations and rival fleets. Their leaders, consumed by greed and unholy ambition, seek to seize power not only over the seas but to extend their curse across the world. The Vampire Coast stands as a chilling reminder that the deadliest foes do not always march from the land but rise from the depths."


string_start_title_lizardmen:0 "Lizardmen of the Great Plan"
string_start_lizardmen:0 "The Lizardmen are an ancient and enigmatic race, devoted to preserving the Great Plan of the Old Ones and eradicating the forces that threaten its balance. From their jungle cities in Lustria, the Lizardmen wage a ceaseless war against Chaos, which they view as the ultimate blight upon the world. Their armies, led by the ageless Slann Mage-Priests and ferocious Saurus generals, are an awe-inspiring blend of disciplined warriors and primal beasts. Above all, they harbor an intense hatred for the Skaven, whose corruption and machinations are an affront to the sacred order the Lizardmen strive to protect.\n\nLustria’s dense jungles are both a fortress and a weapon for the Lizardmen, as the hostile terrain favors their ambush tactics and natural resilience. Their cities are fortified temples brimming with ancient magic, where the Slann channel cosmic energies to repel Chaos incursions and maintain the delicate balance of the world. The Lizardmen’s reliance on their jungle homelands makes their influence on distant lands limited, but their ferocity and tenacity ensure their enemies never underestimate them. To the Lizardmen, every battle is a divine duty to cleanse the world of corruption.\n\nAs the Age of the End Times looms, the Lizardmen redouble their efforts against the growing tide of Chaos and Skaven incursions. Their sacred mission demands unyielding vigilance, for the failure to uphold the Great Plan would plunge the world into ruin. Yet, their isolation and distrust of other races leave them to fight alone, waging their war against darkness in the jungles of Lustria. The Lizardmen stand as the ultimate guardians of order, their cold-blooded resolve a bastion against the forces of destruction.\n\n§RAs a Lizardman, you have a tough time administering arctic lands."


string_start_title_dark_elf:0 "The Dark Elves"
string_start_dark_elf:0 "The Dark Elves, or Druchii, are a cruel and vengeful race, exiled from Ulthuan long ago and now ruling from the bleak land of Naggaroth. Born from treachery and sustained by hatred, their empire is forged in slavery, bloodshed, and ruthless ambition. Led by the Witch King Malekith, the Dark Elves are masters of sorcery, naval raiding, and political subterfuge, striking terror into the hearts of mortals across the world. From the dread towers of Naggarond to the distant shores raided by their Black Arks, the Druchii pursue only one goal - dominion through cruelty.\n\nNaggaroth is a harsh and unforgiving land, and only the strong survive under the iron rule of the Witch King. Dark Elf society is built on endless intrigue, where betrayal is a tool and weakness is swiftly punished. Their economy thrives on the enslavement of other races, and their armies—composed of cold-blooded warriors, monstrous beasts, and elite sorceresses—reflect their merciless nature. Black Arks, massive floating fortresses, allow the Druchii to launch devastating invasions across the seas, and their supremacy in naval warfare rivals even that of the High Elves.\n\nIn the Age of the End Times, the Dark Elves sense opportunity. With Ulthuan weakened, Chaos rising, and the world fractured, Malekith’s long dream of reclaiming his throne as rightful Phoenix King inches closer to reality. But to achieve it, he must either destroy or dominate those who stand in his path—High Elves, humans, or even his own rebellious kin. Will the Druchii unite behind the Witch King’s vision, or will their eternal thirst for power tear them apart from within?\n\n§RDark Elves excel at naval power, slavery, and conquest—but internal strife and overextension may prove their undoing."


string_start_title_hobgoblin:0 "The Hobgoblin Khanates"
string_start_hobgoblin:0 "The Hobgoblins are the most treacherous and cunning of the Greenskin races, long despised by orcs and goblins alike for their duplicity and cowardice. But what they lack in brute strength, they make up for in guile. In the far eastern steppes beyond the Mountains of Mourn, the Hobgoblin Khanates have carved out a precarious dominion, riding in vast wolf-mounted warbands across the endless plains. Though nominally subordinate to the Chaos Dwarfs of Zharr-Naggrund, the hobgoblin chieftains serve only themselves, carefully balancing servitude and subversion.\n\nHobgoblin society is built on ruthless pragmatism. Unlike other Greenskins, they maintain rigid tribal hierarchies, wage calculated wars, and prefer ambush and deception over direct confrontation. The feared Hobgoblin Wolfboyz dominate the steppes with their speed and mobility, while tribes compete for favor from their Chaos Dwarf overlords—trading slaves, beasts, and betrayal for weapons and protection. Yet beneath their outward loyalty simmers deep resentment and ambition. Many khans dream of breaking free, uniting the clans, and forging a great hobgoblin empire of their own.\n\nAs the Age of the End Times dawns, the world weakens and the steppe stirs. The old order falters, and opportunities multiply. With Chaos spreading and empires fracturing, the Hobgoblins see a chance to rise—not as servants, but as conquerors. Will a mighty Khan emerge to unite the tribes and challenge both master and rival? Or will centuries of mistrust and infighting doom them to remain pawns in a larger war?\n\n§RHobgoblins are fast and opportunistic, favoring mobility, vassalage, and betrayal. But their strength is fragile—built on shifting alliances and the constant threat of rebellion or retribution."

string_start_title_halfling:0 "The Moot and the Smallfolk"
string_start_halfling:0 "Halfling realms are easy to underestimate, and many larger powers make that mistake with comfortable regularity. The Moot and its cousins survive through rich fields, packed larders, sharp village memory, and a talent for seeming harmless until the tax collector, robber baron, or hungry invader has already overplayed his hand. Their world is smaller than an emperor's court but no less political, for every inn, pantry, militia muster, and family table carries news faster than most diplomats can ride.\n\nThe halflings owe much of their security to neighbors who would rather laugh at them than fear them. Imperial princes, human lords, Dwarf traders, mercenary captains, and passing soldiers all want the food, roads, and hospitality that halfling country can provide. That attention is useful but dangerous, because a small realm that feeds giants must learn when to bargain, when to hide the best stores, and when to bring every sling and kitchen knife to the hedgerow.\n\nAs the End Times approach, comfort becomes a prize worth killing for. Famine, Greenskin raids, vampire recruiters, ambitious human nobles, and Chaos-tainted armies may all discover that the richest little fields in the world are not defended by jokes alone. If the halflings are to keep hearth and harvest, they must turn modest customs into a state strong enough to survive being noticed."

string_start_title_tomb_kings:0 "The Deathless Kings"
string_start_tomb_kings:0 "The Tomb Kings are the ancient priest-kings of Nehekhara, awakened from royal sepulchers into a world that has forgotten how to kneel properly. They were promised immortal glory by the Mortuary Cult, but Nagash's betrayal left them with a harsher eternity: dry flesh, bronze wills, and legions that answer every royal command in silence. To their own eyes they are not monsters, but sovereigns denied paradise and robbed of the living empire that was theirs by divine law.\n\nEvery Tomb King remembers Nehekhara as it should have been, whether through clear memory, court ritual, or the flattering lies of priests. Tomb cities, mortuary temples, chariot hosts, skeletal spearmen, and towering constructs give these realms a majesty that younger nations mistake for decay. Yet the dead do not forget insult, and every occupied oasis, stolen relic, broken obelisk, or Nagashi cult is another reason for the royal war drums to sound.\n\nThe coming age offers restoration or humiliation on a world scale. Araby rises under a new sun, vampires and Nagashi powers whisper of darker resurrections, and living empires crowd lands that Nehekharan kings consider temporary trespass. If a deathless ruler can bind rival dynasties and march beyond the tomb roads, the old empire may rise again with no living subject left free to deny it."

string_start_title_eastern_undead:0 "The Eastern Undead Courts"
string_start_eastern_undead:0 "In the east, undeath often wears silk, protocol, and correct titles before it shows the fang. The Jade Blooded vampires and other eastern dead seek legitimacy inside Cathayan order, court ritual, coastal trade, and the old habits of obedience that keep officials bowing even when the throne room has gone cold. Their horror is not only slaughter, but the possibility that a dead ruler may obey every form of law while turning the law itself into a crypt.\n\nThese realms survive by patience as much as necromancy. Living lords distrust them, priests watch them, and rival courts count every breach of ceremony, yet vampiric influence can move through marriage, patronage, tribute, and quiet cults before armies ever cross a border. In the eastern seas, drowned crews and corpse-bound captains prove that undeath can also travel by sail, carrying the same hunger through ports that thought distance made them safe.\n\nThe future of the eastern dead depends on whether protocol can outlast fear. Cathay is strained by dominions, missing dragons, hungry neighbors, and the pressure of Chaos, leaving gaps that an immortal court can exploit with exquisite manners. If the living fail to decide when tolerance becomes surrender, the east may wake to find its decrees sealed in red ink and old blood.\n\n§REastern undead powers spread through influence, conversion, and careful court politics as much as conquest."

string_start_title_eastern_greenskin:0 "The Eastern Greenskins"
string_start_eastern_greenskin:0 "The Greenskins of the east are cousins to the great brawling hordes of the Badlands, but distance has given them stranger masks and sharper local grudges. Bakemono, forest goblins, mountain raiders, and hard-bitten orc clans infest haunted woods, island hills, caravan roads, and borderlands where Cathayan order, Nipponese warlords, Khureshi horrors, and Indish wealth all meet. They remain Greenskins at heart: loud, violent, prolific, and happiest when a neighbor's plan is being hit with something heavy.\n\nUnlike the more famous Badlands tribes, many eastern Greenskins survive by ambush, local superstition, and opportunism as much as open WAAAGH. They can raid a shrine one season, sell stolen goods the next, and vanish into forests or hills before imperial troops agree who was responsible. Yet every scattered mob carries the same old danger, because enough victories can turn mockery and nuisance into a rolling warband too large for any magistrate or daimyo to dismiss.\n\nThe east is rich enough to make even a small WAAAGH disastrous. Cathay's dominions are divided, Nippon's supernatural age breeds fear, Khuresh hides predators of its own, and Ind's roads glitter with loot that any warboss can understand. If one brutal voice can make the tribes listen, the eastern borderlands may learn that civilization's oldest enemy does not need the Badlands to become a catastrophe.\n\n§REastern Greenskins thrive on war and must keep their mobs fighting, looting, and winning to remain united."

string_start_title_khureshi:0 "The Coils of Khuresh"
string_start_khureshi:0 "Khuresh is a humid, haunted world of serpent courts, blood rites, hidden temples, and jungle roads that seem to move when outsiders stop watching them. Its rulers and broods wrap ceremony around predation, speaking in gifts, veils, and sacred etiquette while venom waits beneath the gesture. Snakefolk, Skaven warrens, Orcs, Beastfolk, cults, and half-seen gods all crowd the same green darkness, making order itself feel like a beautiful trap.\n\nPower in Khuresh is rarely announced plainly. Naga queens, brood chiefs, jungle priests, and ambitious monsters bargain over captives, tribute, sacred wounds, and the right to decide which rumor becomes law. Outsiders see only fragments - a jeweled embassy, a missing caravan, a shrine washed red, a courtier smiling too long - but those fragments are enough to make neighboring lands fear every road through the trees.\n\nThe future presses in from every side. Cathay watches from the north, Ind's temple wealth lies to the west, Nippon and elven colonies crowd the seas, and even Chaos Dwarfs and Ogres may learn to covet the routes beyond the River Ruin. If Khuresh unites its broods and rites, the jungle will not merely defend itself; it will coil outward until every neighbor feels the bite."

string_start_title_di_lizardmen:0 "The Dragon Isles"
string_start_di_lizardmen:0 "The Lizardmen of the Dragon Isles are not the solemn temple servants of Lustria. Isolated among volcanic islands, gem tribute, skull racks, and hungry wings overhead, they have forgotten much of the Old Ones and turned their reverence toward dragons too proud and terrible to be made into ordinary rulers. Their scale-clans live beneath blood-priests, brood chiefs, altar courts, and the constant knowledge that tribute may be the only wall between the village and the sky.\n\nThese islands are fractured by clan rivalry and bound together by fear. Blood-gongs call warriors to step-altars, obsidian blades glitter in sacrificial smoke, and spawning lineages compete for honor beneath beasts that accept offerings but not obedience. Imported Cathayan ideas, old plaques, Dragon Cult rites, and local blood traditions all survive together uneasily, giving the isles a faith and politics as hot and unstable as their mountains.\n\nTheir position makes them impossible to ignore. The Dragon Isles sit near the mouth of the River Ruin, where Chaos Dwarf ambition, Pigbarter trade, Cathayan interest, Indish wealth, and Khureshi danger all pass close enough to cast shadows. If the clans cannot master their own terror and make strength from it, the next power to reach the eastern seas may treat the islands as prey rather than partners.\n\n§RDragon Isles realms must turn clan rivalry, sacrifice, and dragon tribute into unity before stronger neighbors arrive."

string_start_title_amazon:0 "The Amazons of Lustria"
string_start_amazon:0 "The Amazons of Lustria endure in a jungle that kills the careless and remembers more than foreign scholars can name. Their warrior societies guard sacred enclaves, old relics, temple secrets, and paths through green darkness that outsiders mistake for wilderness. Around them stand Lizardmen temple-cities, Skaven infestations, Vampire Coast raiders, Norse adventurers, Dark Elf slavers, and treasure hunters who all believe they have found an opportunity rather than a warning.\n\nAmazon realms survive through discipline, isolation, and command of terrain that punishes larger armies. Their origins are wrapped in lost ages, half-remembered contact with the Old Ones, and traditions outsiders turn into tavern stories because the truth would be harder to steal. They have no reason to trust visitors, for every expedition that arrives with maps and compliments soon wants gold, artifacts, bodies, or holy places opened by force.\n\nThe End Times threaten to make the jungle louder than ever. If Lustria's guardians move to enforce the Great Plan, if the coasts fall to undead fleets, or if foreign empires carve permanent harbors from sacred land, the Amazons may be forced from hidden defense into open war. Their future depends on whether secrecy remains a shield, or whether survival now demands that every trespasser learn fear by name."

string_start_title_indish:0 "The Kingdoms of Ind"
string_start_indish:0 "Ind is ancient, crowded, wealthy, and sacred beyond the easy understanding of western courts. Its Rajahs and Maharajahs rule immense cities, river valleys, spice roads, temple economies, pilgrim routes, and jungle courts where the Thousand Gods receive honor in countless names. Elephants, tigers, jeweled processions, monsoon roads, sacred rivers, and blood-hungry shrines all belong to the same immense civilization, making Ind both splendid and dangerous.\n\nThe land is not a single simple realm, but a world of dynasties, castes, merchant houses, holy cities, sacred animals, Tigerfolk, and regional traditions that can cooperate or clash with equal conviction. Its jungles are older than many histories claim, its cities richer than many conquerors can resist, and its gods broad enough to make even foreign powers look like possible additions to the pantheon. That openness is strength, but it also gives predators a mask to wear when they come asking for tribute, converts, or blood.\n\nInd's future will be decided by whether wealth can become unity before surrounding powers close in. Cathay looms to the northeast, Khuresh coils in the east, Ogres and vampiric horrors threaten the north, and elven colonies watch the sea lanes with old patience. If the kingdoms of Ind cannot defend their sacred abundance, the roads of pilgrimage and spice may become roads of invasion."

 # Religion start screen text
 war_string_start_religion_catholic:0 "[Root.start_religion_intro]\n\nCatholicism descends from the old western church of bishops, councils, relics, saints, and the authority of Rome. Its faithful imagine the world as a single Christian household guarded by sacraments, canon law, and public ritual. Cathedrals, monasteries, pilgrim roads, and saintly cults make the faith visible from royal courts to village shrines.\n\nIn the present age that unity is powerful but strained. Corruption, indulgence scandals, local grievances, and ambitious princes give reformers language that can turn devotion into revolt. Catholic rulers must decide whether Rome is a shield for order, a bargaining partner, or the spark that will set their own lands burning.\n\nMechanically, Catholic countries use §YPapal Influence§! to seek Curia control and papal favors, while wider church corruption can eventually fuel Reformation pressure."
 war_string_start_religion_anglican:0 "[Root.start_religion_intro]\n\nAnglicanism grows from the decision to bind church and crown into one national settlement. Its origins are political as much as theological, shaped by royal authority, parliament, bishops, and the demand that worship serve the realm. The faith keeps much of the old church's ritual dignity while insisting that foreign authority must bend before the sovereign.\n\nAt game start Anglican realms are still defining what this compromise means. Courtiers, clergy, merchants, and common congregations all want a church that protects their interests without reopening the wounds of religious conflict. The result is a state faith that can be flexible, proud, and brittle when crown policy changes faster than conviction.\n\nMechanically, Anglican countries use §YChurch Power§! on Anglican actions and aspects, turning faith into flexible state policy."
 war_string_start_religion_hussite:0 "[Root.start_religion_intro]\n\nHussite belief begins with reformist preaching, communion for the laity, and the memory of Jan Hus as a martyr against corrupt authority. It grew in Bohemia among towns, nobles, scholars, and armed congregations that would not let distant prelates define obedience for them. Its flavor is communal, scriptural, stubborn, and willing to defend doctrine with wagons, sermons, and steel.\n\nIn the current age Hussite communities remain suspicious of princes who promise tolerance only while weak. Their neighbors often treat them as heretics, yet their local discipline can make them harder to uproot than larger churches expect. A Hussite ruler inherits a faith that wants reform, survival, and public proof that conviction can outlast imperial pressure.\n\nMechanically, Hussite countries use §YChurch Power§! for aspects that shape the state church toward military, civic, or religious priorities."
 war_string_start_religion_protestant:0 "[Root.start_religion_intro]\n\nProtestantism begins as a challenge to the universal authority of the old western church. Scripture, preaching, printed argument, and princely protection turn local reform into a movement that can reshape whole realms. Its flavor is sharp, argumentative, disciplined, and convinced that true worship must be rescued from corruption.\n\nIn the present age Protestant rulers face both opportunity and danger. A reformed state church can organize schools, morals, and administration around the ruler's chosen settlement. Yet every break with Rome creates new enemies, and every new doctrine raises the question of who is allowed to finish the work of reform.\n\nMechanically, Protestant countries accumulate §YChurch Power§! and spend it on up to three §YAspects of Faith§!."
 war_string_start_religion_reformed:0 "[Root.start_religion_intro]\n\nReformed faiths emerge from the harder edge of the Reformation, where sermons, elders, doctrine, and congregational discipline define public life. Their churches are austere, literate, and suspicious of ceremony that cannot justify itself before scripture. The faith prizes visible godliness, disciplined communities, and rulers who treat moral order as a duty of government.\n\nAt game start Reformed realms are rarely comfortable. They often live among stronger neighbors, commercial cities, or divided provinces where zeal must be organized carefully. Their strength comes from focus, because trade, war, and stability can all become expressions of a society trained to act with one hard purpose.\n\nMechanically, Reformed countries use §YFervor§! to focus national effort on war, trade, or stability."
 war_string_start_religion_orthodox:0 "[Root.start_religion_intro]\n\nOrthodoxy descends from the ancient eastern churches of patriarchs, councils, icons, fasting seasons, and imperial memory. It carries a liturgy older than many kingdoms and treats holy images as windows into a sacred order that endures beyond conquest. Its flavor is communal, ceremonial, patient, and deeply tied to the survival of peoples under pressure.\n\nIn the current age Orthodox realms often stand between great powers, rival churches, and old imperial ghosts. Patriarchs and monasteries can bind communities together when armies fail, but they can also resist rulers who treat faith as a simple tool. A ruler of this tradition inherits reverence, endurance, and the burden of defending a holy continuity that enemies have tried to break for centuries.\n\nMechanically, Orthodox countries build §YPatriarch Authority§! and can use icons when the relevant DLC mechanics are active."
 war_string_start_religion_coptic:0 "[Root.start_religion_intro]\n\nCoptic Christianity is one of the oldest living Christian traditions, rooted in desert churches, monastic learning, ancient liturgy, and communities that remember apostolic origins. Its saints, hermits, and patriarchs carry a history of endurance through conquest, isolation, and long minority rule. The faith's flavor is austere, stubborn, scholarly, and tied to holy places scattered through lands now held by stronger powers.\n\nAt game start Coptic rulers and communities measure hope in survival and restoration. They may be surrounded by rivals, but every recovered shrine or holy city makes the past feel less like a tomb. Their current state is precarious, yet their religious memory gives even small victories the weight of divine vindication.\n\nMechanically, Coptic countries draw strength from §YHoly Sites§! and unlock §YBlessings§! as sacred places return to the faith."
 war_string_start_religion_sunni:0 "[Root.start_religion_intro]\n\nSunni Islam represents the broad legal and scholarly mainstream of the Islamic world. Its origins lie in the early community of believers, the caliphal tradition, the schools of law, and the effort to order society according to revelation. Mosques, jurists, mystics, merchants, and rulers all claim roles in guarding a faith that spans many languages and peoples.\n\nIn the present age Sunni rulers often govern wide religious networks rather than isolated churches. Learned law can steady a state, while mystical devotion, frontier warfare, and local custom pull politics in different directions. The faith is strong because it is widespread, but that same breadth makes authority a negotiation between scholars, soldiers, merchants, and courts.\n\nMechanically, Sunni countries use §YPiety§! and, with the proper DLC, religious schools and invited scholars."
 war_string_start_religion_shiite:0 "[Root.start_religion_intro]\n\nShia Islam centers sacred legitimacy, the memory of martyrdom, and devotion to divinely guided leadership. Its origins are bound to the question of rightful succession and the grief of Karbala, giving politics a language of loyalty and holy injustice. Shrines, learned families, processions, and court patronage make the faith both intimate and dynastic.\n\nAt game start Shia realms are often defined by defiance against larger Sunni surroundings. Their rulers can turn minority identity into fierce cohesion, but they must also protect scholars, shrines, and noble claims that give the state its sacred authority. The current state of the faith is one of ambition under pressure, where zeal and law both promise survival.\n\nMechanically, Shia countries use §YPiety§! between Legalism and Mysticism, rewarding either discipline or zeal depending on policy."
 war_string_start_religion_ibadi:0 "[Root.start_religion_intro]\n\nIbadi Islam is an old and rigorous tradition that grew from early disputes over righteous leadership and communal discipline. Its communities often survived in mountains, oases, ports, and trade networks where prudence mattered as much as force. The faith's flavor is sober, legal-minded, independent, and suspicious of rulers who claim holiness without justice.\n\nIn the present age Ibadi states are frequently smaller than the powers around them. They endure by trade, learning, cohesion, and careful separation from conflicts that would swallow less disciplined communities. Their current challenge is to remain distinct without becoming isolated, using restraint as a political weapon.\n\nMechanically, Ibadi countries use §YPiety§! and religious schools while leaning into commerce and internal cohesion."
 war_string_start_religion_buddhism:0 "[Root.start_religion_intro]\n\nTheravada Buddhism preserves an older path of monastic discipline, royal patronage, merit, and careful transmission of sacred texts. Its origins point toward the teachings of the Buddha, the sangha, and kingdoms that saw righteous rule as protection of the dhamma. Monasteries, ordinations, relics, and temple land make the faith a visible part of state and village life.\n\nAt game start Theravada rulers must balance worldly ambition with the moral authority of monks and lay donors. War, taxation, and court luxury can all disturb the claim that the kingdom protects spiritual order. The faith is stable when rulers gain merit and keep restraint, but dangerous when conquest outruns the discipline that justifies rule.\n\nMechanically, Buddhist countries use §YKarma§!, gaining different bonuses or penalties when it rises, falls, or stays balanced."
 war_string_start_religion_vajrayana:0 "[Root.start_religion_intro]\n\nVajrayana Buddhism developed through esoteric teaching, tantric ritual, mountain monasteries, and fierce guardian traditions. Its origins blend monastic learning with ritual lineages that promise swift and dangerous paths toward enlightenment. The faith's flavor is scholarly, mystical, courtly, and sometimes terrifying to outsiders who see wrathful imagery before discipline.\n\nIn the present age Vajrayana rulers often sit among passes, plateaus, temple estates, and frontier peoples. Monasteries can legitimize rule, but they also hold wealth, learning, and influence that no court can ignore. A ruler must balance conquest, patronage, restraint, and ritual authority without letting any one force break the realm's sacred order.\n\nMechanically, it uses §YKarma§!, asking rulers to balance conquest, restraint, diplomacy, and religious duty."
 war_string_start_religion_mahayana:0 "[Root.start_religion_intro]\n\nMahayana Buddhism spreads through temples, merchants, scholars, pilgrims, and ideals of compassionate rule. Its origins emphasize the bodhisattva path, where wisdom and mercy bind personal salvation to the salvation of others. The faith's flavor is expansive, literary, devotional, and comfortable moving across cultures through translation and patronage.\n\nAt game start Mahayana courts must make compassion function inside real government. Rulers still command armies, levy taxes, and bargain with powerful neighbors, even while monks remind them that power should serve merit. The faith is strongest when public generosity, temple support, and disciplined policy make worldly rule look like a form of spiritual duty.\n\nMechanically, it uses §YKarma§!, rewarding a ruler who can balance righteous action with worldly ambition."
 war_string_start_religion_confucianism:0 "[Root.start_religion_intro]\n\nConfucianism begins as a tradition of moral learning, ritual order, filial duty, and government through educated virtue. It treats civilization as something maintained by correct relationships between ruler, minister, parent, child, ancestor, and subject. Its flavor is bureaucratic, literary, hierarchical, and deeply concerned with making public life legible to moral authority.\n\nIn the present age Confucian states often rule over many temples and local faiths without requiring all subjects to pray alike. The court's task is to make diversity orderly rather than chaotic, placing foreign rites and local cults within a stable hierarchy. A Confucian ruler is judged less by private zeal than by whether the realm behaves as if heaven, family, and office still align.\n\nMechanically, Confucian countries use §YHarmony§! and can harmonize with other faiths to govern religious diversity more smoothly."
 war_string_start_religion_shinto:0 "[Root.start_religion_intro]\n\nShinto honors kami in mountains, rivers, shrines, rice fields, clan memory, and household rites. Its origins are woven through Nipponese landscape and imperial myth rather than a single founder or scripture. The faith's flavor is local, ceremonial, pure, and tied to the belief that place and lineage carry sacred presence.\n\nAt game start Nippon is fractured by daimyo ambition, haunted forests, court ritual, foreign pressure, and hidden corruption. Shinto shrines can sanctify authority, but they also tie legitimacy to purity in an age full of blood and betrayal. Every ruler must decide how open the realm can become before outside influence or internal disorder offends the sacred order it claims to protect.\n\nMechanically, Shinto countries use §YIsolationism§! incidents, choosing how open or closed the realm becomes as the age changes."
 war_string_start_religion_hinduism:0 "[Root.start_religion_intro]\n\nHinduism is a vast sacred order of gods, epics, pilgrimage, caste duties, temple economies, household rituals, and royal patronage. Its origins are ancient and layered, reaching through Vedic sacrifice, local cults, philosophical schools, and the worship of great deities in countless forms. The faith's flavor is abundant, regional, learned, and capable of holding many divine stories within one sacred world.\n\nIn the present age Hindu rulers govern through temples, priests, caste obligations, merchant endowments, and the public favor of chosen gods. A court's patron deity can define how subjects imagine justice, prosperity, war, and legitimate kingship. The faith is strong because it is broad, but that breadth makes every realm a negotiation between local custom and royal ambition.\n\nMechanically, Hindu rulers choose a §YPersonal Deity§!, gaining bonuses that reflect the god favored by the court."
 war_string_start_religion_sikhism:0 "[Root.start_religion_intro]\n\nSikhism begins with the teachings of the Gurus, sung devotion, communal discipline, and a rejection of empty ritual and oppression. Its origins give it a strong sense of moral equality, shared labor, and loyalty to a living line of spiritual guidance. The faith's flavor is devotional, martial, communal, and increasingly prepared to defend itself when persuasion meets violence.\n\nAt game start Sikh communities are still becoming a political force as well as a religious one. They gather around congregations, leaders, and memories of hardship that can turn scattered believers into a disciplined brotherhood. A Sikh ruler must protect the community's freedom without letting necessary arms devour the spirit that made the faith worth defending.\n\nMechanically, Sikh countries draw strength from §YGurus§! and strong military bonuses as the faith develops."
 war_string_start_religion_animism:0 "[Root.start_religion_intro]\n\nAnimism sees spirit and intention in rivers, groves, stones, winds, hearths, ancestors, animals, and old places. Its origins are older than organized temples, rooted in the daily bargains communities make with the living land around them. The faith's flavor is intimate, local, practical, and shaped by taboos that outsiders often mistake for superstition.\n\nIn the present age Animist rulers rely on continuity with place more than universal doctrine. Their authority depends on honoring local spirits, respecting elders, and keeping peace between mortal ambition and the unseen world. Expansion can be dangerous because every new province brings new spirits, new taboos, and new chances to anger powers that do not recognize royal borders.\n\nMechanically, Animist countries rely mostly on strong base stability and tolerance rather than a separate religious interface."
 war_string_start_religion_shamanism:0 "[Root.start_religion_intro]\n\nFetishist faiths bind communities to masks, charms, ancestors, local spirits, sacred objects, and ritual specialists who bargain with powers close at hand. Their origins lie in living relationships with places, lineages, and portable sacred objects that carry authority across war, trade, and migration. The flavor is tactile, adaptive, ancestral, and quick to recognize power when it proves itself.\n\nAt game start these faiths often meet foreign gods through merchants, conquerors, slaves, and envoys. A ruler who listens well can incorporate new cults without erasing older obligations. The current state of the faith is flexible but vulnerable, because every useful patron also brings a new argument over which spirit deserves priority.\n\nMechanically, Fetishist countries can use §YCults§! to gain bonuses and unlock new spiritual patrons through contact."
 war_string_start_religion_totemism:0 "[Root.start_religion_intro]\n\nTotemism places clan patrons, honored ancestors, animal powers, and inherited names at the center of sacred life. Its origins are carried in memory rather than distant scripture, binding families to stories of chiefs, hunters, guardians, and spirits who shaped the people. The faith's flavor is genealogical, symbolic, communal, and deeply concerned with what the living owe the dead.\n\nIn the present age Totemist rulers gain authority by proving they deserve a place in that chain of memory. The dead remain near through names, dreams, rites, and the reputations of leaders whose strengths can still guide the nation. A ruler must build the future carefully, because failure does not merely lose land but stains the story descendants will inherit.\n\nMechanically, rulers can preserve deceased leaders as §YAncestors§!, creating a growing set of inherited bonuses."
 war_string_start_religion_inti:0 "[Root.start_religion_intro]\n\nInti worship joins solar kingship, mountain temples, sacred labor, ancestor veneration, and imperial authority beneath the watching sun. Its origins lie in highland sacred landscapes where ruler, lineage, and cosmic order are tied to the life-giving power of daylight. The faith's flavor is imperial, ritualized, disciplined, and built around the idea that a king must bind many communities into one sacred labor.\n\nAt game start Inti realms face the burden of turning ritual authority into political reform. Expansion can prove divine favor, but it also tests whether highlands, valleys, nobles, and temples will accept a single order. The current state of the faith is powerful but unfinished, waiting for rulers strong enough to reform it without breaking the society that feeds it.\n\nMechanically, Inti countries use §YAuthority§! to pass religious reforms, then reform the faith through contact with advanced neighbors."
 war_string_start_religion_nahuatl:0 "[Root.start_religion_intro]\n\nNahuatl faiths bind rulership to calendars, sacrifice, war captives, divine hunger, and the fear that the world survives only by payment. Their origins tell of suns destroyed and renewed, making present order feel temporary unless gods are fed and omens respected. The flavor is martial, cosmic, anxious, and spectacular, with temples turning victory into ritual necessity.\n\nIn the present age Nahuatl rulers live under the pressure of doom as much as diplomacy. War is not only expansion, but a means to seize captives, prove courage, and postpone catastrophe. The faith's current state rewards boldness, yet every reform asks whether blood, obedience, and royal power can hold together before fear consumes the realm.\n\nMechanically, Nahuatl countries manage §YDoom§!, wage wars for sacrifices, and pass reforms at great political cost."
 war_string_start_religion_mesoamerican:0 "[Root.start_religion_intro]\n\nMayan religion binds city-states, calendars, priestly astronomy, sacred kingship, maize rites, and cycles of destruction and renewal. Its origins reach through old urban centers, dynastic inscriptions, and a learned tradition that reads time itself as sacred structure. The faith's flavor is mathematical, ceremonial, political, and deeply concerned with making renewal follow the proper count.\n\nAt game start Mayan rulers inherit fractured cities and proud local orders that remember older greatness. Expansion can restore prestige, but religious reform demands sacrifice of land and certainty as well as blood. The current state of the faith is therefore tense, because every step toward renewal risks weakening the ruler who attempts it.\n\nMechanically, Mayan countries enact religious reforms by expanding, then release land as the price of renewal."
 war_string_start_religion_norse:0 "[Root.start_religion_intro]\n\nNorse paganism honors gods of war, sea, fate, storm, cunning, fertility, and heroic death. Its origins live in saga, oath, sacrifice, ancestral memory, and the hard demands of northern coasts and halls. The faith's flavor is proud, fatalistic, boastful, and convinced that fame can outlive flesh if deeds are strong enough.\n\nIn the present age Norse rulers must turn raiding culture into durable statecraft without losing the approval of warriors and gods. Feasts, sacrifices, voyages, and battles all become public tests of whether a ruler has divine favor. The faith is dangerous because it rewards bold action, yet a ruler who seeks only glory may leave nothing behind but songs and graves.\n\nMechanically, Norse rulers can choose a §YPersonal Deity§!, using divine patronage to steer conquest or statecraft."
 war_string_start_religion_tengri:0 "[Root.start_religion_intro]\n\nTengri worship follows the eternal sky, ancestral custom, steppe spirits, sacred fortune, and the political charisma of mounted peoples. Its origins belong to open horizons where clans, herds, and rulers understand heaven as both witness and judge. The faith's flavor is mobile, practical, expansive, and comfortable treating victory as proof that the sky still favors the khan.\n\nAt game start Tengri rulers often govern diverse peoples across routes where conquest and alliance are equally useful. The faith can fold another religion into its order, making tolerance a strategy of empire rather than a concession. Its current state is strong when mobility and legitimacy align, but fragile when settled subjects and steppe elites disagree over what heaven demands.\n\nMechanically, Tengri countries may adopt a §YSyncretic Faith§!, treating another religion as part of their own order."
 war_string_start_religion_dreamtime:0 "[Root.start_religion_intro]\n\nDreamtime traditions bind land, ancestry, story, sacred law, and the first shaping of the world into one living memory. Their origins are not past in the ordinary sense, because the first stories still define routes, names, ceremonies, and obligations. The flavor is place-bound, narrative, ancestral, and concerned with keeping the present aligned with a sacred pattern.\n\nIn the present age Dreamtime rulers face outsiders and neighbors who may not understand that land is law rather than property alone. Governance means protecting stories, ritual paths, and relationships that make the world intelligible. The faith's current danger is disruption, because conquest, migration, or careless reform can tear the map away from the memory that gives it meaning.\n\nMechanically, Dreamtime countries use story and cult style mechanics to shape spiritual bonuses as the realm meets other peoples."
 war_string_start_religion_zoroastrian:0 "[Root.start_religion_intro]\n\nZoroastrianism is an ancient fire faith of truth, purity, sacred kingship, and cosmic struggle against the lie. Its origins reach back to old Iranian empires, priestly fire temples, and teachings that frame moral choice as part of a universal battle. The faith's flavor is royal, luminous, disciplined, and proud of surviving while younger powers claim the world around it.\n\nAt game start Zoroastrian communities are often reduced, scattered, or ruled by others, but they remember a far greater inheritance. Restoring holy fires and sacred places can turn nostalgia into political force. The current state of the faith is fragile but potent, because every recovered shrine suggests that darkness has not yet won.\n\nMechanically, Zoroastrian countries draw strength from trade and tolerance, with §YHoly Sites§! giving the faith a restoration path."
 war_string_start_religion_lady_of_the_lake:0 "[Root.start_religion_intro]\n\nThe Grail faith of the Lady of the Lake sanctifies chivalry, knightly vows, mercy to the weak, and war against the wicked. Its origins are wrapped in Bretonnian legend, sacred visions, Grail quests, and the belief that noble conduct can draw divine favor from an unseen patroness. The faith's flavor is romantic, feudal, martial, and pious, with shining ideals standing above very muddy politics.\n\nIn the present age Bretonnia needs the Lady's dream precisely because the world below it is so compromised. Knights, peasants, damsels, dukes, and hidden monsters all live inside a hierarchy that claims holiness while struggling with dishonor and fear. The faith's current state is inspiring but vulnerable, because every corrupt lord or predatory neighbor makes the distance between vow and reality harder to ignore.\n\nMechanically, it gives strong internal tolerance and tax strength, and it supports elite knightly warfare."
 war_string_start_religion_myrmidia:0 "[Root.start_religion_intro]\n\nMyrmidia is the southern goddess of strategy, righteous war, disciplined command, and victory through clear judgment. Her cult grows from Tilean and Estalian traditions that prefer planned battle, civic honor, and professional soldiery over northern fury or feudal romance. The faith's flavor is tactical, sunlit, urbane, and convinced that a clever battle plan can be an act of devotion.\n\nAt game start Myrmidian realms often sit among ports, councils, merchant princes, and mercenary captains. Their wars are rarely pure, but the goddess teaches that discipline can make even hired steel serve a righteous design. The cult's current state is ambitious, because southern powers need a martial ideal strong enough to unite cities that usually profit from rivalry.\n\nMechanically, Myrmidian countries use §YFervor§! while leaning into tactics and diplomatic reputation."
 war_string_start_religion_ursun:0 "[Root.start_religion_intro]\n\nThe Great Orthodoxy of Ursun gathers Kislevite devotion around the bear-god, the state, and survival against Chaos. Its origins are recent compared with the oldest village rites, but it draws strength from the ancient image of Ursun as winter's protector and national father. The faith's flavor is cold, centralized, defiant, and built to turn prayer into endurance on the northern frontier.\n\nIn the present age the Orthodoxy competes with boyars, Ice Witches, hags, and older household spirits for the soul of Kislev. It promises unity against Chaos, but unity can feel like pressure when local customs are pulled into a harder state church. The faith's current state is heroic and tense, because Kislev must endure while deciding which old powers may stand beside the bear.\n\nMechanically, it uses §YPatriarch Authority§! and icon-style bonuses while improving unity and missionary strength."
 war_string_start_religion_cult_of_sigmar:0 "[Root.start_religion_intro]\n\nSigmarite worship begins with the mortal hero Sigmar Heldenhammer, founder of the Empire and divine exemplar of mankind's courage. Its temples, hammers, witch hunters, sermons, and imperial rites turn national memory into sacred duty. The faith's flavor is martial, reforming, suspicious of corruption, and certain that humanity survives by unity under righteous strength.\n\nAt game start the Empire is divided, greedy, frightened, and still expected to be the Old World's central bastion. Sigmar's priests call for courage against Chaos, vampires, mutants, and internal weakness, but every Elector Count hears that call through local ambition. The cult's current state is powerful but tested, because it must make imperial unity real before darkness proves the sermons hollow.\n\nMechanically, Sigmarite countries use §YChurch Power§! aspects and gain strong morale and conversion tools."
 war_string_start_religion_cult_of_ulric:0 "[Root.start_religion_intro]\n\nUlrican faith honors winter, wolves, battle, hard truth, and the old northern fury of Middenheim. Its origins reach deeper than Sigmar's empire, into tribal warrior cults that valued courage before the storm and strength before comfort. The faith's flavor is stark, proud, martial, and suspicious of softness wrapped in clever theology.\n\nIn the present age Ulricans stand inside an Empire increasingly defined by Sigmarite institutions. They remain loyal to their own god, their own holy city, and a harsher idea of virtue than southern priests often prefer. The cult's current state is defiant but precarious, because rivalry with Sigmar's church can strengthen the north or split mankind when unity is needed most.\n\nMechanically, Ulrican countries use §YFervor§! and are built for high morale and strong true-faith cohesion."
 war_string_start_religion_cult_of_taal:0 "[Root.start_religion_intro]\n\nTaalite worship venerates wild woods, beasts, storms, rivers, hunters, and the old bond between settlement and wilderness. Its origins lie in rural rites older than many cities, where survival meant respecting the forest rather than pretending to own it. The faith's flavor is earthy, storm-swept, practical, and quick to remind nobles that fields are only borrowed from nature.\n\nAt game start Taal's followers live between expanding states and wild places that still bite back. Foresters, hunters, villagers, and nobles all invoke the god, but they do not always agree whether wilderness should be honored, managed, or feared. The cult's current state is resilient, because in an age of war and corruption the land itself may become either refuge or judge.\n\nMechanically, Taalite countries use sacred celebrations and aspect-style choices, with efficient ideas and manpower recovery."
 war_string_start_religion_old_world_cults:0 "[Root.start_religion_intro]\n\nThe Imperial Pantheon keeps many Old World gods in public balance, including Sigmar, Taal, Rhya, Morr, Verena, Manann, Shallya, and others. Its origins are layered from tribal customs, civic temples, guild patronage, rural rites, and imperial compromise. The faith's flavor is plural, practical, civic, and shaped by the belief that different needs require different divine patrons.\n\nIn the present age pantheon worship lets towns, courts, armies, and villages bargain with the god who best fits the hour. This flexibility can calm a diverse realm, but it can also look weak beside sharper cults that demand exclusive loyalty. The current state of the pantheon is useful and uneasy, because every crisis tempts rulers to privilege one god and offend another.\n\nMechanically, rulers choose a §YPersonal Deity§!, trading narrow zeal for flexible patronage."
 war_string_start_religion_vampiric:0 "[Root.start_religion_intro]\n\nVampiric religion is less worship than domination, bloodline memory, immortal hierarchy, and the cold etiquette of predation. Its origins run through Nehekharan necromancy, Lahmian corruption, ancient sires, and the undead aristocracies that learned to wear mortal law as a cloak. The faith's flavor is elegant, parasitic, courtly, and terrifying because conversion can begin as a whisper rather than a battle.\n\nIn the present age vampires spread easily through fear, seduction, infection, cults, and useful corruption in living courts. Some seek thrones inside human law, while others dream of older necromantic projects and the resurrection of Nagash. The current state of the faith is patient and dangerous, because every neighbor may already contain servants who drink to their new masters in secret.\n\nMechanically, Vampiric countries use bloodline aspect mechanics, can spread their religion easily through corrupting influence, and may pursue the resurrection of Nagash alongside Nagashi powers."
 war_string_start_religion_khornate:0 "[Root.start_religion_intro]\n\nKhorne is the Blood God, lord of slaughter, martial pride, hatred of sorcery, and proof written in skulls. His worship originates wherever rage, courage, and murder become sacred offerings to the throne of brass. The faith's flavor is direct, brutal, honorable in its own monstrous way, and contemptuous of mercy as weakness.\n\nAt game start Khornate realms measure legitimacy by war, trophies, and the refusal to hide behind schemes or spells. Every battlefield is a temple, every rival cult is an insult, and every peace risks looking like cowardice before the Blood God. The current state of the faith is explosive, because the coming End Times will judge which Ruinous Power deserves to raise the Everchosen.\n\nMechanically, Khornate countries use martial aspects and gain brutal shock damage and army tradition. At the start of the End Times, the strongest Ruinous Power becomes the Everchosen, so Khorne's servants must prove their god supreme."
 war_string_start_religion_nurglite:0 "[Root.start_religion_intro]\n\nNurgle is the Plague Lord, grandfather of rot, endurance, despair, and horrible affection. His worship grows wherever suffering lasts long enough that decay begins to feel like comfort and disease like fellowship. The faith's flavor is generous, disgusting, patient, and strangely joyful in the face of ruin.\n\nAt game start Nurglite realms turn weakness, sickness, and attrition into claims of divine favor. Their enemies see filth and collapse, but the faithful see a family that will never abandon them to sterile hope. The current state of the faith is spreading quietly and warmly, because the coming End Times will judge which Ruinous Power deserves to raise the Everchosen.\n\nMechanically, Nurglite countries use Chaos aspects while punishing invaders with attrition and reducing their own losses to harsh terrain. At the start of the End Times, the strongest Ruinous Power becomes the Everchosen, so Nurgle's children must make the world ripe for Grandfather."
 war_string_start_religion_tzeentchian:0 "[Root.start_religion_intro]\n\nTzeentch is the Changer of Ways, lord of sorcery, mutation, ambition, prophecy, and schemes within schemes. His worship originates in the refusal to accept fate as fixed, turning every secret and betrayal into a possible ladder toward transformation. The faith's flavor is brilliant, unstable, magical, and convinced that truth is only useful until a better lie appears.\n\nAt game start Tzeentchian realms are full of cults, scholars, mutants, prophets, and ministers who may be serving ten plans at once. They can innovate faster than their enemies, but every gain risks becoming part of a design no mortal fully understands. The current state of the faith is ambitious and treacherous, because the coming End Times will judge which Ruinous Power deserves to raise the Everchosen.\n\nMechanically, Tzeentchian countries use Chaos aspects and gain cheaper ideas and technology. At the start of the End Times, the strongest Ruinous Power becomes the Everchosen, so Tzeentch's servants race to make the final pattern their own."
 war_string_start_religion_slaaneshi:0 "[Root.start_religion_intro]\n\nSlaanesh is the Dark Prince of excess, perfection, sensation, beauty, speed, and cruelty refined into art. This worship begins wherever desire becomes doctrine and restraint is treated as a prison built by lesser souls. The faith's flavor is exquisite, predatory, seductive, and always searching for a sharper feeling than the last.\n\nAt game start Slaaneshi realms can look cultured, swift, graceful, and horrifying in the same breath. Courts, armies, artists, and cultists all compete to turn indulgence into proof of divine favor. The current state of the faith is dangerously attractive, because the coming End Times will judge which Ruinous Power deserves to raise the Everchosen.\n\nMechanically, Slaaneshi countries use Chaos aspects and favor rapid armies with strong manpower recovery. At the start of the End Times, the strongest Ruinous Power becomes the Everchosen, so Slaanesh's devotees must outshine every rival in damnation."
 war_string_start_religion_norscan:0 "[Root.start_religion_intro]\n\nThe Norscan Gods are the Ruinous Powers seen through storm, saga, raid, monster, and oath. Their worship grows from harsh northern coasts where survival, plunder, and divine favor are nearly the same thing. The faith's flavor is boastful, sea-borne, savage, and full of chieftains trying to carve their names into the fear of softer lands.\n\nAt game start Norscan tribes raid the Empire, Kislev, Bretonnia, and farther shores to prove worth before the dark gods. A chieftain who gathers trophies, slaves, monsters, and victories may become more than a local terror. The current state of the faith is a contest for glory, because the coming End Times will judge which Ruinous Power deserves to raise the Everchosen.\n\nMechanically, Norscan rulers choose a §YPersonal Deity§!, field large forces, and can perform slave raids. At the start of the End Times, the strongest Ruinous Power becomes the Everchosen, so Norsca's gods turn every champion into a contender."
 war_string_start_religion_chaos_undivided:0 "[Root.start_religion_intro]\n\nChaos Undivided honors the Ruinous Powers together rather than kneeling fully to any single god. Its origins lie in champions, warbands, and cults that believe the whole storm can be wielded without being torn apart by its winds. The faith's flavor is apocalyptic, flexible, dangerous, and built around unity through corruption.\n\nAt game start Undivided realms court all four powers while trying to keep their rival hungers pointed outward. They can gather many kinds of cultist and warrior, but divine jealousy never disappears simply because a mortal preaches balance. The current state of the faith is a gamble for total favor, because the coming End Times will judge which Ruinous Power deserves to raise the Everchosen.\n\nMechanically, it uses Chaos aspects and steady Church Power, making it flexible for many kinds of corrupted state. At the start of the End Times, the strongest Ruinous Power becomes the Everchosen, and Undivided realms are built to court that final convergence."
 war_string_start_religion_hashut:0 "[Root.start_religion_intro]\n\nHashut is the Father of Darkness, the bull-god of fire, tyranny, industry, and chains. His worship was forged among the Dawi-Zharr, who survived abandonment and horror by accepting a god of furnaces, slavery, and ruthless order. The faith's flavor is infernal, industrial, authoritarian, and cruelly practical.\n\nAt game start Hashut's followers build ziggurats, engines, slave markets, and war machines around the certainty that domination is sacred. They do not seek the Everchosen's path, because their devotion turns inward toward fire, production, and bondage rather than the rival pageantry of the four great gods. The current state of the faith is disciplined and expanding, with every mine, chain, and cannon made into another sermon of smoke.\n\nMechanically, Hashut countries use §YHarmony§! style management while gaining production and discipline. Hashut stands apart from the Everchosen contest, turning devotion inward toward industry, bondage, and dominion."
 war_string_start_religion_ouroboros:0 "[Root.start_religion_intro]\n\nThe Ouroboros was crafted by the Old Ones to make Chaos devour itself. Its origins are artificial, ritualized, and terrible, built around the serpent cycle of hunger, rebellion, sacrifice, and self-consumption. The faith's flavor is predatory, cyclical, blood-lit, and haunted by the suspicion that its holiest truths were designed as a trap.\n\nAt game start Ouroboros followers inherit that weaponized cycle but increasingly seek escape from it. They turn Chaos inward, consume disorder, and try to rethink the serpent before the serpent consumes them. The current state of the faith is unreformed and unstable, powerful precisely because no one yet knows whether it can become more than the Old Ones' cruel solution.\n\nMechanically, Ouroboros is an unreformed religion using §YOmens§!, §YAuthority§!, religious reforms, and aspects to turn predation into state power."
 war_string_start_religion_gork_n_mork:0 "[Root.start_religion_intro]\n\nGork and Mork are brutal cunning and cunning brutality, the divine shove behind every WAAAGH. Their worship has no need for delicate origins, because Greenskins know the gods are real whenever fighting gets loud enough. The faith's flavor is violent, crude, joyful, and impossible to separate from the momentum of a mob looking for the next scrap.\n\nAt game start Greenskin realms treat peace as weakness and war as proof that the gods are paying attention. Shamans, bosses, mobs, and rivals all argue through noise, brawling, raids, and spectacular bad ideas. The current state of the faith is always temporary, because any successful warboss might turn scattered enthusiasm into a WAAAGH that shakes the map.\n\nMechanically, Greenskin countries use §YPiety§! style interactions while gaining morale and manpower recovery."
 war_string_start_religion_hobgoblin:0 "[Root.start_religion_intro]\n\nHobgoblin Shamanism mixes Gork, Mork, steppe spirits, evil suns, bad winds, wolf omens, and bargains made because someone stronger is watching. Its origins lie in the eastern steppes, where survival rewards cunning as much as strength. The faith's flavor is sly, mobile, suspicious, and happy to treat betrayal as wisdom if the timing is right.\n\nAt game start Hobgoblin tribes balance their own khans, wolf riders, mercenary contracts, and the shadow of Chaos Dwarf patronage. Other Greenskins despise them, masters exploit them, and rivals expect treachery because treachery has often worked. The current state of the faith is practical rather than holy, giving the tribes enough omens and excuses to survive until they can profit.\n\nMechanically, it has no separate religious panel, but strongly supports cheap, cavalry-heavy warfare."
 war_string_start_religion_great_maw:0 "[Root.start_religion_intro]\n\nThe Great Maw is hunger made holy, a crater-god born from catastrophe and fear. Ogre memory says the Maw changed their people forever, teaching them to feed, conquer, demand tribute, and measure the world by appetite. The faith's flavor is blunt, greedy, bodily, and darkly comic until one remembers that the meal is usually someone else.\n\nAt game start Maw worship holds Ogre tribes together more reliably than law or philosophy ever could. Butchers, tyrants, caravan raiders, and mercenary bands all translate sacred hunger into politics and protection money. The current state of the faith is strong because it asks little subtlety, only that the Ogres keep eating and make the world pay for being edible.\n\nMechanically, Maw worship allows a §YSecondary Religion§! and gives enormous morale and internal control."
 war_string_start_religion_asrai_cadai:0 "[Root.start_religion_intro]\n\nThe Asrai Pantheon binds elven gods, forest spirits, seasonal courts, and the dangerous life of Athel Loren. It grows from the same greater elven pantheon as Cadai and Cytharai worship, but turns devotion toward the woodland face of divine power. The faith's flavor is beautiful, vengeful, wild, and inseparable from living forests that do not forgive trespass.\n\nAt game start Asrai realms balance elven memory with forest spirit demands. They may share gods with other elves, yet their current state is shaped by isolation, territorial defense, and the politics of glades rather than white towers or black arks. Because the three elven religions honor different gods within one divine family, shifting between them is easier than converting into an alien creed.\n\nMechanically, Asrai faith uses §YChurch Power§! aspects and rewards defending home culture and hostile forests. The three elven religions can switch between one another relatively easily because they emphasize different gods within the same divine family."
 war_string_start_religion_cytharai:0 "[Root.start_religion_intro]\n\nThe Cytharai are the darker elven gods of vengeance, murder, secrets, pleasure, and divine cruelty. Their worship grows from the same elven pantheon honored by Asur and Asrai, but Druchii courts elevate the shadowed powers as truer guides to survival and rule. The faith's flavor is cold, aristocratic, sadistic, and convinced that beauty without dominance is weakness.\n\nAt game start Cytharai worship serves Naggaroth's ambitions, slave roads, cult politics, and endless grievance against Ulthuan. It is not a foreign religion to other elves, but the same divine inheritance viewed through bitterness, ambition, and knives. Because the three elven religions honor different gods within one divine family, shifting between them is easier than converting into an alien creed.\n\nMechanically, Cytharai countries use §YChurch Power§! aspects and are tuned toward morale and damage. The three elven religions can switch between one another relatively easily because they emphasize different gods within the same divine family."
 war_string_start_religion_cadai:0 "[Root.start_religion_intro]\n\nThe Cadai are the high elven gods of order, sea, craft, nobility, light, and ancient duty. Their worship descends from the same greater elven pantheon claimed by the Asrai and the Druchii, but the Asur raise its brighter gods as guardians of civilization. The faith's flavor is refined, proud, naval, scholarly, and burdened by the memory of a world the elves once shaped.\n\nAt game start Cadai worship stands amid Ulthuan's decline, Phoenix King politics, colonial anxieties, and fear that the Vortex itself may be threatened. The Asur call their gods to defend balance, but pride and factionalism make divine order difficult to imitate in politics. Because the three elven religions honor different gods within one divine family, shifting between them is easier than converting into an alien creed.\n\nMechanically, Cadai countries use §YChurch Power§! aspects while favoring trade and naval morale. The three elven religions can switch between one another relatively easily because they emphasize different gods within the same divine family."
 war_string_start_religion_ancestor_gods:0 "[Root.start_religion_intro]\n\nThe Ancestor Gods preserve Dwarfen memory, craft, grudges, clan duty, and the promise that the Karaz Ankor can endure. Their worship begins with the legendary forebears of the Dwarfs, whose deeds became sacred standards for every hold and guild. The faith's flavor is stone-hard, exacting, mournful, and obsessed with the difference between a kept oath and a recorded wrong.\n\nAt game start the Dwarfs are diminished, isolated, and surrounded by lost roads and enemies who stole what should have endured. Ancestor worship turns restoration into a religious duty rather than mere nostalgia. The current state of the faith is bitter but steady, because every forge, ledger, tomb, and grudge book insists that the old empire can still be answered.\n\nMechanically, Ancestor worship uses §YChurch Power§! aspects and strengthens stability and true-faith loyalty."
 war_string_start_religion_druidism:0 "[Root.start_religion_intro]\n\nDruidism is Albion's old faith of stone circles, mist, storms, sacrifice, Truthsayers, and warnings older than most kingdoms. Its origins are tied to Ogham Stones, primal magic, Old Ones secrets, and an island that stayed half-hidden from foreign maps for millennia. The faith's flavor is wet, wild, shrouded, and full of powers that civilized visitors dismiss until the bog answers back.\n\nAt game start Albion is being discovered by merchants, conquerors, missionaries, Fimir, Dark Emissaries, and powers that want the stones for themselves. Druidism remains unreformed, powerful in local rites but not yet shaped into a durable state religion. The current state of the faith is urgent, because survival requires turning mist, clan oath, and old magic into a realm before outsiders carve Albion apart.\n\nMechanically, Druidism is an unreformed religion using §YAuthority§!, religious reforms, and personal deity choices tied to the island's primal powers."
 war_string_start_religion_kislev_old_faith:0 "[Root.start_religion_intro]\n\nThe Kislevite Old Faiths are older than the Great Orthodoxy, rooted in hags, household spirits, forest gods, village charms, and hard rural rites. Their origins lie in snowbound communities that learned to bargain with land, hearth, and hidden powers before centralized priests arrived. The faith's flavor is rustic, wary, magical, and intimate with winter in ways official doctrine often fears.\n\nAt game start the Old Faiths survive beneath and beside Ursun's organized church. Villagers, hags, and local nobles still need the old bargains, especially where state priests feel distant from hunger, sickness, and the forest's edge. The current state of the faith is defensive but stubborn, because Kislev may need every ancient protection it can keep when Chaos comes south.\n\nMechanically, they rely on powerful stability and unrest bonuses rather than a separate religious panel."
 war_string_start_religion_dragon_cult:0 "[Root.start_religion_intro]\n\nDragon Cults rule through fear, tribute, obsidian altars, volcanic rites, gem offerings, and the hunger of living dragons. Their origins lie among semi-feral Dragon Isles Lizardmen who forgot the Old Ones and built sacred politics beneath wings that might bless or burn. The faith's flavor is blood-lit, draconic, island-fractured, and obsessed with surviving powers too proud to be governed.\n\nAt game start Dragon Cult realms are unreformed, divided among scale-clans, brood chiefs, blood-priests, altar courts, and dragon demands. Blood-gong discipline can unify the islands, but every island remembers rival tribute and every dragon remains a danger rather than a subject. The current state of the faith is volatile, because the isles must become a realm without angering the monsters that made the cult holy.\n\nMechanically, Dragon Cult is an unreformed religion using §YDispleasure§!, religious reforms, and personal deity choices to survive draconic demands."
 war_string_start_religion_the_one_faith:0 "[Root.start_religion_intro]\n\nThe One Faith is a new and powerful solar revelation founded by Anmar Fakir, the Prophet of the Sun. Its origins are recent, militant, and reformist, rejecting old desert gods, borrowed idols, and djinn as demonic deceptions beneath one burning truth. The faith's flavor is radiant, severe, universalist, and confident that public belief proves divine favor.\n\nAt game start Araby has been transformed but not made safe by revelation. Tribes, cities, scholars, corsairs, old cults, and hidden bargains still test whether the Solar Mandate can survive doubt. The current state of the faith is young and dangerous, because its next prophet may arise anywhere belief gathers strongly enough to claim the Sun's truth.\n\nMechanically, it has no separate religious panel, but rewards innovation and trade power."
 war_string_start_religion_nehekharan_pantheon:0 "[Root.start_religion_intro]\n\nThe Nehekharan Pantheon sanctifies priest-kings, mortuary rites, divine law, desert temples, and a kingship older than living empires. Its origins belong to ancient Nehekhara before Nagash's betrayal, when gods of river, sun, tomb, throne, and war ordered a civilization of monumental pride. The faith's flavor is imperious, ritualized, funerary, and certain that death does not erase rightful authority.\n\nAt game start the Tomb Kings have awakened into a world that calls them monsters while they call themselves sovereigns. Their gods still give shape to royal duty, but the land they remember is broken, occupied, and haunted by Nagash's shadow. The current state of the faith is restorationist, because every tomb legion marches to make the dead empire real again.\n\nMechanically, rulers choose a §YPersonal Deity§! and gain strong estate loyalty and true-faith tolerance."
 war_string_start_religion_nagash_worship:0 "[Root.start_religion_intro]\n\nNagashi worship venerates the Great Necromancer as master, god, and inevitable sovereign of death. Its origins lie in Nagash's crimes against Nehekhara, the black arts, the Great Necromancer's cults, and the dream of a world where all life bows to death. The faith's flavor is necromantic, imperial, cold, and absolute in a way even ordinary undead powers may fear.\n\nAt game start Nagashi priests, liches, and rulers do not merely remember Nagash, they prepare conditions for his return. Vampires and Nagashi powers can converge on the same terrible project, raising the dead and bending mortal kingdoms toward resurrection. The current state of the faith is apocalyptic, because every holy site and corpse can become another step toward Nagash restored.\n\nMechanically, Nagashi countries control §YHoly Sites§! to unlock necromantic §YBlessings§!, can convert with Vampiric powers, and may pursue the resurrection of Nagash."
 war_string_start_religion_horned_rat:0 "[Root.start_religion_intro]\n\nThe Horned Rat is the Skaven god of ruin, hunger, treachery, disease, and the promised Great Ascendancy. His worship originates in the Under-Empire, where paranoia, ambition, and survival make betrayal feel like sacred common sense. The faith's flavor is frantic, filthy, conspiratorial, and certain that the surface world is already doomed to become Skaven property.\n\nAt game start every clan swears loyalty while planning how to profit from everyone else's failure. Skavenblight's sacred politics, the Council's rivalries, plague cults, engineers, assassins, and warlords all turn faith into a weaponized bureaucracy of knives. The current state of the faith is unstable but vast, because unity would be terrifying if the Skaven could stop betraying each other long enough to use it.\n\nMechanically, Horned Rat countries use a Skavenblight-centered §YPapacy§! system while gaining conquest and attrition tools."
 war_string_start_religion_old_ones:0 "[Root.start_religion_intro]\n\nThe Old Ones are remembered through plaques, stars, spawning pools, geomantic paths, and the Great Plan guarded by the Lizardmen. Their worship originates not in ordinary devotion, but in created servants trying to obey absent masters whose design once ordered the world. The faith's flavor is astronomical, ritual, cold-blooded, and less sentimental than obedient to a cosmic command.\n\nAt game start Slann meditate, Skinks interpret signs, Saurus prepare for war, and temple-cities search fragments of instruction for what the End Times require. The Great Catastrophe shattered certainty, yet the plaques still speak with enough authority to move armies. The current state of the faith is patient but sharpening, because the Great Plan may soon demand correction by force.\n\nMechanically, Old One worship controls §YHoly Sites§! to unlock §YBlessings§! called sacred sequences."
 war_string_start_religion_enlightened_path:0 "[Root.start_religion_intro]\n\nThe Enlightened Path is a worldly discipline of order, patience, controlled prosperity, and careful rule. Its origins are quieter than most temple faiths, shaped by teachers, administrators, and rulers who believed appetite must be mastered before the realm can be mastered. The faith's flavor is measured, practical, reflective, and more interested in disciplined improvement than ecstatic revelation.\n\nAt game start Enlightened Path realms often stand amid louder religions and more dramatic claims of destiny. They survive by making production, administration, restraint, and social order feel like sacred habits rather than mere policy. The current state of the faith is modest but useful, because a world rushing toward catastrophe may need rulers who can still think slowly.\n\nMechanically, it has no separate religious panel, but favors production and stable administration."
 war_string_start_religion_yin_yang:0 "[Root.start_religion_intro]\n\nHarmony is Cathay's celestial balance of Yin and Yang, bureaucracy and omen, court ritual and cosmic order. Its origins lie in the Dragon Emperor's heavenly order, ancestral rites, geomantic balance, and a state that imagines administration as part of the universe's pattern. The faith's flavor is courtly, bureaucratic, balanced, and convinced that disorder in office echoes disorder in heaven.\n\nAt game start Cathay is grand but brittle after the disappearance of the Dragon Emperor and Moon Empress. Dominions, Dragon Siblings, ministers, merchants, temples, and border commanders all claim to preserve harmony while testing how much imbalance they can survive. The current state of the faith is strained, because every rebellion, vampire protocol, Monkey King joke, and Bastion breach asks whether balance is still real.\n\nMechanically, Harmony countries use §YKarma§!-style balance while gaining strong tax and true-faith tolerance."
 war_string_start_religion_thousand_gods:0 "[Root.start_religion_intro]\n\nThe Thousand Gods of Ind fill temple cities, sacred rivers, jungle shrines, caste rites, jeweled courts, and enormous urban worlds with competing divine demands. Their origins are ancient, layered, and open, absorbing local gods, royal patrons, sacred beasts, ancestor cults, and foreign powers into a vast pantheon. The faith's flavor is abundant, tolerant, crowded, and confident that divinity is too wide to fit one narrow name.\n\nAt game start Ind is rich, populous, sacred, and surrounded by Cathay, Khuresh, Ogres, elven colonies, vampiric threats, and blood-hungry gods. The Thousand Gods make room for heathens by treating many outside powers as another face, province, or forgotten name within the greater Pantheon. The current state of the faith is flexible but dangerous, because openness can create resilience or invite predators wearing holy masks.\n\nMechanically, the faith uses §YChurch Power§! aspects and is extremely open to heathens, with exceptional heathen tolerance supporting a broad sacred order."

 # Environment start screen text
 war_capital_continent_new_world:0 "New World"
 war_capital_continent_underempire:0 "Under-Empire"
 war_capital_continent_chaos_wastes:0 "Chaos Wastes"
 war_capital_continent_unknown:0 "Wider World"
 war_string_start_environment_title:0 "The [Root.capital_continent_title]"
 war_string_start_environment_old_world:0 "The §YOld World§! is crowded with old crowns, wounded faiths, and powers that all claim to be civilization's last wall. The §YEmpire§! rallies around Sigmar and imperial law while Elector Counts measure one another for weakness; §YBretonnia§! rides beneath the Lady's vows; §YKislev§! endures under Ursun and the Orthodoxy; and the southern city-states of §YTilea§!, §YEstalia§!, and the §YBorder Princes§! turn trade, contracts, and mercenary steel into survival.\n\nIts history is a chain of restorations that never quite finish. Dwarfs brood over lost holds and grudges from the Karaz Ankor, Wood Elves guard Athel Loren from trespass, vampires in Sylvania and Mousillon use law and lineage as weapons, and every human cult from Sigmar to Taal, Ulric, Myrmidia, and the Old World Pantheon competes to define what order should mean.\n\nThe future is pressing from every direction. Chaos gathers in the north, Greenskins and Skaven gnaw at mountain roads and cellars, the dead test the patience of living law, and rival human princes may decide that unity is less profitable than betrayal. If the Old World cannot choose a shield before the End Times, it may become a battlefield where every oath is broken at once."
 war_string_start_environment_far_east:0 "The §YFar East§! is not a quiet edge of the map, but a chain of crowded frontiers from the §YDark Lands§! to §YCathay§!, §YInd§!, §YKhuresh§!, §YNippon§!, the §YDragon Isles§!, and the Mountains of Mourn. Cathay's Yin-Yang bureaucracy, Ind's Thousand Gods, the Dragon Cults, Hashut's furnaces, the Great Maw, Hobgoblin steppe rites, and Nipponese shrines all compete along roads rich enough to tempt conquerors and monsters alike.\n\nThe great powers remember different golden ages. Cathay waits beneath a vanished Dragon Emperor while dominions and Dragon Siblings test protocol; Ind's Rajahs and Maharajahs rule temple cities older than western histories; Khuresh hides serpent courts and blood rites under jungle heat; Nippon has shattered into a supernatural age of daimyo, corruption, and castle towns; and the Chaos Dwarfs, Ogres, Hobgoblins, and Pigbarter merchants all bargain over the River Ruin and the caravan roads.\n\nThe next crisis will not respect borders. If the Great Bastion weakens, the north will pour into Cathay; if the Chaos Dwarfs reach the eastern seas, Pigbarter and the Dragon Isles become prizes; if Ind, Khuresh, and Nippon fail to master their internal divisions, outside powers will turn sacred roads and island straits into invasion routes. The Far East is wealthy enough to rule the age and crowded enough to set itself on fire."
 war_string_start_environment_southlands:0 "The §YSouthlands§! stretch from Araby's sunlit ports to Nehekhara's dead kingdoms, the Badlands, the jungles, and the southern temple-cities. The One Faith burns newly in Araby under the Prophet of the Sun, Tomb Kings keep the Nehekharan Pantheon in deathless pride, Nagashi and Vampiric powers whisper from old ruins, Greenskins brawl across the Badlands, and Lizardmen enclaves still read the plaques of the Old Ones.\n\nThe continent's past refuses to stay buried. Nehekhara was broken by Nagash and now wakes under priest-kings who consider younger empires temporary; Araby has been remade by revelation but still carries old djinn bargains and rival city loyalties; Mourkain's heirs dream of Strygos reborn; and every caravan road between desert, jungle, river, and black gulf carries merchants, pilgrims, bones, and spies.\n\nDanger here is not one storm but many. The Sun may harden Araby into crusade or crack beneath doubt, the Tomb Kings may march to restore an empire older than mankind's memory, Nagash's servants may turn restoration into apocalypse, and the Badlands can disgorge a WAAAGH at any time. Whoever masters the Southlands will inherit wealth, relics, and a dozen enemies who think the future belongs to the dead, the hungry, or the divinely chosen."
 war_string_start_environment_naggaroth:0 "§YNaggaroth§! is a cold continent of black cities, iron towers, slave roads, and vengeance made into statecraft. The Druchii worship the Cytharai, raise fleets from bleak harbors, and serve lords who treat cruelty as discipline; above them stand Malekith's claim, Morathi's influence, the great cities, the estates, and cults that smile while sharpening knives.\n\nIts history is the Sundering retold as law. The Dark Elves do not see themselves as exiles but as heirs robbed of Ulthuan, and every raid, levy, and sacrifice is measured against the day the Witch King claims the Phoenix Throne. The continent's outer lands add colder problems: monsters, raiders, northern corruption, and rivals who may serve Naggaroth today only because open rebellion would be inconvenient.\n\nThe future points across the sea. Ulthuan is divided, the Asur are proud but strained, and Naggaroth's nobles know an opportunity when hatred gives it a map. Yet Chaos presses from the wastes, slaves remember chains, Morathi's cults have agendas of their own, and victory over the High Elves may still leave the Druchii fighting one another over who gets to rule the ashes."
 war_string_start_environment_lustria:0 "§YLustria§! belongs first to the Lizardmen, who serve the Old Ones through Slann, Skinks, Saurus, Kroxigor, spawning pools, plaques, and geomantic order. Its jungles also draw Amazons, Skaven, Vampire Coast predators, Old World treasure seekers, Norse raiders, Dark Elf slavers, and High Elf outposts such as the Citadel of Dusk, each mistaking sacred geography for opportunity.\n\nThe continent is ancient enough that most visitors do not understand what they are trespassing on. The Great Catastrophe shattered the Old Ones' design, but the temple-cities still read the stars and prepare the next correction; meanwhile ruins, gold, coastlines, and hidden roads invite outsiders who think a map can protect them from fever, jaws, or cold-blooded judgment.\n\nThe future of Lustria is a race between patience and intrusion. If the Lizardmen can reunite the sacred circuits, the Great Plan may become a war plan; if foreigners dig too deeply, plaques may be stolen, plagues may spread, and coastlines may become permanent wounds. The jungle waits, but it is not passive, and the End Times may force even the oldest guardians to move before the world breaks around them."
 war_string_start_environment_ulthuan:0 "§YUlthuan§! is the island-continent of the Asur, a ring of white towers, noble realms, waystones, shrines to the Cadai, and sea-lanes guarded by a people who still believe they were made to protect the world. The Vortex at its heart steadies reality itself, while Phoenix Kings, Everqueens, princes, mages, and admirals argue over how a declining people should spend its remaining strength.\n\nIts history is brilliant and wounded. The High Elves remember the War of Vengeance, the Sundering, the loss of colonies, and the long burden of watching lesser peoples inherit a world the Asur once shaped. In this age Finubar's outward-looking policy and Alarielle's inward cleansing pull against one another, and Phoenix King elections make ancient dignity into living politics.\n\nUlthuan's danger is that every enemy knows its value. Naggaroth wants the throne and the old grievance paid in blood, Chaos wants the Vortex ruined, younger powers want access to elven seas, and distant colonies may become lifelines or liabilities. If the Asur remain divided, the island meant to anchor the world may discover that beauty does not stop invasion."
 war_string_start_environment_underempire:0 "The §YUnder-Empire§! is the hidden world beneath the map: Skaven warrens, stolen Dwarf roads, collapsed tunnels, plague pits, machinery, slave pens, and forgotten halls. The Horned Rat's children infest its depths, while Dwarfs remember the Underway as a lost artery of the Karaz Ankor and every surface nation lives above tunnels it would rather not admit exist.\n\nIts history is sabotage written underground. Dwarfen engineering once joined holds through stone and oath, but earthquakes, war, Greenskins, and Skaven turned much of that inheritance into a war of ambushes and infestations. Skaven clans dream of world conquest through treachery, numbers, engines, and disease, while Dwarfs dream of sealing or reclaiming every road that should never have fallen.\n\nThe future may begin below before it reaches any throne room. A Skaven victory could make surface borders meaningless, spreading plague, revolt, and artillery from beneath capitals that thought themselves safe. A Dwarf restoration could choke the Under-Empire back into darkness, but failure will let the Horned Rat's servants turn every cellar, mine, and sewer into the first step of invasion."
 war_string_start_environment_chaos_wastes:0 "The §YChaos Wastes§! are not simply northern wilderness, but a wounded reality where Kurgan, Hung, Norscans, warbands, daemons, beasts, and chosen champions live beneath the attention of the Ruinous Powers. Khorne, Nurgle, Tzeentch, Slaanesh, and Chaos Undivided turn culture into competition, and every shrine, challenge stone, and ruined city asks who is strong enough to matter.\n\nIts history is a cycle of invasions, prophecies, and broken champions. Cathay's Great Bastion, Kislev's sacrifice, Naggaroth's cold vigilance, and the Old World's prayers all exist because the Wastes keep producing armies that do not want borders so much as proof. Warlords here seek glory, mutation, slaves, relics, and divine notice, because survival without favor is only a slower death.\n\nThe future is the End Times contest made flesh. The most powerful Chaos nations will compete for the gods' favor, and the mightiest may raise the Everchosen to unite ruin under one banner. If the Wastes find that champion before the world unites against them, every southern kingdom will learn that the apocalypse can march."
 war_string_start_environment_new_world:0 "The §YNew World§! is the name given to lands that do not yet fit any settled chart: strange coasts, forgotten peoples, hidden gods, old ruins, and frontiers where rumor outruns maps. Its cultures and religions may be unknown at first contact, but unknown does not mean empty, weak, or waiting politely for foreign designs.\n\nHistory here is written in fragments: broken monuments, oral warnings, unrecorded empires, sacred landscapes, and powers that older continents may dismiss until their ships start disappearing. Explorers, merchants, missionaries, pirates, and exiles will arrive carrying their own wars with them, while local rulers must decide whether strangers are tools, threats, or the first sign of a much larger disaster.\n\nThe future of the New World is dangerous because everyone will try to define it at once. Colonizers may turn harbors into chains, native powers may unify under pressure, hidden faiths may wake, and distant empires may discover that the frontier can strike back. Whoever survives first contact will shape not just a continent, but the stories other continents tell about conquest."
 war_string_start_environment_unknown:0 "This region sits outside the usual continental stories, a borderland of maps, seas, tunnels, wasteland, or unsettled memory. Its people may not command a famous stage yet, but every forgotten place has neighbors, gods, roads, and old grudges waiting to become history.\n\nThe powers around it will try to name it before they understand it. Merchants may call it a route, priests may call it a mission, raiders may call it prey, and ambitious rulers may call it the missing piece of a larger design. Those names are never harmless.\n\nThe future will belong to whoever makes the region impossible to ignore. Build allies, break rivals, choose which faiths and cultures can live together, and prepare for the moment when a larger power notices that this quiet place could decide a louder war."
