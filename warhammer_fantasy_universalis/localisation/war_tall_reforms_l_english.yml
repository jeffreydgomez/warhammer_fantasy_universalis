l_english:
 # Tall government reforms
 territorial_administration_tall_reform:0 "Localized Governance"
 territorial_administration_tall_reform_desc:0 "The strength of the realm rests on lands we can govern well. Officials devote their attention to local petitions, provincial accounts, and the steady improvement of established institutions. Distant conquests must wait while we put our own house in order."

 religion_and_state_tall_reform:0 "Holy State"
 religion_and_state_tall_reform_desc:0 "Our own realm is the sacred charge entrusted to us. Priests tend the souls already gathered beneath our banners, strengthening observance and binding the faithful to the state. The care of these communities takes precedence over bringing distant peoples under our rule."

 military_organization_tall_reform:0 "Regional Divisions"
 military_organization_tall_reform_desc:0 "Our soldiers muster beneath the banners of their home districts, serving beside those who share their customs and know their families. Such bonds stiffen their courage and make every defended settlement a personal cause. Bringing unfamiliar peoples into these regional formations is a slower and more difficult undertaking."

 administrative_personnel_tall_reform:0 "Centralized Administrators"
 administrative_personnel_tall_reform_desc:0 "Our schools and central offices train the officials who oversee every branch of government. A common discipline produces capable advisors, exposes corruption, and allows new ideas to pass readily between departments. Yet lands beyond this carefully ordered system cannot be absorbed as quickly as they can be taken."

 economic_policy_tall_reform:0 "Learn the Land"
 economic_policy_tall_reform_desc:0 "Generations of work have taught our people the character of every field, workshop, and market. We shape investment and production around that knowledge, strengthening the industries and trade of our homeland. Our arrangements fit these lands closely and travel poorly beyond their borders."

 governing_philosophy_tall_reform:0 "Citizen Priority"
 governing_philosophy_tall_reform_desc:0 "The first duty of government is to those who live beneath its protection. Safe streets, sound buildings, and settled livelihoods earn a loyalty that distant victories cannot purchase. We devote our resources to these obligations before entertaining schemes of territorial glory."

 constitutional_settlement_tall_reform:0 "Father of the Home"
 constitutional_settlement_tall_reform_desc:0 "Within the homeland, the ruler enjoys broad authority to provide for the people and coordinate the affairs of state. Measures affecting foreign lands must pass through a more demanding legislative process. Domestic policy therefore enjoys a freedom of action that the administration of conquest does not."

 separation_of_powers_tall_reform:0 "Face of the State"
 separation_of_powers_tall_reform_desc:0 "The ruler stands before the people as the familiar guardian of the realm and receives foreign envoys as its gracious host. Portraits and public ceremonies lend a single face to institutions that otherwise remain distant. The laborious business of administering conquered lands rests with those institutions, beyond the ruler's personal direction."

 internal_external_mission_tall_reform:0 "Internal Focus"
 internal_external_mission_tall_reform_desc:0 "Our mandate begins with the faithful who dwell within our borders. Their homes must be maintained, their walls defended, and their strength restored after war. Foreign undertakings receive support only when they serve these duties, leaving little appetite for the burdens of distant rule."

 education_tall_reform:0 "Education Abroad"
 education_tall_reform_desc:0 "Before assuming their full responsibilities, rulers and senior officials must study beyond our borders. They return with unfamiliar ideas, useful commercial connections, and a clearer understanding of the world around them. Familiarity with foreign societies also tempers their enthusiasm for placing those societies under our rule."

 secularization_tall_reform:0 "Religious Integration"
 secularization_tall_reform_desc:0 "Faith runs through every office, muster, and school of our state. Shared observance binds administrators and subjects into a common order, sustaining service and the exchange of knowledge among the faithful. Incorporating lands devoted to other beliefs demands concessions that this sacred order is reluctant to make."

 sacred_cause_tall_reform:0 "Religious Justification"
 sacred_cause_tall_reform_desc:0 "War is justified by the defence of our sacred way of life. The priesthood rallies the faithful to hold their walls, support their armies, and compel enemies to acknowledge the truth of our beliefs. Territorial acquisitions carry less authority than these holy obligations and are administered with correspondingly less zeal."

 cultural_integration_tall_reform:0 "One Culture"
 cultural_integration_tall_reform_desc:0 "Our inherited customs provide all the foundations a flourishing realm requires. We favour officials of our own people, cultivate their settlements, and draw strength from their shared obligations. Those unwilling to live within this order are encouraged to depart; there is little desire to multiply such difficulties through conquest."

 faith_and_world_tall_reform:0 "State on a Hill"
 faith_and_world_tall_reform_desc:0 "Let the world behold a realm worthy of admiration. Order at home, respected institutions, and prosperous commerce will carry the reputation of our faith farther than another annexed province. Our calling is to perfect this example and let foreign courts judge its achievements for themselves."

 government_transformation_tall_reform:0 "Small But Mighty"
 government_transformation_tall_reform_desc:0 "A realm need not stretch to the horizon to command respect. We preserve a settled order in which rulers know their obligations, subjects recognise their place, and soldiers defend what is already theirs. The institutions that sustain this unity are deliberately unsuited to governing an ever-expanding dominion."

 settlement_and_mobility_tall_reform:0 "War Is for Looting"
 settlement_and_mobility_tall_reform_desc:0 "Our warriors march for the wealth behind enemy walls. Bold assaults and thorough plunder fill our coffers, while the prospect of rich spoils keeps the host eager for battle. We prepare to carry treasure home, giving little thought to the officials and obligations needed to hold the lands we have ravaged."

 aristocratic_privileges_tall_reform:0 "Aristocratic Rewards"
 aristocratic_privileges_tall_reform_desc:0 "Conquered estates are awarded to noble houses in recognition of their service. The promise of land and honour brings eager riders to our banners and binds the aristocracy more closely to the state. Every acquisition must then be divided, granted, and defended through privileges that slow its incorporation into the realm."

 deliberative_assembly_tall_reform:0 "Prestigious Parliament"
 deliberative_assembly_tall_reform_desc:0 "A seat in our assembly brings honour that wealth alone cannot secure. Its deliberations draw the estates into government, reinforce the authority of shared decisions, and command respect abroad. Existing members regard new conquests cautiously, knowing that each added territory may demand a voice of its own."

 republican_virtues_tall_reform:0 "Internal Charter"
 republican_virtues_tall_reform_desc:0 "The republic's charter directs its citizens towards the improvement of their common institutions. Public service cultivates capable candidates, while each generation is charged with refining the order it inherits. Expansion remains subordinate to this continuing work within the republic."

 election_frequency_tall_reform:0 "Benevolent Servitude"
 election_frequency_tall_reform_desc:0 "The highest office is held in service to the republic. Frequent elections renew that obligation, while an established culture of duty restrains corruption and permits trusted servants to return without discrediting the constitution. Such rulers are judged by their stewardship at home, leaving the machinery of foreign conquest a lesser concern."

 executive_consolidation_tall_reform:0 "Reliance on Advisors"
 executive_consolidation_tall_reform_desc:0 "Custom requires the ruler to hear a broad circle of advisors before settling the affairs of government. Their accumulated knowledge sustains learned administration and a generous choice of policies. Incorporating conquered lands takes longer, as each proposal must pass through competing counsels and established procedures."

 electorate_tall_reform:0 "Cultural Electorate"
 electorate_tall_reform_desc:0 "The right to choose our ruler belongs to those who share our ancestral culture. Officeholders answer to this familiar community, directing development, patronage, and military obligations towards its needs. Conquered peoples remain outside the political compact and are consequently harder to incorporate."

 inherited_traditions_tall_reform:0 "Secret Traditions"
 inherited_traditions_tall_reform_desc:0 "The deepest rites of government are entrusted only to the ruling circle. Their guarded ceremonies lend splendour and authority to the state, drawing the estates into an order whose full meaning few understand. New subjects cannot easily be admitted to institutions founded on secrets they are forbidden to learn."

 legal_foundations_tall_reform:0 "Foreign Goodwill"
 legal_foundations_tall_reform_desc:0 "Our standing among neighbouring realms rests on patient embassies, dependable agreements, and careful attention to foreign grievances. We maintain the relationships needed to keep friends close and disputes manageable. Conquests must be reconciled with these commitments, making their administration a slower and more delicate affair."
